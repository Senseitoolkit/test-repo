:root{
  --bg:#F6F8F7; --panel:#FFFFFF; --soft:#EEF3F1; --line:#DCE4E0; --line-strong:#C3D0CA;
  --ink:#16201C; --muted:#5E6B66; --accent:#2F5D50; --accent-ink:#FFFFFF; --accent-soft:#E3EEE9; --focus:#3C8A72;
  --ok:#2E7D4F; --ok-soft:#E1F1E7; --warn:#C0661A; --warn-soft:#FBEBDD; --bad:#B3452B; --bad-soft:#F8E4DE;
  --passage:#FFFFFF; --shadow:0 8px 28px rgba(22,32,28,.12);
  --sans:"Carlito","Calibri","Segoe UI",system-ui,sans-serif; --serif:"Caladea","Cambria",Georgia,serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --panel:#161E1B; --soft:#1C2723; --line:#26332E; --line-strong:#34453E;
  --ink:#E4ECE8; --muted:#97A7A0; --accent:#7CC0A6; --accent-ink:#0D1412; --accent-soft:#1E302A; --focus:#9AD6BF;
  --ok:#7DCC9B; --ok-soft:#1C3125; --warn:#EBA66B; --warn-soft:#38281A; --bad:#F0907A; --bad-soft:#3A231D;
  --passage:#1A2420; --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --panel:#161E1B; --soft:#1C2723; --line:#26332E; --line-strong:#34453E;
  --ink:#E4ECE8; --muted:#97A7A0; --accent:#7CC0A6; --accent-ink:#0D1412; --accent-soft:#1E302A; --focus:#9AD6BF;
  --ok:#7DCC9B; --ok-soft:#1C3125; --warn:#EBA66B; --warn-soft:#38281A; --bad:#F0907A; --bad-soft:#3A231D;
  --passage:#1A2420; --shadow:0 8px 28px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 40px;display:flex;flex-direction:column}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button{font:inherit}
.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 18px;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn.ghost:hover{background:var(--soft)}
.btn.small{padding:6px 12px;font-size:13.5px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.icon-btn{appearance:none;width:42px;height:42px;display:grid;place-items:center;background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;cursor:pointer;color:var(--ink);padding:0}
.icon-btn svg{width:19px;height:19px}

/* header */
header.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:20px;border-bottom:2px solid var(--accent)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--serif);font-size:26px;line-height:1.15;margin:2px 0 0}
.meta{color:var(--muted);font-size:13.5px}
.hdr-right{display:flex;gap:10px;align-items:center}
.timer{display:flex;align-items:baseline;gap:8px;padding:7px 14px;border:1px solid var(--line-strong);border-radius:10px;background:var(--panel)}
.timer-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.timer-value{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.timer.low{border-color:var(--bad);background:var(--bad-soft)}
.timer.low .timer-value{color:var(--bad)}

/* start */
.start{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:18px;align-items:start}
@media (max-width:900px){.start{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px clamp(18px,4vw,36px)}
.badge{display:inline-block;font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:5px 12px;border-radius:999px;margin-bottom:12px}
.card h2{font-family:var(--serif);margin:0 0 6px;font-size:28px;line-height:1.15}
.lead{color:var(--muted);margin:0 0 20px;max-width:60ch}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:22px}
@media (max-width:700px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.step{display:flex;gap:9px;align-items:flex-start;font-size:13.5px;color:var(--muted);line-height:1.35;padding:11px 12px;background:var(--bg);border:1px solid var(--line);border-radius:10px;min-width:0}
.step .n{flex:0 0 auto;width:21px;height:21px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:11.5px;font-weight:700;display:grid;place-items:center}
.lbl{font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.levels{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin-bottom:18px}
@media (max-width:700px){.levels{grid-template-columns:repeat(3,minmax(0,1fr))}}
.lv{appearance:none;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);border-radius:10px;padding:9px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.lv b{font-family:var(--serif);font-size:17px;line-height:1.15;text-align:center}
.lv span{font-size:12px;color:var(--muted)}
.lv[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.lv[aria-pressed="true"] span{color:var(--accent-ink);opacity:.85}
.forms{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
.forms button{appearance:none;font-family:var(--serif);font-weight:700;font-size:16px;width:38px;height:38px;border-radius:8px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);cursor:pointer}
.forms button.rand{width:auto;padding:0 12px;font-family:var(--sans);font-size:13.5px}
.forms button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);min-width:0;flex:1 1 200px}
input[type=text]{font:inherit;font-size:16px;color:var(--ink);background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;padding:9px 11px;min-width:0;width:100%}
.parts-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.ptog{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:999px;padding:7px 13px 7px 10px;cursor:pointer;font-size:14px;background:var(--panel)}
.ptog input{width:17px;height:17px;accent-color:var(--accent);margin:0}
.ptog:has(input:checked){border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.ptog:has(input:focus-visible){outline:2px solid var(--focus);outline-offset:2px}
.summary{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}
.chip{font-size:13px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:4px 11px;color:var(--ink)}
.chip b{color:var(--accent)}
.start-btn{width:100%;height:58px;font-size:18px;border-radius:12px}
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,270px);gap:14px 24px;align-items:center;padding-bottom:18px;margin-bottom:18px;border-bottom:1px solid var(--line)}
@media (max-width:700px){.hero{grid-template-columns:minmax(0,1fr)}}
.hero .summary{margin:10px 0 0}.hero .hint{margin:8px 0 0;text-align:center}.hero .badge{margin-bottom:8px}
#vStart .card{padding-block:22px}#vStart .thumbs.one img{max-width:170px}
.hint{color:var(--muted);font-size:13px;margin:12px 0 0}
details.teacher{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
details.teacher summary{cursor:pointer;color:var(--muted);font-size:13.5px;font-weight:700}
details.teacher .row{margin-top:10px}
.toggle{display:flex;gap:8px;align-items:center;font-size:14px;cursor:pointer;flex:1 1 200px}
.toggle input{width:18px;height:18px;accent-color:var(--accent);flex:0 0 auto}
.setlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.setrow{flex:0 0 auto!important;align-items:flex-start!important;border:1px solid var(--line);border-radius:10px;padding:11px 13px;color:var(--ink)!important;font-size:14.5px!important}
.setrow small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px;font-weight:400}
.setrow input[type=checkbox]{margin-top:2px;width:20px;height:20px}
/* report: tabs, score-sheet sections, answers */
.split.tabbed{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:14px}
.split.tabbed .pane-text{max-height:58vh}.split.tabbed #qPane{max-width:820px}
html.fs .split.tabbed .pane-text{max-height:none}
.rt-tabs{border-bottom:2px solid var(--line)}
.rbar{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--line);margin-bottom:12px}
.rbar .ractions{padding-bottom:7px}
.rtabs{display:flex;gap:6px}
#vReport .tiles{margin-bottom:12px}#vReport .tile{padding:10px}#vReport .rcard{padding:14px 18px}#vReport .rcard h3{margin-bottom:12px}
body:has(#vReport:not([hidden])) header.top{margin-bottom:12px}body:has(#vReport:not([hidden])) .app{padding-block:16px 16px}
.rtabs button{appearance:none;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:15px;padding:9px 16px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;border-radius:8px 8px 0 0}
.rtabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);background:var(--accent-soft)}
.rtabs .cnt{display:inline-block;min-width:22px;text-align:center;background:var(--bad-soft);color:var(--bad);border-radius:999px;font-size:12px;padding:1px 7px;margin-left:5px}
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1.15fr);gap:14px;margin-bottom:10px;align-items:stretch}
@media (max-width:980px){.rgrid{grid-template-columns:minmax(0,1fr)}}
.rcard h3 .sn{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12.5px;margin-right:8px;vertical-align:1px}
.rcard .copy{font-size:12px;color:var(--muted);margin:-8px 0 10px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .nm{font-size:14.5px;font-weight:700;min-width:0}
.srow .nm small{display:block;font-weight:400;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:2px 10px;min-width:84px;text-align:center}
.sv i{font-style:normal;color:var(--muted);font-weight:400;margin:0 3px}
.sv.none{font-size:12.5px;font-weight:400;color:var(--muted);background:transparent;border-style:dashed}
.srow.total{border-top:2px solid var(--accent);border-bottom:0;margin-top:2px}
.srow.total .sv{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.srow.total .sv i{color:var(--accent-ink);opacity:.8}
.srow .pc{font-size:12px;color:var(--muted);margin-right:8px;font-variant-numeric:tabular-nums}
.srow .dt{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.srow .rt{display:flex;align-items:center}
.cats .srow{padding:5px 0}
#prios{overflow:auto;max-height:330px}
.ans-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.ans-bar button{appearance:none;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:13.5px;cursor:pointer}
.ans-bar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.ans-scroll{max-height:calc(100vh - 235px);min-height:220px;overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.ans-scroll .mtable th{position:sticky;top:0;background:var(--soft);padding:9px;z-index:1}
.ans-scroll .mtable td:first-child,.ans-scroll .mtable th:first-child{padding-left:14px}
.mk{font-weight:700;width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:13px}
.mk.y{background:var(--ok-soft);color:var(--ok)}.mk.n{background:var(--bad-soft);color:var(--bad)}
.ans-scroll p.note{padding:18px}
.resume{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-soft);border:1px solid var(--warn);border-radius:12px;padding:12px 14px;margin-bottom:18px}
.side-list{display:flex;flex-direction:column;gap:16px}
.hist{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.hist td,.hist th{text-align:left;padding:6px 4px;border-bottom:1px solid var(--line)}
.hist th{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.note{color:var(--muted);font-size:13.5px;line-height:1.5;margin:0}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px;align-items:start}
@media (max-width:980px){.stage{grid-template-columns:minmax(0,1fr)}}

.pc-list{list-style:none;margin:0;padding:0;display:grid;gap:3px;font-size:13.5px}
.pc-list b{color:var(--accent);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;margin-right:4px}
.pc-list li.off{opacity:.45;text-decoration:line-through}
.pc-meta{font-size:12.5px;color:var(--muted)}
.pc-hit{font-size:12.5px;background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:3px 8px;align-self:flex-start}
.pc-prev{margin-top:auto;padding-top:4px;color:var(--accent);font-weight:700;font-size:14px}
.pc-dl{display:flex;gap:4px;align-items:center;border-top:1px solid var(--line);padding:8px 10px;background:var(--soft);flex-wrap:wrap}
.pc-dl span{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--muted);margin-right:2px}
.pc-dl button{appearance:none;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer}
.pc-dl button:hover{border-color:var(--accent);color:var(--accent)}
.pc-dl button:disabled{opacity:.4}
#vPreview[hidden],#vFind[hidden]{display:none}
.pvbar{position:sticky;top:0;z-index:20;background:var(--panel);border:1px solid var(--line);border-radius:0 0 16px 16px;padding:12px 16px;display:grid;grid-template-columns:1fr auto auto;gap:10px 16px;align-items:center;box-shadow:0 6px 18px rgba(22,32,28,.06);margin-top:-8px}
.pv-l{display:flex;align-items:center;gap:12px;min-width:0}
.pv-t{font-family:var(--serif);font-weight:700;font-size:19px;line-height:1.1}
.pv-s{font-size:12.5px;color:var(--muted)}
.pvbar .ans-bar{margin:0}
.pv-r{display:flex;gap:8px}
.pv-forms{grid-column:1/-1;display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.pv-forms .forms{margin:0;gap:4px}
.pv-forms .forms button{width:32px;height:32px;font-size:14px}
.pv-forms .note{margin:0 0 0 auto;font-size:12px;color:var(--muted)}
.icon-btn.sm{width:32px;height:32px;font-size:20px;line-height:1}
.icon-btn:disabled{opacity:.35;cursor:not-allowed}
#sheets{display:flex;flex-direction:column;align-items:center;padding:22px 0 10px;background:var(--soft);border-radius:16px;margin-top:14px}

/* ================= Math Mock Papers · question bank =================
   Every form is built from a seed, so the same set number + level + form always gives the same paper.
   Each level follows the curriculum outline for that level: the same activities in the same order on every form,
   with new numbers, names and pictures. Each part is worth 1 mark. */
function hash(str){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return (4294967296*(2097151&h2)+(h1>>>0));}
function rng(seedStr){let a=hash(seedStr)>>>0;return ()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function R(seedStr){const r=rng(seedStr);const o={
  f:r,int:(a,b)=>a+Math.floor(r()*(b-a+1)),pick:a=>a[Math.floor(r()*a.length)],
  shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;},
  sample:(a,k)=>o.shuffle(a).slice(0,k),chance:p=>r()<p,
  distinct:(k,a,b,ok)=>{const s=new Set();let g=0;while(s.size<k&&g++<5000){const v=o.int(a,b);if(!ok||ok(v,s))s.add(v);}return [...s];}};return o;}

  [5,10,15].forEach((t,si)=>{let pool=rr.shuffle(cfg[t]);while(pool.length<counts[si])pool=pool.concat(rr.shuffle(cfg[t]));
    const said=new Set(out.map(q=>q.say));pool.slice(0,counts[si]).forEach(g=>{let q=g(rr),tries=0;while(said.has(q.say)&&tries++<20)q=g(rr);said.add(q.say);
      if(q._d){const tot=Number(q.say.match(/of (\d+)\?/)[1]);q.a=tot/q._d*q._n;}
      if(q._div){const tot=Number(q.say.match(/of (\d+)\?/)[1]);q.a=tot/q._div;}
      if(q._mean){q.a=sum(q.sheet)/q.sheet.length;}

/* ---------- state ---------- */
const S=Object.assign({level:8,seed:"2026"},store.get("math-papers-prefs",{}));
S.q="";S.view="find";S.prev=null;
const save=()=>store.set("math-papers-prefs",{level:S.level,seed:S.seed});
const LVS=Object.keys(MLEVELS).map(Number);
const fileName=(lv,tag,mode)=>`Math_${MLEVELS[lv].grade.replace(/[\s-]+/g,"")}_${tag}_${MODE_FILE[mode]}.pdf`;
async function download(papers,mode,name,btn){
  if(!window.jspdf){toast("The PDF tool did not load. Check the internet connection.");return;}
  if(btn)btn.disabled=true;toast("Building the PDF…");
  try{const IMG=await rasterAll(papers,mode);await saveFile(name,mathPDF(papers,mode,IMG));}catch(err){console.error(err);toast("Could not build the PDF.");}finally{if(btn)btn.disabled=false;}
}
/* ---------- find ---------- */
function searchHits(P,q){if(!q)return [];const hits=[],has=s=>String(s||"").toLowerCase().includes(q);
  if(has(P.code))hits.push("paper code");if(has(P.grade))hits.push("level");
  const at=P.acts.filter(a=>has(a.title));if(at.length)hits.push(at.slice(0,2).map(a=>`“${a.title}”`).join(", "));
  const st=[...new Set(P.acts.flatMap(a=>a.parts.map(p=>p.s)).filter(s=>has(s)))];if(st.length)hits.push(st.join(", "));
  if(!hits.length&&P.acts.some(a=>a.parts.some(p=>has(p.p))))hits.push("words in a question");return hits;}
function card(P,hits){
  return `<article class="pcard"><button class="pc-main" type="button" data-preview="${P.level}|${P.form}" aria-label="Preview ${P.grade} Form ${P.form}">
    <div class="pc-top"><span class="pc-form">${P.form}</span><span class="pc-code">${P.code}</span></div>
    <div class="pc-grade">${P.grade} · Form ${P.form}</div>
    <ul class="pc-list">${P.mental?`<li><b>Part 1</b> Mental Maths · ${P.mental.length} questions</li><li><b>Part 2</b> ${P.acts.length} activities</li>`:`<li><b>Test</b> ${P.acts.length} activities · read aloud</li>`}</ul>
    <div class="pc-tags">${P.acts.slice(0,P.mental?4:5).map(a=>`<span>${esc(a.title)}</span>`).join("")}<span class="more">+${P.acts.length-(P.mental?4:5)} more</span></div>

}
