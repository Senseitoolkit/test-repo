<title>Sentence Completion</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: one app shell; a persistent top bar carries the two test modes as tabs,
   a status strip carries progress + timer during a test, and the work area switches
   between home / test / results. Passage tests go two-column on wide screens. */
:root {
  --paper: #f4efe6;
  --paper-2: #fbf7ef;
  --card: #fffdf8;
  --ink: #1d2433;
  --ink-2: #4a5160;
  --ink-3: #8a8f9a;
  --line: rgba(29,36,51,.14);
  --line-soft: rgba(29,36,51,.08);
  --accent: #c8553d;
  --accent-soft: rgba(200,85,61,.12);
  --good: #2e5e4e;
  --good-soft: rgba(46,94,78,.12);
  --bar-bg: #1d2433;
  --bar-fg: #f4efe6;
  --shadow: 0 24px 60px -30px rgba(29,36,51,.35);
  --display: 'Fraunces', Georgia, 'Times New Roman', serif;
  --body: 'Newsreader', Georgia, 'Times New Roman', serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #15181f; --paper-2: #1a1e27; --card: #1f2430;
    --ink: #ece7dc; --ink-2: #b8b3a8; --ink-3: #7f7b73;
    --line: rgba(236,231,220,.16); --line-soft: rgba(236,231,220,.08);
    --accent: #e3806a; --accent-soft: rgba(227,128,106,.16);
    --good: #6fb597; --good-soft: rgba(111,181,151,.16);
    --bar-bg: #0f1116; --bar-fg: #ece7dc;
    --shadow: 0 24px 60px -30px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #15181f; --paper-2: #1a1e27; --card: #1f2430;
  --ink: #ece7dc; --ink-2: #b8b3a8; --ink-3: #7f7b73;
  --line: rgba(236,231,220,.16); --line-soft: rgba(236,231,220,.08);
  --accent: #e3806a; --accent-soft: rgba(227,128,106,.16);
  --good: #6fb597; --good-soft: rgba(111,181,151,.16);
  --bar-bg: #0f1116; --bar-fg: #ece7dc;
  --shadow: 0 24px 60px -30px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: radial-gradient(circle at 20% 0%, var(--paper-2), var(--paper) 60%);
  color: var(--ink);
  font-family: var(--body);
  font-size: 17px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bar-bg); }
button { font-family: inherit; font-size: inherit; color: inherit; cursor: pointer; background: none; border: 0; padding: 0; }
button:disabled { opacity: .4; cursor: default; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
p { margin: 0; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font-family: var(--display); font-size: 11px; letter-spacing: .18em; text-transform: uppercase; font-weight: 600; color: var(--accent); }

/* ---------- Top bar ---------- */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bar-bg); color: var(--bar-fg);
}
.topbar-in {
  max-width: 1120px; margin: 0 auto;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
}
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand button { font-family: var(--display); font-size: 19px; font-weight: 600; letter-spacing: -.01em; color: var(--bar-fg); }
.brand .year-pill { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--bar-fg); opacity: .65; }
.tabs { display: flex; gap: 2px; background: rgba(255,255,255,.08); padding: 3px; border-radius: 10px; margin-left: auto; }
.tab { padding: 7px 14px; border-radius: 8px; font-family: var(--display); font-size: 14px; color: var(--bar-fg); opacity: .7; }
.tab:hover { opacity: 1; }
.tab[aria-selected="true"] { background: var(--bar-fg); color: var(--bar-bg); opacity: 1; }
.tab.link { text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
.tab.link svg { width: 11px; height: 11px; opacity: .8; }
.other { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; border: 1.5px dashed var(--line); border-radius: 16px; padding: 18px 22px; margin-top: 16px; color: var(--ink-2); font-size: 15px; }
.other .t { font-family: var(--display); font-weight: 600; color: var(--ink); font-size: 18px; }
.other a.btn { margin-left: auto; text-decoration: none; }
.notice a.btn { text-decoration: none; }
.tab .cnt { font-size: 11px; opacity: .7; margin-left: 6px; }

/* status strip during a test */
.status {
  background: var(--card); border-bottom: 1px solid var(--line);
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 52px); z-index: 4;
}
.status-in {
  max-width: 1120px; margin: 0 auto;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: 1fr auto; gap: 6px 18px; align-items: center;
}
.status .meta { font-size: 13px; color: var(--ink-2); display: flex; gap: 14px; flex-wrap: wrap; }
.status .meta strong { color: var(--ink); font-weight: 500; }
.timer { display: flex; align-items: baseline; gap: 8px; font-family: var(--display); }
.timer .lbl { font-size: 10px; letter-spacing: .18em; color: var(--ink-3); }
.timer .val { font-size: 22px; font-weight: 600; min-width: 3.2ch; text-align: right; }
.timer.low .val { color: var(--accent); }
.track { grid-column: 1 / -1; height: 4px; background: var(--line-soft); border-radius: 99px; overflow: hidden; }
.track > div { height: 100%; background: var(--good); border-radius: 99px; transition: width .3s ease; }

/* ---------- Work area ---------- */
.work {
  max-width: var(--w, 760px); margin: 0 auto;
  padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.sheet { background: var(--card); border: 1px solid var(--line); border-radius: 18px; box-shadow: var(--shadow); padding: 28px; }
@media (max-width: 560px) { .sheet { padding: 20px 16px; } }

/* confirm strip (leave test / finish with gaps) */
.notice {
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  background: var(--accent-soft); border: 1px solid var(--accent); color: var(--ink);
  border-radius: 12px; padding: 12px 16px; margin-bottom: 18px; font-size: 15px;
}
.notice .spacer { flex: 1; }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: 8px; border-radius: 12px; padding: 12px 20px; font-family: var(--display); font-size: 16px; font-weight: 500; border: 1.5px solid transparent; transition: transform .12s ease, background .15s ease; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn-primary { background: var(--ink); color: var(--card); }
.btn-accent { background: var(--accent); color: #fff; }
.btn-ghost { border-color: var(--line); color: var(--ink); }
.btn-ghost:hover:not(:disabled) { background: var(--line-soft); }
.btn-sm { padding: 8px 14px; font-size: 14px; border-radius: 10px; }
.btn-link { font-family: var(--display); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; color: var(--ink-2); }
.btn-link:hover { color: var(--ink); }

/* ---------- Home ---------- */
.home-head { margin-bottom: 26px; }
.home-head h1 { font-size: clamp(30px, 5vw, 40px); margin-top: 4px; }
.home-head p { color: var(--ink-2); max-width: 60ch; margin-top: 8px; font-size: 18px; }
.year-row { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 10px 0 26px; }
.year { border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 0 9px; font-family: var(--display); font-size: 22px; font-weight: 600; display: flex; flex-direction: column; align-items: center; line-height: 1; transition: all .15s ease; }
.year small { font-family: var(--body); font-size: 10px; font-weight: 400; margin-top: 6px; opacity: .6; letter-spacing: .04em; }
.year[aria-pressed="true"] { background: var(--good); border-color: var(--good); color: #fff; transform: translateY(-2px); }
.year[aria-pressed="true"] small { opacity: .85; }
.modes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
@media (max-width: 640px) { .modes { grid-template-columns: 1fr; } }
.mode { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow); min-width: 0; }
.mode h2 { font-size: 24px; }
.mode p { color: var(--ink-2); font-size: 15px; }
.mode .facts { display: grid; grid-template-columns: repeat(3, auto); gap: 4px 16px; font-size: 12px; color: var(--ink-3); letter-spacing: .06em; text-transform: uppercase; font-family: var(--display); margin-top: 2px; }
.mode .facts b { display: block; font-family: var(--body); font-size: 17px; color: var(--ink); text-transform: none; letter-spacing: 0; font-weight: 500; }
.mode .sample { background: var(--paper); border-radius: 10px; padding: 12px 14px; font-size: 15px; color: var(--ink-2); line-height: 1.55; }
.mode .sample .blank { display: inline-block; width: 52px; border-bottom: 2px solid var(--accent); height: 2px; vertical-align: middle; margin: 0 3px; }
.mode .btn { margin-top: auto; align-self: flex-start; }
.history { margin-top: 28px; }
.history h3 { font-size: 15px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; margin-bottom: 10px; }
.history table { width: 100%; border-collapse: collapse; font-size: 15px; }
.history td, .history th { padding: 8px 6px; border-bottom: 1px solid var(--line-soft); text-align: left; }
.history th { font-family: var(--display); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
.history td.r { text-align: right; }
.history .pct { font-family: var(--display); font-weight: 600; color: var(--good); }
.history .empty { color: var(--ink-3); font-size: 15px; }

/* ---------- Question navigator ---------- */
.qnav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; }
.qdot { width: 34px; height: 34px; border-radius: 9px; border: 1.5px solid var(--line); font-family: var(--display); font-size: 13px; font-weight: 600; color: var(--ink-2); display: grid; place-items: center; transition: all .12s ease; }
.qdot[data-done="1"] { background: var(--good-soft); border-color: var(--good); color: var(--good); }
.qdot[aria-current="true"] { background: var(--ink); border-color: var(--ink); color: var(--card); }
.qnav-key { font-size: 12px; color: var(--ink-3); margin: -8px 0 16px; display: flex; gap: 14px; flex-wrap: wrap; }
.qnav-key i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 5px; border: 1.5px solid var(--line); }
.qnav-key i.d { background: var(--good-soft); border-color: var(--good); }
.qnav-key i.c { background: var(--ink); border-color: var(--ink); }

/* ---------- Sentence test ---------- */
.qcard { background: var(--paper); border: 1px solid var(--line-soft); border-radius: var(--radius); padding: 26px 24px; margin-bottom: 20px; }
.qcard .qn { font-family: var(--display); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
.sentence { font-size: clamp(21px, 3.2vw, 25px); line-height: 1.6; }
.blank { display: inline-block; min-width: 76px; border-bottom: 3px solid var(--accent); margin: 0 4px; vertical-align: baseline; height: 1em; text-align: center; color: var(--good); font-style: italic; font-weight: 500; padding: 0 6px; }
.blank.filled { border-bottom-style: dotted; border-bottom-width: 2px; border-color: var(--good); }
.opts { display: grid; gap: 9px; margin-bottom: 22px; }
.opt { display: grid; grid-template-columns: 30px 1fr; align-items: center; gap: 12px; text-align: left; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 13px 16px; font-size: 18px; transition: all .12s ease; }
.opt:hover { border-color: var(--ink-3); }
.opt .k { font-family: var(--display); font-size: 12px; font-weight: 600; color: var(--ink-3); border: 1px solid var(--line); border-radius: 6px; width: 24px; height: 24px; display: grid; place-items: center; }
.opt[aria-checked="true"] { border-color: var(--good); background: var(--good-soft); box-shadow: inset 0 0 0 1px var(--good); }
.opt[aria-checked="true"] .k { background: var(--good); color: #fff; border-color: var(--good); }
.navrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.navrow .mid { font-size: 13px; color: var(--ink-3); }
.hint { font-size: 13px; color: var(--ink-3); margin-top: 14px; }
.hint kbd { font-family: var(--display); font-size: 11px; border: 1px solid var(--line); border-radius: 5px; padding: 1px 6px; }

/* ---------- Passage test ---------- */
.ptabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
.ptab { border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 14px; font-family: var(--display); font-size: 14px; display: flex; gap: 10px; align-items: baseline; }
.ptab .c { font-size: 12px; color: var(--ink-3); }
.ptab[aria-selected="true"] { background: var(--ink); color: var(--card); border-color: var(--ink); }
.ptab[aria-selected="true"] .c { color: var(--card); opacity: .7; }
.ptab[data-done="1"]:not([aria-selected="true"]) { border-color: var(--good); color: var(--good); }
.twocol { display: grid; grid-template-columns: 1fr; gap: 22px; margin-bottom: 24px; }
@media (min-width: 900px) {
  .twocol { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 28px; align-items: start; }
  .twocol > .left { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 52px + 64px + 16px); }
}
.twocol > * { min-width: 0; }
.pbanner { background: var(--ink); color: var(--card); padding: 12px 18px; border-radius: 12px 12px 0 0; }
.pbanner .eyebrow { margin-bottom: 2px; }
.pbanner h2 { font-size: 21px; }
.pbody { background: var(--paper); border: 1px solid var(--line-soft); border-top: 0; border-radius: 0 0 12px 12px; padding: 20px 22px; }
.pbody p { font-size: 17.5px; line-height: 1.75; }
.pbody p + p { margin-top: 14px; }
.gap { display: inline-flex; align-items: baseline; gap: 4px; margin: 0 2px; white-space: nowrap; border-radius: 6px; padding: 0 3px; cursor: pointer; }
.gap:hover, .gap.hot { background: var(--accent-soft); }
.gap .n { font-family: var(--display); font-size: 13px; color: var(--accent); font-weight: 600; }
.gap .w { color: var(--good); font-weight: 500; font-style: italic; border-bottom: 1.5px dotted var(--good); }
.gap .e { display: inline-block; width: 64px; height: 2px; border-bottom: 2.5px solid var(--accent); vertical-align: middle; transform: translateY(-3px); }
.choose-head { font-family: var(--display); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin-bottom: 10px; }
.gaprow { display: grid; grid-template-columns: 36px 1fr; gap: 10px; align-items: center; padding: 8px 4px; border-bottom: 1px dashed var(--line); border-radius: 8px; scroll-margin-top: 150px; transition: background .25s ease; }
.gaprow.hot { background: var(--accent-soft); }
.gaprow .n { font-family: var(--display); font-size: 16px; font-weight: 600; color: var(--accent); text-align: right; padding-right: 4px; }
.gaprow .o { display: flex; flex-wrap: wrap; gap: 6px; }
.gopt { background: var(--card); border: 1.5px solid var(--line); border-radius: 9px; padding: 7px 13px; font-size: 15px; min-width: 68px; text-align: center; transition: all .12s ease; }
.gopt:hover { border-color: var(--ink-3); }
.gopt[aria-checked="true"] { border-color: var(--good); background: var(--good-soft); color: var(--good); font-weight: 500; box-shadow: inset 0 0 0 1px var(--good); }

/* ---------- Results ---------- */
.score { display: grid; grid-template-columns: auto 1fr; gap: 22px; align-items: center; margin-bottom: 24px; }
@media (max-width: 520px) { .score { grid-template-columns: 1fr; text-align: center; justify-items: center; } }
.ring { width: 130px; height: 130px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--good) var(--p, 0%), var(--line-soft) 0); }
.ring span { width: 102px; height: 102px; border-radius: 50%; background: var(--card); display: grid; place-items: center; font-family: var(--display); font-size: 36px; font-weight: 600; }
.score h2 { font-size: 26px; }
.score p { color: var(--ink-2); margin-top: 4px; }
.score .warn { color: var(--accent); font-style: italic; font-size: 15px; }
.score .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.chip { font-family: var(--display); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; border: 1px solid var(--line); border-radius: 99px; padding: 4px 10px; color: var(--ink-2); }
.review { display: flex; flex-direction: column; gap: 8px; margin-bottom: 24px; }
details.rv { background: var(--paper); border: 1px solid var(--line-soft); border-radius: 12px; overflow: hidden; }
details.rv summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; }
details.rv summary::-webkit-details-marker { display: none; }
details.rv summary .t { font-family: var(--display); font-weight: 500; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
details.rv summary .t small { font-size: 10px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
details.rv summary .s { font-family: var(--display); font-weight: 600; color: var(--good); white-space: nowrap; }
details.rv summary .s.bad { color: var(--accent); }
.rvgrid { border-top: 1px solid var(--line-soft); background: var(--card); padding: 8px 16px 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; font-size: 15px; }
@media (max-width: 560px) { .rvgrid { grid-template-columns: 1fr; } }
.rvgrid > div { display: flex; align-items: baseline; gap: 6px; padding-top: 4px; min-width: 0; }
.rvgrid .n { font-family: var(--display); font-size: 13px; color: var(--ink-3); font-weight: 600; min-width: 26px; }
.rvgrid .ok { color: var(--good); font-weight: 500; }
.rvgrid .bad { color: var(--accent); text-decoration: line-through; }
.rvgrid .arrow { color: var(--ink-3); font-size: 12px; }
.rvlist { border-top: 1px solid var(--line-soft); background: var(--card); padding: 6px 16px 10px; }
.rvq { padding: 9px 0; border-bottom: 1px solid var(--line-soft); font-size: 15.5px; line-height: 1.5; display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
.rvq:last-child { border-bottom: 0; }
.rvq .n { font-family: var(--display); font-size: 13px; color: var(--ink-3); font-weight: 600; padding-top: 2px; }
.rvq .ok { color: var(--good); font-weight: 500; font-style: italic; }
.rvq .bad { color: var(--accent); text-decoration: line-through; }
.rvq .ans { font-size: 13px; color: var(--ink-3); margin-top: 2px; }
.rvq .ans b { font-weight: 500; color: var(--good); }

.foot { font-size: 12px; color: var(--ink-3); text-align: center; margin-top: 22px; line-height: 1.5; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>

<header class="topbar"><div class="topbar-in" id="topbar"></div></header>
<div id="status"></div>
<main class="work" id="work"></main>

<script>
(function () {
  'use strict';

  /* ---------- Data & configuration ---------- */

  function buildSentences(year) {
    return shuffle(BANK[year] || []).slice(0, ME.count).map(function (q) {
      return { id: q.id, sentence: q.sentence, answer: q.answer, options: shuffle([q.answer].concat(q.distractors)) };
    });
  }
  function buildPassages(year) {
    return shuffle(BANK[year] || []).slice(0, ME.count).map(function (p, i) {
      return { id: 'y' + year + '-p' + i + '-' + p.title.replace(/[^A-Za-z0-9]/g, ''), title: p.title, kind: p.kind, text: p.text,

  function startTest() {

  }
  function goHome() { stopTimer(); S.view = 'home'; S.test = null; S.leaving = false; S.confirmFinish = false; render(); window.scrollTo(0, 0); }

  /* ---------- Render ---------- */
  function render() { renderTopbar(); renderStatus(); renderWork(); setHash(); }

  function renderTopbar() {
    var inTest = S.view === 'test';
    $('#topbar').innerHTML =
      '<div class="brand"><button data-act="home" title="Back to start">Reading Practice</button><span class="year-pill">Year ' + S.year + '</span></div>' +
      '<div class="tabs" role="tablist">' +
        '<button class="tab" role="tab" aria-selected="true" data-act="home">' + ME.short + '</button>' +
        (inTest
          ? '<button class="tab link" data-act="leave" title="Open ' + OTHER.name + '">' + OTHER.short + EXT + '</button>'
          : '<a class="tab link" href="' + otherHref() + '" title="Open ' + OTHER.name + '">' + OTHER.short + EXT + '</a>') +
      '</div>';
  }

  function renderStatus() {
    var el = $('#status');
    if (S.view !== 'test') { el.innerHTML = ''; return; }
    var done = answeredCount(), total = totalBlanks();
    var where = MODE === 'sentences' ? 'Question ' + (S.idx + 1) + ' of ' + total : 'Passage ' + (S.idx + 1) + ' of ' + S.test.items.length;
    el.innerHTML =
      '<div class="status"><div class="status-in">' +
      '<div class="meta"><strong>' + ME.name + '</strong><span>Year ' + S.year + '</span><span>' + where + '</span><span class="num">' + done + ' / ' + total + ' answered</span></div>' +
      '<div class="timer' + (S.timeLeft <= ME.lowAt ? ' low' : '') + '"><span class="lbl">TIME</span><span class="val num" id="timerVal">' + fmt(S.timeLeft) + '</span></div>' +
      '<div class="track"><div style="width:' + (total ? done / total * 100 : 0) + '%"></div></div>' +
      '</div></div>';
  }

  function renderWork() {
    var el = $('#work');
    el.style.setProperty('--w', S.view === 'test' && MODE === 'passages' ? '1120px' : S.view === 'home' ? '820px' : '760px');
    if (S.view === 'home') el.innerHTML = viewHome();
    else if (S.view === 'test') el.innerHTML = MODE === 'sentences' ? viewSentences() : viewPassages();
    else el.innerHTML = viewResults();
  }

  function leaveNotice() {
    if (!S.leaving) return '';
    return '<div class="notice" role="alert"><span>' + OTHER.name + ' opens in its own page. Your answers here are kept until you close this one.</span><span class="spacer"></span>' +
      '<a class="btn btn-accent btn-sm" href="' + otherHref() + '" data-act="leave-go">Open ' + OTHER.short + ' ' + EXT + '</a><button class="btn btn-ghost btn-sm" data-act="leave-no">Stay</button></div>';
  }
  function finishNotice() {
    if (!S.confirmFinish) return '';
    var left = totalBlanks() - answeredCount();
    return '<div class="notice" role="alert"><span>' + left + ' blank' + (left === 1 ? '' : 's') + ' still unanswered. Finish now, or go back and fill ' + (left === 1 ? 'it' : 'them') + ' in?</span><span class="spacer"></span>' +
      '<button class="btn btn-accent btn-sm" data-act="finish-yes">Finish anyway</button><button class="btn btn-ghost btn-sm" data-act="finish-no">Go back</button></div>';
  }

  /* --- Home --- */
  function viewHome() {
    var hist = loadHist();
    var sample = MODE === 'sentences'
      ? (S.year <= 2 ? 'The cat sat on the <span class="blank"></span>.' : S.year <= 4 ? 'The river <span class="blank"></span> gently through the valley.' : 'Despite the setback, she remained <span class="blank"></span> about the outcome.')
      : (S.year <= 2 ? 'Sam has a <span class="blank"></span> hat. The hat is <span class="blank"></span>. Sam likes his hat very much…' : 'Last summer, my older brother Sam and I decided to <span class="blank"></span> a treehouse in the apple tree at the bottom of the garden…');
    return '' +
      '<div class="home-head"><div class="eyebrow">Reading practice · Years 1–6</div><h1>' + ME.name + '</h1>' +
      '<p>' + ME.blurb + ' Each test draws a fresh random set from the bank, so you can repeat it.</p></div>' +
      '<div class="eyebrow" style="color:var(--ink-3)">Year group</div>' +
      '<div class="year-row">' + YEARS.map(function (y) {
        var n = (BANK[y] || []).length;
        return '<button class="year" aria-pressed="' + (S.year === y) + '" data-act="year" data-year="' + y + '">' + y + '<small>' + n + (MODE === 'sentences' ? ' questions' : ' texts') + '</small></button>';
      }).join('') + '</div>' +
      '<section class="mode"><div class="sample">' + sample + '</div>' +
        '<div class="facts"><span>Length<b>' + ME.facts[0] + '</b></span><span>Time<b>' + ME.facts[1] + '</b></span><span>Format<b>' + ME.facts[2] + '</b></span></div>' +
        '<button class="btn btn-primary" data-act="start">Start · Year ' + S.year + ' →</button></section>' +
      '<div class="other"><div><div class="t">' + OTHER.name + '</div><div>' + OTHER.otherBlurb + '</div></div>' +
        '<a class="btn btn-ghost btn-sm" href="' + otherHref() + '">Open · Year ' + S.year + ' ' + EXT + '</a></div>' +
      '<div class="history"><h3>Recent results</h3>' + (hist.length ? historyTable(hist) : '<p class="empty">Nothing yet. Results appear here after your first test, on this device only.</p>') + '</div>' +
      '<p class="foot">' + (MODE === 'sentences' ? 'Modelled on the NGRT sentence-completion format.' : 'Modelled on cloze passage-completion tests.') + ' Vocabulary follows the UK National Curriculum for English, Years 1–6.</p>';
  }
  function historyTable(h) {
    return '<table><thead><tr><th>When</th><th>Year</th><th class="r">Score</th><th class="r">%</th></tr></thead><tbody>' +
      h.slice(0, 8).map(function (r) {
        var d = new Date(r.t), when = d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) + ' ' + d.toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
        return '<tr><td>' + when + (r.out ? ' <span style="color:var(--accent)" title="Time ran out">⏱</span>' : '') + '</td><td>' + r.year + '</td><td class="r num">' + r.c + ' / ' + r.n + '</td><td class="r pct num">' + r.p + '%</td></tr>';
      }).join('') + '</tbody></table>';
  }

  /* --- Sentence test --- */
  function viewSentences() {
    var items = S.test.items, q = items[S.idx], chosen = S.answers[q.id];
    var parts = q.sentence.split('____');
    var sent = parts.map(function (t, i) { return esc(t) + (i < parts.length - 1 ? '<span class="blank' + (chosen ? ' filled' : '') + '">' + (chosen ? esc(chosen) : '') + '</span>' : ''); }).join('');
    var keys = ['1', '2', '3', '4', '5'];
    return leaveNotice() + finishNotice() +
      '<div class="sheet">' +
      '<div class="qnav" role="navigation" aria-label="Questions">' + items.map(function (it, i) {
        return '<button class="qdot num" data-act="goto" data-i="' + i + '" data-done="' + (S.answers[it.id] ? 1 : 0) + '" aria-current="' + (i === S.idx) + '" title="Question ' + (i + 1) + '">' + (i + 1) + '</button>';
      }).join('') + '</div>' +
      '<div class="qnav-key"><span><i class="d"></i>Answered</span><span><i class="c"></i>Current</span><span><i></i>Not yet</span></div>' +
      '<div class="qcard"><div class="qn">Question ' + (S.idx + 1) + '</div><p class="sentence">' + sent + '</p></div>' +
      '<div class="opts" role="radiogroup" aria-label="Choices">' + q.options.map(function (o, i) {
        return '<button class="opt" role="radio" aria-checked="' + (chosen === o) + '" data-act="pick" data-opt="' + esc(o) + '"><span class="k">' + keys[i] + '</span><span>' + esc(o) + '</span></button>';
      }).join('') + '</div>' +
      '<div class="navrow"><button class="btn btn-ghost" data-act="prev"' + (S.idx === 0 ? ' disabled' : '') + '>← Back</button>' +
      '<span class="mid num">' + answeredCount() + ' of ' + items.length + ' answered</span>' +
      (S.idx < items.length - 1 ? '<button class="btn btn-primary" data-act="next">Next →</button>' : '<button class="btn btn-accent" data-act="finish">Finish test</button>') + '</div>' +
      '<p class="hint">Keys <kbd>1</kbd>–<kbd>5</kbd> choose an answer and move on; <kbd>←</kbd> <kbd>→</kbd> move between questions.</p>' +
      '</div>';
  }

  /* --- Passage test --- */
  function passageHtml(p) {
    return p.text.split(/\n\n+/).map(function (para) {
      var html = esc(para).replace(/&lt;b&gt;/g, '<b>').replace(/&lt;\/b&gt;/g, '</b>').replace(/\n/g, '<br>');
      html = html.replace(/@(\d+)@/g, function (_, n) {
        var w = S.answers[p.id + '-' + n];
        return '<span class="gap" data-act="jump" data-n="' + n + '" title="Blank ' + n + '"><span class="n">(' + n + ')</span>' + (w ? '<span class="w">' + esc(w) + '</span>' : '<span class="e"></span>') + '</span>';
      });
      return '<p>' + html + '</p>';
    }).join('');
  }
  function viewPassages() {
    var items = S.test.items, p = items[S.idx];
    return leaveNotice() + finishNotice() +
      '<div class="sheet">' +
      '<div class="ptabs" role="tablist">' + items.map(function (it, i) {
        var d = passageDone(it);
        return '<button class="ptab" role="tab" aria-selected="' + (i === S.idx) + '" data-done="' + (d === it.gaps.length ? 1 : 0) + '" data-act="goto" data-i="' + i + '">Passage ' + (i + 1) + ' <span class="c num">' + d + '/' + it.gaps.length + '</span></button>';
      }).join('') + '</div>' +
      '<div class="twocol"><div class="left">' +
        '<div class="pbanner"><div class="eyebrow">' + esc(p.kind) + '</div><h2>' + esc(p.title) + '</h2></div>' +
        '<div class="pbody" id="pbody">' + passageHtml(p) + '</div>' +
      '</div><div class="right">' +
        '<div class="choose-head">Choose the best word for each blank · tap a blank in the text to find it here</div>' +
        '<div id="gaps">' + p.gaps.map(function (g) {
          var key = p.id + '-' + g.n, chosen = S.answers[key];
          return '<div class="gaprow" id="gap-' + g.n + '"><div class="n">(' + g.n + ')</div><div class="o" role="radiogroup" aria-label="Blank ' + g.n + '">' +
            g.options.map(function (o) { return '<button class="gopt" role="radio" aria-checked="' + (chosen === o) + '" data-act="pickgap" data-n="' + g.n + '" data-opt="' + esc(o) + '">' + esc(o) + '</button>'; }).join('') +
            '</div></div>';
        }).join('') + '</div>' +
      '</div></div>' +
      '<div class="navrow"><button class="btn btn-ghost" data-act="prev"' + (S.idx === 0 ? ' disabled' : '') + '>← Previous passage</button>' +
      '<span class="mid num">' + answeredCount() + ' of ' + totalBlanks() + ' answered</span>' +
      (S.idx < items.length - 1 ? '<button class="btn btn-primary" data-act="next">Next passage →</button>' : '<button class="btn btn-accent" data-act="finish">Finish test</button>') + '</div>' +
      '</div>';
  }

  /* --- Results --- */
  function viewResults() {
    var r = S.result;
    var verdict = r.pct >= 90 ? 'Excellent.' : r.pct >= 70 ? 'Good work.' : r.pct >= 50 ? 'A solid start.' : 'Keep practising.';
    return '<div class="sheet">' +
      '<div class="score"><div class="ring" style="--p:' + r.pct + '%"><span class="num">' + r.pct + '%</span></div>' +
      '<div><div class="eyebrow">' + ME.name + ' · Year ' + S.year + '</div><h2>' + verdict + ' <span class="num">' + r.correct + ' of ' + r.total + '</span> correct.</h2>' +
      '<p>' + (S.timedOut ? '<span class="warn">Time ran out, so the test was submitted automatically.</span>' : 'Finished with ' + fmt(S.timeLeft) + ' to spare.') + '</p>' +
      '<div class="chips"><span class="chip">' + r.total + ' blanks</span><span class="chip">' + (r.total - r.correct) + ' to review</span></div></div></div>' +
      '<div class="eyebrow" style="margin-bottom:10px">Review · open a section to see each answer</div>' +
      '<div class="review">' + (MODE === 'sentences' ? reviewSentences() : reviewPassages()) + '</div>' +
      '<div class="navrow"><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-primary" data-act="start">Try again</button>' +
      '<a class="btn btn-ghost" href="' + otherHref() + '" style="text-decoration:none">Try ' + OTHER.short + ' ' + EXT + '</a></div>' +
      '<button class="btn-link" data-act="home">Change year</button></div>' +
      '</div>';
  }
  function reviewSentences() {
    var items = S.test.items, wrong = items.filter(function (q) { return S.answers[q.id] !== q.answer; });
    function row(q, i) {
      var a = S.answers[q.id], ok = a === q.answer;
      var filled = q.sentence.split('____').join('<span class="' + (ok ? 'ok' : 'bad') + '">' + esc(a || '—') + '</span>');
      return '<div class="rvq"><span class="n">' + (i + 1) + '</span><div>' + filled + (ok ? '' : '<div class="ans">Answer: <b>' + esc(q.answer) + '</b></div>') + '</div></div>';
    }
    var sec = function (title, list, open) {
      return '<details class="rv"' + (open ? ' open' : '') + '><summary><span class="t">' + title + '</span><span class="s num' + (list === wrong ? ' bad' : '') + '">' + list.length + '</span></summary><div class="rvlist">' +
        (list.length ? items.map(function (q, i) { return list.indexOf(q) >= 0 ? row(q, i) : ''; }).join('') : '<p class="rvq" style="color:var(--ink-3);display:block">None.</p>') + '</div></details>';
    };
    return sec('To review', wrong, wrong.length > 0) + sec('Correct', items.filter(function (q) { return wrong.indexOf(q) < 0; }), wrong.length === 0);
  }
  function reviewPassages() {
    return S.test.items.map(function (p, i) {
      var c = p.gaps.filter(function (g) { return S.answers[p.id + '-' + g.n] === g.answer; }).length;
      return '<details class="rv"' + (c < p.gaps.length ? ' open' : '') + '><summary><span class="t"><small>Passage ' + (i + 1) + ' · ' + esc(p.kind) + '</small>' + esc(p.title) + '</span><span class="s num' + (c < p.gaps.length ? ' bad' : '') + '">' + c + '/' + p.gaps.length + '</span></summary><div class="rvgrid">' +
        p.gaps.map(function (g) {
          var a = S.answers[p.id + '-' + g.n], ok = a === g.answer;
          return '<div><span class="n">(' + g.n + ')</span>' + (ok ? '<span class="ok">✓ ' + esc(a) + '</span>' : '<span><span class="bad">' + esc(a || '—') + '</span><span class="arrow"> → </span><span class="ok">' + esc(g.answer) + '</span></span>') + '</div>';
        }).join('') + '</div></details>';
    }).join('');
  }

  /* ---------- Events ---------- */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.getAttribute('data-act');
    switch (act) {
      case 'home': if (S.view === 'test') { S.leaving = false; S.confirmFinish = false; stopTimer(); S.view = 'home'; S.test = null; render(); window.scrollTo(0, 0); } else goHome(); break;
      case 'year': S.year = parseInt(b.getAttribute('data-year'), 10); try { localStorage.setItem(YEAR_KEY, S.year); } catch (x) {} render(); break;
      case 'start': startTest(); break;
      case 'goto': S.idx = parseInt(b.getAttribute('data-i'), 10); S.confirmFinish = false; render(); break;
      case 'prev': if (S.idx > 0) { S.idx--; S.confirmFinish = false; render(); } break;
      case 'next': if (S.idx < S.test.items.length - 1) { S.idx++; S.confirmFinish = false; render(); window.scrollTo(0, 0); } break;
      case 'pick': pickSentence(b.getAttribute('data-opt')); break;
      case 'pickgap': pickGap(parseInt(b.getAttribute('data-n'), 10), b.getAttribute('data-opt')); break;
      case 'jump': jumpToGap(parseInt(b.getAttribute('data-n'), 10)); break;
      case 'finish': if (answeredCount() < totalBlanks()) { S.confirmFinish = true; render(); } else finishTest(); break;
      case 'finish-yes': finishTest(); break;
      case 'finish-no': S.confirmFinish = false; render(); break;
      case 'leave': S.leaving = true; S.confirmFinish = false; render(); break;
      case 'leave-go': S.leaving = false; setTimeout(render, 0); break;   // the link itself opens the other app
      case 'leave-no': S.leaving = false; render(); break;
    }
  });

  function pickSentence(opt) {
    var q = S.test.items[S.idx]; S.answers[q.id] = opt;
    if (S.idx < S.test.items.length - 1) S.idx++;
    render();
  }
  function pickGap(n, opt) {
    var p = S.test.items[S.idx]; S.answers[p.id + '-' + n] = opt;
    $('#pbody').innerHTML = passageHtml(p);
    var row = $('#gap-' + n); if (row) row.querySelectorAll('.gopt').forEach(function (g) { g.setAttribute('aria-checked', g.getAttribute('data-opt') === opt); });
    renderStatus();
    var mid = $('.navrow .mid'); if (mid) mid.textContent = answeredCount() + ' of ' + totalBlanks() + ' answered';
    var tab = document.querySelectorAll('.ptab')[S.idx]; if (tab) { var d = passageDone(p); tab.querySelector('.c').textContent = d + '/' + p.gaps.length; tab.setAttribute('data-done', d === p.gaps.length ? 1 : 0); }
  }
  function jumpToGap(n) {
    var row = $('#gap-' + n); if (!row) return;
    row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    document.querySelectorAll('.gaprow.hot, .gap.hot').forEach(function (x) { x.classList.remove('hot'); });
    row.classList.add('hot');
    var g = $('#pbody .gap[data-n="' + n + '"]'); if (g) g.classList.add('hot');
    setTimeout(function () { row.classList.remove('hot'); if (g) g.classList.remove('hot'); }, 1400);
    var first = row.querySelector('.gopt'); if (first) first.focus({ preventScroll: true });
  }

  document.addEventListener('keydown', function (e) {
    if (S.view !== 'test' || e.metaKey || e.ctrlKey || e.altKey) return;
    var tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea') return;
    if (MODE === 'sentences' && /^[1-5]$/.test(e.key)) {
      var q = S.test.items[S.idx], o = q.options[parseInt(e.key, 10) - 1]; if (o) { e.preventDefault(); pickSentence(o); }
    } else if (e.key === 'ArrowLeft' && S.idx > 0) { S.idx--; render(); }
    else if (e.key === 'ArrowRight' && S.idx < S.test.items.length - 1) { S.idx++; render(); }
  });

  render();
})();
</script>
