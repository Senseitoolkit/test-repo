<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Math Sense Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* VOICE: a calm maths coach at the board: look, choose, then calculate.
   IDEA: a classroom chalkboard: green board, chalk lines, a wooden rail, yellow chalk for the unknown.
   PICTURE: the chalk-drawn model itself: bar, number line, array or machine.
   COLOUR and TYPE: board green, chalk white, yellow and mint chalk; Patrick Hand + Atkinson Hyperlegible. One palette in both themes.
   LAYOUT: one column: problem and picture, the current step, the action button. */
:root{color-scheme:dark;
 --bg:#1b382f;--paper:#234539;--ink:#f6f2e4;--ink2:#cfd9cd;--ink3:#93aa9c;--line:#42695a;
 --grid:rgba(255,255,255,.045);--or:#ffd166;--orSoft:#4d4a26;--ok:#8fe3c0;--okSoft:#2d5c4c;--red:#ffa193;
 --redSoft:#5b3631;--hi:#ffd166;--bar:#12261f;--wood:#9a6a3a}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 'Atkinson Hyperlegible',system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:'Patrick Hand',system-ui,sans-serif;font-weight:700;margin:0;line-height:1.08;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible{outline:3px solid var(--or);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.num{font-variant-numeric:tabular-nums}
header{background:var(--bar);color:#fff;position:sticky;top:0;z-index:5}
.hin{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;min-height:56px}
.logo{font-family:'Patrick Hand';font-size:23px;font-weight:700;display:flex;align-items:center;gap:9px;color:#fff}
.logo svg{width:28px;height:28px}
.pill{margin-left:auto;font-size:15px;background:rgba(255,255,255,.12);border-radius:99px;padding:5px 13px;white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:24px 16px 56px}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 20px 50px -34px rgba(20,30,70,.45)}
@media(max-width:560px){.sheet{padding:18px 14px}}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:10px 22px;border-radius:14px;font-family:'Patrick Hand';font-size:19px;font-weight:700}
.primary{background:var(--ink);color:var(--paper)}.go{background:var(--or);color:#fff}.ghost{border:2px solid var(--line)}
.link{color:var(--ink2);text-decoration:underline;text-underline-offset:3px;min-height:44px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
/* home */
.hero h1{font-size:clamp(34px,7vw,50px)}
.hero p{color:var(--ink2);margin-top:10px;max-width:60ch}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:22px 0}
@media(max-width:560px){.rules{grid-template-columns:minmax(0,1fr)}}
.rule{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px}
.rule b{font-family:'Patrick Hand';font-size:17px;display:block;line-height:1.2}
.pts{font-family:'Patrick Hand';font-weight:700;font-size:19px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--okSoft);color:var(--ok)}
.pts.neg{background:var(--redSoft);color:var(--red)}.pts.off{background:var(--bg);color:var(--ink3)}
.lbl{font-family:'Patrick Hand';font-size:16px;color:var(--ink2);margin:18px 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{min-height:48px;min-width:56px;padding:6px 14px;border:2px solid var(--line);border-radius:12px;font-weight:700;background:var(--paper);text-align:center}
.opts button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bestl{margin-top:10px;font-size:15px;color:var(--ink2)}
.hist{margin-top:30px}.hist h3{font-size:19px;margin-bottom:6px}
.hist table{width:100%;border-collapse:collapse;font-size:15px}
.hist td,.hist th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
.hist th{font-weight:400;color:var(--ink3);font-size:13px}.hist .r{text-align:right}
.empty{color:var(--ink3);font-size:15px}
.foot{font-size:13px;color:var(--ink3);text-align:center;margin-top:22px}
/* question */
.prog{display:flex;gap:5px;margin-bottom:14px}
.prog i{height:8px;flex:1 1 14px;max-width:44px;border-radius:9px;background:var(--line)}
.prog i.d{background:var(--ok)}.prog i.c{background:var(--hi)}
.qhead{display:flex;justify-content:space-between;gap:10px;color:var(--ink3);font-size:14px;margin-bottom:8px}
.prob{background-color:var(--paper);background-image:linear-gradient(var(--grid) 1.5px,transparent 1.5px),linear-gradient(90deg,var(--grid) 1.5px,transparent 1.5px);background-size:24px 24px;border:1.5px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px;margin-bottom:16px}
.sn{display:block;width:100%;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-size:clamp(18px,3.2vw,21px);line-height:1.4;min-height:48px}
button.sn:hover{border-color:var(--or)}
.sn.need{border-color:var(--ok);background:var(--okSoft)}
.sn.extra{border-style:dashed;color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--or);text-decoration-thickness:2px}
.sn small{display:block;font-size:13px;text-decoration:none;color:var(--ok);font-weight:700}
.sn.extra small{color:var(--or);display:inline-block;text-decoration:none;margin-left:6px}
.ask{font-weight:700;font-size:clamp(19px,3.4vw,22px);padding:4px 4px 0}
.steps{display:flex;gap:6px;margin-bottom:10px;font-size:14px;flex-wrap:wrap;font-weight:700}
.steps span{padding:5px 12px;border-radius:99px;background:var(--bg);color:var(--ink3)}
.steps span.on{background:var(--ink);color:var(--paper)}.steps span.dn{color:var(--ok)}
.todo{font-family:'Patrick Hand';font-size:21px;font-weight:700;line-height:1.2}
.sub{color:var(--ink2);font-size:15.5px;margin:2px 0 12px}
.ans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:420px){.ans.long{grid-template-columns:minmax(0,1fr)}}
.op{display:flex;flex-direction:column;justify-content:center;gap:2px;min-height:64px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:var(--paper);font-size:22px;font-weight:700}
button.op:hover{border-color:var(--ink3)}
.op.out{background:var(--redSoft);border-color:var(--red)}
.op.out .v{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:3px;color:var(--ink3)}
.op.gone{opacity:.45}
.op.ok{border-color:var(--ok);background:var(--okSoft)}
.op.mine:not(.ok){border-color:var(--red)}
.op .why{font-size:14px;font-weight:400;color:var(--ink2);line-height:1.35}
.op .tag{font-size:12.5px;font-weight:700;color:var(--ok)}.op .tag.bad{color:var(--red)}
.done .ans{grid-template-columns:minmax(0,1fr)}
.msg{color:var(--red);font-size:15px;min-height:22px;margin-top:8px}
.work{font-family:'Patrick Hand';font-size:20px;background:var(--orSoft);border-radius:12px;padding:10px 14px;margin-top:14px}
.work small{display:block;font-family:'Atkinson Hyperlegible';font-size:13px;color:var(--ink2)}
.marks{border-top:2px dashed var(--line);margin-top:16px;padding-top:14px;display:grid;gap:8px}
.mk{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;font-size:16px}
.mk .pts{width:40px;height:40px;font-size:17px}.mk.no{color:var(--ink3)}
.total{font-family:'Patrick Hand';font-size:22px;font-weight:700;margin-top:2px}.total b{font-size:38px;color:var(--or)}
.tip{background:var(--okSoft);border-radius:12px;padding:12px 14px;font-size:15.5px;margin-top:14px}
/* results */
.score{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;margin-bottom:22px}
@media(max-width:520px){.score{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ring{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--or) var(--p),var(--line) 0)}
.ring span{width:112px;height:112px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-family:'Patrick Hand';font-size:32px;font-weight:700;line-height:1;text-align:center}
.ring small{display:block;font-size:13px;color:var(--ink3);font-family:'Atkinson Hyperlegible';font-weight:400}
.score h2{font-size:clamp(26px,5vw,34px)}.score p{color:var(--ink2);margin-top:6px}
.sk{margin-bottom:12px}.sk .top{display:flex;justify-content:space-between;gap:10px;font-size:15.5px}
.sk .barx{height:12px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:5px}
.sk .barx i{display:block;height:100%;background:var(--ok);border-radius:9px}
details{border:1px solid var(--line);border-radius:14px;margin:18px 0 6px;overflow:hidden}
summary{cursor:pointer;padding:14px 16px;font-weight:700;min-height:44px}
.rv{padding:10px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:15.5px}
.rv .m{color:var(--ink3);font-size:14px}.rv .p{grid-row:1/3;grid-column:2;font-family:'Patrick Hand';font-weight:700;font-size:21px;align-self:center}
.row .btn+.btn{margin-right:auto}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.story{font-size:clamp(18px,3.2vw,20px);line-height:1.45;padding:2px 4px}
.pic{background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px}
.vis{display:block;width:100%;max-width:440px;margin:0 auto;height:auto;font-family:inherit;font-weight:700}
.vis text{fill:var(--ink)}.vis .oj{fill:var(--or)}.vis .mut{fill:var(--ink3);font-weight:400}
.bx{fill:var(--okSoft);stroke:var(--ok);stroke-width:2}.bq{fill:var(--orSoft);stroke:var(--or);stroke-width:2}
.dot{fill:var(--ok)}.dotq{fill:none;stroke:var(--ink3);stroke-width:2;stroke-dasharray:4 3}
.lst{display:grid;gap:6px}.lst div{display:flex;gap:6px;flex-wrap:wrap}
.lst span{min-width:52px;text-align:center;padding:5px 10px;border-radius:8px;background:var(--okSoft);border:2px solid var(--ok);font-weight:700}
.lst span.hid{background:none;border:2px dashed var(--ink3);color:var(--ink3)}
.meth{display:grid;gap:10px}.op.mt{font-size:18px;min-height:56px}
.ans.one{grid-template-columns:minmax(0,1fr)}
.chosen{font-size:15px;color:var(--ink2);margin-bottom:12px}
.rules .pts{font-size:16px}
body{background-image:radial-gradient(ellipse at 20% 0%,rgba(255,255,255,.06),transparent 55%),radial-gradient(ellipse at 90% 100%,rgba(255,255,255,.04),transparent 50%);background-attachment:fixed}
header{border-bottom:6px solid var(--wood);box-shadow:0 2px 0 rgba(0,0,0,.35)}
h1,h2,h3,.btn,.todo,.total,.pts,.work,.ring span,.rule b,.lbl{font-weight:400;letter-spacing:.01em}
.hero h1{font-size:clamp(38px,8vw,56px)}.todo{font-size:25px}.btn{font-size:22px}.logo{font-size:27px}
.sheet,.rule{border:2px solid var(--line);box-shadow:none}
.prob{border:2px dashed var(--ink3);background-color:transparent}
.pic{background:rgba(0,0,0,.14);border:0}
.go{color:#1b382f}.primary{background:var(--ink);color:#1b382f}
.opts button{background:transparent}.opts button[aria-pressed=true]{background:var(--or);border-color:var(--or);color:#1b382f}
.op{background:rgba(0,0,0,.12)}.op .v{font-family:'Patrick Hand';font-weight:400;font-size:26px}.op.mt .v{font-size:21px}
.bx,.bq{stroke-width:2.5;stroke-linecap:round}.bx{fill:rgba(143,227,192,.14)}.bq{fill:rgba(255,209,102,.18);stroke-dasharray:6 4}
.vis text{font-family:'Patrick Hand';font-weight:400;font-size:112%}
.lst span{font-family:'Patrick Hand';font-weight:400;font-size:20px;background:rgba(143,227,192,.14)}
.work{color:var(--ink)}.ring span{background:var(--paper)}
.steps span{background:rgba(0,0,0,.18)}.steps span.on{background:var(--or);color:#1b382f}
.how{display:flex;align-items:stretch;gap:6px;margin:18px 0 20px}
.hw{flex:1;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;border:2px solid var(--line);border-radius:16px;padding:14px 6px 10px;background:var(--paper)}
.hw b{font-family:'Patrick Hand';font-weight:400;font-size:19px;line-height:1.15}
.arr{align-self:center;color:var(--ink3);font-size:22px}
.st,.stars i.on{color:var(--or)}.st{font-size:20px;line-height:1}
.ico svg{display:block;width:56px;height:38px;fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.ico .f{fill:var(--ok);stroke:var(--ok)}.ico .s{stroke:var(--or)}
@media(max-width:480px){.how{gap:3px}.arr{font-size:15px}.hw b{font-size:16px}.ico svg{width:44px;height:30px}}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media(max-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tiles button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:86px;padding:8px 4px;border:2px solid var(--line);border-radius:14px;font-weight:700;font-size:14px;line-height:1.2}
.tiles button[aria-pressed=true]{background:var(--or);border-color:var(--or);color:#1b382f}
.tiles button[aria-pressed=true] svg{stroke:#1b382f}.tiles button[aria-pressed=true] .f{fill:#1b382f;stroke:#1b382f}.tiles button[aria-pressed=true] .s{stroke:#1b382f}
.stars i{font-style:normal;color:var(--ink3)}.stars{letter-spacing:2px}
.got{margin-top:12px;font-size:16px;color:var(--ink2)}
.chosen{color:var(--ok)}
</style>
</head>
<body>
<header><div class="hin"><button class="logo" data-act="home" aria-label="Math Sense Check home">
<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="4" width="26" height="22" rx="3" fill="#2d5c4c" stroke="#9a6a3a" stroke-width="3"/><path d="m9 15 4 4 9-9" fill="none" stroke="#ffd166" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
Math Sense Check</button><span class="pill num" id="pill" hidden></span></div></header>
<main id="app"></main>
<script>
{
const KEY = 'sensecheck-history', PREF = 'sensecheck-prefs';
const S = { view:'home', year:3, count:8, focus:'mix', test:null, idx:0, step:'method', mWrong:[], aWrong:[], slips:{}, res:[], msg:'', retry:false };
try { const p = JSON.parse(localStorage.getItem(PREF) || '{}'); if (p.year) S.year = p.year; if ([4,8,12].includes(p.count)) S.count = p.count; if (p.focus) S.focus = p.focus; } catch (e) {}
const hy = /^#y([1-6])$/.exec(location.hash || ''); if (hy) S.year = +hy[1];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const rr = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[rr(0, a.length - 1)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rr(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const N = n => n.toLocaleString('en-GB');
const hist = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

/* ---------- Pictures: bar models, number lines, arrays, machines ---------- */
const W = 320;
const svg = (h, body) => '<svg viewBox="0 0 ' + W + ' ' + h + '" role="img" aria-label="Maths model" class="vis"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="var(--or)"/></marker></defs>' + body + '</svg>';
const box = (x, y, w, h, t, fs) => '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + h + '" rx="6" class="' + (t === '?' ? 'bq' : 'bx') + '"/><text x="' + (x + w / 2) + '" y="' + (y + h / 2 + 5) + '" text-anchor="middle" font-size="' + (fs || 15) + '">' + t + '</text>';
function barPW(whole, parts, sizes) {
  let w = sizes.map(v => Math.max(64, 300 * v / sizes.reduce((a, b) => a + b, 0))); const k = 300 / w.reduce((a, b) => a + b, 0); w = w.map(v => v * k);
  let x = 10; return svg(92, box(10, 6, 300, 36, whole) + parts.map((p, i) => { const r = box(x, 48, w[i] - 4, 36, p); x += w[i]; return r; }).join(''));
}
function barCompare(nA, a, la, nB, b, lb, dl) {
  const wB = Math.min(180, Math.max(56, 232 * b / a));
  return svg(96, '<text x="4" y="29" font-size="13">' + nA + '</text><text x="4" y="73" font-size="13">' + nB + '</text>' + box(70, 8, 232, 34, la) + box(70, 52, wB, 34, lb) +
    '<rect x="' + (74 + wB) + '" y="52" width="' + (228 - wB) + '" height="34" rx="6" class="' + (dl === '?' ? 'bq' : 'bx') + '" stroke-dasharray="5 4"/><text x="' + (74 + wB + (228 - wB) / 2) + '" y="74" text-anchor="middle" font-size="15">' + dl + '</text>');
}
function barEqual(n, pl, wl) { const w = 300 / n; return svg(92, box(10, 6, 300, 36, wl) + Array.from({ length:n }, (_, i) => box(10 + i * w, 48, w - 3, 36, pl, n > 7 ? 12 : 15)).join('')); }
function nline(pts, jumps, back) {
  const n = pts.length, step = 272 / (n - 1), X = i => back ? 296 - i * step : 24 + i * step;
  return svg(104, '<line x1="8" y1="66" x2="312" y2="66" stroke="var(--ink3)" stroke-width="2"/>' + pts.map((p, i) => '<line x1="' + X(i) + '" y1="59" x2="' + X(i) + '" y2="73" stroke="var(--ink)" stroke-width="2"/>' +
    (p === '?' ? '<rect x="' + (X(i) - 17) + '" y="78" width="34" height="22" rx="5" class="bq"/>' : '') + '<text x="' + X(i) + '" y="95" text-anchor="middle" font-size="14">' + p + '</text>').join('') +
    jumps.map((j, i) => { const a = X(i), b = X(i + 1), m = (a + b) / 2; return '<path d="M' + a + ' 58Q' + m + ' 10 ' + b + ' 58" fill="none" stroke="var(--or)" stroke-width="2.5" marker-end="url(#ah)"/><text x="' + m + '" y="18" text-anchor="middle" font-size="14" class="oj">' + j + '</text>'; }).join(''));
}
function machine(vals, ops, backs) {
  const n = vals.length, bw = 66, gap = (300 - n * bw) / (n - 1), X = i => 10 + i * (bw + gap);
  return svg(backs ? 104 : 78, vals.map((v, i) => box(X(i), 24, bw, 38, v)).join('') + ops.map((o, i) => { const a = X(i) + bw + 3, b = X(i + 1) - 3, m = (a + b) / 2;
    return '<line x1="' + a + '" y1="36" x2="' + b + '" y2="36" stroke="var(--ink)" stroke-width="2.5" marker-end="url(#ah)"/><text x="' + m + '" y="18" text-anchor="middle" font-size="14">' + o + '</text>' +
      (backs ? '<line x1="' + b + '" y1="54" x2="' + a + '" y2="54" stroke="var(--or)" stroke-width="2.5" marker-end="url(#ah)"/><text x="' + m + '" y="80" text-anchor="middle" font-size="14" class="oj">' + backs[i] + '</text>' : ''); }).join('') +
    (backs ? '<text x="160" y="100" text-anchor="middle" font-size="12" class="mut">Work backwards with the inverse</text>' : ''));
}
function arrayVis(rows, cols, done) {
  const cw = Math.min(46, 226 / cols.length), ch = 30;
  return svg(26 + rows.length * ch, cols.map((c, j) => '<text x="' + (92 + j * cw + cw / 2) + '" y="15" text-anchor="middle" font-size="12">' + c + '</text>').join('') +
    rows.map((r, i) => '<text x="84" y="' + (26 + i * ch + 20) + '" text-anchor="end" font-size="12">' + r + '</text>' + cols.map((c, j) => '<circle cx="' + (92 + j * cw + cw / 2) + '" cy="' + (26 + i * ch + 15) + '" r="10" class="' + (done || i === 0 ? 'dot' : 'dotq') + '"/>').join('')).join(''));
}
const listVis = (rows, done) => '<div class="lst">' + rows.map((r, i) => '<div>' + r.map((c, j) => '<span class="' + (done || i === 0 || j === 0 ? '' : 'hid') + '">' + (done || i === 0 || j === 0 ? c : '?') + '</span>').join('') + '</div>').join('') + '</div>';

    '<div class="sheet"><div class="lbl" style="margin-top:0">Year</div><div class="opts">' + [1,2,3,4,5,6].map(y => '<button data-act="year" data-v="' + y + '" aria-pressed="' + (S.year === y) + '">' + y + '</button>').join('') + '</div>' +
    '<div class="lbl">Practise</div><div class="tiles">' + ['mix','op','carry','sys','inv'].map(k => '<button data-act="focus" data-v="' + k + '" aria-pressed="' + (S.focus === k) + '"><span class="ico">' + IC[k] + '</span>' + SHORT[k] + '</button>').join('') + '</div>' +
    '<div class="lbl">Questions</div><div class="opts">' + [4,8,12].map(n => '<button data-act="count" data-v="' + n + '" aria-pressed="' + (S.count === n) + '">' + n + '</button>').join('') + '</div>' +
    '<div class="row"><button class="btn go" data-act="start">Start →</button>' + (b ? '<span class="bestl" style="margin:0">Best: <b class="num">' + b.p + ' / ' + b.m + '</b> ★</span>' : '') + '</div></div>' +
    (h.length ? '<div class="hist"><h3>Scores</h3><table><thead><tr><th>When</th><th>Year</th><th class="r">Stars</th></tr></thead><tbody>' +
      h.slice(0, 6).map(r => { const d = new Date(r.t); return '<tr><td>' + d.toLocaleDateString(undefined, {day:'numeric', month:'short'}) + '</td><td>' + r.y + '</td><td class="r num">' + r.p + ' / ' + r.m + '</td></tr>'; }).join('') + '</tbody></table></div>' : '');
}
const stars = n => '<span class="stars" aria-label="' + n + ' out of 3 stars">' + [0,1,2].map(i => '<i class="' + (i < n ? 'on' : '') + '">★</i>').join('') + '</span>';
function question() {
  const q = S.test[S.idx], st = S.step, done = st === 'done', r = done ? S.res[S.idx] : null, k = ['method','answer','done'].indexOf(st);
  const prog = S.test.map((_, i) => '<i class="' + (i < S.idx || (i === S.idx && done) ? 'd' : i === S.idx ? 'c' : '') + '"></i>').join('');
  const steps = ['1 Choose','2 Solve'].map((s, i) => '<span class="' + (i === k ? 'on' : i < k ? 'dn' : '') + '">' + (i < k ? '✓ ' : '') + s + '</span>').join('');
  const todo = st === 'method' ? ['Which method?', ''] : st === 'answer' ? [S.aWrong.length ? 'Try once more' : 'Work it out', '']
    : [stars(r.pts) + (r.pts === 3 ? ' Perfect!' : r.right ? ' Got there.' : ' Not this time.'), ''];
  let body = '';
  if (st === 'method') body = '<div class="meth">' + q.methods.map((m, i) => S.mWrong.includes(i) ? '<div class="op mt out"><span class="v">' + esc(m.t) + '</span></div>' : '<button class="op mt" data-act="method" data-i="' + i + '"><span class="v">' + esc(m.t) + '</span></button>').join('') + '</div><p class="msg" role="status">' + esc(S.msg) + '</p>';
  else {
    const long = q.opts.some(o => o.v.length > 7);
    body = '<p class="chosen">✓ ' + esc(q.methods.find(m => m.ok).t) + '</p><div class="ans' + (long || done ? ' one' : '') + '">' + q.opts.map((o, i) => {
      const w = S.aWrong.includes(i);
      if (done || w) return '<div class="op' + (o.ok ? ' ok' : w ? ' out' : '') + '"><span class="v num">' + esc(o.v) + '</span>' + (o.ok ? '<span class="tag">Correct</span>' : '<span class="why"><span class="tag bad">' + o.tag + (w ? ' · you chose this' : '') + ': </span>' + esc(o.why) + '</span>') + '</div>';
      return '<button class="op" data-act="answer" data-i="' + i + '"><span class="v num">' + esc(o.v) + '</span></button>'; }).join('') + '</div>';
    if (done) body += '<div class="work"><small>Working</small>' + esc(q.work) + '</div><p class="got">' + (r.m ? '★ method' : '☆ method') + ' · ' + (r.a === 2 ? '★★ answer first time' : r.a ? '★ answer on try 2' : '☆☆ answer') + '</p>' +
      '<div class="row"><span></span><button class="btn ' + (S.idx < S.test.length - 1 ? 'primary" data-act="next">Next question →' : 'go" data-act="finish">See my score →') + '</button></div>';
  }
  return '<div class="sheet' + (done ? ' done' : '') + '"><div class="prog" aria-hidden="true">' + prog + '</div>' +
    '<div class="qhead"><span>Question ' + (S.idx + 1) + ' of ' + S.test.length + (S.retry ? ' · second try' : '') + '</span><span>' + SK[q.skill] + '</span></div>' +
    '<div class="prob">' + (q.text ? '<p class="story">' + esc(q.text) + '</p>' : '') + '<p class="ask">' + esc(q.ask) + '</p><div class="pic">' + q.vis(done) + '</div></div>' +
    '<div class="steps">' + steps + '</div><div class="todo">' + todo[0] + '</div><div style="height:10px"></div>' + body + '</div>';
}
function results() {
  const n = S.res.length, max = n * 3, pts = S.res.reduce((a, r) => a + r.pts, 0), pct = Math.round(pts / max * 100), miss = S.res.filter(r => r.pts < 3).length;
  const verdict = pct >= 90 ? 'Test ready.' : pct >= 70 ? 'Good thinking.' : pct >= 45 ? 'The habits are forming.' : 'Slow down and look at the picture.';
  const sk = Object.keys(SK).map(k => { const idx = S.test.map((q, i) => q.skill === k ? i : -1).filter(i => i >= 0); return [SK[k], idx.reduce((a, i) => a + S.res[i].pts, 0), idx.length * 3]; }).filter(s => s[2]);
  const slips = Object.keys(S.slips).sort((a, b) => S.slips[b] - S.slips[a]);
  return '<div class="sheet"><div class="score"><div class="ring" style="--p:' + pct + '%"><span class="num">' + pts + '<small>of ' + max + ' ★</small></span></div>' +
    '<div><h2>' + verdict + '</h2><p>Year ' + S.year + ' · ' + n + ' questions · ' + S.res.filter(r => r.a === 2).length + ' right first time.</p></div></div>' +
    sk.map(s => '<div class="sk"><div class="top"><span>' + s[0] + '</span><b class="num">' + s[1] + ' / ' + s[2] + '</b></div><div class="barx"><i style="width:' + s[1] / s[2] * 100 + '%"></i></div></div>').join('') +
    (slips.length ? '<div class="tip"><b>Watch out for:</b> ' + slips.slice(0, 2).map(t => t.toLowerCase()).join(', ') + '.</div>' : '') +
    '<details' + (miss ? ' open' : '') + '><summary>Review each question</summary>' + S.test.map((q, i) => { const r = S.res[i];
      return '<div class="rv"><span>' + (i + 1) + '. ' + esc((q.text ? q.text + ' ' : '') + q.ask) + '</span><span class="p num" style="color:' + (r.pts === 3 ? 'var(--ok)' : 'var(--ink2)') + '">+' + r.pts + '</span><span class="m">' + esc(q.work) + '</span></div>'; }).join('') + '</details>' +
    '<div class="row">' + (miss ? '<button class="btn go" data-act="retry">Retry the ' + miss + ' I missed</button><button class="btn ghost" data-act="start">New round</button>' : '<button class="btn go" data-act="start">Play again</button>') + '<button class="link" data-act="home">Change year</button></div>' +
     '</div>';
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, i = +b.dataset.i, q = S.test && S.test[S.idx];
  if (a === 'home') { S.view = 'home'; render(); }
  else if (a === 'year') { S.year = +b.dataset.v; render(); }
  else if (a === 'count') { S.count = +b.dataset.v; render(); }
  else if (a === 'focus') { S.focus = b.dataset.v; render(); }
  else if (a === 'start') start();
  else if (a === 'retry') start(S.test.filter((x, k) => S.res[k].pts < 3).map(x => x.kind));
  else if (a === 'method') { if (q.methods[i].ok) { S.step = 'answer'; S.msg = ''; } else { S.mWrong.push(i); S.msg = 'Look at the picture again.'; } render(); }
  else if (a === 'answer') { const o = q.opts[i]; if (o.ok) finishQ(true); else { S.slips[o.tag] = (S.slips[o.tag] || 0) + 1; S.aWrong.push(i); if (S.aWrong.length > 1) finishQ(false); else render(); } }
  else if (a === 'next') { S.idx++; newQ(); }
  else if (a === 'finish') { if (!S.retry) { const h = hist(); h.unshift({ t:Date.now(), y:S.year, p:S.res.reduce((x, r) => x + r.pts, 0), m:S.res.length * 3, c:S.res.filter(r => r.a === 2).length, n:S.res.length }); save(KEY, h.slice(0, 20)); } S.view = 'results'; render(); scrollTo(0, 0); }
});
render();
}
</script>
</body>
</html>
