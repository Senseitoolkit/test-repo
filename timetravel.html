<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Time Travel World Map</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: chunky kid atlas — century chips on top, big scrollable map, a "same time everywhere" list, and a story card for the chosen city (side column on desktop, bottom sheet on phones). */
:root{
  --bg:#fff6e3; --fg:#2b2440; --muted:#6c6485; --card:#ffffff; --line:#eadcc0;
  --ocean:#8fd0ee; --ocean-deep:#5fb3dc; --land:#f5d98f; --land-edge:#c99a3c;
  --accent:#ff6a45; --accent-ink:#ffffff; --sun:#ffd54a; --pop:#5a5bd8;
  --tag1:#ff6a45; --tag2:#2aa876; --tag3:#5a5bd8; --tag4:#e0477a; --tag5:#d98c1f; --tag6:#1d9bc9;
  --font-display:"Fredoka","Nunito","Arial Rounded MT Bold",sans-serif;
  --font-body:"Nunito","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#1a1730; --fg:#f6f1ff; --muted:#b7afd1; --card:#27224a; --line:#3e3866;
  --ocean:#1f3d66; --ocean-deep:#16304f; --land:#8a7246; --land-edge:#c9a564;
  --accent:#ff7a58; --accent-ink:#1a1730; --sun:#ffd54a; --pop:#9a9bff;
  --tag1:#ff7a58; --tag2:#3fc48f; --tag3:#9a9bff; --tag4:#ff6fa0; --tag5:#f0a53a; --tag6:#4fc0ea;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#1a1730; --fg:#f6f1ff; --muted:#b7afd1; --card:#27224a; --line:#3e3866;
  --ocean:#1f3d66; --ocean-deep:#16304f; --land:#8a7246; --land-edge:#c9a564;
  --accent:#ff7a58; --accent-ink:#1a1730; --sun:#ffd54a; --pop:#9a9bff;
  --tag1:#ff7a58; --tag2:#3fc48f; --tag3:#9a9bff; --tag4:#ff6fa0; --tag5:#f0a53a; --tag6:#4fc0ea;
  color-scheme:dark }

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1180px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--font-display);text-wrap:balance;margin:0;line-height:1.1}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;margin-bottom:10px}
header.top h1{font-size:clamp(26px,4vw,38px);font-weight:700}
header.top h1 span{color:var(--accent)}
header.top p{margin:0;color:var(--muted);font-weight:700}

/* century chips */
.centuries{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:8px;margin-inline:-4px;padding-inline:4px}
.chiprow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chiprow::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font-family:var(--font-display);font-weight:600;font-size:17px;padding:8px 16px;border-radius:999px;border:3px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer;transition:transform .12s}
.chip:hover{transform:translateY(-2px)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip:focus-visible,.pin:focus-visible,.citybtn:focus-visible,button:focus-visible{outline:3px solid var(--pop);outline-offset:2px}
.hint{font-size:14px;color:var(--muted);font-weight:700;margin:6px 0 0}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:minmax(0,1fr)}}

/* map */
.mapcard{background:var(--card);border-radius:22px;border:3px solid var(--line);padding:10px;overflow:hidden}
.mapscroll{overflow-x:auto;overflow-y:hidden;border-radius:14px;background:var(--ocean)}
.mapscroll svg{display:block;min-width:720px;width:100%;height:auto}
.scrollnote{display:none;font-size:13px;color:var(--muted);font-weight:700;margin:6px 4px 0}
@media (max-width:760px){.scrollnote{display:block}}
.land{fill:var(--land);stroke:var(--land-edge);stroke-width:2;stroke-linejoin:round}
.pin{cursor:pointer}
.pin circle.dot{fill:var(--accent);stroke:#fff;stroke-width:3}
.pin circle.ring{fill:none;stroke:var(--accent);stroke-width:3;opacity:0}
.pin.on circle.ring{opacity:1;animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{r:9;opacity:.9}100%{r:22;opacity:0}}
.pin rect{fill:var(--card);stroke:var(--line);stroke-width:2}
.pin.on rect{fill:var(--accent);stroke:var(--accent)}
.pin text{font-family:var(--font-display);font-weight:600;font-size:15px;fill:var(--fg);pointer-events:none}
.pin.on text{fill:var(--accent-ink)}
.pin line{stroke:var(--fg);stroke-width:1.5;opacity:.5}
@media (prefers-reduced-motion:reduce){.pin.on circle.ring{animation:none;opacity:.6}.chip:hover{transform:none}}

.citybtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.citybtn{font-family:var(--font-display);font-weight:600;font-size:15px;padding:6px 12px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--fg);cursor:pointer}
.citybtn[aria-pressed="true"]{background:var(--pop);border-color:var(--pop);color:#fff}

/* everywhere list */
.everywhere{margin-top:18px}
.everywhere h2{font-size:22px;margin-bottom:8px}
.everywhere h2 b{color:var(--accent)}
.evlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;list-style:none;margin:0;padding:0}
.evlist li{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;min-width:0}
.evlist li:hover{border-color:var(--accent)}
.evlist li strong{font-family:var(--font-display);font-weight:600;font-size:17px;display:block}
.evlist li span{font-size:14px;color:var(--muted);font-weight:700}

/* story panel */
.panel{background:var(--card);border-radius:22px;border:3px solid var(--line);padding:14px;position:sticky;top:76px;max-height:calc(100vh - 90px);overflow-y:auto}
.panel .empty{color:var(--muted);font-weight:700;text-align:center;padding:30px 10px}
.panel .empty svg{width:120px;height:auto;display:block;margin:0 auto 8px}
.ptop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.ptop h2{font-size:26px}
.ptop .when{font-family:var(--font-display);font-weight:600;color:var(--accent);font-size:18px}
.close{display:none;border:0;background:var(--line);color:var(--fg);width:38px;height:38px;border-radius:50%;font-size:22px;cursor:pointer;font-weight:800}
.scene{display:block;width:100%;max-width:100%;height:auto;border-radius:16px;margin:10px 0;border:3px solid var(--line)}
.headline{font-size:18px;font-weight:800;margin:0 0 6px}
.navrow{display:flex;gap:8px;margin:8px 0 12px}
.navrow button{flex:1;font-family:var(--font-display);font-weight:600;font-size:15px;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--fg);cursor:pointer}
.navrow button:disabled{opacity:.4;cursor:default}
.sec{margin-top:14px}
.sec h3{display:inline-block;font-size:15px;font-weight:600;padding:3px 10px;border-radius:999px;color:#fff;letter-spacing:.02em;margin-bottom:6px}
.sec ul{margin:0;padding-left:20px}
.sec li{margin:3px 0}
.tl{list-style:none;padding:0;margin:0;border-left:4px solid var(--line);margin-left:6px}
.tl li{position:relative;padding-left:16px;margin:0 0 8px}
.tl li::before{content:"";position:absolute;left:-10px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--accent);border:3px solid var(--card)}
.tl b{font-family:var(--font-display);font-weight:600;font-variant-numeric:tabular-nums;color:var(--pop);margin-right:6px}
.t1 h3{background:var(--tag1)}.t2 h3{background:var(--tag2)}.t3 h3{background:var(--tag3)}.t4 h3{background:var(--tag4)}.t5 h3{background:var(--tag5)}.t6 h3{background:var(--tag6)}
.secret{background:var(--bg);border:2px dashed var(--tag5);border-radius:14px;padding:10px 12px}

@media (max-width:860px){
  .panel{position:fixed;left:0;right:0;bottom:0;top:auto;max-height:85vh;border-radius:22px 22px 0 0;z-index:20;transform:translateY(110%);transition:transform .25s ease;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
  .panel.open{transform:none}
  .panel .empty{display:none}
  .close{display:inline-block}
  @media (prefers-reduced-motion:reduce){.panel{transition:none}}
}
</style>

</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Time Travel <span>World Map</span></h1>
    <p>Pick a century. Tap a city. See what was happening!</p>
  </header>

  <div class="centuries">
    <div class="chiprow" id="chips" role="group" aria-label="Choose a century"></div>
    <p class="hint" id="hint">You are looking at the 1500s. Tap a city on the map.</p>
  </div>

  <div class="grid">
    <div>
      <div class="mapcard">
        <div class="mapscroll">
          <svg id="map" viewBox="0 30 1000 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="World map with cities to tap">
            <defs><pattern id="waves" width="40" height="20" patternUnits="userSpaceOnUse"><path d="M0 10 q10 -6 20 0 t20 0" fill="none" stroke="var(--ocean-deep)" stroke-width="2" opacity=".5"/></pattern></defs>
            <rect x="0" y="0" width="1000" height="500" fill="var(--ocean)"/>
            <rect x="0" y="0" width="1000" height="500" fill="url(#waves)"/>
            <g id="land"></g>
            <g id="pins"></g>
          </svg>
        </div>
        <p class="scrollnote">Slide the map sideways to see every city.</p>
        <div class="citybtns" id="citybtns"></div>
      </div>

      <section class="everywhere">
        <h2>Meanwhile, in the <b id="evcent">1500s</b>…</h2>
        <ul class="evlist" id="evlist"></ul>
      </section>
    </div>

    <aside class="panel" id="panel" aria-live="polite">
      <div class="empty">
        <svg viewBox="0 0 120 90" aria-hidden="true"><circle cx="60" cy="45" r="36" fill="var(--ocean)"/><path d="M38 30 q14 -14 30 -4 q10 8 -2 18 q-14 8 -24 0 q-10 -6 -4 -14z" fill="var(--land)"/><path d="M62 58 q12 -6 20 2 q4 8 -8 12 q-12 2 -12 -14z" fill="var(--land)"/><circle cx="92" cy="22" r="8" fill="var(--sun)"/></svg>
        Tap a city on the map to open its story.
      </div>
      <div id="story" hidden></div>
    </aside>
  </div>
</div>

    kid:function(x){return K.person(x,'#2aa876');},
    tree:function(x){return '<rect x="'+(x-3)+'" y="100" width="6" height="20" fill="#7a4a2a"/><circle cx="'+x+'" cy="90" r="16" fill="#3fa65b"/><circle cx="'+(x-10)+'" cy="98" r="10" fill="#3fa65b"/><circle cx="'+(x+10)+'" cy="98" r="10" fill="#3fa65b"/>';},
    blossom:function(x){return '<rect x="'+(x-3)+'" y="100" width="6" height="20" fill="#5a3a2a"/><circle cx="'+x+'" cy="88" r="16" fill="#ffb3c6"/><circle cx="'+(x-12)+'" cy="96" r="10" fill="#ffc6d4"/><circle cx="'+(x+12)+'" cy="96" r="10" fill="#ffc6d4"/><circle cx="'+(x+4)+'" cy="80" r="3" fill="#fff"/>';},
    palm:function(x){return '<path d="M'+x+' 120 q4 -30 0 -50" stroke="#8a5a2a" stroke-width="5" fill="none"/><g stroke="#2e8b57" stroke-width="5" stroke-linecap="round" fill="none"><path d="M'+x+' 70 q-18 -4 -24 10"/><path d="M'+x+' 70 q18 -4 24 10"/><path d="M'+x+' 70 q-10 -14 -4 -22"/><path d="M'+x+' 70 q10 -14 4 -22"/></g>';},
    car:function(x){return '<rect x="'+(x-22)+'" y="104" width="44" height="12" rx="3" fill="#2a7ad8"/><path d="M'+(x-12)+' 104 l6 -10 h14 l6 10z" fill="#2a7ad8"/><circle cx="'+(x-12)+'" cy="117" r="5" fill="#222"/><circle cx="'+(x+12)+'" cy="117" r="5" fill="#222"/>';},
    cablecar:function(x){return '<line x1="'+(x-60)+'" y1="60" x2="'+(x+60)+'" y2="60" stroke="#555" stroke-width="2"/><rect x="'+(x-18)+'" y="66" width="36" height="22" rx="4" fill="#9b1b1b"/><rect x="'+(x-14)+'" y="70" width="8" height="8" fill="#ffe28a"/><rect x="'+(x-2)+'" y="70" width="8" height="8" fill="#ffe28a"/><rect x="'+(x+8)+'" y="70" width="6" height="8" fill="#ffe28a"/><rect x="'+(x-2)+'" y="60" width="4" height="6" fill="#555"/>';},
    laptop:function(x){return '<rect x="'+(x-24)+'" y="112" width="48" height="8" rx="2" fill="#8a8f99"/><rect x="'+(x-20)+'" y="86" width="40" height="26" rx="2" fill="#333"/><rect x="'+(x-17)+'" y="89" width="34" height="20" fill="#5fd0ff"/>';},
    robot:function(x){return '<rect x="'+(x-12)+'" y="92" width="24" height="22" rx="4" fill="#9aa7b8"/><rect x="'+(x-9)+'" y="78" width="18" height="14" rx="3" fill="#c7d0dc"/><circle cx="'+(x-4)+'" cy="85" r="2.5" fill="#1d9bc9"/><circle cx="'+(x+4)+'" cy="85" r="2.5" fill="#1d9bc9"/><line x1="'+x+'" y1="78" x2="'+x+'" y2="72" stroke="#9aa7b8" stroke-width="2"/><circle cx="'+x+'" cy="70" r="3" fill="#e04040"/><rect x="'+(x-8)+'" y="114" width="6" height="6" fill="#555"/><rect x="'+(x+2)+'" y="114" width="6" height="6" fill="#555"/>';},
    book:function(x){return '<path d="M'+(x-22)+' 96 q22 -8 44 0 v24 q-22 -8 -44 0z" fill="#f8f3e6" stroke="#8a5a2a" stroke-width="2"/><line x1="'+x+'" y1="92" x2="'+x+'" y2="118" stroke="#8a5a2a" stroke-width="2"/><g stroke="#aaa" stroke-width="1.5"><line x1="'+(x-16)+'" y1="102" x2="'+(x-5)+'" y2="101"/><line x1="'+(x-16)+'" y1="108" x2="'+(x-5)+'" y2="107"/><line x1="'+(x+5)+'" y1="101" x2="'+(x+16)+'" y2="102"/></g>';},
    coffee:function(x){return '<rect x="'+(x-14)+'" y="100" width="28" height="20" rx="4" fill="#f4efe0" stroke="#8a5a2a" stroke-width="2"/><path d="M'+(x+14)+' 104 a6 6 0 0 1 0 12" fill="none" stroke="#8a5a2a" stroke-width="2"/>'+K._smoke(x-4,98);},
    lantern:function(x){return '<rect x="'+(x-2)+'" y="70" width="4" height="50" fill="#5a3a2a"/><rect x="'+(x-12)+'" y="56" width="24" height="26" rx="8" fill="#e8402a"/><rect x="'+(x-4)+'" y="52" width="8" height="4" fill="#5a3a2a"/><line x1="'+x+'" y1="56" x2="'+x+'" y2="82" stroke="#c02a1a" stroke-width="1"/>';},
    sparkle:function(x){var s='';[[x-14,110],[x,96],[x+14,112],[x+8,104]].forEach(function(p){s+='<path d="M'+p[0]+' '+(p[1]-6)+' l2 4 l4 2 l-4 2 l-2 4 l-2 -4 l-4 -2 l4 -2z" fill="#ffd54a"/>';});return s;},
    rickshaw:function(x){return '<rect x="'+(x-10)+'" y="92" width="24" height="18" rx="4" fill="#c0392b"/><circle cx="'+(x+2)+'" cy="114" r="7" fill="none" stroke="#333" stroke-width="3"/><line x1="'+(x-10)+'" y1="110" x2="'+(x-30)+'" y2="112" stroke="#5a3a2a" stroke-width="3"/>'+K.person(x-34,'#2a6a9a');},
    plane:function(x,y){y=y||40;return '<path d="M'+(x-24)+' '+y+' h40 l8 4 l-8 4 h-40z" fill="#eee" stroke="#999" stroke-width="1"/><path d="M'+(x-6)+' '+y+' l-6 -12 h10 l4 12z" fill="#eee" stroke="#999" stroke-width="1"/><path d="M'+(x-4)+' '+(y+8)+' l-4 8 h10 l-2 -8z" fill="#eee" stroke="#999" stroke-width="1"/><path d="M'+(x-22)+' '+y+' l-4 -8 h6 l4 8z" fill="#e04040"/>';},
    balloon:function(x,y){y=y||34;return '<ellipse cx="'+x+'" cy="'+y+'" rx="16" ry="20" fill="#f4a21c"/><path d="M'+(x-16)+' '+y+' q16 20 32 0" fill="#e04040"/><line x1="'+(x-8)+'" y1="'+(y+18)+'" x2="'+(x-5)+'" y2="'+(y+30)+'" stroke="#5a3a2a" stroke-width="1.5"/><line x1="'+(x+8)+'" y1="'+(y+18)+'" x2="'+(x+5)+'" y2="'+(y+30)+'" stroke="#5a3a2a" stroke-width="1.5"/><rect x="'+(x-6)+'" y="'+(y+30)+'" width="12" height="7" fill="#8a5a2a"/>';},
    kite:function(x,y){y=y||36;return '<polygon points="'+x+','+(y-16)+' '+(x+12)+','+y+' '+x+','+(y+20)+' '+(x-12)+','+y+'" fill="#e8402a"/><line x1="'+x+'" y1="'+(y-16)+'" x2="'+x+'" y2="'+(y+20)+'" stroke="#fff" stroke-width="1"/><path d="M'+x+' '+(y+20)+' q-8 10 0 20 q8 10 -4 24" fill="none" stroke="#555" stroke-width="1.5"/>';},
    rocket:function(x,y){y=y||40;return '<path d="M'+x+' '+(y-24)+' q12 14 8 40 h-16 q-4 -26 8 -40z" fill="#eee" stroke="#999"/><circle cx="'+x+'" cy="'+(y)+'" r="4" fill="#1d9bc9"/><path d="M'+(x-8)+' '+(y+10)+' l-8 10 h8z M'+(x+8)+' '+(y+10)+' l8 10 h-8z" fill="#e04040"/><path d="M'+(x-5)+' '+(y+16)+' q5 16 10 0z" fill="#f4a21c"/>';},
    moon:function(x,y){return '<circle cx="'+x+'" cy="'+y+'" r="12" fill="#fff6c8"/><circle cx="'+(x+6)+'" cy="'+(y-4)+'" r="10" fill="var(--k-sky)"/>';}
  };
  var SKY_ITEMS={plane:1,balloon:1,kite:1,rocket:1};
  var SKIES={
    day:{top:'#9ad7f7',bottom:'#d9f1ff',sun:true},
    dawn:{top:'#ffb089',bottom:'#ffe3b3',sun:true},
    night:{top:'#1b2140',bottom:'#3b4a7a',moon:true},
    smoky:{top:'#b5a994',bottom:'#e3d8c4'},
    orange:{top:'#d9631c',bottom:'#f6a24c'}
  };
  var GROUNDS={grass:'#58b35c',sand:'#e9c77a',snow:'#f1f4f8',water:'#3f9ad6',stone:'#b7b3a4'};

  function scene(p){
    var sk=SKIES[p.sky]||SKIES.day,gr=GROUNDS[p.ground]||GROUNDS.grass;
    var s='<svg class="scene" viewBox="0 0 240 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A simple picture of this time and place" style="--k-sky:'+sk.top+'">';
    s+='<defs><linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+sk.top+'"/><stop offset="1" stop-color="'+sk.bottom+'"/></linearGradient></defs>';
    s+='<rect width="240" height="160" fill="url(#skyg)"/>';
    if(sk.sun) s+='<circle cx="206" cy="30" r="14" fill="#ffd54a"/>';
    if(sk.moon){ s+=K.moon(206,30); for(var i=0;i<14;i++){ s+='<circle cx="'+((i*53)%230+5)+'" cy="'+((i*37)%70+6)+'" r="1.5" fill="#fff"/>'; } }
    if(p.sky!=='night'){ s+='<ellipse cx="60" cy="34" rx="18" ry="8" fill="#fff" opacity=".8"/><ellipse cx="74" cy="30" rx="12" ry="7" fill="#fff" opacity=".8"/>'; }
    var items=p.items||[],ground=[],sky=[];
    items.forEach(function(it){ (SKY_ITEMS[it]?sky:ground).push(it); });
    if(p.ground==='water'){ s+='<rect x="0" y="118" width="240" height="42" fill="'+gr+'"/><path d="M0 132 q10 -5 20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0 t20 0" fill="none" stroke="#fff" stroke-width="2" opacity=".5"/>'; }
    else { s+='<ellipse cx="60" cy="124" rx="80" ry="14" fill="'+gr+'" opacity=".7"/><ellipse cx="190" cy="124" rx="90" ry="14" fill="'+gr+'" opacity=".7"/><rect x="0" y="120" width="240" height="40" fill="'+gr+'"/>'; }
    var xs=[[120],[75,165],[46,120,194],[36,92,148,204]][Math.min(ground.length,4)-1]||[];
    ground.forEach(function(it,i){ if(K[it]) s+=K[it](xs[i]); });
    var sx=[150,60];
    sky.forEach(function(it,i){ if(K[it]) s+=K[it](sx[i]||100); });
    return s+'</svg>';
  }

  /* ---------- UI ---------- */
  var chips=document.getElementById('chips');
  chips.innerHTML=CENTURIES.map(function(c,i){return '<button class="chip" data-i="'+i+'" aria-pressed="'+(i===0)+'">'+c+'s</button>';}).join('');
  chips.addEventListener('click',function(e){var b=e.target.closest('.chip');if(!b)return;setCentury(+b.dataset.i);});

  var pinsG=document.getElementById('pins');
  pinsG.innerHTML=CITIES.map(function(c){
    var lx=c.x+(c.lx||0),ly=c.y+(c.ly||-26),w=c.name.length*9+16;
    return '<g class="pin" data-id="'+c.id+'" tabindex="0" role="button" aria-label="'+c.name+'">'+
      '<line x1="'+c.x+'" y1="'+c.y+'" x2="'+lx+'" y2="'+ly+'"/>'+
      '<circle class="ring" cx="'+c.x+'" cy="'+c.y+'" r="9"/><circle class="dot" cx="'+c.x+'" cy="'+c.y+'" r="7"/>'+
      '<rect x="'+(lx-w/2)+'" y="'+(ly-12)+'" width="'+w+'" height="24" rx="12"/>'+
      '<text x="'+lx+'" y="'+(ly+5)+'" text-anchor="middle">'+c.name+'</text></g>';
  }).join('');
  pinsG.addEventListener('click',function(e){var g=e.target.closest('.pin');if(g)openCity(g.dataset.id);});
  pinsG.addEventListener('keydown',function(e){var g=e.target.closest('.pin');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openCity(g.dataset.id);}});

  var cityBtns=document.getElementById('citybtns');
  cityBtns.innerHTML=CITIES.map(function(c){return '<button class="citybtn" data-id="'+c.id+'" aria-pressed="false">'+c.name+'</button>';}).join('');
  cityBtns.addEventListener('click',function(e){var b=e.target.closest('.citybtn');if(b)openCity(b.dataset.id);});

  var evlist=document.getElementById('evlist');
  evlist.addEventListener('click',function(e){var li=e.target.closest('li');if(li)openCity(li.dataset.id);});

  var panel=document.getElementById('panel'),story=document.getElementById('story');
  story.addEventListener('click',function(e){
    var b=e.target.closest('button');if(!b)return;
    if(b.dataset.act==='close'){state.city=null;panel.classList.remove('open');story.hidden=true;syncSelection();}
    if(b.dataset.act==='prev')setCentury(state.c-1);
    if(b.dataset.act==='next')setCentury(state.c+1);
  });

  function setCentury(i){
    if(i<0||i>=CENTURIES.length)return;
    state.c=i;
    chips.querySelectorAll('.chip').forEach(function(b){b.setAttribute('aria-pressed',String(+b.dataset.i===i));});
    try{localStorage.setItem('tt-century',i);}catch(err){}
    renderEverywhere();renderStory();
  }
  function openCity(id){
    state.city=id;
    renderStory();
    panel.classList.add('open');
    syncSelection();
    if(window.innerWidth>860){ panel.scrollTop=0; }
  }
  function syncSelection(){
    pinsG.querySelectorAll('.pin').forEach(function(g){g.classList.toggle('on',g.dataset.id===state.city);});
    cityBtns.querySelectorAll('.citybtn').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.id===state.city));});
  }
  function renderEverywhere(){
    var c=CENTURIES[state.c];
    document.getElementById('evcent').textContent=c+'s';
    document.getElementById('hint').textContent='You are looking at the '+c+'s. Tap a city on the map.';
    evlist.innerHTML=CITIES.map(function(city){var e=city.eras[c];return '<li data-id="'+city.id+'"><strong>'+city.name+'</strong><span>'+(e?e.headline:'')+'</span></li>';}).join('');
  }
  function list(arr){return '<ul>'+arr.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul>';}
  function sec(cls,title,arr){return '<div class="sec '+cls+'"><h3>'+title+'</h3>'+list(arr)+'</div>';}
  function renderStory(){
    if(!state.city){story.hidden=true;return;}
    var city=CITIES.filter(function(c){return c.id===state.city;})[0];
    var c=CENTURIES[state.c],e=city.eras[c];
    if(!e){story.hidden=true;return;}
    story.hidden=false;
    story.innerHTML=
      '<div class="ptop"><div><h2>'+city.name+'</h2><div class="when">'+c+'s · '+(e.name||'')+'</div></div><button class="close" data-act="close" aria-label="Close">×</button></div>'+
      scene(e.pic)+
      '<p class="headline">'+e.headline+'</p>'+
      '<div class="navrow"><button data-act="prev" '+(state.c===0?'disabled':'')+'>◀ '+(state.c>0?CENTURIES[state.c-1]+'s':'')+'</button><button data-act="next" '+(state.c===CENTURIES.length-1?'disabled':'')+'>'+(state.c<CENTURIES.length-1?CENTURIES[state.c+1]+'s':'')+' ▶</button></div>'+
      '<div class="sec t1"><h3>Timeline</h3><ul class="tl">'+e.timeline.map(function(t){return '<li><b>'+t[0]+'</b>'+t[1]+'</li>';}).join('')+'</ul></div>'+
      sec('t3','Big names',e.players)+
      sec('t2','Cool inventions',e.inventions)+
      sec('t6','Big events',e.events)+
      sec('t4','Trouble & worries',e.trouble)+
      sec('t5','Fun & culture',e.culture)+
      '<div class="sec t5"><h3>Did you know?</h3><div class="secret">'+e.secret+'</div></div>';
  }

  var saved=0;try{saved=+localStorage.getItem('tt-century')||0;}catch(err){}
  setCentury(saved<CENTURIES.length?saved:0);
})();
</script>

</body>
</html>
