<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}</style>
<title>World Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen app. Thin top bar with 4 tabs; each screen fills the rest. Photo Hunt is a full-bleed panorama with floating controls. */
:root{
  --bg:#F3F7F6; --surface:#FFFFFF; --surface-2:#E8F0EF; --ink:#1C2A31; --muted:#5A6C74; --line:#D6E2E1;
  --sky:#2F7FB5; --sky-soft:#DCEBF5; --leaf:#2F8F63; --leaf-soft:#DDF1E6;
  --ocean:#E2EEF4; --land:#CDE3D3; --on-sky:#FFFFFF; --land-2:#9CC7AC; --coast:#B5D3BF;
  --shadow:0 6px 24px rgba(20,45,60,.14);
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Lexend", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F171B; --surface:#17232A; --surface-2:#1F2E36; --ink:#E6EFF1; --muted:#9AAEB6; --line:#2A3B44;
  --sky:#6CB0E0; --sky-soft:#1D3546; --leaf:#5CC08E; --leaf-soft:#1C3A2C;
  --ocean:#14242C; --land:#2A4436; --on-sky:#0B1418; --land-2:#3F6E57; --coast:#35523F; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F171B; --surface:#17232A; --surface-2:#1F2E36; --ink:#E6EFF1; --muted:#9AAEB6; --line:#2A3B44;
  --sky:#6CB0E0; --sky-soft:#1D3546; --leaf:#5CC08E; --leaf-soft:#1C3A2C;
  --ocean:#14242C; --land:#2A4436; --on-sky:#0B1418; --land-2:#3F6E57; --coast:#35523F; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
.app{height:100%;display:flex;flex-direction:column}
.flag{width:36px;height:24px;border-radius:4px;flex:none;display:inline-block;vertical-align:middle;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.flag.sm{width:27px;height:18px;border-radius:3px}

.top{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:-.01em}
.brand svg{width:30px;height:30px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.tab{border:0;background:transparent;padding:9px 16px;border-radius:999px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:8px}
.tab svg{width:20px;height:20px}
.tab[aria-current="page"]{background:var(--sky-soft);color:var(--ink)}
.tab:disabled{opacity:.4;cursor:default}
main{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;overflow:auto}
.wrap{max-width:1180px;margin:0 auto;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
p{margin:0}

/* Explore */
.explore{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:20px;align-items:start}
@media (max-width:860px){.explore{grid-template-columns:1fr}}
.mapcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;min-width:0}
.mapcard svg{width:100%;height:auto;display:block}
.lands path{fill:var(--land);stroke:var(--coast);stroke-width:.7;stroke-linejoin:round}
.lands path.here{fill:var(--land-2)}
.pin{cursor:pointer}
.pin .dot{fill:var(--sky);stroke:var(--surface);stroke-width:3}
.pin .halo{fill:var(--sky);opacity:0}
.pin.sel .halo{opacity:.2}
.pin.done .dot{fill:var(--leaf)}
.pin.sel .dot{stroke:var(--ink)}
.pin text{font-family:var(--body);font-size:14px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--ocean);stroke-width:4px}
@media (prefers-reduced-motion:no-preference){.pin.sel .halo{animation:pulse 2.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}}
@keyframes pulse{0%,100%{transform:scale(.8);opacity:.25}50%{transform:scale(1.3);opacity:.08}}
.destcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.destcard canvas{width:100%;aspect-ratio:16/9;display:block;max-width:100%;background:var(--surface-2)}
.destbody{padding:18px 20px 22px;display:grid;gap:14px}
.destname{display:flex;align-items:center;gap:12px}
.destname h2{font-size:2rem;letter-spacing:-.02em}
.findlist{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.findlist li{background:var(--surface-2);border-radius:999px;padding:5px 12px;font-size:.9rem}
.findlist li.nat{background:var(--leaf-soft)}
.big{border:0;background:var(--sky);color:var(--on-sky);font-weight:600;font-size:1.05rem;padding:13px 22px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.big svg{width:22px;height:22px}
.ghost{border:1.5px solid var(--line);background:var(--surface);padding:11px 16px;border-radius:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.ghost svg{width:20px;height:20px}
.destgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:20px}
.destbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;text-align:left}
.destbtn b{display:block;font-weight:600;line-height:1.2}
.destbtn small{display:block;color:var(--muted);font-size:.8rem}
.destbtn[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft)}

/* Hunt */
.pano{position:absolute;inset:0;touch-action:none;cursor:grab;background:#BFDCEC;overflow:hidden}
.pano.drag{cursor:grabbing}
.pano canvas{width:100%;height:100%;display:block}
.vf{position:absolute;left:20%;right:20%;top:15%;bottom:15%;pointer-events:none}
.vf i{position:absolute;width:44px;height:44px;border:4px solid rgba(255,255,255,.95);filter:drop-shadow(0 1px 3px rgba(0,0,0,.45));transition:border-color .25s}
.vf i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.vf i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.vf i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 14px}
.vf i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 14px 0}
.vf.hot i{border-color:#7DE2A9}
.float{position:absolute;background:var(--surface);color:var(--ink);border-radius:18px;box-shadow:var(--shadow)}
.place{left:calc(14px + env(safe-area-inset-left,0px));top:14px;display:flex;align-items:center;gap:10px;padding:8px}
.place button{border:0;background:var(--surface-2);width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.place button svg{width:22px;height:22px}
.place b{font-family:var(--display);font-size:1.15rem;padding-right:4px}
.list{right:calc(14px + env(safe-area-inset-right,0px));top:14px;width:min(310px,calc(100% - 28px));overflow:hidden}
.list>button{width:100%;border:0;background:transparent;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;font-weight:600}
.progress{display:flex;gap:5px;align-items:center}
.progress span{width:12px;height:12px;border-radius:50%;background:var(--line)}
.progress span.on{background:var(--leaf)}
.progress em{font-style:normal;font-size:.85rem;color:var(--muted);margin-left:4px}
.list ul{list-style:none;margin:0;padding:0 8px 10px;display:grid;gap:4px}
.list li{display:grid;grid-template-columns:30px 1fr 36px;align-items:center;gap:8px;padding:8px;border-radius:12px}
.list li.done{background:var(--leaf-soft)}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.done .check{background:var(--leaf);border-color:var(--leaf);color:var(--on-sky)}
.check svg{width:16px;height:16px}
.list li b{display:block;font-size:.95rem}
.list li small{display:block;color:var(--muted);font-size:.82rem;line-height:1.3}
.say{border:0;background:transparent;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.say:hover{background:var(--surface-2)}
.say svg{width:20px;height:20px}
.controls{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:center;gap:22px;pointer-events:none}
.controls>*{pointer-events:auto}
.round{width:58px;height:58px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}
.round svg{width:28px;height:28px}
.shutter{width:92px;height:92px;border-radius:50%;border:6px solid var(--surface);background:var(--sky);color:var(--on-sky);box-shadow:var(--shadow),inset 0 0 0 3px rgba(255,255,255,.35);display:grid;place-items:center;transition:transform .1s}
.shutter svg{width:40px;height:40px}
.shutter:active,.shutter.click{transform:scale(.9)}
.zoom{right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));display:grid;overflow:hidden}
.zoom button{border:0;background:transparent;width:52px;height:52px;display:grid;place-items:center}
.zoom button+button{border-top:1px solid var(--line)}
.zoom svg{width:24px;height:24px}
.hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(20,35,45,.72);color:#fff;padding:10px 18px;border-radius:999px;font-weight:500;pointer-events:none;transition:opacity .6s;display:flex;gap:8px;align-items:center;white-space:nowrap}
.hint svg{width:22px;height:22px}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
.flash.go{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
@media (max-width:640px){.controls{gap:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}.round{width:50px;height:50px}.shutter{width:80px;height:80px}
  .zoom{bottom:auto;top:84px}.place{top:auto;bottom:calc(120px + env(safe-area-inset-bottom,0px))}}

/* Controls guide */
.round[aria-expanded="true"]{background:var(--sky);color:var(--on-sky)}
.guide{left:50%;transform:translateX(-50%);bottom:calc(128px + env(safe-area-inset-bottom,0px));padding:14px 16px;display:grid;gap:10px;width:min(280px,calc(100% - 28px));z-index:3}
.guide b{font-family:var(--display);font-size:1.05rem}
.guide div{display:flex;align-items:center;gap:10px;font-size:.92rem}
.keys{display:flex;gap:4px;flex:none;width:72px}
.key{min-width:30px;height:30px;padding:0 6px;border-radius:8px;border:1.5px solid var(--line);border-bottom-width:3px;display:grid;place-items:center;font-weight:600;font-size:.85rem;background:var(--surface-2)}
@media (max-width:640px){.guide{bottom:calc(180px + env(safe-area-inset-bottom,0px))}}
.hint.tip{top:auto;bottom:calc(132px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);white-space:normal;text-align:center;width:max-content;max-width:calc(100% - 32px)}
@media (max-width:640px){.hint.tip{bottom:calc(176px + env(safe-area-inset-bottom,0px))}}
.lbl{border:0;background:transparent;padding:0;text-align:left;min-width:0;border-radius:8px}

/* Progress */
.tally{display:grid;gap:8px;min-width:min(300px,100%)}
.tally .line{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap;font-size:.92rem}
.tally b{font-family:var(--display);font-size:1.25rem}
.bar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--leaf);border-radius:999px;min-width:0}
.tally .ghost{justify-self:start;padding:8px 14px}
.findlist li svg{width:14px;height:14px;vertical-align:-2px;margin-right:5px;color:var(--leaf)}
.tick{margin-left:auto;color:var(--leaf);flex:none;display:grid}
.tick svg{width:20px;height:20px}
.photo img,.strip img,.slot img{background:var(--surface-2)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px}
.facts h3{grid-column:1/-1;font-family:var(--body);font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600;margin-top:8px}
.facts p{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0;overflow-wrap:anywhere}
.facts p.fh{background:transparent;padding:0 12px;font-weight:600}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(10,20,28,.55);display:grid;place-items:center;z-index:50;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--surface);border-radius:24px;max-width:600px;width:100%;max-height:100%;overflow:auto;box-shadow:var(--shadow)}
.sheet>img{width:100%;display:block;border-radius:24px 24px 0 0}
.sheet .in{padding:20px 22px 22px;display:grid;gap:16px}
.sheet h2{font-size:1.7rem}
.lead{font-size:1.08rem}
.info{display:grid;gap:14px}
.info section{display:grid;gap:4px}
.info h3{font-family:var(--body);font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.info ul{margin:0;padding-left:20px;display:grid;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:.82rem;font-weight:600;padding:4px 11px;border-radius:999px;background:var(--surface-2)}
.chip.nat{background:var(--leaf-soft);color:var(--leaf)}
.chip.made{background:var(--sky-soft);color:var(--sky)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.note{background:var(--leaf-soft);border-radius:14px;padding:12px 14px;font-weight:500}

/* Discoveries */
.pagehead{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.pagehead h1{font-size:2.2rem;letter-spacing:-.02em}
.group{margin-bottom:34px}
.ghead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.ghead h2{font-size:1.35rem}
.gabout{color:var(--muted);max-width:68ch;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.photo{border:0;padding:0;background:var(--surface);border-radius:16px;overflow:hidden;text-align:left;box-shadow:0 0 0 1px var(--line)}
.photo img{width:100%;aspect-ratio:8/5;object-fit:cover;display:block}
.photo div{padding:10px 12px 12px;display:grid;gap:6px}
.photo b{font-weight:600;line-height:1.25}
.photo .more{font-size:.82rem;color:var(--sky);font-weight:600}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:22px;padding:40px 24px;text-align:center;display:grid;gap:14px;justify-items:center}
.empty svg{width:56px;height:56px;color:var(--sky)}

/* Compare */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:600px){.pair{grid-template-columns:1fr}}
.slot{border:2px dashed var(--line);background:var(--surface);border-radius:20px;overflow:hidden;min-height:180px;display:grid;padding:0;text-align:left;align-content:start}
.slot.active{border-color:var(--sky);border-style:solid}
.slot img{width:100%;aspect-ratio:8/5;object-fit:cover;display:block}
.slot .cap{padding:10px 14px 14px;display:grid;gap:2px}
.slot .ph{display:grid;place-items:center;color:var(--muted);padding:60px 20px}
.strip{display:flex;gap:10px;overflow-x:auto;padding-block:6px 10px}
.strip button{flex:none;border:3px solid transparent;padding:0;border-radius:12px;overflow:hidden;background:var(--surface);width:130px;text-align:left}
.strip button[aria-pressed="true"]{border-color:var(--sky)}
.strip img{width:100%;aspect-ratio:8/5;object-fit:cover;display:block}
.strip span{display:block;font-size:.78rem;padding:4px 8px;line-height:1.25}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;display:grid;gap:14px;margin-top:18px}
.notice h2{font-size:1.4rem}
.choices{display:flex;flex-wrap:wrap;gap:10px}
.choice{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 18px;font-weight:600}
.choice[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.prompts{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.prompts li{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:12px;padding:8px 8px 8px 14px;font-weight:500}
.prompts li span{flex:1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:60;font-weight:500}
@media (prefers-reduced-motion:reduce){.flash.go{animation-duration:.2s}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="var(--sky-soft)"/><path d="M5 13c4 1 6-2 9 0s1 6 5 6 6-3 8-2M8 24c3-2 5 0 8-1M14 4c-1 3 2 4 1 7" stroke="var(--leaf)" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="16" cy="16" r="14" fill="none" stroke="var(--sky)" stroke-width="2"/></svg>
      World Explorer
    </div>
    <nav class="tabs" aria-label="Screens">
      <button class="tab" data-go="explore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>Explore</button>
      <button class="tab" data-go="hunt" id="tabHunt" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Photo Hunt</button>
      <button class="tab" data-go="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="15.5" cy="8.5" r="1.5"/></svg>My Discoveries</button>
      <button class="tab" data-go="compare"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="7.5" height="14" rx="2"/><rect x="13.5" y="5" width="7.5" height="14" rx="2"/></svg>Compare</button>
    </nav>
  </header>

  <main>
    <section class="screen" id="s-explore">
      <div class="wrap">
        <div class="pagehead"><div><div class="eyebrow">Where we are in place and time</div><h1>Where will you explore?</h1></div><div class="tally" id="tally"></div></div>
        <div class="explore">
          <div class="mapcard">
            <svg id="map" viewBox="0 0 1000 500" role="img" aria-label="World map with destinations"></svg>
            <div class="destgrid" id="destGrid"></div>
          </div>
          <div class="destcard">
            <canvas id="preview" width="960" height="540" aria-hidden="true"></canvas>
            <div class="destbody" id="destBody"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="screen" id="s-hunt" hidden>
      <div class="pano" id="pano"><canvas id="cv"></canvas>
        <div class="vf" id="vf"><i></i><i></i><i></i><i></i></div>
        <div class="flash" id="flash"></div>
        <div class="hint" id="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12H3m0 0 3-3m-3 3 3 3M16 12h5m0 0-3-3m3 3-3 3"/></svg>Drag to look around</div>
      </div>

<script>
(function(){

const ICON={

  mute:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="m17 9 5 6m0-6-5 6"/></svg>',

  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>'

/* ---------- Flags (simplified) ---------- */
function starPts(cx,cy,r){let p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.42:r;p.push((cx+Math.cos(a)*rr).toFixed(2)+','+(cy+Math.sin(a)*rr).toFixed(2))}return p.join(' ')}
const UJ='<rect width="30" height="20" fill="#012169"/><path d="M0 0 30 20M30 0 0 20" stroke="#fff" stroke-width="4"/><path d="M0 0 30 20M30 0 0 20" stroke="#C8102E" stroke-width="1.3"/><path d="M15 0v20M0 10h30" stroke="#fff" stroke-width="6"/><path d="M15 0v20M0 10h30" stroke="#C8102E" stroke-width="3.4"/>';
const FLAGS={
 fr:'<rect width="10" height="20" fill="#1F4FA0"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#D7353D"/>',

 br:'<rect width="30" height="20" fill="#009C3B"/><path d="M15 2.5 27 10 15 17.5 3 10z" fill="#FFDF00"/><circle cx="15" cy="10" r="4.6" fill="#002776"/>',
 cn:'<rect width="30" height="20" fill="#DE2910"/><polygon points="'+starPts(5,5,3)+'" fill="#FFDE00"/>'+[[10,2],[12,4],[12,7],[10,9]].map(([x,y])=>'<polygon points="'+starPts(x,y,1)+'" fill="#FFDE00"/>').join(''),
 us:Array.from({length:13},(_,i)=>'<rect y="'+(i*20/13).toFixed(2)+'" width="30" height="'+(20/13+.05).toFixed(2)+'" fill="'+(i%2?'#fff':'#B22234')+'"/>').join('')+'<rect width="12" height="10.77" fill="#3C3B6E"/>',
 in:'<rect width="30" height="6.67" fill="#FF9933"/><rect y="6.67" width="30" height="6.67" fill="#fff"/><rect y="13.33" width="30" height="6.67" fill="#138808"/><circle cx="15" cy="10" r="2.6" fill="none" stroke="#000080" stroke-width=".7"/><circle cx="15" cy="10" r=".6" fill="#000080"/>',
 kr:'<rect width="30" height="20" fill="#fff"/><path d="M10 10a5 5 0 0 1 10 0z" fill="#CD2E3A"/><path d="M10 10a5 5 0 0 0 10 0z" fill="#0047A0"/><circle cx="12.5" cy="10" r="2.5" fill="#CD2E3A"/><circle cx="17.5" cy="10" r="2.5" fill="#0047A0"/>'+[[5.5,4,-33.7],[24.5,4,33.7],[5.5,16,33.7],[24.5,16,-33.7]].map(([x,y,a])=>'<g transform="translate('+x+' '+y+') rotate('+a+')" fill="#000"><rect x="-2.6" y="-1.9" width="5.2" height=".8"/><rect x="-2.6" y="-.4" width="5.2" height=".8"/><rect x="-2.6" y="1.1" width="5.2" height=".8"/></g>').join(''),
 gb:UJ,

 vn:'<rect width="30" height="20" fill="#DA251D"/><polygon points="'+starPts(15,10.5,5.5)+'" fill="#FFFF00"/>',
 it:'<rect width="10" height="20" fill="#009246"/><rect x="10" width="10" height="20" fill="#fff"/><rect x="20" width="10" height="20" fill="#CE2B37"/>',
 sg:'<rect width="30" height="10" fill="#EF3340"/><rect y="10" width="30" height="10" fill="#fff"/><circle cx="7" cy="5" r="3.4" fill="#fff"/><circle cx="8.4" cy="5" r="3.2" fill="#EF3340"/>'+[[10.8,2.6],[12.6,3.9],[12,6.2],[9.6,6.2],[9,3.9]].map(([x,y])=>'<polygon points="'+starPts(x,y,.75)+'" fill="#fff"/>').join(''),
 ae:'<rect width="30" height="20" fill="#000"/><rect width="30" height="13.33" fill="#fff"/><rect width="30" height="6.67" fill="#00732F"/><rect width="8" height="20" fill="#FF0000"/>',
 ca:'<rect width="30" height="20" fill="#fff"/><rect width="7.5" height="20" fill="#D80621"/><rect x="22.5" width="7.5" height="20" fill="#D80621"/><path d="M15 3.4l1 2 1.6-.6-.6 3.1 1.8-1.6.5 1.1 1.8-.4-.6 1.9 1 .5-3 2.3.3 1.1-3-.4V16h-.6v-3.1l-3 .4.3-1.1-3-2.3 1-.5-.6-1.9 1.8.4.5-1.1 1.8 1.6-.6-3.1 1.6.6z" fill="#D80621"/>'
};
const flag=(code,cls='')=>`<svg class="flag ${cls}" viewBox="0 0 30 20" preserveAspectRatio="none" aria-hidden="true">${FLAGS[code]}</svg>`;

/* ---------- Painting toolkit ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function newPano(seed){const c=document.createElement('canvas');c.width=W*SS;c.height=H*SS;const g=c.getContext('2d');g.scale(SS,SS);return{c,g,R:rng(seed)}}
function shade(col,a){const m=/^#([0-9a-f]{6})$/i.exec(col);if(!m)return col;const n=parseInt(m[1],16),t=a<0?0:255,k=Math.abs(a),f=v=>Math.round(v+(t-v)*k);return `rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`}
let grainTile=null;
function grain(){if(grainTile)return grainTile;const c=document.createElement('canvas');c.width=c.height=256;const g=c.getContext('2d'),im=g.createImageData(256,256),R=rng(7);for(let i=0;i<im.data.length;i+=4){const v=Math.floor(R()*255);im.data[i]=im.data[i+1]=im.data[i+2]=v;im.data[i+3]=255}g.putImageData(im,0,0);return grainTile=c}
/* Finishing pass for every scene: warm light from above, deeper foreground, a little paper grain. */
function finish(c){const g=c.getContext('2d'),w=c.width,h=c.height;g.save();g.setTransform(1,0,0,1,0,0);
  let gr=g.createLinearGradient(0,0,0,h);gr.addColorStop(0,'rgba(255,232,190,.22)');gr.addColorStop(.5,'rgba(255,255,255,0)');gr.addColorStop(.78,'rgba(255,255,255,0)');gr.addColorStop(1,'rgba(15,25,60,.3)');
  g.globalCompositeOperation='soft-light';g.fillStyle=gr;g.fillRect(0,0,w,h);
  g.globalCompositeOperation='overlay';g.globalAlpha=.075;g.fillStyle=g.createPattern(grain(),'repeat');g.fillRect(0,0,w,h);g.restore();return c}
const pick=(R,a)=>a[Math.floor(R()*a.length)];
function rect(g,x,y,w,h,c){g.fillStyle=c;g.fillRect(x,y,w,h)}
function poly(g,pts,c){g.fillStyle=c;g.beginPath();pts.forEach(([x,y],i)=>i?g.lineTo(x,y):g.moveTo(x,y));g.closePath();g.fill()}
function circle(g,x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function ell(g,x,y,rx,ry,c,rot=0){g.fillStyle=c;g.beginPath();g.ellipse(x,y,rx,ry,rot,0,7);g.fill()}
function line(g,x1,y1,x2,y2,c,w){g.strokeStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x1,y1);g.lineTo(x2,y2);g.stroke()}
function sky(g,a,b,hz=680){const gr=g.createLinearGradient(0,0,0,hz);gr.addColorStop(0,a);gr.addColorStop(1,b);g.fillStyle=gr;g.fillRect(0,0,W,hz+60);const gl=g.createLinearGradient(0,hz-260,0,hz+40);gl.addColorStop(0,'rgba(255,240,214,0)');gl.addColorStop(1,'rgba(255,240,214,.5)');g.fillStyle=gl;g.fillRect(0,hz-260,W,300);}
function cloud(g,x,y,s){const pf=[[0,0,1],[.8,.12,.74],[-.82,.16,.68],[.32,-.36,.62],[-.42,-.24,.52],[1.42,.26,.44],[-1.45,.28,.4]],top=y-s*1.4,base=y+s*.34;
  const blob=(oy,col)=>{g.fillStyle=col;g.beginPath();pf.forEach(([dx,dy,r])=>{const rx=s*r,cx=x+dx*s,cy=y+dy*s+oy;g.moveTo(cx+rx,cy);g.ellipse(cx,cy,rx,rx*.62,0,0,7)});g.fill()};
  g.save();g.beginPath();g.rect(x-s*2.2,top,s*4.4,base-top);g.clip();blob(0,'#C6D5E5');blob(-s*.14,'#FFFFFF');g.restore()}
function puff(g,x,y,r,a=.5){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,`rgba(255,255,255,${a})`);gr.addColorStop(.6,`rgba(255,255,255,${a*.45})`);gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function canopy(g,x,y,r,c){circle(g,x+r*.14,y+r*.2,r,shade(c,-.24));circle(g,x,y,r*.93,c);circle(g,x-r*.26,y-r*.3,r*.42,shade(c,.13))}
/* A wooded slope: tree crowns drawn back to front so they overlap like a forest. */
function woods(g,R,n,xf,yf,rf,cols){const a=[];for(let i=0;i<n;i++){const x=xf(),y=yf(x);if(y==null)continue;a.push([x,y,rf(),pick(R,cols)])}a.sort((p,q)=>p[1]-q[1]).forEach(([x,y,r,c])=>canopy(g,x,y,r,c))}
function clouds(g,R,n,y0=60,y1=250){for(let i=0;i<n;i++){const x=R()*W,y=y0+R()*(y1-y0),s=32+R()*50;[x,x-W,x+W].forEach(xx=>cloud(g,xx,y,s))}}
function ridgeFn(R,base,amp,peaks=[]){const k=[1+Math.floor(R()*3),4+Math.floor(R()*3),9+Math.floor(R()*4)],p=[R()*6.28,R()*6.28,R()*6.28];
  return x=>{let y=base-amp*(.55+.25*Math.sin(6.2832*k[0]*x/W+p[0])+.15*Math.sin(6.2832*k[1]*x/W+p[1])+.06*Math.sin(6.2832*k[2]*x/W+p[2]));
    peaks.forEach(([cx,h,w])=>{let d=Math.abs(x-cx);d=Math.min(d,W-d);y-=h*Math.exp(-(d*d)/(2*w*w))});return y}}
function fillRidge(g,f,col,bottom=H){let mn=bottom;for(let x=0;x<=W;x+=40)mn=Math.min(mn,f(x));const rg=g.createLinearGradient(0,mn,0,Math.min(bottom,mn+380));rg.addColorStop(0,shade(col,-.1));rg.addColorStop(1,shade(col,.2));g.fillStyle=rg;g.beginPath();g.moveTo(0,bottom);for(let x=0;x<=W;x+=8)g.lineTo(x,f(x));g.lineTo(W,bottom);g.closePath();g.fill()}
function band(g,y0,y1,a,b,x0=0,x1=W){const gr=g.createLinearGradient(0,y0,0,y1);gr.addColorStop(0,a);gr.addColorStop(1,b);g.fillStyle=gr;g.fillRect(x0,y0,x1-x0,y1-y0)}
function ripples(g,R,y0,y1,n,x0=0,x1=W,col='rgba(255,255,255,.35)'){g.strokeStyle=col;g.lineWidth=2;for(let i=0;i<n;i++){const x=x0+R()*(x1-x0),y=y0+R()*(y1-y0),l=10+R()*30;g.beginPath();g.moveTo(x,y);g.lineTo(Math.min(x+l,x1),y);g.stroke();if(i%3===0){g.strokeStyle='rgba(10,45,75,.14)';g.beginPath();g.moveTo(x+4,y+3);g.lineTo(Math.min(x+l+8,x1),y+3);g.stroke();g.strokeStyle=col}}}
function paving(g,y0,y1,col,lc,step=24){rect(g,0,y0,W,y1-y0,col);g.strokeStyle=lc;g.lineWidth=1.5;for(let y=y0,r=0;y<y1;y+=step,r++){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();for(let x=(r%2)*step*1.25;x<W;x+=step*2.5){g.beginPath();g.moveTo(x,y);g.lineTo(x,Math.min(y+step,y1));g.stroke()}}}
function tree(g,x,y,r,c){ell(g,x+r*.15,y+1,r*1.15,r*.14,'rgba(20,40,30,.16)');rect(g,x-3,y-r*.3,6,r*.3+2,'#5C4A3A');
  const blob=(col,ox,oy,k)=>{g.fillStyle=col;g.beginPath();g.arc(x+ox,y-r*.9+oy,r*k,0,7);g.arc(x-r*.6+ox,y-r*.55+oy,r*.7*k,0,7);g.arc(x+r*.6+ox,y-r*.55+oy,r*.7*k,0,7);g.fill()};
  blob(shade(c,-.24),r*.07,r*.09,1);blob(c,0,0,.95);
  circle(g,x-r*.26,y-r*1.16,r*.44,shade(c,.12))}
function pine(g,x,y,h,c){rect(g,x-3,y-h*.22,6,h*.22,'#5C4A3A');poly(g,[[x,y-h],[x+h*.24,y-h*.18],[x-h*.24,y-h*.18]],c);poly(g,[[x,y-h],[x+h*.24,y-h*.18],[x+h*.04,y-h*.18]],shade(c,-.2))}
function cypress(g,x,y,h,c){rect(g,x-2,y-8,4,8,'#5C4A3A');ell(g,x,y-h*.5,h*.11,h*.5,c);ell(g,x-h*.035,y-h*.52,h*.04,h*.36,shade(c,.14))}
function palm(g,x,y,h){g.strokeStyle='#7A5A3A';g.lineWidth=7;g.beginPath();g.moveTo(x,y);g.quadraticCurveTo(x+14,y-h*.5,x+6,y-h);g.stroke();g.strokeStyle='#3F7D3F';g.lineWidth=6;
  for(let a=0;a<7;a++){const an=-Math.PI+a*Math.PI/6,ex=x+6+Math.cos(an)*h*.42;g.beginPath();g.moveTo(x+6,y-h);g.quadraticCurveTo(x+6+Math.cos(an)*h*.25,y-h-26,ex,y-h+18+Math.abs(Math.cos(an))*16);g.stroke()}}
function windows(g,x,y,w,h,col,sx=16,sy=22,ww=8,wh=12){g.fillStyle=col;for(let yy=y;yy+wh<=y+h;yy+=sy)for(let xx=x;xx+ww<=x+w;xx+=sx)g.fillRect(xx,yy,ww,wh)}
function block(g,x,w,top,base,col,win){rect(g,x,top,w,base-top,col);windows(g,x+6,top+10,w-12,base-top-16,win,Math.max(10,w/6),16,5,9);rect(g,x+w*.78,top,w*.22,base-top,'rgba(0,0,0,.1)');rect(g,x,top,w*.08,base-top,'rgba(255,255,255,.14)');rect(g,x,top,w,2,'rgba(255,255,255,.3)')}
function asianRoof(g,cx,y,w,h,col){const L=cx-w/2,Rr=cx+w/2;g.fillStyle=col;g.beginPath();g.moveTo(L,y+h*.62);g.quadraticCurveTo(L+w*.08,y+h,L+w*.18,y+h);g.lineTo(Rr-w*.18,y+h);g.quadraticCurveTo(Rr-w*.08,y+h,Rr,y+h*.62);
  g.quadraticCurveTo(Rr-w*.16,y+h*.55,cx+w*.28,y);g.lineTo(cx-w*.28,y);g.quadraticCurveTo(L+w*.16,y+h*.55,L,y+h*.62);g.closePath();g.fill();rect(g,cx-w*.3,y-4,w*.6,7,'rgba(0,0,0,.28)');rect(g,L+w*.18,y+h-5,w*.64,5,'rgba(0,0,0,.18)')}
function hallBody(g,cx,top,w,h,body,pillar,bandCol){rect(g,cx-w/2,top,w,h,body);const n=Math.max(3,Math.round(w/50));for(let i=0;i<=n;i++)rect(g,cx-w/2+i*(w-10)/n,top,10,h,pillar);if(bandCol)rect(g,cx-w/2,top,w,12,bandCol)}
function pagoda(g,cx,base,tiers,w0,sh,body,roof){let y=base;for(let i=0;i<tiers;i++){const w=w0*(1-i*.1),bh=sh*.5,rh=sh*.42;rect(g,cx-w*.3,y-bh,w*.6,bh,body);rect(g,cx-w*.3,y-bh*.6,w*.6,bh*.25,'rgba(255,255,255,.18)');asianRoof(g,cx,y-bh-rh*.75,w,rh,roof);y=y-bh-rh*.55}

const pe=$('#pano'),pts=new Map();let pinch=0;
const spread=()=>{const[a,b]=[...pts.values()];return Math.hypot(a.x-b.x,a.y-b.y)};
pe.addEventListener('pointerdown',e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});try{pe.setPointerCapture(e.pointerId)}catch(_){}pe.classList.add('drag');pinch=pts.size===2?spread():0;hideHint()});
pe.addEventListener('pointermove',e=>{const p=pts.get(e.pointerId);if(!p)return;
  if(pts.size===1){const s=sc();view.yaw-=(e.clientX-p.x)*dpr/s;view.y0-=(e.clientY-p.y)*dpr/s;req()}
  p.x=e.clientX;p.y=e.clientY;
  if(pts.size===2){const d=spread();if(pinch>0&&d>0)zoomBy(d/pinch);pinch=d}});
const endDrag=e=>{pts.delete(e.pointerId);pinch=0;if(!pts.size)pe.classList.remove('drag')};pe.addEventListener('pointerup',endDrag);pe.addEventListener('pointercancel',endDrag);
function zoomBy(f){const s0=sc(),cx=view.yaw+cv.width/s0/2,cy=view.y0+cv.height/s0/2;view.zoom*=f;clampView();const s=sc();view.yaw=cx-cv.width/s/2;view.y0=cy-cv.height/s/2;req();hideHint()}
pe.addEventListener('wheel',e=>{e.preventDefault();zoomBy(e.deltaY<0?1.12:1/1.12)},{passive:false});
$('#zin').onclick=()=>zoomBy(1.3);$('#zout').onclick=()=>zoomBy(1/1.3);
let turnAnim=0;function turn(dir){hideHint();cancelAnimationFrame(turnAnim);const total=cv.width/sc()*.35*dir;let done=0;const t0=performance.now();
  const step=now=>{const p=Math.min(1,(now-t0)/350),e=1-Math.pow(1-p,3),want=total*e;view.yaw+=want-done;done=want;draw();if(p<1)turnAnim=requestAnimationFrame(step)};turnAnim=requestAnimationFrame(step)}
$('#helpBtn').onclick=()=>{const g2=$('#guide');g2.hidden=!g2.hidden;$('#helpBtn').setAttribute('aria-expanded',!g2.hidden);$('#helpBtn').setAttribute('aria-label',g2.hidden?'Show controls':'Hide controls')};$('#hintBtn').onclick=()=>showHint();$('#left').onclick=()=>turn(-1);$('#right').onclick=()=>turn(1);
document.addEventListener('keydown',e=>{if(screen!=='hunt'||!$('#modal').hidden)return;
  if(e.key==='ArrowLeft'){e.preventDefault();turn(-1)}else if(e.key==='ArrowRight'){e.preventDefault();turn(1)}else if(e.key==='ArrowUp'||e.key==='+'||e.key==='='){e.preventDefault();zoomBy(1.3)}else if(e.key==='ArrowDown'||e.key==='-'){e.preventDefault();zoomBy(1/1.3)}else if(e.key===' '&&!(e.target.closest&&e.target.closest('.list,.place'))){e.preventDefault();if(document.activeElement&&document.activeElement!==document.body)document.activeElement.blur();capture()}else if(e.key==='h'||e.key==='H'){showHint()}});
$('#backBtn').onclick=()=>go('explore');
function drawSound(){$('#soundBtn').innerHTML=soundOn?ICON.speak:ICON.mute;$('#soundBtn').setAttribute('aria-label',soundOn?'Sound on. Tap to turn off':'Sound off. Tap to turn on')}
$('#soundBtn').onclick=()=>{soundOn=!soundOn;try{localStorage.setItem('we-sound',soundOn?'on':'off')}catch(e){}drawSound()};

function startHunt(id){
  if(!cur||cur.id!==id){cur=DMAP[id];pano=getPano(id);started=false;clearTimeout(hintTm);hintTm=0;hintId=null;const h=$('#hint');h.classList.remove('tip');h.innerHTML=HINT0;h.style.opacity=1}
  $('#placeFlag').innerHTML=flag(cur.flag,'sm');$('#placeName').textContent=cur.name;drawSound();
  $('#tabHunt').disabled=false;go('hunt');
}

let listOpen=window.innerWidth>640;
function renderList(){
  const f=foundIds(cur.id);
  $('#dots').innerHTML=cur.targets.map(t=>`<span class="${f.has(t.id)?'on':''}"></span>`).join('')+`<em>${f.size} / ${cur.targets.length}</em>`;
  $('#huntList').innerHTML=cur.targets.map(t=>{const d=f.has(t.id);return `<li class="${d?'done':''}"><span class="check">${d?ICON.check:''}</span><button class="lbl" data-t="${t.id}" title="${d?'Read about it':'Get a hint'}"><b>${t.label}</b><small>${d?esc(t.card.title)+' · read about it':t.prompt}</small></button><button class="say" data-say="${esc(d?t.card.title+'. '+t.card.famous:t.prompt)}" aria-label="Read aloud">${ICON.speak}</button></li>`}).join('');
  $('#huntList').querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{const id=b.dataset.t;if(foundIds(cur.id).has(id)){const p=photos.filter(x=>x.dest===cur.id&&x.target===id).pop();if(p)showPhoto(p.id)}else showHint(id)});
  $('#huntList').hidden=!listOpen;$('#listToggle').setAttribute('aria-expanded',listOpen);
}
$('#listToggle').onclick=()=>{listOpen=!listOpen;renderList()};
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(b){e.stopPropagation();speak(b.dataset.say)}});

/* ---------- Camera ---------- */
function cropRect(){const s=sc();return [mod(view.yaw+cv.width*.2/s,W),view.y0+cv.height*.15/s,cv.width*.6/s,cv.height*.7/s].map(n=>Math.round(n))}
let busy=false;
function capture(){
  if(busy||!cur||!cv.width)return;busy=true;shutterSound();
  if(hintId||hintTm){hintId=null;clearTimeout(hintTm);hintTm=0;$('#hint').style.opacity=0;draw()}
  const fl=$('#flash'),sb=$('#shutter');fl.classList.remove('go');void fl.offsetWidth;fl.classList.add('go');sb.classList.add('click');setTimeout(()=>sb.classList.remove('click'),150);hideHint();
  const v=cropRect(),hit=inFrame(),id=Date.now()+'',img=renderThumb({id,dest:cur.id,v});
  setTimeout(()=>{busy=false;
    if(hit){const again=foundIds(cur.id).has(hit.id);const p={id,dest:cur.id,target:hit.id,label:hit.card.title,cat:hit.cat,v,t:Date.now()};
      photos.push(p);persist();renderList();draw();if(!again)chime();showFound(p,again)}
    else showMiss(img,v,id)},420);
}
$('#shutter').onclick=capture;

/* ---------- Info cards ---------- */
function infoHTML(d,t){const c=t.card,nat=c.type==='Natural';
  const sec=[[ 'Why it is famous',c.famous],[c.bl||(nat?'How it formed':'When it was built'),c.built],[c.pl||(nat?'Why it matters to people':'What it is for'),c.purpose],['Places with a similar purpose',c.similar],[c.ml||'What it is made of',c.made]];
  return `<div class="chips"><span class="chip ${nat?'nat':'made'}">${c.type}</span><span class="chip">${t.cat}</span><span class="chip">${flag(d.flag,'sm')} ${d.name}, ${d.country}</span></div>
   <div class="info">${sec.filter(s=>s[1]).map(([h,v])=>`<section><h3>${h}</h3><p>${v}</p></section>`).join('')}
   <section><h3>Interesting facts</h3><ul>${c.facts.map(f=>`<li>${f}</li>`).join('')}</ul></section></div>`}
const readText=(d,t)=>{const c=t.card;return `${c.title}, in ${d.name}. ${c.famous} ${c.built} ${c.purpose} It is made of: ${c.made} ${c.facts.join(' ')}`};
let lastFocus=null;
function openModal(html){if($('#modal').hidden)lastFocus=document.activeElement;$('#sheet').innerHTML=html;$('#modal').hidden=false;$('#sheet').scrollTop=0;const h=$('#sheet').querySelector('h2');if(h)$('#sheet').setAttribute('aria-label',h.textContent);const b=$('#sheet').querySelector('.big');if(b)b.focus()}
function closeModal(){$('#modal').hidden=true;try{speechSynthesis.cancel()}catch(e){}if(lastFocus&&document.contains(lastFocus)){try{lastFocus.focus()}catch(e){}}lastFocus=null}
function confetti(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas');c.className='confetti';document.body.appendChild(c);const w=c.width=innerWidth,h=c.height=innerHeight,g=c.getContext('2d'),cols=['#2F7FB5','#2F8F63','#E9C23B','#E07B2E','#D86A8E'];
  const ps=Array.from({length:90},()=>({x:Math.random()*w,y:-20-Math.random()*h*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*4,r:4+Math.random()*5,a:Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]})),t0=performance.now();
  const f=now=>{g.clearRect(0,0,w,h);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.15;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.c;g.fillRect(-p.r,-p.r/2,p.r*2,p.r);g.restore()});if(now-t0<2600)requestAnimationFrame(f);else c.remove()};requestAnimationFrame(f)}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.closest('[data-close]'))closeModal()});
document.addEventListener('keydown',e=>{if($('#modal').hidden)return;
  if(e.key==='Escape')closeModal();
  else if(e.key==='Tab'){const f=[...$('#sheet').querySelectorAll('button')];if(!f.length)return;const i=f.indexOf(document.activeElement);
    if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus()}else if(!e.shiftKey&&(i<0||i===f.length-1)){e.preventDefault();f[0].focus()}}});
function showFound(p,again){
  const t=TARGET(p.dest,p.target),f=foundIds(cur.id),all=f.size===cur.targets.length;
  if(all&&!again)confetti();
  openModal(`<img src="${renderThumb(p)}" alt="Your photo of ${esc(t.card.title)}"><div class="in">
    <div><div class="eyebrow">${again?'Another photo of':'You found the '+t.label.toLowerCase()}</div><h2>${t.card.title}</h2></div>
    <p class="lead">${t.card.famous}</p>
    ${all&&!again?`<div class="note">You found all ${cur.targets.length} things in ${cur.name}! Read about them in My Discoveries, or compare two photos.</div>`:''}
    <div class="row"><button class="big" data-close>${all?'Keep exploring':'Find the next one'}</button><button class="ghost" id="moreBtn">Read more</button><button class="ghost" id="readBtn">${ICON.speak}Read to me</button></div></div>`);
  $('#moreBtn').onclick=()=>showPhoto(p.id);$('#readBtn').onclick=()=>speak(t.card.title+'. '+t.card.famous);
}
function showMiss(img,v,id){
  openModal(`<img src="${img}" alt="Your photo"><div class="in"><h2>Nothing from your list is in the frame</h2>
  <p class="muted">Point the camera so a hunt item sits inside the white corners. When the corners turn green, take the photo. You can also keep this one as your own discovery.</p>
  <div class="row"><button class="big" data-close>Try again</button><button class="ghost" id="keepBtn">Keep as my own discovery</button></div></div>`);
  $('#keepBtn').onclick=()=>{const p={id,dest:cur.id,target:null,label:'My own discovery',cat:'My pick',v,t:Date.now()};photos.push(p);persist();closeModal();toast('Saved to My Discoveries')};
}

/* ---------- Discoveries ---------- */
function photoCard(p){const t=p.target&&TARGET(p.dest,p.target);return `<button class="photo" data-photo="${p.id}">${ph(p,p.label)}<div><b>${esc(p.label)}</b><span class="chip" style="justify-self:start">${esc(p.cat)}</span>${t?'<span class="more">Read about it</span>':''}</div></button>`}
function renderDisc(){
  const w=$('#discWrap');
  if(!photos.length){w.innerHTML=`<div class="pagehead"><h1>My Discoveries</h1></div><div class="empty">${ICON.cam}<h2>No photos yet</h2><p class="muted">Your photos from the Photo Hunt will appear here, with facts to read about each place.</p><button class="big" id="goEx">Choose a place to explore</button></div>`;$('#goEx').onclick=()=>go('explore');return}
  let h=`<div class="pagehead"><div><div class="eyebrow">${photos.length} photo${photos.length>1?'s':''}</div><h1>My Discoveries</h1></div><div class="row">${photos.length>1?'<button class="ghost" id="goCmp">Compare two photos</button>':''}<button class="ghost" id="resetBtn">Start over</button></div></div>`;
  const order=[...new Set(photos.slice().sort((a,b)=>b.t-a.t).map(p=>p.dest))];
  order.forEach(id=>{const d=DMAP[id];const list=photos.filter(p=>p.dest===id).sort((a,b)=>a.t-b.t);
    h+=`<div class="group"><div class="ghead">${flag(d.flag)}<h2>${d.name}, ${d.country}</h2><span class="chip">${foundIds(id).size} of ${d.targets.length} found</span><button class="say" data-say="${esc(d.about)}" aria-label="Read aloud">${ICON.speak}</button></div><p class="gabout">${d.about}</p><div class="grid">${list.map(photoCard).join('')}</div></div>`});
  w.innerHTML=h;if($('#goCmp'))$('#goCmp').onclick=()=>go('compare');
  let arm=false;$('#resetBtn').onclick=()=>{if(!arm){arm=true;$('#resetBtn').textContent='Tap again to delete all photos';return}photos=[];thumbs.clear();cmp.a=cmp.b=null;persist();renderDisc();toast('All photos deleted. Your hunt lists are fresh again.')};
  hydrate();
  w.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>showPhoto(b.dataset.photo));
}
function showPhoto(id){
  const p=photos.find(x=>x.id===id);if(!p)return;const d=DMAP[p.dest],t=p.target&&TARGET(p.dest,p.target);let arm=false;
  openModal(`<img src="${renderThumb(p)}" alt="${esc(p.label)}"><div class="in"><h2>${esc(p.label)}</h2>
   ${t?infoHTML(d,t):`<div class="chips"><span class="chip">${flag(d.flag,'sm')} ${d.name}, ${d.country}</span></div><p>${d.about}</p><p class="muted">You chose this photo yourself. What did you notice here?</p>`}
   <div class="row"><button class="big" data-close>Close</button>${t?`<button class="ghost" id="readBtn">${ICON.speak}Read to me</button>`:''}<button class="ghost" id="delBtn">Delete photo</button></div></div>`);
  if(t)$('#readBtn').onclick=()=>speak(readText(d,t));
  $('#delBtn').onclick=()=>{if(!arm){arm=true;$('#delBtn').textContent='Tap again to delete';return}
    photos=photos.filter(x=>x.id!==id);thumbs.delete(id);persist();if(cmp.a===id)cmp.a=null;if(cmp.b===id)cmp.b=null;closeModal();if(screen==='disc')renderDisc();if(screen==='hunt'){renderList();req()}if(screen==='compare')renderCompare()};
}

/* ---------- Compare ---------- */
const cmp={a:null,b:null,active:'a',notice:null,facts:false};
function slotHTML(k){const p=photos.find(x=>x.id===cmp[k]);const d=p&&DMAP[p.dest];
  return `<button class="slot ${cmp.active===k?'active':''}" data-slot="${k}" aria-label="Photo ${k==='a'?'one':'two'}">${p?`${ph(p,p.label)}<div class="cap"><b>${esc(p.label)}</b><span class="muted">${flag(d.flag,'sm')} ${d.name}</span></div>`:`<div class="ph">Pick photo ${k==='a'?'one':'two'} below</div>`}</button>`}
function renderCompare(){
  const w=$('#cmpWrap');
  if(photos.length<2){w.innerHTML=`<div class="pagehead"><h1>Compare</h1></div><div class="empty">${ICON.cam}<h2>Take two photos to compare</h2><p class="muted">Find things on the Photo Hunt, then look at them side by side here.</p><button class="big" id="goEx">Choose a place to explore</button></div>`;$('#goEx').onclick=()=>go('explore');return}
  if(!photos.find(p=>p.id===cmp.a))cmp.a=null;if(!photos.find(p=>p.id===cmp.b))cmp.b=null;
  if(!cmp.a&&!cmp.b){const a=photos[0];const b=photos.find(p=>p.dest!==a.dest)||photos[1];cmp.a=a.id;cmp.b=b.id}
  const follow={same:'What is the same? Look at the shape, the size and what it is made of.',diff:'What is different? Look at the shape, the size and what it is made of.',both:'Tell a partner one thing that is the same and one thing that is different.'};
  const pa=photos.find(x=>x.id===cmp.a),pb=photos.find(x=>x.id===cmp.b),ta=pa&&pa.target&&TARGET(pa.dest,pa.target),tb=pb&&pb.target&&TARGET(pb.dest,pb.target);
  const rows=[['Natural or human-made',c=>c.type],['How it began',c=>c.built],['What it is for',c=>c.purpose],['What it is made of',c=>c.made]];
  const facts=ta&&tb?`${cmp.facts?`<div class="facts"><p class="fh">${ta.card.title}</p><p class="fh">${tb.card.title}</p>${rows.map(([h,f])=>`<h3>${h}</h3><p>${f(ta.card)}</p><p>${f(tb.card)}</p>`).join('')}</div>`:''}<div class="row"><button class="ghost" id="factsBtn" aria-expanded="${cmp.facts}">${cmp.facts?'Hide the facts':'Check the facts side by side'}</button></div>`:'';
  w.innerHTML=`<div class="pagehead"><div><div class="eyebrow">Look closely</div><h1>Compare</h1></div></div>
   <div class="pair">${slotHTML('a')}${slotHTML('b')}</div>
   <div style="margin-top:16px"><div class="eyebrow">Choose a photo for ${cmp.active==='a'?'the left':'the right'}</div>
   <div class="strip">${photos.map(p=>`<button data-pick="${p.id}" aria-pressed="${p.id===cmp[cmp.active]}">${ph(p)}<span>${esc(p.label)}<br><span class="muted" style="padding:0">${DMAP[p.dest].name}</span></span></button>`).join('')}</div></div>
   ${cmp.a&&cmp.b?`<div class="notice"><h2>What do you notice?</h2>
    <div class="choices">${[['same','Something similar'],['diff','Something different'],['both','Both']].map(([k,l])=>`<button class="choice" data-notice="${k}" aria-pressed="${cmp.notice===k}">${l}</button>`).join('')}</div>
    ${cmp.notice?`<div class="note">${follow[cmp.notice]}</div>`:''}
    <ul class="prompts">${['What is the same?','What is different?','Is each one natural or human-made?','What is each one for?','Why might these places be important to people?'].map(q=>`<li><span>${q}</span><button class="say" data-say="${q}" aria-label="Read aloud">${ICON.speak}</button></li>`).join('')}</ul>${facts}</div>`:''}`;
  if($('#factsBtn'))$('#factsBtn').onclick=()=>{cmp.facts=!cmp.facts;renderCompare();$('#factsBtn').focus()};
  hydrate();
  w.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{cmp.active=b.dataset.slot;renderCompare()});
  w.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{cmp[cmp.active]=b.dataset.pick;cmp.notice=null;cmp.facts=false;cmp.active=cmp.active==='a'?'b':'a';renderCompare()});
  w.querySelectorAll('[data-notice]').forEach(b=>b.onclick=()=>{cmp.notice=b.dataset.notice;renderCompare()});
}

/* ---------- Boot ---------- */
window.__WE={DESTS,getPano};
choose('paris');
if(photos.length){const last=photos[photos.length-1].dest;cur=DMAP[last];pano=getPano(last);$('#placeFlag').innerHTML=flag(cur.flag,'sm');$('#placeName').textContent=cur.name;$('#tabHunt').disabled=false}
addEventListener('hashchange',()=>{const n=Object.keys(HASH).find(k=>HASH[k]===location.hash.slice(1));if(n&&n!==screen)go(n)});
go(Object.keys(HASH).find(k=>HASH[k]===location.hash.slice(1))||'explore');
})();
</script>
