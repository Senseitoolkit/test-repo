<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classroom Displays</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Lexend:wght@400;500;600;700&display=swap">
<style>
:root{
  --bg:#fbf8ec; --panel:#ffffff; --ink:#1d2a36; --muted:#5f6b78; --line:#e6e0cc; --chip:#f2eedf;
  --accent:#2f6fdb; --accent-soft:#e3ecfb; --done:#2f9e5b;
  --f-display:"Bricolage Grotesque","Arial Rounded MT Bold",system-ui,sans-serif;
  --f-ui:"Lexend",system-ui,-apple-system,sans-serif;
  --shadow:0 1px 2px rgba(40,30,0,.06),0 6px 20px rgba(40,30,0,.06);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141a22; --panel:#1c2430; --ink:#eef2f7; --muted:#9aa8b8; --line:#2a3544; --chip:#232d3b;
  --accent-soft:#22324a; --done:#4cc985; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141a22; --panel:#1c2430; --ink:#eef2f7; --muted:#9aa8b8; --line:#2a3544; --chip:#232d3b;
  --accent-soft:#22324a; --done:#4cc985; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark }

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
[hidden]{display:none!important}

/* ---------- Home: pick a display ---------- */
.home{max-width:1100px;margin:0 auto;padding:36px 20px 48px}
.home h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,4.5vw,48px);margin:0 0 6px;letter-spacing:-.01em}
.home .sub{color:var(--muted);margin:0 0 26px;font-size:17px}
.sectionLbl{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:26px 0 12px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{all:unset;box-sizing:border-box;cursor:pointer;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 18px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;transition:transform .15s,border-color .15s;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--c)}
.card:hover{transform:translateY(-2px);border-color:var(--c)}
.card:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.card .ico{font-size:34px;line-height:1}
.card .t{font-family:var(--f-display);font-weight:800;font-size:21px;line-height:1.15}
.card .d{color:var(--muted);font-size:14px;line-height:1.4}
.optsHome{display:flex;flex-wrap:wrap;gap:10px}

/* option switches (shared) */
.sw{display:inline-flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:8px 14px 8px 8px;font-weight:500;font-size:15px}
.sw .knob{width:38px;height:22px;border-radius:999px;background:var(--chip);border:1px solid var(--line);position:relative;transition:background .15s}
.sw .knob::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s}
.sw[aria-pressed="true"] .knob{background:var(--accent);border-color:var(--accent)}
.sw[aria-pressed="true"] .knob::after{transform:translateX(16px)}

/* ---------- Display view ---------- */
.view{height:100vh;height:100dvh;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
.btn{background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:500;font-size:15px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.bar .name{flex:1 1 0;font-family:var(--f-display);font-weight:800;font-size:18px;margin-right:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.bar select{font:inherit;font-size:15px;background:var(--chip);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:8px 10px;max-width:220px}
.bar .opts{display:flex;gap:8px;flex-wrap:wrap}
.bar .sw{padding:6px 12px 6px 6px;font-size:14px}

.body{flex:1;min-height:0;display:flex;gap:18px;padding:18px}
.stage{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:auto;position:relative;border-top:10px solid var(--accent)}
.stage.frame{padding:0;overflow:hidden;border-top-width:0}
.stage iframe{border:0;width:100%;height:100%;display:block}
.inner{padding:clamp(20px,3.5vw,48px) clamp(20px,4vw,56px)}
.stage h2{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,4.6vw,64px);line-height:1.05;margin:0 0 10px;letter-spacing:-.01em;display:flex;align-items:center;gap:.35em}
.stage .intro{font-size:clamp(17px,1.7vw,24px);color:var(--muted);margin:0 0 18px;max-width:60ch;line-height:1.45}
.stage h3{font-family:var(--f-display);font-weight:800;font-size:clamp(20px,2.2vw,30px);margin:26px 0 10px;display:flex;align-items:center;gap:.4em}

.items{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:n}
.items.cols{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.item{display:flex;align-items:center;gap:18px;padding:14px 18px;border-radius:18px;background:var(--chip);border:2px solid transparent;font-size:clamp(20px,2.6vw,38px);font-weight:600;line-height:1.2;counter-increment:n;transition:background .2s,border-color .2s,opacity .2s}
.item .em{font-size:1.25em;line-height:1;flex:none;width:1.3em;text-align:center}
.item .txt{flex:1;min-width:0}
.item .txt small{display:block;font-weight:400;font-size:.62em;color:var(--muted);margin-top:4px;line-height:1.35}
.item .txt b{font-weight:700}
.items.numbered .item::before{content:counter(n);flex:none;width:1.5em;height:1.5em;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:.8em;font-weight:700}
.items.small .item{font-size:clamp(17px,1.9vw,27px)}
.items.plain .item{font-size:clamp(17px,1.6vw,23px);font-weight:400;padding:10px 16px}

/* checklist mode */
.check{flex:none;width:1.25em;height:1.25em;border-radius:.3em;border:3px solid var(--accent);display:grid;place-items:center;background:var(--panel);transition:background .15s}
.check svg{width:70%;height:70%;opacity:0;transform:scale(.4);transition:all .18s}
.checklist .item{cursor:pointer;user-select:none}
.checklist .item:hover{border-color:var(--accent)}
.checklist .item.done{background:color-mix(in srgb,var(--done) 14%,var(--panel));border-color:color-mix(in srgb,var(--done) 45%,transparent)}
.checklist .item.done .txt{text-decoration:line-through;text-decoration-thickness:3px;opacity:.6}
.checklist .item.done .check{background:var(--done);border-color:var(--done)}
.checklist .item.done .check svg{opacity:1;transform:scale(1)}
.checklist.numbered .item::before{display:none}
.progressRow{display:flex;align-items:center;gap:14px;margin:18px 0 0;font-weight:600;color:var(--muted)}
.progressRow .pb{flex:1;height:12px;border-radius:999px;background:var(--chip);overflow:hidden}
.progressRow .pb i{display:block;height:100%;background:var(--done);width:0;transition:width .3s}
.progressRow .btn{font-size:14px;padding:6px 12px}
.cheer{font-family:var(--f-display);font-weight:800;color:var(--done)}

.goal{margin-top:22px;padding:16px 20px;border-radius:18px;background:var(--accent-soft);font-size:clamp(17px,1.7vw,24px);line-height:1.45}
.goal b{font-family:var(--f-display)}

/* ---------- Side rail: date + timer ---------- */
.rail{width:clamp(250px,24vw,340px);flex:none;display:flex;flex-direction:column;gap:18px;min-height:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:20px}
.clock .time{font-family:var(--f-display);font-weight:800;font-size:clamp(40px,4.6vw,68px);line-height:1;font-variant-numeric:tabular-nums}
.clock .time small{font-size:.38em;margin-left:6px;color:var(--muted)}
.clock .day{font-family:var(--f-display);font-weight:800;font-size:clamp(22px,2.2vw,30px);margin-top:12px;color:var(--accent)}
.clock .date{font-size:clamp(16px,1.4vw,20px);color:var(--muted);margin-top:2px}
.timer .lbl{font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.timer .disp{font-family:var(--f-display);font-weight:800;font-size:clamp(52px,5.6vw,84px);line-height:1;font-variant-numeric:tabular-nums;margin:6px 0 12px;text-align:center}
.ring{position:relative;width:100%;max-width:220px;margin:6px auto 0;aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{stroke:var(--chip)}
.ring .arc{stroke:var(--accent);transition:stroke-dashoffset .25s linear,stroke .3s}
.ring .disp{position:absolute;inset:0;display:grid;place-items:center;margin:0;font-size:clamp(40px,4.2vw,60px)}
.timer.warn .arc{stroke:#e8902a}
.timer.done .arc{stroke:#e5484d}
.timer.done .disp{color:#e5484d;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.tpre{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.tpre button,.tctl button{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:8px 4px;font-size:14px;font-weight:500}
.tpre button:hover,.tctl button:hover{border-color:var(--accent)}
.tctl{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px}
.tctl .go{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

/* full screen: hide chrome except a tiny floating button */
.fsExit{position:fixed;right:14px;bottom:14px;z-index:5;opacity:.25;transition:opacity .2s}
.fsExit:hover{opacity:1}
body.fs .bar{display:none}

/* ---------- Noise detector ---------- */
.noise{position:fixed;left:14px;bottom:14px;z-index:6;width:230px;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 4px 24px rgba(0,0,0,.18);padding:12px 14px;font-size:14px;transition:border-color .2s,box-shadow .2s}
.noise.loud{border-color:#e8902a;box-shadow:0 0 0 4px rgba(232,144,42,.25),0 4px 24px rgba(0,0,0,.18)}
.noise .thr.hi{background:#e5484d;opacity:1}
.noise .cap{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:8px 0 6px}
.noise .lvls{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:8px}
.noise .lvls button{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:5px 0 4px;font-size:11px;line-height:1.15;display:flex;flex-direction:column;align-items:center;gap:2px}
.noise .lvls button b{font-size:17px;font-weight:400}
.noise .lvls button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.noise.mini .lvls,.noise.mini .cap{display:none}
.noise.vloud{border-color:#e5484d;box-shadow:0 0 0 6px rgba(229,72,77,.35),0 4px 24px rgba(0,0,0,.18)}
.stop{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:#d92d33;color:#fff;animation:flash 1s steps(1) infinite;cursor:pointer}
@keyframes flash{50%{background:#9e1218}}
.stop .sbox{text-align:center;padding:24px}
.stop .big{font-size:clamp(110px,18vw,240px);line-height:1;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.stop .h{font-family:var(--f-display);font-weight:800;font-size:clamp(44px,8vw,120px);line-height:1;margin:16px 0 12px;letter-spacing:-.01em}
.stop .s{font-size:clamp(22px,3vw,44px);font-weight:600}
.stop .tap{margin-top:24px;font-size:16px;opacity:.75}
.noise .spk{margin-top:6px;color:var(--ink);cursor:pointer}
.noise .spk input{accent-color:var(--accent)}
.noise .nh{display:flex;align-items:center;gap:8px;font-weight:600}
.noise .face{font-size:30px;line-height:1;margin-left:auto}
.noise .meter{position:relative;height:18px;border-radius:999px;background:var(--chip);overflow:hidden;margin:10px 0 6px;border:1px solid var(--line)}
.noise .fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:999px;background:linear-gradient(90deg,#2f9e5b 0%,#2f9e5b 45%,#e8b02a 65%,#e5484d 90%);background-size:230px 100%;transition:width .08s linear}
.noise .thr{position:absolute;top:-2px;bottom:-2px;width:4px;background:#e8b02a;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.noise .row{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.noise input[type=range]{flex:1;min-width:0;width:100%;accent-color:var(--accent)}
.noise .row span{font-size:12px}
.noise .msg{color:var(--muted);font-size:13px;margin-top:6px;line-height:1.35}
.noise .msg button{margin-top:6px}
.noise .min{all:unset;cursor:pointer;color:var(--muted);font-size:13px;padding:0 4px}
.noise.mini{width:auto;padding:8px 12px}
.noise.mini .meter{width:140px;margin:6px 0 0}
.noise.mini .row,.noise.mini .msg,.noise.mini .nt{display:none!important}
.shh{position:fixed;inset:0;z-index:7;display:grid;place-items:center;background:rgba(30,40,80,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fadeIn .25s}
.shh .box{background:var(--panel);border:6px solid #8fb3f0;border-radius:32px;padding:clamp(24px,4vw,48px) clamp(28px,5vw,64px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);max-width:min(90vw,820px);animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.shh .big{font-size:clamp(70px,10vw,140px);line-height:1;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.shh .h{font-family:var(--f-display);font-weight:800;font-size:clamp(34px,5.5vw,76px);line-height:1.05;margin:12px 0 8px;color:#3f63b8}
:root[data-theme=dark] .shh .h{color:#9dbcff}
@media (prefers-color-scheme: dark){:root:not([data-theme=light]) .shh .h{color:#9dbcff}}
.shh .s{font-size:clamp(18px,2.2vw,30px);color:var(--ink)}
@keyframes fadeIn{from{opacity:0}}
@keyframes pop{from{transform:scale(.7);opacity:0}}

@media (max-width:820px){
  .body{flex-direction:column;padding:12px;gap:12px;overflow:auto}
  .stage{flex:none;min-height:60vh}
  .rail{width:auto;flex-direction:row;flex-wrap:wrap}
  .rail .panel{flex:1 1 240px}
  .bar .name{flex-basis:100%;order:-1}
}
</style>
</head>
<body>

<!-- HOME -->
<div class="home" id="home">
  <h1>Classroom Displays</h1>
  <p class="sub">Pick a display for what's happening now. Turn on the extras you want beside it.</p>

  <div class="sectionLbl">Extras</div>
  <div class="optsHome" id="optsHome"></div>

  <div class="sectionLbl">Displays</div>
  <div class="cards" id="cards"></div>
</div>

<!-- DISPLAY VIEW -->
<div class="view" id="view" hidden>
  <header class="bar">
    <button class="btn" id="back">← All displays</button>
    <select id="jump" aria-label="Switch display"></select>
    <div class="name" id="vname"></div>
    <div class="opts" id="optsBar"></div>
    <button class="btn primary" id="fs">Full screen</button>
  </header>
  <div class="body">
    <section class="stage" id="stage" aria-live="polite"></section>
    <aside class="rail" id="rail">
      <div class="panel clock" id="clockPanel">
        <div class="time" id="cTime">--:--</div>
        <div class="day" id="cDay"></div>
        <div class="date" id="cDate"></div>
      </div>
      <div class="panel timer" id="timerPanel">
        <div class="lbl" id="tLbl">Timer</div>
        <div class="ring">
          <svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52" fill="none" stroke-width="12"/><circle class="arc" id="tArc" cx="60" cy="60" r="52" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="326.73" stroke-dashoffset="0"/></svg>
          <div class="disp" id="tDisp">05:00</div>
        </div>
        <div class="tpre">
          <button data-min="1">1 min</button><button data-min="2">2 min</button><button data-min="5">5 min</button>
          <button data-min="10">10 min</button><button data-min="15">15 min</button><button data-min="20">20 min</button>
        </div>
        <div class="tctl"><button id="tPlus">+1 min</button><button class="go" id="tGo">Start</button><button id="tReset">Reset</button></div>
      </div>
    </aside>
  </div>
</div>
<button class="btn fsExit" id="fsExit" hidden>Exit full screen</button>

<div class="noise" id="noise" hidden aria-live="polite">
  <div class="nh"><span class="nt">🔊 Noise level</span><span class="face" id="nFace">🙂</span><button class="min" id="nMin" title="Make smaller">–</button></div>
  <div class="meter" aria-hidden="true"><div class="fill" id="nFill"></div><div class="thr" id="nThr" title="Gentle reminder"></div><div class="thr hi" id="nThr2" title="Very loud signal"></div></div>
  <div class="cap nt">Allowed voice level</div>
  <div class="lvls" id="nLvls" role="group" aria-label="Allowed voice level"></div>
  <div class="row"><span>Stricter</span><input type="range" id="nSens" min="15" max="90" step="1" aria-label="Fine-tune the reminder point"><span>Looser</span></div>
  <label class="row spk"><input type="checkbox" id="nSpeak"> Say reminders out loud</label>
  <div class="msg" id="nMsg"></div>
</div>
<div class="shh" id="shh" hidden role="alert">
  <div class="box"><div class="big" id="shhE">🌙</div><div class="h" id="shhH"></div><div class="s" id="shhS"></div></div>
</div>
<div class="stop" id="stop" hidden role="alert">
  <div class="sbox"><div class="big">✋</div><div class="h">Too loud — let’s pause</div><div class="s">Voices off, eyes on the teacher. Thank you!</div><div class="tap">Tap anywhere to close</div></div>
</div>

  const [em, title, sub] = it;
  const done = S.opts.check && S.ticks[key] && S.ticks[key][i];
  return `<li class="item${done ? ' done' : ''}" data-i="${i}"${S.opts.check ? ' role="checkbox" tabindex="0" aria-checked="' + !!done + '"' : ''}>
    ${S.opts.check ? CHECK : ''}<span class="em">${em}</span>
    <span class="txt">${title}${sub ? `<small>${sub}</small>` : ''}</span></li>`;
}
function list(items, key, cls){
  const ck = S.opts.check ? ' checklist' : '';
  return `<ul class="items ${cls}${ck}" data-key="${key}">${items.map((it,i) => itemHTML(it,i,key)).join('')}</ul>` +
    (S.opts.check ? `<div class="progressRow" data-for="${key}"><span class="pt"></span><span class="pb"><i></i></span><button class="btn" data-reset="${key}">Clear ticks</button></div>` : '');
}

function render(){
  const d = cur, st = $('stage');
  document.documentElement.style.setProperty('--accent', d.color);
  $('vname').textContent = d.icon + '  ' + d.title;
  jump.value = d.id;

  if (d.style === 'frame'){
    st.className = 'stage frame';
    if (!st.querySelector('iframe')){
      st.innerHTML = '';
      const f = document.createElement('iframe');
      f.title = d.title; f.setAttribute('allow', 'fullscreen');
      f.srcdoc = new TextDecoder().decode(Uint8Array.from(atob(MATH_B64), c => c.charCodeAt(0)));
      st.appendChild(f);
    }
    return;
  }
  st.className = 'stage';
  let h = `<div class="inner"><h2><span>${d.icon}</span>${d.title}</h2>`;
  if (d.style === 'makeup'){
    h += `<p class="intro">${d.intro}</p>`;
    h += `<h3>✅ Goals to complete</h3><p class="intro" style="margin-bottom:12px">Work through these in order${S.opts.check ? ' and tick each one off as you finish' : ''}.</p>`;
    h += list(d.items, d.id, 'numbered small');
    h += `<h3>🧠 Expectations</h3>`;
    h += `<ul class="items plain">${d.expect.map(([e,t]) => `<li class="item"><span class="em">${e}</span><span class="txt">${t}</span></li>`).join('')}</ul>`;
    h += `<div class="goal"><b>🎯 Goal:</b> ${d.goal}</div>`;
  } else {
    h += list(d.items, d.id, d.style);
  }
  h += '</div>';
  st.innerHTML = h;
  updateProgress();
}

function updateProgress(){
  document.querySelectorAll('.progressRow').forEach(r => {
    const key = r.dataset.for, ul = document.querySelector(`.items[data-key="${key}"]`);
    const total = ul.children.length, n = ul.querySelectorAll('.done').length;
    r.querySelector('.pb i').style.width = (100*n/total) + '%';
    r.querySelector('.pt').innerHTML = n === total ? '<span class="cheer">All done! 🎉</span>' : `${n} of ${total} done`;
  });
}

$('stage').addEventListener('click', e => {
  const rs = e.target.closest('[data-reset]');
  if (rs){ delete S.ticks[rs.dataset.reset]; save(); render(); return; }
  const li = e.target.closest('.checklist .item'); if (!li) return;
  toggleItem(li);
});
$('stage').addEventListener('keydown', e => {
  const li = e.target.closest('.checklist .item');
  if (li && (e.key === ' ' || e.key === 'Enter')){ e.preventDefault(); toggleItem(li); }
});
function toggleItem(li){
  const key = li.parentElement.dataset.key, i = +li.dataset.i;
  S.ticks[key] = S.ticks[key] || {};
  S.ticks[key][i] = !S.ticks[key][i];
  li.classList.toggle('done', S.ticks[key][i]);
  li.setAttribute('aria-checked', S.ticks[key][i]);
  save(); updateProgress();
}

function applyOpts(){
  $('clockPanel').hidden = !S.opts.date;
  $('timerPanel').hidden = !S.opts.timer;
  $('rail').hidden = !S.opts.date && !S.opts.timer;
  if (cur) render();
}

function open(id){
  cur = DISPLAYS.find(d => d.id === id) || DISPLAYS[0];
  S.last = cur.id; save();
  $('home').hidden = true; $('view').hidden = false;
  if (cur.style !== 'frame'){ const f = $('stage').querySelector('iframe'); if (f) f.remove(); }
  applyOpts();
  history.replaceState(null, '', '#' + cur.id);
}
function goHome(){
  if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  $('view').hidden = true; $('home').hidden = false;
  const f = $('stage').querySelector('iframe'); if (f) f.remove();
  document.documentElement.style.removeProperty('--accent');
  history.replaceState(null, '', location.pathname + location.search);
}
$('back').onclick = goHome;

/* full screen */
$('fs').onclick = async () => {
  try { await document.documentElement.requestFullscreen(); } catch(e){}
  document.body.classList.add('fs'); $('fsExit').hidden = false;
};
$('fsExit').onclick = () => { if (document.fullscreenElement) document.exitFullscreen().catch(()=>{}); leaveFs(); };
function leaveFs(){ document.body.classList.remove('fs'); $('fsExit').hidden = true; }
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement) leaveFs(); });

/* keyboard: ← → switch displays, Esc to the menu */
addEventListener('keydown', e => {
  if ($('view').hidden || e.target.matches('input,select,textarea')) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
    const i = DISPLAYS.indexOf(cur), n = DISPLAYS.length;
    open(DISPLAYS[(i + (e.key === 'ArrowRight' ? 1 : -1) + n) % n].id);
  } else if (e.key === 'Escape' && !document.body.classList.contains('fs')) goHome();
});

/* ---------- Clock ---------- */
function tick(){
  const d = new Date();
  let h = d.getHours(); const ap = h < 12 ? 'AM' : 'PM'; h = h % 12 || 12;
  $('cTime').innerHTML = `${h}:${String(d.getMinutes()).padStart(2,'0')}<small>${ap}</small>`;
  $('cDay').textContent = d.toLocaleDateString(undefined, {weekday:'long'});
  $('cDate').textContent = d.toLocaleDateString(undefined, {day:'numeric', month:'long', year:'numeric'});
}
tick(); setInterval(tick, 1000);

/* ---------- Timer ---------- */
const C = 326.73;
let set = 300, left = 300, running = false, endAt = 0, iv = null;
const fmt = s => { s = Math.max(0, Math.ceil(s)); return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); };
function draw(){
  $('tDisp').textContent = fmt(left);
  $('tArc').style.strokeDashoffset = C * (1 - (set ? Math.max(0, left/set) : 0));
  $('tGo').textContent = running ? 'Pause' : (left < set && left > 0 ? 'Resume' : 'Start');
  $('tLbl').textContent = left <= 0 ? "Time's up!" : running ? 'Counting down' : 'Timer';
  $('timerPanel').classList.toggle('warn', running && left <= 60 && left > 0);
}
function chime(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, .35, .7].forEach(o => {
      const os = ctx.createOscillator(), g = ctx.createGain();
      os.frequency.value = 880; os.type = 'sine';
      g.gain.setValueAtTime(0, ctx.currentTime + o);
      g.gain.linearRampToValueAtTime(.25, ctx.currentTime + o + .02);
      g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + o + .3);
      os.connect(g).connect(ctx.destination); os.start(ctx.currentTime + o); os.stop(ctx.currentTime + o + .32);
    });
  } catch(e){}
}
function step(){
  left = (endAt - Date.now()) / 1000;
  if (left <= 0){ left = 0; running = false; clearInterval(iv); $('timerPanel').classList.add('done'); chime(); }
  draw();
}
function start(){ if (left <= 0) left = set; $('timerPanel').classList.remove('done'); running = true; endAt = Date.now() + left*1000; clearInterval(iv); iv = setInterval(step, 200); draw(); }
function pause(){ running = false; clearInterval(iv); draw(); }
function setMin(m){ pause(); set = left = m*60; $('timerPanel').classList.remove('done'); draw(); }
document.querySelectorAll('.tpre [data-min]').forEach(b => b.onclick = () => setMin(+b.dataset.min));
$('tPlus').onclick = () => { left += 60; set = Math.max(set, left); if (running) endAt += 60000; $('timerPanel').classList.remove('done'); draw(); };
$('tGo').onclick = () => running ? pause() : start();
$('tReset').onclick = () => { pause(); left = set; $('timerPanel').classList.remove('done'); draw(); };
draw();

/* ---------- Noise detector ---------- */
// Two alert points: a gentle "mind the volume" reminder, and a very clear signal when it's far above.
const LEVELS = [
  {id:0, em:'🤐', name:'Silent',  thr:22},
  {id:1, em:'🤫', name:'Whisper', thr:38},
  {id:2, em:'👥', name:'Partner', thr:52},
  {id:3, em:'🗣️', name:'Group',   thr:64},
  {id:4, em:'📣', name:'Outside', thr:80},
];
const GAP = 20;  // very-loud point sits this far above the gentle point
const PHRASES = [
  ['🎚️','Let’s mind the volume','Bring your voices down a little — thank you!', 'Friends, let’s mind the volume. Bring your voices down a little. Thank you!'],
  ['🌙','Let’s bring our voices down','Thank you for using your quiet voices.', 'Let’s bring our voices down a little. Thank you for using your quiet voices.'],
  ['💛','Indoor voices, friends','Let’s keep our classroom calm and cozy.', 'Indoor voices, friends. Let’s keep our classroom calm and cozy.'],
  ['🌬️','Let’s take a deep breath together','Breathe in… and out. Thank you!', 'Let’s take a deep breath together. Breathe in, and out. Thank you!'],
  ['⭐','You’re doing great','Let’s just turn our voices down a little.', 'You’re doing great, everyone. Let’s just turn our voices down a little.'],
];
const STOP_SAY = 'Everyone, please pause. Voices off, and eyes on the teacher. Thank you.';

function speak(text){
  if (!S.speak || !('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 0.9; u.pitch = 1.1; u.volume = 0.9;
    const vs = speechSynthesis.getVoices();
    const v = vs.find(v => /samantha|google us english|aria|jenny|zira|female/i.test(v.name) && /^en/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang));
    if (v) u.voice = v;
    speechSynthesis.speak(u);
  } catch(e){}
}
if ('speechSynthesis' in window) speechSynthesis.getVoices();
function bell(){ // attention chime for the very-loud signal
  try {
    const c = actx || new (window.AudioContext || window.webkitAudioContext)();
    [0, .45].forEach((o, i) => {
      const os = c.createOscillator(), g = c.createGain();
      os.type = 'triangle'; os.frequency.value = i ? 784 : 1047;
      g.gain.setValueAtTime(0, c.currentTime + o);
      g.gain.linearRampToValueAtTime(.4, c.currentTime + o + .02);
      g.gain.exponentialRampToValueAtTime(.001, c.currentTime + o + .8);
      os.connect(g).connect(c.destination); os.start(c.currentTime + o); os.stop(c.currentTime + o + .85);
    });
  } catch(e){}
}

let actx = null, stream = null, an = null, buf = null, raf = 0, lvl = 0, last = 0;
let score1 = 0, score2 = 0, shownAt = 0, stopAt = 0, phrase = 0, cool = 0;
const nEl = $('noise'), sens = $('nSens');
if (S.level == null) S.level = 2;
const hiThr = () => Math.min(97, S.sens + GAP);
function drawThr(){
  $('nThr').style.left = `calc(${S.sens}% - 1px)`;
  $('nThr2').style.left = `calc(${hiThr()}% - 1px)`;
  sens.value = S.sens;
  document.querySelectorAll('#nLvls button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.l === S.level));
}
LEVELS.forEach(L => {
  const b = document.createElement('button');
  b.dataset.l = L.id; b.title = L.name + ' voices are OK';
  b.innerHTML = `<b>${L.em}</b>${L.name}`;
  b.onclick = () => { S.level = L.id; S.sens = L.thr; save(); drawThr(); };
  $('nLvls').appendChild(b);
});
drawThr();
sens.oninput = () => { S.sens = +sens.value; const m = LEVELS.find(L => L.thr === S.sens); S.level = m ? m.id : -1; drawThr(); save(); };
$('nSpeak').checked = S.speak !== false; S.speak = $('nSpeak').checked;
$('nSpeak').onchange = () => { S.speak = $('nSpeak').checked; save(); };
nEl.classList.toggle('mini', !!S.mini);
$('nMin').textContent = S.mini ? '+' : '–';
$('nMin').onclick = () => { S.mini = !S.mini; nEl.classList.toggle('mini', S.mini); $('nMin').textContent = S.mini ? '+' : '–'; save(); };

const HINT = 'Listening through this computer’s microphone. Yellow line: gentle reminder. Red line: stop signal.';
function msg(html){ $('nMsg').innerHTML = html; }
async function noiseStart(){
  nEl.hidden = false;
  if (stream) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    msg('This browser can’t use the microphone here. Open the file in Chrome or Edge.'); return;
  }
  msg('Asking to use the microphone…');
  try {
    stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false, noiseSuppression:false, autoGainControl:false}});
  } catch(e){
    stream = null;
    msg('Microphone blocked. Allow mic access (icon in the address bar), then<br><button class="btn" id="nRetry">Try again</button>');
    $('nRetry').onclick = noiseStart; return;
  }
  actx = new (window.AudioContext || window.webkitAudioContext)();
  const src = actx.createMediaStreamSource(stream);
  an = actx.createAnalyser(); an.fftSize = 2048; buf = new Float32Array(an.fftSize);
  src.connect(an);
  if (actx.state === 'suspended'){
    msg('<button class="btn" id="nGo">Tap to start listening</button>');
    $('nGo').onclick = () => actx.resume().then(() => msg(HINT));
  } else msg(HINT);
  last = performance.now(); loop();
}
function noiseStop(){
  cancelAnimationFrame(raf);
  if (stream) stream.getTracks().forEach(t => t.stop());
  if (actx) actx.close().catch(()=>{});
  stream = actx = an = null; lvl = score1 = score2 = 0;
  nEl.hidden = true; $('shh').hidden = true; $('stop').hidden = true; nEl.classList.remove('loud','vloud');
}
function noiseSet(on){ on ? noiseStart() : noiseStop(); }

function loop(){
  raf = requestAnimationFrame(loop);
  if (!an) return;
  const now = performance.now(), dt = Math.min(.1, (now - last) / 1000); last = now;
  an.getFloatTimeDomainData(buf);
  let sum = 0; for (let i = 0; i < buf.length; i++) sum += buf[i]*buf[i];
  const db = 20 * Math.log10(Math.sqrt(sum / buf.length) + 1e-8);
  const target = Math.max(0, Math.min(100, (db + 60) * 2));    // about -60 dB → 0, -10 dB → 100
  lvl += (target - lvl) * (1 - Math.exp(-dt / (target > lvl ? 0.06 : 0.9)));  // rise fast, fall over ~1 s so chatter reads as steady
  $('nFill').style.width = lvl + '%';
  const t1 = S.sens, t2 = hiThr();
  $('nFace').textContent = lvl > t2 ? '😫' : lvl > t1 ? '😣' : lvl > t1 - 12 ? '😐' : '🙂';
  nEl.classList.toggle('loud', lvl > t1 && lvl <= t2);
  nEl.classList.toggle('vloud', lvl > t2);

  // "loudness scores" build up while over a line and drain while under, so ordinary chatter gaps don't reset them
  score1 = Math.max(0, score1 + (lvl > t1 ? dt : -dt * .35));
  score2 = Math.max(0, score2 + (lvl > t2 ? dt : -dt * .8));
  if (cool > 0) cool -= dt;

  const shh = $('shh'), stop = $('stop');
  if (score2 > 0.8 && stop.hidden && cool <= 0){
    shh.hidden = true; stop.hidden = false; stopAt = now; bell(); setTimeout(() => speak(STOP_SAY), 900);
  } else if (score1 > 1.2 && shh.hidden && stop.hidden && cool <= 0){
    const [e, h, s, say] = PHRASES[phrase++ % PHRASES.length];
    $('shhE').textContent = e; $('shhH').textContent = h; $('shhS').textContent = s;
    shh.hidden = false; shownAt = now; speak(say);
  }
  // reminders stay up a few seconds, then leave once the room is calmer
  if (!shh.hidden && now - shownAt > 5000 && lvl < t1 - 4){ shh.hidden = true; score1 = 0; cool = 3; }
  if (!stop.hidden && now - stopAt > 6000 && lvl < t1){ stop.hidden = true; score1 = score2 = 0; cool = 4; }
}
$('shh').onclick = () => { $('shh').hidden = true; score1 = 0; cool = 4; };
$('stop').onclick = () => { $('stop').hidden = true; score1 = score2 = 0; cool = 5; };
if (S.opts.noise) noiseStart();

/* open straight to a display if the link names one */
const h = location.hash.slice(1);
if (DISPLAYS.some(d => d.id === h)) open(h);
})();
</script>
</body>
</html>
