<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Twenty-Four Paychecks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a bank statement on check-security paper. Status strip on top, statement sheet left, ledger sidebar right. */
:root{
  --paper:#E2EDE6; --guil:rgba(18,92,68,.075); --sheet:#FBFDFC; --ink:#11281F; --muted:#557067;
  --line:#C5D7CD; --chip:#E3EEE8; --money:#1B7A4B; --debt:#B4372A; --stamp:#C9442D; --warn:#A5660E; --accent:#0E5A47;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Helvetica Neue",Arial,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0C1714; --guil:rgba(130,215,180,.045); --sheet:#14231E; --ink:#E2EFE8; --muted:#8FA9A0;
  --line:#2A3F37; --chip:#1B2E28; --money:#5CC98F; --debt:#F07B67; --stamp:#F0654C; --warn:#E2A847; --accent:#86D6B8; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0C1714; --guil:rgba(130,215,180,.045); --sheet:#14231E; --ink:#E2EFE8; --muted:#8FA9A0;
  --line:#2A3F37; --chip:#1B2E28; --money:#5CC98F; --debt:#F07B67; --stamp:#F0654C; --warn:#E2A847; --accent:#86D6B8; color-scheme:dark}

*{box-sizing:border-box}
body{background-color:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:repeating-radial-gradient(circle at 18% 22%,transparent 0 15px,var(--guil) 15px 16px),
                   repeating-radial-gradient(circle at 82% 78%,transparent 0 15px,var(--guil) 15px 16px);}
.wrap{max-width:1200px;margin:0 auto;padding-block:22px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.pos{color:var(--money)} .neg{color:var(--debt)}

/* header */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
h1{font-family:var(--f-display);font-weight:800;font-size:clamp(30px,5.4vw,50px);letter-spacing:-.025em;line-height:.95;margin:4px 0 0}
.tickwrap{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.ticks{display:grid;grid-template-columns:repeat(24,9px);gap:3px}
.ticks i{height:24px;border:1px solid var(--line);background:var(--sheet);border-radius:1px}
.ticks i.done{background:var(--ink);border-color:var(--ink)}
.ticks i.now{background:var(--stamp);border-color:var(--stamp)}

/* stats strip */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(138px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:18px}
.stat{background:var(--sheet);padding:10px 12px;min-width:0}
.stat .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:18px;font-weight:600;margin-top:2px;white-space:nowrap}
.stat.debt .v{color:var(--debt)}
.stat.nw{background:var(--ink);color:var(--sheet)}
.stat.nw .eyebrow{color:var(--sheet);opacity:.7}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;margin-top:18px;align-items:start}
@media (max-width:920px){.grid{grid-template-columns:minmax(0,1fr)}}

/* phase steps */
.steps{display:flex;overflow-x:auto;gap:2px;margin-bottom:10px}
.steps span{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:8px 10px;border-bottom:2px solid var(--line);color:var(--muted);white-space:nowrap}
.steps span.on{color:var(--ink);border-color:var(--stamp);font-weight:600}
.steps span.done{color:var(--ink)}

/* statement sheet */
.sheet{background:var(--sheet);border:1px solid var(--line);position:relative;padding:30px clamp(16px,4vw,36px) 32px;min-width:0}
.sheet::before{content:"";position:absolute;top:-6px;left:0;right:0;height:12px;background:radial-gradient(circle at 7px 6px,var(--paper) 3.6px,transparent 4.2px) repeat-x;background-size:14px 12px}
h2{font-family:var(--f-display);font-weight:700;font-size:clamp(24px,3.4vw,32px);letter-spacing:-.015em;line-height:1.1;margin:6px 0 8px;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:700;font-size:18px;margin:24px 0 8px}
.lede{color:var(--muted);max-width:62ch;margin:0 0 18px}
.notice{font-size:13px;background:var(--chip);padding:8px 12px;margin:0 0 14px;border-radius:2px}
.row-actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px}
.primary{background:var(--accent);color:var(--sheet);border:0;border-radius:3px;padding:12px 20px;font-family:var(--f-display);font-weight:700;font-size:16px}
.primary:disabled{opacity:.4;cursor:not-allowed}
.ghost{background:transparent;border:1px solid var(--line);border-radius:3px;padding:10px 14px;font-size:14px}
.ghost:hover{border-color:var(--ink)}
.hint{font-size:13px;color:var(--muted)}
.hint.warn{color:var(--warn)}

/* pay stub */
.stub{border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:6px 0;max-width:520px}
.stub div{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px}
.stub div span:first-child{font-family:var(--f-body);font-size:14px}
.stub .sub{color:var(--muted);font-size:13px}
.stub .total{border-top:3px double var(--line);margin-top:4px;padding-top:9px;font-weight:600;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line);background:transparent;padding:6px 12px;border-radius:999px;font-family:var(--f-mono);font-size:13px}
.chip.on{background:var(--ink);color:var(--sheet);border-color:var(--ink)}

/* bills */
.bill{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 14px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--line)}
.bill-name{font-weight:600}
.bill-note{font-size:13px;color:var(--muted)}
.bill-amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.bill.skip .bill-name,.bill.skip .bill-amt{text-decoration:line-through;color:var(--muted)}
.bill .chips{margin:6px 0 0}
.bill .chip{padding:3px 10px;font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{border:0;background:transparent;padding:6px 10px;font-family:var(--f-mono);font-size:12px}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--ink);color:var(--sheet)}
.seg button:disabled{opacity:.3;cursor:not-allowed}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font-size:13px}
@media (max-width:560px){.bill{grid-template-columns:minmax(0,1fr) auto}.bill .seg{grid-column:1/-1;justify-self:start}}
.tally{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:18px}
.tally div{background:var(--sheet);padding:10px 12px}
.tally .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:17px;font-weight:600}

/* events */
.choices{display:grid;gap:8px;margin-top:18px}
.choice{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;text-align:left;background:transparent;border:1px solid var(--line);border-radius:3px;padding:14px 16px}
.choice:hover:not(:disabled){border-color:var(--ink);background:var(--chip)}
.choice:disabled{opacity:.4;cursor:not-allowed}
.choice b{font-weight:600}
.choice .note{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.receipt{border:1px dashed var(--line);padding:16px 18px;margin-top:16px;background:var(--chip)}
.lesson{margin-top:16px;padding:16px 18px;border:1px solid var(--line)}
.lesson .term{font-family:var(--f-display);font-weight:700;font-size:20px;margin:4px 0}
.lesson p{margin:0;max-width:62ch}

/* allocate */
.leftbox{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px;padding:14px 16px;background:var(--chip);margin-bottom:6px}
.leftbox .v{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:26px;font-weight:600}
.arow{display:grid;grid-template-columns:minmax(0,1fr) 96px 178px;gap:6px 14px;align-items:center;padding:11px 0;border-bottom:1px dashed var(--line)}
.aname{font-weight:600}
.asub{font-size:13px;color:var(--muted)}
.abal{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted);text-align:right}
.astep{display:flex;justify-content:flex-end}
.astep button{width:38px;height:38px;border:1px solid var(--line);background:transparent;font-size:18px;line-height:1}
.astep button:first-child{border-radius:3px 0 0 3px}.astep button:last-child{border-radius:0 3px 3px 0}
.astep input{width:96px;height:38px;border:1px solid var(--line);border-left:0;border-right:0;background:var(--sheet);color:var(--ink);text-align:right;padding:0 8px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:15px}
.astep input.in{color:var(--money)} .astep input.out{color:var(--debt)}
@media (max-width:560px){.arow{grid-template-columns:minmax(0,1fr) auto}.astep{grid-column:1/-1;justify-content:flex-start}}
.plan{font-size:13px;margin:10px 0 0;padding-left:18px;color:var(--muted)}

/* statement */
.ledger{max-width:560px}
.ledger div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dotted var(--line)}
.ledger div span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.ledger .tot{border-bottom:0;border-top:3px double var(--line);font-weight:600;padding-top:9px;margin-top:4px}
.twocol{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.stamp{position:absolute;top:26px;right:clamp(16px,4vw,36px);border:3px solid var(--stamp);color:var(--stamp);font-family:var(--f-display);font-weight:800;font-size:26px;letter-spacing:.08em;padding:2px 12px;border-radius:4px;transform:rotate(-14deg);opacity:.85;animation:stamp .5s cubic-bezier(.3,1.6,.5,1) both;pointer-events:none}
.stamp.paid{border-color:var(--money);color:var(--money)}
@keyframes stamp{0%{transform:rotate(-14deg) scale(1.9);opacity:0}100%{transform:rotate(-14deg) scale(1);opacity:.85}}
.quiz{margin-top:24px;padding:16px 18px;border:1px solid var(--ink)}
.quiz .q{font-weight:600;margin:6px 0 10px;max-width:62ch}
.qopts{display:grid;gap:6px}
.qopts button{text-align:left;background:transparent;border:1px solid var(--line);border-radius:3px;padding:10px 12px}
.qopts button:hover:not(:disabled){border-color:var(--ink)}
.qopts button.right{border-color:var(--money);color:var(--money);font-weight:600}
.qopts button.wrong{border-color:var(--debt);color:var(--debt);text-decoration:line-through}
.qopts button:disabled{cursor:default}
.qexp{font-size:14px;margin:10px 0 0;max-width:62ch}

/* intro + final */
.startgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin:6px 0 8px}
.startgrid div{background:var(--sheet);padding:10px 12px}
.startgrid .v{font-family:var(--f-mono);font-size:18px;font-weight:600}
.slist{margin:0;padding-left:18px;max-width:62ch}
.slist li{margin:4px 0}
.grade{font-family:var(--f-display);font-weight:800;font-size:96px;line-height:1;color:var(--stamp)}
.future{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:30px;font-weight:600;color:var(--money)}

/* sidebar */
.side{display:grid;gap:12px;min-width:0}
.panel{background:var(--sheet);border:1px solid var(--line);padding:14px 16px;min-width:0}
.panel .big{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;line-height:1.2;margin-top:2px}
.panel canvas{width:100%;height:140px;display:block;margin-top:8px}
.bar{position:relative;height:8px;border-radius:4px;margin:12px 0 4px}
.bar.cs{background:linear-gradient(to right,var(--debt) 0 50.9%,var(--warn) 50.9% 67.3%,var(--money) 67.3% 100%)}
.bar.mood{background:var(--chip);border:1px solid var(--line)}
.bar.mood b{position:absolute;inset:0 auto 0 0;border-radius:4px;background:var(--accent)}
.bar i{position:absolute;top:-5px;width:4px;height:18px;margin-left:-2px;background:var(--ink);border-radius:2px;transition:left .5s}
.scale{position:relative;height:14px;font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.scale span{position:absolute;transform:translateX(-50%)}
.scale span:first-child{transform:none}.scale span:last-child{transform:translateX(-100%)}
.band{font-family:var(--f-mono);font-size:12px;margin-left:8px;color:var(--muted)}
.notebook details{border-top:1px dashed var(--line);padding:8px 0}
.notebook summary{cursor:pointer;font-weight:600;font-size:14px}
.notebook summary span{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-left:6px}
.notebook p{margin:6px 0 0;font-size:13px;color:var(--muted)}
footer{margin-top:28px;font-size:12px;color:var(--muted);max-width:70ch}
/* full-screen mode: everything fits the viewport; panels scroll inside, the main action stays pinned */
.fitbtn{display:inline-flex;align-items:center;gap:6px;background:var(--sheet);border:1px solid var(--line);border-radius:3px;padding:6px 10px;font-family:var(--f-mono);font-size:12px}
.fitbtn:hover{border-color:var(--ink)}
.fitbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}
html.fit .cta{position:sticky;bottom:0;z-index:3;background:var(--sheet);margin:22px calc(-1*clamp(16px,4vw,36px)) 0;padding:12px clamp(16px,4vw,36px) calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
html.fit .sheet{padding-bottom:0}
html.fit footer{display:none}
@media (min-width:921px){
  html.fit,html.fit body{height:100%}
  html.fit body{overflow:hidden}
  html.fit .wrap{height:100%;display:flex;flex-direction:column;max-width:1500px;padding-block:12px}
  html.fit .top{flex:none}
  html.fit h1{font-size:30px}
  html.fit .ticks i{height:16px}
  html.fit .stats{flex:none;margin-top:10px}
  html.fit .stat{padding:6px 12px}
  html.fit .stat .v{font-size:16px}
  html.fit .grid{flex:1;min-height:0;margin-top:12px;grid-template-columns:minmax(0,1fr) 300px}
  html.fit main{display:flex;flex-direction:column;min-height:0;height:100%}
  html.fit .steps{flex:none}
  html.fit .sheet{flex:1;min-height:0;overflow-y:auto;padding-top:24px;overscroll-behavior:contain}
  html.fit .side{height:100%;overflow-y:auto;align-content:start;overscroll-behavior:contain}
  html.fit .panel canvas{height:110px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><div class="eyebrow">A personal finance game</div><h1>Twenty-Four Paychecks</h1></div>
    <div class="tickwrap"><button type="button" class="fitbtn" id="fitbtn" data-act="fit"></button><div class="ticks" id="ticks"></div><div class="eyebrow" id="tickcap"></div></div>
  </header>
  <section class="stats" id="stats"></section>
  <div class="grid">
    <main><nav class="steps" id="steps"></nav><div class="sheet" id="main"></div></main>
    <aside class="side" id="side"></aside>
  </div>
  <footer>A simplified simulation for learning. Taxes, market returns and credit scoring are approximations, and none of this is financial advice. Your game saves in this browser. <button type="button" class="linkbtn" data-act="restart">Start a new game</button></footer>
</div>

<script>
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const GROC={frugal:{label:'Frugal',amt:260,h:-3},normal:{label:'Normal',amt:400,h:0},lavish:{label:'Lavish',amt:600,h:3}};
const START_NW=800-1800-22000;
const STEPS=[['payday','Payday'],['bills','Bills'],['event','Life happens'],['allocate','Allocate'],['statement','Statement']];
let S;

const fmt=n=>(n<-0.5?'−':'')+'$'+Math.abs(Math.round(n)).toLocaleString('en-US');
const sfmt=n=>(n>=0?'+':'−')+'$'+Math.abs(Math.round(n)).toLocaleString('en-US');
const pct=n=>(n>=0?'+':'−')+Math.abs(n*100).toFixed(1)+'%';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function gauss(){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}
const nw=s=>s.checking+s.savings+s.index+s.bonds+s.meme+s.retire-s.card-s.loan;
const monthName=m=>MONTHS[(m-1)%12]+(m>12?' · Year 2':' · Year 1');

function newGame(){return{phase:'intro',month:1,salary:48000,k401:0,checking:800,savings:0,index:0,bonds:0,meme:0,retire:0,
  card:1800,cardLimit:3000,cardAPR:.24,loan:22000,loanAPR:.055,loanMin:240,credit:650,happy:62,happyHist:[],literacy:0,
  lessons:[],quizUsed:[],quizCorrect:0,quizTotal:0,quiz:null,quizPick:null,streak:0,rent:1100,subs:true,grocery:'normal',
  priceMult:1,recurring:[],lateFees:0,missedDebt:false,skipped:false,overLimit:false,insureMonth:null,insured:false,
  usedEvents:[],lastBurnout:-9,hist:[START_NW],bills:null,event:null,eventResult:null,alloc:null,recap:null,recover:0,
  autoSave:0,pending:[],flow:0,suggest:[],nwMonthStart:START_NW,payNote:''}}

function stub(s){const g=s.salary/12,c=g*s.k401,match=g*Math.min(s.k401,.04),taxable=g-c,tax=taxable*.14,fica=g*.0765;
  return{g,c,match,taxable,tax,fica,net:g-c-tax-fica}}

// pay a cost from a source, spilling to checking then card
function pay(s,amt,src){let r=amt;
  if(src==='savings'){const t=Math.min(s.savings,r);s.savings-=t;r-=t;src='checking'}
  if(src==='checking'){const t=Math.min(Math.max(s.checking,0),r);s.checking-=t;r-=t}
  if(r>0.5){s.card+=r;return ` ${fmt(r)} went on the credit card because you ran out of cash.`}
  return ''}

/* ---------------- events ---------------- */
const EV={
 insurance:{tag:'Protection',title:"Do you want renter's insurance?",
  body:()=>"Your landlord's policy covers the building, not your stuff. A renter's policy costs $15 a month and covers theft, fire and water damage after a $250 deductible.",
  choices:[
   {label:'Buy the policy',note:'+$15/mo bill',go:s=>{s.insured=true;s.insureMonth=s.month;s.recurring.push({id:'ins',name:"Renter's insurance",amt:15});return "You're covered. A $15 line now appears on your bills."}},
   {label:'Skip it',note:'Keep $15/mo, carry the risk',go:s=>{s.insureMonth=s.month;return "You keep the $15 a month. Hopefully nothing goes wrong."}}],
  lesson:{term:'Insurance',text:'Insurance trades a small, certain cost for protection against a large, uncertain one. The deductible is the part you pay before coverage starts.'}},
 pipe:{tag:'Emergency',title:'A pipe burst in the apartment upstairs',
  body:()=>'Water came through your ceiling overnight. Your laptop, mattress and half your clothes are ruined. Replacing them costs about $1,800.',
  choices:s=>s.insured?[
   {label:'File an insurance claim',note:'Pay the $250 deductible',go:s=>{const x=pay(s,250,'savings');s.happy-=4;return 'The insurer paid $1,550. You covered the $250 deductible.'+x}}]:[
   {label:'Replace everything from savings',note:'$1,800',go:s=>{const x=pay(s,1800,'savings');s.happy-=8;return 'Everything is replaced, at full price, out of your own pocket.'+x}},
   {label:'Put it all on the credit card',note:'$1,800 at 24% APR',go:s=>{s.card+=1800;s.happy-=8;return 'Replaced, but $1,800 is now growing at 24% a year on your card.'}},
   {label:'Replace only the essentials',note:'$700, happiness −16',go:s=>{const x=pay(s,700,'savings');s.happy-=16;return 'You bought a mattress and a used laptop. Everything else waits.'+x}}],
  lesson:{term:'Deductible',text:'The amount you pay out of pocket before insurance pays the rest. A $15/month policy turned an $1,800 loss into $250.'}},
 crash:{tag:'Markets',title:'The stock market just fell 18%',
  body:s=>`Headlines are shouting about a recession. Your index fund and 401(k) dropped 18% this week${s.index+s.retire>0?`, a paper loss of ${fmt(s.crashLoss)}`:''}. Your coworkers are panicking.`,

function pickEvent(s){
  const fixed={2:'insurance',9:'crash',12:'raise'};
  const f=fixed[s.month];
  if(f&&!s.usedEvents.includes(f))return f;
  if(s.happy<28&&s.month-s.lastBurnout>=4){s.lastBurnout=s.month;return 'burnout'}
  if(s.insureMonth&&s.month>=s.insureMonth+4&&!s.usedEvents.includes('pipe')&&Math.random()<.45)return 'pipe';
  const pool=Object.keys(EV).filter(k=>EV[k].pool&&!s.usedEvents.includes(k)&&(!EV[k].req||EV[k].req(s)));
  if(!pool.length)return 'quiet';
  return pool[Math.floor(Math.random()*pool.length)];
}

function buildBills(s){
  const pm=s.priceMult,b=[],mi=(s.month-1)%12,winter=[0,1,11].includes(mi),summer=[6,7].includes(mi);
  if(s.lateFees>0)b.push({id:'late',name:'Late fees from last month',amt:s.lateFees,note:'Charged because bills were skipped.',card:true,skip:false});
  b.push({id:'rent',name:'Rent',amt:s.rent,note:'Your landlord only takes bank transfers.',card:false,skip:true,pen:{fee:50,happy:-10}});
  b.push({id:'util',name:'Electric, gas & water',amt:Math.round((85+Math.random()*30+(winter?55:summer?35:0))*pm),note:winter?'Heating season.':summer?'Air conditioning season.':'Changes with the weather.',card:true,skip:true,pen:{fee:25}});
  b.push({id:'phone',name:'Phone & internet',amt:95,card:true,skip:true,pen:{fee:15}});
  b.push({id:'transport',name:'Gas, car insurance & transit',amt:Math.round(160*pm),card:true,skip:false});
  b.push({id:'groc',name:'Groceries',amt:Math.round(GROC[s.grocery].amt*pm),card:true,skip:false,groc:true});
  if(s.subs)b.push({id:'subs',name:'Streaming & app subscriptions',amt:45,note:'Four services you half use.',card:true,skip:false,subs:true});
  s.recurring.forEach(r=>b.push({id:'r:'+r.id,name:r.name,amt:Math.round(r.amt),note:r.left?`${r.left} payment${r.left>1?'s':''} left`:'Every month',card:true,skip:true,pen:{fee:25},rid:r.id}));
  const ld=Math.min(s.loanMin,Math.round(s.loan));
  if(ld>0)b.push({id:'loan',name:'Student loan payment',amt:ld,note:`Balance ${fmt(s.loan)} at ${(s.loanAPR*100).toFixed(1)}%`,card:false,skip:true,debt:true,pen:{fee:30}});
  if(s.card>=1){const m=Math.min(Math.round(s.card),Math.max(35,Math.round(s.card*.03)));
    b.push({id:'cardmin',name:'Credit card minimum',amt:m,note:`Balance ${fmt(s.card)} at 24% APR. Pay extra in Allocate.`,card:false,skip:true,debt:true,pen:{fee:35}})}
  b.forEach(x=>x.choice='pay');
  return b;
}
function billTotals(){let ck=0,cd=0;S.bills.forEach(b=>{if(b.choice==='pay')ck+=b.amt;else if(b.choice==='card')cd+=b.amt});return{ck,cd,after:S.checking-ck}}

 {k:'bonds',name:'Bond fund',sub:'Loans to governments & companies · ~4%/yr, steady',sell:1,bal:s=>s.bonds},
 {k:'meme',name:'Hot stock',sub:'One hyped company · could double or vanish',sell:1,bal:s=>s.meme},
 {k:'card',name:'Extra credit card payment',sub:'Erases debt charging 24% APR',max:s=>s.card,bal:s=>s.card},
 {k:'loan',name:'Extra student loan payment',sub:'Erases debt charging '+'5.5%',max:s=>s.loan,bal:s=>s.loan},

const zeroAlloc=()=>({savings:0,index:0,bonds:0,meme:0,card:0,loan:0,fun:0});
const allocSum=a=>Object.values(a).reduce((x,y)=>x+y,0);
function setAlloc(k,v){
  const r=ROWS.find(r=>r.k===k);v=Math.round(Number(v)||0);
  v=r.sell?Math.max(v,-Math.floor(r.bal(S))):Math.max(0,v);
  if(r.max)v=Math.min(v,Math.ceil(r.max(S)));
  const others=allocSum(S.alloc)-S.alloc[k],room=Math.floor(S.checking-others);
  if(v>room)v=Math.max(r.sell?-Math.floor(r.bal(S)):0,room);
  S.alloc[k]=v;
}
function suggest(){
  const a=zeroAlloc(),n=[];let cash=Math.floor(S.checking);
  const buf=Math.min(cash,300);cash-=buf;n.push(`Keep ${fmt(buf)} in checking as a cushion against overdrafts.`);
  const fun=Math.min(150,Math.floor(cash*.1/25)*25);if(fun>0){a.fun=fun;cash-=fun;n.push(`${fmt(fun)} for fun, so the plan is one you'll stick to.`)}
  if(S.savings<1000&&cash>0){const t=Math.min(1000-Math.floor(S.savings),cash);a.savings=t;cash-=t;n.push('Build a $1,000 starter emergency fund first, so surprises don\'t become debt.')}
  if(S.card>=1&&cash>0){const t=Math.min(Math.ceil(S.card),cash);a.card=t;cash-=t;n.push('Then attack the 24% credit card. Paying it off is a guaranteed 24% return.')}
  const target=6600;
  if(cash>0&&S.savings+a.savings<target){const t=Math.floor(cash/2);a.savings+=t;a.index+=cash-t;n.push('Split the rest between growing the emergency fund toward 3 months of expenses (about $6,600) and the index fund.');cash=0}
  else if(cash>0){a.index=Math.floor(cash*.8);a.bonds=cash-a.index;n.push('Your emergency fund is solid, so invest the rest: about 80% stocks and 20% bonds.')}
  if(S.k401<.04)n.push('Also: raise your 401(k) to at least 4% on payday to collect the full employer match.');
  S.alloc=a;S.suggest=n;
}

/* ---------------- month flow ---------------- */
function closeMonth(){
  const a=S.alloc;
  S.checking-=allocSum(a);S.savings+=a.savings;S.index+=a.index;S.bonds+=a.bonds;S.meme+=a.meme;S.card-=a.card;S.loan-=a.loan;
  S.flow+=Math.max(0,a.index)+Math.max(0,a.bonds);
  const hr=[];let hd=0;const add=(t,v)=>{if(v){hr.push([t,v]);hd+=v}};
  add('Monthly grind',-4);add(`${GROC[S.grocery].label} groceries`,GROC[S.grocery].h);
  if(a.fun>0)add('Fun money',Math.min(12,Math.round(a.fun/25)));
  if(S.subs)add('Streaming nights',1);
  if(S.checking+S.savings<400)add('Stress: almost no cash',-4);
  if(S.card>S.cardLimit*.8)add('Stress: card nearly maxed',-3);
  if(S.loan<=0&&!S.loanDoneShown){add('Student loan paid off!',10);S.loanDoneShown=1}

  const idxR=S.recover>0?(.03+.02*gauss()):(.0057+.042*gauss());if(S.recover>0)S.recover--;
  const bondR=.0033+.007*gauss(),memeR=Math.exp(.34*gauss()-.05)-1;
  const savI=S.savings*.042/12,cardI=S.card*S.cardAPR/12,loanI=Math.max(0,S.loan)*S.loanAPR/12;
  const idxG=S.index*idxR,retG=S.retire*idxR,bondG=S.bonds*bondR,memeG=S.meme*memeR;
  S.savings+=savI;S.card+=cardI;S.loan=Math.max(0,S.loan)+loanI;S.index+=idxG;S.retire+=retG;S.bonds+=bondG;S.meme+=memeG;
  const lines=[];
  if(S.savings>1)lines.push(['Savings interest (4.2% APY)',savI]);
  if(S.index>1||idxG)lines.push([`Index fund ${pct(idxR)}`,idxG]);
  if(S.retire>1)lines.push([`401(k) ${pct(idxR)}`,retG]);
  if(S.bonds>1)lines.push([`Bond fund ${pct(bondR)}`,bondG]);
  if(S.meme>1||memeG)lines.push([`Hot stock ${pct(memeR)}`,memeG]);
  if(cardI>0.5)lines.push(['Credit card interest (24% APR)',-cardI]);
  if(loanI>0.5)lines.push([`Student loan interest (${(S.loanAPR*100).toFixed(1)}%)`,-loanI]);

  const cr=[];let cd=0;const cadd=(t,v)=>{if(v){cr.push([t,v]);cd+=v}};
  if(S.missedDebt){cadd('Missed a debt payment',-45);S.streak=0}
  else{S.streak++;cadd('On-time payments',2+Math.min(2,Math.floor(S.streak/6)))}
  const u=S.card/S.cardLimit,up=Math.round(u*100)+'%';
  if(u<.1)cadd(`Card utilization ${up} (excellent)`,3);
  else if(u<.3)cadd(`Card utilization ${up} (good)`,1);
  else if(u<.5)cadd(`Card utilization ${up} (high)`,-1);
  else if(u<.8)cadd(`Card utilization ${up} (very high)`,-4);
  else cadd(`Card utilization ${up} (maxed)`,-8);
  if(S.overLimit)cadd('Went over your credit limit',-15);
  S.credit=clamp(S.credit+cd,300,850);
  S.happy=clamp(S.happy+hd,0,100);S.happyHist.push(S.happy);
  const after=nw(S);S.hist.push(after);
  S.recap={lines,hr,hd,cr,cd,before:S.nwMonthStart,after,stamp:S.skipped?'late':'paid'};
  if(S.month%3===0){const pool=QUIZ.map((_,i)=>i).filter(i=>!S.quizUsed.includes(i));S.quiz=pool[Math.floor(Math.random()*pool.length)];S.quizUsed.push(S.quiz);S.quizPick=null}
  else S.quiz=null;
  S.phase='statement';
}

function score(s){
  const gain=nw(s)-START_NW,avgH=s.happyHist.length?s.happyHist.reduce((a,b)=>a+b,0)/s.happyHist.length:s.happy;
  const p={nw:clamp(gain/26000,0,1)*40,credit:clamp((s.credit-560)/(800-560),0,1)*25,happy:clamp(avgH/75,0,1)*15,lit:clamp(s.literacy/100,0,1)*20};
  const t=p.nw+p.credit+p.happy+p.lit;
  return{...p,total:t,gain,avgH,grade:t>=85?'A':t>=72?'B':t>=58?'C':t>=42?'D':'F'};
}

/* ---------------- actions ---------------- */
function act(a,d){
  switch(a){
    case 'begin':S.phase='payday';break;
    case 'k401':S.k401=+d.v;break;
    case 'deposit':{const s=stub(S);S.nwMonthStart=nw(S);S.checking+=s.net;S.retire+=s.c+s.match;S.flow+=s.c+s.match;
      const notes=[];S.pending=S.pending.filter(p=>{if(p.month===S.month){S.checking+=p.amt;notes.push(`${p.name}: +${fmt(p.amt)}`);return false}return true});
      if(S.autoSave>0){const t=Math.min(S.autoSave,Math.max(0,S.checking-1500));if(t>0){S.checking-=t;S.savings+=t;notes.push(`Automatic transfer to emergency fund: ${fmt(t)}`)}}
      S.payNote=notes.join(' · ');S.bills=buildBills(S);S.phase='bills';break}
    case 'bill':{const b=S.bills[+d.i];b.choice=d.v;break}
    case 'groc':{S.grocery=d.v;const b=S.bills.find(b=>b.groc);b.amt=Math.round(GROC[d.v].amt*S.priceMult);break}
    case 'cancelsubs':{S.subs=false;S.happy-=2;S.bills=S.bills.filter(b=>!b.subs);addLesson({term:'Cutting subscriptions',text:'Canceling $45 a month of unused services frees $540 a year. Recurring charges are the easiest place to find money in a budget.'});break}
    case 'pullsav':{const t=Math.min(S.savings,+d.amt);S.savings-=t;S.checking+=t;break}
    case 'paybills':{let fees=0,missed=false,skipped=false;
      for(const b of S.bills){
        if(b.choice==='skip'){skipped=true;fees+=b.pen.fee;if(b.pen.happy)S.happy+=b.pen.happy;if(b.debt)missed=true}
        else{if(b.choice==='card')S.card+=b.amt;else S.checking-=b.amt;
          if(b.id==='loan')S.loan=Math.max(0,S.loan-b.amt);
          if(b.id==='cardmin')S.card=Math.max(0,S.card-b.amt);
          if(b.rid){const r=S.recurring.find(r=>r.id===b.rid);if(r&&r.left)r.left--}}
      }
      S.recurring=S.recurring.filter(r=>r.left!==0);
      S.lateFees=fees;S.missedDebt=missed;S.skipped=skipped;S.overLimit=false;
      if(S.card>S.cardLimit){S.card+=35;S.overLimit=true}
      if(skipped)addLesson({term:'Late payments',text:'Skipping a bill costs a late fee, and a missed loan or card payment reported 30+ days late can drop a credit score sharply and stay on your report for seven years.'});
      S.event=pickEvent(S);S.usedEvents.push(S.event);S.eventResult=null;
      if(EV[S.event].draw)EV[S.event].draw(S);
      S.phase='event';break}
    case 'choose':{const ev=EV[S.event],c=choicesOf(ev,S)[+d.i];if(c.req&&!c.req(S))return;
      S.eventResult={label:c.label,text:c.go(S)||''};S.happy=clamp(S.happy,0,100);S.credit=clamp(S.credit,300,850);
      addLesson(ev.lesson);break}
    case 'toalloc':S.alloc=zeroAlloc();S.suggest=[];S.phase='allocate';break;
    case 'step':setAlloc(d.k,S.alloc[d.k]+(+d.d));break;
    case 'suggest':suggest();break;
    case 'clearalloc':S.alloc=zeroAlloc();S.suggest=[];break;
    case 'close':closeMonth();break;
    case 'quiz':{if(S.quizPick!=null)return;S.quizPick=+d.i;S.quizTotal++;if(S.quizPick===QUIZ[S.quiz].a){S.quizCorrect++;S.literacy=Math.min(100,S.literacy+8)}break}
    case 'next':if(S.month>=24){S.phase='final'}else{S.month++;S.phase='payday';S.event=null;S.eventResult=null;S.recap=null;S.quiz=null;S.bills=null}break;
    case 'restart':S=newGame();break;
    case 'fit':setFit(!document.documentElement.classList.contains('fit'),true);return;
  }
  render();
  if(['deposit','paybills','toalloc','close','next','begin','restart'].includes(a)){const sh=$('main');if(isFitDesk())sh.scrollTop=0;else document.querySelector('main').scrollIntoView({block:'start',behavior:'smooth'})}
}
function addLesson(l){if(!S.lessons.find(x=>x.term===l.term)){S.lessons.unshift({term:l.term,text:l.text,month:S.month});S.literacy=Math.min(100,S.literacy+3)}}

/* ---------------- render ---------------- */
const $=id=>document.getElementById(id);
const ICON_IN='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
const ICON_OUT='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
const isFitDesk=()=>document.documentElement.classList.contains('fit')&&matchMedia('(min-width:921px)').matches;
function setFit(on,fromClick){
  document.documentElement.classList.toggle('fit',on);
  try{localStorage.setItem('tfp-fit',on?'1':'0')}catch(e){}
  if(fromClick){const d=document,el=d.documentElement;
    try{if(on&&!d.fullscreenElement&&el.requestFullscreen)el.requestFullscreen().catch(()=>{});
        if(!on&&d.fullscreenElement&&d.exitFullscreen)d.exitFullscreen().catch(()=>{})}catch(e){}}
  const b=$('fitbtn');b.innerHTML=on?ICON_OUT+'Exit full screen':ICON_IN+'Full screen';b.setAttribute('aria-pressed',on);
  requestAnimationFrame(drawChart);
}
function render(){
  $('ticks').innerHTML=Array.from({length:24},(_,i)=>{const m=i+1;const cls=S.phase==='final'||m<S.month?'done':(m===S.month&&S.phase!=='intro'?'now':'');return `<i class="${cls}"></i>`}).join('');
  $('tickcap').textContent=S.phase==='intro'?'24 months ahead':S.phase==='final'?'All 24 months done':`Month ${S.month} of 24 · ${MONTHS[(S.month-1)%12]}`;
  const inv=S.index+S.bonds+S.meme;
  $('stats').innerHTML=[['Checking',S.checking,''],['Emergency fund',S.savings,''],['Investments',inv,''],['401(k)',S.retire,''],['Credit card',-S.card,'debt'],['Student loan',-S.loan,'debt'],['Net worth',nw(S),'nw']]
    .map(([l,v,c])=>`<div class="stat ${c}"><div class="eyebrow">${l}</div><div class="v">${fmt(v)}</div></div>`).join('');
  const pi=STEPS.findIndex(s=>s[0]===S.phase);
  $('steps').innerHTML=(S.phase==='intro'||S.phase==='final')?'':STEPS.map(([k,l],i)=>`<span class="${i===pi?'on':i<pi?'done':''}">${i<pi?'✓ ':''}${l}</span>`).join('');
  $('main').innerHTML=({intro:rIntro,payday:rPayday,bills:rBills,event:rEvent,allocate:rAlloc,statement:rStatement,final:rFinal})[S.phase]();
  $('side').innerHTML=rSide();
  drawChart();save();
}

function rBills(){const t=billTotals(),short=t.after<0;
  const rows=S.bills.map((b,i)=>{
    const seg=`<div class="seg" role="group" aria-label="How to pay ${b.name}">
      <button type="button" class="${b.choice==='pay'?'on':''}" data-act="bill" data-i="${i}" data-v="pay">Checking</button>

function rEvent(){const ev=EV[S.event];

function rStatement(){const r=S.recap,q=S.quiz!=null?QUIZ[S.quiz]:null,need=q&&S.quizPick==null;
  const ln=r.lines.map(([l,v])=>`<div><span>${l}</span><span class="${v>=0?'pos':'neg'}">${sfmt(v)}</span></div>`).join('')||'<div><span>No interest or investment activity yet</span><span>$0</span></div>';

  <div class="twocol">

    <div><h3>Happiness ${r.hd>=0?'+':'−'}${Math.abs(r.hd)}</h3><div class="ledger">${r.hr.map(([l,v])=>`<div><span>${l}</span><span class="${v>=0?'pos':'neg'}">${v>0?'+':'−'}${Math.abs(v)}</span></div>`).join('')}</div></div>
  </div>
  ${q?`<div class="quiz"><div class="eyebrow">Quarterly pop quiz · +8 literacy</div><p class="q">${q.q}</p>
    <div class="qopts">${q.o.map((o,i)=>`<button type="button" data-act="quiz" data-i="${i}" class="${S.quizPick!=null?(i===q.a?'right':i===S.quizPick?'wrong':''):''}" ${S.quizPick!=null?'disabled':''}>${o}</button>`).join('')}</div>
    ${S.quizPick!=null?`<p class="qexp"><b>${S.quizPick===q.a?'Correct.':'Not quite.'}</b> ${q.e}</p>`:''}</div>`:''}
  <div class="row-actions cta"><button type="button" class="primary" data-act="next" ${need?'disabled':''}>${S.month>=24?'See your final results':`Start month ${S.month+1}`}</button>${need?'<span class="hint">Answer the quiz to continue.</span>':''}</div>`}

function rFinal(){const sc=score(S),inv=S.index+S.bonds+S.retire,yrs=41,grow=Math.pow(1.07,yrs),m=S.flow/24;
  const fv=inv*grow+m*12*(grow-1)/.07;
  const tips=[];
  if(S.card>1)tips.push(`You still carry ${fmt(S.card)} on a 24% card. Paying it off would be the best return available to you.`);
  if(S.k401<.04)tips.push('You never collected the full 401(k) match. That was free money.');
  if(S.savings<3000)tips.push('Your emergency fund is thin. Aim for 3 to 6 months of essential expenses.');
  if(sc.avgH<45)tips.push('Your happiness ran low. A plan you can live with beats a perfect plan you abandon.');
  if(S.meme>inv*.3&&S.meme>500)tips.push('A large share of your investments rode on one hyped stock. Diversify.');
  if(!tips.length)tips.push('Balanced and disciplined. Keep doing exactly this for the next 40 years.');
  return `<div class="eyebrow">Two years later</div>
  <div style="display:flex;gap:24px;align-items:center;flex-wrap:wrap"><div class="grade">${sc.grade}</div>
  <div style="min-width:0;flex:1"><h2>You made it through 24 paychecks.</h2><p class="lede" style="margin:0">Net worth went from ${fmt(START_NW)} to ${fmt(nw(S))}, a swing of ${sfmt(sc.gain)}.</p></div></div>
  <h3>Score breakdown · ${Math.round(sc.total)} of 100</h3>
  <div class="ledger">
    <div><span>Net worth growth</span><span>${sc.nw.toFixed(0)} / 40</span></div>
    <div><span>Credit score (${Math.round(S.credit)})</span><span>${sc.credit.toFixed(0)} / 25</span></div>
    <div><span>Average happiness (${Math.round(sc.avgH)})</span><span>${sc.happy.toFixed(0)} / 15</span></div>
    <div><span>Financial literacy (${S.lessons.length} lessons, ${S.quizCorrect}/${S.quizTotal} quizzes)</span><span>${sc.lit.toFixed(0)} / 20</span></div>
  </div>
  <h3>Future you, at 65</h3>
  <p class="lede" style="margin-bottom:4px">If your ${fmt(inv)} in the index fund, bonds and 401(k) keeps growing at 7% a year, and you keep investing about ${fmt(m)} a month like you did here, then in 41 years you'd have roughly:</p>
  <div class="future">${fmt(fv)}</div>
  <p class="hint">That is compound interest. The earliest dollars do the most work.</p>
  <h3>What to work on</h3><ul class="slist">${tips.map(t=>`<li>${t}</li>`).join('')}</ul>
  <div class="row-actions cta"><button type="button" class="primary" data-act="restart">Play again</button></div>`}

function rSide(){const n=nw(S),c=Math.round(S.credit),cp=(c-300)/550*100;
  const band=c>=800?'Excellent':c>=740?'Very good':c>=670?'Good':c>=580?'Fair':'Poor';
  const h=Math.round(S.happy),mood=h>=75?'Thriving':h>=55?'Content':h>=35?'Stretched':h>=20?'Burning out':'Exhausted';
  const sp=x=>`style="left:${(x-300)/550*100}%"`;
  return `<div class="panel"><div class="eyebrow">Net worth</div><div class="big ${n>=0?'pos':'neg'}">${fmt(n)}</div><canvas id="nwc" role="img" aria-label="Net worth by month"></canvas></div>
  <div class="panel"><div class="eyebrow">Credit score</div><div><span class="big">${c}</span><span class="band">${band}</span></div>
    <div class="bar cs"><i style="left:${cp}%"></i></div>
    <div class="scale"><span ${sp(300)}>300</span><span ${sp(580)}>580</span><span ${sp(670)}>670</span><span ${sp(740)}>740</span><span ${sp(850)}>850</span></div></div>
  <div class="panel"><div class="eyebrow">Happiness</div><div><span class="big">${h}</span><span class="band">${mood}</span></div>
    <div class="bar mood"><b style="width:${h}%"></b></div></div>
  <div class="panel"><div class="eyebrow">Financial literacy</div><div><span class="big">${Math.round(S.literacy)}</span><span class="band">of 100 · quizzes ${S.quizCorrect}/${S.quizTotal}</span></div>
    <div class="bar mood"><b style="width:${S.literacy}%"></b></div></div>
  <div class="panel notebook"><div class="eyebrow">Notebook · ${S.lessons.length} lesson${S.lessons.length===1?'':'s'}</div>
    ${S.lessons.length?S.lessons.map(l=>`<details><summary>${l.term}<span>Month ${l.month}</span></summary><p>${l.text}</p></details>`).join(''):'<p class="hint" style="margin:8px 0 0">Lessons you learn along the way collect here.</p>'}</div>`}

function drawChart(){const cv=$('nwc');if(!cv)return;
  const w=cv.clientWidth,h=140,dpr=window.devicePixelRatio||1;if(!w)return;cv.width=w*dpr;cv.height=h*dpr;
  const x=cv.getContext('2d');x.scale(dpr,dpr);
  const cs=getComputedStyle(document.documentElement),T=k=>cs.getPropertyValue(k).trim();
  const d=S.hist,mn=Math.min(0,...d),mx=Math.max(0,...d),pad=(mx-mn)*.12||1000,lo=mn-pad,hi=mx+pad;
  const L=46,R=10,Tp=8,B=18,X=i=>L+(w-L-R)*i/24,Y=v=>Tp+(h-Tp-B)*(hi-v)/(hi-lo);
  const k=v=>(v<0?'−':'')+'$'+(Math.abs(v)>=1000?(Math.abs(v)/1000).toFixed(Math.abs(v)>=10000?0:1)+'k':Math.round(Math.abs(v)));
  x.font='10px '+T('--f-mono');x.fillStyle=T('--muted');x.textBaseline='middle';x.textAlign='right';
  [mn,0,mx].filter((v,i,a)=>a.indexOf(v)===i).forEach(v=>{x.fillText(k(v),L-6,Y(v));x.strokeStyle=T('--line');x.lineWidth=1;x.setLineDash(v===0?[3,3]:[]);x.beginPath();x.moveTo(L,Y(v));x.lineTo(w-R,Y(v));x.stroke()});
  x.setLineDash([]);x.textAlign='center';x.textBaseline='alphabetic';[0,6,12,18,24].forEach(i=>x.fillText(i===0?'Start':'M'+i,X(i),h-4));
  const col=d[d.length-1]>=0?T('--money'):T('--debt');
  x.beginPath();d.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));x.lineTo(X(d.length-1),Y(0));x.lineTo(X(0),Y(0));x.closePath();
  x.globalAlpha=.12;x.fillStyle=col;x.fill();x.globalAlpha=1;
  x.beginPath();d.forEach((v,i)=>i?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v)));x.strokeStyle=col;x.lineWidth=2;x.lineJoin='round';x.stroke();
  const li=d.length-1;x.beginPath();x.arc(X(li),Y(d[li]),4,0,7);x.fillStyle=col;x.fill();x.strokeStyle=T('--sheet');x.lineWidth=2;x.stroke();
}

/* ---------------- wiring ---------------- */
function save(){try{localStorage.setItem('tfp-save-v1',JSON.stringify(S))}catch(e){}}
function load(){try{const v=JSON.parse(localStorage.getItem('tfp-save-v1'));return v&&v.phase?v:null}catch(e){return null}}
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t||t.disabled)return;act(t.dataset.act,t.dataset)});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-alloc]')){setAlloc(t.dataset.alloc,t.value);render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-alloc]')){e.target.blur()}});
window.addEventListener('resize',drawChart);
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',drawChart)}catch(e){}
new MutationObserver(drawChart).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(drawChart);

(function(){let on=true;try{const v=localStorage.getItem('tfp-fit');if(v!==null)on=v==='1'}catch(e){}setFit(on,false)})();
function start(data){S=(data&&data.phase)?data:(load()||newGame());render();window.claude?.hot?.snapshot(()=>S)}
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
