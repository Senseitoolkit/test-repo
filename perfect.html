<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Process of Perfection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* VOICE: a friendly coach, clear and encouraging, for Years 1-6 pupils.
   IDEA: a marked answer sheet: ranked choices, pencil cross-outs, red-pen points in the margin.
   PICTURE: the ranking stack itself, big cards you drag into order, then strike through.
   COLOUR and TYPE: white paper, deep blue ink, red marking pen, yellow highlighter; Fredoka + Atkinson Hyperlegible.
   LAYOUT: one calm column; sentence on top, stack beneath, the action button last. */
:root{color-scheme:light dark;
 --bg:light-dark(#eef1f8,#0f121a);--paper:light-dark(#fff,#181c27);--ink:light-dark(#1d2b53,#e7ebf7);
 --ink2:light-dark(#4b5675,#a9b1c8);--ink3:light-dark(#8890a8,#737b93);--line:light-dark(#d7dceb,#2b3142);
 --rule:light-dark(#dfe6f7,#222839);--blue:light-dark(#2348c9,#7d9bff);--blueSoft:light-dark(#e6ecff,#1d2747);
 --red:light-dark(#e03a3e,#ff6b6e);--redSoft:light-dark(#fde8e8,#3a1d22);--hi:light-dark(#ffe14d,#e9c53a);
 --hiSoft:light-dark(#fff6c2,#3a3417);--bar:light-dark(#1d2b53,#0a0c12)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 'Atkinson Hyperlegible',system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Fredoka,system-ui,sans-serif;font-weight:600;margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
button:disabled{opacity:.45;cursor:default}
.num{font-variant-numeric:tabular-nums}
header{background:var(--bar);color:#fff;position:sticky;top:0;z-index:5}
.hin{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.logo{font-family:Fredoka;font-size:21px;font-weight:700;display:flex;align-items:center;gap:9px}
.logo svg{width:28px;height:28px}
.pill{margin-left:auto;font-family:Fredoka;font-size:15px;background:rgba(255,255,255,.12);border-radius:99px;padding:5px 13px;white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:24px 16px 56px}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:26px;box-shadow:0 20px 50px -34px rgba(20,30,70,.45)}
@media(max-width:560px){.sheet{padding:18px 14px}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 22px;border-radius:14px;font-family:Fredoka;font-size:18px;font-weight:600;transition:transform .1s}
.btn:active:not(:disabled){transform:translateY(1px)}
.primary{background:var(--blue);color:#fff}.red{background:var(--red);color:#fff}
.ghost{border:2px solid var(--line)}
.link{font-family:Fredoka;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;min-height:44px}
/* home */
.hero h1{font-size:clamp(34px,7vw,50px);line-height:1.05}
.hero p{color:var(--ink2);margin-top:10px;max-width:58ch}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:22px 0}
@media(max-width:560px){.rules{grid-template-columns:minmax(0,1fr)}}
.rule{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:15px}
.rule b{font-family:Fredoka;font-size:16px;display:block}
.pts{font-family:Fredoka;font-weight:700;font-size:19px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--blueSoft);color:var(--blue)}
.pts.neg{background:var(--redSoft);color:var(--red)}
.lbl{font-family:Fredoka;font-size:15px;color:var(--ink2);margin:18px 0 8px}
.years,.seg{display:flex;flex-wrap:wrap;gap:8px}
.years button,.seg button{min-height:48px;min-width:56px;padding:6px 14px;border:2px solid var(--line);border-radius:12px;font-family:Fredoka;font-size:18px;font-weight:600;background:var(--paper)}
.years button[aria-pressed=true],.seg button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.go{margin-top:24px}
.hist{margin-top:30px}.hist h3{font-size:17px;margin-bottom:6px}
.hist table{width:100%;border-collapse:collapse;font-size:15px}
.hist td,.hist th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
.hist th{font-weight:400;color:var(--ink3);font-size:13px}.hist .r{text-align:right}
.empty{color:var(--ink3);font-size:15px}
/* test */
.prog{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:16px}
.prog i{height:8px;flex:1 1 14px;max-width:40px;border-radius:9px;background:var(--line)}
.prog i.d{background:var(--blue)}.prog i.c{background:var(--hi)}
.qhead{display:flex;justify-content:space-between;gap:10px;font-family:Fredoka;color:var(--ink3);font-size:15px;margin-bottom:8px}
.sent{background:var(--paper);background-image:repeating-linear-gradient(transparent 0 38px,var(--rule) 38px 40px);border-left:4px solid var(--red);padding:12px 18px 14px;border-radius:6px;font-size:clamp(21px,4vw,26px);line-height:40px;margin-bottom:18px}
.blank{display:inline-block;min-width:80px;border-bottom:3px solid var(--ink);margin:0 4px;line-height:1.2;text-align:center;color:var(--blue);font-weight:700}
.steps{display:flex;gap:6px;margin-bottom:12px;font-family:Fredoka;font-size:14px;flex-wrap:wrap}
.steps span{padding:5px 12px;border-radius:99px;background:var(--bg);color:var(--ink3)}
.steps span.on{background:var(--ink);color:var(--paper)}.steps span.dn{color:var(--blue)}
.ask{font-family:Fredoka;font-size:20px;font-weight:600;margin-bottom:4px}
.sub{color:var(--ink2);font-size:15px;margin-bottom:14px}
.stack{display:grid;gap:10px;margin-bottom:18px;touch-action:none}
.card{position:relative;display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;min-height:64px;padding:8px 10px 8px 8px;border:2px solid var(--line);border-radius:16px;background:var(--paper);user-select:none;-webkit-user-select:none;transition:border-color .15s,background .15s}
.rank .card{cursor:grab}
.card.drag{z-index:3;cursor:grabbing;box-shadow:0 16px 30px -12px rgba(20,30,70,.45);border-color:var(--blue);transition:none}
.rk{font-family:Fredoka;text-align:center;line-height:1;color:var(--ink3)}
.rk b{display:block;font-size:24px;color:var(--ink)}.rk small{font-size:10px}
.word{font-size:20px;font-weight:700;overflow-wrap:anywhere}
.mv{display:flex;gap:4px}
.mv button{width:44px;height:44px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;font-size:16px;color:var(--ink2)}
.elim .card{cursor:pointer}
.elim .card:hover{border-color:var(--ink3)}
.card.out .word{text-decoration:line-through;text-decoration-thickness:3px;text-decoration-color:var(--red);color:var(--ink3)}
.card.out{background:var(--redSoft);border-color:var(--red)}
.x{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-family:Fredoka;font-weight:700;font-size:20px;color:var(--ink3);border:2px dashed var(--line)}
.card.out .x{background:var(--red);color:#fff;border:0}
.tag{font-family:Fredoka;font-size:13px;font-weight:600;padding:5px 10px;border-radius:99px;white-space:nowrap}
.t-ok{background:var(--blue);color:#fff}.t-close{background:var(--hi);color:#1d2b53}.t-far{background:var(--ink3);color:var(--paper)}.t-mid{border:1.5px solid var(--line);color:var(--ink3)}
.card.ok{border-color:var(--blue);background:var(--blueSoft)}
.card.cl{border-color:var(--hi);background:var(--hiSoft)}
.marks{border-top:2px dashed var(--line);padding-top:14px;margin-bottom:18px;display:grid;gap:8px}
.mk{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;font-size:16px}
.mk .pts{width:40px;height:40px;font-size:17px}
.mk.no .pts{background:var(--bg);color:var(--ink3)}.mk.no{color:var(--ink3)}
.total{display:flex;align-items:baseline;gap:10px;font-family:Fredoka;font-size:22px;font-weight:600;margin-top:4px}
.total .big{font-size:40px;color:var(--red)}
.tip{background:var(--hiSoft);border-radius:12px;padding:12px 14px;font-size:15.5px;margin-bottom:18px}
.tip b{font-family:Fredoka}
.nag{color:var(--red);font-size:15px;min-height:22px;margin:-8px 0 10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
/* results */
.score{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;margin-bottom:22px}
@media(max-width:520px){.score{grid-template-columns:1fr;justify-items:center;text-align:center}}
.ring{width:140px;height:140px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--blue) var(--p),var(--line) 0)}
.ring span{width:112px;height:112px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-family:Fredoka;font-size:30px;font-weight:700;line-height:1;text-align:center}
.ring small{display:block;font-size:13px;color:var(--ink3);font-weight:500}
.score h2{font-size:clamp(26px,5vw,34px)}.score p{color:var(--ink2);margin-top:6px}
.skills{display:grid;gap:12px;margin-bottom:24px}
.sk .top{display:flex;justify-content:space-between;gap:10px;font-size:15.5px}
.sk .top b{font-family:Fredoka;white-space:nowrap}
.sk .bar{height:12px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:5px}
.sk .bar i{display:block;height:100%;background:var(--blue);border-radius:9px}
.sk.neg .bar i{background:var(--red)}
details{border:1px solid var(--line);border-radius:14px;margin-bottom:22px;overflow:hidden}
summary{cursor:pointer;padding:14px 16px;font-family:Fredoka;font-size:17px;min-height:44px}
.rv{padding:10px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:15.5px}
.rv .s b{color:var(--blue)}.rv .m{grid-column:1;color:var(--ink3);font-size:13.5px}
.rv .p{grid-row:1/3;grid-column:2;font-family:Fredoka;font-weight:700;font-size:20px;align-self:center}
.foot{font-size:13px;color:var(--ink3);text-align:center;margin-top:22px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const KEY = 'pop-history', PREF = 'pop-prefs';
const S = {view:'home', year:3, count:10, test:null, idx:0, step:'rank', order:[], out:[], res:[], nag:''};
try { const p = JSON.parse(localStorage.getItem(PREF) || '{}'); if (p.year) S.year = p.year; if (p.count) S.count = p.count; } catch (e) {}
const hy = /^#y([1-6])$/.exec(location.hash || ''); if (hy) S.year = +hy[1];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const hist = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const ROLE = ['ok', 'close', 'far', 'mid'];
const TAG = {ok:'<span class="tag t-ok">✓ Correct</span>', close:'<span class="tag t-close">Close call</span>', far:'<span class="tag t-far">Way off</span>', mid:'<span class="tag t-mid">Also wrong</span>'};
const RULES = [
  ['+1','Correct answer on top','Rank the right word as most likely.'],
  ['+1','Close call in the top two','The right word and the close call fill places 1 and 2, in either order.'],
  ['+1','Way off at the bottom','The answer that cannot fit goes last.'],
  ['−1','Never cross out the answer','Strike 2 words you are sure are wrong. Strike the right one and you lose a point.']
];

function start() {
  const qs = shuffle(BANK[S.year]).slice(0, S.count);
  S.test = qs.map(q => ({ s:q[0], words:{ok:q[1], close:q[2], far:q[3], mid:q[4]} }));
  S.idx = 0; S.res = []; S.view = 'test'; newQ(); save(PREF, {year:S.year, count:S.count});
}
function newQ() { S.step = 'rank'; S.order = shuffle(ROLE); S.out = []; S.nag = ''; render(); scrollTo(0, 0); }
function mark() {
  const o = S.order;
  const r = { top: o[0] === 'ok', pair: ['ok','close'].includes(o[0]) && ['ok','close'].includes(o[1]), last: o[3] === 'far', cut: S.out.includes('ok') };
  r.pts = r.top + r.pair + r.last - r.cut;
  r.order = o.slice(); r.out = S.out.slice();
  return r;
}

function render() {
  const pill = $('#pill');
  if (S.view === 'test') { const t = S.res.reduce((a, r) => a + r.pts, 0); pill.hidden = false; pill.textContent = t + ' pts · ' + (S.idx + 1) + '/' + S.test.length; }
  else pill.hidden = true;
  $('#app').innerHTML = S.view === 'home' ? home() : S.view === 'test' ? question() : results();
}

function home() {
  const h = hist();
  return '<div class="hero"><h1>Rank it. Cross it out. Nail it.</h1><p>Good test-takers don\'t just pick an answer. They sort every choice from most to least likely, then rule out the ones that can\'t be right. Every question has one <b>close call</b> that looks almost right and one answer that is <b>way off</b>. Find them both.</p></div>' +
    '<div class="rules">' + RULES.map(r => '<div class="rule"><span class="pts' + (r[0] === '−1' ? ' neg' : '') + '">' + r[0] + '</span><div><b>' + r[1] + '</b>' + r[2] + '</div></div>').join('') + '</div>' +
    '<div class="sheet"><div class="lbl" style="margin-top:0">Year group</div><div class="years">' + [1,2,3,4,5,6].map(y => '<button data-act="year" data-v="' + y + '" aria-pressed="' + (S.year === y) + '">Year ' + y + '</button>').join('') + '</div>' +
    '<div class="lbl">Questions</div><div class="seg">' + [5,10,20].map(n => '<button data-act="count" data-v="' + n + '" aria-pressed="' + (S.count === n) + '">' + n + '</button>').join('') + '</div>' +
    '<div class="go"><button class="btn primary" data-act="start">Start · Year ' + S.year + ' · ' + S.count + ' questions →</button></div></div>' +
    '<div class="hist"><h3>Recent scores</h3>' + (h.length ? '<table><thead><tr><th>When</th><th>Year</th><th class="r">Points</th><th class="r">Answers right</th></tr></thead><tbody>' +
      h.slice(0, 8).map(r => { const d = new Date(r.t); return '<tr><td>' + d.toLocaleDateString(undefined, {day:'numeric', month:'short'}) + ' ' + d.toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit'}) + '</td><td>' + r.y + '</td><td class="r num">' + r.p + ' / ' + r.m + '</td><td class="r num">' + r.c + ' / ' + r.n + '</td></tr>'; }).join('') + '</tbody></table>'
      : '<p class="empty">No scores yet. They are saved on this device after each round.</p>') + '</div>' +
    '<p class="foot">300 sentence-completion questions, Years 1–6, from the Reading Practice bank.</p>';
}

function sentence(q, fill) {
  return q.s.split('____').map(esc).join('<span class="blank">' + (fill ? esc(fill) : '&nbsp;') + '</span>');
}
function question() {

  const ask = st === 'rank' ? ['Put the choices in order', 'Drag the cards, or use the arrows. Most likely at the top, least likely at the bottom.']
    : st === 'elim' ? ['Cross out 2 answers you are sure are wrong', 'This is the process of elimination. Only strike words you can prove do not fit. ' + S.out.length + ' of 2 crossed out.']
    : [r.pts >= 3 ? 'Perfect process!' : r.pts === 2 ? 'Nearly perfect.' : r.pts >= 0 ? 'Here is how it went.' : 'Ouch, that one cost you.', 'Your ranking, marked.'];
  const cards = S.order.map((role, i) => {
    const w = esc(q.words[role]), out = S.out.includes(role);
    const rk = '<span class="rk"><b>' + (i + 1) + '</b><small>' + (i === 0 ? 'most' : i === 3 ? 'least' : '') + '</small></span>';
    if (st === 'rank') return '<div class="card" data-role="' + role + '">' + rk + '<span class="word">' + w + '</span><span class="mv"><button data-act="up" data-i="' + i + '" aria-label="Move ' + w + ' up"' + (i === 0 ? ' disabled' : '') + '>▲</button><button data-act="down" data-i="' + i + '" aria-label="Move ' + w + ' down"' + (i === 3 ? ' disabled' : '') + '>▼</button></span></div>';
    if (st === 'elim') return '<button class="card' + (out ? ' out' : '') + '" data-act="cut" data-role="' + role + '" aria-pressed="' + out + '">' + rk + '<span class="word" style="text-align:left">' + w + '</span><span class="x">' + (out ? '✕' : '') + '</span></button>';
    return '<div class="card' + (out ? ' out' : '') + (role === 'ok' ? ' ok' : role === 'close' ? ' cl' : '') + '">' + rk + '<span class="word">' + w + '</span>' + TAG[role] + '</div>';
  }).join('');
  let after = '';
  if (st === 'rank') after = '<div class="row"><span></span><button class="btn primary" data-act="lock">Lock in my order →</button></div>';
  else if (st === 'elim') after = '<div class="nag">' + esc(S.nag) + '</div><div class="row"><button class="link" data-act="back">← Change my order</button><button class="btn primary" data-act="check"' + (S.out.length === 2 ? '' : ' disabled') + '>Mark it →</button></div>';
  else {
    const m = [[r.top, '+1', 'Correct answer on top'], [r.pair, '+1', 'Correct answer and close call in places 1 and 2'], [r.last, '+1', 'Way-off answer at the bottom']];
    after = '<div class="marks">' + m.map(x => '<div class="mk' + (x[0] ? '' : ' no') + '"><span class="pts">' + (x[0] ? x[1] : '0') + '</span><span>' + (x[0] ? '' : 'Missed: ') + x[2] + '</span></div>').join('') +
      (r.cut ? '<div class="mk"><span class="pts neg">−1</span><span>You crossed out the correct answer</span></div>' : '<div class="mk no"><span class="pts">✓</span><span>Safe elimination: the correct answer survived</span></div>') +
      '<div class="total">This question <span class="big num">' + (r.pts > 0 ? '+' : '') + r.pts + '</span> <span style="font-size:15px;color:var(--ink3)">out of 3</span></div></div>' +
      '<div class="tip"><b>Coach:</b> ' + tip(r, q) + '</div>' +

    '<div class="steps">' + steps + '</div><div class="ask">' + ask[0] + '</div><p class="sub">' + ask[1] + '</p>' +
    '<div class="stack ' + (st === 'rank' ? 'rank' : st === 'elim' ? 'elim' : '') + '" id="stack">' + cards + '</div>' + after + '</div>';
}
function tip(r, q) {
  const w = q.words;
  if (r.cut) return 'Before you cross a word out, read the whole sentence with it in the blank. “' + esc(w.ok) + '” was the answer, so it should never be struck.';
  if (!r.top && r.order[0] === 'close') return '“' + esc(w.close) + '” was the close call. It looks almost right, which is exactly why it is a trap. Ask what one detail makes it wrong.';
  if (!r.top) return 'Try each word in the blank and read the sentence aloud in your head. The one that fits both the meaning and the grammar goes first: “' + esc(w.ok) + '”.';
  if (!r.last) return 'The way-off answer was “' + esc(w.far) + '”. Spot it first: it breaks the meaning or the grammar completely, so it belongs at the bottom.';
  if (!r.pair) return 'You found the answer. Next time, look for the runner-up: “' + esc(w.close) + '” was the close call and belonged in second place.';
  return 'Correct on top, close call second, way off last, and the answer was safe. That is the whole process.';
}

function results() {
  const n = S.res.length, max = n * 3, pts = S.res.reduce((a, r) => a + r.pts, 0);
  const c = k => S.res.filter(r => r[k]).length, cuts = c('cut');
  const pct = Math.max(0, Math.round(pts / max * 100));
  const verdict = pct >= 90 ? 'Process of Perfection!' : pct >= 70 ? 'Strong process.' : pct >= 45 ? 'Getting the hang of it.' : 'Keep practising the process.';
  const sk = [['Correct answer on top', c('top')], ['Close call in the top two', c('pair')], ['Way off at the bottom', c('last')], ['Safe eliminations', n - cuts]];
  return '<div class="sheet"><div class="score"><div class="ring" style="--p:' + pct + '%"><span class="num">' + pts + '<small>of ' + max + ' pts</small></span></div>' +
    '<div><h2>' + verdict + '</h2><p>Year ' + S.year + ' · ' + n + ' questions · ' + c('top') + ' answered correctly' + (cuts ? ' · lost ' + cuts + ' point' + (cuts > 1 ? 's' : '') + ' for crossing out the answer' : '') + '.</p></div></div>' +
    '<div class="skills">' + sk.map((s, i) => '<div class="sk"><div class="top"><span>' + s[0] + '</span><b class="num">' + s[1] + ' / ' + n + '</b></div><div class="bar"><i style="width:' + (s[1] / n * 100) + '%"></i></div></div>').join('') + '</div>' +
    '<details' + (pct < 100 ? ' open' : '') + '><summary>Review each question</summary>' + S.test.map((q, i) => { const r = S.res[i];
      return '<div class="rv"><span class="s">' + (i + 1) + '. ' + sentence(q, q.words.ok).replace(/class="blank"/g, '') + '</span><span class="p num" style="color:' + (r.pts < 0 ? 'var(--red)' : r.pts === 3 ? 'var(--blue)' : 'var(--ink2)') + '">' + (r.pts > 0 ? '+' : '') + r.pts + '</span>' +
        '<span class="m">Close call: ' + esc(q.words.close) + ' · Way off: ' + esc(q.words.far) + ' · You ranked: ' + r.order.map(k => esc(q.words[k])).join(' › ') + '</span></div>'; }).join('') + '</details>' +
    '<div class="row"><button class="btn primary" data-act="start">Play again</button><button class="link" data-act="home">Change year</button></div></div>';
}

/* events */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'home') { S.view = 'home'; render(); }
  else if (a === 'year') { S.year = +v; render(); }
  else if (a === 'count') { S.count = +v; render(); }
  else if (a === 'start') start();
  else if (a === 'up' || a === 'down') { const i = +b.dataset.i, j = a === 'up' ? i - 1 : i + 1; [S.order[i], S.order[j]] = [S.order[j], S.order[i]]; render(); const f = document.querySelectorAll('.mv button')[j * 2 + (a === 'up' ? 0 : 1)]; if (f && !f.disabled) f.focus(); }
  else if (a === 'lock') { S.step = 'elim'; S.out = []; render(); }
  else if (a === 'back') { S.step = 'rank'; render(); }
  else if (a === 'cut') {
    const r = b.dataset.role, k = S.out.indexOf(r);
    if (k >= 0) S.out.splice(k, 1); else if (S.out.length < 2) S.out.push(r); else { S.nag = 'You can only cross out 2. Tap one to bring it back first.'; render(); return; }
    S.nag = ''; render();
  }
  else if (a === 'check') { S.res[S.idx] = mark(); S.step = 'done'; render(); }
  else if (a === 'next') { S.idx++; newQ(); }
  else if (a === 'finish') {
    const h = hist(); h.unshift({ t:Date.now(), y:S.year, p:S.res.reduce((x, r) => x + r.pts, 0), m:S.res.length * 3, c:S.res.filter(r => r.top).length, n:S.res.length }); save(KEY, h.slice(0, 20));
    S.view = 'results'; render(); scrollTo(0, 0);
  }
});

/* drag to reorder: neighbours move around the held card so it never leaves the DOM */
let D = null;
document.addEventListener('pointerdown', e => {
  const card = e.target.closest('.rank .card'); if (!card || e.target.closest('button')) return;
  e.preventDefault(); card.setPointerCapture(e.pointerId); card.classList.add('drag');
  D = { card, y0:e.clientY, shift:0 };
});
document.addEventListener('pointermove', e => {
  if (!D) return;
  const c = D.card, dy = e.clientY - D.y0 - D.shift, gap = 10;
  c.style.transform = 'translateY(' + dy + 'px)';
  const nx = c.nextElementSibling, pv = c.previousElementSibling;
  if (nx && dy > nx.offsetHeight / 2) { const h = nx.offsetHeight + gap; c.parentNode.insertBefore(nx, c); D.shift += h; c.style.transform = 'translateY(' + (dy - h) + 'px)'; renum(); }
  else if (pv && dy < -pv.offsetHeight / 2) { const h = pv.offsetHeight + gap; c.parentNode.insertBefore(pv, c.nextSibling); D.shift -= h; c.style.transform = 'translateY(' + (dy + h) + 'px)'; renum(); }
});
const drop = () => { if (!D) return; S.order = [...document.querySelectorAll('#stack .card')].map(c => c.dataset.role); D = null; render(); };
document.addEventListener('pointerup', drop); document.addEventListener('pointercancel', drop);
function renum() { document.querySelectorAll('#stack .card').forEach((c, i) => { c.querySelector('.rk').innerHTML = '<b>' + (i + 1) + '</b><small>' + (i === 0 ? 'most' : i === 3 ? 'least' : '') + '</small>'; }); }

render();
}
</script>
