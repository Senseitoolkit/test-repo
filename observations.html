<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>7 Cs Lesson Observer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: an admin's clipboard. Left: the observation record, top to bottom in the order an
   observer fills it. Right: a sticky live panel of clocks and tallies used during the lesson. */
:root{
  --bg:#edf0f3; --surface:#ffffff; --surface-2:#f5f7f9; --ink:#14202c; --ink-2:#3a4855; --muted:#66737f;
  --line:#d3dae1; --line-2:#e6ebef;
  --accent:#1c5a8a; --accent-wash:#e2edf6;
  --think:#0b7766; --think-wash:#ddf2ed;
  --warn:#b0590c; --warn-wash:#fcefe1;
  --bad:#b13a2c; --bad-wash:#fae8e4;
  --l1:#f6dcd5; --l2:#f8e7c9; --l3:#cfe9e2; --l4:#7cc2b2;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10161c; --surface:#18212a; --surface-2:#1f2a34; --ink:#e9eef2; --ink-2:#bfcad3; --muted:#8a98a4;
  --line:#2c3a46; --line-2:#24303b;
  --accent:#78b3e3; --accent-wash:#1b3044;
  --think:#56c7b2; --think-wash:#143630;
  --warn:#eaa25c; --warn-wash:#3a2a17;
  --bad:#ef8a7c; --bad-wash:#3e211d;
  --l1:#4a2a24; --l2:#4a3a1f; --l3:#1d4a41; --l4:#2f8a78;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#10161c; --surface:#18212a; --surface-2:#1f2a34; --ink:#e9eef2; --ink-2:#bfcad3; --muted:#8a98a4;
  --line:#2c3a46; --line-2:#24303b;
  --accent:#78b3e3; --accent-wash:#1b3044;
  --think:#56c7b2; --think-wash:#143630;
  --warn:#eaa25c; --warn-wash:#3a2a17;
  --bad:#ef8a7c; --bad-wash:#3e211d;
  --l1:#4a2a24; --l2:#4a3a1f; --l3:#1d4a41; --l4:#2f8a78;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1260px;margin:0 auto;padding-block:10px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--surface);display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:13px;letter-spacing:-.02em}
.brand b{font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:-.02em;white-space:nowrap}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap}
nav.tabs a{text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;padding:6px 12px;border-radius:999px}
nav.tabs a:hover{background:var(--surface-2);color:var(--ink)}
nav.tabs a[aria-current="page"]{background:var(--ink);color:var(--surface)}
.status{margin-left:auto;font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:7px;white-space:nowrap}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status.saved i{background:var(--think)}.status.pending i{background:var(--warn)}.status.err i{background:var(--bad)}
.banner{max-width:1260px;margin:12px auto 0;font-size:13.5px;padding:9px 13px;border-radius:9px;background:var(--warn-wash);color:var(--ink);border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}

main{max-width:1260px;margin:0 auto;padding-block:20px 120px}

/* generic */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 13px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink)}
.btn:hover{background:var(--surface-2);border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:12.8px}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--ink);background:var(--surface-2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.k{font-size:11px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.hint{font-size:13px;color:var(--muted);line-height:1.5}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
label.f{display:flex;flex-direction:column;gap:5px;min-width:0;flex:1 1 200px}
label.f>span{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
input[type=text],input[type=date],input[type=search],select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14.5px}
textarea{resize:vertical;line-height:1.5;min-height:62px}
input:focus,select:focus,textarea:focus{background:var(--surface);border-color:var(--accent);outline:none}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;letter-spacing:.04em;padding:3px 9px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.c{background:var(--accent-wash);border-color:transparent;color:var(--accent)}
.chip.t{background:var(--think-wash);border-color:transparent;color:var(--think)}
.tog{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13.3px;cursor:pointer;font-weight:500;color:var(--ink-2)}
.tog:hover{border-color:var(--accent)}
.tog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:600}
.togs{display:flex;gap:6px;flex-wrap:wrap}

/* observe layout */
.obs-grid{display:grid;grid-template-columns:minmax(0,1fr) 370px;gap:20px;align-items:start}
.live{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);max-height:calc(100vh - 84px);overflow:auto;display:flex;flex-direction:column;gap:12px;padding-bottom:8px;overscroll-behavior:contain}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.jump{display:flex;gap:6px;flex-wrap:wrap}
.jump button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:12.8px;font-weight:600;color:var(--ink-2);cursor:pointer}
.jump button:hover{border-color:var(--ink-2)}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;scroll-margin-top:80px}
.sec>header{padding:15px 18px 12px;border-bottom:1px solid var(--line-2);display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.sec>header h2{font-size:20px;font-weight:700}
.sec>header p{font-size:13.5px;color:var(--muted);margin-top:3px;max-width:68ch}
.sec-b{padding:16px 18px;display:flex;flex-direction:column;gap:16px}
.fields{display:flex;gap:12px;flex-wrap:wrap}

/* previous step */
.prev{border:1px dashed color-mix(in srgb,var(--accent) 50%,var(--line));background:var(--accent-wash);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.prev p{font-size:14.5px}

/* lesson flow */
.seg{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg.on{border-color:color-mix(in srgb,var(--think) 55%,var(--line))}
.seg-h{display:flex;gap:11px;align-items:center;padding:10px 12px;background:var(--surface-2);border-bottom:1px solid var(--line-2)}
.seg.on .seg-h{background:var(--think-wash)}
.seen{flex:0 0 auto;width:30px;height:30px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:800;color:transparent;display:grid;place-items:center;font-size:15px}
.seen[aria-pressed="true"]{background:var(--think);border-color:var(--think);color:var(--surface)}
.seg-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.seg-t b{font-family:var(--font-display);font-size:16.5px;font-weight:700;line-height:1.2}
.seg-b{padding:10px 12px 12px;display:flex;flex-direction:column;gap:9px}
.wf{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:10px;align-items:start;padding-bottom:9px;border-bottom:1px dotted var(--line)}
.wf:last-of-type{border-bottom:0}
.wf .who{font-family:var(--font-display);font-weight:700;font-size:14px;color:var(--accent);padding-top:2px}
.wf.th .who{color:var(--think)}
.wf p{font-size:14px;color:var(--ink-2)}
.tri{display:flex;gap:3px}
.tri button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:700;cursor:pointer;color:var(--muted);white-space:nowrap}
.tri button[aria-pressed="true"][data-v="strong"]{background:var(--think);border-color:var(--think);color:var(--surface)}
.tri button[aria-pressed="true"][data-v="partly"]{background:var(--warn);border-color:var(--warn);color:var(--surface)}
.tri button[aria-pressed="true"][data-v="not"]{background:var(--bad);border-color:var(--bad);color:var(--surface)}
@media (max-width:620px){.wf{grid-template-columns:1fr}.wf .who{padding-top:0}}

/* thinking guide blocks */
.tg{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px}
.tgb{border:1px solid var(--line);border-radius:10px;padding:13px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tgb h3{font-size:16.5px;font-weight:700;display:flex;align-items:baseline;gap:8px}
.tgb h3 small{font-family:var(--font-body);font-size:12.5px;color:var(--muted);font-weight:500}
.num{width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--surface);font-size:12px;font-weight:800;display:inline-grid;place-items:center;font-family:var(--font-display);flex:0 0 auto;transform:translateY(-1px)}
.checks{display:flex;flex-direction:column;gap:5px}
.ck{display:flex;gap:9px;align-items:flex-start;font-size:13.8px;line-height:1.42;cursor:pointer;padding:4px 2px}
.ck input{margin:2px 0 0;width:16px;height:16px;accent-color:var(--think);flex:0 0 auto}

/* 7 Cs */
.cs{display:flex;flex-direction:column;gap:12px}
.cr{border:1px solid var(--line);border-radius:10px;padding:13px 14px;display:flex;flex-direction:column;gap:10px}
.cr-h{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;justify-content:space-between}
.cr-h h3{font-size:18px;font-weight:800}
.cr-h p{font-size:13.3px;color:var(--muted)}
.lv{display:flex;gap:4px;flex-wrap:wrap}
.lv button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:5px 10px;font-size:12.8px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.lv button:hover{border-color:var(--ink-2)}
.lv button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.lv button[aria-pressed="true"][data-v="1"]{background:var(--l2)}
.lv button[aria-pressed="true"][data-v="2"]{background:var(--l3)}
.lv button[aria-pressed="true"][data-v="3"]{background:var(--l4)}
.lv button[aria-pressed="true"][data-v="0"]{background:var(--surface-2)}
details.lf>summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent);list-style:none}
details.lf>summary::-webkit-details-marker{display:none}
details.lf ul{margin:8px 0 0;padding-left:18px;font-size:13.6px;color:var(--ink-2);display:flex;flex-direction:column;gap:3px}
.fromflow{font-size:12.5px;color:var(--muted)}
.fromflow b{color:var(--ink-2)}

/* feedback */
.sugg{display:flex;flex-direction:column;gap:7px}
.sg{display:flex;gap:10px;align-items:flex-start;padding:9px 11px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line-2)}
.sg .chip{flex:0 0 auto;margin-top:1px}
.sg p{flex:1;min-width:0;font-size:13.8px}

/* live panel */
.lp{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;display:flex;flex-direction:column;gap:10px}
.lp-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.lp-h h3{font-size:15.5px;font-weight:700}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.lessonclock{display:flex;align-items:center;gap:12px;justify-content:space-between}
.lessonclock .mono{font-size:28px;font-weight:700;letter-spacing:-.02em}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mode{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 10px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:1px}
.mode span{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.mode .mono{font-size:17px;font-weight:700}
.mode[aria-pressed="true"]{border-color:var(--mc);background:color-mix(in srgb,var(--mc) 14%,var(--surface))}
.mode[aria-pressed="true"] span::before{content:"● ";color:var(--mc)}
.split{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--line-2)}
.split i{display:block;height:100%}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend b{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.waitbtn{border:0;border-radius:11px;padding:13px;cursor:pointer;background:var(--ink);color:var(--surface);font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.waitbtn.run{background:var(--think)}
.waitbtn.run.short{background:var(--warn)}
.waitbtn .mono{font-size:24px}
.samples{display:flex;gap:4px;flex-wrap:wrap}
.samples span{font-family:var(--font-mono);font-size:11.5px;padding:2px 6px;border-radius:5px;background:var(--l1);color:var(--ink)}
.samples span.ok{background:var(--l3)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:var(--surface-2);border-radius:8px;padding:7px 9px}
.stat b{display:block;font-family:var(--font-mono);font-size:17px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);line-height:1.3;display:block}
.tally{display:grid;grid-template-columns:1fr auto auto auto;gap:6px 8px;align-items:center;font-size:13.5px}
.tally .mono{min-width:28px;text-align:center;font-size:16px;font-weight:700}
.tally button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700;font-size:15px;color:var(--ink-2)}
.tally button.plus{background:var(--accent-wash);border-color:transparent;color:var(--accent)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.stepper .mono{min-width:30px;text-align:center;font-size:18px;font-weight:700}
.logs{display:flex;flex-direction:column;gap:5px;max-height:220px;overflow:auto}
.log{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:7px;font-size:13px;align-items:start}
.log .mono{font-size:12px;color:var(--muted);padding-top:1px}
.log button{border:0;background:transparent;color:var(--muted);cursor:pointer;font-size:13px}

/* records */
.rec-top{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:16px}
.rec-top h1{font-size:28px;font-weight:800;flex:1 1 260px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line-2);white-space:nowrap}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;background:var(--surface-2)}
td.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;text-align:right}
th.num{text-align:right}
tr:last-child td{border-bottom:0}
td .tname{font-weight:600}
.pill{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px}
.pill.draft{background:var(--warn-wash);color:var(--warn)}
.pill.done{background:var(--think-wash);color:var(--think)}
.pill.ex{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
.cell{display:inline-grid;place-items:center;width:30px;height:24px;border-radius:5px;font-family:var(--font-mono);font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted)}
.cell.l1{background:var(--l2);color:var(--ink)}.cell.l2{background:var(--l3);color:var(--ink)}.cell.l3{background:var(--l4);color:var(--ink)}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px 22px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.empty h3{font-size:19px}

/* report */
.report{max-width:860px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.rp-h{padding:22px 24px;border-bottom:2px solid var(--ink);display:flex;flex-direction:column;gap:6px}
.rp-h h1{font-size:28px;font-weight:800;line-height:1.1}
.rp-s{padding:18px 24px;border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:10px}
.rp-s:last-child{border-bottom:0}
.rp-s h2{font-size:17px;font-weight:700}
.rp-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.rp-c{display:grid;grid-template-columns:120px 90px minmax(0,1fr);gap:10px;padding:7px 0;border-top:1px solid var(--line-2);font-size:14px;align-items:start}
.rp-c:first-of-type{border-top:0}
@media (max-width:560px){.rp-c{grid-template-columns:1fr auto}.rp-c p{grid-column:1/-1}}
.step-box{background:var(--accent-wash);border-radius:10px;padding:14px 16px}
.step-box p{font-family:var(--font-display);font-size:18px;font-weight:700;line-height:1.35;margin-top:4px}
ul.tidy{margin:0;padding-left:19px;display:flex;flex-direction:column;gap:4px;font-size:14px}

/* look-fors */
.ref{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:14px}
.refc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:9px;min-width:0}
.refc h3{font-size:17px;font-weight:700}
.lede{max-width:72ch;margin-bottom:18px}
.lede h1{font-size:30px;font-weight:800;line-height:1.08}
.lede p{color:var(--ink-2);margin-top:8px;font-size:15.5px}
ol.principles{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:14.3px}
ol.principles b{font-weight:700}

/* TAP additions */
.two-l{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:4px 16px}
.grp{display:flex;flex-direction:column;gap:10px}
.grp+.grp{margin-top:8px}
.grp-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:5px}
.grp-h .k{color:var(--ink)}
.judge{border:1px solid var(--line);border-radius:10px;padding:13px 14px;display:flex;flex-direction:column;gap:12px;background:var(--surface-2)}
.strand{display:flex;flex-direction:column;gap:6px}
.strand b{font-size:14.5px}
.strand.overall{border-top:1px solid var(--line);padding-top:12px}

/* ================= METRICS ================= */
function clockTotals(o,live){const t={...o.clock.totals};
  if(live&&o.clock.mode&&o.clock.since)t[o.clock.mode]+=(Date.now()-o.clock.since)/1000;return t;}
function metrics(o,live){
  const w=o.wait.samples||[],n=w.length;
  const avg=n?w.reduce((a,b)=>a+b,0)/n:null, ge=n?w.filter(x=>x>=o.wait.thr).length/n:null;
  const t=clockTotals(o,live), talk=t.teacher+t.student+t.think, all=talk+t.transition;
  const sw=o.sweeps||[], eng=sw.length?sw.reduce((a,s)=>a+(s.total?s.engaged/s.total:0),0)/sw.length:null;
  const engMin=sw.length?Math.min(...sw.map(s=>s.total?s.engaged/s.total:0)):null;
  const qt=o.q.recall+o.q.open+o.q.probe, rt=o.resp.hands+o.resp.cold+o.resp.all+o.resp.pair;
  return {waitN:n,waitAvg:avg,waitGe:ge,clock:t,clockAll:all,
    teacherShare:talk?t.teacher/talk:null,studentShare:talk?(t.student+t.think)/talk:null,thinkShare:all?t.think/all:null,
    engAvg:eng,engMin,sweeps:sw.length,qTotal:qt,openShare:qt?(o.q.open+o.q.probe)/qt:null,respTotal:rt,allShare:rt?(o.resp.all+o.resp.pair)/rt:null};
}
function flowCounts(o,c){const r={strong:0,partly:0,not:0};o.segments.forEach(s=>{const v=s.r&&s.r[c];if(v)r[v]++;});return r;}
function suggestions(o){
  const m=metrics(o,true),out=[];
  if(m.waitN>=3&&m.waitGe<0.6)out.push(['Thinking time','Only '+pct(m.waitGe)+' of questions had '+o.wait.thr+'+ seconds of wait time. After every thinking question, pause for at least three seconds before taking any answer, and say "thinking time" so students know the pause is for them.']);
  if(m.clockAll>240&&m.teacherShare>0.6)out.push(['Thinking time','Teacher talk was '+pct(m.teacherShare)+' of the timed lesson. Cut the input before the task by a third and hand that time to partner talk or silent thinking.']);
  if(m.sweeps&&m.engAvg<0.8)out.push(['Engagement','Engagement averaged '+pct(m.engAvg)+' across sweeps. Replace two hands-up questions with an all-student response (mini whiteboards, X/O arms) so every student commits to an answer.']);
  if(m.respTotal>=4&&m.allShare<0.3)out.push(['Engagement','Most answers came from hands up. Use partner talk first, then call on a pair, so the same few voices do not carry the lesson.']);
  if(m.qTotal>=4&&m.openShare<0.4)out.push(['Questioning','Plan three open questions in advance and follow at least one answer with "What makes you say that?"']);
  if(o.think.skill&&!o.think.named)out.push(['Think','Name the thinking skill to the class ("Today we are learning to '+SKILLS[o.think.skill].name.toLowerCase()+'") and put the success criteria where students can point at them.']);
  if(o.routine.vtr&&o.routine.vtr!=='Other'&&o.routine.checks.length<=3)out.push(['Routine','Choose the routine after choosing the thinking skill, and keep using one routine until students can run it themselves.']);
  if(o.support.kept==='no')out.push(['Support','Scaffold the task, not the thinking: give the sentence stem without the answer, and model on a different example from the one students will do.']);
  const rated=C_ORDER.filter(c=>o.cs[c].level>=1).sort((a,b)=>o.cs[a].level-o.cs[b].level);
  if(rated.length&&o.cs[rated[0]].level<=2)out.push([CS[rated[0]].name,CS[rated[0]].step]);
  return out.slice(0,6);
}

function localStore(){

  let cb=null;const emit=()=>cb&&cb(Object.values(read()));
  return {kind:'local',subscribe(f){cb=f;emit();},async save(o){const m=read();m[o.id]=o;lsSet(K,JSON.stringify(m));emit();},
    async del(id){const m=read();delete m[id];lsSet(K,JSON.stringify(m));emit();}};
}
function dbStore(db){
  const col=db.collection('observations');
  return {kind:'db',subscribe(f,err){return col.onSnapshot(s=>f(s.docs.map(d=>d.data()),s.metadata),err);},
    async save(o){await col.doc(o.id).set(o);},async del(id){await col.doc(id).delete();}};
}
function setStatus(kind,text){const s=$('#status');s.className='status '+kind;s.querySelector('span').textContent=text;}
function banner(t){const b=$('#banner');if(t){b.textContent=t;b.hidden=false;}else b.hidden=true;}
async function initStore(){
  const inClaude=!!(window.claude&&window.claude.use);
  let db=null;try{if(window.claude&&window.claude.use)db=await window.claude.use('db');}catch(e){db=null;}
  try{if(window.claude&&window.claude.use)window.claude.use('downloads').then(d=>{DL=d;document.body.classList.toggle('no-dl',!d);}).catch(()=>{});}catch(e){}
  if(db){STORE=dbStore(db);setStatus('saved','Saved to this page');}
  else{STORE=localStore();setStatus('saved','Saved in this browser');if(inClaude)banner('Saved observations can’t be reached here, so records are kept in this browser only.');}
  const timer=setTimeout(()=>{if(!LOADED)banner('Saved observations can’t be reached yet. You can keep observing; your work will save when the connection returns.');},10000);
  STORE.subscribe((list,meta)=>{
    RECORDS=list.filter(Boolean).map(normalise);
    if(!meta||!meta.fromCache){LOADED=true;clearTimeout(timer);if(STORE.kind==='db')banner('');}
    const cur=RECORDS.find(r=>r.id===O.id);
    if(!O.createdAt){const want=lsGet('obs-current');const rec=want&&RECORDS.find(r=>r.id===want);if(rec&&rec.status==='draft'){O=clone(rec);if(VIEW==='observe')render();}}
    if(VIEW!=='observe')render(); else refreshSide();
    void cur;
  },e=>{clearTimeout(timer);banner('Saved observations stopped updating. Reload the page to reconnect.');});
}
let saveT=null,writing=false,again=false;
function touch(){setTimeout(()=>{refreshSG();const jb=$('#jump');if(jb)jb.innerHTML=jumpBar();},0);if(!O.createdAt)O.createdAt=Date.now();O.updatedAt=Date.now();lsSet('obs-current',O.id);setStatus('pending','Saving…');clearTimeout(saveT);saveT=setTimeout(flush,900);}
async function flush(){
  if(!STORE){saveT=setTimeout(flush,800);return;}
  if(writing){again=true;return;}writing=true;
  try{await STORE.save(clone(O));setStatus('saved',STORE.kind==='db'?'Saved':'Saved in this browser');}
  catch(e){if(e&&e.code==='invalid_argument'){setStatus('err','Not saved');banner('This page can only save observations for its owner and editors. Ask the owner for edit access.');}
    else if(e&&e.code==='unavailable'){setStatus('pending','Retrying…');writing=false;setTimeout(flush,1500+Math.random()*1000);return;}
    else if(e&&e.code==='quota_exceeded'){setStatus('err','Not saved');banner('Storage for this page is full. Delete old observations in Records to make room.');}
    else setStatus('err','Not saved');}
  writing=false;if(again){again=false;flush();}
}

function sweepChart(sw){

function lessonMin(){const c=O.clock;if(!c.startedAt)return '0:00';return mmss(((c.stoppedAt||Date.now())-c.startedAt)/1000);}
function ensureStarted(){if(!O.clock.startedAt){O.clock.startedAt=Date.now();O.clock.stoppedAt=null;}else if(O.clock.stoppedAt){O.clock.startedAt+=Date.now()-O.clock.stoppedAt;O.clock.stoppedAt=null;}}
function stopMode(){const c=O.clock;if(c.mode&&c.since){c.totals[c.mode]+=(Date.now()-c.since)/1000;}c.mode=null;c.since=null;}

/* ================= STRENGTHS AND GROWTH ================= */
const lc1=t=>t.charAt(0).toLowerCase()+t.slice(1);
function sgFor(o,key){
  const S=[],G=[];
  if(key==='thinking'){
    const m=metrics(o,o.id===O.id);
    if(m.waitN){if(m.waitGe>=0.6)S.push('Gave '+o.wait.thr+'+ seconds of thinking time on '+pct(m.waitGe)+' of questions (average '+m.waitAvg.toFixed(1)+'s).');
      else G.push('Wait time reached '+o.wait.thr+' seconds on '+pct(m.waitGe)+' of questions (average '+m.waitAvg.toFixed(1)+'s). Pause at least three seconds after thinking questions before taking an answer.');}
    if(o.wait.wt2>=2)S.push('Paused after student answers '+o.wait.wt2+' times, inviting students to add to their thinking.');
    if(m.clockAll>120){if(m.studentShare>=0.5)S.push('Students were talking or thinking for '+pct(m.studentShare)+' of timed talk.');
      else G.push('Students were talking or thinking for '+pct(m.studentShare)+' of timed talk. Shorten teacher input and hand that time to partner talk or silent thinking.');}
    if(m.sweeps){if(m.engAvg>=0.85)S.push('High engagement: '+pct(m.engAvg)+' of students on task on average across '+m.sweeps+' sweeps.');
      else G.push('On task averaged '+pct(m.engAvg)+' (lowest '+pct(m.engMin)+'). Plan an all-student response at the points where attention dipped.');}
    if(m.qTotal>=3){if(m.openShare>=0.5)S.push(pct(m.openShare)+' of questions were open or probing.');
      else G.push('Most questions were recall. Plan open questions and follow answers with "What makes you say that?"');}
    if(m.respTotal>=3){if(m.allShare>=0.4)S.push(pct(m.allShare)+' of answers came from all-student or partner responses, so every student committed to an answer.');
      else G.push('Most answers came from hands up. Use partner talk first or mini whiteboards so more students do the thinking.');}
    const tt=o.segments.filter(s=>s.r&&s.r._think);
    const ts=tt.filter(s=>s.r._think==='strong').map(s=>s.name),tn=tt.filter(s=>s.r._think==='not').map(s=>s.name);
    if(ts.length)S.push('Strong thinking time during '+ts.join(', ')+'.');
    if(tn.length)G.push('Thinking time was missing during '+tn.join(', ')+'.');
  } else if(key==='guide'){
    const t=o.think,c=o.challenge,s=o.support,r=o.routine;
    if(t.skill){const n=SKILLS[t.skill].name.toLowerCase();
      if(t.named)S.push('Named the thinking skill ('+n+') to students.');else G.push('Name the thinking skill ('+n+') so students know what kind of thinking is expected.');
      if(t.criteria)S.push('Success criteria were visible to students.');else G.push('Make success criteria visible so students can check their own thinking.');
      if(t.evidence.length)S.push('Students showed '+n+': '+t.evidence.map(lc1).join(' '));
      else G.push('Little student evidence of '+n+' was seen. Plan a moment where students must show it.');}
    if(c.moves.length)S.push('Raised rigour through '+c.moves.map(k=>MOVES[k].toLowerCase()).join(', ')+'.');
    if(c.source==='thinking')S.push('Difficulty came from the thinking itself, not from the task.');
    if(c.source==='other')G.push('Difficulty came from something unrelated to the thinking (language, instructions or load). Remove that barrier so the challenge sits in the thinking.');
    if(c.source==='low')G.push('Add one challenge move: complexity, evidence, perspectives, uncertainty or a decision.');
    if(s.used.length)S.push('Supports used: '+s.used.map(k=>SUPPORTS[k].toLowerCase()).join(', ')+'.');
    if(s.kept==='yes')S.push('Support helped students access the thinking without doing it for them.');
    if(s.kept==='partly'||s.kept==='no')G.push('Scaffold the task, not the thinking: give language and structure but let students reach the answer.');
    if(s.barriers.length&&!s.used.length)G.push('Barriers seen ('+s.barriers.map(k=>BARRIERS[k].toLowerCase()).join(', ')+') were not yet matched with a support.');
    if(r.vtr){if(r.checks.length>=4)S.push(r.vtr+' was used purposefully ('+r.checks.length+'/5 on the routine checklist).');
      else G.push(r.vtr+' met '+r.checks.length+'/5 of the routine checklist. Choose the routine for the thinking skill and use it repeatedly.');}
  } else if(CS[key]){
    const d=CS[key],v=o.cs[key],seen=v.seen||[],f=o.segments.filter(sg=>sg.r&&sg.r[key]);
    if(v.level===3)S.push(d.name+' was consistently evident.');
    if(v.level===2)S.push(d.name+' was often evident.');
    seen.forEach(x=>S.push(x));
    const st=f.filter(sg=>sg.r[key]==='strong').map(sg=>sg.name);if(st.length)S.push('Strong during '+st.join(', ')+'.');
    if(v.level!=null&&v.level>=1&&v.level<3)d.look.filter(x=>!seen.includes(x)).forEach(x=>G.push('Develop: '+lc1(x)));
    const nt=f.filter(sg=>sg.r[key]==='not').map(sg=>sg.name);if(nt.length)G.push('Not yet seen during '+nt.join(', ')+'.');
    const pt=f.filter(sg=>sg.r[key]==='partly').map(sg=>sg.name);if(pt.length)G.push('Partly seen during '+pt.join(', ')+'.');
    if(v.level===1)G.push(d.step);
  }
  return {S,G};
}
function sgHtml(o,key){
  const {S,G}=sgFor(o,key);
  if(!S.length&&!G.length)return '<p class="hint">Strengths and growth appear here as you tick and rate.</p>';
  return `<div class="sgx"><div><div class="k s">Strengths</div>${S.length?`<ul>${S.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="hint">None recorded yet.</p>'}</div>
    <div><div class="k g">Growth</div>${G.length?`<ul>${G.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'<p class="hint">None identified.</p>'}</div></div>`;
}
function refreshSG(){document.querySelectorAll('[data-sg]').forEach(el=>{el.innerHTML=sgHtml(O,el.dataset.sg);});}

/* ================= PDF ================= */
let DL=null;
const asc=t=>String(t==null?'':t).replace(/[‘’]/g,"'").replace(/[“”]/g,'"').replace(/[–—]/g,'-').replace(/·/g,'-').replace(/…/g,'...').replace(/≥/g,'>=').replace(/[^\x09\x0A\x0D\x20-\x7E -ÿ]/g,'');
function buildPdf(o){
  const J=window.jspdf&&window.jspdf.jsPDF;if(!J)return null;
  const doc=new J({unit:'pt',format:'a4'}),W=595,M=48,CW=W-M*2;let y=M;
  const ink=[20,32,44],mut=[102,115,127],acc=[28,90,138],grn=[11,119,102],red=[176,89,12];
  const need=h=>{if(y+h>842-M){doc.addPage();y=M;}};
  const text=(t,o2)=>{o2=o2||{};doc.setFont('helvetica',o2.b?'bold':'normal');doc.setFontSize(o2.s||10.5);doc.setTextColor(...(o2.c||ink));
    const x=M+(o2.ind||0),lines=doc.splitTextToSize(asc(t),CW-(o2.ind||0));lines.forEach(l=>{need((o2.s||10.5)*1.4);doc.text(l,x,y);y+=(o2.s||10.5)*1.4;});};
  const bullets=(arr,col)=>arr.forEach(b=>{doc.setFont('helvetica','normal');doc.setFontSize(10.5);const lines=doc.splitTextToSize(asc(b),CW-14);need(lines.length*14.7);
    doc.setFillColor(...col);doc.circle(M+4,y-3.4,1.8,'F');doc.setTextColor(...ink);lines.forEach(l=>{doc.text(l,M+14,y);y+=14.7;});});
  const h2=t=>{y+=8;need(30);doc.setDrawColor(210,218,225);doc.line(M,y-12,W-M,y-12);text(t,{b:1,s:13});y+=2;};
  const sgBlock=key=>{const {S,G}=sgFor(o,key);if(S.length){text('Strengths',{b:1,s:9.5,c:grn});bullets(S,grn);}if(G.length){y+=2;text('Growth',{b:1,s:9.5,c:red});bullets(G,red);}if(!S.length&&!G.length)text('Nothing recorded.',{c:mut});};
  const m=metrics(o,o.id===O.id),yr=YEARS[o.year]||YEARS[4];
  text('KIST ELEMENTARY  -  '+TYPES[o.type].toUpperCase(),{b:1,s:9,c:acc});y+=4;
  text(o.teacher||'Teacher',{b:1,s:22});y+=2;
  [['Observer',o.observer],['Observing',o.teacher],['Date',fmtDate(o.date)],[o.type==='walk'?'LW focus':'Lesson',yr[0]+(o.unit?' - '+o.unit:'')+(o.focus?'. '+o.focus:'')]].forEach(r=>text(r[0]+':  '+(r[1]||'-'),{s:10,c:mut}));
  if(o.type==='smt'&&o.judgement){y+=6;text('Overall judgement: '+JUDGE[o.judgement],{b:1,s:13,c:acc});
    STRANDS.forEach(st=>{if(o.strands[st[0]])text(st[1]+': '+JUDGE[o.strands[st[0]]],{s:10,c:mut,ind:10});});}
  if(o.type==='peer'){PEER_Q.forEach(q=>{h2(q[1]);text(o.peer[q[0]]||'-');});}
  else{
    if(o.prevCheck){h2('Higher leverage point from previous observation');text(o.prevCheck.step);text('In place this time: '+({yes:'consistently',partly:'partly',no:'not yet'})[o.prevCheck.result],{c:mut});}
    h2('What did I appreciate about the lesson?');text(o.glows||'-');
    if(o.type==='smt'||o.requested){h2(o.type==='smt'?'Higher leverage point':'Individual next step');text(o.step||'-',{b:1,s:12,c:acc});}
    h2('Thinking time and engagement');
    text('Wait time: '+(m.waitAvg==null?'not timed':m.waitAvg.toFixed(1)+'s average over '+m.waitN+' questions; '+pct(m.waitGe)+' at '+o.wait.thr+'s or more')+'.   Students talking or thinking: '+pct(m.studentShare)+'.   On task: '+pct(m.engAvg)+'.',{s:10,c:mut});y+=2;
    sgBlock('thinking');
  }
  C_ORDER.forEach(c=>{const v=o.cs[c];h2(CS[c].name+(v.level!=null?'  -  '+LVNAME(v.level):''));text(CS[c].q,{s:9.5,c:mut});y+=2;sgBlock(c);if(v.evidence){y+=2;text('Evidence: '+v.evidence,{s:10,c:mut});}});
  if(o.type==='smt'){h2('Think - Challenge - Support - Routine');sgBlock('guide');
    h2('Teacher self-assessment and response');text(o.selfAssess||'No self-assessment recorded.');if(o.teacherResponse){y+=4;text('Response: '+o.teacherResponse);}
    y+=26;need(60);doc.setDrawColor(150,160,170);[['Teacher signature',M],['Observer signature',M+CW/2+10]].forEach(s=>{doc.line(s[1],y,s[1]+CW/2-10,y);doc.setFontSize(9);doc.setTextColor(...mut);doc.text(s[0]+' / date',s[1],y+12);});y+=20;}
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8.5);doc.setTextColor(...mut);doc.text(asc('Confidential - KIST Teaching Appreciation - page '+i+' of '+n),M,842-24);}
  return doc.output('blob');
}
function saveLocal(fn,blob){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Downloaded '+fn);}
async function saveFile(fn,blob){if(DL){try{await DL.save({filename:fn,data:blob});toast('Saved');}catch(e){if(!e||e.code!=='declined')toast('Could not save here.');}}else saveLocal(fn,blob);}
async function downloadPdf(o){
  const blob=buildPdf(o);if(!blob){toast('The PDF tool did not load. Reload the page and try again.');return;}
  const fn=('Observation '+(o.teacher||'teacher')+' '+(o.date||'')).replace(/[^\w\- ]+/g,'').trim()+'.pdf';
  if(!DL){saveLocal(fn,blob);return;}
  try{await DL.save({filename:fn,data:blob});toast('PDF saved');}
  catch(e){if(e&&e.code==='declined')return;if(e&&e.code==='rate_limited'){toast('A save prompt is already open.');return;}toast('The PDF could not be saved here. Use Copy as text.');}
}

/* ================= RECORDS VIEW ================= */
function semOf(d){if(!d||d.length<7)return '';const y=+d.slice(0,4),m=+d.slice(5,7);return m>=8?y+'–'+(y+1)+' · Semester 1':m===1?(y-1)+'–'+y+' · Semester 1':(y-1)+'–'+y+' · Semester 2';}
const SEM_NOW=semOf(today());
const nameEq=(a,b)=>(a||'').trim().toLowerCase()===(b||'').trim().toLowerCase();
const isEx=r=>/^example/i.test(r.teacher||'');
function startCards(){
  return `<div class="starts">${[['smt','SMT lesson observation','Full lesson. 7 Cs, thinking time, judgement and one higher leverage point.'],
    ['walk','Learning walk','A short visit. Quick 7 Cs notes, engagement and wait time, rolled into staff-wide feedback.'],
    ['peer','Peer observation','A colleague observes. The five debrief prompts, summarised for SMT.']]
    .map(t=>`<button class="startc" data-act="start" data-t="${t[0]}"><b>${t[1]}</b><span>${t[2]}</span><i>Start →</i></button>`).join('')}</div>`;
}
function dueList(){
  const now=today(),out=[];
  RECORDS.forEach(r=>{if(isEx(r))return;
    if(r.type==='smt'&&r.status!=='done')out.push([r,r.followUp?('Feedback meeting '+fmtDate(r.followUp)+(r.followUp<now?' (past)':'')):'Feedback meeting not booked; aim for within 48 hours']);
    else if(r.type==='smt'&&r.status==='done'&&!r.reviewed)out.push([r,'Waiting for the teacher to review the report']);
  });
  if(!out.length)return '';
  return `<div class="sec"><header><div><div class="k">${out.length} to follow up</div><h2>Next actions</h2></div></header><div class="sec-b" style="gap:8px">
    ${out.slice(0,8).map(x=>`<div class="due"><div><b>${esc(x[0].teacher||'Unnamed')}</b><span class="hint"> · ${esc(fmtDate(x[0].date))}</span><div class="hint">${esc(x[1])}</div></div><button class="btn sm" data-act="open" data-id="${x[0].id}">Open</button></div>`).join('')}</div></div>`;
}

  if(!names.length)return '';

  return `<div class="sec"><header><div><div class="k">${esc(SEM_NOW)}</div><h2>Appraisal cycle</h2><p>Expected each semester: one SMT observation, two learning walk visits, and one peer observation completed (of a colleague outside their grade team or specialism).</p></div></header>
    <div class="sec-b"><div class="tbl-wrap"><table><thead><tr><th>Teacher</th><th>SMT</th><th>Learning walks</th><th>Peer obs. done</th><th>Latest judgement</th></tr></thead><tbody>
    ${names.map(n=>{const mine=inSem.filter(r=>nameEq(r.teacher,n)),smt=mine.filter(r=>r.type==='smt'),lw=mine.filter(r=>r.type==='walk').length,
      pe=inSem.filter(r=>r.type==='peer'&&nameEq(r.observer,n)).length,

    </tbody></table></div></div></div>`;

function reportText(o){

  if(o.type==='peer'){PEER_Q.forEach(q=>L.push('',q[1],o.peer[q[0]]||'—'));return L.join('\n');}

  L.push('','THE 7 Cs');C_ORDER.forEach(c=>{const v=o.cs[c];L.push('- '+CS[c].name+': '+(v.level!=null?LVNAME(v.level):'—')+(v.evidence?' — '+v.evidence:''));});

    '- Wait time: '+(m.waitAvg==null?'not timed':m.waitAvg.toFixed(1)+'s average over '+m.waitN+' questions; '+pct(m.waitGe)+' at '+o.wait.thr+'s or more'),
    '- Students talking or thinking: '+pct(m.studentShare)+' of timed talk',
    '- On task: '+pct(m.engAvg)+' average over '+m.sweeps+' sweeps');
  if(o.type==='smt'){L.push('','THINK · CHALLENGE · SUPPORT · ROUTINE',
    '- Think: '+(o.think.skill?SKILLS[o.think.skill].name+(o.think.named?' (named)':' (not named)'):'not identified'),
    '- Challenge: '+(o.challenge.moves.map(k=>MOVES[k]).join(', ')||'none recorded'),
    '- Support: '+(o.support.used.map(k=>SUPPORTS[k]).join(', ')||'none recorded'),

    if(o.selfAssess)L.push('','TEACHER SELF-ASSESSMENT',o.selfAssess);if(o.teacherResponse)L.push('','TEACHER RESPONSE',o.teacherResponse);}
  return L.join('\n');
}

  <div class="sc-try sec"><header><div><div class="k">Try it</div><h2>Press any key</h2><p>Nothing is recorded on this page. Press a key to see what it does.</p></div></header>
    <div class="sec-b"><div class="kb" aria-hidden="true">${KB_ROWS.map(r=>`<div class="kb-r">${r.map(kbKey).join('')}</div>`).join('')}
      <div class="kb-r"><span class="kk on wide" data-k="Escape" style="--kc:var(--think)">Esc</span><span class="kk on space" data-k=" " style="--kc:var(--think)">Space</span></div></div>
      <div class="sc-out" id="sc-out" aria-live="polite"><span class="hint">Waiting for a key…</span></div>
      <div class="legend">${SC_GROUPS.map(g=>`<span><i class="dot" style="background:${g.color}"></i>${g.name}</span>`).join('')}</div></div></div>
  <div class="ref" style="margin-top:16px">${SC_GROUPS.map(g=>`<div class="refc" style="border-top:3px solid ${g.color}"><h3>${g.name}</h3><p class="hint">${g.why}</p>
    <dl class="sc-dl">${g.keys.map(k=>`<dt><kbd>${esc(k[0])}</kbd></dt><dd><b>${esc(k[1])}</b>${k[2]?`<span>${esc(k[2])}</span>`:''}</dd>`).join('')}</dl></div>`).join('')}
    <div class="refc"><h3>Tips</h3><ul class="tidy">
      <li>Start the talk clock with <kbd>1</kbd> as soon as the lesson begins and keep one mode running throughout.</li>
      <li>Time thinking questions only. Skip “Have you got your books?”</li>
      <li>Pressed the wrong key? <kbd>U</kbd> undoes it.</li>
      <li>On an iPad without a keyboard, tap the same buttons in the control bar instead.</li>
      <li>The keys sit together on the left of the keyboard so one hand can stay there.</li></ul>
      <a class="btn pri" href="#observe" style="text-decoration:none;align-self:flex-start">Go to Observe</a></div>
  </div>`;
}
function scPreview(e){
  const id=e.key===' '?' ':e.key==='Escape'?'Escape':e.key==='='?'+':e.key==='_'?'-':e.key.length===1?e.key.toLowerCase():e.key;
  const hit=SC_MAP[id],out=$('#sc-out');if(!out)return;
  if(e.key===' '||hit)e.preventDefault();
  document.querySelectorAll('.kk.press').forEach(x=>x.classList.remove('press'));
  const kel=document.querySelector('.kk[data-k="'+(id==='"'?'':id.replace(/"/g,''))+'"]');if(kel){kel.classList.add('press');}
  if(!hit){out.innerHTML=`<span class="hint">${esc(e.key.length===1?e.key.toUpperCase():e.key)} has no shortcut.</span>`;return;}
  let k=hit.k;if(id===' '){SC_SPACE=!SC_SPACE;k=hit.g.keys[SC_SPACE?0:1];}
  out.innerHTML=`<kbd class="big">${esc(k[0])}</kbd><div><div class="k" style="color:${hit.g.color}">${hit.g.name}</div><b>${esc(k[1])}</b>${k[2]?`<p class="hint">${esc(k[2])}</p>`:''}</div>`;
}
let SC_SPACE=false;

/* ================= RENDER ================= */
function measure(){const h=document.querySelector('header.top'),d=$('#deck');const r=document.documentElement;
  if(h)r.style.setProperty('--hh',h.offsetHeight+'px');r.style.setProperty('--dh',(d&&VIEW==='observe'?d.offsetHeight:0)+'px');}
window.addEventListener('resize',()=>measure());
function flash(b){if(!b||!b.classList)return;b.classList.remove('hit');void b.offsetWidth;b.classList.add('hit');}
function render(){
  const v=$('#view');
  v.innerHTML=VIEW==='records'?vRecords():VIEW==='report'?vReport():VIEW==='lookfors'?vLookfors():VIEW==='shortcuts'?vShortcuts():vObserve();
  document.querySelectorAll('[data-nav]').forEach(a=>a.setAttribute('aria-current',a.dataset.nav===VIEW?'page':'false'));
  measure();
}
function route(){const h=(location.hash||'').slice(1);VIEW=['observe','records','report','lookfors','shortcuts'].includes(h)?h:(lsGet('obs-current')?'observe':'records');DEL=null;render();window.scrollTo(0,0);}
window.addEventListener('hashchange',route);

/* ================= EVENTS ================= */
const NEWSEG={cs:[]};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act,ds=b.dataset;
  switch(a){
    case 'jump':{const s=$('#sec-'+ds.to);if(s)s.scrollIntoView({behavior:'smooth',block:'start'});return;}
    case 'keys':showKeys(!KEYS_OPEN);return;
    case 'keys-full':showKeys(false);return;
    case 'undo':{const u=UNDO.pop();if(!u)return;if(u.k==='tally')setPath(O,u.p,Math.max(0,(getPath(O,u.p)||0)-u.d));if(u.k==='wait')O.wait.samples.pop();if(u.k==='sweep')O.sweeps.pop();
      touch();refreshLive();refreshFeedbackSugg();toast('Undone');return;}
    case 'fold':DECK_FOLD=!DECK_FOLD;lsSet('obs-deck-fold',DECK_FOLD?'1':'0');refreshLive();measure();return;
    case 'start':O=newObs(ds.t==='walk'?'blank':'scaffold');O.type=ds.t;WAIT_START=null;lsSet('obs-current','');location.hash='#observe';if(VIEW==='observe'){render();window.scrollTo(0,0);}toast(TYPES[ds.t]+' started');return;
    case 'filter-t':FILTER_T=ds.v;render();return;
    case 'pdf':downloadPdf(O);return;
    case 'copywalk':{const txt=walkText();try{navigator.clipboard.writeText(txt).then(()=>toast('Staff summary copied'),()=>toast('Copy was blocked here'));}catch(x){toast('Copy was blocked here');}return;}
    case 'export':saveFile('7Cs observations backup '+today()+'.json',new Blob([JSON.stringify({app:'7cs-observer',exported:new Date().toISOString(),records:RECORDS},null,1)],{type:'application/json'}));return;
    case 'new':O=newObs(O.template==='blank'?'blank':O.template);WAIT_START=null;lsSet('obs-current','');if(VIEW!=='observe')location.hash='#observe';else{render();window.scrollTo(0,0);}toast('New observation started');return;
    case 'seg-seen':{const s=O.segments[+ds.i];s.seen=!s.seen;touch();render();return;}
    case 'seg-del':O.segments.splice(+ds.i,1);touch();render();return;
    case 'seg-r':{const s=O.segments[+ds.i];s.r[ds.c]=s.r[ds.c]===ds.v?undefined:ds.v;if(!s.seen&&s.r[ds.c])s.seen=true;touch();render();return;}
    case 'newseg-c':{const i=NEWSEG.cs.indexOf(ds.c);i>=0?NEWSEG.cs.splice(i,1):NEWSEG.cs.push(ds.c);b.setAttribute('aria-pressed',i<0);return;}
    case 'addseg':{const n=$('#f-newseg').value.trim();if(!n){$('#f-newseg').focus();return;}
      const cs=NEWSEG.cs.length?NEWSEG.cs.slice():['clarify'];O.segments.push({name:n,min:'',cs,watch:Object.fromEntries(cs.map(c=>[c,CS[c].look[0]])),think:'Students get time to think before anyone answers.',seen:true,r:{},note:''});
      NEWSEG.cs=[];touch();render();return;}
    case 'skill':O.think.skill=O.think.skill===ds.v?null:ds.v;O.think.evidence=[];touch();render();return;
    case 'set':{const cur=getPath(O,ds.p);setPath(O,ds.p,cur===ds.v?'':ds.v);touch();const y=window.scrollY;render();window.scrollTo(0,y);return;}
    case 'toggle':{const arr=getPath(O,ds.p),i=arr.indexOf(ds.v);i>=0?arr.splice(i,1):arr.push(ds.v);touch();b.setAttribute('aria-pressed',i<0);refreshFeedbackSugg();return;}
    case 'c-level':{const v=+ds.v;O.cs[ds.c].level=O.cs[ds.c].level===v?null:v;touch();b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',+x.dataset.v===O.cs[ds.c].level));refreshFeedbackSugg();return;}
    case 'strand':O.strands[ds.s]=O.strands[ds.s]===ds.v?'':ds.v;touch();render();return;
    case 'prevcheck':{const p=prevRecord();if(!p)return;O.prevCheck=O.prevCheck&&O.prevCheck.result===ds.v?null:{id:p.id,step:p.step,date:p.date,result:ds.v};touch();$('#prevbox').innerHTML=prevBox();return;}
    case 'usestep':{const s=suggestions(O)[+ds.i];if(!s)return;O.step=s[1];O.stepArea=s[0];touch();const t=$('#f-step');if(t)t.value=O.step;toast('Action step added');return;}
    case 'complete':if(O.status==='done'){O.status='draft';}else{O.status='done';stopMode();if(O.clock.startedAt&&!O.clock.stoppedAt)O.clock.stoppedAt=Date.now();WAIT_START=null;}touch();render();toast(O.status==='done'?'Marked complete':'Reopened as draft');return;
    case 'lesson-start':ensureStarted();touch();refreshLive();return;
    case 'lesson-stop':stopMode();O.clock.stoppedAt=Date.now();touch();refreshLive();return;
    case 'mode':{ensureStarted();const was=O.clock.mode;stopMode();if(was!==ds.v){O.clock.mode=ds.v;O.clock.since=Date.now();}touch();refreshLive();return;}
    case 'wait-start':ensureStarted();WAIT_START=performance.now();refreshLive();return;
    case 'wait-stop':{if(WAIT_START==null)return;const s=(performance.now()-WAIT_START)/1000;WAIT_START=null;O.wait.samples.push(Math.round(s*10)/10);UNDO.push({k:'wait'});touch();refreshLive();refreshFeedbackSugg();return;}
    case 'wait-cancel':WAIT_START=null;refreshLive();return;
    case 'tally':{const v=Math.max(0,(getPath(O,ds.p)||0)+(+ds.d));if(v!==(getPath(O,ds.p)||0))UNDO.push({k:'tally',p:ds.p,d:+ds.d});setPath(O,ds.p,v);flash(b);if(+ds.d>0)ensureStarted();touch();refreshLive();refreshFeedbackSugg();return;}
    case 'sw-t':O.sweepTotal=Math.max(1,Math.min(60,O.sweepTotal+(+ds.d)));if(O.sweepEngaged!=null)O.sweepEngaged=Math.min(O.sweepEngaged,O.sweepTotal);touch();refreshLive();return;
    case 'sw-e':{const cur=O.sweepEngaged==null?O.sweepTotal:Math.min(O.sweepEngaged,O.sweepTotal);O.sweepEngaged=Math.max(0,Math.min(O.sweepTotal,cur+(+ds.d)));touch();refreshLive();return;}
    case 'sweep':{ensureStarted();const e2=O.sweepEngaged==null?O.sweepTotal:Math.min(O.sweepEngaged,O.sweepTotal);O.sweeps.push({t:lessonMin(),engaged:e2,total:O.sweepTotal});UNDO.push({k:'sweep'});touch();refreshLive();refreshFeedbackSugg();toast('Sweep logged: '+e2+' of '+O.sweepTotal);return;}
    case 'addlog':{const inp=$('#f-lognote'),t=inp.value.trim();if(!t){inp.focus();return;}O.log.push({t:lessonMin(),text:t});touch();refreshLive();const n=$('#f-lognote');if(n)n.focus();return;}
    case 'dellog':O.log.splice(+ds.i,1);touch();refreshLive();return;
    case 'open':{const r=RECORDS.find(x=>x.id===ds.id);if(r){O=clone(r);WAIT_START=null;lsSet('obs-current',O.id);location.hash='#observe';}return;}
    case 'openreport':{const r=RECORDS.find(x=>x.id===ds.id);if(r){O=clone(r);WAIT_START=null;lsSet('obs-current',O.id);location.hash='#report';}return;}
    case 'del':DEL=ds.id;render();return;
    case 'del-no':DEL=null;render();return;
    case 'del-yes':{const id=ds.id;DEL=null;STORE&&STORE.del(id).then(()=>toast('Observation deleted')).catch(()=>toast('Could not delete. Try again.'));if(O.id===id)O=newObs();render();return;}
    case 'copyreport':{const txt=reportText(O);
      const fall=()=>{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.top='-300px';document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(x){}ta.remove();toast(ok?'Report copied':'Select the report text to copy it');};
      try{navigator.clipboard.writeText(txt).then(()=>toast('Report copied'),fall);}catch(x){fall();}return;}
  }
});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.bind){setPath(O,el.dataset.bind,el.dataset.num?+el.value:el.value);touch();
    if(el.dataset.bind==='teacher'){const h=$('#sec-details h2');if(h)h.textContent=el.value||'New observation';const p=$('#prevbox');if(p)p.innerHTML=prevBox();}
    return;}
  if(el.id==='f-search'){SEARCH=el.value;clearTimeout(window._st);window._st=setTimeout(()=>{const pos=el.selectionStart;render();const n=$('#f-search');if(n){n.focus();try{n.setSelectionRange(pos,pos);}catch(x){}}},250);}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.bind&&el.tagName==='SELECT'){if(el.dataset.bind==='year'||el.dataset.bind==='routine.vtr'||el.dataset.bind==='type'){if(el.dataset.bind==='routine.vtr')O.routine.checks=[];render();}return;}
  if(el.dataset.actChange==='template'){const keep=O.segments.filter(s=>s.seen||s.note||Object.values(s.r).some(Boolean));
    O.template=el.value;O.segments=keep.concat(newObs(el.value).segments.filter(s=>!keep.some(k=>k.name===s.name)));touch();render();return;}
  if(el.dataset.actChange==='filter'){FILTER_T=el.value;render();return;}
  if(el.id==='f-import'&&el.files&&el.files[0]){const fr=new FileReader();fr.onload=async()=>{try{const d=JSON.parse(fr.result),list=Array.isArray(d)?d:d.records||[];let n=0;
      for(const r of list){if(r&&r.id){await STORE.save(normalise(r));n++;}}toast('Imported '+n+' observation'+(n===1?'':'s'));}catch(x){toast('That file is not an observer backup.');}};fr.readAsText(el.files[0]);el.value='';return;}
  if(el.dataset.actChange==='ftype'){FILTER_TYPE=el.value;render();return;}
  if(el.dataset.actCheck){const arr=getPath(O,el.dataset.actCheck),i=arr.indexOf(el.value);if(el.checked&&i<0)arr.push(el.value);if(!el.checked&&i>=0)arr.splice(i,1);touch();
    if(el.dataset.actCheck==='routine.checks'){const h=el.closest('.tgb').querySelector('p.hint');if(h)h.textContent=O.routine.checks.length+'/5. Three or fewer and the routine was probably decoration.';}
    refreshFeedbackSugg();return;}
  if(el.dataset.bool){setPath(O,el.dataset.bool,el.checked);touch();if(el.dataset.bool==='requested'){const b=$('#feedback-b');if(b)b.innerHTML=feedbackBody();}else refreshFeedbackSugg();}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='f-lognote'){e.preventDefault();document.querySelector('[data-act="addlog"]').click();return;}
  if(e.key==='Enter'&&e.target.id==='f-newseg'){e.preventDefault();document.querySelector('[data-act="addseg"]').click();return;}
  if(e.key==='Escape'&&KEYS_OPEN){showKeys(false);return;}
  if(VIEW==='shortcuts'&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))){scPreview(e);return;}
  if(e.key==='?'&&VIEW!=='observe'&&!(e.target&&(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'))){location.hash='#shortcuts';return;}
  if(VIEW==='observe'&&!e.metaKey&&!e.ctrlKey&&!e.altKey){const t=e.target,typing=t&&(t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable);
    if(typing){if(e.key==='Escape'){t.blur();e.preventDefault();}return;}
    const click=sel=>{const b=document.querySelector(sel);if(b){e.preventDefault();b.click();}};
    const k=e.key.length===1?e.key.toLowerCase():e.key;
    if(k===' ')return click(WAIT_START!=null?'#deck [data-act="wait-stop"]':'#deck [data-act="wait-start"]');
    if(k==='Escape'&&WAIT_START!=null)return click('#deck [data-act="wait-cancel"]');
    if(['1','2','3','4'].includes(k))return click('#deck [data-act="mode"][data-v="'+MODES[+k-1][0]+'"]');
    if(k==='0')return click('#deck [data-act="mode"][aria-pressed="true"]');
    const tp=Object.keys(KEYOF).find(p=>KEYOF[p].toLowerCase()===k);if(tp)return click('#deck [data-act="tally"][data-p="'+tp+'"]');
    if(k==='+'||k==='=')return click('#deck [data-act="sw-e"][data-d="1"]');
    if(k==='-'||k==='_')return click('#deck [data-act="sw-e"][data-d="-1"]');
    if(k==='l')return click('#deck [data-act="sweep"]');
    if(k==='g')return click('#deck [data-act="lesson-start"],#deck [data-act="lesson-stop"]');
    if(k==='u')return click('#deck [data-act="undo"]');
    if(k==='n'){const n=$('#f-lognote');if(n){e.preventDefault();n.focus();n.scrollIntoView({block:'nearest'});}return;}
    if(k==='?'){e.preventDefault();showKeys(!KEYS_OPEN);return;}
    const jm={'[':'details','\'':'cs',']':'feedback'};
    if(k==='j'){const order=['details','flow','guide','cs','feedback'].filter(x=>$('#sec-'+x));const cur=order.findIndex(x=>{const r=$('#sec-'+x).getBoundingClientRect();return r.bottom>window.innerHeight*0.45;});const nx=order[(cur+1)%order.length];e.preventDefault();$('#sec-'+nx).scrollIntoView({behavior:'smooth',block:'start'});return;}
    void jm;}});

/* live tick */
setInterval(()=>{
  if(VIEW!=='observe')return;
  const m=metrics(O,true);
  MODES.forEach(md=>{const el=document.querySelector('[data-live="m-'+md[0]+'"]');if(el)el.textContent=mmss(m.clock[md[0]]);});
  const lc=document.querySelector('[data-live="lesson"]');if(lc)lc.textContent=lessonMin();
  if(O.clock.mode){const sp=document.querySelector('[data-live="split"]');if(sp)sp.innerHTML=splitBar(m);const lg=document.querySelector('[data-live="legend"]');if(lg)lg.innerHTML=legend(m);}
  if(WAIT_START!=null){const s=(performance.now()-WAIT_START)/1000;
    ['wait','wait2'].forEach(k=>{const el=document.querySelector('[data-live="'+k+'"]');if(el){el.textContent=s.toFixed(1)+'s';const bt=el.closest('.waitbtn');if(bt)bt.classList.toggle('short',s<O.wait.thr);}});}
},200);

/* boot */
(function(){
  DECK_FOLD=lsGet('obs-deck-fold')==='1';
  route();
  initStore();
})();
</script>
</body>
