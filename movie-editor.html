<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Frameline Movie Editor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,700&family=JetBrains+Mono:wght@500&family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=Bebas+Neue&family=Caveat:wght@400;700&display=swap">
<style>
/* Layout: desktop editor — app bar, tabbed ribbon, preview monitor left, wrapping storyboard right, status bar; stacks on phones */
:root{
  --bg:#e8ebf1; --panel:#f7f8fb; --panel2:#ffffff; --line:#d2d7e1; --fg:#1a1f2c; --muted:#596173;
  --accent:#3858d6; --accent-ink:#ffffff; --accent-soft:#dfe5fb;
  --music:#2c8653; --music-soft:#d3ebdd; --cap:#b06f17; --cap-soft:#f5e2c2;
  --ctx:#7448c9; --ctx-soft:#ebe3fa; --rowbg:#dce1ea; --monitor:#0a0c12; --danger:#b8342c;
  --f-display:"Bricolage Grotesque","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12151c; --panel:#191d26; --panel2:#20252f; --line:#2f3644; --fg:#e5e8ef; --muted:#97a0b2;
  --accent:#7c9bff; --accent-ink:#0c1122; --accent-soft:#252f52;
  --music:#69c38b; --music-soft:#1d3628; --cap:#e2a44a; --cap-soft:#3a2d1b;
  --ctx:#b08cff; --ctx-soft:#2d2546; --rowbg:#1c212b; --monitor:#05060a; --danger:#ff7b72; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12151c; --panel:#191d26; --panel2:#20252f; --line:#2f3644; --fg:#e5e8ef; --muted:#97a0b2;
  --accent:#7c9bff; --accent-ink:#0c1122; --accent-soft:#252f52;
  --music:#69c38b; --music-soft:#1d3628; --cap:#e2a44a; --cap-soft:#3a2d1b;
  --ctx:#b08cff; --ctx-soft:#2d2546; --rowbg:#1c212b; --monitor:#05060a; --danger:#ff7b72; color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%;margin:0}
img{max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:13px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;box-sizing:border-box}
*,*::before,*::after{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{height:100%;display:flex;flex-direction:column;min-height:0;padding-block:8px;gap:6px}
.appbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand svg{width:26px;height:26px}
#projName{border:1px solid transparent;background:transparent;border-radius:6px;padding:5px 8px;font-weight:500;min-width:0;width:min(280px,40vw)}
#projName:hover,#projName:focus{border-color:var(--line);background:var(--panel2)}
.spacer{flex:1}
.iconbtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:8px;border:1px solid transparent;background:transparent}
.iconbtn:hover{background:var(--panel2);border-color:var(--line)}
.iconbtn:disabled{opacity:.35;cursor:default;background:transparent;border-color:transparent}
.primary{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;border-radius:8px;padding:8px 14px}
.primary:hover{filter:brightness(1.07)}

.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;border:1px solid transparent;border-bottom:0;background:transparent;padding:7px 14px 8px;border-radius:8px 8px 0 0;white-space:nowrap;color:var(--muted);font-weight:500}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{background:var(--panel);border-color:var(--line);color:var(--fg);margin-bottom:-1px}
.tab.ctx{color:var(--ctx);padding-top:15px}
.tab.ctx::before{content:attr(data-ctx);position:absolute;left:0;right:0;top:0;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;text-align:center;background:var(--ctx-soft);border-radius:8px 8px 0 0;padding:1px 0;color:var(--ctx);font-weight:600}
.tab.ctx[aria-selected="true"]{color:var(--fg)}

.ribbon{background:var(--panel);border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;display:flex;align-items:stretch;overflow-x:auto;min-height:118px;flex:none}
.group{display:flex;flex-direction:column;padding:8px 10px 4px;border-right:1px solid var(--line);flex:none}
.gbody{flex:1;display:flex;align-items:flex-start;gap:6px}
.glabel{font-size:10.5px;color:var(--muted);text-align:center;padding-top:4px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.rb{border:1px solid transparent;background:transparent;border-radius:7px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.rb:hover:not(:disabled){background:var(--panel2);border-color:var(--line)}
.rb:disabled{opacity:.4;cursor:default}
.rb.big{flex-direction:column;justify-content:flex-start;padding:6px 8px;min-width:64px;font-size:12px;line-height:1.2;text-align:center;white-space:normal}
.rb.big svg.i{width:28px;height:28px;margin-bottom:2px}
.rb.sm{padding:3px 8px 3px 5px;font-size:12.5px;height:26px}
.rb.sm svg.i{width:17px;height:17px}
.rb.on{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.stack{display:flex;flex-direction:column;gap:1px}
.field{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);height:28px;white-space:nowrap}
.field input[type=number],.field select,.field input[type=text]{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:3px 6px;color:var(--fg);height:26px}
.field input[type=number]{width:70px;font-variant-numeric:tabular-nums}
.field input[type=range]{width:120px;accent-color:var(--accent)}
.field input[type=color]{width:34px;height:26px;border:1px solid var(--line);border-radius:6px;padding:1px;background:var(--panel2)}
.field .val{font-variant-numeric:tabular-nums;color:var(--fg);min-width:34px;font-family:var(--f-mono);font-size:11px}
textarea.txt{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:220px;height:76px;resize:none;line-height:1.35}
.seg{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;background:var(--panel2)}
.seg button{border:0;background:transparent;padding:3px 9px;height:26px;display:flex;align-items:center}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent-soft);color:var(--fg)}
.gallery{display:flex;gap:4px;overflow-x:auto;max-width:min(600px,78vw);padding-bottom:2px}
.tile{border:1px solid transparent;background:transparent;border-radius:7px;padding:3px;display:flex;flex-direction:column;align-items:center;gap:3px;width:82px;flex:none}
.tile:hover{background:var(--panel2);border-color:var(--line)}
.tile.on{border-color:var(--accent);background:var(--accent-soft)}
.tile canvas,.tile .sw{width:72px;height:40px;border-radius:4px;display:block;background:#222;overflow:hidden;position:relative}
.tile .sw img{width:100%;height:100%;object-fit:cover;display:block}
.tile span{font-size:10.5px;line-height:1.15;text-align:center;color:var(--fg);height:2.3em;overflow:hidden}
.sw.bars::before,.sw.bars::after{content:"";position:absolute;left:0;right:0;height:6px;background:#000;z-index:1}
.sw.bars::before{top:0}.sw.bars::after{bottom:0}
.sw .fadeov{position:absolute;inset:0}
.hint{font-size:12px;color:var(--muted);max-width:220px;line-height:1.4;white-space:normal;padding:4px 2px}

.work{flex:1;min-height:0;display:grid;grid-template-columns:minmax(300px,44%) 1fr;gap:10px}
.monitor-pane{display:flex;flex-direction:column;gap:6px;min-width:0;min-height:0}
.monitor{background:var(--monitor);border-radius:8px;display:flex;align-items:center;justify-content:center;overflow:hidden;flex:1;min-height:0;position:relative}
.monitor canvas{max-width:100%;max-height:100%;display:block;aspect-ratio:16/9}
.monitor:fullscreen canvas{width:100%;height:100%;object-fit:contain}
#scrub{width:100%;accent-color:var(--accent);margin:0}
.transport{display:flex;align-items:center;gap:4px}
.tc{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);margin-left:auto}
.tc b{color:var(--fg);font-weight:500}
.playbtn{width:42px;height:42px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.playbtn svg.i{width:18px;height:18px}

.board-pane{background:var(--panel);border:1px solid var(--line);border-radius:10px;min-width:0;min-height:0;display:flex;flex-direction:column}
.board{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;touch-action:pan-y;min-height:0}
#rows{position:relative;margin:14px 12px 24px;user-select:none;-webkit-user-select:none}
.rowbg{position:absolute;left:-4px;right:-4px;background:var(--rowbg);border-radius:6px}
.clip{position:absolute;border-radius:3px;background-color:#333;background-repeat:repeat-x;background-size:auto 100%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.35);overflow:hidden;cursor:grab}
.clip.title{background-image:none;color:#fff;font-size:11px;font-weight:600}
.clip .tlabel{position:absolute;left:6px;right:4px;top:50%;transform:translateY(-50%);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.clip.sel{box-shadow:inset 0 0 0 2px var(--accent),0 0 0 2px var(--accent);z-index:2}
.clip .tmark{position:absolute;left:0;top:0;width:0;height:0;border-top:14px solid rgba(255,255,255,.92);border-right:14px solid transparent}
.clip .badges{position:absolute;right:3px;bottom:3px;display:flex;gap:2px}
.clip .badges b{font-size:9px;font-weight:600;background:rgba(0,0,0,.6);color:#fff;border-radius:3px;padding:0 3px;line-height:13px}
.clip.dragging,.bar.dragging{opacity:.55}
.bar{position:absolute;height:18px;border-radius:3px;font-size:10.5px;line-height:18px;padding:0 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:grab}
.bar.cap{background:var(--cap-soft);color:var(--fg);box-shadow:inset 0 0 0 1px var(--cap)}
.bar.mus{background:var(--music-soft);color:var(--fg);box-shadow:inset 0 0 0 1px var(--music)}
.bar.mus .wave{position:absolute;inset:2px 0;background:var(--music);opacity:.45;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}
.bar.mus .nm{position:relative}
.bar.sel{box-shadow:inset 0 0 0 2px var(--accent);z-index:2}
.playhead{position:absolute;width:2px;background:var(--fg);pointer-events:none;z-index:5;margin-left:-1px;top:0}
.playhead::before{content:"";position:absolute;top:-6px;left:-4px;border:5px solid transparent;border-top-color:var(--fg)}
.dropmark{position:absolute;width:3px;background:var(--accent);margin-left:-1.5px;border-radius:2px;z-index:6;pointer-events:none}
.empty{position:absolute;left:0;right:0;top:0;border:1.5px dashed var(--line);background:var(--panel2);border-radius:6px;color:var(--muted);font-size:13px;padding:0 12px}
.empty:hover{border-color:var(--accent);color:var(--fg)}
.board.dropping{outline:2px dashed var(--accent);outline-offset:-6px}

.status{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap;padding:0 2px}
.status b{color:var(--fg);font-weight:500;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--fg);border-radius:999px;padding:2px 4px 2px 10px}
.chip button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 9px;font-size:11.5px;font-weight:600}
.status .zoom{display:flex;align-items:center;gap:6px;margin-left:auto}
.status input[type=range]{width:110px;accent-color:var(--accent)}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:8px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100vw - 32px);z-index:50;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.modal{position:fixed;inset:0;background:rgba(5,8,15,.55);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px}
.dialog{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(520px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.dialog h2{margin:0;font-family:var(--f-display);font-size:19px;font-weight:700}
.dialog p{margin:0;color:var(--muted);line-height:1.45}
.progress{height:8px;background:var(--rowbg);border-radius:4px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0}
.dialog video{width:100%;border-radius:8px;background:#000;max-height:50vh}
.dialog .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.ghost{border:1px solid var(--line);background:transparent;border-radius:8px;padding:8px 14px}
#vidhold{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none;overflow:hidden}

@media (max-width:820px){
  html,body{height:auto}
  .app{height:auto}
  .work{display:flex;flex-direction:column}
  .monitor{flex:none;aspect-ratio:16/9}
  .monitor.std{aspect-ratio:4/3}
  .board-pane{min-height:340px}
  .board{max-height:none}
  #projName{width:100%;order:3}
  .appbar .spacer{display:none}
}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

</head>
<body>
<div class="app">
  <header class="appbar">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="6" width="26" height="20" rx="4" fill="var(--accent)"/><g fill="var(--panel2)"><rect x="6" y="8.5" width="2.5" height="2.5" rx=".6"/><rect x="6" y="14.75" width="2.5" height="2.5" rx=".6"/><rect x="6" y="21" width="2.5" height="2.5" rx=".6"/><rect x="23.5" y="8.5" width="2.5" height="2.5" rx=".6"/><rect x="23.5" y="14.75" width="2.5" height="2.5" rx=".6"/><rect x="23.5" y="21" width="2.5" height="2.5" rx=".6"/><path d="M13.5 11.5v9l7-4.5z"/></g></svg>Frameline</div>
    <input id="projName" aria-label="Project name" spellcheck="false">
    <div class="spacer"></div>
    <button class="iconbtn" id="undoBtn" data-act="undo" title="Undo (Ctrl+Z)" aria-label="Undo"></button>
    <button class="iconbtn" id="redoBtn" data-act="redo" title="Redo (Ctrl+Y)" aria-label="Redo"></button>
    <button class="primary" data-act="export" id="saveTop"></button>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Ribbon"></nav>
  <section class="ribbon" id="ribbon"></section>
  <main class="work">
    <section class="monitor-pane">
      <div class="monitor" id="monitor"><canvas id="screen" width="1280" height="720" aria-label="Preview monitor"></canvas></div>
      <input type="range" id="scrub" min="0" max="1000" value="0" step="1" aria-label="Seek">
      <div class="transport">
        <button class="iconbtn" data-act="prev" title="Previous frame (←)" aria-label="Previous frame" id="bPrev"></button>
        <button class="playbtn" data-act="play" title="Play / pause (Space)" aria-label="Play" id="bPlay"></button>
        <button class="iconbtn" data-act="next" title="Next frame (→)" aria-label="Next frame" id="bNext"></button>
        <span class="tc" id="tc"><b>00:00.00</b> / 00:00.00</span>
        <button class="iconbtn" data-act="fullscreen" title="Full screen preview" aria-label="Full screen preview" id="bFs"></button>
      </div>
    </section>
    <section class="board-pane" aria-label="Storyboard">
      <div class="board" id="board"><div id="rows"></div></div>
    </section>
  </main>
  <footer class="status" id="status"></footer>
</div>
<input type="file" id="fileMedia" multiple accept="image/*,video/*" hidden>
<input type="file" id="fileMusic" accept="audio/*" hidden>
<div id="toast" role="status" aria-live="polite"></div>
<div class="modal" id="modal" hidden><div class="dialog" id="dialog"></div></div>
<div id="vidhold" aria-hidden="true"></div>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const ease=q=>1-Math.pow(1-q,3);
const fmt=t=>{t=Math.max(0,t||0);const m=Math.floor(t/60),s=t-m*60;return String(m).padStart(2,'0')+':'+s.toFixed(2).padStart(5,'0')};
let uidN=1; const nid=p=>p+(uidN++)+Math.random().toString(36).slice(2,6);

/* ---------- icons ---------- */
const P={
 addmedia:'<rect x="2.5" y="5" width="14" height="14" rx="2"/><path d="M2.5 9h14M6.5 5v4M12.5 5v4M20 9v8M16 13h8"/>',
 music:'<path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>',
 musichere:'<path d="M3.5 3v18"/><path d="M11 17V7l9-2v10"/><circle cx="8.5" cy="17" r="2.5"/><circle cx="17.5" cy="15" r="2.5"/>',
 camera:'<path d="M3.5 8h3.5l2-3h6l2 3h3.5v11h-17z"/><circle cx="12" cy="13" r="3.5"/>',
 title:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 9h8M12 9v7"/>',
 caption:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 14h10M9 17h6"/>',
 credits:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 8h8M9.5 11h5M8 14h8M10 17h4"/>',
 rotl:'<path d="M4 4v5h5"/><path d="M4.6 9A8 8 0 1 1 6 17.3"/>',
 rotr:'<path d="M20 4v5h-5"/><path d="M19.4 9A8 8 0 1 0 18 17.3"/>',
 remove:'<path d="M4.5 7h15M10 7V4.5h4V7M6.5 7l1 13h9l1-13"/>',
 export:'<path d="M12 3v11M7.5 9.5L12 14l4.5-4.5"/><path d="M4 16v4h16v-4"/>',
 split:'<path d="M12 2.5v19"/><path d="M3.5 7h5v10h-5zM15.5 7h5v10h-5z"/>',
 setstart:'<path d="M5.5 4v16"/><path d="M9.5 7h10v10h-10z"/>',
 setend:'<path d="M18.5 4v16"/><path d="M4.5 7h10v10h-10z"/>',
 earlier:'<path d="M14.5 6l-6 6 6 6"/>', later:'<path d="M9.5 6l6 6-6 6"/>',
 undo:'<path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
 redo:'<path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/>',
 play:'<path d="M7 4.5l12.5 7.5L7 19.5z" fill="currentColor"/>',
 pause:'<path d="M7 4.5h3.5v15H7zM13.5 4.5H17v15h-3.5z" fill="currentColor"/>',
 prev:'<path d="M6 5v14"/><path d="M18.5 5.5L9.5 12l9 6.5z" fill="currentColor"/>',
 next:'<path d="M18 5v14"/><path d="M5.5 5.5l9 6.5-9 6.5z" fill="currentColor"/>',
 fs:'<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
 zoomin:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.4-4.4M8 11h6M11 8v6"/>',
 zoomout:'<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.4-4.4M8 11h6"/>',
 fit:'<path d="M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4"/>',
 wide:'<rect x="1.5" y="6.5" width="21" height="11.8" rx="1.5"/>',
 std:'<rect x="4" y="4.5" width="16" height="15" rx="1.5"/>',

/* ---------- playback ---------- */
let renderQueued=false;
function requestRender(){if(playing||renderQueued)return;renderQueued=true;requestAnimationFrame(()=>{renderQueued=false;render()})}
function render(){syncVideos(t);drawFrame(t);updateTransport();placePlayhead()}
function clock(){return ac?playStartT+(ac.currentTime-playStartAc):playStartT+(performance.now()-playStartPerf)/1000}
function play(){if(!TL.items.length){toast('Add videos or photos first.');return}
  ensureAudio();ac.resume&&ac.resume();if(t>=TL.total-.02)t=0;playing=true;
  playStartT=t;playStartAc=ac.currentTime;playStartPerf=performance.now();startMusic(t);updatePlayBtn();requestAnimationFrame(loop)}
function pause(){if(!playing)return;playing=false;stopMusic();syncVideos(t);for(const el of clipVideos.values())if(!el.paused)el.pause();updatePlayBtn();render()}
function loop(){if(!playing)return;t=clock();
  if(playUntil!=null&&t>=playUntil){playUntil=null;pause();return}
  if(t>=TL.total){t=TL.total;render();pause();if(onPlaybackEnd)onPlaybackEnd();return}
  render();if(exporting)updateExport();requestAnimationFrame(loop)}
function seek(v){t=clamp(v,0,TL.total);if(playing){playStartT=t;playStartAc=ac.currentTime;playStartPerf=performance.now();startMusic(t)}render()}
function updatePlayBtn(){const b=$('#bPlay');b.innerHTML=ic(playing?'pause':'play');b.setAttribute('aria-label',playing?'Pause':'Play')}
function updateTransport(){$('#tc').innerHTML=`<b>${fmt(t)}</b> / ${fmt(TL.total)}`;const s=$('#scrub');if(document.activeElement!==s||playing)s.value=TL.total?Math.round(t/TL.total*1000):0}

/* ---------- hist ---------- */
function snap(){return JSON.stringify(project)}
function pushHistory(){hist.push(snap());if(hist.length>80)hist.shift();future=[];updateUndo()}
function undo(){if(!hist.length)return;future.push(snap());project=JSON.parse(hist.pop());afterLoad()}
function redo(){if(!future.length)return;hist.push(snap());project=JSON.parse(future.pop());afterLoad()}

  for(const[id,el]of clipVideos)if(!project.clips.some(c=>c.id===id)&&!el.paused)el.pause();

/* ---------- default objects ---------- */

function baseClip(o){return Object.assign({id:nid('c'),kind:'media',dur:5,trimIn:0,trimOut:0,speed:1,volume:1,rotate:0,effect:'none',brightness:0,pan:'none',trans:{type:'none',dur:1}},o)}
function titleClip(o,tx){return baseClip(Object.assign({kind:'title',bg:'#1d2b4f',dur:5,text:newText(Object.assign({font:'Bricolage Grotesque',size:84,content:project.name||'My Movie'},tx))},o))}
function blankProject(name){return{name:name||'My Movie',aspect:'16:9',mix:0,clips:[],captions:[],music:[]}}

/* ---------- media import ---------- */
function makeThumb(el,w,h){const th=60,tw=Math.max(20,Math.round(th*w/h)),c=document.createElement('canvas');c.width=tw;c.height=th;
  try{c.getContext('2d').drawImage(el,0,0,tw,th);return c.toDataURL('image/jpeg',.7)}catch(e){return''}}
function makeWave(buf){const n=600,c=document.createElement('canvas');c.width=n;c.height=40;const g=c.getContext('2d');const d=buf.getChannelData(0),step=Math.max(1,Math.floor(d.length/n));
  g.fillStyle='#000';let mx=0;const pk=[];for(let i=0;i<n;i++){let m=0;for(let j=i*step;j<(i+1)*step&&j<d.length;j+=8)m=Math.max(m,Math.abs(d[j]));pk.push(m);mx=Math.max(mx,m)}
  pk.forEach((m,i)=>{const hh=Math.max(1,m/(mx||1)*38);g.fillRect(i,20-hh/2,1,hh)});return c.toDataURL()}
function loadImage(f){return new Promise((res,rej)=>{const url=URL.createObjectURL(f),img=new Image();img.onload=()=>res({id:nid('m'),kind:'image',el:img,url,w:img.naturalWidth,h:img.naturalHeight,name:f.name,thumb:makeThumb(img,img.naturalWidth,img.naturalHeight)});img.onerror=()=>rej();img.src=url})}
function loadVideo(f){return new Promise((res,rej)=>{const url=URL.createObjectURL(f),v=document.createElement('video');v.muted=true;v.playsInline=true;v.preload='auto';
  let done=false;const fail=()=>{if(!done){done=true;rej()}};v.onerror=fail;setTimeout(fail,20000);
  v.onloadedmetadata=()=>{let d=v.duration;if(!isFinite(d)||!d)d=10;v.currentTime=Math.min(1,d*.1);
    v.onseeked=()=>{if(done)return;done=true;res({id:nid('m'),kind:'video',url,w:v.videoWidth,h:v.videoHeight,duration:d,name:f.name,thumb:makeThumb(v,v.videoWidth||16,v.videoHeight||9)})}};
  $('#vidhold').appendChild(v);v.src=url})}
async function loadAudio(f){ensureAudio();const ab=await f.arrayBuffer();const buf=await new Promise((res,rej)=>{const p=ac.decodeAudioData(ab,res,rej);if(p&&p.then)p.then(res,rej)});
  return{id:nid('m'),kind:'audio',buffer:buf,duration:buf.duration,name:f.name.replace(/\.[^.]+$/,''),wave:makeWave(buf)}}
async function importFiles(files){files=[...files];if(!files.length)return;
  const audio=files.filter(f=>f.type.startsWith('audio/')),vis=files.filter(f=>f.type.startsWith('image/')||f.type.startsWith('video/'));
  if(vis.length){toast(`Adding ${vis.length} item${vis.length>1?'s':''}…`);const add=[];
    for(const f of vis){try{const m=f.type.startsWith('image/')?await loadImage(f):await loadVideo(f);media.set(m.id,m);
      add.push(baseClip(m.kind==='video'?{mediaId:m.id,trimIn:0,trimOut:m.duration}:{mediaId:m.id,dur:7}))}
      catch(e){toast(`Couldn't open ${f.name}. Your browser can't read this format.`)}}
    if(add.length){pushHistory();clearSample();const sc=selClip();let at=sc?project.clips.indexOf(sc)+1:project.clips.length;project.clips.splice(at,0,...add);
      sel={type:'clip',id:add[0].id};invalidate(true);seek(itemOf(add[0].id).start);toast(`Added ${add.length} item${add.length>1?'s':''}`)}}
  for(const f of audio)await addMusicFile(f,addMusicAt)}
let addMusicAt='start';
async function addMusicFile(f,where){try{const m=await loadAudio(f);media.set(m.id,m);pushHistory();clearSample();
    const lastEnd=Math.max(0,...project.music.map(x=>x.start+musLen(x)));
    const mu={id:nid('a'),mediaId:m.id,start:where==='here'?t:(project.music.length?lastEnd:0),offset:0,end:m.duration,volume:1,fadeIn:'none',fadeOut:'none'};
    project.music.push(mu);sel={type:'music',id:mu.id};tab='options';invalidate(true);toast(`Added music: ${m.name}`)}
  catch(e){toast(`Couldn't open ${f.name}. Try an MP3, M4A, WAV or OGG file.`)}}
function clearSample(){if(isSample){isSample=false;renderStatus()}}

/* ---------- storyboard ---------- */
const boardEl=$('#board'),rowsEl=$('#rows');let BL=null;
function renderBoard(){
  const bw=Math.max(120,rowsEl.clientWidth||boardEl.clientWidth-24),pxs=(ui.thumbs==='large'?28:18)*ui.zoom,rowSec=Math.max(.5,bw/pxs),thumbH=ui.thumbs==='large'?64:42;
  const hasCap=project.captions.length>0,hasMus=project.music.length>0,laneCap=thumbH+4,laneMus=thumbH+4+(hasCap?22:0);
  const rowH=thumbH+(hasCap?22:0)+(hasMus?22:0)+4,gap=16;
  const span=Math.max(TL.total,...project.captions.map(c=>c.start+c.dur),...project.music.map(m=>m.start+musLen(m)),.001);
  const nRows=Math.max(1,Math.ceil(span/rowSec-1e-6));BL={pxs,rowSec,rowH,gap,thumbH,nRows,laneCap,laneMus,span};
  let h='';for(let r=0;r<nRows;r++)h+=`<div class="rowbg" style="top:${r*(rowH+gap)-2}px;height:${rowH+2}px"></div>`;
  if(!TL.items.length)h+=`<button class="empty" data-act="addMedia" style="height:${thumbH}px">Click here to browse for videos and photos, or drop files here</button>`;

    const fx=[];if(c.pan&&c.pan!=='none')fx.push('PZ');if(c.effect&&c.effect!=='none')fx.push('FX');if(isVid(c)&&c.speed!==1)fx.push(c.speed+'×');
    h+=pieces(it.start,it.vend,(r,x,w,off,first)=>{
      const bg=c.kind==='title'?`background-color:${c.bg}`:`background-image:url(${m?.thumb||''});background-position:${-off}px 0`;
      return `<div class="clip ${c.kind==='title'?'title':''} ${s?'sel':''}" data-type="clip" data-id="${c.id}" style="top:${r*(rowH+gap)}px;left:${x}px;width:${Math.max(2,w-1)}px;height:${thumbH}px;${bg}">${first&&i>0&&c.trans.type!=='none'?'<i class="tmark"></i>':''}${first&&c.kind==='title'?`<span class="tlabel">${esc(c.text.content.split('\n')[0])}</span>`:''}${first&&fx.length?`<span class="badges">${fx.map(b=>`<b>${b}</b>`).join('')}</span>`:''}</div>`})});
  project.captions.forEach(cap=>{const s=sel&&sel.type==='caption'&&sel.id===cap.id;
    h+=pieces(cap.start,cap.start+cap.dur,(r,x,w)=>`<div class="bar cap ${s?'sel':''}" data-type="caption" data-id="${cap.id}" style="top:${r*(rowH+gap)+laneCap}px;left:${x}px;width:${Math.max(4,w-1)}px">${esc(cap.text.content.replace(/\n/g,' '))}</div>`)});
  project.music.forEach(mu=>{const md=media.get(mu.mediaId),s=sel&&sel.type==='music'&&sel.id===mu.id,L=musLen(mu),full=(md?.duration||L)*pxs,wo=mu.offset*pxs;
    h+=pieces(mu.start,mu.start+L,(r,x,w,off,first)=>`<div class="bar mus ${s?'sel':''}" data-type="music" data-id="${mu.id}" style="top:${r*(rowH+gap)+laneMus}px;left:${x}px;width:${Math.max(4,w-1)}px"><i class="wave" style="-webkit-mask-image:url(${md?.wave});mask-image:url(${md?.wave});-webkit-mask-size:${full}px 100%;mask-size:${full}px 100%;-webkit-mask-position:${-(off+wo)}px 0;mask-position:${-(off+wo)}px 0"></i>${first?`<span class="nm">${esc(md?.name||'Music')}</span>`:''}</div>`)});
  h+=`<div class="playhead" id="playhead"></div><div class="dropmark" id="dropmark" hidden></div>`;
  rowsEl.innerHTML=h;rowsEl.style.height=(nRows*(rowH+gap))+'px';placePlayhead()}
function pieces(a,b,fn){const{rowSec,pxs}=BL;if(b<=a+1e-6)return'';let out='',r=Math.floor(a/rowSec+1e-9);
  while(r*rowSec<b-1e-9){const s=Math.max(a,r*rowSec),e=Math.min(b,(r+1)*rowSec);if(e>s+1e-6)out+=fn(r,(s-r*rowSec)*pxs,(e-s)*pxs,(s-a)*pxs,Math.abs(s-a)<1e-9);r++}return out}
function timeToPos(tt){const{rowSec,pxs,rowH,gap,nRows}=BL;let r=Math.floor(tt/rowSec+1e-9);let x=(tt-r*rowSec)*pxs;
  if(r>=nRows){r=nRows-1;x=rowSec*pxs}if(r>0&&x<1e-6&&tt>=BL.span-1e-6){r--;x=rowSec*pxs}return{top:r*(rowH+gap),left:x}}
function pointerToTime(cx,cy){const rc=rowsEl.getBoundingClientRect(),{rowSec,pxs,rowH,gap,nRows}=BL;
  const r=clamp(Math.floor((cy-rc.top+gap/2)/(rowH+gap)),0,nRows-1);return r*rowSec+clamp((cx-rc.left)/pxs,0,rowSec)}
function placePlayhead(){const ph=document.getElementById('playhead');if(!ph||!BL)return;const p=timeToPos(t);ph.style.top=(p.top-4)+'px';ph.style.left=p.left+'px';ph.style.height=(BL.rowH+6)+'px';
  if(playing){const br=boardEl.getBoundingClientRect(),pr=ph.getBoundingClientRect();if(pr.bottom>br.bottom||pr.top<br.top)boardEl.scrollTop+=pr.top-br.top-40}}

let dragS=null;
rowsEl.addEventListener('pointerdown',e=>{if(e.button>0||e.target.closest('.empty'))return;const el=e.target.closest('[data-type]');
  dragS={x:e.clientX,y:e.clientY,el,t0:pointerToTime(e.clientX,e.clientY),id:el?.dataset.id,type:el?.dataset.type,active:false,touch:e.pointerType==='touch',timer:null};
  if(dragS.touch&&el)dragS.timer=setTimeout(()=>{if(dragS&&!dragS.active)beginDrag()},380)});

  if(!dragS.active){if(Math.hypot(e.clientX-dragS.x,e.clientY-dragS.y)>6){if(dragS.touch){clearTimeout(dragS.timer);dragS=null;return}if(dragS.el)beginDrag();else return}else return}
  updateDrag(pointerToTime(e.clientX,e.clientY),e.clientY)});

function updateDrag(tn,cy){const d=dragS;
  const br=boardEl.getBoundingClientRect();if(cy>br.bottom-30)boardEl.scrollTop+=12;else if(cy<br.top+30)boardEl.scrollTop-=12;

  else{const arr=d.type==='caption'?project.captions:project.music,o=arr.find(x=>x.id===d.id);o.start=Math.max(0,Math.round((d.orig+tn-d.t0)*10)/10);
    renderBoard();rowsEl.querySelectorAll(`[data-id="${d.id}"]`).forEach(n=>n.classList.add('dragging'));requestRender()}}
function endDrag(d){if(d.type==='clip'&&d.idx!=null){const from=project.clips.findIndex(c=>c.id===d.id);const[c]=project.clips.splice(from,1);project.clips.splice(d.idx,0,c)}

  openModal(`<h2>Your movie is ready</h2><video controls playsinline src="${url}"></video><p>${esc(fname)} · ${(blob.size/1048576).toFixed(1)} MB · ${ui.quality}p ${ext.toUpperCase()}</p><div class="row"><button class="ghost" id="resClose">Close</button><button class="primary" id="resSave">${ic('export')}Save to device</button></div>`);
  $('#resClose').onclick=closeModal;$('#resSave').onclick=()=>saveBlob(blob,fname)}

let toastT;function toast(m){const el=$('#toast');el.textContent=m;el.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2600)}
document.addEventListener('keydown',e=>{if(exporting)return;const tg=e.target.tagName;if(['INPUT','TEXTAREA','SELECT'].includes(tg)&&e.target.type!=='range')return;
  const mod=e.ctrlKey||e.metaKey;
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();pause();e.shiftKey?redo():undo();return}
  if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();pause();redo();return}
  if(e.key===' '){e.preventDefault();doAct('play');}
  else if(e.key==='ArrowLeft'){e.preventDefault();pause();seek(t-(e.shiftKey?1:1/30))}
  else if(e.key==='ArrowRight'){e.preventDefault();pause();seek(t+(e.shiftKey?1:1/30))}
  else if(e.key==='Delete'||e.key==='Backspace'){if(sel){e.preventDefault();removeSel()}}
  else if(e.key.toLowerCase()==='m'&&!mod){splitAt()}
  else if(e.key==='Home'){seek(0)}else if(e.key==='End'){seek(TL.total)}});

function rng(seed){return()=>{seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}}
function scene(kind){const c=document.createElement('canvas');c.width=1280;c.height=720;const g=c.getContext('2d'),r=rng(kind.length*977+kind.charCodeAt(0));
  const sky=st=>{const gr=g.createLinearGradient(0,0,0,720);st.forEach(([o,cl])=>gr.addColorStop(o,cl));g.fillStyle=gr;g.fillRect(0,0,1280,720)};
  const ridge=(base,amp,cl,sd)=>{g.fillStyle=cl;g.beginPath();g.moveTo(0,720);for(let x=0;x<=1280;x+=6)g.lineTo(x,base+Math.sin(x*.004+sd)*amp+Math.sin(x*.011+sd*2)*amp*.45+Math.sin(x*.033+sd*3)*amp*.12);g.lineTo(1280,720);g.fill()};
  const sun=(x,y,rad,core,glow)=>{const gr=g.createRadialGradient(x,y,rad*.6,x,y,rad*4);gr.addColorStop(0,glow);gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,1280,720);g.fillStyle=core;g.beginPath();g.arc(x,y,rad,0,7);g.fill()};
  if(kind==='ridge'){sky([[0,'#283a69'],[.45,'#d9806b'],[.72,'#f4c58f']]);sun(840,430,62,'#ffe9b8','rgba(255,214,150,.55)');
    ridge(430,40,'#9a7089',1);ridge(485,50,'#71527a',2.3);ridge(545,45,'#4c3b5f',4.1);ridge(615,38,'#2a2340',5.7)}
  else if(kind==='coast'){sky([[0,'#78b3d6'],[.55,'#f3d9b4']]);sun(400,355,46,'#fff4d6','rgba(255,236,190,.6)');
    const sea=g.createLinearGradient(0,400,0,720);sea.addColorStop(0,'#3d7fa1');sea.addColorStop(1,'#123049');g.fillStyle=sea;g.fillRect(0,400,1280,320);
    for(let y=404;y<720;y+=5){const a=.55*(1-(y-400)/320),w=40+r()*140*(1-(y-400)/400);g.fillStyle=`rgba(255,240,205,${a.toFixed(2)})`;g.fillRect(400-w/2+(r()-.5)*30,y,w,2)}
    g.fillStyle='#24384a';g.beginPath();g.moveTo(860,402);g.bezierCurveTo(960,330,1100,300,1280,320);g.lineTo(1280,402);g.fill();
    g.fillStyle='#fff';g.beginPath();g.moveTo(640,440);g.lineTo(640,392);g.lineTo(668,438);g.fill();g.fillStyle='#1c2a38';g.fillRect(622,440,56,6)}
  else if(kind==='road'){sky([[0,'#4f97d3'],[.62,'#d3e6f2']]);
    g.fillStyle='#b5633e';g.beginPath();g.moveTo(80,470);g.lineTo(120,360);g.lineTo(330,360);g.lineTo(370,470);g.fill();
    g.fillStyle='#9a4d32';g.beginPath();g.moveTo(880,470);g.lineTo(910,400);g.lineTo(1040,400);g.lineTo(1090,470);g.fill();
    g.fillStyle='#d9a96e';g.fillRect(0,468,1280,252);g.fillStyle='#38383e';g.beginPath();g.moveTo(610,468);g.lineTo(670,468);g.lineTo(1120,720);g.lineTo(160,720);g.fill();
    g.fillStyle='#f3e7c4';for(let k=0;k<9;k++){const z0=k/9,z1=(k+.5)/9,y0=468+252*z0*z0,y1=468+252*z1*z1,w0=2+10*z0*z0,w1=2+10*z1*z1;g.beginPath();g.moveTo(640-w0/2,y0);g.lineTo(640+w0/2,y0);g.lineTo(640+w1/2,y1);g.lineTo(640-w1/2,y1);g.fill()}}
  else{sky([[0,'#060a1c'],[.7,'#1c2450'],[1,'#3a3666']]);for(let i=0;i<260;i++){g.fillStyle=`rgba(255,255,255,${(.3+r()*.7).toFixed(2)})`;const s=r()<.1?2:1;g.fillRect(r()*1280,r()*460,s,s)}
    sun(1020,150,44,'#f3efdb','rgba(220,225,255,.18)');let x=0;while(x<1280){const w=40+r()*80,h=120+r()*300;g.fillStyle='#0b0e21';g.fillRect(x,720-h,w,h);
      for(let wy=720-h+10;wy<710;wy+=16)for(let wx=x+6;wx<x+w-8;wx+=12)if(r()<.32){g.fillStyle=`rgba(255,${190+(r()*40|0)},110,${(.5+r()*.5).toFixed(2)})`;g.fillRect(wx,wy,6,8)}x+=w+2}}
  return c}
async function synthMusic(sec){const sr=22050,oc=new (window.OfflineAudioContext||window.webkitOfflineAudioContext)(2,Math.ceil(sr*sec),sr);
  const beat=60/96,bar=beat*4,chords=[[60,64,67],[67,71,74],[69,72,76],[65,69,72]],f=m=>440*Math.pow(2,(m-69)/12);
  const mst=oc.createGain();mst.gain.setValueAtTime(.5,0);mst.gain.setValueAtTime(.5,sec-2.5);mst.gain.linearRampToValueAtTime(0,sec);mst.connect(oc.destination);
  const lp=oc.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1200;lp.connect(mst);
  for(let b=0;b*bar<sec;b++){const ch=chords[b%4],t0=b*bar;
    ch.forEach(n=>{const o=oc.createOscillator();o.type='sawtooth';o.frequency.value=f(n-12);o.detune.value=(n%3-1)*6;const g=oc.createGain();
      g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.045,t0+.7);g.gain.setValueAtTime(.045,t0+bar-.3);g.gain.linearRampToValueAtTime(0,t0+bar+.25);o.connect(g).connect(lp);o.start(t0);o.stop(t0+bar+.3)});
    const bo=oc.createOscillator();bo.type='sine';bo.frequency.value=f(ch[0]-24);const bg=oc.createGain();bg.gain.value=0;
    for(let k=0;k<4;k++){const tt=t0+k*beat;bg.gain.setValueAtTime(.22,tt);bg.gain.exponentialRampToValueAtTime(.03,tt+beat*.9)}bo.connect(bg).connect(mst);bo.start(t0);bo.stop(t0+bar);
    if(b>0)[0,1,2,1,0,2,1,2].forEach((ix,k)=>{const tt=t0+k*beat/2,o=oc.createOscillator();o.type='triangle';o.frequency.value=f(ch[ix]+12);const g=oc.createGain();
      g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(.07,tt+.01);g.gain.exponentialRampToValueAtTime(.001,tt+.38);o.connect(g).connect(mst);o.start(tt);o.stop(tt+.4)})}
  return oc.startRendering()}
let sampleCache=null;
async function loadSample(withHistory){
  if(!sampleCache){const sc={};for(const k of ['ridge','coast','road','night']){const cv=scene(k),m={id:nid('m'),kind:'image',el:cv,w:1280,h:720,name:k,thumb:makeThumb(cv,1280,720)};media.set(m.id,m);sc[k]=m.id}
    try{const buf=await synthMusic(27);const m={id:nid('m'),kind:'audio',buffer:buf,duration:buf.duration,name:'Sample tune · Open Road',wave:makeWave(buf)};media.set(m.id,m);sc.music=m.id}catch(e){}
    sampleCache=sc}
  const S=sampleCache;if(withHistory)pushHistory();
  project=blankProject('Coastline Weekend');
  const cl=project.clips;
  cl.push(titleClip({bg:'#16233f',dur:4},{content:'Coastline Weekend',size:92,effect:'fade'}));
  cl.push(baseClip({mediaId:S.ridge,dur:5,pan:'zoomin',trans:{type:'crossfade',dur:1}}));
  cl.push(baseClip({mediaId:S.coast,dur:5,pan:'panright',trans:{type:'diagonal',dur:1.25}}));
  cl.push(baseClip({mediaId:S.road,dur:5,pan:'zoomout',effect:'warm',trans:{type:'circle',dur:1}}));
  cl.push(baseClip({mediaId:S.night,dur:5.5,pan:'panup',trans:{type:'fadeblack',dur:1.25}}));
  cl.push(titleClip({bg:'#000000',dur:7,trans:{type:'crossfade',dur:1}},{content:'Photographed by\nThe passenger seat\n\nDriving\nWhoever lost the coin toss\n\nMusic\nOpen Road (sample tune)',size:44,font:'IBM Plex Sans',effect:'scroll',bold:false}));
  project.captions.push({id:nid('t'),start:4.6,dur:3.4,text:newText({content:'Day one: leaving before sunrise',pos:'bottom',size:40,effect:'fade'})});
  project.captions.push({id:nid('t'),start:12.2,dur:3.4,text:newText({content:'Route 1, somewhere south',pos:'bottom',size:40,effect:'type',font:'Courier New'})});
  if(S.music)project.music.push({id:nid('a'),mediaId:S.music,start:0,offset:0,end:media.get(S.music).duration,volume:.9,fadeIn:'slow',fadeOut:'slow'});
  isSample=true;sel=null;tab='home';t=2.2;afterLoad()}
