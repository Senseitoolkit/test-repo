<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reading Lesson Builder</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&family=Playfair+Display:wght@700&display=swap" rel="stylesheet" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body { font-family: 'Nunito', sans-serif; background: #0f0f18; color: #1a1a2e; }
h1, h2 { font-family: 'Playfair Display', serif; }

.fs-btn { position: fixed; top: 14px; right: 14px; z-index: 300; background: rgba(26,26,46,0.85); color: #fff; border: 1.5px solid rgba(255,255,255,0.28); border-radius: 12px; width: 40px; height: 40px; font-size: 16px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; }
.fs-btn:hover { background: #1a1a2e; }

.app-frame { position: relative; width: 100vw; min-height: 100vh; overflow: hidden; background: #fff; }
.screen { display: none; }
.screen.active { display: flex; flex-direction: column; min-height: 100vh; }
.page-shell { flex: 1; display: flex; flex-direction: column; min-height: 100vh; }

/* header band */
.ph { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: clamp(16px,2.4vh,30px) clamp(64px,5vw,92px) clamp(16px,2.4vh,30px) clamp(24px,3.2vw,56px); }
.ph-left { display: flex; align-items: center; gap: clamp(12px,1.4vw,22px); min-width: 0; }
.page-icon { width: clamp(52px,5vw,86px); height: clamp(52px,5vw,86px); object-fit: contain; flex-shrink: 0; display: block; }
.ph h2 { font-size: clamp(30px,3.6vw,58px); line-height: 1.02; color: #1a1a2e; }
.ph h2.hs-title { font-size: clamp(26px,3vw,50px); line-height: 1.05; }
.page-sub { font-size: clamp(13px,1.15vw,18px); color: #555; font-weight: 600; margin-top: 5px; }
.ph-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
.mini-btn { background: rgba(255,255,255,0.6); border: 1.5px solid rgba(255,255,255,0.85); border-radius: 12px; padding: clamp(7px,0.9vh,11px) clamp(11px,1.1vw,16px); font-family: 'Nunito', sans-serif; font-size: clamp(12px,1vw,15px); font-weight: 800; color: #1a1a2e; cursor: pointer; }
.mini-btn:hover { background: rgba(255,255,255,0.9); }
.focus-badge { background: rgba(255,255,255,0.72); border: 1.5px solid rgba(255,255,255,0.9); border-radius: 22px; padding: clamp(7px,0.9vh,11px) clamp(12px,1.2vw,18px); font-size: clamp(12px,1vw,16px); font-weight: 800; color: #1a1a2e; white-space: nowrap; }

/* body + footer */
.page-body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: clamp(14px,2.2vh,30px); padding: 0 clamp(24px,3.2vw,56px); }
.page-footer { padding: clamp(14px,2vh,24px) clamp(24px,3.2vw,56px) clamp(20px,2.6vh,36px); }
.btn-next-full { background: #1a1a2e; color: #fff; border: none; border-radius: 16px; font-family: 'Nunito', sans-serif; font-size: clamp(15px,1.4vw,22px); font-weight: 800; padding: clamp(13px,1.7vh,20px) 0; width: 100%; cursor: pointer; transition: background .15s, transform .15s; }
.btn-next-full:hover { background: #2d2d50; transform: translateY(-1px); }

.emphasis-banner { background: #1a1a2e; color: #fff; border-radius: 16px; padding: clamp(12px,1.6vh,20px) clamp(14px,1.4vw,22px); font-size: clamp(14px,1.3vw,20px); font-weight: 700; display: flex; gap: 10px; align-items: center; }
.emphasis-note { background: rgba(255,255,255,0.72); border: 1.5px dashed rgba(0,0,0,0.18); border-radius: 16px; padding: clamp(12px,1.8vh,20px) clamp(14px,1.5vw,22px); font-size: clamp(13px,1.25vw,19px); font-weight: 600; color: #333; line-height: 1.35; }
.emphasis-note b { color: #1a1a2e; }
.spot-tag { font-size: clamp(10px,0.85vw,13px); font-weight: 800; color: #b8860b; background: #fff7db; border: 1px solid #ffe08a; border-radius: 10px; padding: 3px 9px; white-space: nowrap; }
.spotlight { box-shadow: 0 0 0 3px #ffd166, 0 6px 22px rgba(0,0,0,0.12); }

/* FOCUS */
.pie-row { display: grid; grid-template-columns: repeat(3,1fr); gap: clamp(12px,1.6vw,26px); }
.pie-card { background: rgba(255,255,255,0.62); border-radius: 20px; padding: clamp(16px,3vh,40px) clamp(10px,1vw,18px); text-align: center; border: 1.5px solid rgba(255,255,255,0.9); transition: transform .15s, box-shadow .15s; }
.pie-card.selected { box-shadow: 0 0 0 3px #1565c0; background: #fff; transform: scale(1.03); }
.pie-letter { font-family: 'Playfair Display', serif; font-size: clamp(40px,4.8vw,80px); font-weight: 700; color: #1565c0; line-height: 1; }
.pie-word { font-size: clamp(13px,1.2vw,20px); font-weight: 700; color: #1a1a2e; margin-top: 8px; }
.focus-prompts { display: grid; grid-template-columns: repeat(auto-fit, minmax(clamp(220px,22vw,340px),1fr)); gap: clamp(12px,1.4vw,22px); }
.prompt-box { background: rgba(255,255,255,0.72); border-radius: 16px; padding: clamp(16px,2.2vh,28px); border: 1.5px solid rgba(255,255,255,0.95); }
.prompt-box.detail { background: #fff; box-shadow: 0 0 0 2px rgba(21,101,192,0.35); }
.prompt-box .q { font-size: clamp(12px,1vw,16px); color: #555; font-weight: 600; margin-bottom: 6px; }
.prompt-box .a { font-size: clamp(15px,1.4vw,23px); color: #1a1a2e; font-weight: 700; line-height: 1.25; }

/* FLUENCY */
.fluency-points { display: grid; grid-template-columns: repeat(3,1fr); gap: clamp(12px,1.6vw,26px); }
.fluency-point { display: flex; flex-direction: column; align-items: flex-start; gap: clamp(10px,1.4vh,18px); background: rgba(255,255,255,0.66); border-radius: 18px; padding: clamp(18px,3vh,38px) clamp(16px,1.6vw,26px); border: 1.5px solid rgba(255,255,255,0.9); }
.fp-dot { width: clamp(12px,1.1vw,18px); height: clamp(12px,1.1vw,18px); border-radius: 50%; background: #2e7d32; }
.fp-text { font-size: clamp(17px,1.8vw,30px); font-weight: 800; color: #1a1a2e; }
.tips { display: grid; grid-template-columns: repeat(auto-fit, minmax(clamp(240px,26vw,420px),1fr)); gap: clamp(12px,1.4vw,22px); }
.tip-card { background: rgba(255,255,255,0.62); border-radius: 16px; padding: clamp(14px,2vh,24px) clamp(14px,1.4vw,22px); border: 1.5px solid rgba(255,255,255,0.9); font-size: clamp(14px,1.3vw,21px); color: #2e4a2e; font-weight: 600; display: flex; align-items: flex-start; gap: 12px; }
.tip-icon { font-size: clamp(18px,1.7vw,28px); flex-shrink: 0; line-height: 1.1; }

/* HIGHLIGHT & STRATEGIZE */
.rw-body { padding-bottom: clamp(10px,1.6vh,20px); }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(14px,1.8vw,28px); flex: 1; }
.split-col { border-radius: 22px; padding: clamp(18px,2.6vh,36px) clamp(16px,1.6vw,28px); border: 1.5px solid rgba(255,255,255,0.7); }
.col-yellow { background: #fff9c4; }
.col-orange { background: #ffe0b2; }
.hs-heading { font-family: 'Playfair Display', serif; font-size: clamp(20px,2.2vw,36px); color: #1a1a2e; margin-bottom: clamp(12px,1.6vh,22px); display: flex; align-items: center; gap: 10px; }
.hs-ico { width: clamp(30px,2.8vw,46px); height: clamp(30px,2.8vw,46px); object-fit: contain; display: block; }
.highlight-item { display: flex; align-items: flex-start; gap: 10px; background: rgba(255,255,255,0.58); border-radius: 14px; padding: clamp(12px,1.8vh,20px) clamp(12px,1.2vw,18px); margin-bottom: 10px; border: 1.5px solid rgba(255,255,255,0.8); font-size: clamp(14px,1.4vw,22px); color: #3e2c00; font-weight: 600; }
.h-dot { width: clamp(9px,0.9vw,14px); height: clamp(9px,0.9vw,14px); border-radius: 50%; background: #f9a825; flex-shrink: 0; margin-top: 6px; }
.strategy-section { margin-bottom: clamp(10px,1.4vh,18px); }
.s-title { font-size: clamp(12px,1.05vw,16px); font-weight: 800; color: #bf360c; letter-spacing: 0.4px; margin-bottom: 8px; }
.s-item { background: rgba(255,255,255,0.58); border-radius: 13px; padding: clamp(10px,1.4vh,16px) clamp(11px,1.1vw,16px); margin-bottom: 8px; border: 1.5px solid rgba(255,255,255,0.8); }
.s-item .s-label { font-size: clamp(13px,1.25vw,20px); font-weight: 700; color: #3e1a00; }
.s-item .s-desc { font-size: clamp(12px,1.05vw,16px); color: #5d3e00; margin-top: 3px; font-weight: 500; }
.split-col .emphasis-note { margin-top: clamp(10px,1.4vh,16px); background: rgba(255,255,255,0.75); }

/* TIMER BARS */
.timer-bar { background: #1a1a2e; padding: clamp(14px,2vh,24px) clamp(24px,3.2vw,56px); display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.timer-label { font-size: clamp(12px,1vw,16px); color: #aaa; font-weight: 600; }
.timer-note { font-weight: 600; color: #8a8a9c; }
.timer-display { font-family: 'Playfair Display', serif; font-size: clamp(26px,3vw,52px); color: #fff; font-weight: 700; letter-spacing: 2px; line-height: 1; }
.timer-actions { display: flex; gap: 12px; align-items: center; }
.btn-timer-next { background: transparent; color: #fff; border: 1.5px solid rgba(255,255,255,0.4); border-radius: 12px; font-family: 'Nunito', sans-serif; font-size: clamp(14px,1.3vw,20px); font-weight: 700; padding: clamp(10px,1.3vh,15px) clamp(18px,1.8vw,30px); cursor: pointer; transition: background .15s; }
.btn-timer-next:hover { background: rgba(255,255,255,0.12); }
.skip-btn { background: transparent; border: 1.5px solid rgba(255,255,255,0.3); color: #cfcfe0; border-radius: 11px; padding: clamp(9px,1.2vh,14px) clamp(12px,1.2vw,18px); font-family: 'Nunito', sans-serif; font-size: clamp(12px,1vw,16px); font-weight: 700; cursor: pointer; }
.skip-btn:hover { background: rgba(255,255,255,0.1); }
.skip-btn.dark { border-color: #ccc; color: #888; }
.skip-btn.dark:hover { background: #f0f0f0; }

/* REVIEW */
.timer2-row { display: flex; align-items: center; justify-content: space-between; background: #f0f4ff; border-radius: 16px; padding: clamp(12px,1.6vh,20px) clamp(16px,1.6vw,26px); }
.timer2-label { font-size: clamp(12px,1vw,16px); color: #888; font-weight: 600; }
.timer2-display { font-family: 'Playfair Display', serif; font-size: clamp(24px,2.6vw,44px); color: #1a1a2e; letter-spacing: 1.5px; line-height: 1; }
.vipers-list { display: grid; grid-template-columns: repeat(3,1fr); gap: clamp(12px,1.4vw,22px); }
.viper-item { display: flex; align-items: flex-start; gap: 12px; background: #f8f8fc; border-radius: 16px; padding: clamp(14px,2vh,24px) clamp(14px,1.4vw,22px); border: 1.5px solid #eee; cursor: pointer; transition: border-color .15s, background .15s; }
.viper-item.spot { border-color: #ffcf5c; background: #fffbf0; }
.viper-item.checked { border-color: #66bb6a; background: #f1faf2; }
.viper-check { width: clamp(24px,2vw,32px); height: clamp(24px,2vw,32px); border-radius: 50%; border: 2px solid #ccc; flex-shrink: 0; display: flex; align-items: center; justify-content: center; margin-top: 2px; transition: all .15s; }
.viper-item.checked .viper-check { border-color: #43a047; background: #43a047; }
.viper-check-mark { color: #fff; font-size: clamp(13px,1.1vw,17px); font-weight: 800; display: none; }
.viper-item.checked .viper-check-mark { display: block; }
.viper-letter { font-family: 'Playfair Display', serif; font-size: clamp(18px,1.8vw,28px); font-weight: 700; margin-right: 8px; }
.viper-name { font-size: clamp(14px,1.3vw,21px); font-weight: 800; color: #1a1a2e; }
.viper-q { font-size: clamp(12px,1.1vw,17px); color: #666; margin-top: 5px; font-weight: 500; }
.viper-detail { margin-top: 8px; font-size: clamp(12px,1.05vw,16px); color: #8a6d00; background: #fff7db; border: 1px solid #ffe08a; border-radius: 10px; padding: 8px 11px; font-weight: 600; line-height: 1.3; }
.told-label { font-size: clamp(11px,0.95vw,15px); color: #43a047; font-weight: 700; margin-top: 6px; display: none; }
.viper-item.checked .told-label { display: block; }
.vipers-done-btn { background: #43a047; color: #fff; border: none; border-radius: 16px; font-family: 'Nunito', sans-serif; font-size: clamp(15px,1.4vw,22px); font-weight: 800; padding: clamp(13px,1.7vh,20px) 0; width: 100%; cursor: pointer; transition: transform .15s, background .15s; }
.vipers-done-btn:hover { background: #388e3c; transform: translateY(-1px); }
.vipers-done-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

/* OVERVIEW */
.ov-shell { background: #1a1a2e; justify-content: center; gap: clamp(20px,3vh,44px); padding: clamp(20px,3vh,44px) 0; }
.ov-head { text-align: center; }
.ov-img { width: clamp(100px,9vw,156px); height: clamp(100px,9vw,156px); object-fit: contain; display: block; margin: 0 auto clamp(10px,1.6vh,20px); }
.ov-head h1 { font-size: clamp(34px,4.6vw,76px); color: #fff; line-height: 1; }
.ov-tags { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: clamp(12px,1.6vh,20px); }
.ov-tag { background: rgba(255,255,255,0.08); border: 1.5px solid rgba(255,255,255,0.14); color: #e6e6f5; border-radius: 22px; padding: clamp(7px,1vh,12px) clamp(13px,1.3vw,20px); font-size: clamp(12px,1.1vw,18px); font-weight: 800; }
.ov-tag.muted { opacity: 0.6; }
.steps-row { display: flex; gap: clamp(12px,1.4vw,24px); justify-content: center; align-items: stretch; flex-wrap: wrap; padding: 0 clamp(24px,4vw,80px); }
.step-card { flex: 1 1 clamp(160px,16vw,240px); max-width: 300px; display: flex; flex-direction: column; gap: clamp(8px,1.2vh,16px); background: rgba(255,255,255,0.06); border-radius: 18px; padding: clamp(16px,2.2vh,30px) clamp(14px,1.4vw,24px); border: 1.5px solid rgba(255,255,255,0.12); }
.step-card.spotlight { box-shadow: 0 0 0 2px #ffd166; }
.step-top { display: flex; align-items: center; justify-content: space-between; }
.step-num { width: clamp(30px,2.6vw,44px); height: clamp(30px,2.6vw,44px); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: clamp(14px,1.3vw,20px); }
.step-badge { font-size: clamp(11px,1vw,15px); font-weight: 700; padding: 5px 11px; border-radius: 20px; }
.step-title { font-weight: 800; font-size: clamp(16px,1.7vw,26px); color: #fff; line-height: 1.1; }
.step-time { font-size: clamp(12px,1.05vw,17px); color: #9a9ab8; }
.step-card .spot-tag { align-self: flex-start; }
.ov-actions { display: flex; flex-direction: column; align-items: center; gap: clamp(10px,1.4vh,18px); }
.ov-start { max-width: 520px; }

/* CELEBRATE */
.celebrate { align-items: center; justify-content: center; text-align: center; gap: clamp(6px,1vh,14px); padding: clamp(24px,4vh,60px) clamp(24px,4vw,80px); background: #fff; }
.cel-img { width: clamp(108px,9vw,166px); height: clamp(108px,9vw,166px); object-fit: contain; display: block; }
.cel-title { font-size: clamp(34px,4.4vw,72px); color: #1a1a2e; }
.cel-sub { font-size: clamp(14px,1.4vw,22px); color: #555; font-weight: 600; margin-bottom: clamp(10px,1.6vh,22px); }
.cel-card { width: 100%; max-width: 620px; background: #f8f8fc; border: 1.5px solid #eee; border-radius: 18px; padding: clamp(8px,1vh,14px) clamp(16px,1.6vw,26px); }
.cel-row { display: flex; justify-content: space-between; gap: 16px; font-size: clamp(13px,1.2vw,19px); padding: clamp(9px,1.2vh,15px) 0; color: #555; font-weight: 600; border-bottom: 1px solid #eee; }
.cel-row:last-child { border-bottom: none; }
.cel-row strong { color: #1a1a2e; text-align: right; }
.cel-actions { display: flex; flex-direction: column; align-items: center; gap: clamp(8px,1.2vh,16px); width: 100%; max-width: 520px; margin-top: clamp(14px,2vh,24px); }

/* MENU */
.menu { flex: 1; background: #1a1a2e; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: clamp(24px,4vh,64px) clamp(24px,4vw,80px); }
.menu-inner { width: 100%; max-width: 1120px; }
.menu h1 { text-align: center; font-size: clamp(30px,4vw,64px); margin-bottom: 6px; }
.menu .sub { text-align: center; font-size: clamp(13px,1.3vw,20px); color: #9a9ab8; margin-bottom: clamp(18px,3vh,36px); }
.menu-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: clamp(14px,2vw,30px); margin-bottom: clamp(18px,3vh,36px); }
.field { min-width: 0; }
.field.span2 { grid-column: 1 / -1; }
.field-label { font-size: clamp(13px,1.15vw,18px); font-weight: 800; color: #c9c9e0; margin-bottom: 10px; display: flex; align-items: baseline; gap: 8px; }
.hint { font-weight: 600; font-size: clamp(11px,0.95vw,15px); color: #7a7a9a; }
.chip-row { display: flex; flex-wrap: wrap; gap: 10px; }
.chip { padding: clamp(9px,1.2vh,14px) clamp(14px,1.3vw,20px); border-radius: 22px; border: 1.5px solid #3a3a57; background: #22223a; color: #d5d5ea; font-size: clamp(13px,1.1vw,17px); font-weight: 700; cursor: pointer; transition: border-color .15s, background .15s, color .15s; display: flex; align-items: center; gap: 8px; }
.chip:hover { border-color: #5a5a86; }
.chip.selected { background: #fff; color: #1a1a2e; border-color: #fff; }
.chip .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.btn-start { background: #fff; color: #1a1a2e; border: none; border-radius: 18px; font-family: 'Nunito', sans-serif; font-size: clamp(16px,1.6vw,24px); font-weight: 800; padding: clamp(15px,2vh,22px) 0; width: 100%; cursor: pointer; transition: transform .15s; }
.btn-start:hover { transform: scale(1.01); }
.menu-start { max-width: 520px; margin: 0 auto; display: block; }

/* FIREWORKS */
.fireworks-overlay { position: fixed; inset: 0; pointer-events: none; display: none; overflow: hidden; z-index: 100; }
.fireworks-overlay.active { display: block; }
canvas#fireworks-canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<button id="fsBtn" class="fs-btn" onclick="toggleFullscreen()" title="Toggle full screen" aria-label="Toggle full screen">&#9974;</button>
<div class="fireworks-overlay" id="fw-overlay"><canvas id="fireworks-canvas"></canvas></div>
<div class="app-frame">
  <div id="menu" class="screen active"></div>
  <div id="app" class="screen"></div>
</div>

<script>
/* ============================================================
   Reading Lesson Builder — template-driven landscape display.
   Nothing needs to be selected: press Start for a simple run.
   Anything you DO select is highlighted and expands with detail.
   ============================================================ */

/* ---------- DATA ---------- */
const PIE = [
  { id:'persuasive',    letter:'P', word:'Persuasive',    detail:'Look for opinions, reasons and words that try to convince you.' },
  { id:'informational', letter:'I', word:'Informational', detail:'Look for facts, headings and the key details you can learn.' },
  { id:'entertainment', letter:'E', word:'Entertainment', detail:'Enjoy it — notice the characters, the setting and what happens.' }
];
const VIPERS = [
  { id:'v', letter:'V', name:'Vocabulary',            q:'"What new words did you learn?"',       color:'#7F77DD', stem:'Try: "A new word was ___ — I think it means ___."' },
  { id:'i', letter:'I', name:'Inference',             q:'"Why did the character do ___?"',        color:'#185FA5', stem:'Try: "I think ___ because the text says ___."' },
  { id:'p', letter:'P', name:'Prediction',            q:'"What might happen next?"',              color:'#2e7d32', stem:'Try: "I predict ___ will happen next because ___."' },
  { id:'e', letter:'E', name:'Explain',               q:'"What is the main idea of this part?"',  color:'#f57f17', stem:'Try: "The main idea of this part is ___."' },
  { id:'r', letter:'R', name:'Retrieval',             q:'"List 3 facts you remember."',           color:'#bf360c', stem:'Try: "Three things I remember are ___, ___ and ___."' },
  { id:'s', letter:'S', name:'Sequence / Summarize',  q:'"Summarize what you read."',             color:'#6a1b9a', stem:'Try: "First ___, then ___, and finally ___."' }
];
const EMPHASES = [
  { id:'decoding',      label:'Decoding & word attack', stage:'readwork' },
  { id:'fluency',       label:'Fluency',                stage:'fluency' },
  { id:'comprehension', label:'Comprehension',          stage:'review' },
  { id:'vocabulary',    label:'Vocabulary',             stage:'review' }
];
const STAGE_META = {
  focus:    { key:'focus',    title:'Focus',                  icon:ICONS.focus,     badge:'Think',  badgeBg:'#dbeeff', badgeCol:'#1565c0', time:'~3 min', bg:'#dbeeff' },
  fluency:  { key:'fluency',  title:'Fluency',                icon:ICONS.fluency,   badge:'Read',   badgeBg:'#d4edda', badgeCol:'#2e7d32', time:'~2 min', bg:'#d4edda' },
  readwork: { key:'readwork', title:'Highlight & Strategize', icon:ICONS.highlight, badge:'Active', badgeBg:'#fff9c4', badgeCol:'#f57f17', bg:'#fff' },
  review:   { key:'review',   title:'Review',                 icon:ICONS.review,    badge:'Review', badgeBg:'#fce4ec', badgeCol:'#c62828', bg:'#fff' }
};
const STAGE_ORDER = ['focus','fluency','readwork','review'];

/* ---------- LESSON CONFIG (all optional; blank = simple) ---------- */
const lesson = {
  textType: null,
  emphasis: null,
  spotlights: [],
  readMinutes: 15,
  reviewMinutes: 3
};

/* ---------- helpers ---------- */
function fmt(s){ const m=Math.floor(s/60), sec=s%60; return String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0'); }
function emphasisObj(){ return EMPHASES.find(e => e.id===lesson.emphasis) || null; }
function emphasisStageKey(){ const e=emphasisObj(); return e?e.stage:null; }
function emphasisLabel(){ const e=emphasisObj(); return e?e.label:''; }
function textTypeObj(){ return PIE.find(p => p.id===lesson.textType) || null; }
function textTypeLabel(){ const p=textTypeObj(); return p?p.word:''; }
function stageTime(k){ if(k==='readwork') return lesson.readMinutes+' min'; if(k==='review') return lesson.reviewMinutes+' min'; return STAGE_META[k].time; }
function icon(src){ return '<img class="page-icon" src="'+src+'" alt="">'; }

/* ---------- MENU ---------- */
function field(label, hint, inner, span){ return '<div class="field'+(span?' span2':'')+'"><div class="field-label">'+label+(hint?' <span class="hint">'+hint+'</span>':'')+'</div>'+inner+'</div>'; }
function renderMenu(){
  const pieChips = PIE.map(p => '<div class="chip'+(p.id===lesson.textType?' selected':'')+'" onclick="choosePIE(\''+p.id+'\',this)"><span class="dot" style="background:#1565c0;"></span>'+p.word+'</div>').join('');
  const empChips = EMPHASES.map(e => '<div class="chip'+(e.id===lesson.emphasis?' selected':'')+'" onclick="chooseEmphasis(\''+e.id+'\',this)">'+e.label+'</div>').join('');
  const spotChips = VIPERS.map(v => '<div class="chip'+(lesson.spotlights.includes(v.id)?' selected':'')+'" onclick="toggleSpot(\''+v.id+'\',this)"><span class="dot" style="background:'+v.color+';"></span>'+v.letter+' &middot; '+v.name+'</div>').join('');
  const timeChips = [5,10,15,20].map(n => '<div class="chip'+(n===lesson.readMinutes?' selected':'')+'" onclick="chooseTime('+n+',this)">'+n+' min</div>').join('');
  document.getElementById('menu').innerHTML =
    '<div class="menu"><div class="menu-inner">'
    + '<h1>Reading Lesson Builder</h1>'
    + '<div class="sub">Pick only what you want to emphasise &mdash; or just press Start to keep it simple.</div>'
    + '<div class="menu-grid">'
      + field('Text type', 'optional', '<div class="chip-row">'+pieChips+'</div>')
      + field('Main emphasis', 'optional', '<div class="chip-row">'+empChips+'</div>')
      + field('Spotlight questions', 'optional &middot; up to 3', '<div class="chip-row">'+spotChips+'</div>', true)
      + field('Reading time', '', '<div class="chip-row">'+timeChips+'</div>', true)
    + '</div>'
    + '<button class="btn-start menu-start" onclick="startLesson()">Start lesson &rarr;</button>'
    + '</div></div>';
}
function pickSingle(el, fieldName, id){ el.parentNode.querySelectorAll('.chip').forEach(c => c.classList.remove('selected')); el.classList.add('selected'); lesson[fieldName] = id; }
function choosePIE(id, el){ if(lesson.textType===id){ lesson.textType=null; el.classList.remove('selected'); } else { pickSingle(el,'textType',id); } }
function chooseEmphasis(id, el){ if(lesson.emphasis===id){ lesson.emphasis=null; el.classList.remove('selected'); } else { pickSingle(el,'emphasis',id); } }
function chooseTime(n, el){ el.parentNode.querySelectorAll('.chip').forEach(c => c.classList.remove('selected')); el.classList.add('selected'); lesson.readMinutes = n; }
function toggleSpot(id, el){
  const i = lesson.spotlights.indexOf(id);
  if(i >= 0){ lesson.spotlights.splice(i,1); el.classList.remove('selected'); }
  else {
    if(lesson.spotlights.length >= 3){ el.animate([{transform:'scale(1)'},{transform:'scale(0.94)'},{transform:'scale(1)'}], {duration:180}); return; }
    lesson.spotlights.push(id); el.classList.add('selected');
  }
}

/* ---------- LESSON RUNNER ---------- */
let pages = [], idx = 0, pageTimers = [], currentSkip = null;
function clearTimers(){ pageTimers.forEach(t => clearInterval(t)); pageTimers = []; }
function startCountdown(id, seconds, onDone){
  let left = seconds;
  const t = setInterval(() => {
    left--;
    const e = document.getElementById(id);
    if(!e){ clearInterval(t); return; }
    e.textContent = fmt(Math.max(left,0));
    if(left <= 0){ clearInterval(t); pageTimers = pageTimers.filter(x => x!==t); currentSkip = null; if(onDone) onDone(); }
  }, 1000);
  pageTimers.push(t);
  currentSkip = () => { clearInterval(t); pageTimers = pageTimers.filter(x => x!==t); const e = document.getElementById(id); if(e) e.textContent = fmt(0); currentSkip = null; if(onDone) onDone(); };
}
function skipTimer(){ if(currentSkip) currentSkip(); }

function startLesson(){
  if(lesson.emphasis==='vocabulary' && !lesson.spotlights.includes('v')) lesson.spotlights.unshift('v');
  pages = buildPages();
  document.getElementById('menu').classList.remove('active');
  document.getElementById('app').classList.add('active');
  show(0);
}
function backToMenu(){ clearTimers(); currentSkip = null; document.getElementById('fw-overlay').classList.remove('active'); document.getElementById('app').classList.remove('active'); document.getElementById('menu').classList.add('active'); }
function next(){ if(idx < pages.length-1) show(idx+1); }
function show(i){
  clearTimers(); currentSkip = null; idx = i;
  const pg = pages[i], app = document.getElementById('app');
  app.style.background = pg.bg;
  app.innerHTML = pg.html();
  if(pg.onShow) pg.onShow();
  window.scrollTo(0,0);
}
function buildPages(){ return [ overviewPage(), focusPage(), fluencyPage(), readworkPage(), reviewPage(), celebratePage() ]; }

/* ---------- reusable header + shell (the template) ---------- */
function headerBand(iconSrc, title, sub, focus, titleClass){
  return '<header class="ph"><div class="ph-left">'+icon(iconSrc)+'<div>'
    + '<h2'+(titleClass?' class="'+titleClass+'"':'')+'>'+title+'</h2>'
    + (sub ? '<div class="page-sub">'+sub+'</div>' : '') + '</div></div>'
    + '<div class="ph-right">'+(focus?'<span class="focus-badge">&#127919; '+focus+'</span>':'')
    + '<button class="mini-btn" onclick="backToMenu()">&#9776; Menu</button></div></header>';
}
function shell(o){
  return '<div class="page-shell">'+headerBand(o.icon, o.title, o.subtitle, o.focus, o.titleClass)
    + '<div class="page-body">'+o.body+'</div>'
    + '<footer class="page-footer">'+o.footer+'</footer></div>';
}

/* ---------- OVERVIEW ---------- */
function overviewPage(){
  return { key:'overview', bg:'#1a1a2e', html:() => {
    const est = emphasisStageKey();
    const rows = STAGE_ORDER.map((k,i) => {
      const m = STAGE_META[k], main = (est && k===est);
      return '<div class="step-card'+(main?' spotlight':'')+'">'
        + '<div class="step-top"><div class="step-num" style="background:'+m.badgeBg+';color:'+m.badgeCol+';">'+(i+1)+'</div>'
        + '<div class="step-badge" style="background:'+m.badgeBg+';color:'+m.badgeCol+';">'+m.badge+'</div></div>'
        + '<div class="step-title">'+m.title+'</div>'
        + '<div class="step-time">'+stageTime(k)+'</div>'
        + (main ? '<span class="spot-tag">&#9733; Main focus</span>' : '') + '</div>';
    }).join('');
    const tags = [];
    if(lesson.emphasis) tags.push('<span class="ov-tag">&#127919; '+emphasisLabel()+'</span>');
    if(lesson.textType) tags.push('<span class="ov-tag">&#128214; '+textTypeLabel()+'</span>');
    const tagHtml = tags.length ? tags.join('') : '<span class="ov-tag muted">Standard read-through</span>';
    return '<div class="page-shell ov-shell">'
      + '<div class="ov-head"><img class="ov-img" src="'+ICONS.puzzle+'" alt=""><h1>Reading Lesson</h1>'
        + '<div class="ov-tags">'+tagHtml+'</div></div>'
      + '<div class="steps-row">'+rows+'</div>'
      + '<div class="ov-actions"><button class="btn-start ov-start" onclick="next()">Start lesson &rarr;</button>'
        + '<button class="mini-btn" onclick="backToMenu()">&#9776; Edit plan</button></div>'
      + '</div>';
  }};
}

/* ---------- FOCUS ---------- */
function focusPage(){
  return { key:'focus', bg:STAGE_META.focus.bg, html:() => {
    const tt = textTypeObj();
    const pies = PIE.map(p => '<div class="pie-card'+(tt&&p.id===tt.id?' selected':'')+'"><div class="pie-letter">'+p.letter+'</div><div class="pie-word">'+p.word+'</div></div>').join('');
    let prompts = '';
    if(tt) prompts += '<div class="prompt-box detail"><div class="q">Because it\'s '+tt.word+':</div><div class="a">'+tt.detail+'</div></div>';
    prompts += '<div class="prompt-box"><div class="q">Before you read, ask yourself:</div><div class="a">"What do I already know about this topic?"</div></div>';
    prompts += '<div class="prompt-box"><div class="q">Set your intention:</div><div class="a">"What do I expect to learn?"</div></div>';
    if(lesson.emphasis==='vocabulary') prompts += '<div class="prompt-box detail"><div class="q">Word watch (today\'s focus):</div><div class="a">Predict 2 tricky words you might meet, then check them as you read.</div></div>';
    return shell({ icon:ICONS.focus, title:'Focus', focus:emphasisLabel(),
      body: '<div class="pie-row">'+pies+'</div><div class="focus-prompts">'+prompts+'</div>',
      footer: '<button class="btn-next-full" onclick="next()">Next &rarr;</button>' });
  }};
}

/* ---------- FLUENCY ---------- */
function fluencyPage(){
  return { key:'fluency', bg:STAGE_META.fluency.bg, html:() => {
    const emph = lesson.emphasis==='fluency';
    const banner = emph ? '<div class="emphasis-banner">&#11088; Today\'s focus: fluency &mdash; smooth, accurate, expressive reading.</div>' : '';
    const pts = ['Read smoothly','Read accurately','Read with expression']
      .map(t => '<div class="fluency-point"><span class="fp-dot"></span><span class="fp-text">'+t+'</span></div>').join('');
    const note = emph ? '<div class="emphasis-note">Because you chose <b>Fluency</b>: read the page a second time and aim to sound like you are talking &mdash; pause at commas, stop at full stops, and add feeling to the characters\' words.</div>' : '';
    let tips = '<div class="tip-card"><span class="tip-icon">&#128260;</span><span>Reread and read aloud until you feel confident.</span></div>'
             + '<div class="tip-card"><span class="tip-icon">&#128070;</span><span>Use your finger to guide your eyes along the line.</span></div>';
    if(emph) tips += '<div class="tip-card"><span class="tip-icon">&#127917;</span><span>Match your voice to the punctuation and the mood of the sentence.</span></div>';
    return shell({ icon:ICONS.fluency, title:'Fluency', focus:emphasisLabel(),
      body: banner + '<div class="fluency-points">'+pts+'</div>' + note + '<div class="tips">'+tips+'</div>',
      footer: '<button class="btn-next-full" onclick="next()">Next &rarr;</button>' });
  }};
}

/* ---------- HIGHLIGHT & STRATEGIZE ---------- */
function readworkPage(){
  return { key:'readwork', bg:'#fff', html:() => {
    const decode = lesson.emphasis==='decoding';
    let phonics = '<div class="s-item"><div class="s-label">Sound It Out</div><div class="s-desc">Say each sound slowly, then blend.</div></div>'
                + '<div class="s-item"><div class="s-label">Common Patterns</div><div class="s-desc">-ing, -tion, sh, ch, th, ea, ai, oa&hellip;</div></div>';
    if(decode) phonics += '<div class="s-item"><div class="s-label">Chunk It</div><div class="s-desc">Break long words into syllables, then join them.</div></div>';
    const note = decode ? '<div class="emphasis-note">Because you chose <b>Decoding &amp; word attack</b>: slow right down on tricky words &mdash; sound them out, chunk the syllables, then check the word makes sense in the sentence.</div>' : '';
    return '<div class="page-shell">'
      + headerBand(ICONS.highlight, 'Highlight &amp; Strategize', 'Read the book &mdash; highlight &amp; decode as you go.', emphasisLabel(), 'hs-title')
      + '<div class="page-body rw-body"><div class="split">'
        + '<div class="split-col col-yellow">'
          + '<div class="hs-heading"><img class="hs-ico" src="'+ICONS.highlight+'" alt="">Highlight</div>'
          + '<div class="highlight-item"><span class="h-dot"></span>Words you <strong>cannot pronounce</strong></div>'
          + '<div class="highlight-item"><span class="h-dot"></span>Words you <strong>do not understand</strong></div>'
        + '</div>'
        + '<div class="split-col col-orange'+(decode?' spotlight':'')+'">'
          + '<div class="hs-heading"><img class="hs-ico" src="'+ICONS.strategize+'" alt="">Strategize'+(decode?'<span class="spot-tag">&#9733; Focus</span>':'')+'</div>'
          + '<div class="strategy-section"><div class="s-title">USE PHONICS CLUES</div>'+phonics+'</div>'
          + '<div class="strategy-section"><div class="s-title">INFER FROM CONTEXT</div>'
            + '<div class="s-item"><div class="s-label">Read Around It</div><div class="s-desc">Use clues before and after the word.</div></div></div>'
          + '<div class="strategy-section"><div class="s-title">BREAK IT APART</div>'
            + '<div class="s-item"><div class="s-label">Split into Parts</div><div class="s-desc">Find the root, prefix, or suffix.</div></div></div>'
          + note
        + '</div>'
      + '</div></div>'
      + '<div class="timer-bar">'
        + '<div><div class="timer-label">Reading timer <span class="timer-note">&middot; guide only</span></div><div class="timer-display" id="rw-timer">'+fmt(lesson.readMinutes*60)+'</div></div>'
        + '<div class="timer-actions"><button class="skip-btn" onclick="skipTimer()">skip</button>'
        + '<button class="btn-timer-next" id="rw-next" onclick="next()">Next &rarr;</button></div>'
      + '</div></div>';
  }, onShow:() => { startCountdown('rw-timer', lesson.readMinutes*60, () => {}); } };
}

/* ---------- REVIEW ---------- */
function reviewPage(){
  return { key:'review', bg:'#fff', html:() => {
    const spots = lesson.spotlights, comp = lesson.emphasis==='comprehension';
    const ordered = spots.length ? [...VIPERS].sort((a,b) => (spots.includes(b.id)?1:0) - (spots.includes(a.id)?1:0)) : VIPERS;
    const items = ordered.map(v => {
      const sp = spots.includes(v.id);
      return '<div class="viper-item'+(sp?' spot':'')+'" onclick="toggleViper(this)">'
        + '<div class="viper-check"><span class="viper-check-mark">&#10003;</span></div>'
        + '<div class="viper-content"><div><span class="viper-letter" style="color:'+v.color+';">'+v.letter+'</span><span class="viper-name">'+v.name+'</span>'+(sp?' <span class="spot-tag">&#9733; Spotlight</span>':'')+'</div>'
        + '<div class="viper-q">'+v.q+'</div>'
        + (sp?'<div class="viper-detail">'+v.stem+'</div>':'')
        + '<div class="told-label">&#10003; Told a partner</div></div></div>';
    }).join('');
    const banner = comp ? '<div class="emphasis-banner">&#11088; Today\'s focus: comprehension &mdash; understand and explain what you read.</div>' : '';
    return '<div class="page-shell">'
      + headerBand(ICONS.review, 'Review', 'Check off each after you\'ve said it aloud.', emphasisLabel(), null)
      + '<div class="page-body">'+banner
        + '<div class="timer2-row"><div><div class="timer2-label">Review timer</div><div class="timer2-display" id="rev-timer">'+fmt(lesson.reviewMinutes*60)+'</div></div><button class="skip-btn dark" onclick="skipTimer()">skip</button></div>'
        + '<div class="vipers-list">'+items+'</div></div>'
      + '<footer class="page-footer"><button class="vipers-done-btn" id="rev-done" onclick="next()" disabled>&#127881; Finish lesson</button></footer>'
      + '</div>';
  }, onShow:() => { startCountdown('rev-timer', lesson.reviewMinutes*60, () => { next(); }); } };
}
function toggleViper(el){
  el.classList.toggle('checked');
  const d = document.getElementById('rev-done');
  if(d) d.disabled = document.querySelectorAll('.viper-item.checked').length < 1;
}

/* ---------- CELEBRATE ---------- */
function celebratePage(){
  return { key:'celebrate', bg:'#fff', html:() => {
    const covered = STAGE_ORDER.map(k => STAGE_META[k].title).join(' &middot; ');
    let rows = '';
    if(lesson.emphasis) rows += '<div class="cel-row"><span>Main focus</span><strong>'+emphasisLabel()+'</strong></div>';
    if(lesson.textType) rows += '<div class="cel-row"><span>Text type</span><strong>'+textTypeLabel()+'</strong></div>';
    rows += '<div class="cel-row"><span>Covered</span><strong>'+covered+'</strong></div>';
    return '<div class="page-shell celebrate">'
      + '<img class="cel-img" src="'+ICONS.puzzle+'" alt="">'
      + '<h1 class="cel-title">&#127881; Well done!</h1>'
      + '<div class="cel-sub">Great reading session!</div>'
      + '<div class="cel-card">'+rows+'</div>'
      + '<div class="cel-actions"><button class="btn-next-full" onclick="show(0)">&#8635; Run again</button>'
        + '<button class="mini-btn" onclick="backToMenu()">&#9776; New lesson</button></div>'
      + '</div>';
  }, onShow:() => { triggerFireworks(); } };
}

/* ---------- teacher shortcut: Ctrl+Z skips the active timer ---------- */
document.addEventListener('keydown', e => {
  if(e.ctrlKey && (e.key==='z' || e.key==='Z')){
    if(document.getElementById('app').classList.contains('active') && currentSkip){ e.preventDefault(); skipTimer(); }
  }
});

/* ---------- FULL SCREEN ---------- */
function toggleFullscreen(){
  const fs = document.fullscreenElement || document.webkitFullscreenElement;
  try {
    if(!fs){ const el = document.documentElement, r = el.requestFullscreen || el.webkitRequestFullscreen; const p = r && r.call(el); if(p && p.catch) p.catch(()=>{}); }
    else { const x = document.exitFullscreen || document.webkitExitFullscreen; const p = x && x.call(document); if(p && p.catch) p.catch(()=>{}); }
  } catch(e){}
}
function syncFsBtn(){ const b = document.getElementById('fsBtn'); if(b) b.innerHTML = (document.fullscreenElement || document.webkitFullscreenElement) ? '&#10005;' : '&#9974;'; }
document.addEventListener('fullscreenchange', syncFsBtn);
document.addEventListener('webkitfullscreenchange', syncFsBtn);

/* ---------- FIREWORKS ---------- */
function triggerFireworks(){
  const overlay = document.getElementById('fw-overlay');
  overlay.classList.add('active');
  const canvas = document.getElementById('fireworks-canvas'), ctx = canvas.getContext('2d');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  const particles = [], colors = ['#ff6b6b','#ffd166','#06d6a0','#118ab2','#a855f7','#f97316','#ec4899'];
  for(let i=0;i<180;i++){
    const a = Math.random()*Math.PI*2, sp = 3+Math.random()*7;
    particles.push({ x:canvas.width/2+(Math.random()-.5)*420, y:canvas.height/2+(Math.random()-.5)*220, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp, color:colors[Math.floor(Math.random()*colors.length)], size:4+Math.random()*5, alpha:1, decay:.010+Math.random()*.008 });
  }
  (function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.vy+=.1; p.vx*=.99; p.alpha-=p.decay; if(p.alpha<0)p.alpha=0; ctx.globalAlpha=p.alpha; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill(); });
    ctx.globalAlpha = 1;
    if(particles.some(p => p.alpha>0)) requestAnimationFrame(animate);
    else setTimeout(() => overlay.classList.remove('active'), 800);
  })();
}

/* ---------- init ---------- */
renderMenu();
</script>
