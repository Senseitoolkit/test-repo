}
function renderTray(){
  const onCard=new Set(Object.values(state.fill));let h='';
  for(let v=0;v<=10;v++){const used=state.unique&&onCard.has(v);h+=`<button type="button" class="tile${v===10?' ten':''}${used?' used':''}${state.selected===v?' sel':''}" data-val="${v}" ${used?'disabled aria-label="Tile '+v+' is on the card"':'aria-label="Tile '+v+'"'} aria-pressed="${state.selected===v}">${v}</button>`}
  $('tiles').innerHTML=h;
  const slots=state.card.reduce((a,p)=>a+slotCells(p).length,0);
  $('tray-note').innerHTML=state.unique?`<b>Each tile once</b> · ${slots} squares, 11 tiles`:`<b>Reuse tiles</b> · every tile can be used again`;
  $('done-count').textContent=state.finished;
}
function renderAll(){renderSide();renderCard();renderCurr();renderTray()}
function announce(t){$('sr').textContent=t}

/* ---------- actions ---------- */
function probIndexOfSlot(id){return state.card.findIndex(p=>slotCells(p).some(c=>c.id===id))}
function touch(id){const i=probIndexOfSlot(id);if(i>=0)state.results[i]=undefined;if(state.revealed){state.revealed=false;state.results=[]}}
function place(val,slotId,from){
  if(from===slotId)return;const f=state.fill,prev=f[slotId];
  if(state.unique)for(const k in f)if(f[k]===val&&k!==from){delete f[k];touch(k)}
  if(from!=null){delete f[from];if(prev!=null)f[from]=prev;touch(from)}
  f[slotId]=val;touch(slotId);if(state.unique)state.selected=null;
  renderCard();renderTray();announce(`Placed ${val}`);
}
function removeTile(slotId){if(state.fill[slotId]==null)return;const v=state.fill[slotId];delete state.fill[slotId];touch(slotId);renderCard();renderTray();announce(`Tile ${v} returned`)}
function check(){
  state.results=state.card.map(p=>{const vals=numParts(p).map(np=>numValue(np,c=>state.fill[c.id]));if(vals.some(v=>v==null||isNaN(v)))return'todo';return(p.check?p.check(vals):vals.every((v,i)=>eq(v,p.expected[i])))?'ok':'bad'});
  if(!state.revealed&&!state.done&&state.card.length&&state.results.every(r=>r==='ok')){state.done=true;state.finished++}
  renderCard();renderTray();announce($('status').textContent);
}
function showAnswers(){state.fill={};state.card.forEach(p=>slotCells(p).forEach(c=>state.fill[c.id]=+c.d));state.results=state.card.map(()=>'ok');state.revealed=true;state.selected=null;renderCard();renderTray()}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(suppressClick){suppressClick=false;return}
  const yb=e.target.closest('[data-year]');if(yb){state.year=yb.dataset.year;newCard();return}
  const tb=e.target.closest('[data-term]');if(tb){state.term=tb.dataset.term;newCard();return}
  const sb=e.target.closest('[data-strand]');if(sb){state.strand=sb.dataset.strand;newCard();return}
  const mb=e.target.closest('[data-mode]');if(mb){const u=mb.dataset.mode==='once';if(u!==state.unique){state.unique=u;try{localStorage.setItem('tilecards-mode',u?'once':'reuse')}catch(err){}newCard(true)}return}
  const tile=e.target.closest('.tile[data-val]');
  if(tile&&!tile.disabled){const v=+tile.dataset.val;state.selected=state.selected===v?null:v;renderCard();renderTray();return}
  const slot=e.target.closest('.slot');
  if(slot){const id=slot.dataset.slot;
    if(state.selected!=null){place(state.selected,id,null);document.querySelector(`[data-slot="${id}"]`)?.focus()}
    else if(state.fill[id]!=null)removeTile(id);
    else{slot.classList.remove('shake');void slot.offsetWidth;slot.classList.add('shake');announce('Choose a tile first, or type a digit')}}
});
$('notes').addEventListener('change',e=>{state.notes=e.target.checked;try{localStorage.setItem('tilecards-notes',state.notes?'1':'0')}catch(err){}renderCard()});
$('btn-check').onclick=check;
$('btn-new').onclick=()=>newCard();
$('btn-clear').onclick=()=>{state.fill={};state.results=[];state.revealed=false;state.selected=null;renderCard();renderTray()};
$('btn-show').onclick=showAnswers;

/* ---------- full screen ---------- */
let fsOn=false;
function setFs(on){
  fsOn=on;document.body.classList.toggle('fs',on);
  const b=$('btn-fs');b.setAttribute('aria-pressed',on);b.querySelector('span').textContent=on?'Exit full screen':'Full screen';
  try{
    if(on&&!document.fullscreenElement&&document.documentElement.requestFullscreen)document.documentElement.requestFullscreen().catch(()=>{});
    if(!on&&document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});
  }catch(e){}
  layoutFs();
}
function layoutFs(){
  const lis=[...document.querySelectorAll('#probs .prob')];
  lis.forEach(li=>{li.classList.remove('bt','bl','wide');const f=li.firstElementChild;if(f){f.style.width='';f.style.transform=''}});
  if(!fsOn)return;
  const n=lis.length,wideScreen=innerWidth>860;
  const cols=!wideScreen?1:n<=2?n:2;
  $('probs').style.setProperty('--cols',cols);
  lis.forEach((li,i)=>{if(wideScreen){if(i>=cols)li.classList.add('bt');if(i%cols)li.classList.add('bl');if(n===3&&i===2)li.classList.add('wide')}});
  requestAnimationFrame(fitProblems);
}
function fitProblems(){
  if(!fsOn)return;
  const items=[...document.querySelectorAll('#probs .prob')].map(li=>{const cs=getComputedStyle(li);return{li,f:li.firstElementChild,W:li.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),H:li.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)}}).filter(o=>o.f&&o.W>0&&o.H>0);
  const fits=(o,k)=>{o.f.style.transform='';o.f.style.width=(o.W/k)+'px';return o.f.scrollHeight*k<=o.H&&o.f.scrollWidth*k<=o.W+1};
  // one shared size so every problem on the card looks the same
  let k=1.8;
  items.forEach(o=>{if(fits(o,k))return;let lo=.3,hi=k;for(let i=0;i<9;i++){const m=(lo+hi)/2;if(fits(o,m))lo=m;else hi=m}k=lo});
  items.forEach(o=>{o.f.style.width=(o.W/k)+'px';o.f.style.transform=`scale(${k})`});
}
$('btn-fs').onclick=()=>setFs(!fsOn);
$('fs-strand').addEventListener('change',e=>{state.strand=e.target.value;newCard()});
document.addEventListener('click',e=>{const b=e.target.closest('[data-step]');if(!b)return;const ss=strandsFor();const i=ss.indexOf(state.strand);state.strand=ss[(i+ +b.dataset.step+ss.length)%ss.length];newCard()});
document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&fsOn)setFs(false);else layoutFs()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&fsOn&&!document.fullscreenElement)setFs(false)});
let rsz;addEventListener('resize',()=>{cancelAnimationFrame(rsz);rsz=requestAnimationFrame(layoutFs)});
try{document.fonts&&document.fonts.ready.then(layoutFs)}catch(e){}
document.addEventListener('keydown',e=>{
  const slot=e.target.closest?.('.slot');if(!slot)return;
  const id=slot.dataset.slot;const all=[...document.querySelectorAll('.slot')];const i=all.indexOf(slot);
  if(/^[0-9]$/.test(e.key)){e.preventDefault();place(+e.key,id,null);const nx=document.querySelectorAll('.slot')[i+1];(nx||document.querySelector(`[data-slot="${id}"]`))?.focus()}
  else if(e.key==='Backspace'||e.key==='Delete'){e.preventDefault();removeTile(id);document.querySelector(`[data-slot="${id}"]`)?.focus()}
  else if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();all[i+1]?.focus()}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();all[i-1]?.focus()}
});
let drag=null,ghost=null,suppressClick=false,hoverEl=null;
document.addEventListener('pointerdown',e=>{
  if(e.button>0)return;const t=e.target.closest('.tile[data-val]');const s=e.target.closest('.slot.filled');
  if(t&&!t.disabled)drag={val:+t.dataset.val,from:null,x:e.clientX,y:e.clientY,moved:false,src:t};
  else if(s)drag={val:state.fill[s.dataset.slot],from:s.dataset.slot,x:e.clientX,y:e.clientY,moved:false,src:s};
});
window.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.moved){if(Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<6)return;drag.moved=true;ghost=document.createElement('div');ghost.className='tile drag-ghost'+(drag.val===10?' ten':'');ghost.textContent=drag.val;document.body.appendChild(ghost);if(drag.from)drag.src.style.opacity='.35'}
  e.preventDefault();ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';
  const over=document.elementFromPoint(e.clientX,e.clientY)?.closest('.slot');
  if(hoverEl!==over){hoverEl?.classList.remove('hover');over?.classList.add('hover');hoverEl=over}
},{passive:false});
function endDrag(e,cancel){
  if(!drag)return;const d=drag;drag=null;if(!d.moved)return;
  suppressClick=true;setTimeout(()=>suppressClick=false,0);
  ghost?.remove();ghost=null;hoverEl?.classList.remove('hover');hoverEl=null;if(d.src)d.src.style.opacity='';
  if(cancel)return;
  const target=document.elementFromPoint(e.clientX,e.clientY)?.closest('.slot');
  if(target)place(d.val,target.dataset.slot,d.from);else if(d.from)removeTile(d.from);
}
window.addEventListener('pointerup',e=>endDrag(e,false));
window.addEventListener('pointercancel',e=>endDrag(e,true));
newCard(true);
</script>

</body>
