<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>おしごとタウン</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=M+PLUS+Rounded+1c:wght@400;700&family=Fredoka:wght@500;600;700&family=Noto+Color+Emoji&display=swap">
<style>
/* Layout: one-screen game. HUD bar on top, side-scrolling street canvas in the middle, touch controls below; job shifts open as a full-screen card over the street. Single bright look by choice. */
:root{
  --ink:#22263a; --muted:#53627e; --paper:#fffaf0; --card:#ffffff;
  --police:#1f4fa3; --police-soft:#dfe8f8; --sun:#ffc23d; --sun-soft:#fff1c9;
  --go:#25915a; --stop:#d23f37; --line:#e6dccb;
  --display:"Zen Maru Gothic","Fredoka","Hiragino Maru Gothic ProN",system-ui,"Noto Color Emoji",sans-serif;
  --stk:drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(0 3px 1px rgba(34,38,58,.3));
  --body:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,"Noto Color Emoji",sans-serif;
  color-scheme:light;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.7;word-break:normal;overflow-wrap:break-word;line-break:strict;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;box-sizing:border-box;overflow-x:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.app{max-width:1040px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:12px;padding-block:12px}
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{font-family:var(--display);font-weight:700;font-size:1.6rem;letter-spacing:.01em;margin:0;line-height:1}
.logo span{color:var(--police)}
.street-name{font-size:.8rem;letter-spacing:.06em;color:var(--muted);font-weight:700}
.hud .spacer{flex:1}
.pill{border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700;font-size:.92rem;display:inline-flex;gap:6px;align-items:center}
.pill[aria-pressed="false"]{opacity:.6}
.stage{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
#street{width:100%;max-height:100%;aspect-ratio:2/1;border-radius:20px;border:3px solid var(--ink);background:#9bd8f5;box-shadow:0 6px 0 var(--ink);display:block;touch-action:none}
.controls{display:flex;justify-content:space-between;gap:12px;align-items:center}
.ctrl{width:72px;height:60px;border-radius:16px;border:3px solid var(--ink);background:var(--card);font-family:var(--display);font-size:1.6rem;font-weight:700;box-shadow:0 4px 0 var(--ink);touch-action:none;user-select:none;-webkit-user-select:none}
.ctrl:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.ctrl.enter{width:auto;padding:0 22px;font-size:1.15rem;background:var(--sun)}
.hint{font-size:.9rem;color:var(--muted);text-align:center;flex:1}
.toast{pointer-events:none;position:absolute;left:50%;top:72px;z-index:3;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:12px;font-weight:700;max-width:90%;text-align:center}

/* Shift card */
#scene{position:fixed;inset:0;background:rgba(20,34,61,.55);display:flex;align-items:center;justify-content:center;
  padding:max(12px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));z-index:20}
.card{background:var(--paper);border:3px solid var(--ink);border-radius:22px;width:min(860px,100%);max-height:100%;overflow:auto;display:flex;flex-direction:column}
.card-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:2px dashed var(--line);flex-wrap:wrap;position:sticky;top:0;background:var(--paper);z-index:2}
.job-tag{font-family:var(--display);font-weight:700;font-size:1.05rem;color:var(--police)}
.steps{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.step{font-size:.75rem;font-weight:700;letter-spacing:.02em;white-space:nowrap;padding:4px 9px;border-radius:999px;background:var(--card);border:2px solid var(--line);color:var(--muted)}
.step.done{background:var(--police-soft);border-color:var(--police-soft);color:var(--police)}
.step.now{background:var(--police);border-color:var(--police);color:#fff}
.sel{font:inherit;font-weight:700;border:2px solid var(--ink);border-radius:12px;padding:8px 10px;background:var(--card);color:var(--ink);max-width:100%}
.leave{border:2px solid var(--ink);background:transparent;border-radius:10px;padding:4px 10px;font-size:.85rem;font-weight:700}
.body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:16px}
h2{font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1.35;margin:0;text-wrap:balance;word-break:auto-phrase}
.lead{margin:0;color:var(--muted);max-width:60ch}
.mentor{display:flex;gap:14px;align-items:flex-end}
.mentor svg{width:96px;height:96px;flex:none}
.bubble{background:var(--card);border:3px solid var(--ink);border-radius:18px 18px 18px 4px;padding:12px 16px;font-size:1.1rem;min-width:0;flex:1}
.bubble b{color:var(--police)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:3px solid var(--ink);background:var(--sun);border-radius:14px;padding:10px 20px;font-family:var(--display);font-weight:600;font-size:1.15rem;box-shadow:0 4px 0 var(--ink)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.ghost{background:var(--card)}
.btn.blue{background:var(--police);color:#fff}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.word{background:var(--card);border:2px solid var(--police);border-radius:14px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;gap:2px}
.word .w{font-family:var(--display);font-weight:700;font-size:1.25rem;color:var(--police);display:flex;justify-content:space-between;gap:8px}
.word .m{font-size:.9rem;color:var(--muted)}
.speak{font-size:.8rem;font-weight:700;color:var(--ink);opacity:.7}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.item{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:.92rem}
.item .e{font-size:2.3rem;line-height:1}
.item.ok{border-color:var(--go);background:#e3f5ea}
.item.no{border-color:var(--stop);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.note{background:var(--sun-soft);border-radius:14px;padding:10px 14px;font-weight:700}
.note.good{background:#e3f5ea;color:#145a36}
.note.soft{background:#fde8e6;color:#8a241e}
.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.split>*{min-width:0}
.dress{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.dress svg{width:150px;height:190px;background:var(--card);border:3px solid var(--line);border-radius:18px;flex:none}
#xw{width:100%;aspect-ratio:2/1;border:3px solid var(--ink);border-radius:16px;display:block;background:#bfe3a5}
.signal{min-width:180px}
.signal.stop{background:var(--stop);color:#fff}
.signal.go{background:var(--go);color:#fff}
.meter{font-family:var(--display);font-weight:600;font-size:1.2rem}
.person{background:var(--card);border:3px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700;min-width:120px}
.person.heard{border-color:var(--police);background:var(--police-soft)}
.notebook{background:#fffef6;border:2px solid var(--line);border-radius:12px;padding:12px 14px;background-image:repeating-linear-gradient(transparent 0 27px,#e9e2cf 27px 28px);min-height:120px}
.notebook h3{margin:0 0 4px;font-family:var(--display);font-size:1.05rem}
.notebook ul{margin:0;padding-left:20px}
.q{display:flex;flex-direction:column;gap:6px}
.q .lbl{font-weight:700}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:700}
.chip.on{background:var(--police);color:#fff;border-color:var(--police)}
.chip.wrong{border-color:var(--stop);color:var(--stop)}
.choice{width:100%;text-align:left;background:var(--card);border:3px solid var(--ink);border-radius:16px;padding:12px 16px;font-weight:700;font-size:1.02rem}
.stamp{align-self:center;width:170px;height:170px;border-radius:50%;border:6px double var(--police);display:flex;flex-direction:column;align-items:center;justify-content:center;transform:rotate(-8deg);color:var(--police);font-family:var(--display);font-weight:700;text-align:center;background:var(--police-soft);animation:pop .5s ease-out}
.stamp .big{font-size:3rem;line-height:1}
@keyframes pop{0%{transform:rotate(-8deg) scale(.4);opacity:0}70%{transform:rotate(-8deg) scale(1.1)}100%{transform:rotate(-8deg) scale(1)}}
.passport .badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.badge{border:3px dashed var(--line);border-radius:16px;padding:12px;text-align:center;font-weight:700;color:var(--muted)}
.badge.got{border-style:solid;border-color:var(--police);color:var(--police);background:var(--police-soft)}
.badge .e{font-size:2rem;display:block}
.menu{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.tile{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:4px;box-shadow:0 4px 0 var(--ink)}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.tile .e,.badge .e,.stamp .big,.spellcard .e,.pics span,.boxg{filter:var(--stk)}
.tile .e{font-size:2.4rem;line-height:1.1}
.tile b{font-family:var(--display);font-size:1.3rem;font-weight:700}
.tile small{color:var(--muted);font-size:.9rem}
.tile.main{background:var(--police);color:#fff;grid-column:1/-1}
.tile.main .e{color:var(--sun)}
.tile.main small{color:var(--police-soft)}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:560px}
.mc{aspect-ratio:1/1;border:3px solid var(--ink);border-radius:14px;background:var(--police);color:#fff;font-family:var(--display);font-weight:700;font-size:clamp(.8rem,2.6vw,1.15rem);display:flex;align-items:center;justify-content:center;padding:4px;overflow-wrap:anywhere;transition:transform .2s}
.mc.back{font-size:1.8rem;color:var(--sun)}
.mc.up{background:var(--card);color:var(--police);transform:rotateY(0)}
.mc.up .e{font-size:clamp(1.8rem,6vw,2.6rem)}
.mc.done{background:#e3f5ea;border-color:var(--go);color:#145a36}
#drive{width:100%;aspect-ratio:2/1;border:3px solid var(--ink);border-radius:16px;display:block;background:#8fcf8a;touch-action:none}
.find{position:relative;width:100%;aspect-ratio:16/10;border:3px solid var(--ink);border-radius:16px;overflow:hidden;background:linear-gradient(#9bd8f5 0 30%,#8fcf8a 30% 100%)}
.find .path{position:absolute;left:0;right:0;top:62%;height:12%;background:#e4d3a8}
.find .pond{position:absolute;left:62%;top:40%;width:26%;height:18%;border-radius:50%;background:#6cc1e8;border:3px solid #4a9fc8}
.find button.h{position:absolute;border:0;background:none;font-size:clamp(20px,4.2vw,34px);transform:translate(-50%,-50%);padding:3px;line-height:1;border-radius:50%}
.find button.h.found{background:#e3f5ea;outline:3px solid var(--go)}
.find button.h.miss{animation:shake .35s}
.chip.got{background:#e3f5ea;border-color:var(--go);color:#145a36}
ol.seq{margin:0;padding-left:30px;display:flex;flex-direction:column;gap:6px;font-weight:700}
ol.seq:empty{display:none}
ol.seq li{background:#e3f5ea;border-radius:10px;padding:6px 10px;color:#145a36}
.sortcard{align-self:center;background:var(--card);border:3px solid var(--ink);border-radius:20px;padding:14px 28px;display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:1.2rem;text-align:center;max-width:100%}
.sortcard .e{font-size:3.6rem;line-height:1.1}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.bin.right,.choice.right{border-color:var(--go);background:#e3f5ea}
.choice.wrongc{border-color:var(--stop);color:var(--stop)}
.choice:disabled,.bin:disabled{cursor:default}
.ticket{background:var(--sun-soft);border:3px dashed var(--ink);border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:2px;font-size:1.05rem}
.tick-em{font-size:1.6rem;letter-spacing:.1em}
.tray{min-height:64px;background:var(--card);border:3px dashed var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:2.2rem;letter-spacing:.12em;padding:6px}
.tray .empty{font-size:1rem;color:var(--muted);letter-spacing:0}
.whack{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:420px;width:100%;align-self:center}
.hole{aspect-ratio:1.2/1;border-radius:50%/42%;border:3px solid var(--ink);background:#e9dfcc;font-size:clamp(2rem,9vw,3rem);display:flex;align-items:center;justify-content:center;box-shadow:inset 0 6px 0 rgba(20,34,61,.12);padding:0}
.hole.up{background:var(--sun-soft)}
.hole.done{background:#e3f5ea}
.pads{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:360px;width:100%;align-self:center}
.pad{aspect-ratio:1.4/1;border-radius:20px;border:3px solid var(--ink);background:var(--c);opacity:.5;color:#fff;font-family:var(--display);font-weight:700;font-size:1.6rem;transition:opacity .1s,transform .1s}
.pad.lit{opacity:1;transform:scale(1.05)}
.beatlight{width:90px;height:90px;border-radius:50%;background:var(--line);align-self:center;border:3px solid var(--ink);transition:background .08s}
.beatlight.on{background:var(--sun)}
.drum{align-self:center;width:190px;height:120px;border-radius:50%/40%;border:3px solid var(--ink);background:var(--card);font-family:var(--display);font-weight:700;font-size:1.5rem;box-shadow:0 6px 0 var(--ink)}
.drum.hit{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.menu.small{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.tile .done{color:var(--go);font-weight:700;font-size:.85rem}
body{background-image:radial-gradient(rgba(34,38,58,.07) 1.2px,transparent 1.7px);background-size:22px 22px}
:is(.btn,.ctrl,.tile,.item,.chip,.pill,.choice,.person){background-image:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0) 58%)!important}
.item,.person,.choice{box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
.item:active,.person:active,.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.card{--jobc:#1f4fa3;box-shadow:0 8px 0 rgba(34,38,58,.35)}
.card-head{border-bottom:5px solid var(--jobc)}
.job-tag{color:var(--jobc)}
.scene-art{width:100%;aspect-ratio:9/4;border-radius:18px;border:3px solid var(--ink);display:block;background:#cdeefb;box-shadow:0 4px 0 var(--line)}
.mentor svg{filter:drop-shadow(0 3px 0 rgba(34,38,58,.25))}
.bubble{box-shadow:0 4px 0 var(--line);position:relative}
.mayor{display:flex;gap:14px;align-items:flex-start;margin:6px 0 12px}.mayor img{width:96px;height:96px;flex:none;border-radius:50%;border:3px solid var(--ink);background:#fff;object-fit:cover;object-position:50% 20%;box-shadow:0 4px 0 var(--line)}
@media (max-width:520px){.mayor img{width:72px;height:72px}}
.word{box-shadow:0 3px 0 var(--police-soft)}
.note{border:2px solid rgba(34,38,58,.08)}
.find canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.find button.h{z-index:1}
.hole{background:radial-gradient(ellipse at 50% 72%,#bfae8a 0 42%,#e9dfcc 44%)}
.hole.up{background:radial-gradient(ellipse at 50% 72%,#f5d98a 0 42%,var(--sun-soft) 44%)}
.hole.done{background:radial-gradient(ellipse at 50% 72%,#b6e3c4 0 42%,#e3f5ea 44%)}
.stamp{background:repeating-conic-gradient(var(--police-soft) 0 12deg,#ffffff 12deg 24deg);box-shadow:0 0 0 8px var(--paper),0 0 0 11px var(--police),0 10px 0 11px rgba(34,38,58,.2)}
.stamp .big{background:var(--paper);border:3px solid var(--police);border-radius:50%;width:72px;height:72px;display:flex;align-items:center;justify-content:center;font-size:2.6rem;margin-bottom:4px}
#xw,#drive{box-shadow:0 4px 0 var(--line)}
#world{position:relative;width:100%;height:100%;min-height:280px;border-radius:20px;border:3px solid var(--ink);overflow:hidden;background:#9bd8f5;box-shadow:0 6px 0 var(--ink)}
canvas.w3d{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.prompt3d{position:absolute;left:50%;bottom:52px;transform:translateX(-50%);background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 16px;font-family:var(--display);font-weight:600;font-size:1.05rem;max-width:calc(100% - 300px);width:max-content;text-align:center;box-shadow:0 4px 0 var(--line);z-index:2}
.quest3d{position:absolute;left:14px;top:14px;max-width:min(330px,46%);background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;z-index:2;box-shadow:0 4px 0 var(--line);font-size:.92rem;line-height:1.35}
.quest3d b{font-family:var(--display);color:var(--police)}
.quest3d .zr{margin-top:6px;padding-top:6px;border-top:2px dashed var(--line);font-size:.86rem;line-height:1.35}
.quest3d .zr b{color:#1f6f8b}
.quest3d>.zr:first-child{border-top:0;margin-top:0;padding-top:0}
.quest3d .stats+.zr{margin-top:4px}
.ztog{border:0;background:none;padding:0;font:inherit;font-weight:700;color:#1f6f8b;cursor:pointer;text-align:left}
.ztog:hover{text-decoration:underline}
.zbtn{border:2px solid var(--ink);background:var(--sun);border-radius:999px;padding:0 8px;font-size:.78rem;font-weight:700;margin-left:2px}
.zh{display:block;margin-top:3px;font-weight:700;color:var(--go)}
.quest3d .stats{color:var(--muted);font-size:.78rem;font-weight:700;margin-top:3px}
.quest3d:empty{display:none}
.appform{background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 0 var(--line)}
.appform .row{justify-content:space-between;gap:16px;font-size:1.02rem}
.appform small{font-weight:400;color:var(--muted)}
.chip .have{font-size:.75rem;color:var(--go);font-weight:700}
.chip.on .have{color:#e3f5ea}
.earned{background:var(--card);border:3px dashed var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.earned b{font-family:var(--display)}
.mapwrap{overflow:auto;border:3px solid var(--ink);border-radius:18px;background:#9fdc8f;box-shadow:0 4px 0 var(--line);max-height:72vh}
.townmap{display:block;width:100%;min-width:760px;height:auto}
.townmap .mp{cursor:pointer}
.townmap .mp:hover .foot,.townmap .mp:focus .foot{stroke:#ffc23d;stroke-width:1.4}
.townmap .mp:focus{outline:none}
.townmap .you{animation:blink 1.2s ease-in-out infinite}
@keyframes blink{50%{opacity:.45}}
.prog{height:10px;background:var(--card);border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--go);transition:width .35s}
.hear,.hear-s{border:2px solid var(--ink);background:var(--card);border-radius:999px;padding:2px 10px;font-size:.95rem;vertical-align:middle;margin-left:6px}
.card{position:relative}
.streak{position:sticky;top:70px;margin-left:auto;margin-right:16px;margin-bottom:-40px;width:max-content;background:#ff7a3d;color:#fff;font-family:var(--display);font-weight:700;border-radius:999px;padding:6px 14px;z-index:5;border:3px solid var(--ink);animation:pop .4s ease-out}
.stars{display:flex;justify-content:center;gap:10px;font-size:3rem;line-height:1;margin:6px 0}
.stars span{color:var(--line);transform:scale(.3);animation:starpop .45s ease-out forwards;-webkit-text-stroke:2px var(--ink)}
.stars span.on{color:#ffc23d}
@keyframes starpop{60%{transform:scale(1.25)}to{transform:scale(1)}}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.confetti i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall 2s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(800deg)}}
ol.seq li.empty{background:var(--card);border:2px dashed var(--line);color:var(--muted)}
.bubble.big{font-size:1.2rem;font-weight:700}
.pics{display:grid;grid-template-columns:repeat(5,2.4rem);gap:4px;justify-content:center;font-size:1.9rem;line-height:1.2;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:8px;width:max-content;max-width:100%;margin:0 auto}
.pics span{text-align:center}
.pics span.gone{opacity:.25;text-decoration:line-through;filter:grayscale(1)}
.pics.pat{grid-template-columns:repeat(8,2.4rem)}
.qm{display:flex;align-items:center;justify-content:center;border:3px dashed var(--police);border-radius:10px;color:var(--police);font-family:var(--display);font-weight:700;padding:0 8px}
.eq{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.eq>b{font-family:var(--display);font-size:2rem}
.boxg{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:6px 8px;font-size:1.8rem}
.boxg small{font-size:.85rem;font-weight:700;color:var(--muted)}
.boxg .pics{border:0;padding:0}
.coins{font-size:1.1rem}
.nums{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.nums span{min-width:64px;padding:10px 12px;text-align:center;background:var(--card);border:3px solid var(--ink);border-radius:14px;font-family:var(--display);font-weight:700;font-size:1.6rem}
.mopts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.mopt{min-width:88px;padding:12px 18px;border:3px solid var(--ink);border-radius:16px;background:var(--sun-soft);font-family:var(--display);font-weight:700;font-size:1.8rem;box-shadow:0 4px 0 var(--ink)}
.mopt.right{background:#e3f5ea;border-color:var(--go)}
.mopt:disabled:not(.right){opacity:.45}
.spellcard{display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--card);border:3px solid var(--ink);border-radius:18px;padding:12px 16px}
.spellcard .e{font-size:3rem}
.spellcard>div{flex:1;min-width:180px}
.slots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.slots span{width:46px;height:56px;border-bottom:4px solid var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:2rem;text-transform:uppercase}
.slots span.fill{color:var(--police);animation:pop .3s}
.tiles{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tile-l{width:54px;height:58px;border:3px solid var(--ink);border-radius:12px;background:#fff1c9;font-family:var(--display);font-weight:700;font-size:1.8rem;text-transform:uppercase;box-shadow:0 4px 0 var(--ink)}
.tile-l:disabled{opacity:.25;box-shadow:none}
.tile-l.tlhint{background:#e3f5ea;border-color:var(--go);animation:pulse 1s ease-in-out infinite}
.readcard{background:#fffef6;border:3px solid var(--ink);border-radius:16px;padding:14px 16px;font-size:1.3rem;line-height:1.6;background-image:repeating-linear-gradient(transparent 0 33px,#efe7d2 33px 34px)}
.blank{display:inline-block;min-width:90px;border-bottom:3px solid var(--police);color:var(--police);font-weight:700;text-align:center}
.blank.filled{animation:pop .3s}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}to{transform:scale(1)}}
@media (max-width:620px){.pics{grid-template-columns:repeat(5,2rem);font-size:1.5rem}.pics.pat{grid-template-columns:repeat(4,2rem)}.slots span{width:34px;height:46px;font-size:1.6rem}.tile-l{width:46px;height:50px;font-size:1.5rem}.mopt{min-width:70px;font-size:1.5rem}}

/* ---------- storybook game stage ---------- */
#body.gstage{--stk:drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(0 3px 1px rgba(34,38,58,.3));
  background-color:var(--wall,#fff6e0);background-image:radial-gradient(rgba(34,38,58,.07) 1.5px,transparent 2px),linear-gradient(180deg,rgba(255,255,255,.65),rgba(255,255,255,0) 160px);background-size:20px 20px,100% 100%;border-radius:0 0 18px 18px}
.gstage h2{text-shadow:0 2px 0 rgba(255,255,255,.8)}
.gstage .lead{color:var(--ink);opacity:.8}
.gstage .note{box-shadow:0 3px 0 rgba(34,38,58,.12)}
/* wooden table with sticker cards */
.gstage .grid{background:#e6c18f repeating-linear-gradient(90deg,rgba(138,90,52,.13) 0 2px,transparent 2px 64px);border:3px solid var(--ink);border-radius:22px;padding:16px;box-shadow:inset 0 -10px 0 rgba(138,90,52,.25),0 5px 0 rgba(34,38,58,.18);gap:14px}
.gstage .item{background:linear-gradient(#fffdf8,#fff3dc);border:3px solid var(--ink);border-radius:18px;box-shadow:0 5px 0 var(--ink);position:relative;transition:transform .12s,box-shadow .12s;padding:12px 6px 10px}
.gstage .grid .item:nth-child(3n+1){transform:rotate(-1.6deg)}
.gstage .grid .item:nth-child(3n+2){transform:rotate(1.3deg)}
.gstage .item:hover{transform:translateY(-4px) rotate(0)}
.gstage .item:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.gstage .item .e{font-size:2.9rem;filter:var(--stk)}
.gstage .item.ok{background:linear-gradient(#f2fbf5,#dcf3e4);border-color:#1d6e44}
.gstage .item.ok::after{content:'✓';position:absolute;top:-12px;right:-10px;width:28px;height:28px;border-radius:50%;background:var(--go);color:#fff;border:3px solid var(--ink);display:grid;place-items:center;font-weight:700;font-size:.95rem}
.gstage .item.no{border-color:var(--stop);background:#fff0ee}
/* clipboard for step-by-step games */
.gstage ol.seq{counter-reset:s;list-style:none;margin:10px 0 0;padding:28px 18px 14px;gap:2px;background:#fffef6 repeating-linear-gradient(transparent 0 39px,#e9e2cf 39px 40px);border:3px solid var(--ink);border-radius:14px;position:relative;box-shadow:6px 6px 0 #c77d43,6px 6px 0 3px var(--ink)}
.gstage ol.seq::before{content:'';position:absolute;top:-15px;left:50%;transform:translateX(-50%);width:96px;height:24px;background:linear-gradient(#c9d6e3,#9aa3b5);border:3px solid var(--ink);border-radius:8px}
.gstage ol.seq li{counter-increment:s;display:flex;align-items:center;gap:12px;background:transparent;color:var(--ink);margin:0;padding:5px 0 5px 2px;border:0;border-radius:0;font-size:1.02rem;font-weight:700}
.gstage ol.seq li::before{content:counter(s);width:30px;height:30px;border-radius:50%;background:var(--go);color:#fff;border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;flex:none}
.gstage ol.seq li.empty{border:0;background:transparent;color:var(--muted);animation:none}
.gstage ol.seq li.empty::before{background:#fff;color:var(--muted);border-style:dashed}
/* hanging tag + bins for sorting games */
.gstage .sortcard{background:#fffdf8;border:3px solid var(--ink);border-radius:18px;padding:22px 30px 18px;position:relative;margin-top:22px;box-shadow:0 6px 0 rgba(34,38,58,.18);animation:swing 2.6s ease-in-out infinite;transform-origin:50% -24px}
.gstage .sortcard::before{content:'';position:absolute;top:-24px;left:calc(50% - 1.5px);width:3px;height:24px;background:var(--ink)}
.gstage .sortcard::after{content:'';position:absolute;top:8px;left:calc(50% - 7px);width:14px;height:14px;border-radius:50%;background:var(--wall,#fff6e0);border:3px solid var(--ink)}
.gstage .sortcard .e{filter:var(--stk);font-size:4rem}
@keyframes swing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
.bins{gap:14px}
.bin{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:2px;min-height:132px;padding:26px 8px 12px;border:3px solid var(--ink);border-radius:8px 8px 26px 26px;background:linear-gradient(90deg,rgba(255,255,255,.28),transparent 30%,transparent 70%,rgba(0,0,0,.12)),var(--binc,#3a7bd5);color:#fff;font-family:var(--display);font-weight:700;font-size:1.05rem;box-shadow:0 5px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.25)}
.bin .lid{position:absolute;top:-12px;left:-8px;right:-8px;height:18px;border:3px solid var(--ink);border-radius:10px;background:var(--binc,#3a7bd5);filter:brightness(.85)}
.bin .e{font-size:2.4rem;filter:var(--stk,none);background:#fffdf8;border:3px solid var(--ink);border-radius:50%;width:58px;height:58px;display:grid;place-items:center;text-shadow:none}
.bin:active{transform:translateY(3px);box-shadow:0 2px 0 var(--ink)}
.bin.right{outline:4px solid var(--go);outline-offset:3px}
.bin:disabled{cursor:default}
/* paper order ticket + plate */
.gstage .ticket{background:#fffdf8;border:0;border-radius:6px 6px 0 0;padding:18px 18px 16px;position:relative;box-shadow:0 0 0 3px var(--ink);margin:12px 0 18px}
.gstage .ticket::before{content:'';position:absolute;top:-12px;left:calc(50% - 11px);width:22px;height:22px;border-radius:50%;background:#e8553e;border:3px solid var(--ink);box-shadow:inset -4px -4px 0 rgba(0,0,0,.18)}
.gstage .ticket::after{content:'';position:absolute;left:-3px;right:-3px;bottom:-14px;height:14px;background:linear-gradient(135deg,#fffdf8 45%,var(--ink) 45% 55%,transparent 55%) 0 0/16px 14px,linear-gradient(-135deg,#fffdf8 45%,var(--ink) 45% 55%,transparent 55%) 0 0/16px 14px}
.gstage .tick-em{filter:var(--stk)}
.gstage .tray{border:3px solid var(--ink);border-radius:999px;min-height:120px;max-width:440px;width:100%;margin:0 auto;background:radial-gradient(ellipse at center,#ffffff 0 52%,#ece4d5 53% 56%,#ffffff 57% 64%,#ddd4c3 65%);box-shadow:0 6px 0 rgba(34,38,58,.2);font-size:2.6rem}
.gstage .tray>*:not(.empty){filter:var(--stk)}
.gstage .tray{filter:none}
/* tapping game boards, themed per job */
.gstage .whack{background:#7cc476;border:3px solid var(--ink);border-radius:24px;padding:16px;box-shadow:0 6px 0 var(--ink);gap:12px;max-width:460px}
.gstage .hole{background:radial-gradient(ellipse at 50% 78%,#6b4a2b 0 36%,#8a5a34 37% 46%,transparent 47%),#9fdc8f;border:3px solid var(--ink);box-shadow:inset 0 -6px 0 rgba(0,0,0,.12)}
.gstage .hole.up,.gstage .hole.done{background:radial-gradient(ellipse at 50% 78%,#6b4a2b 0 36%,#8a5a34 37% 46%,transparent 47%),#c5ecb8}
.hole .pop{display:inline-block;filter:var(--stk,none);animation:popup .22s ease-out}
@keyframes popup{from{transform:translateY(45%) scale(.4)}}
.gstage .whack.w-fire{background:#c9302c repeating-linear-gradient(0deg,transparent 0 22px,rgba(0,0,0,.14) 22px 25px)}
.gstage .w-fire .hole{border-radius:10px;background:linear-gradient(#fff6c9,#ffd98a);box-shadow:inset 0 0 0 5px #fffaf0,inset 0 -6px 0 rgba(0,0,0,.1)}
.gstage .w-fire .hole.up{background:linear-gradient(#ffd27a,#ff9a3d)}
.gstage .whack.w-teacher{background:#3b6e52;box-shadow:0 0 0 8px #a0703a,0 6px 0 8px var(--ink)}
.gstage .w-teacher .hole{border-radius:10px;background:linear-gradient(#e6c18f,#c99a5e);box-shadow:inset 0 -8px 0 #a0703a}
.gstage .whack.w-vet{background:#bfe3f5}
.gstage .w-vet .hole{border-radius:50%;background:radial-gradient(circle,#ffd6e0 0 40%,#ef7aa7 41% 60%,#d95a8b 61%)}
.gstage .whack.w-farmer{background:#8a5a34 repeating-linear-gradient(0deg,transparent 0 30px,rgba(0,0,0,.15) 30px 36px)}
.gstage .w-farmer .hole{background:radial-gradient(ellipse at 50% 70%,#5cbf6a 0 30%,#6b4a2b 31% 55%,transparent 56%),#7a5030}
.gstage .whack.w-ranger{background:#5cbf6a}
.gstage .w-ranger .hole{border-radius:45%;background:radial-gradient(circle at 50% 60%,#4caf5f 0 52%,#3b9150 53% 64%,transparent 65%),#7cc476}
.gstage .whack.w-recycle{background:#5a6378 repeating-linear-gradient(90deg,transparent 0 26px,rgba(255,255,255,.12) 26px 30px);animation:belt 1s linear infinite}
@keyframes belt{to{background-position:30px 0}}
.gstage .w-recycle .hole{border-radius:8px;background:linear-gradient(#c99a5e,#a0703a);box-shadow:inset 0 0 0 4px #e6c18f}
/* quiz: the mentor asks */
.qrow{display:flex;gap:12px;align-items:center}
.qrow svg{width:78px;height:78px;flex:none}
.qrow .bubble{position:relative;border-radius:18px 18px 18px 4px}
.gstage .q{counter-reset:c}
.gstage .choice{counter-increment:c;display:flex;align-items:center;gap:12px;background:linear-gradient(#fffdf8,#fff6e6);box-shadow:0 4px 0 var(--ink);border-radius:16px}
.gstage .choice::before{content:counter(c,upper-alpha);flex:none;width:32px;height:32px;border-radius:50%;background:var(--sun);border:2px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:700}
.gstage .choice.right{background:#e3f5ea;border-color:var(--go)}
.gstage .choice.right::before{content:'✓';background:var(--go);color:#fff}
/* xylophone */
.gstage .pads{display:flex;align-items:center;justify-content:center;gap:12px;background:linear-gradient(#a0703a,#8a5a34);border:3px solid var(--ink);border-radius:20px;padding:18px 16px;max-width:460px;box-shadow:0 6px 0 var(--ink);position:relative}
.gstage .pads::before,.gstage .pads::after{content:'';position:absolute;left:12px;right:12px;height:10px;background:#5a3a1a;border-radius:6px}
.gstage .pads::before{top:34%}.gstage .pads::after{bottom:34%}
.gstage .pad{position:relative;z-index:1;width:70px;height:var(--h,140px);aspect-ratio:auto;border-radius:14px;opacity:.88;font-size:1.25rem;background:linear-gradient(90deg,rgba(255,255,255,.38),transparent 38%,transparent 70%,rgba(0,0,0,.15)),var(--c);box-shadow:0 5px 0 var(--ink);text-shadow:0 2px 0 rgba(0,0,0,.3)}
.gstage .pad::before,.gstage .pad::after{content:'';position:absolute;left:calc(50% - 5px);width:10px;height:10px;border-radius:50%;background:#e9e2cf;border:2px solid var(--ink)}
.gstage .pad::before{top:12px}.gstage .pad::after{bottom:12px}
.gstage .pad.lit{opacity:1;transform:translateY(-6px) scale(1.04);box-shadow:0 0 0 4px #fff,0 0 24px 6px var(--c)}
/* drum + spotlight */
.gstage .beatlight{width:96px;height:96px;border:0;border-radius:0;background:#d9cdb4;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);transition:transform .08s,background .08s}
.gstage .beatlight.on{background:#ffc23d;transform:scale(1.18)}
.gstage .drum{width:230px;height:170px;border:3px solid var(--ink);border-radius:50%/26%;font-size:1.4rem;color:var(--ink);display:flex;align-items:flex-start;justify-content:center;padding:22px 0 0;box-shadow:0 8px 0 var(--ink);
  background:radial-gradient(ellipse 50% 24% at 50% 24%,#fffaf0 0 92%,#e9e2cf 93% 99%,transparent 100%),repeating-linear-gradient(115deg,#e8553e 0 22px,#c9302c 22px 26px)}
.gstage .drum.hit{transform:translateY(5px) scale(.98)}
/* memory cards + witnesses */
.mc.back{background:var(--police) repeating-linear-gradient(45deg,rgba(255,255,255,.14) 0 8px,transparent 8px 16px);box-shadow:0 4px 0 var(--ink)}
.mc.up{background:linear-gradient(#fffdf8,#fff3dc);box-shadow:0 4px 0 var(--ink)}
.mc.up .e{filter:drop-shadow(1.5px 0 0 #fff) drop-shadow(-1.5px 0 0 #fff) drop-shadow(0 1.5px 0 #fff) drop-shadow(0 -1.5px 0 #fff) drop-shadow(0 3px 1px rgba(34,38,58,.3))}
.person svg{width:66px;height:66px}
.person{box-shadow:0 4px 0 var(--line);background:linear-gradient(#fffdf8,#fff3dc)}
.gstage .notebook{box-shadow:5px 5px 0 #c77d43,5px 5px 0 3px var(--ink);border:3px solid var(--ink)}
.gstage .mentor svg{width:104px;height:104px}
@media (max-width:620px){.gstage .pad{width:54px}.gstage .pads{gap:7px;padding:14px 10px}.bin{min-height:112px}.gstage .drum{width:190px;height:140px}}

.studycard{background:#fffef6;border:3px solid var(--ink);border-radius:16px;padding:14px 18px;font-size:1.12rem;line-height:1.65;box-shadow:5px 5px 0 #c77d43,5px 5px 0 3px var(--ink);margin:6px 0 10px}
.studycard p{margin:.4em 0;max-width:62ch}
.studyhead{font-family:var(--display);font-weight:700;color:var(--police);font-size:1.15rem;display:flex;align-items:center;gap:6px}
.lockwrap{position:relative}
.locknote{background:var(--card);border:3px dashed var(--ink);border-radius:14px;padding:10px 14px;font-weight:700;margin-bottom:10px}
.menu.locked .tile{opacity:.45;filter:grayscale(.7);cursor:not-allowed;box-shadow:none}
.wlen{font-size:.9rem;color:var(--muted);font-weight:700;margin-top:4px}
.spellbtns{display:flex;gap:8px;flex-wrap:wrap}
.spellbtns .btn{padding:6px 12px;font-size:.95rem}
.nums .op{min-width:auto;border:0;background:none;padding:10px 2px}
.vbar{display:grid;grid-template-columns:minmax(0,1fr) 2fr auto;gap:10px;align-items:center;font-weight:700}
.vtrack{height:16px;background:var(--card);border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.vfill{height:100%;background:var(--police)}
.hint3d{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;white-space:nowrap;background:rgba(255,255,255,.85);border-radius:10px;padding:4px 10px;font-size:.8rem;font-weight:700;color:var(--muted);z-index:1}
.joy{position:absolute;left:16px;bottom:16px;width:116px;height:116px;border-radius:50%;background:rgba(255,255,255,.5);border:3px solid var(--ink);touch-action:none;z-index:2}
.knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px;border-radius:50%;background:var(--sun);border:3px solid var(--ink);box-shadow:0 3px 0 var(--ink);pointer-events:none}
.fade3d{position:absolute;inset:0;background:#fffaf0;opacity:0;pointer-events:none;transition:opacity .6s;z-index:4}
.fade3d.on{opacity:1}
.compass3d{position:absolute;right:14px;top:12px;width:64px;height:64px;z-index:3;filter:drop-shadow(0 3px 0 rgba(34,38,58,.25))}
.compass3d svg{width:100%;height:100%;display:block}
.zoom3d{position:absolute;right:16px;top:86px;display:flex;flex-direction:column;gap:6px;z-index:2}
.zoom3d{align-items:flex-end}
.zoom3d .pill{width:44px;height:44px;justify-content:center;font-size:1.3rem;padding:0}
.zoom3d .pill.view{width:auto;height:auto;padding:8px 14px;font-size:.95rem}
.enter3d{position:absolute;right:16px;bottom:22px;z-index:2}
.enter3d.ready{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.builder{position:absolute;right:12px;top:12px;bottom:12px;width:min(340px,calc(100% - 24px));overflow:auto;background:var(--paper);border:3px solid var(--ink);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 6px 0 rgba(34,38,58,.3);z-index:6}
.builder h2{font-size:1.4rem}
#bPrev{width:100%;aspect-ratio:5/3;border-radius:14px;border:3px solid var(--ink)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatch{width:36px;height:36px;border-radius:50%;border:3px solid var(--ink);background:var(--c);padding:0}
.swatch.on{box-shadow:0 0 0 3px var(--paper),0 0 0 6px var(--police)}
@media (max-width:620px){.compass3d{width:52px;height:52px;top:10px;right:10px}.prompt3d{bottom:140px;max-width:calc(100% - 28px);font-size:.95rem}.quest3d{max-width:52%;font-size:.78rem}.zoom3d{top:70px;right:14px}.zoom3d .pill.view{font-size:.78rem;padding:6px 10px}.zoom3d .pill{width:40px;height:40px}.toast{top:150px}.builder{top:auto;left:12px;right:12px;width:auto;max-height:56%}.hint3d{display:none}.joy{width:100px;height:100px}}
@media (max-width:620px){
  .split{grid-template-columns:1fr}
  h2{font-size:1.4rem}
  .mentor svg{width:72px;height:72px}
  .ctrl{width:62px;height:54px}
  .hint{display:none}
}
ruby{ruby-align:center}
rt{font-size:.52em;font-weight:400;opacity:.8;line-height:1.15;letter-spacing:0;font-family:var(--body);user-select:none}
.step rt{font-size:.6em}
.dsec{font-family:var(--display);font-size:1.05rem;margin:16px 0 6px;color:var(--police);border-bottom:2px dashed var(--line);padding-bottom:4px}
.dsec span{color:var(--muted);font-size:.85rem;font-weight:400}
.dict{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.drow{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 10px;line-height:1.5}
.drow:active{transform:translateY(2px)}
.dja{font-weight:700;font-size:1.02rem}

<body>

<div class="app">

  <div class="stage">
    <canvas id="street" hidden aria-label="おしごとの たてものが ならぶ 町の 通り。ドアまで 歩いて 中に 入ろう。"></canvas>
    <div id="world" hidden>
      <div class="fade3d" id="fade3d"></div>
      <div class="prompt3d" id="prompt3d" hidden></div>
      <div class="quest3d" id="quest3d"></div>
      <div class="hint3d">うごく: やじるしキー・WASD・レバー　／　大きさ: スクロールか ゆびで つまむ</div>
      <div class="compass3d" aria-hidden="true"><svg viewBox="-30 -30 60 60"><circle r="27" fill="#fffaf0" stroke="#22263a" stroke-width="3"/><g id="cneedle"><path d="M0 -20L6 0H-6Z" fill="#e8553e" stroke="#22263a" stroke-width="1.5"/><path d="M0 20L6 0H-6Z" fill="#c9d6e3" stroke="#22263a" stroke-width="1.5"/><text y="-22" font-size="9" font-weight="700" text-anchor="middle" fill="#22263a" font-family="Zen Maru Gothic, Fredoka, sans-serif">N</text></g><circle r="3" fill="#22263a"/></svg></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- state ----------
const STORE='job-explorer-v1';
const S={voice:true,furi:true,badges:[],words:[],reactions:{},interests:{},best:{}};
// every launch starts a fresh game: no scores, badges or words. Only device settings (voice, speed, camera view) are remembered.
try{const saved=JSON.parse(localStorage.getItem(STORE)||'{}');['voice','rate','cam','furi'].forEach(k=>{if(k in saved)S[k]=saved[k]})}catch(e){}
function save(){try{localStorage.setItem(STORE,JSON.stringify(S))}catch(e){}}

const WORDS={
  'みまわり':['みまわり','町を 歩いたり 車で 回ったりして、安全を たしかめる こと。','🚓','みまわり'],
  'バッジ':['バッジ','けいさつかんだと みんなに わかる しるし。','⭐','バッジ'],
  'むせん':['むせん','けいさつしょや なかまと 話す どうぐ。','📻','むせん'],
  'おうだんほどう':['おうだんほどう','人が 道を わたる、しましまの みち。','🚸','おうだんほどう'],
  'こうつう':['こうつう','道を 走る 車や 自てん車や バス。','🚗','こうつう'],
  '見た人':['見た人','何が おきたかを 見ていた 人。','👀','みたひと'],
  'てがかり':['てがかり','もんだいを とく 手助けに なる 知らせ。','🔍','てがかり'],
  'とくちょう':['とくちょう','どんな すがたかを あらわす ことば。','📝','とくちょう'],
  'ほうこく書':['ほうこく書','おきたことを 書いて のこす 紙。','📄','ほうこくしょ'],
  'つうしんしつ':['つうしんしつ','助けが ひつような ばしょへ けいさつかんを おくる チーム。','📡','つうしんしつ'],
  'おとしものがかり':['おとしものがかり','おとしものを もちぬしが 来るまで あずかる ところ。','🧳','おとしものがかり']
};
function addWords(list){list.forEach(([w,m,e,k])=>{if(!WORDS[w])WORDS[w]=[w,m,e,k]})}
let curJob=null,curMentor=null;
function learn(k){if(!S.words.includes(k)){S.words.push(k);save()}}

const $=s=>document.querySelector(s);
// ---------- voice ----------
// Picks the most natural voice the device offers (neural / enhanced voices first, novelty voices never),
// reads one sentence at a time for natural pauses, and strips emoji and symbols that sound odd aloud.
const hasTTS='speechSynthesis' in window;
let VOICES=[],ALLV=[],voice=null;
function voiceScore(v){
  if(!/^ja/i.test(v.lang))return -1;
  const n=v.name.toLowerCase();let sc=0;
  if(/natural|neural/.test(n))sc+=60;
  if(/online/.test(n))sc+=20;
  if(/premium|enhanced|siri/.test(n))sc+=45;
  if(/google/.test(n))sc+=30;
  if(/kyoko|otoya|o-ren|oren|hattori|nanami|ayumi|haruka|ichiro|keita|sayaka|naoki|daichi|mayu|shiori|hikari|mizuki/.test(n))sc+=15;
  if(/ja[-_]jp/i.test(v.lang))sc+=6;
  if(/compact|espeak|zarvox|trinoids|albert|bad news|good news|bells|boing|bubbles|cellos|whisper|wobble|jester|organ|superstar|deranged|hysterical|pipe organ|junior|ralph|fred|kathy|bahh|grandma|grandpa|rocko|shelley|flo|eddy|reed|sandy/.test(n))sc-=100;
  return sc;
}
function loadVoices(){
  if(!hasTTS)return;
  const all=speechSynthesis.getVoices();
  let list=all.filter(v=>voiceScore(v)>=0);
  if(!list.length)list=all.filter(v=>/^ja/i.test(v.lang));
  VOICES=list.sort((a,b)=>voiceScore(b)-voiceScore(a));ALLV=all.filter(v=>/^ja/i.test(v.lang));
  voice=null;
  if(!$('#scene').hidden&&$('#voiceSel'))voicePanel();
}
if(hasTTS){loadVoices();try{speechSynthesis.addEventListener('voiceschanged',loadVoices)}catch(e){speechSynthesis.onvoiceschanged=loadVoices}}
function speakable(t){
  return t.replace(/<[^>]+>/g,'')
    .replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}\u{20E3}]/gu,'')
    .replace(/[·•]/g,',').replace(/\s*…\s*/g,'. ').replace(/\s+/g,' ').trim();
}
// every character gets their own voice: a different device voice where possible, plus their own pitch and pace
const FEMALE=/kyoko|o-ren|oren|nanami|ayumi|haruka|sayaka|mayu|shiori|hikari|mizuki|tomoko|female|女性|女/i;
const MALE=/otoya|hattori|ichiro|keita|naoki|daichi|takumi|takeshi|\bmale|男性|男/i;
const GENDER={'リベラさん':'f','オカフォ先生':'m','アクセル町長':'m','サムさん':'m','アルジュンさん':'m','メイたいちょう':'f','トマスさん':'m','リン先生':'f','アマ先生':'f','ハルさん':'m','ローザさん':'f','カイ':'m','ジェイド':'f','イネスさん':'f','パテルさん':'f','コフィさん':'m','ジョーさん':'f','ロッシさん':'m','アデさん':'f','ディーさん':'f','アナ':'f','ミア先生':'f','グリーンさん':'m','マヤ':'f','ルイス':'m','ゾーイ':'f','キムさん':'m','プリヤ':'f'};
const hashS=t=>[...String(t)].reduce((h,c)=>(h*31+c.charCodeAt(0))>>>0,7);
function voiceFor(p){if(!p)return null;const n=p.name||p.n||'';const g=GENDER[n]||(hashS(n)%2?'f':'m'),h=hashS(n);
  const pool=VOICES.filter(v=>(g==='f'?FEMALE:MALE).test(v.name)&&!(g==='f'?MALE:FEMALE).test(v.name)),list=pool.length?pool:VOICES;
  const base=g==='f'?1.08:.86,shift=pool.length?0:(g==='f'?.18:-.22);
  return {voice:list.length?list[h%list.length]:null,pitch:Math.max(.3,Math.min(1.8,base+shift+((h>>>3)%5-2)*.06)),rate:.92+((h>>>6)%4)*.04}}
function robotVoice(){const rv=ALLV.find(v=>/zarvox|trinoids|robot/i.test(v.name))||ALLV.find(v=>/otoya|ichiro|keita/i.test(v.name));return {voice:rv||null,pitch:rv?.5:.25,rate:.72,robot:true}}
function narratorVoice(){if(voice===null&&VOICES.length)voice=VOICES.find(v=>MALE.test(v.name)&&!FEMALE.test(v.name))||VOICES[0];return voice}
function say(text,prof){
  if(!S.voice||!hasTTS)return;
  try{
    speechSynthesis.cancel();
    if(prof&&prof.robot){[1200,800,1500].forEach((f,i)=>setTimeout(()=>tone(f,.07,'square'),i*70))}
    const parts=speakable(text).match(/[^。．.!?！？]+[。．.!?！？]+["」』”']?|[^。．.!?！？]+$/g)||[];
    parts.forEach((p,i)=>{p=p.trim();if(!p)return;
      const u=new SpeechSynthesisUtterance(p);
      const vv=prof&&prof.voice?prof.voice:narratorVoice();if(vv){u.voice=vv;u.lang=vv.lang}else u.lang='ja-JP';
      u.rate=(S.rate||.95)*(prof?prof.rate:1);u.pitch=prof?prof.pitch:1;u.volume=1;
      speechSynthesis.speak(u)});
    if(speechSynthesis.paused)speechSynthesis.resume();
  }catch(e){}
}
const voiceBtn=$('#voiceBtn');
function syncVoice(){voiceBtn.setAttribute('aria-pressed',S.voice);voiceBtn.textContent=S.voice?'声: オン':'声: オフ';const m=$('#muteBtn');if(m)m.textContent=S.voice?'声を けす':'声を つける'}
function voicePanel(){
  openScene();$('#steps').innerHTML='';$('#jobTag').textContent='声の せってい';$('.card').style.setProperty('--jobc','#1f4fa3');
  const rates=[['ゆっくり',.82],['ふつう',.95],['はやい',1.08]],cur=S.rate||.95;
  body.innerHTML=`<h2>声</h2><p class="lead">おしごとタウンは ぜんぶ 声で 読み上げます。町の みんなに それぞれの 声が あります。</p>
    <div class="q"><span class="lbl">声</span><div class="chips"><button class="chip ${S.voice?'on':''}" data-on="1">オン</button><button class="chip ${S.voice?'':'on'}" data-on="0">オフ</button></div></div>
    ${hasTTS&&VOICES.length?'':`<div class="note soft">この きかいには 日本語の 読み上げの 声が 入っていません。</div>`}
    <div class="q"><span class="lbl">はやさ</span><div class="chips" id="rateC">${rates.map(([n,r])=>`<button class="chip ${Math.abs(r-cur)<.01?'on':''}" data-r="${r}">${n}</button>`).join('')}</div></div>
    <div class="row"><button class="btn" id="testV">声を ためす</button><button class="btn ghost" id="doneV">できた</button></div>
    <p class="lead" style="font-size:.9rem">声は つかっている きかいの ものです。Chrome や Microsoft Edge、iPhone・iPad・Mac で 日本語の 声を 入れると いちばん しぜんに 聞こえます（せってい → アクセシビリティ → 読み上げ → 声）。</p>`;
  const test=()=>say("こんにちは！ けいさつかんの リベラです。おしごとタウンを たんけんしよう。すきな しごとを 見つけてね！");
  body.querySelectorAll('[data-on]').forEach(b=>b.onclick=()=>{S.voice=b.dataset.on==='1';save();syncVoice();if(!S.voice)try{speechSynthesis.cancel()}catch(e){};voicePanel()});
  body.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.rate=+b.dataset.r;save();body.querySelectorAll('[data-r]').forEach(x=>x.classList.toggle('on',x===b));test()});
  $('#testV').onclick=test;$('#doneV').onclick=closeScene;
}
voiceBtn.onclick=voicePanel;
syncVoice();

let toastTimer;
function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,Math.max(2600,msg.length*60))}

<path d="M31 48c-1-15 7-24 19-24s20 9 19 24c-3-6-7-8-10-9-5 4-14 5-22 2-2 2-4 4-6 7z" fill="${m.hair}" ${sw}/>
<ellipse cx="43" cy="52" rx="4.4" ry="5.4" fill="#fff"/><ellipse cx="57" cy="52" rx="4.4" ry="5.4" fill="#fff"/>
<circle cx="43.6" cy="52.6" r="2.7" fill="${k}"/><circle cx="57.6" cy="52.6" r="2.7" fill="${k}"/>

<ellipse cx="38" cy="60" rx="3.6" ry="2.4" fill="rgba(255,120,130,.45)"/><ellipse cx="62" cy="60" rx="3.6" ry="2.4" fill="rgba(255,120,130,.45)"/>
<path d="M44 61q6 5.5 12 0" fill="none" stroke="${k}" stroke-width="2.2" stroke-linecap="round"/>
${hats[m.hat]||''}</svg>`}

<rect x="48" y="94" width="10" height="44" rx="5" fill="rgba(255,255,255,.18)"/>

<circle cx="47" cy="62" r="7" fill="${sk}" ${sw}/><circle cx="103" cy="62" r="7" fill="${sk}" ${sw}/>
<circle cx="75" cy="60" r="29" fill="${sk}" ${sw}/>

function studyHTML(job,mark){const P=STUDY[job.id];return `<div class="studycard"><div class="studyhead">📖 ${job.name}の しごとに ついて <button class="hear-s" id="readStudy" aria-label="読んで もらう">🔊</button></div>${P.slice(0,3).map(p=>`<p>${p}</p>`).join('')}</div>`}
function interviewQs(job){const A=APPLY[job.id],P=STUDY[job.id],others=shuffle(JOBS.filter(j=>j.id!==job.id)).slice(0,2);
  return [{q:`${job.name}は ふだん どこで はたらく？`,a:`${job.place}`,opts:shuffle([`${job.place}`,...others.map(o=>`${o.place}`)])},
   {q:`文章に 出てきた、${job.name}に ひつような とくいな ことは どれ？`,a:shuffle(A.s.slice())[0],xs:A.xs},
   {q:`よい ${job.name}の せいかくとして 文章に 出てきたのは どれ？`,a:shuffle(A.t.slice())[0],xs:A.xt},
   {q:P[3][0],a:P[3][1],opts:shuffle(P[3].slice(1,4))}].map(q=>({...q,opts:q.opts||shuffle([q.a,...shuffle(q.xs.slice()).slice(0,2)])}))}

    body.innerHTML=`${sceneArt(job.id)}<h2>その1: しらべて 読もう</h2><p class="lead">もうしこむ 前に、この しごとが どんな ものか しらべよう。めんせつで きかれるから、よく 読んでね！</p>${studyHTML(job)}

  const chip=(k,v)=>{const have=(k==='s'?S.skills:S.traits)[v];return `<button class="chip ${pick[k].has(v)?'on':''}" data-k="${k}" data-v="${v}">${v}${have?' <span class="have">★ もっている</span>':''}</button>`};
  const form=(msg,cls)=>{setStep(1,steps);
    body.innerHTML=`<h2>その2: もうしこみ書</h2><p class="lead">読んだ ことを つかおう。${job.name}に いちばん ひつような ものを えらんでね。</p>

      <div class="q"><span class="lbl">🌟 せいかくを 2つ <small>（人との せっしかた）</small></span><div class="chips">${traits.map(v=>chip('t',v)).join('')}</div></div></div>

    $('#aLook').onclick=()=>{look=!look;form(msg,cls)};const rs=$('#readStudy');if(rs)rs.onclick=sayStudy;
    body.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const k=b.dataset.k,v=b.dataset.v,set=pick[k],max=k==='s'?3:2;

      bad.forEach(v=>{const k=A.xs.includes(v)?'s':'t';pick[k].delete(v)});look=true;form(m,'soft');say(m)}};

}

// ---------- ふりがな: かんじの 上に よみを つける ----------
// FURI は「ことば → よみ」の ひょう。値が [よみ, もじ数, とばす数] の時は、その ぶんだけ ルビを つけます。
let FURI_MAX=0;for(const k in FURI){if(k.length>FURI_MAX)FURI_MAX=k.length}
const HAS_KANJI=/[一-龯々]/,IS_DIGIT=/[0-9０-９]/;
function rubyFrag(str){
  const frag=document.createDocumentFragment();let buf='',i=0;
  const flush=()=>{if(buf){frag.appendChild(document.createTextNode(buf));buf=''}};
  while(i<str.length){
    let key=null;
    for(let L=Math.min(FURI_MAX,str.length-i);L>0;L--){
      const k=str.substr(i,L);
      if(FURI[k]!==undefined&&HAS_KANJI.test(k)){key=k;break}
    }
    if(key){
      const v=FURI[key];let read,span,skip;
      if(Array.isArray(v)){read=v[0];span=v[1];skip=v[2]||0}else{read=v;span=key.length;skip=0}
      const base=key.substr(skip,span);
      if(base.length===1&&FURI_N[base]&&IS_DIGIT.test(str[i-1]||''))read=FURI_N[base];
      buf+=key.slice(0,skip);flush();
      const r=document.createElement('ruby');r.appendChild(document.createTextNode(base));
      const rt=document.createElement('rt');rt.textContent=read;r.appendChild(rt);
      frag.appendChild(r);i+=skip+span;
    }else{buf+=str[i];i++}
  }
  flush();return frag;
}
function rubify(root){
  if(!S.furi||!root||!root.ownerDocument&&root!==document.body)return;
  const el=root.nodeType===1?root:root.parentNode;if(!el)return;
  const walker=document.createTreeWalker(el,NodeFilter.SHOW_TEXT,{acceptNode(n){
    const p=n.parentNode;if(!p||p.nodeType!==1)return NodeFilter.FILTER_REJECT;
    const t=p.nodeName;
    if(t==='RUBY'||t==='RT'||t==='SCRIPT'||t==='STYLE'||t==='CANVAS'||t==='INPUT'||t==='TEXTAREA')return NodeFilter.FILTER_REJECT;
    if(p.closest&&p.closest('.no-furi'))return NodeFilter.FILTER_REJECT;
    return HAS_KANJI.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
  const list=[];while(walker.nextNode())list.push(walker.currentNode);
  list.forEach(n=>{if(n.parentNode)n.parentNode.replaceChild(rubyFrag(n.nodeValue),n)});
}
function unruby(root){
  if(!root||!root.querySelectorAll)return;
  root.querySelectorAll('ruby').forEach(r=>{const rt=r.querySelector('rt');if(rt)rt.remove();
    r.parentNode&&r.parentNode.replaceChild(document.createTextNode(r.textContent),r)});
  if(root.normalize)root.normalize();
}
let furiBusy=false,furiMO=null;
function startFuri(){
  if(furiMO)return;
  furiMO=new MutationObserver(recs=>{
    if(!S.furi||furiBusy)return;furiBusy=true;
    const seen=new Set();
    for(const r of recs){const t=r.type==='characterData'?r.target.parentNode:r.target;
      if(t&&t.nodeType===1&&!seen.has(t)){seen.add(t);rubify(t)}}
    furiMO.takeRecords();furiBusy=false});
  furiMO.observe(document.body,{childList:true,subtree:true,characterData:true});
}
function syncFuri(){
  const b=$('#furiBtn');if(b){b.setAttribute('aria-pressed',S.furi);b.textContent=S.furi?'ふりがな: オン':'ふりがな: オフ'}
  furiBusy=true;
  if(S.furi){startFuri();rubify(document.body);if(furiMO)furiMO.takeRecords()}
  else{if(furiMO){furiMO.disconnect();furiMO=null}unruby(document.body)}

}

  LINES.forEach(l=>{o+=`<line x1="-80" y1="${l}" x2="80" y2="${l}" stroke="#ffd65a" stroke-width=".5" stroke-dasharray="2 2"/><line x1="${l}" y1="-80" x2="${l}" y2="80" stroke="#ffd65a" stroke-width=".5" stroke-dasharray="2 2"/>`});
  LINES.forEach(X=>LINES.forEach(Z=>{o+=`<rect x="${X-4}" y="${Z-4}" width="8" height="8" fill="#6b7488"/>`}));
  o+=`<rect x="-93" y="5" width="10" height="7" fill="#6b7488"/>`;
  [-48,-16,16,48].forEach(v=>{[-64,64].forEach(m=>{o+=`<rect x="${m-6}" y="${v-1.6}" width="12" height="3.2" rx="1" fill="#6b7488"/>`+t(m,v+.9,STREETS.z[v],2.4,'#fffaf0',600)+`<g transform="rotate(-90 ${v} ${m})"><rect x="${v-6}" y="${m-1.6}" width="12" height="3.2" rx="1" fill="#6b7488"/>${t(v,m+.9,STREETS.x[v],2.4,'#fffaf0',600)}</g>`})});
  const lot=(cx,cy,inner='#b9e6ac')=>`<rect x="${cx-12}" y="${cy-12}" width="24" height="24" rx="1.5" fill="#ece4d5"/><rect x="${cx-9.7}" y="${cy-9.7}" width="19.4" height="19.4" rx="1" fill="${inner}"/>`;
  const bld=(cx,cy,b,label,key)=>place(key,`${lot(cx,cy)}${tree(cx-8.6,cy+.6,1.3)}${tree(cx+8.6,cy+.6,1.3)}${tree(cx-8.6,cy-6.6,1.3)}${tree(cx+8.6,cy-6.6,1.3)}
    <rect class="foot" x="${cx-7}" y="${cy-8}" width="14" height="10" rx="1" fill="${b.body}" stroke="${b.roof}" stroke-width=".8"/>
    <rect x="${cx-4}" y="${cy-6.7}" width="8" height="7.4" rx="3.7" fill="#fffaf0" stroke="#22263a" stroke-width=".3"/>${e(cx,cy-3,b.icon,5.2)}
    <rect x="${cx-11}" y="${cy+3.6}" width="22" height="5.4" rx="2.7" fill="#fffaf0" stroke="#22263a" stroke-width=".3"/>${t(cx,cy+7.3,label,label.length>14?2.5:3)}
    ${b.id&&S.badges.includes(b.id)?e(cx+6.4,cy-8,'⭐',3.6):''}`);
  GRID.forEach((row,r)=>row.forEach((id,c)=>{const cx=BC[c],cy=BC[r];
    if(id==='townhall')o+=bld(cx,cy,{icon:'🏛️',body:'#f4f1ea',roof:'#3a7bd5'},'町役場 🗽','townhall');
    else if(id==='home')o+=bld(cx,cy,BUILD.find(x=>x.kind==='home'),'わが家','home');
    else if(id==='park'){o+=lot(cx,cy,'#a6e39a')+place('pond',`<circle cx="${cx-3.5}" cy="${cy-3}" r="4.7" fill="#7fcdf0" stroke="#c9d6e3" stroke-width=".8"/>${e(cx-3.5,cy-3,'🦆',3.6)}`)
      +place('ranger',`<rect class="foot" x="${cx+1.7}" y="${cy-8.2}" width="7" height="5.5" rx="1" fill="#7a5a3a" stroke="#3e5a2b" stroke-width=".8"/>${e(cx+5.2,cy-5.4,'🌲',3.6)}`)
      +tree(cx-9,cy+7)+tree(cx+9,cy+8.5)+tree(cx+1,cy-9.2)+`<rect x="${cx-11}" y="${cy+3.6}" width="22" height="5.4" rx="2.7" fill="#fffaf0" stroke="#22263a" stroke-width=".3"/>${t(cx,cy+7.4,'公園・レンジャー',3)}`}
    else if(id==='garden')o+=place('garden',lot(cx,cy,'#a6e39a')+[0,1,2,3,4,5].map(i=>`<rect x="${cx-8.1+(i%3)*6}" y="${cy-6.1+Math.floor(i/3)*6.5}" width="4.2" height="3.2" rx=".5" fill="#8a5a34"/><circle cx="${cx-6+(i%3)*6}" cy="${cy-4.5+Math.floor(i/3)*6.5}" r="1" fill="${['#e8553e','#f28c28','#ffd65a','#5cbf6a','#f2a12e','#ef4f6b'][i]}"/>`).join('')+`<rect x="${cx-11}" y="${cy+3.6}" width="22" height="5.4" rx="2.7" fill="#fffaf0" stroke="#22263a" stroke-width=".3"/>${t(cx,cy+7.4,'はたけ',3)}`);
    else if(id==='playground')o+=place('playground',lot(cx,cy,'#ead7a1')+e(cx,cy-3,'🛝',8)+`<rect x="${cx-11}" y="${cy+3.6}" width="22" height="5.4" rx="2.7" fill="#fffaf0" stroke="#22263a" stroke-width=".3"/>${t(cx,cy+7.4,'あそび場',3)}`);
    else if(id==='sports')o+=place('sports',lot(cx,cy,'#7cc476')+`<rect x="${cx-9.5}" y="${cy-8.5}" width="19" height="17" fill="none" stroke="#fffaf0" stroke-width=".5"/><line x1="${cx}" y1="${cy-8.5}" x2="${cx}" y2="${cy+8.5}" stroke="#fffaf0" stroke-width=".5"/><circle cx="${cx}" cy="${cy}" r="2.4" fill="none" stroke="#fffaf0" stroke-width=".5"/>${e(cx-4,cy-3,'⚽',4)}<rect x="${cx-11}" y="${cy+3.6}" width="22" height="5.4" rx="2.7" fill="#fffaf0" stroke="#22263a" stroke-width=".3"/>${t(cx,cy+7.4,'グラウンド',3)}`);
    else if(id==='construction')o+=place('construction',lot(cx,cy,'#c9a06a')+`<rect x="${cx-9}" y="${cy-9}" width="18" height="18" fill="none" stroke="#e8c46e" stroke-width=".7"/><rect x="${cx-6}" y="${cy-6}" width="12" height="8" fill="none" stroke="#f28c28" stroke-width=".7" stroke-dasharray="1.2 .8"/>${e(cx,cy-2.5,'🚧',5.5)}<rect x="${cx-11}" y="${cy+3.6}" width="22" height="5.4" rx="2.7" fill="#fffaf0" stroke="#22263a" stroke-width=".3"/>${t(cx,cy+7.4,'工事げんば',3)}`);
    else if(id==='sale'){o+=lot(cx,cy)+place('sale',`<rect class="foot" x="${cx-10.5}" y="${cy-7}" width="11" height="9" rx="1" fill="#c9c3b5" stroke="#8d8578" stroke-width=".8"/>${e(cx-5,cy-2.5,'🏷️',4)}${t(cx-5,cy+6,'うり家',2.6)}`)
      +place('lot',`<rect x="${cx+2.2}" y="${cy-8.5}" width="8.2" height="17" fill="#c9a06a"/>${e(cx+6.3,cy-1,'🌱',4)}${t(cx+6.3,cy+6,'あき地',2.6)}`)}
    else{const b=BUILD.find(x=>x.id===id);o+=bld(cx,cy,b,b.name,id)}}));
  {const b=BUILD.find(x=>x.id==='delivery');o+=bld(-104,0,b,b.name,'delivery')}
  if(tg)o+=`<g>${e(tg[0],tg[1]-3,'⭐',7)}</g>`;
  {const zh=W3D.zeroHint&&W3D.zeroHint();if(zh)o+=`<g class="you">${e(zh[0],zh[1],'🤖',7)}</g>`}
  o+=`<g class="you"><circle cx="${me.x}" cy="${me.z}" r="2.4" fill="#ef4f6b" stroke="#fff" stroke-width=".8"/><rect x="${me.x-5}" y="${me.z-8.6}" width="10" height="4.6" rx="2.3" fill="#ef4f6b" stroke="#fff" stroke-width=".5"/>${t(me.x,me.z-5.2,'きみ',2.8,'#fff')}</g>`;
  o+=`<g transform="translate(140,-98)"><circle r="6" fill="#fffaf0" stroke="#22263a" stroke-width=".4"/><path d="M0 -4.5L2 1H-2Z" fill="#e8553e"/>${t(0,4.4,'N',2.6)}</g>`;
  return `<svg class="townmap" viewBox="-130 -108 280 216" role="img" aria-label="おしごとタウンの 地図">${o}</svg>`;
}
$('#mapBtn').onclick=()=>{
  openScene();$('#steps').innerHTML='';$('#jobTag').textContent='町の 地図';$('.card').style.setProperty('--jobc','#1f4fa3');
  if(W3D.on){body.innerHTML=`<h2>おしごとタウンの 地図</h2><p class="lead">行きたい ばしょを タップすると、町の バスで 行けます。ピンクの まるが きみです。</p><div class="mapwrap">${townMapSVG()}</div>`;
    body.querySelectorAll('.mp').forEach(t=>{t.onclick=()=>goTo(t.dataset.go);t.onkeydown=ev=>{if(ev.key==='Enter')goTo(t.dataset.go)}});return}
  body.innerHTML=`<h2>どこへ 行く？</h2><p class="lead">ばしょを タップすると、町の バスで 行けます。</p>
    <div class="menu small">${JOBS.map(j=>`<button class="tile" data-go="${j.id}"><span class="e">${j.icon}</span><b>${j.place}</b><small>${j.name}${S.badges.includes(j.id)?' · <span class="done">★</span>':''}</small></button>`).join('')}</div>`;
  body.querySelectorAll('[data-go]').forEach(t=>t.onclick=()=>goTo(t.dataset.go));
};
addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#scene').hidden)closeScene()});
function boot(){if(!start3D())start2D();syncFuri();if(!S.look)openBuilder();else setTimeout(()=>toast(`おかえり${S.name?'、'+S.name+'さん':''}！ どれかの ドアまで 歩くと しごとが たいけんできます。${W3D.on?' ロボットの ゼロが 町の どこかに かくれて いるよ！':''}`),400)}
// load one consistent icon set (Noto) for every emoji the game draws, before the 3D textures are painted
const EMOJI=(()=>{try{return [...new Set([...document.scripts].map(x=>x.textContent).join('').match(/\p{Extended_Pictographic}/gu)||[])].join('')}catch(e){return ''}})();
Promise.race([Promise.all([document.fonts?document.fonts.ready:0,document.fonts&&EMOJI?document.fonts.load('48px "Noto Color Emoji"',EMOJI):0,document.fonts?document.fonts.load('700 48px "Zen Maru Gothic"','あア亜町先生'):0]).catch(()=>{}),new Promise(r=>setTimeout(r,3500))]).then(boot);
</script>
