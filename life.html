<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Work Hard Get Lucky</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a proper game screen. 3D world fills the view; a top status bar, a bottom action bar with a big SPIN button, a right-hand card panel, a minimap, and full-screen title / pause / ending menus. */
:root{
  --bg:#9fd4f5;
  --ink:#1e2a2c;         /* outline colour for every panel and button */
  --panel:#fffaf0;
  --panel-2:#f3ecdc;
  --muted:#6b7f7c;
  --line:#d7d2c6;
  --gold:#f2b53a; --gold-2:#d99a1a;
  --accent:#17a39a; --accent-2:#11847d;
  --good:#3aa66c; --warn:#e3892c; --bad:#d9463e;
  --events:#f08a3c; --education:#9b5fd0; --stocks:#3d7be6; --assets:#4fae5c; --economy:#f08a3c; --payday:#e2c96b; --chance:#2fa1b5; --wild:#ff5fa8;
  --display:"Fredoka",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%;overscroll-behavior:none}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;overflow:hidden;-webkit-user-select:none;user-select:none;
  padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
button{font:inherit;cursor:pointer;color:inherit}
.num{font-variant-numeric:tabular-nums}
#scene{position:fixed;inset:0;display:block;touch-action:none}
.gutter{padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
[hidden]{display:none!important}

/* ---- chunky game buttons ---- */
.gbtn{touch-action:manipulation;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.02em;
  color:var(--ink);background:linear-gradient(180deg,#fff,#efe7d3);border:3px solid var(--ink);border-radius:14px;padding:9px 16px;
  box-shadow:0 5px 0 var(--ink),0 8px 14px rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s;white-space:nowrap}
.gbtn:hover{filter:brightness(1.04)}
.gbtn:active,.gbtn.down{transform:translateY(4px);box-shadow:0 1px 0 var(--ink),0 2px 6px rgba(0,0,0,.25)}
.gbtn:disabled{opacity:.55;cursor:default;transform:none;box-shadow:0 5px 0 var(--ink)}
.gbtn.gold{background:linear-gradient(180deg,#ffd978,var(--gold));}
.gbtn.teal{background:linear-gradient(180deg,#6fe0d6,var(--accent));color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.spinbtn.teal{background:radial-gradient(circle at 50% 30%,#9ff0e8,var(--accent) 65%,var(--accent-2))}
.gbtn.red{background:linear-gradient(180deg,#ff9a93,var(--bad));color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.gbtn.ghost{background:rgba(255,250,240,.85)}
.gbtn.small{font-size:13px;padding:6px 11px;border-width:2.5px;border-radius:11px;box-shadow:0 3px 0 var(--ink),0 5px 10px rgba(0,0,0,.2)}
.gbtn.small:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.gbtn.icon{width:40px;height:40px;padding:0;font-size:18px}
.gbtn.big{font-size:22px;padding:14px 30px;border-radius:20px}
.gbtn:focus-visible,.choice:focus-visible,.pick:focus-visible{outline:4px solid #fff;outline-offset:2px}
.spinbtn{width:132px;height:132px;border-radius:50%;padding:0;font-size:26px;line-height:1;flex-direction:column;gap:2px;background:radial-gradient(circle at 50% 30%,#ffe9a8,var(--gold) 65%,var(--gold-2));box-shadow:0 7px 0 var(--ink),0 12px 24px rgba(0,0,0,.35);animation:pulse 1.8s ease-in-out infinite}
.spinbtn small{font-size:12px;font-weight:700;letter-spacing:.14em}
.spinbtn:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ink)}
.spinbtn:disabled{animation:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
@media (prefers-reduced-motion:reduce){.spinbtn{animation:none}}

/* ---- panels ---- */
.panel{background:var(--panel);color:var(--ink);border:3px solid var(--ink);border-radius:18px;box-shadow:0 8px 0 rgba(30,42,44,.35),0 14px 30px rgba(0,0,0,.3)}
.panel .ribbon{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--cat,var(--accent));color:#fff;padding:8px 14px;border-radius:14px 14px 0 0;font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;text-shadow:0 1px 0 rgba(0,0,0,.3);border-bottom:3px solid var(--ink)}
.panel .body{padding:14px 16px;display:grid;gap:10px}
.eyebrow{font-family:var(--display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.note{font-size:12px;color:var(--muted)}

/* ---- top bar ---- */
#topbar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:5;display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:10px;padding-block:10px;pointer-events:none;transition:opacity .3s}
#topbar>*{pointer-events:auto}
.who{display:flex;align-items:center;gap:10px;background:var(--panel);border:3px solid var(--ink);border-radius:999px;padding:4px 14px 4px 4px;box-shadow:0 4px 0 rgba(30,42,44,.35)}
.avatar{width:40px;height:40px;border-radius:50%;border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:18px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.who b{font-family:var(--display);font-size:15px;display:block;line-height:1.05}
.who small{color:var(--muted);font-size:11px;display:block}
.clock{justify-self:center;display:grid;gap:4px;justify-items:center;min-width:0}
.clock .chip{background:var(--ink);color:#fff;font-family:var(--display);font-weight:700;border-radius:999px;padding:4px 14px;font-size:14px;box-shadow:0 3px 0 rgba(0,0,0,.3);border:0;cursor:default}
.clock .chip em{font-style:normal;margin-left:6px}
.clock .chip span{color:var(--gold)}
.track{display:flex;align-items:center;gap:6px;font-size:12px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);font-family:var(--display);font-weight:600;white-space:nowrap}
.track .bar{width:min(320px,20vw);height:12px;background:rgba(0,0,0,.35);border:2px solid var(--ink);border-radius:999px;overflow:hidden;position:relative}
.track .bar i{position:absolute;inset:0;width:var(--p);background:linear-gradient(90deg,var(--assets),var(--gold));border-radius:999px;transition:width .5s}
.track .bar b{position:absolute;top:-6px;left:calc(var(--p) - 8px);width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--ink);box-shadow:0 2px 4px rgba(0,0,0,.4);transition:left .5s}
.wallet{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.mchip{display:flex;align-items:center;gap:6px;background:var(--panel);border:3px solid var(--ink);border-radius:999px;padding:4px 12px 4px 6px;box-shadow:0 4px 0 rgba(30,42,44,.35);font-family:var(--display);font-weight:700;font-size:14px}
.mchip i{font-style:normal;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--gold);border:2px solid var(--ink)}
.mchip.sav i{background:var(--stocks);color:#fff}.mchip.debt i{background:var(--bad);color:#fff}.mchip.debt{color:var(--bad)}.mchip.net i{background:var(--assets);color:#fff}
.mchip small{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.08em;text-transform:uppercase}

/* ---- stats strip ---- */
#stats{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:0;z-index:4;display:none;gap:6px;pointer-events:none;width:min(360px,100%)} #stats.open{display:grid}
#stats>*{pointer-events:auto}
.meters{background:var(--panel);border:3px solid var(--ink);border-radius:16px;padding:10px 12px;display:grid;gap:7px;box-shadow:0 5px 0 rgba(30,42,44,.35)}
.meter{display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:8px;font-size:12px;font-family:var(--display);font-weight:600}
.meter em{font-style:normal;font-size:16px;text-align:center}
.meter .bar{height:10px;background:var(--panel-2);border:2px solid var(--ink);border-radius:999px;overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--c);transition:width .6s;border-radius:999px}
.meter b{font-size:12px;min-width:32px;text-align:right}
.lifeline{font-size:12px;color:var(--ink);display:flex;flex-wrap:wrap;gap:4px 10px;border-top:2px dashed var(--line);padding-top:6px}
.lifeline b{font-family:var(--display);font-weight:600}
.econ{font-size:11px;color:var(--muted);display:flex;flex-wrap:wrap;gap:2px 10px}.econ b{color:var(--ink)}
.meters .gbtn.small{padding:2px 8px;font-size:12px}
.status{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;border:2px solid var(--ink);background:#fff}
.status.good{background:#d8f3e3;color:#1f6b45} .status.warn{background:#ffe8cc;color:#8a4a0e} .status.bad{background:#ffd9d6;color:#8a1f19}

/* ---- bottom bar ---- */
#bottombar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:10px;padding-block:0 max(14px,env(safe-area-inset-bottom,0px));pointer-events:none}
#bottombar>*{pointer-events:auto}
.bl{display:flex;gap:8px;align-items:end}
.br{display:grid;gap:8px;justify-items:end}
.camctl{display:inline-flex;gap:4px;background:var(--panel);border:3px solid var(--ink);border-radius:14px;padding:4px;box-shadow:0 4px 0 rgba(30,42,44,.35)}
.camctl .gbtn{box-shadow:none;border-width:2px;width:36px;height:36px;padding:0;font-size:16px;border-radius:9px}
.camctl .gbtn:active{transform:translateY(1px)}
#minimap{display:block;width:180px;height:120px;background:rgba(20,40,44,.78);border:3px solid var(--ink);border-radius:14px;box-shadow:0 4px 0 rgba(30,42,44,.35)}
.center{display:grid;justify-items:center;gap:8px}
.opts{display:flex;gap:6px;flex-wrap:nowrap;justify-content:center}
.opts .gbtn{font-size:13px;padding:6px 10px}
.hint{font-family:var(--display);font-weight:700;font-size:13px;color:#fff;background:rgba(30,42,44,.72);padding:4px 12px;border-radius:999px;text-align:center}

/* ---- right-hand card panel ---- */
#stage{position:fixed;inset:0;z-index:6;display:none;place-items:center;padding-block:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-bottom,0px));background:rgba(14,30,34,.42);backdrop-filter:blur(2px)}
#stage.on{display:grid}
#stage>*{pointer-events:auto}
.card{animation:deal .4s cubic-bezier(.2,.9,.3,1.2);width:min(560px,100%);max-height:calc(100vh - 40px);overflow:auto}
.card.wide{width:min(900px,100%)}
@keyframes deal{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
.card h2{font-size:24px}
.ledgerbox{border-top:2px dashed var(--line);padding-top:6px}
.ledgerbox .ledger{border-top:0;padding-top:6px}
.warnings{display:grid;gap:3px;font-size:12px;font-weight:700;color:#8a4a0e;background:#ffe8cc;border:2px solid var(--ink);border-radius:10px;padding:6px 8px}
.gloss{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:6px}
.gloss details{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:6px 10px}
.gloss summary{font-family:var(--display);font-weight:700;cursor:pointer;font-size:14px}
.gloss p{margin:4px 0 0;font-size:13px;color:var(--muted)}
.tipnote{color:var(--ink);margin:2px 0 4px;font-weight:700}
.tbl td.pos{color:#1f6b45}.tbl td.neg{color:#8a1f19}
.card p{margin:0}
.card.wild{--cat:var(--wild)}
.card.wild .body{background:linear-gradient(180deg,#fff3fa,var(--panel) 40%)}
.choices{display:grid;gap:8px}
.choice{touch-action:manipulation;text-align:left;border:3px solid var(--ink);background:#fff;border-radius:14px;padding:9px 12px;color:var(--ink);display:grid;grid-template-columns:1fr auto;gap:0 10px;align-items:center;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.choice:hover{background:#fffdf7;transform:translateX(2px)}
.choice:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.choice:disabled{opacity:.5;cursor:default;box-shadow:0 4px 0 var(--ink);transform:none}
.choice b{font-family:var(--display);font-size:15px;font-weight:600;grid-column:1;grid-row:1}
.choice small{color:var(--muted);grid-column:1;grid-row:2;font-size:12px}
.choice .odds{grid-column:2;grid-row:1/3;font-family:var(--display);font-weight:700;color:#8a5a00;background:linear-gradient(180deg,#ffe9a8,var(--gold));border:2px solid var(--ink);border-radius:12px;padding:3px 8px;font-size:16px;white-space:nowrap;text-align:center}
.choice .odds small{display:block;font-size:9px;color:#5a3d05;letter-spacing:.1em}
.idea{display:inline-block;margin-left:4px;padding:0 7px;border-radius:999px;background:var(--cat);color:#fff;font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;vertical-align:middle;border:1.5px solid var(--ink)}
.roll{font-family:var(--display);font-weight:700;font-size:15px;padding:6px 10px;border-radius:10px;border:2px solid var(--ink)}
.roll.hit{background:#d8f3e3;color:#1f6b45}.roll.miss{background:#ffd9d6;color:#8a1f19}
.deltas{display:flex;flex-wrap:wrap;gap:5px}
.delta{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--panel-2);border:2px solid var(--ink)}
.delta.up{background:#d8f3e3;color:#1f6b45}.delta.down{background:#ffd9d6;color:#8a1f19}
.why{border:2px solid var(--ink);border-left:8px solid var(--gold);padding:7px 10px;background:#fff6dc;border-radius:10px;font-size:14px}
.why .eyebrow{color:#8a5a00}
.whyfold summary{list-style:none;display:flex;align-items:center;gap:6px}
.whyfold summary::before{content:'▸';font-size:12px}
.whyfold[open] summary::before{content:'▾'}
.ledger{font-size:12px;display:grid;grid-template-columns:1fr auto;gap:1px 14px;border-top:2px dashed var(--line);padding-top:8px;color:var(--muted)}
.ledger .num{color:var(--ink)}.ledger .total{font-weight:700;color:var(--ink);border-top:2px solid var(--line);padding-top:3px}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 160px);left:50%;transform:translateX(-50%);z-index:7;max-width:min(440px,calc(100% - 32px));background:var(--panel);color:var(--ink);border:3px solid var(--ink);border-left:10px solid var(--cat);border-radius:14px;padding:10px 14px;box-shadow:0 6px 0 rgba(30,42,44,.35),0 10px 30px rgba(0,0,0,.35);font-size:14px;display:grid;gap:2px;animation:deal .3s}
.toast b{font-family:var(--display);font-size:16px}

/* ---- charts ---- */
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.chartwrap{position:relative;width:100%;min-width:0}
.chartwrap canvas{display:block;width:100%;touch-action:pan-y}
.chartwrap.mini{height:34px}
.ctip{position:absolute;top:6px;left:0;pointer-events:none;background:var(--panel);border:2px solid var(--ink);border-radius:10px;padding:5px 8px;font-size:11px;line-height:1.35;box-shadow:0 4px 0 rgba(30,42,44,.3);min-width:140px;z-index:2}
.ctip b{font-family:var(--display);font-size:12px}
.ctip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.tbl{border-collapse:collapse;font-size:11px;width:100%;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{text-align:right;padding:3px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.endcharts{display:grid;gap:14px}

/* ---- the SPIN button, dead centre ---- */
#spinCenter{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;display:grid;justify-items:center;gap:10px;pointer-events:none}
#spinCenter>*{pointer-events:auto}
.spinbtn.huge{width:176px;height:176px;font-size:40px;box-shadow:0 9px 0 var(--ink),0 18px 34px rgba(0,0,0,.4)}
.spinbtn.huge{font-size:34px;letter-spacing:.04em;line-height:1}
.spinbtn.huge small{font-size:16px;letter-spacing:.22em;margin-bottom:2px}
.getlucky{display:inline-block;color:var(--gold);font-size:1.25em;letter-spacing:.06em;animation:lucky .5s ease-in-out infinite alternate}
@keyframes lucky{from{transform:scale(1) rotate(-2deg)}to{transform:scale(1.08) rotate(2deg)}}
@media (prefers-reduced-motion:reduce){.getlucky{animation:none}}
.spinbtn.huge:active{transform:translateY(6px);box-shadow:0 3px 0 var(--ink)}
body.moving #spinCenter{opacity:0;pointer-events:none}

/* ---- the big spinner ---- */
#spinOverlay{position:fixed;inset:0;z-index:7;display:grid;place-items:center;background:rgba(14,30,34,.35);pointer-events:none;opacity:0;transition:opacity .25s}
#spinOverlay.show{opacity:1}
.spinbox{position:relative;display:grid;justify-items:center;gap:10px;transform:scale(.6);transition:transform .35s cubic-bezier(.2,.9,.3,1.3)}
#spinOverlay.show .spinbox{transform:scale(1)}
.spinbox canvas{width:min(320px,70vw);height:min(320px,70vw);display:block;filter:drop-shadow(0 14px 24px rgba(0,0,0,.45))}
.spinResult{font-family:var(--display);font-weight:700;font-size:clamp(22px,5vw,34px);color:#fff;text-shadow:0 3px 0 var(--ink),0 8px 18px rgba(0,0,0,.5);text-align:center;min-height:1.3em;opacity:0;transform:scale(.6);transition:opacity .2s,transform .3s cubic-bezier(.2,.9,.3,1.4)}
.spinResult.show{opacity:1;transform:scale(1)}
.spinResult b{display:inline-block;background:var(--gold);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:0 16px;margin:0 6px;text-shadow:none;box-shadow:0 4px 0 var(--ink)}
@media (prefers-reduced-motion:reduce){.spinbox,.spinResult,#spinOverlay{transition:none}}

/* ---- full-screen menus ---- */
.overlay{position:fixed;inset:0;z-index:8;overflow:auto;overflow-x:hidden;max-width:100vw;background:radial-gradient(ellipse at 50% 30%,rgba(255,255,255,.25),rgba(14,30,34,.55));backdrop-filter:blur(3px);padding-block:max(16px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px))}
.sheet{max-width:980px;margin:0 auto;display:grid;gap:16px;min-width:0}
.wizard .row.footer{position:sticky;bottom:0;padding:10px 0 4px;background:linear-gradient(180deg,transparent,rgba(14,30,34,.55) 40%);z-index:2}
.titlescreen{min-height:calc(100vh - 40px);display:grid;align-content:center;justify-items:center;gap:28px;text-align:center;max-width:100%;overflow:hidden}
.banner{width:min(100%,900px);margin:0;background:var(--ink);border:4px solid var(--ink);border-bottom:8px solid var(--gold);border-radius:24px;padding:28px 28px 22px;display:grid;justify-items:center;gap:12px;box-shadow:0 14px 0 rgba(30,42,44,.35),0 24px 50px rgba(0,0,0,.45);transform:rotate(-1.5deg)}
.banner h1{font-size:clamp(44px,9vw,120px);line-height:.95;color:#fff;letter-spacing:.03em;text-shadow:0 5px 0 rgba(0,0,0,.45)}
.banner h1 span{color:var(--gold)}
.banner .tagline{background:var(--gold);color:var(--ink);box-shadow:none;font-size:clamp(14px,2.4vw,22px)}
.banner.small{transform:none;padding:14px 18px 12px;border-radius:16px;border-width:3px;border-bottom-width:6px}
.banner.small h1{font-size:clamp(26px,5vw,44px)}
.titlescreen .menu{align-self:center}
.logo{display:grid;justify-items:center;gap:2px}
.logo h1{font-size:clamp(44px,11vw,112px);line-height:.9;color:#fff;letter-spacing:.01em;-webkit-text-stroke:3px var(--ink);text-shadow:0 6px 0 var(--ink),0 14px 30px rgba(0,0,0,.45);transform:rotate(-2deg)}
.logo h1 span{color:var(--gold);display:block}
.tagline{font-family:var(--display);font-weight:600;font-size:clamp(15px,2.4vw,22px);color:#fff;background:var(--ink);padding:6px 18px;border-radius:999px;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.menu{display:grid;gap:12px;justify-items:center}
.menu>.gbtn{min-width:260px}
.steps{display:flex;gap:8px;justify-content:center}.steps i{width:12px;height:12px;border-radius:50%;border:2px solid var(--ink);background:#fff}.steps i.on{background:var(--gold)}
.wizard{display:grid;gap:14px}
.wizard h2{color:#fff;font-size:clamp(24px,4vw,38px);text-shadow:0 3px 0 var(--ink),0 8px 18px rgba(0,0,0,.4);text-align:center}
.wizard .lede{text-align:center;max-width:62ch;margin:0 auto;color:#fff;font-weight:700;text-shadow:0 1px 4px rgba(0,0,0,.6)}

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.147.0/three.min.js"></script>
<script>
// phones must lay out at device width; add the viewport tag if the host page forgot it
(function(){ if(!document.querySelector('meta[name="viewport"]')){ const m=document.createElement('meta'); m.name='viewport'; m.content='width=device-width,initial-scale=1,viewport-fit=cover'; document.head.appendChild(m); setTimeout(()=>dispatchEvent(new Event('resize')),50); } })();
const RATES={JPY:{rate:1,sym:'¥',name:'Yen'},USD:{rate:1/150,sym:'$',name:'Dollars'},GBP:{rate:1/190,sym:'£',name:'Pounds'}};
let CUR='GBP'; try{ if(RATES[localStorage.getItem('whgl-cur')]) CUR=localStorage.getItem('whgl-cur'); }catch(e){}
function setCurrency(c){ CUR=c; try{ localStorage.setItem('whgl-cur',c); }catch(e){} }
const Y = n => { const r=RATES[CUR]; const v=Math.round(n*r.rate); return (v<0?'−':'') + r.sym + Math.abs(v).toLocaleString('en-US'); };
const loc = s => String(s).replace(/¥([\d,]+)/g,(m,d)=>Y(parseInt(d.replace(/,/g,''),10)));
const clamp = (v,a=0,b=100) => Math.max(a,Math.min(b,v));
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const MODES = [
  {id:'quick', name:'Quick Life', icon:'⚡', desc:'10 years · about 40 turns', more:'One season per turn from age 22 to 32. A short, punchy life to learn the ropes.', years:10},
  {id:'full',  name:'Full Life',  icon:'🌳', desc:'40 years · about 160 turns', more:'From 22 to 62: careers, homes, kids, crashes and comebacks. A proper saga.', years:40},
  {id:'epic',  name:'Epic Life',  icon:'🏔️', desc:'60 years · about 240 turns', more:'From 22 to 82. The longest board, the most surprises. Bring snacks.', years:60},
  {id:'shock', name:'Economic Shock', icon:'🌪️', desc:'15 years · starts in a recession', more:'Begin with high prices, high interest and lots of people out of work. Can you ride it out?', years:15, shock:true},
];
const SEASONS=['Spring','Summer','Autumn','Winter'];

const PROFILES = [
  {id:'A', name:'Supported Starter', icon:'🏡', tag:'Safety cushion', short:'Family can help with money and school.', desc:'Your family can help with money and school, but you have not had a job yet.',
   cash:300000, savings:1200000, debt:0, income:180000, expenses:150000, skills:55, wellbeing:80, connections:45, familySupport:true},
  {id:'B', name:'Hands-on Hustler', icon:'🔧', tag:'Steady earner', short:'Little saved, great with your hands.', desc:'Not much saved up, but you are great with your hands and have a steady part-time job.',
   cash:80000, savings:100000, debt:0, income:210000, expenses:160000, skills:62, wellbeing:75, connections:35},
  {id:'C', name:'Family Rock', icon:'🤝', tag:'Team around you', short:'Caring for family, lots of friends.', desc:'You help look after family, earn an okay wage, and lots of people have your back.',
   cash:120000, savings:250000, debt:100000, income:240000, expenses:225000, skills:50, wellbeing:70, connections:75, community:true},
  {id:'D', name:'High Flyer', icon:'🚀', tag:'High wire act', short:'Big pay, big debt, no cushion.', desc:'Big paycheck, but a big loan to pay off and almost nothing saved for surprises.',
   cash:200000, savings:50000, debt:2500000, income:420000, expenses:310000, skills:70, wellbeing:62, connections:55},
];


// ---- education & careers ----
const EDU=[
 {id:'none',icon:'💼',name:'Start working now',level:0,years:0,cost:0,skills:0,blurb:'Earn money from day one. You can always study later.'},
 {id:'trade',icon:'🔧',name:'Trade school',level:1,years:1,cost:300000,skills:14,blurb:'One year learning a hands-on trade: electrics, cooking, plumbing.'},
 {id:'bootcamp',icon:'💻',name:'Coding bootcamp',level:2,years:1,cost:450000,skills:18,blurb:'One intense year of computers and code.'},
 {id:'college',icon:'📘',name:'College diploma',level:2,years:2,cost:800000,skills:24,blurb:'Two years. Opens a lot of office and creative jobs.'},
 {id:'uni',icon:'🎓',name:'University degree',level:3,years:3,cost:1500000,skills:36,blurb:'Three years. The most doors, the biggest bill, the longest wait.'},
 {id:'night',icon:'🌙',name:'Night school',level:1,years:1,cost:150000,skills:9,blurb:'Cheap evening classes. Keeps your job going. Slow but steady.'},
 {id:'masters',icon:'🏅',name:"Master's degree",level:4,years:2,cost:1200000,skills:22,requires:3,blurb:'Two more years after university. Unlocks the expert jobs.'},
];
const JOBS=[
 {id:'cafe',name:'Café worker',pay:180000,skills:0,edu:0,mood:0,note:'Friendly, tiring, not much pay.'},
 {id:'delivery',name:'Delivery rider',pay:210000,skills:15,edu:0,mood:-1,note:'Rain or shine. Flexible hours.'},
 {id:'shop',name:'Shop assistant',pay:200000,skills:10,edu:0,mood:0,note:'Steady and sociable.'},
 {id:'clerk',name:'Office clerk',pay:240000,skills:30,edu:1,mood:0,note:'Spreadsheets and coffee.'},
 {id:'chef',name:'Chef',pay:270000,skills:40,edu:1,mood:-2,note:'Hot kitchen, proud food.'},
 {id:'electrician',name:'Electrician',pay:320000,skills:45,edu:1,mood:0,note:'Always needed. Good pay for a trade.'},
 {id:'designer',name:'Designer',pay:290000,skills:50,edu:2,mood:2,note:'Make things look great.'},
 {id:'nurse',name:'Nurse',pay:330000,skills:55,edu:2,mood:-2,note:'Long shifts, real difference.'},
 {id:'teacher',name:'Teacher',pay:310000,skills:55,edu:3,mood:2,note:'Holidays! Also marking.'},
 {id:'manager',name:'Store manager',pay:350000,skills:60,edu:2,conn:40,mood:-1,note:'Needs people skills and contacts.'},
 {id:'engineer',name:'Software engineer',pay:450000,skills:70,edu:2,mood:0,note:'Build apps. Learn forever.'},
 {id:'scientist',name:'Scientist',pay:420000,skills:80,edu:3,mood:1,note:'Discover things nobody knew.'},
 {id:'doctor',name:'Doctor',pay:650000,skills:88,edu:3,mood:-3,note:'Top pay, heavy responsibility.'},
 {id:'pilot',name:'Airline pilot',pay:600000,skills:85,edu:2,mood:0,note:'See the world from the front seat.'},
 {id:'barista',name:'Barista',pay:190000,skills:5,edu:0,mood:1,note:'Latte art and early mornings.'},
 {id:'farmhand',name:'Farm worker',pay:195000,skills:10,edu:0,mood:1,note:'Fresh air, sore back.'},
 {id:'mechanic',name:'Mechanic',pay:280000,skills:40,edu:1,mood:0,note:'Fix cars, bikes, anything with wheels.'},
 {id:'plumber',name:'Plumber',pay:310000,skills:42,edu:1,mood:-1,note:'Nobody calls you when things are fine.'},
 {id:'firefighter',name:'Firefighter',pay:300000,skills:45,edu:1,mood:1,note:'Brave, fit, loved by the town.'},
 {id:'journalist',name:'Journalist',pay:270000,skills:50,edu:2,mood:1,note:'Ask questions for a living.'},
 {id:'analyst',name:'Data analyst',pay:380000,skills:62,edu:2,mood:0,note:'Find the story in the numbers.'},
 {id:'gamedev',name:'Game developer',pay:400000,skills:68,edu:2,mood:2,note:'Make the games you wish existed.'},
 {id:'vet',name:'Vet',pay:430000,skills:75,edu:3,mood:1,note:'Dogs, cats, and the odd llama.'},
 {id:'architect',name:'Architect',pay:470000,skills:78,edu:4,mood:1,note:'Design the skyline.'},
 {id:'lawyer',name:'Lawyer',pay:550000,skills:82,edu:4,mood:-2,note:'Read everything. Twice.'},
 {id:'captain',name:'Ship captain',pay:460000,skills:72,edu:2,conn:50,mood:1,note:'Needs a trusted name at the harbour.'},
];
const jobById=id=>JOBS.find(j=>j.id===id)||JOBS[0];
function jobOdds(s,j){ let p=0.35+(s.skills-j.skills)/120+s.connections/400-(s.econ.unemployment-4)*0.03; if(s.age>50) p-=(s.age-50)*0.012; if(s.wellbeing<35) p-=0.1; if(s.employed&&s.job===j.id) p=0; return clamp(p,0.05,0.9); }
function canApply(s,j){ return s.skills>=j.skills-10 && s.eduLevel>=j.edu && (!j.conn||s.connections>=j.conn-15); }
// how stretched is this household? debt measured in months of pay
const debtMonths = s => s.debt/Math.max(80000,(s.employed?s.income:120000));
const debtPenalty = s => debtMonths(s)>36?3:debtMonths(s)>18?1.5:debtMonths(s)>9?0.5:0;   // extra interest points charged to risky borrowers
function creditOK(s,amount){ return debtMonths(s)+amount/Math.max(80000,(s.employed?s.income:120000))<=36 && !(s.stats.freshStarts>0&&s.turn-(s.stats.freshStartTurn||0)<12); }
// borrow if the bank agrees; otherwise the bill still has to be paid somehow. Returns a sentence describing what happened.
function borrow(s,amount,what){ if(creditOK(s,amount)){ s.debt+=amount; s.stats.borrowed++; return `The bank lent you ${Y(amount)}${what?' for '+what:''} at ${(s.econ.rate+3+debtPenalty(s)).toFixed(1)}%.`; } const src=pay(s,amount); return `The bank looked at your debt and said no. You paid ${Y(amount)} from ${src}.`; }
const healthRisk = s => (s.wellbeing<35?2:s.wellbeing<50?1.4:1) * (s.age>=60?1.6:s.age>=50?1.3:s.age>=40?1.1:1);   // how often and how hard health hits
function medBill(s,base){ return Math.round(base*healthRisk(s)/5000)*5000; }
function tuition(s,ed){ return Math.round(ed.cost*(s.familySupport?0.5:1)*(s.cheapCourses?0.5:1)); }

// ---- economy & derived measures ----
function newState(profile, mode, seed){
  const s = {
    profile:profile.id, mode:mode.id, seed, year:0, age:22, years:mode.years,
    cash:profile.cash, savings:profile.savings, debt:profile.debt,
    income:profile.income, expenses:profile.expenses,
    skills:profile.skills, wellbeing:profile.wellbeing, connections:profile.connections,
    employed:true, job:{A:'cafe',B:'delivery',C:'clerk',D:'engineer'}[profile.id], eduLevel:{A:0,B:1,C:1,D:2}[profile.id], eduName:{A:'High school',B:'Trade school',C:'Trade school',D:'College diploma'}[profile.id], studying:null, applied:false, turn:0, home:null, partner:false, kids:0, pets:0, jobsHeld:1, stocks:0, stocksCost:0, insured:false, monthlyInvest:0, safetyNet:false, cheapCourses:false,
    familySupport:!!profile.familySupport, community:!!profile.community, flags:{},
    econ:{inflation:2, rate:1, unemployment:4, tax:15, housing:2},
    log:[], stats:{setbacks:0, savedByCushion:0, borrowed:0, educationSpent:0, investNet:0, rolls:0, hits:0},
    used:[], phase:'event', current:null, outcome:null,
  };
  if(mode.shock){ s.econ = {inflation:7, rate:4, unemployment:8, tax:15, housing:-3}; }
  return s;
}
const security = s => clamp(Math.min(50,(s.cash+s.savings)/Math.max(1,s.expenses)*8) + (s.employed?25:0) + (s.debt<=0?25:Math.max(0,25-s.debt/(s.income*12||1)*25)) + (s.home?5:0));
const netWorth = s => s.cash+s.savings+s.stocks-s.debt+(s.home?s.home.value-s.home.loan:0);
const opportunity = s => clamp(s.skills*0.55 + s.connections*0.35 + (10-s.econ.unemployment)*2);
const statusOf = s => { const v=security(s); return v>=65?['Doing fine','good']:v>=35?['Getting by','warn']:['Tough times','bad']; };

// pay(): the same bill lands differently depending on the cushion behind it.
function pay(s, amt){
  let left = amt, src=[];
  const c = Math.min(s.cash,left); if(c>0){s.cash-=c; left-=c; src.push('cash');}
  const v = Math.min(s.savings,left); if(v>0){s.savings-=v; left-=v; src.push('savings'); s.stats.savedByCushion++;}
  if(left>0){ s.debt+=left; s.stats.borrowed++; src.push('new debt'); }
  return src.join(' → ');
}
function adj(s,k,v){ s[k]=clamp(s[k]+v); }

// One season (3 months) passes: simplified household budget + economy drift.
function passSeason(s, rng){
  const e=s.econ, M=3, gross=s.employed?s.income*M:0, tax=gross*e.tax/100;
  const net=gross-tax, spend=s.expenses*M, invest=s.employed?s.monthlyInvest*M:0;
  const intSave=Math.round(s.savings*e.rate/100/4), intDebt=Math.round(s.debt*(e.rate+3+debtPenalty(s))/100/4);
  let mort=0; if(s.home){ const princ=Math.min(s.home.loan,Math.round(s.home.loan0/120)); mort=Math.round(s.home.loan*(e.rate+1)/100/4)+princ; s.home.loan-=princ; s.home.value=Math.round(s.home.value*(1+e.housing/100/4+(rng()-0.5)*0.03)); }
  const flow=net-spend-invest+intSave-intDebt-mort;
  if(flow>=0){ s.cash+=flow; } else { pay(s,-flow); }
  if(invest>0){ s.stocks+=invest; s.stocksCost+=invest; }
  const mkt = (rng()-0.5)*0.12 + 0.015 - e.inflation*0.001;
  if(s.stocks>0) s.stocks=Math.round(s.stocks*(1+mkt));
  const keep=s.expenses*2; if(s.cash>keep){ s.savings+=s.cash-keep; s.cash=keep; }
  // prices rise with inflation; wages follow, a little behind, so high inflation squeezes real pay for a while
  s.expenses=Math.round(s.expenses*(1+e.inflation/100/4));
  if(s.employed) s.income=Math.round(s.income*(1+(e.inflation*0.9-0.3)/100/4));
  if(s.home) s.home.loan0=s.home.loan0; // unchanged: loans are fixed in money terms, which is why inflation helps borrowers
  // the economy drifts but pulls back toward normal: ~2% inflation, ~2% rates, ~4.5% out of work
  e.inflation=clamp(e.inflation+(2-e.inflation)*0.12+(rng()-0.5)*1.2 - (e.rate>3?0.25:0),-1,14);
  e.rate=clamp(e.rate+(e.inflation>3?0.3:-0.1)+(2-e.rate)*0.08+(rng()-0.5)*0.3,0,9);
  e.unemployment=clamp(e.unemployment+(4.5-e.unemployment)*0.1+(rng()-0.5)*0.8,2,14);
  e.housing=clamp(e.housing+(2-e.housing)*0.1+(rng()-0.5)*1.4-(e.rate>4?0.4:0),-8,12);
  for(const k in e) e[k]=Math.round(e[k]*10)/10;
  s.cash=Math.round(s.cash); s.savings=Math.round(s.savings); s.debt=Math.round(s.debt);
  // households adjust: when bills run past pay, people cut back (slowly) rather than sink forever
  const payNow=s.employed?s.income*(1-e.tax/100):0; const mortNow=s.home?Math.round(s.home.loan*(e.rate+1)/100/12+s.home.loan0/360):0;
  if(s.employed && s.expenses+mortNow>payNow*0.95){ s.expenses=Math.round(Math.max(s.expenses*0.9, payNow*0.95-mortNow)); }
  if(!s.employed && s.expenses>120000){ s.expenses=Math.round(s.expenses*0.96); }
  // debt spiral: when debt passes five years of pay with nothing left, the court wipes it and you start over small
  let freshStart=false; if(s.debt>Math.max(3000000,(s.employed?s.income:150000)*60) && s.cash+s.savings+s.stocks<s.expenses){ s.debt=0; s.cash=50000; s.stats.setbacks++; s.stats.freshStarts=(s.stats.freshStarts||0)+1; s.stats.freshStartTurn=s.turn; adj(s,'wellbeing',-15); adj(s,'connections',-5); s.stocks=0; s.stocksCost=0; if(s.home){ s.home=null; s.expenses=Math.round(s.expenses/0.65); } freshStart=true; }
  s.applied=false;
  s.turn++; if(s.turn%4===0){ s.year++; s.age++; }
  return {gross,tax,spend,invest,intSave,intDebt,mort,flow,mkt,freshStart};
}
const passYear=passSeason;
const seasonOf = s => SEASONS[s.turn%4];

function mortgageCheck(s,price){ const dep=Math.round(price*0.1), loan=price-dep; const pay=s.employed?s.income:0; const monthly=Math.round(loan*(s.econ.rate+1)/100/12+loan/360);
  if(s.cash+s.savings<dep) return {ok:false,why:`You need a ${Y(dep)} deposit saved first.`,monthly};
  if(!s.employed) return {ok:false,why:'Banks want to see a steady pay before lending for a home.',monthly};
  if(monthly>pay*0.4) return {ok:false,why:`The monthly payment (${Y(monthly)}) would be more than 40% of your pay. The bank said no.`,monthly};
  if(debtMonths(s)>12) return {ok:false,why:'You already owe more than a year of pay. Clear some debt first.',monthly};
  if(s.stats.freshStarts>0&&s.turn-(s.stats.freshStartTurn||0)<16) return {ok:false,why:'After a bankruptcy, banks wait a few years before lending for a home.',monthly};
  return {ok:true,monthly}; }
function buyHome(s,price){ const dep=Math.round(price*0.1); const src=pay(s,dep); s.home={value:price,loan:price-dep,loan0:price-dep}; s.expenses=Math.round(s.expenses*0.65); return src; }
function sellHome(s,mult=1){ if(!s.home) return 0; const got=Math.round(s.home.value*mult)-s.home.loan; s.savings+=got; s.home=null; s.expenses=Math.round(s.expenses/0.65); return got; }

    why:'Roads, rails and parks are PUBLIC GOODS: one investment makes lots of people better off at once.'},
   {label:'Look for a job along the line', hint:'Odds depend on skills.', odds:s=>0.35+s.skills/250, idea:'Access creates opportunity',
    run:(s,hit)=>{ s.expenses-=6000; if(hit&&s.employed){ s.income=Math.round(s.income*1.1); return 'You found a better job within reach of the new line!'; } return 'No better job yet, but the commute is cheaper.'; },
    why:'Jobs that were too far away become real options. More access means more opportunity.'},
   {label:'Carry on as before', hint:'Nothing changes.', idea:'Use it or lose it',
    run:s=>'The line is there if you need it.',
    why:'Public projects only pay off if people use them. That is why towns study demand before building.'}]},
 // ---------- EDUCATION ----------
 {id:'course', cat:'Education', title:'Evening class!', text:'A course in your field runs every Tuesday night for a year.',
  choices:[
   {label:'Join the full course', hint:s=>`${Y(s.cheapCourses?100000:200000)}, skills +10, fewer free evenings.`, idea:'Human capital',
    run:s=>{ const a=s.cheapCourses?100000:200000; const src=pay(s,a); s.stats.educationSpent+=a; adj(s,'skills',10); adj(s,'wellbeing',-5); return `Paid from ${src}. You finished with a certificate!`; },
    why:'Learning is an investment in HUMAN CAPITAL: it costs money and time now and raises what you can earn later.'},
   {label:'Learn from free videos', hint:'Free! 60% chance you finish.', odds:()=>0.6, idea:'Hidden cost of free',
    run:(s,hit)=>{ if(hit){ adj(s,'skills',5); return 'You stuck with it and learned a lot. Go you!'; } adj(s,'skills',1); return 'Life got busy and you drifted off after week three.'; },
    why:'Free things still cost time and willpower. A teacher and a deadline are part of what you pay for.'},
   {label:'Not this year', hint:'Keep money and evenings.', idea:'Timing',
    run:s=>{ adj(s,'wellbeing',2); return 'You chose rest over study this year.'; },
    why:'Skipping study is not automatically a mistake. It only matters if those skills would have opened doors later.'}]},
 {id:'degree', cat:'Education', title:'You got into university!', text:'A two-year programme in your field has a place for you.',
  cond:s=>s.year<=20,
  choices:[
   {label:'Study full time', hint:s=>`${Y(s.cheapCourses?500000:800000)} and pay drops 30% this year. Skills +25!`, idea:'Opportunity cost',
    run:s=>{ const a=s.cheapCourses?500000:800000; const src=pay(s,a); s.stats.educationSpent+=a; s.income=Math.round(s.income*0.7); adj(s,'skills',25); adj(s,'connections',8); return `Paid from ${src}. Two intense years, lots of new friends.`; },
    why:'The biggest cost of studying is often not the fees. It is the pay you give up while you study. That is OPPORTUNITY COST.'},
   {label:'Study part time', hint:s=>`${Y(s.cheapCourses?250000:400000)}, keep working. Skills +12, tired −8.`, idea:'Spreading cost',
    run:s=>{ const a=s.cheapCourses?250000:400000; const src=pay(s,a); s.stats.educationSpent+=a; adj(s,'skills',12); adj(s,'wellbeing',-8); return `Paid from ${src}. Long days, but the paychecks kept coming.`; },
    why:'Part-time study spreads the cost out in money and tiredness. Slower, but safer for your income.'},
   {label:'Say no thanks', hint:'Keep your current path.', idea:'Circumstances',
    run:s=>'You passed on the place.',
    why:'Not every opportunity fits every life. Family, debt or health can make a good option impossible right now.'}]},
 {id:'network', cat:'Education', title:'Meetup night', text:'People from your field are meeting at a café. Entry is ¥10,000.',
  choices:[
   {label:'Go and chat with everyone', hint:'Contacts +12.', idea:'Networks',
    run:s=>{ pay(s,10000); adj(s,'connections',12); return 'You left with new contacts and three good ideas.'; },
    why:'Lots of jobs are never advertised. People hear about them from people. Your NETWORK carries information money cannot buy.'},
   {label:'Go, but stay quiet', hint:'Contacts +4, skills +2.', idea:'Information',
    run:s=>{ pay(s,10000); adj(s,'connections',4); adj(s,'skills',2); return 'You listened to the talks and learned a thing or two.'; },
    why:'Knowing where your field is heading helps you prepare early. Information is valuable on its own.'},
   {label:'Skip it', hint:'Save the money and the evening.', idea:'Patterns, not moments',
    run:s=>'A quiet evening at home.',
    why:'No single evening decides your life. What matters is the pattern of lots of small choices.'}]},
 {id:'tech', cat:'Education', title:'Robots learned your job!', text:'A new AI tool now does half of what you do at work. Your skills are less wanted.',
  cond:s=>s.year>=2,
  choices:[
   {label:'Learn to use the new tool', hint:'¥150,000. Skills +15.', idea:'Innovation',
    run:s=>{ const src=pay(s,150000); s.stats.educationSpent+=150000; adj(s,'skills',15); return `Paid from ${src}. Now the robot works FOR you.`; },
    why:'New INNOVATION destroys some jobs and creates others. People who adapt grab the gains; people who cannot bear the costs.'},
   {label:'Ignore it and carry on', hint:'Coin flip on a pay cut.', odds:()=>0.5, idea:'Change does not wait',
    run:(s,hit)=>{ if(hit) return 'Your job was fine, for now.'; s.income=Math.round(s.income*0.85); adj(s,'skills',-5); return 'Your boss cut your hours. Pay −15%.'; },
    why:'Ignoring change is a gamble. The world keeps moving whether or not you do.'},
   {label:'Switch to a totally new field', hint:'Pay −20% now, skills +10, future brighter.', idea:'Reskilling',
    run:s=>{ s.income=Math.round(s.income*0.8); adj(s,'skills',10); adj(s,'connections',5); return 'You started again at the bottom of a growing field.'; },
    why:'Changing field means lower pay now for better chances later. It pays off only if the new field keeps growing.'}]},
 // ---------- STOCKS ----------
 {id:'tip', cat:'Stocks', title:'Hot stock tip!', text:'Your friend swears one company\'s shares are about to ROCKET.',
  choices:[
   {label:'Put ¥200,000 into that one company', hint:'Might double. Might halve. 45% it rises.', odds:()=>0.45, idea:'Concentration risk',
    run:(s,hit)=>{ pay(s,200000); s.stocksCost+=200000; if(hit){ s.stocks+=360000; return 'It rose 80%! Your friend is unbearable now.'; } s.stocks+=100000; return 'It halved. Tips are not the same as facts.'; },
    why:'One company is a bet. Many companies is a market. Putting everything in one place makes both the win and the loss bigger.'},
   {label:'Put ¥200,000 into an index fund', hint:'Hundreds of companies. Steadier.', idea:'Diversification',
    run:s=>{ pay(s,200000); s.stocks+=200000; s.stocksCost+=200000; return 'You bought a broad basket instead.'; },
    why:'DIVERSIFICATION cannot stop the whole market falling, but it stops one bad company sinking you.'},
   {label:'Keep it in savings', hint:'No risk, small interest.', idea:'Doing nothing is a choice',
    run:s=>'Your savings stay put.',
    why:'Not investing is also a choice with a risk: inflation slowly eats cash that just sits there.'}]},
 {id:'boom', cat:'Stocks', title:'Markets are BOOMING', text:'Shares are up 25% this year. Everyone at school pickup is talking about it.',
  cond:s=>s.stocks>0,
  choices:[
   {label:'Sell everything', hint:'Lock in the gain.', idea:'Market timing',
    run:s=>{ s.stocks=Math.round(s.stocks*1.25); s.stats.investNet+=s.stocks-s.stocksCost; s.savings+=s.stocks; const g=s.stocks; s.stocks=0; s.stocksCost=0; return `Sold for ${Y(g)}.`; },
    why:'Selling after a rise feels safe, but it means guessing the top. Nobody can time the market reliably. Not even grown-ups.'},
   {label:'Hold on', hint:'Stay invested.', idea:'Compounding',
    run:s=>{ s.stocks=Math.round(s.stocks*1.25); return 'Your shares are up 25%.'; },
    why:'Long-term investors ride out booms and busts. COMPOUNDING, growth on top of growth, needs time more than timing.'},
   {label:'Buy ¥100,000 more', hint:'Prices are high.', idea:'Bubbles',
    run:s=>{ s.stocks=Math.round(s.stocks*1.25); pay(s,100000); s.stocks+=100000; s.stocksCost+=100000; return 'You bought at high prices.'; },
    why:'Buying because prices went up is called chasing. Excitement can push prices above what companies are worth, and that can pop.'}]},
 {id:'crash', cat:'Stocks', title:'Markets CRASH', text:'Shares fell 30%. The news is full of scary headlines.',
  cond:s=>s.stocks>0,
  choices:[
   {label:'Sell everything', hint:'Stop the losses.', idea:'Paper loss',
    run:s=>{ s.stocks=Math.round(s.stocks*0.7); s.stats.investNet+=s.stocks-s.stocksCost; s.savings+=s.stocks; const g=s.stocks; s.stocks=0; s.stocksCost=0; return `Sold for ${Y(g)}. The loss is now real.`; },
    why:'A fall is only a real loss when you sell. But if you NEED the money now, you have no choice. That is why investments should not be your emergency fund.'},
   {label:'Hold on', hint:'Wait for recovery.', idea:'Patience',
    run:s=>{ s.stocks=Math.round(s.stocks*0.7); return 'You held on. On paper you are down 30%.'; },
    why:'Markets have always recovered from crashes before, but never on a schedule. Holding takes patience and enough cash elsewhere.'},
   {label:'Buy ¥100,000 more', hint:'Shares are cheap.', idea:'Be prepared',
    run:s=>{ s.stocks=Math.round(s.stocks*0.7); const src=pay(s,100000); s.stocks+=100000; s.stocksCost+=100000; return `Paid from ${src}. You bought at low prices.`; },
    why:'Buying in a crash can pay off, but only if you have spare money. A crisis is a chance for the prepared and a disaster for the stretched.'}]},
 {id:'regular', cat:'Stocks', title:'Auto-invest?', text:'Your bank offers to move money into an index fund every month, automatically.',
  cond:s=>s.monthlyInvest===0,
  choices:[
   {label:'¥20,000 a month', hint:'Steady, whatever the market does.', idea:'Dollar-cost averaging',
    run:s=>{ s.monthlyInvest=20000; return 'From now on ¥20,000 a month goes into the fund.'; },
    why:'Investing the same amount every month means you buy at high prices AND low prices. No guessing needed.'},
   {label:'¥5,000 a month', hint:'Small and easy.', idea:'Compounding',
    run:s=>{ s.monthlyInvest=5000; return 'A small amount, but it grows on itself.'; },
    why:'COMPOUNDING rewards time more than amount. Starting small and early often beats starting big and late.'},
   {label:'Not now', hint:'Keep the full monthly budget.', idea:'Priorities',
    run:s=>'You kept your monthly money as it is.',
    why:'If you have debt or no emergency fund, investing may not be the best use of each coin yet. Order matters.'}]},
 // ---------- WILD EVENTS: life can be strange ----------
 {id:'w_viral', cat:'Events', wild:true, title:'Your hamster went VIRAL', text:'A video of Mr Nibbles doing a backflip got 40 million views. Companies want to pay him ¥300,000 to appear in ads!',
  choices:[
   {label:'Take the money and save most of it', hint:'Windfalls are rare. Treat it that way.', idea:'Windfall',
    run:s=>{ s.cash+=100000; s.savings+=200000; adj(s,'wellbeing',5); return 'Mr Nibbles is a star and your savings jar is fat.'; },
    why:'A WINDFALL is money you did not plan for and may never see again. Saving most of it turns one lucky day into years of safety.'},
   {label:'Quit my job to manage the hamster full time', hint:'Fame fades. 25% chance it lasts.', odds:()=>0.25, idea:'Fads fade',
    run:(s,hit)=>{ s.cash+=300000; if(hit){ s.income=Math.round(s.income*1.4); s.flags.hamster=true; return 'Somehow it worked. Hamster merch is everywhere.'; } s.employed=false; s.stats.setbacks++; return 'Views dropped to zero in a month. You are now unemployed with a very smug hamster.'; },
    why:'Fame and fads fade fast. Building a life on a short burst of luck is a risky bet.'},
   {label:'Spend it all on a hamster mansion', hint:'Mr Nibbles deserves it.', idea:'Spending vs saving',
    run:s=>{ adj(s,'wellbeing',8); return 'Three storeys. A tiny hot tub. No money left, but what a house.'; },
    why:'Spending feels great right now. Saving feels great later. The trick in life is balancing the two.'}]},
 {id:'w_pickles', cat:'Events', wild:true, title:'Pickle mania!', text:'Suddenly EVERYONE in town wants pickles. Jars are selling for ten times the normal price.',
  choices:[
   {label:'Start pickling in my kitchen', hint:'Jump on the demand.', odds:s=>0.5+s.skills/300, idea:'Supply and demand',
    run:(s,hit)=>{ pay(s,20000); if(hit){ s.cash+=180000; return 'You sold 900 jars before the craze ended. Cucumber hands, full wallet.'; } return 'By the time your pickles were ready, the craze had moved on to radishes.'; },
    why:'When lots of people want something (DEMAND) and there is not much of it (SUPPLY), the price shoots up. High prices tempt more people to make it, and then prices fall again.'},
   {label:'Buy 200 jars to resell later', hint:'Gamble that prices stay high.', odds:()=>0.3, idea:'Speculation',
    run:(s,hit)=>{ const src=pay(s,100000); if(hit){ s.cash+=250000; return `Paid from ${src}. Prices went even higher. Jackpot!`; } s.cash+=30000; return `Paid from ${src}. Prices crashed. You own a LOT of pickles.`; },
    why:'Buying something only because you hope to sell it for more is SPECULATION. Sometimes it works. Often you end up with a cupboard full of pickles.'},
   {label:'Just enjoy a pickle', hint:'Stay out of it.', idea:'Not every wave is yours',
    run:s=>{ adj(s,'wellbeing',2); return 'Crunchy. Delicious. No regrets.'; },
    why:'You do not have to ride every wave. Skipping a craze is often the calmest choice.'}]},
 {id:'w_squid', cat:'Events', wild:true, title:'A giant squid is blocking the harbour', text:'No ships can get in. Bananas, phones and sneakers are suddenly hard to find, and prices for them triple.',
  choices:[
   {label:'Wait it out and buy local stuff', hint:'Costs +¥8,000 a month this year.', idea:'Supply shock',
    run:s=>{ s.expenses+=8000; s.econ.inflation+=1; return 'Local apples instead of bananas. The squid left after a year.'; },
    why:'When goods stop arriving, that is a SUPPLY SHOCK. Less stuff plus the same demand means higher prices for everyone.'},
   {label:'Sell my old sneakers at triple price', hint:'Quick cash.', idea:'Scarcity',
    run:s=>{ s.cash+=40000; return 'Your dusty trainers paid for a holiday.'; },
    why:'SCARCITY makes ordinary things valuable. The same sneakers were worth little when the harbour was open.'},
   {label:'Start a squid-watching tour business', hint:'Odds depend on contacts.', odds:s=>0.35+s.connections/250, idea:'Opportunity in chaos',
    run:(s,hit)=>{ pay(s,30000); if(hit){ s.cash+=150000; adj(s,'connections',5); return 'Tourists LOVED it. Squid selfies for everyone.'; } return 'The squid left the week you printed the flyers.'; },
    why:'Strange events create needs nobody planned for. Spotting them fast is how many businesses begin. Timing is luck, though.'}]},
 {id:'w_printer', cat:'Events', wild:true, title:'The town money printer got stuck ON', text:'Someone leaned on the button. Now everybody has twice as much cash... and prices doubled within weeks.',
  choices:[
   {label:'Spend fast before prices rise more', hint:'Buy things that keep value.', idea:'Hyperinflation',
    run:s=>{ s.econ.inflation=12; s.cash*=2; s.savings*=2; s.expenses*=2; s.income*=2; s.debt*=2; const m=Math.round(s.cash*0.5); s.cash-=m; s.stocks+=m; s.stocksCost+=m; return 'You swapped half your cash for shares. Numbers doubled everywhere, but nothing is really worth more.'; },
    why:'Printing money does not make a town richer. If there is twice as much money and the same amount of stuff, prices just double. That is INFLATION on turbo.'},
   {label:'Keep all my cash and hope', hint:'The numbers look bigger!', idea:'Money vs value',
    run:s=>{ s.econ.inflation=12; s.cash*=2; s.savings*=2; s.expenses*=2; s.income*=2; s.debt*=2; adj(s,'wellbeing',-3); return 'Your bank balance doubled. So did the price of bread. Nothing changed, except you feel confused.'; },
    why:'Money is only worth what it can buy. More money chasing the same stuff just means higher prices.'},
   {label:'Pay off debt with the funny money', hint:'Debt did not double as fast.', idea:'Inflation helps borrowers',
    run:s=>{ s.econ.inflation=12; s.cash*=2; s.savings*=2; s.expenses*=2; s.income*=2; const m=Math.min(s.debt,s.cash); s.cash-=m; s.debt-=m; return m>0?`You cleared ${Y(m)} of debt while money was cheap.`:'No debt to clear, so your cash just sat there doubling and shrinking at once.'; },
    why:'Inflation quietly helps people who owe money and hurts people who saved it. That is one reason countries try hard to keep it low.'}]},
 {id:'w_timetravel', cat:'Events', wild:true, title:'A time traveller sells tomorrow\'s newspaper', text:'A man in a shiny suit offers tomorrow\'s share prices for ¥100,000. Totally trustworthy, obviously.',
  choices:[
   {label:'Buy it!', hint:'What could go wrong? 10% he is real.', odds:()=>0.1, idea:'Too good to be true',
    run:(s,hit)=>{ const src=pay(s,100000); if(hit){ s.cash+=600000; return `Paid from ${src}. It was REAL. You are rich and very confused.`; } return `Paid from ${src}. The newspaper was yesterday's, with the date scribbled out. Classic.`; },
    why:'If someone promises guaranteed money, ask why they are selling the secret instead of using it. Deals that sound too good to be true usually are. This is how SCAMS work.'},
   {label:'Say no and warn my neighbours', hint:'Protect the street.', idea:'Scams',
    run:s=>{ adj(s,'connections',6); return 'You saved Mrs Tanaka ¥100,000. She baked you a cake.'; },
    why:'Scams spread through communities. So does warning each other. Trust is a shared resource.'},
   {label:'Offer to buy it only if he proves it works first', hint:'Trust, but verify.', idea:'Verify',
    run:s=>{ return 'He vanished in a puff of sparkles. Suspicious.'; },
    why:'Asking for proof before paying is the simplest protection there is. Honest sellers do not mind.'}]},
 {id:'w_meteor', cat:'Events', wild:true, title:'A meteorite landed in your garden', text:'It made a crater in the lawn. A museum will pay ¥500,000 for it. The tax office has also noticed.',
  choices:[
   {label:'Sell it to the museum', hint:'¥500,000, minus 20% tax.', idea:'Windfall tax',
    run:s=>{ s.savings+=400000; adj(s,'connections',3); return 'The museum named the rock after you. The tax office took its share.'; },
    why:'Even lucky money usually gets taxed. Taxes on gains pay for the roads and schools your rock will be displayed near.'},
   {label:'Keep it as a lucky rock', hint:'An asset that might grow in value. Or not.', odds:()=>0.4, idea:'Assets change value',
    run:(s,hit)=>{ if(hit){ s.savings+=800000; return 'Ten years later a collector offered DOUBLE. Patience paid.'; } return 'It turned out to be mostly ordinary iron. Nice doorstop though.'; },
    why:'The value of a thing can change a lot over time, and nobody knows for sure which way. Holding an asset is a bet too.'},
   {label:'Charge tourists to see the crater', hint:'Small steady money.', idea:'Turn luck into income',
    run:s=>{ s.income+=8000; return 'Crater tours, ¥500 a ticket. The neighbours grumble about parking.'; },
    why:'Turning a one-time windfall into a steady income is often smarter than one big sale. Steady beats spiky.'}]},
 {id:'w_ducks', cat:'Events', wild:true, title:'10,000 rubber ducks washed ashore', text:'A cargo ship lost a container. The whole beach is yellow and squeaky. Ducks are free for anyone who grabs them.',
  choices:[
   {label:'Collect 500 and sell them', hint:'Free goods, some work.', idea:'Free is not free',
    run:s=>{ s.cash+=25000; adj(s,'wellbeing',-2); return 'Two days of duck wrangling. Each one sold for ¥50.'; },
    why:'Even free things cost time and effort. And when EVERYONE has ducks, nobody pays much for a duck.'},
   {label:'Organise a beach clean-up', hint:'Good for the town, good for you.', idea:'Public goods',
    run:s=>{ adj(s,'connections',10); adj(s,'wellbeing',4); return 'Fifty neighbours showed up. The beach is clean and you are a bit of a hero.'; },
    why:'A clean beach helps everyone, even people who did not help clean it. Things like that are PUBLIC GOODS, and they only happen when people choose to pitch in.'},
   {label:'Keep one duck', hint:'Just one.', idea:'Enough',
    run:s=>{ adj(s,'wellbeing',3); return 'His name is Admiral Squeak. He lives on the windowsill.'; },
    why:'Sometimes the best deal is knowing when you have enough.'}]},
 {id:'w_robot', cat:'Events', wild:true, title:'A robot moved in next door', text:'It is polite, it never sleeps, and it just opened a sandwich shop that charges half what the old one did.',
  choices:[
   {label:'Buy cheaper sandwiches', hint:'Costs −¥3,000 a month.', idea:'Productivity',
    run:s=>{ s.expenses-=3000; return 'Lunch is cheaper and, honestly, pretty good.'; },
    why:'When something is made faster or cheaper, that is higher PRODUCTIVITY. Customers win with lower prices. The old sandwich shop does not.'},
   {label:'Help the old sandwich shop compete', hint:'Teach them a trick or two.', odds:s=>0.4+s.skills/300, idea:'Competition',
    run:(s,hit)=>{ if(hit){ adj(s,'connections',8); s.cash+=30000; return 'They went gourmet. Now both shops are busy and they paid you in sandwiches and cash.'; } adj(s,'connections',3); return 'They tried, but the robot is really fast. They now sell soup instead.'; },
    why:'COMPETITION pushes businesses to improve or change. Some adapt, some find a new niche, some close.'},
   {label:'Ask the robot for a job', hint:'It needs a human for the hard parts.', odds:s=>0.3+s.skills/200, idea:'Innovation creates jobs too',
    run:(s,hit)=>{ if(hit&&s.employed){ s.income+=20000; return 'You now handle complaints and pickle placement. Extra ¥20,000 a month.'; } return 'The robot thanked you politely and hired nobody.'; },
    why:'New technology ends some jobs and creates others, often ones nobody imagined. The new jobs usually need new skills.'}]},
 {id:'w_lottery', cat:'Events', wild:true, title:'An old lottery ticket in your coat pocket', text:'It is from three years ago. The draw was for ¥2,000,000. You have not checked it yet.',
  choices:[
   {label:'Check it!', hint:'1 in 100 in this game. Real lotteries are more like 1 in 10 million.', odds:()=>0.01, idea:'Luck',
    run:(s,hit)=>{ if(hit){ s.savings+=2000000; return 'IT WON. You sit down on the floor for a while.'; } return 'Not a winner. But you found ¥500 in the other pocket.'; },
    why:'Pure LUCK is real and it is part of every life. The trick is not relying on it. Lottery tickets are a fun cost, not a plan.'},
   {label:'Frame it without checking', hint:'Keep the dream alive.', idea:'The value of maybe',
    run:s=>{ adj(s,'wellbeing',2); return 'It hangs in the hallway. Maybe. Possibly. Who knows.'; },
    why:'Sometimes the hope is worth more than the answer. That is a feeling, not economics, and feelings count too.'},
   {label:'Give it to a friend having a hard time', hint:'Spread the maybe.', idea:'Generosity',
    run:s=>{ adj(s,'connections',5); adj(s,'wellbeing',3); return 'They laughed for the first time in weeks. Nobody ever checked the ticket.'; },
    why:'Kindness builds the network that catches you when you fall. No spreadsheet shows it, but every life runs on it.'}]},
 {id:'w_beanstalk', cat:'Events', wild:true, title:'A magic beanstalk grew in your garden', text:'It is 40 metres tall and dropping golden beans. About ¥10,000 worth a month, for now.',
  choices:[
   {label:'Sell the beans each month', hint:'Income +¥10,000 while it lasts.', idea:'Passive income',
    run:s=>{ s.income+=10000; s.flags.beans=true; return 'Bean money every month. You barely have to climb.'; },
    why:'Money that arrives without you working for it is PASSIVE INCOME. Rent, dividends and golden beans all count. It can stop, though.'},
   {label:'Chop it down and sell the wood', hint:'¥150,000 once.', idea:'One-off vs ongoing',
    run:s=>{ s.cash+=150000; return 'Lovely timber. No more beans.'; },
    why:'A one-off payment feels big, but a smaller amount every month can add up to far more over the years.'},
   {label:'Climb it to see what is at the top', hint:'Adventure! 50% it is wonderful.', odds:()=>0.5, idea:'Risk and reward',
    run:(s,hit)=>{ if(hit){ s.savings+=300000; adj(s,'wellbeing',10); return 'A friendly giant gave you a golden egg and a cup of tea.'; } adj(s,'wellbeing',-8); pay(s,50000); return 'You fell into the pond. Phone broken, pride bruised.'; },
    why:'Bigger possible rewards come with bigger possible losses. Choosing how much risk you can live with is a life skill.'}]},
];
