 {id:'e_baby', cat:'Events', title:'A baby is coming!', text:'Tiny socks. Big changes. Babies cost money AND time.',
  cond:s=>s.partner && s.kids<3 && s.year>=2,
  choices:[
   {label:'One of us works part time', hint:'Pay −30%, costs +¥40,000, happiness +10.', idea:'Unpaid work',
    run:s=>{ s.kids++; s.income=Math.round(s.income*0.7); s.expenses+=40000; adj(s,'wellbeing',10); return 'Less pay, more cuddles, no sleep.'; },
    why:'Looking after a child is real work even though nobody pays for it. Choosing it means giving up paid hours.'},
   {label:'Both keep working, pay for childcare', hint:'Costs +¥80,000, happiness +4.', idea:'Opportunity cost',
    run:s=>{ s.kids++; s.expenses+=80000; adj(s,'wellbeing',4); return 'Daycare is expensive, but your career keeps rolling.'; },
    why:'Paying someone else to care for your child keeps your pay and skills growing. The childcare bill is the price of that.'},
   {label:'Grandparents help out', hint:'Costs +¥30,000. Needs family nearby.', idea:'Social capital', odds:s=>0.3+s.connections/150,
    run:(s,hit)=>{ s.kids++; if(hit){ s.expenses+=30000; adj(s,'wellbeing',8); adj(s,'connections',5); return 'Grandma is thrilled. Costs stay low.'; } s.expenses+=80000; adj(s,'wellbeing',3); return 'Grandma lives too far away. Daycare it is.'; },
    why:'Family and friends are a safety net that money cannot buy. Not everyone has one nearby, and that changes what choices are possible.'}]},
 {id:'e_crash', cat:'Events', title:'Fender bender', text:'Someone bumped your car in the car park and drove off. Repairs: ¥150,000.',
  choices:[
   {label:'Pay for the repair', hint:s=>s.insured?'Insurance covers most. You pay ¥20,000.':'¥150,000 from your pocket.', idea:'Insurance',
    run:s=>{ const a=s.insured?20000:150000; const src=pay(s,a); return `Paid ${Y(a)} from ${src}.`; },
    why:'This is exactly what insurance is for. People who pay a little every month are not ruined by one bad day.'},
   {label:'Drive it dented', hint:'Save money, lose a little pride.', idea:'Good enough',
    run:s=>{ adj(s,'wellbeing',-3); return 'It still drives. It just looks sad.'; },
    why:'Not every problem needs fixing right away. Deciding what is good enough is a money skill.'},
   {label:'Ask around to find the driver', hint:'Odds depend on contacts.', odds:s=>0.3+s.connections/250, idea:'Networks',
    run:(s,hit)=>{ if(hit) return 'A neighbour saw it. The driver paid up, embarrassed.'; pay(s,150000); return 'Nobody saw anything. You paid.'; },
    why:'Knowing people is worth money in surprising ways. A good network solves problems that cash cannot.'}]},
 {id:'e_scamcall', cat:'Events', title:'A scary phone call', text:'"This is your bank. Your account is LOCKED. Give us your password NOW to fix it."',
  choices:[
   {label:'Hang up and call the bank yourself', hint:'The safe move.', idea:'Scams',
    run:s=>{ adj(s,'skills',2); return 'The real bank says everything is fine. It was a scam.'; },
    why:'Real banks never ask for your password. Scammers use hurry and fear to stop you thinking. Slowing down beats them.'},
   {label:'Give them the password to be safe', hint:'They sounded so official.', idea:'Scams',
    run:s=>{ const a=Math.min(100000,s.cash+s.savings); pay(s,a); adj(s,'wellbeing',-6); return `They emptied ${Y(a)} before you could blink.`; },
    why:'Scams work because they sound real and urgent. The lesson costs ¥100,000 this time. Next time it costs nothing.'},
   {label:'Keep them talking and waste their time', hint:'Chaos mode.', idea:'Scams',
    run:s=>{ adj(s,'wellbeing',4); return 'You described your cat for 40 minutes. They gave up.'; },
    why:'Every minute a scammer spends on you is a minute they are not scamming someone else. Still, hanging up is safer.'}]},
 {id:'e_flood', cat:'Events', title:'The river flooded your street', text:'Mud in the hallway, a very wet sofa. Damage: ¥200,000.',
  choices:[
   {label:'Pay to fix it', hint:s=>s.insured?'Insurance pays most. You pay ¥40,000.':'¥200,000 from your pocket.', idea:'Insurance',
    run:s=>{ const a=s.insured?40000:200000; const src=pay(s,a); return `Paid ${Y(a)} from ${src}.`; },
    why:'Floods hit whole streets at once. Insurance spreads a disaster across many people in many places.'},
   {label:'Organise a street clean-up', hint:'Neighbours help each other.', idea:'Community',
    run:s=>{ pay(s,80000); adj(s,'connections',10); adj(s,'wellbeing',3); return 'Twelve neighbours, twenty buckets, one big pot of soup. Cost fell to ¥80,000.'; },
    why:'Communities can do things markets cannot. Shared work makes the same disaster cheaper for everyone.'},
   {label:'Move to higher ground', hint:'Moving costs ¥120,000, rent slightly higher.', idea:'Risk management',
    run:s=>{ pay(s,120000); s.expenses+=5000; adj(s,'wellbeing',2); return 'Drier, pricier, calmer.'; },
    why:'Sometimes the smart money move is to stop the risk from happening again, even if it costs more now.'}]},
 {id:'e_friendloan', cat:'Events', title:'A friend asks to borrow ¥50,000', text:'They promise to pay it back next month. They are a good friend. Mostly.',
  choices:[
   {label:'Lend it all', hint:'50% chance you see it again.', odds:()=>0.5, idea:'Lending risk',
    run:(s,hit)=>{ pay(s,50000); if(hit){ s.cash+=50000; adj(s,'connections',6); return 'Paid back with a thank-you cake. Friendship: upgraded.'; } adj(s,'connections',-4); return 'Never paid back. Things are a bit awkward now.'; },
    why:'Lending money to friends risks both the money and the friendship. Only lend what you could afford to give.'},
   {label:'Give ¥20,000 as a gift, no strings', hint:'Smaller, cleaner.', idea:'Gifts vs loans',
    run:s=>{ pay(s,20000); adj(s,'connections',5); adj(s,'wellbeing',2); return 'They were surprised and grateful. No awkward reminders needed.'; },
    why:'A gift has no interest, no due date and no arguments. Sometimes giving less, freely, is worth more than lending more.'},
   {label:'Say no kindly', hint:'Protect your budget.', idea:'Boundaries',
    run:s=>{ adj(s,'connections',-2); return 'They understood. Mostly.'; },
    why:'Saying no is allowed. A clear no protects your money and often your friendship too.'}]},
 {id:'e_cat', cat:'Events', title:'A stray cat adopted you', text:'It walked in, sat down, and now this is its house. Food and vet bills: ¥5,000 a month.',
  choices:[
   {label:'Keep the cat', hint:'Costs +¥5,000, happiness +6.', idea:'Ongoing costs',
    run:s=>{ s.pets++; s.expenses+=5000; adj(s,'wellbeing',6); return 'Its name is Professor Whiskers. It runs the house now.'; },
    why:'Pets are small ongoing costs that add up over years. They are also one of the best happiness-per-yen deals around.'},
   {label:'Take it to the shelter', hint:'No cost.', idea:'Responsibility',
    run:s=>{ adj(s,'wellbeing',-2); return 'The shelter found it a home. You still think about it.'; },
    why:'Taking on a living thing is a long commitment. Saying no responsibly is better than saying yes carelessly.'},
   {label:'Keep it AND start a cat video channel', hint:'15% chance it takes off.', odds:()=>0.15, idea:'Long shots',
    run:(s,hit)=>{ s.pets++; s.expenses+=5000; adj(s,'wellbeing',5); if(hit){ s.income+=25000; return 'Professor Whiskers is famous. ¥25,000 a month in ad money.'; } return 'Forty-two views, mostly you. Still a great cat.'; },
    why:'Long shots are fun as long as you would be fine if they miss. The cat is the real win here.'}]},
 {id:'e_healthscare', cat:'Events', title:'Doctor says: move more', text:'Your check-up was not great. Too much sitting, too many snacks.',
  choices:[
   {label:'Join a gym', hint:'Costs +¥4,000, happiness +8.', idea:'Prevention',
    run:s=>{ s.expenses+=4000; adj(s,'wellbeing',8); return 'Sore legs, better sleep, clearer head.'; },
    why:'Paying a little for health now usually beats paying a lot for illness later. That is PREVENTION.'},
   {label:'Run in the park for free', hint:'60% chance you keep it up.', odds:()=>0.6, idea:'Habits',
    run:(s,hit)=>{ if(hit){ adj(s,'wellbeing',9); return 'Three times a week, rain or shine. You feel brilliant.'; } adj(s,'wellbeing',1); return 'Two runs, then winter came.'; },
    why:'Free plans fail more often than paid ones because nothing holds you to them. Habits need a hook.'},
   {label:'Ignore it', hint:'Coin flip on a bigger bill later.', odds:()=>0.5, idea:'Hidden costs',
    run:(s,hit)=>{ if(hit) return 'Nothing happened. Yet.'; pay(s,s.insured?30000:120000); adj(s,'wellbeing',-12); return 'A bigger health problem showed up a year later, with a bigger bill.'; },
    why:'Problems you ignore do not disappear. They wait, and they charge interest in a different currency: health.'}]},
 {id:'e_wedding', cat:'Events', title:'A wedding abroad', text:'Your best friend is getting married overseas. Flights and hotel: ¥150,000.',
  choices:[
   {label:'Go!', hint:'¥150,000. Memories forever.', idea:'Experiences',
    run:s=>{ const src=pay(s,150000); adj(s,'wellbeing',9); adj(s,'connections',8); return `Paid from ${src}. You danced until 3am.`; },
    why:'Research says people often get more lasting happiness from experiences than from things. It still costs money, so it is a choice.'},
   {label:'Send a lovely gift and a video message', hint:'¥20,000.', idea:'Budgeting',
    run:s=>{ pay(s,20000); adj(s,'connections',2); return 'They loved the video. You watched the ceremony on a phone.'; },
    why:'Budgets are about choosing what matters most to you. There is no wrong answer, only your answer.'},
   {label:'Go, but on a shoestring', hint:'¥70,000. Hostel bunk, long bus.', idea:'Frugality',
    run:s=>{ pay(s,70000); adj(s,'wellbeing',6); adj(s,'connections',8); return 'Fourteen hours on a bus. Totally worth it.'; },
    why:'Finding the cheap way to do the thing you really want is a superpower. Frugal is not the same as stingy.'}]},
 {id:'e_burglary', cat:'Events', title:'Someone broke in', text:'Your laptop and some cash are gone. Loss: ¥80,000.',
  choices:[
   {label:'Replace what was taken', hint:s=>s.insured?'Insurance covers it. You pay ¥10,000.':'¥80,000 from your pocket.', idea:'Insurance',
    run:s=>{ const a=s.insured?10000:80000; pay(s,a); adj(s,'wellbeing',-4); return `Paid ${Y(a)}. New locks too.`; },
    why:'Theft is one of the risks home insurance covers. Without it, bad luck lands straight on your savings.'},
   {label:'Install an alarm', hint:'¥40,000 now, fewer worries.', idea:'Risk reduction',
    run:s=>{ pay(s,s.insured?10000:80000); pay(s,40000); adj(s,'wellbeing',2); return 'Beep beep. You sleep better.'; },
    why:'Some spending lowers the chance of future losses. Insurance pays after the bad thing. Prevention tries to stop it.'},
   {label:'Shrug it off', hint:'Just the loss.', idea:'Resilience',
    run:s=>{ pay(s,s.insured?10000:80000); adj(s,'wellbeing',-6); return 'Stuff is just stuff. You tell yourself that a few times.'; },
    why:'Losses happen. How much they hurt depends on how much cushion you had before they did.'}]},
 {id:'e_taxletter', cat:'Events', title:'A letter from the tax office', text:'They say you owe ¥60,000 more than you paid. Maybe they are right. Maybe not.',
  choices:[
   {label:'Pay it', hint:'Done and dusted.', idea:'Taxes',
    run:s=>{ pay(s,60000); return 'Paid. The letter stops looking at you.'; },
    why:'Taxes pay for roads, schools and hospitals. Paying what you owe is part of the deal of living in a town.'},
   {label:'Check the numbers and dispute it', hint:'Odds depend on skills.', odds:s=>0.3+s.skills/200, idea:'Check the numbers',
    run:(s,hit)=>{ if(hit){ adj(s,'skills',3); return 'You found their mistake. You owed nothing. Go you.'; } pay(s,65000); return 'They were right. Plus a small fee for the wait.'; },
    why:'Bills can be wrong. Reading them carefully is boring but it saves real money over a lifetime.'},
   {label:'Ignore the letter', hint:'La la la.', idea:'Penalties',
    run:s=>{ pay(s,90000); adj(s,'wellbeing',-4); return 'A second letter. Then a third. Now it is ¥90,000.'; },
    why:'Ignored bills grow. Late fees and penalties are the most expensive kind of borrowing there is.'}]},
 {id:'e_volunteer', cat:'Events', title:'The food bank needs help', text:'The town food bank is short of money and short of hands.',
  choices:[
   {label:'Give ¥20,000', hint:'Money helps fast.', idea:'Giving',
    run:s=>{ pay(s,20000); adj(s,'wellbeing',4); adj(s,'connections',3); return 'Forty families got groceries this week.'; },
    why:'Giving is part of economics too. Money moving to where it is needed most can do a lot of good per yen.'},
   {label:'Give a Saturday a month', hint:'Time instead of money.', idea:'Time is money',
    run:s=>{ adj(s,'wellbeing',5); adj(s,'connections',8); return 'You sort cans and meet half the town.'; },
    why:'Time and money can often swap places. If you have more of one than the other, give that one.'},
   {label:'Not this time', hint:'Keep your weekend and cash.', idea:'Limits',
    run:s=>'Maybe next year.',
    why:'You cannot help with everything. Knowing your limits is not the same as not caring.'}]},
 {id:'e_project', cat:'Events', title:'Your boss wants you to lead a big project', text:'More responsibility, more stress, a chance to shine.',
  cond:s=>s.employed,
  choices:[
   {label:'Take it on', hint:'Skills +8, happiness −5, future odds up.', idea:'Investing in yourself',
    run:s=>{ adj(s,'skills',8); adj(s,'wellbeing',-5); adj(s,'connections',4); return 'Long weeks, but people noticed.'; },
    why:'Hard projects are like free training that also costs sleep. They build the skills and reputation that future pay depends on.'},
   {label:'Say yes, but ask for help', hint:'Skills +5, happiness −2.', idea:'Delegation',
    run:s=>{ adj(s,'skills',5); adj(s,'wellbeing',-2); adj(s,'connections',6); return 'You built a team. The team built the thing.'; },
    why:'Nobody does big things alone. Sharing work is not weakness; it is how most valuable things get built.'},
   {label:'Politely decline', hint:'Keep your balance.', idea:'Well-being',
    run:s=>{ adj(s,'wellbeing',3); return 'Someone else led it. You went home at five.'; },
    why:'Turning down more work is a legitimate choice. Health and time are part of your wealth.'}]},
 {id:'e_kidsgrow', cat:'Events', title:'Your kid wants to join a club', text:'Football, piano, robotics... all of them cost money and all of them cost evenings.',
  cond:s=>s.kids>0,
  choices:[
   {label:'Sign them up', hint:'Costs +¥8,000 a month.', idea:'Investing in people',
    run:s=>{ s.expenses+=8000; adj(s,'wellbeing',5); return 'Tuesday robotics. The kitchen table is now a workshop.'; },
    why:'Spending on children\'s skills and joy is one of the oldest investments there is. The payoff is in their future, not your bank.'},
   {label:'Find a free community club', hint:'Needs contacts.', odds:s=>0.3+s.connections/200, idea:'Community resources',
    run:(s,hit)=>{ if(hit){ adj(s,'wellbeing',5); adj(s,'connections',4); return 'The library runs a free coding club. Score.'; } s.expenses+=8000; return 'Nothing free nearby, so you paid for the proper one.'; },
    why:'Towns are full of shared resources: libraries, parks, clubs. Knowing about them is a kind of wealth.'},
   {label:'Not this year', hint:'Budget is tight.', idea:'Hard choices',
    run:s=>{ adj(s,'wellbeing',-3); return 'They understood. Sort of.'; },
    why:'Money limits are real. The honest thing is to say so, and to make it up when things improve.'}]},
 // ---------- ECONOMY ----------
 {id:'ec_boom', cat:'Economy', title:'Boom times!', text:'Businesses are growing, everyone is hiring, and shops are full.',
  choices:[
   {label:'Ask for a raise now', hint:'Good timing. Odds up.', odds:s=>0.5+s.skills/250, idea:'Bargaining power',
    run:(s,hit)=>{ s.econ.unemployment=Math.max(2,s.econ.unemployment-3); if(hit&&s.employed){ s.income=Math.round(s.income*1.1); return 'Yes! 10% more. Bosses say yes faster when workers are scarce.'; } return 'Not yet, they said. But the mood is good.'; },
    why:'When businesses need workers and cannot find them, workers have more BARGAINING POWER. Timing your asks matters.'},
   {label:'Save the extra', hint:'Booms do not last forever.', idea:'Cycles',
    run:s=>{ s.econ.unemployment=Math.max(2,s.econ.unemployment-3); s.savings+=50000; return 'You tucked away a boom-time bonus.'; },
    why:'Economies go up and down in CYCLES. Saving in the good years is what makes the bad years survivable.'},
   {label:'Spend like it will last', hint:'Happiness +6, costs +¥10,000.', idea:'Lifestyle creep',
    run:s=>{ s.econ.unemployment=Math.max(2,s.econ.unemployment-3); s.expenses+=10000; adj(s,'wellbeing',6); return 'Nicer dinners, nicer shoes. Hard to undo later.'; },
    why:'When pay goes up, spending quietly goes up to match. That is LIFESTYLE CREEP, and it is hard to reverse when the boom ends.'}]},
 {id:'ec_minwage', cat:'Economy', title:'Minimum wage goes up', text:'The town raised the lowest legal pay by 10%.',
  choices:[
   {label:'Cheer', hint:'Low-paid workers earn more.', idea:'Minimum wage',
    run:s=>{ if(s.employed&&s.income<230000) s.income=Math.round(s.income*1.1); s.expenses+=3000; return s.income<253000?'Your pay went up! So did café prices, a little.':'Your pay did not change, but your coffee costs a bit more.'; },
    why:'A MINIMUM WAGE lifts the lowest pay. Some prices rise to cover it. Economists argue about how many jobs it changes.'},
   {label:'Worry about small shops', hint:'Their costs went up too.', idea:'Trade-offs',
    run:s=>{ if(s.employed&&s.income<230000) s.income=Math.round(s.income*1.1); s.expenses+=3000; adj(s,'skills',2); return 'The bakery cut one Saturday shift. The baker kept everyone else.'; },
    why:'One policy, many effects. Workers gain, some businesses squeeze, some prices rise. Good thinking holds all of these at once.'},
   {label:'Ask for a matching raise', hint:'If you earn more than minimum.', odds:s=>0.35+s.skills/300, idea:'Wage ladders',
    run:(s,hit)=>{ if(s.employed&&s.income<230000) s.income=Math.round(s.income*1.1); s.expenses+=3000; if(hit&&s.employed){ s.income=Math.round(s.income*1.04); return 'Your boss nudged everyone up to keep the gaps fair.'; } return 'Not this time.'; },
    why:'When the bottom rung rises, people above it often ask for more too. Wages climb like a ladder.'}]},
 {id:'ec_currency', cat:'Economy', title:'The yen got weaker', text:'One dollar now buys more yen. Imported stuff costs more. Companies that sell abroad are cheering.',
  choices:[
   {label:'Buy local instead of imported', hint:'Costs +¥3,000 instead of +¥8,000.', idea:'Exchange rates',
    run:s=>{ s.expenses+=3000; return 'Local apples, local socks. Bananas are a treat now.'; },
    why:'An EXCHANGE RATE is the price of one money in another. When yours gets weaker, foreign things cost more and your exports get cheaper for others.'},
   {label:'Keep buying imports', hint:'Costs +¥8,000.', idea:'Imports',
    run:s=>{ s.expenses+=8000; return 'Same shopping, bigger bill.'; },
    why:'Imported goods are priced in foreign money. A weaker yen means more yen for the same banana.'},
   {label:'Invest in exporting companies', hint:'Their shares rise 8%.', idea:'Winners and losers',
    run:s=>{ s.expenses+=3000; if(s.stocks>0){ s.stocks=Math.round(s.stocks*1.08); return 'Car makers and camera makers boomed. Your shares rose 8%.'; } const m=Math.min(100000,s.savings); s.savings-=m; s.stocks+=m; s.stocksCost+=m; return `You moved ${Y(m)} into exporters just as they took off.`; },
    why:'Every currency move has winners and losers. Exporters love a weak yen. Travellers and importers do not.'}]},
 {id:'ec_strike', cat:'Economy', title:'Transport strike!', text:'Bus and train drivers stopped work. They want better pay. The town is stuck.',
  choices:[
   {label:'Work from home', hint:'If your job allows. Skills +2.', idea:'Labour',
    run:s=>{ adj(s,'skills',2); return 'Pyjama meetings for a month.'; },
    why:'Strikes are how workers bargain together. One driver cannot change pay; all of them at once can.'},
   {label:'Take taxis', hint:'Costs +¥25,000 this season.', idea:'Substitutes',
    run:s=>{ pay(s,25000); return 'Expensive, but you got there.'; },
    why:'When one option disappears, people switch to SUBSTITUTES. The substitutes get pricier because everyone wants them.'},
   {label:'Join the drivers\' picket with snacks', hint:'Contacts +6.', idea:'Solidarity',
    run:s=>{ pay(s,5000); adj(s,'connections',6); adj(s,'wellbeing',2); return 'The drivers won a 6% raise. They remember who brought the rice balls.'; },
    why:'Workers, bosses and customers all depend on each other. Who sides with whom shapes how disputes end.'}]},
 {id:'ec_factory', cat:'Economy', title:'A big factory opens in town', text:'Two thousand new jobs. Rents are rising. The pizza place is packed.',
  choices:[
   {label:'Apply there', hint:'Odds depend on skills.', odds:s=>0.4+s.skills/250, idea:'Demand for workers',
    run:(s,hit)=>{ s.econ.unemployment=Math.max(2,s.econ.unemployment-2); s.expenses+=5000; if(hit){ s.employed=true; s.job='mechanic'; s.income=Math.max(s.income,290000); s.jobsHeld++; return 'You got a job on the line. Good pay, steady shifts.'; } return 'Too many applicants. But the town is buzzing.'; },
    why:'New businesses create DEMAND for workers. More demand usually means more jobs and higher pay, and higher rents too.'},
   {label:'Open a lunch stand outside the gate', hint:'Odds depend on contacts.', odds:s=>0.35+s.connections/250, idea:'Spillovers',
    run:(s,hit)=>{ s.econ.unemployment=Math.max(2,s.econ.unemployment-2); s.expenses+=5000; pay(s,60000); if(hit){ s.income+=40000; return 'Two thousand hungry workers. Your curry sells out daily.'; } return 'The factory opened its own canteen. Curry for one.'; },
    why:'Big employers create SPILLOVERS: cafés, shops and landlords nearby do better too.'},
   {label:'Enjoy the busy town', hint:'Costs +¥5,000 from rising rents.', idea:'Growth has costs',
    run:s=>{ s.econ.unemployment=Math.max(2,s.econ.unemployment-2); s.expenses+=5000; adj(s,'wellbeing',2); return 'More people, more fun, slightly pricier flat.'; },
    why:'Growth brings jobs and energy, but also traffic, noise and higher rents. Most changes are mixed.'}]},
 {id:'ec_housing', cat:'Economy', title:'House prices jump 20%', text:'Everyone is talking about property. Owners are grinning. Renters are not.',
  choices:[
   {label:s=>s.home?'Feel richer, change nothing':'Keep renting, keep saving', hint:s=>s.home?'Your home is worth more on paper.':'Rent +¥8,000.', idea:'Paper wealth',
    run:s=>{ s.econ.housing+=3; if(s.home){ s.home.value=Math.round(s.home.value*1.2); return 'Your home is worth 20% more. You cannot spend a house, though.'; } s.expenses+=8000; return 'Landlords raised rents to match.'; },
    why:'A price rise makes owners richer on paper only until they sell. For renters it is just higher rent. Same news, opposite effects.'},
   {label:s=>s.home?'Sell and pocket the gain':'Try to buy before prices rise more', hint:s=>s.home?'Sell at the top, go back to renting.':'Needs ¥1,200,000 saved.', idea:'Housing market',
    run:s=>{ s.econ.housing+=3; if(s.home){ s.home.value=Math.round(s.home.value*1.2); const got=sellHome(s); return `Sold! ${Y(got)} after paying off the loan. Now you rent again.`; } if(s.cash+s.savings>=1200000){ const src=buyHome(s,12000000); return `Deposit paid from ${src}. You own a home with a big loan attached.`; } s.expenses+=8000; return 'Not enough saved for a deposit. Rent went up instead.'; },
    why:'Buying needs a deposit saved up first. People without one get stuck paying higher rent while prices run away. Starting money matters.'},
   {label:'Ignore the hype', hint:'Prices go up and down.', idea:'Bubbles',
    run:s=>{ s.econ.housing+=3; if(s.home) s.home.value=Math.round(s.home.value*1.2); else s.expenses+=8000; adj(s,'wellbeing',1); return 'You turned the page.'; },
    why:'Fast price rises sometimes become BUBBLES that pop. Nobody knows which rises are bubbles until afterwards.'}]},
 // ---------- EDUCATION ----------
 {id:'ed_mentor', cat:'Education', title:'A mentor offers to coach you', text:'Someone senior in your field likes your work and offers monthly chats. Free, but they expect effort.',
  choices:[
   {label:'Say yes and do the homework', hint:'Skills +7, contacts +8.', idea:'Mentorship',
    run:s=>{ adj(s,'skills',7); adj(s,'connections',8); adj(s,'wellbeing',-2); return 'Hard feedback, big growth.'; },
    why:'Learning from someone further along is the fastest education there is, and often free. The price is listening.'},
   {label:'Say yes, but coast', hint:'Contacts +3.', idea:'Half effort',
    run:s=>{ adj(s,'connections',3); return 'Nice chats. Not much changed.'; },
    why:'Opportunities only pay off with effort. Showing up is half; the other half is doing the work.'},
   {label:'No time right now', hint:'Nothing changes.', idea:'Timing',
    run:s=>'They understood. The offer may not come again.',
    why:'Some doors only open once. Knowing which ones is hard, so it pays to lean towards yes.'}]},
 {id:'ed_language', cat:'Education', title:'Learn a language?', text:'A year of lessons costs ¥120,000. Speaking two languages opens some jobs and a lot of conversations.',
  choices:[
   {label:'Take the lessons', hint:'¥120,000. Skills +6, contacts +4.', idea:'Human capital',
    run:s=>{ const src=pay(s,120000); s.stats.educationSpent+=120000; adj(s,'skills',6); adj(s,'connections',4); return `Paid from ${src}. You can order noodles in two languages now.`; },
    why:'Languages are skills that keep paying: travel, work, friends. Like all skills, they cost time first.'},
   {label:'Use a free app every day', hint:'50% you stick with it.', odds:()=>0.5, idea:'Discipline',
    run:(s,hit)=>{ if(hit){ adj(s,'skills',4); return '400-day streak. Your phone is very proud of you.'; } adj(s,'skills',1); return 'The owl stopped sending reminders. You stopped too.'; },
    why:'Free learning works for people who can hold themselves to it. Paying for structure buys discipline.'},
   {label:'Skip it', hint:'Nothing changes.', idea:'Focus',
    run:s=>'Maybe later.',
    why:'You cannot learn everything. Picking what to learn is part of learning.'}]},
 {id:'ed_exam', cat:'Education', title:'The big certification exam', text:'Passing it would unlock better pay in your field. It is famously hard.',
  cond:s=>s.employed,
  choices:[
   {label:'Study hard for three months', hint:'Odds depend on skills.', odds:s=>0.35+s.skills/180, idea:'Preparation',
    run:(s,hit)=>{ adj(s,'wellbeing',-4); if(hit){ adj(s,'skills',8); s.income=Math.round(s.income*1.12); return 'PASSED. Pay up 12%. Worth every late night.'; } adj(s,'skills',3); return 'Failed by two marks. The studying still made you better.'; },
    why:'Preparation raises your odds, and even a fail leaves you with the knowledge. Effort is rarely wasted.'},
   {label:'Wing it', hint:'Low odds, no study time.', odds:s=>0.1+s.skills/300, idea:'Gambling',
    run:(s,hit)=>{ if(hit){ s.income=Math.round(s.income*1.12); return 'Somehow you passed. Do not tell anyone how.'; } return 'Nope. The exam fee is gone too.'; },
    why:'Skipping preparation turns a skill test into a lottery ticket. Lottery tickets mostly lose.'},
   {label:'Not this year', hint:'Nothing changes.', idea:'Timing',
    run:s=>'The exam runs every year. So does the excuse.',
    why:'Waiting can be wise or just comfortable. Ask yourself which one it is this time.'}]},
 {id:'ed_teach', cat:'Education', title:'Teach a weekend class', text:'The community centre asks you to teach what you know. ¥30,000 and a lot of nervous students.',
  cond:s=>s.skills>=40,
  choices:[
   {label:'Teach it', hint:'+¥30,000, skills +3, contacts +6.', idea:'Teaching to learn',
    run:s=>{ s.cash+=30000; adj(s,'skills',3); adj(s,'connections',6); return 'Explaining it made you understand it better.'; },
    why:'Teaching is one of the best ways to learn. It also builds a reputation, and reputations open doors.'},
   {label:'Teach it for free', hint:'Skills +3, contacts +9, happiness +3.', idea:'Giving back',
    run:s=>{ adj(s,'skills',3); adj(s,'connections',9); adj(s,'wellbeing',3); return 'Twelve students, one very grateful centre.'; },
    why:'Giving skills away costs you nothing and builds a community that supports you back.'},
   {label:'Too nervous', hint:'Nothing changes.', idea:'Comfort zone',
    run:s=>{ return 'Someone else taught it. They were fine.'; },
    why:'Scary things are often where growth lives. Not always, but often.'}]},
 {id:'ed_kidschool', cat:'Education', title:'Pick a school for your kid', text:'The local school is fine. The private one is fancy and costs ¥50,000 a month.',
  cond:s=>s.kids>0,
  choices:[
   {label:'Local school', hint:'Free. Walkable. Friends next door.', idea:'Public services',
    run:s=>{ adj(s,'wellbeing',3); adj(s,'connections',4); return 'They love it. So does your budget.'; },
    why:'Public schools are paid for by everyone\'s taxes so every child can go. That is a PUBLIC SERVICE at work.'},
   {label:'Private school', hint:'Costs +¥50,000 a month.', idea:'Paying for extras',
    run:s=>{ s.expenses+=50000; adj(s,'wellbeing',1); return 'Smaller classes, bigger bills.'; },
    why:'Paying for a private service buys extras, but the basics are already available to everyone. Whether extras are worth it is a personal call.'},
   {label:'Local school plus a weekend tutor', hint:'Costs +¥12,000.', idea:'Targeted spending',
    run:s=>{ s.expenses+=12000; adj(s,'wellbeing',3); return 'Best of both. Saturday mornings are busy now.'; },
    why:'Spending a little exactly where it helps most is often smarter than spending a lot everywhere.'}]},
 // ---------- STOCKS ----------
 {id:'st_dividend', cat:'Stocks', title:'Dividend day!', text:s=>`The companies you own paid out profits. Your share: ${Y(Math.max(5000,Math.round(s.stocks*0.02)))}.`,
  cond:s=>s.stocks>50000,
  choices:[
   {label:'Reinvest it', hint:'Buy more shares with it.', idea:'Compounding',
    run:s=>{ const d=Math.max(5000,Math.round(s.stocks*0.02)); s.stocks+=d; return `${Y(d)} went straight back in. It will earn its own dividends now.`; },
    why:'A DIVIDEND is a slice of profit paid to owners. Reinvesting it means your money earns money that earns money. That is COMPOUNDING.'},
   {label:'Take the cash', hint:'A little treat.', idea:'Income from assets',
    run:s=>{ const d=Math.max(5000,Math.round(s.stocks*0.02)); s.cash+=d; adj(s,'wellbeing',2); return `${Y(d)} in your pocket. Pizza night.`; },
    why:'Owning things that pay you is how wealth works. Dividends, rent and interest are all income you did not work extra hours for.'},
   {label:'Take it and give half away', hint:'Share the luck.', idea:'Giving',
    run:s=>{ const d=Math.max(5000,Math.round(s.stocks*0.02)); s.cash+=Math.round(d/2); adj(s,'connections',3); adj(s,'wellbeing',3); return `${Y(Math.round(d/2))} to you, ${Y(Math.round(d/2))} to the animal shelter.`; },
    why:'Money that arrives easily is the easiest money to share. Generosity is a habit, and habits start somewhere.'}]},
 {id:'st_crypto', cat:'Stocks', title:'Everyone is buying MoonCoin', text:'Your cousin says MoonCoin tripled last month. He has a laser-eyes profile picture now.',
  choices:[
   {label:'Put in ¥100,000', hint:'30% it triples. Otherwise it drops 80%.', odds:()=>0.3, idea:'Speculation',
    run:(s,hit)=>{ pay(s,100000); if(hit){ s.cash+=300000; return 'It tripled! Your cousin is unbearable.'; } s.cash+=20000; return 'MoonCoin crashed. ¥100,000 became ¥20,000. Your cousin has gone quiet.'; },
    why:'Buying something only because its price is rising is SPECULATION. Big wins are possible. Big losses are more common.'},
   {label:'Put in ¥10,000 for fun', hint:'Pocket-money sized.', odds:()=>0.3, idea:'Position sizing',
    run:(s,hit)=>{ pay(s,10000); if(hit){ s.cash+=30000; return 'Tripled! A nice dinner out.'; } s.cash+=2000; return 'It crashed, but you only lost pocket money.'; },
    why:'Risky bets are fine when they are small enough that losing does not change your life. Size matters more than the bet.'},
   {label:'Stay away', hint:'Boring and safe.', idea:'Fear of missing out',
    run:s=>{ adj(s,'wellbeing',-1); return 'You watched it go up. Then you watched it go down. Then you felt fine.'; },
    why:'Fear of missing out makes people buy at the top. Missing out on a gamble is not a loss.'}]},
 {id:'st_fee', cat:'Stocks', title:'Check your fund fees', text:'Your fund takes 2% a year in fees. A nearly identical one takes 0.2%.',
  cond:s=>s.stocks>0,
  choices:[
   {label:'Switch to the cheap fund', hint:'Keep more of your own money.', idea:'Fees',
    run:s=>{ s.stocks=Math.round(s.stocks*1.02); adj(s,'skills',2); return 'Same companies, tiny fee. Over 30 years that is a LOT of money kept.'; },
    why:'Fees sound tiny but they compound against you. 2% a year for 30 years eats almost half of your gains.'},
   {label:'Stay, the manager seems clever', hint:'Pay for expertise.', idea:'Active vs passive',
    run:s=>{ s.stocks=Math.round(s.stocks*0.99); return 'The clever manager did about the same as the market, minus fees.'; },
    why:'Most expensive fund managers do not beat a simple index over time. Paying more does not mean getting more.'},
   {label:'Ignore it', hint:'Too boring to think about.', idea:'Small leaks',
    run:s=>{ s.stocks=Math.round(s.stocks*0.98); return 'The fee quietly kept taking its slice.'; },
    why:'Small leaks sink big ships. Boring money chores are often the ones worth doing.'}]},
 {id:'st_ipo', cat:'Stocks', title:'A famous company is selling shares to the public', text:'Everyone wants a piece on day one. The price could jump. Or flop.',
  choices:[
   {label:'Buy ¥150,000 on launch day', hint:'50/50: +40% or −35%.', odds:()=>0.5, idea:'IPO',
    run:(s,hit)=>{ pay(s,150000); s.stocksCost+=150000; s.stocks+=hit?210000:97500; return hit?'It popped 40% by lunchtime.':'It dropped 35% by lunchtime. Day one is a coin flip.'; },
    why:'When a company first sells shares (an IPO), nobody knows the right price yet. Day-one moves are mostly noise.'},
   {label:'Wait a year and see', hint:'Let the dust settle.', idea:'Patience',
    run:s=>{ adj(s,'skills',1); return 'A year later the price made more sense, and so did your decision.'; },
    why:'Waiting costs you the chance of a quick pop but saves you from the hype. Patience is cheap.'},
   {label:'Buy a little through your index fund', hint:'It joins the basket automatically.', idea:'Diversification',
    run:s=>{ const m=Math.min(50000,s.savings); s.savings-=m; s.stocks+=m; s.stocksCost+=m; return `Your fund owns a sliver of it now, with ${Y(m)} more invested.`; },
    why:'An index fund buys a bit of everything, including the hot new company, without betting the farm on it.'}]},
 {id:'st_bond', cat:'Stocks', title:'Safe and boring bonds', text:'The government offers bonds: lend them money, get 3% a year, guaranteed.',
  choices:[
   {label:'Put ¥300,000 in bonds', hint:'Safe. Slow.', idea:'Bonds',
    run:s=>{ const m=Math.min(300000,s.savings); s.savings-=m; s.stocks+=m; s.stocksCost+=m; return `${Y(m)} lent to the government. They pay you back with interest.`; },
    why:'A BOND is a loan you give. Government bonds are about the safest investment there is, which is why they pay less than shares.'},
   {label:'Shares instead, more risk, more hope', hint:'Same money, bumpier ride.', idea:'Risk and return',
    run:s=>{ const m=Math.min(300000,s.savings); s.savings-=m; s.stocks+=m; s.stocksCost+=m; return `${Y(m)} into the index fund.`; },
    why:'Higher possible returns always come with higher possible losses. There is no free lunch.'},
   {label:'Half and half', hint:'Balance.', idea:'Asset mix',
    run:s=>{ const m=Math.min(300000,s.savings); s.savings-=m; s.stocks+=m; s.stocksCost+=m; adj(s,'skills',1); return `${Y(m)} split between safe bonds and bumpy shares.`; },
    why:'Mixing safe and risky investments smooths the ride. How you mix depends on how soon you need the money.'}]},
 {id:'st_panic', cat:'Stocks', title:'Your friend sold EVERYTHING', text:'Shares dipped 8% and your friend panicked and sold it all. They want you to do the same.',
  cond:s=>s.stocks>0,
  choices:[
   {label:'Check your plan and stay calm', hint:'Hold.', idea:'Plans beat feelings',
    run:s=>{ adj(s,'skills',2); return 'You read your own notes: "Do not sell on dips." You did not.'; },
    why:'Writing your plan down when calm protects you from yourself when scared. Markets wobble. Plans should not.'},
   {label:'Sell too', hint:'Lock in the 8% loss.', idea:'Panic selling',
    run:s=>{ s.stocks=Math.round(s.stocks*0.92); s.stats.investNet+=s.stocks-s.stocksCost; s.savings+=s.stocks; s.stocks=0; s.stocksCost=0; return 'Sold at the bottom. It recovered the next month.'; },
    why:'Fear sells low. Then prices recover and fear buys back high. Panic is expensive.'},
   {label:'Buy a bit more while it is cheap', hint:'¥30,000.', idea:'Buy the dip',
    run:s=>{ const src=pay(s,30000); s.stocks+=30000; s.stocksCost+=30000; return `Paid from ${src}. A small dip became a small discount.`; },
    why:'For someone with spare cash and a long time horizon, a dip is a sale. For someone stretched, it is a danger.'}]},
 // ---------- ASSETS ----------
 {id:'as_home', cat:'Assets', title:'Buy a home?', text:'A small flat is for sale: ¥12,000,000. You need a ¥1,200,000 deposit. The rest is a 30-year loan.',
  cond:s=>!s.home && s.cash+s.savings>=1200000,
  choices:[
   {label:'Buy it', hint:'Deposit ¥1,200,000. Rent stops, loan starts.', idea:'Mortgage',
    run:s=>{ const src=buyHome(s,12000000); adj(s,'wellbeing',6); return `Deposit paid from ${src}. You own a home and owe the bank ¥10,800,000.`; },
    why:'A MORTGAGE is a huge loan for a home. You stop paying rent but start paying interest. The home can gain or lose value.'},
   {label:'Buy a smaller place', hint:'¥8,000,000. Deposit ¥800,000.', idea:'Living within means',
    run:s=>{ const src=buyHome(s,8000000); adj(s,'wellbeing',4); return `Deposit paid from ${src}. Cosy, and a smaller loan.`; },
    why:'A smaller loan means smaller payments and less risk if rates rise. Bigger is not always better.'},
   {label:'Keep renting', hint:'Flexible. No loan.', idea:'Renting vs buying',
    run:s=>'You kept your deposit money invested instead.',
    why:'Renting is not throwing money away. It buys flexibility and avoids repair bills. Whether buying wins depends on prices, rates and how long you stay.'}]},
 {id:'as_sellhome', cat:'Assets', title:'An offer on your home', text:s=>`Someone wants to buy your place for ${Y(Math.round(s.home.value*1.08))}, 8% above what it is worth.`,
  cond:s=>s.home && s.year>=3,
  choices:[
   {label:'Sell and go back to renting', hint:'Cash out. Rent again.', idea:'Realising gains',
    run:s=>{ const got=sellHome(s,1.08); return `Sold! ${Y(got)} after paying off the loan.`; },
    why:'Gains on paper become real only when you sell. Then the question becomes: where do you live now?'},
   {label:'Keep living there', hint:'It is home.', idea:'Use value',
    run:s=>{ adj(s,'wellbeing',2); return 'Not everything is for sale.'; },
    why:'A home is an asset AND a place to live. Its value to you can be more than its price.'},
   {label:'Sell and buy a bigger one', hint:'Needs the gain as deposit.', idea:'Trading up',
    run:s=>{ const got=sellHome(s,1.08); if(got>=1600000){ s.savings-=0; const src=buyHome(s,16000000); return `Sold for a gain, then bought bigger. New loan: ¥14,400,000.`; } return `Sold for ${Y(got)}, but not enough for a bigger deposit. Renting for now.`; },
    why:'Trading up means a bigger loan too. More house, more risk, more interest.'}]},
 {id:'as_bike', cat:'Assets', title:'A good bicycle', text:'¥60,000 for a sturdy bike. You could ride to work instead of taking the bus.',
  choices:[
   {label:'Buy it', hint:'Costs −¥5,000 a month, happiness +3.', idea:'Payback period',
    run:s=>{ pay(s,60000); s.expenses-=5000; adj(s,'wellbeing',3); return 'It pays for itself in a year. Your legs are thrilled.'; },
    why:'Divide the price by what it saves each month and you get the PAYBACK PERIOD. Twelve months is a great deal.'},
   {label:'Buy a cheap one', hint:'¥15,000, breaks within a year.', idea:'Buy it nice or buy it twice',
    run:s=>{ pay(s,15000); s.expenses-=5000; adj(s,'wellbeing',1); pay(s,15000); return 'The chain snapped in spring. You bought another cheap one.'; },
    why:'Cheap things that break are often dearer than good things that last.'},
   {label:'Keep taking the bus', hint:'No change.', idea:'Status quo',
    run:s=>'The bus is fine.',
    why:'Doing nothing is comfortable. It is still a choice with a cost you just do not see.'}]},
 {id:'as_solar', cat:'Assets', title:'Solar panels', text:s=>s.home?'Panels on your roof cost ¥600,000 and cut bills by ¥8,000 a month.':'Your landlord will not allow panels, but a community solar share costs ¥100,000 and pays ¥1,500 a month.',
  choices:[
   {label:s=>s.home?'Install them':'Buy a community share', hint:s=>s.home?'¥600,000 now, −¥8,000 a month.':'¥100,000 now, +¥1,500 a month.', idea:'Long-term investment',
    run:s=>{ if(s.home){ const src=pay(s,600000); s.expenses-=8000; return `Paid from ${src}. Free electricity on sunny days.`; } const src=pay(s,100000); s.income+=1500; return `Paid from ${src}. A little sunshine money each month.`; },
    why:'Some investments take years to pay back. Whether they are worth it depends on how long you will be around to collect.'},
   {label:'Wait for prices to fall', hint:'They usually do.', idea:'Technology gets cheaper',
    run:s=>{ adj(s,'skills',1); return 'Panels got 15% cheaper the next year. Waiting had a cost too: a year of bills.'; },
    why:'New technology gets cheaper over time. Waiting saves money but delays the benefit. Both are costs.'},
   {label:'Not interested', hint:'Nothing changes.', idea:'Choice',
    run:s=>'You stuck with the grid.',
    why:'Not every good investment suits every person. Cash on hand matters too.'}]},
 {id:'as_phone', cat:'Assets', title:'New phone?', text:'Your phone works but the new one is SHINY. ¥150,000.',
  choices:[
   {label:'Buy it outright', hint:'¥150,000, happiness +4.', idea:'Wants vs needs',
    run:s=>{ pay(s,150000); adj(s,'wellbeing',4); return 'So shiny. For about three weeks.'; },
    why:'A NEED keeps you safe and working. A WANT makes you smile. Both are fine. Knowing which is which keeps budgets honest.'},
   {label:'Buy it on a 24-month plan', hint:'+¥7,500 a month, costs more overall.', idea:'Instalments',
    run:s=>{ s.expenses+=7500; adj(s,'wellbeing',4); return 'Small monthly payments. ¥180,000 total by the end.'; },
    why:'Paying monthly feels cheap but usually costs more in total. The convenience is the product they are selling.'},
   {label:'Keep the old one', hint:'It works.', idea:'Contentment',
    run:s=>{ adj(s,'wellbeing',-1); adj(s,'skills',1); return 'Cracked screen, full wallet.'; },
    why:'Being happy with what works is a quiet money superpower.'}]},
 {id:'as_furniture', cat:'Assets', title:'Furnish the flat', text:'Your place is a mattress and a lamp. Time to make it a home.',
  choices:[
   {label:'Buy everything new', hint:'¥250,000, happiness +6.', idea:'Big-ticket spending',
    run:s=>{ pay(s,250000); adj(s,'wellbeing',6); return 'It looks like a magazine. Smells like cardboard.'; },
    why:'Big purchases feel good fast. The question is what else that money could have done.'},
   {label:'Second-hand and a lick of paint', hint:'¥60,000, happiness +5.', idea:'Value',
    run:s=>{ pay(s,60000); adj(s,'wellbeing',5); adj(s,'skills',2); return 'A charity-shop sofa and a Saturday of painting. Oddly proud.'; },
    why:'Used things lose most of their price but almost none of their usefulness. That gap is where savvy shoppers live.'},
   {label:'Build it yourself', hint:'¥30,000 in wood. Odds depend on skills.', odds:s=>0.4+s.skills/250, idea:'Sweat equity',
    run:(s,hit)=>{ pay(s,30000); if(hit){ adj(s,'wellbeing',7); adj(s,'skills',4); return 'A bookshelf, a table, a bench. Friends ask where you bought them.'; } adj(s,'wellbeing',-2); pay(s,40000); return 'The table wobbles. Badly. You bought a second-hand one in the end.'; },
    why:'Your own time and effort can replace money. That is SWEAT EQUITY. It works best when you have the skills.'}]},
 {id:'as_rental', cat:'Assets', title:'Buy a flat to rent out?', text:'A tiny flat near the station costs ¥6,000,000. Tenants would pay ¥55,000 a month.',
  cond:s=>s.savings>=1500000 && s.year>=3,
  choices:[
   {label:'Buy it with a ¥1,500,000 deposit', hint:'Rent income, loan payments, repairs.', idea:'Rental income',
    run:s=>{ s.savings-=1500000; s.debt+=4500000; s.income+=55000; s.expenses+=35000; adj(s,'skills',2); return 'You are a landlord now. Rent in, loan and repairs out. Net +¥20,000 a month.'; },
    why:'Property can pay you rent every month. But loans, empty months and leaking roofs all come with it.'},
   {label:'Put the money in an index fund instead', hint:'Less hassle, no tenants.', idea:'Hassle has a price',
    run:s=>{ s.savings-=1500000; s.stocks+=1500000; s.stocksCost+=1500000; return 'No tenants calling at midnight about the boiler.'; },
    why:'Investments differ in effort as well as returns. Your time is part of the maths.'},
   {label:'Not now', hint:'Keep the cushion.', idea:'Liquidity',
    run:s=>'A big safety fund felt better than a tiny flat.',
    why:'LIQUIDITY means how fast you can turn something into cash. A flat is slow; savings are instant. Cushions need to be liquid.'}]},
 {id:'as_pet_emergency', cat:'Assets', title:'The vet bill', text:'Professor Whiskers ate a sock. Surgery: ¥120,000.',
  cond:s=>s.pets>0,
  choices:[
   {label:'Pay for the surgery', hint:'¥120,000.', idea:'Unplanned costs',
    run:s=>{ const src=pay(s,120000); adj(s,'wellbeing',4); return `Paid from ${src}. Sock removed. Cat unrepentant.`; },
    why:'Living things come with surprise bills. An emergency fund is for exactly this.'},
   {label:'Pet insurance would have been nice', hint:'Pay, then sign up: +¥2,000 a month.', idea:'Learning from bills',
    run:s=>{ pay(s,120000); s.expenses+=2000; return 'Expensive lesson. Next sock is covered.'; },
    why:'Insurance is cheapest before the thing happens. After is when people finally buy it.'},
   {label:'Ask the vet for a payment plan', hint:'Spread it out with interest.', idea:'Credit',
    run:s=>{ s.debt+=120000; s.stats.borrowed++; return 'Twelve monthly payments plus a bit of interest.'; },
    why:'Spreading a cost helps when cash is short, but interest makes the sock cost more than it needs to.'}]},
 // ---------- MORE WILD CARDS ----------
 {id:'w_dragon', cat:'Events', wild:true, title:'A dragon moved into the mountain', text:'It is charging the whole town 2% "mountain rent" on everything. The mayor is sweating.',
  choices:[
   {label:'Pay the dragon', hint:'Costs +¥6,000 a month.', idea:'Monopoly',
    run:s=>{ s.expenses+=6000; return 'Everyone pays. The dragon buys a yacht.'; },
    why:'When one seller controls something everyone needs, that is a MONOPOLY. Monopolies can charge almost whatever they like.'},
   {label:'Organise the town to say no together', hint:'Odds depend on contacts.', odds:s=>0.3+s.connections/150, idea:'Collective action',
    run:(s,hit)=>{ if(hit){ adj(s,'connections',12); adj(s,'wellbeing',5); return 'Nobody paid. The dragon sulked and moved to a different mountain.'; } s.expenses+=6000; adj(s,'connections',4); return 'Half the town paid anyway. The dragon stayed. You made friends trying.'; },
    why:'One person cannot stop a dragon or a monopoly. Everybody together can. That is COLLECTIVE ACTION, and it is hard to organise.'},
   {label:'Sell dragon-proof umbrellas', hint:'Opportunity in chaos.', odds:s=>0.4+s.skills/300, idea:'Entrepreneurship',
    run:(s,hit)=>{ pay(s,40000); if(hit){ s.cash+=200000; return 'Everyone bought one. They do not work, but everyone bought one.'; } return 'The dragon bought your whole stock and burned it. Rude.'; },
    why:'Every strange situation creates new needs. Entrepreneurs spot them first, and sometimes get burned.'}]},
 {id:'w_timeloop', cat:'Events', wild:true, title:'You are stuck in a time loop', text:'It is Tuesday. Again. For the fortieth time. Nobody else notices.',
  choices:[
   {label:'Use the loops to practise skills', hint:'Skills +15, happiness −5.', idea:'Deliberate practice',
    run:s=>{ adj(s,'skills',15); adj(s,'wellbeing',-5); return 'You learned piano, pottery and Portuguese. Tuesday finally ended.'; },
    why:'Skill grows with focused repetition. Most people never get forty tries at the same day; the ones who practise anyway win.'},
   {label:'Use the loops to learn tomorrow\'s share prices', hint:'Wait, you cannot see tomorrow in a loop.', idea:'No shortcuts',
    run:s=>{ adj(s,'wellbeing',-8); return 'Tuesday never becomes Wednesday. You learned nothing about Wednesday. Forty wasted Tuesdays.'; },
    why:'Even in a time loop there is no way to know the future. Nobody gets tomorrow\'s prices. Anyone who says they do is selling something.'},
   {label:'Spend every loop being kind to people', hint:'Contacts +15.', idea:'Reputation compounds',
    run:s=>{ adj(s,'connections',15); adj(s,'wellbeing',6); return 'When Wednesday came, the whole town somehow liked you a lot.'; },
    why:'Small kindnesses compound like interest. They are rarely repaid at once, but they are repaid.'}]},
 {id:'w_goldrush', cat:'Events', wild:true, title:'GOLD in the river!', text:'A kid found a nugget. By lunchtime, 3,000 people are standing in the river with pans.',
  choices:[
   {label:'Grab a pan and join them', hint:'10% you find gold.', odds:()=>0.1, idea:'Crowded trades',
    run:(s,hit)=>{ pay(s,15000); adj(s,'wellbeing',-2); if(hit){ s.cash+=400000; return 'A nugget the size of a walnut! Cold feet, warm wallet.'; } return 'Three weeks of cold feet and one shiny pebble.'; },
    why:'When thousands chase the same prize, each person\'s chance shrinks. By the time everyone knows, the easy gold is gone.'},
   {label:'Sell pans, boots and hot soup', hint:'Serve the crowd.', odds:s=>0.6+s.connections/400, idea:'Picks and shovels',
    run:(s,hit)=>{ pay(s,50000); if(hit){ s.cash+=260000; return 'Pans at ¥3,000 each. Soup at ¥800. You sold out twice.'; } s.cash+=40000; return 'The rush ended early. You still sold some soup.'; },
    why:'In most gold rushes, the people who got rich sold the shovels. Serving a crowd is often safer than joining it.'},
   {label:'Stay home', hint:'Watch it on the news.', idea:'Opting out',
    run:s=>{ adj(s,'wellbeing',1); return 'The river was very crowded. Your sofa was not.'; },
    why:'Not chasing every rush is a strategy too. Most rushes end with most people having lost a little.'}]},
 {id:'w_robotstrike', cat:'Events', wild:true, title:'The robots went on strike', text:'Every robot in town stopped. They want Tuesdays off. Deliveries, factories and the sandwich shop are all frozen.',
  choices:[
   {label:'Fill in for a robot', hint:'+¥60,000 this season, tiring.', idea:'Labour shortage',
    run:s=>{ s.cash+=60000; adj(s,'wellbeing',-5); return 'You delivered 600 parcels. Your legs filed a complaint.'; },

function makeLandmarks(count){ const n=Math.max(7,Math.floor(count/14)); LANDMARKS=[[0,'START',LM_COLOR.START]]; for(let k=0;k<n;k++){ const label=LM_CYCLE[k%LM_CYCLE.length]; LANDMARKS.push([(k+1)/(n+1),label,LM_COLOR[label]]); } LANDMARKS.push([1,'RETIREMENT',LM_COLOR.RETIREMENT]); }

const SPACING=1.8, ROWGAP=7.5, MARGIN=8;
function buildTrack(count,seed){
  makeLandmarks(count);
  const prng=mulberry32(seed), rows=Math.max(3,Math.round(Math.sqrt(count/4))), perRow=count/rows, spanX=perRow*SPACING, gap=ROWGAP;
  const pts=[]; const n=Math.max(6,Math.round(perRow/3));
  for(let r=0;r<rows;r++){ const z=-((rows-1)*gap)/2+r*gap;
    for(let i=0;i<=n;i++){ let x=-spanX/2+i*(spanX/n); if(r%2) x=-x; pts.push(new THREE.Vector3(x,0,z+(i>0&&i<n?(prng()-0.5)*1.6:0))); } }
  curve=new THREE.CatmullRomCurve3(pts,false,'catmullrom',0.5);
  const sp=curve.getSpacedPoints(count-1);
  TILES=sp.map((p,i)=>{ const f=i/(count-1); let zone=LANDMARKS[0]; for(const L of LANDMARKS) if(Math.abs(L[0]-f)<Math.abs(zone[0]-f)) zone=L;
    const w=ZONE_WEIGHTS[zone[1]]; const tot=Object.values(w).reduce((x,y)=>x+y,0); let r=prng()*tot, cat='Events'; for(const k in w){ r-=w[k]; if(r<=0){cat=k;break;} }
    if(i===0||i===count-1||(i%6===0)) cat='Payday'; else if(i%9===4) cat='Chance'; return {x:p.x,z:p.z,cat,zone:zone[1],special:i===count-1?'RETIREMENT':null}; });
  LANDMARKS.forEach(L=>{ L[3]=Math.round(L[0]*(count-1)); });
  BOARD={w:spanX+MARGIN*2,d:(rows-1)*gap+MARGIN*2};
}

    list.forEach(([x,z,s,v],i)=>{ M.makeScale(s*(sfn?sfn(v):1),s,s*(sfn?sfn(v):1)); M.setPosition(x,yfn(s),z); m.setMatrixAt(i,M); m.setColorAt(i,c.setHex(colors[Math.floor(v*colors.length)%colors.length])); });
    m.castShadow=true; m.receiveShadow=true; m.instanceMatrix.needsUpdate=true; if(m.instanceColor) m.instanceColor.needsUpdate=true; world.add(m); };
  mk(INST.trunk,new THREE.CylinderGeometry(0.07,0.1,0.5,6),[0x7a4b2a],s=>0.25*s);
  mk(INST.canopy,new THREE.SphereGeometry(0.42,9,7),[0x3f9b45,0x59b24f,0x2f8a3e,0x6cbf4a],s=>0.72*s,v=>0.9+v*0.3);
  mk(INST.pine,new THREE.ConeGeometry(0.4,1.2,7),[0x2f8a3e,0x247a35,0x3a9448],s=>0.6*s);
  mk(INST.bush,new THREE.SphereGeometry(0.3,8,6),[0x4fae5c,0x6cbf4a,0xd9a3b8],s=>0.18*s);

async function spin(value){
  const i=WEDGES.indexOf(value);
  // pointer sits at -90°; wedge i lands under it when angle = -90° - i*45° (plus a little wobble within the wedge)
  const wobble=(Math.random()-0.5)*(Math.PI/4)*0.6;
  const target=-Math.PI/2 - i*Math.PI/4 + wobble;
  const start=((bigAngle%(Math.PI*2))+Math.PI*2)%(Math.PI*2);
  let end=target; while(end<start+Math.PI*2*4) end+=Math.PI*2;   // at least four full turns
  const wheelStart=wheel.rotation.y, wheelEnd=wedgeRotationFor(value)+Math.PI*2*5;
  spinResult.className='spinResult show'; spinResult.innerHTML='<span class="getlucky">GET LUCKY</span>'; drawBigWheel(start); spinOverlay.classList.add('show');
  let lastWedge=-1;
  await tween(2400,t=>{ bigAngle=start+(end-start)*t; drawBigWheel(bigAngle); wheel.rotation.y=wheelStart+(wheelEnd-wheelStart)*t;
    const w=Math.floor(((-Math.PI/2-bigAngle)/(Math.PI/4)+0.5+1e-6)); if(w!==lastWedge){ lastWedge=w; SFX.tone(1100,0.025,'square',0.02); } },easeOutStrong);

  await tween(1400,()=>{});
  spinOverlay.classList.remove('show');
  await tween(250,()=>{});
}

let S=null, rng=null, selected={mode:'quick', profile:null}, busy=false;
const TRACK_LEN=years=>Math.round(years*4*4.5+6);

function pickCard(s,cat){
  const wantWild=cat==='Events'&&rng()<0.35; const fits=c=>cat==='Events'?((c.cat==='Events'||c.cat==='Economy')&&(wantWild?!!c.wild:!c.wild)):c.cat===cat;
  let pool=CARDS.filter(c=>fits(c) && !s.used.includes(c.id) && (!c.cond||c.cond(s)));
  if(!pool.length){ pool=CARDS.filter(c=>fits(c) && (!c.cond||c.cond(s))); s.used=s.used.filter(id=>!fits(CARDS.find(c=>c.id===id))); }
  if(!pool.length) pool=CARDS.filter(c=>!c.cond||c.cond(s));
  // feedback loops: poor health or age makes health events more common; an affordable home shows up more often
  const HEALTH=['medical','e_healthscare','e_checkup']; const hp=pool.filter(c=>HEALTH.includes(c.id));
  if(cat==='Events'&&hp.length&&(s.wellbeing<40||s.age>=50)&&rng()<(s.wellbeing<35?0.5:0.3)) return hp[Math.floor(rng()*hp.length)];
  if(cat==='Assets'&&!s.home&&pool.some(c=>c.id==='as_home')&&mortgageCheck(s,8000000).ok&&rng()<0.35) return pool.find(c=>c.id==='as_home');
  return pool[Math.floor(rng()*pool.length)];
}
function startGame(eduId){
  careerOpen=false; const mode=MODES.find(m=>m.id===selected.mode), profile=PROFILES.find(p=>p.id===selected.profile);
  const seed = mode.fixedSeed ? 20261022 : Math.floor(Math.random()*1e9);
  S=newState(profile,mode,seed); rng=mulberry32(seed); S.pos=0; S.phase='roll'; S.track=TRACK_LEN(mode.years);
  S.hist=[{t:0,age:S.age,nw:netWorth(S),sav:S.cash+S.savings,stk:0,home:0,debt:S.debt,inc:S.income,exp:S.expenses,wb:S.wellbeing,sk:S.skills}]; S.gambles=[]; S.strat={saver:0,investor:0,learner:0,community:0,enjoyer:0,bold:0};
  if(mode.shock) S.used.push('recession');
  S.used.push('joblost'); if(eduId&&eduId!=='none') enrol(S,eduId);
  buildWorld(S.track, mode.fixedSeed?seed:seed%1000); dressPawn(profile.id); pawn.visible=true; placePawn(0);
  zoomBase=innerWidth<=760?19:21; resize(); autoCam=true; walkIdx=0; { const hd=headingAt(0); yaw=hd?Math.atan2(-hd.x,-hd.z):0.35; } pitch=CAM_PITCH; panOff.set(0,0,0); camAim.copy(pawn.position);
  render();
}
async function takeTurn(){
  if(busy) return; busy=true; const s=S; s.studyPaused=!!s.studying;
  if(s.turn===4) s.used=s.used.filter(id=>id!=='joblost');
  const value=1+Math.floor(rng()*8);
  s.phase='rolling'; render(); panOff.set(0,0,0); autoCam=true; walkIdx=s.pos; SFX.spin();
  await spin(value); s.lastSpin=value; renderBottom(s); popText('Spun '+value,'#fff6dc','#1e2a2c');
  let dest=Math.min(s.track-1, s.pos+value); for(let i=s.pos+1;i<=dest;i++){ if(TILES[i].cat==='Payday'&&i<s.track-1){ dest=i; break; } } s.stoppedAtPayday=dest<s.pos+value&&dest<s.track-1;
  await hop(s.pos,dest); s.pos=dest; placePawn(s.pos);
  const tile=TILES[s.pos]; const lm=LANDMARKS.find(L=>Math.abs(L[3]-s.pos)<=1&&L[1]!=='START'&&L[1]!=='RETIREMENT'); if(lm) showInfo({label:lm[1]});
  if(tile.special==='RETIREMENT'){ SFX.win(); finishYear({cat:'Payday',title:'Retirement!',text:'You reached the end of the path.'},null,null,'You made it to the beach house. Time to look back at the life you lived.','Retirement is paid for by everything you saved, earned and built in all the years before.'); }
  else if(tile.cat==='Payday'){ finishYear({cat:'Payday',title:'Payday!',text:'Everyone stops here.'},null,null,(s.stoppedAtPayday?'Everyone stops at Payday. ':'')+'You got paid, paid your bills, and life rolled on. Quiet seasons are when savings quietly grow.','Most seasons are ordinary. That is when interest and good habits do their work in the background.'); }
  else if(tile.cat==='Chance'){ const pool=CHANCE.filter(c=>(!c.cond||c.cond(s))&&(c.season===undefined||c.season===s.turn%4)); const c=pool[Math.floor(rng()*pool.length)]; c.f(s); finishYear({cat:'Chance',title:'Chance!',text:''},null,null,c.t,'Little surprises, good and bad, happen to everyone. A cushion makes the bad ones small and the good ones fun.'); }
  else { s.current=pickCard(s,tile.cat); s.used.push(s.current.id); s.phase='event'; SFX.card(); if(isPhone()) statsOpen=false; }
  busy=false; render();
}
function snapFull(s){ return {cash:s.cash,savings:s.savings,debt:s.debt,income:s.income,expenses:s.expenses,skills:s.skills,wellbeing:s.wellbeing,connections:s.connections,stocks:s.stocks,sec:security(s),opp:opportunity(s),nw:netWorth(s),home:s.home?1:0}; }
function finishYear(card,choice,roll,text,why){
  const s=S;
  const snap=()=>snapFull(s);
  const before=s.outcomeBefore||snap(); const mid=snap();
  // strategy profile: which kind of move was this?
  s.strat=s.strat||{saver:0,investor:0,learner:0,community:0,enjoyer:0,bold:0}; s.gambles=s.gambles||[]; s.hist=s.hist||[];
  if(choice){ const dS=mid.skills-before.skills, dC=mid.connections-before.connections, dW=mid.wellbeing-before.wellbeing, dM=(mid.cash+mid.savings+mid.stocks)-(before.cash+before.savings+before.stocks), dI=mid.stocks-before.stocks;
    if(roll) s.strat.bold++; if(dS>0) s.strat.learner++; if(dC>0) s.strat.community++; if(dW>0) s.strat.enjoyer++; if(dI>0||mid.home>before.home||(s.monthlyInvest>0&&card.id==='regular')) s.strat.investor++; if(!roll&&dM>=0&&dI<=0) s.strat.saver++;
    if(roll){ const lbl0=typeof choice.label==='function'?choice.label(s):choice.label; s.gambles.push({turn:s.turn,age:s.age,p:roll.p,hit:roll.hit,gain:(mid.nw-before.nw)+(mid.income-before.income)*12-(mid.expenses-before.expenses)*12,label:lbl0,idea:choice.idea||''}); } }
  if(s.safetyNet && !s.employed) s.cash+=s.expenses*2;
  const ledger=passYear(s,rng);
  let found=false; if(!s.employed&&!s.studying){ if(rng()<0.25+opportunity(s)/300){ s.employed=true; const options=JOBS.filter(j=>canApply(s,j)).sort((a,b)=>a.pay-b.pay); const j=options[options.length-1]||JOBS[0]; s.job=j.id; s.income=j.pay; s.jobsHeld++; found=true; } }
  const after=snap(); s.outcome={card,choice,roll,text,why,before,after,ledger,found}; s.outcomeBefore=null;
  s.hist.push({t:s.turn,age:s.age,season:SEASONS[(s.turn-1+4)%4],nw:after.nw,sav:s.cash+s.savings,stk:s.stocks,home:s.home?s.home.value-s.home.loan:0,debt:s.debt,inc:s.employed?s.income:0,exp:s.expenses,wb:s.wellbeing,sk:s.skills,note:(card.cat==='Payday'||card.cat==='Chance')?(card.cat==='Chance'?'Chance: '+text:'Quiet season'):(card.title+' → '+(choice?(typeof choice.label==='function'?choice.label(s):choice.label):'')),kind:choice?(roll?'gamble':'choice'):'none',hit:roll?roll.hit:null,gain:after.nw-before.nw});
  if(roll){ roll.hit?SFX.good():SFX.bad(); } else if(after.cash+after.savings>before.cash+before.savings+1000) SFX.coin();
  popDeltas(before,after);
  const lbl=choice?(typeof choice.label==='function'?choice.label(s):choice.label):'—';
  s.log.push({age:s.age,season:SEASONS[(s.turn-1+4)%4],title:card.title,choice:lbl,hit:roll?roll.hit:null});
  s.phase='outcome';
}
function choose(i){
  const s=S, card=s.current, ch=card.choices[i];
  s.outcomeBefore=snapFull(s);
  let roll=null;
  if(ch.odds){ const p=clamp(ch.odds(s),0.05,0.95); roll={p,hit:rng()<p}; s.stats.rolls++; if(roll.hit)s.stats.hits++; }
  const text=ch.run(s, roll?roll.hit:undefined);
  finishYear(card,ch,roll,text,ch.why);
  render();
}

function popText(text,bg='#ffffff',fg='#1e2a2c',delay=0){ if(!pawn.visible) return; const sp=textSprite(text,{size:0.55,bg,fg}); sp.material.opacity=0; const x=(Math.random()-0.5)*0.8; sp.position.set(pawn.position.x+x,pawn.position.y+1.5,pawn.position.z); world.add(sp);
  setTimeout(()=>{ tween(1700,t=>{ sp.position.y=pawn.position.y+1.5+t*1.6; sp.material.opacity=t<0.15?t/0.15:1-Math.max(0,(t-0.55)/0.45); }).then(()=>{ world.remove(sp); sp.material.map.dispose(); sp.material.dispose(); }); },delay); }
function popDeltas(b,a){ let k=0; const q=[]; const dCash=(a.cash+a.savings)-(b.cash+b.savings); if(Math.abs(dCash)>=1000) q.push([(dCash>0?'+':'')+Y(dCash),dCash>0?'#d8f3e3':'#ffd9d6',dCash>0?'#1f6b45':'#8a1f19']);
  if(a.debt>b.debt) q.push(['Debt +'+Y(a.debt-b.debt),'#ffd9d6','#8a1f19']); else if(a.debt<b.debt) q.push(['Debt −'+Y(b.debt-a.debt),'#d8f3e3','#1f6b45']);
  const dw=Math.round(a.wellbeing-b.wellbeing); if(dw) q.push(['Happiness '+(dw>0?'+':'')+dw,dw>0?'#d8f3e3':'#ffd9d6',dw>0?'#1f6b45':'#8a1f19']);
  const ds=Math.round(a.skills-b.skills); if(ds) q.push(['Skills '+(ds>0?'+':'')+ds,'#efe3ff','#4b2a7a']);
  const dc=Math.round(a.connections-b.connections); if(dc) q.push(['Friends '+(dc>0?'+':'')+dc,'#e3f0ff','#1f3d6b']);
  q.slice(0,4).forEach(([t,bg,fg])=>{ popText(t,bg,fg,k*260); k++; }); }

 ['Diversification','Owning many companies instead of one. If one fails, the rest cushion you.'],

// animated numbers: remember what each chip last showed and count from there
const lastShown={};
function Yshort(n){ const r=RATES[CUR]; const v=Math.round(n*r.rate); const a=Math.abs(v); const s=a>=1e9?(a/1e9).toFixed(a<1e10?1:0)+'B':a>=1e6?(a/1e6).toFixed(a<1e7?1:0)+'M':a>=1e4?Math.round(a/1e3)+'K':String(a); return (v<0?'−':'')+r.sym+s; }
function animNum(el,key,value){ if(!el) return; const from=lastShown[key]??value; lastShown[key]=value; const fmt=isPhone()?Yshort:Y; if(from===value){ el.textContent=fmt(value); return; } const t0=performance.now(), dur=600; const step=now=>{ const t=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-t,3); el.textContent=fmt(Math.round(from+(value-from)*e)); if(t<1) requestAnimationFrame(step); }; requestAnimationFrame(step); }

// ---------- study, jobs & home ----------
function snapOf(s){ return snapFull(s); }
function enrol(s,edId){ const ed=EDU.find(e=>e.id===edId); if(!ed||!ed.years) return; s.studying={id:ed.id,left:ed.years*4,total:ed.years*4}; }
function studyYear(){ const s=S; if(!s.studying||busy) return; const ed=EDU.find(e=>e.id===s.studying.id); const cost=Math.round(tuition(s,ed)/s.studying.total);
  const before=snapOf(s);
  const src=pay(s,cost); s.stats.educationSpent+=cost; adj(s,'skills',Math.round(ed.skills/s.studying.total)); adj(s,'wellbeing',-1); adj(s,'connections',1);

function drawMinimap(s){ const c=document.getElementById('minimap'); if(!c||!TILES.length) return; const g=c.getContext('2d'); const W=c.width,H=c.height; g.clearRect(0,0,W,H);

  const pad=12, sc=Math.min((W-pad*2)/Math.max(1,x1-x0),(H-pad*2)/Math.max(1,z1-z0)); const mx=x=>pad+(x-x0)*sc+((W-pad*2)-(x1-x0)*sc)/2, mz=z=>pad+(z-z0)*sc+((H-pad*2)-(z1-z0)*sc)/2;
  g.lineWidth=3; g.lineCap='round'; g.lineJoin='round'; g.strokeStyle='rgba(243,233,210,.45)'; g.beginPath(); TILES.forEach((t,i)=>{ i?g.lineTo(mx(t.x),mz(t.z)):g.moveTo(mx(t.x),mz(t.z)); }); g.stroke();
  g.strokeStyle='#f2b53a'; g.beginPath(); TILES.slice(0,s.pos+1).forEach((t,i)=>{ i?g.lineTo(mx(t.x),mz(t.z)):g.moveTo(mx(t.x),mz(t.z)); }); g.stroke();
  for(const L of LANDMARKS){ const t=TILES[L[3]]; if(!t) continue; g.fillStyle='#'+L[2].toString(16).padStart(6,'0'); g.beginPath(); g.arc(mx(t.x),mz(t.z),2.5,0,Math.PI*2); g.fill(); }

}

        ${L.intSave?`<span>Interest on savings</span><span class="num">+${Y(L.intSave)}</span>`:''}
        ${L.intDebt?`<span>Interest on debt${debtPenalty(s)?' (risky-borrower rate)':''}</span><span class="num">−${Y(L.intDebt)}</span>`:''}
        ${L.mort?`<span>Home loan payment</span><span class="num">−${Y(L.mort)}</span>`:''}
        ${(s.stocks||b.stocks)?`<span>Your shares moved</span><span class="num">${(L.mkt*100).toFixed(0)}%</span>`:''}
        <span class="total">Left over this season</span><span class="num total">${Y(L.flow)}</span></div></details>
      <div class="deltas">${d('Wallet',b.cash,a.cash,true)}${d('Savings',b.savings,a.savings,true)}${a.debt!==b.debt?`<span class="delta ${a.debt<b.debt?'up':'down'}">Debt ${a.debt>b.debt?'+':'−'}${Y(Math.abs(a.debt-b.debt))}</span>`:''}</div>
      <div class="row"><button class="gbtn gold big" id="next">${s.pos>=s.track-1?'See your life story ▶':'Continue ▶'}</button></div></div></section>`);
    document.getElementById('next').onclick=()=>{ SFX.click(); next(); };
  }
}

// ---------- pause menu ----------
function renderPause(){
  overlay.hidden=false; setStage(''); document.getElementById('spinCenter').hidden=true;
  overlay.innerHTML=`<div class="pause"><div class="logo"><h1 style="font-size:48px">PAUSED</h1></div>
    <button class="gbtn gold big" id="resume">▶ Resume</button>
    <div class="setting"><span>Sound</span><button class="gbtn small" id="sfxT">${SFX.on?'On':'Off'}</button></div>
    <div class="setting"><span>Money shown in</span>${curPicker()}</div>
    <div class="setting"><span>Study Mode <small class="note">fuller explanations</small></span><button class="gbtn small ${studyMode?'gold':''}" id="studyT">${studyMode?'On':'Off'}</button></div>
    <div class="setting"><span>Stats panel</span><button class="gbtn small" id="statsT2">${statsOpen?'Shown':'Hidden'}</button></div>
    <button class="gbtn" id="howto2">How to play &amp; key ideas</button>
    <button class="gbtn red" id="quit">Quit this life</button><div id="confirm"></div></div>`;
  document.getElementById('resume').onclick=()=>{ SFX.click(); paused=false; render(); };
  document.getElementById('sfxT').onclick=()=>{ SFX.init(); SFX.on=!SFX.on; try{localStorage.setItem('whgl-sfx',SFX.on?'on':'off');}catch(e){} SFX.click(); renderPause(); };
  document.getElementById('statsT2').onclick=()=>{ SFX.click(); statsOpen=!statsOpen; renderPause(); };
  document.getElementById('studyT').onclick=()=>{ SFX.click(); setStudy(!studyMode); renderPause(); };
  document.getElementById('howto2').onclick=()=>{ SFX.click(); overlay.innerHTML=howToHTML(); overlay.scrollTop=0; document.getElementById('back').onclick=()=>{ SFX.click(); renderPause(); }; };
  document.getElementById('quit').onclick=()=>{ SFX.click(); document.getElementById('confirm').innerHTML=`<div class="setting"><span>Really quit? Progress is lost.</span><span><button class="gbtn small red" id="yes">Yes</button> <button class="gbtn small" id="no">No</button></span></div>`; document.getElementById('yes').onclick=()=>{ S=null; paused=false; wizardStep=0; render(); }; document.getElementById('no').onclick=()=>renderPause(); };
  bindCur(overlay);
}

// ---------- ending ----------
function renderEnd(){
  overlay.scrollTop=0; document.getElementById('spinCenter').hidden=true; const s=S, p=PROFILES.find(x=>x.id===s.profile), st=s.stats; setStage(''); topbar.hidden=true; statsEl.hidden=true; bottombar.hidden=true; overlay.hidden=false;
  const net=netWorth(s);
  const parts=[`You started as the ${p.name}: ${p.desc.charAt(0).toLowerCase()+p.desc.slice(1)} You reached the beach house at age ${s.age}, after ${s.turn} seasons.`];
  if(s.jobsHeld>1) parts.push(`You held ${s.jobsHeld} different jobs and finished as ${s.job?jobById(s.job).name.toLowerCase():'retired'}.`);
  if(s.eduLevel>=2) parts.push(`You earned a ${s.eduName.toLowerCase()}.`);
  if(s.home) parts.push(`You own a home worth ${Y(s.home.value)}${s.home.loan>0?' with '+Y(s.home.loan)+' still to pay':', fully paid off'}.`);
  if(s.partner) parts.push(s.kids?`You built a family: a partner and ${s.kids} kid${s.kids>1?'s':''}.`:'You share your life with a partner.');
  if(s.pets) parts.push('And a pet who thinks it owns the place.');
  const badges=[]; if(st.savedByCushion>=3) badges.push([ic('bank'),'Cushion Keeper','Savings caught at least three surprises.']); if(st.educationSpent>=800000) badges.push([ic('cap'),'Scholar','Invested big in learning.']); if(s.jobsHeld>=4) badges.push([ic('compass'),'Explorer','Tried four or more jobs.']); if(s.home) badges.push([ic('home'),'Homeowner','Bought a place of your own.']); if(st.setbacks>=3) badges.push([ic('lifebuoy'),'Survivor','Knocked down three times, still standing.']); if(st.rolls>=10&&st.hits/st.rolls>=0.6) badges.push([ic('dice'),'Lucky Duck','More than 60% of your gambles paid off.']); if(s.wellbeing>=80) badges.push([ic('sun'),'Good Life','Finished happy and healthy.']); if(s.connections>=85) badges.push([ic('users'),'Pillar of the Town','Everyone knows you.']); if(net>=20000000) badges.push([ic('gem'),'Comfortable','A big nest egg.']); if(s.kids>=2) badges.push([ic('users'),'Family First','Raised a crowd.']); if(st.borrowed===0) badges.push([ic('receipt'),'Never Borrowed','Not one loan, the whole way.']);
  if(st.setbacks) parts.push(`Life knocked you down ${st.setbacks} time${st.setbacks>1?'s':''}, and you got back up.`);
  if(st.savedByCushion && !st.borrowed) parts.push('Your savings jar caught every surprise bill, so you never had to borrow.');
  else if(st.borrowed) parts.push(`${st.borrowed} time${st.borrowed>1?'s':''} a bill was bigger than your cushion, so you had to borrow.`);
  if(st.educationSpent) parts.push(`You spent ${Y(st.educationSpent)} on education and your skills reached ${Math.round(s.skills)}/100.`);
  if(s.stocks||st.investNet){ const r=s.stocks-s.stocksCost+st.investNet; parts.push(r>=0?`Your investments gained ${Y(r)} overall.`:`Your investments lost ${Y(-r)} overall.`); }
  if(st.rolls) parts.push(`You took ${st.rolls} chance${st.rolls>1?'s':''} and ${st.hits} worked out. That part was luck, not skill.`);
  parts.push(s.wellbeing>=70?'You end in good health with time for the people around you.':s.wellbeing>=45?'Your health and free time took some strain along the way.':'The years were hard on your health and well-being, and the bills showed it.');
  const learned=[];
  if(st.savedByCushion) learned.push('Savings gave you more choices when things went wrong.');
  if(st.borrowed) learned.push('Without a cushion, the same bill turns into debt, and debt charges interest.');
  if(st.educationSpent) learned.push('Learning opened doors, but it cost money and time first.');
  if(st.rolls) learned.push('Being prepared improved your odds. It never made things certain.');
  if(s.wellbeing<45) learned.push('Health you skip in your twenties sends the bill in your fifties.');
  learned.push('Some things just happened to you. Where you started decided how much they hurt.');
  overlay.innerHTML=`<div class="sheet">
    <div class="banner small"><h1>THE BEACH HOUSE</h1></div>
    <section class="panel" style="--cat:var(--gold)"><div class="ribbon">Your life story<span>${p.name}, age ${s.age}</span></div><div class="body story">
      <p>${parts.join(' ')}</p>
      <div class="finals">
        <div><div class="eyebrow">Net worth</div><div class="v num" ${net<0?'style="color:var(--bad)"':''}>${Y(net)}</div></div>
        <div><div class="eyebrow">Monthly pay</div><div class="v num">${s.employed?Y(s.income):'none'}</div></div>
        <div><div class="eyebrow">Money safety</div><div class="v num">${Math.round(security(s))}/100</div></div>
        <div><div class="eyebrow">Skills</div><div class="v num">${Math.round(s.skills)}/100</div></div>
        <div><div class="eyebrow">Happiness</div><div class="v num">${Math.round(s.wellbeing)}/100</div></div>
        <div><div class="eyebrow">Chances</div><div class="v num">${Math.round(opportunity(s))}/100</div></div></div>
      ${badges.length?`<div><div class="eyebrow">Badges</div><div class="badges">${badges.map(([i,n,d])=>`<div class="badge"><span>${i}</span><b>${n}</b><small>${d}</small></div>`).join('')}</div></div>`:''}
      ${studyMode?`<div><div class="eyebrow">What you learned</div><ul>${learned.map(l=>`<li>${l}</li>`).join('')}</ul></div>`:''}
      <div class="endcharts">${chartsHTML(s,true)}</div>
      <div class="q">If you lived this life again, what would you do differently?</div>
      ${studyMode?`<div class="formula">Your life = Where you started + Your choices + Chances + The economy + Wild surprises</div>`:''}
      <div><div class="eyebrow">Your timeline</div><ul class="tl">${s.log.map(l=>`<li><span class="age">${l.age}${l.season?' <small>'+l.season.slice(0,3)+'</small>':''}</span><span class="ev"><b>${esc(l.title)}</b> → ${esc(loc(l.choice))}${l.hit===null?'':l.hit?' <span style="color:var(--good)">✓</span>':' <span style="color:var(--bad)">✗</span>'}</span></li>`).join('')}</ul></div>
      <p class="note">There is no winner. A cosy family life, work you like, your own shop, or just a calm balanced life are all great endings.</p>
    </div></section>
    <div class="row"><button class="gbtn gold big" id="again">▶ Live another life</button></div></div>`;
  wireCharts(overlay,s);
  document.getElementById('again').onclick=()=>{ SFX.click(); S=null; selected.profile=null; wizardStep=0; render(); };
}
function render(){ if(!S) renderStart(); else if(S.phase==='end') renderEnd(); else if(paused) renderPause(); else { titleDrift=false; renderTop(S); renderStats(S); renderBottom(S); renderStage(S); } }

addEventListener('keydown',e=>{ if(!S||S.phase==='end') return; if(e.key==='Escape'){ paused=!paused; render(); } if((e.key==='c'||e.key==='C')&&!paused&&S.phase==='roll'){ chartsOpen=!chartsOpen; careerOpen=false; render(); } if(e.key===' '&&!paused){ e.preventDefault(); if(S.phase==='roll'&&!careerOpen&&!chartsOpen){ SFX.init(); takeTurn(); } else if(S.phase==='outcome') next(); } });
addEventListener('resize',()=>{ if(S&&S.phase!=='end'&&!paused) render(); });

window.claude?.hot?.snapshot?.(()=>({S:S&&{...S,current:S.current&&S.current.id,outcome:null,outcomeBefore:null,phase:S.phase==='outcome'||S.phase==='rolling'?'roll':S.phase},selected}));
function boot(data){
  applyLite();
  if(data&&data.S){ S=data.S; S.current=CARDS.find(c=>c.id===S.current)||null; rng=mulberry32(S.seed+S.year*7919); selected=data.selected||selected;
    const mode=MODES.find(m=>m.id===S.mode); buildWorld(S.track||TRACK_LEN(mode.years), mode.fixedSeed?S.seed:S.seed%1000); zoomBase=innerWidth<=760?19:21; resize(); walkIdx=S.pos||0; { const hd=headingAt(S.pos||0); if(hd) yaw=Math.atan2(-hd.x,-hd.z); } pitch=CAM_PITCH;
    dressPawn(S.profile); pawn.visible=S.phase!=='end'; placePawn(S.pos||0); camAim.copy(pawn.position); }
  else rng=mulberry32(1);
  render();
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
