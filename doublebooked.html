  const m=S.m&&S.m[b];
  if(a==='step')S.step=+b;
  else if(a==='pick')S.you[b]=c;
  else if(a==='peeve'){const p=S.you.peeves;p.includes(b)?p.splice(p.indexOf(b),1):p.length<2&&p.push(b)}
  else if(a==='go'){newMatches();S.day=1;startDay();S.reveal=0;S.screen='match'}
  else if(a==='reveal'){if(S.reveal===0)S.reveal=1;else{S.screen='app';S.tab='matches'}}
  else if(a==='tab')S.tab=b;
  else if(a==='open'){S.view=b;m.unread=0;S.screen='chat';S.sheet=null}
  else if(a==='profile'){S.view=b;S.screen='profile';S.sheet=null}
  else if(a==='back'){S.screen='app';S.sheet=null}
  else if(a==='reply')reply(m,+c);
  else if(a==='next')endDay();
  else if(a==='sheet')S.sheet=b==='0'?null:b;
  else if(a==='line')breakup(m,c);
  else if(a==='block')block(m);
  else if(a==='finale')finale();
  else if(a==='restart')S=fresh();
  render();
}
function boot(saved){S=saved&&saved.screen?saved:fresh();S.typing=null;render();setInterval(()=>{const el=P.querySelector('.status span');if(el)el.textContent=clock()},30000)}
window.claude?.hot?.ready?window.claude.hot.ready(boot):boot(window.claude?.hot?.data);
</script>
