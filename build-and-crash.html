<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style></head><body>
<title>Build &amp; Crash</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Bungee&display=swap">
<style>
/* Layout: one-screen workshop. Top bar, parts rack left, test bench centre, data plate right; the rack becomes a bottom drawer on phones. */
:root{
  --bg:#dfe7ec; --panel:#f6f9fb; --panel2:#e9eff3; --line:#c6d2da; --fg:#17222b; --muted:#566773;
  --accent:#ffc400; --accent-ink:#18222b; --danger:#c8371f; --ok:#1f8a4e;
  --display:"Bungee","Arial Black",Impact,sans-serif; --body:"Barlow","Segoe UI",system-ui,sans-serif;
  --gl:max(16px,env(safe-area-inset-left,0px)); --gr:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b1218;--panel:#141e27;--panel2:#1b2833;--line:#2a3a48;--fg:#e8eef2;--muted:#93a4b1;--danger:#ff7a61;--ok:#55c98a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1218;--panel:#141e27;--panel2:#1b2833;--line:#2a3a48;--fg:#e8eef2;--muted:#93a4b1;--danger:#ff7a61;--ok:#55c98a;color-scheme:dark}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:500 14px/1.35 var(--body);overflow:hidden;-webkit-user-select:none;user-select:none}
button,select,input{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%;display:grid;grid-template:"bar bar bar" auto "lib stage side" minmax(0,1fr) / 212px minmax(0,1fr) 248px}
#app[data-mode="run"]{grid-template:"bar" auto "stage" minmax(0,1fr) / minmax(0,1fr)}
#app[data-mode="run"] .build-only,#app[data-mode="build"] .run-only{display:none}

#bar{grid-area:bar;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding-block:8px;padding-left:var(--gl);padding-right:var(--gr);background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font:400 18px/1 var(--display);letter-spacing:.02em;white-space:nowrap}
.brand em{font-style:normal;background:var(--accent);color:var(--accent-ink);padding:2px 5px;margin:0 3px}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}
.btn,#bar select{height:34px;padding:0 11px;border:1px solid var(--line);background:var(--panel2);border-radius:4px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.btn:hover:not(:disabled){border-color:var(--muted)}
#runName{font-weight:700}
#go{height:40px;padding:0 26px;border:0;border-radius:4px;cursor:pointer;font:400 20px/1 var(--display);color:var(--accent-ink);
  background:var(--accent);box-shadow:inset 0 0 0 3px var(--accent-ink),inset 0 0 0 6px var(--accent)}
#go:hover{filter:brightness(1.06)} #go:active{transform:translateY(1px)}

#lib{grid-area:lib;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
#libToggle{display:none}
#libList{overflow-y:auto;padding:4px 10px 14px var(--gl);display:flex;flex-direction:column;gap:4px}
#libList h3{margin:10px 0 2px;font:700 11px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.part{display:flex;align-items:center;gap:9px;padding:4px 6px;border:1px solid transparent;border-radius:4px;background:none;text-align:left;cursor:grab;touch-action:pan-y}
.part:hover{background:var(--panel2)}
.part.armed{border-color:var(--accent-ink);background:var(--accent);color:var(--accent-ink)}
.part canvas{width:38px;height:38px;flex:none;pointer-events:none}
.part span{display:flex;flex-direction:column;min-width:0;pointer-events:none}
.part b{font-weight:600}
.part i{font-style:normal;font-size:12px;color:var(--muted)}
.part.armed i{color:var(--accent-ink)}

#stage{grid-area:stage;position:relative;min-width:0;min-height:0;overflow:hidden}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#recentre{position:absolute;right:12px;bottom:12px}
#toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-8px);max-width:min(90%,420px);padding:8px 12px;border-radius:4px;background:var(--fg);color:var(--bg);font-weight:600;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
#ghost{position:fixed;z-index:20;transform:translate(12px,12px);padding:3px 8px;border-radius:3px;background:var(--accent);color:var(--accent-ink);font-weight:700;pointer-events:none;white-space:nowrap}

#hud{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(3,auto) minmax(80px,1fr);gap:6px 22px;align-items:end;
  padding:10px var(--gr) calc(10px + env(safe-area-inset-bottom,0px)) var(--gl);background:linear-gradient(transparent,color-mix(in srgb,var(--bg) 88%,transparent) 45%);font-variant-numeric:tabular-nums}
#hud div span{display:block;font:700 10px/1.2 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
#hud div b{font:400 20px/1.1 var(--display)}
.prog{display:flex;align-items:center;gap:8px;padding-bottom:4px}
.track{flex:1;height:10px;border:2px solid var(--fg);background:var(--panel);position:relative}
.track i{position:absolute;inset:0 auto 0 0;background:var(--accent)}

#result{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--bg) 55%,transparent)}
.card{width:min(100%,380px);background:var(--panel);border:2px solid var(--fg);border-radius:6px;padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px;-webkit-user-select:text;user-select:text}
.card h2{margin:0;font:400 30px/1 var(--display);text-wrap:balance}
#result[data-ok="1"] .card h2{color:var(--ok)} #result[data-ok="0"] .card h2{color:var(--danger)}
.card p{margin:0}
#rCause{font-weight:700;font-size:16px}
#rStats,.sel dl{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;margin:0}
dt{font:700 10px/1.2 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}
#rLost{color:var(--muted)}
.cardbtns{display:flex;gap:8px}
.cardbtns .btn{flex:1;height:40px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-ink)}

#side{grid-area:side;background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px var(--gr) 16px 14px;display:flex;flex-direction:column;gap:16px}
.sel{display:flex;flex-direction:column;gap:9px}
.selhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.selhead b,.sel.hint b,#course b{font-size:16px;font-weight:700}
.pill{font:700 10px/1 var(--body);letter-spacing:.07em;text-transform:uppercase;padding:4px 6px;border-radius:3px;border:1.5px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.bad{color:var(--danger)}
.desc{margin:0;color:var(--muted)}
.acts,.opt{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.acts button,.opt button{flex:1;height:32px;border:1px solid var(--line);background:var(--panel2);border-radius:4px;font-weight:600;cursor:pointer;white-space:nowrap;padding:0 8px}
.acts button:disabled{opacity:.4}
.opt button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent-ink)}
.opt span,.opt label{font-weight:600;min-width:64px}
.opt input{flex:1;min-width:0;accent-color:var(--accent)}
.side-h{margin:0 0 8px;font:700 11px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
#ratings{display:flex;flex-direction:column;gap:7px}
.rate{display:grid;grid-template-columns:108px minmax(0,1fr) 38px;align-items:center;gap:8px}
.rate b{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:10px;border:1.5px solid var(--fg);background:var(--panel2)}
.bar i{display:block;height:100%;background:var(--accent);transition:width .2s}
.note{margin:4px 0 0;font-size:12px;color:var(--muted)}
.rules{margin:2px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-weight:600}
.rules li::before{content:'\2713  '} .rules li.bad::before{content:'\2715  '}
.rules li.ok{color:var(--ok)} .rules li.bad{color:var(--danger)}
.rules span{font-weight:500;color:var(--muted)}
#course{display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--line);padding-top:14px}

@media (max-width:860px){
  #app{grid-template:"bar" auto "stage" minmax(0,1fr) "side" auto "lib" auto / minmax(0,1fr)}
  .brand{display:none}
  #bar{gap:6px 8px}
  .btn,#bar select{padding:0 9px}
  #go{order:9;margin-left:auto}
  .spacer{display:none}
  #side{border-left:0;border-top:1px solid var(--line);padding:8px var(--gr) 8px var(--gl);gap:8px;max-height:34vh}
  .sel.hint,.sel .desc,.sel dl,#course,.note,.side-h{display:none}
  #ratings{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .rate{grid-template-columns:minmax(0,1fr) auto;gap:2px 4px}
  .rate span{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rate .bar{grid-column:1/-1;grid-row:2}
  .rate b{font-size:11px}
  #lib{border-right:0;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
  #libToggle{display:block;height:28px;border:0;background:var(--panel2);font:700 11px/1 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);cursor:pointer}
  #lib.closed #libList{display:none}
  #libList{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:6px var(--gr) 8px var(--gl);gap:4px}
  #libList h3{display:none}
  .part{flex:none;flex-direction:column;gap:2px;width:76px;padding:4px 2px;text-align:center;touch-action:pan-x}
  .part span{align-items:center}
  .part b{font-size:11px;line-height:1.15}
  .part i{display:none}
  #hud{gap:6px 14px;grid-template-columns:repeat(3,auto)}
  #hud div b{font-size:16px}
  .prog{grid-column:1/-1}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<div id="app" data-mode="build">
  <header id="bar">
    <div class="brand">Build<em>&amp;</em>Crash</div>
    <select id="game" class="build-only" aria-label="Mode"></select>
    <select id="env" class="build-only" aria-label="Course"></select>
    <select id="chal" class="build-only" aria-label="Challenge" hidden></select>
    <select id="cond" class="build-only" aria-label="Conditions"></select>
    <span id="runName" class="run-only"></span>
    <div class="tools build-only">
      <button class="btn" id="undo">Undo</button><button class="btn" id="redo">Redo</button><button class="btn" id="clear">Clear</button><button class="btn" id="reset">Reset</button>
      <select id="example" aria-label="Load an example vehicle"></select>
    </div>
    <div class="spacer"></div>
    <div class="tools run-only"><button class="btn" id="speed">Speed 1×</button><button class="btn" id="retry">Retry</button><button class="btn" id="back">Return to builder</button></div>
    <button id="go" class="build-only">GO</button>
  </header>
  <aside id="lib" class="build-only" aria-label="Parts">
    <button id="libToggle" aria-expanded="true">Parts</button>
    <div id="libList"></div>
  </aside>
  <main id="stage">
    <canvas id="cv"></canvas>
    <button class="btn build-only" id="recentre">Recentre</button>
    <div id="toast" role="status"></div>
    <div id="hud" class="run-only">
      <div><span>Distance</span><b id="hDist">0 m</b></div>
      <div><span>Speed</span><b id="hSpeed">0 km/h</b></div>
      <div><span>Damage</span><b id="hDmg">0%</b></div>
      <div class="prog"><div class="track"><i id="hBar"></i></div><b id="hPct">0%</b></div>
    </div>
    <div id="result" hidden>
      <div class="card">
        <h2 id="rTitle"></h2>
        <p id="rCause"></p>
        <dl id="rStats"></dl>
        <p id="rLost"></p>
        <div class="cardbtns"><button class="btn primary" id="rRetry">Retry</button><button class="btn" id="rBack">Return to builder</button></div>
      </div>
    </div>
  </main>
  <aside id="side" class="build-only">
    <div id="props"></div>
    <div><h3 class="side-h">Estimated ratings</h3><div id="ratings"></div></div>
    <div id="course"></div>
  </aside>
</div>
<div id="ghost" hidden></div>

function makeFixture(r, body) {

}

}

}

    while (q.length) { const c = q.pop(); comp.push(c); for (const nid of run.adj.get(c.id)) { const n = run.byId.get(nid); if (n.alive && n.body === body && !seen.has(nid)) { seen.add(nid); q.push(n); } } }
    comps.push(comp); }
  if (comps.length < 2) return;
  let keep = comps.find(c => c.some(p => p.type === 'core')) || comps.slice().sort((a, b) => b.length - a.length)[0];
  for (const comp of comps) { if (comp === keep) continue;
