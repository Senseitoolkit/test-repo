<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Spelling Master</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#FFF6E9;--ink:#36325A;--soft:#6A6592;
  --coral:#FF6B6B;--coral-d:#D84F4F;--blue:#3DA5D9;--blue-d:#2A7DAA;
  --green:#34C77B;--green-d:#239456;--purple:#9B6DE0;--purple-d:#7A4FBF;
  --gold:#F4A93C;--gold-d:#D98A1F;
  --card:#FFFFFF;--line:#EADFCB;
  --r-lg:22px;--r-md:16px;--r-sm:12px;
  --s1:6px;--s2:10px;--s3:14px;--s4:18px;--s5:24px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:'Nunito',sans-serif;color:var(--ink);
  background:var(--cream);
  background-image:radial-gradient(var(--line) 1.4px,transparent 1.4px);
  background-size:26px 26px;
  min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;align-items:center;
  padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));
}
.app{width:100%;max-width:620px;margin:auto 0;display:flex;flex-direction:column;gap:var(--s3);}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);flex-wrap:wrap;}
.brand small{display:block;font-weight:800;color:var(--blue);font-size:11px;letter-spacing:.6px;text-transform:uppercase;margin-bottom:1px;}
.brand h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(20px,5vw,26px);margin:0;line-height:1;}
.stats{display:flex;gap:var(--s1);}
.chip{font-family:'Fredoka',sans-serif;font-weight:600;background:var(--card);border:2px solid var(--line);border-radius:var(--r-sm);padding:6px 10px;font-size:13px;display:flex;align-items:center;gap:5px;box-shadow:0 3px 0 var(--line);white-space:nowrap;}
.chip b{font-size:15px;}
.timer-chip{cursor:pointer;transition:transform .08s,box-shadow .08s;}
.timer-chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line);}
a.chip{text-decoration:none;color:var(--ink);cursor:pointer;transition:transform .08s,box-shadow .08s;}
a.chip:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line);}

.screen{display:none;}
.screen.on{display:flex;flex-direction:column;gap:var(--s3);animation:pop .35s cubic-bezier(.2,1.3,.5,1);}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98);}to{opacity:1;transform:none;}}

.panel{background:var(--card);border:3px solid var(--ink);border-radius:var(--r-lg);box-shadow:0 6px 0 var(--ink);}
.hero{text-align:center;padding:var(--s5) var(--s4);}
.hero h2{font-family:'Fredoka',sans-serif;font-size:clamp(20px,5vw,26px);margin:0 0 var(--s1);}
.hero p{margin:0;color:var(--soft);font-weight:700;font-size:14px;}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2);}
.mode{border:none;cursor:pointer;text-align:left;color:#fff;border-radius:var(--r-md);padding:var(--s4);font-family:'Nunito',sans-serif;transition:transform .08s;display:flex;flex-direction:column;gap:2px;}
.mode:active{transform:translateY(3px);}
.mode .ic{font-size:30px;line-height:1;margin-bottom:4px;}
.mode .t{font-family:'Fredoka',sans-serif;font-weight:700;font-size:18px;}
.mode .d{font-weight:800;font-size:12px;opacity:.95;}
.m-green{background:var(--green);box-shadow:0 6px 0 var(--green-d);}
.m-green:active{box-shadow:0 3px 0 var(--green-d);}
.m-blue{background:var(--blue);box-shadow:0 6px 0 var(--blue-d);}
.m-blue:active{box-shadow:0 3px 0 var(--blue-d);}
.m-purple{background:var(--purple);box-shadow:0 6px 0 var(--purple-d);}
.m-purple:active{box-shadow:0 3px 0 var(--purple-d);}
.m-coral{background:var(--coral);box-shadow:0 6px 0 var(--coral-d);}
.m-coral:active{box-shadow:0 3px 0 var(--coral-d);}
.m-gold{background:var(--gold);box-shadow:0 6px 0 var(--gold-d);}
.m-gold:active{box-shadow:0 3px 0 var(--gold-d);}

.gbar{display:flex;align-items:center;gap:var(--s2);}
.back{font-family:'Fredoka',sans-serif;font-weight:600;background:#fff;border:2px solid var(--ink);border-radius:var(--r-sm);padding:8px 12px;cursor:pointer;box-shadow:0 3px 0 var(--ink);font-size:13px;white-space:nowrap;transition:transform .08s,box-shadow .08s;}
.back:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink);}
.progress{flex:1;height:12px;background:#fff;border:2px solid var(--ink);border-radius:20px;overflow:hidden;}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--blue));transition:width .3s;}

.qcard{padding:var(--s4);display:flex;flex-direction:column;gap:var(--s3);}
.tag{align-self:flex-start;font-family:'Fredoka',sans-serif;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#fff;background:var(--blue);border-radius:25px;padding:4px 12px;}
.prompt{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(19px,4.4vw,25px);margin:0;line-height:1.25;}
.hint{margin:-6px 0 0;color:var(--soft);font-weight:800;font-size:12.5px;}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--s2);}
.opts.marks{display:flex;flex-wrap:wrap;justify-content:center;gap:var(--s2);}
.opt{font-family:'Nunito',sans-serif;font-weight:600;font-size:clamp(15px,3.4vw,18px);background:#fff;border:2px solid var(--ink);border-radius:var(--r-md);padding:14px 12px;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s,background .15s;color:var(--ink);line-height:1.3;text-align:center;}
.opts.marks .opt{min-width:110px;font-family:'Fredoka',sans-serif;font-size:20px;font-weight:700;padding:12px 18px;}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
.opt.good{background:var(--green);color:#fff;border-color:var(--green-d);box-shadow:0 4px 0 var(--green-d);}
.opt.bad{background:var(--coral);color:#fff;border-color:var(--coral-d);box-shadow:0 4px 0 var(--coral-d);animation:shake .4s;}
.opt:disabled{cursor:default;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-6px);}40%{transform:translateX(6px);}60%{transform:translateX(-4px);}80%{transform:translateX(4px);}}

/* Tap-the-word sentence */
.tokens{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;background:#FFFBF1;border:2px dashed var(--line);border-radius:var(--r-md);padding:16px 12px;}
.word{font-family:'Nunito',sans-serif;font-weight:700;font-size:clamp(16px,3.4vw,20px);background:#fff;border:2px solid var(--ink);border-radius:var(--r-sm);padding:8px 12px;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;}
.word:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
.word.good{background:var(--green);color:#fff;border-color:var(--green-d);box-shadow:0 4px 0 var(--green-d);}
.word.bad{background:var(--coral);color:#fff;border-color:var(--coral-d);box-shadow:0 4px 0 var(--coral-d);animation:shake .4s;}
/* stage-2 corrected line */
.sentence{font-size:clamp(17px,3.6vw,21px);font-weight:700;background:#FFFBF1;border:2px dashed var(--line);border-radius:var(--r-md);padding:14px 16px;line-height:1.7;text-align:center;}
.blankslot{display:inline-block;min-width:34px;border-bottom:3px solid var(--blue);color:var(--blue);font-weight:800;line-height:1;margin:0 2px;}
.sentence .lit{color:var(--green-d);}

.fb{border-radius:var(--r-md);padding:14px;font-weight:800;display:none;align-items:flex-start;gap:10px;font-size:14px;line-height:1.4;}
.fb.show{display:flex;animation:pop .3s;}
.fb.win{background:#E6F9EE;border:2px solid var(--green);color:var(--green-d);}
.fb.lose{background:#FFEAEA;border:2px solid var(--coral);color:var(--coral-d);}
.fb .em{font-size:22px;line-height:1;flex-shrink:0;}

.actions{display:flex;gap:var(--s2);}
.btn{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(16px,3.6vw,18px);border:none;cursor:pointer;color:#fff;border-radius:var(--r-md);padding:14px 18px;transition:transform .08s,box-shadow .08s;flex:1;}
.btn:active{transform:translateY(3px);}
.btn-go{background:var(--blue);box-shadow:0 5px 0 var(--blue-d);}
.btn-go:active{box-shadow:0 1px 0 var(--blue-d);}
.btn-next{background:var(--green);box-shadow:0 5px 0 var(--green-d);}
.btn-next:active{box-shadow:0 1px 0 var(--green-d);}

.result{text-align:center;padding:var(--s5) var(--s4);}
.result h2{font-family:'Fredoka',sans-serif;font-size:clamp(22px,5vw,28px);margin:var(--s1) 0 2px;}
.bigstars{font-size:44px;letter-spacing:8px;margin:var(--s1) 0;line-height:1;}
.bigstars .s{opacity:.22;}
.bigstars .s.lit{opacity:1;display:inline-block;animation:starpop .5s cubic-bezier(.2,1.6,.4,1) both;}
.bigstars .s.lit:nth-child(2){animation-delay:.15s;}
.bigstars .s.lit:nth-child(3){animation-delay:.3s;}
@keyframes starpop{from{transform:scale(0) rotate(-40deg);}to{transform:scale(1) rotate(0);}}
.result .score{font-family:'Fredoka',sans-serif;font-weight:600;font-size:20px;margin:0;}
.result .msg{color:var(--soft);font-weight:800;margin:var(--s1) 0 var(--s4);font-size:14px;}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden;}
.cf{position:absolute;width:11px;height:15px;will-change:transform,opacity;border-radius:2px;}
.overlay{position:fixed;inset:0;z-index:9998;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(54,50,90,.55);backdrop-filter:blur(3px);}
.overlay.on{display:flex;animation:pop .35s cubic-bezier(.2,1.3,.5,1);}
.donecard{background:var(--card);border:3px solid var(--ink);border-radius:var(--r-lg);padding:var(--s5) var(--s4);box-shadow:0 6px 0 var(--ink);text-align:center;max-width:90vw;}
.donecard h2{font-family:'Fredoka',sans-serif;font-size:24px;margin:var(--s1) 0 4px;}
.donecard p{color:var(--soft);font-weight:800;margin:0 0 var(--s3);font-size:13px;}
.donecard .actions{justify-content:center;}

@media(max-width:420px){
  .grid{grid-template-columns:1fr;}
  .opts{grid-template-columns:1fr;}
}
</style>
</head>
<body>
<div id="confetti"></div>
<div id="doneOverlay" class="overlay" role="dialog" aria-modal="true">
<div class="donecard">
<div class="bigstars"><span class="s lit">★</span><span class="s lit">★</span><span class="s lit">★</span></div>
<h2>All done! 🎉</h2>
<p>10 minutes—great work!</p>
<div class="actions">
<button class="btn btn-go" id="restartBtn" style="flex:none;">Restart ⟳</button>
<a class="btn btn-next" href="spag-hub.html" style="flex:none;text-decoration:none;text-align:center;">🏠 Hub</a>
</div>
</div>
</div>

<div class="app">
<div class="topbar">
<div class="brand"><small>Master your spelling!</small><h1>Spelling Master</h1></div>
<div class="stats">
<a class="chip" href="spag-hub.html" title="Back to the hub">🏠 Hub</a>
<button class="chip timer-chip" id="timerToggle">⏱ <b id="timeLeft">10:00</b></button>
<div class="chip">⭐ <b id="starCount">0</b></div>
<div class="chip">🔥 <b id="streakCount">0</b></div>
</div>
</div>

<section id="start" class="screen on">
<div class="panel hero">
<h2>Ready to master spelling? 🚀</h2>
<p>10 minutes of mixed practice!</p>
<button class="btn btn-go" id="startBtn" style="flex:none;margin-top:var(--s4);width:min(260px,100%);">Start ▶</button>
</div>
</section>

<section id="level" class="screen">
<div class="panel hero"><h2>Pick your grade 📚</h2><p>Hundreds of words!</p></div>
<div class="grid">
<button class="mode m-green" data-level="level1"><span class="ic">🌱</span><span class="t">Grade 1</span><span class="d">Ages 6–7</span></button>
<button class="mode m-blue" data-level="level2"><span class="ic">🌿</span><span class="t">Grade 2</span><span class="d">Ages 7–8</span></button>
<button class="mode m-purple" data-level="level3"><span class="ic">🌳</span><span class="t">Grade 3</span><span class="d">Ages 8–9</span></button>
<button class="mode m-coral" data-level="level4"><span class="ic">🦅</span><span class="t">Grade 4</span><span class="d">Ages 9–10</span></button>
<button class="mode m-gold" data-level="level5"><span class="ic">🏆</span><span class="t">Grade 5</span><span class="d">Ages 10–11</span></button>
</div>
</section>

<section id="game" class="screen">
<div class="gbar"><button class="back" id="backBtn">← Grade</button><div class="progress"><i id="progFill"></i></div><div class="chip">📝 <b id="qNum">1</b>/<b id="qTot">15</b></div></div>
<div class="panel qcard"><span class="tag" id="qTag">Spelling</span><h3 class="prompt" id="qPrompt"></h3><p class="hint" id="qHint" style="display:none;"></p><div id="qBody"></div><div class="fb" id="fb"><span class="em" id="fbEm">🎉</span><span id="fbText"></span></div><div class="actions" id="actions"></div></div>
</section>

<section id="results" class="screen">
<div class="panel result">
<div class="bigstars" id="resStars"><span class="s">★</span><span class="s">★</span><span class="s">★</span></div>
<h2 id="resTitle">Great!</h2>
<p class="score" id="resScore"></p>
<p class="msg" id="resMsg"></p>
<div class="actions"><button class="btn btn-next" id="againBtn">Play again 🔁</button><button class="btn btn-go" id="homeBtn">Home 🏠</button></div>
</div>
</section>
</div>

<script>
/* ---- QUESTION DATA ----
 MC item:    {topic,prompt,options[],answer,explain}
 Error item: {topic,tokens[],type:"word",word:<index>,fix:<correct spelling>,options:[3 spellings],explain}
             -> tap the misspelled word, then pick its correct spelling
*/
const LEVELS={

{"topic":"Spelling","prompt":"Which is spelled correctly?","options":["when","wen","whin","whem"],"answer":"when","explain":"when starts with wh"},
{"topic":"Spelling","prompt":"Which is spelled correctly?","options":["name","naim","naem","naime"],"answer":"name","explain":"name = a-e makes long a"},
{"topic":"Spelling","prompt":"Which is spelled correctly?","options":["nice","nise","nyce","niice"],"answer":"nice","explain":"nice ends in c-e"},
{"topic":"Spelling","prompt":"Which is spelled correctly?","options":["five","fiev","fyve","fithe"],"answer":"five","explain":"five = f-i-v-e"},
{"topic":"Spelling","prompt":"Which is spelled correctly?","options":["nose","noze","noes","nos"],"answer":"nose","explain":"nose = n-o-s-e"},
{"topic":"Spelling","prompt":"Which is spelled correctly?","options":["boat","bote","boet","boatt"],"answer":"boat","explain":"boat uses oa"},
{"topic":"Spelling","prompt":"Which is spelled correctly?","options":["moon","mun","moone","mune"],"answer":"moon","explain":"moon uses oo"},
{"topic":"Spelling","prompt":"Which is spelled correctly?","options":["tooth","tuth","toth","tooht"],"answer":"tooth","explain":"tooth uses oo"},
{"topic":"Spelling","prompt":"Which is spelled correctly?","options":["green","grean","gren","griin"],"answer":"green","explain":"green uses ee"},
{"topic":"Spelling","prompt":"Which is spelled correctly?","options":["black","blak","blac","blck"],"answer":"black","explain":"black ends in ck"},
{"topic":"Spelling","prompt":"Which is spelled correctly?","options":["clock","klock","clok","cloak"],"answer":"clock","explain":"clock ends in ck"},
{"topic":"Spelling","prompt":"Which is spelled correctly?","options":["snow","sno","snoe","snuw"],"answer":"snow","explain":"snow ends in ow"},
{"topic":"Sight word","prompt":"Choose the word: I ___ to the shop.","options":["went","wnt","whent","wint"],"answer":"went","explain":"went = w-e-n-t"},
{"topic":"Sight word","prompt":"Choose the word: ___ is your name?","options":["What","Wut","Whot","Wat"],"answer":"What","explain":"what starts with wh"},
{"topic":"Sight word","prompt":"Choose the word: The cats ___ playing.","options":["were","wer","ware","wor"],"answer":"were","explain":"were = w-e-r-e"}
],"error":[
{"topic":"Spot the error","tokens":["The","dog","is","blak."],"type":"word","word":3,"fix":"black","options":["black","blak","blac"],"explain":"black ends in ck"},
{"topic":"Spot the error","tokens":["I","see","the","mun."],"type":"word","word":3,"fix":"moon","options":["moon","mun","moone"],"explain":"moon uses oo"},
{"topic":"Spot the error","tokens":["We","sat","in","the","bote."],"type":"word","word":4,"fix":"boat","options":["boat","bote","boatt"],"explain":"boat uses oa"},
{"topic":"Spot the error","tokens":["She","has","a","nise","hat."],"type":"word","word":3,"fix":"nice","options":["nice","nise","nyce"],"explain":"nice ends in c-e"},
{"topic":"Spot the error","tokens":["Look","at","the","klock."],"type":"word","word":3,"fix":"clock","options":["clock","klock","clok"],"explain":"clock ends in ck"},
{"topic":"Spot the error","tokens":["The","frog","is","grean."],"type":"word","word":3,"fix":"green","options":["green","grean","gren"],"explain":"green uses ee"},
{"topic":"Spot the error","tokens":["He","sed","hello."],"type":"word","word":1,"fix":"said","options":["said","sed","sayd"],"explain":"said = s-a-i-d"},

{"topic":"Spot the error","tokens":["I","hav","a","cat."],"type":"word","word":1,"fix":"have","options":["have","hav","haf"],"explain":"have ends in silent e"},
{"topic":"Spot the error","tokens":["Wut","is","that?"],"type":"word","word":0,"fix":"What","options":["What","Wut","Wot"],"explain":"what starts with wh"}
]},
"level2":{"mc":[
{"topic":"Spelling","prompt":"Which is spelled correctly?","options":["because","becuase","becase","becouse"],"answer":"because","explain":"be-cause"},
{"topic":"Spelling","prompt":"Which is spelled correctly?","options":["weather","wether","wheather","weater"],"answer":"weather","explain":"weather has ea"},
{"topic":"Spelling","prompt":"Which is spelled correctly?","options":["laugh","laff","larf","laugth"],"answer":"laugh","explain":"laugh ends in gh"},
{"topic":"Spelling","prompt":"Which is spelled correctly?","options":["enough","enuff","enugh","enouf"],"answer":"enough","explain":"enough ends in gh"},
{"topic":"Spelling","prompt":"Which is spelled correctly?","options":["through","thru","throuh","thorugh"],"answer":"through","explain":"through ends in ough"},
{"topic":"Spelling","prompt":"Which is spelled correctly?","options":["right","riht","ryght","rihgt"],"answer":"right","explain":"right has silent gh"},
{"topic":"Spelling","prompt":"Which is spelled correctly?","options":["thought","thot","thawt","thougt"],"answer":"thought","explain":"thought ends in ght"},
{"topic":"Spelling","prompt":"Which is spelled correctly?","options":["friend","freind","frend","freend"],"answer":"friend","explain":"friend = fri-end"},
{"topic":"Spelling","prompt":"Which is spelled correctly?","options":["money","munny","mony","monie"],"answer":"money","explain":"money ends in ey"},
{"topic":"Spelling","prompt":"Which is spelled correctly?","options":["dollars","dollers","dolars","dollrs"],"answer":"dollars","explain":"dollars has double l"},
{"topic":"Spelling","prompt":"Which is spelled correctly?","options":["quickly","quicly","quikly","quickley"],"answer":"quickly","explain":"quick + ly"},
{"topic":"Spelling","prompt":"Which is spelled correctly?","options":["careful","carful","carefull","carefl"],"answer":"careful","explain":"care + ful (one l)"},

{"topic":"Spelling","prompt":"Which is spelled correctly?","options":["world","wrold","wurld","werld"],"answer":"world","explain":"world = w-o-r-l-d"},
{"topic":"Spelling","prompt":"Which is spelled correctly?","options":["should","shud","shoud","sholud"],"answer":"should","explain":"should has silent l"},

{"topic":"Spelling","prompt":"Which is spelled correctly?","options":["other","uther","othr","awther"],"answer":"other","explain":"other = o-t-h-e-r"},
{"topic":"Spelling","prompt":"Which is spelled correctly?","options":["large","larj","lardge","larj"],"answer":"large","explain":"large ends in ge"},
{"topic":"Spelling","prompt":"Which is spelled correctly?","options":["drink","drinck","drenk","drnk"],"answer":"drink","explain":"drink ends in nk"},

const ENCOURAGE=["Perfect!","Brilliant!","Nailed it!","Excellent!","Amazing!","You got it!"];
const TRYAGAIN=["Oops!","Try again!","Not quite!","Almost!"];
const $=id=>document.getElementById(id);
let totalStars=0,streak=0,game=null,selectedLevel='level1';
const PER_GAME=15;

function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[b[i],b[j]]=[b[j],b[i]];}return b;}
function show(scr){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(scr).classList.add('on');}
function setStats(){$('starCount').textContent=totalStars;$('streakCount').textContent=streak;}
function rand(a){return a[Math.random()*a.length|0];}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function startGame(){const L=LEVELS[selectedLevel];let q=shuffle([...L.mc,...L.error]).slice(0,PER_GAME);game={queue:q,idx:0,correct:0,total:q.length};$('qTot').textContent=game.total;show('game');renderQuestion();}

function renderQuestion(){const q=game.queue[game.idx];$('qNum').textContent=game.idx+1;$('progFill').style.width=game.idx/game.total*100+'%';$('qTag').textContent=q.topic;$('fb').className='fb';$('actions').innerHTML='';$('qHint').style.display='none';const b=$('qBody');b.innerHTML='';if(q.tokens)renderError(q,b);else renderMC(q,b);}

function renderMC(q,body){$('qPrompt').textContent=q.prompt;const w=document.createElement('div');w.className='opts';shuffle(q.options).forEach(opt=>{const b=document.createElement('button');b.className='opt';b.textContent=opt;b.onclick=()=>{[...w.children].forEach(c=>c.disabled=true);const ok=opt===q.answer;b.classList.add(ok?'good':'bad');if(!ok)[...w.children].forEach(c=>{if(c.textContent===q.answer)c.classList.add('good');});finish(ok,q.explain);};w.appendChild(b);});body.appendChild(w);}

/* ---- Error spotting: tap the misspelled WORD, then pick the correct spelling ---- */
function renderError(q,body){
  const w=document.createElement('div');w.className='tokens';
  $('qPrompt').textContent='Tap the word that is spelled wrong';
  $('qHint').style.display='none';
  q.tokens.forEach((tk,i)=>{
    const b=document.createElement('button');b.className='word';b.type='button';b.textContent=tk;
    b.onclick=()=>locateWord(q,body,i,w,b);
    w.appendChild(b);
  });
  body.appendChild(w);
}

function locateWord(q,body,i,w,el){
  [...w.children].forEach(c=>c.disabled=true);
  const ok=i===q.word;el.classList.add(ok?'good':'bad');
  if(!ok){w.children[q.word].classList.add('good');finish(false,'The misspelled word is "'+q.tokens[q.word]+'". '+q.explain);return;}
  setTimeout(()=>chooseFix(q,body),450);
}

function chooseFix(q,body){
  body.innerHTML='';
  $('qPrompt').textContent='Now pick the correct spelling';
  $('qHint').style.display='none';
  const corr=document.createElement('div');corr.className='sentence';
  corr.innerHTML=q.tokens.map((wd,i)=>i===q.word?'<span class="blankslot">?</span>':esc(wd)).join(' ');
  body.appendChild(corr);
  const opts=document.createElement('div');opts.className='opts marks';
  shuffle(q.options).forEach(opt=>{
    const b=document.createElement('button');b.className='opt';b.textContent=opt;
    b.onclick=()=>{
      [...opts.children].forEach(c=>c.disabled=true);
      const ok=opt===q.fix;b.classList.add(ok?'good':'bad');
      if(!ok)[...opts.children].forEach(c=>{if(c.textContent===q.fix)c.classList.add('good');});
      corr.innerHTML=q.tokens.map((wd,i)=>i===q.word?'<span class="lit">'+esc(q.fix)+'</span>':esc(wd)).join(' ');
      finish(ok,q.explain);
    };
    opts.appendChild(b);
  });
  body.appendChild(opts);
}

function finish(ok,exp){const fb=$('fb');fb.className='fb show '+(ok?'win':'lose');$('fbEm').textContent=ok?'🎉':'💡';if(ok){game.correct++;streak++;totalStars++;$('fbText').innerHTML='<b>'+rand(ENCOURAGE)+'</b> '+exp;burstConfetti();}else{streak=0;$('fbText').innerHTML='<b>'+rand(TRYAGAIN)+'</b> '+exp;}setStats();const a=$('actions');a.innerHTML='';const n=document.createElement('button');n.className='btn btn-next';n.textContent=game.idx+1>=game.total?'Results 🏆':'Next ➡️';n.onclick=()=>{game.idx++;if(game.idx>=game.total)endGame();else renderQuestion();};a.appendChild(n);}

function endGame(){$('progFill').style.width='100%';const c=game.correct,t=game.total,pct=c/t;const s=pct>=0.9?3:pct>=0.6?2:pct>0?1:0;const cells=$('resStars').children;for(let i=0;i<3;i++)cells[i].classList.toggle('lit',i<s);$('resScore').textContent='You got '+c+' / '+t;let title='',msg='';if(s===3){title='Perfect! 🌟';msg='Spelling master!';}else if(s===2){title='Excellent! 🎈';msg='Great work!';}else if(s===1){title='Good! 💪';msg='Keep practising!';}else{title='Learning! 🌱';msg='Try again!';}$('resTitle').textContent=title;$('resMsg').textContent=msg;show('results');if(s>=2)setTimeout(burstConfetti,250);}

const CF_COLORS=['#FF6B6B','#3DA5D9','#34C77B','#9B6DE0','#F4A93C'];
function burstConfetti(){const root=$('confetti');for(let i=0;i<20;i++){const p=document.createElement('div');p.className='cf';const x=20+Math.random()*60;p.style.left=x+'vw';p.style.top='-20px';p.style.background=CF_COLORS[i%CF_COLORS.length];root.appendChild(p);const dx=(Math.random()*2-1)*200;const dy=600;const dur=1200+Math.random()*800;p.animate([{transform:'translate(0,0) rotate(0deg)',opacity:1},{transform:'translate('+dx+'px,'+dy+'px) rotate(720deg)',opacity:0}],{duration:dur,fill:'forwards'});setTimeout(()=>p.remove(),dur+50);}}

document.querySelectorAll('#level .mode').forEach(b=>b.onclick=()=>{selectedLevel=b.dataset.level;startGame();});
$('backBtn').onclick=()=>show('level');
$('homeBtn').onclick=()=>show('level');
$('againBtn').onclick=()=>startGame();
setStats();

let timeLeft=600,timerId=null,timerOn=true,started=false;
function renderTime(){if(!timerOn){$('timeLeft').textContent='Off';return;}const m=Math.floor(timeLeft/60),s=timeLeft%60;$('timeLeft').textContent=m+':'+String(s).padStart(2,'0');}
function startTimer(){if(timerId||!timerOn||!started)return;timerId=setInterval(()=>{timeLeft--;if(timeLeft<=0){timeLeft=0;renderTime();clearInterval(timerId);$('doneOverlay').classList.add('on');return;}renderTime();},1000);}
$('timerToggle').onclick=()=>{timerOn=!timerOn;if(timerOn){renderTime();startTimer();}else{clearInterval(timerId);renderTime();}};
$('restartBtn').onclick=()=>{$('doneOverlay').classList.remove('on');timeLeft=600;timerOn=true;renderTime();started=true;startTimer();show('level');};
$('startBtn').onclick=()=>{started=true;renderTime();startTimer();show('level');};
renderTime();
</script>
