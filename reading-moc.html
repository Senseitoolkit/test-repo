:root{
  --bg:#F6F8F7; --panel:#FFFFFF; --soft:#EEF3F1; --line:#DCE4E0; --line-strong:#C3D0CA;
  --ink:#16201C; --muted:#5E6B66; --dim:#A9B5B0; --accent:#2F5D50; --accent-ink:#FFFFFF; --accent-soft:#E3EEE9; --focus:#3C8A72;
  --ok:#2E7D4F; --ok-soft:#E1F1E7; --bad:#B3452B; --bad-soft:#F8E4DE;
  --hl:#FFE27A; --hl-ink:#1B1600; --hl-edge:#D9A400;
  --passage:#FFFFFF;
  --sans:"Carlito","Calibri","Segoe UI",system-ui,sans-serif; --serif:"Caladea","Cambria",Georgia,serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --panel:#161E1B; --soft:#1C2723; --line:#26332E; --line-strong:#34453E;
  --ink:#E4ECE8; --muted:#97A7A0; --dim:#52625B; --accent:#7CC0A6; --accent-ink:#0D1412; --accent-soft:#1E302A; --focus:#9AD6BF;
  --ok:#7DCC9B; --ok-soft:#1C3125; --bad:#F0907A; --bad-soft:#3A231D;
  --hl:#F2CF55; --hl-ink:#1B1600; --hl-edge:#FFE9A0;
  --passage:#1A2420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --panel:#161E1B; --soft:#1C2723; --line:#26332E; --line-strong:#34453E;
  --ink:#E4ECE8; --muted:#97A7A0; --dim:#52625B; --accent:#7CC0A6; --accent-ink:#0D1412; --accent-soft:#1E302A; --focus:#9AD6BF;
  --ok:#7DCC9B; --ok-soft:#1C3125; --bad:#F0907A; --bad-soft:#3A231D;
  --hl:#F2CF55; --hl-ink:#1B1600; --hl-edge:#FFE9A0;
  --passage:#1A2420; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{max-width:1200px;margin:0 auto;padding:22px 16px 40px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button{font:inherit;color:inherit}
.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 18px;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn.ghost:hover{background:var(--soft)}
.btn.small{padding:6px 12px;font-size:13.5px}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}

header.top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding-bottom:14px;margin-bottom:20px;border-bottom:2px solid var(--accent)}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--serif);font-size:26px;line-height:1.15;margin:2px 0 0;text-wrap:balance}
h2{font-family:var(--serif);font-size:22px;line-height:1.2;margin:0 0 8px;text-wrap:balance}
.timer{display:flex;align-items:baseline;gap:8px;padding:7px 14px;border:1px solid var(--line-strong);border-radius:10px;background:var(--panel)}
.timer-label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.timer-value{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}

/* start + results */
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px clamp(18px,4vw,36px)}
.start{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,340px);gap:18px;align-items:start}
@media (max-width:900px){.start{grid-template-columns:minmax(0,1fr)}}
.lead{font-size:17px;margin:0 0 18px;max-width:60ch}
.steps{display:grid;gap:10px;margin:0 0 22px}
.step{display:grid;grid-template-columns:30px minmax(0,1fr);gap:12px;align-items:center;font-size:16px}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.facts{display:grid;gap:0;margin:0;padding:0;list-style:none}
.facts li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.facts li:last-child{border-bottom:0}
.facts span{color:var(--muted)}
.facts b{text-align:right}
label.f{display:grid;gap:6px;font-weight:700;font-size:13.5px;margin:0 0 20px;max-width:340px}
label.f input{font:inherit;font-weight:400;font-size:16px;padding:10px 12px;border:1.5px solid var(--line-strong);border-radius:10px;background:var(--panel);color:var(--ink)}
.note{color:var(--muted);font-size:13.5px;line-height:1.5;margin:0}
.sample{margin-top:14px;font-family:var(--serif);font-size:16px;line-height:1.6;color:var(--dim)}
.sample mark{background:var(--hl);color:var(--hl-ink);font-size:1.2em;padding:.06em .22em;border-radius:5px;box-shadow:0 0 0 1.5px var(--hl-edge)}

.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0 0 22px}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tile{background:var(--soft);border-radius:12px;padding:14px 16px}
.tile .v{font-size:28px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin-top:4px}
.results{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,330px);gap:18px;align-items:start}
@media (max-width:900px){.results{grid-template-columns:minmax(0,1fr)}}
.sec{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:22px 0 8px}
.qrow{appearance:none;width:100%;text-align:left;display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:12px;align-items:center;background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 6px;cursor:pointer;font-size:15.5px}
.qrow:hover{background:var(--soft)}
.qrow .go{color:var(--accent);font-weight:700;font-size:13.5px;white-space:nowrap}
@media (max-width:520px){.qrow .go{display:none}}
.badge{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.none{background:var(--soft);color:var(--muted)}
.skills{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.skills td{padding:8px 0;border-bottom:1px solid var(--line)}
.skills td:last-child{text-align:right;font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--soft);margin-top:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px;align-items:start}
@media (max-width:980px){.stage{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:24px clamp(16px,3vw,30px);min-width:0}
.split{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:start}
.pane-text{background:var(--passage);border:1px solid var(--line);border-radius:12px;padding:18px 20px;max-height:68vh;overflow:auto;min-width:0;position:relative}
@media (max-width:820px){
  .split{grid-template-columns:minmax(0,1fr)}
  .pane-text{max-height:44vh;position:sticky;top:8px;z-index:2;box-shadow:0 6px 18px rgba(0,0,0,.12)}
}
.plbl{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.ttl{font-family:var(--serif);font-weight:700;font-size:23px;line-height:1.2;margin:0 0 10px}
.tsub{font-family:var(--serif);font-style:italic;color:var(--muted);margin:-6px 0 10px;font-size:15.5px}
.para.cap{font-style:italic;color:var(--muted)}
.pane-text.big .para,.pane-text.big .ph{font-size:20px;line-height:1.7}
.listen-row{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.years{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;margin:0 0 20px}
@media (max-width:700px){.years{grid-template-columns:repeat(3,minmax(0,1fr))}}
.yr{appearance:none;display:grid;gap:2px;justify-items:center;background:var(--panel);border:1.5px solid var(--line-strong);border-radius:12px;padding:10px 6px;cursor:pointer}
.yr b{font-size:16px}.yr span{font-size:12.5px;color:var(--muted)}
.yr:hover{border-color:var(--accent)}
.yr[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.yr[aria-pressed="true"] b{color:var(--accent)}
.lbl{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 8px}
.para{display:grid;grid-template-columns:22px minmax(0,1fr);font-family:var(--serif);font-size:17px;line-height:1.62;margin:0 0 10px}
.pn{font-family:var(--sans);font-weight:700;font-size:12px;color:var(--accent);padding-top:4px}
.ph{font-family:var(--serif);font-weight:700;color:var(--accent);margin:14px 0 4px 22px;font-size:17px}
.ttl,.tsub,.para,.ph,.pn{transition:color .35s ease}

/* the answer check: the rest of the text fades, the proof grows and is marked */
mark.ev{background:linear-gradient(var(--hl),var(--hl)) no-repeat 0 0/0% 100%;color:inherit;border-radius:5px;padding:.06em .12em;margin:0;-webkit-box-decoration-break:clone;box-decoration-break:clone;scroll-margin:40px;
  transition:font-size .32s ease,background-size .5s ease .15s,color .3s ease,box-shadow .3s ease}
.evn{display:inline-grid;place-items:center;width:1.45em;height:1.45em;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-family:var(--sans);font-size:.62em;font-weight:700;vertical-align:.25em;margin-right:.35em}
.pane-text.lit .ttl,.pane-text.lit .tsub,.pane-text.lit .para,.pane-text.lit .ph,.pane-text.lit .pn{color:var(--dim)}
.pane-text.lit mark.ev{font-size:1.24em;line-height:1.5;background-size:100% 100%;color:var(--hl-ink);box-shadow:0 0 0 1.5px var(--hl-edge)}
.pane-text:not(.lit) mark.ev{box-shadow:0 0 0 1.5px var(--hl-edge)}
mark.ev.pulse{animation:pulse .9s ease 1}
@keyframes pulse{0%,100%{outline:0 solid transparent;outline-offset:2px}40%{outline:4px solid var(--accent);outline-offset:4px}}
.pane-tools{position:sticky;bottom:-18px;display:flex;justify-content:flex-end;margin:6px -8px -10px;pointer-events:none}
.pane-tools .btn{pointer-events:auto;background:var(--panel);box-shadow:0 2px 10px rgba(0,0,0,.14)}

.qnum{color:var(--muted);font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.prompt{font-size:21px;line-height:1.32;font-weight:700;margin:0 0 18px;text-wrap:pretty}
.prompt.small{font-size:18px}
.choices{display:grid;gap:10px}
.choice{appearance:none;text-align:left;display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--panel);color:var(--ink);border:1.5px solid var(--line-strong);border-radius:12px;padding:12px 14px;cursor:pointer;font-size:17px;line-height:1.32;min-height:56px}
.choice .lt{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:15px}
.choice:hover{border-color:var(--accent);background:var(--accent-soft)}
.choice[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent);font-weight:700}
.choice[aria-checked="true"] .lt{background:var(--accent);color:var(--accent-ink)}
.choice.done{cursor:default;min-height:48px;padding:9px 14px;font-size:16px}
.choice.done:hover{background:var(--panel);border-color:var(--line-strong)}
.choice.done.plain{color:var(--muted);border-color:var(--line)}
.choice.done.plain .lt{border-color:var(--line-strong);color:var(--muted)}
.choice.done.right,.choice.done.right:hover{border-color:var(--ok);background:var(--ok-soft);font-weight:700}
.choice.done.right .lt{background:var(--ok);border-color:var(--ok);color:var(--panel)}
.choice.done.wrong,.choice.done.wrong:hover{border-color:var(--bad);background:var(--bad-soft)}
.choice.done.wrong .lt{background:var(--bad);border-color:var(--bad);color:var(--panel)}
.tag{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;white-space:nowrap}
.right .tag{color:var(--ok)} .wrong .tag{color:var(--bad)}
.verdict{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;border-radius:999px;padding:5px 14px 5px 6px;margin:0 0 12px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)} .verdict.bad{background:var(--bad-soft);color:var(--bad)} .verdict.none{background:var(--soft);color:var(--muted)}
.verdict .badge{width:24px;height:24px;font-size:13px;background:var(--panel)}
.proof{margin-top:16px;border:1.5px solid var(--hl-edge);border-radius:12px;padding:14px 16px;background:var(--soft)}
.proof .hd{font-weight:700;font-size:16px;margin:0 0 4px;display:flex;align-items:center;gap:8px}
.proof .swatch{width:18px;height:18px;border-radius:5px;background:var(--hl);box-shadow:0 0 0 1.5px var(--hl-edge);flex:none}
.proof p{margin:0;font-size:16px;line-height:1.45}
.spots{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.spot{appearance:none;display:inline-flex;align-items:center;gap:8px;background:var(--panel);border:1.5px solid var(--line-strong);border-radius:999px;padding:5px 14px 5px 6px;font-weight:700;font-size:14px;cursor:pointer}
.spot:hover{border-color:var(--accent)}
.spot i{font-style:normal;width:22px;height:22px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:12px}
.spot.lone{padding-left:14px}
.nav{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}

/* side map */
.side{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.side h3{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.side h3+.grid{margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
@media (max-width:980px){.grid{grid-template-columns:repeat(10,minmax(0,1fr))}}
@media (max-width:520px){.grid{grid-template-columns:repeat(7,minmax(0,1fr))}}
.cell{appearance:none;aspect-ratio:1;border-radius:8px;border:1.5px solid var(--line-strong);background:var(--panel);font-weight:700;font-size:14px;cursor:pointer;display:grid;place-items:center;padding:0;line-height:1;font-variant-numeric:tabular-nums}
.cell small{display:block;font-size:10px;line-height:1}
.cell.ans{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.cell.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.cell.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.cell.none{background:var(--soft);color:var(--muted);border-style:dashed}
.cell.cur{outline:2.5px solid var(--ink);outline-offset:1px}
.key{display:grid;gap:5px;font-size:13px;color:var(--muted);margin:0 0 14px}
.key span{display:flex;align-items:center;gap:8px}
.key .cell{width:20px;aspect-ratio:1;font-size:10px;cursor:default;flex:none}
.side .btn{width:100%}
.confirm{border:1.5px solid var(--bad);background:var(--bad-soft);border-radius:12px;padding:12px;display:grid;gap:8px;font-size:14.5px}

/* full screen: the passage and question fill the window; a slim bar replaces the header and side map */
.fs-bar{display:none}
html.fs body{overflow:hidden}
html.fs header.top,html.fs .side{display:none}
html.fs .stage{display:block}
html.fs .panel{position:fixed;inset:0;z-index:30;border:0;border-radius:0;display:flex;flex-direction:column;gap:14px;padding:14px clamp(14px,3vw,34px) 20px;overflow:hidden}
html.fs .fs-bar{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;flex-wrap:wrap;flex:none;padding-bottom:10px;border-bottom:2px solid var(--accent)}
.fs-info{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;font-size:12.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.fs-info .tv{font-size:16px;letter-spacing:0;color:var(--ink);font-variant-numeric:tabular-nums}
.fs-acts{display:flex;gap:8px;flex-wrap:wrap}
html.fs .split{flex:1;min-height:0;width:100%;max-width:1320px;margin:0 auto;align-items:stretch}
html.fs .pane-text{max-height:none;height:100%}
html.fs #qPane{overflow:auto;min-height:0;display:flex;flex-direction:column;justify-content:safe center;padding:2px 4px 2px 2px}
html.fs .prompt{font-size:clamp(21px,3.2vh,30px)}
html.fs .prompt.small{font-size:clamp(18px,2.6vh,24px)}
html.fs .choice{font-size:clamp(17px,2.2vh,21px)}
html.fs .para,html.fs .ph{font-size:clamp(17px,2.3vh,21px)}
html.fs .pane-text.big .para,html.fs .pane-text.big .ph{font-size:clamp(20px,2.8vh,26px)}
@media (max-width:820px){
  html.fs .panel{overflow:auto}
  html.fs .split{flex:none}
  html.fs .pane-text{height:auto;max-height:46vh;top:0}
  html.fs #qPane{overflow:visible;display:block}
}
#qPane .confirm{margin-top:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

 "answer": "A", "skill": "Retrieval", "mode": "find", "ev": [{"b": 0, "t": "One rainy day, years ago, he had simply strolled in through the door and decided to stay."}], "why": "Strolled means walked slowly. Nobody brought him. He walked in by himself and stayed."}, {"stem": "Which sentence shows that Marmalade was “not an ordinary cat”?", "options": ["“He went back to sleep.”", "“He slipped out of the cat flap.”", "“He liked stories.”", "“He was a large ginger cat.”"], "answer": "C", "skill": "Inference", "mode": "clue", "ev": [{"b": 1, "t": "Marmalade was not an ordinary cat. He liked stories."}], "why": "Straight after saying he was not ordinary, the writer tells you why. Most cats do not like stories!"}, {"stem": "Why was the library going to close?", "options": ["The building was falling down.", "The librarian was moving away.", "Marmalade had damaged the books.", "Not enough people were visiting."], "answer": "D", "skill": "Inference", "mode": "clue", "ev": [{"b": 2, "t": "Not enough people were visiting, so the town council had decided to shut it down."}], "why": "Look for the word so. The reason comes just before it."}, {"stem": "“Marmalade's whiskers drooped.” How was he feeling?", "options": ["Angry", "Sad and worried", "Excited", "Hungry"], "answer": "B", "skill": "Inference", "mode": "clue", "ev": [{"b": 3, "t": "whiskers drooped. Where would he go? Where would the stories go?"}], "why": "Drooping whiskers and two worried questions show that he felt sad and worried."}, {"stem": "How did the children work out where the bookmarks had come from?", "options": ["They followed ginger paw prints back to the library.", "There was a note on each bookmark.", "The librarian told them.", "They saw Marmalade on the news."], "answer": "A", "skill": "Retrieval", "mode": "find", "ev": [{"b": 5, "t": "Then someone spotted ginger paw prints, leading all the way back to the library."}], "why": "The paw prints led them back to the library, so they knew who had left the bookmarks."}, {"stem": "What does the phrase “the week after that” show?", "options": ["The children only came once.", "The library was closed for a week.", "The children kept coming back again and again.", "The children forgot about the library."], "answer": "C", "skill": "Vocabulary & language", "mode": "clue", "ev": [{"b": 6, "t": "They came back the next week, and the week after that."}], "why": "They came, then came again, and then again. The visits did not stop."}, {"stem": "Why was the sign on the door taken down?", "options": ["The library had already closed.", "The sign had blown away.", "Marmalade tore it down.", "So many people were visiting that the library did not need to close."], "answer": "D", "skill": "Inference", "mode": "clue", "ev": [{"b": 2, "t": "Not enough people were visiting"}, {"b": 6, "t": "That Saturday, the library was full."}, {"b": 7, "t": "In its place was a new one: OPEN EVERY DAY."}], "why": "Put three clues together. The library was closing because too few people came. Then it was full. So the new sign says it will stay open."}, {"stem": "What does the story show about Marmalade?", "options": ["He was lazy and only liked sleeping.", "He was clever and cared about the library.", "He wanted to be famous.", "He did not like children."], "answer": "B", "skill": "Inference", "mode": "clue", "ev": [{"b": 3, "t": "Where would the stories go?"}, {"b": 4, "t": "That night, the cat had an idea."}], "why": "He worried about the stories, so he cared. He thought of a plan that worked, so he was clever."}, {"stem": "Which of these would also be a good title for this story?", "options": ["“The Lost Bookmark”", "“The Cat Who Saved the Library”", "“A Rainy Day at Home”", "“The New Librarian”"], "answer": "B", "skill": "Summarising", "mode": "whole", "ev": [{"b": 2, "t": "THIS LIBRARY WILL CLOSE AT THE END OF THE MONTH."}, {"b": 4, "t": "That night, the cat had an idea."}, {"b": 7, "t": "In its place was a new one: OPEN EVERY DAY."}], "why": "A good title fits the whole story. The library was going to close, the cat had an idea, and the library stayed open."}]}, {"kind": "Information text", "title": "All About the Sunflower", "subtitle": null, "blocks": [{"type": "p", "text": "The sunflower is a tall, bright flower that can grow taller than a grown-up. Its huge golden head looks just like a shining sun."}, {"type": "h", "text": "A flower that follows the sun"}, {"type": "p", "text": "The sunflower has a clever trick. When it is young, its flower head slowly turns during the day to follow the sun. This is exactly how the flower got its name. It turns to face the sun, so people called it the “sunflower”."}, {"type": "h", "text": "A giant in the garden"}, {"type": "p", "text": "A sunflower can grow over three metres tall in a single summer. It is a true giant in the garden. Its thick, strong stem holds the heavy flower head high up, where it can catch the most sunlight. Its wide green leaves also soak up sunlight to make food, so the plant can keep growing."}, {"type": "h", "text": "Seeds for everyone"}, {"type": "p", "text": "In late summer, the middle of the sunflower fills up with hundreds of seeds. Birds love to peck at them, and people eat them too. Farmers also press the seeds to make sunflower oil for cooking."}], "questions": [{"stem": "How tall does the writer say a sunflower can grow?", "options": ["As small as a coin", "Only as tall as a daisy", "Over three metres tall", "Taller than a house"], "answer": "C", "skill": "Retrieval", "mode": "find", "ev": [{"b": 4, "t": "A sunflower can grow over three metres tall in a single summer."}], "why": "The height is given at the start of this paragraph."}, {"stem": "Why does the sunflower have a thick, strong stem?", "options": ["To keep birds away", "To hold the heavy flower head up high where it can catch the most sunlight", "To help it swim", "To dig into the ground"], "answer": "B", "skill": "Inference", "mode": "clue", "ev": [{"b": 4, "t": "Its thick, strong stem holds the heavy flower head high up, where it can catch the most sunlight."}], "why": "The flower head is heavy. The strong stem holds it up high in the sunlight."}, {"stem": "Why does the writer put these two sentences next to each other: “When it is young, its flower head slowly turns during the day to follow the sun.” and “This is exactly how the flower got its name.”?", "options": ["To list two completely different flowers", "To show how the sunflower got its name from the way it follows the sun", "To make the text longer", "To explain how to cook with oil"], "answer": "B", "skill": "Author's technique", "mode": "clue", "ev": [{"b": 2, "t": "When it is young, its flower head slowly turns during the day to follow the sun. This is exactly how the flower got its name."}], "why": "The first sentence says what the flower does. The second says this is how it got its name. Together they explain the name."}, {"stem": "Which option correctly matches each part of the sunflower to its use?", "options": ["Stem → flying;  Leaves → swimming;  Seeds → digging", "Stem → holds the head up high;  Leaves → soak up sunlight to make food;  Seeds → food for birds and people", "Stem → makes food;  Leaves → food for birds;  Seeds → holds the head up", "Stem → food for birds;  Leaves → holds the head up;  Seeds → makes food"], "answer": "B", "skill": "Retrieval", "mode": "find", "ev": [{"b": 4, "t": "Its thick, strong stem holds the heavy flower head high up"}, {"b": 4, "t": "Its wide green leaves also soak up sunlight to make food"}, {"b": 6, "t": "Birds love to peck at them, and people eat them too."}], "why": "Find each part in the text: the stem, then the leaves, then the seeds. Read what each one does."}, {"stem": "Why has the writer chosen to call the sunflower a ‘giant in the garden’?", "options": ["To show that it is made of stone", "To show that it can talk", "To show that it is frightening", "To show how very tall and big it grows"], "answer": "D", "skill": "Author's technique", "mode": "clue", "ev": [{"b": 4, "t": "A sunflower can grow over three metres tall in a single summer. It is a true giant in the garden."}], "why": "A giant is very tall and big. The sentence before says how tall the sunflower grows."}]}]}, {"year": 4, "age": "8–9", "minutes": 30, "listen": false, "parts": [{"kind": "Story", "title": "The Night Bus", "subtitle": null, "blocks": [{"type": "p", "text": "Jasmine had never been out so late. It was nearly midnight, and she and her dad were waiting at the bus stop after her aunt's wedding. Her shoes pinched, her party dress was crumpled and her eyes kept closing on their own."}, {"type": "p", "text": "At last, the night bus came round the corner, its windows glowing yellow like a lantern. It hissed to a stop. The doors folded open."}, {"type": "p", "text": "Inside, the bus was nearly EMPTY. There were only four other passengers. A nurse in a blue uniform sat near the front, yawning. A man with a guitar case sat with his head against the window. An old lady in a hat with a long pheasant feather was knitting something red. And at the very back, a teenage boy was reading a thick book with a torch."}, {"type": "p", "text": "Jasmine slid into a seat and leaned against her dad, who had adjusted his coat to make her a pillow. The bus rumbled through the sleeping town. She watched the streetlights slide past, one, two, three, like orange moons."}, {"type": "p", "text": "Then, with a jolt and a groan, the bus stopped. The engine coughed and went silent. The driver tried the key again. Nothing. The passengers looked at one another, perplexed."}, {"type": "p", "text": "“Sorry, folks,” he called. “We're stuck. Help's on its way, but it could be an hour.”"}, {"type": "p", "text": "Jasmine's dad sighed. The nurse groaned. Jasmine felt her eyes prickle. She was so tired, and so far from her bed."}, {"type": "p", "text": "Then the man with the guitar case sat up. “Well,” he said, “if we're going to be here a while…” He opened the case and began to play a gentle, rolling tune."}, {"type": "p", "text": "The old lady smiled and hummed along. The teenage boy put down his book. The nurse took out a bag of mints and passed it round. The driver turned off the bright lights and switched on the little ones above the seats, so that the bus glowed softly."}, {"type": "p", "text": "Jasmine did not remember the rest of the journey. She only remembered the music, the smell of peppermint and the old lady tucking a warm red scarf around her shoulders. When she woke up the next morning, she was in her own bed, and the scarf was still round her neck."}], "questions": [{"stem": "Which TWO details show that Jasmine was tired and uncomfortable?", "options": ["She was hungry and her head hurt.", "Her shoes pinched and her eyes kept closing.", "Her coat was wet and her hands were cold.", "Her bag was heavy and her phone was broken."], "answer": "B", "skill": "Inference", "mode": "clue", "ev": [{"b": 0, "t": "Her shoes pinched, her party dress was crumpled and her eyes kept closing on their own."}], "why": "Pinching shoes are uncomfortable. Eyes that keep closing show she is tired."}, {"stem": "“its windows glowing yellow like a lantern” What does this comparison suggest?", "options": ["The bus had no lights.", "The bus looked warm and welcoming in the dark.", "The bus was very old.", "The bus was on fire."], "answer": "B", "skill": "Vocabulary & language", "mode": "clue", "ev": [{"b": 0, "t": "It was nearly midnight"}, {"b": 1, "t": "its windows glowing yellow like a lantern"}], "why": "It is dark and nearly midnight. A lantern gives warm, friendly light in the dark, so the bus looks welcoming."}, {"stem": "Why is the word EMPTY written in capital letters?", "options": ["Because it was written on the side of the bus", "To stress how few people were on the bus", "Because the bus had no seats", "Because the driver shouted it"], "answer": "B", "skill": "Author's technique", "mode": "clue", "ev": [{"b": 2, "t": "Inside, the bus was nearly EMPTY. There were only four other passengers."}], "why": "Capital letters make a word stand out. The next sentence backs it up: only four other passengers."}, {"stem": "Which option correctly matches each passenger to what they were doing?", "options": ["Nurse → playing guitar; Man → yawning; Old lady → reading; Teenage boy → knitting", "Nurse → knitting; Man → reading; Old lady → yawning; Teenage boy → playing guitar", "Nurse → yawning; Man → resting his head against the window; Old lady → knitting; Teenage boy → reading", "Nurse → reading; Man → knitting; Old lady → playing guitar; Teenage boy → yawning"], "answer": "C", "skill": "Retrieval", "mode": "find", "ev": [{"b": 2, "t": "A nurse in a blue uniform sat near the front, yawning."}, {"b": 2, "t": "A man with a guitar case sat with his head against the window."}, {"b": 2, "t": "An old lady in a hat with a long pheasant feather was knitting something red."}, {"b": 2, "t": "a teenage boy was reading a thick book with a torch"}], "why": "Find each passenger in turn and read what they are doing."}, {"stem": "Why did Jasmine's eyes “prickle”?", "options": ["She had something in her eye.", "The lights were too bright.", "She was allergic to the old lady's feather.", "She was close to tears because she was tired and far from home."], "answer": "D", "skill": "Inference", "mode": "clue", "ev": [{"b": 6, "t": "Jasmine felt her eyes prickle. She was so tired, and so far from her bed."}], "why": "Eyes prickle just before tears come. The next sentence gives the reason."}, {"stem": "Which option shows how the passengers joined in, in the correct order?", "options": ["The nurse shares mints → the man plays → the old lady hums → the boy puts down his book", "The old lady hums → the man plays → the nurse shares mints → the boy puts down his book", "The man plays → the old lady hums → the boy puts down his book → the nurse shares mints", "The boy puts down his book → the nurse shares mints → the old lady hums → the man plays"], "answer": "C", "skill": "Structure & sequence", "mode": "find", "ev": [{"b": 7, "t": "began to play a gentle, rolling tune"}, {"b": 8, "t": "The old lady smiled and hummed along. The teenage boy put down his book. The nurse took out a bag of mints and passed it round."}], "why": "Read these sentences in order. The order in the text is the order it happened."}, {"stem": "Why did the driver switch to the little lights?", "options": ["Because the big lights were broken", "To make the bus feel calm and cosy", "So that Jasmine could read", "To save the battery for the engine"], "answer": "B", "skill": "Inference", "mode": "clue", "ev": [{"b": 8, "t": "switched on the little ones above the seats, so that the bus glowed softly"}], "why": "Soft, glowing light feels calm and cosy. It matches the gentle music."}, {"stem": "Why does Jasmine remember only small things about the rest of the journey?", "options": ["She got off the bus early.", "She was reading a book.", "She was too busy talking.", "She fell asleep on the bus."], "answer": "D", "skill": "Inference", "mode": "clue", "ev": [{"b": 9, "t": "Jasmine did not remember the rest of the journey."}, {"b": 9, "t": "When she woke up the next morning, she was in her own bed"}], "why": "She remembers very little, and then she woke up. She must have fallen asleep on the bus."}, {"stem": "What does the red scarf at the end show?", "options": ["The old lady had given Jasmine the scarf she was knitting.", "Jasmine had bought a scarf at the wedding.", "Jasmine had stolen the scarf.", "Her dad had knitted her a scarf."], "answer": "A", "skill": "Inference", "mode": "clue", "ev": [{"b": 2, "t": "was knitting something red"}, {"b": 9, "t": "the old lady tucking a warm red scarf around her shoulders"}, {"b": 9, "t": "the scarf was still round her neck"}], "why": "The old lady was knitting something red. Later she tucks a red scarf round Jasmine, and Jasmine still has it in the morning."}]}, {"kind": "Information text", "title": "Meet Marlow Webb, the Welly Wizard", "subtitle": null, "blocks": [{"type": "p", "text": "If you have ever splashed through a puddle in a pair of bright, spotty wellington boots, you may have Marlow Webb to thank. Marlow is a British designer whose colourful wellies are now famous all over the world."}, {"type": "caption", "text": "Above: Marlow in his workshop, holding a pair of his rainbow ‘Puddle Pals’."}, {"type": "h", "text": "From a garden shed to the world"}, {"type": "p", "text": "Marlow did not always make boots. As a boy, he loved to make things out of anything he could find. One rainy day, his little niece was crying because her plain grey wellies were so boring, so Marlow painted them with bright yellow stars. She loved them so much that soon all her friends wanted a pair too."}, {"type": "p", "text": "Marlow began making boots in his garden shed. Then he sold them from a stall at the local market. Next he opened a tiny shop. Today his award-winning wellies are sold in shops all around the world."}, {"type": "h", "text": "The dream boots"}, {"type": "p", "text": "Marlow’s boots come in every colour you can imagine, and some have elaborate patterns. There are wellies covered in frogs, wellies that glow in the dark, and matching pairs for grown-ups and children that he calls ‘sole’ mates. He even makes tiny wellies for garden gnomes! His boots are perfect for jumping in puddles, working in the garden, or dancing at a muddy music festival."}, {"type": "p", "text": "DID YOU KNOW?  To the astonishment of visitors, Marlow once built a giant welly as tall as a door for a museum."}], "questions": [{"stem": "According to the article, name TWO things Marlow’s boots are good for.", "options": ["Jumping in puddles and working in the garden", "Cooking dinner and reading books", "Swimming in the sea and flying a plane", "Sleeping and writing letters"], "answer": "A", "skill": "Retrieval", "mode": "find", "ev": [{"b": 6, "t": "His boots are perfect for jumping in puddles, working in the garden, or dancing at a muddy music festival."}], "why": "The text lists three things. The correct answer names two of them."}, {"stem": "Why is ‘sole’ mates written with inverted commas (‘  ’) around the word ‘sole’?", "options": ["Someone is speaking the words out loud.", "It is the name of Marlow’s shop.", "It is a spelling mistake in the article.", "It is a play on words — ‘sole’ (of a boot) sounds like ‘soul’ in ‘soul mates’."], "answer": "D", "skill": "Author's technique", "mode": "clue", "ev": [{"b": 6, "t": "matching pairs for grown-ups and children that he calls ‘sole’ mates"}], "why": "The sole is the bottom of a boot. It sounds the same as soul in soul mates, which means a perfect pair. The inverted commas point to the joke."}, {"stem": "The line in italics, “Above: Marlow in his workshop, holding a pair of his rainbow ‘Puddle Pals’,” is —", "options": ["a caption that tells you about the photograph.", "the main title of the whole article.", "a ‘Did you know?’ fact box.", "a subheading."], "answer": "A", "skill": "Retrieval", "mode": "find", "ev": [{"b": 1, "t": "Above: Marlow in his workshop, holding a pair of his rainbow ‘Puddle Pals’."}], "why": "The word Above points to a picture. A line that tells you about a picture is a caption."}, {"stem": "Which option shows how Marlow’s business grew, in the correct order?", "options": ["Opened a shop → worked in a shed → sold around the world → had a market stall", "Made boots in his shed → sold them at a market stall → opened a shop → sold them around the world", "Sold around the world → opened a shop → had a market stall → worked in a shed", "Had a market stall → sold around the world → worked in a shed → opened a shop"], "answer": "B", "skill": "Structure & sequence", "mode": "find", "ev": [{"b": 4, "t": "Marlow began making boots in his garden shed. Then he sold them from a stall at the local market. Next he opened a tiny shop. Today his award-winning wellies are sold in shops all around the world."}], "why": "The time words Then, Next and Today show the order."}, {"stem": "Which word from the article best shows that Marlow’s company has been successful?", "options": ["“rainy”", "“grey”", "“boring”", "“award-winning”"], "answer": "D", "skill": "Vocabulary & language", "mode": "find", "ev": [{"b": 4, "t": "award-winning"}], "why": "Award-winning means the wellies have won prizes. Only something successful wins awards."}, {"stem": "What do you think was the main reason Marlow set up his own boot company?", "options": ["He wanted to become a famous painter.", "He did not like the rain at all.", "He wanted to turn dull, boring wellies into something cheerful and fun for children.", "He wanted to open a sweet shop instead."], "answer": "C", "skill": "Inference", "mode": "clue", "ev": [{"b": 3, "t": "his little niece was crying because her plain grey wellies were so boring, so Marlow painted them with bright yellow stars"}, {"b": 3, "t": "She loved them so much that soon all her friends wanted a pair too."}], "why": "It all began when he made boring wellies cheerful for his niece. Then other children wanted them too."}]}]}, {"year": 5, "age": "9–10", "minutes": 30, "listen": false, "parts": [{"kind": "Story", "title": "The Stone Soup of Harrowdale", "subtitle": "A traveller's tale, told in many lands.", "blocks": [{"type": "p", "text": "The village of Harrowdale had had a long and arduous winter. The harvest had been poor, the snow had lasted into spring and every family had hidden away whatever food they had left. Doors were bolted. Curtains were drawn. Nobody shared anything with anybody."}, {"type": "p", "text": "Into this unfriendly village one evening walked a traveller. She was tall and thin, with a patched green cloak and a large iron pot strapped to her back. She knocked at door after door, asking for a bite to eat, and at every door she was turned away."}, {"type": "p", "text": "“There's nothing to spare,” they said. “Not a crumb.”"}, {"type": "p", "text": "The traveller did not seem upset. She was a resilient soul. She walked to the middle of the village green, set down her pot and filled it with water from the pump. Then she built a small fire beneath it, took a smooth grey stone from her pocket and dropped it in with a plop."}, {"type": "p", "text": "Curtains twitched. Doors creaked open a crack. At last, a curious boy called Edwin wandered over. “What are you making?” he asked, perplexed."}, {"type": "p", "text": "“Stone soup,” said the traveller, stirring diligently. “It's delicious. Though, of course, it's even better with an onion.”"}, {"type": "p", "text": "Edwin thought about the onions in his mother's cellar. He ran home and came back with one. The traveller chopped it and dropped it in. “Wonderful,” she said, sniffing the steam. “Though a carrot or two would make it really special.”"}, {"type": "p", "text": "Old Mrs Dunmore, who had been watching from her doorway, fetched three carrots from her store. Then the blacksmith brought a handful of barley. The baker's wife brought some herbs. Farmer Gale brought a ham bone, and the twins from the mill brought a bag of potatoes."}, {"type": "p", "text": "The pot bubbled. The smell drifted through the village, rich and warm, and more and more people came out of their houses, each carrying something small. Someone brought bowls. Someone brought a lantern. Someone brought a fiddle and began to play."}, {"type": "p", "text": "That night, the whole of Harrowdale sat together on the village green, eating the finest soup they had ever tasted. People who had not spoken all winter laughed and passed the bread. Children chased each other round the pump."}, {"type": "p", "text": "In the morning, the traveller was gone. All that was left was the smooth grey stone, sitting on the edge of the pump. Edwin picked it up and kept it in his pocket for the rest of his life."}, {"type": "p", "text": "Every year since then, on the first warm evening of spring, the people of Harrowdale gather on the green to make stone soup. And everyone, without fail, brings something to put in the pot."}], "questions": [{"stem": "Which TWO phrases best show that the people of Harrowdale were not sharing?", "options": ["“laughed and passed the bread” and “chased each other”", "“Doors were bolted” and “Nobody shared anything with anybody”", "“The pot bubbled” and “rich and warm”", "“a patched green cloak” and “a large iron pot”"], "answer": "B", "skill": "Inference", "mode": "find", "ev": [{"b": 0, "t": "Doors were bolted. Curtains were drawn. Nobody shared anything with anybody."}], "why": "Both phrases are in the first paragraph. Bolted doors keep people out, and the last sentence says it plainly."}, {"stem": "Why had the families hidden away their food?", "options": ["They had had a poor harvest and a long winter.", "The mayor told them to.", "They were saving it for a party.", "The traveller had stolen food before."], "answer": "A", "skill": "Inference", "mode": "clue", "ev": [{"b": 0, "t": "The harvest had been poor, the snow had lasted into spring and every family had hidden away whatever food they had left."}], "why": "The reasons come first in the sentence: a poor harvest and a long, snowy winter. Food was short, so families hid it."}, {"stem": "“Curtains twitched. Doors creaked open a crack.” What do these sentences show?", "options": ["The houses were falling down.", "The villagers were curious but still cautious.", "The wind was blowing through the village.", "The villagers were going to sleep."], "answer": "B", "skill": "Inference", "mode": "clue", "ev": [{"b": 4, "t": "Curtains twitched. Doors creaked open a crack. At last, a curious boy called Edwin wandered over."}], "why": "People are peeping out, so they are curious. But the doors open only a crack, so they are still careful."}, {"stem": "Why does the traveller keep saying the soup would be “even better” with another ingredient?", "options": ["She did not like the taste of stones.", "She was a famous cook.", "She wanted the villagers to leave her alone.", "She was cleverly persuading people to share their food."], "answer": "D", "skill": "Inference", "mode": "clue", "ev": [{"b": 5, "t": "Though, of course, it's even better with an onion."}, {"b": 6, "t": "Though a carrot or two would make it really special."}, {"b": 7, "t": "fetched three carrots from her store"}], "why": "Each time she says this, someone fetches that food. Her hints are a clever way to get people to share."}, {"stem": "Which option correctly matches each villager to what they brought?", "options": ["Mrs Dunmore → potatoes; Blacksmith → herbs; Farmer Gale → an onion", "Mrs Dunmore → a ham bone; Blacksmith → carrots; Farmer Gale → barley", "Mrs Dunmore → carrots; Blacksmith → barley; Farmer Gale → a ham bone", "Mrs Dunmore → barley; Blacksmith → a ham bone; Farmer Gale → carrots"], "answer": "C", "skill": "Retrieval", "mode": "find", "ev": [{"b": 7, "t": "Old Mrs Dunmore, who had been watching from her doorway, fetched three carrots from her store."}, {"b": 7, "t": "Then the blacksmith brought a handful of barley."}, {"b": 7, "t": "Farmer Gale brought a ham bone"}], "why": "Find each villager in turn and read what they brought."}, {"stem": "How did the mood of the village change during the evening?", "options": ["It changed from unfriendly and closed to warm and joyful.", "It changed from happy to angry.", "It changed from busy to silent.", "It stayed gloomy all night."], "answer": "A", "skill": "Retrieval", "mode": "clue", "ev": [{"b": 0, "t": "Nobody shared anything with anybody."}, {"b": 9, "t": "That night, the whole of Harrowdale sat together on the village green, eating the finest soup they had ever tasted."}], "why": "Compare the start with the end. The village begins shut away and unfriendly. By night everyone is sitting together."}, {"stem": "Which detail shows that the villagers had made up after the hard winter?", "options": ["“The pot bubbled.”", "“People who had not spoken all winter laughed and passed the bread.”", "“In the morning, the traveller was gone.”", "“Someone brought a lantern.”"], "answer": "B", "skill": "Inference", "mode": "clue", "ev": [{"b": 9, "t": "People who had not spoken all winter laughed and passed the bread."}], "why": "Not speaking all winter shows they had fallen out. Laughing and passing bread shows they are friends again."}, {"stem": "Why do you think Edwin kept the stone for the rest of his life?", "options": ["The traveller asked him to.", "It was a valuable jewel.", "It reminded him of what the village learned about sharing.", "He wanted to make stone soup alone."], "answer": "C", "skill": "Inference", "mode": "clue", "ev": [{"b": 10, "t": "All that was left was the smooth grey stone"}, {"b": 10, "t": "Edwin picked it up and kept it in his pocket for the rest of his life."}, {"b": 11, "t": "And everyone, without fail, brings something to put in the pot."}], "why": "It is only a plain grey stone, not a jewel. It started the night the village learned to share, so it reminds him of that."}, {"stem": "What is the main message of the story?", "options": ["When everyone gives a little, there is enough for all.", "Winter is the best season.", "Stones make the best soup.", "Never trust a traveller."], "answer": "A", "skill": "Summarising", "mode": "whole", "ev": [{"b": 0, "t": "Nobody shared anything with anybody."}, {"b": 8, "t": "more and more people came out of their houses, each carrying something small"}, {"b": 11, "t": "And everyone, without fail, brings something to put in the pot."}], "why": "Each person brought only something small. Together it made the finest soup they had ever tasted, with enough for everyone."}]}, {"kind": "Information text", "title": "Step Back in Time at Hollowmere", "subtitle": "An Iron Age Living History Village", "blocks": [{"type": "h", "text": "Welcome to Hollowmere"}, {"type": "p", "text": "Hollowmere is not an ordinary museum. In most museums you walk past objects locked behind glass. At Hollowmere you step right inside the past. Our village has been built exactly as one might have looked in Britain more than two thousand years ago, with round houses of wattle walls and golden thatch. Guides in woollen cloaks light the fires, cook the food and care for the animals, just as the first villagers once did."}, {"type": "h", "text": "Life long ago"}, {"type": "p", "text": "The people who lived here had no books and no writing of any kind. Instead, they shared everything they knew about the past by telling stories aloud, passing each tale from grandparent to grandchild around the evening fire. Everyone helped to find food. In summer they cut their barley with a curved iron sickle, and in the river below the village they caught fish in a woven willow trap. The round houses were always full of the smell of woodsmoke, wool and warm bread."}, {"type": "p", "text": "Turning barley into bread was an intricate job with many steps. First the barley was cut with the sickle. Next it was beaten to shake the grain loose. The grain was then ground into flour on a heavy stone quern. After that, the flour was mixed with water to make a dough, and finally the dough was baked on the hot hearth-stones into flat, round loaves."}, {"type": "h", "text": "Things to do"}, {"type": "p", "text": "There is plenty for visitors to try. You can grind grain into flour on a quern, weave a strip of woollen cloth, or shape a small pot out of river clay. Before you try any activity, please collect a wooden token from the desk in the Great Roundhouse."}, {"type": "h", "text": "Plan your visit"}, {"type": "p", "text": "A meticulous map of the village is printed on the back of this leaflet. It shows where each round house stands and marks the quickest path from the gate down to the river. For more, visit our website, which gives directions by bus and a calendar of special event days. This booklet lists our opening times and the price of tickets. We hope to see you soon at Hollowmere!"}], "questions": [{"stem": "According to the leaflet, how did the people of Hollowmere share information about the past?", "options": ["They wrote it down carefully in books.", "They told stories aloud, passing them from grandparent to grandchild.", "They drew maps on the walls of the round houses.", "They printed leaflets like this one."], "answer": "B", "skill": "Retrieval", "mode": "find", "ev": [{"b": 3, "t": "they shared everything they knew about the past by telling stories aloud, passing each tale from grandparent to grandchild around the evening fire"}], "why": "The sentence before says they had no writing. The word Instead introduces what they did."}, {"stem": "Why is Hollowmere different from an ordinary museum?", "options": ["It is only open during the summer holidays.", "It is much smaller than most other museums.", "Visitors can step inside the past and see people living as they once did, instead of only looking at objects behind glass.", "It does not let any visitors come inside."], "answer": "C", "skill": "Inference", "mode": "clue", "ev": [{"b": 1, "t": "In most museums you walk past objects locked behind glass. At Hollowmere you step right inside the past."}, {"b": 1, "t": "Guides in woollen cloaks light the fires, cook the food and care for the animals, just as the first villagers once did."}], "why": "The writer compares the two. In most museums you only look. Here you step inside and watch people living as they once did."}, {"stem": "The leaflet describes how barley was turned into bread. Which option shows the steps in the correct order?", "options": ["Cut the barley → grind into flour → bake → beat the grain loose → mix with water", "Bake → mix with water → grind into flour → cut the barley → beat the grain loose", "Grind into flour → cut the barley → bake → mix with water → beat the grain loose", "Cut the barley → beat the grain loose → grind into flour → mix with water → bake"], "answer": "D", "skill": "Structure & sequence", "mode": "find", "ev": [{"b": 4, "t": "First the barley was cut with the sickle. Next it was beaten to shake the grain loose. The grain was then ground into flour on a heavy stone quern. After that, the flour was mixed with water to make a dough, and finally the dough was baked on the hot hearth-stones into flat, round loaves."}], "why": "Follow the order words: First, Next, then, After that, finally."}, {"stem": "Which TWO tools helped the villagers to gather food?", "options": ["A map and a booklet", "A woollen cloak and a wooden token", "A stone quern and a clay pot", "A curved iron sickle and a woven willow fish trap"], "answer": "D", "skill": "Retrieval", "mode": "find", "ev": [{"b": 3, "t": "In summer they cut their barley with a curved iron sickle, and in the river below the village they caught fish in a woven willow trap."}], "why": "Barley and fish are both food. The sentence names the tool used for each."}, {"stem": "Which phrase from the leaflet uses alliteration?", "options": ["“wattle walls and golden thatch”", "“a curved iron sickle”", "“locked behind glass”", "“more than two thousand years ago”"], "answer": "A", "skill": "Author's technique", "mode": "find", "ev": [{"b": 1, "t": "wattle walls"}], "why": "Alliteration means words close together that begin with the same sound. Wattle and walls both begin with w."}, {"stem": "In which section would this sentence best fit?  “In winter, the villagers wrapped themselves in thick sheepskins to keep out the cold.”", "options": ["Plan your visit", "Welcome to Hollowmere", "Things to do", "Life long ago"], "answer": "D", "skill": "Structure & sequence", "mode": "clue", "ev": [{"b": 2, "t": "Life long ago"}, {"b": 3, "t": "The round houses were always full of the smell of woodsmoke, wool and warm bread."}], "why": "The new sentence is about how the villagers lived in the past. This section is about exactly that. The other sections are about visiting today."}]}]}, {"year": 6, "age": "10–11", "minutes": 35, "listen": false, "parts": [{"kind": "Story", "title": "The Bridge", "subtitle": "In this part of the story, a girl who is afraid of heights must cross a rope bridge during a school trip.", "blocks": [{"type": "p", "text": "The bridge was longer than it had looked in the brochure. Much longer."}, {"type": "p", "text": "It stretched across the gorge like a single strand of a spider's web, a narrow path of wooden slats strung between two thick ropes, and it moved. Not much. Just a gentle, sickening sway, back and forth, as if it were breathing. Far, far below, a formidable river crashed white over black rocks, and the roar of it came up to us in waves."}, {"type": "p", "text": "One by one, the others in my class stepped onto it and crossed. Some ran. Some whooped. Jake bounced on purpose, to make the girls behind him shriek. Within ten minutes, inevitably, everyone was on the far side except me and Miss Okoye."}, {"type": "p", "text": "“Take your time, Hana,” she said. “There's no rush.”"}, {"type": "p", "text": "There was a rush. I could feel it, the weight of twenty-eight faces turned towards me from the far side of the gorge. My hands were wet inside my gloves. My legs had stopped belonging to me. I stood at the edge of the first slat and stared at it as if it might bite."}, {"type": "p", "text": "I had always been like this. Ladders, balconies, the top deck of the bus: anywhere high made my stomach turn to water. My brother said I was being silly. My mother said I'd grow out of it. I hadn't."}, {"type": "p", "text": "“Do you want to know a secret?” said Miss Okoye. She was standing beside me, not looking at the bridge at all, but at me. “I'm terrified of heights.”"}, {"type": "p", "text": "I stared at her, bewildered. Miss Okoye climbed mountains in the holidays. She had shown us photographs."}, {"type": "p", "text": "“Every single time,” she said. “My heart goes like a drum and my knees go like jelly. But I've learned something. You don't have to stop being afraid. You just have to take one step while you're afraid. Then another one.”"}, {"type": "p", "text": "She held out her hand. I took it."}, {"type": "p", "text": "The first slat creaked under my foot. The bridge dipped. I gasped and gripped the rope tenaciously, so hard that it burned my palm. “Don't look down,” said Miss Okoye. “Look at the far side. Look at the tree with the red leaves.”"}, {"type": "p", "text": "I looked at the tree. Step. Step. The wind tugged at my hood. The river roared. Step. The bridge swayed, and I swayed with it, and I didn't fall. Step. Halfway. A bird shot out from under the slats and I nearly screamed, but I didn't stop. Step."}, {"type": "p", "text": "The red tree grew bigger and bigger, until suddenly it was right in front of me, and there was solid rock under my boots, and twenty-eight people were cheering."}, {"type": "p", "text": "I turned round and looked back at the bridge. It still looked impossibly long and thin and frightening. My legs were still shaking."}, {"type": "p", "text": "But I had crossed it."}, {"type": "p", "text": "Miss Okoye squeezed my hand. “Same time next year?” she said, and I laughed, and the laugh came out wobbly and huge, and it felt like flying."}], "questions": [{"stem": "“like a single strand of a spider's web” What does this comparison suggest about the bridge?", "options": ["It looked thin, delicate and fragile.", "It was sticky.", "It was very strong.", "It was full of spiders."], "answer": "A", "skill": "Vocabulary & language", "mode": "clue", "ev": [{"b": 1, "t": "It stretched across the gorge like a single strand of a spider's web, a narrow path of wooden slats strung between two thick ropes"}], "why": "One strand of a web is very thin and easily broken. The words a narrow path back this up."}, {"stem": "“as if it were breathing” Why might the author describe the bridge's movement this way?", "options": ["To show that the bridge had fallen down", "To make the bridge seem alive and unsettling", "To show that the bridge was very still", "To show that animals lived on it"], "answer": "B", "skill": "Author's technique", "mode": "clue", "ev": [{"b": 1, "t": "Just a gentle, sickening sway, back and forth, as if it were breathing."}], "why": "Only living things breathe. Making the bridge seem alive, alongside the word sickening, makes it unsettling."}, {"stem": "Why did Hana feel there WAS a rush, even though Miss Okoye said there wasn't?", "options": ["It was getting dark.", "The bridge was going to close.", "Everyone else was watching and waiting for her.", "The bus was about to leave."], "answer": "C", "skill": "Inference", "mode": "clue", "ev": [{"b": 4, "t": "There was a rush. I could feel it, the weight of twenty-eight faces turned towards me from the far side of the gorge."}], "why": "Twenty-eight faces are watching and waiting. Hana feels their attention as a weight pressing on her."}, {"stem": "Which TWO details show how frightened Hana was before she stepped on?", "options": ["She ran across quickly.", "She was laughing and whooping.", "She was hungry and tired.", "Her hands were wet and her legs “had stopped belonging” to her."], "answer": "D", "skill": "Inference", "mode": "find", "ev": [{"b": 4, "t": "My hands were wet inside my gloves. My legs had stopped belonging to me."}], "why": "Both details are side by side. They describe her body reacting to fear before she steps on."}, {"stem": "Why was Hana surprised by Miss Okoye's secret?", "options": ["Miss Okoye was usually unkind.", "Miss Okoye climbed mountains, so Hana thought she could not be afraid of heights.", "Hana did not know Miss Okoye.", "Miss Okoye had never been on a bridge."], "answer": "B", "skill": "Inference", "mode": "clue", "ev": [{"b": 6, "t": "I'm terrified of heights."}, {"b": 7, "t": "I stared at her, bewildered. Miss Okoye climbed mountains in the holidays. She had shown us photographs."}], "why": "Mountains are high places. Hana cannot see how someone who climbs them could be terrified of heights."}, {"stem": "What is the main idea of Miss Okoye's advice?", "options": ["Only some people can be brave.", "You can be brave by acting even while you are afraid.", "You should never do things that scare you.", "Fear always goes away if you wait."], "answer": "B", "skill": "Summarising", "mode": "find", "ev": [{"b": 8, "t": "You don't have to stop being afraid. You just have to take one step while you're afraid. Then another one."}], "why": "She says the fear does not have to go away. Being brave means taking the step anyway."}, {"stem": "Why did Miss Okoye tell Hana to look at the tree with the red leaves?", "options": ["So Hana could pick some leaves", "Because the tree was very beautiful", "To give her something to focus on instead of the drop", "To check the weather"], "answer": "C", "skill": "Inference", "mode": "clue", "ev": [{"b": 10, "t": "“Don't look down,” said Miss Okoye. “Look at the far side. Look at the tree with the red leaves.”"}], "why": "Don't look down comes first. The tree gives Hana something to fix her eyes on instead of the drop."}, {"stem": "Why does the author repeat the word “Step” on its own?", "options": ["To show Hana's slow, steady progress, one movement at a time", "To show that Hana had stopped", "To show that Hana was running", "To count the slats on the bridge"], "answer": "A", "skill": "Author's technique", "mode": "clue", "ev": [{"b": 11, "t": "I looked at the tree. Step. Step. The wind tugged at my hood. The river roared. Step. The bridge swayed, and I swayed with it, and I didn't fall. Step. Halfway. A bird shot out from under the slats and I nearly screamed, but I didn't stop. Step."}], "why": "Count how many times Step appears. Each one is a single careful movement, so the crossing feels slow and steady."}, {"stem": "Why does the author write “But I had crossed it.” as a separate paragraph?", "options": ["To emphasise Hana's achievement, even though she was still afraid", "To show the story was about to begin", "To show that the bridge had broken", "To show that Hana wanted to cross again"], "answer": "A", "skill": "Author's technique", "mode": "clue", "ev": [{"b": 13, "t": "It still looked impossibly long and thin and frightening. My legs were still shaking."}, {"b": 14, "t": "But I had crossed it."}], "why": "The paragraph before says she is still frightened. Setting this short sentence on its own makes her achievement stand out."}]}, {"kind": "Information text", "title": "Raised from the Deep: The Story of the Mary Rose", "subtitle": null, "blocks": [{"type": "h", "text": "A famous ship"}, {"type": "p", "text": "The Mary Rose was one of the favourite warships of King Henry VIII. She was built in Portsmouth and first set sail in 1511. At her largest she carried as many as 400 men and dozens of heavy guns. For more than thirty years she sailed for England, and the king himself is said to have watched her from the shore."}, {"type": "h", "text": "The day she sank"}, {"type": "p", "text": "On 19 July 1545, a French fleet sailed into the Solent, the stretch of water between Portsmouth and the Isle of Wight. The Mary Rose went out to meet them. But as she turned, she leaned hard to one side, water poured in through her open gun-ports, and within minutes she rolled over and sank. Of the hundreds of men aboard, only around thirty-five survived. Many were trapped beneath the netting that had been stretched across the deck to stop enemies climbing aboard. One man who watched from the shore wrote that she “did suddenly cast about, and so was lost, with all her company, alack.”"}, {"type": "h", "text": "Lost and forgotten"}, {"type": "p", "text": "The wreck settled into the soft mud of the seabed and lay there, undisturbed, for more than four centuries. The mud turned out to be the ship’s good fortune. The half of the hull that sank down into it was sealed away from the water, the currents and the tiny creatures that would otherwise have eaten the timbers away. The other half, left standing in the open water, slowly rotted and disappeared. For centuries no one tried to raise her: divers had no safe way to work at such a depth, and no one knew exactly where she lay."}, {"type": "h", "text": "The search begins"}, {"type": "p", "text": "In 1965 a diver and historian named Alexander McKee began a meticulous search of the seabed. It took six years of diving in cold, dark, muddy water before the team could be certain they had found the elusive wreck at last."}, {"type": "p", "text": "“The men were probably trapped in seconds,” explains a marine archaeologist who has studied the wreck. “Once the ship rolled, there was almost no time to escape.”"}, {"type": "h", "text": "Bringing her home"}, {"type": "p", "text": "On 11 October 1982, watched by millions of television viewers, the hull of the Mary Rose was lifted gently from the seabed and brought ashore. With it came an astonishing collection of objects: longbows, leather shoes, wooden bowls, a barber-surgeon’s intricate tools, even the skeleton of the ship’s dog. Because the mud had preserved everything so well, the wreck is like a sealed message from the past. It shows us, more clearly than any book could, how Tudor sailors lived, worked, ate and fought. Today the Mary Rose has her own museum in Portsmouth, where visitors can stand before her timbers and look, as one writer put it, straight into the year 1545."}], "questions": [{"stem": "Why does the writer include the detail that “the king himself is said to have watched her from the shore”?", "options": ["To prove that the king built the ship himself.", "To suggest the king caused the ship to sink.", "To show how important and valued the ship was.", "To explain that the king enjoyed swimming."], "answer": "C", "skill": "Author's technique", "mode": "clue", "ev": [{"b": 1, "t": "The Mary Rose was one of the favourite warships of King Henry VIII."}, {"b": 1, "t": "the king himself is said to have watched her from the shore"}], "why": "A king has many ions": ["Because she does not care about being accurate.", "Because she is completely certain it is true.", "Because no one can be completely sure, so it is a careful expert guess based on evidence.", "Because the men themselves told her what happened."], "answer": "C", "skill": "Inference", "mode": "clue", "ev": [{"b": 8, "t": "“The men were probably trapped in seconds,” explains a marine archaeologist who has studied the wreck."}], "why": "Nobody alive saw it happen. She has studied the wreck, so this is a careful judgement from evidence, not a certainty."}, {"stem": "“…the wreck is like a sealed message from the past.”  What does this phrase tell us about the Mary Rose?", "options": ["It was locked shut with a key.", "It contained secret letters from the king.", "It was preserved untouched, carrying information about the past directly to us today.", "It was very difficult to understand."], "answer": "C", "skill": "Inference", "mode": "clue", "ev": [{"b": 10, "t": "Because the mud had preserved everything so well, the wreck is like a sealed message from the past. It shows us, more clearly than any book could, how Tudor sailors lived, worked, ate and fought."}], "why": "A sealed message arrives unopened and unchanged. The mud kept the wreck that way, so it tells us directly about Tudor life."}]}]}];
