function markText(text, spots){
  const hits = spots.map(s=>({k:s.k, i:text.indexOf(s.t), len:s.t.length, many:s.many})).filter(h=>h.i>=0).sort((a,b)=>a.i-b.i);
  let out = "", at = 0;
  hits.forEach(h=>{
    if(h.i < at) return;
    out += esc(text.slice(at,h.i)) + `<mark class="ev" data-k="${h.k}">${h.many?`<span class="evn">${h.k+1}</span>`:""}${esc(text.slice(h.i,h.i+h.len))}</mark>`;
    at = h.i + h.len;
  });
  return out + esc(text.slice(at));
}
function passageHTML(p, ev, tools){
  ev = (ev||[]).map((e,k)=>({...e, k, many:ev.length>1}));
  return `<div class="plbl">${p.label} · ${esc(p.kind)}</div><div class="ttl">${esc(p.title)}</div>${p.subtitle?`<p class="tsub">${esc(p.subtitle)}</p>`:""}${tools||""}` +
    p.blocks.map((b,bi)=>{ const tx = markText(b.text, ev.filter(e=>e.b===bi));
      return b.type==="h" ? `<div class="ph">${tx}</div>`
        : b.type==="caption" ? `<p class="para cap"><span class="pn"></span><span>${tx}</span></p>`
        : `<p class="para"><span class="pn">${b.pn}</span><span>${tx}</span></p>`; }).join("");
}
function listenRow(p){ return PAPER.listen && canSpeak ? `<div class="listen-row"><button class="btn ghost small" type="button" id="sayText">▶ Listen to the ${p.kind==="Story"?"story":"text"}</button><button class="btn ghost small" type="button" id="sayStop">■ Stop</button></div>` : ""; }

/* ---------- start ---------- */
function renderStart(){
  $("timer").hidden = true; $("fsBtn").hidden = true;
  const nA = PARTS[0].questions.length, nB = PARTS[1].questions.length;
  $("main").innerHTML = `<div class="start">
    <section class="card">
      <p class="lbl">Choose your year</p>
      <div class="years" role="group" aria-label="Year">${PAPERS.map(p=>`<button class="yr" type="button" data-year="${p.year}" aria-pressed="${p.year===PAPER.year}"><b>Year ${p.year}</b><span>age ${p.age}</span></button>`).join("")}</div>
      <h2>Read two texts and answer the questions</h2>
      <p class="lead">First a story, then an information text. Each question has ${ALL[0].options.length===3?"three":"three or more"} answers. Choose the best one.${PAPER.listen&&canSpeak?" You can press Listen to hear the text and the questions.":""}</p>
      <div class="steps">
        <div class="step"><span class="n">1</span><span>Read the text on the left carefully.</span></div>
        <div class="step"><span class="n">2</span><span>Choose one answer for each question. You can change your mind.</span></div>
        <div class="step"><span class="n">★</span><span>Press Full screen at the top if you want the test to fill the screen.</span></div>
        <div class="step"><span class="n">3</span><span>Press End test when you finish.</span></div>
        <div class="step"><span class="n">4</span><span>Check your answers. The text zooms in to show where each answer is.</span></div>
      </div>
      <label class="f" for="nameIn">Your name (if you like)<input id="nameIn" type="text" autocomplete="off" maxlength="40" value="${esc(S.name)}"></label>
      <button class="btn" type="button" id="startBtn">Start the test</button>
    </section>
    <aside class="card">
      <div class="sec" style="margin-top:0">Year ${PAPER.year} paper</div>
      <ul class="facts">
        <li><span>Text A · Story</span><b>${esc(PARTS[0].title)}<br>${nA} questions</b></li>
        <li><span>Text B · Information</span><b>${esc(PARTS[1].title)}<br>${nB} questions</b></li>
        <li><span>Questions</span><b>${ALL.length}</b></li>
        <li><span>Time</span><b>About ${PAPER.minutes} minutes</b></li>
      </ul>
      <div class="sec">When you check</div>
      <p class="note">The rest of the text fades and the proof is marked like this:</p>
      <p class="sample">The cat sat on the mat. <mark>It purred loudly.</mark> Then it went to sleep.</p>
    </aside></div>`;
}

/* ---------- test + check share one stage ---------- */
function mapHTML(){
  const check = S.phase==="check";
  return PARTS.map(p=>`<h3>${p.label} · ${esc(p.kind)}</h3><div class="grid">${p.questions.map(q=>{
    const st = stateOf(q), cls = check ? st : (S.answers[q.n] ? "ans" : "");
    return `<button type="button" class="cell ${cls}${q.n===S.idx?" cur":""}" data-go="${q.n}" aria-label="Question ${q.n+1}${check?", "+WORD[st]:S.answers[q.n]?", answered":""}"><span>${q.n+1}${check?`<small>${SYM[st]}</small>`:""}</span></button>`;}).join("")}</div>`).join("");
}
function confirmHTML(){
  const blank = ALL.filter(q=>!S.answers[q.n]).length;
  return `<div class="confirm" role="alertdialog" aria-label="End the test?">
      <b>End the test?</b><span>${blank ? `${blank} question${blank>1?"s have":" has"} no answer yet.` : "You have answered every question."}</span>
      <button class="btn danger" type="button" data-end="yes">Yes, end the test</button><button class="btn ghost" type="button" data-end="no">Keep going</button></div>`;
}
function fsBarHTML(){
  const check = S.phase==="check";
  return `<div class="fs-info"><span>Year ${PAPER.year} · ${ALL[S.idx].part.label} · Question ${S.idx+1} of ${ALL.length}</span>${check?"":`<span class="tv">${fmt(Date.now()-S.t0)}</span>`}</div>
    <div class="fs-acts">${check?`<button class="btn ghost small" type="button" data-results>Back to results</button>`:`<button class="btn ghost small" type="button" data-end="ask">End test</button>`}
      <button class="btn ghost small" type="button" id="fsExit">Exit full screen</button></div>`;
}
function sideHTML(){
  if(S.phase==="check") return `${mapHTML()}
    <div class="key"><span><span class="cell ok">✓</span>Correct</span><span><span class="cell bad">✗</span>Not quite</span><span><span class="cell none">–</span>No answer</span></div>
    <button class="btn ghost" type="button" data-results>Back to results</button>`;
  return `${mapHTML()}${S.confirm ? confirmHTML() : `<button class="btn ghost" type="button" data-end="ask">End test</button>`}`;
}
function questionHTML(q){
  const a = S.answers[q.n], n = ALL.length;
  return `<div class="qnum"><span>Reading · ${q.part.label}</span><span>Question ${q.n+1} of ${n}</span></div>
    <p class="prompt${q.stem.length>110?" small":""}" id="qStem">${esc(q.stem)}</p>
    ${PAPER.listen&&canSpeak?`<div class="listen-row"><button class="btn ghost small" type="button" id="sayQ">▶ Read the question</button></div>`:""}
    <div class="choices" role="radiogroup" aria-labelledby="qStem">${q.options.map((o,i)=>
      `<button type="button" class="choice" role="radio" aria-checked="${a===LET[i]}" data-choice="${LET[i]}"><span class="lt">${LET[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
    <div class="nav"><button class="btn ghost" type="button" data-step="-1" ${q.n===0?"disabled":""}>← Back</button>
      ${q.n===n-1 ? `<button class="btn" type="button" data-end="ask">End test</button>` : `<button class="btn" type="button" data-step="1">Next →</button>`}</div>
    ${S.confirm && isFs() ? confirmHTML() : ""}`;
}
const PROOF_HEAD = {find:"The answer is right here", clue:"Work it out from these words", whole:"Think about the whole text"};
function checkHTML(q){
  const a = S.answers[q.n], st = stateOf(q), n = ALL.length;
  const where = e => { const b = q.part.blocks[e.b]; return b.type==="h" ? "Heading" : b.type==="caption" ? "Caption" : "Paragraph "+b.pn; };
  return `<div class="qnum"><span>Checking · ${q.part.label} · ${esc(q.skill)}</span><span>Question ${q.n+1} of ${n}</span></div>
    <div class="verdict ${st}"><span class="badge">${SYM[st]}</span>${WORD[st]}</div>
    <p class="prompt small" id="qStem">${esc(q.stem)}</p>
    <div class="choices">${q.options.map((o,i)=>{ const L = LET[i], right = L===q.answer, mine = L===a;
      return `<div class="choice done ${right?"right":mine?"wrong":"plain"}"><span class="lt">${L}</span><span>${esc(o)}</span>${right||mine?`<span class="tag">${right?(mine?"✓ Your answer":"✓ Correct answer"):"✗ Your answer"}</span>`:"<span></span>"}</div>`;}).join("")}</div>
    <div class="proof"><div class="hd"><span class="swatch"></span>${PROOF_HEAD[q.mode]}</div><p>${esc(q.why)}</p>
      <div class="spots">${q.ev.map((e,k)=> q.ev.length>1
        ? `<button type="button" class="spot" data-spot="${k}"><i>${k+1}</i>${where(e)}</button>`
        : `<button type="button" class="spot lone" data-spot="0">Show me again · ${where(e).toLowerCase()}</button>`).join("")}</div></div>
    <div class="nav"><button class="btn ghost" type="button" data-step="-1" ${q.n===0?"disabled":""}>← Back</button>
      ${q.n===n-1 ? `<button class="btn" type="button" data-results>Back to results</button>` : `<button class="btn" type="button" data-step="1">Next answer →</button>`}</div>`;
}
function renderStage(){
  const q = ALL[S.idx], check = S.phase==="check";
  if(!$("paneText")){
    $("main").innerHTML = `<div class="stage"><section class="panel"><div class="fs-bar" id="fsBar"></div><div class="split"><div class="pane-text" id="paneText" tabindex="0"></div><div id="qPane"></div></div></section><aside class="side" id="side"></aside></div>`;
    S.shownPart = null;
  }
  const pane = $("paneText");
  pane.setAttribute("aria-label", `${q.part.label}: ${q.part.title}`);
  pane.classList.toggle("big", PAPER.year<=2);
  if(check){
    const fresh = S.shownPart !== q.part;
    pane.classList.remove("lit");
    pane.innerHTML = passageHTML(q.part, q.ev) + `<div class="pane-tools"><button class="btn ghost small" type="button" id="zoomBtn">${S.zoom?"Show the whole text":"Zoom in on the answer"}</button></div>`;
    if(fresh) pane.scrollTop = 0;
    S.shownPart = q.part;
    void pane.offsetWidth;                       /* restart the grow + highlight transition */
    if(S.zoom) pane.classList.add("lit");
    clearTimeout(S.zt); S.zt = setTimeout(()=>focusSpot(null), reduced()?0:360);
  }else if(S.shownPart !== q.part){
    pane.classList.remove("lit");
    pane.innerHTML = passageHTML(q.part, null, listenRow(q.part)); pane.scrollTop = 0; S.shownPart = q.part;
  }
  $("qPane").innerHTML = check ? checkHTML(q) : questionHTML(q);
  $("side").innerHTML = sideHTML();
  $("fsBar").innerHTML = fsBarHTML();
}
/* ---------- full screen ---------- */
const root = document.documentElement;
const isFs = () => root.classList.contains("fs");
const realFs = () => document.fullscreenElement || document.webkitFullscreenElement;
async function enterFs(){
  root.classList.add("fs"); S.wantFs = true;
  if($("paneText")){ renderStage(); }
  try{ const f = root.requestFullscreen || root.webkitRequestFullscreen; if(f && !realFs()) await f.call(root); }catch(e){ /* the frame refused: the in-page full-window view still applies */ }
}
function exitFs(keepWish){
  root.classList.remove("fs"); if(!keepWish) S.wantFs = false;
  if(realFs()){ try{ (document.exitFullscreen || document.webkitExitFullscreen).call(document); }catch(e){} }
  if($("paneText") && (S.phase==="test"||S.phase==="check")) renderStage();
}
function onFsChange(){ if(!realFs() && isFs()) exitFs(); else if(S.phase==="check") setTimeout(()=>focusSpot(null), 300); }
document.addEventListener("fullscreenchange", onFsChange); document.addEventListener("webkitfullscreenchange", onFsChange);
/* Scroll the passage so the proof sits in the middle. k = one spot, null = all spots if they fit, else the first. */
function focusSpot(k){
  const pane = $("paneText"); if(!pane) return;
  let marks = [...pane.querySelectorAll(k==null ? "mark.ev" : `mark.ev[data-k="${k}"]`)];
  if(!marks.length) return;
  const box = ms => { const r = ms.map(m=>m.getBoundingClientRect()); return {top:Math.min(...r.map(x=>x.top)), bottom:Math.max(...r.map(x=>x.bottom))}; };
  let b = box(marks);
  if(k==null && b.bottom-b.top > pane.clientHeight*0.85){ marks = [marks[0]]; b = box(marks); }
  const pr = pane.getBoundingClientRect();
  const top = pane.scrollTop + (b.top - pr.top) - Math.max(16,(pane.clientHeight-(b.bottom-b.top))/2);
  pane.scrollTo({top:Math.max(0,top), behavior:reduced()?"auto":"smooth"});
  if(k!=null) marks.forEach(m=>{ m.classList.remove("pulse"); void m.offsetWidth; m.classList.add("pulse"); });
}

/* ---------- results ---------- */
function renderResults(){
  $("timer").hidden = true; $("fsBtn").hidden = true;
  const total = ALL.length, correct = ALL.filter(q=>stateOf(q)==="ok").length, blank = ALL.filter(q=>stateOf(q)==="none").length;
  const cats = CATS.map(c=>{ const qs = ALL.filter(q=>q.skill===c); return {c, n:qs.length, ok:qs.filter(q=>stateOf(q)==="ok").length}; }).filter(x=>x.n);
  $("main").innerHTML = `<div class="results">
    <section class="card">
      <h2>Year ${PAPER.year}: ${S.name ? esc(S.name)+", you" : "you"} scored ${correct} out of ${total}</h2>
      <div class="tiles">
        <div class="tile"><div class="v">${correct}/${total}</div><div class="l">Correct</div></div>
        <div class="tile"><div class="v">${Math.round(100*correct/total)}%</div><div class="l">Score</div></div>
        <div class="tile"><div class="v">${blank}</div><div class="l">No answer</div></div>
        <div class="tile"><div class="v">${fmt(S.elapsed)}</div><div class="l">Time</div></div>
      </div>
      <p class="lead">Now check your answers. Choose any question and the text will zoom in to the words that prove the answer.</p>
      <div class="actions" style="margin-top:0"><button class="btn" type="button" id="checkAll">Check my answers</button>
        ${correct<total ? `<button class="btn ghost" type="button" id="checkMissed">Start with the ones I missed</button>` : ""}</div>
      ${PARTS.map(p=>`<div class="sec">${p.label} · ${esc(p.title)}</div>${p.questions.map(q=>{ const st = stateOf(q);
        return `<button type="button" class="qrow" data-check="${q.n}"><span class="badge ${st}" aria-label="${WORD[st]}">${SYM[st]}</span><span><b>${q.n+1}.</b> ${esc(q.stem)}</span><span class="go">Show me where →</span></button>`;}).join("")}`).join("")}
    </section>
    <aside class="card">
      <div class="sec" style="margin-top:0">Reading skills</div>
      <table class="skills">${cats.map(x=>`<tr><td>${esc(x.c)}<div class="bar"><i style="width:${Math.round(100*x.ok/x.n)}%"></i></div></td><td>${x.ok}/${x.n}</td></tr>`).join("")}</table>
      <div class="actions"><button class="btn ghost" type="button" id="againBtn">Try the test again</button></div>
    </aside></div>`;
  window.scrollTo(0,0);
}

/* ---------- flow ---------- */
function begin(){
  Object.assign(S,{phase:"test", idx:0, answers:{}, confirm:false, t0:Date.now(), elapsed:0, shownPart:null});
  $("main").innerHTML = ""; $("timer").hidden = false; $("fsBtn").hidden = false; $("timerValue").textContent = "0:00";
  clearInterval(S.tick); S.tick = setInterval(()=>{ const v = fmt(Date.now()-S.t0); document.querySelectorAll(".tv").forEach(el=>{ el.textContent = v; }); }, 1000);
  renderStage(); window.scrollTo(0,0);
  if(S.wantFs) enterFs();
}
function finish(){ hush(); exitFs(true); clearInterval(S.tick); S.elapsed = Date.now()-S.t0; S.phase = "results"; renderResults(); }
function openCheck(n){ S.phase = "check"; S.idx = n; S.zoom = true; $("main").innerHTML = ""; $("fsBtn").hidden = false; renderStage(); window.scrollTo(0,0); if(S.wantFs) enterFs(); }
function go(n){ if(n<0||n>=ALL.length) return; hush(); S.idx = n; S.confirm = false; renderStage(); }

document.addEventListener("click", e=>{
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.year){ S.name = $("nameIn").value.trim(); setYear(+t.dataset.year); renderStart(); return; }
  if(t.id==="sayText"){ const p = ALL[S.idx].part; speak([p.title].concat(p.blocks.map(b=>b.text))); return; }
  if(t.id==="sayQ"){ const q = ALL[S.idx]; speak([q.stem].concat(q.options.map((o,i)=>`${LET[i]}. ${o}`))); return; }
  if(t.id==="sayStop"){ hush(); return; }
  if(t.id==="startBtn"){ S.name = $("nameIn").value.trim(); begin(); return; }
  if(t.dataset.choice && S.phase==="test"){ const q = ALL[S.idx]; S.answers[q.n] = S.answers[q.n]===t.dataset.choice ? undefined : t.dataset.choice; if(!S.answers[q.n]) delete S.answers[q.n]; renderStage(); return; }
  if(t.dataset.step){ go(S.idx + (+t.dataset.step)); return; }
  if(t.dataset.go){ go(+t.dataset.go); return; }
  if(t.id==="fsBtn"){ enterFs(); return; }
  if(t.id==="fsExit"){ exitFs(); return; }
  if(t.dataset.end==="ask"){ S.confirm = true; renderStage(); const y = document.querySelector(isFs() ? '#qPane [data-end="yes"]' : '#side [data-end="yes"]'); if(y){ y.scrollIntoView({block:"nearest"}); y.focus(); } return; }
  if(t.dataset.end==="no"){ S.confirm = false; renderStage(); return; }
  if(t.dataset.end==="yes"){ finish(); return; }
  if(t.id==="checkAll"){ openCheck(0); return; }
  if(t.id==="checkMissed"){ openCheck(ALL.find(q=>stateOf(q)!=="ok").n); return; }
  if(t.dataset.check){ openCheck(+t.dataset.check); return; }
  if(t.dataset.spot){ if(!S.zoom){ S.zoom = true; $("paneText").classList.add("lit"); $("zoomBtn").textContent = "Show the whole text"; } focusSpot(+t.dataset.spot); return; }
  if(t.id==="zoomBtn"){ S.zoom = !S.zoom; $("paneText").classList.toggle("lit", S.zoom); t.textContent = S.zoom ? "Show the whole text" : "Zoom in on the answer"; if(S.zoom) setTimeout(()=>focusSpot(null), reduced()?0:360); return; }
  if("results" in t.dataset){ exitFs(true); S.phase = "results"; renderResults(); return; }
  if(t.id==="againBtn"){ S.wantFs = false; S.phase = "start"; renderStart(); window.scrollTo(0,0); return; }
});
document.addEventListener("keydown", e=>{
  if(e.target.matches("input,textarea")||e.metaKey||e.ctrlKey||e.altKey) return;
  if(S.phase!=="test"&&S.phase!=="check") return;
  if(e.key==="Escape" && isFs()){ exitFs(); return; }
  if(e.key==="ArrowRight"){ go(S.idx+1); e.preventDefault(); }
  else if(e.key==="ArrowLeft"){ go(S.idx-1); e.preventDefault(); }
  else if(S.phase==="test"){ const L = e.key.toUpperCase(); if(L.length===1 && LET.includes(L) && LET.indexOf(L)<ALL[S.idx].options.length){ S.answers[S.idx] = L; renderStage(); e.preventDefault(); } }
});
setYear(3);
renderStart();
</script>
</body>
</html>
