<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Year Group Jeopardy</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Libre+Franklin:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --bg: #1a0a2e; --cell-bg: #2d1b69; --cell-hover: #3d2b7a;
  --gold: #ffd740; --gold-dim: #c8a415; --white: #f5f5f5;
  --cat-bg: #4a148c; --overlay: rgba(10,4,25,0.93);
  --correct: #43a047; --wrong: #c62828; --radius: 8px;
  --edit-accent: #00bcd4;
  --display: 'Bebas Neue', 'Impact', 'Arial Narrow', sans-serif;
  --body: 'Libre Franklin', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{min-height:100%;}
body{
  font-family:var(--body);background-color:var(--bg);color:var(--white);
  overflow-x:hidden;min-height:100vh;padding-inline:16px;
  background-image:
    radial-gradient(ellipse at 20% 80%,rgba(74,20,140,.5) 0%,transparent 60%),
    radial-gradient(ellipse at 80% 20%,rgba(45,27,105,.5) 0%,transparent 60%);
  background-attachment:fixed;
}
button:focus-visible,input:focus-visible,textarea:focus-visible,.q-cell:focus-visible,.cat-cell:focus-visible{outline:3px solid var(--gold);outline-offset:2px;}

/* ── TOP BAR ── */
.topbar{display:flex;align-items:center;justify-content:space-between;padding-block:10px;flex-wrap:wrap;gap:8px;max-width:1200px;margin:auto;}
.topbar h1{font-family:var(--display);font-weight:400;font-size:clamp(1.4rem,4vw,2.2rem);letter-spacing:5px;color:var(--gold);text-shadow:0 2px 10px rgba(255,215,64,.3);}
.mode-toggle{display:flex;background:rgba(255,255,255,.1);border-radius:30px;overflow:hidden;}
.mode-btn{
  padding:8px 20px;border:none;font-family:var(--display);
  font-size:.9rem;letter-spacing:2px;cursor:pointer;transition:all .2s;color:rgba(255,255,255,.5);background:transparent;
}
.mode-btn.active{background:var(--gold);color:var(--bg);}
.mode-btn:hover:not(.active){color:#fff;}

/* ── YEAR PICKER ── */
.year-bar{max-width:1200px;margin:0 auto 10px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.year-bar-label{font-size:.7rem;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.45);}
.year-tabs{display:flex;gap:6px;flex-wrap:wrap;}
.year-tab{
  font-family:var(--display);font-size:1rem;letter-spacing:2px;
  padding:6px 14px 5px;border-radius:8px;cursor:pointer;
  background:rgba(255,255,255,.05);color:rgba(255,255,255,.75);
  border:1px solid rgba(255,255,255,.14);display:flex;align-items:center;gap:7px;transition:all .15s;
}
.year-tab:hover:not(.active){border-color:var(--gold-dim);color:#fff;}
.year-tab.active{background:var(--cat-bg);color:var(--gold);border-color:var(--gold);box-shadow:0 0 14px rgba(255,215,64,.2);}
.year-tab .dot{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.2);}
.year-tab.ready .dot{background:var(--correct);}
.subject-toggle{display:flex;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:30px;overflow:hidden;margin-left:auto;}
.subject-btn{
  padding:6px 16px 5px;border:none;background:transparent;color:rgba(255,255,255,.6);cursor:pointer;
  font-family:var(--display);font-size:1rem;letter-spacing:2px;transition:all .15s;
}
.subject-btn .lvl{font-family:var(--body);font-size:.62rem;letter-spacing:1px;opacity:.7;margin-left:5px;}
.subject-btn.active{background:var(--gold);color:var(--bg);}
.subject-btn:hover:not(.active){color:#fff;}
.level-chip{
  font-family:var(--body);font-size:.68rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;
  color:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:3px 10px;vertical-align:middle;margin-left:10px;
  text-shadow:none;white-space:nowrap;
}
@media(max-width:600px){.subject-toggle{margin-left:0;}}
.year-note{
  max-width:1200px;margin:0 auto 10px;font-size:.82rem;color:rgba(255,255,255,.6);
  background:rgba(255,215,64,.06);border:1px dashed rgba(255,215,64,.3);border-radius:10px;padding:8px 12px;
}

/* ── SCOREBOARD ── */
.scoreboard{display:flex;justify-content:center;gap:10px;padding-block:6px 10px;flex-wrap:wrap;}
.team-score{
  display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);
  border-radius:40px;padding:5px 16px 5px 5px;border:2px solid transparent;transition:all .3s;user-select:none;
}
.team-score.active-team{border-color:var(--gold);box-shadow:0 0 16px rgba(255,215,64,.25);}
.team-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:.9rem;color:#fff;flex-shrink:0;}
.team-name-display{font-weight:700;font-size:.82rem;}
.team-pts{font-family:var(--display);font-size:1.2rem;color:var(--gold);min-width:28px;text-align:right;font-variant-numeric:tabular-nums;}

/* ── BOARD ── */
.board-container{padding-bottom:16px;max-width:1200px;margin:auto;overflow-x:auto;}
.board{display:grid;gap:5px;}
.cat-cell{
  background:var(--cat-bg);border-radius:var(--radius);padding:8px 4px;text-align:center;
  font-family:var(--display);font-size:clamp(.6rem,1.6vw,.9rem);
  letter-spacing:1px;color:var(--gold);line-height:1.15;
  display:flex;align-items:center;justify-content:center;min-height:50px;
  text-shadow:0 1px 3px rgba(0,0,0,.4);position:relative;overflow-wrap:anywhere;
}
.q-cell{
  background:var(--cell-bg);border-radius:var(--radius);
  display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:clamp(1.2rem,3vw,1.8rem);
  color:var(--gold);cursor:pointer;transition:all .18s;min-height:54px;
  text-shadow:0 2px 5px rgba(0,0,0,.3);
}
.q-cell:hover{background:var(--cell-hover);transform:scale(1.04);}
.q-cell.used{background:rgba(255,255,255,.03);color:rgba(255,255,255,.1);cursor:default;pointer-events:none;}

/* ── EDIT MODE BOARD ── */
.edit-mode .q-cell{border:1px dashed rgba(0,188,212,.3);cursor:pointer;}
.edit-mode .q-cell:hover{border-color:var(--edit-accent);background:rgba(0,188,212,.1);}
.edit-mode .cat-cell{cursor:pointer;border:1px dashed rgba(0,188,212,.3);}
.edit-mode .cat-cell:hover{border-color:var(--edit-accent);}

/* ── OVERLAY (shared) ── */
.overlay{
  display:none;position:fixed;inset:0;background:var(--overlay);z-index:100;
  align-items:center;justify-content:center;padding:16px;overflow-y:auto;animation:fadeIn .25s;
}
.overlay.show{display:flex;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.card{
  background:linear-gradient(160deg,#2d1b69,#1a0a2e);
  border:2px solid rgba(255,215,64,.25);border-radius:16px;
  padding:26px 22px;max-width:620px;width:100%;text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,.6);animation:slideUp .3s ease-out;margin:auto;
}
@keyframes slideUp{from{transform:translateY(30px);opacity:0}to{transform:translateY(0);opacity:1}}
.points-badge{font-family:var(--display);font-size:1.5rem;color:var(--gold);margin-bottom:4px;letter-spacing:3px;}
.category-label{font-size:.7rem;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.45);margin-bottom:12px;}
.question-text{
  font-family:var(--serif);font-size:clamp(.95rem,2.5vw,1.25rem);
  line-height:1.55;color:var(--white);margin-bottom:18px;
}
.question-text .math-block{
  font-family:var(--body);font-size:1.1rem;font-weight:700;
  background:rgba(255,255,255,.06);border-left:3px solid var(--gold-dim);
  padding:10px 16px;margin:10px auto;text-align:center;border-radius:0 8px 8px 0;
  display:inline-block;min-width:160px;letter-spacing:1px;
}
.card.wide{max-width:780px;}
.skill-chip{
  display:inline-block;font-size:.66rem;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--edit-accent);border:1px solid rgba(0,188,212,.45);border-radius:20px;padding:3px 10px;margin-bottom:12px;
}
.passage{
  text-align:left;font-family:var(--body);font-size:.9rem;line-height:1.6;color:rgba(245,245,245,.92);
  background:rgba(255,255,255,.05);border:1px solid rgba(255,215,64,.18);border-radius:10px;
  padding:12px 16px;margin-bottom:16px;max-height:38vh;overflow-y:auto;
}
.passage p{margin:0 0 .6em;max-width:68ch;}
.passage p:first-child{font-family:var(--serif);font-size:1rem;color:var(--gold);}
.passage-label{font-size:.66rem;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.4);text-align:left;margin-bottom:6px;}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1;font-size:.85em;margin:0 .1em;}
.frac sup,.frac sub{font-size:1em;vertical-align:baseline;position:static;line-height:1.05;}
.frac sup{border-bottom:1.5px solid currentColor;padding:0 .15em;}
.frac{font-feature-settings:"tnum";}
.frac .sl{display:none;}
.question-text .hint{
  font-family:var(--body);font-size:.8rem;
  color:rgba(255,255,255,.5);font-style:italic;margin-top:6px;
}
.options{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.opt-btn{
  background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.15);
  border-radius:10px;color:var(--white);padding:11px 8px;font-size:.92rem;
  font-family:var(--body);cursor:pointer;transition:all .15s;
}
.opt-btn:hover:not(:disabled){background:rgba(255,255,255,.13);border-color:var(--gold);}
.opt-btn.correct-pick{background:var(--correct)!important;border-color:var(--correct)!important;color:#fff!important;animation:pop .35s;}
.opt-btn.wrong-pick{background:var(--wrong)!important;border-color:var(--wrong)!important;color:#fff!important;}
.opt-btn.reveal-correct{border-color:var(--correct)!important;box-shadow:0 0 10px rgba(67,160,71,.5);}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
.feedback{font-family:var(--display);font-size:1.3rem;letter-spacing:2px;min-height:34px;margin-bottom:6px;}
.feedback.right{color:var(--correct);}.feedback.wrong{color:var(--wrong);}
.team-buzz{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px;}
.buzz-btn{
  padding:8px 16px;border-radius:30px;border:none;font-family:var(--display);
  font-size:.9rem;letter-spacing:1.5px;color:#fff;cursor:pointer;transition:all .15s;
}
.buzz-btn:hover:not(:disabled){transform:scale(1.06);filter:brightness(1.15);}
.buzz-btn:disabled{opacity:.3;cursor:default;transform:none;filter:none;}
.close-btn,.action-btn{
  background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);
  border-radius:30px;color:var(--white);padding:8px 24px;
  font-family:var(--display);font-size:.95rem;letter-spacing:2px;cursor:pointer;margin:4px;
}
.close-btn:hover,.action-btn:hover{background:rgba(255,255,255,.2);}
.action-btn.accent{border-color:var(--edit-accent);color:var(--edit-accent);}
.action-btn.accent:hover{background:rgba(0,188,212,.15);}
.action-btn.danger{border-color:#ef5350;color:#ef5350;}
.action-btn.danger:hover{background:rgba(239,83,80,.15);}
.action-btn.gold{border-color:var(--gold);color:var(--gold);}
.action-btn.gold:hover{background:rgba(255,215,64,.15);}
.turn-label{font-size:.75rem;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.4);margin-bottom:10px;}
.daily-double-flash{
  font-family:var(--display);font-size:1.6rem;color:var(--gold);
  letter-spacing:4px;text-shadow:0 0 20px rgba(255,215,64,.6);
  animation:ddPulse .6s ease-in-out 3;margin-bottom:6px;
}
@keyframes ddPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(1.08)}}

/* ── WINNER ── */
.winner-screen{display:none;position:fixed;inset:0;background:var(--overlay);z-index:200;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:30px;}
.winner-screen.show{display:flex;}
.winner-screen h2{font-family:var(--display);font-weight:400;font-size:clamp(2rem,6vw,3.2rem);color:var(--gold);letter-spacing:5px;margin-bottom:8px;text-shadow:0 4px 20px rgba(255,215,64,.4);}
.winner-screen .winner-name{font-family:var(--serif);font-size:clamp(1.4rem,4vw,2.2rem);margin-bottom:18px;}
.final-scores{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin-bottom:22px;}
.fs{font-family:var(--display);font-size:1.2rem;letter-spacing:2px;padding:10px 20px;border-radius:10px;background:rgba(255,255,255,.08);}
.play-again-btn{background:var(--gold);color:var(--bg);border:none;padding:12px 34px;border-radius:30px;font-family:var(--display);font-size:1.1rem;letter-spacing:3px;cursor:pointer;transition:transform .2s;}
.play-again-btn:hover{transform:scale(1.06);}

/* ── EDIT PANEL ── */
.edit-panel{max-width:1200px;margin:0 auto 16px;display:none;}
.edit-panel.show{display:block;}
.ep-section{
  background:rgba(255,255,255,.05);border:1px solid rgba(0,188,212,.2);
  border-radius:12px;padding:16px;margin-bottom:12px;
}
.ep-title{font-family:var(--display);font-size:1.1rem;letter-spacing:2px;color:var(--edit-accent);margin-bottom:10px;}
.ep-help{font-size:.8rem;color:rgba(255,255,255,.55);margin-bottom:8px;line-height:1.45;}
.team-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.team-row input[type=text]{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);
  border-radius:6px;color:#fff;padding:6px 10px;font-size:.85rem;width:140px;
  font-family:var(--body);
}
.team-row input[type=color]{width:36px;height:30px;border:none;border-radius:6px;cursor:pointer;background:transparent;}
.team-row .remove-team{
  background:none;border:1px solid rgba(239,83,80,.4);color:#ef5350;
  border-radius:6px;padding:4px 10px;font-size:.75rem;cursor:pointer;
  font-family:var(--body);
}
.team-row .remove-team:hover{background:rgba(239,83,80,.15);}
.board-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:8px;}
.text-input{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);border-radius:8px;
  color:#fff;padding:8px 12px;font-size:1rem;width:280px;max-width:100%;text-align:center;font-family:var(--body);
}
.export-box{
  width:100%;min-height:90px;margin-top:8px;background:rgba(0,0,0,.25);color:#cfeff4;
  border:1px solid rgba(0,188,212,.3);border-radius:8px;padding:8px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;
}

/* ── EDIT QUESTION FORM ── */
.eq-overlay{display:none;position:fixed;inset:0;background:var(--overlay);z-index:150;align-items:center;justify-content:center;padding:16px;overflow-y:auto;}
.eq-overlay.show{display:flex;}
.eq-card{
  background:linear-gradient(160deg,#1a2a40,#0d1520);
  border:2px solid rgba(0,188,212,.3);border-radius:16px;
  padding:24px 20px;max-width:560px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.6);animation:slideUp .3s ease-out;margin:auto;
}
.eq-card label{display:block;font-size:.75rem;letter-spacing:2px;text-transform:uppercase;color:var(--edit-accent);margin:10px 0 4px;text-align:left;}
.eq-card input,.eq-card textarea{
  width:100%;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.2);
  border-radius:8px;color:#fff;padding:8px 10px;font-size:.9rem;
  font-family:var(--body);
}
.eq-card textarea{resize:vertical;min-height:60px;}
.eq-card .opt-row{display:flex;gap:6px;align-items:center;margin-bottom:4px;}
.eq-card .opt-row input[type=text]{flex:1;}
.eq-card .opt-row input[type=radio]{accent-color:var(--correct);width:18px;height:18px;cursor:pointer;flex:0 0 18px;}
.eq-buttons{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
.eq-card .daily-check{display:flex;align-items:center;gap:6px;margin-top:8px;}
.eq-card .daily-check input{width:18px;height:18px;accent-color:var(--gold);}

@media(max-width:550px){
  .options{grid-template-columns:1fr;}
  .card,.eq-card{padding:20px 14px;}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;}
}

/* ── TOOLBAR ── */
.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tool-btn{
  font-family:var(--display);font-size:.9rem;letter-spacing:2px;padding:8px 14px;border-radius:30px;cursor:pointer;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);color:rgba(255,255,255,.8);display:flex;align-items:center;gap:6px;
}
.tool-btn:hover{border-color:var(--gold-dim);color:#fff;}
.mode-count{font-family:var(--body);font-size:.66rem;font-weight:700;letter-spacing:0;background:var(--gold);color:var(--bg);border-radius:10px;padding:1px 7px;}

/* ── SCORE ROW ── */
.score-row{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;max-width:1200px;margin:auto;padding-block:6px 10px;}
.score-row .scoreboard{padding:0;}
.final-launch{
  font-family:var(--display);font-size:1rem;letter-spacing:2px;padding:8px 18px;border-radius:30px;cursor:pointer;
  background:linear-gradient(135deg,#ffd740,#ffab00);color:var(--bg);border:none;box-shadow:0 0 16px rgba(255,215,64,.3);
}
.final-launch:hover{filter:brightness(1.08);}

/* ── FULL SCREEN BUTTON ── */
.fs-btn{
  position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:300;
  width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;
  background:rgba(26,10,46,.75);border:1px solid rgba(255,255,255,.2);color:rgba(255,255,255,.7);backdrop-filter:blur(4px);
}
.fs-btn:hover{color:var(--gold);border-color:var(--gold-dim);}

/* ── ANSWER LETTERS ── */
.opt-btn{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;}
.opt-letter{
  flex:0 0 28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:1.05rem;letter-spacing:0;background:rgba(255,215,64,.15);color:var(--gold);border:1px solid rgba(255,215,64,.4);
}
.opt-btn.correct-pick .opt-letter,.opt-btn.wrong-pick .opt-letter{background:rgba(255,255,255,.2);color:#fff;border-color:#fff;}
.opt-text{flex:1;}

/* ── QUESTION CARD EXTRAS ── */
.buzz-btn.passed{opacity:.35;text-decoration:line-through;}
.power-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:12px;}
.power-btn{
  font-family:var(--display);font-size:.9rem;letter-spacing:1.5px;padding:7px 14px;border-radius:30px;cursor:pointer;
  background:transparent;border:1.5px solid rgba(255,255,255,.3);color:rgba(255,255,255,.85);
}
.power-btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold);}
.power-btn.on{background:var(--gold);color:var(--bg);border-color:var(--gold);}
.power-btn.allin.on{background:#ff7043;border-color:#ff7043;color:#fff;}
.power-btn:disabled{opacity:.3;cursor:default;}
.wager-box{
  display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;
  background:rgba(255,215,64,.07);border:1px solid rgba(255,215,64,.3);border-radius:12px;padding:10px 12px;
}
.wager-box label{font-size:.75rem;letter-spacing:2px;text-transform:uppercase;color:rgba(255,255,255,.6);}
.wager-input{
  width:110px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.3);border-radius:8px;color:#fff;
  padding:7px 10px;font-size:1rem;font-family:var(--body);text-align:center;font-variant-numeric:tabular-nums;
}
.wager-hint{font-size:.72rem;color:rgba(255,255,255,.5);width:100%;text-align:center;}
.card-foot{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;}
.link-btn{background:none;border:none;color:rgba(255,255,255,.45);font-size:.75rem;cursor:pointer;text-decoration:underline;font-family:var(--body);margin-top:4px;}
.link-btn:hover{color:#fff;}
.stake-note{font-size:.78rem;color:rgba(255,255,255,.6);margin:-4px 0 12px;}

/* ── MODES & RESET PANELS ── */
.panel-title{font-family:var(--display);font-size:1.5rem;letter-spacing:3px;color:var(--gold);margin-bottom:4px;}
.panel-sub{font-size:.8rem;color:rgba(255,255,255,.55);margin-bottom:14px;}
.mode-list{display:flex;flex-direction:column;gap:8px;text-align:left;}
.mode-item{
  display:flex;align-items:flex-start;gap:12px;padding:10px 12px;border-radius:10px;cursor:pointer;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);
}
.mode-item:hover{border-color:rgba(255,215,64,.35);}
.mode-item input{position:absolute;opacity:0;pointer-events:none;}
.switch{flex:0 0 38px;height:22px;border-radius:11px;background:rgba(255,255,255,.18);position:relative;margin-top:2px;transition:background .15s;}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s;}
.mode-item input:checked + .switch{background:var(--correct);}
.mode-item input:checked + .switch::after{transform:translateX(16px);}
.mode-item input:focus-visible + .switch{outline:3px solid var(--gold);outline-offset:2px;}
.mode-name{font-family:var(--display);font-size:1.05rem;letter-spacing:1.5px;color:#fff;}
.mode-desc{font-size:.78rem;color:rgba(255,255,255,.6);line-height:1.45;}
.reset-choice{
  display:block;width:100%;text-align:left;padding:12px 14px;border-radius:10px;margin-bottom:8px;cursor:pointer;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.15);color:#fff;font-family:var(--body);
}
.reset-choice:hover{border-color:var(--gold-dim);}
.reset-choice.danger:hover{border-color:#ef5350;}
.reset-choice b{font-family:var(--display);font-weight:400;font-size:1.1rem;letter-spacing:1.5px;display:block;}
.reset-choice span{font-size:.78rem;color:rgba(255,255,255,.6);}

/* ── FINAL QUESTION ── */
.final-rows{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
.final-row{
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:8px 12px;
}
.final-team{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem;}
.final-team small{font-weight:400;color:rgba(255,255,255,.5);font-variant-numeric:tabular-nums;}
.letter-picks{display:flex;gap:6px;}
.letter-pick{
  width:36px;height:36px;border-radius:50%;cursor:pointer;font-family:var(--display);font-size:1.1rem;
  background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.25);color:#fff;
}
.letter-pick.on{background:var(--gold);color:var(--bg);border-color:var(--gold);}
.letter-pick.right{background:var(--correct);border-color:var(--correct);color:#fff;}
.letter-pick.wrong{background:var(--wrong);border-color:var(--wrong);color:#fff;}
.delta{font-family:var(--display);font-size:1.2rem;letter-spacing:1px;font-variant-numeric:tabular-nums;}
.delta.up{color:#81c784;}.delta.down{color:#ef9a9a;}
.opt-btn.static{cursor:default;}

[hidden]{display:none!important;}
.power-btn.on:hover:not(:disabled){color:var(--bg);}
.power-btn.allin.on:hover{color:#fff;}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
</style>
</head>

<div class="topbar">
  <h1 id="gameTitle">Jeopardy!</h1>
  <div class="top-actions">

    <button class="tool-btn" onclick="openReset()" aria-haspopup="dialog">↺ Reset</button>
    <div class="mode-toggle">

      <button class="mode-btn" id="btnEdit" onclick="setMode('edit')">✏️ Edit</button>
    </div>
  </div>
</div>

<div class="year-bar">
  <span class="year-bar-label">Year group</span>
  <div class="year-tabs" id="yearTabs"></div>
  <div class="subject-toggle" id="subjectToggle"></div>
</div>
<div class="year-note" id="yearNote" hidden></div>

<div class="edit-panel" id="editPanel">

    <div class="ep-title">Teams</div>
    <div id="teamEditor"></div>
    <button class="action-btn accent" onclick="addTeam()">+ Add Team</button>
  </div>
  <div class="ep-section">
    <div class="ep-title">Board: click any cell to edit</div>
    <div class="board-actions">
      <button class="action-btn accent" onclick="addCategory()">+ Add Category</button>
      <button class="action-btn danger" onclick="removeCategory()">− Remove Last Category</button>
      <button class="action-btn accent" onclick="addRow()">+ Add Row</button>
      <button class="action-btn danger" onclick="removeRow()">− Remove Last Row</button>
    </div>
  </div>
  <div class="ep-section" style="text-align:center">
    <div class="ep-title">Game Title</div>
    <input type="text" class="text-input" id="titleInput" value="Jeopardy!" oninput="S.title=this.value;document.getElementById('gameTitle').textContent=this.value;">
  </div>
  <div class="ep-section">
    <div class="ep-title">Keep your edits</div>
    <p class="ep-help">Edits made here last until the page is reloaded. To keep them for good, copy this board and paste it to Claude, and it will be built into the page.</p>
    <button class="action-btn accent" onclick="exportYear()">Copy this board</button>
    <span id="copyStatus" style="font-size:.8rem;color:var(--edit-accent);margin-left:6px"></span>
    <textarea class="export-box" id="exportBox" readonly hidden></textarea>
  </div>
</div>

<div class="score-row">
  <div class="scoreboard" id="scoreboard"></div>
  <button class="final-launch" id="finalLaunch" onclick="openFinal()" hidden>★ Final Question</button>
</div>
<div class="board-container" id="boardWrap"><div class="board" id="board"></div></div>
<div class="overlay" id="overlay"><div class="card" id="card" role="dialog" aria-modal="true"></div></div>
<div class="eq-overlay" id="eqOverlay"><div class="eq-card" id="eqCard" role="dialog" aria-modal="true"></div></div>
<div class="winner-screen" id="winnerScreen"></div>

<button class="fs-btn" id="fsBtn" onclick="toggleFullscreen()" aria-label="Full screen" title="Full screen">

function qKey(c,r){return c+'-'+r;}
function emptyQ(pts){return {q:"(Click to edit)",opts:["A","B","C","D"],ans:0,pts:pts||100};}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
function hasContent(y,s){return !!(CONTENT[y]&&CONTENT[y][s]);}
function money(n){return (n<0?'−$':'$')+Math.abs(n);}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

// Build a live board from CONTENT (or a blank board if a slot is empty)
function buildBoard(year,subj){
  const src=CONTENT[year]&&CONTENT[year][subj];
  const sub=SUBJECTS.find(s=>s.id===subj);
  const b={title:`Year ${year} ${sub.label}`,categories:[],passages:[],pointValues:[100,200,300,400,500],questions:{},used:{},dd:{}};
  if(!src){
    b.categories=["Category 1","Category 2","Category 3","Category 4","Category 5"];
    b.passages=b.categories.map(()=>'');
    b.categories.forEach((_,c)=>b.pointValues.forEach((pv,r)=>{b.questions[qKey(c,r)]=emptyQ(pv);}));
  }else{
    if(src.title)b.title=src.title;
    if(src.pointValues)b.pointValues=[...src.pointValues];
    src.categories.forEach((cat,c)=>{
      b.categories.push(cat.name);
      b.passages.push(cat.passage||'');
      b.pointValues.forEach((pv,r)=>{
        const q=cat.questions[r];
        b.questions[qKey(c,r)]=q?{q:q.q,math:q.math,hint:q.hint,tag:q.tag,opts:[...q.opts],ans:q.ans,pts:pv}:emptyQ(pv);
      });
    });
  }
  rollDailyDoubles(b);
  return b;
}
// Hide 1–2 Daily Doubles on a board, away from the top row
function rollDailyDoubles(b){
  b.dd={};
  const keys=Object.keys(b.questions).filter(k=>+k.split('-')[1]>0);
  const n=Math.random()<.5?1:2;
  shuffle(keys).slice(0,n).forEach(k=>b.dd[k]=true);
}
function buildFinal(y,s){
  const f=FINALS[y]&&FINALS[y][s];
  if(!f)return null;
  const opts=shuffle(f.opts);
  return {cat:f.cat,q:f.q,opts,ans:opts.indexOf(f.opts[0])};
}

let boards={}, finals={};
function buildAllBoards(){
  boards={};finals={};
  YEARS.forEach(y=>SUBJECTS.forEach(s=>{boards[y+'-'+s.id]=buildBoard(y,s.id);finals[y+'-'+s.id]=buildFinal(y,s.id);}));
}

function saveCategoryName(ci){
  S.categories[ci]=document.getElementById('eq_cat').value.trim()||S.categories[ci];
  const ps=document.getElementById('eq_passage').value.trim();
  S.passages[ci]=ps?ps.split(/\n\s*\n|\n/).map(x=>'<p>'+x+'</p>').join(''):'';
  closeEditor();renderBoard();
}
function closeEditor(){document.getElementById('eqOverlay').classList.remove('show');}

// ═══════════════════════════════════════
// EDIT: QUESTION
// ═══════════════════════════════════════
function openEditor(key){
  const qd=S.questions[key]||emptyQ(100);
  const card=document.getElementById('eqCard');
  const [ci,ri]=key.split('-').map(Number);
  let html=`<div class="ep-title" style="margin-bottom:12px">Edit Question: ${esc(S.categories[ci].replace(/\n/,' '))} $${S.pointValues[ri]}</div>`;
  html+=`<label for="eq_q">Question text (HTML ok)</label><textarea id="eq_q">${(qd.q||'').replace(/</g,'&lt;')}</textarea>`;
  html+=`<label for="eq_tag">Skill tested (optional)</label><input type="text" id="eq_tag" value="${esc(qd.tag||'')}">`;
  html+=`<label for="eq_math">Math block (optional)</label><input type="text" id="eq_math" value="${esc(qd.math||'')}">`;
  html+=`<label for="eq_hint">Hint (optional)</label><input type="text" id="eq_hint" value="${esc(qd.hint||'')}">`;
  html+=`<label>Options (tick the correct answer)</label>`;
  const opts=qd.opts||["A","B","C","D"];
  for(let i=0;i<4;i++){
    html+=`<div class="opt-row">
      <input type="radio" name="eq_ans" id="eq_ans${i}" value="${i}" ${qd.ans===i?'checked':''} aria-label="Option ${LETTERS[i]} is correct">
      <span class="opt-letter" style="flex-basis:26px;height:26px">${LETTERS[i]}</span>
      <input type="text" id="eq_opt${i}" value="${esc(opts[i]||'')}" aria-label="Option ${LETTERS[i]}">
    </div>`;
  }
  html+=`<div class="daily-check"><input type="checkbox" id="eq_daily" ${B().dd[key]?'checked':''}> <label for="eq_daily" style="margin:0;font-size:.82rem;letter-spacing:0;text-transform:none;color:rgba(255,255,255,.6)">Daily Double square (used when the Daily Double mode is on)</label></div>`;
  html+=`<div class="eq-buttons">
    <button class="action-btn gold" onclick="saveQuestion('${key}')">Save</button>
    <button class="action-btn" onclick="closeEditor()">Cancel</button>
  </div>`;
  card.innerHTML=html;
  document.getElementById('eqOverlay').classList.add('show');
}
function saveQuestion(key){
  const [,ri]=key.split('-').map(Number);
  const ans=parseInt(document.querySelector('input[name=eq_ans]:checked')?.value||0);
  S.questions[key]={
    q:document.getElementById('eq_q').value,
    math:document.getElementById('eq_math').value||undefined,
    hint:document.getElementById('eq_hint').value||undefined,
    tag:document.getElementById('eq_tag').value||undefined,
    opts:[0,1,2,3].map(i=>document.getElementById('eq_opt'+i).value),
    ans, pts:S.pointValues[ri],
  };
  if(document.getElementById('eq_daily').checked)B().dd[key]=true;else delete B().dd[key];
  closeEditor();renderBoard();
}

// ═══════════════════════════════════════
// EXPORT (so edits can be built into the page permanently)
// ═══════════════════════════════════════
function exportYear(){
  const data={
    title:S.title,
    pointValues:[...S.pointValues],
    categories:S.categories.map((name,c)=>({
      name,
      passage:S.passages[c]||undefined,
      questions:S.pointValues.map((_,r)=>{
        const q=S.questions[qKey(c,r)]||{};
        const o={q:q.q,opts:q.opts,ans:q.ans};
        if(q.tag)o.tag=q.tag; if(q.math)o.math=q.math; if(q.hint)o.hint=q.hint;
        return o;
      })
    }))
  };
  const text=`Year ${S.year} ${S.subject}: `+JSON.stringify(data,null,1);
  const box=document.getElementById('exportBox');
  const status=document.getElementById('copyStatus');
  box.value=text;box.hidden=false;
  const fallback=()=>{box.focus();box.select();status.textContent='Selected. Press Ctrl+C / ⌘C to copy.';};
  try{navigator.clipboard.writeText(text).then(()=>{status.textContent='Copied.';},fallback);}catch(e){fallback();}
}

// ═══════════════════════════════════════
// PLAY: ONE QUESTION
// Q holds the state of the open question card.
// ═══════════════════════════════════════
let Q=null;

function openQuestion(key){
  if(S.used[key])return;
  const qd=S.questions[key];if(!qd)return;
  Q={key, team:-1, passed:{}, doubled:false, allIn:false, daily:isDaily(key), wager:null, done:false, result:''};
  renderQuestionCard();
  showCard();
}
function qValue(){const qd=S.questions[Q.key];return qd.pts*(Q.doubled?2:1);}
function maxWager(){
  const t=S.teams[Q.team];
  return Math.max(t?t.score:0, Math.max(...S.pointValues));
}

function renderQuestionCard(){
  const qd=S.questions[Q.key];
  const [ci]=Q.key.split('-').map(Number);
  const catName=S.categories[ci].replace(/\n/g,' ');
  const card=document.getElementById('card');
  const t=S.teams[Q.team];
  const needWager=Q.daily&&Q.team>=0&&Q.wager===null;
  const canAnswer=Q.team>=0&&!needWager&&!Q.done;
  let h='';

  if(Q.daily)h+=`<div class="daily-double-flash">⭐ DAILY DOUBLE ⭐</div>`;
  // Value line
  if(Q.daily&&Q.wager!==null) h+=`<div class="points-badge">Wager ${money(Q.wager)}</div>`;
  else if(Q.daily) h+=`<div class="points-badge">Wager to play</div>`;
  else h+=`<div class="points-badge">${Q.doubled?`<s style="opacity:.5">$${qd.pts}</s> $${qValue()} ×2`:'$'+qd.pts}</div>`;
  h+=`<div class="category-label">${esc(catName)}</div>`;
  if(qd.tag)h+=`<div class="skill-chip">${esc(qd.tag)}</div>`;

  // Who is answering
  if(!Q.done){
    const passedNames=Object.keys(Q.passed).map(i=>S.teams[i].name);
    let label=Q.team>=0?`${esc(t.name)} is answering`:'Which team is answering?';
    if(Q.team<0&&passedNames.length)label=`${esc(passedNames.join(', '))} passed. Which team is answering?`;
    h+=`<div class="turn-label">${label}</div><div class="team-buzz">`;
    S.teams.forEach((tm,i)=>{
      const sel=i===Q.team, locked=Q.team>=0&&!sel, passed=Q.passed[i];
      h+=`<button class="buzz-btn ${passed?'passed':''}" style="background:${tm.color};${sel?'outline:3px solid var(--gold);outline-offset:2px;':''}"
        ${locked||passed?'disabled':''} onclick="selectTeam(${i})">${esc(tm.name)}</button>`;
    });
    h+=`</div>`;
  }

  // Daily Double wager
  if(needWager){
    const mx=maxWager();
    h+=`<div class="wager-box">
      <label for="ddWager">${esc(t.name)} wagers</label>
      <input class="wager-input" type="number" id="ddWager" min="0" max="${mx}" step="100" value="${Math.min(mx,qd.pts)}">
      <button class="action-btn gold" onclick="lockWager()">Lock in</button>
      <div class="wager-hint">Anything from $0 to $${mx}. Right answer wins it, wrong answer loses it.</div>
    </div>`;
  }

  // Power-ups (before answering)
  if(!Q.done&&!needWager){
    const btns=[];
    if(S.modes.double&&!Q.daily) btns.push(`<button class="power-btn ${Q.doubled?'on':''}" onclick="toggleDouble()" aria-pressed="${Q.doubled}">×2 Double points</button>`);
    if(S.modes.allin&&!Q.daily&&Q.team>=0){
      const ok=t.score>0;
      btns.push(`<button class="power-btn allin ${Q.allIn?'on':''}" onclick="toggleAllIn()" aria-pressed="${Q.allIn}" ${ok?'':'disabled title="Needs a score above $0"'}>🔥 All in</button>`);
    }
    if(S.modes.pass&&Q.team>=0) btns.push(`<button class="power-btn" onclick="passQuestion()">⏭ Pass</button>`);
    if(btns.length)h+=`<div class="power-row">${btns.join('')}</div>`;
    if(Q.allIn&&t) h+=`<div class="stake-note">All in: right = ${money(t.score*2+qValue())} · wrong = $0</div>`;
  }

  // Passage + question (hidden until the wager is locked for a Daily Double)
  const passage=S.passages[ci];
  card.classList.toggle('wide',!!passage&&!needWager&&!(Q.daily&&Q.team<0));
  if(!(Q.daily&&Q.wager===null)){
    if(passage)h+=`<div class="passage-label">Read the text</div><div class="passage" tabindex="0">${passage}</div>`;
    h+=`<div class="question-text">${qd.q}`;
    if(qd.math)h+=`<div class="math-block">${qd.math}</div>`;
    if(qd.hint)h+=`<div class="hint">${qd.hint}</div>`;
    h+=`</div><div class="options">`;
    (qd.opts||[]).forEach((o,i)=>{
      let cls='';
      if(Q.done){ if(i===qd.ans)cls=Q.picked===i?'correct-pick':'reveal-correct'; else if(i===Q.picked)cls='wrong-pick'; }
      h+=`<button class="opt-btn ${cls}" id="opt-${i}" ${canAnswer?'':'disabled'} onclick="answerPicked(${i})">
        <span class="opt-letter">${LETTERS[i]}</span><span class="opt-text">${o}</span></button>`;
    });
    h+=`</div>`;
  }

  h+=`<div class="feedback ${Q.resultClass||''}" id="feedback">${Q.result||''}</div>`;
  h+=`<div class="card-foot">`;
  if(Q.done) h+=`<button class="close-btn" onclick="finishQuestion()">Back to Board</button>`;
  else if(Q.team<0) h+=`<button class="link-btn" onclick="closeCard()">Close without playing (keeps this square)</button>`;
  else if(!needWager) h+=`<button class="link-btn" onclick="changeTeam()">Change team</button>`;
  h+=`</div>`;
  card.innerHTML=h;
  if(needWager){const w=document.getElementById('ddWager');w.focus();w.select();w.onkeydown=e=>{if(e.key==='Enter')lockWager();};}
}

function selectTeam(i){if(Q.done||Q.passed[i])return;Q.team=i;Q.allIn=false;renderQuestionCard();}
function changeTeam(){if(Q.daily&&Q.wager!==null)return;Q.team=-1;Q.allIn=false;renderQuestionCard();}
function toggleDouble(){Q.doubled=!Q.doubled;renderQuestionCard();}
function toggleAllIn(){if(S.teams[Q.team].score<=0)return;Q.allIn=!Q.allIn;renderQuestionCard();}
function lockWager(){
  const mx=maxWager();
  let v=parseInt(document.getElementById('ddWager').value,10);
  if(isNaN(v))v=0;
  Q.wager=Math.max(0,Math.min(mx,v));
  renderQuestionCard();
}
function passQuestion(){
  Q.passed[Q.team]=true;Q.team=-1;Q.allIn=false;
  if(Object.keys(Q.passed).length>=S.teams.length){
    Q.done=true;Q.picked=-1;
    Q.result='Everyone passed. No points lost.';Q.resultClass='';
  }
  renderQuestionCard();
}

function answerPicked(picked){
  if(Q.done||Q.team<0)return;
  const qd=S.questions[Q.key];
  const t=S.teams[Q.team];
  const right=picked===qd.ans;
  const before=t.score;
  if(Q.daily){
    t.score+=right?Q.wager:-Q.wager;
  }else if(Q.allIn){
    t.score=right?t.score*2+qValue():0;
  }else if(right){
    t.score+=qValue();
  }else if(S.modes.penalty){
    t.score-=Math.round(qValue()/2);
  }
  const delta=t.score-before;
  Q.done=true;Q.picked=picked;
  Q.resultClass=right?'right':'wrong';
  Q.result=right?`✓ Correct! ${esc(t.name)} ${delta>=0?'+':'−'}$${Math.abs(delta)}`
                :`✗ Not quite. The answer was ${LETTERS[qd.ans]}.${delta?` ${esc(t.name)} −$${Math.abs(delta)}`:''}`;
  renderQuestionCard();
  renderScoreboard();
}

function finishQuestion(){
  S.used[Q.key]=true;
  closeCard();
  renderBoard();renderScoreboard();
  if(answeredQs()>=totalQs())showWinner();
}

// ═══════════════════════════════════════
// FINAL QUESTION (every team wagers, then every team answers)
// ═══════════════════════════════════════
let F=null;
function openFinal(){
  const fq=finals[S.year+'-'+S.subject];if(!fq)return;
  document.getElementById('winnerScreen').classList.remove('show');
  F={step:'wager', wagers:S.teams.map(()=>0), picks:S.teams.map(()=>-1), fq};
  renderFinal();showCard();
}
function renderFinal(){
  const card=document.getElementById('card');card.classList.remove('wide');
  const fq=F.fq;
  let h=`<div class="daily-double-flash" style="animation:none">★ FINAL QUESTION ★</div>
    <div class="category-label">${esc(fq.cat)}</div>`;
  if(F.step==='wager'){
    h+=`<div class="turn-label">Each team chooses a wager before seeing the question</div><div class="final-rows">`;
    S.teams.forEach((t,i)=>{
      const mx=Math.max(0,t.score);
      h+=`<div class="final-row"><span class="final-team"><span class="team-dot" style="background:${t.color}">${i+1}</span>${esc(t.name)} <small>${money(t.score)}</small></span>
        <span><label class="sr-only" for="fw${i}">Wager for ${esc(t.name)}</label>
        <input class="wager-input" type="number" id="fw${i}" min="0" max="${mx}" step="100" value="${Math.min(F.wagers[i],mx)}" ${mx?'':'disabled'}>
        <small style="color:rgba(255,255,255,.5)"> max $${mx}</small></span></div>`;
    });
    h+=`</div><div class="card-foot"><button class="action-btn gold" onclick="finalShowQuestion()">Show the question</button><button class="action-btn" onclick="closeCard()">Cancel</button></div>`;
  }else{
    const reveal=F.step==='reveal';
    h+=`<div class="question-text">${fq.q}</div><div class="options">`;
    fq.opts.forEach((o,i)=>{
      h+=`<div class="opt-btn static ${reveal&&i===fq.ans?'reveal-correct':''}"><span class="opt-letter">${LETTERS[i]}</span><span class="opt-text">${esc(o)}</span></div>`;
    });
    h+=`</div><div class="turn-label">${reveal?'Results':'Record each team’s answer'}</div><div class="final-rows">`;
    S.teams.forEach((t,i)=>{
      h+=`<div class="final-row"><span class="final-team"><span class="team-dot" style="background:${t.color}">${i+1}</span>${esc(t.name)} <small>wager $${F.wagers[i]}</small></span><span class="letter-picks">`;
      LETTERS.forEach((L,j)=>{
        let cls=F.picks[i]===j?'on':'';
        if(reveal&&F.picks[i]===j)cls=j===fq.ans?'right':'wrong';
        h+=`<button class="letter-pick ${cls}" ${reveal?'disabled':''} onclick="finalPick(${i},${j})" aria-pressed="${F.picks[i]===j}" aria-label="${esc(t.name)} answers ${L}">${L}</button>`;
      });
      if(reveal){const d=F.deltas[i];h+=`<span class="delta ${d>0?'up':d<0?'down':''}" style="margin-left:8px">${d>0?'+':d<0?'−':''}$${Math.abs(d)}</span>`;}
      h+=`</span></div>`;
    });
    h+=`</div><div class="card-foot">`;
    if(reveal) h+=`<button class="action-btn gold" onclick="closeCard();showWinner(true)">See final scores</button>`;
    else{
      const ready=F.picks.every(p=>p>=0);
      h+=`<button class="action-btn gold" onclick="finalReveal()" ${ready?'':'disabled style="opacity:.4"'}>Reveal answer</button>`;
    }
    h+=`</div>`;
  }
  card.innerHTML=h;
}
function finalShowQuestion(){
  S.teams.forEach((t,i)=>{
    const el=document.getElementById('fw'+i);
    let v=parseInt(el&&el.value,10);if(isNaN(v))v=0;
    F.wagers[i]=Math.max(0,Math.min(Math.max(0,t.score),v));
  });
  F.step='answer';renderFinal();
}
function finalPick(i,j){F.picks[i]=j;renderFinal();}
function finalReveal(){
  F.deltas=S.teams.map((t,i)=>F.picks[i]===F.fq.ans?F.wagers[i]:-F.wagers[i]);
  S.teams.forEach((t,i)=>t.score+=F.deltas[i]);
  F.step='reveal';renderFinal();renderScoreboard();
}

// ═══════════════════════════════════════
// WINNER / STANDINGS
// ═══════════════════════════════════════
function showWinner(afterFinal){
  const ws=document.getElementById('winnerScreen');
  const sorted=[...S.teams].sort((a,b)=>b.score-a.score);
  const w=sorted[0];const tie=sorted.filter(t=>t.score===w.score).length>1;
  const canFinal=!afterFinal&&S.modes.final&&finals[S.year+'-'+S.subject];
  ws.innerHTML=`
    <h2>🏆 ${afterFinal?'Final Scores':'Board Complete!'} 🏆</h2>
    <div class="winner-name" style="color:${tie?'var(--gold)':w.color}">${tie?"It's a Tie!":esc(w.name)+(afterFinal?' Wins!':' is in the lead!')}</div>
    <div class="final-scores">${sorted.map(t=>`<div class="fs" style="border:2px solid ${t.color}">${esc(t.name)}: <span style="color:var(--gold)">${money(t.score)}</span></div>`).join('')}</div>
    <div class="card-foot">
      ${canFinal?`<button class="play-again-btn" onclick="openFinal()">★ Final Question</button>`:''}
      <button class="close-btn" onclick="document.getElementById('winnerScreen').classList.remove('show')">Back to board</button>
      <button class="close-btn" onclick="newGame()">New game</button>
    </div>`;
  ws.classList.add('show');
}

// Esc closes open panels
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if(document.getElementById('eqOverlay').classList.contains('show'))return closeEditor();
  if(document.getElementById('overlay').classList.contains('show')&&!(Q&&Q.team>=0&&!Q.done)&&!(F&&F.step!=='wager'))closeCard();
});

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
syncTitle();
renderYearTabs();
renderAll();
renderTeamEditor();
</script>
