  { year:6, point:"Advanced Conjunctions", hint:"although / however / if / because", defn:"Although (contrast, one sentence), however (contrast, after semicolon), if (condition), because (reason).", eg:"She was nervous; however, she performed well." },
  { year:6, point:"Verb Forms & Tenses", hint:"had started = before another past event", defn:"Past perfect (had + participle) sequences two past events; present perfect (have/has + participle) links past to now.", eg:"By the time we arrived, the show had started." },
  { year:6, point:"Synonyms & Precision", hint:"trudged, staggered, tiptoed", defn:"Precise verbs and strong adjectives carry more meaning than general ones.", eg:"furious > angry · exhausted > tired" },
  { year:6, point:"Sentence Types", hint:"compound vs complex", defn:"Compound = main + main (and/but/or). Complex = main + subordinate (because, although, when…).", eg:"I ran and I jumped. · I ran because I was late." },
  { year:6, point:"Best Sentence Choice", hint:"Clause next to its noun; comma after opener", defn:"Keep a relative clause beside the noun it describes; follow a fronted adverbial with a comma.", eg:"The dog who was excited barked loudly. Before the show, we sat down." },
  { year:6, point:"Homophones", hint:"affect/effect · hall/haul · scent/sent", defn:"Affect = verb (to change); effect = noun (the result). Check meaning, not sound.", eg:"Rain will affect the game. The rain had an effect on the game." },
  { year:6, point:"Vocabulary Precision", hint:"cautiously = in a careful way", defn:"Choose the adverb or word that says exactly what you mean.", eg:"She crossed the road cautiously." },
  { year:6, point:"Advanced Punctuation", hint:"Colons for explanations; comma pairs", defn:"A colon introduces an explanation; non-essential clauses sit inside a pair of commas.", eg:"She had one wish: to travel. My brother, who is twelve, loves rugby." },
  { year:6, point:"Advanced Grammar", hint:"Subjunctive, passive, semicolons", defn:"Year 6 showcase: 'If I were…', passive 'was + participle', and semicolons joining two complete sentences.", eg:"If I were you… The work was marked. I was tired; I went to bed." }
];

// ================= APP LOGIC =================
const QUIZ_SECONDS = 10 * 60;

let mode = "quiz";
let year = 1;
let quiz = [];            // active shuffled question set
let qIndex = 0;
let answered = [];        // {q, chosen, correct} per question
let score = 0;
let quizStarted = false;
let timedOut = false;
let timeLeft = QUIZ_SECONDS;
let timerId = null;
let reviewIndex = 0;
let reviewDeck = [];      // current (possibly shuffled) deck order
let sessionRight = 0, sessionTotal = 0;

const $ = sel => document.querySelector(sel);
const stage = $("#stage");

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

/* ---------- Year buttons ---------- */
function buildYears(){
  const wrap = $("#years");
  for(let y = 1; y <= 6; y++){
    const b = document.createElement("button");
    b.textContent = y;
    b.setAttribute("aria-selected", y === year);
    b.onclick = () => { year = y; onContextChange(); };
    wrap.appendChild(b);
  }
}
function refreshYearButtons(){
  document.querySelectorAll("#years button").forEach((b,i)=>{
    b.setAttribute("aria-selected", (i+1) === year);
  });
}

/* ---------- Mode ---------- */
function setMode(m){
  mode = m;
  $("#tabQuiz").setAttribute("aria-selected", m === "quiz");
  $("#tabReview").setAttribute("aria-selected", m === "review");
  onContextChange();
}
function onContextChange(){
  stopTimer();
  quizStarted = false;
  timedOut = false;
  reviewIndex = 0;
  reviewDeck = [];
  refreshYearButtons();
  updateGpCount();
  render();
}

/* ---------- Data helpers ---------- */
function questionsForYear(y){ return QUESTIONS.filter(q => q.year === y); }
function deckForYear(y){ return REVIEW_DECK.filter(c => c.year === y); }
function updateGpCount(){
  const pts = new Set(questionsForYear(year).map(q => q.grammarPoint));
  const cards = deckForYear(year).length;
  $("#gpCount").textContent =
    `Year ${year} · ${pts.size} grammar points · ${questionsForYear(year).length} questions in the bank · ${cards} review cards`;
}

/* ---------- Timer ---------- */
function fmt(sec){
  const m = Math.floor(sec/60), s = sec % 60;
  return `${m}:${String(s).padStart(2,"0")}`;
}
function startTimer(){
  timeLeft = QUIZ_SECONDS;
  $("#timer").style.display = "";
  paintClock();
  timerId = setInterval(()=>{
    timeLeft--;
    paintClock();
    if(timeLeft <= 0){
      timedOut = true;
      stopTimer();
      finishQuiz();
    }
  }, 1000);
}
function stopTimer(){
  if(timerId){ clearInterval(timerId); timerId = null; }
  $("#timer").style.display = "none";
  $("#timer").classList.remove("warn","danger");
}
function paintClock(){
  $("#clock").textContent = fmt(Math.max(0,timeLeft));
  const t = $("#timer");
  t.classList.toggle("warn", timeLeft <= 120 && timeLeft > 30);
  t.classList.toggle("danger", timeLeft <= 30);
}

/* ---------- Render root ---------- */
function render(){
  if(mode === "quiz"){
    if(!quizStarted) renderStart();
    else if(qIndex >= quiz.length) renderResults();
    else renderQuiz();
  } else {
    renderReview();
  }
}

/* ---------- Start screen ---------- */
function renderStart(){
  const pts = new Set(questionsForYear(year).map(q => q.grammarPoint));
  stage.innerHTML = `
    <div class="card start">
      <span class="tag">Year <span class="yr">${year}</span> · Quiz</span>
      <div class="start-title">Ready for your 10-minute quiz?</div>
      <ul class="start-facts">
        <li><b>10 minutes</b> on the clock — it starts when you press begin.</li>
        <li><b>20 questions</b> drawn from ${pts.size} Year ${year} grammar points.</li>
        <li>Every answer shows <b>the rule</b> — right or wrong.</li>
        <li>Stuck? Warm up first in <b>⚡ Fast Review</b> — it covers the same points.</li>
      </ul>
      <button class="btn start-btn" onclick="startQuiz()">Begin the quiz ✎</button>
    </div>`;
}
function startQuiz(){
  const pool = shuffle(questionsForYear(year)).slice(0, 20);
  quiz = pool.map(q => ({ ...q, options: shuffle(q.options) }));
  qIndex = 0;
  answered = [];
  score = 0;
  timedOut = false;
  quizStarted = true;
  startTimer();
  render();
}

/* ---------- Quiz question ---------- */
function renderQuiz(){
  const q = quiz[qIndex];
  const pct = Math.round((qIndex / quiz.length) * 100);
  stage.innerHTML = `
    <div class="card">
      <div class="qbar"><span style="width:${pct}%"></span></div>
      <span class="tag">Year <span class="yr">${q.year}</span> · ${esc(q.grammarPoint)}</span>
      <div class="question">${esc(q.question)}</div>
      <div class="options">
        ${q.options.map((o,i)=>`
          <button class="opt" data-i="${i}" onclick="choose(${i})">
            <span class="key">${"ABCD"[i]}</span> ${esc(o)}
          </button>`).join("")}
      </div>
      <div class="explain" id="explain"></div>
      <div class="qnav">
        <span class="prog">Question ${qIndex+1} / ${quiz.length}</span>
        <button class="btn" id="nextBtn" onclick="nextQ()" disabled>Next ›</button>
      </div>
    </div>`;
}
function choose(i){
  const q = quiz[qIndex];
  if(answered[qIndex]) return;
  const chosen = q.options[i];
  const correct = chosen === q.answer;
  answered[qIndex] = { q, chosen, correct };
  if(correct){ score++; sessionRight++; }
  sessionTotal++;
  $("#scoreNum").textContent = `${sessionRight}/${sessionTotal}`;

  document.querySelectorAll(".opt").forEach((btn,bi)=>{
    btn.disabled = true;
    const val = q.options[bi];
    if(val === q.answer) btn.classList.add("correct");
    else if(bi === i) btn.classList.add("wrong");
  });

  // Show the rule on EVERY answer — green reinforcement when correct.
  const ex = $("#explain");
  ex.classList.add("show");
  ex.classList.toggle("good", correct);
  ex.innerHTML = `<h4>${correct ? "✓ Remember" : "Why?"}</h4>${esc(q.explanation)}`;

  const nb = $("#nextBtn");
  nb.disabled = false;
  if(qIndex === quiz.length - 1) nb.textContent = "See results ›";
}
function nextQ(){
  qIndex++;
  if(qIndex >= quiz.length) finishQuiz();
  else render();
}
function finishQuiz(){
  stopTimer();
  qIndex = quiz.length;
  render();
}

/* ---------- Results ---------- */
function renderResults(){
  const total = quiz.length;
  const right = answered.filter(a => a && a.correct).length;
  const wrong = answered.filter(a => a && !a.correct).length;
  const skipped = total - right - wrong;
  const pct = total ? Math.round((right/total)*100) : 0;

  // per-grammar-point breakdown
  const byPoint = {};
  quiz.forEach((q,i)=>{
    const a = answered[i];
    const k = q.grammarPoint;
    byPoint[k] = byPoint[k] || { right:0, wrong:0, total:0 };
    byPoint[k].total++;
    if(a && a.correct) byPoint[k].right++;
    else if(a) byPoint[k].wrong++;
  });
  const rows = Object.entries(byPoint).sort((a,b)=> (a[1].right/a[1].total) - (b[1].right/b[1].total));

  // weakest attempted point
  const attempted = rows.filter(([,v]) => v.right + v.wrong > 0);
  let weakTip = "";
  if(attempted.length && wrong > 0){
    const [wkName, wk] = attempted[0];
    weakTip = `
      <div class="weak-tip">💡 Your trickiest point was <b>${esc(wkName)}</b> (${wk.right}/${wk.total}).
      There's a matching card in <b>⚡ Fast Review</b> for Year ${year} — drill it, then try the quiz again.</div>`;
  }

  // circumference for donut
  const R = 52, C = 2*Math.PI*R, off = C * (1 - pct/100);

  const missed = quiz.map((q,i)=>({q, a:answered[i]}))
    .filter(x => !x.a || !x.a.correct);
  const missedHtml = missed.length ? `
    <div class="breakdown">
      <h3>Questions to revisit</h3>
      ${missed.map(({q,a})=>`
        <div class="miss">
          <div class="mq">${esc(q.question)} <em>(${esc(q.grammarPoint)})</em></div>
          <div class="ma">
            ${a ? `<span class="no">✕ you: ${esc(a.chosen)}</span>` : `<span class="no">✕ not answered</span>`}
            <span class="ok">✓ answer: ${esc(q.answer)}</span>
          </div>
        </div>`).join("")}
    </div>` : "";

  stage.innerHTML = `
    <div class="card results">
      ${timedOut ? `<span class="timeup">⏱ Time's up</span>` : ""}
      <svg class="donut" width="130" height="130" viewBox="0 0 130 130" aria-hidden="true">
        <circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--paper-2)" stroke-width="12"/>
        <circle cx="65" cy="65" r="${R}" fill="none" stroke="var(--accent-2)" stroke-width="12"
          stroke-linecap="round" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
          transform="rotate(-90 65 65)"/>
        <text x="65" y="72" text-anchor="middle" font-size="26" font-weight="800" fill="var(--ink)">${pct}%</text>
      </svg>
      <div class="big">${right}/${total}</div>
      <p>${pct >= 90 ? "Top of the class!" : pct >= 70 ? "Strong work — nearly there." : pct >= 50 ? "Good effort — review the tricky points below." : "Keep going — Fast Review will help."}</p>
      <div class="split">
        <span class="chip ok">✓ ${right} correct</span>
        <span class="chip no">✕ ${wrong} wrong</span>
        ${skipped ? `<span class="chip skip">– ${skipped} unanswered</span>` : ""}
      </div>
      <div class="breakdown">
        <h3>By grammar point</h3>
        ${rows.map(([name,v])=>`
          <div class="brow">
            <div class="top"><span>${esc(name)}</span><span class="frac">${v.right}/${v.total}</span></div>
            <div class="bar">
              <span class="seg-ok" style="width:${(v.right/v.total)*100}%"></span>
              <span class="seg-no" style="width:${(v.wrong/v.total)*100}%"></span>
            </div>
          </div>`).join("")}
      </div>
      ${missedHtml}
      ${weakTip}
      <div style="margin-top:26px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
        <button class="btn" onclick="startQuiz()">Try another quiz ↻</button>
        <button class="btn ghost" onclick="setMode('review')">⚡ Fast Review</button>
      </div>
    </div>`;
}

/* ---------- Fast Review flashcards ---------- */
function ensureDeck(){
  if(!reviewDeck.length){
    reviewDeck = deckForYear(year);
    reviewIndex = 0;
  }
}
function renderReview(){
  ensureDeck();
  if(!reviewDeck.length){
    stage.innerHTML = `<div class="card"><div class="empty">No review cards for Year ${year} yet.</div></div>`;
    return;
  }
  const c = reviewDeck[reviewIndex];
  stage.innerHTML = `
    <div class="flash">
      <div class="flash-inner" id="flashInner" onclick="flipCard()">
        <div class="face front">
          <span class="tag">Year <span class="yr">${c.year}</span> · card ${reviewIndex+1}/${reviewDeck.length}</span>
          <div class="point">${esc(c.point)}</div>
          <div class="hint">${esc(c.hint)}</div>
        </div>
        <div class="face back">
          <span class="tag">Year <span class="yr">${c.year}</span> · the rule</span>
          <div class="defn">${esc(c.defn)}</div>
          <div class="eg">${esc(c.eg)}</div>
        </div>
      </div>
      <div class="flip-hint">Tap card or press space to flip · ← → to move</div>
      <div class="qnav">
        <button class="btn ghost" onclick="stepCard(-1)" ${reviewIndex===0?"disabled":""}>‹ Prev</button>
        <span class="prog">${reviewIndex+1} / ${reviewDeck.length}</span>
        <button class="btn" onclick="stepCard(1)" ${reviewIndex===reviewDeck.length-1?"disabled":""}>Next ›</button>
      </div>
      <div class="review-tools">
        <button class="btn ghost" onclick="shuffleDeck()">⇄ Shuffle deck</button>
      </div>
    </div>`;
}
function flipCard(){ $("#flashInner").classList.toggle("flipped"); }
function stepCard(d){
  const n = reviewIndex + d;
  if(n < 0 || n >= reviewDeck.length) return;
  reviewIndex = n;
  renderReview();
}
function shuffleDeck(){
  reviewDeck = shuffle(deckForYear(year));
  reviewIndex = 0;
  renderReview();
}

/* ---------- Keyboard ---------- */
document.addEventListener("keydown", (e)=>{
  if(mode === "quiz" && quizStarted && qIndex < quiz.length){
    const k = e.key.toUpperCase();
    const idx = "ABCD".indexOf(k);
    if(idx > -1 && !answered[qIndex]){ choose(idx); return; }
    if((e.key === "Enter" || e.key === "ArrowRight") && answered[qIndex]){ nextQ(); }
  } else if(mode === "review"){
    if(e.key === "ArrowRight"){ stepCard(1); }
    else if(e.key === "ArrowLeft"){ stepCard(-1); }
    else if(e.key === " " || e.key === "Enter"){ e.preventDefault(); flipCard(); }
  }
});

/* ---------- Init ---------- */
buildYears();
updateGpCount();
render();
</script>
</body>
</html>
