<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Extended Essay Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
/* Layout idea: a fixed rail on the left carries the word ruler and navigation; the working sheet sits to its right.
   Theme: charcoal ink on cream paper, one friendly section colour per page. Light only, by choice. */
:root{
  --bg:#faf5ec; --surface:#ffffff; --ink:#2f2a25; --muted:#6e655a; --line:#ece5d8; --line-strong:#d6cebf;
  --accent:#c96a17; --accent-ink:#ffffff; --tint:#fef2e4; --soft:#f7c391;
  --mark:#f7c391; --mark-ink:#2f2a25;
  --ok:#3d8a4e; --warn:#c96a17; --over:#cf4f3f;
  --display:"DM Serif Display",Georgia,serif;
  --body:"DM Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  color-scheme:light;
}
body[data-tab="guide"],body[data-tab="sources"]{--accent:#2f78b8;--tint:#ebf4fc;--soft:#a9cdee}
body[data-tab="walkthroughs"],body[data-tab="reflection"]{--accent:#7b55b5;--tint:#f5f0fc;--soft:#cfbbec}
body[data-tab="builder"],body[data-tab="criteria"]{--accent:#3d8a4e;--tint:#edf7ef;--soft:#aad7b2}
body[data-tab="draft"]{--accent:#cf4f3f;--tint:#fdefec;--soft:#f6b4a9}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
h1{font-size:1.75rem;font-weight:700}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1rem;font-weight:500}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.875rem}

.app{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:100vh}
.rail{background:var(--surface);border-right:1px solid var(--line);padding:24px 20px;display:flex;flex-direction:column;gap:24px;position:sticky;top:0;align-self:start;height:100vh;overflow:auto}
.brand{display:flex;flex-direction:column;gap:4px}
.brand b{font-family:var(--display);font-size:1.125rem;font-weight:700}
.brand b mark{background:var(--mark);color:var(--mark-ink);padding:0 .3em;border-radius:3px}
nav{display:flex;flex-direction:column;gap:4px}
nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:8px;color:var(--ink);text-decoration:none;font-weight:500}
nav a:hover{background:var(--bg)}
nav a[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
nav a span{font-size:.8125rem;opacity:.85}
.meter{display:flex;flex-direction:column;gap:6px}
.meter .big{font-family:var(--display);font-size:2rem;font-weight:700;line-height:1}
.meter .big small{font:400 .875rem var(--body);color:var(--muted)}
.save{font-size:.8125rem;color:var(--muted);display:flex;gap:8px;align-items:flex-start;margin-top:auto}
.dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--muted);margin-top:.4em}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)}

main{padding:28px clamp(16px,4vw,48px) 64px;display:flex;flex-direction:column;gap:24px;min-width:0}
.sheet{max-width:860px;width:100%;display:flex;flex-direction:column;gap:24px}
.banner{background:var(--mark);color:var(--mark-ink);border-radius:10px;padding:12px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.banner button{background:var(--mark-ink);color:var(--mark);border-color:var(--mark-ink)}
.head{display:flex;flex-direction:column;gap:6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.8125rem;font-weight:600;color:var(--muted);min-width:0}
input[type=text],input[type=date],input[type=number],input[type=url],select,textarea{
  font:400 1rem/1.5 var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:84px;overflow:hidden}
textarea.essay{font-size:1.0625rem;line-height:1.7;min-height:160px;background:var(--surface);border-color:transparent;padding:4px 0;border-radius:0;max-width:68ch}
textarea.essay:focus{outline:none}
.card:focus-within{border-color:var(--accent)}
input.title{font:500 1.0625rem var(--display);background:transparent;border-color:transparent;padding:4px 0;border-radius:0;border-bottom:1px dashed var(--line)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button{font:500 .9375rem var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.ghost{border-color:transparent;color:var(--muted);padding:6px 8px}
button.ghost:hover{color:var(--ink);border-color:var(--line)}
button[data-armed]{color:var(--over);border-color:var(--over)}

/* word ruler */
.ruler{display:flex;flex-direction:column;gap:6px}
.track{position:relative;height:22px;background:var(--bg);border:1px solid var(--line);border-radius:5px;overflow:hidden;display:flex}
.seg{height:100%;min-width:0;border-right:1px solid var(--surface)}
.limit{position:absolute;top:0;bottom:0;width:2px;background:var(--over)}
.ticks{position:relative;height:18px;font-size:.75rem;color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.ticks span:first-child{transform:none}
.ticks span.end{transform:translateX(-100%)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.8125rem;font-weight:600;border-radius:999px;padding:3px 10px;border:1px solid currentColor;white-space:nowrap}
.pill.ok{color:var(--ok)} .pill.warn{color:var(--warn)} .pill.over{color:var(--over)} .pill.idle{color:var(--muted)}
.bar{height:5px;background:var(--bg);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.over i{background:var(--over)}

.list{display:flex;flex-direction:column;gap:10px}
.item{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item .wide{grid-column:2/-1}
input[type=checkbox]{width:19px;height:19px;accent-color:var(--accent);flex:none}
input[type=range]{width:100%;accent-color:var(--accent)}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{margin-top:3px}
.crit{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:8px 20px;align-items:start}
.score{font-family:var(--display);font-size:1.5rem;font-weight:700}
.total{font-family:var(--display);font-size:2.25rem;font-weight:700;line-height:1}
.hint{display:flex;gap:8px;align-items:center;font-size:.875rem}
.hint::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.hint.ok::before{background:var(--ok)} .hint.warn::before{background:var(--warn)}
.bib{font-size:.9375rem;padding-left:2em;text-indent:-2em;overflow-wrap:anywhere}
.card ul,.card ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
.card a{color:var(--accent)}
.card>p,.card>ul,.card>ol{max-width:68ch}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.steps>div{border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:.9375rem}
.weak,.strong{border-left:4px solid var(--warn);padding:6px 0 6px 12px}
.strong{border-left-color:var(--ok)}
.banked{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px;max-width:68ch}
.card,.sheet{min-width:0}
.deck{position:relative;display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;min-width:0;border-radius:10px}
.slide{flex:0 0 100%;min-width:0;scroll-snap-align:start;background:var(--bg);border-radius:10px;padding:22px;display:flex;flex-direction:column;gap:12px}
.slide h2{font-size:1.5rem}
.slide-cols{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:20px}
.slide-main,.slide-ask{display:flex;flex-direction:column;gap:10px;min-width:0}
.slide-ask{border-left:3px solid var(--mark);padding-left:16px}
.slide ul,.slide ol{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}
@media (max-width:640px){.slide-cols{grid-template-columns:minmax(0,1fr)}}
.build{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,3fr);gap:20px;align-items:start}
.ngroup{border-left:3px solid var(--line);padding-left:12px;display:flex;flex-direction:column;gap:4px}
.ngroup.fresh{border-left-color:var(--mark)}
.paper{background:var(--surface);border:1px solid var(--line);border-radius:3px;padding:32px clamp(18px,4vw,40px);display:flex;flex-direction:column;gap:18px;box-shadow:0 6px 18px -12px color-mix(in srgb,var(--ink) 55%,transparent);min-width:0}
.paper-title{font:700 1.375rem/1.2 var(--display);text-align:center;text-wrap:balance}
.paper-rq{border-bottom:1px solid var(--line);padding-bottom:14px}
.psec{display:flex;flex-direction:column;gap:8px;padding-left:12px;border-left:3px solid transparent}
.psec.fresh,.paper-rq.fresh{border-left:3px solid var(--mark);padding-left:12px}
.psec ul{margin:0;padding-left:1.3em;color:var(--muted)}
.psec.done p{line-height:1.7}
.claim{background:color-mix(in srgb,var(--mark) 45%,var(--surface));color:var(--ink);padding:4px 8px;border-radius:4px;font-size:.9375rem;align-self:flex-start}
.ph{height:9px;border-radius:5px;background:var(--line)}
@media (max-width:800px){.build{grid-template-columns:minmax(0,1fr)}}
/* ---- theme layer ---- */
body{-webkit-font-smoothing:antialiased;color:#403a33}
h1{font-family:var(--display);font-weight:400;font-size:2.1rem;letter-spacing:-.01em;color:var(--ink)}
h2,h3{font-family:var(--body);font-weight:700;letter-spacing:-.015em;color:var(--ink)}
main{background:radial-gradient(circle at 92% -40px,rgba(236,138,53,.16),transparent 320px),radial-gradient(circle at 4% 260px,rgba(74,148,212,.10),transparent 300px),linear-gradient(180deg,#fff4e6 0,var(--bg) 240px) no-repeat}
.rail{background:rgba(255,253,249,.94)}
.brand{flex-direction:row;align-items:center;gap:10px}
.brand b{font:700 1.125rem var(--body);letter-spacing:-.02em;display:flex;flex-direction:column;line-height:1.2}
.brand b small{font:500 .75rem var(--body);color:var(--muted);letter-spacing:0}
.logo-mark{flex:none;width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#ec8a35,#ea6e5b);box-shadow:0 3px 8px rgba(236,138,53,.3);color:#fff;font:700 .8125rem var(--body);display:flex;align-items:center;justify-content:center}
.meter .big,.score,.total{font-family:var(--body);font-weight:700;letter-spacing:-.02em}
input.title{font:600 1.0625rem var(--body)}
.paper-title{font:400 1.5rem/1.2 var(--display)}
nav a{border-radius:100px;font-weight:600;font-size:.9375rem;color:#574f46;padding:8px 14px}
nav a::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--dot,var(--line-strong));flex:none}
nav a{justify-content:flex-start}
nav a span{margin-left:auto;background:var(--bg);color:var(--muted);font-weight:700;font-size:.72rem;padding:2px 9px;border-radius:100px;opacity:1}
nav a span:empty{display:none}
nav a:hover{background:var(--tint)}
nav a[aria-current="page"]{background:var(--accent);color:#fff}
nav a[aria-current="page"]::before{background:#fff}
nav a[aria-current="page"] span{background:rgba(255,255,255,.22);color:#fff}
.card{border-radius:16px;box-shadow:0 2px 8px rgba(47,42,37,.04)}
.sheet>.card:first-of-type{border-top:4px solid var(--accent)}
.steps>div{border-radius:14px;background:var(--surface)}
button{border-radius:100px;font-weight:600;border-width:1.5px;transition:border-color .2s,background .2s,transform .2s,box-shadow .2s}
button:hover:not(:disabled){background:var(--tint)}
button:disabled{opacity:.45;cursor:default}
button.primary{box-shadow:0 3px 8px color-mix(in srgb,var(--accent) 30%,transparent)}
button.primary:hover:not(:disabled){background:var(--accent);transform:translateY(-1px)}
input[type=text],input[type=date],input[type=number],input[type=url],select,textarea{background:var(--surface);border:1.5px solid var(--line);border-radius:12px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 15%,transparent)}
textarea.essay,input.title{border-color:transparent;box-shadow:none;border-radius:0}
textarea.essay:focus,input.title:focus{box-shadow:none;border-color:transparent}
input.title{border-bottom:1px dashed var(--line-strong)}
.pill{font-weight:700;font-size:.78rem;background:var(--surface)}
.pill.ok{background:#edf7ef;border-color:#aad7b2} .pill.warn{background:#fef2e4;border-color:#f7c391} .pill.over{background:#fdefec;border-color:#f6b4a9} .pill.idle{background:var(--bg);border-color:var(--line-strong)}
.banner{background:#fef2e4;border:1px solid #f7c391;border-radius:16px;color:var(--ink)}
.banner button{background:#c96a17;color:#fff;border-color:#c96a17}
.track{border-radius:100px;background:var(--bg)} .bar{border-radius:100px;height:6px}
.ph{background:var(--line)}
.claim{background:var(--tint);border:1px solid var(--soft)}
.ngroup.fresh,.psec.fresh,.paper-rq.fresh{border-left-color:var(--accent)}
.slide{background:var(--tint);border-radius:14px}
.slide-ask{border-left-color:var(--soft)}
.paper{border-radius:6px}
.card a{font-weight:600}
@media (prefers-reduced-motion:reduce){button{transition:none}}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.9375rem;max-width:calc(100% - 32px);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}

@media (max-width:800px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line);padding:16px;gap:14px}
  nav{flex-direction:row;overflow-x:auto;padding-bottom:2px}
  nav a{flex:none}
  nav a span{display:none}
  .meter{flex-direction:row;align-items:baseline;gap:12px;flex-wrap:wrap}
  .meter .big{font-size:1.5rem}
  .save{margin-top:0}
  .crit{grid-template-columns:minmax(0,1fr)}
  .item{grid-template-columns:auto minmax(0,1fr)}
  .item .end{grid-column:2}
}
</style>

<body>
<div class="app">
  <aside class="rail">
    <div class="brand"><span class="logo-mark" aria-hidden="true">EE</span><b>EE Workspace<small>IB Extended Essay, 2027 criteria</small></b></div>
    <div class="meter" aria-live="off">
      <div class="big num"><span id="m-total">0</span> <small>/ <span id="m-limit">4,000</span> <span id="m-unit">words</span></small></div>
      <div class="bar" id="m-bar"><i style="width:0"></i></div>
      <span class="small muted" id="m-left"></span>
    </div>
    <nav id="nav" aria-label="Sections of the workspace"></nav>
    <div class="save"><i class="dot" id="save-dot"></i><span id="save-text">Loading your saved work…</span></div>
  </aside>
  <main><div class="sheet" id="view"></div></main>
</div>
<template id="guide-tpl">
<section class="card">
  <h2>Start here: this is a paper, not a test</h2>
  <p>You write the Extended Essay over several months with your notes and sources open in front of you. Nothing is sat under exam conditions, so there are no texts or quotations to memorise. The marks come from the quality of your question, your argument and your evaluation.</p>
  <p>Plan for about 40 hours of your own work. Your supervisor gives three to five hours in total, including three required reflection sessions, and comments on one complete draft.</p>
  <h3>The few things that are useful to know by heart</h3>
  <ul>
    <li>Your research question, word for word. Every paragraph is tested against it.</li>
    <li>The five criteria and their weights: Framework 6, Knowledge and understanding 6, Analysis and line of argument 6, Discussion and evaluation 8, Reflection 4. Discussion and evaluation is the largest single block.</li>
    <li>The paper model for your kind of essay (see below).</li>
    <li>The paragraph pattern: claim, evidence, analysis, link back to the question.</li>
    <li>How your citation style writes a book, an article and a website, so you can log sources correctly the first time.</li>
  </ul>
  <div class="row" id="guide-jump">
    <button data-act="jump" data-to="g-question">Question</button>
    <button data-act="jump" data-to="g-models">Paper models</button>
    <button data-act="jump" data-to="g-cases">Question types</button>
    <button data-act="jump" data-to="g-sources">Taking in sources</button>
    <button data-act="jump" data-to="g-walk">Worked examples</button>
    <button data-act="jump" data-to="g-top">Top-band features</button>
    <button data-act="jump" data-to="g-strat">Strategies</button>
    <button data-act="jump" data-to="g-bank">Quote bank</button>
    <button data-act="jump" data-to="g-prep">Preparation</button>
    <button data-act="jump" data-to="g-res">Resources</button>
  </div>
</section>

<section class="card" id="g-question">
  <h2>From a topic to a question</h2>
  <p>Most weak essays start from a question that is too wide. Narrow by place, period, text, variable or case until one person could answer it in 4,000 words.</p>
  <div class="steps">
    <div><b>History</b><p class="muted">Topic: the Meiji Restoration</p><p class="weak">Too wide: How did the Meiji Restoration change Japan?</p><p class="strong">Workable: To what extent was the 1873 land tax reform responsible for the 1876 peasant uprising in Mie Prefecture?</p></div>
    <div><b>Literature</b><p class="muted">Topic: Kazuo Ishiguro</p><p class="weak">Too wide: How does Ishiguro present memory?</p><p class="strong">Workable: How does Ishiguro use an unreliable narrator to present self-deception in The Remains of the Day?</p></div>
    <div><b>Biology</b><p class="muted">Topic: plant growth</p><p class="weak">Too wide: What affects germination?</p><p class="strong">Workable: How does sodium chloride concentration (0 to 200 mM) affect the germination rate of radish seeds over seven days?</p></div>
    <div><b>Economics</b><p class="muted">Topic: consumption tax</p><p class="weak">Too wide: Was the tax increase bad for business?</p><p class="strong">Workable: To what extent did the 2019 consumption tax increase reduce sales at independent bookshops in Setagaya, Tokyo?</p></div>
  </div>
  <h3>Four tests for your own question</h3>
  <ul>
    <li>It needs an argument. If the answer is a list of facts, it is a description.</li>
    <li>You can reach the sources or collect the data yourself, in the time you have.</li>
    <li>It sits inside the methods of your subject. A history question is answered with historical sources, a biology question with an experiment or data.</li>
    <li>Someone could reasonably disagree with your answer.</li>
  </ul>
</section>

<section class="card" id="g-models">
  <h2>Four paper models</h2>
  <p>Pick the one that matches your essay and set your section headings on the Draft page to follow it.</p>
  <div class="steps">
    <div><b>1. Text analysis</b><p class="muted">Literature, language, film, visual arts, music</p>
      <ol><li>Introduction: the text, the question, your line of argument</li><li>Context, only as much as the argument needs</li><li>Three or four analytical sections, one technique or idea each, ordered so each builds on the last</li><li>Conclusion that answers the question</li></ol>
      <p class="strong">Exceptional: close reading of short quotations, and a critic you refine or disagree with.</p></div>
    <div><b>2. Source-based argument</b><p class="muted">History, politics, philosophy, business, economics without your own data</p>
      <ol><li>Introduction and scope</li><li>Background the reader needs</li><li>Sections organised by factor or claim, never by date order</li><li>The strongest counter-argument, weighed</li><li>Evaluation of your sources</li><li>Conclusion with a judgement of extent</li></ol>
      <p class="strong">Exceptional: sources that disagree with each other, and factors weighed against one another.</p></div>
    <div><b>3. Investigation with data</b><p class="muted">Sciences, geography, psychology, economics with primary data, mathematical modelling</p>
      <ol><li>Introduction and hypothesis</li><li>Background theory</li><li>Method, with each choice justified</li><li>Results in labelled tables and graphs</li><li>Analysis</li><li>Evaluation of method and uncertainty</li><li>Conclusion</li></ol>
      <p class="strong">Exceptional: uncertainty in numbers, and each limitation tied to its effect on the result.</p></div>
    <div><b>4. Interdisciplinary</b><p class="muted">One question, two subjects</p>
      <ol><li>Introduction: why this question needs both subjects</li><li>What each subject's methods show</li><li>A section that brings the two together</li><li>Evaluation and conclusion</li></ol>
      <p class="strong">Exceptional: a finding that neither subject could have reached alone.</p></div>
  </div>
</section>

<section class="card" id="g-cases">
  <h2>Three question types, from first thought to finished paper</h2>
  <p>Each walk-through shows what the question is asking for, the thinking in order, and the shape of the final paper. The lines of argument are illustrations. Your own evidence decides your answer.</p>

  <h3>Type 1: "To what extent…" (weigh causes and reach a judgement)</h3>
  <p class="strong">To what extent was the 1873 land tax reform responsible for the 1876 peasant uprising in Mie Prefecture?</p>
  <p><b>What it asks for:</b> a judgement of degree. You must set the named cause against other causes and say how much weight it carries.</p>
  <ol>
    <li><b>Unpack the terms.</b> What did the reform change (a fixed cash tax on assessed land value)? What counts as "responsible": the trigger, or the underlying cause?</li>
    <li><b>List rival causes</b> before reading deeply: rice prices that year, how local officials assessed land, other new obligations on villages.</li>
    <li><b>Decide what evidence would show each cause.</b> Petitions and demands show what protesters said they wanted. Price records show economic pressure. Later government action shows what the state thought the cause was.</li>
    <li><b>Collect both kinds of source:</b> primary (petitions, official reports, newspapers) and historians who disagree with each other.</li>
    <li><b>Weigh.</b> Which cause appears in every source? Which only in some? Which explains the timing and the place?</li>
    <li><b>Write the answer in one sentence</b> before drafting. For example: the reform was the main underlying cause, but the uprising happened when and where it did because of that year's prices and local assessment.</li>
  </ol>
  <p><b>Things to consider:</b> official reports were written by the side being protested against. Translation and access may limit your primary sources, so say so in your evaluation.</p>
  <div class="steps"><div><b>Final paper</b><ol>
    <li>Introduction: the event, the question, your judgement in brief (about 350 words)</li>
    <li>The reform and what it changed for farmers (500)</li>
    <li>The case for the reform as the cause (900)</li>
    <li>Rival causes: prices and local administration (900)</li>
    <li>Weighing the causes against each other (700)</li>
    <li>Evaluation of sources and conclusion (650)</li>
  </ol></div></div>

  <h3>Type 2: "How does the author…" (analyse technique and effect)</h3>
  <p class="strong">How does Ishiguro use an unreliable narrator to present self-deception in The Remains of the Day?</p>
  <p><b>What it asks for:</b> analysis of how the writing works. Plot summary earns almost nothing. Every point has to name a technique and its effect on the reader.</p>
  <ol>
    <li><b>Define the key terms from scholarship.</b> What do critics mean by an unreliable narrator? What would self-deception look like on the page?</li>
    <li><b>Reread with one task:</b> mark every place where what the narrator says and what the reader understands come apart.</li>
    <li><b>Sort those passages into patterns</b>, such as formal language used to avoid feeling, memories corrected or re-told, and digressions at moments of emotion.</li>
    <li><b>Choose three or four patterns</b> and the two best short passages for each. Bank them with page numbers.</li>
    <li><b>Order the patterns so the argument develops</b>, for example from small evasions to the moment the narrator almost admits the truth.</li>
    <li><b>Find one critic to work with</b> and decide where you agree and where you would go further.</li>
  </ol>
  <p><b>Things to consider:</b> quote a few words at a time and analyse them closely. If a paragraph could be written without the book open, it is summary.</p>
  <div class="steps"><div><b>Final paper</b><ol>
    <li>Introduction: the novel, the question, your reading in one sentence (350)</li>
    <li>Unreliable narration and self-deception: the terms you will use (400)</li>
    <li>Pattern one: language that keeps feeling at a distance (800)</li>
    <li>Pattern two: memory revised in the telling (800)</li>
    <li>Pattern three: what is avoided and where the narration breaks (800)</li>
    <li>Where your reading differs from the critic, and conclusion (850)</li>
  </ol></div></div>

  <h3>Type 3: "How does X affect Y…" (investigate with your own data)</h3>
  <p class="strong">How does sodium chloride concentration (0 to 200 mM) affect the germination rate of radish seeds over seven days?</p>
  <p><b>What it asks for:</b> a relationship between two variables, established by a method someone else could repeat, with the uncertainty stated.</p>
  <ol>
    <li><b>Name the variables.</b> Independent: salt concentration. Dependent: percentage of seeds germinated each day. Controlled: temperature, light, water volume, seed batch.</li>
    <li><b>Read the theory first</b> so you can predict a result and explain it (salt lowers the water available to the seed).</li>
    <li><b>Design for reliability:</b> at least five concentrations, several dishes at each, enough seeds per dish to give a meaningful percentage.</li>
    <li><b>Run a small trial</b> to find problems before the real run, and record what you changed.</li>
    <li><b>Record raw data as you go,</b> including anything odd, such as mould or a dish that dried out.</li>
    <li><b>Process and graph:</b> means, spread, a graph with error bars, and a statistical test if your subject expects one.</li>
    <li><b>Explain, then evaluate.</b> Does the result match theory and published values? Which weaknesses in the method could have changed it, and in which direction?</li>
  </ol>
  <p><b>Things to consider:</b> safety and ethics approval from your school, and the fact that tables and graphs must be readable on their own with titles and units.</p>
  <div class="steps"><div><b>Final paper</b><ol>
    <li>Introduction, question and hypothesis (350)</li>
    <li>Background: germination and salt stress (600)</li>
    <li>Method, with each choice justified (650)</li>
    <li>Results: tables and graphs with short commentary (500)</li>
    <li>Analysis: the trend, the statistics, comparison with published work (900)</li>
    <li>Evaluation of method and uncertainty (650)</li>
    <li>Conclusion (350)</li>
  </ol></div></div>

  <h3>Other wordings you will meet</h3>
  <ul>
    <li><b>"How far…", "How significant…", "How successful…":</b> treat as Type 1. Set a standard for significance or success first, then judge against it.</li>
    <li><b>"Compare…":</b> organise by point of comparison, never one item and then the other.</li>
    <li><b>"What is the relationship between…":</b> treat as Type 3, using published data if you cannot collect your own.</li>
  </ul>
</section>

<section class="card" id="g-sources">
  <h2>Taking in a source</h2>
  <ol>
    <li><b>Decide what you need before you read.</b> Write one line: "From this I want…".</li>
    <li><b>Skim first.</b> Read the abstract or introduction and the conclusion. Give it five minutes, then keep it or drop it.</li>
    <li><b>Log it at once</b> on the Sources page, with everything the bibliography will need.</li>
    <li><b>Read with your question beside you.</b> Bank three to five pieces of evidence at most, each with a page number.</li>
    <li><b>Summarise in your own words.</b> One sentence on what it claims and one on how it helps or complicates your argument.</li>
    <li><b>Evaluate it.</b> Who wrote it, when, for whom, on what evidence, and what it cannot tell you.</li>
    <li><b>Mark quote or paraphrase.</b> You should never have to wonder later whether a sentence in your notes is yours.</li>
  </ol>
  <p>Aim for range: a few scholarly sources, primary material where your subject uses it, and at least one view that opposes yours.</p>
</section>

<section class="card" id="g-walk">
  <h2>Worked examples</h2>
  <p class="small muted">These use the example essay about bookshops. The figures are invented for illustration.</p>
  <h3>A body paragraph</h3>
  <p class="weak">Weak: The consumption tax went up in 2019. Many bookshops had lower sales after this. Shop owner A said that sales went down. This shows the tax was bad for bookshops.</p>
  <p class="small">It describes, relies on one voice, gives no size for the change and assumes the tax caused it.</p>
  <p class="strong">Strong: The tax rise coincided with a fall in sales, but the size of the fall suggests that tax alone does not explain it. Across the four shops, sales in the three months after October 2019 were 11% lower than in the same months of 2018, far more than a two-point price rise would predict if demand for books is price inelastic. Shop owner A attributes part of the drop to customers buying ahead in September, which the September figures support. The tax therefore shifted the timing of purchases as much as it reduced them, which limits how much of the decline can be attributed to it.</p>
  <ul class="small">
    <li>Sentence 1 is a claim that takes a position.</li>
    <li>Sentence 2 gives evidence with a number and a comparison, and connects it to theory.</li>
    <li>Sentence 3 uses a second source to test the first.</li>
    <li>Sentence 4 says what the evidence means for "to what extent".</li>
  </ul>
  <h3>An evaluation point</h3>
  <p class="weak">Weak: My essay had some limitations, such as limited time and few sources.</p>
  <p class="strong">Strong: The sales records came from four shops that agreed to share them, which probably excludes the shops that were struggling most. The true average fall may therefore be larger than my figure.</p>
  <p class="small">Name the limitation, say which way it pushes the result, and say what that does to your conclusion.</p>
  <h3>An introduction, in four moves</h3>
  <ol class="small"><li>The specific situation, in two or three sentences.</li><li>Why it is worth asking about within your subject.</li><li>The research question, stated exactly.</li><li>How you will answer it: sources or method, and the order of the essay.</li></ol>
  <h3>A conclusion</h3>
  <p class="small">Answer the question directly in the first sentence. Summarise the reasons, state what limits the answer, and name what is still unresolved. Add no new evidence.</p>
  <h3>A reflection sentence</h3>
  <p class="weak">Weak: I learned a lot about time management and research.</p>
  <p class="strong">Strong: I planned to interview ten owners and reached four, so I now secure access to data before I commit to a question.</p>
</section>

<section class="card" id="g-top">
  <h2>What separates the top band</h2>
  <ul>
    <li><b>Framework:</b> a narrow question, and a reason given for every choice of method or source.</li>
    <li><b>Knowledge and understanding:</b> subject concepts are applied to your case with precise terminology.</li>
    <li><b>Analysis and line of argument:</b> each section moves the argument one step, and a reader could follow it from the headings alone.</li>
    <li><b>Discussion and evaluation:</b> findings are weighed, counter-arguments are answered, and limitations are specific.</li>
    <li><b>Reflection:</b> it evaluates how you changed as a learner, with specific moments as examples.</li>
  </ul>
  <h3>Essential features of the finished essay</h3>
  <ul>
    <li>Title page with the title, research question, subject and word count</li>
    <li>Contents page, and page numbers throughout</li>
    <li>Introduction, body with headings, conclusion</li>
    <li>References in one citation style, used the same way every time</li>
    <li>Figures and tables numbered, titled and sourced</li>
  </ul>
  <p class="small muted">Ask your coordinator for the school's formatting and anonymity requirements before you submit.</p>
  <h3>Mistakes that cost the most marks</h3>
  <ul>
    <li>A question too wide to answer</li>
    <li>Telling the story instead of arguing a case</li>
    <li>Quotations and data dropped in without analysis</li>
    <li>Evaluation left to one paragraph at the end</li>
    <li>Going over the limit: examiners do not read past it</li>
    <li>A reflection that lists what you did</li>
    <li>Uncited material. If you use an AI tool, say so and cite it as your school requires. Text you did not write is not yours to submit.</li>
  </ul>
</section>

<section class="card" id="g-bank">
  <h2>Build your own quote bank</h2>
  <p>No ready-made bank fits your essay, because your evidence has to come from the sources your question needs. Build it as you read, in the Evidence bank on the Sources page. Each entry is tagged to a section and appears under that section on the Draft page.</p>
  <div class="steps">
    <div><b>Text analysis</b><ul><li>Short quotations that show a technique, with page or line</li><li>The same image or word recurring in different places</li><li>One critic's claim you can argue with</li></ul></div>
    <div><b>Source-based argument</b><ul><li>Statistics with their date and origin</li><li>A scholar's judgement</li><li>A primary voice from the time</li><li>The best statement of the opposing view</li></ul></div>
    <div><b>Investigation with data</b><ul><li>Published values to compare your results with</li><li>The standard method you adapted</li><li>Definitions of the theory you apply</li></ul></div>
  </div>
  <p>Keep quotations short, and follow each one with more of your own analysis than the quotation is long.</p>
  <h3>Sentence frames for analysis and evaluation</h3>
  <ul>
    <li>This suggests that …, because …</li>
    <li>While X argues that …, the evidence from … points to …</li>
    <li>This matters for the research question because …</li>
    <li>A limitation of this source is …, which means …</li>
    <li>The result differs from the expected value by …, most likely because …</li>
    <li>To a large extent …; however, …</li>
  </ul>
</section>

<section class="card" id="g-prep">
  <h2>How to prepare, in order</h2>
  <ol>
    <li>Read two assessed sample essays in your subject. Your coordinator can get them from the IB. Mark where each one argues and where it evaluates.</li>
    <li>Do a week of open reading, then narrow the question with your supervisor.</li>
    <li>Check that your sources or data exist before you commit to the question.</li>
    <li>Write your outline as full sentences, one claim per section. If the claims in order answer the question, the structure works.</li>
    <li>Draft the body first and the introduction last.</li>
    <li>Leave the draft alone for a week before editing.</li>
    <li>Edit in four passes: argument, evidence, word count, citations.</li>
    <li>Take notes after each supervisor session. They become your reflective statement.</li>
  </ol>
</section>

<section class="card" id="g-strat">
  <h2>Strategies most successful students use</h2>
  <div class="steps">
    <div><b>The funnel</b><p>Subject, then topic, then focus, then question. Do not write a question until you have read enough to know the sources exist.</p></div>
    <div><b>PEEL paragraphs</b><p>Point, Evidence, Explain, Link. The Explain step should be the longest part. If it is the shortest, the paragraph is description.</p></div>
    <div><b>The "so what?" test</b><p>After every piece of evidence, ask "so what does this show about my question?" and write the answer as the next sentence.</p></div>
    <div><b>OPVL for sources</b><p>Origin, Purpose, Value, Limitation. The Sources page has Value and Limitation fields so the evaluation is written before you draft.</p></div>
    <div><b>Reverse outline</b><p>Write one sentence per section saying what it argues. Read the sentences in order. If they do not answer the question, fix the structure before the prose. The Draft page builds this for you.</p></div>
    <div><b>Body first, introduction last</b><p>You cannot introduce an argument you have not made yet. Draft the analysis, then the conclusion, then the introduction.</p></div>
    <div><b>Short timed blocks</b><p>Work in 25-minute blocks with one stated task each, such as "summarise two sources" or "outline the method section". Batch similar tasks together.</p></div>
    <div><b>A research journal</b><p>Write a few lines after every work session: what you did, what changed, what you decided and why. The IB calls this a Researcher's reflection space. It is not submitted, but it is the raw material for your reflective statement.</p></div>
    <div><b>Read it aloud</b><p>Read the full draft aloud once before your supervisor sees it. You will hear missing steps in the argument that your eyes skip.</p></div>
  </div>
  <h3>Cutting words without cutting marks</h3>
  <ul>
    <li>Cut background first. Keep only what the argument uses.</li>
    <li>Shorten quotations to the words you analyse.</li>
    <li>Delete sentences that repeat the previous paragraph's point.</li>
    <li>Move raw data to tables. Keep the analysis in the text.</li>
    <li>Never cut evaluation to save words. It carries the most marks.</li>
  </ul>
  <h3>Getting the most from your supervisor</h3>
  <ul>
    <li>Arrive at every session with two or three written questions and your journal.</li>
    <li>You normally get written comments on one complete draft only, so make that draft as finished as you can.</li>
    <li>Your supervisor can question and advise but cannot edit your work.</li>
  </ul>
</section>

<section class="card" id="g-res">
  <h2>Resources worth knowing</h2>
  <h3>Official, and first in line</h3>
  <ul>
    <li><a href="https://ibo.org/university-admission/latest-curriculum-updates/dp-extended-essay-updates/">IB: Extended Essay updates</a> for the official position on the 2027 changes</li>
    <li>The Extended Essay guide and the subject-specific guidance for your subject. Your coordinator or librarian has both.</li>
    <li>Assessed sample essays and recent examiner reports for your subject. Ask your coordinator for these: they show what examiners reward and criticise.</li>
  </ul>
  <h3>Finding sources</h3>
  <ul>
    <li><a href="https://scholar.google.com/">Google Scholar</a>, <a href="https://www.jstor.org/">JSTOR</a>, <a href="https://core.ac.uk/">CORE</a> and <a href="https://doaj.org/">DOAJ</a> for scholarly articles, the last two free to read</li>
    <li><a href="https://cir.nii.ac.jp/">CiNii Research</a>, <a href="https://www.jstage.jst.go.jp/">J-STAGE</a> and the <a href="https://dl.ndl.go.jp/">National Diet Library Digital Collections</a> for Japanese scholarship and primary material</li>
    <li><a href="https://ourworldindata.org/">Our World in Data</a>, <a href="https://data.worldbank.org/">World Bank Open Data</a> and <a href="https://www.e-stat.go.jp/">e-Stat</a> for statistics you can cite</li>
    <li>Your school librarian and the databases your school pays for</li>
  </ul>
  <h3>Writing and citing</h3>
  <ul>
    <li><a href="https://www.phrasebank.manchester.ac.uk/">Manchester Academic Phrasebank</a> for academic sentence patterns by purpose</li>
    <li><a href="https://owl.purdue.edu/">Purdue OWL</a> for MLA, APA and Chicago rules</li>
    <li><a href="https://www.zotero.org/">Zotero</a> or <a href="https://www.mybib.com/">MyBib</a> to format the final bibliography in your school's style</li>
  </ul>
</section>

    sources:Array.isArray(s.sources)?s.sources:[], evidence:Array.isArray(s.evidence)?s.evidence:[], journal:Array.isArray(s.journal)?s.journal:[], milestones:Array.isArray(s.milestones)?s.milestones:b.milestones,
    sessions:Array.isArray(s.sessions)&&s.sessions.length===3?s.sessions:b.sessions, reflection:String(s.reflection||"")});
}
function setSave(kind, text){ $("save-dot").className = "dot " + kind; $("save-text").textContent = text; }
function touch(){
  state.updatedAt = Date.now();
  clearTimeout(lsTimer); lsTimer = setTimeout(saveLocal, 400);
  if(ref && !remoteOff){ setSave("", "Saving…"); clearTimeout(saveTimer); saveTimer = setTimeout(pushRemote, 1500); }
  else if(!ref) localOnlyNote();
}
function localOnlyNote(){ setSave("warn", "Saved in this browser only. Download a copy of anything you can't lose."); }
async function pushRemote(){
  if(!ref || remoteOff) return;
  if(saving){ pending = true; return; }
  saving = true;
  try{
    await ref.set(JSON.parse(JSON.stringify(state)));
    if(!pending) setSave("ok", "Saved to your Claude account. Only you can see it.");
  }catch(e){
    const code = e && e.code;
    if(code === "unavailable"){ setSave("warn", "Couldn't reach storage. Your work is kept in this browser and will retry on your next change."); }
    else { remoteOff = true; setSave("warn", code === "quota_exceeded" ? "Storage is full. Your work is kept in this browser only." : "This view can't save to your account. Your work is kept in this browser only."); }
  }
  saving = false;
  if(pending){ pending = false; pushRemote(); }
}
async function connect(){
  let db = null, user = null;
  try{
    if(window.claude && typeof window.claude.use === "function"){
      [user, db, downloads] = await Promise.all([claude.use("user"), claude.use("db"), claude.use("downloads")]);
    }
  }catch(e){}
  if(downloads) render();
  let id = null;
  try{ id = user ? await user.id() : null; }catch(e){}
  if(!db || !id){ localOnlyNote(); return; }
  try{
    ref = db.doc("data/users/" + id + "/essay");
    const timeout = new Promise((_, rej)=>setTimeout(()=>rej({code:"unavailable"}), 10000));
    const snap = await Promise.race([ref.get(), timeout]);
    const remote = snap.exists ? normalize(JSON.parse(JSON.stringify(snap.data()))) : null;
    if(remote && remote.updatedAt >= (state.updatedAt||0)){ state = remote; saveLocal(); render(); setSave("ok", "Saved to your Claude account. Only you can see it."); }
    else if(state.updatedAt){ pushRemote(); }
    else setSave("ok", "Your changes will save to your Claude account. Only you can see them.");
  }catch(e){ setSave("warn", "Couldn't reach storage yet. Your work is kept in this browser and will save on your next change."); }
}

/* ---------- helpers ---------- */
const $ = id => document.getElementById(id);
const esc = v => String(v == null ? "" : v).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = n => Number(n||0).toLocaleString("en-US");
const lang = () => LANGS[state.meta.lang] || LANGS.words;
function count(text){
  text = String(text||"");
  if(state.meta.lang === "words"){ const m = text.match(/\S+/g); return m ? m.length : 0; }
  return text.replace(/\s/g, "").length;
}
const total = () => state.sections.reduce((a,s)=>a+count(s.text), 0);
function getPath(path){ return path.split(".").reduce((o,k)=>o==null?o:o[k], state); }
function setPath(path, val){ const ks = path.split("."); const last = ks.pop(); const o = ks.reduce((o,k)=>o[k], state); o[last] = val; }
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(()=>t.classList.remove("on"), 3200); }
function today(){ const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function daysLeft(date){
  if(date === undefined) date = state.meta.deadline;
  if(!date) return null;
  const d = new Date(date + "T00:00:00"); if(isNaN(d)) return null;
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d - now) / 86400000);
}
function status(n, limit){
  if(n > limit) return ["over", fmt(n - limit) + " over"];
  if(n === 0) return ["idle", "Not started"];
  if(n >= limit * .9) return ["warn", fmt(limit - n) + " left"];
  return ["ok", fmt(limit - n) + " left"];
}
function bibLine(s){
  const parts = [];
  parts.push((s.author || "Unknown author") + (s.year ? " (" + s.year + ")." : "."));
  if(s.title) parts.push(s.title + ".");
  if(s.where) parts.push(s.where + ".");
  if(s.url) parts.push(s.url + (s.accessed ? " (accessed " + s.accessed + ")" : ""));
  return parts.join(" ");
}
const srcOf = e => state.sources.find(s=>s.id===e.source);
function evLabel(e){ const s = srcOf(e); return (s ? (s.author||"Unknown author") + (s.year?" "+s.year:"") : "No source chosen") + (e.page ? ", p. " + e.page : ""); }
function pace(){
  const L = lang(), left = L.limit - total();
  if(left <= 0) return "You have reached the limit. From here the work is editing.";
  const ms = state.milestones.find(m=>/draft/i.test(m.name) && m.date && !m.done);
  const date = ms ? ms.date : state.meta.deadline;
  if(!date) return "Give the draft milestone a date on the Plan page to see a daily pace.";
  const d = daysLeft(date);
  if(d == null || d <= 0) return "The date for " + (ms ? ms.name.toLowerCase() : "the final deadline") + " has passed. Set a new one on the Plan page.";
  return "About " + fmt(Math.ceil(left / d)) + " " + L.unit + " a day reaches the limit by " + date + " (" + (ms ? ms.name.toLowerCase() : "final deadline") + ").";
}
function argHTML(){
  return state.sections.map(s=>`<li><b>${esc(s.name)}:</b> ${s.claim && s.claim.trim() ? esc(s.claim) : `<span class="muted">no claim written yet</span>`}</li>`).join("");
}
function nextSteps(){
  const out = [], m = state.meta, rq = m.rq.trim(), T = total(), L = lang();
  const add = (t, tab) => out.push([t, tab]);
  if(!rq) add("Write a first version of your research question.", "plan");
  else if(!/[?？]$/.test(rq)) add("Rephrase your research question so it is a question.", "plan");
  if(!MODELS[m.model]) add("Pick a paper model. It takes one click.", "plan");
  if(!m.deadline) add("Enter your school's deadline for the final essay.", "plan");
  if(state.sources.length < 5) add("Log at least five sources before you draft. You have " + state.sources.length + ".", "sources");
  else if(!state.sources.some(s=>s.opposes)) add("Find one source that disagrees with your argument and mark it.", "sources");
  const unevaluated = state.sources.filter(s=>!(s.value && s.limit)).length;
  if(state.sources.length && unevaluated) add("Write the value and limitation of " + unevaluated + " source" + (unevaluated===1?"":"s") + ".", "sources");
  const noClaim = state.sections.filter(s=>!(s.claim && s.claim.trim())).length;
  if(noClaim) add("Write a one-sentence claim for " + noClaim + " section" + (noClaim===1?"":"s") + ".", "draft");
  if(state.sources.length >= 3 && state.evidence.length < state.sections.length) add("Bank evidence for each section you plan to write.", "sources");
  if(T === 0) add("Draft one body section. Leave the introduction for last.", "draft");
  if(T > L.limit) add("Cut " + fmt(T - L.limit) + " " + L.unit + ". Start with background.", "draft");
  const ses = state.sessions.find(s=>!s.attended);
  if(ses) add("Arrange your " + ses.name.toLowerCase() + " and bring written questions.", "plan");
  if(!state.journal.length) add("Write your first research journal entry.", "reflection");
  if(T >= L.limit * .8 && !state.reflection.trim()) add("Start your reflective statement from your journal.", "reflection");
  if(T >= L.limit * .8 && !CRITERIA.some(c=>state.scores[c.k])) add("Score your draft against the five criteria.", "criteria");
  return out.slice(0, 4);
}
const sortedSources = () => state.sources.slice().sort((a,b)=>(a.author||"").localeCompare(b.author||""));

function rulerHTML(){
  const L = lang().limit, T = total(), scale = Math.max(L, T) || 1;
  const mixes = [100,62,82,46,72,54];
  const segs = state.sections.map((s,i)=>{
    const c = count(s.text); if(!c) return "";
    return `<div class="seg" title="${esc(s.name)}: ${fmt(c)}" style="width:${c/scale*100}%;background:color-mix(in srgb,var(--accent) ${mixes[i%mixes.length]}%,var(--surface))"></div>`;
  }).join("");
  const step = L / 4, ticks = [];
  for(let v = 0; v <= L; v += step) ticks.push(`<span class="${v===L&&T<=L?"end":""}" style="left:${v/scale*100}%">${fmt(v)}</span>`);
  return `<div class="track" role="img" aria-label="${fmt(T)} of ${fmt(L)} ${lang().unit} used">${segs}${T>L?`<i class="limit" style="left:${L/scale*100}%"></i>`:""}</div><div class="ticks num">${ticks.join("")}</div>`;
}

    <div class="row between"><button data-act="prevSlide">Previous</button><span class="num muted" id="deck-pos">1 / ${STAGES.length}</span><button class="primary" data-act="nextSlide">Next</button></div>
    <p class="small muted">Use the left and right arrow keys, or swipe. The arguments shown are illustrations of the thinking. Your own evidence decides your answer.</p>
  </section>
  <div class="row"><button data-act="prevWalk" ${walkIdx===0?"disabled":""}>Previous essay</button><button data-act="nextWalk" ${walkIdx===W.length-1?"disabled":""}>Next essay: ${walkIdx<W.length-1?esc(W[walkIdx+1].s):""}</button></div>`;
}
function slideIndex(){ const d = $("deck"); if(!d) return 0; let best = 0, bd = Infinity; [...d.children].forEach((c,i)=>{ const x = Math.abs(c.offsetLeft - d.scrollLeft); if(x < bd){ bd = x; best = i; } }); return best; }
function goSlide(i){
  const d = $("deck"); if(!d) return; i = Math.max(0, Math.min(STAGES.length-1, i));
  d.scrollTo({left:d.children[i].offsetLeft, behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});
}
function markSlide(){
  const i = slideIndex(), p = $("deck-pos"); if(p) p.textContent = (i+1) + " / " + STAGES.length;
  const s = $("deck-steps"); if(s) [...s.children].forEach((b,j)=>{ b.style.color = j===i ? "var(--accent)" : ""; b.style.borderColor = j===i ? "var(--accent)" : ""; });
}
document.addEventListener("change", e=>{ if(e.target.id === "walk-pick"){ walkIdx = Number(e.target.value) || 0; render(); } });
document.addEventListener("keydown", e=>{
  if(tab !== "walkthroughs" || /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
  if(e.key === "ArrowRight"){ e.preventDefault(); goSlide(slideIndex()+1); }
  if(e.key === "ArrowLeft"){ e.preventDefault(); goSlide(slideIndex()-1); }
});

  if(act === "bNext" || act === "bPrev"){ bStop(); bStage = Math.max(1, Math.min(BSTAGES.length, bStage + (act === "bNext" ? 1 : -1))); render(); return; }
  if(act === "bPlay"){
    if(bTimer){ bStop(); render(); return; }
    if(bStage >= BSTAGES.length) bStage = 1;
    bTimer = setInterval(()=>{ if(tab !== "builder" || bStage >= BSTAGES.length){ bStop(); if(tab === "builder") render(); return; } bStage++; if(bStage >= BSTAGES.length) bStop(); render(); }, 3200);
    render(); return;
  }
  if(act === "pickModel"){ state.meta.model = b.dataset.k; touch(); render(); return; }
  if(act === "goSlide") return goSlide(i);
  if(act === "nextSlide") return goSlide(slideIndex()+1);
  if(act === "prevSlide") return goSlide(slideIndex()-1);
  if(act === "nextWalk" || act === "prevWalk"){ walkIdx = Math.max(0, Math.min(W.length-1, walkIdx + (act === "nextWalk" ? 1 : -1))); render(); window.scrollTo(0,0); return; }
  if(act === "copyEssay") return copy(essayMarkdown(), "Essay");
  if(act === "copyBib") return copy(sortedSources().map(bibLine).join("\n"), "Bibliography");
  if(act === "copyRefl") return copy(state.reflection, "Statement");
  if(act === "downloadEssay"){
    if(!downloads) return;
    try{ await downloads.save({filename:"extended-essay-draft.md", data:essayMarkdown() || " "}); toast("Draft downloaded."); }
    catch(err){ if(!err || err.code !== "declined") toast("The download didn't go through. Use Copy essay instead."); }
    return;
  }
  if("confirm" in b.dataset && !("armed" in b.dataset)){
    b.dataset.armed = ""; b.dataset.label = b.textContent; b.textContent = b.dataset.confirm || "Click again to remove";
    setTimeout(()=>{ if(b.isConnected){ delete b.dataset.armed; b.textContent = b.dataset.label; } }, 3000);
    return;
  }
  if(ACTIONS[act]){ ACTIONS[act](i); touch(); render(); if(act === "applyModel") toast("Draft sections set up. Open Draft to see them."); }
});
function route(){
  const h = location.hash.replace("#", "");
  tab = VIEWS[h] ? h : "plan"; bStop();
  render(); window.scrollTo(0, 0);
}
window.addEventListener("hashchange", route);

/* ---------- start ---------- */
state = loadLocal() || exampleState();
route();
connect();
</script>
