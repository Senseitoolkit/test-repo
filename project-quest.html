<title>Project Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: a trailhead. Numbered stops down one column: interests, learning skills, goals, then a web linking interests → skills → outcomes, tips, and directions. */
:root{
  --bg:#F3F5EC; --paper:#FFFFFF; --ink:#1E2640; --ink2:#586079; --line:#D9DDCC;
  --sun:#F2B01E; --path:#E6E1CB; --focus:#2F6FEB; --grow:#3E9B4F;
  --display:"Baloo 2","Trebuchet MS","Avenir Next",system-ui,sans-serif;
  --body:"Lexend","Avenir Next","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141925; --paper:#1E2535; --ink:#EEF1F7; --ink2:#A6AEC2; --line:#323B52;
  --sun:#F6C445; --path:#2B3348; --focus:#7FA8FF; --grow:#6CC27A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141925; --paper:#1E2535; --ink:#EEF1F7; --ink2:#A6AEC2; --line:#323B52;
  --sun:#F6C445; --path:#2B3348; --focus:#7FA8FF; --grow:#6CC27A; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:clamp(32px,6.5vw,50px);font-weight:800}
h2{font-size:clamp(24px,4vw,30px);font-weight:800}
h3{font-size:21px;font-weight:700}
p,ol,ul{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
svg.i{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

main{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 72px;display:flex;flex-direction:column;gap:44px}
.top{display:flex;flex-direction:column;gap:10px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:20px}
.brand .mark{width:34px;height:34px;border-radius:50%;background:var(--sun);display:grid;place-items:center;color:#1E2640}
.brand .mark svg{width:20px;height:20px}
.lead{color:var(--ink2);font-size:18px;max-width:60ch}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.note{font-size:14px;color:var(--ink2)}
.say{border:2px solid var(--line);background:var(--paper);border-radius:50%;width:42px;height:42px;display:inline-grid;place-items:center;color:var(--ink2);flex:none}
.say svg.i{width:20px;height:20px}
.btn{border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:15px}

.stop{display:flex;flex-direction:column;gap:16px}
.stop-h{display:flex;gap:14px;align-items:center}
.stop-h>div{flex:1;min-width:0}
.stop-n{width:48px;height:48px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:24px;flex:none}
.stop-h p{color:var(--ink2);font-size:15px}

/* Interest tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.tile{position:relative;border:3px solid var(--line);background:var(--paper);border-radius:22px;padding:16px 10px 14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-height:148px}
.tile .ic{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,var(--paper));color:var(--c)}
.tile .ic svg.i{width:34px;height:34px}
.tile b{font-family:var(--display);font-size:20px;line-height:1.1}
.tile small{color:var(--ink2);font-size:13px;line-height:1.3}
.tile[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--paper))}
.chk{position:absolute;top:8px;right:8px;width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;display:none;place-items:center}
.chk svg.i{width:16px;height:16px;stroke-width:3}
[aria-pressed="true"]>.chk{display:grid}

/* ATL skill cards */
.atl{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.skill{border:3px solid var(--line);background:var(--paper);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px}
.skill.good{border-color:var(--c)}
.skill.work{border-color:var(--grow);border-style:dashed}
.skill .sh{display:flex;gap:10px;align-items:center}
.skill .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,var(--paper));color:var(--c);flex:none}
.skill b{font-family:var(--display);font-size:19px;line-height:1.1}
.skill p{font-size:14px;color:var(--ink2);line-height:1.35;flex:1}
.pick2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pick2 button{border:2px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 4px;font-size:13px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;line-height:1.15}
.pick2 button svg.i{width:20px;height:20px}
.pick2 button.g[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.pick2 button.w[aria-pressed="true"]{background:var(--grow);border-color:var(--grow);color:#fff}

/* Goal signposts */
.posts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:820px){.posts{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:420px){.posts{grid-template-columns:1fr}}
.post{position:relative;text-align:left;border:3px solid var(--line);background:var(--paper);padding:16px 30px 16px 16px;display:flex;flex-direction:column;gap:6px;min-height:120px;
  border-radius:18px;clip-path:polygon(0 0,calc(100% - 22px) 0,100% 50%,calc(100% - 22px) 100%,0 100%)}
.post .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,var(--paper));color:var(--c)}
.post b{font-family:var(--display);font-size:21px;line-height:1.1}
.post small{color:var(--ink2);font-size:14px;line-height:1.3}
.post[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 16%,var(--paper));border-color:var(--c)}
.post .chk{right:30px}

/* The web */
.webbox{background:var(--paper);border:2px solid var(--line);border-radius:26px;padding:12px 8px 8px;display:flex;flex-direction:column;gap:8px}
.webscroll{overflow-x:auto}
svg.web{display:block;width:100%;min-width:620px;height:auto}
.web .col{font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:.08em;fill:var(--ink2)}
.web .lab{font-family:var(--display);font-weight:700;font-size:17px;fill:var(--ink)}
.web .sub{font-size:12px;fill:var(--ink2);font-family:var(--body)}
.web .edge{fill:none;stroke-width:3;opacity:.45;transition:opacity .2s,stroke-width .2s}
.web .edge.hi{opacity:1;stroke-width:5}
.web .edge.dim{opacity:.08}
.web .node{cursor:pointer;transition:opacity .2s}
.web .node.dim{opacity:.25}
.web .node:focus{outline:none}
.web .node:focus-visible .ring{stroke:var(--focus);stroke-width:4}
.web .disc{fill:var(--paper)}
.web .sel .halo{opacity:1}
.web .halo{opacity:0}
.legend{display:flex;gap:16px;flex-wrap:wrap;padding:4px 12px 8px;font-size:13px;color:var(--ink2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:16px;height:16px;border-radius:50%;display:inline-block}
.detail{border-top:2px solid var(--line);padding:14px 12px 6px;display:flex;flex-direction:column;gap:10px}
.detail .dh{display:flex;gap:12px;align-items:center}
.detail .dh .ic{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,var(--paper));color:var(--c);flex:none}
.detail .dh>div{flex:1;min-width:0}
.flag{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:10px 12px;font-size:15px}
.flag svg.i{width:22px;height:22px;margin-top:1px}
.flag.good{background:color-mix(in srgb,var(--sun) 22%,var(--paper))}
.flag.work{background:color-mix(in srgb,var(--grow) 15%,var(--paper))}
.flag.work svg.i{color:var(--grow)}

/* Tips */
.tipcols{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media (max-width:760px){.tipcols{grid-template-columns:1fr}}
.tcol{display:flex;flex-direction:column;gap:12px;min-width:0}
.tcol>h3{display:flex;gap:10px;align-items:center}
.tcol>h3 .b{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex:none}
.tcard{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px}
.tcard.good{border-color:color-mix(in srgb,var(--c) 60%,var(--line))}
.tcard.work{border:2px dashed var(--grow)}
.tcard .th{display:flex;gap:10px;align-items:center}
.tcard .th .ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,var(--paper));color:var(--c);flex:none}
.tcard .th>div{flex:1;min-width:0}
.tlist{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.tlist li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.tlist li svg.i{width:20px;height:20px;color:var(--c);margin-top:2px}
.fits{display:flex;flex-direction:column;gap:6px;background:var(--bg);border-radius:14px;padding:10px 12px;font-size:15px}
.fits b{font-weight:600}

/* Directions */
.switch{display:flex;gap:8px;flex-wrap:wrap}
.switch button{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 16px 5px 5px;font-weight:600;min-height:48px}
.switch .mini{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,var(--paper));color:var(--c)}
.switch .mini svg.i{width:20px;height:20px}
.switch button[aria-current="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--paper))}
.start{display:flex;gap:16px;align-items:center;background:var(--sun);color:#1E2640;border-radius:24px;padding:18px 20px}
.start .ic{width:56px;height:56px;border-radius:50%;background:#1E2640;color:var(--sun);display:grid;place-items:center;flex:none}
.start .k{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.start p.big{font-family:var(--display);font-size:clamp(20px,3.4vw,26px);font-weight:700;line-height:1.2}
.start .say{border-color:#1E2640;background:transparent;color:#1E2640}
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
@media (max-width:760px){.board{grid-template-columns:1fr}}
.dir{background:var(--paper);border:2px solid var(--line);border-radius:24px;overflow:hidden;min-width:0}
.dir-h{display:flex;align-items:center;gap:12px;padding:14px 16px;background:color-mix(in srgb,var(--c) 16%,var(--paper));border-bottom:2px solid color-mix(in srgb,var(--c) 40%,var(--line))}
.dir-h .ic{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--paper);color:var(--c)}
.dir-h div{flex:1;min-width:0}
.dir-h small{display:block;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.dir-b{padding:16px;display:flex;flex-direction:column;gap:14px}
.lbl{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.steps{list-style:none;padding:0;display:flex;flex-direction:column;position:relative}
.steps li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;padding-bottom:14px;position:relative}
.steps li:not(:last-child)::before{content:"";position:absolute;left:18px;top:40px;bottom:2px;width:4px;border-radius:4px;background:repeating-linear-gradient(to bottom,var(--path) 0 8px,transparent 8px 13px)}
.steps .n{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:19px;border:3px solid var(--c);color:var(--ink);background:var(--paper)}
.steps li:first-child .n{background:var(--c);color:#fff}
.steps b{display:block;font-family:var(--display);font-size:18px;line-height:1.2;padding-top:7px}
.steps span{color:var(--ink2);font-size:15px}
.qs{list-style:none;padding:0;display:flex;flex-direction:column;gap:8px}
.qs li{background:var(--bg);border-radius:14px;padding:10px 14px;font-weight:500;display:flex;gap:10px;align-items:start}
.qs li svg.i{width:20px;height:20px;color:var(--c);margin-top:2px}
.ways{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:440px){.ways{grid-template-columns:1fr}}
.way{border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.way .wh{display:flex;align-items:center;gap:8px;font-family:var(--display);font-weight:700;font-size:18px}
.way .wh svg.i{width:22px;height:22px;color:var(--c)}
.way p{font-size:15px}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border-radius:999px;padding:5px 12px;font-size:14px;font-weight:500;background:color-mix(in srgb,var(--c) 14%,var(--paper));border:1px solid color-mix(in srgb,var(--c) 35%,var(--line));display:inline-flex;gap:4px;align-items:center}
.pill.fit{background:var(--sun);color:#1E2640;border-color:var(--sun);font-weight:600}
.pill svg.i{width:15px;height:15px}
.ideas{list-style:none;padding:0;display:grid;gap:8px}
.ideas li{display:flex;gap:10px;align-items:center;border:2px dashed color-mix(in srgb,var(--c) 45%,var(--line));border-radius:14px;padding:10px 12px;font-weight:500}
.ideas li svg.i{width:20px;height:20px;color:var(--c)}
.tip{font-size:14px;color:var(--ink2);border-left:4px solid var(--c);padding-left:10px}
.empty{border:2px dashed var(--line);border-radius:22px;padding:24px 20px;color:var(--ink2);text-align:center;font-size:17px}
.mixbox{background:var(--paper);border:2px solid var(--line);border-radius:24px;padding:18px;display:flex;flex-direction:column;gap:12px}
@media (prefers-reduced-motion:reduce){.web .edge,.web .node{transition:none}}

/* App shell: one step per page */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:2px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.bar-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .brand{border:0;background:none;padding:4px;font-size:20px}
.track{display:flex;gap:4px;margin-left:auto;overflow-x:auto}
.track button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 6px;border-radius:12px;min-width:56px;color:var(--ink2);font-size:12px;font-weight:600}
.track .tn{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-family:var(--display);font-weight:800;font-size:15px;background:var(--bg)}
.track .tn svg.i{width:16px;height:16px;stroke-width:3}
.track button.past .tn{background:var(--grow);border-color:var(--grow);color:#fff}
.track button[aria-current="step"]{color:var(--ink)}
.track button[aria-current="step"] .tn{background:var(--ink);border-color:var(--ink);color:var(--bg)}
@media (max-width:720px){.bar .bt{display:none}.track{margin-left:0;flex:1;justify-content:space-between}.track button{min-width:0;flex:1;padding:4px 2px}}
@media (max-width:420px){.track .tl{display:none}}
main.page{gap:22px;padding-block:22px 130px;min-height:60vh}
.stop-h h1{font-size:clamp(28px,5.4vw,40px)}
.stop-h .lead{font-size:16px}
.guide{display:flex;gap:12px;align-items:center;background:color-mix(in srgb,var(--sun) 20%,var(--paper));border:2px solid color-mix(in srgb,var(--sun) 60%,var(--line));border-radius:20px;padding:12px 14px}
.guide .gic{width:44px;height:44px;border-radius:50%;background:var(--sun);color:#1E2640;display:grid;place-items:center;flex:none}
.guide p{flex:1;min-width:0;font-size:16px}
.guide p b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
@media (prefers-reduced-motion:no-preference){.guide.nudge{animation:nudge .5s}@keyframes nudge{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--paper);border-top:2px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(10px + env(safe-area-inset-bottom,0px))}
.foot-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.count{font-size:14px;color:var(--ink2);font-weight:600}
@media (max-width:420px){.count{display:none}}
.btn.big{min-height:54px;padding:10px 20px;font-size:17px;border-radius:16px}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#1E2640}
.btn.ghost{background:none;border-color:transparent;color:var(--ink2)}
.btn[aria-disabled="true"]{background:var(--path);border-color:var(--path);color:var(--ink2)}
.empty .btn{margin-top:12px}
.empty{display:flex;flex-direction:column;align-items:center}
.welcome{display:flex;flex-direction:column;gap:22px;padding-top:12px}
.kicker{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
h1.big{font-size:clamp(36px,7vw,58px)}
.how{list-style:none;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:720px){.how{grid-template-columns:repeat(2,minmax(0,1fr))}}
.how li{position:relative;background:var(--paper);border:2px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.how .hn{position:absolute;top:12px;right:14px;font-family:var(--display);font-weight:800;font-size:22px;color:var(--ink2)}
.how .hic{width:48px;height:48px;border-radius:14px;background:var(--path);display:grid;place-items:center}
.how b{font-family:var(--display);font-size:19px;line-height:1.15}
.sofar{background:var(--paper);border:2px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.chiprow{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 14px 4px 4px;font-weight:600;font-size:15px}
.chip .mini{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 20%,var(--paper));color:var(--c)}
.chip .mini svg.i{width:17px;height:17px}
.skill .sh .say{margin-left:auto;width:36px;height:36px}
.gtabs{display:flex;gap:8px;flex-wrap:wrap}
.gtabs button{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--paper);border-radius:14px;padding:8px 14px;font-weight:600;min-height:48px}
.gtabs button svg.i{color:var(--c);width:22px;height:22px}
.gtabs button[aria-selected="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 16%,var(--paper))}

/* Full screen */
.fsbtn{border:2px solid var(--line);background:var(--bg);border-radius:12px;display:inline-flex;align-items:center;gap:6px;padding:6px 10px;font-size:13px;font-weight:600;min-height:40px;flex:none}
.fsbtn svg.i{width:20px;height:20px}
@media (max-width:720px){.fsbtn span{display:none}}
:fullscreen body{overflow-y:auto}
.flash{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:20;max-width:calc(100% - 32px);text-align:center}
.stack{display:flex;flex-direction:column;gap:12px}
/* Action plan */

/* ---------- The web ---------- */
function webModel(){
  const ints=S.picks.map(byId);
  const outs=[...new Set(ints.flatMap(i=>i.out))];
  const intSkills=i=>[...new Set(i.out.flatMap(o=>OUTCOMES[o].atl))];
  const edges=[];
  ints.forEach(i=>intSkills(i).forEach(s=>edges.push({a:'i:'+i.id,b:'s:'+s,c:i.c})));
  outs.forEach(o=>OUTCOMES[o].atl.forEach(s=>edges.push({a:'s:'+s,b:'o:'+o,c:atl(s).c})));
  return {ints,outs,edges,intSkills};
}
function highlight(m,f){
  if(!f)return null;
  const N=new Set([f]),E=new Set();
  const [t,id]=f.split(':');
  const key=e=>e.a+'>'+e.b;
  if(t==='i'){const i=byId(id);if(!i)return null;
    m.edges.forEach(e=>{if(e.a===f){E.add(key(e));N.add(e.b)}});
    m.edges.forEach(e=>{const o=e.b.slice(2);if(e.b.startsWith('o:')&&i.out.includes(o)&&N.has(e.a)){E.add(key(e));N.add(e.b)}});
  } else if(t==='s'){
    m.edges.forEach(e=>{if(e.a===f||e.b===f){E.add(key(e));N.add(e.a);N.add(e.b)}});
  } else {
    const o=OUTCOMES[id];if(!o)return null;
    m.edges.forEach(e=>{if(e.b===f){E.add(key(e));N.add(e.a)}});
    m.edges.forEach(e=>{if(e.a.startsWith('i:')&&byId(e.a.slice(2)).out.includes(id)&&o.atl.includes(e.b.slice(2))){E.add(key(e));N.add(e.a)}});
  }
  return {N,E};
}
function web(){
  const m=webModel();
  if(!m.ints.length)return `<div class="empty">Pick interests in step 1 to grow your web.</div>`;
  const W=800, gap=92, H=Math.max(m.ints.length,m.outs.length,5)*gap+56;
  const X={i:190,s:410,o:600};
  const ys=(n,k)=>56+(H-56)/n*(k+.5);
  const pos={};
  m.ints.forEach((x,k)=>pos['i:'+x.id]=[X.i,ys(m.ints.length,k)]);
  ATL.forEach((x,k)=>pos['s:'+x.id]=[X.s,ys(5,k)-10]);
  m.outs.forEach((x,k)=>pos['o:'+x]=[X.o,ys(m.outs.length,k)]);
  if(S.focus&&!pos[S.focus])S.focus=null;
  const hi=highlight(m,S.focus);
  const R=26;
  const edgeSvg=m.edges.map(e=>{const [x1,y1]=pos[e.a],[x2,y2]=pos[e.b];const mx=(x1+x2)/2;
    const k=e.a+'>'+e.b, cls=hi?(hi.E.has(k)?'hi':'dim'):'';
    const sx=x1+R, ex=x2-R;
    return `<path class="edge ${cls}" stroke="${e.c}" d="M${sx} ${y1}C${mx} ${y1},${mx} ${y2},${ex} ${y2}"/>`}).join('');
  const node=(id,x,y,color,icon,label,sub,side,extra='')=>{
    const dim=hi&&!hi.N.has(id)?'dim':'', sel=S.focus===id?'sel':'';
    const tx=side==='l'?x-R-10:side==='r'?x+R+10:x, anchor=side==='l'?'end':side==='r'?'start':'middle', ty=side==='b'?y+R+20:y+5;
    return `<g class="node ${dim} ${sel}" data-act="focus" data-arg="${id}" tabindex="0" role="button" aria-label="${esc(label)}">
      <circle class="halo" cx="${x}" cy="${y}" r="${R+8}" fill="${color}" fill-opacity=".22"/>
      ${extra}
      <g transform="translate(${x-13} ${y-13}) scale(1.08)" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="ico">${P[icon]}</g>
      <text class="lab" x="${tx}" y="${ty}" text-anchor="${anchor}">${esc(label)}</text>
      ${sub?`<text class="sub" x="${tx}" y="${ty+16}" text-anchor="${anchor}">${esc(sub)}</text>`:''}
    </g>`;};
  const disc=(x,y,color,mode)=>{
    if(mode==='good')return `<circle class="ring" cx="${x}" cy="${y}" r="${R}" fill="${color}" stroke="${color}" stroke-width="3"/>`;
    if(mode==='work')return `<circle class="ring disc" cx="${x}" cy="${y}" r="${R}" stroke="var(--grow)" stroke-width="3" stroke-dasharray="6 5"/>`;
    return `<circle class="ring disc" cx="${x}" cy="${y}" r="${R}" stroke="${color}" stroke-width="3"/>`;};
  const badge=(x,y,kind)=>kind?`<circle cx="${x+R-4}" cy="${y-R+4}" r="11" fill="${kind==='good'?'var(--sun)':'var(--grow)'}"/><g transform="translate(${x+R-12} ${y-R-4}) scale(.68)" fill="none" stroke="#1E2640" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">${P[kind==='good'?'star':'sprout']}</g>`:'';
  let nodes='';
  m.ints.forEach(i=>{const [x,y]=pos['i:'+i.id];nodes+=node('i:'+i.id,x,y,i.c,i.id,i.label,'',  'l',disc(x,y,i.c))});
  ATL.forEach(a=>{const [x,y]=pos['s:'+a.id];const mode=S.good.includes(a.id)?'good':S.work.includes(a.id)?'work':'';
    nodes+=node('s:'+a.id,x,y,mode==='good'?'#FFFFFF':a.c,a.icon,a.label,mode==='good'?'I am good at this':mode==='work'?'I am working on this':'','b',disc(x,y,a.c,mode)+badge(x,y,mode))});
  m.outs.forEach(o=>{const [x,y]=pos['o:'+o];const O=OUTCOMES[o];const fit=O.atl.some(s=>S.good.includes(s)),grow=O.atl.some(s=>S.work.includes(s));
    nodes+=node('o:'+o,x,y,'#6A62DC',O.icon,O.label,fit&&grow?'Strength + growing':fit?'Uses your strength':grow?'Helps you grow':'', 'r',disc(x,y,'#6A62DC')+badge(x,y,fit?'good':grow?'work':''))});
  return `<div class="webbox">
    <div class="webscroll"><svg class="web" viewBox="0 0 ${W} ${H}" role="group" aria-label="Web linking your interests to skills and outcomes">
      <text class="col" x="${X.i}" y="24" text-anchor="middle">MY INTERESTS</text>
      <text class="col" x="${X.s}" y="24" text-anchor="middle">MY SKILLS</text>
      <text class="col" x="${X.o+40}" y="24" text-anchor="middle">WHAT I COULD DO</text>
      ${edgeSvg}${nodes}
    </svg></div>
    <div class="legend"><span><i class="lg" style="background:var(--sun)"></i>Good at</span><span><i class="lg" style="border:2px dashed var(--grow)"></i>Working on</span><span>Tap any circle to follow its paths.</span></div>
    ${detail(m)}
  </div>`;
}
function detail(m){
  const f=S.focus;
  if(!f)return `<div class="detail"><p class="note">Tap an interest, a skill, or an outcome to see how they join together.</p></div>`;
  const [t,id]=f.split(':');
  let head='',c='#6A62DC',icon='star',body='',read='';
  if(t==='i'){const i=byId(id);c=i.c;icon=i.id;
    const outs=i.out.filter(o=>m.outs.includes(o)).map(o=>OUTCOMES[o].label);
    head=`<small class="lbl">Interest</small><h3>${i.label}</h3>`;
    body=`<p>${i.label} can lead you to: <b>${list(outs)}</b>.</p><p class="note">It uses ${list(m.intSkills(i).map(s=>atl(s).label))} skills.</p>`;
    read=`${i.label} can lead you to ${list(outs)}.`;
  } else if(t==='s'){const a=atl(id);c=a.c;icon=a.icon;
    const ints=m.ints.filter(i=>m.intSkills(i).includes(id)).map(i=>i.label);
    const outs=m.outs.filter(o=>OUTCOMES[o].atl.includes(id)).map(o=>OUTCOMES[o].label);
    head=`<small class="lbl">Learning skill</small><h3>${a.label}</h3>`;
    body=`<p>${a.kid}</p><p>You use it in <b>${list(ints)||'none of your picks yet'}</b> to <b>${list(outs)||'…'}</b>.</p>`+
      (S.good.includes(id)?`<div class="flag good">${ic('star')}<span>${a.help}</span></div>`:'')+
      (S.work.includes(id)?`<div class="flag work">${ic('sprout')}<span>Focus tip: ${a.focus[0]}</span></div>`:'');
    read=`${a.label}. ${a.kid}`;
  } else {const o=OUTCOMES[id];icon=o.icon;
    const ints=m.ints.filter(i=>i.out.includes(id)).map(i=>i.label);
    head=`<small class="lbl">What I could do</small><h3>${o.label}</h3>`;
    body=`<p>Get here from <b>${list(ints)}</b> using <b>${list(o.atl.map(s=>atl(s).label))}</b>.</p>`+
      o.atl.filter(s=>S.good.includes(s)).map(s=>`<div class="flag good">${ic('star')}<span>Your ${atl(s).label.toLowerCase()} will help a lot here. ${atl(s).help}</span></div>`).join('')+
      o.atl.filter(s=>S.work.includes(s)).map(s=>`<div class="flag work">${ic('sprout')}<span>A great way to grow your ${atl(s).label.toLowerCase()}. ${atl(s).focus[0]}</span></div>`).join('');
    read=`${o.label}. Get here from ${list(ints)} using ${list(o.atl.map(s=>atl(s).label))}.`;
  }
  return `<div class="detail" style="--c:${c}"><div class="dh"><span class="ic">${ic(icon)}</span><div>${head}</div>${say(read)}</div>${body}</div>`;
}

function stepList(c,items){return `<ol class="steps" style="--c:${c}">${items.map((s,i)=>`<li><span class="n">${i+1}</span><div><b>${s[0]}</b>${s[1]?`<span>${s[1]}</span>`:''}</div></li>`).join('')}</ol>`}
function direction(it,g){
  let body='',read='';
  if(g.id==='find'){
    body=`<p class="lbl">Questions to wonder about</p>
      <ul class="qs" style="--c:${it.c}">${it.wonder.map(q=>`<li>${ic('wonder')}${q}</li>`).join('')}</ul>
      <p class="lbl">Ways to find out</p>
      <div class="ways" style="--c:${it.c}">${Object.keys(WAYS).map(w=>`<div class="way"><span class="wh">${ic(w)}${WAYS[w]}</span><p>${it.res[w]}</p></div>`).join('')}</div>
      <p class="tip" style="--c:${it.c}">Pick one question. Try two ways to find the answer. Tell a friend what you found.</p>`;
    read=`Find out more about ${it.label}. Questions to wonder about: ${it.wonder.join(' ')} Read: ${it.res.read} Watch: ${it.res.watch} Ask: ${it.res.ask} Try: ${it.res.tryit}`;
  } else if(g.id==='better'){
    body=stepList(it.c,it.steps.map((s,i)=>[STAGES[i],s]))+`<p class="tip" style="--c:${it.c}">Already know a step? Skip it. Find a step too easy? Make it harder.</p>`;
    read=`Get better at ${it.label}. `+it.steps.map((s,i)=>`Step ${i+1}, ${STAGES[i]}: ${s}`).join(' ');
  } else if(g.id==='make'){
    const steps=[['Pick an idea','Choose one from the list, or think of your own.'],['Draw a plan','Draw it and label the parts.'],['Collect materials',it.materials.join(', ')+'.'],['Make a first try','It does not have to be perfect.'],['Test it','Show a friend. What works? What does not?'],['Make it better, then share it','Fix one thing, then show your class.']];
    body=`<p class="lbl">You could make</p><ul class="ideas" style="--c:${it.c}">${it.ideas.map(x=>`<li>${ic('bulb')}${x}</li>`).join('')}</ul><p class="lbl">Steps to make it</p>${stepList(it.c,steps)}`;
    read=`Make something with ${it.label}. You could make: ${it.ideas.join(', ')}. `+steps.map((s,i)=>`Step ${i+1}: ${s[0]}. ${s[1]}`).join(' ');
  } else {
    const steps=[['Find your team',`Look for 2 to 4 friends who like ${it.label.toLowerCase()} too.`],['Choose one goal together','Everyone shares an idea. Pick one together.'],['Pick a job each','Every person has an important job.'],['Make a plan','What will we do? Who does it? When?'],['Work and check in','Help each other when someone is stuck.'],['Share what you made','Show your project and talk about your job.']];
    const fits=it.roles.map((r,k)=>S.good.includes(it.roleAtl[k]));
    body=`<p class="lbl">Jobs on a ${it.label.toLowerCase()} team</p>
      <div class="pills" style="--c:${it.c}">${it.roles.map((r,k)=>`<span class="pill ${fits[k]?'fit':''}">${fits[k]?ic('star'):''}${r}</span>`).join('')}</div>
      ${fits.some(Boolean)?`<p class="note">Starred jobs use your strengths.</p>`:''}
      <p class="lbl">Steps to work together</p>${stepList(it.c,steps)}
      <p class="tip" style="--c:${it.c}">Swap jobs next time so everyone tries something new.</p>`;
    read=`Work with a team on ${it.label}. Jobs: ${it.roles.join(', ')}. `+steps.map((s,i)=>`Step ${i+1}: ${s[0]}. ${s[1]}`).join(' ');
  }
  return `<article class="dir" style="--c:${g.c}"><header class="dir-h"><span class="ic">${ic(g.icon)}</span><div><small>${it.label}</small><h3>${g.label}</h3></div>${say(read)}</header><div class="dir-b">${body}</div></article>`;
}
function firstStep(it,g){
  if(g.id==='find')return `Wonder: ${it.wonder[0]} Then look for ${it.res.read.charAt(0).toLowerCase()+it.res.read.slice(1)}`;
  if(g.id==='better')return it.steps[0];
  if(g.id==='make')return `Look at the ideas for ${it.label.toLowerCase()} and pick the one you like most.`;
  return `Find 2 to 4 friends who like ${it.label.toLowerCase()} too.`;
}
function mixer(){
  const xs=S.picks.map(byId), out=[];
  for(let i=0;i<xs.length;i++)for(let j=0;j<xs.length;j++)if(i!==j)out.push([xs[i],xs[j]]);
  return `<div class="mixbox"><div class="row"><span class="dir-h" style="padding:0;border:0;background:none;--c:#6A62DC"><span class="ic" style="background:color-mix(in srgb,#6A62DC 18%,var(--paper))">${ic('mix')}</span></span><h3>Mix your interests</h3></div>
    <p class="note">When you put two interests together, you get new ideas.</p>
    <ul class="ideas">${out.slice(0,6).map(([a,b])=>`<li style="--c:${a.c}">${ic('bulb')}Make ${a.format} about ${b.topic}</li>`).join('')}</ul></div>`;
}

function actionPlan(it,g){
  const good=S.good.map(atl), work=S.work.map(atl), proj=PROJECTS.filter(p=>p.int===it.id)[0];
  const L=[];
  L.push({when:'Today',text:firstStep(it,g),icon:'arrow'});
  L.push({when:'This week',icon:'stairs',text:{
    find:`Pick a question: "${it.wonder[1]}" Find the answer two ways. Read: ${lower(it.res.read)} Then try: ${lower(it.res.tryit)}`,
    better:`${it.steps[1]} Then ${lower(it.steps[2])}`,
    make:`Choose ${noArt(it.ideas[0])} or ${noArt(it.ideas[1])}. Draw a plan and get your materials: ${list(it.materials.slice(0,3)).toLowerCase()}.`,
    team:`Find 2 to 4 friends who like ${it.label.toLowerCase()}. Share the jobs: ${list(it.roles)}.`}[g.id]});
  good.slice(0,2).forEach(a=>L.push({when:'Use your strength',kind:'good',skill:a,icon:a.icon,text:{
    find:{thinking:`Think of your own new question about ${it.topic}.`,communication:'Tell the class 3 facts you found.',social:'Find out together with a partner. Take turns asking.',self:'Make a list of your questions and tick each one off.',research:a.lead(it)},
    better:{thinking:`When "${it.steps[3]}" is tricky, find 2 new ways to try it.`,communication:'Teach a friend the step you just learned.',social:'Practice with a partner and cheer each other on.',self:`Do one step a day until you reach "${STAGES[4]}".`,research:`Watch how an expert does it: ${lower(it.res.watch)}`},
    make:{thinking:`Draw 3 different designs for ${noArt(it.ideas[0])} before you pick one.`,communication:'Explain your plan to a friend before you build.',social:'Ask a friend to help test it.',self:'Make a checklist of steps and tick them off.',research:`Look at real examples before you start: ${lower(it.res.watch)}`},
    team:{thinking:a.lead(it),communication:a.lead(it),social:a.lead(it),self:a.lead(it),research:a.lead(it)}}[g.id][a.id]}));
  work.slice(0,2).forEach(a=>L.push({when:'Grow a skill',kind:'work',skill:a,icon:'sprout',text:`${a.practice(it)} Tip: ${a.focus[0]}`}));
  L.push({when:'Big challenge',icon:'star',text:{
    find:`Ask ${lower(it.res.ask)} about "${it.wonder[2]}" Share what you learned with your class.`,
    better:it.steps[3]+' Then '+lower(it.steps[4]),
    make:`Test your ${noArt(it.ideas[0])} with a friend. Fix one thing, then show your class.`,
    team:proj?`Try the "${proj.title}" project together. Open it in Projects.`:'Make a team plan: what, who and when.'}[g.id]});
  return L;
}

const CONTENT={"toy-town": {"id": "toy-town", "intro": "Can you build a whole town with just wooden blocks? You and your team will make houses, a tall tower and a bridge for tiny toy people!", "sections": [{"h": "Why do towers fall down?", "p": "A tower falls when it is not balanced. Gravity pulls everything down toward the ground. If one side is heavier or leans out, the tower tips over. Keep the blocks straight and centered to help it stand."}, {"h": "What makes a good base?", "p": "The base is the bottom part of a building. A wide base helps a tower stay up. Many tall towers are wider at the bottom than the top. Try laying blocks flat and crossways at the bottom."}, {"h": "What makes a bridge strong?", "p": "A bridge must hold weight without bending or falling. Supports under the bridge help hold it up. A shorter gap is easier to cross than a long one. Arches and triangles are shapes that make bridges stronger."}], "facts": ["Every KAPLA block is exactly the same size and shape.", "Some stone arch bridges built in ancient Rome are still standing today."], "research": [{"how": "read", "text": "Read a book about bridges or buildings from the class library."}, {"how": "watch", "text": "Watch a short video your teacher picks about how bridges stay up."}, {"how": "ask", "text": "Ask a family member or school staff member about a tall building or bridge near you."}, {"how": "try", "text": "Build two towers, one with a wide base and one with a thin base. Gently tap the table and see which one stands longer."}], "words": [{"w": "stable", "m": "steady and not wobbly", "s": "Our tower is stable, so it does not wobble."}, {"w": "base", "m": "the bottom part that holds everything up", "s": "We made a wide base for our tower."}, {"w": "structure", "m": "something that is built, like a house or bridge", "s": "The bridge is the biggest structure in our town."}, {"w": "balance", "m": "when weight is even so nothing tips over", "s": "Put the blocks in the middle to keep the balance."}, {"w": "engineer", "m": "a person who plans and builds things that work", "s": "We are engineers when we build our town."}, {"w": "prototype", "m": "a first try that you test and make better", "s": "Our first bridge was a prototype, and then we fixed it."}], "roles": {"Town planner": {"does": "You draw a map of the town on paper. You decide where the houses, tower and bridge go. You talk with the team and change the plan when needed.", "matters": "A plan helps everyone build the same town together.", "say": "Let's put the bridge here, next to the houses.", "tip": "Draw simple shapes and add labels so everyone can read your map."}, "Builder": {"does": "You stack the blocks to make the houses and tower. You follow the map and build with care. When something falls, you fix it and try again.", "matters": "Without a builder, the plan stays on paper.", "say": "I will make the bottom wider so it stands up.", "tip": "Go slowly and place each block straight."}, "Strength tester": {"does": "You check if the tower and bridge are strong. You put toy people on the bridge and measure the tower with a ruler. You tell the team what is wobbly.", "matters": "Testing finds weak spots before visitors come.", "say": "The bridge held five toy people. Let's try one more.", "tip": "Test gently and change only one thing at a time."}, "Tour guide": {"does": "You show visitors around the town. You explain what each building is and how the team made it. You answer questions from visitors.", "matters": "The tour guide shares the team's hard work with others.", "say": "This is our tallest tower. We gave it a wide base.", "tip": "Speak clearly and point to each place as you talk."}}}, "marble-run": {"id": "marble-run", "intro": "Whoosh! Can you build a path that sends a marble twisting and turning all the way to the bottom?", "sections": [{"h": "What makes the marble roll?", "p": "Gravity is a pull that brings things down. Gravity pulls the marble down the ramp. The marble only rolls if the path goes downhill. If the path is flat, the marble slows and stops."}, {"h": "Does a steeper ramp make the marble faster?", "p": "A slope is how much a ramp tilts. A steeper ramp tilts more. On a steeper ramp, the marble usually goes faster. If it is too steep, the marble may fly off the track!"}, {"h": "How can we slow the marble down?", "p": "You can make the ramp less steep. You can add turns and zigzags. Bumpy or rough paths also slow it down. Walls on the sides keep the marble on the track."}], "facts": ["Most roller coasters are pulled up the first big hill. Then gravity does the rest!", "Long ago, a scientist named Galileo rolled balls down ramps to learn how things speed up."], "research": [{"how": "read", "text": "Read a book about gravity or ramps from the class library."}, {"how": "watch", "text": "Watch a short video your teacher picks about how roller coasters work."}, {"how": "ask", "text": "Ask your teacher or a family member what they know about ramps they use every day."}, {"how": "try", "text": "Roll a marble down a ramp held low, then high. Count or time how long each roll takes."}], "words": [{"w": "gravity", "m": "the pull that makes things fall down", "s": "Gravity pulls the marble down the tube."}, {"w": "slope", "m": "how much something tilts up or down", "s": "We made the slope steeper to go faster."}, {"w": "ramp", "m": "a flat path that is higher at one end", "s": "The marble rolls down the cardboard ramp."}, {"w": "speed", "m": "how fast something moves", "s": "The marble's speed was faster on the steep part."}, {"w": "friction", "m": "rubbing that slows things down", "s": "The rough paper made friction and slowed the marble."}, {"w": "test", "m": "to try something to see if it works", "s": "We test the run after every change."}], "roles": {"Path designer": {"does": "You plan where the marble will go. You draw the path with ramps, turns and drops. You make sure the path always goes downhill.", "matters": "A good plan stops the marble from getting stuck.", "say": "Let's add a zigzag here to slow it down.", "tip": "Draw arrows on your plan to show which way the marble rolls."}, "Builder": {"does": "You cut and tape the tubes and cardboard. You follow the path plan and hold pieces steady. When a part falls off, you tape it again.", "matters": "The builder turns the plan into a real run.", "say": "I need more tape to hold this tube still.", "tip": "Tape both sides of each tube so it does not slip."}, "Timer": {"does": "You roll the marble from the top. You time how long it takes to reach the bottom. You write down the times so the team can compare.", "matters": "Timing shows the team if a change made the marble faster or slower.", "say": "Ready, set, go! That run took longer than the last one.", "tip": "Start the marble from the same spot every time."}, "Reporter": {"does": "You explain how the run works to others. You tell about the ramps, turns and what the team changed. You share the times the team found.", "matters": "The reporter helps others learn from the team's tests.", "say": "We made this ramp steeper, and the marble went faster.", "tip": "Show the run while you talk so people can see it."}}}, "jump-game": {"id": "jump-game", "intro": "Can you make a character jump over things on a tablet? You will be a game maker using ScratchJr!", "sections": [{"h": "What is code?", "p": "Code is a set of steps that tells a computer what to do. In ScratchJr, you snap blocks together to make code. Each block is one step. The computer does the steps in order, from left to right."}, {"h": "How does the character know when to jump?", "p": "A character only does what the code tells it. A start block tells the code when to begin. For example, the code can start when you tap the character. ScratchJr also has a hop block that makes a character jump up and down."}, {"h": "What makes a game too easy or too hard?", "p": "A game is fun when it is a little tricky. If things move too slowly, the game is too easy. If things move too fast, it is too hard. You can change the speed and test it again."}], "facts": ["ScratchJr was made for young children to learn coding.", "Long ago, people found a real moth stuck inside a big computer. It was a real bug!"], "research": [{"how": "read", "text": "Read the coding cards with your team to learn what each block does."}, {"how": "watch", "text": "Watch your teacher show how to snap blocks together in ScratchJr."}, {"how": "ask", "text": "Ask an older student or your teacher what their favorite game is and why it is fun."}, {"how": "try", "text": "Make one character hop when you tap it. Then change the number on the block and test again."}], "words": [{"w": "code", "m": "steps that tell a computer what to do", "s": "We wrote code to make the cat jump."}, {"w": "sequence", "m": "the order that steps happen in", "s": "We changed the sequence so it jumps first."}, {"w": "bug", "m": "a mistake in the code", "s": "There was a bug, so the cat did not jump."}, {"w": "debug", "m": "to find and fix mistakes in code", "s": "We will debug the game until it works."}, {"w": "character", "m": "a person or animal in a game or story", "s": "Our character is a frog that jumps over logs."}, {"w": "program", "m": "a set of code that does a job", "s": "Our program makes a jumping game."}], "roles": {"Programmer": {"does": "You snap the code blocks together on the tablet. You make the character move and jump. You change the code when the team finds a problem.", "matters": "The programmer makes the game work.", "say": "I will add a hop block so the frog jumps.", "tip": "Test your code after every few blocks."}, "Artist": {"does": "You draw the character and the background. You choose colors and shapes that are easy to see. You can also draw the things to jump over.", "matters": "The art makes the game fun to look at.", "say": "I drew a pond background for our frog.", "tip": "Make your character big and clear on the screen."}, "Bug finder": {"does": "You play the game again and again. You look for things that do not work. You tell the team what you found in a kind way.", "matters": "Finding bugs makes the game better for players.", "say": "The frog does not jump when I tap it. Let's check the code.", "tip": "Write down each bug so nobody forgets it."}, "Instruction writer": {"does": "You write how to play the game. You use short steps that new players can follow. You check that the steps match the game.", "matters": "Good instructions help other people play your game.", "say": "Step one: tap the frog to make it jump.", "tip": "Ask a friend to read your steps and try the game."}}}, "animated-story": {"id": "animated-story", "intro": "Have you ever wondered how cartoons move? You will make your own moving story with ScratchJr!", "sections": [{"h": "How do cartoons make things look like they move?", "p": "A cartoon is made of many pictures. Each picture is a little different from the last one. When the pictures change fast, your eyes see movement. This is called animation."}, {"h": "What makes a good story?", "p": "A good story has a beginning, a middle and an end. The beginning shows who is in the story. In the middle, something happens or there is a problem. At the end, the problem is solved."}, {"h": "Why does timing matter?", "p": "Timing is when things happen and for how long. If characters move too fast, people miss what happens. A wait block can make a character pause. Good timing helps people follow your story."}], "facts": ["Movies show about 24 pictures every second to make things look like they move.", "Flipbooks are little books that make pictures move. People have made them for over 100 years."], "research": [{"how": "read", "text": "Read a picture book from the class library and find its beginning, middle and end."}, {"how": "watch", "text": "Watch a short cartoon your teacher picks and notice when characters move and stop."}, {"how": "ask", "text": "Ask your teacher or a family member about a favorite cartoon from when they were young."}, {"how": "try", "text": "Make a tiny flipbook with sticky notes. Draw a ball a little higher on each page and flip it."}], "words": [{"w": "animation", "m": "pictures that look like they move", "s": "Our animation shows a dog running home."}, {"w": "storyboard", "m": "drawings that show the story in order", "s": "We drew a storyboard before we coded."}, {"w": "scene", "m": "one part of a story in one place", "s": "The first scene is in the park."}, {"w": "sequence", "m": "the order that things happen in", "s": "The sequence is wake up, eat, then play."}, {"w": "timing", "m": "when something happens and how long it lasts", "s": "We fixed the timing so the cat waits."}, {"w": "dialogue", "m": "the words characters say", "s": "The voice actor recorded the dialogue."}], "roles": {"Story writer": {"does": "You plan the beginning, middle and end of the story. You draw the storyboard so the team knows what happens. You choose the characters and the places.", "matters": "The story gives the whole team something to make.", "say": "In the middle, the dog gets lost.", "tip": "Keep the story short with just a few scenes."}, "Animator": {"does": "You code the characters to move on the tablet. You follow the storyboard scene by scene. You add wait blocks so the timing feels right.", "matters": "The animator makes the story come alive.", "say": "I added a wait block so the dog stops to look.", "tip": "Play each scene after you code it."}, "Voice actor": {"does": "You record the voices for the characters. You speak with feeling so people know how characters feel. You can try a different voice for each character.", "matters": "Voices help people understand the story.", "say": "Can I try that line again in a happy voice?", "tip": "Speak slowly and close to the tablet when you record."}, "Checker": {"does": "You watch the story from start to end. You look for mistakes in movement, timing or sound. You share what you found kindly with the team.", "matters": "Checking makes sure the story makes sense to others.", "say": "The dog talks before it comes on the screen. Let's fix that.", "tip": "Watch the story more than one time."}}}, "recycled-band": {"id": "recycled-band", "intro": "Can a box and a rubber band make music? You will turn recycled things into instruments and play a song as a band!", "sections": [{"h": "How do instruments make sound?", "p": "Sound happens when something vibrates. To vibrate means to move back and forth very fast. When you pluck a rubber band, it vibrates. The moving band shakes the air, and the sound reaches your ears."}, {"h": "Why does a tight rubber band sound higher?", "p": "Pitch is how high or low a sound is. A tight band vibrates faster than a loose one. Faster vibrations make a higher pitch. Thin bands also sound higher than thick bands."}, {"h": "How does a band play together?", "p": "A beat is the steady pulse in music, like a clock ticking. Everyone in the band follows the same beat. Players watch and listen to each other. They start and stop at the same time."}], "facts": ["A guitar works a bit like a rubber band box. Thinner strings make higher notes.", "Sound cannot travel in outer space, because there is no air to carry it."], "research": [{"how": "read", "text": "Read a book about musical instruments from the class library."}, {"how": "watch", "text": "Watch a short video your teacher picks about how string or drum instruments make sound."}, {"how": "ask", "text": "Ask the music teacher how a real instrument makes high and low sounds."}, {"how": "try", "text": "Fill one bottle with rice and one with beans. Shake both and listen for the difference."}], "words": [{"w": "vibrate", "m": "to move back and forth very fast", "s": "The rubber band vibrates when I pluck it."}, {"w": "pitch", "m": "how high or low a sound is", "s": "The tight band has a higher pitch."}, {"w": "beat", "m": "the steady pulse in music", "s": "We all shake our bottles on the beat."}, {"w": "rhythm", "m": "a pattern of long and short sounds", "s": "Our drum plays a fast rhythm."}, {"w": "recycle", "m": "to use old things again in a new way", "s": "We recycle boxes to make guitars."}, {"w": "instrument", "m": "something you use to make music", "s": "Our shaker is an instrument made from a bottle."}], "roles": {"Instrument maker": {"does": "You design and build new instruments from recycled things. You can make shakers, drums or rubber band guitars. You fix instruments when they break.", "matters": "The band needs instruments before it can play.", "say": "I will stretch this band tighter for a higher sound.", "tip": "Tape parts tightly so nothing spills or falls off."}, "Player": {"does": "You practice the song on your instrument. You listen to the beat and play along. You try loud, soft, high and low sounds.", "matters": "Players make the music people hear.", "say": "Let's play that part again, a little softer.", "tip": "Listen to the others while you play."}, "Band buddy": {"does": "You help everyone start and stop together. You count in the band with a clear signal. You watch the team and keep everyone together.", "matters": "Starting and stopping together makes the song sound neat.", "say": "One, two, ready, play!", "tip": "Use the same hand signal every time."}, "Sound checker": {"does": "You test which instruments sound best. You listen for sounds that are too quiet or too loud. You suggest small changes to make each sound clearer.", "matters": "Good sounds make the whole band sound better.", "say": "The bean shaker is louder than the rice one.", "tip": "Listen to one instrument at a time."}}}, "class-song": {"id": "class-song", "intro": "What if your class had its very own song? You will write words, find a beat and sing it together!", "sections": [{"h": "What makes a song easy to remember?", "p": "Songs with parts that repeat are easier to remember. The chorus is a part you sing again and again. Rhyming words also help you remember what comes next. A short, simple tune helps too."}, {"h": "What is rhyming?", "p": "Words rhyme when their endings sound the same. Cat and hat rhyme. Class and grass rhyme. Songwriters often put rhyming words at the end of lines."}, {"h": "What is a beat?", "p": "A beat is the steady pulse you feel in music. You can clap or tap your foot to it. A drum can keep the beat for the singers. When everyone follows the beat, the song sounds together."}], "facts": ["The ABC song uses the same tune as Twinkle, Twinkle, Little Star.", "People all over the world, in every culture, make music and sing songs."], "research": [{"how": "read", "text": "Read a book of songs or rhyming poems from the class library."}, {"how": "watch", "text": "Watch a short video your teacher picks of children singing together."}, {"how": "ask", "text": "Ask the music teacher how songwriters choose words for a song."}, {"how": "try", "text": "Clap along to a song you know. Then try to clap the same beat on a drum."}], "words": [{"w": "rhyme", "m": "words with endings that sound the same", "s": "Class and grass rhyme in our song."}, {"w": "beat", "m": "the steady pulse in music", "s": "We clap on the beat."}, {"w": "rhythm", "m": "a pattern of long and short sounds", "s": "The words have a bouncy rhythm."}, {"w": "chorus", "m": "the part of a song you sing again and again", "s": "Everyone sings the chorus together."}, {"w": "verse", "m": "a part of a song with new words", "s": "Our second verse is about recess."}, {"w": "lyrics", "m": "the words of a song", "s": "We wrote the lyrics about our class."}], "roles": {"Songwriter": {"does": "You think of words and rhymes for the song. You ask the class what to sing about. You put the words in order to make verses and a chorus.", "matters": "A song needs words before anyone can sing it.", "say": "What rhymes with friends? Maybe never ends!", "tip": "Say the words out loud to hear if they fit the beat."}, "Singer": {"does": "You sing the song clearly so everyone can hear the words. You practice with the beat keeper. You help the class sing along.", "matters": "Singers bring the words to life.", "say": "Let's sing the chorus one more time.", "tip": "Stand tall and take a big breath before you sing."}, "Beat keeper": {"does": "You keep a steady beat on a drum or shaker. You start the beat so the singers know when to begin. You keep the beat the same speed the whole time.", "matters": "A steady beat helps everyone sing together.", "say": "Listen for my drum. Ready, one, two, three, four.", "tip": "Count quietly in your head to keep the beat steady."}, "Practice buddy": {"does": "You help everyone learn the words. You say a line, and the class repeats it. You can use the voice recorder so the team can listen back.", "matters": "Practice helps the whole class feel ready.", "say": "Let's learn one line at a time. Say it with me.", "tip": "Be patient and cheer when someone gets it right."}}}, "puppet-show": {"id": "puppet-show", "intro": "A sock can become a silly dragon or a brave hero! You will make puppets and a stage, then put on a show.", "sections": [{"h": "What is a puppet?", "p": "A puppet is a doll or object that a person moves. Some puppets fit on your hand, like a sock puppet. Some puppets use sticks or strings. The person who moves a puppet is called a puppeteer."}, {"h": "How can a puppet show it is sad without a face moving?", "p": "A puppet can show feelings with its body. It can hang its head down low to look sad. It can move slowly and quietly. Your voice can sound soft and sad too."}, {"h": "What makes a good puppet show?", "p": "A good show has a clear story with a beginning, middle and end. The audience must hear and see the puppets. Puppeteers speak loudly and face the audience. Practice helps the show go smoothly."}], "facts": ["People have made and used puppets for thousands of years.", "Shadow puppets are an old kind of puppet show in places like Indonesia and China."], "research": [{"how": "read", "text": "Read a book about puppets or a short play from the class library."}, {"how": "watch", "text": "Watch a short puppet show video your teacher picks."}, {"how": "ask", "text": "Ask a family member if they ever made a puppet or saw a puppet show."}, {"how": "try", "text": "Put a sock on your hand. Make it look happy, then sad, using only movement."}], "words": [{"w": "puppet", "m": "a doll or object that a person moves", "s": "My puppet is a sock with button eyes."}, {"w": "puppeteer", "m": "a person who moves a puppet", "s": "The puppeteer makes the dragon dance."}, {"w": "script", "m": "the written words for a show", "s": "We read the script before we practice."}, {"w": "audience", "m": "the people who watch a show", "s": "The audience clapped at the end."}, {"w": "expression", "m": "a way to show a feeling", "s": "Her voice had a happy expression."}, {"w": "rehearse", "m": "to practice a show", "s": "We rehearse the show three times."}], "roles": {"Puppeteer": {"does": "You move the puppet and do its voice. You show feelings with the puppet's body and your voice. You practice so you know when to speak.", "matters": "The puppeteer makes the puppet seem alive.", "say": "I will make my puppet jump when it is happy.", "tip": "Keep the puppet up where the audience can see it."}, "Script writer": {"does": "You write what the puppets say. You plan the beginning, middle and end. You keep the lines short so they are easy to say.", "matters": "A script helps everyone know what happens next.", "say": "Then the dragon says, Can I be your friend?", "tip": "Read your lines out loud to check they sound right."}, "Puppet maker": {"does": "You make the puppets from socks, bags, fabric and markers. You ask the team what each character looks like. You make sure each puppet is easy to move.", "matters": "The show needs puppets for every character.", "say": "Should the dragon have green or purple spikes?", "tip": "Let the glue dry before anyone uses the puppet."}, "Stage buddy": {"does": "You help everyone get ready on time. You set up the box stage and have the puppets ready. You tell the team when it is their turn.", "matters": "A ready team makes the show run smoothly.", "say": "Two minutes until the show. Puppets ready?", "tip": "Make a short list of what the team needs before the show."}}}, "mini-musical": {"id": "mini-musical", "intro": "Lights, music, action! You will act out a short story with songs, costumes and props.", "sections": [{"h": "What is a musical?", "p": "A musical is a show that tells a story with acting and songs. Actors speak some parts and sing other parts. Songs often show how a character feels. Costumes and props help the audience imagine the story."}, {"h": "How do actors remember their lines?", "p": "Actors practice their lines many times. They learn a few lines at a time. They listen for the line before theirs, called a cue. Moving while they speak helps them remember too."}, {"h": "Why do costumes and props matter?", "p": "A costume is what an actor wears to look like a character. A prop is an object an actor uses, like a crown or a basket. They help the audience know who is who. They do not need to be fancy to work well."}], "facts": ["Stage left means the actor's left side when facing the audience.", "People in theater say break a leg to wish each other good luck."], "research": [{"how": "read", "text": "Read a short play or a picture book you could act out from the class library."}, {"how": "watch", "text": "Watch a short video your teacher picks of children performing a show."}, {"how": "ask", "text": "Ask your teacher or a family member if they have been in a show and how they practiced."}, {"how": "try", "text": "Pick two lines from a story. Say them five times while doing an action, then try without looking."}], "words": [{"w": "musical", "m": "a show that tells a story with songs", "s": "Our musical is about a lost puppy."}, {"w": "rehearsal", "m": "a practice of a show", "s": "We had a rehearsal after lunch."}, {"w": "costume", "m": "clothes you wear to look like a character", "s": "My costume has a paper crown."}, {"w": "prop", "m": "an object actors use in a show", "s": "The basket is a prop for the farmer."}, {"w": "cue", "m": "a signal that tells you it is your turn", "s": "My cue is when the bell rings."}, {"w": "character", "m": "a person or animal in a story", "s": "I play the brave character in our show."}], "roles": {"Actor": {"does": "You play a character in the story. You learn your lines and songs. You use your voice, face and body to show how your character feels.", "matters": "Actors tell the story to the audience.", "say": "Can we practice my song part again?", "tip": "Face the audience and speak in a big, clear voice."}, "Costume designer": {"does": "You plan the costumes for each character. You draw ideas and choose simple clothes or paper pieces. You make sure actors can move easily in them.", "matters": "Costumes help the audience know who each character is.", "say": "The king could wear a cape and a paper crown.", "tip": "Keep costumes simple so they are quick to put on."}, "Props maker": {"does": "You make the props from cardboard and other things. You read the script to find what objects are needed. You keep the props safe and ready for the show.", "matters": "Props help the story feel real.", "say": "The script says we need a magic key. I will make one.", "tip": "Make props light and with no sharp edges."}, "Rehearsal buddy": {"does": "You help everyone practice and take turns. You read the cue lines and give gentle reminders. You keep track of which part the team practices next.", "matters": "Good practice helps everyone feel ready and proud.", "say": "Your cue is coming. Get ready to sing!", "tip": "Cheer for each person when they try their part."}}}, "comic-book": {"id": "comic-book", "intro": "Comics tell a story with pictures and words together. Your team can make a hero who solves a big problem!", "sections": [{"h": "What is a comic made of?", "p": "A comic is made of boxes called panels. Each panel shows one small part of the story. You read the panels in order, like steps. In English, you read left to right and top to bottom."}, {"h": "How do characters talk in a comic?", "p": "Characters talk in speech bubbles. A speech bubble has a little tail that points to the speaker. A thought bubble looks like a cloud. It shows what a character is thinking."}, {"h": "How do comics show sound and movement?", "p": "Comics use big sound words like POW, ZOOM and SPLASH. Artists draw short lines behind things to show they move fast. Wobbly lines can show something shaking. These tricks help you hear and feel the story."}], "facts": ["Sound words like BOOM and SPLAT have a special name: onomatopoeia.", "In Japan, many comics are read from right to left."], "research": [{"how": "read", "text": "Read a comic or graphic novel from the class or school library. Count the panels on one page."}, {"how": "watch", "text": "Watch a short video your teacher picks that shows how an artist draws a comic."}, {"how": "ask", "text": "Ask your school librarian which comics younger and older kids like best, and why."}, {"how": "try", "text": "Fold a paper into 4 boxes. Draw a tiny story with a beginning, middle and end."}], "words": [{"w": "panel", "m": "One box in a comic that shows part of the story.", "s": "Our first panel shows the hero waking up."}, {"w": "speech bubble", "m": "A shape that holds the words a character says.", "s": "The speech bubble points to the cat."}, {"w": "character", "m": "A person or animal in a story.", "s": "Our main character is a brave robot."}, {"w": "onomatopoeia", "m": "A word that sounds like the noise it names.", "s": "We wrote CRASH in big letters for onomatopoeia."}, {"w": "sequence", "m": "The order that things happen in.", "s": "We put the panels in the right sequence."}, {"w": "caption", "m": "A small box of words that tells the reader what is happening.", "s": "The caption says Later that day."}], "roles": {"Story writer": {"does": "You plan the hero, the problem and the happy ending. You decide what happens in each panel. You share your plan with the team.", "matters": "Without a plan, the comic would not tell a clear story.", "say": "First the hero finds a map, then the storm comes.", "tip": "Plan a beginning, middle and end before anyone draws."}, "Artist": {"does": "You draw the characters and places in each panel. You make the hero look the same on every page. You add lines to show movement.", "matters": "The pictures show readers what is happening.", "say": "I will draw speed lines so the bike looks fast.", "tip": "Draw lightly in pencil first, then go over it with marker."}, "Letterer": {"does": "You write the words in the speech bubbles and captions. You make the letters neat and easy to read. You add big sound words.", "matters": "Readers need clear words to follow the story.", "say": "I left space at the top for the speech bubble.", "tip": "Write the words first, then draw the bubble around them."}, "Editor": {"does": "You read the whole comic from start to end. You check that the story makes sense and the panels are in order. You give kind ideas to fix problems.", "matters": "Checking helps the team catch mistakes before readers do.", "say": "This part is a bit confusing. Can we add one more panel?", "tip": "Read the comic out loud to hear if it makes sense."}}}, "art-gallery": {"id": "art-gallery", "intro": "A gallery is a place where people come to look at art. Your class can turn a room into a real gallery for visitors!", "sections": [{"h": "What is an art gallery?", "p": "A gallery is a room or building that shows art. The art hangs on walls or sits on stands. Each piece has a small label next to it. Visitors walk slowly and look closely."}, {"h": "How do artists show feelings with color?", "p": "Colors can make us feel different ways. Red, orange and yellow are warm colors. They can feel bright, happy or excited. Blue, green and purple are cool colors that can feel calm or quiet."}, {"h": "How do you mix new colors?", "p": "Red, yellow and blue are primary colors. You can mix them to make new colors. Blue and yellow make green. Red and yellow make orange, and red and blue make purple."}], "facts": ["The famous painting Mona Lisa hangs in a museum in Paris called the Louvre.", "Mixing blue and yellow paint makes green."], "research": [{"how": "read", "text": "Read a library book about a famous artist. Notice which colors they use most."}, {"how": "watch", "text": "Watch a short virtual museum tour your teacher chooses. Look at how the art is hung and labeled."}, {"how": "ask", "text": "Ask your art teacher how they choose which student art to put on display."}, {"how": "try", "text": "Paint one small picture with only warm colors and one with only cool colors. How does each one feel?"}], "words": [{"w": "gallery", "m": "A place where art is shown for people to see.", "s": "Our classroom becomes a gallery on Friday."}, {"w": "artist", "m": "A person who makes art.", "s": "Every artist signs their painting."}, {"w": "label", "m": "A small card that tells about a piece of art.", "s": "The label says the painting's name and who made it."}, {"w": "primary colors", "m": "Red, yellow and blue, the colors you mix to make others.", "s": "We used primary colors to mix purple."}, {"w": "mood", "m": "The feeling a picture gives you.", "s": "The blue painting has a calm mood."}, {"w": "display", "m": "To show something so people can see it.", "s": "We display the art at eye level."}], "roles": {"Artist": {"does": "You make paintings or drawings for the gallery. You choose colors to show a feeling. You give your art a title.", "matters": "A gallery needs art for visitors to enjoy.", "say": "I used warm colors because my picture is about a happy day.", "tip": "Think about the feeling first, then pick your colors."}, "Label maker": {"does": "You talk to each artist about their work. You write a label with the title, the artist and one fact. You make the words big and neat.", "matters": "Labels help visitors understand each piece of art.", "say": "What is your painting called, and what did you use?", "tip": "Keep each label short so visitors can read it fast."}, "Gallery guide": {"does": "You welcome visitors and walk with them. You tell them about the art and ask what they notice. You answer their questions kindly.", "matters": "A guide helps visitors look closely and learn more.", "say": "What feeling do you get from this painting?", "tip": "Ask visitors a question instead of only telling them facts."}, "Setup crew": {"does": "You plan where each piece of art will go. You hang the art straight and leave space between pieces. You put each label next to the right art.", "matters": "Neat setup makes the gallery easy and nice to walk through.", "say": "Let's move this one up so it is in a straight line.", "tip": "Hang art at eye level for the visitors you expect."}}}, "float-sink": {"id": "float-sink", "intro": "Some things bob on top of water, and some drop to the bottom. Your team will test it and become float and sink experts!", "sections": [{"h": "Why do some things float?", "p": "Water pushes up on everything you put in it. If a thing is light for its size, the water can hold it up. Wood, corks and plastic balls often float. Air inside a thing can help it float too."}, {"h": "Why does a big boat float but a small stone sinks?", "p": "A stone is small but very heavy for its size, so it sinks. A boat is big and has lots of air inside. Its wide shape pushes away lots of water. The water pushes back up hard enough to hold the boat."}, {"h": "What is a fair test?", "p": "In a fair test, you change only one thing at a time. Use the same tub and the same water for every object. Make a guess before each test. Then write down what really happens."}], "facts": ["Ice floats on water, which is why ice cubes bob at the top of a drink.", "It is easier to float in very salty water than in fresh water."], "research": [{"how": "read", "text": "Read a library book about boats or floating and sinking. Find one reason boats stay up."}, {"how": "watch", "text": "Watch a short science video your teacher picks about why ships float."}, {"how": "ask", "text": "Ask your science teacher why a ball of clay sinks but a clay boat can float."}, {"how": "try", "text": "Roll foil into a tight ball and test it. Then shape the same foil into a flat boat. What changes?"}], "words": [{"w": "float", "m": "To stay on top of the water.", "s": "The cork floats on the water."}, {"w": "sink", "m": "To go down to the bottom of the water.", "s": "The coin sinks to the bottom of the tub."}, {"w": "predict", "m": "To make a smart guess about what will happen.", "s": "I predict the spoon will sink."}, {"w": "fair test", "m": "A test where you change only one thing.", "s": "We use the same tub to keep it a fair test."}, {"w": "results", "m": "What you find out from a test.", "s": "We put our results on the chart."}, {"w": "museum", "m": "A place that shows things so people can learn.", "s": "Our museum shows a table of floaters and a table of sinkers."}], "roles": {"Question asker": {"does": "You choose which objects the team will test. You ask the team to guess before each test. You think of new questions when something surprises you.", "matters": "Good questions help the team learn more from each test.", "say": "Do you think the big eraser or the small one will float?", "tip": "Pick objects of different sizes and materials."}, "Tester": {"does": "You put each object gently in the water. You let it go and watch closely. You do every test the same way.", "matters": "Careful testing makes the results true and fair.", "say": "I will drop it from the same height every time.", "tip": "Keep towels close and dry each object after the test."}, "Recorder": {"does": "You write each object and the team's guess on the chart. You mark if it floated or sank. You check the chart is neat and easy to read.", "matters": "Without a record, the team would forget what they found.", "say": "Pencil, guess was float, and it floated!", "tip": "Make your chart before testing starts."}, "Museum guide": {"does": "You set up the floaters and sinkers for visitors. You explain what the team found and why. You ask visitors to make their own guess.", "matters": "The guide shares the team's learning with others.", "say": "This stone sank because it is heavy for its size.", "tip": "Show one surprise result to make visitors curious."}}}, "science-show": {"id": "science-show", "intro": "Scientists love to watch closely and ask why. Your team will put on a show with simple experiments that make people say wow!", "sections": [{"h": "Why does a balloon stick after you rub it?", "p": "Everything is made of tiny bits too small to see. When you rub a balloon on your hair, some tiny bits move onto the balloon. This is called static electricity. It makes the balloon stick to a wall or pull your hair up."}, {"h": "How do magnets work?", "p": "A magnet pulls on things made of iron, like paper clips. It does not pull on paper, wood or plastic. Every magnet has two ends called poles. Two of the same poles push away, and two different poles pull together."}, {"h": "Why does ice melt?", "p": "Ice is water that is frozen solid. The air in the room is warmer than the ice. The warmth moves into the ice, and it turns back into water. A cup of ice in a sunny spot melts faster than one in the shade."}], "facts": ["Lightning is a giant spark of static electricity.", "Earth acts like a giant magnet, which is why a compass needle points north."], "research": [{"how": "read", "text": "Read a simple experiment book from the school library. Choose ones that use only cups, ice, magnets or balloons."}, {"how": "watch", "text": "Watch a short kids science video your teacher picks about static electricity or magnets."}, {"how": "ask", "text": "Ask your science teacher to check your 3 experiments are safe before the show."}, {"how": "try", "text": "Test which classroom objects a magnet picks up. Sort them into two piles."}], "words": [{"w": "experiment", "m": "A test to find out what happens.", "s": "Our first experiment uses a balloon."}, {"w": "static electricity", "m": "A charge that builds up when you rub some things together.", "s": "Static electricity makes the balloon stick to the wall."}, {"w": "magnet", "m": "An object that pulls iron things toward it.", "s": "The magnet picks up three paper clips."}, {"w": "melt", "m": "To change from solid to liquid.", "s": "The ice starts to melt in the warm room."}, {"w": "observe", "m": "To watch something very closely.", "s": "Observe the ice cube for five minutes."}, {"w": "audience", "m": "The people who watch a show.", "s": "The audience clapped when the balloon stuck."}], "roles": {"Experiment planner": {"does": "You choose 3 safe and simple experiments. You write the steps for each one. You plan the order of the show.", "matters": "A clear plan helps the show run smoothly.", "say": "Let's start with the magnet test because it is quick.", "tip": "Practice each experiment before the show to make sure it works."}, "Assistant": {"does": "You collect the cups, ice, magnets and balloons. You set them out in the right order. You clean up spills with paper towels.", "matters": "The show cannot start if the materials are not ready.", "say": "The balloons are blown up and the magnets are on the tray.", "tip": "Make a checklist and tick off each item."}, "Presenter": {"does": "You welcome the audience and tell them what will happen. You ask them to guess before each experiment. You speak loudly and clearly.", "matters": "The presenter helps the audience follow and enjoy the show.", "say": "What do you think will happen when I rub this balloon?", "tip": "Look at the audience and speak slowly."}, "Fact finder": {"does": "You find out why each experiment works. You use books or ask your teacher. You share one simple reason after each experiment.", "matters": "The team needs to explain why, not just show what happens.", "say": "The balloon sticks because of static electricity.", "tip": "Write each reason in one short sentence on a card."}}}, "mini-habitat": {"id": "mini-habitat", "intro": "Every animal needs a home that gives it what it needs to live. Your team will build a tiny model home for an animal you choose!", "sections": [{"h": "What is a habitat?", "p": "A habitat is the natural home of an animal or plant. It can be a forest, a pond, a desert or the ocean. Different animals live in different habitats. A fish lives in water, but a camel lives in a dry desert."}, {"h": "What do animals need?", "p": "All animals need food, water, air and shelter. Shelter is a safe place to rest and hide. Animals also need space to move and find food. A good habitat gives an animal all these things."}, {"h": "Where does our animal sleep?", "p": "Animals sleep in many places. Birds sleep in nests or on branches. Rabbits rest in holes called burrows. Find out where your animal sleeps so you can add it to your model."}], "facts": ["Beavers build their own homes, called lodges, out of sticks and mud.", "A camel can go for many days without drinking water."], "research": [{"how": "read", "text": "Read a nonfiction book about your animal from the school library. Find what it eats and where it sleeps."}, {"how": "watch", "text": "Watch a short nature video your teacher chooses that shows your animal in its habitat."}, {"how": "ask", "text": "Ask your teacher or librarian to help you find a fact page about your animal."}, {"how": "try", "text": "Sort picture cards of animals into habitats like ocean, forest and desert."}], "words": [{"w": "habitat", "m": "The natural home where an animal or plant lives.", "s": "Our frog's habitat has a pond and plants."}, {"w": "shelter", "m": "A safe place to rest and hide.", "s": "We made a shelter from sticks and clay."}, {"w": "burrow", "m": "A hole in the ground where an animal lives.", "s": "The rab
