bit sleeps in its burrow."}, {"w": "predator", "m": "An animal that hunts other animals for food.", "s": "A fox is a predator of rabbits."}, {"w": "model", "m": "A small copy of something real.", "s": "Our model fits inside a shoebox."}, {"w": "survive", "m": "To stay alive.", "s": "Our animal needs water to survive."}], "roles": {"Animal expert": {"does": "You find out about the animal your team chose. You learn what it eats, where it sleeps and how it stays safe. You share the facts with your team.", "matters": "The team needs true facts to build the right habitat.", "say": "Our owl sleeps in the day, so it needs a dark hiding spot.", "tip": "Write each fact on a sticky note so the team can see it."}, "Designer": {"does": "You draw a plan of the habitat. You show where the food, water and shelter will go. You use the expert's facts to make choices.", "matters": "A plan helps the builder know what to make.", "say": "Let's put the water on this side and the nest up high.", "tip": "Label every part of your drawing."}, "Builder": {"does": "You build the model in the shoebox. You use leaves, sticks, clay and paper. You follow the plan and fix parts that fall down.", "matters": "The model lets everyone see the habitat for real.", "say": "I need more clay to hold this tree up.", "tip": "Let glue dry before you add the next part."}, "Guide": {"does": "You show the model to visitors. You explain how it gives the animal food, water and shelter. You answer questions about the animal.", "matters": "The guide shares what the team learned with others.", "say": "This is where our hedgehog hides during the day.", "tip": "Point to each part as you talk about it."}}}, "nature-club": {"id": "nature-club", "intro": "Tiny creatures and plants are hiding all around your school. Your club will become nature detectives and find them!", "sections": [{"h": "What are living things?", "p": "Living things grow, need food and water, and make new living things. Plants, animals, insects and people are all living things. Rocks and toys are not living. You can find living things in grass, under leaves and in trees."}, {"h": "Which animals visit our school?", "p": "Look for birds, insects, spiders and worms. Some come in the day and some come at dusk. You might find clues instead, like feathers, webs or nibbled leaves. Be quiet and still so you do not scare them."}, {"h": "How do you watch nature safely and kindly?", "p": "Look with your eyes and a magnifying glass. Do not pick up animals or pull up plants. Put back any leaves or rocks you move. Always stay with your group and an adult."}], "facts": ["Insects have six legs, but spiders have eight legs, so spiders are not insects.", "You can count the rings on a tree stump to find out about how old the tree was."], "research": [{"how": "read", "text": "Read the nature guide book to learn the names of 3 birds or bugs that might live near you."}, {"how": "watch", "text": "Watch a short video your teacher picks about bugs or birds you can find at school."}, {"how": "ask", "text": "Ask a school gardener or caretaker where they often see animals around school."}, {"how": "try", "text": "Sit still in one spot outside for 5 minutes with an adult. Draw every living thing you see."}], "words": [{"w": "living thing", "m": "Something that grows, eats and breathes.", "s": "The worm is a living thing."}, {"w": "insect", "m": "A small animal with six legs and three body parts.", "s": "We found an insect on the leaf."}, {"w": "observe", "m": "To watch something very closely.", "s": "We observe the ants carrying food."}, {"w": "magnifying glass", "m": "A special lens that makes small things look bigger.", "s": "The magnifying glass shows the beetle's legs."}, {"w": "sketch", "m": "A quick drawing.", "s": "I made a sketch of the snail shell."}, {"w": "club", "m": "A group of people who meet to enjoy the same thing.", "s": "Our club meets every Tuesday at recess."}], "roles": {"Club planner": {"does": "You choose when and where the club will meet. You check the plan with your teacher. You make a list of what to bring.", "matters": "A plan helps members know where to be and when.", "say": "Let's meet by the garden on Tuesday at lunch.", "tip": "Write the plan on a poster so everyone can see it."}, "Spotter": {"does": "You look carefully for plants, bugs and birds. You use the nature guide to find their names. You quietly show others what you found.", "matters": "The club needs sharp eyes to find hidden living things.", "say": "Look under this leaf, I see a ladybug!", "tip": "Move slowly and look under, on top and behind things."}, "Nature artist": {"does": "You sketch what the club finds. You add labels with the name and the place you saw it. You keep the drawings in a club book.", "matters": "Drawings help the club remember and share what they saw.", "say": "I will draw the spots on its back.", "tip": "Look at the real thing often while you draw."}, "Welcome buddy": {"does": "You invite new members to join the club. You show them the rules and the tools. You help them feel part of the team.", "matters": "A club grows when everyone feels welcome.", "say": "Do you want to come and look for bugs with us?", "tip": "Learn new members' names and use them."}}}, "recess-game": {"id": "recess-game", "intro": "Recess is more fun when everyone can play together. Your team will invent a brand new game that is fair for everyone!", "sections": [{"h": "What makes a game fair for everyone?", "p": "In a fair game, the rules are the same for every player. Everyone gets a turn and a chance to win. The game works for players who are fast or slow. Fair games feel fun, even when you lose."}, {"h": "What makes good rules?", "p": "Good rules are short and clear. They tell players how to start, how to play and how to win. They say what happens if someone breaks a rule. Test your rules and change them if they do not work."}, {"h": "How do we keep the game safe?", "p": "Pick a safe space with plenty of room. Use soft balls and cones to mark lines. Make a rule about gentle tagging. Look out for others while you run."}], "facts": ["Basketball was invented by a teacher who wanted a game his students could play indoors in winter.", "Many people use rock, paper, scissors as a fair way to choose who goes first."], "research": [{"how": "read", "text": "Read a library book of playground games. Choose one idea you could change into your own game."}, {"how": "watch", "text": "Watch other classes play at recess. Notice which games everyone joins in."}, {"how": "ask", "text": "Ask your PE teacher what makes a game safe and fair to play."}, {"how": "try", "text": "Play your game with a small group. Ask them what to change."}], "words": [{"w": "rule", "m": "Something everyone must do or not do in a game.", "s": "Our first rule is that you must tag gently."}, {"w": "fair", "m": "The same for everyone.", "s": "It is fair because everyone gets a turn."}, {"w": "equipment", "m": "The things you need to play.", "s": "Our equipment is two balls and four cones."}, {"w": "boundary", "m": "A line that shows where the game space ends.", "s": "We drew the boundary with chalk."}, {"w": "teamwork", "m": "Working together to reach a goal.", "s": "Teamwork helps us pass the ball."}, {"w": "invent", "m": "To make something new that did not exist before.", "s": "We invent a game called Cone Catch."}], "roles": {"Rule maker": {"does": "You write the rules for the new game. You make them short and clear. You change rules after testing if they do not work.", "matters": "Clear rules help everyone play the same way.", "say": "Rule three says you can only hold the ball for three seconds.", "tip": "Use numbers for each rule so they are easy to follow."}, "Equipment keeper": {"does": "You get the balls, cones and chalk ready. You set up the play space. You count the gear and put it back after the game.", "matters": "The game cannot start without the right gear in the right place.", "say": "I counted four cones and two balls, all here.", "tip": "Make a list of the gear and check it before and after."}, "Coach": {"does": "You teach the game to other players. You show them how to play, step by step. You answer questions and cheer them on.", "matters": "New players need someone to show them how the game works.", "say": "Watch me first, then you try it.", "tip": "Show the game, do not just tell it."}, "Fair play buddy": {"does": "You watch that everyone gets a turn. You help solve small arguments kindly. You invite anyone who is left out to join.", "matters": "A game is only fun when it is fair for everyone.", "say": "Let's give Sam a turn next.", "tip": "Stay calm and listen to both sides."}}}, "sports-day": {"id": "sports-day", "intro": "A sports day is full of running, jumping, throwing and cheering. Your team will plan fun stations for another class to try!", "sections": [{"h": "What is an activity station?", "p": "A station is one spot where players do one activity. You might throw bean bags into hoops at one station. At another, you might hop between cones. Players move from station to station in small groups."}, {"h": "How long should each station take?", "p": "Each station needs enough time for everyone to have a turn. If it is too short, some kids miss out. If it is too long, kids get bored. Test your station with a timer to find a good time."}, {"h": "Why is moving good for you?", "p": "Moving makes your heart and muscles strong. When you run, your heart beats faster. It sends more blood to your muscles. Playing together also helps you make friends and feel happy."}], "facts": ["The first Olympic Games were held in ancient Greece, a very long time ago.", "Your heart beats faster when you exercise, to send more blood to your muscles."], "research": [{"how": "read", "text": "Read a library book about sports or exercise. Find one activity you could turn into a station."}, {"how": "watch", "text": "Watch a short video your teacher picks about why exercise is good for your body."}, {"how": "ask", "text": "Ask your PE teacher which activities are safe and fun for the class you will host."}, {"how": "try", "text": "Try your station with a friend. Use a timer to see how long one turn takes."}], "words": [{"w": "station", "m": "One place where you do one activity.", "s": "The bean bag station is next to the wall."}, {"w": "schedule", "m": "A plan that shows what happens and when.", "s": "Our schedule shows when groups switch."}, {"w": "rotate", "m": "To move around in turns.", "s": "Groups rotate to the next station when the timer beeps."}, {"w": "exercise", "m": "Moving your body to keep it healthy.", "s": "Hopping through hoops is good exercise."}, {"w": "encourage", "m": "To help someone feel brave and keep trying.", "s": "We encourage everyone with a cheer."}, {"w": "timer", "m": "A tool that counts time.", "s": "The timer is set for three minutes."}], "roles": {"Event planner": {"does": "You choose the activities for each station. You draw a map of where each station goes. You make a schedule for the groups.", "matters": "A good plan helps the day run smoothly.", "say": "Station one is the hoop throw, and station two is the cone hop.", "tip": "Choose activities that everyone can try."}, "Station host": {"does": "You stand at one station and explain how it works. You show players what to do. You help set things back up after each group.", "matters": "Players need to know what to do at each station.", "say": "Throw the bean bag into the hoop from behind this line.", "tip": "Show the activity once before players start."}, "Time keeper": {"does": "You use the timer to time each station. You tell groups when it is time to move. You keep the whole day on schedule.", "matters": "Good timing gives every group a fair turn.", "say": "One minute left, then we rotate!", "tip": "Give a warning before time runs out."}, "Cheer buddy": {"does": "You cheer for every player. You help anyone who feels shy or unsure. You make sure everyone joins in.", "matters": "Cheering helps players feel brave and have fun.", "say": "Great try, you can do it!", "tip": "Cheer for effort, not just for winning."}}}, "cardboard-arcade": {"id": "cardboard-arcade", "intro": "What if an old box could become a game? You can turn cardboard into an arcade that younger kids will love to play!", "sections": [{"h": "What makes a game fun?", "p": "A fun game has a clear goal. It is not too easy and not too hard. Players like to see what happens when they win or miss. Good games make you want to play again."}, {"h": "How do you build with cardboard?", "p": "Cardboard is strong but light. You can cut it, fold it and tape it. Measure before you cut so the parts fit. Always ask an adult to help with sharp scissors."}, {"h": "Why do we test a game?", "p": "Testing shows you what works and what does not. Watch real players try your game. Ask them what was fun and what was tricky. Then change your game to make it better."}], "facts": ["Cardboard is made from paper, and paper is made from wood.", "Many boxes have a wavy layer of paper inside that makes them strong."], "research": [{"how": "read", "text": "Read a library book about simple machines, like ramps and levers, that your teacher picks."}, {"how": "watch", "text": "Watch a short video your teacher chooses about kids building cardboard games."}, {"how": "ask", "text": "Ask a younger class what games they like to play at recess."}, {"how": "try", "text": "Roll a small ball down a cardboard ramp. Try making the ramp steeper or flatter and see what changes."}], "words": [{"w": "arcade", "m": "A place with lots of games to play.", "s": "Our class arcade has five cardboard games."}, {"w": "design", "m": "To plan how something will look and work.", "s": "We design the game before we build it."}, {"w": "measure", "m": "To find out how long or big something is.", "s": "I measure the box so the hole is the right size."}, {"w": "rule", "m": "Something that tells you what you can and cannot do in a game.", "s": "The rule says you get three balls each turn."}, {"w": "test", "m": "To try something to see if it works.", "s": "We test the game with our friends first."}, {"w": "target", "m": "The thing you aim for.", "s": "The ball must go into the target to win a ticket."}], "roles": {"Game designer": {"does": "You plan how the game works. You draw the game and decide the goal and the rules. You think about how to make it fun for younger kids.", "matters": "Without a plan, the builder does not know what to make.", "say": "What if the ball rolls into this cup to score?", "tip": "Draw your idea first and label each part."}, "Builder": {"does": "You build the game from boxes and tape. You measure, cut and stick the parts together. You fix things when they fall apart.", "matters": "The team needs someone to turn the plan into a real game.", "say": "Can you hold this side while I tape it?", "tip": "Measure twice and cut once."}, "Tester": {"does": "You play the game again and again. You look for parts that break or are too hard. You tell the team what to fix.", "matters": "Testing finds problems before the younger kids play.", "say": "The ball keeps getting stuck here. Can we make the hole bigger?", "tip": "Write down every problem you find."}, "Ticket host": {"does": "You welcome players with a smile. You explain the rules in a simple way. You give out tickets when players score.", "matters": "Players have more fun when someone helps them know what to do.", "say": "Welcome! You get three balls. Try to get one in the cup!", "tip": "Show the game once before the player tries."}}}, "board-game": {"id": "board-game", "intro": "Have you ever raced a friend to the end of a board game? Now you can invent your very own game for others to play!", "sections": [{"h": "What does every board game need?", "p": "A board game needs a goal, like reaching the finish first. It needs a path or spaces to move on. It needs rules so everyone knows how to play. Most games also use pieces, like counters and dice."}, {"h": "How do games keep it fair?", "p": "In a fair game, every player has the same chance to win. Everyone follows the same rules. Dice help because nobody knows what number will come up. Players take turns in order."}, {"h": "How do you make a fun path?", "p": "A path can twist and turn across the board. Some spaces can say move ahead or go back. Count your spaces so the game is not too long. Colours and pictures make the path exciting."}], "facts": ["People have played board games for thousands of years.", "On a normal six-sided die, the numbers on opposite sides add up to seven."], "research": [{"how": "read", "text": "Read the rules from a board game in your classroom. Notice how the rules are written in steps."}, {"how": "watch", "text": "Watch a short video your teacher picks about games children played long ago."}, {"how": "ask", "text": "Ask a family member about a board game they played when they were young."}, {"how": "try", "text": "Play a class board game and talk about what made it fair or unfair."}], "words": [{"w": "goal", "m": "What you are trying to do to win.", "s": "The goal of our game is to reach the castle first."}, {"w": "fair", "m": "When everyone has the same chance.", "s": "Our game is fair because everyone starts at the same space."}, {"w": "counter", "m": "A small piece you move on the board.", "s": "My counter is the red one."}, {"w": "dice", "m": "Small cubes with dots used to pick a number.", "s": "Roll the dice to see how far you move."}, {"w": "turn", "m": "Your time to play.", "s": "It is my turn to roll now."}, {"w": "path", "m": "The line of spaces you move along.", "s": "The path goes over a bridge and through a forest."}], "roles": {"Game designer": {"does": "You plan the goal of the game. You decide how the path will go and what the special spaces do. You share your ideas with the team.", "matters": "The team needs a clear goal and path before anyone can draw or write rules.", "say": "Let's make the finish a treasure chest at the top!", "tip": "Keep the game short enough to play in one sitting."}, "Artist": {"does": "You draw the board, the path and the pictures. You use colours to make spaces easy to see. You make the game look exciting.", "matters": "A clear, colourful board helps players know where to go.", "say": "I will make the go back spaces red so they stand out.", "tip": "Draw lightly in pencil first, then add colour."}, "Rule writer": {"does": "You write the rules in short, clear steps. You read them to the team to check they make sense. You fix any rule that is confusing.", "matters": "Good rules help everyone play the same way.", "say": "Step one. Roll the dice and move your counter.", "tip": "Number your rules so they are easy to follow."}, "Fair play checker": {"does": "You check that every player has the same chance to win. You play the game and look for spaces that are unfair. You help the team change them.", "matters": "A fair game is more fun for everyone.", "say": "This shortcut is only on one side. Can we add one for the other side too?", "tip": "Play the game more than once to check."}}}, "picture-book": {"id": "picture-book", "intro": "Do you remember your favourite book from when you were little? You can make a picture book that a younger child will want to read again and again!", "sections": [{"h": "What is in a good story?", "p": "A story has a character, a problem and a solution. The character is who the story is about. The problem is what goes wrong. The solution is how the problem gets fixed."}, {"h": "What do younger kids like in books?", "p": "Younger kids like big, bright pictures. They enjoy words that repeat and rhyme. Short sentences are easy for them to follow. Funny parts make them laugh."}, {"h": "How do words and pictures work together?", "p": "In a picture book, the pictures help tell the story. A picture can show how a character feels. Each page has a few words and a picture. Together they keep the reader turning pages."}], "facts": ["The person who draws the pictures in a book is called an illustrator.", "Many picture books have 32 pages."], "research": [{"how": "read", "text": "Read three picture books from the class library. Find the character, problem and solution in each one."}, {"how": "watch", "text": "Watch your teacher or librarian read a picture book aloud. Notice how the pictures help."}, {"how": "ask", "text": "Ask a younger child or their teacher what their favourite book is and why."}, {"how": "try", "text": "Draw one page with no words. Ask a friend to tell you what is happening."}], "words": [{"w": "character", "m": "A person or animal in a story.", "s": "Our main character is a little lost fox."}, {"w": "problem", "m": "Something that goes wrong in a story.", "s": "The problem is that the fox cannot find home."}, {"w": "solution", "m": "How the problem gets fixed.", "s": "The solution is that a kind owl shows the way."}, {"w": "illustrate", "m": "To draw pictures for a story.", "s": "I illustrate the page where the fox is sad."}, {"w": "edit", "m": "To check and fix your writing.", "s": "We edit the story to fix spelling mistakes."}, {"w": "cover", "m": "The front of a book with the title.", "s": "The cover shows the fox and the owl."}], "roles": {"Writer": {"does": "You write the story with a character, a problem and a solution. You use short sentences that younger kids can follow. You decide which words go on each page.", "matters": "Every picture book needs a story to tell.", "say": "On this page, the fox looks under a big rock.", "tip": "Read your story out loud to hear how it sounds."}, "Illustrator": {"does": "You draw the pictures for each page. You show how the characters feel. You make sure the pictures match the words.", "matters": "Pictures help younger kids understand and enjoy the story.", "say": "I will draw the fox with a big smile at the end.", "tip": "Make your pictures big and bright."}, "Editor": {"does": "You check the spelling and the full stops. You make sure the story makes sense from start to end. You help the writer fix small mistakes kindly.", "matters": "Careful checking makes the book easy to read.", "say": "This page needs a capital letter at the start.", "tip": "Check one page at a time."}, "Reader": {"does": "You practise reading the book aloud. You use a lively voice and show the pictures. You share the book with the younger children.", "matters": "A good reader brings the story to life for the audience.", "say": "Can you guess where the fox will look next?", "tip": "Hold the book so everyone can see the pictures."}}}, "audio-story": {"id": "audio-story", "intro": "Close your eyes and listen. Can you tell a whole story with just voices and sounds?", "sections": [{"h": "How can sounds help tell a story?", "p": "Sounds help listeners picture what is happening. A creaky door can sound spooky. Footsteps can show someone is coming. Sounds help you see the story in your mind."}, {"h": "How do you use your voice?", "p": "Your voice can be loud or soft, fast or slow. You can change your voice for each character. Speak clearly so listeners understand every word. Pausing at the right time can make a story exciting."}, {"h": "How do you make sound effects?", "p": "You can make sounds with everyday things. Crinkly paper can sound like a fire. Tapping on a table can sound like rain. Try lots of things to find the best sound."}], "facts": ["Sound is made when something vibrates, which means it moves back and forth very fast.", "People who make sound effects for films and shows are called Foley artists."], "research": [{"how": "read", "text": "Read a short story your teacher picks and find places where a sound could be added."}, {"how": "watch", "text": "Watch a short video your teacher chooses about how sound effects are made."}, {"how": "ask", "text": "Ask your music teacher how to make different sounds with classroom instruments."}, {"how": "try", "text": "Close your eyes while a friend makes a sound. Guess what it is meant to be."}], "words": [{"w": "narrator", "m": "The person who tells the story.", "s": "The narrator reads the story in a calm voice."}, {"w": "sound effect", "m": "A sound made to show what is happening.", "s": "We shake a box of rice as a rain sound effect."}, {"w": "script", "m": "The written words people read out loud.", "s": "The script shows when each sound comes in."}, {"w": "record", "m": "To save sounds so you can play them later.", "s": "We record our story on the class recorder."}, {"w": "volume", "m": "How loud or soft a sound is.", "s": "Turn the volume down for the quiet part."}, {"w": "listener", "m": "A person who hears the story.", "s": "The listener smiles at the funny sound."}], "roles": {"Writer": {"does": "You write the story as a script. You mark the places where sounds should go. You keep the story short and clear.", "matters": "The team needs a script so everyone knows what to say and when.", "say": "Here the dog barks, then the door opens.", "tip": "Write SOUND next to each place a sound goes."}, "Narrator": {"does": "You read the story out loud. You change your voice for different characters. You speak clearly and slowly.", "matters": "The narrator's voice carries the whole story to the listeners.", "say": "Let me try the giant's voice deeper and slower.", "tip": "Practise reading the script a few times before you record."}, "Sound maker": {"does": "You make the sound effects at the right moments. You try different objects to find the best sounds. You follow the script so your sounds come in on time.", "matters": "Sounds help listeners picture the story.", "say": "Listen, this paper crunch sounds like walking on leaves!", "tip": "Keep your sound objects in order so you can grab them fast."}, "Listener": {"does": "You listen to the practice and the recording. You tell the team what sounds clear and what is hard to hear. You share ideas to make the story better.", "matters": "The team needs fresh ears to know how the story sounds to others.", "say": "I could not hear the rain. Can it be a bit louder?", "tip": "Start with something you liked before you share a change."}}}, "tidy-helper": {"id": "tidy-helper", "intro": "Does your classroom ever get messy? You can be an inventor and make something that helps everyone tidy up!", "sections": [{"h": "Why does this spot get messy?", "p": "Some spots get messy for a reason. Things may not have a home. A shelf may be hard to reach. Look closely and ask your classmates what they notice."}, {"h": "How do inventors solve problems?", "p": "Inventors start by finding a problem. Then they think of many ideas. They draw a plan and build a first try. They test it and make it better."}, {"h": "What makes a good tidy-up tool?", "p": "A good tool is easy for everyone to use. Labels and pictures show where things go. It should be strong enough to last. It should fit in the space you have."}], "facts": ["The first try of an invention is often called a prototype.", "Inventors often change their idea many times before it works well."], "research": [{"how": "read", "text": "Read a library book about inventors and how they solve problems, chosen by your teacher."}, {"how": "watch", "text": "Watch your classroom at tidy-up time. Notice which spots stay messy."}, {"how": "ask", "text": "Ask your teacher or the school cleaner which places are hardest to keep tidy."}, {"how": "try", "text": "Sort a pile of classroom things into groups. Try different ways and see which is fastest."}], "words": [{"w": "invention", "m": "A new thing someone makes to solve a problem.", "s": "Our invention holds all the glue sticks."}, {"w": "inventor", "m": "A person who makes something new.", "s": "Every inventor tests their idea."}, {"w": "prototype", "m": "The first try of an invention.", "s": "Our prototype is made from a cereal box."}, {"w": "label", "m": "A word or picture that tells what something is.", "s": "The label says pencils only."}, {"w": "sort", "m": "To put things into groups that go together.", "s": "We sort the crayons by colour."}, {"w": "improve", "m": "To make something better.", "s": "We improve the box by making it taller."}], "roles": {"Problem finder": {"does": "You look for spots that get messy. You watch, ask questions and think about why. You share what you find with the team.", "matters": "The team needs to understand the problem before they can solve it.", "say": "The markers always end up on the floor because the cup is too small.", "tip": "Look at the spot at different times of the day."}, "Designer": {"does": "You draw a plan for the invention. You label each part and show how it works. You change the plan when the team has new ideas.", "matters": "A clear drawing helps the builder know what to make.", "say": "What if we add a slot here for the scissors?", "tip": "Draw more than one idea, then pick the best."}, "Builder": {"does": "You build the invention from recycled boxes, tape and string. You measure and cut carefully. You fix parts that wobble or break.", "matters": "The team needs someone to turn the drawing into a real thing.", "say": "This side is wobbly. I will add more tape.", "tip": "Ask an adult to help with sharp scissors."}, "Presenter": {"does": "You show the class how the invention works. You explain the problem and how the invention helps. You answer questions from classmates.", "matters": "People will only use the invention if they know how it works.", "say": "Put your markers in here, and they will not roll away!", "tip": "Practise showing it before you present."}}}, "bird-feeder": {"id": "bird-feeder", "intro": "Birds are busy finding food every day. You can build a feeder and watch who comes to visit!", "sections": [{"h": "What do birds eat?", "p": "Different birds eat different foods. Many birds eat seeds. Some eat insects, worms or fruit. Bread is not good food for birds, so use bird seed."}, {"h": "What makes a good bird feeder?", "p": "A good feeder keeps seed dry. It has a place for birds to stand, called a perch. It hangs up high, away from cats. It should be easy to fill and clean."}, {"h": "How do you watch birds?", "p": "Sit still and stay quiet so birds are not scared. Watch from a window or a safe distance. Draw or write what you see. Notice the colour, size and beak of each bird."}], "facts": ["Birds do not have teeth. They use their beaks to pick up and crack food.", "The shape of a bird's beak helps it eat certain kinds of food."], "research": [{"how": "read", "text": "Read a library book about birds and what they eat, chosen by your teacher or librarian."}, {"how": "watch", "text": "Watch the school grounds from a window for ten minutes. Count how many birds you see."}, {"how": "ask", "text": "Ask a family member or school staff member which birds they see near the school."}, {"how": "try", "text": "Look at pictures of bird beaks with your teacher. Guess what food each beak is good for."}], "words": [{"w": "feeder", "m": "A thing that holds food for birds.", "s": "We hang the feeder on a tree branch."}, {"w": "beak", "m": "The hard mouth part of a bird.", "s": "The bird cracks the seed with its beak."}, {"w": "perch", "m": "A place where a bird stands or sits.", "s": "We push a stick through the bottle for a perch."}, {"w": "seed", "m": "A small part of a plant that birds like to eat.", "s": "We fill the feeder with bird seed."}, {"w": "observe", "m": "To watch something carefully.", "s": "We observe the feeder every morning."}, {"w": "habitat", "m": "The place where an animal lives.", "s": "Trees and bushes are part of a bird's habitat."}], "roles": {"Bird researcher": {"does": "You find out what birds eat and what they need. You read books and ask people who know about birds. You share what you learn with the team.", "matters": "The team needs to know what birds like so they will visit.", "say": "I found out that birds need a perch to stand on while they eat.", "tip": "Write down one new fact each time you read."}, "Designer": {"does": "You draw the plan for the feeder. You show where the seed goes and where birds will stand. You think about keeping the seed dry.", "matters": "A good plan helps make a feeder that works.", "say": "Let's put the holes just above the perch so birds can reach the seed.", "tip": "Label every part of your drawing."}, "Builder": {"does": "You build the feeder with a bottle, sticks and string. You work with an adult when cutting holes. You check the feeder is strong and safe to hang.", "matters": "The team needs someone to make the plan into a real feeder.", "say": "Can you hold the bottle while I push the stick through?", "tip": "Ask an adult to cut the holes in the bottle."}, "Reporter": {"does": "You watch the feeder and keep a record of visitors. You draw or write about the birds you see. You share the results with the class.", "matters": "Reporting shows the team if their feeder is working.", "say": "Today two small brown birds came to the feeder!", "tip": "Write the day and time each time you watch."}}}, "recycling-club": {"id": "recycling-club", "intro": "Lots of things we throw away can be used again. You can start a club that helps your whole school recycle!", "sections": [{"h": "What is recycling?", "p": "Recycling means turning old things into new things. Old paper can become new paper. Old cans and bottles can be made into new ones too. Recycling means less rubbish goes in the ground."}, {"h": "What can be recycled at our school?", "p": "Paper, cardboard, some plastics and cans can often be recycled. Each town has its own rules. Ask your school which bins to use. Items should be clean and empty before they go in."}, {"h": "How can a club help?", "p": "A club can make posters to teach others. Members can check that things go in the right bin. Everyone can have a job and a day. When people work together, more gets done."}], "facts": ["Metal cans can be recycled again and again.", "Recycling rules can be different in different towns."], "research": [{"how": "read", "text": /* ---------- Pages ---------- */
const PAGES=[
 {id:'start',label:'Start',icon:'star'},
 {id:'love',label:'Interests',icon:'helping'},
 {id:'learn',label:'Skills',icon:'bulb'},
 {id:'goals',label:'Goals',icon:'arrow'},
 {id:'web',label:'My Web',icon:'mix'},
 {id:'tips',label:'Tips',icon:'sprout'},
 {id:'go',label:'Actions',icon:'stairs'},
 {id:'projects',label:'Projects',icon:'hammer'}
];
if(typeof S.page!=='number')S.page=0;S.done=S.done||{};S.got=S.got||{};

function guide(){
  const p=S.page===EX?'explore':PAGES[S.page].id, n=S.picks.length, g=S.good.length, w=S.work.length;
  let t='';
  if(p==='start')t=n?'Welcome back! Tap "Keep going" to carry on, or change your picks.':'Hi explorer! Tap "Start my quest" to begin. There are no wrong answers.';
  else if(p==='love')t=[ 'Tap a card that sounds fun. You can choose up to 3.','Nice choice! Pick 1 or 2 more, or tap Next.','Great! Pick one more, or tap Next.','You picked 3. To change one, tap it again to take it off. Then tap Next.'][n];
  else if(p==='learn')t=!g&&!w?'Read each skill. Which one sounds like you? Tap "Good at" on it.':!g?'Everyone is good at something! Find one skill and tap "Good at".':!w?'Great! Now find one skill you want to grow. Tap "Working on".':'Super! You know your strengths and what to grow. Tap Next.';
  else if(p==='goals')t=S.goals.length?`Good plan! You will get directions to ${list(S.goals.map(id=>GOALS.find(x=>x.id===id).label.toLowerCase()))}. Tap Next.`:'What do you want to do with your interests? Tap one sign or more.';
  else if(p==='web'){const m=webModel();const best=m.outs.find(o=>OUTCOMES[o].atl.some(s=>S.good.includes(s)));
    t=best?`Tap a circle to follow its lines. Try "${OUTCOMES[best].label}". It uses your strength!`:'Tap a circle to follow its lines. Each line shows how things join together.';}
  else if(p==='tips')t=g&&w?'Use your strength to help your team. Then choose one focus tip to try this week.':g?'Your strengths help a lot! Go back to Skills if you want a focus tip too.':w?'Pick one focus tip to try this week. Small steps help you grow.':'Go back to Skills and tap what you are good at and working on.';
  else if(p==='go'){const sk=S.work[0]?atl(S.work[0]).label.toLowerCase():'';t=`Start with "Today". Tap the circle when you finish a move.${sk?` The green moves help you grow your ${sk}.`:''}`;}
  else if(p==='explore'&&!S.project)t='Choose how to look: by interest, kind of project, or skill. Then tap one. There will always be projects to see!';
  else if(S.project){const pr=PROJECTS.find(x=>x.id===S.project),f=pr?fitOf(pr):{good:[]};t=S.ptab==='learn'?'Read one part at a time. Tap the speaker to listen. Then try one of the research ideas.':S.ptab==='words'?'Say each word out loud. Can you use it in a sentence about your project?':f.good.length?`Look at the Jobs tab. Starred jobs use your ${atl(f.good[0]).label.toLowerCase()} strength. Talk with your team about who does what.`:'Look at each tab: About, Jobs, Materials and Plan. Then talk with your team about who does what.';}
  else t=S.good.length?'Projects at the top fit your strengths best. Tap one to see the jobs, materials and plan.':'Tap a project to see its jobs, materials and 3-week plan.';
  return `<div class="guide"><span class="gic">${ic('compass')}</span><p><b>Quest tip</b>${t}</p>${say(t)}</div>`;
}
const canNext=()=>{if(S.page===EX)return true;const p=PAGES[S.page].id;return p==='love'?S.picks.length>0:p==='goals'?S.goals.length>0:true};
const needMsg=()=>S.page===EX?'':({love:'Pick at least 1 interest',goals:'Pick at least 1 goal'})[PAGES[S.page].id]||'';
const goBtn=(page,label)=>`<button class="btn" data-act="page" data-arg="${page}">${ic('arrow')}${label}</button>`;

function pageHead(n,title,sub,read){return `<div class="stop-h">${n?`<span class="stop-n">${n}</span>`:''}<div><h1>${title}</h1><p class="lead">${sub}</p></div>${say(read||title+'. '+sub)}</div>`}

function pStart(){
  const n=S.picks.length;
  return `<section class="welcome">
    <p class="kicker">Project Quest</p>
    <h1 class="big">Where will your curiosity take you?</h1>
    <p class="lead">Find what you love, learn how you learn best, and get steps to try.</p>
    <ol class="how">
      ${[['helping','Pick what you love'],['bulb','Tell us how you learn'],['arrow','Choose a goal'],['stairs','Get your directions']].map((x,i)=>`<li><span class="hn">${i+1}</span><span class="hic">${ic(x[0])}</span><b>${x[1]}</b></li>`).join('')}
    </ol>
    <div class="row"><button class="btn big sun" data-act="page" data-arg="${n?6:1}">${ic('arrow')}${n?'Keep going':'Start my quest'}</button>${n?`<button class="btn big" data-act="page" data-arg="1">Change my picks</button>`:''}<button class="btn big" data-act="page" data-arg="8">${ic('compass')}Explore projects</button></div>
    ${n?`<div class="sofar"><p class="lbl">My quest so far</p><div class="chiprow">${S.picks.map(id=>{const x=byId(id);return `<span class="chip" style="--c:${x.c}"><span class="mini">${ic(id)}</span>${x.label}</span>`}).join('')}
      ${S.good.map(id=>`<span class="chip" style="--c:${atl(id).c}"><span class="mini">${ic('star')}</span>Good at ${atl(id).label}</span>`).join('')}
      ${S.work.map(id=>`<span class="chip" style="--c:var(--grow)"><span class="mini">${ic('sprout')}</span>Growing ${atl(id).label}</span>`).join('')}</div>
      <button class="btn ghost" data-act="reset">${ic('reset')}Start a new quest</button></div>`:''}
  </section>`;
}
function pLove(){
  return `${pageHead(1,'What do you love?','Tap up to 3 interests.')}
  <div class="tiles">${INTERESTS.map(x=>`<button class="tile" style="--c:${x.c}" data-act="pick" data-arg="${x.id}" aria-pressed="${S.picks.includes(x.id)}"><span class="chk">${ic('check')}</span><span class="ic">${ic(x.id)}</span><b>${x.label}</b><small>${x.q}</small></button>`).join('')}</div>`;
}
function pLearn(){
  return `${pageHead(2,'How do you learn?','For each skill, tap "Good at" or "Working on". You can leave some blank.')}
  <div class="atl">${ATL.map(a=>{const g=S.good.includes(a.id),w=S.work.includes(a.id);
    return `<div class="skill ${g?'good':w?'work':''}" style="--c:${a.c}"><div class="sh"><span class="ic">${ic(a.icon)}</span><b>${a.label}</b>${say(a.label+'. '+a.kid)}</div><p>${a.kid}</p>
    <div class="pick2" role="group" aria-label="${a.label}"><button class="g" data-act="good" data-arg="${a.id}" aria-pressed="${g}">${ic('star')}Good at</button><button class="w" data-act="work" data-arg="${a.id}" aria-pressed="${w}">${ic('sprout')}Working on</button></div></div>`}).join('')}</div>`;
}
function pGoals(){
  return `${pageHead(3,'What do you want to do?','Tap one goal or more.','What do you want to do? Find out more, get better, make something, or work with a team.')}
  <div class="posts">${GOALS.map(g=>`<button class="post" style="--c:${g.c}" data-act="goal" data-arg="${g.id}" aria-pressed="${S.goals.includes(g.id)}"><span class="chk">${ic('check')}</span><span class="ic">${ic(g.icon)}</span><b>${g.label}</b><small>${g.sub}</small></button>`).join('')}</div>`;
}
function pWeb(){
  return `${pageHead(4,'My quest web','See how your interests and skills join to what you could do.')}
  ${S.picks.length?web():`<div class="empty">Pick interests first to grow your web. ${goBtn(1,'Pick interests')}</div>`}`;
}
function pTips(){
  return `${pageHead(5,'Tips for me','How my strengths help, and what to focus on.')}
  ${!S.good.length&&!S.work.length?`<div class="empty">Tell us how you learn to get tips made for you. ${goBtn(2,'Go to skills')}</div>`:tips()}`;
}
function pGo(){
  const head=pageHead(6,'My action plan','Things to do, made for you.');
  if(!S.picks.length)return `${head}<div class="empty">Pick an interest first. ${goBtn(1,'Pick interests')}</div>`;
  if(!S.goals.length)return `${head}<div class="empty">Pick a goal first. ${goBtn(3,'Pick goals')}</div>`;
  if(!S.picks.includes(S.active))S.active=S.picks[0];
  if(!S.goals.includes(S.goalTab))S.goalTab=S.goals[0];
  const it=byId(S.active), g=GOALS.find(x=>x.id===S.goalTab), plan=actionPlan(it,g);
  const key=i=>`${it.id}:${g.id}:${i}`;
  const done=plan.filter((_,i)=>S.done[key(i)]).length;
  const projs=PROJECTS.filter(p=>p.int===it.id);
  return `${head}
  ${S.picks.length>1?`<div class="switch" role="group" aria-label="Choose an interest">${S.picks.map(id=>{const x=byId(id);return `<button style="--c:${x.c}" data-act="active" data-arg="${id}" aria-current="${id===S.active}"><span class="mini">${ic(id)}</span>${x.label}</button>`}).join('')}</div>`:''}
  ${S.goals.length>1?`<div class="gtabs" role="tablist">${S.goals.map(id=>{const x=GOALS.find(y=>y.id===id);return `<button role="tab" style="--c:${x.c}" data-act="gtab" data-arg="${id}" aria-selected="${id===S.goalTab}">${ic(x.icon)}${x.label}</button>`}).join('')}</div>`:''}
  <section class="plan" style="--c:${it.c}">
    <div class="plan-h"><span class="ic">${ic(it.id)}</span><div><small class="lbl">${it.label} · ${g.label}</small><h2>My next moves</h2></div>
      <span class="prog" aria-label="${done} of ${plan.length} done">${done}/${plan.length}</span>${say(plan.map(a=>a.when+': '+a.text).join(' '))}</div>
    <ol class="moves">${plan.map((a,i)=>`<li class="${a.kind||''} ${S.done[key(i)]?'did':''}">
      <button class="tick" data-act="tick" data-arg="${key(i)}" aria-pressed="${!!S.done[key(i)]}" aria-label="Mark done">${ic('check')}</button>
      <div><span class="when">${ic(a.icon)}${a.when}${a.skill?` · ${a.skill.label}`:''}</span><p>${a.text}</p></div></li>`).join('')}</ol>
    <p class="note">Tap the circle when you finish a move.</p>

  ${projs.length?`<section class="stack"><h3>Projects for ${it.label.toLowerCase()}</h3><div class="pgrid">${projs.map(projCard).join('')}</div></section>`:''}
  <details class="more"><summary>${ic(g.icon)}See all the steps for ${g.label.toLowerCase()}</summary>${direction(it,g)}</details>`;
}

  const it=byId(p.int), f=fitOf(p);
  return `<button class="pcard" style="--c:${it.c}" data-act="openProj" data-arg="${p.id}">

function pProjects(){
  const p=S.project&&PROJECTS.find(x=>x.id===S.project);
  if(p)return projDetail(p);
  const mine=S.pfilter!=='all'&&S.picks.length;
  const score=x=>{const f=fitOf(x);return f.good.length*2+f.work.length};
  const listP=PROJECTS.filter(x=>!mine||S.picks.includes(x.int)).sort((a,b)=>score(b)-score(a));
  return `${pageHead(7,'Projects','Real projects with jobs, skills, materials and a plan.')}
  <div class="gtabs" role="tablist"><button role="tab" data-act="pfilter" data-arg="mine" aria-selected="${!!mine}" style="--c:var(--ink)">${ic('helping')}For my interests</button><button role="tab" data-act="pfilter" data-arg="all" aria-selected="${!mine}" style="--c:var(--ink)">${ic('star')}All projects</button></div>
  <div class="pgrid">${listP.map(projCard).join('')}</div>`;
}

  } else if(t==='learn'){
    if(!C){body='<p>Reading for this project is coming soon.</p>'}else{

  return `<div><button class="btn" data-act="openProj" data-arg="">${ic('back')}All projects</button></div>
  <section class="phero" style="--c:${it.c}"><span class="ic">${ic(it.id)}</span><div><small class="lbl">${it.label} project</small><h1>${p.title}</h1></div>${say(read)}</section>
  <div class="gtabs" role="tablist">${Object.entries(tabs).map(([k,[l,i]])=>`<button role="tab" style="--c:${it.c}" data-act="ptab" data-arg="${k}" aria-selected="${t===k}">${ic(i)}${l}</button>`).join('')}</div>
  <div class="pbody">${body}</div>`;
}

/* ---------- Full screen ---------- */
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
const fsOK=()=>!!(document.documentElement.requestFullscreen||document.documentElement.webkitRequestFullscreen);
function toggleFS(){
  try{
    if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}
    const el=document.documentElement, r=(el.requestFullscreen||el.webkitRequestFullscreen).call(el);
    if(r&&r.catch)r.catch(()=>flash('Full screen is not available here. Try your browser menu.'));
  }catch(e){flash('Full screen is not available here. Try your browser menu.')}
}
['fullscreenchange','webkitfullscreenchange'].forEach(ev=>document.addEventListener(ev,()=>render()));
let flashT;function flash(m){let el=document.querySelector('.flash');if(!el){el=document.createElement('div');el.className='flash';el.setAttribute('role','status');document.body.appendChild(el)}el.textContent=m;el.hidden=false;clearTimeout(flashT);flashT=setTimeout(()=>el.hidden=true,3000)}


/* ---------- Explore projects ---------- */
const EX=8;
const PTYPE={'toy-town':'model','marble-run':'model','jump-game':'game','animated-story':'film','recycled-band':'show','class-song':'show','puppet-show':'show','mini-musical':'show','comic-book':'book','art-gallery':'show','float-sink':'experiment','science-show':'experiment','mini-habitat':'model','nature-club':'club','recess-game':'game','sports-day':'teach','cardboard-arcade':'game','board-game':'game','picture-book':'book','audio-story':'book','tidy-helper':'model','bird-feeder':'experiment','recycling-club':'club','buddy-reading':'teach'};
PROJECTS.forEach(p=>p.type=PTYPE[p.id]);
const EXBY={int:'Interest',type:'Kind of project',skill:'Skill it uses'};
function exFocus(){if(!S.ex||!S.ex.kind||!S.ex.val)S.ex={kind:'int',val:S.picks[0]||'building'};return S.ex}
function exList(){const f=exFocus();return PROJECTS.filter(p=>f.kind==='all'||(f.kind==='int'&&p.int===f.val)||(f.kind==='type'&&p.type===f.val)||(f.kind==='skill'&&p.roles.some(r=>r[2]===f.val)))
  .sort((a,b)=>{const sc=x=>{const q=fitOf(x);return q.good.length*2+q.work.length+(S.picks.includes(x.int)?3:0)};return sc(b)-sc(a)})}
function pExplore(){
  const p=S.project&&PROJECTS.find(x=>x.id===S.project);
  if(p)return projDetail(p);
  const f=exFocus(), res=exList();
  const chip=(kind,val,label,icon,c)=>`<button class="fchip" style="--c:${c}" data-act="exf" data-arg="${kind}:${val}" aria-pressed="${f.kind===kind&&f.val===val}">${ic(icon)}${label}</button>`;
  const by=f.kind==='all'?'all':f.kind;
  const chips=by==='int'?INTERESTS.map(i=>chip('int',i.id,i.label,i.id,i.c)).join('')
    :by==='type'?Object.entries(OUTCOMES).map(([k,o])=>chip('type',k,o.label,o.icon,'#6A62DC')).join('')
    :by==='skill'?ATL.map(a=>chip('skill',a.id,a.label+(S.good.includes(a.id)?' ★':S.work.includes(a.id)?' (growing)':''),a.icon,a.c)).join(''):'';
  const focusName=f.kind==='int'?byId(f.val).label:f.kind==='type'?OUTCOMES[f.val].label:f.kind==='skill'?atl(f.val).label:'All projects';
  return `<section class="phero" style="--c:var(--sun)"><span class="ic" style="color:var(--ink)">${ic('compass')}</span><div><small class="lbl">Free explore</small><h1>Explore projects</h1><p class="lead">Choose one focus. Then tap a project to read, learn and plan.</p></div>${say('Explore projects. Choose one focus. Then tap a project to read, learn and plan.')}</section>
  <div class="filters">
    <div class="frow"><p class="lbl">Find projects by</p><div class="seg" role="tablist">${Object.entries(EXBY).map(([k,l])=>`<button role="tab" data-act="exby" data-arg="${k}" aria-selected="${by===k}">${l}</button>`).join('')}<button role="tab" data-act="exf" data-arg="all:all" aria-selected="${by==='all'}">All</button></div></div>
    ${chips?`<div class="fscroll">${chips}</div>`:''}
    <div class="row"><button class="btn sun" data-act="surprise">${ic('mix')}Surprise me!</button></div>
  </div>
  <p class="count2"><b>${res.length}</b> project${res.length===1?'':'s'} · ${focusName}</p>
  <div class="pgrid">${res.map(projCard).join('')}</div>`;
}
function render(){
  const p=S.page, views=[pStart,pLove,pLearn,pGoals,pWeb,pTips,pGo,pProjects,pExplore];
  const last=p===PAGES.length-1, ok=canNext(), isEx=p===EX;
  document.getElementById('app').innerHTML=`
  <header class="bar"><div class="bar-in">
    <button class="brand" data-act="page" data-arg="0"><span class="mark">${ic('star')}</span><span class="bt">Project Quest</span></button>
    ${fsOK()?`<button class="fsbtn" data-act="fs" aria-label="${fsEl()?'Exit full screen':'Full screen'}">${ic(fsEl()?'shrink':'expand')}<span>${fsEl()?'Exit':'Full screen'}</span></button>`:''}
    <button class="fsbtn exbtn" data-act="page" data-arg="${EX}" ${isEx?'aria-current="page"':''}>${ic('compass')}<span>Explore projects</span></button>
    <nav class="track" aria-label="Quest steps">${PAGES.slice(1).map((x,i)=>{const k=i+1;return `<button data-act="page" data-arg="${k}" ${k===p?'aria-current="step"':''} class="${k<p?'past':''}"><span class="tn">${k<p?ic('check'):k}</span><span class="tl">${x.label}</span></button>`}).join('')}</nav>
  </div></header>
  <main class="page">
    ${p?guide():''}
    ${views[p]()}
  </main>
  ${isEx?`<footer class="foot"><div class="foot-in">
    <button class="btn big" data-act="${S.project?'openProj':'page'}" data-arg="${S.project?'':0}">${ic('back')}${S.project?'All projects':'Home'}</button>
    <button class="btn big sun" data-act="page" data-arg="${S.picks.length?6:1}">${S.picks.length?'My action plan':'Start my quest'}${ic('arrow')}</button>
  </div></footer>`:p?`<footer class="foot"><div class="foot-in">
    <button class="btn big" data-act="page" data-arg="${p-1}">${ic('back')}Back</button>
    <span class="count">Step ${p} of ${PAGES.length-1}</span>
    ${last?`<button class="btn big sun" data-act="page" data-arg="0">${ic('star')}Finish</button>`
      :`<button class="btn big sun" data-act="next" ${ok?'':'aria-disabled="true"'}>${ok?'Next':needMsg()}${ic('arrow')}</button>`}
  </div></footer>`:''}`;
}
function goPage(n){if(+n!==S.page)S.project=null;S.page=Math.max(0,Math.min(EX,+n));save();render();window.scrollTo(0,0);document.querySelector('main h1')?.focus?.()}

const A={
  say:t=>speak(t),
  page:n=>goPage(n),
  fs:()=>toggleFS(),
  tick:k=>{S.done[k]=!S.done[k];save();render()},
  got:k=>{S.got[k]=!S.got[k];save();render()},
  openProj:id=>{if(id&&S.page!==7&&S.page!==EX){goPage(7)}S.project=id||null;S.ptab='about';save();render();window.scrollTo(0,0)},
  exf:v=>{const [k,val]=v.split(':');S.ex={kind:k,val};save();render()},
  exby:k=>{const first={int:S.picks[0]||'building',type:'model',skill:S.good[0]||'thinking'}[k];if(exFocus().kind!==k)S.ex={kind:k,val:first};save();render()},
  surprise:()=>{const l=exList(),pool=l.length?l:PROJECTS;let p;do{p=pool[Math.floor(Math.random()*pool.length)]}while(pool.length>1&&p.id===S.lastSurprise);S.lastSurprise=p.id;S.project=p.id;S.ptab='about';save();render();window.scrollTo(0,0);flash('Surprise! Try '+p.title)},
  ptab:t=>{S.ptab=t;save();render()},
  pfilter:f=>{S.pfilter=f;save();render()},
  next:()=>{if(!canNext()){speak(needMsg());document.querySelector('.guide')?.classList.add('nudge');setTimeout(()=>document.querySelector('.guide')?.classList.remove('nudge'),600);return}goPage(S.page+1)},
  pick:id=>{const k=S.picks.indexOf(id);if(k>=0)S.picks.splice(k,1);else{S.picks.push(id);if(S.picks.length>3)S.picks.shift();S.active=id}save();render()},
  good:id=>{const k=S.good.indexOf(id);if(k>=0)S.good.splice(k,1);else{S.good.push(id);S.work=S.work.filter(x=>x!==id)}save();render()},
  work:id=>{const k=S.work.indexOf(id);if(k>=0)S.work.splice(k,1);else{S.work.push(id);S.good=S.good.filter(x=>x!==id)}save();render()},
  goal:id=>{const k=S.goals.indexOf(id);if(k>=0)S.goals.splice(k,1);else S.goals.push(id);S.goals.sort((a,b)=>GOALS.findIndex(g=>g.id===a)-GOALS.findIndex(g=>g.id===b));save();render()},
  focus:id=>{S.focus=S.focus===id?null:id;save();render();document.querySelector(`g.node[data-arg="${id}"]`)?.focus({preventScroll:true})},
  active:id=>{S.active=id;save();render()},
  gtab:id=>{S.goalTab=id;save();render()},
  reset:()=>{S={picks:[],good:[],work:[],goals:[],active:null,focus:null,page:1,done:{},got:{}};save();render();window.scrollTo(0,0)}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-act]');if(!t)return;A[t.dataset.act]?.(t.dataset.arg)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches?.('g.node')){e.preventDefault();A.focus(e.target.dataset.arg)}});
render();
</script>
