 in places that do not exist, doing things that never happened, when there are so many useful books in the world — histories, biographies, manuals, textbooks — full of real information about the real world?"],[1,"The argument has a certain logic to it."],[1,"However, it misses something fundamental about how human beings actually understand each other."],[1,"To read a good novel is, in the deepest possible sense, to inhabit, however briefly, the mind of another person."],[1,"We see what they see."],[1,"We feel what they feel."],[1,"We are invited, for a few hours, to share their fears, their joys, their misunderstandings, their hopes."],[1,"No other activity that I know of does this quite so completely."],[2,"The result, I would argue, is not trivial at all."],[2,"It is one of the most powerful ways human beings have ever discovered for building what psychologists now call 'empathy' — the ability to imagine the inner lives of people unlike ourselves."],[2,"A child who has read about a refugee, however fictional, will encounter a real one with a different kind of attention."],[2,"An adult who has spent a hundred pages inside the mind of someone of another race, another century, another culture, finds that the rest of the world has quietly grown a little larger."],[3,"This is not, I should add, a matter of grand literary novels alone."],[3,"A thriller, a fantasy, a comic novel — even a children's adventure story — can do the work just as well, provided it is written with care and read with attention."],[3,"What matters is not the genre; it is the quality of attention given on both sides."],[4,"So the next time someone tells you that reading fiction is frivolous, smile politely, and firmly disagree."],[4,"Reading fiction is among the most serious things a person can do."],[4,"It is how we learn to understand each other; and without that understanding, very little else of importance is possible at all."]],"q":[[[4],"What does the writer say reading a good novel lets you do?"],[[10],"What is 'empathy'?"],[[15],"According to the writer, what matters more than the genre?"]]},{"t":"The Locked Drawer","k":"Literary mystery","s":[[0,"Of all the things my great-aunt had left me in her will, only one truly puzzled me."],[0,"It was a small writing desk, dark, plain, made of an unfamiliar wood, with a single shallow drawer in the middle."],[0,"The drawer was locked."],[0,"The key was nowhere to be found."],[1,"I had spent three Sundays searching the house."],[1,"I had emptied every pot in the kitchen, lifted every cushion in the drawing room, unscrewed the back of the grandfather clock, climbed into the attic and gone carefully through three trunks of yellowing letters."],[1,"There was no key."],[1,"I began, finally, to suspect that it had been lost — or, more likely, deliberately destroyed — long before my great-aunt's death."],[2,"I am, I should explain, a respectable woman."],[2,"I do not, as a rule, force open locked drawers in furniture that has come to me through legitimate inheritance."],[2,"However, by the end of the fourth Sunday, I had reached a point at which respectability no longer seemed quite sufficient."],[2,"I fetched a thin metal file from the kitchen and set to work on the lock."],[3,"The drawer yielded surprisingly easily."],[3,"Inside, there was no jewellery, no money, no scandalous letters — none of the things one half-imagines when forcing open such a drawer."],[3,"Inside there was only a small, soft lock of brown human hair, tied at one end with a strip of faded blue ribbon."],[3,"Nothing else."],[3,"No name."],[3,"No date."],[3,"No explanation."],[4,"I sat at the desk for a long time, holding the lock in one hand and the lock of hair in the other."],[4,"Whose hair it was, I shall never know."],[4,"Whether it belonged to a child, a lover, a sister, a friend, my great-aunt herself in her youth — there is no longer any way to tell."],[4,"The only person who could have told me has been dead for nearly two years."],[5,"I have put it back in the drawer."],[5,"I shall not open it again."],[5,"Some questions, I have come to believe, are better not answered."],[5,"Some drawers are better left closed."]],"q":[[[3],"Why could the narrator not open the drawer?"],[[11],"How did the narrator finally open the drawer?"],[[14],"What was inside the drawer?"]]},{"t":"Black Holes","k":"Science","s":[[0,"A black hole is, perhaps, the strangest object the universe is known to contain."],[0,"It is a region of space where gravity has become so unimaginably powerful that nothing — not even light, the fastest thing there is — can escape pulled inwards once it has crossed a certain boundary."],[1,"That boundary is called the event horizon."],[1,"Beyond it, the laws of physics as we currently understand them appear to break down."],[1,"Time itself, according to Einstein's general theory of relativity, would slow for any object falling in, eventually coming to a complete halt."],[1,"A spaceship venturing too close would, from the perspective of distant observers, appear to hang motionless on the edge forever, while the crew themselves would experience their final seconds in normal time."],[1,"Both descriptions are equally true."],[1,"The disagreement is one of perspective, not of fact."],[2,"Black holes are not, despite their name, holes in any ordinary sense."],[2,"They are, in fact, the collapsed remains of massive stars: stars that have used up their fuel, collapsed under their own enormous weight, and crushed themselves into objects so dense that a piece the size of a sugar cube might weigh more than an entire mountain range."],[3,"For most of the twentieth century, black holes were a purely mathematical curiosity."],[3,"Many physicists, including Einstein himself, doubted whether they could actually exist in reality."],[3,"We now know that they do."],[3,"In 2019, a global network of telescopes succeeded in producing the first real photograph of a black hole, at the centre of the galaxy M87."],[3,"Three years later, an even more famous image revealed the black hole at the centre of our own galaxy."],[4,"There are, scientists now believe, supermassive black holes at the heart of almost every large galaxy in the universe."],[4,"What role they play in the way galaxies form, and how exactly they grew to be so vast, remains among the greatest unsolved questions in modern astronomy."]],"q":[[[2],"What is the boundary around a black hole called?"],[[9],"What are black holes actually made from?"],[[13],"When was the first real photograph of a black hole taken?"]]},{"t":"The Marathon","k":"Memoir / recount","s":[[0,"On the morning of the marathon I woke at four o'clock with the absolute certainty that I had made a terrible mistake."],[0,"It was, I should explain, the first marathon I had ever attempted, and I had spent the past nine months training for it with a dedication that bordered on the obsessive."],[0,"Now, however, in the grey half-light of my bedroom, all of that preparation seemed suddenly inadequate to the task I had set myself."],[0,"Twenty-six miles."],[0,"Of running."],[0,"By me."],[1,"I dressed in silence, ate the breakfast I had laid out the night before, and walked, alone, to the starting point."],[1,"The streets were already filling with other runners: thin people, fit-looking people, people in club vests who appeared to have done this kind of thing many times before."],[1,"I felt, among them, like an imposter."],[2,"The first ten miles were almost enjoyable."],[2,"The crowd was generous, the morning was cool, the music from the loudspeakers along the route was unexpectedly cheerful."],[2,"I found a steady rhythm and held it."],[2,"I began, very cautiously, to allow myself to think that I might, just possibly, finish."],[3,"Miles fifteen to twenty were the worst."],[3,"I do not remember much about them, beyond a dim awareness of how heavy my legs had become, and a vague conviction that the road surface had developed a slight upward gradient that no one else seemed to have noticed."],[3,"People I had passed earlier began to pass me back."],[3,"I tried not to mind."],[4,"At mile twenty-two I hit what runners call 'the wall'."],[4,"My pace dropped."],[4,"My vision narrowed."],[4,"The cheerful music seemed, all at once, to be playing at the wrong speed."],[4,"I thought, with a curious clarity, about stopping; about sitting down on the kerb and waiting for someone to bring me a taxi."],[5,"I did not stop."],[5,"I am not sure why."],[5,"Some stubborn part of me, which I had not previously known existed, simply refused to allow it."],[5,"I shuffled, more than ran, the final four miles."],[5,"When I finally crossed the finish line, four hours and forty-one minutes after I had started, I burst into tears."],[5,"People I had never met before took photographs of me, hugged me, and pressed bottles of water into my hands."],[6,"That was three years ago."],[6,"I have not, since then, attempted a second marathon."],[6,"But I think about that first one almost every day."]],"q":[[[1],"How long had the narrator trained for the marathon?"],[[17],"At what point did the narrator hit 'the wall'?"],[[26],"How long did the narrator take to finish?"]]}]};
const KEY = 'evidence-history', PREF = 'evidence-prefs';
const S = { leaving:false, view:'home', year:3, files:2, test:null, qi:0, misses:[], lvl:0, win:[], state:'live', res:[], msg:'' };
try { const p = JSON.parse(localStorage.getItem(PREF) || '{}'); if (p.year) S.year = p.year; if (p.files) S.files = p.files; } catch (e) {}
const hy = /^#y([1-6])$/.exec(location.hash || ''); if (hy) S.year = +hy[1];
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const hist = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

const ME = 'evidence', OTHER = 'perfect';

const APPS = { perfect:{ label:'Answer it', name:'Process of Perfection', file:'perfect.html', art:'https://claude.ai/artifact/KdL2GWeEsgwqD1Wy9Ma4ow' },
               evidence:{ label:'Prove it', name:'Evidence', file:'evidence.html', art:'https://claude.ai/artifact/6S3TJhCYsdiGp7X6sU7DsZ' } };
const ON_SITE = location.protocol === 'file:' || /\/(perfect|evidence)\.html$/.test(location.pathname);
const appHref = k => (ON_SITE ? APPS[k].file : APPS[k].art) + '#y' + S.year;
function appNav() {
  const inRound = S.view === 'case';
  return Object.keys(APPS).map(k => k === ME
    ? '<span aria-current="page" title="' + APPS[k].name + '">' + APPS[k].label + '</span>'
    : inRound ? '<button data-act="leave" title="Open ' + APPS[k].name + '">' + APPS[k].label + ' ↗</button>'
    : '<a href="' + appHref(k) + '" title="Open ' + APPS[k].name + '">' + APPS[k].label + ' ↗</a>').join('');
}
function leaveNote() {
  if (!S.leaving) return '';
  return '<div class="notice" role="alert"><span>Leave this round for <b>' + APPS[OTHER].name + '</b>? This round will not be saved.</span><span class="sp"></span><a class="btn ' + 'redb' + '" href="' + appHref(OTHER) + '">Go</a><button class="link" data-act="stay">Stay</button></div>';
}
function bridge() {
  return '<div class="bridge"><div><b>' + 'Next: answer it.' + '</b> ' + 'In Process of Perfection you rank every choice from most to least likely, then cross out the two that cannot be right.' + '</div><a class="btn ' + 'redb' + '" href="' + appHref(OTHER) + '">Open ' + APPS[OTHER].name + ' ↗</a></div>';
}
const HDR = document.querySelector('header');
const setHH = () => document.documentElement.style.setProperty('--hh', HDR.offsetHeight + 'px');
const hro = new ResizeObserver(setHH); hro.observe(HDR);
/* a round = some passages × their 3 questions, asked in text order */
function start() {
  const ps = shuffle(BANK[S.year]).slice(0, S.files);
  S.test = []; ps.forEach((p, pi) => p.q.slice().sort((a, b) => a[0][0] - b[0][0]).forEach(q => S.test.push({ p, pi, ans:q[0], q:q[1] })));
  S.qi = 0; S.res = []; S.view = 'case'; save(PREF, { year:S.year, files:S.files }); newQ();
}
function newQ() { S.leaving = false; S.misses = []; S.lvl = 0; S.win = []; S.state = 'live'; S.msg = ''; render(); const t = S.test[S.qi]; if (S.qi === 0 || S.test[S.qi - 1].p !== t.p) scrollTo(0, 0); }
const worth = () => Math.max(0, 3 - S.misses.length);

/* After each miss, keep a smaller window of sentences around the evidence (placed at a random offset). */
function narrow() {
  const t = S.test[S.qi], N = t.p.s.length, lo = Math.min(...t.ans), hi = Math.max(...t.ans), need = hi - lo + 1;
  const size = S.lvl === 1 ? Math.max(need + 2, Math.ceil(N / 2)) : need + 2;
  const [a0, b0] = S.win.length ? S.win : [0, N - 1];
  const w = Math.min(size, b0 - a0 + 1);
  const minS = Math.max(a0, hi - w + 1), maxS = Math.min(lo, b0 - w + 1);
  const s = rnd(minS, Math.max(minS, maxS));
  S.win = [s, s + w - 1];
}
function pick(i) {
  if (S.state !== 'live') return;
  const t = S.test[S.qi];
  if (t.ans.includes(i)) { S.state = 'hit'; S.hitAt = i; finishQ(); return; }
  if (S.misses.includes(i)) return;
  S.misses.push(i); S.lvl = S.misses.length;
  if (S.lvl >= 3) { S.state = 'reveal'; finishQ(); return; }
  narrow();
  S.msg = S.lvl === 1 ? 'Not that one. Half the file has been blacked out. The evidence is in what is left. Now worth 2.' : 'Still not it. Only a few sentences remain. Read each one against the question. Now worth 1.';
  render();
}
function finishQ() { S.res[S.qi] = { pts:worth(), tries:S.misses.length + (S.state === 'hit' ? 1 : 0), found:S.state === 'hit' }; render(); }
function blocked(i) {
  if (!S.win.length) return false;
  return i < S.win[0] || i > S.win[1];
}

function render() {
  document.getElementById('apps').innerHTML = appNav();
  const pill = $('#pill');
  if (S.view === 'case') { pill.hidden = false; pill.textContent = S.res.reduce((a, r) => a + (r ? r.pts : 0), 0) + ' pts · ' + (S.qi + 1) + '/' + S.test.length; } else pill.hidden = true;
  $('#app').innerHTML = leaveNote() + (S.view === 'home' ? home() : S.view === 'case' ? caseView() : results());
}

function home() {
  const h = hist();
  return '<div class="hero"><h1>Evidence</h1><p>Good readers don\'t guess. They point to the exact sentence that proves the answer. Read the question, then tap the sentence in the text that answers it. Every wrong tap blacks out more of the text and costs you a point.</p></div>' +
    '<div class="file"><div class="lbl" style="margin-top:0">How it works</div>' +
    '<p class="demo">Sam has a red hat. <span style="background:var(--bar);color:transparent;border-radius:3px">The hat is big.</span> <span style="background:var(--hi);border-radius:3px;padding:1px 2px">One day the wind blew hard.</span> <span style="background:var(--bar);color:transparent;border-radius:3px">Sam ran fast.</span></p>' +
    '<div class="rules"><div class="rule"><b>3</b>Found on your first tap</div><div class="rule"><b>2</b>Second tap, half the text blacked out</div><div class="rule"><b>1</b>Third tap, only a few sentences left</div><div class="rule"><b>0</b>Third miss: the evidence is shown</div></div>' +
    '<div class="lbl">Year group</div><div class="opts">' + [1,2,3,4,5,6].map(y => '<button data-act="year" data-v="' + y + '" aria-pressed="' + (S.year === y) + '">Year ' + y + '</button>').join('') + '</div>' +
    '<div class="lbl">Case files</div><div class="opts">' + [1,2,3].map(n => '<button data-act="files" data-v="' + n + '" aria-pressed="' + (S.files === n) + '">' + n + ' text' + (n > 1 ? 's' : '') + ' · ' + n * 3 + ' questions</button>').join('') + '</div>' +
    '<div class="row" style="margin-top:22px"><button class="btn redb" data-act="start">Open the case · Year ' + S.year + ' →</button></div></div>' +
    '<div class="hist"><h3>Case history</h3>' + (h.length ? '<table><thead><tr><th>When</th><th>Year</th><th class="r">Points</th><th class="r">First-tap finds</th></tr></thead><tbody>' +
      h.slice(0, 8).map(r => { const d = new Date(r.t); return '<tr><td>' + d.toLocaleDateString(undefined, {day:'numeric', month:'short'}) + ' ' + d.toLocaleTimeString(undefined, {hour:'2-digit', minute:'2-digit'}) + '</td><td>' + r.y + '</td><td class="r num">' + r.p + ' / ' + r.m + '</td><td class="r num">' + r.f + ' / ' + r.n + '</td></tr>'; }).join('') + '</tbody></table>'
      : '<p class="empty">No cases closed yet. Scores are saved on this device after each round.</p>') + '</div>' +
    '<p class="foot">60 texts, Years 1–6, from the Reading Practice passage bank · 180 evidence questions.</p>';
}

function caseView() {
  const t = S.test[S.qi], p = t.p, st = S.state, w = worth();
  const sameP = S.test.filter(x => x.p === p), local = sameP.indexOf(t) + 1;
  let paras = [], cur = -1;
  p.s.forEach(([pi, txt], i) => {
    if (pi !== cur) { paras.push([]); cur = pi; }
    let cls = 'sn';
    if (st === 'hit' && i === S.hitAt) cls += ' hit';
    else if (st === 'reveal' && t.ans.includes(i)) cls += ' reveal';
    else if (S.misses.includes(i)) cls += ' miss';
    else if (st === 'live' && blocked(i)) cls += ' blk';
    const live = st === 'live' && !cls.includes('blk') && !cls.includes('miss');
    paras[paras.length - 1].push('<span class="' + cls + '" data-i="' + i + '"' + (live ? ' role="button" tabindex="0"' : ' aria-disabled="true"') + '>' + esc(txt) + '</span>');
  });
  const dots = '<span class="dots" aria-hidden="true">' + [0,1,2].map(k => '<i class="' + (k < w ? '' : 'gone') + '"></i>').join('') + '</span>';
  let foot = '';
  if (st === 'live') foot = '<p class="msg" role="status">' + esc(S.msg) + '</p>';
  else {
    const r = S.res[S.qi], last = S.qi === S.test.length - 1, nextNew = !last && S.test[S.qi + 1].p !== p;
    const head = st === 'hit' ? (r.tries === 1 ? 'Found it first time.' : 'Found it.') : 'Here is the evidence.';
    const sub = st === 'hit' ? (r.tries === 1 ? 'Straight to the proof. That is exactly how it is done.' : 'It took ' + r.tries + ' taps. Next time, pick out the key words in the question and hunt for them in the text.')
      : 'The highlighted sentence answers the question. Look at which words in it match the question.';
    foot = '<div class="verdict"><span class="big num">+' + r.pts + '</span><b>' + head + '</b><span>' + sub + '</span></div>' +
      '<div class="row"><span></span><button class="btn ' + (last ? 'redb" data-act="finish">Close the case →' : 'dark" data-act="next">' + (nextNew ? 'Next text →' : 'Next question →')) + '</button></div>';
  }
  return '<div class="slip"><div class="meta"><span class="mono">Question ' + (S.qi + 1) + ' of ' + S.test.length + '</span><span>Text ' + (t.pi + 1) + ' · question ' + local + ' of ' + sameP.length + '</span></div>' +
    '<p class="q">' + esc(t.q) + '</p><div class="worth">' + dots + '<span>' + (st === 'live' ? 'Worth ' + w + ' point' + (w === 1 ? '' : 's') + '. Tap the sentence that proves the answer.' : 'Question closed.') + '</span></div></div>' +
    '<article class="doc ' + (st === 'live' ? 'live' : 'done') + '"><div class="kind">' + esc(p.k) + '</div><h2>' + esc(p.t) + '</h2><div class="txt">' + paras.map(x => '<p>' + x.join(' ') + '</p>').join('') + '</div>' + foot + '</article>';
}

function results() {
  const n = S.res.length, max = n * 3, pts = S.res.reduce((a, r) => a + r.pts, 0);
  const first = S.res.filter(r => r.found && r.tries === 1).length, found = S.res.filter(r => r.found).length;
  const taps = S.res.reduce((a, r) => a + r.tries, 0);
  const pct = pts / max;
  const verdict = pct >= .9 ? 'Case closed.' : pct >= .7 ? 'Sharp detective work.' : pct >= .45 ? 'Good leads.' : 'Keep hunting.';
  let byP = [];
  S.test.forEach((t, i) => { if (!byP.length || byP[byP.length - 1].p !== t.p) byP.push({ p:t.p, items:[] }); byP[byP.length - 1].items.push(i); });
  return '<div class="file" style="margin-top:28px"><div class="score"><div class="seal num">' + pts + '<small>of ' + max + ' pts</small></div><div><h2>' + verdict + '</h2><p>Year ' + S.year + ' · ' + byP.length + ' text' + (byP.length > 1 ? 's' : '') + ' · ' + n + ' questions.</p></div></div>' +
    '<div class="tally"><div><b class="num">' + first + '</b>found on the first tap</div><div><b class="num">' + found + '</b>found at all</div><div><b class="num">' + (n - found) + '</b>evidence shown to you</div><div><b class="num">' + (taps / n).toFixed(1) + '</b>taps per question</div></div>' +
    byP.map(g => '<details' + (g.items.some(i => S.res[i].pts < 3) ? ' open' : '') + '><summary>' + esc(g.p.t) + '</summary>' + g.items.map(i => { const t = S.test[i], r = S.res[i];
      return '<div class="rv"><span>' + esc(t.q) + '</span><span class="p num" style="color:' + (r.pts === 3 ? 'var(--ink)' : r.pts === 0 ? 'var(--red)' : 'var(--ink2)') + '">+' + r.pts + '</span><span class="e"><mark>' + esc(t.ans.map(a => t.p.s[a][1]).join(' ')) + '</mark></span></div>'; }).join('') + '</details>').join('') +
    '<div class="row"><button class="btn redb" data-act="start">New case</button><button class="link" data-act="home">Change year</button></div></div>' + bridge();
}

document.addEventListener('click', e => {
  const sn = e.target.closest('.sn[role=button]'); if (sn) { pick(+sn.dataset.i); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, v = +b.dataset.v;
  if (a === 'home') { S.view = 'home'; S.leaving = false; render(); }
  else if (a === 'year') { S.year = v; render(); }
  else if (a === 'files') { S.files = v; render(); }
  else if (a === 'start') start();
  else if (a === 'leave') { S.leaving = true; render(); scrollTo(0, 0); }
  else if (a === 'stay') { S.leaving = false; render(); }
  else if (a === 'next') { S.qi++; newQ(); }
  else if (a === 'finish') {
    const h = hist(); h.unshift({ t:Date.now(), y:S.year, p:S.res.reduce((x, r) => x + r.pts, 0), m:S.res.length * 3, f:S.res.filter(r => r.found && r.tries === 1).length, n:S.res.length }); save(KEY, h.slice(0, 20));
    S.view = 'results'; render(); scrollTo(0, 0);
  }
});
document.addEventListener('keydown', e => { const sn = e.target.closest && e.target.closest('.sn[role=button]'); if (sn && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); pick(+sn.dataset.i); } });
render();
}
</script>
</body>
</html>
