<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evidence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Special+Elite&family=Literata:opsz,wght@7..72,400;7..72,600&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* VOICE: a detective's briefing for young readers: short, direct, a little dramatic.
   IDEA: a case file. The passage is the document; wrong guesses get redacted with black bars.
   PICTURE: the passage itself, sentences you tap, blacking out as the clues run short.
   COLOUR and TYPE: manila folder, white paper, black redaction ink, stamp red, highlighter yellow; Special Elite labels, Literata text, Atkinson UI.
   LAYOUT: sticky question slip on top, the document below, verdict under it. */
:root{color-scheme:light dark;
 --bg:light-dark(#eadbb4,#16140f);--folder:light-dark(#d9c38c,#2a261d);--paper:light-dark(#fffdf8,#211f1a);
 --ink:light-dark(#18181d,#ece6d6);--ink2:light-dark(#55525a,#b3ac9b);--ink3:light-dark(#8b8678,#7d776a);
 --line:light-dark(#e3d9c2,#38342a);--bar:light-dark(#18181d,#000);--red:light-dark(#c62828,#ff6b5e);
 --redSoft:light-dark(#fbe3e1,#3b1b18);--hi:light-dark(#ffe14d,#c9a92c);--hiSoft:light-dark(#fff3b0,#3d3516);--top:#18181d;--red2:#c62828}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.55 'Atkinson Hyperlegible',system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{margin:0;font-weight:400;line-height:1.08;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,.sn:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.mono{font-family:'Special Elite',ui-monospace,monospace}
.num{font-variant-numeric:tabular-nums}
header{background:var(--top);color:#f4efe2;position:sticky;top:0;z-index:6}
.hin{max-width:820px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;min-height:56px}
.stamp{font-family:'Special Elite';font-size:20px;letter-spacing:.06em;color:#ff6b5e;border:2.5px solid #ff6b5e;border-radius:6px;padding:2px 10px;transform:rotate(-3deg);display:inline-block}
.pill{margin-left:auto;font-size:15px;background:rgba(255,255,255,.12);border-radius:99px;padding:5px 13px;white-space:nowrap}
main{max-width:820px;margin:0 auto;padding:22px 16px 60px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 22px;border-radius:12px;font-weight:700;font-size:17px;transition:transform .1s}
.btn:active{transform:translateY(1px)}
.dark{background:var(--ink);color:var(--paper)}.redb{background:var(--red);color:#fff}
.link{color:var(--ink2);text-decoration:underline;text-underline-offset:3px;min-height:44px}
/* home */
.hero h1{font-family:'Special Elite';font-size:clamp(40px,8vw,60px)}
.hero p{margin-top:12px;color:var(--ink2);max-width:60ch}
.file{background:var(--paper);border-radius:4px 16px 16px 16px;padding:24px;margin-top:22px;position:relative;box-shadow:0 18px 40px -30px rgba(40,30,0,.6)}
.file::before{content:'';position:absolute;left:0;top:-18px;width:150px;height:18px;background:var(--paper);border-radius:10px 10px 0 0}
@media(max-width:560px){.file{padding:18px 14px}}
.demo{font-family:Literata,Georgia,serif;font-size:17px;line-height:1.8;border-left:3px solid var(--line);padding-left:14px;margin:4px 0 6px}
.lbl{font-family:'Special Elite';font-size:15px;color:var(--ink2);margin:18px 0 8px}
.rules{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:6px}
@media(max-width:620px){.rules{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rule{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--ink2)}
.rule b{display:block;font-family:'Special Elite';font-size:22px;color:var(--ink);font-weight:400}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{min-height:48px;min-width:56px;padding:6px 14px;border:2px solid var(--line);border-radius:12px;font-weight:700;background:var(--paper)}
.opts button[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hist{margin-top:28px}.hist h3{font-family:'Special Elite';font-size:18px;margin-bottom:6px}
.hist table{width:100%;border-collapse:collapse;font-size:15px}
.hist td,.hist th{padding:8px 4px;border-bottom:1px solid var(--line);text-align:left}
.hist th{font-weight:400;color:var(--ink3);font-size:13px}.hist .r{text-align:right}
.empty{color:var(--ink3);font-size:15px}
/* case */
.slip{position:sticky;top:var(--hh,56px);z-index:4;background:var(--paper);border:2px solid var(--ink);border-radius:14px;padding:12px 16px;margin-bottom:16px;box-shadow:0 10px 24px -18px rgba(0,0,0,.6)}
.slip .meta{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink3);flex-wrap:wrap}
.slip .q{font-size:clamp(19px,3.4vw,22px);font-weight:700;margin:4px 0 8px;line-height:1.3}
.worth{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2);flex-wrap:wrap}
.dots{display:flex;gap:5px}.dots i{width:18px;height:18px;border-radius:50%;background:var(--hi);border:2px solid var(--ink)}
.dots i.gone{background:transparent;border-style:dashed;border-color:var(--ink3)}
.doc{background:var(--paper);border-radius:4px 16px 16px 16px;padding:26px 26px 22px;position:relative;box-shadow:0 18px 40px -30px rgba(40,30,0,.6)}
@media(max-width:560px){.doc{padding:18px 14px}}
.doc .kind{font-family:'Special Elite';font-size:14px;color:var(--red)}
.doc h2{font-family:Literata,Georgia,serif;font-weight:600;font-size:clamp(24px,4.5vw,32px);margin:2px 0 14px}
.txt p{font-family:Literata,Georgia,serif;font-size:clamp(17px,2.6vw,19px);line-height:1.85;margin:0 0 14px}
.sn{border-radius:4px;padding:2px 1px;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background .15s,color .15s}
.live .sn[role=button]:hover{background:var(--hiSoft);box-shadow:inset 0 -2px var(--hi)}
.sn.blk{background:var(--bar);color:transparent;cursor:default;user-select:none;-webkit-user-select:none}
.sn.blk *{visibility:hidden}
.sn.miss{color:var(--ink3);text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px;cursor:default;background:var(--redSoft)}
.sn.hit{background:var(--hi);color:#18181d;box-shadow:0 0 0 2px var(--hi);cursor:default}
.sn.reveal{background:var(--hiSoft);box-shadow:0 0 0 2px var(--red);cursor:default}
.done .sn{cursor:default}
.verdict{border-top:2px dashed var(--line);margin-top:6px;padding-top:16px;display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center}
.verdict .big{font-family:'Special Elite';font-size:44px;line-height:1;color:var(--red);grid-row:span 2}
.verdict b{font-size:19px}
.verdict span{color:var(--ink2);font-size:15.5px}
.msg{font-size:15.5px;color:var(--red);min-height:24px;margin-top:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
/* results */
.score{display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;margin-bottom:22px}
@media(max-width:520px){.score{grid-template-columns:1fr;text-align:center;justify-items:center}}
.seal{width:140px;height:140px;border-radius:50%;border:4px double var(--red);color:var(--red);display:grid;place-items:center;text-align:center;transform:rotate(-6deg);font-family:'Special Elite';font-size:34px;line-height:1}
.seal small{display:block;font-size:13px;margin-top:4px}
.score h2{font-family:'Special Elite';font-size:clamp(28px,5vw,38px)}.score p{color:var(--ink2);margin-top:6px}
.tally{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:22px}
@media(max-width:560px){.tally{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tally div{border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;color:var(--ink2)}
.tally b{display:block;font-family:'Special Elite';font-size:28px;color:var(--ink);font-weight:400}
details{border:1.5px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:10px}
summary{cursor:pointer;padding:14px 16px;font-weight:700;min-height:44px}
.rv{padding:10px 16px;border-top:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:15.5px}
.rv .e{font-family:Literata,Georgia,serif;color:var(--ink2);font-size:15px}.rv .e mark{background:var(--hiSoft);color:inherit}
.rv .p{grid-row:1/3;grid-column:2;font-family:'Special Elite';font-size:22px;align-self:center}
.foot{font-size:13px;color:var(--ink3);text-align:center;margin-top:24px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.hin{flex-wrap:wrap}
.apps{display:flex;gap:2px;background:rgba(255,255,255,.1);padding:3px;border-radius:11px;margin-left:auto}
.apps a,.apps span,.apps button{display:inline-flex;align-items:center;min-height:38px;padding:4px 12px;border-radius:8px;font-size:14px;font-weight:700;color:#fff;opacity:.8;text-decoration:none;white-space:nowrap}
.apps a:hover,.apps button:hover{opacity:1;background:rgba(255,255,255,.1)}
.apps [aria-current=page]{background:#fff;color:#18181d;opacity:1}
.pill{margin-left:0}
@media(max-width:520px){.apps{order:3;margin-left:0;width:100%}.apps>*{flex:1;justify-content:center}.pill{margin-left:auto}}
.notice{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border:2px solid var(--red);background:var(--redSoft);border-radius:14px;padding:10px 14px;margin-bottom:16px;font-size:15.5px}
.notice .sp{flex:1}.notice .btn{min-height:44px;padding:8px 18px;text-decoration:none}
.bridge{display:flex;gap:14px;align-items:center;flex-wrap:wrap;border:2px dashed var(--line);border-radius:16px;padding:16px 18px;margin-top:22px;font-size:15.5px;color:var(--ink2)}
.bridge>div{flex:1 1 260px}.bridge b{color:var(--ink)}.bridge .btn{text-decoration:none}
</style>
</head>

n his sister came in."],[0,"She had the bear!"],[0,"She was sorry."],[0,"Max gave her a big hug."],[0,"He was so happy."]],"q":[[[0],"What toy has Max lost?"],[[9],"Who had the bear?"],[[11],"What did Max give his sister?"]]},{"t":"The Seed","k":"Story","s":[[0,"Anna planted a little seed in a pot."],[0,"She put it on the windowsill."],[0,"Every day she gave it water."],[0,"The sun was warm."],[0,"After a week, a small green shoot came up."],[0,"The shoot grew tall."],[0,"Soon it had two green leaves."],[0,"Then a yellow flower opened."],[0,"Anna was so proud."],[0,"She had grown her first flower."]],"q":[[[1],"Where did Anna put the pot?"],[[4],"How long did it take for the shoot to come up?"],[[7],"What colour was the flower?"]]}],"2":[{"t":"The New Bike","k":"Story","s":[[0,"On Saturday morning, Jack got a surprise."],[0,"His dad called him to the garden."],[0,"There, standing on the grass, was a shiny new blue bike!"],[0,"Jack could not believe it."],[0,"His birthday was not until next week."],[0,"'It is an early present,' said Dad with a smile."],[0,"The bike had silver bells and black handles."],[0,"Jack climbed on."],[0,"He wobbled a little at first."],[0,"Then he rode around the garden three times."],[0,"By lunchtime, he could ride without holding on."],[0,"Jack felt very proud."]],"q":[[[2],"What colour is the new bike?"],[[4],"Why is the bike called an early present?"],[[10],"When could Jack ride without holding on?"]]},{"t":"The School Trip","k":"Story","s":[[0,"Year 2 went to the zoo on Tuesday."],[0,"They got on the bus at nine o'clock."],[0,"The bus took an hour to get there."],[0,"First they saw the elephants."],[0,"The big elephant was washing itself with its trunk."],[0,"Next they walked to the monkey house."],[0,"The monkeys were eating bananas and swinging from ropes."],[0,"After lunch, they saw the penguins splash in the cold water."],[0,"Miss Brown gave each child a sticker."],[0,"On the way home, most of the children fell asleep on the bus."]],"q":[[[1],"What time did they get on the bus?"],[[4],"What was the big elephant doing?"],[[9],"What did most children do on the way home?"]]},{"t":"The Lost Puppy","k":"Story","s":[[0,"Mia was walking home from the shop when she heard a small whimper."],[0,"She looked behind a bush and saw a tiny brown puppy."],[0,"He had no collar and his fur was dirty."],[0,"Mia gently picked him up."],[0,"The puppy licked her hand."],[0,"She carried him home and showed her mum."],[0,"Mum said they must try to find his owner."],[0,"They put a picture on the door of the shop."],[0,"The next day, a kind old man came."],[0,"He had been looking for his puppy for two days."]],"q":[[[1],"Where did Mia find the puppy?"],[[2],"How can you tell the puppy did not have a home?"],[[9],"How long had the man been looking for his puppy?"]]},{"t":"A Day on the Boat","k":"Story","s":[[0,"Last summer, my family went on a small boat."],[0,"The sea was calm and blue."],[0,"My uncle is a fisherman and he taught me how to hold a rod."],[0,"I sat very still for a long time."],[0,"Then, suddenly, my rod began to bend!"],[0,"I pulled hard."],[0,"After a few minutes, I caught a silver fish."],[0,"It was as long as my arm."],[0,"My little sister was so excited that she clapped her hands."],[0,"We took the fish home for dinner."],[0,"It tasted delicious with lemon."]],"q":[[[2],"Who taught the writer to hold a fishing rod?"],[[7],"How long was the fish?"],[[10],"What did they eat the fish with?"]]},{"t":"The Magic Pebble","k":"Story","s":[[0,"Tom found a strange pebble on the path."],[0,"It was smooth and warm in his hand."],[0,"When he closed his fingers around it, a tiny voice spoke."],[0,"'I can grant you one wish,' said the pebble."],[0,"Tom thought hard."],[0,"He did not wish for sweets or toys."],[0,"Instead, he wished that his old dog, Rusty, would feel young again."],[0,"When he got home, Rusty was waiting at the door."],[0,"The old dog ran and jumped like a puppy!"],[0,"Tom hugged Rusty and put the pebble back on the path for someone else to find."]],"q":[[[1],"How did the pebble feel?"],[[6],"What did Tom wish for?"],[[9],"What did Tom do with the pebble at the end?"]]},{"t":"The Cooking Lesson","k":"Story","s":[[0,"On Sunday, Grandma showed me how to bake bread."],[0,"First, we washed our hands very carefully."],[0,"Then she gave me flour, water, salt, and a tiny packet of yeast."],[0,"I mixed everything in a big bowl until it became sticky dough."],[0,"Grandma showed me how to push the dough with my hands."],[0,"This is called kneading."],[0,"We left the dough in a warm place for one hour and it grew much bigger!"],[0,"After baking, the kitchen smelled wonderful."],[0,"We ate the warm bread with butter and honey."]],"q":[[[2],"What did Grandma give the writer to make bread?"],[[5],"What is pushing the dough called?"],[[6],"How long was the dough left in a warm place?"]]},{"t":"The Football Match","k":"Story","s":[[0,"Our team was playing the final match of the year."],[0,"We were three goals to two down at half-time."],[0,"Coach Lee told us not to give up."],[0,"He said, 'You must work together as a team.'"],[0,"In the second half, I passed the ball to Sam."],[0,"Sam shot, but the goalkeeper saved it."],[0,"With only one minute left, my friend Aya got the ball."],[0,"She kicked it hard and the ball flew into the top corner of the net!"],[0,"The score was three all."],[0,"Then the whistle blew and the match was a draw."]],"q":[[[1],"What was the score at half-time?"],[[2],"What did Coach Lee tell the team?"],[[9],"How did the match end?"]]},{"t":"The Storm","k":"Story","s":[[0,"The dark clouds rolled in just after lunch."],[0,"Soon the wind began to howl and the trees bent over."],[0,"Big drops of rain hit the window."],[0,"CRASH!"],[0,"A loud noise made Lucy jump."],[0,"It was thunder."],[0,"A flash of lightning lit up the room."],[0,"Lucy was a little bit frightened, so her brother brought her a torch and a soft blanket."],[0,"They sat under the table and read a book together."],[0,"After an hour, the storm passed."],[0,"The sun came out, and outside they could see a beautiful rainbow."]],"q":[[[0],"When did the dark clouds come?"],[[7],"What did Lucy's brother bring her?"],[[10],"What could they see after the storm?"]]},{"t":"The Library","k":"Story","s":[[0,"Our school library is at the end of the long corridor."],[0,"The walls inside are painted pale yellow and there are soft cushions on the floor."],[0,"Mrs Singh, the librarian, knows the name of every child in the school."],[0,"She smiles when she sees us and helps us find books."],[0,"On Wednesdays, she reads a story to Year 2."],[0,"Last week, she read a story about a dragon who was afraid of fire."],[0,"It was so funny that we all laughed."],[0,"We can take one book home each week if we promise to return it."]],"q":[[[0],"Where is the school library?"],[[2],"Who is Mrs Singh?"],[[7],"How many books can each child take home?"]]},{"t":"The Camping Trip","k":"Story","s":[[0,"Dad packed the car early on Saturday morning."],[0,"We were going camping in the mountains."],[0,"After a two-hour drive, we arrived at a quiet spot beside a clear stream."],[0,"First, we put up the green tent."],[0,"It was much harder than I expected."],[0,"Then Dad built a fire from small sticks and we cooked sausages for dinner."],[0,"At night the sky was full of bright stars."],[0,"We even heard an owl hooting in the trees."],[0,"I was nervous at first, but inside the tent I felt safe and warm."]],"q":[[[1],"Where was the family going camping?"],[[4],"Which sentence shows that putting up the tent was not easy?"],[[7],"What animal did they hear at night?"]]}],"3":[{"t":"The Treehouse","k":"Narrative","s":[[0,"Last summer, my older brother Sam and I decided to build a treehouse in the apple tree at the bottom of the garden."],[0,"We had no idea what we were doing."],[0,"Dad gave us some old planks of wood, a hammer and a small box of nails."],[0,"He smiled and said, 'Good luck — try not to lose any fingers.'"],[1,"It took us two whole weeks."],[1,"On the first day, we drew a plan on a sheet of paper."],[1,"The plan was very ambitious — it even included a balcony and a rope ladder."],[1,"By the end of week one, we had only managed to nail four planks together."],[1,"Sam said the plan was probably 'a bit too clever for us'."],[2,"In the end, our treehouse was much smaller than we had hoped, and the floor was a little wobbly."],[2,"But when we climbed up and sat inside on the very first night, watching the stars through the leaves, it felt like the best place in the whole world."]],"q":[[[2],"What did Dad give the children to build with?"],[[4],"How long did it take to build the treehouse?"],[[9],"What was wrong with the floor of the treehouse?"]]},{"t":"All About Owls","k":"Information text","s":[[0,"Owls are fascinating birds of prey that live on every continent except Antarctica."],[0,"There are around 200 different species of owl, ranging from the tiny elf owl, which is only 13 centimetres tall, to the huge Eurasian eagle owl, which has a wingspan of nearly two metres."],[1,"Most owls are nocturnal, which means they are awake at night and sleep during the day."],[1,"Their large, round eyes are perfectly designed for seeing in the dark."],[1,"However, owls cannot move their eyes from side to side like humans can."],[1,"Instead, they turn their whole head — sometimes almost all the way round!"],[2,"Owls have another remarkable skill: silent flight."],[2,"Special soft edges on their feathers stop the air from making a noise as they fly."],[2,"This means a mouse or a vole on the ground below has very little warning before the owl swoops down to catch it."],[3,"A baby owl is called an owlet."],[3,"Owlets are usually born covered in soft, fluffy white feathers called down."]],"q":[[[0],"On which continent do owls not live?"],[[4,5],"How do owls look to the side?"],[[7],"Why do owls fly silently?"]]},{"t":"My First Sleepover","k":"First-person narrative","s":[[0,"I had been looking forward to my first sleepover for weeks."],[0,"My best friend, Priya, had invited four of us to her house for the night."],[0,"I packed my bag two days early, just to make sure I had everything."],[1,"When the day finally came, my stomach felt strange — a mix of excited and nervous."],[1,"Mum hugged me at the front door of Priya's house."],[1,"'You'll have a wonderful time,' she said."],[1,"But as soon as she drove away, I suddenly wanted to run after her car."],[2,"The evening was fine."],[2,"We ate pizza and watched a film about a magical bakery."],[2,"But at bedtime, lying on my camping mat in Priya's room, I started to feel very small."],[2,"The room was dark and full of strange shadows."],[2,"I missed my own bed."],[2,"I missed Mum."],[2,"I almost cried."],[3,"Then Priya whispered, 'Are you OK?'"],[3,"I told her the truth."],[3,"To my surprise, she said she had felt exactly the same at her first sleepover."],[3,"After that, I felt much better, and soon I fell asleep."]],"q":[[[2],"How do we know the writer was looking forward to the sleepover?"],[[8],"What did they eat at the sleepover?"],[[16],"What did Priya say that helped the writer?"]]},{"t":"Banana Bread","k":"Recipe / instructional","s":[[0,"Banana bread is a sweet, soft cake that tastes amazing with butter on top."],[0,"It is also a clever way to use up bananas that have gone a bit too soft to eat."],[0,"Always ask an adult to help you, especially when using the oven."],[1,"Ingredients: 3 very ripe bananas, 100g of soft butter, 150g of sugar, 2 eggs, 200g of plain flour, 1 teaspoon of baking powder."],[2,"Method: First, heat the oven to 180°C."],[2,"Grease a loaf tin with a little butter."],[2,"Next, mash the bananas in a large bowl until they are smooth."],[2,"Add the butter and sugar, and mix well."],[2,"Then crack in the eggs, one at a time, and stir."],[2,"Finally, add the flour and baking powder."],[2,"Mix until you have a thick, sticky batter."],[2,"Pour the mixture into the tin and bake for about 50 minutes."],[3,"Your banana bread is ready when a skewer pushed into the middle comes out clean."],[3,"Let it cool before slicing."]],"q":[[[1],"Why is banana bread a clever thing to make?"],[[4],"How hot should the oven be?"],[[12],"How do you know when the banana bread is ready?"]]},{"t":"A Letter from Camp","k":"Letter","s":[[0,"Dear Mum and Dad,"],[1,"I have been at Camp Pinewood for three days now and I want to tell you everything."],[1,"Our cabin is called Squirrel Lodge."],[1,"There are six of us in the cabin and our group leader is called Mia."],[1,"She is from Canada and very funny."],[2,"On the first day, it rained from morning until evening, so we played board games and made friendship bracelets in the hall."],[2,"I made a blue and yellow one for my sister."],[2,"I hope she likes it."],[3,"Yesterday was much better."],[3,"We went canoeing on the lake!"],[3,"I was nervous at first because I had never been in a canoe before, but my partner was a girl called Sara and she had done it lots of times."],[3,"She taught me how to hold the paddle properly."],[3,"Now I love it."],[4,"Tonight we are going to have a campfire and toast marshmallows."],[4,"Mia says some children always burn theirs because they don't have any patience."],[5,"Please write back soon."],[5,"Tell Buster I miss him."],[6,"Love, Theo"]],"q":[[[3],"What is the name of the group leader?"],[[5],"What did the children do on the rainy first day?"],[[10],"Why was Theo nervous about canoeing?"]]},{"t":"The Old Lighthouse","k":"Descriptive","s":[[0,"At the very end of the cliffs stood the old lighthouse."],[0,"It had been painted red and white once, but the salty wind and the lashing rain had stripped away most of the colour."],[0,"Now it looked grey and tired, like an old man leaning against the rocks."],[1,"No one had lived in the lighthouse for many years."],[1,"The door was locked with a heavy iron padlock."],[1,"The windows were dark and dusty."],[1,"Sometimes, on stormy nights, the villagers said you could still hear footsteps inside, climbing slowly up the spiral staircase."],[1,"Most people thought it was just the sound of the wind in the empty tower."],[2,"A little girl called Eliza did not believe them."],[2,"Every Saturday, she walked up the cliff path with her grandfather, and they sat on a bench and watched the lighthouse together."],[2,"'One day,' she would say, 'someone will light that lamp again, and ships will see it from the sea.'"],[2,"Her grandfather would smile and squeeze her hand, but he would never say a word."]],"q":[[[1],"What took the colour off the lighthouse?"],[[4],"How is the lighthouse door locked?"],[[7],"What did most people think the footsteps really were?"]]},{"t":"How to Look After a Goldfish","k":"Care guide","s":[[0,"Goldfish are popular pets, but they need more care than many people think."],[0,"A goldfish can live for over ten years if it is looked after properly."],[1,"First, choose the right tank."],[1,"A goldfish needs at least 75 litres of water — small round bowls are not suitable, even though shops still sell them."],[1,"Goldfish produce a lot of waste, so a bowl quickly becomes dirty and unhealthy."],[2,"Second, feed your fish a small pinch of food twice a day."],[2,"Many goldfish die because their owners feed them too much."],[2,"If there is uneaten food at the bottom of the tank after a few minutes, you have given them too much."],[3,"Third, change about a third of the water every week."],[3,"Use a clean bucket and add water that is the same temperature as the water in the tank."],[3,"If the new water is too cold or too warm, it can shock the fish."],[4,"Finally, keep the tank away from direct sunlight and noisy areas."],[4,"Goldfish prefer a calm, quiet environment, just like many of us."]],"q":[[[1],"How long can a goldfish live?"],[[4],"Why are small round bowls bad for goldfish?"],[[6],"Why do many goldfish die?"]]},{"t":"The Mystery of the Missing Lunch","k":"Mystery / narrative","s":[[0,"Every Tuesday, Mr Park's class went outside for an hour of forest school."],[0,"They would leave their lunch boxes neatly stacked in the cloakroom and head out into the school woods."],[1,"One Tuesday in April, Lily came back ravenous after running around all morning."],[1,"But when she opened her lunch box, her cheese sandwich and her apple were gone."],[1,"In their place was a single crumb and a strange muddy paw print."],[2,"The same thing happened the next week to Daniel — and the week after that, to two more children."],[2,"Mr Park said it must be 'a thieving fox'."],[2,"The school caretaker, Mr Roy, was not so sure."],[2,"'A fox would knock over the bin,' he said, scratching his head, 'not open a lunch box neatly.'"],[3,"The mystery was solved on the fourth Tuesday."],[3,"Lily went back inside early because she had hurt her knee."],[3,"She tiptoed to the cloakroom and there, sitting in the middle of the floor with a sandwich in his paws, was the caretaker's small ginger cat, Biscuit."],[3,"He had crept in through the open window."]],"q":[[[3],"What was missing from Lily's lunch box?"],[[8],"Why did Mr Roy think it was not a fox?"],[[11],"Who was really taking the lunches?"]]},{"t":"Volcanoes","k":"Information / science","s":[[0,"A volcano is an opening in the Earth's surface through which hot, melted rock — called magma — can escape."],[0,"When magma reaches the surface and flows out, it is called lava."],[0,"Lava can be hotter than 1,000°C, which is hot enough to set wood on fire just by being near it."],[1,"There are more than 1,500 active volcanoes on Earth."],[1,"'Active' means a volcano that has erupted recently or might erupt again soon."],[1,"Many of them are found around the edges of the Pacific Ocean, in a curved area known as the Ring of Fire."],[2,"Not all eruptions are the same."],[2,"Some volcanoes explode suddenly with huge clouds of ash and rock."],[2,"Others ooze lava more gently, like thick honey running down a hill."],[2,"Scientists who study volcanoes are called volcanologists."],[2,"They use special equipment to listen to the ground and try to predict when an eruption might happen, but it is not always easy."],[3,"Although volcanoes can be dangerous, the ash they release makes the surrounding soil very rich, and farmers often grow excellent crops nearby."]],"q":[[[1],"What is magma called when it flows out of a volcano?"],[[5],"Where are many active volcanoes found?"],[[11],"Why do farmers often grow good crops near volcanoes?"]]},{"t":"The Best Day of the Holiday","k":"Descriptive personal narrative","s":[[0,"If you asked me to choose the best day of our whole summer holiday, I would not even have to think about it."],[0,"It was the day we went to the floating market."],[1,"We took a tiny wooden boat down a brown, slow river."],[1,"The sun was so bright that I had to keep one hand over my eyes."],[1,"All around us, other boats glided past — hundreds of them, all painted in different colours."],[1,"Some were piled high with mountains of fruit: scarlet dragon fruit, golden mangoes, and bunches of green bananas tied with string."],[1,"Others sold steaming bowls of noodles, which the seller passed across the water on a long bamboo pole."],[2,"A woman in a wide straw hat smiled at my little brother and gave him a slice of pineapple."],[2,"He grinned with juice all down his chin."],[2,"I bought a pink lotus flower for fifty pence to give to Grandma when we got home."],[3,"That night, falling asleep, I could still hear the river, the splashing paddles, and the bright, happy voices of the sellers in my head."]],"q":[[[1],"What was the best day of the holiday?"],[[6],"How did the seller pass noodles across the water?"],[[9],"What did the writer buy for Grandma?"]]}],"4":[{"t":"The Magic Telescope","k":"Narrative","s":[[0,"My grandfather's attic was always strictly off-limits."],[0,"So when Mum gave me the key on my tenth birthday, I climbed the wooden ladder with a feeling somewhere between excitement and fear."],[0,"Dust danced in the slanting light from the single round window."],[1,"In the far corner, half-hidden behind a tattered curtain, stood a brass telescope on three slender legs."],[1,"It was almost as tall as me."],[1,"I turned it carefully towards the window, breathed on the lens, and looked up at the afternoon sky."],[2,"What I saw made me gasp in disbelief."],[2,"The sun was not where it should have been."],[2,"Strange ringed planets hung where, only seconds before, there had been only cloud."],[2,"Through the eyepiece I could see oceans, mountains, and tiny lights that might have been cities."],[3,"I lowered the telescope slowly."],[3,"Through the window, the sky was perfectly ordinary: blue, with a few harmless clouds."],[3,"I raised it again."],[3,"The strange world returned."],[4,"For an hour I stood there, looking from one impossible sky to another, my breath quickening."],[4,"I knew, somehow, that I must not tell anyone — not yet."],[4,"Some discoveries are too precious to share."]],"q":[[[1],"When was the writer given the key to the attic?"],[[3],"Where in the attic was the telescope?"],[[11],"What did the sky look like without the telescope?"]]},{"t":"Honey Bees","k":"Information text","s":[[0,"Honey bees are highly social insects that live in large groups called colonies."],[0,"A single colony can contain tens of thousands of bees, and every member has a particular job to do."],[1,"At the heart of every colony is the queen, the only bee in the hive who lays eggs."],[1,"She can produce up to two thousand eggs in a single day."],[1,"Worker bees, all female, do almost everything else: they collect nectar, look after the young, and defend the hive."],[1,"Male bees, called drones, have just one role — to mate with a new queen."],[2,"When a worker bee finds a good source of flowers, she returns home and performs a special 'waggle dance'."],[2,"The angle and speed of the dance tell the other bees the direction and distance of the food."],[2,"It is one of the most remarkable communication systems in the animal kingdom."],[3,"Bees are not only fascinating; they are essential to our world."],[3,"About one in every three mouthfuls of food we eat depends on a bee for pollination."],[3,"Unfortunately, bee populations have been falling for years, partly because of pesticides and lost habitats."],[3,"Many scientists are now trying to find ways to protect them."]],"q":[[[2],"What is special about the queen bee?"],[[7],"What does the waggle dance tell other bees?"],[[11],"Why have bee numbers been falling?"]]},{"t":"Moving House","k":"First-person","s":[[0,"On the morning we left our old house, I stood for a long time in my empty bedroom, trying to remember every detail."],[0,"The little scratch on the door where I had once dragged a chair."],[0,"The patch on the carpet where my paint pot had spilled."],[0,"The view from the window: the same cherry tree I had watched bloom every year for as long as I could recall."],[1,"Dad's voice called up the stairs."],[1,"'Sasha, we have to go!'"],[1,"His tone was kind, but I could hear the edge of impatience in it."],[1,"We had a long drive ahead."],[2,"In the car, I pressed my forehead against the cool window."],[2,"Houses I had passed every day slid by for the last time: the corner shop, my old primary school, the funny green house with the crooked gate."],[2,"None of them noticed I was leaving."],[3,"The new house, when we arrived, was lovely to be honest."],[3,"The garden was huge and there was a tiny wood at the end of it."],[3,"My room was bigger than my old one."],[3,"But I could not manage smiling, not yet."],[3,"I needed time."],[4,"That night, I sat by the new window and watched a moon I did not recognise."],[4,"It rose over rooftops I had never seen."],[4,"Slowly, I started to feel that, perhaps, one day, this place might also feel like a home."]],"q":[[[3],"What could Sasha see from her old window?"],[[6],"How did Dad's voice sound when he called?"],[[12],"What was at the end of the new garden?"]]},{"t":"How to Make a Paper Aeroplane","k":"Instructional","s":[[0,"With patience and practice, you can make a paper aeroplane that flies surprisingly far."],[0,"All you need is a single sheet of A4 paper."],[1,"First, place the paper on a flat surface in front of you, with the short edge nearest."],[1,"Fold it exactly in half lengthways, then open it again so you can see a clear crease running down the middle."],[2,"Next, take the two top corners and fold them inwards, so that they meet neatly at the centre line."],[2,"You should now have a triangular point at the top of the paper."],[2,"This will become the nose of your aeroplane."],[3,"Now fold the slanted edges in towards the middle once more."],[3,"The nose should become longer, narrower and sharper."],[3,"Fold the whole shape in half, with the points pointing outwards."],[4,"Finally, create the wings by folding each side down so that the lower edge of the wing is parallel to the bottom of the aeroplane's body."],[4,"Make sure both wings are exactly the same size; otherwise, your plane will spin or tilt to one side."],[5,"To throw, hold the body firmly between your thumb and forefinger."],[5,"Aim slightly upwards and release with a gentle, smooth flick."],[5,"With a little adjustment, you should soon be able to make your aeroplane glide gracefully across the room."]],"q":[[[1],"What do you need to make the aeroplane?"],[[6],"What does the triangular point become?"],[[11],"What happens if the wings are not the same size?"]]},{"t":"Letter to a Penpal","k":"Letter","s":[[0,"Dear Yuki,"],[1,"Thank you so much for your last letter and the beautiful photograph of cherry blossoms."],[1,"They are now stuck above my desk where I can see them every day."],[1,"It is hard to believe we have been writing to each other for nearly a year already!"],[2,"I am pleased to hear that you are still enjoying the violin."],[2,"Six lessons a week sounds exhausting, but I can tell you really love it."],[2,"I have started learning the guitar this term, but I am afraid I am not as talented as you."],[2,"My fingers keep getting tangled on the strings."],[3,"Things are going well at school."],[3,"Last week our class went on a trip to a Roman villa, where we saw real mosaics that were almost two thousand years old."],[3,"It is strange to think that the people who lived there ate, laughed and argued over their homework, just like we do."],[4,"You asked about my summer plans."],[4,"My family and I are going to visit my grandmother in Scotland."],[4,"I will try to take some photos of the lochs and include them in my next letter."],[5,"Please write soon and tell me all about your school festival."],[5,"I cannot wait to hear what play your class is performing."],[6,"Your friend, Olivia"]],"q":[[[2],"Where did Olivia put the photograph?"],[[7],"Why is Olivia finding the guitar difficult?"],[[12],"Where is Olivia going in the summer?"]]},{"t":"The Abandoned Garden","k":"Descriptive","s":[[0,"At the end of our road stood a tall iron gate, half-eaten by rust."],[0,"Beyond it lay a garden no one had touched for decades."],[0,"The path that had once led to the house was now buried in moss and brambles, so thick that I could only just make out the shape of the front door beneath the tangled ivy."],[1,"I had walked past this garden hundreds of times, but I had never dared to look inside properly."],[1,"That afternoon, with the long summer holiday before me and no one waiting for me at home, curiosity got the better of me."],[2,"The gate gave way with a mournful creak."],[2,"Inside, the air was somehow cooler and stranger, as if I had stepped through a curtain into a different world."],[2,"A stone fountain stood in the middle, its bowl filled not with water but with dead leaves and a single, perfect spider's web."],[2,"To one side, a wooden bench had been once painted blue, but the colour had now faded to a soft greyish-white."],[3,"I sat down very carefully on the bench."],[3,"A robin landed on the rim of the fountain, watched me for a moment with its black, beadlike eye, and then flew away."],[3,"The whole garden seemed to be holding its breath, waiting to see what I would do next."]],"q":[[[0],"What is the gate at the end of the road like?"],[[7],"What was in the fountain instead of water?"],[[10],"Which animal landed on the fountain?"]]},{"t":"Why We Should Recycle More","k":"Persuasive","s":[[0,"Every day, the average British family throws away enough rubbish to fill a wheelie bin, and most of that rubbish could have been recycled."],[0,"This matters more than many people realise."],[0,"Unless we change our habits, mountains of plastic, paper and metal will continue to fill up our landfill sites and poison our oceans."],[1,"Recycling is not difficult as some claim."],[1,"Most councils now provide separate bins for paper, plastic, glass and food waste."],[1,"Sorting your rubbish takes only a few extra seconds a day, yet the impact is enormous."],[2,"Firstly, consider plastic."],[2,"A plastic bottle thrown into a normal bin may take up to 450 years to break down."],[2,"The same bottle, placed in the recycling, can be turned into clothing, garden furniture or even a new bottle within a few weeks."],[2,"That is a remarkable difference."],[3,"There are those who argue that recycling does not matter because the problem is too big for one person to solve."],[3,"This is simply not true."],[3,"If every household in the country recycled just one extra item per day, the savings would be enormous."],[4,"The real question is not whether recycling helps."],[4,"The real question is why we would choose to do less when doing more is so easy."],[4,"The Earth is the only home we have, and it is high time we started treating it with the respect it deserves."]],"q":[[[0],"How much rubbish does the average family throw away each day?"],[[7],"How long can a plastic bottle take to break down in a normal bin?"],[[12],"What does the writer say would happen if every home recycled one more item a day?"]]},{"t":"The Strange Footprints in the Snow","k":"Mystery","s":[[0,"It had snowed all night."],[0,"When I drew back the curtains at seven o'clock, the world had been wrapped in a perfect white blanket."],[0,"My little sister, Clara, ran into my room in her pyjamas, half-crying with excitement."],[1,"'Look!"],[1,"Sledging!' she shouted."],[1,"But I was already looking at something else."],[2,"There, in our front garden, was a single line of footprints."],[2,"They came from the road, walked straight up to our front door, and then — and this is the part that I still do not understand — they stopped."],[2,"They did not turn around."],[2,"They did not go back."],[2,"They simply ended, as if whoever had made them had been lifted up into the sky."],[3,"I checked the snow on the doorstep itself."],[3,"It was untouched — no one had stood on it."],[3,"I went outside in my slippers and walked all around the house."],[3,"There were no other prints anywhere."],[3,"Not a single mark."],[4,"Dad came down and laughed, of course."],[4,"'A bird,' he said."],[4,"'Or a cat."],[4,"The wind has covered the rest.'"],[4,"But there had been no wind in the night, and these prints were clearly made by something on two feet."],[4,"Something that had walked up to our door, paused, and then vanished."],[5,"For weeks afterwards, I would wake up in the middle of the night and listen, half-expecting to hear a knock that never came."],[5,"To this day, I do not know what walked up to our house that morning."],[5,"But I do know one thing: I am certain that I will never forget those footprints in the snow."]],"q":[[[1],"What time did the writer open the curtains?"],[[7],"Where did the footprints stop?"],[[20],"Why does the writer not believe it was a bird or a cat?"]]},{"t":"Inside a Tornado","k":"Science","s":[[0,"A tornado is one of the most dramatic phenomena in nature: a violent, spinning column of air that reaches from a thundercloud all the way down to the ground."],[0,"The wind speeds inside the worst tornadoes can exceed 300 miles per hour — more than three times faster than a Formula 1 car at top speed."],[1,"Tornadoes form when warm, moist air near the ground meets cold, dry air from above."],[1,"The two layers begin to rotate, and the spinning motion creates a funnel."],[1,"If this funnel reaches the surface, it becomes a tornado."],[1,"The whole process can take less than half an hour, which is why tornadoes are so hard to predict."],[2,"The damage a tornado can cause is devastating."],[2,"Roofs are ripped from houses, cars are tossed like toys, and entire forests are flattened in seconds."],[2,"Yet, in the centre of every tornado, there is a strange area called the 'eye' where the wind drops and the air becomes strangely calm."],[2,"People who have survived being in the eye have described an eerie silence and even, in some cases, a patch of blue sky visible directly overhead."],[3,"Scientists called storm chasers pursue tornadoes deliberately, driving towards them in specially built vehicles in order to take measurements."],[3,"Thanks to their bravery, we now know far more about how tornadoes work than we did even twenty years ago."]],"q":[[[1],"How fast can the wind be inside the worst tornadoes?"],[[5],"Why are tornadoes so hard to predict?"],[[8],"What is the calm area in the centre of a tornado called?"]]},{"t":"Sports Day","k":"Recount","s":[[0,"Sports Day is, without a doubt, the greatest event of the school year — at least, it is for me."],[0,"I had been training for the long-distance race for months, getting up early in the dark to run laps of the local park before school."],[1,"The morning of the race was bright and warm."],[1,"As I lined up at the start, butterflies were fluttering in my stomach."],[1,"To my right was Maya, last year's winner; to my left, Daniel, who had been boasting across the field that I would 'lose by a mile'."],[1,"I tried to ignore him."],[2,"The whistle blew."],[2,"Maya shot off like a rocket, with Daniel close behind."],[2,"For the first lap, I forced myself to stay calm and keep my pace steady."],[2,"I could hear my parents shouting somewhere on the sidelines, but I did not dare look up."],[2,"By the third lap, Daniel had fallen behind, his face red and his breathing ragged."],[2,"Maya was still ahead, but only just."],[3,"On the final straight, with the finish line in sight, I breathed deep and pushed harder than I ever had in my life."],[3,"My lungs were burning."],[3,"My legs felt like jelly."],[3,"But somehow, in the last few metres, I overtook Maya by a single step."],[4,"When the medal was placed around my neck, I could barely speak."],[4,"All those early mornings had been worth it."]],"q":[[[1],"How did the writer train for the race?"],[[4],"What had Daniel been saying before the race?"],[[15],"How did the writer beat Maya?"]]}],"5":[{"t":"The Mountain Hike","k":"Narrative","s":[[0,"By the time we reached the halfway point, my legs were trembling and my water bottle was almost empty."],[0,"Dad, ten metres ahead of me on the rocky path, turned round and grinned."],[0,"'Still alive back there?' he called."],[0,"I forced myself to nod, although I had been tempted to suggest turning back for the past hour."],[1,"We had set off from the village at dawn, climbing through silent pine forests on a path that grew steeper with every step."],[1,"Now, above the tree line, the wind was sharper and the view was spectacular."],[1,"To one side, the valley dropped away into a sea of mist; to the other, the mountain itself rose like an enormous, jagged tooth."],[2,"After a brief rest, we pressed on."],[2,"Dad's pace was, as ever, relentless."],[2,"Mine was less so."],[2,"Twice I slipped on loose stones, and once I had to perch on a small boulder to recover my breath."],[2,"Dad did not rush me."],[2,"He simply waited, patient as the mountain itself."],[3,"The last hour was the hardest."],[3,"The path almost vanished, and we had to haul our way upwards using both hands."],[3,"My fingers grew numb."],[3,"My nose ran."],[3,"I started to wonder, seriously, whether the summit would ever actually arrive."],[4,"And then, suddenly, it did."],[4,"One moment I was scrambling over a rock; the next, there was nothing above me but sky."],[4,"I stood, panting, while Dad clapped me on the shoulder."],[4,"He did not say a word."],[4,"He did not need to."],[4,"From up there, the world looked enormous, fragile and beautiful, and I felt that I could see it properly for the first time in my life."]],"q":[[[4],"When did they set off from the village?"],[[12],"Which sentence shows that Dad was patient?"],[[23],"How did the world look from the summit?"]]},{"t":"The Coral Reef","k":"Information","s":[[0,"Coral reefs are sometimes called the rainforests of the sea — and with good reason."],[0,"Although they cover less than one per cent of the ocean floor, they are home to nearly a quarter of all marine species."],[0,"From clownfish hiding among waving sea anemones to giant turtles cruising lazily overhead, the variety of life on a coral reef is breathtaking."],[1,"Coral itself is not a plant, though it might resemble one."],[1,"It is, in fact, made up of thousands of tiny creatures called polyps."],[1,"Each polyp is barely the size of a pinhead, but together they can build structures that stretch for hundreds of miles."],[1,"The Great Barrier Reef off the coast of Australia, the largest reef on Earth, is so vast it can be seen from space."],[2,"The bright colours of healthy coral come from a special kind of algae that lives inside the polyps."],[2,"The two are partners: the algae make food using sunlight, and the polyps provide shelter."],[2,"Unfortunately, this delicate balance is now under serious threat."],[2,"When the sea becomes too warm, the corals get rid of their algae and lose their colour — a process called 'bleaching'."],[2,"If the algae do not return quickly, the coral will die."],[3,"Rising sea temperatures, pollution and overfishing have already damaged huge sections of reef around the world."],[3,"Some scientists fear that, without urgent action, most coral reefs may disappear from the planet within a single generation."],[3,"Saving them will require enormous international cooperation — but the cost of failing to act, both for marine life and for the millions of people who depend on the reefs, would be even higher."]],"q":[[[1],"How much of the ocean floor do coral reefs cover?"],[[4],"What is coral made up of?"],[[10],"What is 'bleaching'?"]]},{"t":"Starting at a New School","k":"First-person","s":[[0,"For the first three days at my new school, I did not say a single word."],[0,"Not to the boy with the freckles who sat next to me in maths, not to the friendly girl who tried to include me at break, not even to the teachers."],[0,"I think people must have decided I was rude, or very unfriendly, but the truth was that I simply could not bring myself to speak."],[1,"It was not that I was shy."],[1,"At my old school, I had been the loud one, the one who made everyone laugh."],[1,"But everything here was different."],[1,"The corridors were longer."],[1,"The lessons were harder."],[1,"Even the way the other children spoke seemed faster and somehow sharper than I was used to."],[2,"On the fourth day, something small but important happened."],[2,"We had been told to find a partner for a science experiment."],[2,"While everyone else claimed a friend, I stood alone, my heart sinking."],[2,"Then a girl I had not noticed before — small, dark-haired, with a quiet smile — walked over to me and said, simply, 'Want to work together?'"],[3,"Her name was Hana."],[3,"She was new too."],[3,"Within an hour, we were laughing about the strange smell coming from another group's beaker."],[3,"By the end of the lesson, I had spoken more words than in the rest of the week combined."],[4,"I think back to that moment often."],[4,"Hana could easily have asked anyone else."],[4,"She did not have to choose me."],[4,"But that one small act of kindness — of crossing the room and saying hello — completely changed the way I felt about my new school."],[4,"Now, two years later, we are still best friends, and I try, whenever I can, to do the same thing for someone else."]],"q":[[[0],"For how long did the writer not speak at the new school?"],[[4],"What was the writer like at the old school?"],[[14],"What did Hana have in common with the writer?"]]},{"t":"Looking After a Bonsai Tree","k":"Instructional","s":[[0,"A bonsai tree is not a species of plant."],[0,"It is, in fact, an ordinary tree — most often a juniper, pine or maple — that has been kept small through years, sometimes decades, of careful pruning and shaping."],[0,"Owning one is a long-term commitment, and it requires patience as much as enthusiasm."],[1,"Position your bonsai where it will receive plenty of indirect light, but not the harsh sunlight of a south-facing windowsill, which can scorch the delicate leaves."],[1,"Most varieties do well in a cool, well-ventilated room."],[1,"Avoid radiators and draughts."],[2,"Watering is perhaps the most crucial part of bonsai care."],[2,"Because the pot is so small, the soil can dry out quickly — especially in summer — but it can also become waterlogged with surprising ease."],[2,"A simple test is to push your finger about a centimetre into the soil."],[2,"If it feels dry, water generously, allowing the excess to drain away through the holes in the base."],[2,"If it feels damp, wait a day or two."],[3,"Pruning is what gives a bonsai its distinctive shape."],[3,"Using a small, sharp pair of scissors, snip away any new shoots that grow longer than the surrounding ones."],[3,"Aim for a balanced silhouette: many beginners prune too much and weaken the tree."],[4,"Finally, be patient."],[4,"A bonsai cannot be rushed."],[4,"Its beauty develops gradually, over many years, as the trunk thickens, the bark roughens, and the branches take on the natural-looking curves of a tree in miniature."],[4,"Treated well, your bonsai may outlive you, becoming a treasured object that passes from one generation to the next."]],"q":[[[1],"What is a bonsai tree really?"],[[8],"How can you test whether a bonsai needs water?"],[[13],"What mistake do many beginners make when pruning?"]]},{"t":"A Letter from 1912","k":"Historical letter","s":[[0,"My dearest Edith,"],[1,"I write to you from on board the great ship, where the visible excitement of our passengers is matched only by my own."],[1,"We sailed from Southampton at noon on Wednesday, and although it is now Friday, I still cannot quite believe that I am crossing the ocean towards a new life in America."],[2,"This ship is unlike anything I have ever seen."],[2,"The dining room would not look out of place in a London hotel: chandeliers, white linen, silverware polished until it gleams."],[2,"The library, where I am writing to you now, is panelled in dark oak and almost deserted — perhaps because most of the other passengers are out on deck, taking advantage of the surprisingly mild weather."],[3,"Father has been busy, as usual."],[3,"He speaks of nothing but business, business, business."],[3,"Mother, I am pleased to say, seems quite herself again."],[3,"The fresh sea air has done her good."],[3,"She has even been heard to laugh once or twice."],[4,"I must tell you about the band, who play in the lounge every evening after dinner."],[4,"Last night, they played a waltz so beautiful that I quite forgot that I had once promised myself not to dance."],[4,"I should add that the young gentleman with whom I danced was perfectly respectable — a Mr H., from Manchester, travelling alone to take up a post in Boston."],[5,"I shall post this letter when we reach New York on Wednesday morning."],[5,"With luck, you should receive it before the end of the month."],[5,"Until then, I remain, as always,"],[6,"Your loving cousin, Charlotte"],[7,"P.S."],[7,"The captain says we are making excellent progress."],[7,"We may even arrive a few hours early!"]],"q":[[[2],"Where is Charlotte travelling to?"],[[9],"Why does Mother seem better?"],[[12],"What did Charlotte do that she had promised herself not to?"]]},{"t":"The City at Night","k":"Descriptive","s":[[0,"After midnight, the city becomes a different place."],[0,"The crowds of office workers, tourists and shoppers who fill its streets during the day have all gone home, and a strange, expectant quietness settles in their place."],[0,"The traffic lights continue to change — red, amber, green, red — but they instruct no one."],[0,"They flicker on and off like fragments of silent conversations no one is listening to."],[1,"I love walking through the city at this hour."],[1,"The shops, which by day are full of noise and movement, now stand still behind their dark windows."],[1,"A single mannequin in a dress shop stares out at the empty pavement with a blank expression on her painted face."],[1,"Outside the bakery, a thin line of warm light leaks from beneath the door, and the smell of baking bread already drifts out into the air — a promise of the day to come."],[2,"Above me, most of the offices are dark, but here and there a single window glows."],[2,"I always wonder, when I see one of these solitary lights, who is up there, working so late, and what urgency keeps them at their desk while the rest of the city sleeps."],[3,"At the corner of an empty square, a black cat slips silently across the cobbles, glances once in my direction, and disappears into a doorway."],[3,"From somewhere far away comes the distant wail of a siren, soon swallowed up again by the silence."],[4,"I sometimes feel, walking like this, that I have been granted the privilege of seeing the city as it really is — not the busy stage where everyone performs their daily roles, but the quiet, patient backstage behind, where the next day waits to begin."]],"q":[[[1],"Where have the daytime crowds gone?"],[[7],"What can the writer smell outside the bakery?"],[[10],"Which animal crosses the square?"]]},{"t":"Should Children Have Smartphones?","k":"Persuasive","s":[[0,"Walk into any classroom today, peek into any bedroom, glance around any restaurant, and you will see the same familiar image: a child, head bowed, eyes fixed on the glowing screen of a smartphone."],[0,"Many parents have come to accept this as normal — perhaps even inevitable."],[0,"However, we should think much more carefully before placing one of these powerful devices in the hands of a young child."],[1,"The arguments in favour of children having smartphones are well known."],[1,"They allow parents to keep in touch, to track where their children are, and to call for help in an emergency."],[1,"They give access to educational tools, dictionaries, calculators and translation apps."],[1,"Used wisely, a smartphone can be a boost to learning."],[2,"Nevertheless, the case against is becoming impossible to ignore."],[2,"Study after study has shown that heavy smartphone use is linked with lower attention spans, poorer sleep and, most worryingly, rising rates of anxiety in young people."],[2,"Social media in particular exposes children to comparison, bullying and content far beyond what they are emotionally prepared for."],[2,"A child of nine or ten is not yet equipped to deal with the relentless judgements of strangers online."],[3,"Of course, we cannot — and should not — ban smartphones outright."],[3,"Children need to learn to live in a digital world."],[3,"But there is a vast difference between a basic phone that allows calls and texts, and a smartphone that gives unlimited access to everything the internet has to offer."],[4,"Before we hand a child a smartphone, we should pause and ask ourselves a simple question: are we doing this because it is genuinely the best thing for the child?"],[4,"Or are we doing it because it is easier than the alternative?"],[4,"The answer matters."]],"q":[[[4],"Name a reason given for children having smartphones."],[[8],"What has heavy smartphone use been linked with?"],[[13],"What difference does the writer point out between phones?"]]},{"t":"The Missing Manuscript","k":"Mystery","s":[[0,"The manuscript had been in the locked glass case in the centre of the library for as long as anyone could remember."],[0,"It was the prize of the entire collection: a 600-year-old book of poems, copied out by hand in faded red and gold ink, on parchment so thin you could almost see through it."],[1,"I had worked at the library for nine years, and like everyone on the staff, I checked the case at the start of every shift."],[1,"The manuscript was always there, lying open at whichever page our director, Dr Morley, had selected for that week's display."],[2,"On the morning of October the third, the case was empty."],[3,"I will never forget the moment I noticed."],[3,"I was halfway through my usual tour of the reading rooms, mug of tea in hand, when something seemed wrong."],[3,"I walked back, slowly."],[3,"The glass was intact."],[3,"The lock had not been forced."],[3,"And yet, where the manuscript should have been, there was nothing but an undisturbed velvet cushion."],[4,"Dr Morley arrived twenty minutes later, his face the colour of thunder."],[4,"The police were called."],[4,"Detectives interviewed every member of staff."],[4,"Cameras were checked."],[4,"Visitor logs were examined."],[4,"Nothing."],[5,"For three months, the case in the centre of the library stood empty, the velvet cushion strangely accusing in its emptiness."],[5,"The newspapers stopped reporting on the story."],[5,"Most of us, I think, began to doubt that we would ever see the manuscript again."],[6,"Then, on a cold morning in January, I unlocked the library doors as usual and walked through to the centre."],[6,"There, lying neatly in the case, was the manuscript — exactly as it had always been, exactly as it had been taken."],[6,"The glass case was still locked."],[6,"There was no note, no explanation."],[6,"To this day, no one knows where it had been, or how it returned."]],"q":[[[1],"What is the manuscript?"],[[9],"How do we know the case had not been broken into?"],[[20],"When did the manuscript come back?"]]},{"t":"The Solar System","k":"Science","s":[[0,"For most of human history, people believed that the Earth lay at the centre of the universe and that the Sun, Moon and stars all moved around it."],[0,"It is, perhaps, an understandable mistake."],[0,"Stand outside on a clear evening and watch the sky: the Sun does indeed appear to rise, cross the heavens, and set, while the Earth beneath our feet feels perfectly still."],[1,"We now know, of course, that the reverse is true."],[1,"It is the Earth — together with the seven other planets of the Solar System — that orbits the Sun."],[1,"The Sun itself is a star, an enormous ball of hot, glowing gas, around four-and-a-half billion years old."],[1,"It is by far the largest object in the Solar System: you could fit more than a million Earths inside it."],[2,"The eight planets vary enormously in size and character."],[2,"The four nearest the Sun — Mercury, Venus, Earth and Mars — are small, rocky worlds."],[2,"The four outer planets — Jupiter, Saturn, Uranus and Neptune — are gigantic balls of gas and ice."],[2,"Jupiter alone is so massive that it weighs more than twice as much as all the other planets combined."],[3,"Between the rocky planets and the gas giants lies the asteroid belt: a ring of rocky debris left over from the formation of the Solar System."],[3,"Beyond Neptune, in a vast region called the Kuiper Belt, lie countless smaller bodies, including the dwarf planet Pluto, which was once considered a full planet itself."],[4,"Fortunately, our knowledge of the Solar System is constantly expanding."],[4,"Telescopes, satellites and robotic missions are sending back astonishing images and data from worlds that, only a generation ago, were no more than points of light."],[4,"Each new discovery reminds us that, however much we already know, the universe still has plenty of surprises in store."]],"q":[[[0],"What did people once believe was at the centre of the universe?"],[[6],"How many Earths could fit inside the Sun?"],[[12],"Where is the dwarf planet Pluto found?"]]},{"t":"My Grandfather's War","k":"Memoir","s":[[0,"My grandfather rarely spoke about the war."],[0,"For most of his life, the war was something other men talked about — the men in pubs, the men on television documentaries — but never him."],[0,"He would change the subject the moment it was mentioned, with a quiet firmness that none of us dared to challenge."],[1,"It was only in the final year of his life, when he was already very ill, that he began, reluctantly and at unexpected moments, to share fragments of what he had seen."],[2,"He had been nineteen when he was called up in 1944."],[2,"A farm boy from Yorkshire, he had never travelled further than the nearest market town."],[2,"Within weeks, he found himself on a troopship bound for Italy, where he served in the Royal Engineers."],[2,"His job, he told me one quiet afternoon, was to find and defuse landmines."],[3,"'You learned not to think about it,' he said, looking past me at the wall."],[3,"'You thought about the next mine, and the one after that, and the one after that."],[3,"You did not think about your hands."],[3,"You did not think about your friends.'"],[4,"He paused for a long moment."],[4,"I did not interrupt him."],[5,"'Some men,' he went on at last, 'did not come home."],[5,"We had a lad called Robert."],[5,"From Leeds."],[5,"Bright ginger hair."],[5,"He was twenty-one."],[5,"Three days before the end of the war, I lost him.'"],[6,"That was the only time, in fifty years, that I ever heard my grandfather speak Robert's name aloud."],[7,"He died the following spring, on a quiet Wednesday morning, with my grandmother holding his hand."],[7,"At his funeral, the church was packed with people I had never met — old men, mostly, who had travelled long distances."],[7,"One of them, a tall man with a polished walking stick, came up to me afterwards."],[8,"'Your grandfather,' he said, 'was the bravest man I ever knew.'"],[9,"I have never forgotten those words."],[9,"I never will."],[9,"They are the greatest thing I have of his that he himself could never have given me."]],"q":[[[2],"What did Grandfather do when the war was mentioned?"],[[7],"What was Grandfather's job in the war?"],[[24],"What did the tall man say at the funeral?"]]}],"6":[{"t":"The Lighthouse Keeper's Daughter","k":"Literary fiction","s":[[0,"Long before dawn, while the rest of the village still slept beneath their heavy eiderdowns, my father would rise from his bed, dress in silence, and climb the narrow spiral staircase to the lamp."],[0,"From my own bedroom window, I could see the great beam of light begin to revolve across the cliffs, sweeping out to sea in its long, patient circles."],[0,"It was the first sound of every morning of my childhood: the click of the mechanism, my father's footsteps on the iron stairs, the answering roar of waves below."],[1,"We lived, my father and I, in the little stone cottage at the foot of the lighthouse."],[1,"After my mother died — I had been only four — my father had quietly dismissed all suggestions that I be sent to live with relations on the mainland."],[1,"'A girl,' he said, 'belongs with her father.'"],[1,"And so I grew up among the cries of seabirds, the smell of salt and oil, and the long, slow rhythms of the tides."],[2,"My father was not a talkative man."],[2,"He spoke seldom, and when he did, his voice was soft and slightly hoarse, as though he had spent too many years shouting against the wind."],[2,"Yet, in his own way, he taught me a great deal: how to read the weather from the colour of the morning sky; how to mend a net; how to recognise a ship in distress from its angle in the water."],[3,"I sometimes wonder, now that I am grown and live far from the sea, whether he understood how much I treasured those years."],[3,"I am not sure that I told him."],[3,"We were not a family for speeches."],[3,"But every time I see a beam of light moving steadily through the darkness, I think of him, and of the lighthouse, and of the small girl I once was."]],"q":[[[2],"What was the first sound of every morning?"],[[4],"How old was the narrator when her mother died?"],[[9],"Name one thing her father taught her."]]},{"t":"The Great Pyramid","k":"Information","s":[[0,"The Great Pyramid of Giza, the only one of the Seven Wonders of the Ancient World still standing today, was built around 2,560 BC as a tomb for the pharaoh Khufu."],[0,"Even by modern standards, the statistics are extraordinary: 146 metres tall in its original form, made of more than two million blocks of stone, each weighing on average two-and-a-half tonnes."],[1,"For nearly four thousand years after its construction, the Great Pyramid remained the tallest man-made structure on Earth."],[1,"It was only surpassed in the fourteenth century, when the central spire of Lincoln Cathedral was completed."],[2,"How exactly the pyramid was built remains a matter of debate."],[2,"The ancient Egyptians left no written instructions, and the techniques they used can only be guessed at."],[2,"We do know, however, that the work involved tens of thousands of workers over a period of perhaps twenty years."],[2,"Far from being slaves, as Hollywood films often suggest, the builders were probably skilled craftsmen who were paid in bread, beer and lodging."],[3,"The precision of the construction is, perhaps, the most astonishing thing of all."],[3,"The sides of the pyramid are aligned almost exactly with the four points of the compass, with an error of less than a tenth of a degree."],[3,"The four base lines differ in length by only a few centimetres."],[3,"To achieve such accuracy on such a colossal scale, without any of the tools or technology we now take for granted, was a truly extraordinary feat of engineering."],[4,"The interior of the pyramid is at least as remarkable as the exterior."],[4,"Deep within, three chambers — the Queen's Chamber, the King's Chamber, and an unfinished one below ground — are linked by a series of corridors and the soaring Grand Gallery, a passage 47 metres long with a corbelled ceiling."],[4,"The purpose of some of these spaces is still not fully understood; even in 2017, a previously unknown void as large as an aeroplane was discovered using cosmic-ray scanning."],[5,"The Great Pyramid, in other words, has not yet given up all its secrets."],[5,"After four-and-a-half millennia, it remains one of the most mysterious buildings ever raised by human hands."]],"q":[[[0],"Why was the Great Pyramid built?"],[[7],"Who probably built the pyramid, according to the text?"],[[14],"What was discovered inside the pyramid in 2017?"]]},{"t":"The Audition","k":"First-person reflection","s":[[0,"The audition was at five o'clock, and by four-thirty I had reached that particular state of nervousness in which time itself seems to lose its shape."],[0,"I had been pacing the corridor outside the practice rooms for so long that I had begun to recognise the patterns in the carpet."],[1,"A woman with kind eyes appeared at the door and summoned me by name."],[1,"I followed her into a high-ceilinged room with three people seated behind a long table."],[1,"They smiled."],[1,"I attempted to smile back."],[1,"My violin, when I lifted it from its case, felt heavier than I remembered."],[2,"The piece was one I had played a thousand times."],[2,"I had played it in my bedroom, at school, at family parties, in front of my teacher."],[2,"I could, I had often thought, play it in my sleep."],[2,"Yet, the moment I drew the bow across the first string, every confidence I had ever felt seemed to evaporate."],[2,"The notes came out, but they were not quite mine."],[2,"They sounded thin, hesitant, as though produced by a stranger I had never met."],[3,"Halfway through the slow movement, I made a small mistake — a single wrong note that, in any other performance, I would have brushed aside without a second thought."],[3,"This time, I froze."],[3,"For perhaps two seconds, I was aware of nothing but the sound of my own heartbeat and the unbearable silence of the room."],[4,"Then, somehow, I made myself continue."],[4,"I am not entirely sure how."],[4,"The next phrase came out a little shakier than I had intended, but it came out."],[4,"And the next."],[4,"And the next."],[4,"By the end of the piece, my hands had stopped shaking."],[5,"I do not know whether I will get the place."],[5,"I will not hear for several weeks."],[5,"But what I know now, in a way that I did not before, is that the worst moment of a performance is not, in fact, the end of the world."],[5,"You can keep playing."],[5,"And sometimes that is enough."]],"q":[[[6],"How did the violin feel when the narrator lifted it?"],[[13],"What went wrong during the slow movement?"],[[24],"What lesson did the narrator learn from the audition?"]]},{"t":"How a Camera Works","k":"Instructional / explanatory","s":[[0,"At its heart, a camera is a remarkably simple device."],[0,"A lens, a light-sensitive surface, and a small dark box to keep stray light from interfering with the picture: that is, in essence, all there is to it."],[0,"The earliest cameras, built in the nineteenth century, contained no electronics whatsoever, and yet they could already capture images that, in good conditions, would still be recognisable today."],[1,"Light is the essential ingredient."],[1,"When you press the shutter button, a thin opening at the front of the camera briefly lets light through the lens."],[1,"The lens, a curved piece of glass, bends that light, focusing it sharply onto the surface inside the camera."],[1,"In an old film camera, that surface was coated in chemicals that reacted to light."],[1,"In a modern digital camera, it is a microchip called the sensor."],[2,"The sensor is divided into millions of tiny squares, called pixels."],[2,"Each pixel records how much light has hit it, and what colour that light is."],[2,"Together, the millions of pixels build up a complete image, which can then be stored, viewed and edited."],[3,"Three controls govern the appearance of the final photograph."],[3,"The first, the aperture, decides how wide the opening at the front of the lens becomes."],[3,"A wide aperture lets in more light and creates a soft, blurred background."],[3,"The second, the shutter speed, decides how long the opening stays open."],[3,"A fast shutter speed freezes movement; a slow shutter speed allows it to register, creating motion blur."],[3,"The third, the ISO setting, decides how sensitive the sensor is to light."],[4,"Mastering a camera is a question of learning how these three controls work together."],[4,"The finest photographs are almost always the result not of luck, but of a photographer who has understood, and learned to manipulate, the physics of light."],[4,"With practice, and patience, that understanding is well within the reach of any dedicated amateur."]],"q":[[[7],"What is the sensor in a digital camera?"],[[13],"What does a wide aperture do?"],[[15],"What does a fast shutter speed do?"]]},{"t":"Diary of a Young Pilot, 1940","k":"Historical diary","s":[[0,"7th August."],[0,"Up at four."],[0,"Cold for August."],[0,"Toast and tea in the mess."],[0,"Nobody said much."],[0,"We have been on standby for forty hours now, and the tension in the room is unmistakable, although none of us would dream of speaking it."],[1,"Took off at half past six in 'B for Bertie'."],[1,"The morning was glorious — a high, pale sky, a few wisps of cloud, the patchwork of the Kent countryside as neat as a postcard beneath us."],[1,"It is sometimes difficult to believe that anything terrible is happening, on such mornings."],[2,"Then the radio crackled, and within minutes everything had changed."],[2,"A formation of forty enemy aircraft was approaching the coast at fifteen thousand feet."],[2,"We were vectored to intercept."],[3,"I had been in combat twice before."],[3,"Neither time prepares you for the third."],[3,"The sky, which a moment ago was empty, suddenly fills with machines — dozens of them — banking, diving, climbing in all directions."],[3,"The air around the cockpit is full of tracer fire, like very fast rain falling sideways."],[4,"I hit one of the bombers."],[4,"I think."],[4,"I cannot be certain."],[4,"It dropped out of the formation, smoke pouring from its starboard engine, and disappeared into a cloud below us."],[4,"Whether it limped home, or did not, I shall probably never know."],[5,"J. did not come back."],[5,"He had been with the squadron only six weeks."],[5,"He was twenty-two."],[6,"8th August."],[6,"Standby again from dawn."],[6,"The wicker chair in the mess — the chair in which J. always sat — is empty this morning, but no one has moved it, and no one will."],[6,"By tomorrow it will be filled by some other young man, and a week later he will be one of us, and we will forget where the others went."],[7,"I have written all this down because I want, one day, to remember exactly how it was."],[7,"Not the tidy version that the newspapers will print, but the truth."],[7,"If I am still alive when this war ends, I think I will not want to read it again."],[7,"But I should like, perhaps, for someone else to."]],"q":[[[10],"How many enemy aircraft were approaching?"],[[15],"What does the pilot compare the tracer fire to?"],[[26],"Which sentence shows the squadron still respects J.?"]]},{"t":"The Wreck on the Shore","k":"Atmospheric description","s":[[0,"For as long as anyone in the village could remember, the wreck had lain on the shore at low tide, half-buried in the wet, dark sand."],[0,"At high tide, only the upper part of the ribs was visible, jutting out of the green water like the blackened skeleton of some immense, half-imagined animal."],[1,"What ship she had once been, and how she had come to lie there, no one was entirely sure."],[1,"The oldest fishermen in the village remembered hearing, when they were boys, that she had gone aground on a winter night in the time of their grandfathers, but the details were always slightly different in each telling."],[1,"Some said she had been carrying tea from India; others, a load of seasoned timber from Norway."],[1,"Whatever cargo she had once held was, by now, long since scattered on the floor of the bay."],[2,"I used to walk down to her at low tide, when I was a child."],[2,"The wood of her sides, where it had not been worn away by the sea, was dark, smooth and curiously warm, as though it had absorbed centuries of sunlight."],[2,"Limpets clung to it."],[2,"In the deepest part of her belly, where the sand pooled even at low water, a small thriving community of crabs had taken up residence."],[2,"They would scuttle sideways with alarming speed if you peered too closely."],[3,"I sometimes imagined the men who had been aboard her on the night she sank."],[3,"I imagined them shouting orders, hauling on frozen ropes in a wind that ripped the words from their mouths."],[3,"I imagined the sudden, awful impact as she struck the sandbank; the long, sickening list to one side; the realisation, perhaps, that the lights of the village were just close enough to see, and yet impossibly far away."],[4,"But that was a long time ago, and the wreck is silent now."],[4,"She is no longer really a ship; she is a part of the shore."],[4,"The village has, in a sense, adopted her, and she has accepted us."],[4,"Together we wait, the village and the wreck, for whatever the next tide will bring."]],"q":[[[1],"What does the wreck look like at high tide?"],[[4],"What cargo might the ship have been carrying?"],[[9],"What lives in the deepest part of the wreck?"]]},{"t":"In Defence of Reading Fiction","k":"Persuasive essay","s":[[0,"It is not surprisingly common today to hear people argue that reading novels is a waste of time."],[0,"Why, they ask, would any sensible adult spend their evenings on stories about people who never existed,
