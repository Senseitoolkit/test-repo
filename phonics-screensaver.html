<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phonics Pals Saver</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=Gaegu:wght@400;700&display=swap">
<style>
/* Layout: same wall as the math saver — one big stage where a word is built, sounded and blended; a third of the screen for sticky notes. */
:root{
  --bg:#fef9f0; --panel:#ffffff; --ink:#3a3340; --muted:#a59cad; --line:#efe4d6; --line-strong:#e0d2bf;
  --a:#ff8a3d; --b:#7b6ef6; --c:#e0a800; --note:#fff1a6; --note-ink:#3b3220; --chip:#fff3e0;
  --f-display:"Fredoka", "Arial Rounded MT Bold", system-ui, sans-serif;
  --f-ui:"Nunito", system-ui, -apple-system, sans-serif;
  --f-note:"Gaegu", "Comic Sans MS", "Chalkboard SE", cursive;
  --grid-img:radial-gradient(var(--line) 1px, transparent 1px); --grid-size:22px 22px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#211c28; --panel:#2c2533; --ink:#f4eef8; --muted:#7d7388; --line:#3d3446; --line-strong:#4d4356;
  --a:#ff9a55; --b:#9a8fff; --c:#ffc83d; --note:#f3e38f; --note-ink:#2f2814; --chip:#36283a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#211c28; --panel:#2c2533; --ink:#f4eef8; --muted:#7d7388; --line:#3d3446; --line-strong:#4d4356;
  --a:#ff9a55; --b:#9a8fff; --c:#ffc83d; --note:#f3e38f; --note-ink:#2f2814; --chip:#36283a; color-scheme:dark }
:root[data-skin="chalk"]{ --bg:#22352b; --panel:#2a3f34; --ink:#f3f4e9; --muted:#7f9686; --line:#34503f; --line-strong:#466654;
  --a:#fff6cf; --b:#ffafc5; --c:#9fe3ff; --note:#f4e39a; --note-ink:#33301c; --chip:#2f4739; color-scheme:dark; --grid-img:none }
:root[data-skin="graph"]{ --bg:#fbfdff; --panel:#ffffff; --ink:#16314c; --muted:#94a8bd; --line:#cfe0f3; --line-strong:#b5cbe4;
  --a:#1f6feb; --b:#e5484d; --c:#d18b00; --note:#fff3b0; --note-ink:#3a3015; --chip:#e9f1fb; color-scheme:light;
  --grid-img:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px); --grid-size:28px 28px }
:root[data-skin="midnight"]{ --bg:#0b0d1a; --panel:#141830; --ink:#ebe9ff; --muted:#5d6190; --line:#22284a; --line-strong:#323a66;
  --a:#8f80ff; --b:#33d6b6; --c:#ffcf5c; --note:#ffd9f2; --note-ink:#36203a; --chip:#1b2040; color-scheme:dark; --grid-img:none }
:root[data-skin="sunset"]{ --bg:#fff0e4; --panel:#fff8f2; --ink:#4a1e18; --muted:#b99282; --line:#f2d6c3; --line-strong:#e8c1a8;
  --a:#df532a; --b:#7a3cbd; --c:#c98a00; --note:#fff7c2; --note-ink:#4a3418; --chip:#fbe2d2; color-scheme:light; --grid-img:none }
:root[data-skin="ocean"]{ --bg:#052a33; --panel:#0a3641; --ink:#def6f5; --muted:#5e8f96; --line:#0f4552; --line-strong:#1b5a68;
  --a:#47d2c9; --b:#ffcf61; --c:#ff8fa3; --note:#c9f2e4; --note-ink:#0f3a32; --chip:#0e4250; color-scheme:dark; --grid-img:none }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg); background-image:var(--grid-img); background-size:var(--grid-size); color:var(--ink);
  font-family:var(--f-ui); font-weight:600; overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--a); outline-offset:2px}

.app{height:100%; display:grid; grid-template-rows:auto 1fr; gap:12px; padding-block:12px}
.bar{display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px}
.brand{font-family:var(--f-display); font-weight:700; font-size:1.35rem; margin-right:auto; display:flex; align-items:center; gap:8px}
.brand i{width:26px; height:26px; border-radius:50%; background:var(--a); display:inline-block}
.group{display:flex; align-items:center; gap:6px}
.lbl{font-size:.7rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); margin-right:2px; font-weight:800}
select{height:40px; border-radius:999px; border:2px solid var(--line-strong); background:var(--panel); padding:0 10px}
.swatch{width:28px; height:28px; border-radius:50%; border:2px solid var(--line-strong); padding:0; position:relative; overflow:hidden}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.swatch i{position:absolute; inset:0}
.go{height:40px; padding:0 18px; border-radius:999px; border:0; background:var(--a); color:var(--bg); font-family:var(--f-display); font-weight:600}
.ghost{height:40px; padding:0 14px; border-radius:999px; border:2px solid var(--line-strong); background:var(--panel); font-family:var(--f-display); font-weight:600}

main{min-height:0; display:grid; grid-template-columns:minmax(0,2fr) minmax(320px,1fr); gap:24px}
.stage{min-height:0; min-width:0; display:grid; grid-template-rows:auto 1fr auto auto; justify-items:center; gap:10px}
.tags{display:flex; gap:8px; flex-wrap:wrap; justify-content:center; min-height:34px; padding-top:1vmin}
.tag{padding:5px 14px; border-radius:999px; background:var(--chip); color:var(--ink); font-size:clamp(.85rem,1.8vmin,1.1rem); font-weight:800}
.tag b{font-family:var(--f-display); color:var(--b); font-weight:600}
.tag.warn{color:var(--a)}
.wordWrap{width:100%; min-height:0; display:grid; place-items:center; overflow:hidden}
.wordBox{display:inline-flex; flex-direction:column; align-items:stretch}
.word{display:flex; align-items:flex-start; gap:0; transition:gap .7s cubic-bezier(.3,.8,.3,1)}
.split .word{gap:.3em}
.blend .word{gap:0}
.chunk{display:flex; flex-direction:column; align-items:stretch}
.lt{font-family:var(--f-display); font-weight:600; line-height:1; color:var(--ink); letter-spacing:-.01em; text-align:center;
  transition:color .45s, transform .35s, opacity .45s; white-space:pre}
.mk{height:.32em; margin-top:.12em; display:flex; align-items:center; justify-content:center}
.bub{opacity:0; transform:scale(.3); transition:opacity .35s, transform .45s cubic-bezier(.2,1.6,.4,1), background .4s, border-color .4s, color .4s}
.split .bub{opacity:1; transform:none}
.bub.dot{width:.26em; height:.26em; border-radius:50%; border:.05em solid var(--line-strong)}
.bub.wide{width:100%; height:.2em; border-radius:999px; border:.05em solid var(--line-strong)}
.bub.star{font-size:.36em; line-height:1; color:var(--line-strong)}
.chunk.on .lt{color:var(--k)}
.chunk.on .bub.dot,.chunk.on .bub.wide{background:var(--k); border-color:var(--k); transform:scale(1.2)}
.chunk.on .bub.star{color:var(--k); transform:scale(1.25)}
.chunk.now .lt{transform:translateY(-.08em) scale(1.08)}
.chunk.silent.on .lt{color:var(--muted); opacity:.55}
.swoosh{height:.28em; margin-top:.14em; position:relative; transform:scaleX(0); transform-origin:left; transition:transform .9s cubic-bezier(.5,0,.2,1); opacity:0}
.blend .swoosh{transform:scaleX(1); opacity:1}
.swoosh::before{content:""; position:absolute; left:0; right:.2em; top:calc(50% - .04em); height:.08em; border-radius:.04em; background:var(--ink)}
.swoosh::after{content:""; position:absolute; right:0; top:calc(50% - .13em); border-left:.22em solid var(--ink); border-top:.13em solid transparent; border-bottom:.13em solid transparent}
.blend .wordBox{animation:cheer .6s .6s ease-out}
@keyframes cheer{50%{transform:scale(1.06)}}
.caption{font-family:var(--f-display); font-weight:500; font-size:clamp(1.2rem,3.6vmin,2.2rem); color:var(--muted); text-align:center; min-height:1.4em; text-wrap:balance}
.caption .s{color:var(--k)}
.caption .whole{color:var(--ink); font-weight:600}
.progress{width:min(520px,100%); height:8px; border-radius:8px; background:var(--line); overflow:hidden; margin-bottom:4px}
.progress i{display:block; height:100%; width:0; background:var(--a)}
.emptyMsg{font-family:var(--f-display); font-size:1.4rem; color:var(--muted); text-align:center; max-width:28ch}
.hint{font-size:.8rem; color:var(--muted)}

/* notes (shared with the math saver) */
.notes{min-height:0; display:flex; flex-direction:column; gap:10px}
.notes h2{font-family:var(--f-display); font-size:clamp(1.3rem,3vmin,2rem); font-weight:600; margin:0; display:flex; justify-content:space-between; align-items:baseline}
.notes h2 small{font-family:var(--f-ui); color:var(--muted); font-size:.9rem}
.add{display:flex; gap:6px}
.add input{flex:1; min-width:0; height:40px; border-radius:999px; border:2px solid var(--line-strong); background:var(--panel); padding:0 14px}
.list{list-style:none; margin:0; padding:8px 4px 12px; overflow-y:auto; display:flex; flex-direction:column; gap:18px; flex:1}
.note{background:var(--note); color:var(--note-ink); font-family:var(--f-note); font-size:clamp(1.6rem,4vmin,2.6rem); line-height:1.1;
  padding:18px 40px 20px 18px; border-radius:2px 2px 14px 2px; box-shadow:0 6px 14px -8px rgba(0,0,0,.45);
  transform:rotate(var(--tilt)); position:relative; display:flex; gap:10px; align-items:flex-start}
.note::before{content:""; position:absolute; top:-7px; left:calc(50% - 22px); width:44px; height:14px; background:color-mix(in srgb, var(--panel) 60%, transparent); opacity:.8}
.note .check{flex:none; width:1em; height:1em; margin-top:.08em; font-size:inherit; border-radius:5px; border:2px solid var(--note-ink); background:transparent; padding:0; display:grid; place-items:center; color:var(--note-ink)}
.note.done .text{text-decoration:line-through; opacity:.55}
.note .text{overflow-wrap:anywhere; min-width:0}
.note .del{position:absolute; top:6px; right:6px; width:24px; height:24px; border:0; background:transparent; color:var(--note-ink); opacity:.5; font-size:1.1rem; line-height:1}
.note .del:hover{opacity:1}
.empty{color:var(--muted); font-size:.9rem; padding:8px 2px}
.clear{align-self:flex-start; border:0; background:none; color:var(--muted); font-size:.8rem; text-decoration:underline; padding:0}

/* word picker */
.picker{position:fixed; inset:0; z-index:20; background:color-mix(in srgb, var(--ink) 35%, transparent); display:grid; place-items:center;
  padding:max(16px, env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-right,0px)) max(16px, env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.sheet{background:var(--panel); border:2px solid var(--line-strong); border-radius:24px; width:min(760px,100%); max-height:100%; overflow-y:auto; padding:20px; display:flex; flex-direction:column; gap:16px}
.sheet h3{font-family:var(--f-display); font-weight:600; font-size:1.4rem; margin:0; display:flex; justify-content:space-between; align-items:center}
.sec{display:flex; flex-direction:column; gap:8px}
.sec .h{font-family:var(--f-display); font-weight:600; font-size:1rem; display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.count{font-family:var(--f-ui); font-size:.8rem; color:var(--a); background:var(--chip); padding:2px 10px; border-radius:999px}
.switch{display:flex; gap:6px; background:var(--chip); padding:5px; border-radius:999px}
.switch button{flex:1; padding:9px; border-radius:999px; border:0; background:none; color:var(--muted); font-family:var(--f-display); font-weight:600}
.switch button[aria-pressed="true"]{background:var(--panel); color:var(--ink); box-shadow:0 3px 0 rgba(0,0,0,.06)}
.chips{display:flex; flex-wrap:wrap; gap:6px}
.chip{padding:7px 13px; border-radius:999px; border:2px solid var(--line-strong); background:var(--panel); color:var(--muted); font-weight:800; font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--b); border-color:var(--b); color:var(--bg)}
.chip.g{font-family:var(--f-display); font-weight:600; font-size:1rem}
.chip.g[aria-pressed="true"]{background:var(--a); border-color:var(--a)}
.mini{border:0; background:none; color:var(--muted); text-decoration:underline; font-size:.85rem; padding:0}

/* screen saver mode */
.saver .bar{display:none}
.saver .app{grid-template-rows:1fr}
.saver .add,.saver .clear,.saver .hint{display:none}
.saver .note .del{display:none}
.floatCtl{position:fixed; right:calc(16px + env(safe-area-inset-right,0px)); bottom:calc(16px + env(safe-area-inset-bottom,0px));
  display:none; gap:6px; background:var(--panel); border:2px solid var(--line-strong); padding:6px; border-radius:999px; transition:opacity .4s; z-index:10}
.saver .floatCtl{display:flex}
.saver.idle .floatCtl{opacity:0; pointer-events:none}
.saver.idle{cursor:none}
.notes.hiddenRail{display:none}
main:has(.hiddenRail){grid-template-columns:minmax(0,1fr)}

@media (max-width:760px){
  body{overflow:auto}
  .app{height:auto; min-height:100%}
  main{grid-template-columns:minmax(0,1fr)}
  .stage{min-height:60vh}
}
@media (prefers-reduced-motion:reduce){ .word,.lt,.bub,.swoosh{transition:none} .blend .wordBox{animation:none} }
</style>

</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><i></i>Phonics Pals Saver</div>
    <div class="group">
      <button class="ghost" id="openPicker">Words: <span id="deckInfo">…</span></button>
      <label class="lbl" for="speed">Speed</label>
      <select id="speed"><option value="1.45">Slow</option><option value="1" selected>Medium</option><option value="0.65">Fast</option></select>
    </div>
    <div class="group" role="group" aria-label="Color theme" id="skins"><span class="lbl">Theme</span></div>
    <div class="group">
      <button class="ghost" id="pause">Pause</button>
      <button class="ghost" id="next">Next</button>
      <button class="go" id="fs">Start full screen</button>
    </div>
  </header>

  <main>
    <section class="stage" aria-live="polite">
      <div class="tags" id="tags"></div>
      <div class="wordWrap" id="wrap"><div class="wordBox" id="box"><div class="word" id="word"></div><div class="swoosh"></div></div></div>
      <div class="caption" id="cap"></div>
      <div class="progress" aria-hidden="true"><i id="bar"></i></div>
    </section>

    <aside class="notes" id="notes">
      <h2>To do <small id="count"></small></h2>
      <form class="add" id="addForm">
        <input id="noteInput" placeholder="Post a note…" maxlength="120" autocomplete="off">
        <button class="go" type="submit">Post</button>
      </form>
      <ul class="list" id="list"></ul>
      <button class="clear" id="clearDone">Clear finished notes</button>
      <div class="hint">Space pauses · → next · F full screen · N hides notes</div>
    </aside>
  </main>
</div>

<div class="floatCtl">
  <button class="ghost" id="fPause">Pause</button>
  <button class="ghost" id="fNext">Next</button>
  <button class="ghost" id="fNotes">Notes</button>
  <button class="go" id="fExit">Exit</button>
</div>

<div class="picker" id="picker" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="pickTitle">
    <h3 id="pickTitle">Choose the words <button class="go" id="closePicker">Done</button></h3>
    <div class="switch" role="group" aria-label="Word type">
      <button id="m-groups" data-m="groups">Sounds</button>
      <button id="m-tricky" data-m="tricky">Tricky</button>
      <button id="m-sight" data-m="sight">Sight</button>
    </div>
    <div id="groupsPane" class="sec" style="gap:16px">
      <div class="sec"><div class="h">Quick picks</div><div class="chips" id="presets"></div></div>
      <div class="sec">
        <div class="h">Sound groups <span class="count" id="gCount"></span>
          <button class="mini" id="gAll">Select all</button><button class="mini" id="gNone">Clear</button></div>
        <div class="chips" id="groups"></div>
      </div>
      <div class="sec"><div class="h">Word level</div>
        <div class="chips"><button class="chip" id="lv-starter">Starter</button><button class="chip" id="lv-advanced">Advanced</button>
          <button class="chip" id="lv-under">Include words that sound a little different</button></div></div>
    </div>
    <div id="catsPane" class="sec" hidden>
      <div class="h"><span id="catTitle">Categories</span> <span class="count" id="cCount"></span>
        <button class="mini" id="cAll">Select all</button><button class="mini" id="cNone">Clear</button></div>
      <div class="chips" id="cats"></div>
    </div>
    <div class="hint" id="pickSummary"></div>
  </div>
</div>

<script>

/* Break a word into sound segments, each = { letters, type }.
   type: 'dot' (single sound), 'wide' (digraph/trigraph), 'star' (magic-e long vowel),
   'silent' (no marker). Letters keep their original position so markers sit under them. */
const TRIGRAPHS = ['igh','tch','dge'];
const DIGRAPHS = ['sh','ch','th','ph','wh','ck','ng','qu','ai','ay','ee','ea','oa','oo','ou','ow','oi','oy','ue','ew','au','aw','ie','ir','ur','er','ar','or','ll','ss','ff','zz'];
function soundSegments(raw){
  const w = raw.toLowerCase().replace(/[^a-z]/g,'');
  const segs = [];
  const isMagicE = /[aeiou][bcdfghjklmnpqrstvwxz]e$/.test(w) && w.length>=3;
  let i = 0;
  while(i < w.length){
    // magic-e ending: vowel(star) + consonant(dot) + silent e
    if(isMagicE && i === w.length-3){
      segs.push({letters:w[i], type:'star'});
      segs.push({letters:w[i+1], type:'dot'});
      segs.push({letters:w[i+2], type:'silent'});
      i += 3; continue;
    }
    // doubled consonant = one sound
    if(i+1<w.length && w[i]===w[i+1] && 'bcdfghjklmnpqrstvwxz'.includes(w[i])){
      segs.push({letters:w.substr(i,2), type:'dot'}); i += 2; continue;
    }
    // trigraph
    const tri = w.substr(i,3);
    if(TRIGRAPHS.includes(tri)){ segs.push({letters:tri, type:'wide'}); i += 3; continue; }
    // digraph
    const di = w.substr(i,2);
    if(DIGRAPHS.includes(di)){ segs.push({letters:di, type:'wide'}); i += 2; continue; }
    // silent letters
    if(isSilent(w, i)){ segs.push({letters:w[i], type:'silent'}); i += 1; continue; }
    segs.push({letters:w[i], type:'dot'}); i += 1;
  }
  return segs.length ? segs : [{letters:w, type:'dot'}];
}
function isSilent(w, i){
  const c = w[i];
  if(c==='k' && i===0 && w[1]==='n') return true;       // knee, knock
  if(c==='w' && i===0 && w[1]==='r') return true;       // write
  if(c==='b' && i===w.length-1 && w[i-1]==='m') return true; // lamb
  if(c==='h' && w[i-1]==='g') return true;              // ghost-ish
  return false;
}

  if (!S.notes.length){ list.innerHTML = '<li class="empty">No notes yet. Type one above and press Post. It stays on screen while the words play.</li>'; return; }
  list.innerHTML = S.notes.map(n => `
    <li class="note${n.done?' done':''}" style="--tilt:${n.tilt}deg" data-id="${n.id}">
      <button class="check" aria-label="Mark ${n.done?'not done':'done'}">${n.done?'✓':''}</button>
      <span class="text"></span>
      <button class="del" aria-label="Remove note">×</button>
    </li>`).join('');
  list.querySelectorAll('.note').forEach((li,i) => li.querySelector('.text').textContent = S.notes[i].t);
}
list.onclick = e => {
  const li = e.target.closest('.note'); if (!li) return;
  const id = +li.dataset.id;
  if (e.target.closest('.del')) S.notes = S.notes.filter(n => n.id!==id);
  else { const n = S.notes.find(n => n.id===id); n.done = !n.done; }
  save(); renderNotes();
};
$('addForm').addEventListener('submit', e => {
  e.preventDefault();
  const t = $('noteInput').value.trim(); if (!t) return;
  S.notes.push({id:Date.now(), t, done:false, tilt:+(Math.random()*3-1.5).toFixed(2)});
  $('noteInput').value = ''; save(); renderNotes(); list.scrollTop = list.scrollHeight;
});
$('clearDone').onclick = () => { S.notes = S.notes.filter(n => !n.done); save(); renderNotes(); };
const toggleNotes = () => { S.notesHidden = !S.notesHidden; save(); renderNotes(); setTimeout(fitWord, 50); };
$('fNotes').onclick = toggleNotes;

addEventListener('keydown', e => {
  if (e.target.matches('input,select')) return;
  if (!picker.hidden){ if (e.key==='Escape') closePicker(); return; }
  if (e.code==='Space'){ e.preventDefault(); setPaused(!paused); }
  else if (e.key==='ArrowRight') startWord();
  else if (e.key==='f' || e.key==='F') document.body.classList.contains('saver') ? stopSaver() : startSaver();
  else if (e.key==='n' || e.key==='N') toggleNotes();
  else if (e.key==='Escape' && document.body.classList.contains('saver')) stopSaver();
});

renderNotes();
rebuildDeck();
startWord();
requestAnimationFrame(loop);
})();
</script>

</body>
</html>
