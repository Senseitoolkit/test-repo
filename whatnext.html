<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Next?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bangers&family=Comic+Neue:wght@400;700&display=swap">
<style>
/* VOICE: a comic-book sidekick: short, punchy, always asking "what do we know for sure?"
   IDEA: a comic page. Clues arrive in speech bubbles, each puzzle is a panel, wrong ideas get a big X.
   PICTURE: the panel itself: suspects to cross out, circles to place a dot in, a line-up to fill.
   COLOUR and TYPE: comic yellow page with halftone dots, white panels, black ink outlines, red and blue spot colour; Bangers + Comic Neue. One palette in both themes.
   LAYOUT: one column: clue bubble, picture, "What next?" prompt, big buttons. */
:root{color-scheme:light;--page:#ffd60a;--dot:#f4b800;--panel:#fff;--ink:#111;--ink2:#444;--red:#e63946;--blue:#1d7fd8;--green:#2bb673;--soft:#fff3bf;--blueSoft:#dcefff;--redSoft:#ffe1e3}
*{box-sizing:border-box;min-width:0}
body{margin:0;color:var(--ink);font:700 17px/1.45 'Comic Neue','Comic Sans MS',system-ui,sans-serif;background:var(--page) radial-gradient(var(--dot) 22%,transparent 23%) 0 0/14px 14px;overflow-x:clip}
h1,h2,h3{font-family:Bangers,Impact,sans-serif;font-weight:400;letter-spacing:.04em;margin:0;line-height:1;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible{outline:4px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
header{background:var(--ink);color:#fff;position:sticky;top:0;z-index:5}
.hin{max-width:720px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px;min-height:56px}
.logo{font-family:Bangers;font-size:30px;letter-spacing:.05em;color:var(--page);text-shadow:2px 2px 0 var(--red)}
.pill{margin-left:auto;background:var(--page);color:var(--ink);border-radius:99px;padding:3px 12px;font-size:15px;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:20px 14px 56px}
.panel{background:var(--panel);border:3px solid var(--ink);border-radius:10px;box-shadow:6px 6px 0 var(--ink);padding:18px}
@media(max-width:520px){.panel{padding:14px 12px}}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:8px 22px;border:3px solid var(--ink);border-radius:12px;box-shadow:4px 4px 0 var(--ink);font-family:Bangers;font-size:24px;letter-spacing:.05em;background:var(--red);color:#fff;transition:transform .08s,box-shadow .08s}
.btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.btn.alt{background:#fff;color:var(--ink)}.btn.blue{background:var(--blue)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
/* home */
.title{font-size:clamp(56px,15vw,96px);color:var(--red);-webkit-text-stroke:2px var(--ink);text-shadow:5px 5px 0 var(--ink);transform:rotate(-3deg);margin:6px 0 12px;display:inline-block}
.tag{font-size:19px;max-width:30ch;margin-bottom:18px}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:18px}
.hw{background:#fff;border:3px solid var(--ink);border-radius:10px;padding:10px 6px;text-align:center;font-size:15px;line-height:1.2}
.hw b{display:block;font-family:Bangers;font-weight:400;font-size:22px;letter-spacing:.04em}
.hw svg,.tile svg{width:54px;height:36px;display:block;margin:0 auto 4px;fill:none;stroke:var(--ink);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.lbl{font-family:Bangers;font-size:20px;letter-spacing:.04em;margin:16px 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button,.tile{min-height:48px;padding:6px 14px;border:3px solid var(--ink);border-radius:10px;background:#fff;text-align:center}
.opts button[aria-pressed=true],.tile[aria-pressed=true]{background:var(--blue);color:#fff;box-shadow:3px 3px 0 var(--ink)}
.tile[aria-pressed=true] svg{stroke:#fff}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
@media(max-width:560px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;line-height:1.15;min-height:86px;padding:8px 4px}
/* puzzle */
.qhead{display:flex;justify-content:space-between;gap:10px;font-size:14px;color:var(--ink2);margin-bottom:10px}
.kind{font-family:Bangers;font-size:26px;letter-spacing:.04em;color:var(--blue);margin-bottom:8px}
.story{margin-bottom:10px}
.bub{position:relative;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 14px;margin:0 0 16px;font-size:clamp(18px,3.4vw,21px);line-height:1.3}
.bub::after{content:'';position:absolute;left:28px;bottom:-13px;width:20px;height:20px;background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg) skew(12deg,12deg)}
.bub small{display:block;font-family:Bangers;font-weight:400;letter-spacing:.05em;color:var(--red);font-size:15px}
.bub.old{font-size:15px;padding:6px 12px;margin-bottom:8px;border-width:2px;color:var(--ink2);background:var(--soft)}.bub.old::after{display:none}
.bub.rule{background:var(--blueSoft)}.bub.rule::after{background:var(--blueSoft)}
.wn{font-family:Bangers;font-size:30px;letter-spacing:.05em;color:var(--red);-webkit-text-stroke:1px var(--ink);margin-top:14px;line-height:1}
.do{margin:4px 0 12px;font-size:17px}
.msg{background:var(--soft);border:2px dashed var(--ink);border-radius:10px;padding:8px 12px;margin-top:12px;font-size:16px}
.msg.good{background:#d9f7e6}.msg.bad{background:var(--redSoft)}
.pic{background:var(--soft);border:3px solid var(--ink);border-radius:10px;padding:10px;animation:pop .3s ease}
@keyframes pop{from{transform:scale(.97);opacity:.4}to{transform:none;opacity:1}}
.pic svg{display:block;width:100%;max-width:420px;margin:0 auto;height:auto;font-family:'Comic Neue',sans-serif;font-weight:700}
/* rule it out */
.sus{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media(min-width:520px){.sus.n8{grid-template-columns:repeat(4,minmax(0,1fr))}}
.su{position:relative;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:4px;display:grid;place-items:center;min-height:76px}
.su svg{width:64px;height:64px;max-width:100%}
.su.sel{background:var(--redSoft);border-color:var(--red)}
.su.sel::after,.su.dead::after{content:'✕';position:absolute;inset:0;display:grid;place-items:center;font-size:54px;line-height:1;color:var(--red);font-family:Bangers}
.su.dead{background:#eee;border-color:#999;cursor:default}.su.dead svg{opacity:.25}.su.dead::after{color:#999}
.su.win{background:#d9f7e6;border-color:var(--green);box-shadow:0 0 0 4px var(--green)}
/* choices */
.ch{display:grid;gap:10px}.ch.two{grid-template-columns:repeat(2,minmax(0,1fr))}.ch.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media(max-width:480px){.ch.three{grid-template-columns:minmax(0,1fr)}}
.c{min-height:54px;padding:8px 12px;border:3px solid var(--ink);border-radius:12px;background:#fff;box-shadow:3px 3px 0 var(--ink);text-align:center;font-size:19px}
.c:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.c svg{display:block;width:100%;max-width:150px;margin:0 auto}
.c.big{font-family:Bangers;font-size:26px;letter-spacing:.04em}
.claim{font-size:clamp(20px,4vw,24px);text-align:center;background:#fff;border:3px solid var(--ink);border-radius:10px;padding:10px;margin-top:14px;transform:rotate(-1deg)}
/* line up */
.line{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:nowrap}
.end{font-size:12px;color:var(--ink2);writing-mode:vertical-rl;transform:rotate(180deg);text-align:center}
.pp{flex:1 1 0;max-width:86px;background:#fff;border:3px solid var(--ink);border-radius:10px;text-align:center;padding:6px 2px;font-size:15px}
.pp i{display:block;width:34px;height:34px;border-radius:50%;border:3px solid var(--ink);margin:0 auto 3px}
.slot{flex:none;width:36px;height:60px;border:3px dashed var(--ink);border-radius:10px;background:#fff;text-align:center;font-family:Bangers;font-size:26px;color:var(--blue)}
.slot:hover{background:var(--blueSoft)}
.pend{margin-top:10px;font-size:15px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pend .pp{flex:none;width:76px;border-style:dashed}
/* follow the rule */
.seq{display:flex;align-items:flex-end;justify-content:center;gap:2px;flex-wrap:wrap}
.tm{min-width:50px;padding:8px 6px;border:3px solid var(--ink);border-radius:10px;background:#fff;text-align:center;font-family:Bangers;font-size:26px}
.tm.q{background:var(--page);border-style:dashed}.tm.new{background:#d9f7e6}
.gp{display:flex;flex-direction:column;align-items:center;font-size:13px;color:var(--blue);padding:0 2px 12px;min-width:34px}
.gp::after{content:'→';font-size:18px;line-height:.8;color:var(--ink)}
/* results */
.stars{color:var(--red);letter-spacing:3px;font-size:26px}.stars i{font-style:normal;color:#ccc}.stars i.on{color:var(--red)}
.big{font-size:clamp(40px,10vw,64px);color:var(--red);-webkit-text-stroke:1.5px var(--ink);text-shadow:3px 3px 0 var(--ink)}
.rv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:2px dashed #bbb;font-size:16px}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="hin"><button class="logo" data-act="home" aria-label="What Next home">WHAT NEXT?</button><span class="pill num" id="pill" hidden></span></div></header>
<main id="app"></main>
<script>
{
const KEY = 'whatnext-history', PREF = 'whatnext-prefs';
const S = { view:'home', level:1, mode:'mix', test:null, idx:0, res:[] };
try { const p = JSON.parse(localStorage.getItem(PREF) || '{}'); if (p.level) S.level = p.level; if (p.mode) S.mode = p.mode; } catch (e) {}
const hy = /^#y([1-6])$/.exec(location.hash || ''); if (hy) S.level = Math.ceil(hy[1] / 2);
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const rr = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[rr(0, a.length - 1)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rr(0, i); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const hist = () => { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const LV = ['Years 1–2', 'Years 3–4', 'Years 5–6'];
const wn = (t, d) => '<div class="wn">' + (t || 'What next?') + '</div><p class="do">' + d + '</p>';
const msg = q => q.msg ? '<p class="msg ' + (q.good ? 'good' : 'bad') + '" role="status">' + q.msg + '</p>' : '';
const good = (q, t) => { q.msg = t; q.good = true; }, bad = (q, t) => { q.msg = t; q.good = false; q.mist++; };

/* ================= 1. RULE IT OUT: each clue removes suspects until one is left ================= */
const COL = { red:'#e63946', blue:'#1d7fd8', yellow:'#ffc300', green:'#2bb673' };
const VAL = { shape:['circle','square','triangle','star'], colour:['red','blue','yellow','green'], size:['big','small'] };
const D = (a, v) => a === 'shape' ? 'a ' + v : v;
function mon(o) {
  const f = COL[o.colour], st = 'fill="' + f + '" stroke="#111" stroke-width="3" stroke-linejoin="round"', k = o.size === 'small' ? .58 : 1;
  const body = o.shape === 'circle' ? '<circle cx="30" cy="31" r="24" ' + st + '/>' : o.shape === 'square' ? '<rect x="7" y="8" width="46" height="46" rx="5" ' + st + '/>'
    : o.shape === 'triangle' ? '<path d="M30 5 56 53H4z" ' + st + '/>' : '<path d="M30 3l8 17 19 2-14 13 4 19-17-10-17 10 4-19L3 22l19-2z" ' + st + '/>';
  const ey = o.shape === 'triangle' ? 37 : 29;
  return '<svg viewBox="0 0 60 60" aria-hidden="true"><g transform="translate(30 31) scale(' + k + ') translate(-30 -31)">' + body + '<circle cx="23" cy="' + ey + '" r="5" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="37" cy="' + ey + '" r="5" fill="#fff" stroke="#111" stroke-width="2"/><circle cx="24" cy="' + ey + '" r="2" fill="#111"/><circle cx="38" cy="' + ey + '" r="2" fill="#111"/></g></svg>';
}
const nameOf = o => (o.size && o.sized ? o.size + ' ' : '') + o.colour + ' ' + o.shape;
const M = {};
M.out = { name:'Rule it out', tag:'Cross out what cannot be', make(L) {
  const AT = L === 1 ? ['shape','colour'] : ['shape','colour','size'], n = [6, 8, 9][L - 1];
  for (let go = 0; go < 400; go++) {
    const seen = {}, objs = [];
    while (objs.length < n) { const o = { shape:pick(VAL.shape), colour:pick(VAL.colour), size:L === 1 ? 'big' : pick(VAL.size), sized:L > 1 }, k = o.shape + o.colour + o.size; if (!seen[k]) { seen[k] = 1; objs.push(o); } }
    const t = pick(objs); let R = objs.slice(); const clues = [];
    while (R.length > 1 && clues.length < 5) {
      let c = [];
      AT.forEach(a => {
        if (L < 3 || clues.length > 2) c.push({ t:'It is ' + D(a, t[a]) + '.', f:o => o[a] === t[a] });
        VAL[a].filter(v => v !== t[a]).forEach(v => { c.push({ t:'It is not ' + D(a, v) + '.', f:o => o[a] !== v });
          if (L > 1 && VAL[a].length > 2) { const pr = shuffle([t[a], v]); c.push({ t:'It is ' + D(a, pr[0]) + ' or ' + D(a, pr[1]) + '.', f:o => o[a] === t[a] || o[a] === v }); } });
        if (L === 3) AT.filter(b => b !== a).forEach(b => VAL[a].forEach(v => VAL[b].forEach(w => { if (t[a] !== v || t[b] === w) c.push({ cond:1, t:'If it is ' + D(a, v) + ', then it is ' + D(b, w) + '.', h:'Only look at the ' + (a === 'shape' ? v + 's' : v + ' ones') + '. Anyone else is safe.', f:o => o[a] !== v || o[b] === w }); })));
      });
      c = c.filter(x => { x.e = R.filter(o => !x.f(o)).length; return x.e > 0 && !clues.some(y => y.t === x.t) && R.length - x.e >= (clues.length < 1 && R.length > 3 ? 3 : 1); });
      if (!c.length) break;
      const cc = c.filter(x => x.cond), cl = L === 3 && cc.length && Math.random() < .6 ? pick(cc) : pick(c);
      clues.push(cl); R = R.filter(cl.f);
    }
    if (R.length === 1 && clues.length >= 2 && clues.length <= 4) return { objs:objs.map(o => Object.assign({ dead:false, sel:false }, o)), ti:objs.indexOf(t), clues, ci:0 };
  }
}, view(q) {
  const cl = q.clues[q.ci];
  return '<p class="story">Someone ate the last biscuit. Use the clues to find out who.</p>' +
    q.clues.slice(0, q.ci).map(c => '<div class="bub old">✓ ' + esc(c.t) + '</div>').join('') + (q.done ? '' : '<div class="bub"><small>Clue ' + (q.ci + 1) + ' of ' + q.clues.length + '</small>' + esc(cl.t) + '</div>') +
    '<div class="sus n' + q.objs.length + '">' + q.objs.map((o, i) => '<button class="su' + (o.dead ? ' dead' : '') + (o.sel ? ' sel' : '') + (q.done && i === q.ti ? ' win' : '') + '" data-act="tap" data-i="' + i + '"' + (o.dead || q.done ? ' disabled' : '') + ' aria-pressed="' + o.sel + '" aria-label="' + nameOf(o) + (o.dead ? ', ruled out' : '') + '">' + mon(o) + '</button>').join('') + '</div>' + msg(q) +
    (q.done ? wn('Case closed!', 'Only one is left, so it must be the ' + nameOf(q.objs[q.ti]) + '.') : wn('', 'Tap everyone this clue rules out. ' + (cl.h || '')) + '<button class="btn" data-act="check">Check</button>');
}, act(q, a, d) {
  if (a === 'tap') { const o = q.objs[+d.i]; if (!o.dead) o.sel = !o.sel; q.msg = ''; }
  else if (a === 'check') { const cl = q.clues[q.ci], should = q.objs.filter(o => !o.dead && !cl.f(o)), ok = q.objs.every(o => o.dead || o.sel === !cl.f(o));
    if (ok) good(q, 'Yes! That clue rules out ' + should.length + '.'); else bad(q, 'Not quite. “' + esc(cl.t) + '” rules out exactly ' + should.length + '. They are crossed out now.' + (cl.cond ? ' ' + esc(cl.h) : ''));
    q.objs.forEach(o => { if (!o.dead && !cl.f(o)) o.dead = true; o.sel = false; }); q.ci++; if (q.ci === q.clues.length) q.done = true; }
} };

/* ================= 2. SURE THING?: a rule, a fact, and a picture of where someone could be ================= */
const REG = { nested:{ isA:['I'], isB:['I','O'], notA:['O','X'], notB:['X'] }, apart:{ isA:['A'], isB:['B'], notA:['B','X'], notB:['A','X'] } };
const POS = { nested:{ I:[150,98], O:[150,34], X:[266,34] }, apart:{ A:[90,84], B:[210,84], X:[150,20] } };
function dia(q, dots, mini) {
  const nest = q.type === 'nested', lab = (x, y, t, an) => mini ? '' : '<text x="' + x + '" y="' + y + '" text-anchor="' + (an || 'middle') + '" font-size="14">' + t + '</text>';
  const circ = (cx, cy, r, f) => '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + f + '" stroke="#111" stroke-width="3"/>';
  const body = nest ? circ(150, 82, 70, '#bfe3ff') + circ(150, 100, 36, '#ffd60a') + lab(226, 146, q.prop + ' things', 'start') + lab(150, 128, q.G + 's')
                    : circ(90, 84, 52, '#ffd60a') + circ(210, 84, 52, '#bfe3ff') + lab(90, 154, q.G + 's') + lab(210, 154, q.prop + ' things');
  const ds = dots.map(r => { const p = POS[q.type][r], one = dots.length === 1; return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="' + (mini ? 13 : 11) + '" fill="' + (one ? '#e63946' : '#fff') + '" stroke="#e63946" stroke-width="3"' + (one ? '' : ' stroke-dasharray="4 3"') + '/>' + (one || mini ? '' : '<text x="' + p[0] + '" y="' + (p[1] + 5) + '" text-anchor="middle" font-size="14" fill="#e63946">?</text>'); }).join('');
  return '<svg viewBox="0 0 330 160" aria-hidden="true">' + body + ds + '</svg>';
}
const SAY = (q, k) => q.who + (k === 'isA' ? ' is a ' + q.G : k === 'notA' ? ' is not a ' + q.G : k === 'isB' ? ' is ' + q.prop : ' is not ' + q.prop);
M.sure = { name:'Sure thing?', tag:'Sure, impossible, or can\'t tell', make(L) {
  const g = pick([['Zib','green'],['Wug','spotty'],['Blip','fluffy'],['Mop','purple'],['Tod','stripy']]), type = L === 3 && Math.random() < .5 ? 'apart' : 'nested', want = pick(L === 1 ? ['sure','no','ct'] : ['sure','no','ct','ct']);
  for (let i = 0; i < 300; i++) {
    const fact = pick(L === 1 ? ['isA','notB','isB'] : ['isA','isB','notA','notB']), claim = pick(['isA','isB','notA','notB']); if (claim === fact) continue;
    const P = REG[type][fact], C = REG[type][claim], inn = P.filter(r => C.includes(r)).length, v = inn === P.length ? 'sure' : inn === 0 ? 'no' : 'ct';
    if (v === want) return { type, G:g[0], prop:g[1], who:pick(['Pim','Bo','Taz','Lulu','Kip']), fact, claim, v, step:0, optsK:shuffle(['isA','isB','notA','notB']) };
  }
}, view(q) {
  const P = REG[q.type][q.fact];
  return '<div class="bub rule"><small>The rule</small>' + (q.type === 'nested' ? 'All ' + q.G + 's are ' + q.prop + '.' : 'No ' + q.G + 's are ' + q.prop + '.') + '</div>' +
    '<div class="bub"><small>The fact</small>' + SAY(q, q.fact) + '.</div><div class="pic">' + dia(q, q.step ? P : []) + '</div>' + msg(q) +
    (q.step === 0 ? wn('', 'Where could ' + q.who + ' be? Tap the picture that fits. A dotted spot means "maybe here".') + '<div class="ch two">' + q.optsK.map(k => '<button class="c" data-act="place" data-k="' + k + '">' + dia(q, REG[q.type][k], true) + '</button>').join('') + '</div>'
      : '<div class="claim">“' + SAY(q, q.claim) + '.”</div>' + (q.done ? wn(q.v === 'sure' ? 'Yes, for sure!' : q.v === 'no' ? 'Impossible!' : 'Can\'t tell!', q.v === 'sure' ? 'Every spot ' + q.who + ' could be in makes it true.' : q.v === 'no' ? 'No spot ' + q.who + ' could be in makes it true.' : 'One spot makes it true and another makes it false. The clues do not decide.')
        : wn('', 'Look at where ' + q.who + ' could be. Is this true?') + '<div class="ch three">' + [['sure','Yes, for sure'],['no','No, impossible'],['ct','Can\'t tell']].map(o => '<button class="c big" data-act="say" data-k="' + o[0] + '">' + o[1] + '</button>').join('') + '</div>'));
}, act(q, a, d) {
  if (a === 'place') { if (REG[q.type][d.k].join() === REG[q.type][q.fact].join()) good(q, 'Yes! That is everywhere ' + q.who + ' could be.'); else bad(q, 'Not quite. The fact only tells us this much. Look at the dots.'); q.step = 1; }
  else if (a === 'say') { if (d.k === q.v) good(q, 'Spot on.'); else bad(q, 'Not this time. Check each dot against the sentence.'); q.done = true; }
} };

/* ================= 3. LINE UP: place people in order, one clue at a time ================= */
const RELS = [['taller','shorter','tallest','shortest'],['older','younger','oldest','youngest'],['faster','slower','fastest','slowest']];
const PCOL = ['#e63946','#1d7fd8','#2bb673','#ffc300'];
M.line = { name:'Line up', tag:'Put them in order', make(L) {
  const N = shuffle(['Ava','Ben','Cal','Dee','Eli','Fay','Gus','Ida']).slice(0, 4), rel = pick(RELS), s = (a, b, who, ans) => ({ a, b, who, ans });
  const pats = [[{ line:[0,1], steps:[s(1,2,2,2)], fin:[3,2] }, { line:[1,2], steps:[s(0,1,0,0)], fin:[2,0] }],
    [{ line:[1,2], steps:[s(0,1,0,0), s(2,3,3,3)] }, { line:[0,2], steps:[s(0,1,1,'ct'), s(1,2,1,1), s(2,3,3,3)] }],
    [{ line:[0,2], steps:[s(0,1,1,'ct'), s(1,2,1,1), s(2,3,3,3)], fin:[3,3] }, { line:[0,1], steps:[s(1,2,2,2), s(0,3,3,'ct')], fin:[3,'ct'] }, { line:[0,1], steps:[s(1,2,2,2), s(0,3,3,'ct')], fin:[2,0] }, { line:[1,3], steps:[s(0,3,0,'ct'), s(0,1,0,0), s(2,3,2,'ct')], fin:[3,3] }]];
  const p = pick(pats[L - 1]), say = (a, b) => Math.random() < .5 ? N[a] + ' is ' + rel[0] + ' than ' + N[b] + '.' : N[b] + ' is ' + rel[1] + ' than ' + N[a] + '.';
  return { N, rel, line:p.line.slice(), pend:[], steps:p.steps.map(x => Object.assign({ t:say(x.a, x.b) }, x)), fin:p.fin, first:say(p.line[0], p.line[1]), si:0, old:[] };
}, view(q) {
  const st = q.steps[q.si], card = i => '<div class="pp"><i style="background:' + PCOL[i] + '"></i>' + q.N[i] + '</div>', asking = !q.done && !q.final;
  let row = '<span class="end">' + q.rel[2] + '</span>';
  q.line.forEach((p, k) => { if (asking) row += '<button class="slot" data-act="slot" data-k="' + k + '" aria-label="Place before ' + q.N[p] + '">+</button>'; row += card(p); });
  if (asking) row += '<button class="slot" data-act="slot" data-k="' + q.line.length + '" aria-label="Place at the end">+</button>';
  row += '<span class="end">' + q.rel[3] + '</span>';
  const people = q.N.filter((_, i) => q.line.includes(i) || q.pend.includes(i) || (st && st.who === i));
  return '<div class="bub old">✓ ' + esc(q.first) + '</div>' + q.old.map(t => '<div class="bub old">✓ ' + esc(t) + '</div>').join('') + (asking ? '<div class="bub"><small>New clue</small>' + esc(st.t) + '</div>' : '') +
    '<div class="pic"><div class="line">' + row + '</div>' + (q.pend.length ? '<div class="pend">Not placed yet:' + q.pend.map(card).join('') + '</div>' : '') + '</div>' + msg(q) +
    (asking ? wn('', 'Where does ' + q.N[st.who] + ' go? Tap a + in the line. If the clues do not say exactly, tap "Can\'t tell yet".') + '<button class="btn alt" data-act="slot" data-k="ct">Can\'t tell yet</button>'
      : q.final && !q.done ? wn('', 'Who is the ' + q.rel[q.fin[0]] + '?') + '<div class="ch two">' + q.N.map((n, i) => '<button class="c big" data-act="fin" data-k="' + i + '">' + n + '</button>').join('') + '<button class="c big" data-act="fin" data-k="ct" style="grid-column:1/-1">Can\'t tell</button></div>'
      : wn('Lined up!', q.fin ? 'The ' + q.rel[q.fin[0]] + ': ' + (q.fin[1] === 'ct' ? 'can\'t tell. More than one person could be.' : q.N[q.fin[1]] + '.') : 'Every clue is used and everyone has a place.'));
}, act(q, a, d) {
  if (a === 'slot') { const st = q.steps[q.si], k = d.k === 'ct' ? 'ct' : +d.k, nm = q.N[st.who];
    if (k === st.ans) good(q, k === 'ct' ? 'Right. The clue is not enough to place ' + nm + ' exactly.' : 'Yes! ' + nm + ' goes there.');
    else bad(q, st.ans === 'ct' ? 'Careful. “' + esc(st.t) + '” does not say where ' + nm + ' is compared with everyone else. We can\'t tell yet.' : 'Not quite. Read it again: “' + esc(st.t) + '” ' + nm + ' is placed now.');
    q.pend = q.pend.filter(x => x !== st.who); if (st.ans === 'ct') q.pend.push(st.who); else q.line.splice(st.ans, 0, st.who);
    q.old.push(st.t); q.si++; if (q.si === q.steps.length) { if (q.fin) q.final = true; else q.done = true; } }
  else if (a === 'fin') { const k = d.k === 'ct' ? 'ct' : +d.k; if (k === q.fin[1]) good(q, 'Exactly.'); else bad(q, 'Not this time. Look at the line and at who is not placed.'); q.done = true; }
} };

/* ================= 4. FOLLOW THE RULE: a rule is given; work out what must come next ================= */
const RULES = [
  [() => { const k = pick([2, 5, 10]); return { t:'Add ' + k + ' each time.', s:[rr(1, 9)], f:s => s[s.length - 1] + k, l:() => '+' + k }; }, () => { const k = pick([1, 2]); return { t:'Take away ' + k + ' each time.', s:[rr(14, 20)], f:s => s[s.length - 1] - k, l:() => '−' + k }; }],
  [() => ({ t:'Double it each time.', s:[rr(1, 3)], f:s => s[s.length - 1] * 2, l:() => '×2' }), () => ({ t:'Take away 5 each time.', s:[rr(50, 60)], f:s => s[s.length - 1] - 5, l:() => '−5' }),
   () => ({ t:'Add 3, then take away 1. Keep taking turns.', s:[rr(2, 9)], f:s => s[s.length - 1] + (s.length % 2 ? 3 : -1), l:i => i % 2 ? '−1' : '+3' })],
  [() => ({ t:'Double it, then take away 1.', s:[rr(2, 4)], f:s => s[s.length - 1] * 2 - 1, l:() => '×2 −1' }), () => ({ t:'Add the two numbers before it.', s:[rr(1, 3), rr(2, 5)], f:s => s[s.length - 1] + s[s.length - 2], l:() => '+' }),
   () => ({ t:'Double it, then add 1. Keep taking turns.', s:[rr(1, 3)], f:s => s.length % 2 ? s[s.length - 1] * 2 : s[s.length - 1] + 1, l:i => i % 2 ? '+1' : '×2' })]];
M.rule = { name:'Follow the rule', tag:'What must come next?', make(L) {
  const r = pick(RULES[L - 1])(), s = r.s.slice(); while (s.length < 4) s.push(r.f(s));
  const q = { r, s, step:0 }; M.rule.opts(q); return q;
}, opts(q) { const s = q.s, c = q.r.f(s), l = s[s.length - 1]; q.ans = c;
  q.o = shuffle([c].concat(shuffle([...new Set([c + 1, c - 1, l, c + 2, l + (l - s[s.length - 2]), c - 2, c + 10, l * 2])].filter(v => v > 0 && v !== c)).slice(0, 3)));
}, view(q) {
  const s = q.s, n = q.done ? s.length : s.length + 1;
  let seq = ''; for (let i = 0; i < n; i++) { if (i) seq += '<span class="gp">' + q.r.l(i - 1) + '</span>'; seq += '<span class="tm' + (i >= s.length ? ' q' : i >= 4 ? ' new' : '') + '">' + (i < s.length ? s[i] : '?') + '</span>'; }
  return '<div class="bub rule"><small>The rule</small>' + esc(q.r.t) + '</div><div class="pic"><div class="seq">' + seq + '</div></div>' + msg(q) +
    (q.done ? wn('Rule followed!', 'If the rule is true, these numbers had to come next. No guessing needed.') : wn(q.step ? 'And what next?' : '', 'Use the rule on the last number' + (q.r.s.length > 1 ? 's' : '') + '.') + '<div class="ch two">' + q.o.map(v => '<button class="c big num" data-act="pickn" data-k="' + v + '">' + v + '</button>').join('') + '</div>');
}, act(q, a, d) {
  if (a === 'pickn') { if (+d.k === q.ans) good(q, 'Yes! ' + q.ans + ' has to be next.'); else bad(q, 'Not quite. The rule gives ' + q.ans + '. Check: ' + esc(q.r.t));
    q.s.push(q.ans); q.step++; if (q.step === 2) q.done = true; else M.rule.opts(q); }
} };

/* ================= shell ================= */
const MODES = ['out','sure','line','rule'];
const IC = { mix:'<svg viewBox="0 0 54 36"><rect x="9" y="3" width="15" height="13" rx="3"/><circle cx="37" cy="9" r="7"/><path d="M9 32l8-13 8 13zM30 20h14v12H30z"/></svg>',
  out:'<svg viewBox="0 0 54 36"><circle cx="11" cy="18" r="8"/><rect x="34" y="10" width="16" height="16" rx="3"/><path d="M20 10l12 16M32 10 20 26" stroke="#e63946"/></svg>',
  sure:'<svg viewBox="0 0 54 36"><circle cx="27" cy="18" r="16"/><circle cx="27" cy="22" r="8"/><circle cx="27" cy="22" r="2" fill="#e63946" stroke="#e63946"/></svg>',
  line:'<svg viewBox="0 0 54 36"><path d="M8 33V20M20 33V12M32 33V24M44 33V5"/></svg>',
  rule:'<svg viewBox="0 0 54 36"><rect x="3" y="11" width="13" height="14" rx="3"/><rect x="38" y="11" width="13" height="14" rx="3" stroke-dasharray="4 3"/><path d="M19 18h15m-4-4 4 4-4 4"/></svg>',
  clue:'<svg viewBox="0 0 54 36"><path d="M8 5h38a3 3 0 0 1 3 3v15a3 3 0 0 1-3 3H24l-9 7v-7H8a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3z"/></svg>',
  think:'<svg viewBox="0 0 54 36"><path d="M12 7l10 22M22 7 12 29" stroke="#e63946"/><circle cx="38" cy="18" r="10"/></svg>',
  tick:'<svg viewBox="0 0 54 36"><path d="m12 19 9 10 21-23" stroke="#2bb673" stroke-width="5"/></svg>' };
const starsOf = m => Math.max(1, 3 - m);
const stars = n => '<span class="stars" aria-label="' + n + ' out of 3 stars">' + [0,1,2].map(i => '<i class="' + (i < n ? 'on' : '') + '">★</i>').join('') + '</span>';
function start() {
  const kinds = S.mode === 'mix' ? shuffle(MODES) : [S.mode, S.mode, S.mode, S.mode];
  S.test = kinds.map(k => Object.assign(M[k].make(S.level), { mode:k, mist:0, msg:'', done:false })); S.idx = 0; S.res = []; S.view = 'play'; save(PREF, { level:S.level, mode:S.mode }); render(); scrollTo(0, 0);
}
function render() {
  const pill = $('#pill');
  if (S.view === 'play') { pill.hidden = false; pill.textContent = '★ ' + S.res.reduce((a, b) => a + b, 0) + ' · ' + (S.idx + 1) + '/' + S.test.length; } else pill.hidden = true;
  $('#app').innerHTML = S.view === 'home' ? home() : S.view === 'play' ? play() : results();
}
function home() {
  const h = hist().filter(r => r.l === S.level), b = h.length ? Math.max(...h.map(r => r.p)) : 0;
  return '<h1 class="title">What next?</h1><p class="tag">Don\'t guess. Use the clues to work out what <u>must</u> be true.</p>' +
    '<div class="how">' + [['clue','Get a clue',''],['think','Rule things out',''],['tick','Be sure','']].map((x, i) => '<div class="hw">' + IC[x[0]] + '<b>' + (i + 1) + '. ' + x[1] + '</b></div>').join('') + '</div>' +
    '<div class="panel"><div class="lbl" style="margin-top:0">Level</div><div class="opts">' + [1,2,3].map(l => '<button data-act="level" data-v="' + l + '" aria-pressed="' + (S.level === l) + '">' + LV[l - 1] + '</button>').join('') + '</div>' +
    '<div class="lbl">Puzzles</div><div class="tiles">' + ['mix'].concat(MODES).map(k => '<button class="tile" data-act="mode" data-v="' + k + '" aria-pressed="' + (S.mode === k) + '">' + IC[k] + (k === 'mix' ? 'One of each' : M[k].name) + '</button>').join('') + '</div>' +
    '<div class="row"><button class="btn" data-act="start">Start · 4 puzzles</button>' + (b ? '<span>Best: <b class="num">' + b + ' / 12</b> ★</span>' : '') + '</div></div>';
}
function play() {
  const q = S.test[S.idx], m = M[q.mode], last = S.idx === S.test.length - 1;
  return '<div class="panel"><div class="qhead"><span>Puzzle ' + (S.idx + 1) + ' of ' + S.test.length + '</span><span>' + LV[S.level - 1] + '</span></div><h2 class="kind">' + m.name + '</h2>' + m.view(q) +
    (q.done ? '<div class="row">' + stars(starsOf(q.mist)) + '<button class="btn blue" data-act="' + (last ? 'finish' : 'next') + '">' + (last ? 'See my stars' : 'Next puzzle') + ' →</button></div>' : '') + '</div>';
}
function results() {
  const t = S.res.reduce((a, b) => a + b, 0), max = S.res.length * 3, p = t / max;
  return '<div class="panel"><h2 class="big num">' + t + ' / ' + max + ' ★</h2><p style="margin:8px 0 14px;font-size:19px">' + (p >= .9 ? 'Super sleuth! You only said what the clues prove.' : p >= .6 ? 'Good thinking. Keep checking every clue.' : 'Slow down. Ask: does the clue really say that?') + '</p>' +
    S.test.map((q, i) => '<div class="rv"><span>' + (i + 1) + '. ' + M[q.mode].name + '</span>' + stars(S.res[i]) + '</div>').join('') +
    '<div class="row"><button class="btn" data-act="start">Play again</button><button class="btn alt" data-act="home">Home</button></div></div>';
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, q = S.test && S.test[S.idx];
  if (a === 'home') S.view = 'home';
  else if (a === 'level') S.level = +b.dataset.v;
  else if (a === 'mode') S.mode = b.dataset.v;
  else if (a === 'start') return start();
  else if (a === 'next' || a === 'finish') { S.res[S.idx] = starsOf(q.mist);
    if (a === 'next') S.idx++; else { const h = hist(); h.unshift({ t:Date.now(), l:S.level, p:S.res.reduce((x, y) => x + y, 0) }); save(KEY, h.slice(0, 20)); S.view = 'results'; }
    render(); return scrollTo(0, 0); }
  else if (q && !q.done) M[q.mode].act(q, a, b.dataset);
  render();
});
render();
}
</script>
</body>
</html>
