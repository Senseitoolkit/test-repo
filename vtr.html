<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PYP Thinking Routines Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: planner rail (3 ordered choices) on the left, routine card on the right; stacks on phones. Classroom display is a full-screen overlay. */
:root{
  --paper:#f4f6f9; --card:#ffffff; --ink:#18233a; --muted:#5b6679; --line:#dde2ea;
  --accent:#1f5fd1; --accent-ink:#ffffff; --hi:#ffd23f; --soft:#e8eefb;
  --c-see:#1f5fd1; --c-ask:#7a3fd1; --c-link:#0f8a6a; --c-view:#c2410c; --c-reason:#b4235a; --c-act:#0e7490; --c-sum:#946200;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --stage:#101a2e; --stage-ink:#f5f7fb;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1522; --card:#172033; --ink:#e8edf6; --muted:#9aa6bb; --line:#2a3550;
  --accent:#6b9cff; --accent-ink:#0f1522; --hi:#ffd23f; --soft:#1f2b45;
  --c-see:#6b9cff; --c-ask:#b28cff; --c-link:#4fd1a8; --c-view:#ff9a5c; --c-reason:#ff7aa8; --c-act:#5fd0e6; --c-sum:#f2c14e;
  --stage:#070b14; --stage-ink:#f5f7fb; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1522; --card:#172033; --ink:#e8edf6; --muted:#9aa6bb; --line:#2a3550;
  --accent:#6b9cff; --accent-ink:#0f1522; --hi:#ffd23f; --soft:#1f2b45;
  --c-see:#6b9cff; --c-ask:#b28cff; --c-link:#4fd1a8; --c-view:#ff9a5c; --c-reason:#ff7aa8; --c-act:#5fd0e6; --c-sum:#f2c14e;
  --stage:#070b14; --stage-ink:#f5f7fb; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:24px 48px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,3.4vw,2.3rem);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{background:linear-gradient(transparent 62%,var(--hi) 62%);padding:0 .08em}
.tag{color:var(--muted);margin:.35rem 0 0;max-width:52ch}
.grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}

/* Planner rail */
.rail{display:flex;flex-direction:column;gap:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:860px){.rail{position:static}}
.step{display:flex;flex-direction:column;gap:8px}
.step h2{font-family:var(--display);font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0;display:flex;align-items:center;gap:8px}
.step h2 b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:.75rem;letter-spacing:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.92rem;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:6px 11px;border-radius:999px;cursor:pointer;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.theme-list .chip{border-radius:10px;text-align:left;width:100%}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-size:1.05rem}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.small{padding:7px 11px;font-size:.88rem;border-radius:9px}
.actions{display:grid;gap:8px}
.fit{font-size:.85rem;color:var(--muted);margin:0}

/* Routine card */
.out{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;min-width:0}
.out-head{padding:22px 24px 18px;border-top:8px solid var(--rc);display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-start}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pill{font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--ink)}
.pill.r{background:var(--rc);color:var(--card)}
.rname{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,3.6vw,2.5rem);line-height:1.02;margin:0;text-wrap:balance;letter-spacing:-.015em}
.best{color:var(--muted);margin:.4rem 0 0;font-size:.95rem}
.head-actions{display:flex;flex-wrap:wrap;gap:8px}
.sec{padding:18px 24px;border-top:1px solid var(--line)}
.sec h3{font-family:var(--display);font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 10px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.prompt{font-size:1.08rem;margin:0;max-width:65ch}
.prompt strong{background:linear-gradient(transparent 60%,color-mix(in srgb,var(--hi) 70%,transparent) 60%)}
.linkbtn{font:inherit;font-size:.82rem;font-weight:700;text-transform:none;letter-spacing:0;background:none;border:0;color:var(--accent);cursor:pointer;padding:2px 4px;border-radius:6px}
.linkbtn:hover{text-decoration:underline}
.qsteps{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.q{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.q .lab{font-family:var(--display);font-weight:800;font-size:1.25rem;color:var(--rc);line-height:1.1}
.q .lab small{display:block;font-family:var(--body);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.q ul{margin:0;padding-left:1.1em}
.q li{margin:.15em 0}
.starter{font-size:.86rem;color:var(--muted);font-style:italic;border-top:1px dashed var(--line);padding-top:6px;margin-top:auto}
.push{font-size:.86rem;border-top:1px dashed var(--line);padding-top:6px;margin-top:auto}
.push b{color:var(--rc)}
.lens{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border-radius:12px;padding:12px 14px}
.lens .ic{flex:none;width:28px;height:28px;border-radius:8px;background:var(--rc);color:var(--card);display:grid;place-items:center;font-weight:800;font-family:var(--display)}
.lens p{margin:0}
.note{margin:10px 0 0;font-size:.94rem;color:var(--muted);max-width:68ch}
.eng-chips{margin-bottom:12px}
.eng ol{margin:0;padding-left:1.25em;display:grid;gap:4px;max-width:68ch}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:.86rem;padding:4px 10px;border-radius:8px;border:1.5px solid var(--line)}
.reflect{border-left:4px solid var(--rc);padding:6px 0 6px 14px;margin:0}
.compass{display:grid;grid-template-areas:". n ." "w c e" ". s .";grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.compass .q{min-width:0}
.compass .cn{grid-area:n}.compass .ce{grid-area:e}.compass .cs{grid-area:s}.compass .cw{grid-area:w}
.compass .hub{grid-area:c;display:grid;place-items:center;width:64px}
.compass .hub svg{width:56px;height:56px}
@media (max-width:640px){.compass{grid-template-areas:"n" "e" "s" "w";grid-template-columns:1fr}.compass .hub{display:none}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:700;z-index:60}
.copybox{width:100%;min-height:160px;margin-top:10px;font:inherit;font-size:.85rem;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px}

.pick{font:inherit;font-size:1rem;width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.pick:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.pick.on{border-color:var(--accent);border-width:2px}
.warn{margin:10px 0 0;font-size:.9rem;padding:8px 12px;border-radius:10px;background:var(--soft)}
.lib{border-top:1px solid var(--line);padding-top:14px}
.lib summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:.95rem;list-style:none;display:flex;justify-content:space-between;align-items:center}
.lib summary::-webkit-details-marker{display:none}
.lib summary::after{content:"+";font-size:1.2rem;color:var(--muted)}
.lib[open] summary::after{content:"–"}
.lib h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:12px 0 6px}
.lib .chip{font-size:.84rem;padding:5px 10px;border-left:5px solid var(--cc)}
.lib .chip[disabled]{opacity:.45;cursor:not-allowed}
.lib .chip small{font-size:.7rem;color:var(--muted);margin-left:4px}
.lib .chip[aria-pressed="true"] small{color:inherit}
.star{color:#e0a400}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;background:var(--cc)}
.qsteps.four{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.ed{outline:1.5px dashed color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;border-radius:4px;cursor:text;min-width:2ch;display:inline-block}
p.ed,div.ed{display:block}
.ed:hover{background:var(--soft)}
.ed:focus{outline:2px solid var(--accent);background:var(--soft)}
.ed:empty::before{content:"Type here…";color:var(--muted)}
.x{font:inherit;font-size:.95rem;line-height:1;border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 6px;margin-left:4px;border-radius:6px}
.x:hover{color:var(--ink);background:var(--soft)}
.addbtn{font:inherit;font-size:.82rem;font-weight:700;border:1.5px dashed var(--line);background:none;color:var(--accent);border-radius:8px;padding:4px 10px;cursor:pointer;align-self:flex-start;margin-top:4px}
.addbtn:hover{border-color:var(--accent)}
.editbar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;padding:9px 24px;background:var(--soft);font-size:.88rem;font-weight:700;border-top:1px solid var(--line)}
.fieldlab{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 4px;font-weight:700}
.prompt.sm{font-size:.98rem}
.editing .q ul{padding-left:1.1em}
.best.top{margin:0 0 4px;font-weight:700;font-size:.85rem;color:var(--muted)}
.sec h3 span{display:flex;align-items:center;gap:8px}
.sec h3 .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--rc);color:var(--card);font-size:.75rem;letter-spacing:0}
.pick.narrow{width:auto;min-width:220px;max-width:100%;margin-bottom:12px}
.more{border-top:1px solid var(--line)}
.more summary{cursor:pointer;padding:16px 24px;font-family:var(--display);font-weight:700;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary::before{content:"▸";color:var(--muted);transition:transform .15s}
.more[open] summary::before{transform:rotate(90deg)}
.more summary span{font-family:var(--body);font-weight:400;font-size:.88rem;color:var(--muted)}
.more summary:focus-visible{outline:3px solid var(--hi);outline-offset:-3px}
.more .note{margin:0}
.foot{display:flex;flex-wrap:wrap;gap:8px;padding:14px 24px;border-top:1px solid var(--line);background:var(--paper)}
#another{width:100%}
.menu-bar{display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:14px}
.mb-item{display:flex;flex-wrap:wrap;align-items:center;gap:10px;min-width:0}
.mb-lab{font-family:var(--display);font-weight:700;font-size:.8rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.menu-bar .pick.narrow{margin:0}
.suggest{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;background:var(--soft);border-radius:16px;padding:16px 18px;margin-bottom:26px}
.sg-title{font-family:var(--display);font-weight:800;font-size:1.15rem;margin:0}
.sg-sub{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.suggest .chips{max-width:620px}
.mhead{font-family:var(--display);font-weight:800;font-size:1.25rem;margin:0 0 12px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:28px}
.tile{font:inherit;text-align:left;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden;transition:border-color .15s,transform .15s}
.tile::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--cc)}
.tile:hover{border-color:var(--cc);transform:translateY(-2px)}
.tile:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.tile.dim{opacity:.55}
.t-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.t-cat{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--cc)}
.t-name{font-family:var(--display);font-weight:800;font-size:1.2rem;line-height:1.15}
.t-chain{font-weight:700;font-size:.88rem;background:var(--soft);border-radius:8px;padding:4px 8px;align-self:flex-start}
.t-best{font-size:.88rem;color:var(--muted)}
.t-age{font-size:.78rem;font-weight:700;color:var(--muted);margin-top:auto}
.back{width:100%}
@media (prefers-reduced-motion:reduce){.tile:hover{transform:none}}
.say{background:var(--soft);border-radius:14px;padding:14px 16px;margin:2px 0 10px;border-left:5px solid var(--rc)}
.say-lab{margin:0 0 4px;font-weight:700;font-size:.85rem;color:var(--muted)}
.say-text{margin:0;font-size:1.08rem;max-width:65ch}
.tsteps summary{cursor:pointer;font-weight:700;font-size:.92rem;color:var(--accent);margin:4px 0 8px}
.stage-q.long{font-size:clamp(1.25rem,3vw,2.3rem);font-weight:400;line-height:1.35;max-width:46ch}
.stage-cue{align-self:flex-start;margin:1vh 0 0;font-size:clamp(1rem,2vw,1.4rem);font-weight:700;background:#ffffff1a;border:1.5px solid #ffffff30;border-radius:999px;padding:8px 18px}
.unitband{padding:14px 24px;border-top:1px solid var(--line);background:color-mix(in srgb,var(--rc) 7%,var(--card));display:grid;gap:6px}
.unitband p{margin:0;max-width:75ch}
.ub-top{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:.85rem;color:var(--muted);font-weight:700}
.ub-unit{font-family:var(--display);font-size:1.05rem;color:var(--ink)}
.nowpill{color:var(--c-link);font-size:.8rem}
.ub-loi{font-size:.95rem}
.tags.kc span{font-size:.78rem;padding:2px 8px;border-color:var(--rc);color:var(--ink)}
.eu{margin:0 0 6px;max-width:70ch}
.munit{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 18px;margin:-4px 0 14px;display:grid;gap:4px;font-size:.95rem}
.munit p{margin:0;max-width:85ch}
#loiWrap{margin-top:6px}
.menu-bar .pick.narrow{max-width:min(100%,420px)}
/* Classroom display */
.stage{position:fixed;inset:0;background:var(--stage);color:var(--stage-ink);z-index:50;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 18px) 24px calc(env(safe-area-inset-bottom,0px) + 18px)}
.stage-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stage-top .rn{font-family:var(--display);font-weight:700;opacity:.8}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:#ffffff33}
.dots i.on{background:var(--hi)}
.stage-main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2vh;max-width:1100px;margin:0 auto;width:100%;min-height:0}
.stage-kicker{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,7vw,5.5rem);line-height:1;color:var(--hi);margin:0}
.stage-q{font-family:var(--body);font-weight:700;font-size:clamp(1.5rem,4.4vw,3.4rem);line-height:1.2;margin:0;text-wrap:balance}
.stage-sub{font-size:clamp(1rem,2.2vw,1.6rem);opacity:.75;margin:0;max-width:40ch}
.stage-bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.stage .btn{background:#ffffff14;color:var(--stage-ink);border:1.5px solid #ffffff30}
.stage .btn:hover{background:#ffffff26}
.stage .btn.go{background:var(--hi);color:#18233a;border-color:var(--hi)}
.timer{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.clock{font-family:var(--display);font-weight:800;font-size:1.8rem;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:center}
.clock.done{color:var(--hi);animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.clock.done{animation:none}*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1>PYP <span>Thinking Routines</span> Planner</h1>
      <p class="tag" id="tagline"></p>
    </div>
  </header>

  <section id="menu" aria-label="Routine menu">
    <div class="menu-bar">
      <div class="mb-item"><span class="mb-lab">Grade</span><div class="chips" id="mYears" role="group" aria-label="Year group"></div></div>
      <div class="mb-item"><span class="mb-lab">Unit</span><select id="mUnit" class="pick narrow" aria-label="Unit"></select></div>
      <div class="mb-item" id="mLoiWrap"><span class="mb-lab">Focus</span><select id="mLoi" class="pick narrow" aria-label="Line of inquiry"></select></div>
    </div>
    <div class="munit" id="mUnitInfo" hidden></div>
    <h2 class="mhead">Most used</h2>
    <div class="tiles" id="tilesCore"></div>
    <div class="suggest">
      <div><p class="sg-title">✨ Not sure which to use?</p><p class="sg-sub">Pick the moment in your lesson and we'll choose for you.</p></div>
      <div class="chips" id="mFocus"></div>
    </div>
    <h2 class="mhead">More routines</h2>
    <div class="tiles" id="tilesMore"></div>
    <div class="legend" id="mLegend"></div>
  </section>

  <div class="grid" id="planner" hidden>
    <aside class="rail" aria-label="Set up your routine">
      <button class="btn ghost back" id="toMenu" type="button">← All routines</button>
      <div class="step">
        <h2><b>1</b>Grade</h2>
        <div class="chips" id="years" role="group" aria-label="Year group"></div>
      </div>
      <div class="step">
        <h2><b>2</b>Unit and line of inquiry</h2>
        <select id="unitSel" class="pick" aria-label="Unit"></select>
        <div id="loiWrap"><select id="loiSel" class="pick" aria-label="Line of inquiry"></select></div>
      </div>
      <div class="step">
        <h2><b>3</b>Choose a routine</h2>
        <select id="pickSel" class="pick" aria-label="Thinking routine"></select>
        <p class="fit" id="fit"></p>
      </div>
      <button class="btn ghost" id="another" type="button">Try another routine ↻</button>
    </aside>

    <main class="out" id="out" aria-live="polite"></main>
  </div>
</div>

<div class="stage" id="stage" hidden role="dialog" aria-modal="true" aria-label="Classroom display">
  <div class="stage-top">
    <div class="rn" id="stRn"></div>
    <div class="dots" id="stDots"></div>
    <button class="btn small" id="stClose" type="button">Exit display ✕</button>
  </div>
  <div class="stage-main" id="stMain"></div>
  <div class="stage-bar">
    <div class="timer">
      <span class="clock" id="clock">0:00</span>
      <button class="btn small" data-t="60" type="button">1 min</button>
      <button class="btn small" data-t="120" type="button">2 min</button>
      <button class="btn small" data-t="180" type="button">3 min</button>
