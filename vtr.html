<script>
const POI={"K1": [{"id": "K1-2", "theme": "wwa", "title": "Understanding our identity", "time": "Aug. 31 – Sept. 25 (4 weeks) Nov. 30 - Jan. 22 (5 weeks)", "ci": "We learn about ourselves through interactions with others.", "kc": ["Form", "Function", "Connection", "Responsibility"], "rc": "choice, behaviour, consequences, relationships, roles, similarities, differences, similarities / differences, well-being, choices, care, behaviour, capabilities, strengths, growth", "atl": ["Communication skills", "Self-management skills", "Social skills"], "lp": ["Communicators", "Risk-takers"], "blurb": "An inquiry into identity and responsibility. Students explore how we learn about ourselves through our actions, relationships, and experiences. They develop an understanding that their choices affect their well-being and others around them.", "loi": [{"t": "Our actions and choices help us understand who we are. (responsibility)", "eu": "The choices we make and the way we act help us learn about ourselves. Our actions can affect how we feel and how others respond to us."}, {"t": "Relationships influence our sense of self. (connection)", "eu": "Our relationships with family and others help shape who we are. Interacting with others helps us understand our feelings and identity."}, {"t": "Our bodies and feelings give us information about ourselves. (form)", "eu": "Our bodies and feelings help us understand what we need and how we feel. Paying attention to them helps us take care of ourselves."}, {"t": "People have different strengths that help them grow. (function, connection)", "eu": "Everyone has different strengths and abilities. These differences help us learn, grow, and support one another."}]}, {"id": "K1-3", "theme": "hwo", "title": "Transportation", "time": "Sept 28 – Nov. 27 (9 weeks)", "ci": "People make transportation systems to help the needs of the community.", "kc": ["Form", "Function", "Connection"], "rc": "properties, similarities / differences, features, categories, behaviour, systems, choice, purpose, needs, efficiency, systems, relationships, connections, roles, interdependence", "atl": ["Thinking skills", "Research skills"], "lp": ["Thinkers", "Communicators", "Reflective"], "blurb": "An inquiry into how transportation helps people meet their needs and connect with others, including the different types of transportation and why people choose them. Students explore how transportation systems work together in their community to help people move safely and efficiently.", "loi": [{"t": "Transportation systems are designed to meet people’s needs. (form)", "eu": "Transportation is created to help people move and meet their needs. Different systems help people travel in different ways."}, {"t": "We choose transportation based on our needs and activities. (function)", "eu": "People choose different types of transportation depending on what they need and where they are going. Choices can change depending on the situation."}, {"t": "Transportation systems connect people and places in a community. (connection)", "eu": "Transportation helps connect people and places within a community. These connections make it easier for people to live, work, and interact."}]}, {"id": "K1-4", "theme": "stp", "title": "Homes", "time": "Jan. 25 – Mar. 26 (9 weeks)", "ci": "A home is a basic need for all life on Earth.", "kc": ["Form", "Function", "Causation", "Change", "Connection"], "rc": "diversity, locality, community, features, structure, similarities / differences, community, needs, environment, location, purpose, change, care, responsibility, growth", "atl": ["Research skills", "Communication skills"], "lp": ["Inquirers", "Knowledgeable", "Communicators", "Open-minded", "Caring"], "blurb": "An inquiry into homes as a basic need for all living things, including how homes are designed to meet needs and how they can change over time. Students explore different types of homes, why they are built in different ways, and how we care for the places where people and animals live.", "loi": [{"t": "Homes are designed to meet the needs of living things. (form, function)", "eu": "Homes provide shelter and meet the needs of people and animals. Different living things need different kinds of homes."}, {"t": "Homes are built differently depending on place and environment. (causation)", "eu": "Homes are built in different ways depending on where they are. The environment influences how homes are made and used."}, {"t": "Homes change over time and require care. (change and responsibility)", "eu": "Homes can change over time, and living things grow and change too. Taking care of homes helps keep them safe and useful."}]}, {"id": "K1-5", "theme": "hwe", "title": "Expressing emotions through art", "time": "Apr. 5 – Jun. 4 (9 weeks)", "ci": "We can use our imagination to express our emotions and creativity through the arts.", "kc": ["Form", "Change", "Connection", "Perspective"], "rc": "structure, similarities / differences, features, properties, relationships, expression, purpose, choice, communication, opinion, subjectivity, creativity, imagination, ideas, perspective,emotion, expression, response, feelings", "atl": ["Thinking skills", "Communication skills", "Self-management skills", "Social skills"], "lp": ["Inquirers", "Communicators", "Open-minded", "Reflective", "Balanced", "Risk-takers"], "blurb": "An inquiry into how people express ideas, emotions, and creativity through different art forms. Students explore how materials, movement, music, and imagination can be used to communicate feelings and perspectives.", "loi": [{"t": "Different art forms use materials to express ideas and feelings. (form)", "eu": "Different art forms use materials in different ways to share ideas and feelings. The materials we choose affect how we express ourselves."}, {"t": "People use materials and objects to communicate ideas and emotions. (connection)", "eu": "People can use a variety of materials and objects to communicate what they think and feel. These choices help others understand their ideas."}, {"t": "Imagination helps us create and share ideas. (perspective)", "eu": "Imagination allows us to create new ideas and express them in different ways. It helps us explore and share our thinking."}, {"t": "People express emotions and ideas in different ways. (perspective, change)", "eu": "People express their emotions and ideas in different ways through art, music, and movement. These differences show that there are many ways to communicate."}]}], "K2": [{"id": "K2-2", "theme": "wwa", "title": "Bodies", "time": "Aug. 17 – Oct. 16 (9 weeks)", "ci": "Our bodies look different but work in the same way.", "kc": ["Form", "Function", "Connection"], "rc": "structure, form, features, similarities, differences, identity, systems, connection, perception, interaction, environment, similarities and differences, function, ability, movement, growth, choice", "atl": ["Thinking skills", "Research skills", "Communication skills", "Social skills"], "lp": ["Inquirers", "Knowledgeable", "Communicators", "Balanced"], "blurb": "An inquiry into the human body and identity. Students explore how body parts and senses help us interact with the world, how bodies function, and how differences and similarities make us unique.", "loi": [{"t": "The human body has different parts inside and outside. (form)", "eu": "Our body has different parts, and each part has a place or purpose."}, {"t": "Our senses help us understand the world around us. (connection)", "eu": "Our senses help us explore and understand the world. They allow us to gather information and respond to our environment."}, {"t": "The body supports many different actions and activities. (function)", "eu": "The body allows us to move, act, and carry out everyday activities. What our body can do helps us interact with the world around us."}]}, {"id": "K2-3", "theme": "wwpt", "title": "Different Cultures", "time": "Nov. 2 – Jan. 22 (9 weeks)", "ci": "Learning about different cultures helps us appreciate the world and our place in it.", "kc": ["Form", "Connection", "Perspective", "Responsibility"], "rc": "structure, diversity, form, features, environment, location, relationships, community, connection, culture, similarities, differences, values, relationships, perspective, responsibility, respect, empathy, appreciation, beliefs", "atl": ["Thinking skills", "Research skills", "Self-management skills"], "lp": ["Thinkers", "Open-minded"], "blurb": "An inquiry into place, culture, and perspective. Students explore how environments and cultures shape the way people live, and how understanding similarities and differences helps us develop respect and appreciation for others.", "loi": [{"t": "Places around the world have different features. (form)", "eu": "Different places have different natural and human features. These features influence how people live."}, {"t": "People live in different ways in different cultures. (connection)", "eu": "People around the world have different ways of living based on their culture. These differences can be seen in traditions, food, and daily life."}, {"t": "Understanding similarities and differences helps us appreciate others. (perspective, responsibility)", "eu": "People may be different or similar in many ways. Recognizing and respecting these differences helps us understand and appreciate others."}]}, {"id": "K2-4", "theme": "hwe", "title": "Storytelling", "time": "Jan. 25 – Mar. 26 (9 weeks)", "ci": "Stories are created to express ideas, engage audiences, and share meaning.", "kc": ["Form", "Function", "Causation", "Connection"], "rc": "structure, pattern, form, features, sequence, elements (characters, setting, plot), interpretation, audience, messages, causation, purpose, meaning, relationship, identity, perspective, connection, experience, inspiration", "atl": ["Communication skills", "Social skills"], "lp": ["Communicators", "Open-minded", "Reflective", "Risk-takers"], "blurb": "An inquiry into expression and communication. Students explore how stories are structured, how they express ideas and perspectives, and how different forms of storytelling communicate meaning.", "loi": [{"t": "Stories have important parts that help us understand them. (form)", "eu": "Stories are made up of important parts such as characters, settings, and events. These parts help us follow and understand the story."}, {"t": "People tell stories for different reasons. (causation)", "eu": "Stories are created to share ideas, feelings, and experiences. People tell stories for different purposes and audiences."}, {"t": "Personal experiences can influence the stories we tell. (connection)", "eu": "Our own experiences and ideas can shape the stories we create. What we know and feel influences what we choose to share."}]}, {"id": "K2-5", "theme": "stp", "title": "Living Things", "time": "Apr. 5 – May 28 (8 weeks)", "ci": "Living things have certain needs in order to grow and stay healthy.", "kc": ["Form", "Connection", "Responsibility"], "rc": "classification, form, characteristics, features, living / non-living, similarities / differences, connection, needs, survival, interdependence, environment, initiative, responsibility, care, impact, choices, action", "atl": ["Thinking skills", "Research skills", "Self-management skills"], "lp": ["Principled", "Caring", "Balanced"], "blurb": "An inquiry into interdependence. Students explore how living things depend on environments, how needs are met, and how human actions impact the natural world.", "loi": [{"t": "Living things have features we can observe. (form)", "eu": "Living things have features that help us identify and describe them. These features can be similar or different."}, {"t": "Living things depend on their environment for their needs. (connection)", "eu": "Living things need their environment to survive and grow. The environment provides what they need, such as food, water, and shelter."}, {"t": "People have a responsibility to care for living things. (responsibility)", "eu": "People’s actions can affect living things and their environments. Caring for living things helps them stay healthy and safe."}]}, {"id": "K2-6", "theme": "hww", "title": "The Scientific Method", "time": "Year-long", "ci": "Scientific investigations allow us to observe, test, and explain changes in the world.", "kc": ["Form", "Function", "Change"], "rc": "systems, order, prediction, sequence, process, function, investigation, tools, evidence, change, observation, causation, patterns, evidence", "atl": ["Thinking skills", "Research skills"], "lp": ["Inquirers", "Thinkers", "Principled"], "blurb": "An inquiry into scientific thinking and change. Students explore how scientists use processes to investigate the world and how observation and evidence help us explain change.", "loi": [{"t": "Scientific investigations follow steps to explore questions. (form)", "eu": "Scientific investigations involve following processes that help us explore questions. These processes help us think carefully about what we are learning."}, {"t": "We use tools and our senses to observe and find out. (function)", "eu": "Tools and our senses help us observe and collect information. This evidence helps us understand and explain what we discover."}, {"t": "Changes in the world can be explored and explained. (change)", "eu": "Things in the world can change in different ways. By observing and investigating, we can explain why these changes happen."}]}], "K3": [{"id": "K3-2", "theme": "hwe", "title": "Celebrations", "time": "Aug. 17 – Sep. 4 (3 weeks) Nov. 2 – Nov. 6 (1 week) Dec. 7 – Feb. 5 (6 weeks) Mar. 29 – Apr. 2 (1 week)", "ci": "Celebrations reflect the importance of events, beliefs, and traditions.", "kc": ["Function", "Connection", "Perspective", "Responsibility"], "rc": "culture, traditions, similarities and differences, expression, community, beliefs, impact, subjectivity, values, meaning, perspective, importance, creativity, expression, communication, choice, audience", "atl": ["Communication skills", "Social skills"], "lp": ["Knowledgeable", "Principled", "Open-minded", "Caring", "Risk-takers"], "blurb": "An inquiry into how people express themselves through celebrations. Students explore how and why people celebrate in different ways and how celebrations reflect beliefs, values, and cultures around the world.", "loi": [{"t": "People celebrate in different ways. (connection)", "eu": "People celebrate important events in different ways. These celebrations can include different activities, traditions, and forms of expression."}, {"t": "Celebrations are influenced by beliefs, traditions, and values. (perspective)", "eu": "Celebrations are shaped by what people believe and value. Traditions and culture influence why and how people celebrate."}, {"t": "Celebrations can be created and shared within communities. (function / responsibility)", "eu": "Celebrations bring people together and can be shared within a community. People can create their own celebrations to express meaning and connection."}]}, {"id": "K3-3", "theme": "wwa", "title": "Food", "time": "Sept. 7 – Oct. 23 (7 weeks)", "ci": "Food choices are influenced by needs, culture, and personal preferences.", "kc": ["Form", "Function", "Connection", "Perspective"], "rc": "balanced, nutrition, choices, health, well-being, food groups, variety, choice, nutrition, sources, origin, plants and animals, production, connection, values, culture, preferences, beliefs, choice", "atl": ["Research skills", "Communication skills", "Self-management skills", "Social skills"], "lp": ["Open-minded", "Caring", "Balanced", "Risk-takers"], "blurb": "An inquiry into how our food choices affect our health and well-being. Students explore different types of food, where food comes from, and how people make choices about what they eat based on their culture, values, and preferences.", "loi": [{"t": "Food provides different nutrients and benefits for the body. (form/function)", "eu": "Different foods provide different nutrients that help the body grow and stay healthy. A balanced diet supports overall well-being."}, {"t": "Food comes from a variety of sources. (connection)", "eu": "Food comes from plants and animals and is produced in different ways. Understanding where food comes from helps us make informed choices."}, {"t": "Food choices are influenced by culture, preferences, and needs. (perspective)", "eu": "People choose food based on their culture, preferences, and needs. These choices can affect health and reflect personal and cultural identity."}]}, {"id": "K3-4", "theme": "hww", "title": "Science Experiments", "time": "Nov. 9 – Dec. 4 (4 weeks) Feb. 8 – March 19 (6 weeks)", "ci": "Our curiosity leads to discoveries.", "kc": ["Form", "Function", "Causation", "Change"], "rc": "curiosity, communication, organization, observation, tools, evidence, recording, discovery, process, variable, cause and effect, change, impact, process, problem-solving, materials, properties, design, function, innovation, improvement", "atl": ["Thinking skills", "Research skills", "Self-management skills"], "lp": ["Knowledgeable", "Thinkers", "Communicators", "Reflective", "Risk-takers"], "blurb": "An inquiry into how people explore and understand the world through scientific thinking. Students investigate how scientists observe, ask questions, and test ideas, and how discoveries can lead to new understanding and solutions.", "loi": [{"t": "Observations help us notice patterns and ask questions. (form)", "eu": "Careful observation helps us notice patterns and ask meaningful questions. These observations are the starting point for scientific inquiry."}, {"t": "Discoveries can lead to changes or new ideas. (causation/change)", "eu": "Discoveries can change what we know and lead to new ideas. New understanding can influence future thinking and actions."}, {"t": "Scientific thinking involves testing ideas to find solutions. (function/change)", "eu": "Scientific thinking involves testing ideas and using evidence to support conclusions. Evidence helps us explain and justify our findings."}]}, {"id": "K3-5", "theme": "stp", "title": "Upcycling", "time": "Apr. 5 – June 4 (8 weeks)", "ci": "People interact with and value the environment in different ways.", "kc": ["Function", "Change", "Responsibility"], "rc": "environment, natural resources, needs, survival, interdependence, systems, sustainability, interdependence, balance, change, impact, cause and effect, pollution, rights, consequences, responsibility, care, choices, action, citizenship", "atl": ["Research skills", "Self-management skills"], "lp": ["Inquirers", "Knowledgeable", "Principled", "Caring", "Reflective"], "blurb": "An inquiry into how people interact with and depend on the environment. Students explore how the environment provides what living things need, how human actions can cause change, and how people can take responsibility to care for the Earth.", "loi": [{"t": "The environment provides what living things need. (function)", "eu": "The environment provides the resources living things need to survive. These resources must be available for life to continue."}, {"t": "Human actions can change the environment. (change)", "eu": "Human actions can cause changes in the environment. These changes can have positive or negative effects on living things."}, {"t": "People have a responsibility to respect and care for the environment. (responsibility)", "eu": "People’s choices and actions impact the environment. Taking responsibility helps protect and sustain the natural world."}]}], "G1": [{"id": "G1-2", "theme": "wwpt", "title": "Stories from the Past", "time": "Aug. 24 – Oct. 2 (6 weeks)", "ci": "Stories and artifacts provide evidence about the past and how it has changed.", "kc": ["Function", "Change", "Perspective"], "rc": "evidence, observation, interpretation, clues, representation, continuity, change, adaptation, progress, differences, similarities, time, memory, interpretation, viewpoints, experience, feelings, opinion", "atl": ["Thinking skills", "Communication skills"], "lp": ["Inquirers", "Knowledgeable", "Open-minded"], "blurb": "An inquiry into how artifacts and stories provide evidence about the past and help us understand how life has changed over time. Students explore how people interpret and remember experiences differently, developing an understanding that history is shaped by perspectives.", "loi": [{"t": "Stories and artifacts give clues about the past. (function)", "eu": "Stories and artifacts provide evidence about how people lived in the past. By examining them, we can make informed ideas about what life was like before."}, {"t": "How life has changed over time. (change)", "eu": "Life changes over time in many ways, including how people live, work, and communicate. Recognizing these changes helps us understand differences between past and present."}, {"t": "People remember and interpret the past in different ways (perspective)", "eu": "People can remember and explain the same event in different ways. These perspectives influence how the past is understood."}]}, {"id": "G1-3", "theme": "hwo", "title": "My Town", "time": "Oct. 5 – Nov. 20 (6 weeks)", "ci": "Communities are organized to provide services that meet people’s needs.", "kc": ["Form", "Function", "Perspective"], "rc": "needs, wants, priorities, choice, values, networks, systems, relationships, function, services, roles, systems, interdependence, features, structure, organization, layout, balance", "atl": ["Thinking skills", "Research skills", "Communication skills", "Self-management skills", "Social skills"], "lp": ["Knowledgeable", "Thinkers", "Caring"], "blurb": "An inquiry into how communities are organized to meet people’s needs through services and systems. Students explore how different needs and perspectives influence the services provided, and how communities are designed and structured to support the people who live there.", "loi": [{"t": "People have different needs and wants. (perspective)", "eu": "People have different needs and wants that influence how they live. Understanding these differences helps explain why communities are organized in certain ways."}, {"t": "Communities provide services to meet these needs. (function)", "eu": "Communities are designed to provide services that help meet people’s needs. These services support how people live, work, and interact."}, {"t": "Communities have different features and roles. (form)", "eu": "Communities include different places, roles, and people that work together. Each part plays a role in helping the community function."}]}, {"id": "G1-4", "theme": "hwe", "title": "Fictional Narratives", "time": "Nov. 23 – Jan. 29 (7 weeks)", "ci": "Fictional narratives communicate ideas and emotions to an audience.", "kc": ["Form", "Function", "Connection", "Perspective"], "rc": "structure, features, sequence, organization, creativity, audience, communication, purpose, impact, expression, meaning, emotion, interpretation, perspective, voice", "atl": ["Thinking skills", "Communication skills"], "lp": ["Communicators", "Reflective", "Risk-takers"], "blurb": "An inquiry into how stories are structured and how authors communicate ideas and emotions through narrative. Students explore how writing can engage an audience and how different choices influence how stories are interpreted and experienced.", "loi": [{"t": "Stories have elements such as characters, setting, and events. (form)", "eu": "Communities include different places, roles, and people that work together. Each part plays a role in helping the community function."}, {"t": "Authors make choices to communicate ideas and feelings. (connection)", "eu": "Authors make choices about what and how they write to share ideas and emotions. These choices influence how the story is understood."}, {"t": "Stories can be understood and interpreted in different ways. (function / perspective)", "eu": "Different people can understand the same story in different ways. Interpretation depends on individual thoughts, feelings, and experiences."}]}, {"id": "G1-5", "theme": "hww", "title": "Science Experiments", "time": "Feb. 1 - Mar. 12 (6 weeks)", "ci": "Scientific investigations allow us to explore and understand the physical world.", "kc": ["Form", "Function", "Causation"], "rc": "steps, sequence, structure, systems, process, purpose, investigation, tools, observation, cause and effect, results, change, evidence, explanation", "atl": ["Thinking skills", "Research skills"], "lp": ["Inquirers", "Thinkers", "Risk-takers"], "blurb": "An inquiry into how scientific investigations are structured and used as tools to explore the world. Students learn how to conduct experiments, observe and record evidence, and explain how and why things happen through cause-and-effect relationships.", "loi": [{"t": "Scientific investigations follow steps and processes. (form)", "eu": "Scientific investigations follow processes that help us explore questions in an organized way. These steps help make our thinking clearer and more reliable."}, {"t": "Investigations help us find out how and why things happen. (function)", "eu": "Investigations help us understand how things work and why they happen. Asking questions and testing ideas leads to new knowledge."}, {"t": "Observations and evidence help explain results. (causation)", "eu": "Observations and evidence support our ideas and conclusions. Using evidence helps us explain and justify what we discover."}]}, {"id": "G1-6", "theme": "stp", "title": "Living Things", "time": "Mar. 1 – Apr. 16 (6 weeks)", "ci": "Living things depend on each other for their survival.", "kc": ["Causation", "Connection", "Responsibility"], "rc": "interdependence, relationships, adaptation, survival, energy, cause and effect, impact, change, resources, responsibility, action, stewardship, choices, impact", "atl": ["Research skills", "Communication skills"], "lp": ["Thinkers", "Communicators", "Principled", "Balanced"], "blurb": "An inquiry into how living things are connected within ecosystems and how changes can affect these systems. Students explore their responsibility to take action and make choices that help protect living things and the environment.", "loi": [{"t": "Living things are connected through food chains and habitats. (connection)", "eu": "Living things are connected in systems such as food chains and habitats. These connections support survival and balance in the environment."}, {"t": "Changes in ecosystems can affect living things. (causation)", "eu": "Changes in an environment can affect living things in different ways. When one part changes, it can impact the whole system."}, {"t": "People can take action to care for living things and the environment. (responsibility)", "eu": "People’s choices can help or harm living things. Taking responsible action supports the well-being of the environment."}]}, {"id": "G1-7", "theme": "wwa", "title": "Relationships", "time": "Apr. 26 – Jun. 4 (6 weeks)", "ci": "Understanding our identities helps us to build relationships in diverse communities.", "kc": ["Form", "Causation", "Connection", "Responsibility"], "rc": "identity, culture, beliefs, values, experiences, influence, groups, belonging, diversity, similarities and differences, roles, responsibility, respect, empathy, inclusion, cooperation, conflict resolution", "atl": ["Self-management skills", "Social skills"], "lp": ["Communicators", "Principled", "Open-minded", "Caring", "Reflective"], "blurb": "An inquiry into how our identities are shaped by different factors and how people belong to a variety of groups. Students explore how understanding themselves and others helps build respectful relationships and a sense of belonging in diverse communities.", "loi": [{"t": "Different experiences and groups shape who we are. (causation)", "eu": "Our experiences and the groups we belong to influence our identity. These factors help shape who we are and how we see ourselves."}, {"t": "People belong to different groups and communities. (form, connection)", "eu": "People belong to a variety of groups and communities. These groups influence our sense of belonging and connection with others."}, {"t": "Respect and responsibility help build positive relationships. (responsibility)", "eu": "Respect and responsibility are important for building positive relationships. The way we treat others affects how we connect and work together."}]}], "G2": [{"id": "G2-2", "theme": "hwo", "title": "Services", "time": "Aug. 24 – Aug. 28 (1 week) Yearlong May 24 – Jun. 4 (2 weeks)", "ci": "Individuals contribute to how groups function.", "kc": ["Function", "Connection", "Responsibility"], "rc": "interdependence, impact, consequences, relationships, influence, cooperation, community, teamwork, citizenship, contribution, roles, participation, decision-making, networks, roles, systems, structure, organization, process", "atl": ["Thinking skills", "Research skills", "Communication skills", "Self-management skills", "Social skills"], "lp": ["Thinkers", "Communicators"], "blurb": "An inquiry into how individuals influence the success of groups through their choices, actions, and roles. Students explore how collaboration, decision-making, and shared responsibilities help groups function effectively, and apply this understanding to work together on meaningful projects.", "loi": [{"t": "Individual choices affect how a group works. (connection)", "eu": "Individual actions and choices can influence a group. What each person does can help or affect how the group works."}, {"t": "People take on roles and responsibilities in groups. (responsibility)", "eu": "People have different roles and responsibilities within groups. These roles help the group work together effectively."}, {"t": "Groups have systems that help them function. (function)", "eu": "Groups use systems and structures to stay organized. These systems help groups achieve shared goals."}]}, {"id": "G2-3", "theme": "hwe", "title": "Storytelling", "time": "Aug. 31 – Oct. 16 (7 weeks)", "ci": "Stories express ideas, creativity, and meaning.", "kc": ["Form", "Function", "Perspective"], "rc": "performance, genre, creativity, expression, communication, audience, purpose, modes of storytelling, genre, morals, sequence, structure, organization, meaning, message, empathy, beliefs, interpretation, point of view, voice, bias (keep simple at G2 level), character, experience", "atl": ["Thinking skills", "Communication skills", "Self-management skills", "Social skills"], "lp": ["Inquirers", "Communicators", "Open-minded", "Risk-takers"], "blurb": "An inquiry into how stories communicate ideas and creativity through different forms and structures. Students explore how storytelling choices shape meaning and how perspectives and voices influence the way stories are understood.", "loi": [{"t": "Stories use structures that help communicate meaning. (form)", "eu": "Stories follow structures that help organize ideas and meaning. These structures help the audience understand the story."}, {"t": "Stories can be told from different perspectives. (perspective)", "eu": "Stories can be told from different perspectives. Changing perspective can change how a story is understood."}, {"t": "Stories can be told in different ways. (function)", "eu": "Stories can be shared in many forms, such as spoken, written, or visual. Different forms can communicate ideas in different ways."}]}, {"id": "G2-4", "theme": "wwa", "title": "Role-models", "time": "Oct. 19 – Dec. 11 (7 weeks)", "ci": "Role models influence our values, choices, and understanding of ourselves.", "kc": ["Form", "Causation", "Connection", "Responsibility"], "rc": "beliefs, identity, values, character, similarities / differences, choices, actions, habits, perseverance, resilience, responsibility, behaviour, growth, development, influence, impact, responsibility, inspiration, action, agency, decision-making", "atl": ["Thinking skills", "Research skills", "Communication skills", "Self-management skills"], "lp": ["Principled", "Open-minded"], "blurb": "An inquiry into how our identity is shaped by our values, choices, and experiences. Students explore how role models influence beliefs and behaviours, and how their own actions and decisions contribute to personal growth and becoming responsible individuals.", "loi": [{"t": "Role models have traits and characteristics that influence others. (form/connection)", "eu": "Role models demonstrate common traits and behaviours that others may admire. These traits can influence how people think and act."}, {"t": "Our choices and actions influence who we become. (causation)", "eu": "The choices we make and the actions we take influence how we grow and who we become."}, {"t": "Role models can influence our choices and actions. (responsibility)", "eu": "Role models can influence the choices we make. Their actions and values can guide our own behaviour."}]}, {"id": "G2-5", "theme": "hww", "title": "Electricity", "time": "Dec. 14 – Feb. 19 (7 weeks)", "ci": "Electricity is a form of energy that can be controlled and used for different purposes.", "kc": ["Form", "Causation", "Change"], "rc": "properties, structure, energy, origin, generation, observation, pattern, systems, control, function, flow, variables, the scientific method, circuits, transformation, networks, interdependence, purpose, application, impact, innovation", "atl": ["Thinking skills", "Research skills", "Self-management skills", "Social skills"], "lp": ["Inquirers", "Thinkers", "Reflective"], "blurb": "An inquiry into how electricity is a form of energy that can be generated, controlled, and used. Students explore how electrical systems work and how people apply this understanding to design solutions that meet needs and impact everyday life.", "loi": [{"t": "Electricity has properties and sources. (form)", "eu": "Electricity is a type of energy with specific properties and sources. Understanding these helps explain how electricity works."}, {"t": "Electricity can be changed and controlled. (change)", "eu": "Electricity can be changed and controlled in different ways. These changes affect how it can be used safely and effectively."}, {"t": "Electricity is used in different ways in everyday life. (causation)", "eu": "Electricity is used to meet different needs in daily life. People design systems to use electricity for specific purposes."}]}, {"id": "G2-6", "theme": "stp", "title": "Plants", "time": "Feb. 22 – Mar. 26 (5 weeks)", "ci": "Plants sustain life on Earth and play a role in our lives.", "kc": ["Form", "Function", "Change", "Responsibility"], "rc": "parts, jobs, how parts work together, fit, structure, function, systems, interaction,grow, change, cycle, stages, new plants, development, conditions, cause and effect, patterns, help, need, care, protect, share, interdependence, sustainability, impact, resources", "atl": ["Thinking skills", "Research skills", "Self-management skills"], "lp": ["Knowledgeable", "Communicators", "Caring", "Reflective"], "blurb": "An inquiry into how plants function as living systems that grow and change over time. Students explore the role plants play in supporting life on Earth and how our choices and actions impact their sustainability and the environments we share.", "loi": [{"t": "Plants have different parts that help them survive. (form)", "eu": "Plants have different parts that help them survive and grow. Each part has a role in supporting the plant."}, {"t": "Plants grow and change through different stages. (change)", "eu": "Plants grow and change through different stages as part of their life cycle. These changes can be observed over time."}, {"t": "People’s actions affect plants and their environments. (Function, Responsibility)", "eu": "People’s actions can help or harm plants and their environments. Making responsible choices helps protect plant life."}]}, {"id": "G2-7", "theme": "wwpt", "title": "Landmarks", "time": "Apr. 5 – May 21 (7 weeks)", "ci": "Landmarks connect people to place, culture, and history.", "kc": ["Form", "Connection", "Perspective"], "rc": "structure, natural, human-made, features, classification, purpose, characteristics, history, evolution of earth, maps, continents, continental regions, oceans, cardinal directions – perspective, culture, identity, location, symbolism, heritage, significance, recognition, relevance, irrelevance, interpretation, values, similarities / differences, meaning", "atl": ["Research skills", "Communication skills", "Self-management skills"], "lp": ["Inquirers", "Communicators", "Open-minded", "Balanced"], "blurb": "An inquiry into how landmarks are defined and classified across the world, and how they connect to culture, identity, and place. Students explore how different perspectives influence the meaning and significance of landmarks locally and globally.", "loi": [{"t": "Landmarks have different features and purposes. (form)", "eu": "Landmarks have features that make them recognizable and meaningful. They often serve important purposes in a place."}, {"t": "Landmarks connect communities and cultures. (connection)", "eu": "Landmarks connect people to their culture and community. They can represent shared history and identity."}, {"t": "Landmarks can be understood from different perspectives. (perspective)", "eu": "People may understand and value landmarks in different ways. Perspective influences how landmarks are interpreted."}]}], "G3": [{"id": "G3-2", "theme": "hwe", "title": "Personal Identity", "time": "Aug. 24 – Oct. 2 (6 weeks)", "ci": "Personal identities are expressed through culture and interests.", "kc": ["Form", "Change", "Perspective"], "rc": "communication, expression, representation, symbols, tradition, media, timelines, growth, development, influence, experience, change over time, diversity, identity, perspective, beliefs, values, self-expression", "atl": ["Thinking skills", "Research skills", "Communication skills", "Self-management skills", "Social skills"], "lp": ["Inquirers", "Communicators", "Open-minded", "Reflective"], "blurb": "An inquiry into how people express their identities through culture, interests, and forms of communication. Students explore how personal experiences and cultural influences shape expression, and how this changes and develops over time.", "loi": [{"t": "Culture includes different forms of expression. (form)", "eu": "Culture is expressed in different ways, such as traditions, language, and behaviour. These forms of expression help show identity."}, {"t": "Interests and experiences can change over time. (change)", "eu": "People’s interests and experiences can change over time. These changes are part of personal growth and development."}, {"t": "People’s culture and interests reflect their identity. (perspective)", "eu": "The choices people make and the things they enjoy reflect who they are. Identity is shown through actions and preferences."}]}, {"id": "G3-3", "theme": "wwa", "title": "Body Systems", "time": "Oct. 5 – Nov. 20 (6 weeks)", "ci": "The interactions among body systems contribute to health and survival.", "kc": ["Function", "Causation", "Connection", "Responsibility"], "rc": "systems, balance, structure, process, interaction, adaptation, systems, balance, interdependence, interaction, relationships, consequences, well-being, behaviour, health, lifestyle, choice, prevention, sustainability", "atl": ["Thinking skills", "Research skills", "Communication skills", "Self-management skills", "Social skills"], "lp": ["Inquirers", "Knowledgeable", "Communicators", "Reflective"], "blurb": "An inquiry into how the human body functions as a system of interconnected parts that work together to support health and survival. Students explore how body systems interact and how lifestyle choices influence well-being and overall functioning.", "loi": [{"t": "Body systems have structures and functions. (function)", "eu": "The human body is made up of systems with specific structures and functions. Each system plays a role in keeping the body working."}, {"t": "Body systems are connected and work together. (connection)", "eu": "Body systems are connected and depend on each other. They work together to support health and survival."}, {"t": "Lifestyle choices can affect how body systems function. (causation/responsibility)", "eu": "Lifestyle choices, such as diet and exercise, can affect how body systems function. Healthy choices support overall well-being."}]}, {"id": "G3-4", "theme": "wwpt", "title": "Ancient Civilizations", "time": "Nov. 23 – Jan. 22 (6 weeks)", "ci": "Ancient civilizations have influenced modern societies in different ways.", "kc": ["Form", "Causation", "Connection"], "rc": "continuity, needs problems motivation opportunity curiosity, progress, process, design, experimentation, application, systems, difference, validity, impact, consequences, sustainability, improvement, adaptation", "atl": ["Thinking skills", "Research skills", "Communication skills", "Self-management skills", "Social skills"], "lp": ["Inquirers", "Knowledgeable", "Open-minded", "Reflective"], "blurb": "An inquiry into why people innovate and how scientific understanding is used to design solutions to problems. Students explore how innovations develop over time and examine their impact on individuals, societies, and the environment.", "loi": [{"t": "Ancient civilizations developed knowledge and ideas. (form)", "eu": "Ancient civilizations developed knowledge, systems, and ideas. These helped societies function and grow."}, {"t": "Ideas change and develop over time. (causation)", "eu": "Ideas can change and develop over time. New ideas often build on what people already know."}, {"t": "Ancient civilizations continue to influence modern life. (connection)", "eu": "Ancient civilizations still influence modern societies. Their ideas and innovations continue to shape how people live today."}]}, {"id": "G3-5", "theme": "stp", "title": "Landforms", "time": "Jan. 25 – Mar. 5 (6 weeks)", "ci": "Natural landscapes influence our communities.", "kc": ["Form", "Connection", "Responsibility"], "rc": "geography, landscape, features, structure, formation, classification, amenities, borders, locality, settlements, resources, adaptation, interdependence, lifestyle, economy, sustainability, conservation, impact, balance, stewardship, decision-making", "atl": ["Thinking skills", "Research skills", "Communication skills", "Social skills"], "lp": ["Inquirers", "Communicators", "Caring", "Balanced"], "blurb": "An inquiry into how natural landscapes are formed and how they influence where and how people live. Students explore the relationships between landforms and communities and consider how people can make responsible choices to live sustainably within their environments.", "loi": [{"t": "Landforms have different features and characteristics. (form)", "eu": "Landforms have different features such as mountains, rivers, and plains. These features make each environment unique."}, {"t": "Communities are shaped by their natural surroundings. (connection)", "eu": "Communities are influenced by the natural environment around them. The land affects how people live, build, and work."}, {"t": "People can make choices to live sustainably within environments. (responsibility)", "eu": "People can make choices that support sustainable living. These choices help protect and care for the environment."}]}, {"id": "G3-6", "theme": "hwo", "title": "Natural Disasters", "time": "Mar. 8 – Apr. 23 (6 weeks)", "ci": "Communities organize themselves and take informed action to respond to natural sisaters.", "kc": ["Form", "Causation", "Responsibility"], "rc": "characteristics, patterns, classification, scale, geology, geography, process, systems, forces, interaction, organization, resources, structure, consequences, safety, cooperation, preparedness, risk, response, resilience, decision-making", "atl": ["Thinking skills", "Research skills", "Communication skills", "Social skills"], "lp": ["Inquirers", "Communicators", "Principled", "Caring", "Risk-takers"], "blurb": "An inquiry into how natural disasters are formed and how they impact communities. Students explore how Earth’s systems create these events and how communities organize, make decisions, and take responsible action to prepare for and respond to them.", "loi": [{"t": "Natural disasters can be grouped by their causes and features. (form/causation)", "eu": "Natural disasters can be grouped based on their causes and features. Recognizing similarities and differences helps us understand patterns among them."}, {"t": "Natural processes explain how natural disasters occur. (causation)", "eu": "Natural disasters are the result of natural processes within the Earth. Understanding these processes helps explain how and why they occur."}, {"t": "Communities plan and take action to respond to natural disasters. (responsibility)", "eu": "Communities can plan and take action to prepare for natural disasters. Preparation and cooperation help reduce risks and support recovery."}]}, {"id": "G3-7", "theme": "hww", "title": "Innovations", "time": "Apr. 26 – Jun. 4 (6 weeks)", "ci": "People innovate to solve problems and improve their quality of life.", "kc": ["Function", "Causation", "Change"], "rc": "discovery, history, challenge, necessity, context, influence, innovation, systems thinking, efficiency, testing, iteration, improvement, progress, revolution, equity, access, ethics, trade-offs, innovation vs consequence", "atl": ["Thinking skills", "Research skills", "Communication skills", "Self-management skills", "Social skills"], "lp": ["Inquirers", "Thinkers", "Principled", "Risk-takers"], "blurb": "An inquiry into why people innovate and how scientific understanding is applied through design and experimentation to solve problems. Students explore how innovations develop over time and evaluate their impact on people, societies, and the environment.", "loi": [{"t": "People innovate to meet needs and solve problems. (causation)", "eu": "Innovation happens when people create new ideas to solve problems or meet needs. Challenges often lead to new solutions."}, {"t": "Scientific knowledge is used to develop new ideas and solutions. (function)", "eu": "Scientific knowledge helps people develop new ideas and technologies. This knowledge supports innovation and design."}, {"t": "Innovations can have positive and negative impacts. (change)", "eu": "Innovations can have both positive and negative impacts. These impacts affect people, societies, and the environment."}]}], "G4": [{"id": "G4-2", "theme": "wwpt", "title": "Exploration", "time": "Aug. 24 – Oct. 2 (6 weeks)", "ci": "Exploration leads to discovery and develops new understandings.", "kc": ["Form", "Causation", "Perspective"], "rc": "relationship, resources, systems, interaction, exchange, networks, influence, motivation, needs, opportunity, risk, innovation, curiosity, consequence, colonialism, impact, perspective, equity, responsibility", "atl": ["Thinking skills", "Research skills", "Communication skills", "Self-management skills", "Social skills"], "lp": ["Inquirers", "Thinkers", "Open-minded"], "blurb": "An inquiry into how exploration leads to discovery and new understanding, including the relationships, motivations, and consequences that shape human journeys. Students consider how different perspectives influence the impact of exploration over time.", "loi": [{"t": "Exploration involves relationships between people, resources, and ideas. (form)", "eu": "There are an infinite variety of explorations which are relevant and meaningful to the people who undertake them."}, {"t": "Exploration is driven by different motivations and purposes. (causation)", "eu": "Explorations begin and inform other explorations, impacting the world and its inhabitants."}, {"t": "Exploration leads to different consequences and perspectives. (perspective)", "eu": "Sometimes, explorations benefit some while harming others, enriching few at the expense of many."}]}, {"id": "G4-3", "theme": "hwo", "title": "Systems of Government", "time": "Oct. 5 – Nov. 20 (6 weeks)", "ci": "Governments and citizens mutually influence one another.", "kc": ["Function", "Causation", "Responsibility"], "rc": "systems, monarchy, fascism, dictatorship, democracy, communism, authority, laws, power, rules, perspective, rights, responsibility, citizenship, consensus, representation", "atl": ["Thinking skills", "Self-management skills", "Social skills"], "lp": ["Communicators", "Principled", "Caring"], "blurb": "An inquiry into how systems of governance shape the lives of individuals and societies through power, decision-making, and responsibility. Students examine how citizens and governments influence one another within different systems.", "loi": [{"t": "Government systems have different structures and roles. (function)", "eu": "Government systems can be organized to achieve various goals, but all share the essential function of promoting the survival of their citizens."}, {"t": "Governments influence the lives of citizens. (causation)", "eu": "Governments make decisions that affect the lives of citizens. Laws and policies influence how people live and interact."}, {"t": "Citizens have rights and responsibilities within government systems. (responsibility)", "eu": "Citizens have rights and responsibilities within a government system. Their actions and participation can influence how the system works."}]}, {"id": "G4-4", "theme": "hww", "title": "Physics", "time": "Nov. 23 – Jan. 22 (6 weeks)", "ci": "Observations of the natural world and its laws can help us make predictions.", "kc": ["Function", "Causation", "Connection"], "rc": "laws, principles, reactions, patterns, sequences, forces, inertia, relationships, practical, procedure, reliable, control, experimentation", "atl": ["Thinking skills", "Research skills", "Communication skills"], "lp": ["Inquirers", "Thinkers", "Risk-takers"], "blurb": "An inquiry into how observations of the natural world and its laws help us understand and predict how things work. Students explore scientific principles through investigation, experimentation, and real-world application.", "loi": [{"t": "Scientific laws inform our observations. (causation)", "eu": "Scientific laws describe patterns we observe in the natural world. These patterns help us understand how things behave."}, {"t": "Forces and interactions explain changes in motion and energy. (connection)", "eu": "Forces and interactions cause changes in motion and energy. Understanding these interactions helps explain how things move and change."}, {"t": "Scientific understanding can be used to make predictions. (function)", "eu": "Scientific understanding allows us to make predictions. These predictions help explain and anticipate outcomes."}]}, {"id": "G4-5", "theme": "hwe", "title": "Advertising", "time": "Jan. 25 – Mar. 5 (6 weeks)", "ci": "People create and manipulate messages to target and persuade specific audiences.", "kc": ["Function", "Connection", "Perspective"], "rc": "advertisements, Jingles, brand recognition, messages, themes, persuasive devices, emotions, campaigns, communication, audience, interpretation, media, integration, expression", "atl": ["Thinking skills", "Communication skills", "Social skills"], "lp": ["Thinkers", "Communicators", "Open-minded"], "blurb": "An inquiry into how people create and manipulate messages to communicate ideas and influence others. Students explore how different forms of expression shape meaning, interpretation, and audience response.", "loi": [{"t": "Advertisements use different forms of media and techniques. (function)", "eu": "Images, text, and music, chosen by advertisers, function within different forms of advertisements to achieve particular emotions and behaviours in targeted audiences."}, {"t": "Messages are designed to influence how people think and feel. (perspective)", "eu": "Across different media and advertisements, a variety of persuasive techniques are used to achieve a common goal to reaching their audience."}, {"t": "Audiences respond to messages in different ways. (connection)", "eu": "Advertisers choose particular media, including creative and surprising forms, to connect with audiences and convey intended themes."}]}, {"id": "G4-6", "theme": "stp", "title": "Evolution", "time": "Mar. 8 – Apr. 23 (6 weeks)", "ci": "The struggle for survival drives the evolution of living things.", "kc": ["Form", "Change", "Responsibility"], "rc": "observation, evidence, classification, patterns, inquiry, models, adaptation, environment, habitat, nature, mutation, ecology, survival, variation, interdependence, natural selection, balance, impact, consequences, sustainability, stewardship, biodiversity", "atl": ["Thinking skills", "Research skills"], "lp": ["Inquirers", "Knowledgeable", "Thinkers", "Communicators", "Caring"], "blurb": "An inquiry into the relationships between living things and their environments, and how human actions impact the natural world. Students explore ecosystems, adaptation, and their responsibility in maintaining balance and sustainability.", "loi": [{"t": "Living things have similarities and differences that can be observed and classified. (form)", "eu": "Living things can be grouped based on their similarities and differences. Classification helps us understand relationships between organisms."}, {"t": "Living things adapt to changes in their environment over time. (change)", "eu": "Living things adapt over time in response to changes in their environment. These adaptations support survival."}, {"t": "Human actions can affect the balance of ecosystems. (responsibility)", "eu": "Human actions can affect ecosystems and the balance of nature. These changes can impact living things and their survival."}]}, {"id": "G4-7", "theme": "wwa", "title": "Beliefs", "time": "Apr. 26 – Jun. 4 (6 weeks / Whole-year )", "ci": "Beliefs and values are conveyed in different ways and are part of our identity.", "kc": ["Change", "Connection", "Perspective"], "rc": "diversity, values, belief systems, identity, culture, influence, perception, influence, experiences, development, reflection, adaptation, responsibility, decision-making, behaviour, choices, values in action, consequences", "atl": ["Thinking skills", "Research skills", "Communication skills", "Self-management skills", "Social skills"], "lp": ["Open-minded", "Caring", "Reflective", "Balanced"], "blurb": "An inquiry into identity, relationships, and well-being, and how our choices and values shape who we are. Students reflect on personal growth and the ways individuals contribute to a community.", "loi": [{"t": "People have different beliefs and values. (perspective)", "eu": "People have different beliefs and values based on their experiences and culture. These differences shape identity."}, {"t": "Beliefs and values are formed and can change over time. (change)", "eu": "Beliefs and values are influenced by experiences and can change over time. Personal growth can lead to new perspectives."}, {"t": "Beliefs influence people’s choices and actions. (connection)", "eu": "Individuals are guided in their decision-making processes by the values they hold, and their interactions with the world around them reflect those values."}]}], "G5": [{"id": "G5-2", "theme": "stp", "title": "Activism", "time": "Aug. 17 – Oct. 2 (7 weeks)", "ci": "Environmental issues can create conflict and inspire social change.", "kc": ["Causation", "Perspective", "Responsibility"], "rc": "causation, systems, interdependence, factors, complexity, perspective, bias, values, inequality, representation, activism, agency, advocacy, initiative, responsibility, impact, change", "atl": ["Research skills", "Communication skills", "Social skills"], "lp": ["Communicators", "Caring"], "blurb": "An inquiry into the interdependence between human actions and the environment, exploring how environmental issues create conflict and drive social change. Students examine different perspectives and take responsibility by advocating sustainable solutions and meaningful action.", "loi": [{"t": "Human activities have causes and effects on the environment. (causation)", "eu": "Human actions can impact the environment in different ways. Understanding causes and effects helps explain environmental issues."}, {"t": "Different stakeholders have different perspectives on environmental issues. (perspective)", "eu": "Different people and groups may have different perspectives on environmental issues. These viewpoints influence decisions and conflicts."}, {"t": "People can take action to create change. (responsibility)", "eu": "People can take informed action to address environmental challenges. Individual and collective actions can lead to change."}]}, {"id": "G5-3", "theme": "wwpt", "title": "Migration", "time": "Oct. 5 – Nov. 6 (4 weeks)", "ci": "Human migration comes from, and leads to, challenges and opportunities.", "kc": ["Form", "Change", "Perspective"], "rc": "peace, conflict, choices, adaptations, citizenship, governments, culture, beliefs, values, integration, community, culture, equity, population and settlement, balance", "atl": ["Thinking skills", "Research skills", "Communication skills"], "lp": ["Inquirers", "Caring"], "blurb": "An inquiry into human migration, exploring why people move, the different perspectives they hold, and the challenges and opportunities migration creates for individuals and societies. Students develop empathy and understanding by examining real-life stories and the impact of movement across time and place.", "loi": [{"t": "People migrate for different reasons. (form)", "eu": "People migrate for a variety of reasons such as conflict, opportunity, or environment. These reasons influence patterns of movement."}, {"t": "Migration is experienced differently by individuals and groups. (perspective)", "eu": "Migration can be experienced differently depending on perspective. Individuals and groups may have different experiences and outcomes."}, {"t": "Migration creates challenges and opportunities for societies. (change)", "eu": "Migration can create both challenges and opportunities. These effects influence cultures, communities, and societies."}]}, {"id": "G5-4", "theme": "hww", "title": "Storing Energy", "time": "Nov. 9 – Dec. 4 (4 weeks)", "ci": "The use and storage of energy have environmental impacts.", "kc": ["Form", "Function", "Causation"], "rc": "properties, classification, systems, structure, transformation, sequences, processes, conversion, flow, consequences, initiative, sustainability impact, responsibility, efficiency", "atl": ["Research skills", "Self-management skills", "Social skills"], "lp": ["Knowledgeable", "Thinkers", "Balanced"], "blurb": "An inquiry into energy and how it is generated, transformed, and used, exploring the impact of energy choices on the environment. Students investigate sustainable solutions and apply design thinking to develop innovative ways to meet real-world energy needs.", "loi": [{"t": "Energy exists in different forms that can be observed and classified. (form, function)", "eu": "Energy exists in different forms such as light, heat, and sound. These forms can be identified and grouped based on their properties."}, {"t": "Energy can be transferred, stored, and used in different ways. (function)", "eu": "Energy can be transferred, stored, and used in different ways. These processes explain how energy moves and is used in systems like electrical circuits."}, {"t": "Energy choices have impacts on the environment. (function, causation)", "eu": "The ways people use and store energy can impact the environment. Making informed choices can support sustainable use of energy."}]}, {"id": "G5-5", "theme": "hwo", "title": "The Exhibition", "time": "Dec. 7 – Feb. 19 (8 weeks)", "ci": "Knowledge and successful partnerships help us address global issues.", "kc": [], "rc": "student-generated (as with key concepts)", "atl": ["Thinking skills", "Research skills", "Communication skills", "Self-management skills", "Social skills"], "lp": ["Inquirers", "Knowledgeable", "Thinkers", "Communicators", "Principled", "Open-minded", "Caring", "Reflective", "Balanced", "Risk-takers"], "blurb": "An inquiry into how learners apply their knowledge, skills, and understandings to investigate real-world issues, demonstrating collaboration, research, and action to create meaningful change. The Exhibition draws on the whole PYP: what they have learned, as well as the attitudes, skills, and behaviours they have developed.", "loi": [{"t": "Student-generated", "eu": ""}, {"t": "Student-generated", "eu": ""}, {"t": "Student-generated", "eu": ""}]}, {"id": "G5-6", "theme": "hwe", "title": "Interpretation/Appreciation", "time": "Feb. 22 – Apr. 16 (7 weeks)", "ci": "Artistic interpretation enables us to better understand and appreciate art.", "kc": ["Form", "Function", "Connection", "Perspective"], "rc": "structure, technique, composition, symbolism, communication, detail, subjectivity, viewpoint, context, bias, meaning, identity, evaluation, criteria, values, aesthetics, significance, justification, creativity, expression, intention, audience, innovation, choice", "atl": ["Thinking skills", "Research skills", "Communication skills", "Self-management skills", "Social skills"], "lp": ["Communicators", "Open-minded", "Caring", "Reflective"], "blurb": "An inquiry into how people express ideas, feelings, and perspectives through art, literature, and other creative forms, exploring how interpretation helps us understand and appreciate diverse viewpoints and cultures.", "loi": [{"t": "Artworks can be analysed using different criteria. (form, function)", "eu": "Art can be analysed using different features such as technique, composition, and style. These criteria help us understand how artworks are created."}, {"t": "Art communicates ideas, emotions, and messages. (connection)", "eu": "Art communicates ideas, emotions, and messages. Artists use different approaches to express meaning."}, {"t": "People interpret artworks in different ways. (perspective)", "eu": "People interpret artworks in different ways. Interpretation is influenced by perspective, experience, and context."}, {"t": "Art can be evaluated and appreciated using different criteria. (connection)", "eu": "Art can be evaluated using different criteria such as technique, meaning, and impact. People may appreciate the same artwork in different ways based on their perspectives and values."}]}, {"id": "G5-7", "theme": "wwa", "title": "Changes", "time": "Apr. 19 – Jun. 4 (7 weeks)", "ci": "Change is a necessary part of growing up.", "kc": ["Form", "Function", "Connection"], "rc": "growth, development, transformation, adaptation, resilience, self-reflection, adaptation, resilience, self-reflection, advancement, innovation, adaptation", "atl": ["Thinking skills", "Research skills", "Communication skills", "Self-management skills", "Social skills"], "lp": ["Knowledgeable", "Thinkers", "Communicators", "Principled", "Reflective", "Balanced"], "blurb": "An inquiry into how individuals grow and change over time, exploring the physical, emotional, and social aspects of development. Students investigate how relationships, choices, and societal influences shape identity and well-being, and develop strategies to navigate change with resilience and responsibility.", "loi": [{"t": "People experience different types of change. (form, function)", "eu": "The human body undergoes various changes throughout life, including physical, emotional, and cognitive transformations."}, {"t": "Change can affect thoughts, feelings, and behaviour. (function)", "eu": "Adolescence is a period marked by significant social and emotional changes. Understanding these changes, along with the influences of peer pressure and societal expectations, is crucial for recognizing their impact on personal development."}, {"t": "People develop strategies to respond to change. (function)", "eu": "Developing coping mechanisms to manage emotional changes and social pressures, along with practicing effective communication skills to express feelings and concerns, is essential for fostering emotional resilience and healthy interpersonal relationships."}, {"t": "Technology and social pressures influence how people grow and interact. (connection)", "eu": "Technology plays a significant role in adolescent development. Analysing its influence helps to understand both the positive and negative effects on social interactions and mental health, which is crucial for navigating the digital landscape responsibly."}]}]};

const YI=y=>YEARS.indexOf(y);

const TOP5_YEARS=["G2","G3"];
const TOP5=["stw","tpe","cov","cec","utnt"];
const YEAR_NOTE={
  "K1":"Keep it to 5 to 10 minutes. Students point, show and talk while you scribe their words. Use real objects where you can.",

const ORDER=["stw","iniw","tps","tpe","chalk","csi","cec","cov","utnt","csq","cp","zoom","headlines","ssw","gsce","ppc","step","peel","4cs","tug"];

// ---------- state ----------

const save=()=>{try{localStorage.setItem("vtr-planner",JSON.stringify({year:S.year,theme:S.theme,unit:S.unit,loi:S.loi,focus:S.focus}))}catch(e){}};

// ---------- Programme of Inquiry ----------
const MON={jan:0,feb:1,mar:2,apr:3,may:4,jun:5,jul:6,aug:7,sep:8,sept:8,oct:9,nov:10,dec:11};
function unitRanges(u){
  const out=[];const re=/([A-Za-z]{3,4})\.?\s*(\d{1,2})\s*[–-]\s*(?:([A-Za-z]{3,4})\.?\s*)?(\d{1,2})/g;let m;
  const yr=mo=>mo>=7?2026:2027;
  while((m=re.exec(u.time||""))){const a=MON[m[1].toLowerCase()],b=MON[(m[3]||m[1]).toLowerCase()];if(a==null||b==null)continue;
    out.push([new Date(yr(a),a,+m[2]),new Date(yr(b),b,+m[4],23,59)]);}
  return out;
}
function isNow(u){const t=new Date();return unitRanges(u).some(([a,b])=>t>=a&&t<=b);}
const unitsFor=y=>POI[y]||[];
function U(){return unitsFor(S.year).find(u=>u.id===S.unit)||null;}
function syncUnit(){
  const us=unitsFor(S.year);
  if(S.unit&&!us.some(u=>u.id===S.unit)){const now=us.find(isNow);S.unit=now?now.id:null;S.loi=-1;}
  if(S.unit===undefined){const now=us.find(isNow);S.unit=now?now.id:null;}
  const u=U();if(!u||S.loi>=u.loi.length)S.loi=-1;
}
const KCQ={form:"What is it like? What are its features?",function:"How does it work?",causation:"Why is it like this? What caused it?",change:"How is it changing?",connection:"How is it connected to other things?",perspective:"What are the different points of view?",responsibility:"What is our responsibility?"};
const loiParts=t=>{const m=t.match(/\(([^)]*)\)\s*\.?\s*$/);return {text:t.replace(/\s*\([^)]*\)\s*\.?\s*$/,"").replace(/\.$/,""),kcs:m?m[1].split(/[,/]|\band\b/).map(x=>x.trim().toLowerCase()).filter(x=>KCQ[x]):[]};};
const lcFirst=t=>/^[A-Z][a-z]/.test(t)&&!/^(Japan|Earth|Korea)/.test(t)?t[0].toLowerCase()+t.slice(1):t;
function ctx(){
  syncUnit();
  const u=U();
  const th=THEMES.find(x=>x.id===(u?u.theme:S.theme))||THEMES[0];
  if(!u)return Object.assign({},th,{unit:null,loi:null,kcs:[]});
  const loi=S.loi>=0?u.loi[S.loi]:null, lp=loi?loiParts(loi.t):null;
  const topic=u.title.toLowerCase();
  const ci=u.ci.replace(/\.\s*$/,"");
  const kcs=lp&&lp.kcs.length?lp.kcs:u.kc.map(k=>k.toLowerCase());
  return {id:th.id,name:th.name,themeName:th.name,
    lens:`How does this help us understand that ${lcFirst(ci)}?`,
    close:lp&&lp.kcs[0]?KCQ[lp.kcs[0]]:`How does this connect to our unit on ${u.title}?`,
    prov:[`a photo or object linked to ${topic}`,`a short video clip about ${topic}`,`a picture book or story connected to ${topic}`],
    lp:u.lp.length?u.lp:th.lp, unit:u, loi, loiText:lp?lp.text:"", kcs, closeAll:!!(lp&&lp.kcs[0])};
}
function unitOptions(){
  const us=unitsFor(S.year);
  return `<optgroup label="${esc(S.year)} units">${us.map(u=>`<option value="u:${u.id}">${isNow(u)?"● Now: ":""}${esc(u.title)} (${esc(THEMES.find(t=>t.id===u.theme).name)})</option>`).join("")}</optgroup>
    <optgroup label="No unit, just a theme">${THEMES.map(t=>`<option value="t:${t.id}">${esc(t.name)}</option>`).join("")}</optgroup>`;
}
function loiOptions(){
  const u=U();if(!u)return "";
  return `<option value="-1">Whole unit (central idea)</option>`+u.loi.map((l,i)=>`<option value="${i}">LOI ${i+1}: ${esc(loiParts(l.t).text)}</option>`).join("");
}
function bindUnitSelects(us,ls,wrap,after){
  us.innerHTML=unitOptions();us.value=S.unit?"u:"+S.unit:"t:"+S.theme;
  ls.innerHTML=loiOptions();ls.value=String(S.loi);wrap.hidden=!U();
  us.onchange=()=>{const [k,v]=us.value.split(":");if(k==="u"){S.unit=v;}else{S.unit=null;S.theme=v;}S.loi=-1;S.prov=0;S.eng=null;save();bindUnitSelects(us,ls,wrap,after);after();};
  ls.onchange=()=>{S.loi=+ls.value;S.eng=null;save();after();};
}
function qsFor(stp,band,t){
  const qs=(stp[band]||stp.middle||stp.early).slice();
  if(stp.theme&&(band!=="upper"||t.closeAll))qs.push(t.close);
  return qs;
}

// ---------- editable plan ----------
let EDITS={};
try{EDITS=JSON.parse(localStorage.getItem("vtr-edits")||"{}")||{};}catch(e){EDITS={};}

const planKey=()=>{syncUnit();return `${current()}|${S.year}|${S.unit?S.unit+"/"+S.loi:S.theme}`;};
const txt=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent;};

function freshPlan(){
  const id=current(), r=R[id], t=ctx(), band=BAND(S.year);
  const p=t.prov[S.prov%t.prov.length];
  const engId=S.eng||r.eng;
  let atl=r.atl.slice();
  if(t.unit&&t.unit.atl.length){const cats=t.unit.atl.map(a=>a.replace(/ skills?/i,"").toLowerCase());
    atl=r.atl.filter(a=>cats.some(c=>a.toLowerCase().startsWith(c)));
    t.unit.atl.forEach(a=>{const c=a.replace(/ skills?/i,"").toLowerCase();if(!atl.some(x=>x.toLowerCase().startsWith(c)))atl.push(a);});}
  return {
    title:r.name, look:`Look closely at ${p}.`,
    prompt:txt(r.teach(p,t)),
    steps:r.steps.map((stp,i)=>band==="early"
      ? {lab:stp.lab,sub:stp.sub||"",pos:stp.pos||"",qs:[(stp.early||stp.middle)[0]],starter:(EARLY_STARTER[id]||[])[i]||stp.starter,push:stp.push}
      : {lab:stp.lab,sub:stp.sub||"",pos:stp.pos||"",qs:qsFor(stp,band,t),starter:stp.starter,push:stp.push}),
    note:YEAR_NOTE[S.year],
    lens:t.lens,
    eng:{id:engId,steps:ENG[engId].steps.slice()},
    intro:introFor(engId), cue:ENG_INTRO[engId].cue,

function getPath(path){return path.split(".").reduce((o,k)=>o[k],PLAN);}
function setPath(path,v){const ks=path.split(".");const last=ks.pop();ks.reduce((o,k)=>o[k],PLAN)[last]=v;}

// editable text helper
function E(path,val,tag="span",cls=""){

function planText(){
  const P=getPlan(), t=ctx();
  let s=`${P.title}\n${S.year} · ${t.unit?t.unit.title+" ("+t.name+")":t.name}\n${t.unit?"Central idea: "+t.unit.ci+"\n":""}${t.loi?"Line of inquiry: "+t.loiText+"\n":""}\nHow students will work: ${ENG[P.eng.id].name}\nSay to students: ${P.intro}\n\nShow the provocation\n${P.prompt}\n\nStudent questions\n`;
  P.steps.forEach(stp=>{s+=`${stp.lab}${stp.sub?" ("+stp.sub+")":""}\n${stp.qs.filter(Boolean).map(q=>"  • "+q).join("\n")}\n`;});
  s+=`\nTheme lens: ${P.lens}\n\nEngagement move: ${ENG[P.eng.id].name}\n${P.eng.steps.filter(Boolean).map((x,i)=>`  ${i+1}. ${x}`).join("\n")}\n\nNote: ${P.note}\n${P.reflect?`Independent reflection: ${P.reflect}\n`:""}ATL: ${P.atl.filter(Boolean).join("; ")}\nLearner profile: ${P.lp.filter(Boolean).join(", ")}`;
  return s;
}
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),1800);}

function showSlide(){
  const s=slides[si];
  $("#stMain").innerHTML=`<p class="stage-kicker">${esc(s.k)}</p><p class="stage-q${s.long?" long":""}">${esc(s.q)}</p>${s.sub?`<p class="stage-sub">${esc(s.sub)}</p>`:""}${s.cue?`<p class="stage-cue">${esc(ENG_INTRO[getPlan().eng.id].icon)} ${esc(s.cue)}</p>`:""}`;
  $("#stDots").innerHTML=slides.map((_,i)=>`<i class="${i===si?"on":""}"></i>`).join("");
  $("#stPrev").disabled=si===0;$("#stNext").textContent=si===slides.length-1?"Finish ✓":"Next →";
}
function openStage(){
  buildSlides();si=0;$("#stRn").textContent=`${getPlan().title} · ${S.year}`;
  $("#stage").hidden=false;showSlide();$("#stNext").focus();
  try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});}catch(e){}
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(w=>wake=w).catch(()=>{});}catch(e){}
}
function closeStage(){
  $("#stage").hidden=true;stopTimer();
  try{document.fullscreenElement&&document.exitFullscreen().catch(()=>{});}catch(e){}
  try{wake&&wake.release();wake=null;}catch(e){}
  $("#present")&&$("#present").focus();
}
function fmt(n){return Math.floor(n/60)+":"+String(n%60).padStart(2,"0");}
function stopTimer(){clearInterval(tick);tick=null;left=0;const c=$("#clock");c.textContent="0:00";c.classList.remove("done");}
function startTimer(sec){stopTimer();left=sec;const c=$("#clock");c.textContent=fmt(left);tick=setInterval(()=>{left--;c.textContent=fmt(Math.max(left,0));if(left<=0){clearInterval(tick);tick=null;c.classList.add("done");}},1000);}
$("#stClose").onclick=closeStage;
$("#stPrev").onclick=()=>{if(si>0){si--;showSlide();}};
$("#stNext").onclick=()=>{if(si<slides.length-1){si++;showSlide();}else closeStage();};
$("#tStop").onclick=stopTimer;
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>startTimer(+b.dataset.t));
document.addEventListener("keydown",e=>{if($("#stage").hidden)return;if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();$("#stNext").click();}if(e.key==="ArrowLeft")$("#stPrev").click();if(e.key==="Escape")closeStage();});

// ---------- main buttons ----------
$("#another").onclick=()=>{if(S.pick){const l=ranked();S.idx=l.indexOf(S.pick);S.pick=null;}S.idx++;S.eng=null;render();};

// ---------- menu ----------
function chainOf(r){return r.steps.map(x=>x.sub||x.lab.replace(/…$/,"")).join(" → ");}
function tile(id){
  const r=R[id],dis=!ok(id);
  return `<button type="button" class="tile${dis?" dim":""}" data-open="${id}" style="--cc:var(${CAT[r.cat].tok})">
    <span class="t-top"><span class="t-cat">${esc(CAT[r.cat].name)}</span>${TOP5.includes(id)?'<span class="star" title="Top five">★</span>':""}</span>
    <span class="t-name">${esc(r.name)}</span>
    <span class="t-chain">${esc(chainOf(r))}</span>
    <span class="t-best">${esc(r.best)}</span>
    <span class="t-age">${dis?`From ${yShort(r.min)}`:`${yShort(r.min)} and up`}</span>
  </button>`;
}
function renderMenu(){
  $("#mYears").innerHTML=YEARS.map(y=>`<button type="button" class="chip" data-y="${y}" aria-pressed="${S.year===y}">${yShort(YI(y))}</button>`).join("");
  syncUnit();bindUnitSelects($("#mUnit"),$("#mLoi"),$("#mLoiWrap"),()=>renderMenuUnit());renderMenuUnit();
  $("#mFocus").innerHTML=FOCUS.map(f=>`<button type="button" class="chip" data-f="${f.id}">${esc(f.name)}</button>`).join("");
  $("#tilesCore").innerHTML=ORDER.filter(i=>R[i].core).map(tile).join("");
  $("#tilesMore").innerHTML=ORDER.filter(i=>!R[i].core).map(tile).join("");
  $("#mLegend").innerHTML=`<span><span class="star">★</span> Top five routines</span><span>Faded cards are usually used with older students, but you can still open them.</span>`;
}
function go(view){
  S.view=view;
  $("#menu").hidden=view!=="menu";$("#planner").hidden=view!=="plan";
  $("#tagline").innerHTML=view==="menu"
    ? "A thinking routine is a short set of questions that gets every student thinking and talking. <b>Tap a routine to start.</b>"
    : "Choose how students will work, check the questions, then press <b>Show to class</b>.";
  if(view==="menu")renderMenu();else{renderRail();render();}
  try{window.scrollTo(0,0);}catch(e){}
}
$("#menu").addEventListener("click",e=>{
  const y=e.target.closest("[data-y]"),f=e.target.closest("[data-f]"),o=e.target.closest("[data-open]");
  if(y){S.year=y.dataset.y;S.unit=undefined;S.loi=-1;save();renderMenu();}
  if(f){S.focus=f.dataset.f;S.pick=null;S.idx=0;S.eng=null;save();go("plan");}
  if(o){S.pick=o.dataset.open;S.idx=0;S.eng=null;go("plan");}
});
function renderMenuUnit(){
  const u=U(),el=$("#mUnitInfo");
  if(!u){el.hidden=true;return;}
  const c=ctx();el.hidden=false;
  el.innerHTML=`<p><b>Central idea:</b> ${esc(u.ci)}</p>${c.loi?`<p><b>Line of inquiry:</b> ${esc(c.loiText)}</p>`:""}`;
}
$("#toMenu").onclick=()=>{S.edit=false;go("menu");};
go("menu");
</script>
</body>
</html>
