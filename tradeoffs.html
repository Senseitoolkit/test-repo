<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Trade Offs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: a campus notice-board — a sticky header with the three meters, a week card below, action cards in a hand. */
:root{
  --paper:#f6f1e7; --ink:#1d1a16; --muted:#6c655a; --line:#d8cfbf; --card:#fffdf8;
  --social:#e3542b; --health:#2f8f5c; --grades:#2e5fc4; --warn:#b8321a;
  --display:"Andika","Sassoon Primary","Comic Neue",ui-rounded,ui-sans-serif,system-ui,sans-serif;
  --body:"Andika","Sassoon Primary","Comic Neue",ui-rounded,ui-sans-serif,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#1a1815; --ink:#efe8da; --muted:#a39a8a; --line:#3a352d; --card:#242019;
  --social:#f26b43; --health:#4fb57c; --grades:#6b8ff0; --warn:#ff7a5c; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#1a1815; --ink:#efe8da; --muted:#a39a8a; --line:#3a352d; --card:#242019;
  --social:#f26b43; --health:#4fb57c; --grades:#6b8ff0; --warn:#ff7a5c; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{height:100%;display:flex;flex-direction:column;gap:10px;max-width:1180px;margin:0 auto;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;flex:0 0 auto}
h1{font-size:clamp(22px,3vw,30px);font-weight:700;letter-spacing:0;line-height:1}
.sub{color:var(--muted);margin:0;font-size:13px}
.label{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--grades);outline-offset:2px}

/* main area: meters column on the left, the week on the right */
.main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(220px,30%) 1fr;gap:16px}
.meters{display:grid;grid-template-rows:repeat(3,1fr);gap:8px;min-height:0}
.meter{border-top:3px solid var(--c);padding-top:6px;display:flex;gap:10px;min-height:0;align-items:stretch}
.meter .txt{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;justify-content:center}
.meter .sprite{flex:0 0 auto;align-self:stretch;height:auto;aspect-ratio:1;width:auto;max-width:60%;background-repeat:no-repeat;background-size:800% 300%;background-position:0 0;border:1.5px solid var(--ink);transition:background-position .35s ease;align-self:stretch}

.meter .name{font-family:var(--display);font-weight:700;font-size:14px;color:var(--c)}
.meter .val{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:20px;line-height:1.1}
.meter .val small{font-size:11px;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:2px;margin-top:4px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0;width:calc(var(--p) * 1%);background:var(--c);transition:width .35s ease}
.meter .ghost{position:absolute;inset:0;background:var(--c);opacity:.35;width:calc(var(--g) * 1%);transition:width .2s}
.meter .status{font-size:12px;color:var(--muted);margin-top:3px}
.meter .mult{font-family:var(--mono);font-size:10px;color:var(--muted)}
.meter .mult.bad{color:var(--warn)}
.meter .mult.good{color:var(--c)}
.bar u.safe{position:absolute;top:0;bottom:0;left:30%;width:40%;background:var(--ink);opacity:.14}
.dl s{opacity:.6;font-size:10px}
.meter.low .status{color:var(--warn);font-weight:600}

/* week card */
#stage{min-height:0;display:flex;flex-direction:column}
.week{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;background:var(--card);border:1.5px solid var(--ink);padding:14px 16px;box-shadow:4px 4px 0 var(--ink)}
.week .head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.week h2{font-size:20px;font-weight:700}
.week .tag{font-family:var(--mono);font-size:12px;padding:3px 8px;border:1.5px solid var(--ink)}
.week .tag.exam{background:var(--grades);color:#fff;border-color:var(--grades)}
.week p{margin:8px 0 0}
.news{margin-top:8px;padding:8px 12px;background:var(--paper);border-left:4px solid var(--ink);font-size:13px}
.news.bad{border-color:var(--warn)}
.news.good{border-color:var(--health)}

/* hand */
.hand{margin-top:12px;flex:1 1 auto;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px}
.act{text-align:left;background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--c);padding:10px 14px;display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:0;min-height:0;overflow:hidden;transition:transform .12s,border-color .12s}
.act:hover,.act:focus-visible{transform:translate(-2px,-2px);border-color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.act .t{font-family:var(--display);font-weight:700;font-size:15px;line-height:1.15}
.act .d{font-size:12px;color:var(--muted)}
.deltas{display:flex;gap:6px;flex-wrap:wrap;padding-top:4px}
.dl{font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums;padding:2px 6px;border-radius:2px;color:#fff;background:var(--dc)}
.dl.neg{background:transparent;color:var(--dc);border:1.5px solid var(--dc)}
.event .act{border-left-color:var(--ink);padding:18px}
.event .hand{flex:0 0 auto;grid-auto-rows:auto}
.event .foot{margin-top:auto}

/* footer row: rules + log, both collapsible */
.foot{display:flex;gap:8px;margin-top:10px;font-size:12px;color:var(--muted);align-items:flex-start;flex-wrap:wrap}
.foot details{position:relative}
.foot summary{cursor:pointer;list-style:none;font-family:var(--mono);font-size:11px;padding:3px 8px;border:1.5px solid var(--line);display:inline-block}
.foot summary::-webkit-details-marker{display:none}
.foot details[open] summary{border-color:var(--ink)}
.foot .pop{position:absolute;bottom:calc(100% + 6px);left:0;z-index:5;width:min(420px,70vw);max-height:40vh;overflow:auto;background:var(--card);border:1.5px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px 12px;color:var(--ink)}
.rules b{color:var(--ink)}
.log ol{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:3px;font-size:12px}
.log li{display:grid;grid-template-columns:56px 1fr;gap:8px;border-bottom:1px solid var(--line);padding:3px 0}
.log li span:first-child{font-family:var(--mono);color:var(--muted)}

/* intro */
.steps{list-style:none;padding:0;margin:18px 0 0;display:flex;flex-direction:column;gap:18px;max-width:58ch;font-size:clamp(15px,1.5vw,19px)}
.steps li{display:flex;gap:12px;align-items:flex-start}
.steps .n{flex:0 0 32px;height:32px;display:grid;place-items:center;font-family:var(--display);font-weight:700;border:1.5px solid var(--ink);background:var(--paper)}
.steps em{font-style:normal;font-weight:700}

/* ending */
.end{flex:1 1 auto;min-height:0;overflow:auto;background:var(--card);border:1.5px solid var(--ink);padding:18px 20px;box-shadow:4px 4px 0 var(--ink)}
.end h2{font-size:clamp(22px,3vw,30px);font-weight:700;line-height:1.05}
.end .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}

<body>

<div class="wrap">
  <header>
    <h1>Trade Offs</h1>
    <p class="sub">Friends, health, grades. Two years, four seasons each, four turns a season. Maxing two is easy. All three takes patience.</p>
  </header>
  <div class="main">
    <section class="meters" id="meters" aria-live="polite"></section>
    <main id="stage"></main>
  </div>
</div>

<script>
(function(){
const STATS = {
  social:{name:"Friends", c:"var(--social)", low:"Nobody texts you anymore.", statuses:[[0,"Isolated"],[25,"Drifting"],[50,"A few close ones"],[75,"Known on campus"],[90,"Everyone's friend"]]},
  health:{name:"Health", c:"var(--health)", low:"Running on fumes.", statuses:[[0,"Burnt out"],[25,"Tired all day"],[50,"Holding up"],[75,"Sleeping well"],[90,"Glowing"]]},
  grades:{name:"Grades", c:"var(--grades)", low:"Academic probation looms.", statuses:[[0,"Failing"],[25,"Behind"],[50,"Passing"],[75,"Dean's list range"],[90,"Top of the class"]]},
};
const KEYS = ["social","health","grades"];
const WEEKS = 32;
const SEASONS = ["Spring","Summer","Autumn","Winter"];
const isExam = w => w%4===0;
const seasonOf = w => SEASONS[Math.floor((w-1)/4)%4];
const yearOf = w => Math.floor((w-1)/16)+1;
const weekIn = w => ((w-1)%4)+1;
const DECAY = {social:-5, health:-5, grades:-5};   // what one week of neglect costs

// Each action feeds one stat and taxes the others.
const ACTIONS = [
 // pure cards: a big push on one meter, and one sensible cost — the thing that really gives way
 {k:"social", t:"Say yes to every invite", d:"Parties, late ramen, a road trip nobody planned. Sleep suffers.", eff:{social:+22, health:-5}},
 {k:"social", t:"Host a dinner", d:"Cook for eight. The essay waits.", eff:{social:+22, grades:-5}},
 {k:"social", t:"Run for student council", d:"Shaking hands all week. Reading piles up.", eff:{social:+22, grades:-5}},
 {k:"health", t:"Sleep eight hours, every night", d:"Phone off at eleven. You miss the late nights.", eff:{social:-5, health:+22}},
 {k:"health", t:"Gym at 6 a.m.", d:"You see sunrises. Your friends don't see you.", eff:{social:-5, health:+22}},
 {k:"health", t:"Meal-prep Sundays", d:"Eleven identical lunches. One lost study day.", eff:{health:+22, grades:-5}},
 {k:"grades", t:"Library lock-in", d:"Fourth floor, no windows. Nobody can find you.", eff:{social:-5, grades:+22}},
 {k:"grades", t:"Office hours every week", d:"The professor learns your name. Your friends forget it.", eff:{social:-5, grades:+22}},
 {k:"grades", t:"All-nighter before the deadline", d:"Caffeine, panic, a surprisingly good essay.", eff:{health:-8, grades:+24}},
 // hybrid cards: two meters at once, no cost, but neither climbs fast — the patient road to all three
 {k:"social", t:"Join the hiking club", d:"New people, fresh air.", eff:{social:+9, health:+9}},
 {k:"grades", t:"Start a study group", d:"Half gossip, half flashcards.", eff:{social:+9, grades:+9}},
 {k:"health", t:"Intramural football", d:"A team, a sweat, a pizza after.", eff:{social:+9, health:+9}},
 {k:"health", t:"Study in the park", d:"Sun, a textbook, a walk home.", eff:{health:+9, grades:+9}},
];

// Events interrupt a week with a choice.
const EVENTS = [
 {w:[3,11,19,27], text:"Your roommate's birthday falls the night before a quiz.", opts:[
   {t:"Go, stay late", eff:{social:+12, grades:-6}},
   {t:"Drop by for an hour, then study", eff:{social:+4, grades:+4}}]},
 {w:[2,10,18,26], text:"You wake up with a fever.", opts:[
   {t:"Push through classes anyway", eff:{health:-10, grades:+3}},
   {t:"Stay in bed for three days", eff:{health:+6, grades:-6}}]},
 {w:[5,13,21,29], text:"A group project partner vanishes. The deadline doesn't.", opts:[
   {t:"Carry the whole thing yourself", eff:{health:-6, grades:+10}},
   {t:"Rally friends to help cover it", eff:{social:+6, grades:+4}}]},
 {w:[6,14,22,30], text:"Someone you like asks if you're free this weekend.", opts:[
   {t:"Absolutely", eff:{social:+14, grades:-6}},
   {t:"After exams, promise", eff:{social:-4, grades:+6}}]},
 {w:[1,9,17,25], text:"Free campus gym trial week. Your friends are going. Your reading isn't done.", opts:[
   {t:"Go with them", eff:{social:+7, health:+7, grades:-6}},
   {t:"Reading first", eff:{social:-3, grades:+8}}]},
 {w:[7,15,23,31], text:"A scholarship application is due Friday. It's long.", opts:[
   {t:"Apply, skip everything else", eff:{social:-5, health:-4, grades:+12}},
   {t:"Let it go this year", eff:{social:+3, health:+4}}]},
];

let S;
function fresh(){ return {who:"boy", started:false, week:1, social:50, health:50, grades:50, phase:"act", log:[], event:null, hand:[], sick:0, done:false, seed:Date.now()%100000}; }
// small seeded RNG so hot-reload keeps the same hand
function rng(){ S.seed=(S.seed*9301+49297)%233280; return S.seed/233280; }
function pick(arr,n){ const a=arr.slice(), out=[]; while(out.length<n&&a.length){ out.push(a.splice(Math.floor(rng()*a.length),1)[0]); } return out; }
function clamp(v){ return Math.max(0,Math.min(100,v)); }
// Gains compound. Inside the safety range they land in full; below it, a neglected stat is hard to lift; above it, momentum helps.
const SAFE=[30,70];
function mult(v){ return v<20?0.6 : v<SAFE[0]?0.85 : v>=SAFE[1]?1.1 : 1; }
function multLabel(v){ const m=mult(v); return m===1?"":m<1?`gains ×${m} · neglected`:`gains ×${m} · momentum`; }
function effective(eff){ const o={}; for(const k of KEYS){ const d=eff[k]||0; o[k]= d>0? Math.round(d*mult(S[k])) : d; } return o; }
function statusFor(k){ const v=S[k]; let s=""; for(const [th,n] of STATS[k].statuses) if(v>=th) s=n; return s; }
function fmt(n){ return (n>0?"+":"")+n; }

function dealHand(){
  // one card of each kind plus one wild, so every week is a real choice
  const by=k=>ACTIONS.filter(a=>a.k===k);
  const hand=[pick(by("social"),1)[0],pick(by("health"),1)[0],pick(by("grades"),1)[0]];
  const rest=ACTIONS.filter(a=>!hand.includes(a));
  hand.push(pick(rest,1)[0]);
  return pick(hand,4).map(a=>ACTIONS.indexOf(a));
}

function apply(rawEff, who){
  const eff=effective(rawEff);
  const before={social:S.social,health:S.health,grades:S.grades};
  for(const k of KEYS) S[k]=clamp(S[k]+(eff[k]||0));
  S.log.push({w:S.week, t:who, eff});
  return before;
}

function startWeek(){
  S.hand=dealHand();
  S.event=null;
  S.news=null;
  // exam weeks
  if(isExam(S.week)){ S.news={cls:"", text:S.week===WEEKS?"Final exams. Last week of year two. Everything counts.":`${seasonOf(S.week)} exams this week. Your grades get a report card at the end of it.`}; }
  // random event (not on exam weeks)
  if(!isExam(S.week)){
    const cands=EVENTS.filter(e=>e.w.includes(S.week));
    if(cands.length && rng()<0.6){ S.event=EVENTS.indexOf(cands[0]); S.phase="event"; return; }
  }
  S.phase="act";
}

function endWeek(){
  // decay: everything you didn't tend slips
  for(const k of KEYS) S[k]=clamp(S[k]+DECAY[k]);
  let notes=[];
  if(isExam(S.week) && S.week<WEEKS){
    const sn=seasonOf(S.week);
    if(S.grades<30){ notes.push({cls:"bad",text:`${sn} report card: you bombed. The department sends a warning letter.`}); S.grades=clamp(S.grades-8); }
    else if(S.grades>=70){ notes.push({cls:"good",text:`${sn} report card: strong. A professor asks if you'd TA next year.`}); S.social=clamp(S.social+4); }
    else notes.push({cls:"",text:`${sn} report card: fine. Nobody is impressed, nobody is worried.`});
  }
  if(S.health<=15 && S.sick===0){
    S.sick=1; notes.push({cls:"bad",text:"You collapse. The clinic orders a week of rest: no studying, no going out."});
  } else if(S.sick===1){ S.sick=2; }
  if(S.social<=15) notes.push({cls:"bad",text:"The group chat went quiet. Being lonely is making everything heavier."});
  S.week++;
  if(S.week>WEEKS){ S.done=true; S.phase="end"; render(); return; }
  if(S.sick===1){
    // forced rest week
    S.health=clamp(S.health+16); S.grades=clamp(S.grades-6);
    S.log.push({w:S.week,t:"Bed rest (ordered)",eff:{health:+16,grades:-6}});
    S.week++; S.sick=2;
    if(S.week>WEEKS){ S.done=true; S.phase="end"; render(); return; }
  }
  if(S.sick===2 && S.health>40) S.sick=0;
  startWeek();
  if(notes.length) S.news=S.news? {cls:notes[0].cls,text:notes[0].text+" "+S.news.text} : notes[0];
  render();
}

function choose(action){
  apply(action.eff, action.t);
  endWeek();
}
function chooseEvent(opt){
  apply(opt.eff, opt.t);
  S.phase="act"; S.event=null;
  render();
}

// ---------- ending ----------
function ending(){
  const s=S.social,h=S.health,g=S.grades;
  const TOP=80;
  const tops=[s>=TOP,h>=TOP,g>=TOP].filter(Boolean).length;
  const min=Math.min(s,h,g), max=Math.max(s,h,g);
  const gpa = g>=90?"A":g>=80?"A-":g>=65?"B":g>=50?"C":g>=35?"D":"F";
  const friends = Math.round(s/6);
  const sleep = (4.5 + h/100*4).toFixed(1);
  let title,body;
  if(tops===3){ title="Top marks. Best health. Tons of friends."; body="You beat the triangle. Almost nobody does. Screenshot this, because next time the dice won't be this kind."; }
  else if(tops===2){
    if(s>=TOP&&g>=TOP){ title="Dean's list, and everyone came to the party."; body="You traded sleep for both. Your body kept the receipts. Still: two out of three, at the top, is the semester most people wish they'd had."; }
    else if(s>=TOP&&h>=TOP){ title="Glowing, beloved, and on academic probation."; body="You feel incredible. Your transcript does not. The registrar would like a word, but it can wait until after the hike."; }
    else { title="Top marks, perfect sleep, empty inbox."; body="Disciplined, rested, brilliant, and nobody has your number. The grades will outlast this. Will anything else?"; }
  }
  else if(tops===1){
    if(g>=TOP){ title="Dean's list. Nothing else."; body="You chose grades, and you chose them completely. It shows on the transcript and on your face."; }
    else if(s>=TOP){ title="The best semester of your life. Academically, a disaster."; body="You know everyone. Everyone knows you. The registrar also knows you, for different reasons."; }
    else { title="Fit, rested, and strangely alone."; body="You sleep nine hours a night. Nobody texts. The transcript is thin."; }
  }
  else if(min>=50){ title="Balanced, and nothing to show for it."; body="You kept all three alive. None of them thrived. That's what trying to hold the whole triangle usually costs."; }
  else if(max-min<=20){ title="Perfectly mediocre, and okay with it."; body="Nothing soared, nothing crashed. That's a more honest result than most people get."; }
  else { title="Something had to give."; body="You never committed. The stats you half-chose stayed half-finished. Pick two next time, and mean it."; }
  return {title,body,gpa,friends,sleep};
}

// ---------- render ----------
const $=id=>document.getElementById(id);
function renderMeters(){
  $("meters").innerHTML = KEYS.map(k=>{
    const v=S[k], low=v<=20;
    const row=KEYS.indexOf(k), col=Math.min(7,Math.floor(v/12.5));
    const sprite=S.who?`<div class="sprite ${S.who}" id="sp-${k}" style="background-position:${col*100/7}% ${row*50}%" role="img" aria-label="${STATS[k].name} level ${col+1} of 8"></div>`:"";
    return `<div class="meter ${low?"low":""}" style="--c:${STATS[k].c}">
      ${sprite}
      <div class="txt">
      <div class="name">${STATS[k].name}</div>
      <div class="val"><span id="v-${k}">${v}</span><small>/100</small></div>
      <div class="bar"><u class="safe"></u><i style="--p:${v}" id="bar-${k}"></i><i class="ghost" id="g-${k}" style="--g:0"></i></div>
      <div class="status">${low?STATS[k].low:statusFor(k)}</div>
      <div class="mult ${mult(v)<1?"bad":mult(v)>1?"good":""}">${multLabel(v)||"gains ×1 · safe range"}</div>
      </div>
    </div>`;
  }).join("");
}
function preview(raw){
  const eff=raw?effective(raw):null;
  for(const k of KEYS){
    const cur=S[k], nxt=clamp(cur+(eff?eff[k]||0:0));
    const bar=$("bar-"+k), g=$("g-"+k);
    if(!bar) continue;
    const sp=$("sp-"+k); if(sp){ const col=Math.min(7,Math.floor((eff?nxt:cur)/12.5)); sp.style.backgroundPosition=`${col*100/7}% ${KEYS.indexOf(k)*50}%`; }
    if(!eff){ bar.style.setProperty("--p",cur); g.style.setProperty("--g",0); continue; }
    // show loss by shrinking main bar; show gain as ghost
    if(nxt<cur){ bar.style.setProperty("--p",nxt); g.style.setProperty("--g",0); }
    else { bar.style.setProperty("--p",cur); g.style.setProperty("--g",nxt); }
  }
}
function deltaChips(raw){
  const eff=effective(raw);
  return KEYS.map(k=>{ const v=eff[k]||0, r=raw[k]||0; if(!r) return ""; const scaled=v!==r?` <s>${fmt(r)}</s>`:""; return `<span class="dl ${v<0?"neg":""}" style="--dc:${STATS[k].c}">${STATS[k].name.slice(0,1)} ${fmt(v)}${scaled}</span>`; }).join("");
}
function renderStage(){
  const st=$("stage");
  if(!S.started){
    st.innerHTML=`<section class="week intro">
      <div class="head"><h2>How to play</h2><span class="tag">2 years · 32 turns</span></div>
      <ol class="steps">
        <li><span class="n">1</span><div><b>You have three meters:</b> <em style="color:var(--social)">Friends</em>, <em style="color:var(--health)">Health</em>, <em style="color:var(--grades)">Grades</em>. Each starts at 50.</div></li>
        <li><span class="n">2</span><div><b>Each week, pick one card.</b> Big cards push one meter up and cost a little on one other. Small cards lift two meters at once. Hover a card to see exactly what it does.</div></li>
        <li><span class="n">3</span><div><b>Every week, all three slip by 5 on their own.</b> What you ignore, you lose.</div></li>
        <li><span class="n">4</span><div><b>Keep a meter in the grey band and it's easy to push.</b> Let it drop low and it gets hard to lift. Keep it high and it builds momentum.</div></li>
        <li><span class="n">5</span><div><b>Every season ends with exams.</b> After two years you get your verdict. Top two is easy. All three is the real game.</div></li>
      </ol>
      <div class="foot" style="margin-top:auto"><button class="primary" id="go" style="margin:0">Start year one</button></div>
    </section>`;
    $("go").onclick=()=>{ S.started=true; render(); };
    return;
  }
  if(S.phase==="end"){
    const e=ending();
    st.innerHTML=`<section class="end">
      <div class="label">End of two years</div>
      <h2>${e.title}</h2>
      <div class="grid">
        <div class="cell" style="--c:var(--social)"><div class="sprite boy" style="background-position:${Math.min(7,Math.floor(S.social/12.5))*100/7}% 0%"></div><div class="label">Friends</div><div class="big">${e.friends}</div><div class="n">people who'd help you move</div></div>
        <div class="cell" style="--c:var(--health)"><div class="sprite boy" style="background-position:${Math.min(7,Math.floor(S.health/12.5))*100/7}% 50%"></div><div class="label">Health</div><div class="big">${e.sleep}h</div><div class="n">average sleep per night</div></div>
        <div class="cell" style="--c:var(--grades)"><div class="sprite boy" style="background-position:${Math.min(7,Math.floor(S.grades/12.5))*100/7}% 100%"></div><div class="label">Grades</div><div class="big">${e.gpa}</div><div class="n">semester average</div></div>
      </div>
      <p>${e.body}</p>
      <button class="primary" id="again">Start over</button>
    </section>`;
    $("again").onclick=()=>{ S=fresh(); S.started=true; startWeek(); render(); };
    return;
  }
  const examTag = isExam(S.week) ? `<span class="tag exam">Year ${yearOf(S.week)} ${seasonOf(S.week)} exams · week 4 of 4</span>` : `<span class="tag">Year ${yearOf(S.week)} ${seasonOf(S.week)} · week ${weekIn(S.week)} of 4</span>`;
  const news = S.news ? `<div class="news ${S.news.cls||""}">${S.news.text}</div>` : "";
  if(S.phase==="event"){
    const ev=EVENTS[S.event];
    st.innerHTML=`<section class="week event">
      <div class="head"><h2>Something comes up</h2>${examTag}</div>
      <p>${ev.text}</p>
      <div class="hand">${ev.opts.map((o,i)=>`<button class="act" data-i="${i}" style="--c:var(--ink)"><span class="t">${o.t}</span><span class="deltas">${deltaChips(o.eff)}</span></button>`).join("")}</div>
      ${footer()}
    </section>`;
    st.querySelectorAll(".act").forEach(b=>{
      const o=ev.opts[+b.dataset.i];
      b.onmouseenter=b.onfocus=()=>preview(o.eff); b.onmouseleave=b.onblur=()=>preview(null);
      b.onclick=()=>{ preview(null); chooseEvent(o); };
    });
    return;
  }
  st.innerHTML=`<section class="week">
    <div class="head"><h2>What's this week about?</h2>${examTag}</div>
    ${news}
    <div class="hand">${S.hand.map(i=>{ const a=ACTIONS[i]; return `<button class="act" data-i="${i}" style="--c:${STATS[a.k].c}"><span class="t">${a.t}</span><span class="d">${a.d}</span><span class="deltas">${deltaChips(a.eff)}</span></button>`; }).join("")}</div>
    ${footer()}
  </section>`;
  st.querySelectorAll(".act").forEach(b=>{
    const a=ACTIONS[+b.dataset.i];
    b.onmouseenter=b.onfocus=()=>preview(a.eff); b.onmouseleave=b.onblur=()=>preview(null);
    b.onclick=()=>{ preview(null); choose(a); };
  });
}
function footer(){
  const log=S.log.length?`<details class="log"><summary>History (${S.log.length})</summary><div class="pop"><ol>${S.log.slice().reverse().map(l=>`<li><span>Y${yearOf(l.w)} ${seasonOf(l.w).slice(0,2)}${weekIn(l.w)}</span><span>${l.t} <span style="color:var(--muted)">(${KEYS.filter(k=>l.eff[k]).map(k=>STATS[k].name.slice(0,1)+" "+fmt(l.eff[k])).join(", ")})</span></span></li>`).join("")}</ol></div></details>`:"";
  return `<div class="foot">
    <details class="rules"><summary>How it works</summary><div class="pop">Every week, untended stats slip on their own (<b>${fmt(DECAY.social)} friends, ${fmt(DECAY.health)} health, ${fmt(DECAY.grades)} grades</b>). Gains compound: the shaded band on each meter is the <b>safe range (30–70)</b>, where a push lands in full. Below it a neglected stat only takes 85% of any gain (60% under 20); above it, momentum gives 110%. Losses always land in full. Hover a card to preview. Health at 15 or below puts you in bed for a week.</div></details>
    ${log}
    <span style="margin-left:auto;font-family:var(--mono);font-size:11px">Hover a card to preview</span>
  </div>`;
}
function render(){ renderMeters(); renderStage(); }

function start(saved){
  S = (saved && saved.week) ? saved : fresh(); S.who="boy";
  if(!saved || !saved.week) startWeek();
  render();
}
try{ window.claude?.hot?.snapshot?.(()=>S); }catch(e){}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>

</body>
</html>
