<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Step by Step Maths</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: a calm whiteboard. One worked problem on squared paper, a side card for the current thought, one sentence underneath. */
:root{
  --bg:#e9eeec; --board:#f9fbfa; --grid:#e2e9e6; --ink:#16222b; --muted:#66757f; --line:#c8d2cf; --chip:#eef3f1;
  --sum:#11804a; --prod:#1c5fd1; --quot:#7638c6; --carry:#bf5200;
  --digits:"Atkinson Hyperlegible", "Verdana", system-ui, sans-serif;
  --ui:"Lexend", system-ui, -apple-system, "Segoe UI", sans-serif;
  --shadow:0 1px 2px rgba(20,40,35,.06), 0 10px 30px rgba(20,40,35,.07);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#10181f; --board:#16212a; --grid:#1f2c36; --ink:#eaf0f4; --muted:#8e9ca7; --line:#2d3b46; --chip:#1c2832;
  --sum:#56d692; --prod:#82b4ff; --quot:#c8a2ff; --carry:#ffaa5a; --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#10181f; --board:#16212a; --grid:#1f2c36; --ink:#eaf0f4; --muted:#8e9ca7; --line:#2d3b46; --chip:#1c2832;
  --sum:#56d692; --prod:#82b4ff; --quot:#c8a2ff; --carry:#ffaa5a; --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35); color-scheme:dark }
:root[data-skin="paper"]{ --bg:#e9eeec; --board:#f9fbfa; --grid:#e2e9e6; --ink:#16222b; --muted:#66757f; --line:#c8d2cf; --chip:#eef3f1;
  --sum:#11804a; --prod:#1c5fd1; --quot:#7638c6; --carry:#bf5200; --shadow:0 1px 2px rgba(20,40,35,.06), 0 10px 30px rgba(20,40,35,.07); color-scheme:light }
:root[data-skin="slate"]{ --bg:#10181f; --board:#16212a; --grid:#1f2c36; --ink:#eaf0f4; --muted:#8e9ca7; --line:#2d3b46; --chip:#1c2832;
  --sum:#56d692; --prod:#82b4ff; --quot:#c8a2ff; --carry:#ffaa5a; --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px rgba(0,0,0,.35); color-scheme:dark }
:root[data-skin="chalk"]{ --bg:#132a24; --board:#1a352e; --grid:#22423a; --ink:#f2f5ea; --muted:#9db5aa; --line:#2f5248; --chip:#1f3d35;
  --sum:#8ef0b2; --prod:#a3cbff; --quot:#e2b8ff; --carry:#ffc27c; --shadow:0 1px 2px rgba(0,0,0,.35), 0 12px 32px rgba(0,0,0,.3); color-scheme:dark }
:root[data-skin="mist"]{ --bg:#e8ecf3; --board:#f8f9fc; --grid:#e1e6ef; --ink:#1a2238; --muted:#646f88; --line:#c9d0de; --chip:#eceff6;
  --sum:#0f7a52; --prod:#2350c8; --quot:#7a33bd; --carry:#b04f0c; --shadow:0 1px 2px rgba(20,30,60,.06), 0 10px 30px rgba(20,30,60,.08); color-scheme:light }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--ui); overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
button,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--prod); outline-offset:2px}

.app{height:100%; display:grid; grid-template-rows:auto 1fr; gap:1.2vmin; padding-block:1.2vmin}
.bar{display:flex; flex-wrap:wrap; align-items:center; gap:.5em 1em; transition:opacity .5s; font-size:clamp(14px, 1.15vmin, 28px)}
.brand{font-weight:600; font-size:1.1em; margin-right:auto; display:flex; align-items:center; gap:10px; letter-spacing:.01em}
.brand i{width:1.6em; height:1.6em; border-radius:.45em; background:var(--ink); color:var(--board); display:grid; place-items:center; font-style:normal; font-family:var(--digits); font-weight:700; font-size:.85em}
.grp{display:flex; align-items:center; gap:6px}
.lbl{font-size:.68em; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin-right:2px}
.tg{height:2.5em; padding:0 .9em; border-radius:999px; border:1.5px solid var(--line); background:var(--board); font-size:.9em}
.tg[aria-pressed="true"]{background:var(--ink); color:var(--board); border-color:var(--ink)}
select{height:2.5em; border-radius:999px; border:1.5px solid var(--line); background:var(--board); padding:0 .7em; font-size:.9em}
.btn{height:2.5em; padding:0 1em; border-radius:999px; border:1.5px solid var(--line); background:var(--board); font-size:.9em}
.btn.go{background:var(--prod); border-color:var(--prod); color:var(--board); font-weight:500}
.sw{width:1.8em; height:1.8em; border-radius:50%; border:1.5px solid var(--line); padding:0; overflow:hidden; position:relative}
.sw i{position:absolute; inset:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg), 0 0 0 4px var(--ink)}

.stage{min-height:0; display:grid; grid-template-rows:auto minmax(0,1fr) auto auto; gap:1.6vmin; transition:opacity .7s ease}
.stage.leaving{opacity:0}
.head{display:flex; align-items:baseline; flex-wrap:wrap; gap:.4em 1em}
.kind{font-weight:600; font-size:clamp(1.1rem, 2.6vmin, 3.4rem)}
.lvl{font-size:clamp(.8rem, 1.6vmin, 2rem); color:var(--muted); border:1.5px solid var(--line); border-radius:999px; padding:.15em .8em}
.prob{font-family:var(--digits); font-weight:700; font-size:clamp(1.1rem, 2.6vmin, 3.4rem); margin-left:auto; font-variant-numeric:tabular-nums; color:var(--muted)}
.work{min-height:0; display:grid; grid-template-columns:minmax(0,1fr) minmax(240px, 27%); gap:2vmin}
.boardWrap{min-height:0; min-width:0; background:var(--board); border-radius:22px; box-shadow:var(--shadow); padding:2vmin; display:grid}
#board{width:100%; height:100%; display:block}
.side{min-width:0; display:flex; flex-direction:column; gap:2vmin}
.card{background:var(--board); border-radius:22px; box-shadow:var(--shadow); padding:2.4vmin; display:flex; flex-direction:column; gap:1.6vmin}
.chip{align-self:flex-start; font-weight:600; letter-spacing:.12em; font-size:clamp(.75rem, 1.6vmin, 2rem); padding:.35em .9em; border-radius:999px;
  color:var(--rc); background:color-mix(in srgb, var(--rc) 14%, transparent); border:1.5px solid color-mix(in srgb, var(--rc) 45%, transparent)}
.calc{font-family:var(--digits); font-weight:700; font-size:clamp(1.6rem, 4.6vmin, 6.5rem); line-height:1.15; font-variant-numeric:tabular-nums; overflow-wrap:anywhere}
.calc.small{font-size:clamp(1.2rem, 3.2vmin, 4.4rem)}
.calc .q{color:var(--rc); display:inline-block; animation:qpulse 1.6s ease-in-out infinite}
.calc .a{color:var(--rc)}
.calc.swap{animation:fadeup .5s ease both}
@keyframes qpulse{50%{opacity:.35}}
@keyframes fadeup{from{opacity:0; transform:translateY(.25em)}}
.legend{display:flex; flex-direction:column; gap:.7vmin; font-size:clamp(.8rem, 1.7vmin, 2.1rem); color:var(--muted)}
.legend span{display:flex; align-items:center; gap:.6em}
.legend i{width:.9em; height:.9em; border-radius:50%; background:var(--rc)}
.say{margin:0; text-align:center; font-size:clamp(1.05rem, 2.7vmin, 3.8rem); line-height:1.35; text-wrap:balance; min-height:2.7em; max-width:60ch; justify-self:center}
.say.swap{animation:fadeup .6s ease both}
.foot{display:flex; align-items:center; gap:1.4vmin; color:var(--muted); font-size:clamp(.75rem, 1.5vmin, 1.9rem)}
.prog{flex:1; height:6px; border-radius:6px; background:var(--grid); overflow:hidden}
.prog i{display:block; height:100%; width:0; background:var(--muted); opacity:.6}

/* board drawing */
.cellgrid{stroke:var(--grid); stroke-width:1.5}
.el{transition:opacity .9s ease}
text.el{fill:currentColor; font-family:var(--digits); font-weight:700; text-anchor:middle}
.r-ink{color:var(--ink)} .r-sum{color:var(--sum)} .r-prod{color:var(--prod)} .r-quot{color:var(--quot)} .r-carry{color:var(--carry)} .r-muted{color:var(--muted)}
.lab{font-family:var(--ui) !important; font-weight:500 !important; fill:var(--muted) !important}
.ln{stroke:currentColor; stroke-width:5; stroke-linecap:round; fill:none}
.stk{stroke:currentColor; stroke-width:5; stroke-linecap:round; fill:none}
.arw{stroke:currentColor; stroke-width:4; stroke-linecap:round; fill:none}
.arwh{fill:currentColor}
#board.active .el.given, #board.active .el.old{opacity:.42}
#board.active .el.hot{opacity:1}
.el.recent{opacity:1}
#board.final .el{opacity:1 !important}
.ink{stroke:currentColor; stroke-width:2; stroke-dasharray:600; stroke-dashoffset:600; fill-opacity:0; animation:trace .9s ease-out forwards, fillin .45s .55s ease-out forwards}
@keyframes trace{to{stroke-dashoffset:0}}
@keyframes fillin{to{fill-opacity:1; stroke-width:0}}
.inkln{stroke-dasharray:1; stroke-dashoffset:1; animation:draw .7s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fadein{opacity:0; animation:fade .4s ease-out forwards}
@keyframes fade{to{opacity:1}}
.erasing{animation:erase .6s ease-in forwards}
@keyframes erase{to{opacity:0}}
.band{fill:var(--ink); opacity:.05}
.glow{fill:color-mix(in srgb, var(--rc) 15%, transparent); stroke:var(--rc); stroke-width:3; filter:drop-shadow(0 0 10px color-mix(in srgb, var(--rc) 55%, transparent))}
.ring{fill:none; stroke:var(--rc); stroke-width:4; stroke-dasharray:14 10; transform-box:fill-box; transform-origin:center; animation:ring 1.2s ease-in-out 2}
@keyframes ring{0%{opacity:.15; transform:scale(1.14)} 55%{opacity:1; transform:scale(1)} 100%{opacity:.8; transform:scale(1)}}
.ring.settled{animation:none; opacity:.55}

.floatCtl{font-size:clamp(14px, 1.15vmin, 28px); position:fixed; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom,0px)); display:none; gap:6px; padding:6px;
  background:var(--board); border:1.5px solid var(--line); border-radius:999px; box-shadow:var(--shadow); transition:opacity .5s; z-index:5}
.saver .bar{display:none}
.saver .app{grid-template-rows:1fr}
.saver .floatCtl{display:flex}
.saver.idle .floatCtl{opacity:0; pointer-events:none}
.saver.idle{cursor:none}

@media (max-width:800px){
  body{overflow:auto}
  .app{height:auto; min-height:100%}
  .work{grid-template-columns:minmax(0,1fr)}
  .boardWrap{min-height:58vh}
  .prob{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  .ink,.inkln,.fadein{animation:fade .3s forwards; stroke-width:0; fill-opacity:1; stroke-dashoffset:0}
  .ring,.calc .q,.calc.swap,.say.swap{animation:none}
  .el,.stage{transition:none}
}
</style>

</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><i>÷</i>Step by Step Maths</div>
    <div class="grp" role="group" aria-label="Methods">
      <span class="lbl">Methods</span>
      <button class="tg" id="op-add" data-op="add" aria-pressed="true">Column +</button>
      <button class="tg" id="op-sub" data-op="sub" aria-pressed="true">Column −</button>
      <button class="tg" id="op-mul" data-op="mul" aria-pressed="true">Long ×</button>
      <button class="tg" id="op-div" data-op="div" aria-pressed="true">Long ÷</button>
    </div>
    <div class="grp">
      <label class="lbl" for="level">Level</label>
      <select id="level"><option value="climb">Climb 1 → 4</option><option value="1">Level 1</option><option value="2">Level 2</option><option value="3">Level 3</option><option value="4">Level 4</option></select>
      <label class="lbl" for="speed">Pace</label>
      <select id="speed"><option value="1.4">Slow</option><option value="1" selected>Calm</option><option value="0.7">Brisk</option></select>
    </div>
    <div class="grp" role="group" aria-label="Theme" id="skins"><span class="lbl">Theme</span></div>
    <div class="grp">
      <button class="btn" id="prev" aria-label="Previous step">◀ Step</button>
      <button class="btn" id="pause">Pause</button>
      <button class="btn" id="next" aria-label="Next step">Step ▶</button>
      <button class="btn" id="skip">Next problem</button>
      <button class="btn go" id="fs">Start full screen</button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="head">
      <span class="kind" id="kind">Long division</span>
      <span class="lvl" id="lvl">Level 1</span>
      <span class="prob" id="prob"></span>
    </div>
    <div class="work">
      <div class="boardWrap"><svg id="board" role="img" aria-label="Worked calculation"></svg></div>
      <aside class="side">
        <div class="card" aria-live="polite">
          <span class="chip" id="chip">LOOK</span>
          <div class="calc" id="calc"></div>
        </div>
        <div class="card legend" id="legend"></div>
      </aside>
    </div>
    <p class="say" id="say"></p>
    <div class="foot"><span id="stepn">Step 1</span><div class="prog"><i id="progbar"></i></div><span id="hint">Space pauses · ← → steps · N next problem · F full screen</span></div>
  </main>
</div>

<div class="floatCtl">
  <button class="btn" id="fPrev" aria-label="Previous step">◀</button>
  <button class="btn" id="fPause">Pause</button>
  <button class="btn" id="fNext" aria-label="Next step">▶</button>
  <button class="btn" id="fSkip">Next problem</button>
  <button class="btn go" id="fExit">Exit</button>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const KEY = 'stepByStepMaths.v1';
let S = {ops:{add:true, sub:true, mul:true, div:true}, level:'climb', speed:1, skin:'auto'};
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) S = Object.assign(S, s); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

/* ---------- helpers ---------- */
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const nDig = n => rnd(10**(n-1), 10**n - 1);
const fmt = n => Number(n).toLocaleString('en-GB');
const digs = n => String(n).split('').reverse().map(Number);   // place order: [ones, tens, ...]
const PS = ['one','ten','hundred','thousand','ten thousand','hundred thousand','million'];
const PL = ['O','T','H','Th','TTh','HTh','M'];
const pl = (p, n) => n===1 ? PS[p] : PS[p]+'s';
const colName = p => PS[p]+'s';
const cap = s => s[0].toUpperCase() + s.slice(1);
const est = n => { if (n < 10) return n; const k = 10**(String(n).length-1); return Math.round(n/k)*k; };

/* ---------- element factories ---------- */
const D = (r,c,ch,role='ink',sz='big',x={}) => ({t:'d', r, c, ch:String(ch), role, sz, ...x});
const LINE = (r,c0,c1,role='ink') => ({t:'line', r, c0, c1, role});
const STRIKE = (r,c,sz='big',role='carry') => ({t:'strike', r, c, sz, role});
const ARROW = (c,r0,r1,role='carry') => ({t:'arrow', c, r0, r1, role});
const step = o => Object.assign({focus:[], target:[], add:[], erase:[], band:null, ask:'', calc:'', say:''}, o);

/* ---------- column addition ---------- */
function genAdd(a, b){
  const A = digs(a), B = digs(b), sum = a + b, n = Math.max(A.length, B.length), W = n + 1;
  const col = p => W - p;
  const rows = [.5, 1, 1, 1.15, .62], LAB=0, RA=1, RB=2, ANS=3, CAR=4;
  const base = [];
  for (let p=0; p<String(sum).length; p++) base.push(D(LAB, col(p), PL[p], 'muted', 'tiny', {lab:true}));
  A.forEach((d,p) => base.push(D(RA, col(p), d)));
  B.forEach((d,p) => base.push(D(RB, col(p), d)));
  base.push(D(RB, 0, '+'));
  base.push(LINE(ANS, 0, W));
  const steps = [], band = c => ({r0:RA, r1:CAR, c0:c, c1:c});
  steps.push(step({label:'LOOK', role:'sum', calc:`${fmt(a)} + ${fmt(b)}`, say:'Line up the digits by place value. We start with the ones column, on the right.',
    target:[[RA,col(0)],[RB,col(0)]], band:band(col(0))}));
  let carry = 0;
  for (let p=0; p<n; p++){
    const c = col(p), terms = [], focus = [];
    if (A[p]!=null){ terms.push(A[p]); focus.push([RA,c]); }
    if (B[p]!=null){ terms.push(B[p]); focus.push([RB,c]); }
    if (carry){ terms.push(carry); focus.push([CAR,c]); }
    const s = terms.reduce((x,y)=>x+y,0), expr = terms.join(' + ');
    if (s >= 10){
      steps.push(step({label:'CARRY', role:'carry', ask:`${expr} = ?`, calc:`${expr} = ${s}`, focus, band:band(c), target:[[CAR,c-1]],
        say:`${s} ${colName(p)} is 1 ${PS[p+1]} and ${s-10} ${pl(p, s-10)}. Carry the 1 into the ${colName(p+1)} column, under the answer line.`, add:[D(CAR, c-1, 1, 'carry', 'small')]}));
      steps.push(step({label:'WRITE', role:'sum', calc:`write ${s%10}`, focus, band:band(c), target:[[ANS,c]], say:`Write ${s%10} in the ${colName(p)} column.`, add:[D(ANS, c, s%10, 'sum')]}));
    } else {
      steps.push(step({label:'ADD', role:'sum', ask:`${expr} = ?`, calc:`${expr} = ${s}`, focus, band:band(c), target:[[ANS,c]],
        say:`${cap(colName(p))} column: ${expr} = ${s}. Write ${s}.`, add:[D(ANS, c, s, 'sum')]}));
    }
    carry = s >= 10 ? 1 : 0;
  }
  if (carry) steps.push(step({label:'WRITE', role:'sum', calc:'1', focus:[[CAR,col(n)]], band:band(col(n)), target:[[ANS,col(n)]],
    say:`The carried 1 is the only thing in the ${colName(n)} column, so write 1.`, add:[D(ANS, col(n), 1, 'sum')]}));
  steps.push(step({label:'ANSWER', role:'sum', final:true, calc:`${fmt(a)} + ${fmt(b)} = ${fmt(sum)}`,
    say:`Check by undoing it: ${fmt(sum)} − ${fmt(b)} = ${fmt(a)}.`, focus:String(sum).split('').map((_,i)=>[ANS, col(i)])}));
  return {op:'add', rows, cols:W+1, base, steps, inline:`${fmt(a)} + ${fmt(b)}`};
}

/* ---------- column subtraction ---------- */
function genSub(a, b){
  const A = digs(a), B = digs(b), res = a - b, n = A.length, W = n;
  const col = p => W - p;
  const rows = [.5, .62, 1, 1, 1.15], LAB=0, EX=1, RA=2, RB=3, ANS=4;
  const base = [];
  for (let p=0; p<n; p++) base.push(D(LAB, col(p), PL[p], 'muted', 'tiny', {lab:true}));
  A.forEach((d,p) => base.push(D(RA, col(p), d)));
  B.forEach((d,p) => base.push(D(RB, col(p), d)));
  base.push(D(RB, 0, '−'));
  base.push(LINE(ANS, 0, W));
  const steps = [], band = c => ({r0:EX, r1:ANS, c0:c, c1:c});
  const cur = A.slice(), disp = A.map(() => ({r:RA, sz:'big'}));
  const resLen = String(res).length;
  steps.push(step({label:'LOOK', role:'sum', calc:`${fmt(a)} − ${fmt(b)}`, say:'Line up the digits by place value. Start with the ones column, on the right.',
    target:[[RA,col(0)],[RB,col(0)]], band:band(col(0))}));
  for (let p=0; p<n; p++){
    const c = col(p), d = B[p] ?? 0, hasD = p < B.length;
    if (cur[p] < d){
      const t = cur[p];
      steps.push(step({label:'EXCHANGE', role:'carry', ask:`${t} − ${d} = ?`, calc:`${t} is less than ${d}`, focus:[[disp[p].r,c],[RB,c]], band:band(c), target:[[disp[p+1].r, col(p+1)]],
        say:`We can't take ${d} from ${t}, so exchange 1 ${PS[p+1]} for 10 ${colName(p)}.`}));
      let j = p+1; while (cur[j]===0) j++;
      for (let q=j; q>p; q--){
        const old = cur[q], nv = q===j ? old-1 : 9;
        steps.push(step({label:'EXCHANGE', role:'carry', focus:[[disp[q].r, col(q)]], band:band(col(q)), target:[[EX, col(q)]],
          calc: q===j ? `${old} → ${nv}` : `0 → 10 → 9`,
          say: q===j ? `Take 1 ${PS[q]} from the ${colName(q)} column: ${old} becomes ${nv}.` : `That makes 10 ${colName(q)}. Pass 1 ${PS[q]} along to the right, leaving 9.`,
          add:[STRIKE(disp[q].r, col(q), disp[q].sz), D(EX, col(q), nv, 'carry', 'small', {delay:450})]}));
        cur[q] = nv; disp[q] = {r:EX, sz:'small'};
      }
      const pre = disp[p].sz==='big' ? {dx:-.38, dy:-.3} : {dx:-.27, dy:0};
      steps.push(step({label:'EXCHANGE', role:'carry', calc:`10 + ${t} = ${t+10}`, focus:[[disp[p].r,c]], band:band(c), target:[[disp[p].r,c]],
        say:`The ${colName(p)} column now has ${t+10} ${colName(p)}.`, add:[D(disp[p].r, c, 1, 'carry', 'small', pre)]}));
      cur[p] += 10;
    }
    const t = cur[p], r = t - d, writes = p < resLen;
    steps.push(step({label:'SUBTRACT', role:'sum', ask:`${t} − ${d} = ?`, calc:`${t} − ${d} = ${r}`,
      focus: hasD ? [[disp[p].r,c],[RB,c]] : [[disp[p].r,c]], band:band(c), target:[[ANS,c]],
      say: writes ? `${cap(colName(p))} column: ${t} − ${d} = ${r}. Write ${r}.` : `${cap(colName(p))} column: ${t} − ${d} = 0. We don't write a 0 at the front of a number.`,
      add: writes ? [D(ANS, c, r, 'sum')] : []}));

/* ---------- long multiplication ---------- */
function genMul(a, b){
  const A = digs(a), Bd = digs(b), prod = a*b, lA = A.length, lB = Bd.length, W = lA + lB;
  const col = p => W - p;
  const rows = [.5, .62, 1, 1], LAB=0, CAR=1, RA=2, RB=3;
  const P = []; for (let k=0; k<lB; k++){ P.push(rows.length); rows.push(1); }
  let FC = -1, ANS = P[lB-1];
  if (lB > 1){ ANS = rows.length; rows.push(1.15); FC = rows.length; rows.push(.62); }
  const base = [];
  for (let p=0; p<String(prod).length; p++) base.push(D(LAB, col(p), PL[p], 'muted', 'tiny', {lab:true}));
  A.forEach((d,p) => base.push(D(RA, col(p), d)));
  Bd.forEach((d,p) => base.push(D(RB, col(p), d)));
  base.push(D(RB, 0, '×'));
  base.push(LINE(P[0], 0, W));
  if (lB > 1) base.push(LINE(ANS, 0, W));
  const steps = [];
  const rowBand = r => ({r0:r, r1:r, c0:0, c1:W});
  steps.push(step({label:'LOOK', role:'prod', calc:`${fmt(a)} × ${fmt(b)}`, focus:[[RB,col(0)]], target:[[RB,col(0)]],
    say: lB>1 ? `Multiply ${fmt(a)} by each digit of ${b} in turn, starting with the ones digit, ${Bd[0]}.` : `Multiply each digit of ${fmt(a)} by ${b}, starting with the ones.`}));
  let carryKeys = [], kc = 0;
  const partials = [];
  for (let k=0; k<lB; k++){
    const m = Bd[k], r = P[k], row = {};
    if (k > 0){
      const zeros = []; for (let z=0; z<k; z++){ zeros.push(D(r, col(z), 0, 'muted')); row[z] = 0; }
      steps.push(step({label:'NEW ROW', role:'prod', calc:`${m} ${pl(k,m)} = ${fmt(m*10**k)}`, focus:[[RB,col(k)]], band:rowBand(r), target:zeros.map(z=>[r,z.c]),
        say:`Now multiply by the ${PS[k]}s digit. ${m} ${pl(k,m)} is ${fmt(m*10**k)}, so first write ${k>1?k+' zeros':'a 0'} as a place holder.`,
        add:zeros, erase:carryKeys}));
      carryKeys = [];
    }
    let carry = 0;
    for (let i=0; i<lA; i++){
      const da = A[i], v = da*m + carry, last = i===lA-1;
      const expr = `${da} × ${m}${carry ? ' + '+carry : ''}`;
      const focus = [[RA,col(i)],[RB,col(k)]]; if (carry) focus.push([CAR,col(i)]);
      const add = [];
      if (last){ String(v).split('').reverse().forEach((ch,j) => { add.push(D(r, col(i+k+j), ch, 'prod', 'big', {delay:j*250})); row[i+k+j] = +ch; }); }
      else {
        add.push(D(r, col(i+k), v%10, 'prod')); row[i+k] = v%10;
        if (v >= 10){ const key = 'c'+(kc++); add.push(D(CAR, col(i+1), Math.floor(v/10), 'carry', 'small', {delay:550, key})); carryKeys.push(key); }
      }
      steps.push(step({label:'MULTIPLY', role:'prod', ask:`${expr} = ?`, calc:`${expr} = ${v}`, focus, band:rowBand(r), target:[[r,col(i+k)]], add,
        say: last ? `${expr} = ${v}. That was the last digit, so write ${v}.`
           : v >= 10 ? `${expr} = ${v}. Write ${v%10} and carry ${Math.floor(v/10)} above the next digit.` : `${expr} = ${v}. Write ${v}.`}));
      carry = last ? 0 : Math.floor(v/10);
    }
    partials.push(row);
  }
  if (lB > 1){
    const pvals = partials.map((row,k) => Bd[k]*a*10**k);
    steps.push(step({label:'ADD', role:'sum', calc:pvals.map(fmt).join(' + '), erase:carryKeys, band:{r0:P[0], r1:FC, c0:col(0), c1:col(0)}, target:[[ANS,col(0)]],
      say:'Now add the rows together, column by column, starting with the ones.'}));
    let carry = 0;
    for (let p=0; p<W; p++){
      const c = col(p), terms = [], focus = [];
      partials.forEach((row,k) => { if (row[p] != null){ terms.push(row[p]); focus.push([P[k],c]); } });
      if (carry){ terms.push(carry); focus.push([FC,c]); }
      if (!terms.length) break;
      const s = terms.reduce((x,y)=>x+y,0), expr = terms.join(' + '), band = {r0:P[0], r1:FC, c0:c, c1:c};
      const leading = p >= String(prod).length;
      if (leading) break;
      if (s >= 10){
        steps.push(step({label:'CARRY', role:'carry', ask:`${expr} = ?`, calc:`${expr} = ${s}`, focus, band, target:[[FC,c-1]],
          say:`${s} is ${Math.floor(s/10)} ${PS[p+1]}${Math.floor(s/10)>1?'s':''} and ${s%10} ${pl(p,s%10)}. Carry the ${Math.floor(s/10)}.`, add:[D(FC, c-1, Math.floor(s/10), 'carry', 'small')]}));
        steps.push(step({label:'WRITE', role:'sum', calc:`write ${s%10}`, focus, band, target:[[ANS,c]], say:`Write ${s%10} in the ${colName(p)} column.`, add:[D(ANS, c, s%10, 'sum')]}));
      } else {
        steps.push(step({label:'ADD', role:'sum', ask:`${expr} = ?`, calc:`${expr} = ${s}`, focus, band, target:[[ANS,c]],
          say:`${cap(colName(p))} column: ${expr} = ${s}.`, add:[D(ANS, c, s, 'sum')]}));
      }
      carry = Math.floor(s/10);
    }
  }
  const ea = est(a), eb = est(b);
  steps.push(step({label:'ANSWER', role:lB>1?'sum':'prod', final:true, calc:`${fmt(a)} × ${fmt(b)} = ${fmt(prod)}`,
    say:`Estimate to check: ${fmt(ea)} × ${fmt(eb)} = ${fmt(ea*eb)}, which is close to ${fmt(prod)}.`, focus:String(prod).split('').map((_,i)=>[ANS, col(i)])}));
  return {op:'mul', rows, cols:W+1, base, steps, inline:`${fmt(a)} × ${fmt(b)}`};
}

/* ---------- long division ---------- */
function genDiv(N, d){
  const Dg = String(N).split('').map(Number), lN = Dg.length, ds = String(d), ld = ds.length;
  const col = j => ld + 1 + j;
  const rows = [1, 1], Q=0, NR=1;
  const base = [];
  ds.split('').forEach((ch,i) => base.push(D(NR, i, ch)));
  base.push({t:'bracket', r:NR, c:ld, c1:col(lN-1)});
  Dg.forEach((v,j) => base.push(D(NR, col(j), v)));
  const steps = [], divCells = ds.split('').map((_,i)=>[NR,i]);
  steps.push(step({label:'LOOK', role:'quot', calc:`${fmt(N)} ÷ ${d}`, focus:divCells, target:[[NR,col(0)]],
    say:`Divide ${fmt(N)} by ${d}. Work from the left. Each round is divide, multiply, subtract, bring down.`}));
  let e = 0, v = Dg[0];
  while (v < d && e < lN-1){ e++; v = v*10 + Dg[e]; }
  const span = (r, j0, j1) => { const o=[]; for (let j=j0;j<=j1;j++) o.push([r,col(j)]); return o; };
  if (e > 0) steps.push(step({label:'LOOK', role:'quot', calc:`${Dg.slice(0,e).join('')} < ${d}`, focus:span(NR,0,e), target:span(NR,0,e),
    say:`${d} doesn't go into ${Dg.slice(0,e).join('')}, so we use the first ${e+1} digits: ${v}.`}));
  let curRow = NR, curCells = span(NR, 0, e), i = e, quotient = '', rem = 0;
  while (true){
    const q = Math.floor(v/d), prod = q*d, diff = v - prod;
    quotient += q;
    steps.push(step({label:'DIVIDE', role:'quot', ask:`How many ${d}s in ${v}?`,
      calc: q>0 ? `${q} × ${d} = ${prod}` + ((q+1)*d > v ? `<br><span class="r-muted">${q+1} × ${d} = ${(q+1)*d} is too big</span>` : '') : `${d} > ${v}, so 0`,
      focus:[...curCells, ...divCells], target:[[Q,col(i)]],
      say: q>0 ? `${d} goes into ${v} ${q} time${q>1?'s':''}. Write ${q} above the ${Dg[i]}.` : `${d} doesn't go into ${v}, so write 0 above the ${Dg[i]}.`,
      add:[D(Q, col(i), q, 'quot')]}));
    let nextCells = curCells, nextRow = curRow;
    if (q > 0){
      const pr = rows.length; rows.push(1);
      const pd = String(prod), pc = []; const padd = [];
      pd.split('').forEach((ch,k) => { const c = col(i) - (pd.length-1-k); padd.push(D(pr, c, ch, 'prod', 'big', {delay:k*200})); pc.push([pr,c]); });
      padd.push(D(pr, col(i) - pd.length, '−', 'prod', 'big', {delay:0}));
      steps.push(step({label:'MULTIPLY', role:'prod', ask:`${q} × ${d} = ?`, calc:`${q} × ${d} = ${prod}`, focus:[[Q,col(i)], ...divCells], target:pc,
        say:`Multiply: ${q} × ${d} = ${prod}. Write it under ${v}.`, add:padd}));
      const dr = rows.length; rows.push(1);
      const c0 = Math.min(...curCells.map(x=>x[1]), col(i) - pd.length + 1);
      const sadd = [LINE(dr, c0, col(i))], dc = [];
      const last = i === lN-1;
      if (diff > 0 || last){ const s = String(diff); s.split('').forEach((ch,k) => { const c = col(i) - (s.length-1-k); sadd.push(D(dr, c, ch, 'sum', 'big', {delay:450 + k*200})); dc.push([dr,c]); }); }
      steps.push(step({label:'SUBTRACT', role:'sum', ask:`${v} − ${prod} = ?`, calc:`${v} − ${prod} = ${diff}`, focus:[...curCells, ...pc], target: dc.length ? dc : [[dr, col(i)]],
        say: diff>0 ? `Subtract: ${v} − ${prod} = ${diff}.` : last ? `Subtract: ${v} − ${prod} = 0.` : `Subtract: ${v} − ${prod} = 0. Nothing is left over.`, add:sadd}));
      nextRow = dr; nextCells = dc; rem = diff;
    } else rem = v;
    if (i === lN-1) { curCells = nextCells; break; }

    steps.push(step({label:'BRING DOWN', role:'carry', ask:`Next digit: ${nd}`, calc:`${q>0?diff:v} → ${nv}`, focus:[[NR,col(i+1)]], target:[[nextRow, col(i+1)]],
      say:`Bring down the ${nd} to make ${nv}.`, add:[ARROW(col(i+1), NR, nextRow), D(nextRow, col(i+1), nd, 'carry', 'big', {delay:650})]}));
    curRow = nextRow; curCells = [...nextCells, [nextRow, col(i+1)]]; v = nv; i++;
  }
  const qn = Number(quotient);
  if (rem > 0){
    const radd = [D(Q, col(lN-1)+1, 'r', 'carry', 'big', {dx:.15})], rc = [[Q, col(lN-1)+1]];
    String(rem).split('').forEach((ch,k) => { radd.push(D(Q, col(lN-1)+2+k, ch, 'carry', 'big', {delay:250+k*200})); rc.push([Q, col(lN-1)+2+k]); });
    steps.push(step({label:'REMAINDER', role:'carry', calc:`remainder ${rem}`, focus:curCells, target:rc,
      say:`There are no more digits to bring down, so ${rem} is the remainder.`, add:radd}));
  }
  const qCells = []; Dg.forEach((_,j) => { if (j >= e) qCells.push([Q, col(j)]); });
  steps.push(step({label:'ANSWER', role:'quot', final:true, calc:`${fmt(N)} ÷ ${d} = ${fmt(qn)}${rem?' r '+rem:''}`,
    say:`Check: ${fmt(qn)} × ${d}${rem?' + '+rem:''} = ${fmt(N)}.`, focus:qCells}));
  // quotient digits above leading positions are left blank; remove any leading zero writes
  return {op:'div', rows, cols: rem ? col(lN-1) + 2 + String(rem).length : col(lN-1) + 1, base, steps, inline:`${fmt(N)} ÷ ${d}`};
}

/* ---------- problem picker, by level ---------- */
function carries(a,b){ let c=0, n=0; while(a||b){ const s=a%10+b%10+c; c = s>=10?1:0; n+=c; a=Math.floor(a/10); b=Math.floor(b/10); } return n; }

function makeProblem(op, L){
  for (let tries=0; tries<400; tries++){
    if (op==='add'){
      const [la,lb,minC] = [[2,2,1],[3,3,2],[4,4,2],[5,5,3]][L-1];
      const a = nDig(la), b = nDig(lb); if (carries(a,b) >= minC) return genAdd(a,b);
    }
    if (op==='sub'){
      const [la,lb] = [[2,2],[3,3],[4,4],[5,4]][L-1];
      let a = nDig(la), b = nDig(lb);
      if (L>=3 && Math.random()<.8){ const A = digs(a); A[rnd(1, la-2)] = 0; if (L===4) A[rnd(1, la-2)] = 0; a = Number(A.slice().reverse().join('')); }
      if (a <= b) continue;
      const br = borrows(a,b);
      if (L===1 && br.n>=1) return genSub(a,b);
      if (L===2 && br.n>=1) return genSub(a,b);
      if (L>=3 && br.n>=2 && br.z) return genSub(a,b);
    }
    if (op==='mul'){
      const [la,lb] = [[2,1],[3,1],[2,2],[3,2]][L-1];
      const a = nDig(la), b = nDig(lb);
      if (/[01]/.test(String(b)) || /[01]/.test(String(a))) continue;
      const rowCarries = m => { let c = 0, n = 0; digs(a).slice(0,-1).forEach(d => { const v = d*m + c; c = Math.floor(v/10); if (c) n++; }); return n; };
      if (digs(b).every(m => rowCarries(m) >= 1)) return genMul(a,b);
    }
    if (op==='div'){
      if (L===1){ const d = rnd(3,9), q = rnd(12, 99); if (d*q >= 100 || Math.random()<.4) return genDiv(d*q, d); }
      if (L===2){ const d = rnd(3,9), q = rnd(102, 999); return genDiv(d*q, d); }
      if (L===3){ const d = rnd(11,25), q = rnd(12, 99); return genDiv(d*q, d); }
      if (L===4){ const d = rnd(12,48), q = rnd(102, 899), r = Math.random()<.5 ? rnd(1,d-1) : 0; return genDiv(d*q + r, d); }
    }
  }
  return op==='add' ? genAdd(47,38) : op==='sub' ? genSub(503,178) : op==='mul' ? genMul(36,7) : genDiv(7488,24);
}
const PROMPT = {DIVIDE:'Estimate first: how many times does it fit?', MULTIPLY:'Multiply. Work it out in your head first.', SUBTRACT:'Subtract. Work it out in your head first.',
  'BRING DOWN':'Which digit comes down next?', ADD:'Add the column in your head first.', CARRY:'Add the column in your head first.', EXCHANGE:'Can we take the bottom digit away from the top one?'};
const TITLES = {add:'Column addition', sub:'Column subtraction', mul:'Long multiplication', div:'Long division'};
const LEGEND = {
  add:[['sum','Add'],['carry','Carry']],
  sub:[['sum','Subtract'],['carry','Exchange']],
  mul:[['prod','Multiply'],['carry','Carry'],['sum','Add the rows']],
  div:[['quot','Divide'],['prod','Multiply'],['sum','Subtract'],['carry','Bring down']]};
let seq = [], seqI = 0;
function buildSeq(){
  const ops = ['add','sub','mul','div'].filter(o => S.ops[o]);
  const levels = S.level==='climb' ? [1,2,3,4] : [+S.level];

/* ---------- drawing ---------- */
const CW = 100, RH = 120;
const svg = $('board');
let prob = null, L = 1, k = 0, phase = 'pre';
const SZ = {big:84, small:46, tiny:28};
function rowTop(r){ let y=0; for (let i=0;i<r;i++) y += prob.rows[i]*RH; return y; }
function rowH(r){ return prob.rows[r]*RH; }
function cellBox(r,c){ return {x:c*CW, y:rowTop(r), w:CW, h:rowH(r)}; }
function boxes(cells, pad){
  const byRow = {}; cells.forEach(([r,c]) => (byRow[r] = byRow[r] || []).push(c));
  const out = [];
  Object.entries(byRow).forEach(([r,cs]) => { cs = [...new Set(cs)].sort((a,b)=>a-b);
    let s = cs[0], p = cs[0];
    const push = () => { const b = cellBox(+r, s); out.push({x:b.x+pad, y:b.y+pad, w:(p-s+1)*CW-2*pad, h:b.h-2*pad}); };
    cs.slice(1).forEach(c => { if (c===p+1) p = c; else { push(); s = p = c; } }); push(); });

}
function elSvg(e, cls, delay){
  const st = delay ? ` style="animation-delay:${delay}ms"` : '';
  const role = 'r-' + (e.role || 'ink');
  if (e.t==='d'){
    const fs = SZ[e.sz], b = cellBox(e.r, e.c);
    const x = b.x + CW/2 + (e.dx||0)*CW, y = b.y + b.h/2 + fs*.36 + (e.dy||0)*RH;
    return `<text class="el ${role} ${e.lab?'lab':''} ${cls}" x="${x}" y="${y}" font-size="${fs}"${st}>${e.ch}</text>`;
  }
  if (e.t==='line'){
    const y = rowTop(e.r) + 4;
    return `<line class="el ln ${role} ${cls.replace('ink','inkln')}" pathLength="1" x1="${e.c0*CW+10}" x2="${(e.c1+1)*CW-10}" y1="${y}" y2="${y}"${st}/>`;
  }
  if (e.t==='strike'){
    const fs = SZ[e.sz], b = cellBox(e.r, e.c), x = b.x + CW/2, base = b.y + b.h/2 + fs*.36;
    return `<line class="el stk ${role} ${cls.replace('ink','inkln')}" pathLength="1" x1="${x-fs*.36}" y1="${base+fs*.06}" x2="${x+fs*.36}" y2="${base-fs*.8}"${st}/>`;
  }
  if (e.t==='arrow'){
    const x = e.c*CW + CW/2 + 34, y0 = rowTop(e.r0) + rowH(e.r0) - 14, y1 = rowTop(e.r1) + 22;
    const anim = cls.includes('ink');
    return `<g class="el ${role} ${anim?'':cls}"><path class="arw ${anim?'inkln':''}" pathLength="1" d="M${x} ${y0} L${x} ${y1-12}"${st}/>`
      + `<path class="arwh ${anim?'fadein':''}" d="M${x-11} ${y1-16} L${x+11} ${y1-16} L${x} ${y1+2} Z" style="animation-delay:${(delay||0)+500}ms"/></g>`;
  }
  if (e.t==='bracket'){
    const x0 = e.c*CW + CW*.7, yT = rowTop(e.r) + 6, yB = rowTop(e.r) + rowH(e.r) - 4;
    return `<path class="el ln r-ink ${cls}" d="M${x0-16} ${yB} Q${x0+16} ${(yT+yB)/2} ${x0} ${yT} L${(e.c1+1)*CW-10} ${yT}"/>`;
  }

}
function render(anim){

  const text = phase==='pre' && st.ask ? st.ask.replace('?', '<span class="q">?</span>') : st.calc.replace(/= (\S+)$/, '= <span class="a">$1</span>');
  if (calc.innerHTML !== text){ calc.innerHTML = text; calc.classList.toggle('small', text.length > 40); if (anim){ calc.classList.remove('swap'); void calc.offsetWidth; calc.classList.add('swap'); } }
  const say = $('say'); const sayText = phase==='pre' && st.ask ? (PROMPT[st.label] || 'Work it out in your head first.') : st.say;
  if (say.textContent !== sayText){ say.textContent = sayText; if (anim){ say.classList.remove('swap'); void say.offsetWidth; say.classList.add('swap'); } }
  $('stepn').textContent = `Step ${k+1} of ${prob.steps.length}`;
}
function showProblem(){
  $('kind').textContent = TITLES[prob.op];
  $('lvl').textContent = 'Level ' + L;
  $('prob').textContent = prob.inline;
  $('legend').innerHTML = LEGEND[prob.op].map(([r,t]) => `<span style="--rc:var(--${r})"><i></i>${t}</span>`).join('');
}

/* ---------- timeline ---------- */
let paused = false, elapsed = 0, lastT = null, think = 1, hold = 1, switching = false;
function durations(){
  const st = prob.steps[k], f = S.speed;
  think = (st.ask ? (st.ask.includes('?') ? 3000 : 1600) : st.final ? 400 : 1300) * f;
  hold = (st.final ? 7000 : 2600 + st.say.length*26) * f;
}
function startStep(anim=true){ phase = 'pre'; elapsed = 0; durations(); render(anim); }
function reveal(anim=true){ phase = 'post'; elapsed = think; render(anim); }
function nextProblem(){
  if (switching) return; switching = true;
  $('stage').classList.add('leaving');
  setTimeout(() => {
    if (!seq.length || seqI >= seq.length) buildSeq();
    const [op, lv] = seq[seqI++]; L = lv;
    prob = makeProblem(op, lv); k = 0;
    showProblem(); startStep(true);
    $('stage').classList.remove('leaving'); switching = false;
  }, prob ? 750 : 0);
}
function advance(){
  if (k < prob.steps.length-1){ k++; startStep(true); } else nextProblem();
}
function loop(t){
  if (lastT==null) lastT = t;
  const dt = Math.min(100, t - lastT); lastT = t;
  if (!paused && prob && !switching){
    elapsed += dt;
    if (phase==='pre' && elapsed >= think) reveal(true);
    else if (phase==='post' && elapsed >= think + hold) advance();
    $('progbar').style.width = ((k + Math.min(1, elapsed/(think+hold))) / prob.steps.length * 100) + '%';
  }
  requestAnimationFrame(loop);
}
function setPaused(v){ paused = v; ['pause','fPause'].forEach(id => $(id).textContent = v ? 'Play' : 'Pause'); }
const goNext = () => { if (!prob) return; phase==='pre' ? reveal(true) : advance(); };
const goPrev = () => { if (!prob) return; if (phase==='post' && prob.steps[k].ask){ startStep(false); return; } if (k>0){ k--; durations(); reveal(false); } };
$('pause').onclick = $('fPause').onclick = () => setPaused(!paused);
$('next').onclick = $('fNext').onclick = goNext;
$('prev').onclick = $('fPrev').onclick = goPrev;
$('skip').onclick = $('fSkip').onclick = () => nextProblem();

/* ---------- settings ---------- */
document.querySelectorAll('.tg[data-op]').forEach(b => {
  b.setAttribute('aria-pressed', !!S.ops[b.dataset.op]);
  b.onclick = () => { const o = b.dataset.op, on = !S.ops[o];
    if (!on && Object.values(S.ops).filter(Boolean).length===1) return;
    S.ops[o] = on; b.setAttribute('aria-pressed', on); save(); buildSeq(); nextProblem(); };
});
$('level').value = S.level; $('level').onchange = e => { S.level = e.target.value; save(); buildSeq(); nextProblem(); };
$('speed').value = String(S.speed); $('speed').onchange = e => { S.speed = +e.target.value; save(); durations(); };
const SKINS = [['auto','Match my device',['#e9eeec','#10181f']],['paper','Paper',['#f9fbfa','#1c5fd1']],['mist','Mist',['#e8ecf3','#7a33bd']],['slate','Slate',['#16212a','#82b4ff']],['chalk','Chalkboard',['#1a352e','#8ef0b2']]];
SKINS.forEach(([id,name,c]) => { const b = document.createElement('button'); b.className='sw'; b.id='skin-'+id; b.title=name; b.setAttribute('aria-label', name);
  b.innerHTML = `<i style="background:linear-gradient(135deg, ${c[0]} 50%, ${c[1]} 50%)"></i>`; b.onclick = () => { S.skin = id; applySkin(); save(); }; $('skins').appendChild(b); });
function applySkin(){ if (S.skin==='auto') document.documentElement.removeAttribute('data-skin'); else document.documentElement.setAttribute('data-skin', S.skin);
  document.querySelectorAll('.sw').forEach(b => b.setAttribute('aria-pressed', b.id==='skin-'+S.skin)); }
applySkin();

/* ---------- full screen ---------- */
let wakeLock = null;
async function startSaver(){
  document.body.classList.add('saver');
  try { if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen(); } catch(e){}
  try { wakeLock = await navigator.wakeLock?.request('screen'); } catch(e){}
  if (paused) setPaused(false); pokeIdle();
}
function stopSaver(){
  document.body.classList.remove('saver','idle');
  if (document.fullscreenElement) document.exitFullscreen().catch(()=>{});
  try { wakeLock?.release(); } catch(e){} wakeLock = null;
}
$('fs').onclick = startSaver; $('fExit').onclick = stopSaver;
document.addEventListener('fullscreenchange', () => { if (!document.fullscreenElement && document.body.classList.contains('saver')) stopSaver(); });
let idleT; function pokeIdle(){ document.body.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => document.body.classList.add('idle'), 2500); }
addEventListener('mousemove', pokeIdle); addEventListener('touchstart', pokeIdle, {passive:true});
addEventListener('keydown', e => {
  if (e.target.matches('select,input')) return;
  if (e.code==='Space'){ e.preventDefault(); setPaused(!paused); }
  else if (e.key==='ArrowRight') goNext();
  else if (e.key==='ArrowLeft') goPrev();
  else if (e.key==='n' || e.key==='N') nextProblem();
  else if (e.key==='f' || e.key==='F') document.body.classList.contains('saver') ? stopSaver() : startSaver();
  else if (e.key==='Escape' && document.body.classList.contains('saver')) stopSaver();
});

buildSeq();
nextProblem();
requestAnimationFrame(loop);
})();
</script>
