<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Plant Explorers</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Layout: sticky leaf-green top bar, one centred column of "seed packet" cards; each section opens as its own workspace with big tap targets */
:root{
 --bg:#eef5ea; --surface:#ffffff; --surface2:#e2eedc; --ink:#1c3022; --muted:#55695a; --line:#cddcc7;
 --leaf:#2d8a4e; --leaf2:#1f6b3b; --bar:#1f6b3b; --on-leaf:#ffffff; --sun:#f2b134; --sun-soft:#fdf0cf; --sky:#d4ecf8; --sky2:#eaf6fc;
 --berry:#c43f6c; --berry-soft:#f9e1ea; --water:#3d9bd6; --soil:#8a5a3b; --good:#2d8a4e; --good-soft:#dff2e3; --warn:#b86e0c; --warn-soft:#fdecd2;
 --sea:#cfe7f3; --land:#bfdcaa; --land-edge:#8fbf7a; --shadow:0 2px 0 rgba(28,48,34,.08), 0 8px 24px rgba(28,48,34,.08);
 --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif; --f-body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
 --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#0f1a13; --surface:#17261c; --surface2:#1f3326; --ink:#e5f0e6; --muted:#9db3a3; --line:#2d4434;
 --leaf:#5cc27f; --leaf2:#7fd69c; --bar:#173a24; --on-leaf:#0d1b12; --sun:#f5c25a; --sun-soft:#3a3018; --sky:#1b3243; --sky2:#162a37;
 --berry:#ee7aa1; --berry-soft:#3d1f2b; --water:#6cb9ea; --soil:#b98563; --good:#5cc27f; --good-soft:#1c3a26; --warn:#f0a94a; --warn-soft:#3b2c14;
 --sea:#183243; --land:#2c4a2f; --land-edge:#4b7a4e; --shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#0f1a13; --surface:#17261c; --surface2:#1f3326; --ink:#e5f0e6; --muted:#9db3a3; --line:#2d4434;
 --leaf:#5cc27f; --leaf2:#7fd69c; --bar:#173a24; --on-leaf:#0d1b12; --sun:#f5c25a; --sun-soft:#3a3018; --sky:#1b3243; --sky2:#162a37;
 --berry:#ee7aa1; --berry-soft:#3d1f2b; --water:#6cb9ea; --soil:#b98563; --good:#5cc27f; --good-soft:#1c3a26; --warn:#f0a94a; --warn-soft:#3b2c14;
 --sea:#183243; --land:#2c4a2f; --land-edge:#4b7a4e; --shadow:0 2px 0 rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.3); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.1;margin:0;text-wrap:balance;font-weight:800}
h1{font-size:clamp(30px,5vw,46px)} h2{font-size:clamp(24px,3.4vw,32px)} h3{font-size:22px} h4{font-size:18px}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
input,textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:10px 12px;width:100%}
textarea{min-height:84px;resize:vertical}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:#fff}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;color:#fff;padding:4px 6px;border-radius:12px;font-family:var(--f-display);font-weight:800;font-size:24px;letter-spacing:.2px}
.brand svg{width:34px;height:34px}
.topnav{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.tbtn{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:6px 14px;font-weight:700;min-height:44px}
.tbtn:hover{background:rgba(255,255,255,.24)}
.tbtn[aria-pressed="true"]{background:#fff;color:#1f6b3b}
@media (max-width:620px){.tbtn .tl{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.brand{font-size:20px}.topnav{margin-left:auto}.tbtn{padding:6px 10px}}
.tbtn .n{font-variant-numeric:tabular-nums;background:var(--sun);color:#3a2a00;border-radius:999px;padding:0 8px;font-size:14px}

main{padding-block:22px 60px}
.crumb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.crumb h1,.crumb h2{flex:1;min-width:0}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:8px 18px;border-radius:999px;border:2px solid var(--line);background:var(--surface);font-weight:700;font-size:17px;transition:transform .12s, background .12s}
.btn:hover{background:var(--surface2)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--leaf);border-color:var(--leaf);color:var(--on-leaf)}
.btn.primary:hover{background:var(--leaf2);border-color:var(--leaf2)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:#3a2a00}
.btn.small{min-height:38px;padding:4px 12px;font-size:15px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.back{min-height:44px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:grid;gap:14px}
.muted{color:var(--muted)}
.small{font-size:15px}
.label{font-size:13px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}

/* chips & tabs */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-weight:700;min-height:42px;font-size:15px}
.chip[aria-pressed="true"]{background:var(--leaf);color:var(--on-leaf);border-color:var(--leaf)}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;padding:6px;background:var(--surface2);border-radius:22px}
.tab{border:0;background:none;border-radius:16px;padding:10px 16px;font-weight:700;min-height:48px;display:flex;align-items:center;gap:8px;font-size:16px}
.tab[aria-selected="true"]{background:var(--surface);box-shadow:var(--shadow);color:var(--leaf2)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 10px;font-weight:700;font-size:14px;min-height:42px}
.seg button[aria-pressed="true"]{border-color:var(--leaf);background:var(--good-soft);color:var(--leaf2)}
.seg button:disabled{opacity:.5}

/* cards */
.card{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);padding:18px}
.flat{background:var(--surface2);border-radius:var(--r);padding:16px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.split{display:grid;gap:18px;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:start}
@media (max-width:820px){.split{grid-template-columns:minmax(0,1fr)}}
.ic{display:inline-flex;align-items:center;justify-content:center;line-height:1}
.ic svg{width:1em;height:1em}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px;align-items:center;margin-bottom:22px}
.hero p.lead{font-size:20px;color:var(--muted);margin-top:10px;max-width:34em}
.hero-art{display:flex;align-items:flex-end;justify-content:center;background:linear-gradient(var(--sky),var(--sky2));border-radius:28px;overflow:hidden;height:220px}
.hero-art .plant-svg{height:100%;width:auto;flex:1;max-width:33%}
@media (max-width:720px){.hero{grid-template-columns:1fr}.hero-art{height:170px}}
.central{display:inline-block;background:var(--sun-soft);border-radius:999px;padding:6px 14px;font-weight:700;color:var(--ink);margin-bottom:10px;font-size:15px}
.tiles{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));margin-bottom:28px}
.tile{position:relative;display:flex;flex-direction:column;text-align:left;border:0;padding:0;border-radius:24px;background:var(--surface);box-shadow:var(--shadow);overflow:hidden;transition:transform .15s}
.tile:hover{transform:translateY(-3px) rotate(-.4deg)}
.tile .art{height:150px;display:flex;align-items:flex-end;justify-content:center;position:relative;overflow:hidden}
.tile .art svg{height:100%}
.tile .txt{padding:14px 18px 18px;border-top:3px dashed var(--line)}
.tile h3{font-size:24px}
.tile p{color:var(--muted);font-size:15px;margin-top:4px}
.tile .tag{position:absolute;top:12px;left:12px;background:var(--surface);border-radius:999px;padding:2px 10px;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.qchips{display:flex;flex-wrap:wrap;gap:10px}
.qchip{border:2px dashed var(--leaf);background:var(--surface);border-radius:16px;padding:10px 14px;font-weight:700;text-align:left;min-height:48px;max-width:100%}
.qchip:hover{background:var(--good-soft)}

/* plant cards */
.pgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.pcard{border:0;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:0;overflow:hidden;text-align:left;display:flex;flex-direction:column;transition:transform .12s;position:relative}
.pcard:hover{transform:translateY(-2px)}
.pcard .pic{background:linear-gradient(var(--sky),var(--sky2));height:130px;display:flex;justify-content:center}
.pcard .pic svg{height:100%}
.pcard .nm{padding:8px 12px 12px;font-family:var(--f-display);font-weight:700;font-size:19px;line-height:1.1}
.pcard .seen{position:absolute;top:8px;right:8px;background:var(--sun);color:#3a2a00;border-radius:999px;font-size:12px;font-weight:700;padding:1px 8px}
.pcard.sel{outline:4px solid var(--berry)}
.stage{background:linear-gradient(var(--sky),var(--sky2));border-radius:22px;overflow:hidden;position:relative}
.stage .plant-svg{display:block;width:100%;height:auto;max-height:440px}
.plant-svg .part{cursor:pointer;transition:opacity .25s}
.stage.dim .part{opacity:.22}
.stage.dim .part.on{opacity:1}
.partbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.partinfo{margin-top:12px;background:var(--sun-soft);border-radius:16px;padding:12px 14px;min-height:64px}
.needs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.need{background:var(--surface2);border-radius:14px;padding:10px;text-align:center}
.need b{display:block;font-family:var(--f-display);font-size:18px}
.dots{letter-spacing:2px;font-size:18px}
.prodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;padding:14px}
.prod{background:var(--surface);border-radius:16px;padding:12px;text-align:center;font-weight:700;font-size:15px}
.prod .ic{font-size:40px;display:flex;margin-bottom:6px;height:44px}
.factfile{margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:10px}
.ff{background:var(--surface2);border-radius:14px;padding:10px 12px;min-width:0}
.ff dt{font-size:13px;letter-spacing:.06em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.ff dd{margin:4px 0 0;font-size:16px}
.flip{border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px;text-align:left;min-height:80px;width:100%}
.flip.open{background:var(--good-soft);border-color:var(--leaf)}
.cmp{width:100%;border-collapse:collapse}
.cmp th,.cmp td{padding:10px;border-bottom:2px solid var(--line);text-align:left;vertical-align:top}
.cmp th{width:26%;color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.06em}
.tablewrap{overflow-x:auto}

/* quiz */
.mc .q{font-family:var(--f-display);font-size:24px;font-weight:700;line-height:1.2;margin-bottom:14px}
.opts{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.opt{border:3px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;min-height:60px;font-weight:700;font-size:18px;text-align:left;display:flex;align-items:center;gap:10px;transition:transform .1s}
.opt:hover:not(:disabled){border-color:var(--leaf)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}
.opt.no{border-color:var(--warn);background:var(--warn-soft);animation:shake .35s}
.opt:disabled{cursor:default}
.opt .thumb{width:64px;height:76px;flex:none;background:linear-gradient(var(--sky),var(--sky2));border-radius:10px;overflow:hidden}
.opt .thumb svg{width:100%;height:100%}
.opt .ic{font-size:30px}
.fb{margin-top:14px;min-height:28px}
.good{background:var(--good-soft);border-radius:14px;padding:12px 14px}
.try{background:var(--warn-soft);border-radius:14px;padding:12px 14px}
.qprog{display:flex;gap:6px;margin-bottom:14px}
.qprog i{width:30px;height:10px;border-radius:99px;background:var(--line)}
.qprog i.d{background:var(--leaf)}
.qprog i.c{background:var(--sun)}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .4s ease-out}

.say{border:0;background:var(--surface2);border-radius:999px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;flex:none;color:var(--leaf2)}
.say svg{width:18px;height:18px}

/* lab */
.pots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:560px){.pots{grid-template-columns:1fr}}
.pot{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:14px}
.pot h3{display:flex;align-items:center;gap:8px}
.pot .badge{font-size:14px;border-radius:999px;padding:2px 10px;font-weight:700;color:#fff}

.potsvg{max-width:260px;margin:0 auto;background:linear-gradient(var(--sky),var(--sky2));border-radius:16px;display:block;width:100%;height:auto;max-height:300px}
.ctrl{display:grid;gap:4px;margin-top:10px}
.ctrl .label{font-size:12px}
.status{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-weight:700;font-variant-numeric:tabular-nums;flex-wrap:wrap}
.fair{border-radius:14px;padding:10px 14px;font-weight:700}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.dish-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.dish{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:12px;text-align:center}
.dish svg{width:100%;max-width:190px;height:auto}
.garden-stage{position:relative;background:linear-gradient(var(--sky),var(--sky2));border-radius:22px;overflow:hidden;aspect-ratio:2/1;max-width:100%}
.garden-stage svg{position:absolute;inset:0;width:100%;height:100%}
.bee{position:absolute;font-size:38px;transition:left .7s ease-in-out, top .7s ease-in-out;pointer-events:none;transform:translate(-50%,-50%);filter:drop-shadow(0 2px 2px rgba(0,0,0,.2))}
.bee .pol{position:absolute;right:-4px;bottom:2px;width:14px;height:14px;border-radius:50%;background:#f6d02a;border:2px solid #c99c00}
.flowerbtn{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;width:16%;aspect-ratio:1}
.flowerbtn svg{width:100%;height:100%}

/* factory */
.belt{display:flex;gap:8px;overflow-x:auto;padding:14px;background:repeating-linear-gradient(90deg,var(--surface2) 0 18px,var(--bg) 18px 22px);border-radius:18px;min-height:150px;align-items:stretch}
.slot{flex:0 0 132px;border:3px dashed var(--line);border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;font-weight:700;font-size:14px;background:var(--surface);color:var(--muted)}
.slot.full{border-style:solid;border-color:var(--leaf);color:var(--ink)}
.slot .ic{font-size:40px;height:46px}
.slot.prodslot{border-color:var(--sun);background:var(--sun-soft)}
.stepcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:10px}
.stepcard{border:3px solid var(--line);background:var(--surface);border-radius:16px;padding:12px;font-weight:700;display:flex;align-items:center;gap:10px;text-align:left;min-height:64px}
.stepcard .ic{font-size:30px}
.stepcard.no{border-color:var(--warn);animation:shake .35s}
.chaincard{border:0;background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:14px;text-align:left;display:flex;align-items:center;gap:12px}
.chaincard .flow{font-size:26px;letter-spacing:2px;white-space:nowrap;overflow:hidden}
.chaincard.done{outline:3px solid var(--sun)}
.bigprod{font-size:110px;text-align:center;display:block;line-height:1.1}
.bigprod svg{width:120px;height:120px}

/* map */
.map{width:100%;height:auto;display:block;background:var(--sea);border-radius:22px}
.map .land{fill:var(--land);stroke:var(--land-edge);stroke-width:.6;stroke-linejoin:round}
.pin{cursor:pointer}
.worldsplit{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
@media (max-width:820px){.worldsplit{grid-template-columns:minmax(0,1fr)}}
.pin circle.dot{fill:var(--berry);stroke:var(--surface);stroke-width:1.2}
.pin.seen circle.dot{fill:var(--leaf)}
.pin circle.ring{fill:none;stroke:var(--berry);stroke-width:1;animation:ring 2s infinite;transform-box:fill-box;transform-origin:center}
.pin text{font-size:5.4px;font-weight:700;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:2px;font-family:var(--f-body)}
.pin:focus-visible circle.dot{stroke:var(--sun);stroke-width:2}
@keyframes ring{0%{transform:scale(1);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.mini-stage{width:140px;flex:none;background:linear-gradient(var(--sky),var(--sky2));border-radius:16px;overflow:hidden}
.mini-stage svg{width:100%;height:auto;display:block}

/* food */
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px}
.bin{border:3px dashed var(--line);background:var(--surface);border-radius:18px;min-height:110px;padding:10px;display:flex;flex-direction:column;gap:6px;align-items:center;text-align:center}
.bin.ready{border-color:var(--leaf);background:var(--good-soft)}
.bin h4{font-size:20px}
.bin .got{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:24px}
.tray{display:flex;flex-wrap:wrap;gap:10px}
.food{border:3px solid var(--line);background:var(--surface);border-radius:16px;padding:8px 12px;display:flex;align-items:center;gap:8px;font-weight:700;min-height:56px}
.food .ic{font-size:30px}
.food[aria-pressed="true"]{border-color:var(--berry);background:var(--berry-soft);transform:translateY(-3px)}
.plate{width:min(100%,340px);aspect-ratio:1;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 14px var(--surface2),var(--shadow);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;padding:30px;gap:4px;margin:0 auto}
.plate>div{display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:2px;font-size:28px;border-radius:12px;position:relative}
.plate>div span.lbl{position:absolute;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.check{display:flex;gap:8px;align-items:flex-start}
.check .mark{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--line);color:var(--muted)}
.check.yes .mark{background:var(--leaf);color:var(--on-leaf)}

/* build & planet */
.buildsvg{width:100%;height:auto;display:block;background:linear-gradient(var(--sky),var(--sky2));border-radius:20px}
.matbtn{border:3px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 10px;display:flex;align-items:center;gap:6px;font-weight:700;font-size:15px;min-height:48px}
.matbtn[aria-pressed="true"]{border-color:var(--leaf);background:var(--good-soft)}
.swatch{width:18px;height:18px;border-radius:5px;border:1px solid rgba(0,0,0,.2);flex:none}
.result{display:flex;gap:10px;align-items:flex-start;border-radius:14px;padding:10px 12px}
.result.pass{background:var(--good-soft)} .result.ok{background:var(--sun-soft)} .result.fail{background:var(--warn-soft)}
.sway{animation:sway .5s ease-in-out 4;transform-origin:50% 100%;transform-box:fill-box}
.tilt{animation:tilt 1.6s forwards;transform-origin:20% 100%;transform-box:fill-box}
.sag{animation:sag 1s forwards;transform-origin:50% 0;transform-box:fill-box}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(2deg)}}
@keyframes tilt{to{transform:rotate(8deg)}}
@keyframes sag{to{transform:scaleY(1.4) translateY(4px)}}
.drop{animation:fall .9s linear infinite}
@keyframes fall{from{transform:translateY(-30px)}to{transform:translateY(60px)}}
.meters{display:grid;gap:10px}
.meter .bar{height:14px;border-radius:99px;background:var(--surface2);overflow:hidden}
.meter .bar i{display:block;height:100%;border-radius:99px;transition:width .5s}
.meter .top{display:flex;justify-content:space-between;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;position:static;background:none;color:inherit}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.gcell{border:3px solid var(--line);border-radius:14px;background:var(--surface);aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:32px;position:relative;padding:0}
.gcell .vis{position:absolute;top:2px;right:4px;font-size:16px}
.ggrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;max-width:420px}
.ps-leaf{width:100%;height:auto;display:block;background:linear-gradient(var(--sky),var(--sky2));border-radius:20px}
.toggle{display:flex;align-items:center;gap:10px;border:3px solid var(--line);background:var(--surface);border-radius:16px;padding:10px 14px;font-weight:700;min-height:56px;text-align:left}
.toggle[aria-pressed="true"]{border-color:var(--leaf);background:var(--good-soft)}
.toggle .ic{font-size:26px}

/* games */
.gamecard{border:0;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:16px;text-align:left;display:flex;gap:14px;align-items:center;min-height:96px;transition:transform .12s}
.gamecard:hover{transform:translateY(-2px)}
.gamecard .gi{font-size:40px;width:64px;height:64px;border-radius:18px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex:none}
.gamecard .st{margin-left:auto;font-size:22px}
.labelspot{cursor:pointer}
.pairgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pairbtn{border:3px solid var(--line);background:var(--surface);border-radius:16px;padding:10px;display:flex;align-items:center;gap:10px;font-weight:700;min-height:60px;width:100%;text-align:left}
.pairbtn .ic{font-size:30px}
.pairbtn[aria-pressed="true"]{border-color:var(--berry);background:var(--berry-soft)}
.pairbtn.matched{border-color:var(--good);background:var(--good-soft);opacity:.75}
.ctile{border:3px solid var(--line);background:var(--surface);border-radius:16px;padding:10px;display:flex;align-items:center;gap:8px;font-weight:700;min-height:58px;text-align:left}
.ctile[aria-pressed="true"]{border-color:var(--berry);background:var(--berry-soft)}
.ctile.right{border-color:var(--good);background:var(--good-soft)}
.ctile.missed{border-style:dashed;border-color:var(--good)}
.ctile.wrong{border-color:var(--warn);background:var(--warn-soft)}
.ctile .ic{font-size:26px}

/* journal */
.entry{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:2px dashed var(--line)}
.entry .k{font-size:24px;width:44px;height:44px;border-radius:14px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex:none}
.entry time{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:34px;line-height:1;font-variant-numeric:tabular-nums;color:var(--leaf2)}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
.sticker{background:var(--surface);border-radius:18px;padding:10px;text-align:center;font-weight:700;font-size:13px;box-shadow:var(--shadow)}
.sticker .s{font-size:40px;display:block}
.sticker.locked{opacity:.35;box-shadow:none;border:2px dashed var(--line)}
.pad{touch-action:none;background:#ffffff;border-radius:16px;border:2px solid var(--line);width:100%;height:auto;max-width:600px;display:block;cursor:crosshair}
.drawings{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.drawings img{width:100%;border-radius:12px;border:2px solid var(--line);background:#fff}
.iconpick{display:flex;gap:8px;flex-wrap:wrap}
.confirm{background:var(--warn-soft);border-radius:14px;padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.vocab dt{font-weight:700;font-family:var(--f-display);font-size:19px}
.vocab dd{margin:0 0 10px;color:var(--muted)}
.vocab{margin:0}

[hidden]{display:none!important}
.overlay{position:fixed;inset:0;z-index:60;background:rgba(15,26,19,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--surface);color:var(--ink);border-radius:24px;padding:24px;max-width:440px;width:100%;text-align:center;display:grid;gap:12px;box-shadow:var(--shadow);animation:pop .3s ease-out}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,40px);background:var(--ink);color:var(--bg);padding:12px 20px;border-radius:999px;font-weight:700;opacity:0;transition:.25s;z-index:50;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
.note{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
.simtag{display:inline-block;background:var(--sun-soft);color:var(--ink);font-size:13px;font-weight:700;border-radius:999px;padding:2px 10px}

@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media print{.top,.noprint,.tabs{display:none!important}body{background:#fff;color:#000}.card,.stat{box-shadow:none;border:1px solid #ccc}}

</style>

  <div class="row" id="pcols">${['#1c3022', '#2d8a4e', '#8a5a3b', '#f2b134', '#c43f6c', '#3d9bd6', '#ffffff'].map((c, i) => `<button class="chip" data-col="${c}" aria-pressed="${i === 0}" aria-label="Colour ${c}"><span class="swatch" style="background:${c};display:inline-block"></span></button>`).join('')}<button class="chip" data-size="4" aria-pressed="true">Thin</button><button class="chip" data-size="12" aria-pressed="false">Thick</button></div>
  <div class="row"><button class="btn primary" id="dsave">Save drawing</button><button class="btn" id="dclear">Clear</button></div></div>
  <div class="card stack"><h3>My drawings</h3>${S.draws.length ? `<div class="drawings">${S.draws.map((d, i) => `<figure style="margin:0"><img src="${d.img}" alt="My drawing ${i + 1}"><figcaption class="small muted">${new Date(d.at).toLocaleDateString()}</figcaption></figure>`).join('')}</div>` : '<p class="muted">No drawings yet.</p>'}</div></div>`;
  const cv = $('#pad'), cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, 600, 420); cx.lineCap = 'round'; cx.lineJoin = 'round'; let col = '#1c3022', size = 4, drawing = false, any = false;
  const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * 600, (e.clientY - r.top) / r.height * 420]; };
  cv.onpointerdown = e => { drawing = true; any = true; cv.setPointerCapture(e.pointerId); const [x, y] = pt(e); cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x + .1, y + .1); cx.strokeStyle = col; cx.lineWidth = size; cx.stroke(); };
  cv.onpointermove = e => { if (!drawing) return; const [x, y] = pt(e); cx.lineTo(x, y); cx.stroke(); };
  cv.onpointerup = cv.onpointercancel = () => drawing = false;
  $('#pcols').onclick = e => { const b = e.target.closest('button'); if (!b) return; if (b.dataset.col) { col = b.dataset.col; $$('[data-col]').forEach(x => x.setAttribute('aria-pressed', x === b)); } if (b.dataset.size) { size = +b.dataset.size; $$('[data-size]').forEach(x => x.setAttribute('aria-pressed', x === b)); } };
  $('#dclear').onclick = () => { cx.fillStyle = '#fff'; cx.fillRect(0, 0, 600, 420); any = false; };
  $('#dsave').onclick = () => { if (!any) { toast('Draw something first.'); return; } const sm = document.createElement('canvas'); sm.width = 300; sm.height = 210; sm.getContext('2d').drawImage(cv, 0, 0, 300, 210); S.draws.unshift({ img: sm.toDataURL('image/jpeg', .7), at: Date.now() }); S.draws = S.draws.slice(0, 8); log('art', 'Observation drawing', ''); renderJournal('draw'); toast('Drawing saved!'); };
 } else if (sub === 'stickers') {
  const all = ALL_STICKERS();
  el.innerHTML = `<div class="card stack"><p class="muted">${Object.keys(S.stickers).length} of ${all.length} stickers collected. Stickers reward exploring, trying and finishing, not speed.</p><div class="stickers">${all.map(([id, l, s]) => `<div class="sticker ${S.stickers[id] ? '' : 'locked'}"><span class="s emo">${S.stickers[id] ? s : '❔'}</span>${esc(l)}</div>`).join('')}</div></div>`;
 } else {
  const txt = journalText();
  el.innerHTML = `<div class="card stack"><div class="row noprint"><button class="btn primary" id="jcopy">📋 Copy journal text</button><span class="note">Paste it into a document to print or share. (Printing is not available inside this viewer.)</span></div>
  <article class="stack" style="gap:10px"><h2>${esc(S.name || 'My')} Plant Discovery Journal</h2><p class="muted">Central idea: Plants sustain life on Earth and play an important role in our lives.</p>
  <h3>Plants I discovered</h3><p>${Object.keys(S.seen).map(id => esc(PL[id] ? PL[id].name : id)).join(', ') || '–'}</p>
  <h3>Experiments</h3><ul>${S.journal.filter(e => e.k === 'lab').map(e => `<li><b>${esc(e.t)}:</b> ${esc(e.d)}</li>`).join('') || '<li>–</li>'}</ul>
  <h3>Products I made</h3><p>${Object.keys(S.made).map(id => { const c = CHAINS.find(x => x.id === id); return c ? `${pname(PL[c.plant])} → ${c.product}` : ''; }).join(', ') || '–'}</p>
  <h3>Traditions I learned about</h3><p>${Object.keys(S.cult).map(id => esc(CULTURE[id] ? CULTURE[id].title : id)).join(', ') || '–'}</p>
  <h3>My thinking</h3><ul>${S.refl.map(r => `<li>${r.ic} <b>${esc(r.q)}</b> ${esc(r.a)}</li>`).join('') || '<li>–</li>'}</ul>
  <h3>Stickers</h3><p>${Object.values(S.stickers).map(s => `${s.s} ${esc(s.label)}`).join(' · ') || '–'}</p></article>
  <textarea id="jtxt" readonly style="min-height:120px" aria-label="Journal as text">${esc(txt)}</textarea></div>`;
  $('#jcopy').onclick = () => { const t = $('#jtxt'); const fallback = () => { t.focus(); t.select(); toast('Text selected. Press Ctrl+C or Cmd+C to copy.'); }; try { navigator.clipboard.writeText(txt).then(() => toast('Copied!'), fallback); } catch (e) { fallback(); } };
 }
}
function journalText() {
 return [`MY PLANT DISCOVERY JOURNAL`, `Plants I discovered: ${Object.keys(S.seen).map(id => PL[id] ? PL[id].name : id).join(', ') || '-'}`, `Experiments:`, ...S.journal.filter(e => e.k === 'lab').map(e => `- ${e.t}: ${e.d}`), `Products made: ${Object.keys(S.made).map(id => { const c = CHAINS.find(x => x.id === id); return c ? `${pname(PL[c.plant])} -> ${c.product}` : ''; }).join(', ') || '-'}`, `Traditions: ${Object.keys(S.cult).map(id => CULTURE[id] ? CULTURE[id].title : id).join(', ') || '-'}`, `My thinking:`, ...S.refl.map(r => `- ${r.q} ${r.a}`), `Stickers: ${Object.values(S.stickers).map(s => s.label).join(', ') || '-'}`].join('\n');
}

/* ================= TEACHER ================= */
function renderTeacher() {
 const acts = [['Plant Explorer', 'explorer'], ['Compare plants', 'explorer.compare'], ['Grow a plant', 'lab.grow'], ['Seed sprouting', 'lab.sprout'], ['Pollination', 'lab.pollinate'], ['Rain & soil', 'lab.erosion'], ['Thirsty celery', 'lab.celery'], ['Factory', 'factory'], ['Mystery Product', 'factory.mystery'], ['World map', 'people.world'], ['Plants we eat', 'people.food'], ['Balanced plate', 'people.plate'], ['Plants & health', 'people.medicine'], ['Design a celebration', 'people.create'], ['Living forest', 'planet.forest'], ['Pollinator garden', 'planet.garden'], ['Photosynthesis', 'planet.photo'], ['Build with plants', 'planet.build'], ...GAMES.map(g => [g.n, 'games.' + g.id]), ['Journal', 'journal']];
 app.innerHTML = `<div class="wrap">${crumb('Teacher Mode')}
 <div class="grid g2">
 <div class="card stack"><h3>Settings</h3><div class="ctrl"><span class="label">Difficulty</span><div class="seg" id="tdiff">${[['beginner', 'Beginner (3 choices, more clues)'], ['standard', 'Standard'], ['challenge', 'Challenge (more choices, tricky items)']].map(([v, l]) => `<button aria-pressed="${S.diff === v}" data-v="${v}">${l}</button>`).join('')}</div></div>
  <div class="ctrl"><span class="label">Read-aloud buttons</span><div class="seg" id="tread"><button aria-pressed="${S.read}" data-v="1">On</button><button aria-pressed="${!S.read}" data-v="0">Off</button></div></div>
  <div class="ctrl"><label class="label" for="tname">Student or class name (shown on the printable journal)</label><input id="tname" value="${esc(S.name || '')}" maxlength="40" placeholder="e.g. Class 2B"></div>
  <div class="ctrl"><span class="label">Progress on this device</span><div id="treset"><button class="btn" id="tr1">Reset all progress…</button></div></div>
  <p class="note">Progress is saved in this browser only. Nothing is sent anywhere, and no login is needed.</p></div>
 <div class="card stack"><h3>Open an activity directly</h3><p class="muted small">Each activity also has its own link: add <code>#lab.grow</code> (for example) to the end of this page’s address.</p><div class="chips">${acts.map(([l, h]) => `<button class="chip" data-go="${h}">${esc(l)}</button>`).join('')}</div></div>
 <div class="card stack"><h3>Learning objectives</h3>${OBJECTIVES.map(([t, d]) => `<div><b>${t}.</b> ${d}</div>`).join('')}</div>
 <div class="card stack"><h3>Inquiry questions for discussion</h3><ul class="stack" style="gap:6px;padding-left:20px;margin:0">${[...BIG_QUESTIONS.map(b => b[0]), 'Why do different plants need different amounts of water?', 'Is something made from a plant always good for the planet?', 'Why do people in different places celebrate with different plants?', 'How could our school grounds help more animals?'].map(q => `<li>${esc(q)}</li>`).join('')}</ul></div>
 <div class="card stack"><h3>Classroom experiments</h3>${CLASS_EXPERIMENTS.map(([t, d]) => `<div><b>${t}.</b> ${d}</div>`).join('')}</div>
 <div class="card stack"><h3>Vocabulary</h3><dl class="vocab">${VOCAB.map(([w, d]) => `<dt>${w}</dt><dd>${d}</dd>`).join('')}</dl></div>
 <div class="card stack"><h3>Accuracy notes</h3><ul class="stack small" style="gap:4px;padding-left:20px;margin:0"><li>Simulations use simple, plausible models and are labelled as such. They are not real-world predictions.</li><li>Photosynthesis needs light, water and carbon dioxide; seeds sprout without light using stored food.</li><li>Potatoes, ginger, turmeric and lotus root (renkon) are stems, not roots. Onion bulbs are leaves.</li><li>Mushrooms are fungi and nori is algae; neither is a plant.</li><li>The medicine area separates traditional uses from scientific evidence and never asks children to prepare or consume plants.</li><li>Cultural pages note that traditions vary within every country.</li></ul></div>
 <div class="card stack"><h3>Printable journal page</h3><p>Open the journal’s printable page to copy a summary of a student’s discoveries.</p><div><button class="btn" data-go="journal.print">Open printable page</button></div></div>
 </div></div>`;
 $('#tdiff').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.diff = b.dataset.v; SORT = null; save(); renderTeacher(); toast('Difficulty: ' + S.diff); };
 $('#tread').onclick = e => { const b = e.target.closest('button'); if (!b) return; S.read = b.dataset.v === '1'; save(); updateTop(); renderTeacher(); };
 $('#tname').oninput = e => { S.name = e.target.value; save(); };
 $('#tr1').onclick = () => { $('#treset').innerHTML = `<div class="confirm"><b>Delete all journal entries, stickers and progress on this device?</b><button class="btn" id="tyes" style="border-color:var(--warn)">Yes, reset</button><button class="btn" id="tno">Cancel</button></div>`; $('#tno').onclick = renderTeacher; $('#tyes').onclick = () => { resetAll(); renderTeacher(); }; };
}

/* ================= ROUTER ================= */
const ROUTES = { home: renderHome, explorer: renderExplorer, lab: renderLab, factory: renderFactory, people: renderPeople, planet: renderPlanet, games: renderGames, journal: renderJournal, teacher: renderTeacher };
function route() {
 const h = (location.hash || '').slice(1) || 'home'; const [r, sub] = h.split('.');
 try { speechSynthesis.cancel(); } catch (e) {}
 (ROUTES[r] || renderHome)(sub);
 $$('.tbtn[data-go]').forEach(b => b.setAttribute('aria-current', b.dataset.go === r ? 'page' : 'false'));
 window.scrollTo(0, 0); updateTop();
}
window.addEventListener('hashchange', route);
/* ================= RESET ================= */
function resetAll() {
 const keep = { diff: S.diff, read: S.read, name: S.name };
 S = Object.assign(def(), keep); save();
 clearInterval(LAB.timer); clearInterval(PHO.timer);
 Object.assign(LAB, { A: newPot(), B: newPot({ sun: 0 }), pred: null, timer: null, test: 'Sunlight test', logged: false });
 Object.assign(SPROUT, { day: 0, pred: {} });
 Object.assign(POL, { carry: null, done: {}, visited: {}, waited: false, bee: [50, 18] });
 Object.assign(ERO, { pours: 0, pred: null, raining: false });
 Object.assign(CEL, { col: '#3d6fd6', hrs: 0, pred: null, cut: false });
 Object.assign(F, { type: 'all', use: 'all', env: 'all', q: '' });
 CMP = []; REG = null; SORT = null; PLATE = []; MEDSEL = 'willow';
 CEL2 = { plant: 'sakura', type: 'Festival', bg: '#fbe3ec', stamps: [], name: '' };
 FOR = { plots: startPlots(), tool: 'sapling', year: 0, mud: .4, raining: false, done: false };
 GARD = { cells: Array(12).fill('lawn'), pick: 'clover', season: 'spring' };
 PHO = { sun: true, water: true, co2: true, sugar: 0, timer: null };
 BLD = { proj: 'bridge', pick: {}, tested: false };
 updateTop(); toast('Everything is reset. Ready for a new explorer!');
}
function openReset() {
 const d = $('#resetdlg'); d.hidden = false;
 d.innerHTML = `<div class="dlg" role="dialog" aria-modal="true" aria-labelledby="rtitle"><span class="emo" style="font-size:48px">🌱</span><h2 id="rtitle">Start fresh?</h2><p>This clears the journal, stickers, plants found and every activity on this device, so the next explorer can start from the beginning. Teacher settings stay the same.</p><div class="row" style="justify-content:center"><button class="btn" id="rno">Cancel</button><button class="btn primary" id="ryes" style="background:var(--berry);border-color:var(--berry)">Yes, reset everything</button></div></div>`;
 const close = () => { d.hidden = true; d.innerHTML = ''; $('#resetbtn').focus(); };
 $('#rno').onclick = close; d.onclick = e => { if (e.target === d) close(); };
 d.onkeydown = e => { if (e.key === 'Escape') close(); };
 $('#ryes').onclick = () => { resetAll(); close(); if ((location.hash || '#home') === '#home') route(); else location.hash = 'home'; };
 $('#rno').focus();
}
$('#resetbtn').onclick = openReset;
$('#readbtn').onclick = () => { S.read = !S.read; save(); updateTop(); route(); toast(S.read ? 'Read-aloud buttons on' : 'Read-aloud buttons off'); };
route();

</script>

</body>
