<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}</style>
<title>World Explorer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Lexend:wght@400;500;600&display=swap">
<style>
/* Layout: one-screen app. Thin top bar with 4 tabs; each screen fills the rest. Photo Hunt is a full-bleed panorama with floating controls. */
:root{
  --bg:#F3F7F6; --surface:#FFFFFF; --surface-2:#E8F0EF; --ink:#1C2A31; --muted:#5A6C74; --line:#D6E2E1;
  --sky:#2F7FB5; --sky-soft:#DCEBF5; --leaf:#2F8F63; --leaf-soft:#DDF1E6;
  --ocean:#E2EEF4; --land:#CDE3D3;
  --shadow:0 6px 24px rgba(20,45,60,.14);
  --display:"Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --body:"Lexend", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F171B; --surface:#17232A; --surface-2:#1F2E36; --ink:#E6EFF1; --muted:#9AAEB6; --line:#2A3B44;
  --sky:#6CB0E0; --sky-soft:#1D3546; --leaf:#5CC08E; --leaf-soft:#1C3A2C;
  --ocean:#14242C; --land:#2A4436; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F171B; --surface:#17232A; --surface-2:#1F2E36; --ink:#E6EFF1; --muted:#9AAEB6; --line:#2A3B44;
  --sky:#6CB0E0; --sky-soft:#1D3546; --leaf:#5CC08E; --leaf-soft:#1C3A2C;
  --ocean:#14242C; --land:#2A4436; --shadow:0 6px 24px rgba(0,0,0,.45); color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
h1,h2,h3{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}
.app{height:100%;display:flex;flex-direction:column}
.flag{width:36px;height:24px;border-radius:4px;flex:none;display:inline-block;vertical-align:middle;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.flag.sm{width:27px;height:18px;border-radius:3px}

.top{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:-.01em}
.brand svg{width:30px;height:30px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.tab{border:0;background:transparent;padding:9px 16px;border-radius:999px;font-weight:500;color:var(--muted);display:flex;align-items:center;gap:8px}
.tab svg{width:20px;height:20px}
.tab[aria-current="page"]{background:var(--sky-soft);color:var(--ink)}
.tab:disabled{opacity:.4;cursor:default}
main{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;overflow:auto}
.wrap{max-width:1180px;margin:0 auto;padding-block:24px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
p{margin:0}

/* Explore */
.explore{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:20px;align-items:start}
@media (max-width:860px){.explore{grid-template-columns:1fr}}
.mapcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:14px;min-width:0}
.mapcard svg{width:100%;height:auto;display:block}
.pin{cursor:pointer}
.pin .dot{fill:var(--sky);stroke:var(--surface);stroke-width:3}
.pin .halo{fill:var(--sky);opacity:0}
.pin.sel .halo{opacity:.2}
.pin.sel .dot{fill:var(--leaf)}
.pin text{font-family:var(--body);font-size:14px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--ocean);stroke-width:4px}
@media (prefers-reduced-motion:no-preference){.pin.sel .halo{animation:pulse 2.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}}
@keyframes pulse{0%,100%{transform:scale(.8);opacity:.25}50%{transform:scale(1.3);opacity:.08}}
.destcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.destcard canvas{width:100%;aspect-ratio:16/9;display:block;max-width:100%;background:var(--surface-2)}
.destbody{padding:18px 20px 22px;display:grid;gap:14px}
.destname{display:flex;align-items:center;gap:12px}
.destname h2{font-size:2rem;letter-spacing:-.02em}
.findlist{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.findlist li{background:var(--surface-2);border-radius:999px;padding:5px 12px;font-size:.9rem}
.findlist li.nat{background:var(--leaf-soft)}
.big{border:0;background:var(--sky);color:#fff;font-weight:600;font-size:1.05rem;padding:13px 22px;border-radius:16px;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.big svg{width:22px;height:22px}
.ghost{border:1.5px solid var(--line);background:var(--surface);padding:11px 16px;border-radius:14px;font-weight:500;display:inline-flex;align-items:center;gap:8px}
.ghost svg{width:20px;height:20px}
.destgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:20px}
.destbtn{border:1.5px solid var(--line);background:var(--surface);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;text-align:left}
.destbtn b{display:block;font-weight:600;line-height:1.2}
.destbtn small{display:block;color:var(--muted);font-size:.8rem}
.destbtn[aria-pressed="true"]{border-color:var(--sky);background:var(--sky-soft)}

/* Hunt */
.pano{position:absolute;inset:0;touch-action:none;cursor:grab;background:#BFDCEC;overflow:hidden}
.pano.drag{cursor:grabbing}
.pano canvas{width:100%;height:100%;display:block}
.vf{position:absolute;left:20%;right:20%;top:15%;bottom:15%;pointer-events:none}
.vf i{position:absolute;width:44px;height:44px;border:4px solid rgba(255,255,255,.95);filter:drop-shadow(0 1px 3px rgba(0,0,0,.45));transition:border-color .25s}
.vf i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:14px 0 0 0}
.vf i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 14px 0 0}
.vf i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 14px}
.vf i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 14px 0}
.vf.hot i{border-color:#7DE2A9}
.float{position:absolute;background:var(--surface);color:var(--ink);border-radius:18px;box-shadow:var(--shadow)}
.place{left:calc(14px + env(safe-area-inset-left,0px));top:14px;display:flex;align-items:center;gap:10px;padding:8px}
.place button{border:0;background:var(--surface-2);width:40px;height:40px;border-radius:12px;display:grid;place-items:center}
.place button svg{width:22px;height:22px}
.place b{font-family:var(--display);font-size:1.15rem;padding-right:4px}
.list{right:calc(14px + env(safe-area-inset-right,0px));top:14px;width:min(310px,calc(100% - 28px));overflow:hidden}
.list>button{width:100%;border:0;background:transparent;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;font-weight:600}
.progress{display:flex;gap:5px;align-items:center}
.progress span{width:12px;height:12px;border-radius:50%;background:var(--line)}
.progress span.on{background:var(--leaf)}
.progress em{font-style:normal;font-size:.85rem;color:var(--muted);margin-left:4px}
.list ul{list-style:none;margin:0;padding:0 8px 10px;display:grid;gap:4px}
.list li{display:grid;grid-template-columns:30px 1fr 36px;align-items:center;gap:8px;padding:8px;border-radius:12px}
.list li.done{background:var(--leaf-soft)}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.done .check{background:var(--leaf);border-color:var(--leaf);color:#fff}
.check svg{width:16px;height:16px}
.list li b{display:block;font-size:.95rem}
.list li small{display:block;color:var(--muted);font-size:.82rem;line-height:1.3}
.say{border:0;background:transparent;width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none}
.say:hover{background:var(--surface-2)}
.say svg{width:20px;height:20px}
.controls{position:absolute;left:0;right:0;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;align-items:center;gap:22px;pointer-events:none}
.controls>*{pointer-events:auto}
.round{width:58px;height:58px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center}
.round svg{width:28px;height:28px}
.shutter{width:92px;height:92px;border-radius:50%;border:6px solid var(--surface);background:var(--sky);color:#fff;box-shadow:var(--shadow),inset 0 0 0 3px rgba(255,255,255,.35);display:grid;place-items:center;transition:transform .1s}
.shutter svg{width:40px;height:40px}
.shutter:active,.shutter.click{transform:scale(.9)}
.zoom{right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));display:grid;overflow:hidden}
.zoom button{border:0;background:transparent;width:52px;height:52px;display:grid;place-items:center}
.zoom button+button{border-top:1px solid var(--line)}
.zoom svg{width:24px;height:24px}
.hint{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(20,35,45,.72);color:#fff;padding:10px 18px;border-radius:999px;font-weight:500;pointer-events:none;transition:opacity .6s;display:flex;gap:8px;align-items:center;white-space:nowrap}
.hint svg{width:22px;height:22px}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:5}
.flash.go{animation:flash .55s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
@media (max-width:640px){.controls{gap:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px))}.round{width:50px;height:50px}.shutter{width:80px;height:80px}
  .zoom{bottom:auto;top:84px}.place{top:auto;bottom:calc(120px + env(safe-area-inset-bottom,0px))}}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(10,20,28,.55);display:grid;place-items:center;z-index:50;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--surface);border-radius:24px;max-width:600px;width:100%;max-height:100%;overflow:auto;box-shadow:var(--shadow)}
.sheet>img{width:100%;display:block;border-radius:24px 24px 0 0}
.sheet .in{padding:20px 22px 22px;display:grid;gap:16px}
.sheet h2{font-size:1.7rem}
.lead{font-size:1.08rem}
.info{display:grid;gap:14px}
.info section{display:grid;gap:4px}
.info h3{font-family:var(--body);font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.info ul{margin:0;padding-left:20px;display:grid;gap:6px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-size:.82rem;font-weight:600;padding:4px 11px;border-radius:999px;background:var(--surface-2)}
.chip.nat{background:var(--leaf-soft);color:var(--leaf)}
.chip.made{background:var(--sky-soft);color:var(--sky)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.note{background:var(--leaf-soft);border-radius:14px;padding:12px 14px;font-weight:500}

/* Discoveries */
.pagehead{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.pagehead h1{font-size:2.2rem;letter-spacing:-.02em}
.group{margin-bottom:34px}
.ghead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.ghead h2{font-size:1.35rem}
.gabout{color:var(--muted);max-width:68ch;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.photo{border:0;padding:0;background:var(--surface);border-radius:16px;overflow:hidden;text-align:left;box-shadow:0 0 0 1px var(--line)}
.photo img{width:100%;aspect-ratio:8/5;object-fit:cover;display:block}
.photo div{padding:10px 12px 12px;display:grid;gap:6px}
.photo b{font-weight:600;line-height:1.25}
.photo .more{font-size:.82rem;color:var(--sky);font-weight:600}
.empty{background:var(--surface);border:1.5px dashed var(--line);border-radius:22px;padding:40px 24px;text-align:center;display:grid;gap:14px;justify-items:center}
.empty svg{width:56px;height:56px;color:var(--sky)}

/* Compare */
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:600px){.pair{grid-template-columns:1fr}}
.slot{border:2px dashed var(--line);background:var(--surface);border-radius:20px;overflow:hidden;min-height:180px;display:grid;padding:0;text-align:left;align-content:start}
.slot.active{border-color:var(--sky);border-style:solid}
.slot img{width:100%;aspect-ratio:8/5;object-fit:cover;display:block}
.slot .cap{padding:10px 14px 14px;display:grid;gap:2px}
.slot .ph{display:grid;place-items:center;color:var(--muted);padding:60px 20px}
.strip{display:flex;gap:10px;overflow-x:auto;padding-block:6px 10px}
.strip button{flex:none;border:3px solid transparent;padding:0;border-radius:12px;overflow:hidden;background:var(--surface);width:130px;text-align:left}
.strip button[aria-pressed="true"]{border-color:var(--sky)}
.strip img{width:100%;aspect-ratio:8/5;object-fit:cover;display:block}
.strip span{display:block;font-size:.78rem;padding:4px 8px;line-height:1.25}
.notice{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:20px;display:grid;gap:14px;margin-top:18px}
.notice h2{font-size:1.4rem}
.choices{display:flex;flex-wrap:wrap;gap:10px}
.choice{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 18px;font-weight:600}
.choice[aria-pressed="true"]{border-color:var(--leaf);background:var(--leaf-soft)}
.prompts{display:grid;gap:8px;list-style:none;margin:0;padding:0}
.prompts li{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:12px;padding:8px 8px 8px 14px;font-weight:500}
.prompts li span{flex:1}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:60;font-weight:500}
@media (prefers-reduced-motion:reduce){.flash.go{animation-duration:.2s}}
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" fill="var(--sky-soft)"/><path d="M5 13c4 1 6-2 9 0s1 6 5 6 6-3 8-2M8 24c3-2 5 0 8-1M14 4c-1 3 2 4 1 7" stroke="var(--leaf)" stroke-width="2.2" fill="none" stroke-linecap="round"/><circle cx="16" cy="16" r="14" fill="none" stroke="var(--sky)" stroke-width="2"/></svg>
      World Explorer
    </div>
    <nav class="tabs" aria-label="Screens">
      <button class="tab" data-go="explore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>Explore</button>
      <button class="tab" data-go="hunt" id="tabHunt" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Photo Hunt</button>
      <button class="tab" data-go="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m3 16 5-5 4 4 3-3 6 6"/><circle cx="15.5" cy="8.5" r="1.5"/></svg>My Discoveries</button>
      <button class="tab" data-go="compare"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="7.5" height="14" rx="2"/><rect x="13.5" y="5" width="7.5" height="14" rx="2"/></svg>Compare</button>
    </nav>
  </header>

  <main>
    <section class="screen" id="s-explore">
      <div class="wrap">
        <div class="pagehead"><div><div class="eyebrow">Where we are in place and time</div><h1>Where will you explore?</h1></div></div>
        <div class="explore">
          <div class="mapcard">
            <svg id="map" viewBox="0 0 1000 500" role="img" aria-label="World map with destinations"></svg>
            <div class="destgrid" id="destGrid"></div>
          </div>
          <div class="destcard">
            <canvas id="preview" width="640" height="360" aria-hidden="true"></canvas>
            <div class="destbody" id="destBody"></div>
          </div>
        </div>
      </div>
    </section>

    <section class="screen" id="s-hunt" hidden>
      <div class="pano" id="pano"><canvas id="cv"></canvas>
        <div class="vf" id="vf"><i></i><i></i><i></i><i></i></div>
        <div class="flash" id="flash"></div>
        <div class="hint" id="hint"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 12H3m0 0 3-3m-3 3 3 3M16 12h5m0 0-3-3m3 3-3 3"/></svg>Drag to look around</div>
      </div>
      <div class="float place"><button id="backBtn" aria-label="Back to the map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><span id="placeFlag"></span><b id="placeName"></b><button id="soundBtn" aria-label="Sound on"></button></div>
      <div class="float list" id="list">
        <button id="listToggle" aria-expanded="true"><span>Photo Hunt</span><span class="progress" id="dots"></span></button>
        <ul id="huntList"></ul>
      </div>
      <div class="float zoom">
        <button id="zin" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
        <button id="zout" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M5 12h14"/></svg></button>
      </div>
      <div class="controls">
        <button class="round" id="left" aria-label="Look left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
        <button class="shutter" id="shutter" aria-label="Take a photo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
        <button class="round" id="right" aria-label="Look right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      </div>
    </section>

    <section class="screen" id="s-disc" hidden><div class="wrap" id="discWrap"></div></section>
    <section class="screen" id="s-compare" hidden><div class="wrap" id="cmpWrap"></div></section>
  </main>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<script>
(function(){
const W=4000,H=1000;
const ICON={
  speak:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>',
  mute:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="m17 9 5 6m0-6-5 6"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>'
};

    else showMiss(img)},420);
}
$('#shutter').onclick=capture;

/* ---------- Info cards ---------- */
function infoHTML(d,t){const c=t.card,nat=c.type==='Natural';
  const sec=[[ 'Why it is famous',c.famous],[c.bl||(nat?'How it formed':'When it was built'),c.built],[c.pl||(nat?'Why it matters to people':'What it is for'),c.purpose],['Places with a similar purpose',c.similar],[c.ml||'What it is made of',c.made]];
  return `<div class="chips"><span class="chip ${nat?'nat':'made'}">${c.type}</span><span class="chip">${t.cat}</span><span class="chip">${flag(d.flag,'sm')} ${d.name}, ${d.country}</span></div>
   <div class="info">${sec.filter(s=>s[1]).map(([h,v])=>`<section><h3>${h}</h3><p>${v}</p></section>`).join('')}
   <section><h3>Interesting facts</h3><ul>${c.facts.map(f=>`<li>${f}</li>`).join('')}</ul></section></div>`}
const readText=(d,t)=>{const c=t.card;return `${c.title}, in ${d.name}. ${c.famous} ${c.built} ${c.purpose} It is made of: ${c.made} ${c.facts.join(' ')}`};
function openModal(html){$('#sheet').innerHTML=html;$('#modal').hidden=false;$('#sheet').scrollTop=0;const b=$('#sheet').querySelector('.big');if(b)b.focus()}
function closeModal(){$('#modal').hidden=true;try{speechSynthesis.cancel()}catch(e){}}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal'||e.target.closest('[data-close]'))closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#modal').hidden)closeModal()});
function showFound(p,again){
  const t=TARGET(p.dest,p.target),f=foundIds(cur.id),all=f.size===cur.targets.length;
  openModal(`<img src="${p.img}" alt="Your photo of ${esc(t.card.title)}"><div class="in">
    <div><div class="eyebrow">${again?'Another photo of':'You found the '+t.label.toLowerCase()}</div><h2>${t.card.title}</h2></div>
    <p class="lead">${t.card.famous}</p>
    ${all&&!again?`<div class="note">You found all ${cur.targets.length} things in ${cur.name}! Read about them in My Discoveries, or compare two photos.</div>`:''}
    <div class="row"><button class="big" data-close>${all?'Keep exploring':'Find the next one'}</button><button class="ghost" id="moreBtn">Read more</button><button class="ghost" id="readBtn">${ICON.speak}Read to me</button></div></div>`);
  $('#moreBtn').onclick=()=>showPhoto(p.id);$('#readBtn').onclick=()=>speak(t.card.title+'. '+t.card.famous);
}
function showMiss(img){
  openModal(`<img src="${img}" alt="Your photo"><div class="in"><h2>Nothing from your list is in the frame</h2>
  <p class="muted">Point the camera so a hunt item sits inside the white corners. When the corners turn green, take the photo. You can also keep this one as your own discovery.</p>
  <div class="row"><button class="big" data-close>Try again</button><button class="ghost" id="keepBtn">Keep as my own discovery</button></div></div>`);
  $('#keepBtn').onclick=()=>{photos.push({id:Date.now()+'',dest:cur.id,target:null,label:'My own discovery',cat:'My pick',img,t:Date.now()});if(persist()){closeModal();toast('Saved to My Discoveries')}else photos.pop()};
}

/* ---------- Discoveries ---------- */
function photoCard(p){const t=p.target&&TARGET(p.dest,p.target);return `<button class="photo" data-photo="${p.id}"><img src="${p.img}" alt="${esc(p.label)}"><div><b>${esc(p.label)}</b><span class="chip" style="justify-self:start">${esc(p.cat)}</span>${t?'<span class="more">Read about it</span>':''}</div></button>`}
function renderDisc(){
  const w=$('#discWrap');
  if(!photos.length){w.innerHTML=`<div class="pagehead"><h1>My Discoveries</h1></div><div class="empty">${ICON.cam}<h2>No photos yet</h2><p class="muted">Your photos from the Photo Hunt will appear here, with facts to read about each place.</p><button class="big" id="goEx">Choose a place to explore</button></div>`;$('#goEx').onclick=()=>go('explore');return}
  let h=`<div class="pagehead"><div><div class="eyebrow">${photos.length} photo${photos.length>1?'s':''}</div><h1>My Discoveries</h1></div><button class="ghost" id="goCmp">Compare two photos</button></div>`;
  const order=[...new Set(photos.slice().sort((a,b)=>b.t-a.t).map(p=>p.dest))];
  order.forEach(id=>{const d=DMAP[id];const list=photos.filter(p=>p.dest===id).sort((a,b)=>a.t-b.t);
    h+=`<div class="group"><div class="ghead">${flag(d.flag)}<h2>${d.name}, ${d.country}</h2><span class="chip">${foundIds(id).size} of 5 found</span><button class="say" data-say="${esc(d.about)}" aria-label="Read aloud">${ICON.speak}</button></div><p class="gabout">${d.about}</p><div class="grid">${list.map(photoCard).join('')}</div></div>`});
  w.innerHTML=h;$('#goCmp').onclick=()=>go('compare');
  w.querySelectorAll('[data-photo]').forEach(b=>b.onclick=()=>showPhoto(b.dataset.photo));
}
function showPhoto(id){
  const p=photos.find(x=>x.id===id);if(!p)return;const d=DMAP[p.dest],t=p.target&&TARGET(p.dest,p.target);let arm=false;
  openModal(`<img src="${p.img}" alt="${esc(p.label)}"><div class="in"><h2>${esc(p.label)}</h2>
   ${t?infoHTML(d,t):`<div class="chips"><span class="chip">${flag(d.flag,'sm')} ${d.name}, ${d.country}</span></div><p>${d.about}</p><p class="muted">You chose this photo yourself. What did you notice here?</p>`}
   <div class="row"><button class="big" data-close>Close</button>${t?`<button class="ghost" id="readBtn">${ICON.speak}Read to me</button>`:''}<button class="ghost" id="delBtn">Delete photo</button></div></div>`);
  if(t)$('#readBtn').onclick=()=>speak(readText(d,t));
  $('#delBtn').onclick=()=>{if(!arm){arm=true;$('#delBtn').textContent='Tap again to delete';return}
    photos=photos.filter(x=>x.id!==id);persist();if(cmp.a===id)cmp.a=null;if(cmp.b===id)cmp.b=null;closeModal();if(screen==='disc')renderDisc();if(screen==='hunt')renderList()};
}

/* ---------- Compare ---------- */
const cmp={a:null,b:null,active:'a',notice:null};
function slotHTML(k){const p=photos.find(x=>x.id===cmp[k]);const d=p&&DMAP[p.dest];
  return `<button class="slot ${cmp.active===k?'active':''}" data-slot="${k}" aria-label="Photo ${k==='a'?'one':'two'}">${p?`<img src="${p.img}" alt="${esc(p.label)}"><div class="cap"><b>${esc(p.label)}</b><span class="muted">${flag(d.flag,'sm')} ${d.name}</span></div>`:`<div class="ph">Pick photo ${k==='a'?'one':'two'} below</div>`}</button>`}
function renderCompare(){
  const w=$('#cmpWrap');
  if(photos.length<2){w.innerHTML=`<div class="pagehead"><h1>Compare</h1></div><div class="empty">${ICON.cam}<h2>Take two photos to compare</h2><p class="muted">Find things on the Photo Hunt, then look at them side by side here.</p><button class="big" id="goEx">Choose a place to explore</button></div>`;$('#goEx').onclick=()=>go('explore');return}
  if(!photos.find(p=>p.id===cmp.a))cmp.a=null;if(!photos.find(p=>p.id===cmp.b))cmp.b=null;
  if(!cmp.a&&!cmp.b){const a=photos[0];const b=photos.find(p=>p.dest!==a.dest)||photos[1];cmp.a=a.id;cmp.b=b.id}
  const follow={same:'What is the same? Look at the shape, the size and what it is made of.',diff:'What is different? Look at the shape, the size and what it is made of.',both:'Tell a partner one thing that is the same and one thing that is different.'};
  w.innerHTML=`<div class="pagehead"><div><div class="eyebrow">Look closely</div><h1>Compare</h1></div></div>
   <div class="pair">${slotHTML('a')}${slotHTML('b')}</div>
   <div style="margin-top:16px"><div class="eyebrow">Choose a photo for ${cmp.active==='a'?'the left':'the right'}</div>
   <div class="strip">${photos.map(p=>`<button data-pick="${p.id}" aria-pressed="${p.id===cmp[cmp.active]}"><img src="${p.img}" alt=""><span>${esc(p.label)}<br><span class="muted" style="padding:0">${DMAP[p.dest].name}</span></span></button>`).join('')}</div></div>
   ${cmp.a&&cmp.b?`<div class="notice"><h2>What do you notice?</h2>
    <div class="choices">${[['same','Something similar'],['diff','Something different'],['both','Both']].map(([k,l])=>`<button class="choice" data-notice="${k}" aria-pressed="${cmp.notice===k}">${l}</button>`).join('')}</div>
    ${cmp.notice?`<div class="note">${follow[cmp.notice]}</div>`:''}
    <ul class="prompts">${['What is the same?','What is different?','Is each one natural or human-made?','What is each one for?','Why might these places be important to people?'].map(q=>`<li><span>${q}</span><button class="say" data-say="${q}" aria-label="Read aloud">${ICON.speak}</button></li>`).join('')}</ul></div>`:''}`;
  w.querySelectorAll('[data-slot]').forEach(b=>b.onclick=()=>{cmp.active=b.dataset.slot;renderCompare()});
  w.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>{cmp[cmp.active]=b.dataset.pick;cmp.notice=null;cmp.active=cmp.active==='a'?'b':'a';renderCompare()});
  w.querySelectorAll('[data-notice]').forEach(b=>b.onclick=()=>{cmp.notice=b.dataset.notice;renderCompare()});
}

/* ---------- Boot ---------- */
window.__WE={DESTS,getPano};
choose('paris');
if(photos.length){const last=photos[photos.length-1].dest;cur=DMAP[last];pano=getPano(last);$('#placeFlag').innerHTML=flag(cur.flag,'sm');$('#placeName').textContent=cur.name;$('#tabHunt').disabled=false}
go('explore');
})();
</script>
</body>
</html>
