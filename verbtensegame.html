<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Verb Tense Master</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,700&display=swap" rel="stylesheet">
<style>
:root{--cream:#FFF6E9;--ink:#36325A;--soft:#6A6592;--coral:#FF6B6B;--coral-d:#D84F4F;--blue:#3DA5D9;--blue-d:#2A7DAA;--green:#34C77B;--green-d:#239456;--purple:#9B6DE0;--purple-d:#7A4FBF;--card:#FFFFFF;--line:#EADFCB;--shadow:rgba(54,50,90,.16);}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:'Nunito',sans-serif;color:var(--ink);background:var(--cream);background-image:radial-gradient(var(--line) 1.4px, transparent 1.4px);background-size:26px 26px;min-height:100vh;overflow-x:hidden;}
.wrap{max-width:760px;margin:0 auto;padding:18px 16px 60px;position:relative;}
.topbar{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:18px;flex-wrap:wrap;}
.brand{display:flex;align-items:center;gap:12px;}
.brand h1{font-family:'Fredoka',sans-serif;font-weight:700;font-size:clamp(22px,5vw,30px);margin:0;line-height:1;color:var(--ink);}
.brand small{display:block;font-weight:700;color:var(--blue);font-size:13px;letter-spacing:.4px;text-transform:uppercase;margin-top:3px;}
.stats{display:flex;gap:8px;}
.chip{font-family:'Fredoka',sans-serif;font-weight:600;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:7px 13px;font-size:15px;display:flex;align-items:center;gap:6px;box-shadow:0 4px 0 var(--line);}
.chip b{font-size:17px;}
.timer-chip{font-family:'Fredoka',sans-serif;color:var(--ink);cursor:pointer;transition:transform .08s;}
.timer-chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line);}
.timer-chip.off{background:#F0ECE2;color:var(--soft);opacity:.85;}
.screen{display:none;animation:pop .35s cubic-bezier(.2,1.3,.5,1);}
.screen.on{display:block;}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:none;}}
.hero{text-align:center;background:var(--card);border:3px solid var(--ink);border-radius:28px;padding:22px 18px;margin-bottom:18px;box-shadow:0 8px 0 var(--ink);}
.hero h2{font-family:'Fredoka',sans-serif;font-size:clamp(20px,4.5vw,26px);margin:0 0 6px;position:relative;}
.hero p{margin:0;color:var(--soft);font-weight:700;position:relative;font-size:14px;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;}
@media(max-width:520px){.grid{grid-template-columns:1fr;}}
.mode{border:none;cursor:pointer;text-align:left;color:#fff;border-radius:22px;padding:18px 18px;font-family:'Nunito',sans-serif;position:relative;overflow:hidden;transition:transform .08s;}
.mode:active{transform:translateY(4px);}
.mode .ic{font-size:34px;display:block;margin-bottom:6px;}
.mode .t{font-family:'Fredoka',sans-serif;font-weight:700;font-size:19px;display:block;}
.mode .d{font-weight:700;font-size:13px;opacity:.95;}
.m-green{background:var(--green);box-shadow:0 7px 0 var(--green-d);}
.m-blue{background:var(--blue);box-shadow:0 7px 0 var(--blue-d);}
.m-purple{background:var(--purple);box-shadow:0 7px 0 var(--purple-d);}
.m-coral{background:var(--coral);box-shadow:0 7px 0 var(--coral-d);}
.gbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.back{font-family:'Fredoka',sans-serif;font-weight:600;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:8px 14px;cursor:pointer;box-shadow:0 4px 0 var(--ink);font-size:15px;}
.back:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
.progress{flex:1;height:14px;background:#fff;border:2px solid var(--ink);border-radius:20px;overflow:hidden;}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--blue));transition:width .3s;}
.qcard{background:var(--card);border:3px solid var(--ink);border-radius:26px;padding:20px 18px;box-shadow:0 8px 0 var(--ink);}
.tag{display:inline-block;font-family:'Fredoka',sans-serif;font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:#fff;background:var(--blue);border-radius:30px;padding:4px 12px;margin-bottom:12px;}
.prompt{font-family:'Fredoka',sans-serif;font-weight:600;font-size:clamp(18px,4vw,23px);margin:0 0 4px;line-height:1.3;}
.sub{color:var(--soft);font-weight:700;font-size:14px;margin:0 0 14px;}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
@media(max-width:480px){.opts{grid-template-columns:1fr;}}
.opt{font-family:'Fredoka',sans-serif;font-weight:600;font-size:19px;background:#fff;border:2px solid var(--ink);border-radius:18px;padding:15px;cursor:pointer;box-shadow:0 5px 0 var(--ink);transition:transform .08s,background .15s;color:var(--ink);}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);}
.opt.good{background:var(--green);color:#fff;border-color:var(--green-d);box-shadow:0 5px 0 var(--green-d);}
.opt.bad{background:var(--coral);color:#fff;border-color:var(--coral-d);box-shadow:0 5px 0 var(--coral-d);animation:shake .4s;}
.opt:disabled{cursor:default;}
@keyframes shake{0%,100%{transform:translateX(0);}20%{transform:translateX(-7px);}40%{transform:translateX(7px);}60%{transform:translateX(-5px);}80%{transform:translateX(5px);}}
.words{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-bottom:8px;}
.word{font-family:'Fredoka',sans-serif;font-weight:600;font-size:21px;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:10px 14px;cursor:pointer;box-shadow:0 4px 0 var(--ink);transition:transform .08s;}
.word:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
.word.good{background:var(--green);color:#fff;border-color:var(--green-d);box-shadow:0 4px 0 var(--green-d);}
.word.bad{background:var(--coral);color:#fff;border-color:var(--coral-d);box-shadow:0 4px 0 var(--coral-d);animation:shake .4s;}
.sentence{font-size:21px;font-weight:800;background:#FFFBF1;border:2px dashed var(--line);border-radius:16px;padding:14px 16px;margin:0 0 16px;line-height:1.6;}
.fb{margin-top:16px;border-radius:18px;padding:14px 16px;font-weight:800;display:none;align-items:flex-start;gap:10px;font-size:15px;line-height:1.5;}
.fb.show{display:flex;animation:pop .3s;}
.fb.win{background:#E6F9EE;border:2px solid var(--green);color:var(--green-d);}
.fb.lose{background:#FFEAEA;border:2px solid var(--coral);color:var(--coral-d);}
.fb .em{font-size:24px;line-height:1;}
.actions{margin-top:16px;display:flex;gap:12px;flex-wrap:wrap;}
.btn{font-family:'Fredoka',sans-serif;font-weight:600;font-size:18px;border:none;cursor:pointer;color:#fff;border-radius:18px;padding:14px 22px;transition:transform .08s;flex:1;min-width:130px;}
.btn:active{transform:translateY(4px);}
.btn-go{background:var(--blue);box-shadow:0 6px 0 var(--blue-d);}
.btn-go:active{box-shadow:0 2px 0 var(--blue-d);}
.btn-next{background:var(--green);box-shadow:0 6px 0 var(--green-d);}
.btn-next:active{box-shadow:0 2px 0 var(--green-d);}
.result{text-align:center;background:var(--card);border:3px solid var(--ink);border-radius:28px;padding:30px 22px;box-shadow:0 8px 0 var(--ink);}
.result h2{font-family:'Fredoka',sans-serif;font-size:30px;margin:6px 0 4px;}
.bigstars{font-size:46px;letter-spacing:8px;margin:8px 0 6px;}
.bigstars .s{opacity:.25;}
.bigstars .s.lit{opacity:1;display:inline-block;animation:starpop .5s cubic-bezier(.2,1.6,.4,1) both;}
.bigstars .s.lit:nth-child(2){animation-delay:.15s;}
.bigstars .s.lit:nth-child(3){animation-delay:.3s;}
@keyframes starpop{from{transform:scale(0) rotate(-40deg);}to{transform:scale(1) rotate(0);}}
.result .score{font-family:'Fredoka',sans-serif;font-weight:600;font-size:22px;}
.result .msg{color:var(--soft);font-weight:800;margin:8px 0 18px;}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:9999;overflow:hidden;}
.cf{position:absolute;width:11px;height:15px;will-change:transform,opacity;border-radius:2px;}
.overlay{position:fixed;inset:0;z-index:9998;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(54,50,90,.55);backdrop-filter:blur(3px);}
.overlay.on{display:flex;animation:pop .35s cubic-bezier(.2,1.3,.5,1);}
.donecard{background:var(--card);border:3px solid var(--ink);border-radius:28px;padding:30px 24px;box-shadow:0 8px 0 var(--ink);text-align:center;max-width:420px;width:100%;}
.donecard h2{font-family:'Fredoka',sans-serif;font-size:27px;margin:6px 0 6px;line-height:1.2;}
.donecard p{color:var(--soft);font-weight:800;margin:0 0 18px;}
</style>
</head>
<body>
<div id="confetti"></div>
<div id="doneOverlay" class="overlay" role="dialog" aria-modal="true">
<div class="donecard">
<div class="bigstars"><span class="s lit">★</span><span class="s lit">★</span><span class="s lit">★</span></div>
<h2>All done! 🎉</h2>
<p>10 minutes of practice—great work!</p>
<button class="btn btn-go" id="restartBtn">Restart ⟳</button>
</div>
</div>

<div class="wrap">
<div class="topbar">
<div class="brand"><div><small>Master verb tenses!</small><h1>Verb Tense Master</h1></div></div>
<div class="stats">
<button class="chip timer-chip" id="timerToggle">⏱ <b id="timeLeft">10:00</b></button>
<div class="chip">⭐ <b id="starCount">0</b></div>
<div class="chip">🔥 <b id="streakCount">0</b></div>
</div>
</div>

<section id="start" class="screen on">
<div class="hero">
<h2>Ready to master verbs? 🚀</h2>
<p>10 minutes of mixed practice with randomized questions!</p>
<button class="btn btn-go" id="startBtn" style="flex:none;margin-top:18px;width:min(280px,100%);">Start ▶</button>
</div>
</section>

<section id="level" class="screen">
<div class="hero"><h2>Pick your level 📚</h2><p>Hundreds of questions per level!</p></div>
<div class="grid">
<button class="mode m-green" data-level="level1"><span class="ic">🌱</span><span class="t">Level 1</span><span class="d">50+ questions</span></button>
<button class="mode m-blue" data-level="level2"><span class="ic">🌿</span><span class="t">Level 2</span><span class="d">50+ questions</span></button>
<button class="mode m-purple" data-level="level3"><span class="ic">🌳</span><span class="t">Level 3</span><span class="d">40+ questions</span></button>
<button class="mode m-coral" data-level="level4"><span class="ic">🦅</span><span class="t">Level 4</span><span class="d">40+ questions</span></button>
</div>
</section>

<section id="game" class="screen">
<div class="gbar"><button class="back" id="backBtn">← Level</button><div class="progress"><i id="progFill"></i></div><div class="chip">📝 <b id="qNum">1</b>/<b id="qTot">8</b></div></div>
<div class="qcard"><span class="tag" id="qTag">Tense</span><h3 class="prompt" id="qPrompt"></h3><p class="sub" id="qSub"></p><div id="qBody"></div><div class="fb" id="fb"><span class="em" id="fbEm">🎉</span><span id="fbText"></span></div><div class="actions" id="actions"></div></div>
</section>

<section id="results" class="screen">
<div class="result"><div class="bigstars" id="resStars"><span class="s">★</span><span class="s">★</span><span class="s">★</span></div><h2 id="resTitle">Great!</h2><p class="score" id="resScore"></p><p class="msg" id="resMsg"></p><div class="actions"><button class="btn btn-next" id="againBtn">Play again 🔁</button><button class="btn btn-go" id="homeBtn">Home 🏠</button></div></div>
</section>
</div>

const ENCOURAGE=["Perfect!","Brilliant!","Nailed it!","Excellent!","Amazing!","You got it!"];
const TRYAGAIN=["Oops!","Try again!","Not quite!","Almost!"];
const $=id=>document.getElementById(id);
let totalStars=0,streak=0,game=null,selectedLevel='level1',stage=0;

function shuffle(a){const b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[b[i],b[j]]=[b[j],b[i]];}return b;}
function show(scr){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(scr).classList.add('on');}
function setStats(){$('starCount').textContent=totalStars;$('streakCount').textContent=streak;}
function rand(a){return a[Math.random()*a.length|0];}

function startGame(){const L=LEVELS[selectedLevel];let q=shuffle([...L.mc,...L.error]).slice(0,8);game={queue:q,idx:0,correct:0,total:q.length};stage=0;$('qTot').textContent=game.total;show('game');renderQuestion();}

function renderQuestion(){const q=game.queue[game.idx];$('qNum').textContent=game.idx+1;$('progFill').style.width=game.idx/game.total*100+'%';$('qTag').textContent=q.topic;$('fb').className='fb';$('actions').innerHTML='';const b=$('qBody');b.innerHTML='';stage=0;if(q.options&&!q.words)renderMC(q,b);else if(q.words)renderErrorSpotting(q,b);}

function renderMC(q,body){$('qPrompt').textContent=q.prompt;const w=document.createElement('div');w.className='opts';shuffle(q.options).forEach(opt=>{const b=document.createElement('button');b.className='opt';b.textContent=opt;b.onclick=()=>{[...w.children].forEach(c=>c.disabled=true);const ok=opt===q.answer;b.classList.add(ok?'good':'bad');if(!ok)[...w.children].forEach(c=>{if(c.textContent===q.answer)c.classList.add('good');});finish(ok,q.explain);};w.appendChild(b);});body.appendChild(w);}

function renderErrorSpotting(q,body){$('qPrompt').textContent='Tap the wrong word:';const w=document.createElement('div');w.className='words';q.words.forEach((wd,i)=>{const b=document.createElement('button');b.className='word';b.textContent=wd;b.onclick=()=>{[...w.children].forEach(c=>c.disabled=true);const ok=i===q.errorIndex;b.classList.add(ok?'good':'bad');if(!ok)w.children[q.errorIndex].classList.add('good');if(ok){stage=1;setTimeout(()=>showErrorCorrection(q,body),500);}else{finish(false,"Should fix: "+q.words[q.errorIndex]);}};w.appendChild(b);});body.appendChild(w);}

function showErrorCorrection(q,body){body.innerHTML='';$('qPrompt').textContent='Pick the right form:';const corr=document.createElement('div');corr.className='sentence';corr.textContent=q.words.join(' ').replace(q.words[q.errorIndex],'_____');body.appendChild(corr);const w=document.createElement('div');w.className='opts';shuffle(q.options).forEach(opt=>{const b=document.createElement('button');b.className='opt';b.textContent=opt;b.onclick=()=>{[...w.children].forEach(c=>c.disabled=true);const ok=opt===q.fix;b.classList.add(ok?'good':'bad');if(!ok)[...w.children].forEach(c=>{if(c.textContent===q.fix)c.classList.add('good');});finish(ok,q.explain);};w.appendChild(b);});body.appendChild(w);}

function finish(ok,exp){const fb=$('fb');fb.className='fb show '+(ok?'win':'lose');$('fbEm').textContent=ok?'🎉':'💡';if(ok){game.correct++;streak++;totalStars++;$('fbText').innerHTML='<b>'+rand(ENCOURAGE)+'</b> '+exp;burstConfetti();}else{streak=0;$('fbText').innerHTML='<b>'+rand(TRYAGAIN)+'</b> '+exp;}setStats();const a=$('actions');a.innerHTML='';const n=document.createElement('button');n.className='btn btn-next';n.textContent=game.idx+1>=game.total?'Results 🏆':'Next ➡️';n.onclick=()=>{game.idx++;if(game.idx>=game.total)endGame();else renderQuestion();};a.appendChild(n);}

function endGame(){$('progFill').style.width='100%';const c=game.correct,t=game.total,pct=c/t;const s=pct>=0.9?3:pct>=0.6?2:pct>0?1:0;const cells=$('resStars').children;for(let i=0;i<3;i++)cells[i].classList.toggle('lit',i<s);$('resScore').textContent='You got '+c+' / '+t;let title='',msg='';if(s===3){title='Perfect! 🌟';msg='Verb master!';}else if(s===2){title='Excellent! 🎈';msg='Great work!';}else if(s===1){title='Good! 💪';msg='Keep going!';}else{title='Learning! 🌱';msg='Try again!';}$('resTitle').textContent=title;$('resMsg').textContent=msg;show('results');if(s>=2)setTimeout(burstConfetti,250);}

const CF_COLORS=['#FF6B6B','#3DA5D9','#34C77B','#9B6DE0'];
function burstConfetti(){const root=$('confetti');for(let i=0;i<20;i++){const p=document.createElement('div');p.className='cf';const x=20+Math.random()*60;p.style.left=x+'vw';p.style.top='-20px';p.style.background=CF_COLORS[i%CF_COLORS.length];root.appendChild(p);const dx=(Math.random()*2-1)*200;const dy=600;const dur=1200+Math.random()*800;p.animate([{transform:'translate(0,0) rotate(0deg)',opacity:1},{transform:'translate('+dx+'px,'+dy+'px) rotate(720deg)',opacity:0}],{duration:dur,fill:'forwards'});setTimeout(()=>p.remove(),dur+50);}}

document.querySelectorAll('#level .mode').forEach(b=>b.onclick=()=>{selectedLevel=b.dataset.level;startGame();});
$('backBtn').onclick=()=>show('level');
$('homeBtn').onclick=()=>show('level');
$('againBtn').onclick=()=>startGame();
$('startBtn').onclick=()=>show('level');
setStats();

let timeLeft=600,timerId=null,timerOn=true,started=false;
function renderTime(){if(!timerOn){$('timeLeft').textContent='Off';return;}const m=Math.floor(timeLeft/60),s=timeLeft%60;$('timeLeft').textContent=m+':'+String(s).padStart(2,'0');}
function startTimer(){if(timerId||!timerOn||!started)return;timerId=setInterval(()=>{timeLeft--;if(timeLeft<=0){timeLeft=0;renderTime();clearInterval(timerId);$('doneOverlay').classList.add('on');return;}renderTime();},1000);}
$('timerToggle').onclick=()=>{timerOn=!timerOn;if(timerOn){renderTime();startTimer();}else{clearInterval(timerId);renderTime();}};
$('restartBtn').onclick=()=>{$('doneOverlay').classList.remove('on');timeLeft=600;timerOn=true;renderTime();started=true;startTimer();show('level');};
$('startBtn').onclick=()=>{started=true;renderTime();startTimer();show('level');};
renderTime();
</script>
