let swaps={}; let query="";

const YEARS=["K1","K2","K3","Grade 1","Grade 2","Grade 3","Grade 4","Grade 5"];
const YSHORT={"K1":"K1","K2":"K2","K3":"K3","Grade 1":"G1","Grade 2":"G2","Grade 3":"G3","Grade 4":"G4","Grade 5":"G5"};
const THEMEC={"Who We Are":"#D2457A","Where We Are in Place and Time":"#B97A12","How We Express Ourselves":"#8A4FD0","How the World Works":"#1B8A9C","How We Organize Ourselves":"#3E63D8","Sharing the Planet":"#2E8B4A"};
const PH={tune:["Tuning in","var(--tune)"],find:["Finding out","var(--find)"],sort:["Sorting out","var(--sort)"],share:["Going further","var(--share)"],reflect:["Reflecting","var(--reflect)"]};
const EN={calm:"#1D9E75",moderate:"#2E7DBE",active:"#BA7517",buzzing:"#C2552B"};
const CAT={performance:["Performance & presentation","#8A4FD0"],visual:["Visual & creative","#2E8B4A"],digital:["Digital & multimedia","#3E63D8"],inquiry:["Inquiry & STEM","#B97A12"],writing:["Writing & language","#C2552B"],makerspace:["Hands-on & maker","#D2457A"],synthesis:["Synthesis & organisation","#1B8A9C"],exhibition:["Exhibition & community","#C47C2B"],reflection:["Reflection & metacognition","#5A50C0"]};
// Lesson Explorer bands: Reception–Y1, Y2–Y3, Y4–Y5, Y6. Project Guide bands: R–Y2, Y3–Y4, Y5–Y6.
const LBAND={"K1":0,"K2":0,"K3":0,"Grade 1":1,"Grade 2":1,"Grade 3":2,"Grade 4":2,"Grade 5":3};
const LBANDN=["Reception–Y1","Y2–Y3","Y4–Y5","Y6"];
const PBAND={"K1":0,"K2":0,"K3":0,"Grade 1":0,"Grade 2":1,"Grade 3":1,"Grade 4":2,"Grade 5":2};
const UKY={"K1":"Nursery","K2":"Reception","K3":"Year 1","Grade 1":"Year 2","Grade 2":"Year 3","Grade 3":"Year 4","Grade 4":"Year 5","Grade 5":"Year 6"};

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const unitsOf=y=>POI.filter(u=>u.year===y);
const key=u=>u.year+"|"+u.title;
const lessonByName=n=>LESSONS.find(l=>l.name===n);
const projType=id=>PROJ.find(p=>p.id===id);
function splitLoi(t){const m=t.match(/^(.*?)\s*\(([^)]*)\)\s*$/);if(!m)return[t,[]];return[m[1],m[2].toLowerCase().split(/[,\/]|\band\b/).map(s=>s.trim()).filter(Boolean)]}
function unitKC(u){const set=new Set();u.lois.forEach(t=>splitLoi(t)[1].forEach(k=>{if(KC.includes(k))set.add(k)}));return set}
function onSearch(v){query=v.trim().toLowerCase();state.unit=null;state.journey=false;render(false)}

let state={year:"Grade 3",unit:null,tab:"check"};
try{const s=localStorage.getItem("pypideas");if(s){const o=JSON.parse(s);if(YEARS.includes(o.year))state.year=o.year;if(o.tab)state.tab=o.tab}}catch(e){}
function save(){try{localStorage.setItem("pypideas",JSON.stringify({year:state.year,tab:state.tab}))}catch(e){}}

function renderYears(){
  $("years").innerHTML=YEARS.map(y=>`<button aria-pressed="${state.year===y&&!state.journey}" onclick="goYear('${y}')">${YSHORT[y]}</button>`).join("")+
    `<button class="jbtn" aria-pressed="${!!state.journey}" onclick="goJourney()">Project journey</button>`;
}
function goYear(y){state.year=y;state.unit=null;state.journey=false;save();location.hash=YSHORT[y];render()}
function goUnit(y,i,tab){state.year=y;state.unit=i;state.journey=false;if(tab)state.tab=tab;save();location.hash=YSHORT[y]+"-"+(i+1);render()}
function goJourney(){state.journey=true;state.unit=null;location.hash="journey";render()}
function setTab(t){state.tab=t;save();render(false)}

function render(scroll=true){
  renderYears();
  const m=$("main");
  if(state.journey){m.innerHTML=journeyView()}
  else if(state.unit===null){m.innerHTML=yearView(state.year)}
  else m.innerHTML=unitView(state.year,state.unit);
  if(scroll)window.scrollTo(0,0);
}

function searchView(){
  const q=query;
  const hits=POI.filter(u=>{const c=C[key(u)];const hay=[u.year,u.title,u.theme,u.ci,...u.lois,...c.asks,...c.tasks,...c.show,...c.lessons.map(l=>l[1]+" "+l[2]),...c.projects.map(p=>p.name+" "+p.what+" "+projType(p.t).name),...(ALT[key(u)]||[]).map(a=>a.name),CUR[key(u)]?CUR[key(u)].name+" "+CUR[key(u)].what:""].join(" ").toLowerCase();return hay.includes(q)});
  return `<div class="intro"><h1>${hits.length} unit${hits.length===1?"":"s"} match "${esc(query)}"</h1><p>Searching titles, central ideas, lines of inquiry, lesson ideas and projects across K1–Grade 5.</p></div>
  <div class="units">${hits.map(u=>{const i=unitsOf(u.year).indexOf(u);return `<button class="unit" style="--tc:${THEMEC[u.theme]}" onclick="goUnit('${esc(u.year)}',${i})">
    <span class="theme">${esc(u.theme)}</span><h2>${esc(u.title)}</h2><span class="ci">${esc(u.ci)}</span><span class="nproj">${esc(u.year)} · ${esc(UKY[u.year])}</span></button>`}).join("")||'<p style="color:var(--muted)">Nothing matched. Try a concept word like "perspective" or a project type like "podcast".</p>'}</div>`;
}
function yearView(y){
  if(query)return searchView();
  const us=unitsOf(y);
  return `<div class="intro"><h1>${esc(y)} units of inquiry</h1><p>${us.length} units · ${esc(UKY[y])} in UK terms. Tap a unit to see what it asks of students, a lesson sequence and three projects.</p></div>
  <div class="units">${us.map((u,i)=>`<button class="unit" style="--tc:${THEMEC[u.theme]}" onclick="goUnit('${esc(y)}',${i})">
    <span class="theme">${esc(u.theme)}</span><h2>${esc(u.title)}</h2><span class="ci">${esc(u.ci)}</span>
    <span class="nproj">${CUR[key(u)]?"Current project: "+esc(CUR[key(u)].name)+" · ":""}${C[key(u)].lessons.length} lessons · ${CUR[key(u)]?"5 alternatives":"3 projects + 2 alternatives"}</span></button>`).join("")}</div>
  <div class="help" style="margin-bottom:60px"><b>How to use pypideas</b><span>1 · <b>Unit check</b> reads the central idea and lines of inquiry into plain tasks and success criteria, and shows which key concepts, ATLs and learner profile attributes the unit leans on.</span><span>2 · <b>Lesson ideas</b> gives a six-lesson sequence; every lesson can be swapped for another type from the same inquiry phase, with the guide's prerequisites and cautions.</span><span>3 · <b>Projects</b> gives three balanced projects plus two alternatives, each with the Project Guide's differentiation, benefits, skills and materials.</span></div>`;
}

function unitView(y,i){
  const u=unitsOf(y)[i], c=C[key(u)], tc=THEMEC[u.theme];
  const lois=u.lois.map((t,n)=>{const[txt,kc]=splitLoi(t);return `<div class="loi"><b>${n+1}</b><span>${esc(txt)}${kc.length?`<span class="kc">${kc.map(k=>`<span>${esc(k)}</span>`).join("")}</span>`:""}</span></div>`}).join("");
  const tabs=[["check","Unit check","What it asks · what to show"],["lessons","Lesson ideas","6 lesson types in inquiry order"],["projects","Projects","3 balanced projects"]];
  const seg=`<div class="seg">${tabs.map(t=>`<button aria-pressed="${state.tab===t[0]}" onclick="setTab('${t[0]}')"><b>${t[1]}</b><small>${t[2]}</small></button>`).join("")}</div>`;
  let body=state.tab==="lessons"?lessonsPanel(u,c):state.tab==="projects"?projectsPanel(u,c):checkPanel(u,c);
  return `<button class="back" onclick="goYear('${esc(y)}')">← ${esc(y)} units</button>
  <div class="uhead" style="--tc:${tc}"><div class="eyebrow">${esc(y)} · ${esc(u.theme)}</div><h1>${esc(u.title)}</h1>
   <div class="ci-box"><small>Central idea</small><p>${esc(u.ci)}</p></div>
   <div class="lois">${lois}</div></div>
  ${seg}<div class="panel" style="--tc:${tc}">${body}</div>`;
}

function checkPanel(u,c){
  const tasks=u.lois.map((t,n)=>`<div class="row"><span class="n c">${n+1}</span><p>${esc(c.tasks[n])}<span class="sub">Line of inquiry ${n+1}: ${esc(splitLoi(t)[0])}</span></p></div>`).join("");
  const kc=unitKC(u);const missing=KC.filter(k=>!kc.has(k));
  const atl={};c.projects.forEach(p=>{const T=projType(p.t);T.atls.primary.forEach(a=>atl[a]=(atl[a]||0)+2);T.atls.secondary.forEach(a=>atl[a]=(atl[a]||0)+1)});
  const atlMax=Math.max(...Object.values(atl));
  const atlBar=Object.keys(ATLN).map(a=>`<div><span>${ATLN[a]}</span><i><b style="width:${Math.round(100*(atl[a]||0)/atlMax)}%"></b></i><small>${atl[a]||0}</small></div>`).join("");
  const light=Object.keys(ATLN).filter(a=>!atl[a]||atl[a]<=1).map(a=>ATLN[a].toLowerCase());
  return `<div class="consider"><b>Considerations for this unit</b>
    <span><b>Key concepts:</b> ${[...kc].join(", ")||"none tagged"}${missing.length?`. Not driven by this unit: ${missing.join(", ")}. If a line of inquiry feels thin, a question through one of these concepts usually deepens it.`:". All seven key concepts appear, so keep each line focused on one."}</span>
    <span><b>Learner profile to foreground:</b> ${LPROF[u.theme].join(", ")}.</span>
    <span><b>Year band:</b> ${esc(UKY[u.year])}, so lessons use the ${LBANDN[LBAND[u.year]]} scaling and projects use the ${esc(projType(c.projects[0].t).yearGroups[PBAND[u.year]].year)} scaffold from the guides.</span></div>
  <div class="sec"><h2>Key concepts driving the lines of inquiry</h2><p class="lead">Taken from the concept tags on each line. Highlighted concepts are the lenses students need questions for.</p>
   <div class="kcs">${KC.map(k=>`<span class="${kc.has(k)?"on":""}">${k}</span>`).join("")}</div></div>
  <div class="sec"><h2>Approaches to learning across the three projects</h2><p class="lead">Scored from the Project Guide: 2 for a primary ATL, 1 for a secondary.${light.length?` Light on ${light.join(" and ")}, so choose an alternative project or a lesson that works those skills.`:" Every ATL cluster is covered."}</p><div class="atlbar">${atlBar}</div></div>
  <div class="sec"><h2>Learner profile attributes to name</h2><p class="lead">Suggested for ${esc(u.theme)} units; name them in feedback and reflection.</p><div class="lp">${LPROF[u.theme].map(a=>`<span>${a}</span>`).join("")}</div></div>
  <div class="sec"><h2>What this unit asks of students</h2><p class="lead">Read from the central idea and its lines of inquiry.</p>
   <div class="list">${c.asks.map((a,n)=>`<div class="row"><span class="n">${n+1}</span><p>${esc(a)}</p></div>`).join("")}</div></div>
  <div class="sec"><h2>One task per line of inquiry</h2><p class="lead">Short formative tasks that give evidence for each line before the final project.</p><div class="list">${tasks}</div></div>
  <div class="sec"><h2>The final project must show</h2><p class="lead">Use these as the success criteria for whichever project you choose.</p>
   <div class="list">${c.show.map(s=>`<div class="row"><span class="n tick">✓</span><p>${esc(s)}</p></div>`).join("")}</div></div>`;
}

function lessonCard(l,n,u,b,k,alt){
  const name=alt||l[1];const L=lessonByName(name)||{};const pc=PH[l[0]][1];
  const same=LESSONS.filter(x=>x.phases.includes(l[0])&&x.name!==l[1]).sort((a,c)=>( (L.pairs||[]).includes(c.name)-(L.pairs||[]).includes(a.name)) || (c.name<a.name?1:-1));
  const swapChips=`<div class="swaps"><span class="lab">Swap for</span>${alt?`<button class="swap on" onclick="swapLesson('${esc(k)}',${n},null)">← Suggested: ${esc(l[1])}</button>`:""}${same.map(x=>`<button class="swap ${alt===x.name?"on":""}" onclick="swapLesson('${esc(k)}',${n},'${esc(x.name)}')">${esc(x.name)}${(L.pairs||[]).includes(x.name)?" ★":""}</button>`).join("")}</div>`;
  const how=alt?`<p class="how"><b>${esc(L.best||"")}.</b> For ${LBANDN[b]}: ${esc(L.scale?L.scale[b]:"")}</p>`:`<p class="how">${esc(l[2])}</p>`;
  return `<div class="les ${alt?"swapped":""}" style="--pc:${pc}"><span class="phase"></span><div>
      <div class="ph">${n+1} · ${PH[l[0]][0]}${alt?" · swapped":""}</div><h3>${esc(name)}</h3>${how}
      <div class="meta"><span class="chip en" style="--ec:${EN[L.energy]||'#888'}">${esc(L.energy||"")}</span><span class="chip">${["","low prep","some prep","high prep"][L.prep]||""}</span><span class="chip">${esc(L.dur||"")}</span><span class="chip">${esc(L.group||"")}</span></div>
      <details><summary>Guide notes: prerequisites, pros and cons, scaling for ${LBANDN[b]}</summary><div class="guide">
        <span><b>Before this lesson, students need to:</b> ${(L.prereqs||[]).map(esc).join(" · ")}</span>
        <div class="pc2"><ul>${(L.pros||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul><ul class="con">${(L.cons||[]).map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
        ${alt?"":`<span><b>Scaled for ${LBANDN[b]}:</b> ${esc(L.scale?L.scale[b]:"")}</span>`}<span><b>You need:</b> ${esc(L.needs||"")}</span>
        <span><b>Pairs well with:</b> ${(L.pairs||[]).map(esc).join(", ")} (★ in the swap list)</span></div></details>
      ${swapChips}
    </div></div>`;
}
function swapLesson(k,n,name){swaps[k+"#"+n]=name;render(false)}
function lessonsPanel(u,c){
  const b=LBAND[u.year],k=key(u);
  const active=c.lessons.map((l,n)=>lessonByName(swaps[k+"#"+n]||l[1]));
  const en={};active.forEach(L=>en[L.energy]=(en[L.energy]||0)+1);
  const prep=active.reduce((a,L)=>a+L.prep,0);const high=active.filter(L=>L.prep===3).map(L=>L.name);
  const pre=[...new Set(active.flatMap(L=>L.prereqs))];
  const keyRow=`<div class="phases-key">${Object.keys(PH).map(p=>`<span style="--pc:${PH[p][1]}"><i></i>${PH[p][0]}</span>`).join("")}</div>`;
  const cons=`<div class="consider"><b>Considerations for this sequence</b>
    <span><b>Energy mix:</b> ${Object.keys(EN).filter(e=>en[e]).map(e=>`${en[e]} ${e}`).join(", ")}. ${en.buzzing>=2?"Two or more buzzing lessons: put a calm one between them.":"Calm and active lessons alternate well here."}</span>
    <span><b>Prep load:</b> ${prep} of 18${high.length?` (high prep: ${high.join(", ")}). Prepare these first.`:" and nothing high-prep."}</span>
    <span><b>Students must already be able to:</b> ${pre.slice(0,6).join(" · ")}${pre.length>6?" · …":""}. Check the earliest of these before lesson 1.</span>
    <span><b>Timing:</b> ${active.map(L=>L.dur).join(" · ")}.</span></div>`;
  const cards=c.lessons.map((l,n)=>lessonCard(l,n,u,b,k,swaps[k+"#"+n]||null)).join("");
  return `<div class="sec"><h2>A lesson sequence for ${esc(u.title)}</h2><p class="lead">Six lesson types from the Lesson Explorer, in inquiry order, tuned to this unit and to ${esc(UKY[u.year])} (${LBANDN[b]}). Use "Swap for" to try another type from the same phase; ★ marks ones the guide says pair well with the suggestion.</p>${keyRow}${cons}<div class="lessons">${cards}</div></div>`;
}

function projectsPanel(u,c){
  const pb=PBAND[u.year];
  const cats=c.projects.map(p=>projType(p.t).category);
  const bal=`<div class="balance">${cats.map(k=>`<span style="--cc:${CAT[k][1]}"><i></i>${CAT[k][0]}</span>`).join("")}</div>`;
  const cards=c.projects.map((p,n)=>{const T=projType(p.t);const yg=T.yearGroups[pb];const cc=CAT[T.category][1];
    let builds;
    if(p.prev){const[py,pu,pi]=p.prev;const pv=C[py+"|"+pu].projects[pi];const idx=unitsOf(py).findIndex(x=>x.title===pu);
      builds=`<button class="builds" onclick="goUnit('${esc(py)}',${idx},'projects')">↩ Builds on <b>${esc(pv.name)}</b> · ${esc(YSHORT[py])} ${esc(pu)}</button>`}
    else builds=`<span class="builds first">★ Starts a new strand</span>`;
    return `<div class="proj" style="--cc:${cc}"><div class="cat"><i></i>${CAT[T.category][0]}</div><h3>${esc(p.name)}</h3><div class="type">Project type: ${esc(T.name)} · Lines of inquiry ${p.lois.join(", ")}</div>
      <p class="what">${esc(p.what)}</p><p class="how"><b>How:</b> ${esc(p.how)}</p>${builds}
      <div class="meta">${T.atls.primary.map(a=>`<span class="chip" style="background:var(--accent-soft);color:var(--accent)">${ATLN[a]}</span>`).join("")}${T.atls.secondary.map(a=>`<span class="chip">${ATLN[a]}</span>`).join("")}</div>
      <div class="ben">${T.benefits.map(x=>`<div>${esc(x)}</div>`).join("")}</div>
      <div class="diff"><div><b>Differentiate by product</b>${esc(T.diff.product)}</div><div><b>By process</b>${esc(T.diff.process)}</div><div><b>By content</b>${esc(T.diff.content)}</div></div>
      <details><summary>Guide scaffold for ${esc(yg.year)}: product, process, instruction, skills, materials</summary><div class="guide">
        <span><b>Product:</b> ${esc(yg.product)}</span><span><b>Process:</b> ${esc(yg.process)}</span><span><b>Instruction:</b> ${esc(yg.instruction)}</span>
        <span><b>ATL focus:</b> ${T.atls.specific.map(esc).join(" · ")}</span><span><b>Skills students need:</b> ${T.skills.map(esc).join(" · ")}</span><span><b>Materials:</b> ${T.materials.map(esc).join(" · ")}</span></div></details>
    </div>`}).join("");
  const usedYear=new Set(unitsOf(u.year).flatMap(x=>C[key(x)].projects.map(p=>p.t)));
  const alts=(ALT[key(u)]||[]).map(a=>{const T=projType(a.t);const yg=T.yearGroups[pb];return `<div class="alt" style="--cc:${CAT[T.category][1]}"><div class="cat"><i></i>${CAT[T.category][0]}</div><h3>${esc(a.name)}</h3><p>${esc(a.what)}</p><div class="type">${esc(T.name)}${usedYear.has(a.t)?" · also used elsewhere this year":" · not used elsewhere this year"}</div>
    <details><summary>Guide scaffold for ${esc(yg.year)}</summary><div class="guide"><span><b>Product:</b> ${esc(yg.product)}</span><span><b>Process:</b> ${esc(yg.process)}</span><span><b>Instruction:</b> ${esc(yg.instruction)}</span></div></details></div>`}).join("");
  const mainCats=new Set(c.projects.map(p=>projType(p.t).category));
  const more=PROJ.filter(T=>!usedYear.has(T.id)&&!(ALT[key(u)]||[]).some(a=>a.t===T.id)&&!mainCats.has(T.category)).slice(0,8);
  const moreRow=more.length?`<div class="more"><span class="lab">Categories this unit does not yet use</span>${more.map(T=>`<span class="chip" style="--cc:${CAT[T.category][1]}"><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--cc);margin-right:6px"></i>${esc(T.name)}</span>`).join("")}</div>`:"";
  const altSec=`<div class="sec"><h2>Alternatives</h2><p class="lead">Two more project ideas for this unit using different types, if a main project does not suit your class, timetable or materials.</p><div class="alts">${alts}</div>${moreRow}</div>`;
  const cur=CUR[key(u)];
  let curSec="";
  if(cur){
    const types=cur.t.map(id=>projType(id));
    const crit=c.show.map((sh,n)=>`<div><i class="${cur.covers.includes(n)?"":"gap"}">${cur.covers.includes(n)?"✓":"!"}</i><span>${esc(sh)}${cur.covers.includes(n)?"":" <b style='color:var(--share)'>· not in the product, add a task</b>"}</span></div>`).join("");
    const loiRow=u.lois.map((t,n)=>`<span class="chip" style="${cur.lois.includes(n+1)?"background:var(--tc);color:#fff":""}">Line ${n+1}${cur.lois.includes(n+1)?"":" · not covered"}</span>`).join("");
    const pb2=PBAND[u.year];
    curSec=`<div class="cur"><span class="tag">★ What we do now</span><h3>${esc(cur.name)}</h3>
      <p class="what">${esc(cur.what)}</p><p class="how"><b>How:</b> ${esc(cur.how)}</p>
      <div class="meta" style="margin-top:10px">${loiRow}</div>
      <div class="fit"><b>Fit with the unit check:</b> ${esc(cur.fit)}</div>
      <div class="crit">${crit}</div>
      <div class="cur3"><div style="--dot:var(--ok)"><b>Strengths</b><ul>${cur.strengths.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
        <div style="--dot:var(--share)"><b>Watch out for</b><ul>${cur.watch.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
        <div style="--dot:var(--accent)"><b>Ways to stretch it</b><ul>${cur.stretch.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div></div>
      <details><summary>Project Guide notes for the nearest type${types.length>1?"s":""}: ${types.map(T=>esc(T.name)).join(" / ")}</summary><div class="guide">
        ${types.map(T=>{const yg=T.yearGroups[pb2];return `<span><b>${esc(T.name)} (${esc(yg.year)}):</b> ${esc(yg.product)} <br><b>Process:</b> ${esc(yg.process)} <br><b>Differentiate:</b> ${esc(T.diff.product)}</span>`}).join("")}</div></details></div>`;
  }
  const head=cur?`<div class="sec"><h2>Final project for ${esc(u.title)}</h2><p class="lead">Your current project first, checked against the unit's success criteria, then three alternatives from the Project Guide and two more ideas.</p>${curSec}<h2 style="font-size:20px">Alternatives from the Project Guide</h2><p class="lead">Different types that would also meet the unit check, if you ever want to rotate the project.</p>${bal}<div class="projects">${cards}</div></div>`
    :`<div class="sec"><h2>Three projects for ${esc(u.title)}</h2><p class="lead">One to make, one to show, one to think with. Each uses a different project type from the Project Guide, and each builds on an earlier project in this or another year.</p>${bal}<div class="projects">${cards}</div></div>`;
  return head+(cur?altSec.replace("<h2>Alternatives</h2>","<h2>Two more ideas</h2>"):altSec);
}

function journeyView(){
  const rows=YEARS.map(y=>`<tr><td class="y">${esc(YSHORT[y])}<br><small style="color:var(--faint);font-weight:400">${esc(UKY[y])}</small></td><td>${unitsOf(y).map((u,i)=>{const c=C[key(u)];
    return `<div style="margin-bottom:10px"><span class="jtheme" style="--tc:${THEMEC[u.theme]}">${esc(u.theme)}</span><span class="jtitle">${esc(u.title)}</span><div class="jp">${CUR[key(u)]?`<button class="curb" style="--cc:${THEMEC[u.theme]}" onclick="goUnit('${esc(y)}',${i},'projects')"><i></i>★ ${esc(CUR[key(u)].name)}</button>`:""}${c.projects.map((p,n)=>`<button style="--cc:${CAT[projType(p.t).category][1]}" onclick="goUnit('${esc(y)}',${i},'projects')"><i></i>${esc(p.name)}</button>`).join("")}</div></div>`}).join("")}</td></tr>`).join("");
  const counts={};POI.forEach(u=>C[key(u)].projects.forEach(p=>{const k=projType(p.t).category;counts[k]=(counts[k]||0)+1}));
  return `<div class="intro"><h1>Project journey K1 → Grade 5</h1><p>Every project in one view. ★ marks a project the school currently runs; the others are suggestions. Colours are project categories, so you can see the balance within a year and how strands build upward. Tap any project to open it.</p>
   <div class="legend">${Object.keys(CAT).map(k=>`<span style="--cc:${CAT[k][1]}"><i></i>${CAT[k][0]} (${counts[k]||0})</span>`).join("")}</div></div>
   <div class="jtable"><table><thead><tr><th>Year</th><th>Units and their three projects</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function fromHash(){
  const h=(location.hash||"").slice(1);
  if(h==="journey"){state.journey=true;state.unit=null;return}
  const m=h.match(/^(K1|K2|K3|G[1-5])(?:-(\d+))?$/);if(!m)return;
  const y=YEARS.find(x=>YSHORT[x]===m[1]);if(!y)return;state.year=y;state.journey=false;
  state.unit=m[2]?Math.min(unitsOf(y).length-1,+m[2]-1):null;
}
window.addEventListener("hashchange",()=>{fromHash();render()});
fromHash();render();
</script>
