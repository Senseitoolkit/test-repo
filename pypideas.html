<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pypideas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: one column, max 1040px; year tabs on top, units as theme-coloured tiles, unit page with three big sections. */
:root{
  --bg:#F7F8FA; --surface:#FFFFFF; --surface-2:#EEF1F5; --ink:#1B2230; --muted:#5B6474; --faint:#8A93A3;
  --line:#DCE1E8; --line-2:#C5CCD6; --accent:#0E7C86; --accent-soft:#DCF1F3; --ok:#2E8B4A;
  --tune:#1D9E75; --find:#2E7DBE; --sort:#BA7517; --share:#C2552B; --reflect:#5A50C0;
  --display:'Outfit',system-ui,sans-serif; --body:'Atkinson Hyperlegible',system-ui,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(27,34,48,.05),0 8px 24px rgba(27,34,48,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141922; --surface:#1D2430; --surface-2:#262E3B; --ink:#EEF1F5; --muted:#A6AEBC; --faint:#7D8696;
  --line:#2F3845; --line-2:#3E4857; --accent:#4CC3CC; --accent-soft:#163A3E; --ok:#5BC27A;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141922; --surface:#1D2430; --surface-2:#262E3B; --ink:#EEF1F5; --muted:#A6AEBC; --faint:#7D8696;
  --line:#2F3845; --line-2:#3E4857; --accent:#4CC3CC; --accent-soft:#163A3E; --ok:#5BC27A;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.15;text-wrap:balance}
.wrap{max-width:1040px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;border-radius:3px;background:var(--accent);display:inline-block}
.years{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.years button{padding:7px 13px;border-radius:999px;border:1px solid var(--line-2);font-weight:700;font-size:14px;color:var(--muted)}
.years button:hover{border-color:var(--ink);color:var(--ink)}
.years button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.years button.jbtn{margin-left:auto;border-style:dashed}
button:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

/* year page */
.intro{padding-block:22px 6px}
.intro h1{font-size:clamp(24px,3.4vw,32px)}
.intro p{color:var(--muted);margin-top:6px;max-width:60ch}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;padding-block:14px 60px}
.unit{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 16px 16px 20px;position:relative;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;transition:transform .15s,border-color .15s}
.unit::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:5px;border-radius:0 4px 4px 0;background:var(--tc)}
.unit:hover{transform:translateY(-2px);border-color:var(--tc)}
.unit .theme{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tc)}
.unit h2{font-size:21px}
.unit .ci{color:var(--muted);font-size:15px}
.unit .nproj{margin-top:4px;font-size:13px;color:var(--faint)}

/* unit page */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:700;padding-block:16px 4px;font-size:15px}
.back:hover{color:var(--ink)}
.uhead{padding-block:6px 18px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--tc)}
.uhead h1{font-size:clamp(28px,4.4vw,40px);margin-top:4px}
.ci-box{margin-top:12px;background:var(--surface);border-left:5px solid var(--tc);border-radius:0 var(--r) var(--r) 0;padding:12px 16px}
.ci-box small{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ci-box p{font-size:19px;font-family:var(--display);font-weight:500;margin-top:2px}
.lois{display:grid;gap:8px;margin-top:12px}
.loi{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;font-size:15.5px}
.loi b{width:30px;height:30px;border-radius:50%;background:var(--tc);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-family:var(--display)}
.loi .kc{display:inline-flex;flex-wrap:wrap;gap:4px;margin-left:6px;vertical-align:middle}
.kc span{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);letter-spacing:.02em}

.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-block:18px 8px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:8;background:var(--bg);padding-block:8px}
.seg button{border:1px solid var(--line-2);border-radius:12px;padding:12px 8px;background:var(--surface);display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.2}
.seg button b{font-family:var(--display);font-size:16px}
.seg button small{color:var(--muted);font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg button[aria-pressed="true"] small{color:var(--bg);opacity:.8}
@media (max-width:520px){.seg button small{display:none}.seg{top:calc(env(safe-area-inset-top,0px) + 96px)}}

.panel{padding-block:8px 70px}
.sec{margin-top:22px}
.sec h2{font-size:22px;margin-bottom:4px}
.sec .lead{color:var(--muted);margin-bottom:12px;max-width:65ch}
.list{display:grid;gap:8px}
.row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start}
.row .n{width:28px;height:28px;border-radius:8px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:600;color:var(--muted);font-size:14px}
.row .n.tick{background:var(--accent-soft);color:var(--accent)}
.row .n.c{background:var(--tc);color:#fff}
.row p{min-width:0}
.row .sub{display:block;font-size:13px;color:var(--muted);margin-top:2px}

/* lessons */
.lessons{display:grid;gap:10px}
.les{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start}
.phase{width:10px;border-radius:5px;align-self:stretch;background:var(--pc);min-height:48px}
.les .ph{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--pc)}
.les h3{font-size:19px;margin-top:2px}
.les .how{margin-top:6px;font-size:15.5px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:12.5px;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:700}
.chip.en{color:#fff;background:var(--ec)}
details{margin-top:8px}
summary{cursor:pointer;color:var(--accent);font-weight:700;font-size:14px;list-style:none;display:inline-flex;align-items:center;gap:6px}
summary::before{content:"▸";font-size:12px;transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
summary::-webkit-details-marker{display:none}
.guide{margin-top:8px;background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:14.5px;color:var(--muted);display:grid;gap:6px}
.guide b{color:var(--ink)}
.phases-key{display:flex;flex-wrap:wrap;gap:8px 14px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.phases-key span{display:inline-flex;align-items:center;gap:5px}
.phases-key i{width:10px;height:10px;border-radius:3px;background:var(--pc);display:inline-block}

/* projects */
.projects{display:grid;gap:14px}
.proj{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.proj::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:var(--cc)}
.proj .cat{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.proj .cat i{width:10px;height:10px;border-radius:50%;background:var(--cc);display:inline-block}
.proj h3{font-size:23px;margin-top:4px}
.proj .type{color:var(--muted);font-size:14px;margin-top:2px}
.proj .what{margin-top:10px;font-size:16px}
.proj .how{margin-top:8px;font-size:14.5px;color:var(--muted)}
.proj .how b{color:var(--ink)}
.builds{margin-top:10px;display:inline-flex;align-items:center;gap:8px;font-size:14px;padding:6px 10px 6px 8px;border-radius:999px;border:1px dashed var(--line-2);color:var(--muted);text-align:left}
.builds:hover{border-color:var(--accent);color:var(--accent)}
.builds b{color:var(--ink);font-weight:700}
.builds.first{cursor:default;border-style:solid}
.builds.first:hover{color:var(--muted);border-color:var(--line-2)}
.balance{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.cur{background:var(--surface);border:2px solid var(--tc);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);margin-bottom:18px}
.cur .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--tc);padding:4px 10px;border-radius:999px}
.cur h3{font-size:24px;margin-top:8px}
.cur .what{margin-top:8px;font-size:16px}
.cur .how{margin-top:6px;font-size:14.5px;color:var(--muted)}
.cur .how b,.cur .fit b{color:var(--ink)}
.cur .fit{margin-top:12px;background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:15px}
.crit{display:grid;gap:6px;margin-top:10px}
.crit div{display:grid;grid-template-columns:24px 1fr;gap:8px;font-size:14.5px;align-items:start}
.crit i{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;font-style:normal;color:#fff;background:var(--ok)}
.crit i.gap{background:var(--share)}
.cur3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
@media (max-width:700px){.cur3{grid-template-columns:1fr}}
.cur3 div{background:var(--surface-2);border-radius:10px;padding:10px 12px;min-width:0}
.cur3 b{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.cur3 ul{list-style:none;display:grid;gap:4px;font-size:14px;color:var(--muted)}
.cur3 li{padding-left:14px;position:relative}
.cur3 li::before{content:"";position:absolute;left:0;top:8px;width:6px;height:6px;border-radius:50%;background:var(--dot)}
.jp button.curb{border-color:var(--ink);font-weight:700}
.balance span{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 10px}
.balance i{width:9px;height:9px;border-radius:50%;background:var(--cc);display:inline-block}

/* journey */
.jtable{overflow-x:auto;margin-block:14px 60px}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:10px 10px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
th{font-family:var(--display);font-weight:600;color:var(--muted);font-size:13px;letter-spacing:.04em;text-transform:uppercase}
td.y{font-family:var(--display);font-weight:700;white-space:nowrap}
.jp{display:flex;gap:6px;flex-wrap:wrap}
.jp button{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:4px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);text-align:left}
.jp button i{width:9px;height:9px;border-radius:50%;background:var(--cc);display:inline-block;flex-shrink:0}
.jp button:hover{border-color:var(--ink)}
.jtitle{font-weight:700;display:block;font-size:14px}
.jtheme{color:var(--tc);font-size:11.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em}
.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13.5px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--cc);display:inline-block}
.help{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;margin-top:14px;font-size:15px;color:var(--muted);display:grid;gap:4px}
.help b{color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(16px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:.2s;z-index:50;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}

.search{position:relative;flex:1;min-width:170px;max-width:320px}
.search input{width:100%;padding:8px 12px 8px 34px;border-radius:999px;border:1px solid var(--line-2);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;outline:none}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--faint);fill:none;stroke-width:2}
.yrtag{font-size:12px;font-weight:700;color:var(--faint);letter-spacing:.05em}
.consider{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:0 var(--r) var(--r) 0;padding:12px 16px;margin-bottom:14px;display:grid;gap:6px;font-size:15px}
.consider b{color:var(--ink)}
.consider span{color:var(--muted)}
.kcs{display:flex;flex-wrap:wrap;gap:8px}
.kcs span{font-size:13.5px;font-weight:700;padding:5px 12px;border-radius:999px;border:1px solid var(--line-2);color:var(--faint)}
.kcs span.on{background:var(--tc);border-color:var(--tc);color:#fff}
.atlbar{display:grid;gap:6px}
.atlbar div{display:grid;grid-template-columns:140px 1fr auto;gap:10px;align-items:center;font-size:14px}
.atlbar i{display:block;height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.atlbar i b{display:block;height:100%;background:var(--accent);border-radius:5px}
.atlbar small{color:var(--muted);font-variant-numeric:tabular-nums}
.lp{display:flex;flex-wrap:wrap;gap:8px}
.lp span{font-size:14px;padding:6px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.pc2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.pc2{grid-template-columns:1fr}}
.pc2 ul{list-style:none;display:grid;gap:3px}
.pc2 li{padding-left:14px;position:relative}
.pc2 li::before{content:"";position:absolute;left:0;top:9px;width:6px;height:6px;border-radius:50%;background:var(--ok)}
.pc2 .con li::before{background:var(--share)}
.swaps{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.swaps .lab{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint)}
.swap{font-size:13px;padding:4px 11px;border-radius:999px;border:1px solid var(--line-2);color:var(--muted)}
.swap:hover{border-color:var(--accent);color:var(--accent)}
.swap.on{background:var(--accent);border-color:var(--accent);color:#fff}
.les.swapped{border-color:var(--accent);background:var(--accent-soft)}
.diff{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
@media (max-width:640px){.diff{grid-template-columns:1fr}}
.diff div{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--muted);min-width:0}
.diff b{display:block;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);margin-bottom:3px}
.ben{display:grid;gap:3px;margin-top:10px;font-size:14.5px}
.ben div{padding-left:18px;position:relative;color:var(--muted)}
.ben div::before{content:"✓";position:absolute;left:0;color:var(--ok);font-weight:700}
.alts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:10px}
.alt{background:var(--surface);border:1px dashed var(--line-2);border-radius:12px;padding:14px 16px;position:relative}
.alt .cat{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.alt .cat i{width:9px;height:9px;border-radius:50%;background:var(--cc);display:inline-block}
.alt h3{font-size:18px;margin-top:4px}
.alt p{font-size:14.5px;color:var(--muted);margin-top:4px}
.alt .type{font-size:12.5px;color:var(--faint);margin-top:6px}
.more{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.more .lab{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<header class="top">
  <div class="wrap">
    <div class="brand"><i></i>pypideas</div>
    <nav class="years" id="years" aria-label="Year group"></nav>
    <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search units, ideas, concepts…" aria-label="Search" oninput="onSearch(this.value)"></div>
  </div>
</header>

<main class="wrap" id="main"></main>
<div class="toast" id="toast"></div>

<script>
const POI=[{"year":"K1","title":"Understanding our identity","theme":"Who We Are","ci":"We learn about ourselves through interactions with others.","lois":["Our actions and choices help us understand who we are. (responsibility)","Relationships influence our sense of self. (connection)","Our bodies and feelings give us information about ourselves. (form)","People have different strengths that help them grow. (function, connection)"]},{"year":"K1","title":"Transportation","theme":"How We Organize Ourselves","ci":"People make transportation systems to help the needs of the community.","lois":["Transportation systems are designed to meet people’s needs. (form)","We choose transportation based on our needs and activities. (function)","Transportation systems connect people and places in a community. (connection)"]},{"year":"K1","title":"Homes","theme":"Sharing the Planet","ci":"A home is a basic need for all life on Earth.","lois":["Homes are designed to meet the needs of living things. (form, function)","Homes are built differently depending on place and environment. (causation)","Homes change over time and require care. (change and responsibility)"]},{"year":"K1","title":"Expressing emotions through art","theme":"How We Express Ourselves","ci":"We can use our imagination to express our emotions and creativity through the arts.","lois":["Different art forms use materials to express ideas and feelings. (form)","People use materials and objects to communicate ideas and emotions. (connection)","Imagination helps us create and share ideas. (perspective)","People express emotions and ideas in different ways. (perspective, change)"]},{"year":"K2","title":"Bodies","theme":"Who We Are","ci":"Our bodies look different but work in the same way.","lois":["The human body has different parts inside and outside. (form)","Our senses help us understand the world around us. (connection)","The body supports many different actions and activities. (function)"]},{"year":"K2","title":"Different Cultures","theme":"Where We Are in Place and Time","ci":"Learning about different cultures helps us appreciate the world and our place in it.","lois":["Places around the world have different features. (form)","People live in different ways in different cultures. (connection)","Understanding similarities and differences helps us appreciate others. (perspective, responsibility)"]},{"year":"K2","title":"Storytelling","theme":"How We Express Ourselves","ci":"Stories are created to express ideas, engage audiences, and share meaning.","lois":["Stories have important parts that help us understand them. (form)","People tell stories for different reasons. (causation)","Personal experiences can influence the stories we tell. (connection)"]},{"year":"K2","title":"Living Things","theme":"Sharing the Planet","ci":"Living things have certain needs in order to grow and stay healthy.","lois":["Living things have features we can observe. (form)","Living things depend on their environment for their needs. (connection)","People have a responsibility to care for living things. (responsibility)"]},{"year":"K2","title":"The Scientific Method","theme":"How the World Works","ci":"Scientific investigations allow us to observe, test, and explain changes in the world.","lois":["Scientific investigations follow steps to explore questions. (form)","We use tools and our senses to observe and find out. (function)","Changes in the world can be explored and explained. (change)"]},{"year":"K3","title":"Celebrations","theme":"How We Express Ourselves","ci":"Celebrations reflect the importance of events, beliefs, and traditions.","lois":["People celebrate in different ways. (connection)","Celebrations are influenced by beliefs, traditions, and values. (perspective)","Celebrations can be created and shared within communities. (function / responsibility)"]},{"year":"K3","title":"Food","theme":"Who We Are","ci":"Food choices are influenced by needs, culture, and personal preferences.","lois":["Food provides different nutrients and benefits for the body. (form/function)","Food comes from a variety of sources. (connection)","Food choices are influenced by culture, preferences, and needs. (perspective)"]},{"year":"K3","title":"Science Experiments","theme":"How the World Works","ci":"Our curiosity leads to discoveries.","lois":["Observations help us notice patterns and ask questions. (form)","Discoveries can lead to changes or new ideas. (causation/change)","Scientific thinking involves testing ideas to find solutions. (function/change)"]},{"year":"K3","title":"Upcycling","theme":"Sharing the Planet","ci":"People interact with and value the environment in different ways.","lois":["The environment provides what living things need. (function)","Human actions can change the environment. (change)","People have a responsibility to respect and care for the environment. (responsibility)"]},{"year":"Grade 1","title":"Stories from the Past","theme":"Where We Are in Place and Time","ci":"Stories and artifacts provide evidence about the past and how it has changed.","lois":["Stories and artifacts give clues about the past. (function)","How life has changed over time. (change)","People remember and interpret the past in different ways (perspective)"]},{"year":"Grade 1","title":"My Town","theme":"How We Organize Ourselves","ci":"Communities are organized to provide services that meet people’s needs.","lois":["People have different needs and wants. (perspective)","Communities provide services to meet these needs. (function)","Communities have different features and roles. (form)"]},{"year":"Grade 1","title":"Fictional Narratives","theme":"How We Express Ourselves","ci":"Fictional narratives communicate ideas and emotions to an audience.","lois":["Stories have elements such as characters, setting, and events. (form)","Authors make choices to communicate ideas and feelings. (connection)","Stories can be understood and interpreted in different ways. (function / perspective)"]},{"year":"Grade 1","title":"Science Experiments","theme":"How the World Works","ci":"Scientific investigations allow us to explore and understand the physical world.","lois":["Scientific investigations follow steps and processes. (form)","Investigations help us find out how and why things happen. (function)","Observations and evidence help explain results. (causation)"]},{"year":"Grade 1","title":"Living Things","theme":"Sharing the Planet","ci":"Living things depend on each other for their survival.","lois":["Living things are connected through food chains and habitats. (connection)","Changes in ecosystems can affect living things. (causation)","People can take action to care for living things and the environment. (responsibility)"]},{"year":"Grade 1","title":"Relationships","theme":"Who We Are","ci":"Understanding our identities helps us to build relationships in diverse communities.","lois":["Different experiences and groups shape who we are. (causation)","People belong to different groups and communities. (form, connection)","Respect and responsibility help build positive relationships. (responsibility)"]},{"year":"Grade 2","title":"Storytelling","theme":"How We Express Ourselves","ci":"Stories express ideas, creativity, and meaning.","lois":["Stories use structures that help communicate meaning. (form)","Stories can be told from different perspectives. (perspective)","Stories can be told in different ways. (function)"]},{"year":"Grade 2","title":"Role-models","theme":"Who We Are","ci":"Role models influence our values, choices, and understanding of ourselves.","lois":["Role models have traits and characteristics that influence others. (form/connection)","Our choices and actions influence who we become. (causation)","Role models can influence our choices and actions. (responsibility)"]},{"year":"Grade 2","title":"Electricity","theme":"How the World Works","ci":"Electricity is a form of energy that can be controlled and used for different purposes.","lois":["Electricity has properties and sources. (form)","Electricity can be changed and controlled. (change)","Electricity is used in different ways in everyday life. (causation)"]},{"year":"Grade 2","title":"Plants","theme":"Sharing the Planet","ci":"Plants sustain life on Earth and play a role in our lives.","lois":["Plants have different parts that help them survive. (form)","Plants grow and change through different stages. (change)","People’s actions affect plants and their environments. (Function, Responsibility)"]},{"year":"Grade 2","title":"Landmarks","theme":"Where We Are in Place and Time","ci":"Landmarks connect people to place, culture, and history.","lois":["Landmarks have different features and purposes. (form)","Landmarks connect communities and cultures. (connection)","Landmarks can be understood from different perspectives. (perspective)"]},{"year":"Grade 2","title":"Services","theme":"How We Organize Ourselves","ci":"Individuals contribute to how groups function.","lois":["Individual choices affect how a group works. (connection)","People take on roles and responsibilities in groups. (responsibility)","Groups have systems that help them function. (function)"]},{"year":"Grade 3","title":"Personal Identity","theme":"How We Express Ourselves","ci":"Personal identities are expressed through culture and interests.","lois":["Culture includes different forms of expression. (form)","Interests and experiences can change over time. (change)","People’s culture and interests reflect their identity. (perspective)"]},{"year":"Grade 3","title":"Body Systems","theme":"Who We Are","ci":"The interactions among body systems contribute to health and survival.","lois":["Body systems have structures and functions. (function)","Body systems are connected and work together. (connection)","Lifestyle choices can affect how body systems function. (causation/responsibility)"]},{"year":"Grade 3","title":"Ancient Civilizations","theme":"Where We Are in Place and Time","ci":"Ancient civilizations have influenced modern societies in different ways.","lois":["Ancient civilizations developed knowledge and ideas. (form)","Ideas change and develop over time. (causation)","Ancient civilizations continue to influence modern life. (connection)"]},{"year":"Grade 3","title":"Landforms","theme":"Sharing the Planet","ci":"Natural landscapes influence our communities.","lois":["Landforms have different features and characteristics. (form)","Communities are shaped by their natural surroundings. (connection)","People can make choices to live sustainably within environments. (responsibility)"]},{"year":"Grade 3","title":"Natural Disasters","theme":"How We Organize Ourselves","ci":"Communities organize themselves and take informed action to respond to natural disasters.","lois":["Natural disasters can be grouped by their causes and features. (form/causation)","Natural processes explain how natural disasters occur. (causation)","Communities plan and take action to respond to natural disasters. (responsibility)"]},{"year":"Grade 3","title":"Innovations","theme":"How the World Works","ci":"People innovate to solve problems and improve their quality of life.","lois":["People innovate to meet needs and solve problems. (causation)","Scientific knowledge is used to develop new ideas and solutions. (function)","Innovations can have positive and negative impacts. (change)"]},{"year":"Grade 4","title":"Exploration","theme":"Where We Are in Place and Time","ci":"Exploration leads to discovery and develops new understandings.","lois":["Exploration involves relationships between people, resources, and ideas. (form)","Exploration is driven by different motivations and purposes. (causation)","Exploration leads to different consequences and perspectives. (perspective)"]},{"year":"Grade 4","title":"Systems of Government","theme":"How We Organize Ourselves","ci":"Governments and citizens mutually influence one another.","lois":["Government systems have different structures and roles. (function)","Governments influence the lives of citizens. (causation)","Citizens have rights and responsibilities within government systems. (responsibility)"]},{"year":"Grade 4","title":"Physics","theme":"How the World Works","ci":"Observations of the natural world and its laws can help us make predictions.","lois":["Scientific laws inform our observations. (causation)","Forces and interactions explain changes in motion and energy. (connection)","Scientific understanding can be used to make predictions. (function)"]},{"year":"Grade 4","title":"Advertising","theme":"How We Express Ourselves","ci":"People create and manipulate messages to target and persuade specific audiences.","lois":["Advertisements use different forms of media and techniques. (function)","Messages are designed to influence how people think and feel. (perspective)","Audiences respond to messages in different ways. (connection)"]},{"year":"Grade 4","title":"Evolution","theme":"Sharing the Planet","ci":"The struggle for survival drives the evolution of living things.","lois":["Living things have similarities and differences that can be observed and classified. (form)","Living things adapt to changes in their environment over time. (change)","Human actions can affect the balance of ecosystems. (responsibility)"]},{"year":"Grade 4","title":"Beliefs","theme":"Who We Are","ci":"Beliefs and values are conveyed in different ways and are part of our identity.","lois":["People have different beliefs and values. (perspective)","Beliefs and values are formed and can change over time. (change)","Beliefs influence people’s choices and actions. (connection)"]},{"year":"Grade 5","title":"Activism","theme":"Sharing the Planet","ci":"Environmental issues can create conflict and inspire social change.","lois":["Human activities have causes and effects on the environment. (causation)","Different stakeholders have different perspectives on environmental issues. (perspective)","People can take action to create change. (responsibility)"]},{"year":"Grade 5","title":"Migration","theme":"Where We Are in Place and Time","ci":"Human migration comes from, and leads to, challenges and opportunities.","lois":["People migrate for different reasons. (form)","Migration is experienced differently by individuals and groups. (perspective)","Migration creates challenges and opportunities for societies. (change)"]},{"year":"Grade 5","title":"Storing Energy","theme":"How the World Works","ci":"The use and storage of energy have environmental impacts.","lois":["Energy exists in different forms that can be observed and classified. (form, function)","Energy can be transferred, stored, and used in different ways. (function)","Energy choices have impacts on the environment. (function, causation)"]},{"year":"Grade 5","title":"The Exhibition","theme":"How We Organize Ourselves","ci":"Knowledge and successful partnerships help us address global issues.","lois":["Student-generated","Student-generated","Student-generated"]},{"year":"Grade 5","title":"Interpretation and Appreciation","theme":"How We Express Ourselves","ci":"Artistic interpretation enables us to better understand and appreciate art.","lois":["Artworks can be analysed using different criteria. (form, function)","Art communicates ideas, emotions, and messages. (connection)","People interpret artworks in different ways. (perspective)","Art can be evaluated and appreciated using different criteria. (connection)"]},{"year":"Grade 5","title":"Changes","theme":"Who We Are","ci":"Change is a necessary part of growing up.","lois":["People experience different types of change. (form, function)","Change can affect thoughts, feelings, and behaviour. (function)","People develop strategies to respond to change. (function)","Technology and social pressures influence how people grow and interact. (connection)"]}];
const C={"K1|Understanding our identity":{"asks":["Notice and name feelings and the choices they make","Talk about the people who matter to them","Find one thing they are good at and one they are practising"],"tasks":["Choice sort: kind / not-kind picture cards, then show one kind choice","'My people' circle: draw who helps you and say how","Feelings mirror: make the face, name it, point to where you feel it","'I can…' badge: draw a strength and one thing you are still learning"],"show":["Says one thing they are good at and one thing they are learning","Names a feeling and what their body does when they feel it","Shows a kind choice with a friend and says why it was kind"],"lessons":[["tune","Thinking routine","See-Think-Wonder on photos of children playing, helping and arguing. Teacher scribes; stop at 10 minutes."],["find","Concept-first","One word: 'kind'. One puppet example of kind and one of not-kind. 'What do you notice?'"],["find","Mixed-modal","The same feeling three ways: move it, draw it, say it. Teacher links each: 'now the same idea a different way'."],["sort","Stations / Rotations","Three stations: feelings faces mirror, 'my people' drawing, puppet kind-choice corner. Adult at the puppets."],["share","Performance lesson","Show a feeling to a soft toy or a group of three, all at once. Applause, no critique."],["reflect","Peer coaching","'Tell your partner one kind thing they did today.' Teacher models the sentence first."]],"projects":[{"t":"self-portrait-evolution","name":"All About Me portrait","what":"A self-portrait with three 'I can' labels and one feeling word, repeated at the end of the unit so children see the change.","how":"Mirror → draw → teacher scribes labels → compare the two portraits in a pair.","lois":[3,4]},{"t":"role-play","name":"Friendship puppet show","what":"Pairs act out a small problem (sharing, waiting) and a kind choice that solves it, with puppets.","how":"Scenario card read aloud → plan together → improvise → 'How did your choice help?'","lois":[1,2]},{"t":"used-to-think","name":"Feelings I know chart","what":"Two drawings with dictated labels: feelings I knew at the start, feelings I know now.","how":"Unit opener (5 min) sealed in an envelope → unit closer → pair share.","lois":[3]}]},"K1|Transportation":{"asks":["Name kinds of transport and what each one carries","Choose the right transport for a journey and say why","See how roads, tracks and stations link places in a community"],"tasks":["Vehicle sort by land / water / air, then 'who uses it?'","Journey choice: 'I am going to the beach, so I take…'","Floor-map drive: move a toy car from home to school and name each stop"],"show":["Sorts five vehicles into land, water and air and says who uses each","Picks a transport for a given journey and gives a reason","Builds or draws a route that connects two places with a stop between"],"lessons":[["tune","Inquiry-driven","Provocation: a bicycle wheel, a train ticket, a toy bus. Teacher scribes the wonders on a wall."],["find","Real-world scenario","'We are planning the class trip to the park: walk, bus or train?' Teacher leads, children vote with reasons."],["find","Experiment lesson","Ramps: which surface lets the toy car roll furthest? Predict with pictures, teacher records on a class chart."],["sort","Build–Test–Improve","Build a bridge from blocks that a toy car can cross. Test together, one improvement, celebrate the process."],["share","Gamification","Transport quest: deliver three parcels across the floor map using the right vehicle. Stickers as tokens, no ranking."],["reflect","Thinking routine","Verbal 'I used to think trains… now I think…' in a circle."]],"projects":[{"t":"model-building","name":"Block-town road map","what":"A class floor map of roads, a station and a bridge; each child adds one vehicle with a label.","how":"Sketch first → build → label three parts → explain to a partner.","lois":[1,3]},{"t":"immersive-experience","name":"Transport walk-through","what":"Three stations families walk through: a ticket office, a bus stop and a harbour, each with something to do.","how":"Plan three stations → design the hands-on part → make materials → host.","lois":[2,3]},{"t":"survey-data","name":"How did you come to school?","what":"A class sticky-note chart of how everyone travelled today, counted and talked about.","how":"Each child places a sticky note → count together → 'which is most? why?'","lois":[2,3]}]},"K1|Homes":{"asks":["Say what a home gives us: shelter, warmth, safety","Compare homes in different places and animal homes","Help look after a shared space"],"tasks":["Animal–home matching with a 'because'","Weather-home choice: which house for snow? for rain?","Tidy-up photos: before and after caring for our class home"],"show":["Matches four animals to their homes and explains why","Builds a home for a chosen place and names one feature it needs","Takes a turn caring for the class space or plant"],"lessons":[["tune","Concept-first","One word: 'need'. What happens to a snail with no shell? Under five minutes before moving on."],["find","Stations / Rotations","Nest building with twigs, straw/stick/brick houses, animal-home books, dollhouse care corner. Adult at the building station."],["find","Experiment lesson","Which roof keeps the teddy dry? Spray-bottle test on paper, foil and cloth. Predict with pictures."],["sort","Build–Test–Improve","Build a home for a toy animal that stays standing. Test with a 'wind' (fan), improve once."],["share","Creative expression","Paint 'my home' using colours for how it feels. Share in a circle."],["reflect","Learning journey","Three picture steps on the wall: need → build → care. Children move a peg each step."]],"projects":[{"t":"diorama","name":"Animal home box","what":"A shoebox home for one animal with four labelled elements and why each is there.","how":"Research what belongs → build → sticky-note labels → two-minute share.","lois":[1,2]},{"t":"caring-for-something","name":"Class home keepers","what":"A rota for watering, tidying and checking the class space, with a weekly drawing of what changed.","how":"Daily check → weekly journal picture → 'what did we fix?'","lois":[3],"prev":["K1","Understanding our identity",1]},{"t":"digital-storybook","name":"Homes around the world","what":"A class e-book: each pair makes one page about a home in a hot, cold or wet place, with a voice recording.","how":"Choose a place → draw → record one sentence → class listens together.","lois":[2]}]},"K1|Expressing emotions through art":{"asks":["Try paint, clay, music and dance","Choose a material to show a feeling","Say what their artwork shows and why"],"tasks":["Feeling–colour match: which colour is 'happy'?","Same feeling, two materials: paint it, then make it in clay","Imagination jar: draw something that does not exist yet","Gallery guess: what is my friend feeling in this picture?"],"show":["Uses two different materials to show the same feeling","Says 'I chose … because …' about one piece","Guesses a friend's feeling from their artwork and says the clue"],"lessons":[["tune","Thinking routine","See-Think-Wonder with an abstract painting. Responses scribed; focus on 'what does it feel like?'"],["find","Mixed-modal","Hear music → move to it → draw it → talk about it. Three modes, each brief."],["find","Choice board","Three picture options to show 'excited': paint, clay or collage. Pre-select two for children who struggle to choose."],["sort","Creative expression","'Show me what calm looks like.' Process over product, any material."],["share","Performance lesson","Dance a feeling to a group of three, all at once. Applause only."],["reflect","Peer coaching","'Tell your partner one thing you liked about their picture.' Teacher models the words."]],"projects":[{"t":"collage","name":"Feelings collage","what":"An A3 collage of images and own marks for one feeling; every image has a reason.","how":"Pick the feeling → cut → arrange → glue → 'tell me why you chose this one'.","lois":[1,2]},{"t":"talent-show","name":"Feelings showcase","what":"Each child shows one feeling in their chosen art form (dance, song, picture) to families.","how":"Choose the form → practise twice → perform in a group → programme with names.","lois":[3,4],"prev":["K1","Understanding our identity",1]},{"t":"gallery-walk","name":"Class art gallery","what":"A gallery walk of the unit's artwork with green 'I liked…' and yellow 'I wonder…' notes.","how":"Walk in pairs → three stops → one sticky at each → owner reads them.","lois":[4]}]},"K2|Bodies":{"asks":["Name outer and inner body parts","Use the five senses to explore and describe","Notice what bodies can do"],"tasks":["Life-size body outline with labels for outside and inside parts","Senses stations tally: 'I used my …'","Movement challenge cards: can your body balance, twist, jump?"],"show":["Labels six or more body parts including two inside","Matches each sense to its sense organ","Shows and names three movements the body can do"],"lessons":[["tune","Inquiry-driven","Provocation: X-ray images and a stethoscope. Teacher scribes questions; listen to heartbeats."],["find","Stations / Rotations","Senses stations: smell jars, feely bags, sound shakers, magnifiers, safe tasting. Picture-word cards."],["find","PE flow","Tag warm-up → 'what moves?' skill → free exploration → non-competitive game → breathing circle: feel your heart."],["sort","Puzzle-based","Body-part jigsaw: where does it go and why? Solved together on the floor."],["share","I Do → We Do → You Do","Label a body outline: teacher labels two parts, class labels together, then solo with picture cards."],["reflect","Thinking routine","I see / I think / I wonder on a skeleton model."]],"projects":[{"t":"model-building","name":"Inside-outside body model","what":"A life-size outline with organs placed and labelled, inside and outside.","how":"Sketch plan → place organs → label three parts → explain to a partner.","lois":[1,3],"prev":["K1","Understanding our identity",0]},{"t":"mini-ted-talk","name":"My amazing body","what":"A one-minute talk: one idea, one story, one point about what my body can do.","how":"Idea / Story / Point frame → practise with a partner → deliver to the class.","lois":[3]},{"t":"learn-a-skill","name":"Learn a body skill","what":"A three-week skill project (skipping, catching, hopping) with a simple log and before/after photos.","how":"Set the goal → three log entries → show the skill → 'what was hard?'","lois":[3]}]},"K2|Different Cultures":{"asks":["Find places on a map or globe","Compare food, clothes, homes and language","Say what is the same and different, kindly"],"tasks":["Globe stickers: where our families come from","Same / different T-chart with pictures for two cultures","Greeting circle in three languages"],"show":["Points to their home country and one other on a globe","Names two things that differ and one that is the same between two cultures","Greets a friend in another language with respect"],"lessons":[["tune","Concept-first","One suitcase of objects from one culture. 'What do you notice?' Focus on the word 'culture'."],["find","Real-world scenario","'A visitor from Brazil is coming to our class. What should we show them about Japan?' Teacher leads, children contribute."],["find","Stations / Rotations","Music corner, food pictures, flags, dress-up, language cards. Teacher-led rotation."],["sort","Choice board","Three ways to show a culture: draw it, build it, dress it. Short tasks, then share."],["share","Performance lesson","Greeting songs performed to a group of three."],["reflect","Thinking routine","Circle talk: 'I used to think different was… now I think…'"]],"projects":[{"t":"cooking-dish","name":"Family food festival dish","what":"The class makes a simple dish from a family's culture and talks about why people eat it.","how":"Research the dish → discuss where it comes from → make → taste → 'why do people in … eat this?'","lois":[2,3]},{"t":"trading-cards","name":"Country cards","what":"Three cards each: a flag, one food, one word in the language. Class plays snap with the full set.","how":"Research three facts → make cards → class card game.","lois":[1,2]},{"t":"expert-interview","name":"Family culture interview","what":"Pairs ask a family member two questions about their culture; one asks, one draws what they hear.","how":"Prepare questions → agree roles → interview → draw → share.","lois":[2,3],"prev":["K1","Understanding our identity",1]}]},"K2|Storytelling":{"asks":["Name beginning, middle and end, character and setting","Say why a story was told","Tell a story from their own life"],"tasks":["Story map in three boxes for a known tale","'Why this story?' sort: to teach, to make us laugh, to remember","My weekend in three pictures"],"show":["Retells a known story in three pictures, in order","Says what a story teaches or why it is funny","Tells a three-step story about themselves"],"lessons":[["tune","Thinking routine","See-Think-Wonder on a wordless picture-book spread."],["find","I Do → We Do → You Do","Retell with story stones: teacher models two stones, class retells together, pairs retell with support."],["find","Gamification","Story quest: collect a character, a setting and a problem card, then tell it. Stickers, whole-class boss story."],["sort","Creative expression","Tell a story with puppets. Process over product."],["share","Performance lesson","Puppet retell to a small group, all groups at once."],["reflect","Peer coaching","'One thing you liked about my story.' Warm and specific."]],"projects":[{"t":"comic-strip","name":"Three-panel me story","what":"A beginning-middle-end comic of something that really happened to them, with dictated captions.","how":"Tell it aloud → sketch panels → captions → colour → share.","lois":[1,3]},{"t":"skit","name":"Puppet retell with a twist","what":"A small group retells a known tale and changes the ending.","how":"Story arc card → plan → rehearse twice → perform to the class.","lois":[1,2],"prev":["K1","Understanding our identity",1]},{"t":"digital-storybook","name":"My story e-book","what":"Three pages in Book Creator: picture, one sentence and a voice recording per page.","how":"Plan → page by page → record voice → class listens.","lois":[3],"prev":["K1","Homes",2]}]},"K2|Living Things":{"asks":["Sort living and non-living and notice features","Name what plants and animals need","Care for a living thing over time"],"tasks":["Living / non-living sort on a walk outside","Needs wheel: food, water, air, shelter","Care-job chart with stickers for two weeks"],"show":["Sorts ten pictures into living and non-living with a reason","Draws a plant or animal with its four needs","Keeps a care job going for two weeks"],"lessons":[["tune","Inquiry-driven","Snails and seeds on the table. 'What do they need?' Teacher scribes; short guided look with magnifiers."],["find","Experiment lesson","Bean in the cupboard vs bean on the window. Predict with pictures; class chart each week."],["find","Stations / Rotations","Magnifier table, seed sorting, animal-home matching, watering station."],["sort","Concept-first","'Need' vs 'want' for a pet: a water bowl and a bow tie."],["share","Learning journey","Three picture steps: plant → grow → care. Sticker each milestone."],["reflect","Thinking routine","'I used to think seeds… now I think…'"]],"projects":[{"t":"growing-plant","name":"Bean diary","what":"A weekly drawing and height measured in cubes, for one bean each.","how":"Plant → weekly journal entry → compare growth as a class.","lois":[1,2],"prev":["K1","Homes",1]},{"t":"poster","name":"What a pet needs poster","what":"A poster of one animal's four needs with own illustrations and a title.","how":"Planning page → draft → final → simple peer feedback.","lois":[2,3]},{"t":"exhibition-display","name":"Living things station","what":"Small groups host a station for families: a plant, a photo, a 'we learned…' sentence.","how":"Group focus → co-create the display → practise twice → host.","lois":[3],"prev":["K1","Expressing emotions through art",2]}]},"K2|The Scientific Method":{"asks":["Predict, test, then say what happened","Use a magnifier, scale or ruler","Talk about what changed and why"],"tasks":["Float / sink predict-then-test chart","Tool hunt: which tool to look closer, weigh, or measure?","Ice-melt watch: draw it every ten minutes"],"show":["Says a prediction before a test","Uses one tool correctly to observe or measure","Tells what changed using 'because'"],"lessons":[["tune","Puzzle-based","Mystery box: what is inside? Use senses to guess. 'How did you figure that out?'"],["find","Experiment lesson","Float or sink. Picture predictions, observe, teacher records on a class chart."],["find","Stations / Rotations","Magnifiers, balance scale, ramps, colour mixing. Adult at the scale."],["sort","I Do → We Do → You Do","The four steps: ask, guess, test, tell. Teacher models with ice, class repeats with salt."],["share","Build–Test–Improve","A foil boat that holds the most pennies. Test together, one improvement."],["reflect","Thinking routine","I see / I think / I wonder on a melting ice cube."]],"projects":[{"t":"experiment","name":"Which melts first?","what":"A fair test with one variable (sun vs shade) recorded on a picture lab sheet.","how":"Question → prediction → test → 'what I found' in pictures and words.","lois":[1,3],"prev":["K2","Bodies",2]},{"t":"engineering-design","name":"Floating boat challenge","what":"A two-material boat that floats and holds pennies; test, improve, test again.","how":"Draw the design → build → test → improve → present the result.","lois":[2,3]},{"t":"news-broadcast","name":"Science news","what":"A small-group two-minute 'we found out' show with an intro and two stories, filmed on a tablet.","how":"Assign roles → script together → rehearse → film.","lois":[3],"prev":["K2","Bodies",1]}]},"K3|Celebrations":{"asks":["Compare celebrations: food, music, clothes, timing","Explain why a celebration matters to a f const LESSONS=[{"name":"Concept-first","best":"Introducing a new skill, sport, or idea","phases":["tune","find"],"energy":"calm","prep":2,"dur":"30 min","group":"Whole class → pairs","needs":"1–2 clear, concrete examples of the concept in action","scale":["Use one simple physical example. Ask 'what do you notice?'. Focus on one word (e.g. balance). Keep it under 5 minutes before moving.","Show two contrasting examples. Students discuss in pairs and use the concept word in writing or drawing.","Students predict before seeing examples, compare multiple contexts, and start making cross-subject links independently.","Students define the concept themselves before exploring it, apply it across subjects unprompted, and discuss nuance and exceptions."],"pros":["Anchors learning in big ideas","Builds transfer of understanding"],"cons":["Can feel abstract without follow-up","Needs confident facilitation"],"prereqs":["Can listen to a short explanation","Can notice and name what they observe","Some prior experience with the topic"],"pairs":["I Do → We Do → You Do","Thinking routine","Skill ladder"]},{"name":"Inquiry-driven","best":"PYP units, science, social studies","phases":["tune","find","sort"],"energy":"moderate","prep":3,"dur":"45+ min","group":"Mixed","needs":"A strong provocation: video, object, or scenario","scale":["Provocation is hands-on (an object, a visitor). Teacher scribes questions. Investigation is short and guided; sharing is verbal.","Students write questions on post-its. Small-group investigation with support. Findings in drawings or simple notes.","Students choose their path, use mixed sources, record in a structured way, then compare findings across groups.","Students design their own investigation, select sources critically, and present evidence-based conclusions. Teacher is a thinking partner."],"pros":["Students own the direction","Sustains genuine curiosity"],"cons":["Hard to time — can spiral","Needs a flexible teacher stance"],"prereqs":["Can form and ask questions","Can sit with not-knowing","Basic research or observation skills","Some independence in groups"],"pairs":["Thinking routine","Experiment lesson","Learning journey"]},{"name":"I Do → We Do → You Do","best":"Any new technique or strategy","phases":["find","sort"],"energy":"calm","prep":1,"dur":"30 min","group":"Whole class → solo","needs":"A prepared model + 2–3 guided examples","scale":["'I Do' is 1–2 steps. 'We Do' is whole-class together. 'You Do' is a supported attempt with the teacher nearby and lots of narration.","'I Do' includes think-aloud. 'We Do' uses partner work. 'You Do' has a scaffold or prompt card.","Students predict next steps during 'I Do'. 'We Do' is mostly peer-led. 'You Do' adds a challenge extension.","'I Do' is minimal — students question as you model. 'You Do' becomes 'You Do and teach someone else'."],"pros":["Clear scaffolding, low confusion","Works across all age groups"],"cons":["Students passive during 'I Do'","Limits spontaneous agency"],"prereqs":["Can watch and listen attentively","Willing to attempt without full confidence","Basic imitation skills"],"pairs":["Loop lesson","Skill ladder","Stations / Rotations"]},{"name":"Thinking routine","best":"Any subject — building deep thinking habits","phases":["tune","sort","reflect"],"energy":"calm","prep":1,"dur":"15 min","group":"Mixed","needs":"A chosen routine (e.g. See-Think-Wonder)","scale":["See-Think-Wonder with an image or object. Teacher models each step aloud; responses verbal and scribed. Cap at 10 minutes.","Students record their own thinking in a template. Pair-share before whole class. Begin naming the routine.","Students choose where to start the routine, apply it to texts or data, and begin using it independently elsewhere.","Students select the right routine for the task, use it across subjects unprompted, and facilitate it for others."],"pros":["Builds metacognition over time","Works across subjects and ages"],"cons":["Feels mechanical at first","Needs consistent repetition"],"prereqs":["Can slow down and observe","Tolerates open-ended questions","Some vocabulary for thinking and noticing"],"pairs":["Inquiry-driven","Puzzle-based","Concept-first"]},{"name":"Stations / Rotations","best":"Mixed abilities, PE, literacy centres","phases":["find","sort"],"energy":"active","prep":3,"dur":"40 min","group":"Small groups","needs":"4–6 stations with visual instructions","scale":["2–3 stations only, pictorial instructions, an adult at the hardest one. Rotation is teacher-led with a clear signal.","4 stations with picture-word cards. Students manage rotation with a timer. One station is a teacher table.","5–6 stations, students record outcomes, a peer-coaching station, and free revisits when finished early.","Students may design or run a station. Self-directed rotation order, with choice and open challenge built in."],"pros":["High engagement, low wait time","Naturally differentiated"],"cons":["Needs very clear station cards","Hard to monitor every group"],"prereqs":["Can follow visual instructions alone","A transition routine is in place","Can work without constant teacher presence"],"pairs":["Skill ladder","Peer coaching","Choice board"]},{"name":"Skill ladder","best":"PE, sports, literacy, math strategies","phases":["find","sort","share"],"energy":"active","prep":2,"dur":"35 min","group":"Mixed","needs":"Defined levels (0–4) and a self-assessment tool","scale":["Two levels only: 'I'm trying' and 'I can do it'. Teacher assesses verbally. Celebrate all levels. No written self-assessment.","Three levels with picture examples. Thumbs up/sideways/down self-assessment; teacher confirms the next step.","Four levels with written criteria. Students pick their level, practise, move up, and peer-verify.","Students help write the descriptors, track progress over a unit, and set their own next-step goals."],"pros":["Students see their own progress","Builds confidence step by step"],"cons":["Some plateau at Level 1","Descriptors take time to write"],"prereqs":["Can self-assess honestly","Comfortable not being at the top level","Some sense of what improvement looks like"],"pairs":["Loop lesson","Peer coaching","I Do → We Do → You Do"]},{"name":"Peer coaching","best":"PE, writing, presentations","phases":["sort","share","reflect"],"energy":"moderate","prep":1,"dur":"25 min","group":"Pairs","needs":"A simple feedback protocol (e.g. Stars & Steps)","scale":["'Tell your partner one thing you liked.' Warm and specific. Teacher models the language. No written feedback.","Stars and Steps: one positive, one suggestion, on the same task. Sentence starters provided.","Feedback tied to criteria. Students coach on technique, written and verbal, with the coach role rotating.","Students design their own feedback questions, coach across subjects, and spot patterns across observations."],"pros":["Builds empathy and communication","Students internalise criteria"],"cons":["Feedback quality varies widely","Pairs need a clear protocol"],"prereqs":["Psychological safety in the class","Can observe and describe specifically","Some grasp of the success criteria"],"pairs":["Skill ladder","Performance lesson","Creative expression"]},{"name":"Build–Test–Improve","best":"STEM, PE challenges, design tasks","phases":["find","sort","share"],"energy":"buzzing","prep":3,"dur":"50 min","group":"Small groups","needs":"Materials, a testable challenge, and improvement time","scale":["Very open brief ('build something that holds books'). Test together, teacher narrates, one improvement attempt. Celebrate the process.","One constraint. Students draw a plan first, test with a measurement, and do one documented improvement.","2–3 constraints. Plan, test, record data, improve at least twice, with assigned group roles.","Students write their own brief within a theme, run multiple data-driven cycles, and present findings with recommendations."],"pros":["Encourages iteration and resilience","Highly motivating"],"cons":["Time-heavy","Needs clear success criteria upfront"],"prereqs":["Tolerates failure and iteration","Can work collaboratively","Some problem-solving experience"],"pairs":["Experiment lesson","Real-world scenario","Learning journey"]},{"name":"Gamification","best":"PE, math, literacy, languages","phases":["tune","find","sort"],"energy":"buzzing","prep":3,"dur":"40 min","group":"Mixed","needs":"A mission, mini-quests tied to skills, a boss challenge","scale":["Simple quest, stickers as tokens, a fun whole-class boss game. No competitive ranking.","Short mission with team points (not individual), a collaborative boss challenge, and a skills debrief.","Individual and team quests, self-tracked progress, a multi-skill boss challenge, and a learning-focused debrief.","Students co-design quests, add strategy and peer help, and the boss challenge has real stakes (display, performance, contest)."],"pros":["High motivation — practice as play","Reaches reluctant learners"],"cons":["Can prize points over learning","Needs careful design"],"prereqs":["Can follow multi-step instructions","Comfortable winning and losing","Sees points as practice, not worth"],"pairs":["Loop lesson","Stations / Rotations","Skill ladder"]},{"name":"Creative expression","best":"Literacy, arts, PE movement, UOI","phases":["sort","share","reflect"],"energy":"moderate","prep":2,"dur":"40 min","group":"Solo → pairs","needs":"An open concept prompt and time to refine","scale":["Very open prompt ('show me what happy looks like'). Process over product. Share in a circle.","Prompt tied to a concept ('show the idea of change'). Students choose a medium and share briefly.","Plan before creating, expect drafts and refinements, and peer feedback before the final version.","Students choose prompt angle and medium, run a multi-draft critique process, and present an artist's statement."],"pros":["Students internalise through making","Multiple entry points"],"cons":["Assessment can be unclear","Needs a strong focused prompt"],"prereqs":["Comfortable with open tasks","Some experience with the medium","Can make decisions without step-by-step guidance"],"pairs":["Performance lesson","Choice board","Thinking routine"]},{"name":"Choice board","best":"Differentiation, promoting autonomy","phases":["sort","share"],"energy":"moderate","prep":3,"dur":"40 min","group":"Solo","needs":"6–9 well-designed, equally rich task options","scale":["3 picture options; pre-select 2 for those who struggle to choose. Short hands-on tasks, then share.","4–6 options that vary by modality. Pick 2; teacher asks 'why did you choose that?'.","6–9 options across modality and complexity. Do 3 tasks and start noticing your own patterns.","Students contribute task ideas, choose their own number and order, and reflect on what their choices reveal."],"pros":["Supports varied learning styles","Strong student ownership"],"cons":["Planning-heavy to create","Choice can paralyse some"],"prereqs":["Can self-select appropriately","Some awareness of how they learn best","Experience with independent work"],"pairs":["Creative expression","Mixed-modal","Real-world scenario"]},{"name":"Real-world scenario","best":"Math, literacy, UOI","phases":["sort","share"],"energy":"moderate","prep":2,"dur":"45 min","group":"Small groups","needs":"A realistic, age-appropriate scenario with clear constraints","scale":["Very simple, visual scenario ('we're planning a class picnic'). Teacher leads, students contribute, hands-on where possible.","Short written scenario with 1–2 constraints. Groups make one key decision and explain how they decided.","Multiple variables. Students gather information, weigh options, and justify choices; role cards add perspective.","Complex scenario with competing priorities. Research, debate, present solutions, and link to real issues."],"pros":["Makes learning feel relevant","Develops real decision-making"],"cons":["Scenario needs crafting","Can drift off-task"],"prereqs":["Can read and interpret a scenario","Some prior topic knowledge","Can make group decisions"],"pairs":["Build–Test–Improve","Inquiry-driven","Choice board"]},{"name":"PE flow","best":"Any sport or movement unit","phases":["tune","find","sort","reflect"],"energy":"active","prep":1,"dur":"45 min","group":"Mixed","needs":"Warm-up, skill focus, drill, small-sided game, cool-down","scale":["Warm-up is a tag game; skill is one movement; drill is free exploration; game is non-competitive; cool-down is a breathing circle.","Warm-up links to the skill; drill has 2–3 variations; simple-rule game; cool-down adds one reflection question.","Students can lead warm-up; drill includes peer coaching; the game has tactics; cool-down uses a thinking routine.","Students adapt the drill; tactical self-officiated game; debrief connects to ATL skills and improvement goals."],"pros":["Predictable and efficient","Works at any level or sport"],"cons":["Repetitive over many lessons","Limited room for inquiry"],"prereqs":["Can follow routine transitions","Listens in an active space","Safe movement habits"],"pairs":["Skill ladder","Loop lesson","Peer coaching"]},{"name":"Chunked micro-lessons","best":"Short attention spans, mixed levels","phases":["tune","find","sort","reflect"],"energy":"moderate","prep":2,"dur":"25 min","group":"Mixed","needs":"4 × 5-min blocks, each with a clear standalone focus","scale":["3 chunks of 4–5 min, each a different type (move, make, talk), with very clear signals and a settling finish.","4 chunks each with a brief output (a word, drawing, gesture) that loosely build on each other.","4–5 chunks of rising complexity; students predict chunk 4 after chunk 2; the final chunk synthesises.","Students design their own micro-lesson sequence to teach a partner and reflect on what order worked."],"pros":["Fast pace holds focus","Transitions are natural breaks"],"cons":["Less depth per chunk","Transitions can eat time"],"prereqs":["Can transition quickly","Can engage in 5-minute bursts","Follows multi-step sequences"],"pairs":["Mixed-modal","Loop lesson","Thinking routine"]},{"name":"Loop lesson","best":"Fluency building in any subject","phases":["sort","share"],"energy":"active","prep":1,"dur":"20 min","group":"Mixed","needs":"A core skill + 3–4 variations or added challenges","scale":["Repeat one simple action with different props or partners. Enjoyment and rhythm over precision. Three loops max.","Repeat with one new variable each loop (speed, direction, partner); students name what changed. Four loops.","Students choose the next variable; peer observation between loops; a mini-performance after five loops.","Students design the loop for a partner, add pressure (audience, time), and analyse what made the last loop best."],"pros":["Repetition without boredom","Builds automaticity"],"cons":["Not for new learning","Monotonous if poorly varied"],"prereqs":["Already has a basic grasp of the skill","Tolerates repetition","Can self-monitor quality"],"pairs":["Skill ladder","PE flow","Gamification"]},{"name":"Performance lesson","best":"Literacy, arts, PE showcases","phases":["share","reflect"],"energy":"buzzing","prep":2,"dur":"40 min","group":"Small groups","needs":"Practice time, a real or peer audience, and a feedback structure","scale":["Perform to a soft toy or group of three, all at once so no one is singled out. Applause, no critique.","Half perform, half give one warm comment, then switch. Simple feedback: 'I noticed…'","Groups perform to the class with criteria-based peer feedback; set one goal before performing.","Solo or group to an external/mixed audience; self-assess against criteria before and after; written reflection."],"pros":["Builds confidence and communication","Authentic audience lifts effort"],"cons":["High anxiety for some","Requires rehearsal time"],"prereqs":["Basic comfort performing to peers","Has practised the content","Understands audience behaviour"],"pairs":["Creative expression","Peer coaching","Skill ladder"]},{"name":"Mixed-modal","best":"Diverse learners, high engagement","phases":["tune","find","sort"],"energy":"active","prep":3,"dur":"35 min","group":"Mixed","needs":"Movement, visual, verbal, and hands-on tasks in sequence","scale":["3 modes only (move, draw, talk), each brief, with the teacher linking them: 'now the same idea a different way'.","4 modes with a simple output in each, then 'which helped you understand best and why?'.","Students predict which mode suits them, then reflect — starting to see their strengths and preferences.","Students design a mini mixed-modal sequence, justify their mode choices, teach it, and evaluate it."],"pros":["Hits multiple learning pathways","Inclusive by design"],"cons":["Complex to plan well","Tasks must be equally rich"],"prereqs":["Can switch between task types","Some experience with each mode","Independence within each task"],"pairs":["Chunked micro-lessons","Choice board","Thinking routine"]},{"name":"Learning journey","best":"Multi-step skills, long projects","phases":["find","sort","share","reflect"],"energy":"calm","prep":3,"dur":"Multi-lesson","group":"Mixed","needs":"A visual timeline with clear milestones and checkpoints","scale":["3 picture steps on a wall; students move a peg or sticker each step; a milestone is a short share.","5-step journey in the room; colour or stamp each milestone; checkpoints are teacher conversations.","Students track in a booklet with self- and peer-check at checkpoints, ending in a real endpoint (e.g. exhibition).","Students co-design the journey map, set personal milestones within it, and reflect on what helped or hindered."],"pros":["Makes progress visible","Good for self-regulation"],"cons":["Needs upfront planning","Hard to adjust mid-unit"],"prereqs":["Can work toward a longer goal","Basic self-monitoring","Some project or unit experience"],"pairs":["Inquiry-driven","Build–Test–Improve","Skill ladder"]},{"name":"Experiment lesson","best":"Science, movement, inquiry","phases":["find","sort"],"energy":"active","prep":3,"dur":"45 min","group":"Small groups","needs":"A hypothesis template, materials, and a recording sheet","scale":["Predict with pictures ('float or sink?'). Observe, say what happened; teacher records on a class chart. No writing.","One-sentence hypothesis, recorded in pictures and words; compare predictions to results as a class.","Hypothesis–method–results–conclusion; change one variable; compare with another group's results.","Full method with student-designed controls; evaluate reliability of results and suggest improvements."],"pros":["Students learn through evidence","High curiosity and ownership"],"cons":["Materials can be hard to source","Results vary unpredictably"],"prereqs":["Can form a simple prediction","Basic recording skills","Safe with materials","Patient with process"],"pairs":["Inquiry-driven","Build–Test–Improve","Thinking routine"]},{"name":"Puzzle-based","best":"Critical thinking, literacy, math","phases":["tune","find","reflect"],"energy":"moderate","prep":1,"dur":"25 min","group":"Solo → pairs","needs":"A well-levelled puzzle with several possible strategies","scale":["Concrete puzzle (physical pieces, matching, sorting), solved together. Focus on 'how did you figure that out?'.","Pairs solve a simple logic or pattern puzzle and share strategies, not just answers ('what did you try first?').","Individual attempt then pair comparison; explain the strategy in writing; discuss why strategies do or don't work.","Open puzzles with multiple valid solutions; evaluate strategies for efficiency; create a puzzle for a peer."],"pros":["Builds metacognition strongly","High curiosity and engagement"],"cons":["Frustrating if too hard","Needs a low-stakes culture"],"prereqs":["Tolerates productive struggle","Will try more than one strategy","Basic 'I tried… then I…' vocabulary"],"pairs":["Thinking routine","Inquiry-driven","Mixed-modal"]}];

const CUR={"Grade 2|Storytelling":{"name":"Fable from a new perspective","t":["comic-strip","skit","musical"],"lois":[1,2,3],"covers":[0,1,2],"what":"Students rewrite a fable from a different character's point of view, then tell it in a mode they choose: puppet show, kamishibai, musical, readers' theatre, comic and more.","how":"Read and map the fable → choose the new narrator → rewrite with a clear structure → choose the mode → rehearse or draft → perform or publish to the class.","fit":"Strong fit. The perspective rewrite serves line 2 directly, the structure work serves line 1, and the free choice of mode is line 3 in action. All three success criteria are met by one product.","strengths":["Student choice of mode gives real agency and natural differentiation by product","Kamishibai and puppet show connect to Japanese storytelling culture","Combines a writing product with a performance, so two ATL clusters are assessed"],"watch":["Mode choice can swallow the writing: lock the rewritten text before any making begins","Groups choosing a musical or puppet show need more time than comic makers, so set one shared deadline for the text and a second for the performance","Keep the retell recognisably the same fable; the change is who tells it, not what happens"],"stretch":["Ask each group to state one thing the new narrator knows that the original did not","Pair performers with an audience from Grade 1 and collect one 'I noticed' comment each"]},"Grade 2|Role-models":{"name":"Role model poster on Canva","t":["canva-infographic","poster"],"lois":[1,3],"covers":[0,2],"what":"A Canva poster about a role model from the Little People, BIG DREAMS series: who they are, the traits that make them a role model, and how they influence us.","how":"Read the biography → trait hunt with evidence → plan the poster in sections → build on Canva with a clear hierarchy → present in one minute to a partner.","fit":"Good fit for lines 1 and 3. Line 2 (our own choices and actions shape who we become) is not in the product, so pair the poster with a short personal reflection or the goal-setting task.","strengths":["Picture-book biographies give accessible, real evidence for traits","Canva teaches layout and hierarchy early, which later units reuse","A single shared series makes peer comparison across posters easy"],"watch":["Canva's templates can produce decoration without thinking: require one evidence quote from the book per trait","Limit the palette and fonts to two each so the message leads","Avoid copying the book's illustrations; students draw or use Canva's own elements"],"stretch":["Add a 'what I will try' box that answers line 2","Letter to the role model (the suggested project) as a follow-on writing task"]},"Grade 2|Electricity":{"name":"Invention poster","t":["invention-prototype","poster"],"lois":[1,2,3],"covers":[0,1,2],"what":"Students design an invention, connect its electrical functions (light, sound, movement, heat) and decide which parts need to be powered and how.","how":"Spot a problem → brainstorm functions → sort which need electricity → draw the invention with labelled powered parts and a source → explain the circuit path → present.","fit":"Good fit for lines 2 and 3, and line 1 if the source of power is named on every poster. The unit check asks for a working circuit with a switch; add a built circuit or a tested component so the poster is not only a drawing.","strengths":["Connects function to need, which is the heart of the central idea","Open problem choice keeps motivation high","Prepares the thinking for Grade 3 Innovations"],"watch":["Without a built element the poster stays theoretical: insist on one working circuit per group, even if only the light","Check that every powered part has a named source and a switch drawn in","Sort functions that need electricity from those that do not before drawing, or everything gets a battery"],"stretch":["Build the simplest part of the invention as a real circuit and photograph it onto the poster","Add a renewable or battery choice with one reason"]},"Grade 2|Plants":{"name":"Useful plant brochure","t":["brochure"],"lois":[1,3],"covers":[0,2],"what":"A trifold brochure about one plant and how people use it: for food, medicine, culture, home or decoration, with its parts and how people should care for it.","how":"Choose a plant and a use → research three facts → plan six panels → design with headings and labelled parts → check facts with a partner → final copy.","fit":"Strong fit for line 3 and solid for line 1 if parts and their functions appear. Line 2 (growth and change) is missing from the product, so keep the bean diary or growth graph running alongside.","strengths":["The use categories (food, medicine, culture, decor) make the central idea concrete","Brochure panels force concise, organised writing","Easy to differentiate by the number of panels and research depth"],"watch":["Research must be checked: a plant's medicinal use is an easy place for wrong facts","Insist on a labelled parts panel so line 1 is assessed","Pair the brochure with live growth data from the class plants so line 2 is not lost"],"stretch":["Add a 'how people's actions affect this plant' panel for the responsibility concept","Display brochures beside the real plant where possible"]},"Grade 2|Landmarks":{"name":"Landmark pop-up book","t":["writing-a-book","model-building"],"lois":[1,2],"covers":[0,1],"what":"A pop-up book about a given landmark: its features and purpose, the community and culture it connects, and why people visit.","how":"Research the landmark → plan pages → write text first → engineer the pop-up mechanisms → assemble → read to a partner.","fit":"Strong fit for lines 1 and 2. Line 3 (different perspectives) needs a page: a visitor's view and a local's view of the same landmark, or a page about why someone might see it differently.","strengths":["Paper engineering is hands-on and memorable","Text and model in one object","Reads well to younger students, giving a real audience"],"watch":["Pop-up mechanics eat time: teach two mechanisms only and give templates","Text must be drafted before any cutting begins","Assigned landmarks keep research fair, but let students choose the page order and design"],"stretch":["Add a 'two views' page to serve line 3","Library display with a QR code to a recorded reading"]},"Grade 2|Services":{"name":"Skill showcase mock exhibition","t":["exhibition-display","teach-the-class"],"lois":[1,2,3],"covers":[0,1,2],"what":"Groups choose a skill to showcase, such as Scratch coding, a cardboard city or teaching a sport, and present it to peers in a mock exhibition. The focus is on roles, following steps and showcasing.","how":"Form groups → choose the skill → assign roles → write the steps → make or practise → set up a station → showcase to peers → reflect on how the group worked.","fit":"Strong fit. Roles are line 2, the steps are line 3 (systems), and the showcase makes individual contribution visible for line 1. It also rehearses the Grade 5 Exhibition format early.","strengths":["Any skill works, so every child can lead something","Roles and steps are explicit, which makes group function assessable","Showcasing to peers gives an authentic audience and feedback"],"watch":["Keep the assessment on how the group worked, not how impressive the skill is","Role cards should rotate at least once so no one is stuck as 'materials person'","Groups need a visible step list and a checkpoint halfway, or the showcase becomes a rush"],"stretch":["Visitors leave one 'I noticed a good team move' note per station","Each group writes the system that helped them most and one that did not"]}};
const KC=["form","function","causation","change","connection","perspective","responsibility"];
