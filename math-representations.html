<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maths Representations</title>
<meta name="description" content="Interactive maths problem solving with counters, arrays, ten frames, number shapes, rods, base ten, bead strings, number lines, bar models and part-whole models.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Lexend:wght@400;500;600;700&display=swap">
<style>

/* Layout: a workbench — the question and a big hands-on board on the left, a tool rail on the right. */
:root{
  --bg:#f2f5f9; --panel:#ffffff; --ink:#1b2838; --muted:#5d6b7d; --line:#dce4ee;
  --a:#2f6fdb; --b:#ef8424; --x:#c4ccd7; --chip:#e6ecf4; --good:#1f9d55; --bad:#d9534f;
  --f-display:"Bricolage Grotesque", "Arial Rounded MT Bold", system-ui, sans-serif;
  --f-ui:"Lexend", system-ui, -apple-system, sans-serif;
  --grid-img:none;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111823; --panel:#18212e; --ink:#e8eef6; --muted:#97a5b8; --line:#253244;
  --a:#6ea4ff; --b:#ffab5e; --x:#3a475a; --chip:#1f2a39; --good:#4ccf84; --bad:#ff7a76; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111823; --panel:#18212e; --ink:#e8eef6; --muted:#97a5b8; --line:#253244;
  --a:#6ea4ff; --b:#ffab5e; --x:#3a475a; --chip:#1f2a39; --good:#4ccf84; --bad:#ff7a76; color-scheme:dark }
:root[data-skin="chalk"]{ --bg:#22352b; --panel:#2a3f34; --ink:#f3f4e9; --muted:#aebca8; --line:#34503f;
  --a:#fff6cf; --b:#ffafc5; --x:#4c6656; --chip:#2f4739; --good:#8fe3a8; --bad:#ff9a96; color-scheme:dark; --grid-img:none }
:root[data-skin="graph"]{ --bg:#fbfdff; --panel:#ffffff; --ink:#16314c; --muted:#59718b; --line:#cfe0f3;
  --a:#1f6feb; --b:#e5484d; --x:#c8d4e2; --chip:#e9f1fb; --good:#1f9d55; --bad:#d9534f; color-scheme:light;
  --grid-img:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px) }
:root[data-skin="midnight"]{ --bg:#0b0d1a; --panel:#141830; --ink:#ebe9ff; --muted:#9a98c4; --line:#22284a;
  --a:#8f80ff; --b:#33d6b6; --x:#2c3155; --chip:#1b2040; --good:#5de0a0; --bad:#ff8585; color-scheme:dark; --grid-img:none }
:root[data-skin="sunset"]{ --bg:#fff0e4; --panel:#fff8f2; --ink:#4a1e18; --muted:#8a5a4c; --line:#f2d6c3;
  --a:#df532a; --b:#7a3cbd; --x:#e7cbbb; --chip:#fbe2d2; --good:#2a8f4e; --bad:#c8402f; color-scheme:light; --grid-img:none }
:root[data-skin="ocean"]{ --bg:#052a33; --panel:#0a3641; --ink:#def6f5; --muted:#8dbcc0; --line:#0f4552;
  --a:#47d2c9; --b:#ffcf61; --x:#1d5562; --chip:#0e4250; --good:#7ae6a6; --bad:#ff9790; color-scheme:dark; --grid-img:none }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0; background:var(--bg); background-image:var(--grid-img); background-size:28px 28px; color:var(--ink);
  font-family:var(--f-ui); font-size:15px; overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px));}
button,input,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--a); outline-offset:2px}

.app{height:100%; display:grid; grid-template-rows:auto 1fr; gap:12px; padding-block:12px}
.bar{display:flex; flex-wrap:wrap; align-items:center; gap:8px 16px}
.brand .back{text-decoration:none; color:var(--muted); margin-right:6px; font-weight:500}
.brand{font-family:var(--f-display); font-weight:800; font-size:1.3rem; letter-spacing:-.01em; margin-right:auto}
.group{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.lbl{font-size:.68rem; text-transform:uppercase; letter-spacing:.09em; color:var(--muted); margin-right:2px; font-weight:600}
.op{width:40px; height:40px; border-radius:10px; border:2px solid var(--line); background:var(--panel);
  font-family:var(--f-display); font-weight:800; font-size:1.3rem; line-height:1}
.op[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
select{height:40px; border-radius:10px; border:2px solid var(--line); background:var(--panel); padding:0 8px}
.swatch{width:26px; height:26px; border-radius:50%; border:2px solid var(--line); padding:0; position:relative; overflow:hidden}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.swatch i{position:absolute; inset:0}
.go{height:40px; padding:0 16px; border-radius:10px; border:0; background:var(--a); color:var(--bg); font-weight:700}
.ghost{height:40px; padding:0 12px; border-radius:10px; border:2px solid var(--line); background:var(--panel); font-weight:600}
.ghost[aria-pressed="true"]{border-color:var(--a); color:var(--a)}

main{min-height:0; display:grid; grid-template-columns:minmax(0,1fr) 300px; gap:18px}
.stage{min-height:0; min-width:0; display:grid; grid-template-rows:auto auto 1fr auto; gap:10px}
.qrow{display:flex; flex-wrap:wrap; align-items:center; gap:12px 24px}
.question{font-family:var(--f-display); font-weight:800; font-size:clamp(2.4rem, 7vmin, 5.4rem); line-height:1;
  display:flex; gap:.24em; align-items:center; letter-spacing:-.02em; font-variant-numeric:tabular-nums}
.question .sym{color:var(--muted); font-weight:500}
.slot{width:2.2ch; min-width:2.2ch; height:1.15em; border:3px dashed var(--muted); border-radius:.18em; background:var(--panel);
  text-align:center; font:inherit; font-weight:800; color:var(--a); padding:0; -moz-appearance:textfield}
.slot::-webkit-outer-spin-button,.slot::-webkit-inner-spin-button{-webkit-appearance:none}
.slot:focus{border-style:solid; border-color:var(--a); outline:none}
.slot.ok{border-style:solid; border-color:var(--good); color:var(--good); animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.slot.no{border-color:var(--bad); animation:shake .4s}
@keyframes pop{from{transform:scale(.6)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.qbtns{display:flex; gap:6px; flex-wrap:wrap}
.free .question,.free #showBtn,.free #revealBtn,.free #checkBtn{display:none}
.feedback{min-height:1.5em; font-size:clamp(.95rem,2.2vmin,1.2rem); color:var(--muted); text-wrap:balance}
.feedback.ok{color:var(--good); font-weight:600}
.feedback.no{color:var(--bad)}
.board{min-height:0; position:relative; background:var(--panel); border:2px solid var(--line); border-radius:18px; overflow:hidden}
.board.wait{display:grid; place-items:center; border-style:dashed}
.waitMsg{text-align:center; color:var(--muted); font-size:clamp(1rem,2.6vmin,1.4rem); max-width:32ch; text-wrap:balance; padding:16px}
.waitMsg b{color:var(--ink)}
.waitMsg .go{margin-top:14px; display:inline-block}
.board svg{width:100%; height:100%; display:block; touch-action:none; user-select:none; -webkit-user-select:none}
.board [data-id]{cursor:grab}
.board .tap{cursor:pointer}
.readout{display:flex; flex-wrap:wrap; align-items:baseline; gap:6px 18px; font-size:clamp(.95rem,2.3vmin,1.25rem); color:var(--muted); min-height:1.6em}
.readout b{color:var(--ink); font-family:var(--f-display); font-weight:800; font-size:1.25em}
.readout .big{color:var(--a)}

.rail{min-height:0; display:flex; flex-direction:column; gap:12px; overflow-y:auto; padding-right:2px}
.rail h2{font-family:var(--f-display); font-size:.78rem; text-transform:uppercase; letter-spacing:.1em; color:var(--muted); margin:0 0 6px; font-weight:800}
.picker{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.picker button{height:40px; border-radius:10px; border:2px solid var(--line); background:var(--panel); font-weight:600; font-size:.85rem; text-align:left; padding:0 10px}
.picker button.best::after{content:"★"; margin-left:auto; color:var(--b); font-size:.9rem}
.picker button{display:flex; align-items:center; gap:6px}
.picker button[aria-pressed="true"]{border-color:var(--a); background:var(--a); color:var(--bg)}
.tools{display:flex; flex-direction:column; gap:10px}
.tgrp{display:flex; flex-wrap:wrap; gap:5px; align-items:center}
.tl{width:100%; font-size:.72rem; color:var(--muted); font-weight:600; margin-bottom:-1px}
.tools button{height:36px; padding:0 11px; border-radius:999px; border:2px solid var(--line); background:var(--panel); font-weight:600; font-size:.85rem; display:inline-flex; align-items:center; gap:6px}
.tools button[aria-pressed="true"]{border-color:var(--ink); background:var(--ink); color:var(--bg)}
.tools button.pal{min-width:36px; justify-content:center; padding:0 8px; font-family:var(--f-display); font-weight:800; border-color:rgba(0,0,0,.18); color:#1b2a31}
.tools button.warn{color:var(--bad)}
.sw{width:14px; height:14px; border-radius:50%; display:inline-block; border:1.5px solid rgba(0,0,0,.25)}
.score{display:flex; gap:14px; font-size:.85rem; color:var(--muted)}
.score b{color:var(--ink); font-family:var(--f-display); font-size:1.2rem; font-weight:800}
.blurb{font-size:.82rem; color:var(--muted); line-height:1.4}

/* HTML models: bar model and part–whole */
.bm{position:absolute; inset:0; padding:clamp(12px,3vmin,28px); display:flex; flex-direction:column; justify-content:center; gap:clamp(12px,4vmin,34px)}
.bm-row{display:flex; align-items:center; gap:12px}
.bm-lab{width:70px; flex:none; font-size:.78rem; text-transform:uppercase; letter-spacing:.08em; color:var(--muted); font-weight:700}
.barline{flex:1; display:flex; min-width:0; height:clamp(64px,14vmin,110px)}
.box{position:relative; display:grid; place-items:center; border:3px solid var(--ink); background:#cfe8dc; min-width:54px; flex:1 1 0; margin-right:-3px}
.box.alt{background:#f9e3b5}
.box.whole{background:#cfe8dc; flex:1 1 100%}
.box.gap{background:transparent; border-style:dashed; color:var(--muted)}
.box input{width:100%; height:100%; border:0; background:transparent; text-align:center; font-family:var(--f-display); font-weight:800;
  font-size:clamp(1.3rem,4.5vmin,2.6rem); color:#1b2a31; -moz-appearance:textfield; padding:0}
.box.gap input,.box.gap span{color:var(--muted)}
.box input::-webkit-outer-spin-button,.box input::-webkit-inner-spin-button{-webkit-appearance:none}
.box input::placeholder{color:#7a8a80}
.box .rm{position:absolute; top:-10px; right:-6px; width:22px; height:22px; border-radius:50%; border:2px solid var(--ink); background:var(--panel); font-size:.8rem; line-height:1; padding:0; z-index:2}
.pw{position:absolute; inset:0; padding:clamp(12px,3vmin,24px); display:flex; flex-direction:column; align-items:center; justify-content:space-between}
.pw svg.links{position:absolute; inset:0; width:100%; height:100%; pointer-events:none}
.circ{position:relative; width:clamp(84px,19vmin,150px); height:clamp(84px,19vmin,150px); border-radius:50%; border:3px solid var(--ink); background:#cfe8dc; display:grid; place-items:center}
.circ.alt{background:#f9e3b5}
.circ.whole{width:clamp(104px,24vmin,180px); height:clamp(104px,24vmin,180px)}
.circ input{width:80%; border:0; background:transparent; text-align:center; font-family:var(--f-display); font-weight:800; font-size:clamp(1.4rem,5vmin,2.8rem); color:#1b2a31; -moz-appearance:textfield; padding:0}
.circ input::-webkit-outer-spin-button,.circ input::-webkit-inner-spin-button{-webkit-appearance:none}
.circ input::placeholder{color:#7a8a80}
.circ .rm{position:absolute; top:2px; right:2px; width:22px; height:22px; border-radius:50%; border:2px solid var(--ink); background:var(--panel); font-size:.8rem; line-height:1; padding:0}
.pw-parts{display:flex; gap:clamp(10px,3vmin,28px); flex-wrap:wrap; justify-content:center}

/* svg theme classes */
.fi{fill:var(--ink)} .si{stroke:var(--ink)} .fm{fill:var(--muted)} .sm{stroke:var(--muted)} .sl{stroke:var(--line)} .fl{fill:var(--line)}
.fa{fill:var(--a)} .sa{stroke:var(--a)} .fb{fill:var(--b)} .sb{stroke:var(--b)} .fp{fill:var(--panel)} .sp{stroke:var(--panel)} .fx{fill:var(--x)}
.fnt{font-family:var(--f-display); font-weight:800}
.fnu{font-family:var(--f-ui); font-weight:600}
.pc{animation:dotIn .3s backwards ease-out; transform-box:fill-box; transform-origin:center}
@keyframes dotIn{from{transform:scale(0); opacity:0}}
@media (prefers-reduced-motion:reduce){ .pc,.slot.ok,.slot.no{animation:none} }

@media (max-width:860px){
  body{overflow:auto}
  .app{height:auto; min-height:100%}
  main{grid-template-columns:minmax(0,1fr)}
  .stage{grid-template-rows:auto auto auto auto}
  .board{aspect-ratio:5/3; max-width:100%}
  .rail{overflow:visible}
}
</style>
</head>
<body>

<div class="app">
  <header class="bar">
    <div class="brand"><a href="index.html" class="back" title="Back to the toolkit">←</a> Maths Representations</div>
    <div class="group" role="group" aria-label="Operations">
      <span class="lbl">Include</span>
      <button class="op" data-op="add" aria-pressed="true" title="Addition">+</button>
      <button class="op" data-op="sub" aria-pressed="true" title="Subtraction">−</button>
      <button class="op" data-op="mul" aria-pressed="true" title="Multiplication">×</button>
      <button class="op" data-op="div" aria-pressed="true" title="Division">÷</button>
    </div>
    <div class="group">
      <label class="lbl" for="range">+ −</label>
      <select id="range"><option value="20">Up to 20</option><option value="100">Up to 100</option><option value="b10">Bonds of 10</option><option value="w10">Bonds within 10</option><option value="b100">Bonds of 100</option><option value="w100">Bonds within 100</option></select>
      <label class="lbl" for="max">× ÷ up to</label>
      <select id="max"><option value="5">5</option><option value="10" selected>10</option><option value="12">12</option></select>
    </div>
    <div class="group" role="group" aria-label="Color theme" id="skins"><span class="lbl">Theme</span></div>
    <div class="group">
      <button class="ghost" id="autoBtn" aria-pressed="true" title="Switch to the model that shows each new question best">Pick model for me</button>
      <button class="ghost" id="freeBtn" aria-pressed="false">Free play</button>
      <button class="go" id="newBtn">New question</button>
    </div>
  </header>

  <main>
    <section class="stage">
      <div class="qrow">
        <div class="question" id="q"></div>
        <div class="qbtns">
          <button class="go" id="checkBtn">Check</button>
          <button class="ghost" id="showBtn">Show me</button>
          <button class="ghost" id="revealBtn">Reveal</button>
        </div>
      </div>
      <div class="feedback" id="fb" aria-live="polite"></div>
      <div class="board" id="board"></div>
      <div class="readout" id="readout" aria-live="polite"></div>
    </section>

    <aside class="rail">
      <div>
        <h2>Model</h2>
        <div class="picker" id="picker"></div>
      </div>
      <div>
        <h2>Tools</h2>
        <div class="tools" id="tools"></div>
      </div>
      <div class="tools"><div class="tgrp">
        <button id="undoBtn">↶ Undo</button>
        <button id="clearBtn" class="warn">Clear board</button>
      </div></div>
      <div class="blurb" id="blurb"></div>
      <div class="score"><span>Solved <b id="solved">0</b></span><span>Streak <b id="streak">0</b></span><span>Best <b id="best">0</b></span></div>
      <div class="blurb">Enter checks your answer · N new question · Ctrl/⌘ Z undo</div>
    </aside>
  </main>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
const rnd = (a,b) => a + Math.floor(Math.random()*(b-a+1));
const KEY = 'mathsRepresentations.v1';
const W = 1000, H = 600;
const SYM = {add:'+', sub:'−', mul:'×', div:'÷'};
const CTR = {a:'#e04848', b:'#f5c542', x:'#9aa5b1'};
const SHAPE_COL = ['','#9aa5b1','#f28c8c','#7cc6a4','#f5c451','#6c9ee8','#b48ad8','#f39c5a','#4fb3bf','#d7739f','#5a8a3c'];
const ROD_COL = ['','#f4f1ea','#e03c31','#7fc97f','#8e5cc2','#f2d43d','#1f7a3d','#2b2b2b','#8b5a2b','#2f6fd1','#f08a24'];
const WOOD = ['#e9b949','#f3d27a','#c9971f'];
const shade = (hex,p) => { const n=parseInt(hex.slice(1),16); const r=n>>16,g=n>>8&255,b=n&255; const f=x=>Math.round(p<0?x*(1+p):x+(255-x)*p); return `rgb(${f(r)},${f(g)},${f(b)})`; };
const SKINS = [
  {id:'auto', name:'Match my device', c:['#f2f5f9','#111823']},
  {id:'chalk', name:'Chalkboard', c:['#22352b','#fff6cf']},
  {id:'graph', name:'Graph paper', c:['#fbfdff','#1f6feb']},
  {id:'sunset', name:'Sunset', c:['#fff0e4','#df532a']},
  {id:'ocean', name:'Ocean', c:['#052a33','#47d2c9']},
  {id:'midnight', name:'Midnight', c:['#0b0d1a','#8f80ff']},
];

let S = {ops:{add:true,sub:true,mul:true,div:true}, max:10, range:'20', model:'counters', skin:'auto', solved:0, streak:0, best:0, auto:true};
try { const sv = JSON.parse(localStorage.getItem(KEY)); if (sv) Object.assign(S, sv); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

/* ---------- settings ---------- */
document.querySelectorAll('.op').forEach(b => {
  b.setAttribute('aria-pressed', S.ops[b.dataset.op]);
  b.onclick = () => {
    const on = !S.ops[b.dataset.op];
    if (!on && Object.values(S.ops).filter(Boolean).length === 1) return;
    S.ops[b.dataset.op] = on; b.setAttribute('aria-pressed', on); save(); newProblem();
  };
});
$('max').value = S.max; $('range').value = S.range;
$('range').onchange = e => { S.range = e.target.value; save(); newProblem(); };
$('max').onchange = e => { S.max = +e.target.value; save(); newProblem(); };
const skinBox = $('skins');
SKINS.forEach(k => {
  const b = document.createElement('button');
  b.className = 'swatch'; b.id = 'skin-' + k.id; b.title = k.name; b.setAttribute('aria-label', k.name);
  b.innerHTML = `<i style="background:linear-gradient(135deg, ${k.c[0]} 50%, ${k.c[1]} 50%)"></i>`;
  b.onclick = () => { S.skin = k.id; applySkin(); save(); };
  skinBox.appendChild(b);
});
function applySkin(){
  if (S.skin === 'auto') document.documentElement.removeAttribute('data-skin');
  else document.documentElement.setAttribute('data-skin', S.skin);
  skinBox.querySelectorAll('.swatch').forEach(b => b.setAttribute('aria-pressed', b.id === 'skin-' + S.skin));
}
applySkin();

/* ---------- problems ---------- */
let last = '';
function makeProblem(){
  const ops = Object.keys(S.ops).filter(k => S.ops[k]);
  const m = S.max; let p;
  for (let tries = 0; tries < 20; tries++){
    const op = ops[rnd(0, ops.length-1)];
    const R = S.range;
    if (op==='add' || op==='sub'){
      if (R[0]==='b' || R[0]==='w'){
        const top = R.endsWith('100') ? 100 : 10;
        const T = R[0]==='b' ? top : rnd(2, top);
        const a = rnd(1, T-1);
        const hide = Math.random() < .5;
        if (op==='add') p = {op, a, b:T-a, ans:T, missing:hide};
        else p = {op, a:T, b:a, ans:T-a, missing:hide};
      } else {
        const T = R==='100' ? 100 : 20;
        if (op==='add'){ const a=rnd(1,T-1), b=rnd(1,T-a); p={op,a,b,ans:a+b}; }
        else { const a=rnd(2,T), b=rnd(1,a-1); p={op,a,b,ans:a-b}; }
      }
    }
    if (op==='mul'){ const a=rnd(1,m), b=rnd(1,m); p={op,a,b,ans:a*b}; }
    if (op==='div'){ const d=rnd(1,m), q=rnd(1,m); p={op,a:d*q,b:d,ans:q}; }
    const key = p.op+p.a+','+p.b; if (key !== last){ last = key; break; }
  }
  return p;
}
function hintFor(p){
  if (p.missing) return p.op==='add' ? `Start with ${p.a}. How many more do you need to reach ${p.ans}?` : `${p.a} take away how many leaves ${p.ans}?`;
  return {
    add:`Build ${p.a}, then add ${p.b} more. Count them all.`,
    sub:`Build ${p.a}, then take ${p.b} away. Count what is left.`,
    mul:`Make ${p.a} groups with ${p.b} in each. Count them all.`,
    div:`Share ${p.a} into ${p.b} equal groups. How many in each group?`,
  }[p.op];
}
/* groups: what each part of the model shows; cells carry the colour of every unit */
function groupsFor(p){
  const fill = (n,k) => Array(n).fill(k);
  const alt = (count,size) => { const g=[]; for (let i=0;i<count;i++) g.push({n:size, cells:fill(size, i%2?'b':'a')}); return g; };
  const whole = gs => ({n:gs.reduce((s,g)=>s+g.n,0), cells:gs.flatMap(g=>g.cells)});
  if (p.op==='add'){ const top=[{n:p.a,cells:fill(p.a,'a')},{n:p.b,cells:fill(p.b,'b')}]; return {top, bot:[whole(top)]}; }
  if (p.op==='sub'){ const bot=[{n:p.ans,cells:fill(p.ans,'a')},{n:p.b,cells:fill(p.b,'x')}]; return {top:[{n:p.a,cells:fill(p.a,'a')}], bot}; }
  if (p.op==='mul'){ const top=alt(p.a,p.b); return {top, bot:[whole(top)]}; }
  const bot=alt(p.b,p.ans); return {top:[whole(bot)], bot};
}
/* the groups that best explain the problem on a "show me" */
const showGroups = p => { const G = groupsFor(p); return (p.op==='add'||p.op==='mul') ? G.top : G.bot; };
const partsFor = p => p.op==='add' ? [p.a,p.b] : p.op==='sub' ? [p.ans,p.b] : p.op==='mul' ? Array(p.a).fill(p.b) : Array(p.b).fill(p.ans);
const wholeFor = p => (p.op==='add'||p.op==='mul') ? p.ans : p.a;

/* ---------- board infrastructure ---------- */
const board = $('board'); let svg = null;
function newSVG(extra=''){
  board.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" ${extra}></svg>`;
  svg = board.firstElementChild; return svg;
}
function pt(ev){ const p = svg.createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY; return p.matrixTransform(svg.getScreenCTM().inverse()); }
/* drag/tap on [data-id] items: onMove(id,dx,dy,el) updates position live; onEnd(id) commits; onTap(id|null, point) */
function enableDrag(onMove, onEnd, onTap){
  let drag = null;
  svg.onpointerdown = ev => {
    const g = ev.target.closest('[data-id]');
    const p = pt(ev);
    drag = {id: g ? g.dataset.id : null, el:g, sx:p.x, sy:p.y, moved:false};
    try { svg.setPointerCapture(ev.pointerId); } catch(e){}
    ev.preventDefault();
  };
  svg.onpointermove = ev => {
    if (!drag || drag.id===null || !onMove) return;
    const p = pt(ev); const dx = p.x-drag.sx, dy = p.y-drag.sy;
    if (!drag.moved && Math.hypot(dx,dy) < 6) return;
    if (!drag.moved){ drag.moved = true; pushUndo(); }
    drag.sx = p.x; drag.sy = p.y; onMove(drag.id, dx, dy, drag.el);
  };
  svg.onpointerup = svg.onpointercancel = ev => {
    if (!drag) return; const d = drag; drag = null;
    if (d.moved){ onEnd && onEnd(d.id); } else { onTap && onTap(d.id, pt(ev)); }
  };
}
const moveItem = (s) => (id,dx,dy,el) => { const it = s.items.find(i => String(i.id)===id); if (!it) return; it.x += dx; it.y += dy; el.setAttribute('transform', `translate(${it.x} ${it.y})`); };
const clampItems = (s, w, h) => s.items.forEach(i => { i.x = Math.max(0, Math.min(W-w(i), i.x)); i.y = Math.max(0, Math.min(H-h(i), i.y)); });

let undo = [];
function pushUndo(){ undo.push(JSON.stringify(st)); if (undo.length > 60) undo.shift(); }
function undoLast(){ if (!undo.length) return; st = JSON.parse(undo.pop()); states[S.model] = st; render(); }

const btn = (act, label, val='', pressed=null, cls='') => `<button data-act="${act}" data-val="${val}"${pressed===null?'':` aria-pressed="${pressed}"`}${cls?` class="${cls}"`:''}>${label}</button>`;
const modes = (cur, list, act='mode') => list.map(([v,l]) => btn(act, l, v, cur===v)).join('');
const cross = (cx,cy,r) => `<path d="M${cx-r*.45} ${cy-r*.45}L${cx+r*.45} ${cy+r*.45}M${cx+r*.45} ${cy-r*.45}L${cx-r*.45} ${cy+r*.45}" class="si" stroke-width="${Math.max(2,r*.16)}" stroke-linecap="round" fill="none" opacity=".8"/>`;
const counterSVG = (cx,cy,r,k,delay=0) => `<g class="pc" style="animation-delay:${delay}ms"><circle cx="${cx}" cy="${cy}" r="${r}" fill="${CTR[k]}" stroke="${shade(CTR[k],-.3)}" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="${r*.62}" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2"/>${k==='x'?cross(cx,cy,r):''}</g>`;
/* positions for the i-th counter laid out in rows of 10 with a five-gap */
function gridPos(i, d=72){ const col = i%10, row = Math.floor(i/10)%7; return {x: 60 + col*d + (col>=5 ? d*.5 : 0), y: 60 + row*d*1.1}; }

M.counters = {

M.array = {
  label:'Array', blurb:'Rows and columns of dots. Change the size, tap dots to cross them out.',
  fresh:()=>({rows:3, cols:4, crossed:{}, limit:null, split:null}),

  act(s,a,v){
    if (a==='rows'){ s.rows = Math.max(1, Math.min(12, s.rows+ +v)); s.limit = null; s.split = null; }

  render(s){
    newSVG(); const n = s.rows*s.cols;
    const cell = Math.min((W-80)/(s.cols + (s.cols>5?.4:0)), (H-80)/(s.rows + (s.rows>5?.4:0)), 110), r = cell*.36;
    const bw = s.cols*cell + (s.cols>5?cell*.4:0), bh = s.rows*cell + (s.rows>5?cell*.4:0);
    const ox = (W-bw)/2, oy = (H-bh)/2; let h = '', i = 0;

      if (s.limit!==null && i>=s.limit) continue;

  readout(s){ const n = s.limit!==null ? Math.min(s.limit, s.rows*s.cols) : s.rows*s.cols; const x = Object.keys(s.crossed).length; return `<span><b>${s.rows}</b> rows × <b>${s.cols}</b> = <b>${n}</b></span>${x?`<span>Crossed out <b>${x}</b></span>`:''}<span>Left <b class="big">${n-x}</b></span>`; },

M.tenframes = {

const U = 46;
function shapeSVG(n, delay=0){
  const col = SHAPE_COL[n], st = shade(col,-.28), r = Math.ceil(n/2), odd = n%2; let b = '';
  if (n===1) b = `<rect x="0" y="0" width="${U}" height="${U}" rx="3" fill="${col}" stroke="${st}" stroke-width="2"/><circle cx="${U/2}" cy="${U/2}" r="${U*.3}" fill="#fff" stroke="${shade(col,-.2)}"/>`;
  else {
    const pts = odd ? [[U,0],[2*U,0],[2*U,r*U],[0,r*U],[0,U],[U,U]] : [[0,0],[2*U,0],[2*U,r*U],[0,r*U]];
    b = `<polygon points="${pts.map(q=>q.join(',')).join(' ')}" fill="${col}" stroke="${st}" stroke-width="2" stroke-linejoin="round"/>`;
    const cells = []; if (odd){ cells.push([1,0]); for (let y=1;y<r;y++) cells.push([0,y],[1,y]); } else for (let y=0;y<r;y++) cells.push([0,y],[1,y]);
    cells.forEach(([cx,cy]) => b += `<circle cx="${cx*U+U/2}" cy="${cy*U+U/2}" r="${U*.3}" fill="#fff" stroke="${shade(col,-.2)}"/>`);

  return `<g class="pc" style="animation-delay:${delay}ms">${b}</g>`;
}

const BU = 20;

    const allKnown = s.parts.every(v=>v!==null), gap = allKnown && s.whole!==null && s.whole>sum ? s.whole-sum : 0;
    board.innerHTML = `<div class="bm"><div class="bm-row"><div class="bm-lab">Whole</div><div class="barline"><div class="box whole"><input type="number" inputmode="numeric" data-whole="1" value="${s.whole??''}" placeholder="?" aria-label="Whole"></div></div></div>
      <div class="bm-row"><div class="bm-lab">Parts</div><div class="barline">${s.parts.map((v,i)=>`<div class="box${i%2?' alt':''}" style="flex-grow:${Math.max(sz(i), total*.06)}"><input type="number" inputmode="numeric" data-part="${i}" value="${v??''}" placeholder="?" aria-label="Part ${i+1}">${s.parts.length>1?`<button class="rm" data-i="${i}" aria-label="Remove part">×</button>`:''}</div>`).join('')}${gap?`<div class="box gap" style="flex-grow:${gap}"><span>${gap}?</span></div>`:''}</div></div></div>`;
    bindParts(s);
  },
  readout:partsReadout,
  show:showParts
};
M.partwhole = {
  label:'Part–whole', blurb:'A whole circle on top with its parts underneath. Fill in what you know and find what is missing.',
  fresh:()=>({whole:null, parts:[null,null]}), tools:partTools, act(s,a){ return partAct(s,a); },
  render(s){
    board.innerHTML = `<div class="pw"><svg class="links"></svg><div class="circ whole"><input type="number" inputmode="numeric" data-whole="1" value="${s.whole??''}" placeholder="?" aria-label="Whole"></div>
      <div class="pw-parts">${s.parts.map((v,i)=>`<div class="circ${i%2?' alt':''}"><input type="number" inputmode="numeric" data-part="${i}" value="${v??''}" placeholder="?" aria-label="Part ${i+1}">${s.parts.length>1?`<button class="rm" data-i="${i}" aria-label="Remove part">×</button>`:''}</div>`).join('')}</div></div>`;
    bindParts(s); requestAnimationFrame(drawLinks);
  },
  readout:partsReadout,
  show:showParts
};
/* the model is drawn to the true size, but the number being asked for stays blank until it is typed or revealed */
function showParts(s,p){
  s.scale = {whole: wholeFor(p), parts: partsFor(p)};
  s.whole = s.scale.whole; s.parts = s.scale.parts.slice();
  if (done) return;
  if (p.missing) s.parts[1] = null;
  else if (p.op==='add' || p.op==='mul') s.whole = null;
  else if (p.op==='sub') s.parts[0] = null;
  else s.parts = s.parts.map(() => null);
}
function revealParts(){
  Object.values(states).forEach(x => { if (x.scale){ if (x.whole===null) x.whole = x.scale.whole; x.parts = x.parts.map((v,i) => v ?? x.scale.parts[i] ?? null); } });
  if (!boardHidden) render();
}
function drawLinks(){
  const pw = board.querySelector('.pw'); if (!pw) return;
  const lk = pw.querySelector('svg.links'), R = pw.getBoundingClientRect(), w = pw.querySelector('.circ.whole').getBoundingClientRect();
  lk.setAttribute('viewBox', `0 0 ${R.width} ${R.height}`);
  lk.innerHTML = [...pw.querySelectorAll('.pw-parts .circ')].map(c => { const b = c.getBoundingClientRect(); return `<line x1="${w.left+w.width/2-R.left}" y1="${w.bottom-R.top-2}" x2="${b.left+b.width/2-R.left}" y2="${b.top-R.top+2}" class="si" stroke-width="3"/>`; }).join('');
}

/* ---------- app state ---------- */
const ORDER = ['counters','array','tenframes','shapes','rods','base10','beads','numberline','bar','partwhole'];
if (!M[S.model]) S.model = 'counters';
let cur = null, states = {}, st = null, tries = 0, done = false, free = false, boardHidden = false;

function render(){
  const m = M[S.model];
  $('blurb').textContent = m.blurb;
  board.classList.toggle('wait', boardHidden);
  if (boardHidden){
    board.innerHTML = `<div class="waitMsg">Solve it in your head or on paper first.<br>Press <b>Show me</b> to see it built with <b>${m.label.toLowerCase()}</b>, or pick a model on the right to build it yourself.<br><button class="go" id="waitShow">Show me</button></div>`;
    $('waitShow').onclick = () => $('showBtn').click();
    $('readout').innerHTML = ''; $('tools').innerHTML = ''; return;
  }
  m.render(st);
  $('readout').innerHTML = m.readout(st);
  $('tools').innerHTML = m.tools(st);
}
$('tools').onclick = e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const a = b.dataset.act, v = b.dataset.val, m = M[S.model];
  const light = ['mode','paint','size','dir'].includes(a);
  if (!light) pushUndo();
  const r = m.act(st, a, v);
  if (r===false){ undo.pop(); b.animate([{transform:'translateX(-4px)'},{transform:'translateX(4px)'},{transform:'none'}],{duration:220}); return; }
  if (r==='tools'){ $('tools').innerHTML = m.tools(st); return; }
  render();
};
const picker = $('picker');
ORDER.forEach(k => { const b = document.createElement('button'); b.textContent = M[k].label; b.dataset.m = k; b.onclick = () => { S.model = k; save(); boardHidden = false; useModel(); }; picker.appendChild(b); });
function useModel(){
  picker.querySelectorAll('button').forEach(b => { b.setAttribute('aria-pressed', b.dataset.m===S.model); b.classList.toggle('best', !free && !!cur && b.dataset.m===cur.best); b.title = (!free && cur && b.dataset.m===cur.best) ? 'Best for this question' : ''; });
  if (!states[S.model]) states[S.model] = M[S.model].fresh();
  st = states[S.model]; undo = []; render();
}
$('undoBtn').onclick = () => { if (!boardHidden) undoLast(); };
$('clearBtn').onclick = () => { if (boardHidden) return; pushUndo(); const keep = st; st = M[S.model].fresh(); if (keep.n) st.n = keep.n; if (keep.track) st.track = keep.track; if (keep.hi) st.hi = keep.hi; states[S.model] = st; render(); };

/* which model shows this question most easily, and why */
function bestModel(p){
  const R = S.range, bonds = R[0]==='b' || R[0]==='w';
  if (p.missing) return p.op==='add'
    ? {m:'partwhole', why:`Part–whole: put ${p.ans} in the whole and ${p.a} in one part, then find the other part.`}
    : {m:'bar', why:`Bar model: the whole bar is ${p.a}, one part is ${p.ans}. How long is the other part?`};
  if (p.op==='mul') return p.a*p.b <= 20 && p.b <= 5
    ? {m:'counters', why:`Counters: make ${p.a} groups of ${p.b} and count them all.`}
    : {m:'array', why:`Array: set ${p.a} rows and ${p.b} columns, then count the dots.`};
  if (p.op==='div') return p.a <= 20
    ? {m:'counters', why:`Counters: make ${p.a}, then drag them into ${p.b} equal groups.`}
    : {m:'array', why:`Array: set ${p.b} rows, then add columns until you reach ${p.a} dots.`};
  if (p.op==='add'){
    if (bonds && p.ans===100) return {m:'beads', why:`Bead string: push ${p.a} across, then how many more make 100?`};
    if (p.ans <= 10) return {m:'tenframes', why:`Ten frame: fill ${p.a} in red and ${p.b} in yellow.`};
    if (p.ans <= 20) return {m:'tenframes', why:`Ten frames: fill ${p.a} in red, then ${p.b} in yellow. Watch the first frame fill to 10.`};
    if (p.b < 10 || p.a < 10) return {m:'numberline', why:`Number line: start at ${p.a} and jump on ${p.b}. Jump to the next ten first.`};
    return {m:'base10', why:`Base ten: build ${p.a} in Part 1 and ${p.b} in Part 2, then build the whole. Exchange ten ones for a ten.`};
  }
  if (p.a <= 10) return {m:'counters', why:`Counters: make ${p.a}, then cross out ${p.b}.`};
  if (p.a <= 20) return {m:'tenframes', why:`Ten frames: fill ${p.a}, then cross out ${p.b}. Count what is left.`};
  if (p.b < 10) return {m:'numberline', why:`Number line: start at ${p.a} and jump back ${p.b}. Jump back to the ten first.`};
  if (p.op==='sub' && p.b % 10 === 0) return {m:'beads', why:`Bead string: push ${p.a} across, then pull back ${p.b}.`};
  return {m:'base10', why:`Base ten: build ${p.a} as the whole and ${p.b} as one part. What goes in the other part? Break a ten into ones if you need to.`};
}
$('autoBtn').setAttribute('aria-pressed', S.auto);
$('autoBtn').onclick = () => { S.auto = !S.auto; $('autoBtn').setAttribute('aria-pressed', S.auto); save(); if (S.auto && cur && !free){ const b = bestModel(cur); S.model = b.m; save(); useModel(); setFb('Best tool: ' + b.why); } };

/* ---------- question flow ---------- */
const q = $('q'), fb = $('fb');
function showQuestion(p){
  const slot = `<input class="slot" id="ansIn" type="number" inputmode="numeric" placeholder="?" aria-label="Your answer" autocomplete="off">`;
  q.innerHTML = p.missing
    ? `<span>${p.a}</span><span class="sym">${SYM[p.op]}</span>${slot}<span class="sym">=</span><span>${p.ans}</span>`
    : `<span>${p.a}</span><span class="sym">${SYM[p.op]}</span><span>${p.b}</span><span class="sym">=</span>${slot}`;
  const inp = $('ansIn');
  inp.onkeydown = e => { e.stopPropagation(); if (e.key==='Enter'){ e.preventDefault(); done ? newProblem() : check(); } };
  inp.oninput = () => { inp.classList.remove('no'); };
}
const expected = p => p.missing ? p.b : p.ans;
function setFb(text, cls=''){ fb.textContent = text; fb.className = 'feedback ' + cls; }
function newProblem(){
  cur = makeProblem(); tries = 0; done = false; boardHidden = !free;
  states = {}; undo = [];
  showQuestion(cur);
  const b = bestModel(cur); cur.best = b.m;
  if (S.auto){ S.model = b.m; save(); }
  setFb(S.auto ? 'Best tool when you need it: ' + b.why : '');
  useModel();
  if (!free) setTimeout(() => $('ansIn') && $('ansIn').focus(), 50);
}
function check(){
  const inp = $('ansIn'); if (!inp || done) return;
  if (inp.value==='') { setFb('Type your answer in the dashed box, or build it on the board first.'); inp.focus(); return; }
  if (+inp.value === expected(cur)){
    done = true; inp.classList.add('ok'); inp.readOnly = true; revealParts();
    if (!cur.revealed){ S.solved++; S.streak++; S.best = Math.max(S.best, S.streak); save(); updateScore(); }
    const praise = ['Correct!','Yes!','Nice work.','That is it.','Spot on.'][rnd(0,4)];
    setFb(`${praise} ${cur.a} ${SYM[cur.op]} ${cur.b} = ${cur.ans}. Press Enter or New question to keep going.`, 'ok');
  } else {
    tries++; inp.classList.remove('no'); void inp.offsetWidth; inp.classList.add('no');
    if (S.streak){ S.streak = 0; save(); updateScore(); }
    if (tries===1) setFb('Not yet. Build it on the board and count carefully.', 'no');
    else if (tries===2) setFb('Not yet. Hint: ' + hintFor(cur), 'no');
    else setFb('Still not right. Try "Show me" to see one way to build it, then count.', 'no');
    inp.select();
  }
}
function updateScore(){ $('solved').textContent = S.solved; $('streak').textContent = S.streak; $('best').textContent = S.best; }
$('checkBtn').onclick = check;
$('newBtn').onclick = newProblem;
$('showBtn').onclick = () => { if (free) return; boardHidden = false; pushUndo(); st = M[S.model].fresh(); M[S.model].show(st, cur); states[S.model] = st; render(); setFb(st.scale ? 'The ' + M[S.model].label.toLowerCase() + ' is drawn to size. The blank box is the number you are finding. Type it in, or press Reveal.' : 'Here is one way to build it with ' + M[S.model].label.toLowerCase() + '. Count it, then type your answer.'); };
$('revealBtn').onclick = () => { const inp = $('ansIn'); if (!inp || done) return; cur.revealed = true; inp.value = expected(cur); revealParts(); if (S.streak){ S.streak = 0; save(); updateScore(); } check(); setFb(`The answer is ${expected(cur)}. Can you build it to see why? Then press New question.`); };
$('freeBtn').onclick = () => { free = !free; boardHidden = false; if (free) useModel(); picker.querySelectorAll('button').forEach(b => b.classList.remove('best')); document.body.classList.toggle('free', free); $('freeBtn').setAttribute('aria-pressed', free); setFb(free ? 'Free play: build anything you like. Press Free play again to get questions back.' : ''); if (!free) newProblem(); };

addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  if ((e.ctrlKey||e.metaKey) && (e.key==='z'||e.key==='Z')){ e.preventDefault(); undoLast(); }
  else if (e.key==='n' || e.key==='N') newProblem();
  else if (e.key==='Enter' && done) newProblem();
});
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(drawLinks, 100); });

updateScore();
newProblem();
})();
</script>

</body>
