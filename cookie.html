<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nice Try</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: playful, six comic standoffs in one cabinet
   IDEA: an arcade of arguments: pick an opponent, then a standoff
   PICTURE: the chosen opponent faces you in a scene that changes with the game and situation
   COLOUR and TYPE: plum walls, peach lamplight, mint for wins, coral for misses; Fredoka + Nunito
   LAYOUT: scene on top, the opponent's speech bubble, answer cards; a menu of situations as cards */
:root{color-scheme:dark;--bg:#21152b;--wall:#3a2547;--panel:#2d1d39;--card:#432c53;--line:#654778;--ink:#f7eefb;--muted:#cdb9da;--peach:#ffc4a1;--mint:#7fe3c4;--coral:#ff7d74}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 Nunito,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:980px;margin:0 auto;padding:clamp(16px,3vw,36px) max(4vw,14px) 48px}
h1{font:600 clamp(32px,6vw,50px)/1.05 Fredoka,Nunito,sans-serif;margin:0 0 6px;text-wrap:balance;color:var(--peach)}
.lede{margin:0 0 18px;color:var(--muted);max-width:64ch}
.hud{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;justify-content:space-between;background:var(--panel);border:2px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:12px 18px}
.hud b{font:600 17px Fredoka,sans-serif}
.hud small{color:var(--muted);font-size:14px}
.meters{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center}
.mugs,.dots{display:flex;gap:5px;align-items:center}
.mugs svg{width:24px;height:24px;display:block}
.mugs .gone{opacity:.2}
.dots i{width:13px;height:13px;border-radius:50%;border:2px solid var(--mint)}.dots i.on{background:var(--mint)}
.stage{position:relative;border:2px solid var(--line);border-top:0;border-bottom:0;background:var(--wall);aspect-ratio:800/360;overflow:hidden}
.stage svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.board{background:var(--panel);border:2px solid var(--line);border-top:0;border-radius:0 0 22px 22px;padding:22px clamp(14px,3vw,26px) 26px}
.bubble{position:relative;background:var(--ink);color:#2a1834;border-radius:20px;padding:16px 20px;font:500 clamp(18px,2.4vw,21px)/1.4 Fredoka,sans-serif;margin:-6px 0 20px}
.bubble::before{content:"";position:absolute;left:calc(30% - 14px);top:-16px;border:16px solid transparent;border-top:0;border-bottom-color:var(--ink)}
.bubble .who{display:block;font:800 13px Nunito,sans-serif;color:#7b4f8f;margin-bottom:2px}
.fb .bubble{margin:8px 0 10px}.fb .bubble::before{display:none}
.bubble.parent{background:var(--peach)}
.ask{margin:0 0 10px;color:var(--muted);font-weight:700}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
button{font:inherit;color:inherit;cursor:pointer}
.opt{min-height:56px;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-weight:700;display:flex;gap:10px;align-items:center;transition:transform .12s,border-color .12s}
.opt kbd{flex:none;width:26px;height:26px;border-radius:8px;background:var(--bg);display:grid;place-items:center;font:700 13px Nunito;color:var(--muted)}
.opt:hover:not(:disabled){border-color:var(--peach);transform:translateY(-2px)}
.opt:disabled{cursor:default;opacity:.55}
.opt.right{border-color:var(--mint);background:#2f5a4f;opacity:1}
.opt.wrong{border-color:var(--coral);background:#5d2a35;opacity:1}
button:focus-visible{outline:3px solid var(--peach);outline-offset:3px}
.fb{margin-top:18px;border-radius:16px;padding:16px 18px;background:var(--bg);border:2px solid var(--line)}
.fb h3{margin:0 0 6px;font:600 20px Fredoka,sans-serif}
.fb.good h3{color:var(--mint)}.fb.bad h3{color:var(--coral)}
.fb p{margin:6px 0}
.def{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.go,.ghost{min-height:48px;padding:10px 22px;border-radius:999px;font:600 18px Fredoka,sans-serif}
.go{border:0;background:var(--peach);color:#2a1834}
.go:hover{filter:brightness(1.06)}
.ghost{background:transparent;border:2px solid var(--line)}
.ghost:hover{border-color:var(--peach)}
.menuhead{display:flex;flex-wrap:wrap;gap:10px;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.menuhead h2{margin:0;font:600 24px Fredoka,sans-serif}
.menuhead span{color:var(--muted)}
.sits{text-align:left;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.sit{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;min-height:96px;display:flex;flex-direction:column;gap:2px;transition:transform .12s,border-color .12s}
.sit:hover{border-color:var(--peach);transform:translateY(-2px)}
.sit b{font:600 18px Fredoka,sans-serif}
.sit small{color:var(--muted)}
.tag{margin-top:auto;padding-top:8px;font-size:13px;font-weight:800;color:var(--muted)}
.tag.won{color:var(--mint)}.tag.lost{color:var(--coral)}
.games{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:18px 0}
.game{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px 18px;min-height:150px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden;transition:transform .12s,border-color .12s}
.game::after{content:"";position:absolute;right:-28px;top:-28px;width:96px;height:96px;border-radius:50%;background:var(--tint);opacity:.22}
.game:hover,.game:focus-visible{border-color:var(--tint);transform:translateY(-2px)}
.gname{font:600 24px/1.1 Fredoka,sans-serif;color:var(--tint)}
.grole{font-weight:800;font-size:14px;color:var(--ink)}
.gblurb{color:var(--muted);font-size:15px}
@media(max-width:600px){.games{grid-template-columns:minmax(0,1fr)}}
.mini{min-height:36px;padding:4px 12px;font:700 13px Nunito,sans-serif;border-radius:999px;background:transparent;border:2px solid var(--line);color:var(--muted)}
.mini:hover{border-color:var(--peach);color:var(--ink)}
.score{font:600 22px Fredoka,sans-serif;color:var(--mint)}
.pop{animation:pop .22s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.opt.cut{opacity:.25;text-decoration:line-through}
.ghost:disabled{opacity:.4;cursor:default}
.stars{color:#ffd36b;letter-spacing:1px}
.bigstars{font-size:40px;line-height:1;color:#ffd36b;margin:0 0 6px;letter-spacing:4px}
.starline{color:var(--muted)}.starline b{color:#ffd36b}
.streak{font:800 13px Nunito,sans-serif;background:var(--mint);color:#16302a;border-radius:999px;padding:2px 10px;margin-left:6px;vertical-align:middle;white-space:nowrap}
.acc{color:var(--mint);font-weight:700;font-size:13px}
.gloss i{color:var(--ink);opacity:.85}
.game.wide{width:100%;min-height:0;margin-bottom:4px}
@media(min-width:820px){.games{grid-template-columns:repeat(3,minmax(0,1fr))}}
.center{text-align:center}
.title{font:600 clamp(40px,8vw,68px)/1 Fredoka,sans-serif;color:var(--peach);margin:6px 0 10px;text-wrap:balance}
.rules{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px auto;max-width:720px;text-align:left}
.rules div{background:var(--card);border-radius:16px;padding:14px}
.rules b{display:block;font:600 18px Fredoka,sans-serif;margin-bottom:2px}
.rules span{color:var(--muted);font-size:15px}
a.ghost{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink)}
@media(max-width:600px){.rules{grid-template-columns:minmax(0,1fr)}}
.center p{max-width:56ch;margin:8px auto}
.center .row{justify-content:center}
.big{font:600 clamp(28px,5vw,40px)/1.1 Fredoka,sans-serif;margin:4px 0 8px}
.big.won{color:var(--mint)}.big.lost{color:var(--coral)}
.stats{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin:14px 0}
.stats div{background:var(--card);border-radius:14px;padding:10px 16px;min-width:120px}
.stats b{display:block;font:600 26px Fredoka,sans-serif;color:var(--peach)}
.stats span{font-size:14px;color:var(--muted)}
details{margin-top:22px;color:var(--muted)}
summary{cursor:pointer;font-weight:700;color:var(--ink);min-height:32px}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px 18px;margin-top:10px;font-size:15px}
.gloss b{color:var(--ink)}
#kid{transform-origin:240px 330px;transition:transform .25s}
.m-stunned #kid{transform:translateX(-6px) rotate(-3deg)}
.m-gloat #kid{transform:translateY(-8px)}
.m-sulk #kid{transform:translateY(4px) rotate(2deg)}
.face,.pface,.zz,.day{display:none}
.m-argue .f-argue,.m-stunned .f-stunned,.m-gloat .f-gloat,.m-sleep .f-sleep,.m-sulk .f-sulk{display:inline}
.p-calm .pf-calm,.p-tired .pf-tired,.p-smug .pf-smug{display:inline}
.m-sleep .zz{display:inline}
.isday .day{display:inline}.isday .night{display:none}.isday .glow{opacity:.3}
@keyframes zz{0%{opacity:0;transform:translateY(8px)}50%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
.zz text{animation:zz 2.4s infinite}.zz text:nth-child(2){animation-delay:.8s}.zz text:nth-child(3){animation-delay:1.6s}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media(max-width:600px){.opts{grid-template-columns:minmax(0,1fr)}.hud{border-radius:18px 18px 0 0}.row>button{flex:1 1 100%}}
</style>
</head>

        <line id="mHand" y2="-24" stroke="#2a1834" stroke-width="3" stroke-linecap="round"/>
        <circle r="3.5" fill="#ff7d74"/>
      </g>
      <g id="chars"></g>
      <g id="fg"></g>
<g class="zz" fill="#f7eefb" font-family="Fredoka, sans-serif" font-weight="600"><text x="290" y="140" font-size="22">z</text><text x="306" y="116" font-size="28">z</text><text x="326" y="88" font-size="34">Z</text></g>

  </div>

  <div class="board" id="board" aria-live="polite"></div>

  <details>
    <summary>Fallacy cheat sheet</summary>
    <div class="gloss" id="gloss"></div>
  </details>
</div>

<script>


{

 bandwagon:['Bandwagon','Claiming something is right because lots of people do it or believe it.'],

const SITS=[
 {id:'cookie',t:'The cookie jar',s:'Pip wants a cookie before dinner',h:17*60+15,
  lose:'Pip is munching a chocolate-chip cookie. Then another. Dinner is going to be interesting.',win:'The lid stays on the jar. Pip gets one cookie after dinner, as agreed.',lines:[
  L('bandwagon','Everyone has a cookie before dinner. It’s basically the law.','Lots of people doing it wouldn’t make it a good idea, and it isn’t the law.'),
  L('slope','If I don’t get a cookie now I’ll get hungry, then grumpy, then I’ll faint, and you’ll have to carry me EVERYWHERE.','Waiting forty minutes for dinner won’t end with me carrying you everywhere.'),
  L('tuquoque','You ate a cookie this morning. I SAW you.','Maybe I did. That still doesn’t make one before dinner a good idea for you.'),
  L('emotion','The cookies are so lonely in that jar. Nobody’s visited them all day.','The cookies are fine. They’ll have company after dinner.'),
  L('straw','So you think cookies are EVIL now?','I love cookies. I just want you to have one after dinner.'),
  L('dilemma','Either I have a cookie now, or I’ll never be happy again.','Or you have one after dinner and stay perfectly happy.'),
  L('circular','I deserve a cookie because I’m the kind of kid who deserves cookies.','That’s just saying you deserve one twice.'),
  L('ignorance','Nobody’s proven a cookie spoils your dinner. So it doesn’t.','No proof it does isn’t proof it doesn’t.'),
  L('authority','My friend’s big sister says cookies are full of vitamins. She’s in high school.','Being in high school doesn’t make her a nutritionist.'),
  L('cause','Last time I had a cookie before dinner I scored a goal. Cookies make me win.','You scored because you practised, not because of a cookie.'),
  L('nature','Cookies are made of flour. Flour comes from wheat. Wheat’s a plant. So a cookie is a vegetable.','By that logic cake is a salad. Nice try.'),
  L('loaded','Why are you hiding the cookies from me?','That assumes I’m hiding them. They’re in the jar, staying there until after dinner.'),
  L('herring','Look, a bird! …While you’re looking, I’ll just get one cookie.','The bird can wait, and so can the cookie.'),
  L('anecdote','I had a cookie before dinner once and still ate everything. So cookies never ruin dinner.','One good night doesn’t mean it never happens.')]},
 {id:'social',t:'Social media',s:'Pip wants their own FlickFeed account',h:17*60+40,
  lose:'Pip has a FlickFeed account, a username with six x’s in it, and has already posted a video of the cat.',win:'No account for now. Pip will video-call friends instead, and you’ll talk about it again when they’re older.',lines:[
  L('bandwagon','Literally everyone in my class has FlickFeed. EVERYONE.','Even if they did, what other families allow doesn’t decide what we do.'),
  L('slope','If I don’t get FlickFeed I’ll miss every joke, then nobody will talk to me, then I’ll have zero friends until I’m forty.','Missing some videos won’t leave you friendless until forty.'),
  L('tuquoque','You’re on your phone scrolling ALL the time!','Fair, I should scroll less. That still doesn’t make you old enough for an account.'),
  L('authority','A famous gamer said kids should start posting as early as possible.','Being good at games doesn’t make him an expert on kids and online safety.'),
  L('anecdote','My cousin’s had an account since she was eight and nothing bad ever happened.','One cousin’s experience doesn’t tell us it’s safe for everyone.'),
  L('ignorance','Nobody’s proven anything bad will happen to me online. So it’s totally safe.','Nobody proving it’s unsafe isn’t the same as it being safe.'),
  L('straw','So you think the internet is full of monsters and I’m never allowed online EVER?','You’re allowed online. Just not with your own account yet.'),
  L('dilemma','Either I get my own account, or I’ll be completely cut off from the world.','Or you video-call your friends and we watch things together.'),
  L('goalposts','You said good marks meant I could have a tablet. I got it. But a tablet without FlickFeed doesn’t count, so the deal isn’t finished.','The deal was the tablet. You got it. The deal is done.'),
  L('emotion','Everyone will forget I exist. Is that what you want? For me to be FORGOTTEN?','Your friends aren’t going to forget you because you don’t have an app.'),
  L('loaded','Why don’t you trust me?','That assumes this is about trust. It’s about age. Most apps like that say thirteen.'),
  L('hasty','Two kids in my class got accounts and they’re fine. So every kid my age is ready.','Two kids aren’t every kid.'),
  L('herring','Did you know a hummingbird’s heart beats over a thousand times a minute? Anyway, I’ll just download it.','Amazing hummingbirds. Still no download.'),
  L('cause','Leo got FlickFeed and then got picked for the football team. FlickFeed makes you popular.','Leo got picked because he’s good at football, not because of an app.')]},
 {id:'toy',t:'The toy aisle',s:'Pip wants the Robo-Dino 3000',h:15*60+10,
  lose:'The Robo-Dino 3000 is in the cart. You don’t remember agreeing to it.',win:'Pip puts the Robo-Dino back on the shelf. Sulkily, but back.',lines:[
  L('bandwagon','Every kid in my class has a Robo-Dino. I’m the ONLY one who doesn’t.','Even if they all did, that isn’t a reason for us to buy one.'),
  L('slope','If you don’t buy it I’ll be sad, then I’ll be sad tomorrow, then I’ll be sad my WHOLE LIFE.','Not getting one toy today won’t make you sad for life.'),
  L('tuquoque','You buy stuff for yourself all the time! So you can’t say no to me.','What I buy doesn’t change whether this toy is a good idea today.'),
  L('emotion','Look at its little face. It wants to come home with me. It’ll cry if we leave it here.','It’s plastic. It will be perfectly fine on the shelf.'),
  L('straw','So you’re saying I can never have any toys EVER again?','I said not today. That’s all I said.'),
  L('dilemma','Either you buy it now, or I scream right here in the shop. Pick one.','There’s a third option: we go home calmly and put it on your birthday list.'),
  L('authority','The man in the TV advert said every kid needs one.','The man in the advert is paid to sell it.'),
  L('ignorance','Nobody’s ever proved I’d get bored of it. So I’ll love it forever.','Not having proof you’ll get bored isn’t proof you won’t.'),
  L('goalposts','I said I’d stop asking if I could just hold it. I held it. Now I need to try it at home first.','The deal was holding it. You held it. The deal is done.'),
  L('loaded','Why don’t you love me enough to buy it?','I love you lots. That’s not what decides what we buy.')]},
 {id:'ice',t:'Ice cream for dinner',s:'Pip has a plan, and it involves sprinkles',h:18*60,
  lose:'Pip is eating a triple scoop. It is dinner now, apparently.',win:'Pip eats real dinner first. Ice cream is “maybe on Saturday”.',lines:[
  L('nature','Ice cream is made of milk. Milk is natural. So ice cream is health food.','Plenty of natural things go into it, and so does a lot of sugar.'),
  L('circular','Ice cream is good for you because it’s healthy.','Saying it’s healthy isn’t a reason it’s healthy.'),
  L('anecdote','Grandma let me have ice cream for dinner once, and I was totally fine.','One dinner at Grandma’s doesn’t make it a good every-night plan.'),
  L('hasty','Leo has ice cream every night, and so does his brother. So ALL kids do.','Two kids from one house aren’t all kids.'),
  L('tuquoque','You had cake at work today! You’re not allowed to talk.','Even if I had cake, that doesn’t make ice cream a dinner.'),
  L('straw','So you want me to never be happy ever again?','I want you to eat dinner. Happiness is allowed.'),
  L('dilemma','Either I get ice cream, or I’m not eating anything at all.','Or you eat your pasta like a champion.'),
  L('tradition','We ALWAYS get ice cream on holiday, so we should get it now.','We’re not on holiday. It’s a Wednesday.'),
  L('herring','Did you know sharks are older than trees? Anyway… ice cream?','Fascinating sharks. Still no ice cream for dinner.'),
  L('cause','Last time I had ice cream I got a gold star at school. Ice cream makes me smart.','You got a gold star because you worked hard, not because of the ice cream.'),
  L('loaded','Have you stopped being mean about sugar yet?','That assumes I was being mean. I wasn’t, and the answer’s still no.')]},
 {id:'school',t:'School morning',s:'Pip is “definitely sick”',h:7*60+5,
  lose:'Pip is on the sofa in pyjamas. You are calling the school office.',win:'Pip shuffles out the door with a backpack and a mighty sigh.',lines:[
  L('bandwagon','Everybody’s staying home today. Probably. I heard.','Even if they were, you’re still going.'),
  L('circular','School is boring because it isn’t fun.','That’s the same thing said twice.'),
  L('slope','If I go, I’ll have a spelling test, get one wrong, fail school, and have to live in a box.','One spelling mistake does not lead to a box.'),
  L('tuquoque','YOU don’t go to school! Why should I?','I went for years and I go to work now. School is your job right now.'),
  L('hominem','My teacher’s really strict, so she’s wrong about everything. Even homework.','Being strict doesn’t make her wrong.'),
  L('authority','A kid on the internet said school is a waste of time.','A random kid online isn’t an expert on education.'),
  L('cause','Last time I went to school it rained. School makes it rain.','Rain doesn’t check your timetable.'),
  L('ignorance','Nobody’s proved I’ll learn anything today. So I won’t.','No proof you won’t learn anything either. Off you go.'),
  L('herring','Look, the cat is sitting really funny! We should watch the cat. All day.','The cat will still be sitting funny at 3:30.'),
  L('scotsman','Nobody smart ever needed school. Okay, doctors did, but doctors don’t count.','Doctors count. They’re smart and they went to school.'),
  L('loaded','Why do you want me to be miserable all day?','I don’t. I want you to go to school.')]},
 {id:'chores',t:'Chores',s:'“I’ll do it later, I promise”',h:16*60+20,
  lose:'The toys are still on the floor. “Later” has become “never”.',win:'The toys are in the box. Most of them. That counts.',lines:[
  L('goalposts','I said I’d tidy after one game. But that game was short, so it doesn’t count.','We agreed on one game. Short games still count.'),
  L('bandwagon','None of my friends do chores. Not one of them.','What other families do doesn’t change our house rules.'),
  L('tuquoque','You left your mug on the table, so you can’t make ME clean.','I’ll move my mug. Your toys are still on the floor.'),
  L('straw','So you want me to clean the whole house? The whole STREET?','Just your toys. The street can wait.'),
  L('dilemma','Either I do it later, or I do it never.','Or you do it now. That’s an option too.'),
  L('slope','If I put my toys away I’ll forget where they are, then I’ll never play again, then I’ll be bored forever.','They’ll be in the toy box. Where toys live.'),
  L('circular','Chores are pointless because they don’t matter.','That’s just repeating yourself.'),
  L('nature','Dust is natural. You shouldn’t fight nature.','Mould is natural too. We’re still tidying.'),
  L('herring','Did you know octopuses have three hearts? Anyway, not now.','Three hearts, zero excuses. Toys in the box.'),
  L('hominem','You only want me to do it because you’re bossy.','Even if I were bossy, the toys still need putting away.'),
  L('cause','Last week I made my bed and then I lost my football match. Tidying is bad luck.','Your bed did not lose the match.')]},
 {id:'early',t:'The early start',s:'Pip has become one with the duvet',h:6*60,
  lose:'Pip is still in bed. You’re going to be late. Again.',win:'Pip is up, dressed, and only slightly glaring at you.',lines:[
  L('circular','It’s too early because it isn’t late enough.','That’s the same idea twice.'),
  L('nature','My body says stay in bed. Bodies are natural. You can’t argue with nature.','Waking up is natural too.'),
  L('tuquoque','You hit snooze yesterday! TWICE!','I did, and I was late. Let’s not both be.'),
  L('ignorance','Nobody’s proven the car leaves at seven. Maybe it leaves at lunch.','The car leaves at seven. Up you get.'),
  L('slope','If I get up now I’ll be tired, then grumpy, then I’ll fall asleep in my cereal and sink.','You won’t sink in cereal. I’ll be right there.'),
  L('dilemma','Either I sleep three more hours, or I’m grumpy forever.','Or you get up and feel better after breakfast.'),
  L('emotion','Look how cosy my blanket is. You’d be so cruel to take me away from it.','It’ll be just as cosy tonight.'),
  L('straw','So you hate sleep now? You want me to NEVER sleep?','I love sleep. I just want you awake right now.'),
  L('goalposts','You said five more minutes. But I was asleep for them, so they don’t count.','Sleeping is exactly what the five minutes were for.'),
  L('loaded','Why are you always trying to ruin my mornings?','That assumes I’m ruining it. I’m just starting it.'),
  L('anecdote','My cousin sleeps till ten on school days and he’s fine.','One cousin isn’t a rule. And he might not be fine.')]},
 {id:'scary',t:'Scary movie night',s:'Pip wants to watch Zombie Swamp IV',h:20*60,
  lose:'Zombie Swamp IV is playing. You already know who’s sleeping in your bed tonight.',win:'You’re watching the one with the singing penguins. Pip is secretly relieved.',lines:[
  L('bandwagon','Everyone in my class has seen it. Even the scaredy ones.','Other kids watching it doesn’t make it right for you.'),
  L('authority','A Year 6 kid said it’s not scary at all, and he’s basically a movie expert.','Being in Year 6 doesn’t make him a film critic.'),
  L('anecdote','I watched a scary trailer once and slept fine. So scary movies are fine.','One trailer isn’t the same as a whole film.'),
  L('tuquoque','Grandma says YOU watched scary movies when you were little.','Maybe I did, and I had nightmares. That’s why I’m saying no.'),
  L('straw','So you think I’m a baby who’s scared of EVERYTHING?','I think this one film is too scary. That’s all.'),
  L('dilemma','Either I watch Zombie Swamp, or I never watch anything ever again.','There are thousands of other films.'),
  L('ignorance','Nobody’s proven I’ll get nightmares. So I won’t.','No proof you won’t, either.'),
  L('slope','If I don’t watch it, everyone will talk about it, I won’t understand, they’ll laugh, and I’ll have to move country.','Missing one film won’t make you emigrate.'),
  L('circular','It isn’t too scary because it’s not scary.','That’s just saying it again.'),
  L('hominem','You only say no because YOU’RE scared of zombies.','Even if I were, it’s still too scary for you.'),
  L('scotsman','Real brave kids watch horror films. Mia doesn’t, but she isn’t really brave.','Mia is plenty brave. Bravery isn’t about zombies.')]},
 {id:'bath',t:'Bath time',s:'Pip has declared war on water',h:19*60,
  lose:'Pip is in bed, unwashed and triumphant. The sheets will remember this.',win:'Pip is in the bath, complaining loudly while making a bubble beard.',lines:[
  L('nature','Dirt is natural. Animals don’t have baths.','Lots of animals clean themselves. Your turn.'),
  L('cause','I had a bath on Sunday and it rained on Monday. Baths cause rain.','The weather doesn’t care about your bath.'),
  L('tradition','We’ve never had baths on Thursdays. That’s been the rule forever.','There’s never been a rule like that. In you go.'),
  L('circular','Baths are boring because they aren’t fun.','Saying it twice doesn’t make it a reason.'),
  L('straw','So you want me to stay in the bath until I turn into a prune?','Ten minutes. No prunes required.'),
  L('emotion','My rubber duck is scared of water. You’d really make him go in?','He’s a rubber duck. Water is his whole job.'),
  L('herring','Did you know some frogs can freeze solid and come back to life?','Amazing frogs. Still bath time.'),
  L('ignorance','Nobody’s ever proved I’m dirty.','You have spaghetti in your hair.'),
  L('tuquoque','YOU didn’t have a bath this morning!','I had a shower. And we’re talking about you.'),
  L('dilemma','Either no bath, or I flood the whole bathroom.','Or a normal bath with normal amounts of water.')]},
 {id:'veg',t:'Vegetables',s:'The broccoli standoff',h:18*60+15,
  lose:'The broccoli is in the bin. Pip is eating plain rice with a victorious face.',win:'Three pieces of broccoli, eaten. Pip made a face, but it went down.',lines:[
  L('circular','Broccoli is bad because it’s gross. And it’s gross because it’s bad.','That’s one opinion chasing its own tail.'),
  L('straw','So you want me to eat ALL the broccoli in the WORLD? Every tiny tree?','I asked for three pieces.'),
  L('dilemma','Either I have dessert first, or I eat nothing.','Or dinner first, then dessert.'),
  L('scotsman','No real kid likes vegetables. Sam does, but Sam doesn’t count.','Sam is a real kid. He counts.'),
  L('anecdote','Grandpa hates broccoli and he’s eighty. So you don’t need broccoli to live.','One grandpa doesn’t settle what everyone needs.'),
  L('bandwagon','Everyone at school says broccoli tastes like feet.','Lots of people saying it doesn’t make it true.'),
  L('tuquoque','You didn’t finish your carrots last week!','Maybe not, but that doesn’t mean you skip your broccoli.'),
  L('slope','If I eat broccoli I’ll turn green, then I’ll BE a vegetable, then you’ll have to plant me.','Nobody has ever been planted for eating broccoli.'),
  L('loaded','When did you stop loving me and start serving broccoli?','I never stopped. Broccoli is a sign of love.'),
  L('nature','Kids naturally hate vegetables. So I’m supposed to hate it.','Something feeling natural doesn’t make it right.')]},
 {id:'screen',t:'Screen time',s:'Just one more episode',h:19*60+30,
  lose:'The tablet is still glowing. You’ve lost count of “one more episode”.',win:'The tablet is on the charger. Pip is reading a comic instead.',lines:[
  L('authority','A YouTuber with a million subscribers said screens make your brain bigger.','A million subscribers doesn’t make someone a scientist.'),
  L('anecdote','Grandpa played video games all night once and he’s totally fine.','One grandpa, one night. Not exactly science.'),
  L('ignorance','Nobody’s EVER proven that one more episode is bad for you. So it’s good.','Not proven bad isn’t the same as good.'),
  L('goalposts','I said one more episode, but that one was short, so it doesn’t count.','We agreed on one. Short ones count.'),
  L('bandwagon','Everybody gets unlimited screen time now. It’s normal.','Even if that were true, it’s not our rule.'),
  L('tuquoque','You’re on your phone RIGHT NOW!','Fair point, I’ll put it down. Your tablet still goes off.'),
  L('straw','So you want me to live in a cave with no TV, like a caveman?','I want the tablet off for tonight.'),
  L('slope','If I stop now I’ll never know who won, then I’ll think about it forever, then I’ll fail school.','The episode will be there tomorrow.'),
  L('tradition','We always watch TV on Friday nights!','It’s Tuesday.'),
  L('dilemma','Either one more episode, or I’ll be bored to DEATH.','Or you read, draw, or play with Lego.')]},
 {id:'bed',t:'Bedtime',s:'“Just five more minutes”',h:20*60+30,sleep:true,
  lose:'Pip is still up, building a fort. You fell asleep on the sofa first.',win:'Pip is asleep, mid-sentence about octopuses. Your tea is still warm. Probably.',lines:[
  L('bandwagon','Everyone in my class stays up till eleven. EVERYONE.','Other people’s bedtimes don’t make yours a good idea.'),
  L('slope','If I go to bed now I’ll miss the show, then nobody will talk to me, and I’ll be alone FOREVER.','Missing one episode won’t cost you every friend.'),
  L('tuquoque','You stay up late all the time, so you can’t tell me to go to bed.','My bedtime doesn’t change the fact you need sleep.'),
  L('emotion','Teddy will be so lonely if I go to bed. Look at his little face!','Teddy is coming to bed with you.'),
  L('tradition','We ALWAYS stay up late on New Year’s Eve. So we should tonight.','New Year’s is one night a year. Tonight isn’t it.'),
  L('loaded','When did you stop being the fun parent?','That assumes I stopped. I’m still fun. It’s still bedtime.'),
  L('hasty','My two cousins go to bed at ten. So all kids go to bed at ten.','Two cousins aren’t all kids.'),
  L('cause','Last time I went to bed early I had a nightmare. Early bedtimes cause nightmares.','One bad dream doesn’t mean bedtime caused it.'),
  L('hominem','You’re just tired and grumpy, so you don’t count.','Tired or not, bedtime is still bedtime.'),
  L('herring','Do you know how many stars there are? Let’s count them!','We can count them tomorrow. From bed, tonight.')]}
];

GAMES.mayor=(()=>{
const SITS=[
 {id:'pothole',t:'The Main Street pothole',s:'Fix it? He’d rather not',h:9*60+30,
  lose:'The pothole stays. A family of ducks has moved in, and the mayor calls it a wildlife feature.',win:'Mayor Gloss promises on camera to have it filled by Friday.',lines:[
  L('bandwagon','Every town has potholes. Nobody else is rushing to fix theirs, so why should we?','Other towns’ potholes don’t fill ours.'),
  L('slope','If we fix this pothole, people will want every pothole fixed, then every road repaved, and then the town is bankrupt.','Fixing one dangerous hole doesn’t bankrupt anyone.'),
  L('tuquoque','Your newspaper has typos every week, and you’re lecturing ME about holes?','Our typos don’t swallow bicycles. Back to the pothole.'),
  L('hominem','You only care because you’re a reporter who loves bad news.','Whatever you think of me, the hole is still there.'),
  L('straw','So you’re saying I personally dug this hole with a spoon?','I’m saying you’re in charge of filling it.'),
  L('dilemma','Either we fix the pothole, or we fund the schools. Pick one.','Road repairs have their own budget. It isn’t one or the other.'),
  L('ignorance','Nobody has proven that pothole has caused a single accident.','No proof yet doesn’t make it safe.'),
  L('nature','Potholes are natural. Roads age. It’s the circle of life.','Rust is natural too, and we still repair bridges.'),
  L('herring','Have you seen the lovely new bench outside the library? Very comfortable.','The bench is lovely. The pothole is still there.'),
  L('cause','Since that pothole appeared, tourism has gone up. It’s clearly an attraction.','Tourists came for the summer fair, not the hole.'),
  L('loaded','Why does your paper always try to make our town look bad?','That assumes we’re trying to. We’re asking when the hole gets fixed.')]},
 {id:'statue',t:'The golden statue',s:'He wants a 20-foot statue of himself',h:11*60,
  lose:'A 20-foot golden statue now stands in the square. It’s pointing at itself.',win:'The statue is cancelled. The money goes to the library roof instead.',lines:[
  L('tradition','Towns have always built statues of their leaders. It’s tradition.','Doing it in the past doesn’t make it a good use of money now.'),
  L('circular','The statue is a good idea because it’s an excellent idea.','That’s the same claim twice. Where’s the reason?'),
  L('emotion','My mother has always dreamed of seeing me in gold. Do you want to break her heart?','Your mother’s feelings don’t change the cost to the town.'),
  L('authority','My hairdresser says it’s the best idea she’s ever heard.','Your hairdresser isn’t an expert on public spending.'),
  L('straw','So you hate art? You’d tear down every statue in the world?','I just don’t think the town should pay for one of you.'),
  L('dilemma','Either we build my statue, or the square stays empty and sad forever.','Or we plant trees, add benches, or leave it as it is.'),
  L('hominem','You’re only against it because nobody would ever make a statue of you.','Jealous or not, the question is still the cost.'),
  L('goalposts','I said I’d drop it if 500 people signed the petition. 600 did. But most signed in pencil, so they don’t count.','The deal was 500 signatures. You got 600.'),
  L('anecdote','I visited a town with a gold statue once, and everyone there seemed very happy.','One happy town doesn’t prove the statue made them happy.'),
  L('loaded','Have you stopped hating beautiful things yet?','That assumes I hate them. I just don’t want to fund this one.')]},
 {id:'park',t:'Oak Park',s:'He wants to turn the park into a car park',h:14*60,
  lose:'Oak Park is now a car park. The old swings are space number 14.',win:'Oak Park stays. Mayor Gloss announces a new duck pond, smiling through his teeth.',lines:[
  L('bandwagon','Everyone drives these days. The people have spoken with their cars.','Lots of people driving isn’t a reason to pave the park.'),
  L('slope','If we keep this park, people will want more parks, and soon the whole town is a forest with no roads.','Keeping one park doesn’t turn the town into a forest.'),
  L('straw','So you want to ban cars and make everyone walk everywhere?','I want to keep one park.'),
  L('dilemma','It’s a car park, or nobody will ever visit our shops again.','There are other options, like the empty lot behind the station.'),
  L('anecdote','I couldn’t find a parking space once. Clearly the town needs a car park.','One bad day parking isn’t evidence for the whole town.'),
  L('ignorance','Nobody’s proven that anyone actually uses the park.','Not having a count isn’t proof nobody goes.'),
  L('tuquoque','You drove here today! Hypocrite!','How I got here doesn’t change whether the park is worth keeping.'),
  L('herring','Let’s talk about how much I’ve done for the annual pie contest.','Great pies. Back to the park.'),
  L('hasty','I walked through the park on a rainy Tuesday and saw two people. So nobody uses it.','One wet Tuesday isn’t a fair sample.'),
  L('cause','Since the park got new benches, the shops have been quieter. The park is stealing our customers.','Quieter shops after new benches doesn’t mean the benches caused it.')]},
 {id:'trip',t:'The beach trip',s:'$40,000 for a “fact-finding” trip',h:10*60,
  lose:'Mayor Gloss is posting beach selfies tagged #FactFinding.',win:'The trip is cancelled. He’ll find facts by phone, like everyone else.',lines:[
  L('circular','The trip is necessary because I need to go on it.','That’s just repeating yourself.'),
  L('tuquoque','You went on holiday last year. Did anyone question YOU?','I paid for mine. Who pays for yours?'),
  L('authority','My travel agent assures me it’s an excellent use of public money.','Your travel agent earns money when you book. Not exactly neutral.'),
  L('goalposts','I said I’d cancel if it cost over $30,000. It’s $40,000, but the hotel doesn’t count.','The limit was $30,000. The hotel is part of the cost.'),
  L('emotion','I’ve worked so hard this year. Don’t I deserve a little sunshine?','Feeling tired isn’t a reason for the town to pay for a beach trip.'),
  L('straw','So you think mayors should never leave town? Should I be chained to my desk?','Travel is fine. This particular trip is the question.'),
  L('herring','Did you know our town won “Tidiest Bins” three years running?','Lovely bins. Still a $40,000 trip.'),
  L('loaded','Why are you so against our town learning things?','I’m not. I’m asking why learning needs a beach.'),
  L('bandwagon','Mayors everywhere take trips like this.','Others doing it doesn’t make it good value.'),
  L('slope','If I cancel this trip, we’ll never learn anything, we’ll fall behind, and the town will vanish off the map.','One cancelled trip won’t erase the town.')]},
 {id:'pool',t:'The broken promise',s:'He promised a pool. It never came.',h:16*60,
  lose:'The pool site is still a fenced-off puddle. He calls it “Phase One”.',win:'He admits the promise was broken and names a date for building to start.',lines:[
  L('herring','Before we talk about pools, can we talk about my new podcast?','Let’s stick with the pool.'),
  L('hominem','This question is coming from a reporter who can’t even swim.','My swimming has nothing to do with your promise.'),
  L('tuquoque','Your paper promised a bigger crossword last year and never delivered!','Even so, that doesn’t explain the missing pool.'),
  L('ignorance','Nobody can prove the town really wants a pool.','You promised one, and people voted for it.'),
  L('anecdote','My nephew doesn’t even like swimming.','One nephew doesn’t speak for the whole town.'),
  L('dilemma','Either I build the pool, or I keep taxes low. I can’t possibly do both.','You budgeted for both when you made the promise.'),
  L('cause','Ever since we talked about a pool, it’s rained more. The pool idea is cursed.','The weather has nothing to do with it.'),
  L('straw','So you think I personally hate swimming and want everyone to sink?','I think you made a promise and haven’t kept it.'),
  L('circular','I keep all my promises because I’m a man who keeps promises.','Saying it twice doesn’t prove it. Where’s the pool?'),
  L('loaded','When will you admit you never liked the pool idea anyway?','That assumes something I never said. You’re the one who promised it.')]},
 {id:'debate',t:'Debate night',s:'He’s missed 30 council meetings',h:19*60+30,
  lose:'The moderator moves on. Mayor Gloss gets the biggest cheer of the night for plugging his podcast.',win:'He admits missing 30 meetings and promises to attend every one until the election.',lines:[
  L('tuquoque','My opponent was late to a meeting once, so who’s really the problem here?','Their lateness doesn’t explain your 30 absences.'),
  L('hominem','This question comes from someone who can’t even tie a tie properly.','My tie isn’t on the ballot. Your attendance record is.'),
  L('herring','Let’s talk about what really matters: my new podcast.','The question was about meetings.'),
  L('circular','I’m a hard-working mayor because I work hard as mayor.','That’s the claim, not the evidence.'),
  L('straw','So you think I should sleep in the council chamber?','Just turning up would do.'),
  L('slope','If I went to every meeting I’d have no time for anything else, and the town would collapse.','Going to meetings is part of the job, not the end of the town.'),
  L('authority','My campaign manager says attendance doesn’t matter, and he would know.','Your campaign manager isn’t a neutral judge of your record.'),
  L('hasty','I went to two meetings and nothing happened at either. Meetings are pointless.','Two meetings is far too few to judge.'),
  L('loaded','When did you start wanting mayors to waste time?','That assumes meetings are a waste. Voters might disagree.'),
  L('bandwagon','Lots of mayors skip meetings. It’s totally normal.','Common doesn’t mean acceptable.'),
  L('ignorance','Nobody has proven my missing meetings changed a single thing.','No proof either way. That’s why you should be there.')]},
 {id:'payrise',t:'The pay rise',s:'He voted himself a 50% raise',h:12*60,
  lose:'The raise goes through. He signs it with a gold-plated pen.',win:'He agrees to put the raise to a public vote.',lines:[
  L('tradition','Mayors have always set their own pay. That’s how it’s done.','How it’s always been done doesn’t make it fair.'),
  L('emotion','Do you know how expensive good hair products are these days?','That’s sad, but it’s not a reason for a 50% raise.'),
  L('dilemma','Either I get the raise, or good people will never want to be mayor again.','Or pay is set by an independent panel.'),
  L('circular','I deserve it because I’m worth it.','That’s the same claim twice.'),
  L('tuquoque','You’d take a raise if someone offered you one!','Maybe, but I can’t vote myself one.'),
  L('straw','So you think mayors should work for free?','I think a 50% raise needs a better reason.'),
  L('anecdote','A mayor I know got a raise, and his town did brilliantly.','One town doing well doesn’t mean the raise caused it.'),
  L('cause','Since I got the raise, the town’s had more sunny days.','You don’t control the weather.'),
  L('loaded','Why are you against fair pay?','That assumes the raise is fair. That’s the question.'),
  L('bandwagon','Everybody on the council agreed. Well, everybody I asked.','Agreement from the people you asked isn’t a public mandate.')]},
 {id:'rename',t:'Glossville',s:'He wants to rename the town after himself',h:15*60+30,
  lose:'The new sign is up: Welcome to Glossville. His face is on it.',win:'Brookfield keeps its name. The sign stays exactly as it was.',lines:[
  L('tradition','Plenty of towns are named after people. It’s a fine old tradition.','Being old doesn’t make it right for us.'),
  L('bandwagon','Everyone’s talking about Glossville. It’s trending.','Lots of talk isn’t lots of support.'),
  L('emotion','Imagine my little face on the sign, waving. How could anyone say no to that?','Easily, actually.'),
  L('slope','If we don’t rename it, nobody will remember our town, and it’ll just fade away.','Brookfield has been remembered for 200 years.'),
  L('straw','So you want our town to have no name at all?','I want it to keep the one it has.'),
  L('dilemma','It’s Glossville or Boringtown. Your choice.','There’s a third choice: Brookfield.'),
  L('hominem','You only object because your name is too hard to spell.','My name isn’t the issue. Yours on the sign is.'),
  L('authority','A famous sign painter says Glossville would look amazing.','He’s an expert on paint, not on what the town wants.'),
  L('ignorance','Nobody’s proven that people dislike the name.','No proof they like it either.'),
  L('scotsman','No true local would oppose Glossville. Mrs Patel? She’s only lived here 40 years. Doesn’t count.','Forty years makes her very much a local.')]},
 {id:'bus',t:'The late bus',s:'He wants to cut the only late-night bus',h:21*60,
  lose:'The late bus is cut. Night-shift workers are walking home in the rain.',win:'The late bus stays, and he promises a proper count of who uses it.',lines:[
  L('anecdote','I took that bus once, and it was empty.','One ride isn’t a survey.'),
  L('hasty','I checked it on two nights. Both nearly empty. Nobody needs it.','Two nights is far too few to decide.'),
  L('dilemma','Either we cut the bus, or we cut the fireworks. And I love fireworks.','There are other ways to balance the budget.'),
  L('straw','So you want buses running all night, every night, to every house?','I want to keep the one bus there is.'),
  L('slope','If we keep one late bus, people will want buses to every street, and the town goes broke.','Keeping one bus isn’t buying a fleet.'),
  L('tuquoque','You drive a car! Why do you care about buses?','How I travel doesn’t change who relies on that bus.'),
  L('herring','Let’s talk about the new hanging baskets on the high street.','They’re pretty. The bus question still stands.'),
  L('ignorance','Nobody’s proven night-shift workers actually need the bus.','Nobody’s asked them. Let’s do that.'),
  L('emotion','Think of the poor bus driver, out there alone in the dark. Is that kind?','The driver is paid, and the passengers need getting home.'),
  L('loaded','Why do you want to waste money on empty buses?','That assumes the buses are empty. Let’s count first.')]},
 {id:'lunch',t:'Gloss Bars',s:'He wants every school lunch to be his energy bar',h:12*60+30,
  lose:'Every lunch tray now holds one shiny Gloss Bar. The kids are not impressed.',win:'School lunches stay as they are. Gloss Bars stay in the mayor’s desk drawer.',lines:[
  L('authority','A man at my gym says Gloss Bars have every vitamin you need.','A man at the gym isn’t a nutritionist.'),
  L('nature','They’re made from natural ingredients, so they must be healthy.','Natural doesn’t automatically mean a full, healthy meal.'),
  L('circular','Gloss Bars are nutritious because they’re full of nutrition.','That’s the same claim twice.'),
  L('bandwagon','Kids everywhere are eating energy bars now.','Popular doesn’t mean it’s a proper lunch.'),
  L('cause','Since I started eating Gloss Bars, I’ve won every election.','Your snack didn’t win the elections.'),
  L('straw','So you want kids to eat nothing but boiled cabbage?','I want them to have a proper lunch.'),
  L('hominem','You’re just a grumpy reporter who hates snacks.','My mood doesn’t change what’s in the bar.'),
  L('dilemma','It’s either Gloss Bars or soggy cabbage. Those are the only choices.','There are plenty of other lunches.'),
  L('ignorance','Nobody has proven a Gloss Bar isn’t a complete meal.','It’s on you to show it is one.'),
  L('loaded','Why do you want children to go hungry?','That assumes I do. I want them to eat well.')]}
];

 {id:'games',t:'Game night',s:'Morgan will only play one board game',h:19*60+45,

/* ---------- Tinfoil Hat: debating a conspiracy theorist ---------- */
GAMES.gary=(()=>{
const SITS=[
 {id:'aliens',t:'Aliens at Area 51',s:'Gary says the government is hiding a UFO',h:21*60,
  lose:'You’re now holding Gary’s binoculars on “night watch”. It’s 2 am.',win:'Gary admits the “UFO” video might be a frisbee. He’ll look into it.',lines:[
  L('ignorance','Nobody’s proven there ISN’T a UFO in that hangar. So there is.','Not being able to rule it out isn’t evidence it’s there.'),
  L('bandwagon','Millions of people believe it. Millions can’t be wrong.','Millions once believed the Sun went round the Earth.'),
  L('authority','A famous actor said he saw one, and he’s been in space films.','Acting in space films doesn’t make him an astronomer.'),
  L('hominem','Scientists say no, but scientists are just boring people in lab coats.','Boring or not, what counts is their evidence.'),
  L('dilemma','Either it was an alien spaceship, or the pilot was lying. And pilots don’t lie.','Or it was a balloon, a drone or a trick of the light.'),
  L('anecdote','My mate Trev saw a light in the sky once. That’s all the proof I need.','One light Trev saw isn’t proof of aliens.'),
  L('circular','The cover-up is real because they’re covering it up.','That’s the claim repeated, not evidence for it.'),
  L('goalposts','I said show me inside the hangar. They did a tour? Well, the REAL hangar is underground.','You asked to see inside and they showed you. Now it’s a different hangar.'),
  L('loaded','Why are you helping them hide the truth?','That assumes there’s a hidden truth, and that I’m in on it.'),
  L('cause','My telly went fuzzy right after that light appeared. The aliens did it.','One thing happening after another doesn’t mean it caused it.')]},
 {id:'lizard',t:'Lizard people',s:'Gary thinks his neighbour Keith is a lizard',h:14*60,
  lose:'You catch yourself watching Keith water his roses, just in case.',win:'Gary agrees Keith probably just likes sunbathing.',lines:[
  L('hasty','Keith blinked slowly twice. Lizard.','Two slow blinks aren’t enough to decide someone’s species.'),
  L('ignorance','Can you PROVE Keith isn’t a lizard? No? Exactly.','I can’t prove you aren’t one either. That’s not how proof works.'),
  L('cause','Keith moved in, and that summer was really hot. Lizards love heat. Join the dots.','A hot summer after he moved in doesn’t mean he caused it.'),
  L('circular','You can tell he’s a lizard because of how lizardy he is.','That’s just the claim again.'),
  L('scotsman','No real human likes sunbathing that much. My wife does, but she’s… an exception.','If your wife does, then real humans do. You can’t just exclude her.'),
  L('straw','So you’re saying lizards don’t exist? I’ve SEEN lizards at the zoo.','I’m saying Keith isn’t one.'),
  L('dilemma','Either he’s a lizard person, or he’s hiding something worse.','Or he’s a retired accountant who likes roses.'),
  L('bandwagon','There’s a whole forum that agrees with me. Three thousand members.','Three thousand people agreeing doesn’t make it true.'),
  L('herring','And don’t get me started on his wheelie bin. Always out a day early.','The bin has nothing to do with whether he’s a lizard.'),
  L('emotion','I get a cold shiver every time he waves. Shivers don’t lie.','A feeling isn’t evidence. He’s just being friendly.')]},
 {id:'nessie',t:'The Loch Ness Monster',s:'Gary has a blurry photo',h:16*60+30,
  lose:'You’ve bought a Nessie fridge magnet and a boat ticket.',win:'Gary admits the photo might be a log. A very majestic log.',lines:[
  L('anecdote','A man in the gift shop told me he saw her in 1987.','One man’s story isn’t proof.'),
  L('tradition','People have told this story for hundreds of years. Old stories are true stories.','A story being old doesn’t make it true.'),
  L('ignorance','Nobody has searched every inch of that loch. So she’s in there.','Not having checked everywhere isn’t evidence she’s there.'),
  L('authority','The tour boat captain says she’s real, and he’s on that water every day.','He also sells the tickets. He’s not a neutral expert.'),
  L('dilemma','That shape is either Nessie or a submarine. And it’s not a submarine.','Or a log, a wave, a bird or a boat’s wake.'),
  L('goalposts','I said if a sonar scan found nothing, I’d drop it. They scanned it. But she was obviously on holiday.','The scan was your test, and it found nothing.'),
  L('hominem','The people who say she’s fake have never even owned a boat.','Owning a boat has nothing to do with whether they’re right.'),
  L('bandwagon','A million tourists a year come to see her. They can’t all be wrong.','Lots of visitors doesn’t mean she’s there. The scenery’s nice too.'),
  L('circular','The photo is real because it’s a genuine photo.','That says the same thing twice.'),
  L('straw','So you think nothing lives in that loch at all? No fish? Nothing?','Plenty lives there. Just not a monster.')]},
 {id:'bigfoot',t:'Bigfoot',s:'Gary found a big footprint',h:11*60,
  lose:'You’re in a bush at dawn holding a sandwich “as bait”.',win:'Gary measures the footprint again. It matches his own wellies.',lines:[
  L('hasty','One footprint. That’s all I need. Bigfoot lives in these woods.','One print is far too little to go on.'),
  L('cause','I shouted “Bigfoot!” and a branch snapped. He answered me.','A branch snapping after you shouted doesn’t mean it was a reply.'),
  L('ignorance','No one has proven he DOESN’T exist.','It’s on you to show he does.'),
  L('nature','It’s only natural there’d be a big hairy man of the woods. Nature’s full of big hairy things.','Sounding natural isn’t the same as being real.'),
  L('authority','A wrestler I follow says he met Bigfoot.','A wrestler isn’t a wildlife expert.'),
  L('slope','If we admit this print is fake, then every print is fake, then nothing’s real, and what’s the point of anything?','Doubting one footprint doesn’t make everything unreal.'),
  L('tuquoque','You believed in the tooth fairy!','I was six. And that doesn’t make Bigfoot real.'),
  L('emotion','I’ve wanted this my whole life. Don’t take it from me.','Wanting it to be true doesn’t make it true.'),
  L('loaded','Why are you so scared of the truth?','That assumes it’s the truth, and that I’m scared.'),
  L('anecdote','My cousin’s dog barked at the woods all night once.','Dogs bark at lots of things. That’s one night and one dog.')]},
 {id:'moon',t:'The Moon landing',s:'Gary says it was filmed in a studio',h:22*60,
  lose:'You’re squinting at a photo of the flag, wondering about the wind.',win:'Gary agrees to read about the mirrors the astronauts left on the Moon.',lines:[
  L('ignorance','I’ve never seen proof with my own eyes. So it didn’t happen.','You not having seen the proof doesn’t mean there isn’t any.'),
  L('hominem','Astronauts are just show-offs in fancy suits. Why believe them?','Insulting them doesn’t answer the evidence.'),
  L('anecdote','My uncle worked in TV and says it would be easy to fake.','One uncle’s opinion isn’t evidence that it was faked.'),
  L('dilemma','Either the flag waved because of wind, or physics is broken.','Or it swung because they’d just planted it, with no air to slow it.'),
  L('goalposts','Show me the Moon rocks, I said. They did. But rocks could come from anywhere, so now show me the footprints.','You asked for rocks and got them. Now the test has changed.'),
  L('bandwagon','Loads of people online say it was fake.','Lots of people saying it doesn’t make it so.'),
  L('circular','It was faked because it wasn’t real.','That’s the same claim twice.'),
  L('straw','So you believe everything you see on TV?','No. I believe this because of the evidence.'),
  L('loaded','How much are they paying you to say that?','That assumes someone’s paying me. Nobody is.'),
  L('cause','They landed in 1969, and my grandad’s shed burned down that same year. Makes you think.','Two things in the same year aren’t connected just by timing.')]},
 {id:'flat',t:'Flat Earth',s:'Gary says the horizon looks flat to him',h:9*60,
  lose:'You’re helping Gary build a fence “at the edge”.',win:'Gary watches a ship sink below the horizon hull-first and goes very quiet.',lines:[
  L('hasty','I looked out of my window. Flat. Case closed.','One window view is far too little to judge a whole planet.'),
  L('nature','Water naturally lies flat. So the Earth must be flat.','What seems natural in a bathtub doesn’t settle the shape of a planet.'),
  L('authority','A rapper I like says it’s flat.','A rapper isn’t an expert on planets.'),
  L('ignorance','You’ve never been to space. So you can’t prove it’s round.','I don’t need to go to space. And my not going doesn’t make it flat.'),
  L('straw','So you think we’re all hanging upside down, clinging on by our shoes?','That’s not what a round Earth means.'),
  L('hominem','Globe people are sheep.','Calling people names doesn’t flatten the Earth.'),
  L('bandwagon','The Flat Earth Society has members all around the globe.','Membership numbers don’t change the shape of the planet.'),
  L('tradition','For thousands of years everyone knew it was flat. Why change now?','Believing it for a long time didn’t make it right.'),
  L('circular','It’s flat because it isn’t round.','That’s just the claim again.'),
  L('slope','If the Earth is a ball, then maps are wrong, then schools are wrong, then EVERYTHING is a lie.','A round Earth doesn’t make everything a lie.')]},
 {id:'birds',t:'Birds aren’t real',s:'Gary says pigeons are spy drones',h:13*60,
  lose:'You find yourself whispering near pigeons.',win:'A pigeon eats Gary’s chip. He admits drones don’t eat chips.',lines:[
  L('cause','A pigeon landed near me, and the next day I got a parking ticket. They reported me.','The ticket came after the pigeon, not because of it.'),
  L('ignorance','Have you ever opened a pigeon up to check? No. So you don’t know.','Not having checked isn’t evidence they’re drones.'),
  L('hasty','I saw one bird sitting on a power line. Charging. They all do it.','One bird on a wire doesn’t tell you about all birds.'),
  L('dilemma','They’re either drones or they’re aliens.','Or they’re birds.'),
  L('circular','Birds are fake because they’re not real.','That says the same thing twice.'),
  L('anecdote','My barber found a feather that felt “a bit plasticky”.','One odd feather isn’t proof of anything.'),
  L('loaded','When did you start working for the pigeons?','That assumes I do. I don’t.'),
  L('herring','Anyway, have you noticed how squirrels always look guilty?','Squirrels aren’t the question. Pigeons are.'),
  L('straw','So you trust every single thing that flies? Even wasps?','I only said pigeons are birds.'),
  L('scotsman','No real bird would stare at a man’s sandwich like that. Seagulls do, but they’re obviously the advanced models.','Seagulls are real birds, and they stare at sandwiches.')]},
 {id:'crop',t:'Crop circles',s:'Gary found a pattern in a field',h:7*60+30,
  lose:'You’re standing in a wheat field at sunrise holding a tape measure.',win:'The farmer shows Gary the plank and rope. Gary takes notes.',lines:[
  L('dilemma','Either aliens made it, or the wheat did it by itself.','Or people made it with planks and rope.'),
  L('ignorance','Nobody saw who made it. So it was aliens.','Not knowing who did it doesn’t point to aliens.'),
  L('authority','A man with a very long beard on a documentary said it’s a message.','A long beard isn’t a qualification.'),
  L('emotion','It’s so beautiful it gave me goosebumps. Humans couldn’t make me feel that.','Goosebumps tell us how you feel, not who made it.'),
  L('hominem','The farmer who says he made it has shifty eyes.','His eyes don’t change whether he made it.'),
  L('goalposts','I said if someone showed me how it’s done, I’d believe them. They did. But they did it in daylight, so it doesn’t count.','You asked to be shown, and you were.'),
  L('bandwagon','Everyone in the village thinks it’s aliens.','A village agreeing doesn’t make it so.'),
  L('circular','It’s a message from space because space sent it.','That’s the claim repeated.'),
  L('cause','The circle appeared, and then my hens stopped laying. The aliens upset them.','Hens stop laying for lots of reasons. Timing isn’t proof.'),
  L('slope','If we say people made this one, next they’ll say people made the pyramids, and then there’s no mystery left anywhere.','Explaining one field doesn’t end all mystery.')]},
 {id:'triangle',t:'The Bermuda Triangle',s:'Gary won’t fly anywhere near it',h:10*60+30,
  lose:'Gary has rerouted your holiday through four extra airports.',win:'Gary reads that ships go missing there about as often as anywhere else. He books the direct flight.',lines:[
  L('hasty','Two boats went missing there. The whole place is cursed.','Two boats in a huge, busy stretch of sea isn’t a curse.'),
  L('anecdote','A bloke at the pub knew a sailor whose compass went funny.','A third-hand story about one compass isn’t evidence.'),
  L('ignorance','Science can’t explain every single disappearance. So it’s supernatural.','Not having every answer doesn’t make it magic.'),
  L('slope','If I fly over it, the compass spins, the engine stops, and I end up in another dimension.','Planes cross it every day and land on time.'),
  L('emotion','Just saying the name gives me the creeps. That has to mean something.','It means the name is creepy. That’s all.'),
  L('bandwagon','There are loads of books about it. They wouldn’t print them if it wasn’t true.','Lots of books sell because the story is fun, not because it’s true.'),
  L('straw','So you’re saying nothing bad has ever happened at sea?','Bad things happen at sea everywhere. That’s the point.'),
  L('cause','A plane flew through it, and a week later the pilot got the flu.','The flu a week later has nothing to do with the route.'),
  L('tradition','Sailors have feared it for generations. You don’t argue with generations.','A fear being old doesn’t make it right.'),
  L('loaded','Why do you want me to vanish?','That assumes you would. You wouldn’t.')]},
 {id:'pyramid',t:'The pyramids',s:'Gary says aliens built them',h:15*60,
  lose:'You’re sketching “landing pads” on a napkin.',win:'Gary watches people move a huge stone with ropes and sledges. “Huh.”',lines:[
  L('ignorance','I can’t work out how people built them. So people didn’t.','Not knowing how isn’t proof that aliens did it.'),
  L('dilemma','It was either aliens or magic.','Or thousands of skilled workers, ramps and decades.'),
  L('hominem','Archaeologists just dig holes for a living. What do they know?','Mocking their job doesn’t answer their findings.'),
  L('authority','A TV presenter with amazing hair says it was aliens.','Great hair doesn’t make him an expert on Egypt.'),
  L('circular','Humans couldn’t have built them, because building them was impossible for humans.','That assumes the very thing you’re trying to show.'),
  L('hasty','I tried to lift one big rock in my garden and couldn’t. So nobody could move those stones.','You alone with one rock isn’t thousands of workers with tools.'),
  L('bandwagon','That show has had twenty series. Twenty! It must be true.','Popular telly isn’t evidence.'),
  L('straw','So you think one bloke stacked them all in a weekend?','Nobody says that. It took huge teams and many years.'),
  L('goalposts','I said show me the tools. They found the tools. Fine, but where are the receipts?','You asked for tools, and there they are.'),
  L('herring','Speaking of Egypt, did you know cats were basically royalty there?','Nice cat fact. It doesn’t tell us who built the pyramids.')]},
 {id:'elvis',t:'Elvis is alive',s:'Gary saw him at the chip shop',h:18*60+30,
  lose:'You’re staking out the chip shop with Gary. Cod and chips twice.',win:'Gary meets the man. His name is Brian. He’s a very good impersonator.',lines:[
  L('hasty','A man with sideburns ordered chips. It was him.','Sideburns and chips aren’t much to go on.'),
  L('anecdote','My aunt swears she sat next to him on a bus in 1994.','One aunt on one bus isn’t proof.'),
  L('ignorance','Nobody’s proven that man ISN’T Elvis.','You’d need a reason to think he is.'),
  L('emotion','I just feel it in my heart. The heart knows.','A strong feeling isn’t evidence.'),
  L('dilemma','Either that was Elvis, or my eyes don’t work.','Or it was someone who looks a bit like him.'),
  L('bandwagon','Thousands of people have spotted him.','Thousands of sightings of lookalikes don’t add up to one Elvis.'),
  L('circular','He’s alive because he never died.','That’s the same claim twice.'),
  L('cause','I played his record, and ten minutes later that man walked past. He heard it.','Him walking past afterwards doesn’t mean the record brought him.'),
  L('goalposts','I said if he couldn’t sing, I’d drop it. He can’t sing. Well, obviously he’s hiding his voice.','That was your test, and he failed it.'),
  L('tuquoque','You thought you saw a famous footballer at the airport once!','I did, and I was wrong. That’s rather the point.')]},
 {id:'hollow',t:'Hollow Earth',s:'Gary says there’s a second world underground',h:20*60,
  lose:'You’re holding the torch while Gary digs up the lawn.',win:'Gary hits a water pipe, gets soaked, and agrees to read a geology book first.',lines:[
  L('ignorance','Nobody’s drilled all the way down. So there could be a whole world in there.','“Could be” because nobody’s looked isn’t evidence.'),
  L('authority','A bestselling novelist wrote about it. They don’t let you write books that aren’t true.','Novels are made up. That’s what a novelist does.'),
  L('slope','If I stop digging now, I’ll never know, then I’ll stop asking questions, and then I’ll be just like everyone else.','Putting the spade down doesn’t end your curiosity.'),
  L('hominem','Geologists are just people who couldn’t get proper jobs.','That’s an insult, not an answer to their measurements.'),
  L('straw','So you think the ground is solid rock all the way down, with no caves at all?','There are caves. There isn’t a second world.'),
  L('tradition','Ancient legends talk about underground kingdoms. Ancient people knew things.','Being an old legend doesn’t make it a fact.'),
  L('hasty','I dug down two feet and found a worm tunnel. Tunnels all the way down.','Two feet of lawn doesn’t tell you about the whole planet.'),
  L('circular','There’s a world inside because the inside has a world in it.','That’s the claim repeated.'),
  L('loaded','What are they paying you to keep me above ground?','That assumes there’s a “they”, and that they’re paying me.'),
  L('herring','Did you know moles can dig eighteen metres in a day? Incredible animals.','Moles are great. They don’t prove a hidden world.')]}
];

 {id:'tree',t:'Up the oak tree',s:'Dale won’t come down until he gets his lawnmower back',h:10*60,

 {id:'drivethru',t:'The drive-thru',s:'Dale is camping in the lane until they bring back Zing Sauce',h:12*60+15,

  L('bandwagon','Everyone loved Zing Sauce. Everyone! So they have to bring it back.','Lots of people liking it doesn’t mean they have to.'),

  L('emotion','Do you know what it’s like to dip a nugget in NOTHING?','That sounds sad, Dale. It’s still not a reason to block the lane.'),

 {id:'library',t:'The library',s:'Dale has chained himself to the returns desk over a 40p fine',h:15*60+45,

 {id:'bouncy',t:'The bouncy castle',s:'Dale won’t get off. It’s for under-10s.',h:14*60+30,

 {id:'fountain',t:'The fountain',s:'Dale has declared it the Kingdom of Dale',h:13*60,
  lose:'The Kingdom of Dale now has a flag. It’s a sock on a stick.',win:'King Dale abdicates, wades out, and accepts a towel.',lines:[

 {id:'checkout',t:'The self-checkout',s:'Dale won’t move until the machine apologises',h:17*60+20,

 {id:'statue',t:'The town statue',s:'Dale is on the plinth and wants to be the new statue',h:11*60+30,

 {id:'pedalo',t:'The pedal boat',s:'Dale’s hour ran out three hours ago',h:16*60,

 {id:'karaoke',t:'Karaoke night',s:'Dale won’t give back the microphone',h:22*60+15,

 {id:'roundabout',t:'The roundabout',s:'Dale is in a deckchair in the middle of it',h:8*60+15,

 {id:'ballpit',t:'The ball pit',s:'Dale is hiding in it at the soft play centre',h:10*60+45,

 {id:'lights',t:'The Christmas lights',s:'Dale has the switch and wants to do the countdown',h:18*60,

 const w=weakest();
 board.innerHTML='<div class="center"><p class="title">Nice Try</p><p>Six people, hundreds of excuses, and every one hides a logical fallacy. Pick who you want to argue with.</p>'+
  '<p class="starline"><b>★ '+allStars()+'</b> of '+TOTAL+' stars'+(w?' · Your trickiest fallacy so far: <b>'+F[w][0]+'</b>':'')+'</p></div>'+
  '<div class="games">'+ORDER.map(k=>{const c=CFG[k],S=GAMES[k].SITS,n=S.length,wn=S.filter(s=>RECS[k][s.id]==='won').length,sr=S.reduce((m,s)=>m+starsOf(k,s.id),0);
   return '<button class="game" data-g="'+k+'" style="--tint:'+c.tint+'"><span class="gname">'+c.name+'</span><span class="grole">'+c.role+' · vs '+c.who+'</span><span class="gblurb">'+c.blurb+'</span><span class="tag'+(wn?' won':'')+'">'+(wn?'Won '+wn+' of '+n+' · ★ '+sr:n+' situations')+'</span></button>'}).join('')+'</div>'+
  '<button class="game wide" id="mara" style="--tint:#f7eefb"><span class="gname">Marathon</span><span class="grole">Everyone, all mixed up</span><span class="gblurb">Excuses from all six games in a random order. Keep going until you miss three.</span><span class="tag'+(STATS.best?' won':'')+'">'+(STATS.best?'Best score: '+STATS.best:'No score yet')+'</span></button>'+
  '<div class="row" style="justify-content:center"><button class="go" id="anyg">Surprise me</button><a class="ghost" href="index.html">Back to the Vault</a></div>';
 board.querySelectorAll('.game[data-g]').forEach(b=>{b.onclick=()=>{useGame(b.dataset.g);title()};b.onmouseenter=b.onfocus=()=>{if(view==='hub')preview(b.dataset.g)}});
 $('mara').onclick=marathon;
 $('anyg').onclick=()=>{useGame(pick(ORDER));const fresh=D.SITS.filter(s=>rec[s.id]!=='won');start(pick(fresh.length?fresh:D.SITS).id)};
 board.querySelector('.game[data-g="'+gk+'"]').focus({preventScroll:true});}

function title(){
 view='title';st=null;preview(gk);
 $('topic').textContent=G.name;$('topicSub').textContent=G.role+' · vs '+G.who;$('meters').innerHTML='';
 const S=D.SITS,won=S.filter(s=>rec[s.id]==='won').length;
 board.innerHTML='<div class="center"><p class="title">'+G.name+'</p><p>'+G.intro+'</p>'+
  '<div class="rules"><div><b>Spot 5</b><span>'+G.spot+'</span></div><div><b>Miss 3</b><span>'+G.miss+'</span></div><div><b>Earn stars</b><span>Three stars for a perfect round. Each miss, or using the hint, costs one.</span></div></div>'+
  '<div class="menuhead"><h2>Pick a situation</h2><span>You’ve won '+won+' of '+S.length+'</span></div>'+
  '<div class="sits">'+S.map(s=>{const r=rec[s.id];return '<button class="sit" data-id="'+s.id+'"><b>'+s.t+'</b><small>'+s.s+'</small><span class="tag '+(r||'')+'">'+(r==='won'?'<span class="stars">'+starStr(starsOf(gk,s.id))+'</span> '+G.tagW:r==='lost'?G.tagL:'Not tried yet')+'</span></button>'}).join('')+'</div>'+
  '<div class="row" style="justify-content:center"><button class="go" id="rand">Surprise me</button><button class="ghost" id="tohub">All games</button></div></div>';
 board.querySelectorAll('.sit').forEach(b=>b.onclick=()=>start(b.dataset.id));
 $('rand').onclick=()=>{const fresh=S.filter(s=>rec[s.id]!=='won');start(pick(fresh.length?fresh:S).id)};
 $('tohub').onclick=hub;}

function start(id){
 view='play';
 const sit=D.SITS.find(s=>s.id===id);time=sit.h;setScene(id);scene.setAttribute('aria-label',G.who+': '+sit.t);
 st={mode:'s',sit,queue:shuffle(sit.lines.slice()).map(l=>({k:gk,s:sit,l})),qi:0,right:0,wrong:0,streak:0,hints:1,used:false};
 ask();board.scrollIntoView({block:'nearest'});}
function marathon(){
 view='play';const all=[];
 for(const k of ORDER)for(const s of GAMES[k].SITS)for(const l of s.lines)all.push({k,s,l});
 st={mode:'m',queue:shuffle(all),qi:0,right:0,wrong:0,streak:0,hints:2,used:false};
 ask();board.scrollIntoView({block:'nearest'});}
const quit=()=>st&&st.mode==='m'?hub():title();

function ask(){
 const q=st.queue[st.qi],line=q.l;
 if(st.mode==='m'){useGame(q.k);st.sit=q.s;time=q.s.h;setScene(q.s.id);scene.setAttribute('aria-label',G.who+': '+q.s.t)}
 mood('argue');hud();
 const excl=[line.f].concat(CLASH[line.f]||[]);
 st.opts=shuffle([line.f].concat(shuffle(Object.keys(F).filter(k=>!excl.includes(k))).slice(0,3)));st.locked=false;
 board.innerHTML='<div class="bubble pop"><span class="who">'+G.who+'</span>'+esc(line.k)+'</div>'+
  '<p class="ask">Which fallacy is '+G.who+' using?</p><div class="opts">'+
  st.opts.map((k,i)=>'<button class="opt" data-k="'+k+'"><kbd>'+(i+1)+'</kbd>'+F[k][0]+'</button>').join('')+'</div>'+
  '<div class="row"><button class="ghost" id="hint"'+(st.hints?'':' disabled')+'>Hint: remove two ('+st.hints+' left)</button><button class="ghost quit">Give up and go back to the menu</button></div>';
 board.querySelector('.quit').onclick=quit;$('hint').onclick=hint;
 board.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(b.dataset.k));}

function hint(){
 if(!st||st.locked||!st.hints)return;st.hints--;st.used=true;
 const line=st.queue[st.qi].l;
 shuffle([...board.querySelectorAll('.opt')].filter(b=>b.dataset.k!==line.f)).slice(0,2).forEach(b=>{b.disabled=true;b.classList.add('cut')});
 $('hint').disabled=true;$('hint').textContent='Hint used ('+st.hints+' left)';tone([520]);}

function answer(k){
 if(!st||st.locked)return;st.locked=true;
 const line=st.queue[st.qi].l,ok=k===line.f;
 time+=3;
 board.querySelectorAll('.opt').forEach(b=>{b.disabled=true;if(b.dataset.k===line.f)b.classList.add('right');else if(b.dataset.k===k)b.classList.add('wrong')});
 const s=STATS.f[line.f]=STATS.f[line.f]||[0,0];
 if(ok){st.right++;st.streak++;s[0]++;mood('stunned','smug');tone([660,880])}else{st.wrong++;st.streak=0;s[1]++;time+=10;mood('gloat','tired');tone([220,165])}
 saveStats();gloss();st.qi++;hud();
 const m=st.mode==='m',done=m?(st.wrong>=MAX||st.qi>=st.queue.length):(st.right>=NEED||st.wrong>=MAX);
 const fb=document.createElement('div');fb.className='fb pop '+(ok?'good':'bad');
 fb.innerHTML=ok?
  '<h3>Spotted it: '+F[line.f][0]+(st.streak>=3?' <span class="streak">'+st.streak+' in a row</span>':'')+'</h3><div class="bubble parent"><span class="who">You</span>'+esc(line.r)+'</div><p class="def">'+F[line.f][1]+'</p>':
  '<h3>Not quite. That was '+F[line.f][0]+'</h3><div class="bubble"><span class="who">'+G.who+'</span>'+esc(pick(D.TAUNTS))+'</div><p class="def"><b>'+F[line.f][0]+':</b> '+F[line.f][1]+'</p><p class="def"><b>You picked '+F[k][0]+':</b> '+F[k][1]+'</p><p>You could have said: “'+esc(line.r)+'”</p>';
 fb.insertAdjacentHTML('beforeend','<div class="row"><button class="go" id="next">'+(done?'See what happens':'Next excuse')+' →</button>'+(done?'':'<button class="ghost" id="quit2">Give up</button>')+'</div>');
 const hb=$('hint');if(hb)hb.parentNode.remove();
 board.appendChild(fb);$('next').onclick=next;if($('quit2'))$('quit2').onclick=quit;$('next').focus();}

function next(){
 if(st.mode==='m')return st.wrong>=MAX||st.qi>=st.queue.length?endM():ask();
 if(st.right>=NEED)return end(true);
 if(st.wrong>=MAX)return end(false);
 ask();}

function end(won){
 view='end';
 const s=st.sit,S=D.SITS;let stars=0;
 if(won){rec[s.id]='won';stars=Math.max(1,3-st.wrong-(st.used?1:0));rec['*'+s.id]=Math.max(rec['*'+s.id]||0,stars)}else if(rec[s.id]!=='won')rec[s.id]='lost';save();
 mood(won?(s.sleep?'sleep':'sulk'):'gloat',won?'smug':'tired');tone(won?[523,659,784,1047]:[196,165,131]);
 $('meters').innerHTML='';
 $('topicSub').textContent=won?G.subW:G.subL;
 const nextSit=S[(S.indexOf(s)+1)%S.length];
 board.innerHTML='<div class="center pop"><p class="big '+(won?'won':'lost')+'">'+(won?G.endW:G.endL)+'</p>'+(won?'<p class="bigstars" aria-label="'+stars+' of 3 stars">'+starStr(stars)+'</p>':'')+'<p>'+(won?s.win:s.lose)+'</p>'+
  '<div class="stats"><div><b>'+st.right+'</b><span>fallacies spotted</span></div><div><b>'+st.wrong+'</b><span>missed</span></div><div><b>'+$('timeLbl').textContent+'</b><span>when it ended</span></div></div>'+
  (won&&stars<3?'<p class="def">'+(st.used&&!st.wrong?'Play it without the hint for three stars.':'Win with no misses and no hint for three stars.')+'</p>':'')+
  '<div class="row"><button class="go" id="nx">Next: '+nextSit.t+'</button><button class="ghost" id="again">Try this one again</button><button class="ghost" id="back">Back to the menu</button><button class="ghost" id="tohub">All games</button></div></div>';
 $('nx').onclick=()=>start(nextSit.id);$('again').onclick=()=>start(s.id);$('back').onclick=title;$('tohub').onclick=hub;$('nx').focus();}

function endM(){
 view='end';
 const best=st.right>STATS.best;if(best){STATS.best=st.right;saveStats()}
 mood(st.wrong>=MAX?'gloat':'sulk',st.wrong>=MAX?'tired':'smug');tone(best?[523,659,784,1047]:[196,165,131]);
 $('meters').innerHTML='';$('topicSub').textContent='Final score: '+st.right;
 board.innerHTML='<div class="center pop"><p class="big '+(best?'won':'lost')+'">'+(best?'New best score!':st.wrong>=MAX?'You’re worn out.':'You answered everything!')+'</p>'+
  '<div class="stats"><div><b>'+st.right+'</b><span>fallacies spotted</span></div><div><b>'+STATS.best+'</b><span>best score</span></div><div><b>'+st.qi+'</b><span>excuses heard</span></div></div>'+
  '<p>'+(st.right>=20?'That’s a serious score. Very little gets past you.':st.right>=10?'Solid work. A few of them still slipped past.':'The cheat sheet below shows which fallacies you’re missing most.')+'</p>'+
  '<div class="row"><button class="go" id="again">Run it again</button><button class="ghost" id="tohub">All games</button></div></div>';
 $('again').onclick=marathon;$('tohub').onclick=hub;$('again').focus();}

document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){if(view==='title')hub();else if(view!=='hub')quit();return}
 if(!st||st.locked||!board.querySelector('.opt'))return;
 if(e.key==='h'||e.key==='H'){hint();return}
 const n=parseInt(e.key,10);
 if(n>=1&&n<=4){const b=board.querySelectorAll('.opt')[n-1];if(b&&!b.disabled)answer(b.dataset.k)}});
sndLabel();gloss();hub();

}
</script>
</body>
</html>
