<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RACE to Respond</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: picker band (level, theme, question) → question banner, 2×2 RACE starter cards | word bank */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --sunk:#EAEEF5; --ink:#1B2232; --muted:#566079; --line:#D9DFEA;
  --accent:#2F55D4;
  --r:#0F7A6C; --a:#2F55D4; --c:#A86A10; --e:#7445BE;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  --radius:14px;
  --starter:22px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141B; --surface:#191E28; --sunk:#222836; --ink:#E7EBF3; --muted:#9BA4B8; --line:#2C3443;
  --accent:#86A2FF; --r:#4CC3B1; --a:#86A2FF; --c:#E4B04F; --e:#B994F2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141B; --surface:#191E28; --sunk:#222836; --ink:#E7EBF3; --muted:#9BA4B8; --line:#2C3443;
  --accent:#86A2FF; --r:#4CC3B1; --a:#86A2FF; --c:#E4B04F; --e:#B994F2; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:17px/1.5 var(--body);padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1280px;margin-inline:auto;display:grid;gap:18px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:14px}
.mark{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.mark span{width:30px;height:38px;border-radius:7px;display:grid;place-items:center;font:800 22px var(--display);color:var(--surface)}
.mark span:nth-child(1){background:var(--r)}.mark span:nth-child(2){background:var(--a)}
.mark span:nth-child(3){background:var(--c)}.mark span:nth-child(4){background:var(--e)}
.brand h1{font-size:28px}
.brand p{margin:0;color:var(--muted);font-size:14px}
.topRight{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
.levels{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:14px;flex-wrap:wrap}
.levels button{border:0;background:transparent;padding:8px 14px;border-radius:10px;text-align:left;display:grid;line-height:1.2}
.levels b{font-family:var(--display);font-size:17px}
.levels small{color:var(--muted);font-size:12px}
.levels button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.levels button[aria-pressed="true"] small{color:var(--ink)}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 13px;font-size:14px;font-weight:700;display:inline-flex;gap:7px;align-items:center}
.btn svg{width:16px;height:16px}
#ctx{display:none;gap:8px;align-items:center;font-size:14px;color:var(--muted)}
#ctx i{width:10px;height:10px;border-radius:50%;background:var(--tc)}
#ctx b{color:var(--ink)}

/* picker */
.pick{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:grid;gap:16px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.themes button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;display:grid;gap:2px}
.themes button b{font-family:var(--display);font-size:16px;line-height:1.15;display:flex;gap:8px;align-items:center}
.themes button b::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--tc);flex:none}
.themes button small{color:var(--muted);font-size:12.5px}
.themes button:hover,.themes button[aria-pressed="true"]{border-color:var(--tc)}
.themes button[aria-pressed="true"]{background:color-mix(in srgb,var(--tc) 10%,var(--surface))}
.years{display:flex;flex-wrap:wrap;gap:6px}
.years button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:7px 16px;font:700 16px var(--display);min-width:64px}
.years button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.qs{display:grid;gap:6px}
.qs button{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:9px 12px;text-align:left;display:flex;gap:10px;align-items:baseline}
.qs button::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);flex:none;transform:translateY(2px)}
.qs button[aria-pressed="true"]{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 8%,var(--surface))}
.qs button[aria-pressed="true"]::before{border-color:var(--tc);background:radial-gradient(var(--tc) 45%,transparent 50%)}
.qs button.custom-q{color:var(--muted)}
.customRow input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;margin-top:8px}

/* board */
.work{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:960px){.work{grid-template-columns:minmax(0,1fr)}}
.main{display:grid;gap:14px;min-width:0}
.qbanner{border-radius:var(--radius);padding:16px 20px;background:color-mix(in srgb,var(--tc) 13%,var(--surface));border:1.5px solid color-mix(in srgb,var(--tc) 45%,transparent)}
.qbanner .label{color:color-mix(in srgb,var(--tc) 70%,var(--ink))}
.qbanner h2{font-size:clamp(26px,3.4vw,38px);margin-top:2px}
.qbanner .meta{margin:8px 0 0;display:grid;gap:2px;font-size:14.5px;color:var(--muted);line-height:1.4}
.qbanner .meta b{color:var(--ink)}

#steps{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:760px){#steps{grid-template-columns:minmax(0,1fr)}}
.step{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--sc);border-radius:var(--radius);padding:14px 18px 18px;display:grid;gap:10px;align-content:start;min-width:0}
.step header{display:flex;gap:12px;align-items:center}
.step .letter{background:var(--sc);color:var(--surface);font:800 28px/1 var(--display);width:44px;height:44px;border-radius:10px;display:grid;place-items:center;flex:none}
.step h3{font-size:28px;color:var(--sc)}
.step .tip{margin:0;color:var(--muted);font-size:17px;line-height:1.4}
.echo{margin:0;font-size:19px;line-height:1.45;background:color-mix(in srgb,var(--sc) 9%,var(--surface));border-radius:10px;padding:8px 12px;display:grid;gap:2px}
.echo span{font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--muted)}
.echo b{color:var(--sc)}
.starters{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.starters li{font-size:var(--starter);line-height:1.35;font-weight:700;padding-left:22px;position:relative;overflow-wrap:anywhere}
.starters li::before{content:"";position:absolute;left:0;top:.45em;width:10px;height:10px;border-radius:3px;background:var(--sc)}
.blank{display:inline-block;width:3.2em;border-bottom:3px solid color-mix(in srgb,var(--sc) 70%,transparent);margin-inline:.12em;transform:translateY(-.18em)}

.aside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:960px){.aside{position:static}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:grid;gap:10px}
.panel h3{font-size:24px}
.sub{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 13px;font-size:19px;font-weight:700}
.chip.topic{border-color:color-mix(in srgb,var(--tc) 55%,var(--line));background:color-mix(in srgb,var(--tc) 8%,var(--surface))}

/* ---------- Full screen: one laptop screen, essentials only ---------- */
@media (min-width:900px){
  html.fit,html.fit body{height:100%}
  html.fit body{overflow:hidden;padding-block:10px}
  .fit .wrap{max-width:none;height:100%;grid-template-rows:auto minmax(0,1fr);gap:10px}
  .fit .pick,.fit .levelWrap,.fit .brand p{display:none}
  .fit #ctx{display:inline-flex}
  .fit .top{align-items:center}
  .fit .topRight{align-items:center}
  .fit .mark span{width:22px;height:28px;font-size:17px;border-radius:5px}
  .fit .brand h1{font-size:21px}
  .fit .btn{padding:4px 11px;font-size:13px}
  .fit .work{grid-template-columns:minmax(0,1fr) clamp(240px,22vw,320px);gap:12px;height:100%;min-height:0}
  .fit .main{grid-template-rows:auto minmax(0,1fr);gap:10px;height:100%;min-height:0}
  .fit .qbanner{padding:8px 16px}
  .fit .qbanner h2{font-size:clamp(22px,3.6vh,34px)}
  .fit .qbanner .meta{margin-top:3px;font-size:clamp(12px,1.6vh,14px)}
  .fit #steps{grid-template-rows:1fr 1fr;gap:10px;min-height:0}
  .fit .step{min-height:0;overflow:auto;padding:10px 16px 12px;gap:7px;border-top-width:5px}
  .fit .step .letter{width:34px;height:34px;font-size:22px}
  .fit .step h3{font-size:clamp(20px,3vh,26px)}
  .fit .step .tip{font-size:clamp(14px,2vh,17px)}
  .fit .echo{font-size:clamp(15px,2.2vh,19px);padding:5px 10px}
  .fit .starters{gap:clamp(4px,1vh,10px)}
  .fit{--starter:clamp(17px,2.9vh,26px)}
  .fit .aside{position:static;height:100%;min-height:0}
  .fit .panel{height:100%;overflow:auto;align-content:start;padding:12px 14px}
  .fit .panel h3{font-size:20px}
  .fit .chip{font-size:clamp(14px,2.1vh,19px);padding:3px 10px}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true"><span>R</span><span>A</span><span>C</span><span>E</span></div>
      <div><h1>RACE to Respond</h1><p>Restate · Answer · Cite · Explain</p></div>
    </div>
    <div class="topRight">
      <span id="ctx"></span>
      <div class="levelWrap">
        <div class="label" style="margin-bottom:6px">Choose your level</div>
        <div class="levels" id="levels" role="group" aria-label="Scaffold level"></div>
      </div>
      <button class="btn" id="fsBtn" aria-pressed="false">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/></svg>
        <span>Full screen</span>
      </button>
    </div>
  </header>

  <section class="pick" aria-label="Choose a year group, unit and question">
    <div>
      <div class="label" style="margin-bottom:8px">Year group</div>
      <div class="years" id="years" role="group" aria-label="Year group"></div>
    </div>
    <div>
      <div class="label" style="margin-bottom:8px">Unit of inquiry</div>
      <div class="themes" id="themes"></div>
    </div>
    <div>
      <div class="label" style="margin-bottom:8px">Question</div>
      <div class="qs" id="qs"></div>
      <div class="customRow" id="customRow" hidden>
        <input id="customInput" type="text" placeholder="Type your class's unit question here" aria-label="Your own question">
      </div>
    </div>
  </section>

  <div class="work">
    <div class="main">
      <div class="qbanner" id="qbanner"></div>
      <div id="steps"></div>
    </div>
    <aside class="aside">
      <div class="panel">
        <h3>Word bank</h3>
        <div class="sub">Topic words</div>
        <div class="chips" id="topicChips"></div>
        <div class="sub">Linking words</div>
        <div class="chips" id="linkChips"></div>
      </div>
    </aside>
  </div>
</div>

<script>
const GETTING = {title:"Getting Started", theme:"Everyday topics", color:"#D2601A", ci:"", questions:[
  {q:"What makes a good friend?", restate:"A good friend is someone who", words:["kind","share","help","listen","honest","fun","caring","play","trust","friendly"]},
  {q:"What is the best season?", restate:"The best season is", words:["summer","winter","spring","autumn","weather","warm","cold","holiday","outside","favourite"]},
  {q:"Why should we look after our pets?", restate:"We should look after our pets because", words:["pet","food","water","care","love","healthy","safe","walk","clean","happy"]},
  {q:"Why is it important to be kind?", restate:"It is important to be kind because", words:["kind","help","feelings","happy","share","friends","respect","caring","smile","include"]}
]};
/* KIST Programme of Inquiry 2026–27: one question per line of inquiry */
const YEARS = [{"id":"K1","units":[{"title":"Understanding our identity","theme":"Who We Are","color":"#D2457A","ci":"We learn about ourselves through interactions with others.","questions":[{"q":"How do our choices show who we are?","restate":"Our choices show who we are because","words":["choice","kind","share","help","try","care","happy","sad","behaviour","me"],"loi":"Line of inquiry 1: Our actions and choices help us understand who we are. (responsibility)"},{"q":"How do our family and friends help us know who we are?","restate":"Our family and friends help us know who we are by","words":["family","friends","love","play","share","help","together","feelings","care","belong"],"loi":"Line of inquiry 2: Relationships influence our sense of self. (connection)"},{"q":"What do our bodies and feelings tell us?","restate":"Our bodies and feelings tell us","words":["body","feelings","happy","sad","angry","tired","hungry","calm","scared","need"],"loi":"Line of inquiry 3: Our bodies and feelings give us information about ourselves. (form)"},{"q":"How do our strengths help us grow?","restate":"Our strengths help us grow by","words":["strong","good at","try","practise","learn","grow","help","proud","different","skill"],"loi":"Line of inquiry 4: People have different strengths that help them grow. (function, connection)"}]},{"title":"Transportation","theme":"How We Organize Ourselves","color":"#3E63D8","ci":"People make transportation systems to help the needs of the community.","questions":[{"q":"How does transportation help people?","restate":"Transportation helps people by","words":["car","bus","train","bike","plane","boat","move","travel","need","fast"],"loi":"Line of inquiry 1: Transportation systems are designed to meet people’s needs. (form)"},{"q":"How do we choose how to travel?","restate":"We choose how to travel by thinking about","words":["far","near","fast","slow","walk","train","car","safe","need","choose"],"loi":"Line of inquiry 2: We choose transportation based on our needs and activities. (function)"},{"q":"How does transportation connect people and places?","restate":"Transportation connects people and places by","words":["road","station","bridge","track","town","school","shop","connect","travel","community"],"loi":"Line of inquiry 3: Transportation systems connect people and places in a community. (connection)"}]},{"title":"Homes","theme":"Sharing the Planet","color":"#2E8B4A","ci":"A home is a basic need for all life on Earth.","questions":[{"q":"Why do living things need homes?","restate":"Living things need homes because","words":["home","shelter","safe","warm","dry","need","nest","burrow","animal","people"],"loi":"Line of inquiry 1: Homes are designed to meet the needs of living things. (form, function)"},{"q":"Why are homes different in different places?","restate":"Homes are different in different places because","words":["hot","cold","rain","snow","wood","stone","brick","weather","environment","place"],"loi":"Line of inquiry 2: Homes are built differently depending on place and environment. (causation)"},{"q":"How do we take care of our homes?","restate":"We take care of our homes by","words":["clean","tidy","fix","care","change","old","new","family","help","responsible"],"loi":"Line of inquiry 3: Homes change over time and require care. (change and responsibility)"}]},{"title":"Expressing emotions through art","theme":"How We Express Ourselves","color":"#8A4FD0","ci":"We can use our imagination to express our emotions and creativity through the arts.","questions":[{"q":"How can art show our feelings?","restate":"Art can show our feelings by","words":["paint","colour","draw","clay","music","dance","happy","sad","feelings","materials"],"loi":"Line of inquiry 1: Different art forms use materials to express ideas and feelings. (form)"},{"q":"How do people use materials to share ideas?","restate":"People use materials to share ideas by","words":["paper","crayon","paint","blocks","clay","make","build","idea","show","share"],"loi":"Line of inquiry 2: People use materials and objects to communicate ideas and emotions. (connection)"},{"q":"How does imagination help us create?","restate":"Imagination helps us create by","words":["imagine","pretend","idea","create","dream","make","new","story","picture","think"],"loi":"Line of inquiry 3: Imagination helps us create and share ideas. (perspective)"},{"q":"Why do people show their feelings in different ways?","restate":"People show their feelings in different ways because","words":["feelings","different","dance","sing","draw","talk","happy","sad","express","choose"],"loi":"Line of inquiry 4: People express emotions and ideas in different ways. (perspective, change)"}]}]},{"id":"K2","units":[{"title":"Bodies","theme":"Who We Are","color":"#D2457A","ci":"Our bodies look different but work in the same way.","questions":[{"q":"What parts does our body have inside and outside?","restate":"Our body has","words":["head","arms","legs","heart","bones","brain","skin","inside","outside","parts"],"loi":"Line of inquiry 1: The human body has different parts inside and outside. (form)"},{"q":"How do our senses help us?","restate":"Our senses help us by","words":["see","hear","smell","taste","touch","eyes","ears","nose","tongue","senses"],"loi":"Line of inquiry 2: Our senses help us understand the world around us. (connection)"},{"q":"What can our bodies do?","restate":"Our bodies can","words":["run","jump","climb","dance","move","muscles","strong","healthy","play","grow"],"loi":"Line of inquiry 3: The body supports many different actions and activities. (function)"}]},{"title":"Different Cultures","theme":"Where We Are in Place and Time","color":"#B97A12","ci":"Learning about different cultures helps us appreciate the world and our place in it.","questions":[{"q":"How are places around the world different?","restate":"Places around the world are different because","words":["country","weather","mountains","ocean","city","map","food","language","different","place"],"loi":"Line of inquiry 1: Places around the world have different features. (form)"},{"q":"How do people live in different cultures?","restate":"People in different cultures live","words":["culture","food","clothes","language","festival","family","home","music","tradition","different"],"loi":"Line of inquiry 2: People live in different ways in different cultures. (connection)"},{"q":"Why is it important to learn about other cultures?","restate":"It is important to learn about other cultures because","words":["respect","kind","same","different","friends","share","learn","understand","world","care"],"loi":"Line of inquiry 3: Understanding similarities and differences helps us appreciate others. (perspective, responsibility)"}]},{"title":"Storytelling","theme":"How We Express Ourselves","color":"#8A4FD0","ci":"Stories are created to express ideas, engage audiences, and share meaning.","questions":[{"q":"What are the important parts of a story?","restate":"The important parts of a story are","words":["character","setting","beginning","middle","end","problem","solution","title","plot","events"],"loi":"Line of inquiry 1: Stories have important parts that help us understand them. (form)"},{"q":"Why do people tell stories?","restate":"People tell stories because","words":["teach","share","fun","lesson","feelings","remember","imagine","audience","message","entertain"],"loi":"Line of inquiry 2: People tell stories for different reasons. (causation)"},{"q":"How do our own experiences help us tell stories?","restate":"Our own experiences help us tell stories by","words":["remember","experience","family","feelings","idea","real","personal","share","story","me"],"loi":"Line of inquiry 3: Personal experiences can influence the stories we tell. (connection)"}]},{"title":"Living Things","theme":"Sharing the Planet","color":"#2E8B4A","ci":"Living things have certain needs in order to grow and stay healthy.","questions":[{"q":"What features do living things have?","resta ne of inquiry 1: Human activities have causes and effects on the environment. (causation)"},{"q":"Why do stakeholders have different perspectives on environmental issues?","restate":"Stakeholders have different perspectives on environmental issues because","words":["stakeholder","perspective","values","interests","bias","economy","community","conflict","inequality","representation"],"loi":"Line of inquiry 2: Different stakeholders have different perspectives on environmental issues. (perspective)"},{"q":"How can people take action to create change?","restate":"People can take action to create change by","words":["activism","advocacy","campaign","petition","agency","initiative","protest","awareness","action","change"],"loi":"Line of inquiry 3: People can take action to create change. (responsibility)"}]},{"title":"Migration","theme":"Where We Are in Place and Time","color":"#B97A12","ci":"Human migration comes from, and leads to, challenges and opportunities.","questions":[{"q":"Why do people migrate?","restate":"People migrate because","words":["migration","push factor","pull factor","conflict","peace","opportunity","refugee","economic","family","choice"],"loi":"Line of inquiry 1: People migrate for different reasons. (form)"},{"q":"How is migration experienced differently by individuals and groups?","restate":"Migration is experienced differently by individuals and groups because","words":["experience","perspective","culture","language","identity","belonging","integration","adapt","challenge","community"],"loi":"Line of inquiry 2: Migration is experienced differently by individuals and groups. (perspective)"},{"q":"What challenges and opportunities does migration create for societies?","restate":"Migration creates challenges and opportunities for societies such as","words":["challenge","opportunity","diversity","economy","culture","equity","population","settlement","integration","citizenship"],"loi":"Line of inquiry 3: Migration creates challenges and opportunities for societies. (change)"}]},{"title":"Storing Energy","theme":"How the World Works","color":"#1B8A9C","ci":"The use and storage of energy have environmental impacts.","questions":[{"q":"What forms of energy are there?","restate":"There are forms of energy such as","words":["kinetic","potential","heat","light","sound","electrical","chemical","form","classify","properties"],"loi":"Line of inquiry 1: Energy exists in different forms that can be observed and classified. (form, function)"},{"q":"How can energy be transferred, stored and used?","restate":"Energy can be transferred, stored and used by","words":["transfer","store","convert","battery","flow","transformation","system","process","efficiency","circuit"],"loi":"Line of inquiry 2: Energy can be transferred, stored, and used in different ways. (function)"},{"q":"How do our energy choices affect the environment?","restate":"Our energy choices affect the environment by","words":["renewable","non-renewable","fossil fuels","solar","wind","emissions","sustainability","impact","efficiency","responsibility"],"loi":"Line of inquiry 3: Energy choices have impacts on the environment. (function, causation)"}]},{"title":"The Exhibition","theme":"How We Organize Ourselves","color":"#3E63D8","ci":"Knowledge and successful partnerships help us address global issues.","questions":[{"q":"What global issue matters most to you, and why?","restate":"The global issue that matters most to me is","words":["global issue","impact","community","research","evidence","perspective","action","problem","solution","significant"],"loi":"Line of inquiry 1: Student-generated"},{"q":"How can knowledge help us address a global issue?","restate":"Knowledge can help us address a global issue by","words":["knowledge","research","understand","evidence","causes","solutions","experts","inform","data","action"],"loi":"Line of inquiry 2: Student-generated"},{"q":"How do successful partnerships help solve problems?","restate":"Successful partnerships help solve problems by","words":["partnership","collaboration","mentor","teamwork","communicate","roles","compromise","share","goal","support"],"loi":"Line of inquiry 3: Student-generated"}]},{"title":"Interpretation and Appreciation","theme":"How We Express Ourselves","color":"#8A4FD0","ci":"Artistic interpretation enables us to better understand and appreciate art.","questions":[{"q":"What criteria can we use to analyse an artwork?","restate":"We can analyse an artwork using criteria such as","words":["composition","technique","colour","line","texture","symbolism","detail","criteria","structure","form"],"loi":"Line of inquiry 1: Artworks can be analysed using different criteria. (form, function)"},{"q":"How does art communicate ideas, emotions and messages?","restate":"Art communicates ideas, emotions and messages through","words":["symbolism","colour","mood","message","emotion","communicate","technique","artist","meaning","expression"],"loi":"Line of inquiry 2: Art communicates ideas, emotions, and messages. (connection)"},{"q":"Why do people interpret artworks in different ways?","restate":"People interpret artworks in different ways because","words":["interpret","perspective","context","culture","experience","subjectivity","bias","viewpoint","meaning","identity"],"loi":"Line of inquiry 3: People interpret artworks in different ways. (perspective)"},{"q":"How can we evaluate and appreciate art?","restate":"We can evaluate and appreciate art by","words":["evaluate","criteria","aesthetics","significance","justify","appreciate","value","opinion","judgement","evidence"],"loi":"Line of inquiry 4: Art can be evaluated and appreciated using different criteria. (connection)"}]},{"title":"Changes","theme":"Who We Are","color":"#D2457A","ci":"Change is a necessary part of growing up.","questions":[{"q":"What types of change do people experience?","restate":"People experience types of change such as","words":["physical","emotional","social","puberty","growth","development","school","friendships","transformation","change"],"loi":"Line of inquiry 1: People experience different types of change. (form, function)"},{"q":"How can change affect our thoughts, feelings and behaviour?","restate":"Change can affect our thoughts, feelings and behaviour by","words":["emotions","thoughts","behaviour","stress","worry","excitement","confidence","mood","reaction","self-reflection"],"loi":"Line of inquiry 2: Change can affect thoughts, feelings, and behaviour. (function)"},{"q":"What strategies can help us respond to change?","restate":"Strategies that can help us respond to change include","words":["strategy","resilience","adapt","talk","support","mindfulness","plan","self-reflection","coping","positive"],"loi":"Line of inquiry 3: People develop strategies to respond to change. (function)"},{"q":"How do technology and social pressures influence how we grow?","restate":"Technology and social pressures influence how we grow by","words":["technology","social media","peer pressure","influence","screen time","identity","online","friendships","advertising","choices"],"loi":"Line of inquiry 4: Technology and social pressures influence how people grow and interact. (connection)"}]}]}];
YEARS.forEach(y=>y.units.unshift(GETTING));

const LEVELS = {
  1:{name:"Level 1", tag:"Supported", links:["because","so","and","also","for example","first","this shows"]},
  2:{name:"Level 2", tag:"Guided", links:["because","for example","in addition","another reason","this shows","therefore","such as","as a result"]},
  3:{name:"Level 3", tag:"Independent", links:["consequently","furthermore","significantly","this suggests","in contrast","moreover","for instance","ultimately","as a result","this demonstrates"]}
};

const STEPS = [
  {k:"R", name:"Restate", color:"var(--r)",
   tip:{1:"Copy the words from the question to start your sentence, then finish it.",
        2:"Turn the question into a statement in your own words.",
        3:"Reframe the question in your own words and signal your position."},
   starters:{1:["The question asks about ___."],
             2:["In my opinion, ___.","When I think about ___, I believe ___."],
             3:["When considering ___, it becomes clear that ___.","Although some people believe ___, I would argue that ___.","The question of ___ matters because ___."]}},
  {k:"A", name:"Answer", color:"var(--a)",
   tip:{1:"Give your answer in one sentence.",
        2:"Answer every part of the question clearly.",
        3:"State a clear, specific claim and name your strongest reason."},
   starters:{1:["I think ___."],
             2:["I believe ___ because ___.","One important way is ___.","The main reason is ___."],
             3:["The most significant reason is ___, because ___.","Primarily, ___, which means ___.","There are several ways ___; the most important is ___."]}},
  {k:"C", name:"Cite", color:"var(--c)",
   tip:{1:"Show where you learned it. Give one example.",
        2:"Give one piece of evidence and say where it came from.",
        3:"Quote or paraphrase one or two pieces of evidence and name each source."},
   starters:{1:["For example, ___."],
             2:["According to ___, ___.","For example, in ___, ___.","The text states, \"___.\"","In our investigation, we found ___."],
             3:["As stated in ___, \"___.\"","Evidence from ___ shows that ___.","The author emphasises that ___.","Data from our inquiry reveals ___."]}},
  {k:"E", name:"Explain", color:"var(--e)",
   tip:{1:"Tell how your example shows your answer.",
        2:"Explain how your evidence supports your answer.",
        3:"Analyse the evidence. Connect it to the central idea or the wider world."},
   starters:{1:["This shows ___."],
             2:["This proves that ___ because ___.","In other words, ___.","This connects to my answer because ___."],
             3:["This evidence suggests that ___, which means ___.","Consequently, ___.","This illustrates ___; therefore, ___.","Beyond our unit, this matters because ___."]}}
];

/* ---------- state: always opens on Level 1, Getting Started, first question ---------- */
const store = {
  get(k,f){try{const v=localStorage.getItem(k);return v==null?f:JSON.parse(v)}catch(e){return f}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
const CUSTOM = 99;
let level = 1, yearIdx = Math.max(0, YEARS.findIndex(y=>y.id==="Grade 3")), themeIdx = 0, qIdx = 0;
let custom = store.get("race:custom",{});

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const year = () => YEARS[yearIdx];
const theme = () => year().units[themeIdx];
const customKey = () => `${year().id}:${theme().title}`;
const question = () => qIdx===CUSTOM
  ? {q:custom[customKey()]||"", restate:"", words:[...new Set(theme().questions.flatMap(q=>q.words))].slice(0,12)}
  : theme().questions[qIdx];
const withBlanks = s => esc(s).replace(/___/g,'<span class="blank" aria-label="blank"></span>');

/* ---------- render ---------- */
function renderLevels(){
  $("levels").innerHTML = Object.entries(LEVELS).map(([n,l])=>
    `<button data-l="${n}" aria-pressed="${+n===level}"><b>${l.name}</b><small>${l.tag}</small></button>`).join("");
}
function renderYears(){
  $("years").innerHTML = YEARS.map((y,i)=>`<button data-y="${i}" aria-pressed="${i===yearIdx}">${esc(y.id)}</button>`).join("");
}
function renderThemes(){
  $("themes").innerHTML = year().units.map((t,i)=>
    `<button data-t="${i}" aria-pressed="${i===themeIdx}" style="--tc:${t.color}"><b>${esc(t.title)}</b><small>${esc(t.theme)}</small></button>`).join("");
}
function renderQs(){
  const t = theme();
  document.documentElement.style.setProperty("--tc", t.color);
  $("qs").innerHTML = t.questions.map((q,i)=>
    `<button data-q="${i}" aria-pressed="${i===qIdx}">${esc(q.q)}</button>`).join("")
    + `<button class="custom-q" data-q="${CUSTOM}" aria-pressed="${qIdx===CUSTOM}">Use our own unit question</button>`;
  $("customRow").hidden = qIdx!==CUSTOM;
  $("customInput").value = custom[customKey()]||"";
}
function renderBanner(){
  const q = question();
  const t = theme();
  $("ctx").innerHTML = `<i></i><b>${esc(year().id)} · ${esc(t.title)}</b> · ${LEVELS[level].name} ${LEVELS[level].tag}`;
  const meta = (t.ci||q.loi) ? `<p class="meta">${t.ci?`<span><b>Central idea:</b> ${esc(t.ci)}</span>`:""}${q.loi?`<span>${esc(q.loi)}</span>`:""}</p>` : "";
  $("qbanner").innerHTML = `<div class="label">${esc(year().id)} · ${esc(t.theme)} · ${esc(t.title)}</div><h2>${q.q?esc(q.q):"Type your question above"}</h2>${meta}`;
}
function renderSteps(){
  const q = question();
  $("steps").innerHTML = STEPS.map(s=>{
    let starters = [...s.starters[level]];
    let echo = "";
    if(s.k==="R" && q.restate){
      const lc = q.restate.charAt(0).toLowerCase()+q.restate.slice(1);
      if(level===1){
        starters = [q.restate+" ___."];
        echo = `<p class="echo"><span>Question</span>${esc(q.q)}<span>Restate</span><b>${esc(q.restate)} …</b></p>`;
      } else if(level===2) starters.unshift(q.restate+" ___.");
    }
    return `<article class="step" style="--sc:${s.color}">
      <header><span class="letter" aria-hidden="true">${s.k}</span><h3>${s.name}</h3></header>
      <p class="tip">${s.tip[level]}</p>${echo}
      <ul class="starters" aria-label="${s.name} sentence starters">${starters.map(st=>`<li>${withBlanks(st)}</li>`).join("")}</ul>
    </article>`;
  }).join("");
}
function renderBank(){
  const q = question();
  $("topicChips").innerHTML = q.words.map(w=>`<span class="chip topic">${esc(w)}</span>`).join("");
  $("linkChips").innerHTML = LEVELS[level].links.map(w=>`<span class="chip">${esc(w)}</span>`).join("");
}
function renderAll(){renderLevels();renderYears();renderThemes();renderQs();renderBanner();renderSteps();renderBank()}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.l){level=+b.dataset.l;renderAll();return}
  if(b.dataset.y){yearIdx=+b.dataset.y;themeIdx=0;qIdx=0;renderAll();return}
  if(b.dataset.t){themeIdx=+b.dataset.t;qIdx=0;renderAll();return}
  if(b.dataset.q){qIdx=+b.dataset.q;renderAll();if(qIdx===CUSTOM)$("customInput").focus();return}
});
$("customInput").addEventListener("input", e=>{custom[customKey()]=e.target.value;store.set("race:custom",custom);renderBanner()});

/* ---------- full screen ---------- */
let fit = false, wentFs = false;
function applyFit(){
  document.documentElement.classList.toggle("fit", fit);
  $("fsBtn").setAttribute("aria-pressed", fit);
  $("fsBtn").querySelector("span").textContent = fit ? "Exit full screen" : "Full screen";
}
$("fsBtn").addEventListener("click", ()=>{
  fit = !fit; applyFit();
  try{
    if(fit && document.documentElement.requestFullscreen){
      document.documentElement.requestFullscreen().then(()=>{wentFs=true}).catch(()=>{});
    } else if(!fit && document.fullscreenElement){ document.exitFullscreen().catch(()=>{}); }
  }catch(e){}
});
document.addEventListener("fullscreenchange", ()=>{
  if(!document.fullscreenElement && wentFs){ wentFs=false; if(fit){fit=false;applyFit()} }
});

applyFit();
renderAll();
</script>
</body>
</html>
