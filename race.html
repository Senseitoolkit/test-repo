<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PYP RACE Writer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: picker band (level, unit, question) → two columns: RACE steps + paragraph | sticky word bank + checklist */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --sunk:#EAEEF5; --ink:#1B2232; --muted:#566079; --line:#D9DFEA;
  --accent:#2F55D4; --accent-ink:#FFFFFF;
  --r:#0F7A6C; --a:#2F55D4; --c:#A86A10; --e:#7445BE;
  --ok:#1F7A3D; --warn:#B4541A;
  --display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;
  --radius:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11141B; --surface:#191E28; --sunk:#222836; --ink:#E7EBF3; --muted:#9BA4B8; --line:#2C3443;
  --accent:#86A2FF; --accent-ink:#0E1220;
  --r:#4CC3B1; --a:#86A2FF; --c:#E4B04F; --e:#B994F2; --ok:#5FCB85; --warn:#F09A61; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11141B; --surface:#191E28; --sunk:#222836; --ink:#E7EBF3; --muted:#9BA4B8; --line:#2C3443;
  --accent:#86A2FF; --accent-ink:#0E1220;
  --r:#4CC3B1; --a:#86A2FF; --c:#E4B04F; --e:#B994F2; --ok:#5FCB85; --warn:#F09A61; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);padding-inline:16px;padding-block:20px 48px}
.wrap{max-width:1180px;margin-inline:auto;display:grid;gap:20px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:16px}
.brand{display:flex;align-items:center;gap:14px}
.mark{display:grid;grid-template-columns:repeat(4,1fr);gap:3px}
.mark span{width:30px;height:38px;border-radius:7px;display:grid;place-items:center;font:800 22px var(--display);color:var(--surface)}
.mark span:nth-child(1){background:var(--r)}.mark span:nth-child(2){background:var(--a)}
.mark span:nth-child(3){background:var(--c)}.mark span:nth-child(4){background:var(--e)}
.brand h1{font-size:28px}
.brand p{margin:0;color:var(--muted);font-size:14px}

.levels{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:14px;flex-wrap:wrap}
.levels button{border:0;background:transparent;padding:8px 14px;border-radius:10px;text-align:left;display:grid;line-height:1.2}
.levels b{font-family:var(--display);font-size:17px}
.levels small{color:var(--muted);font-size:12px}
.levels button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgb(0 0 0 / .12)}
.levels button[aria-pressed="true"] small{color:var(--ink)}

/* picker */
.pick{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:18px;display:grid;gap:16px}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.themes button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;text-align:left;display:grid;gap:2px;transition:border-color .15s,background .15s}
.themes button b{font-family:var(--display);font-size:16px;line-height:1.15;display:flex;gap:8px;align-items:center}
.themes button b::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--tc);flex:none}
.themes button small{color:var(--muted);font-size:12.5px}
.themes button:hover{border-color:var(--tc)}
.themes button[aria-pressed="true"]{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 10%,var(--surface))}
.qs{display:grid;gap:6px}
.qs button{border:1.5px solid var(--line);background:transparent;border-radius:10px;padding:9px 12px;text-align:left;display:flex;gap:10px;align-items:baseline}
.qs button::before{content:"";width:14px;height:14px;border-radius:50%;border:2px solid var(--muted);flex:none;transform:translateY(2px)}
.qs button[aria-pressed="true"]{border-color:var(--tc);background:color-mix(in srgb,var(--tc) 8%,var(--surface))}
.qs button[aria-pressed="true"]::before{border-color:var(--tc);background:radial-gradient(var(--tc) 45%,transparent 50%)}
.qs button.custom-q{color:var(--muted)}
.customRow{display:flex;gap:8px;flex-wrap:wrap}
.customRow input{flex:1 1 260px;min-width:0;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:8px 12px}

/* work area */
.work{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
@media (max-width:900px){.work{grid-template-columns:minmax(0,1fr)}}
.main{display:grid;gap:14px;min-width:0}
.qbanner{border-radius:var(--radius);padding:16px 18px;background:color-mix(in srgb,var(--tc) 13%,var(--surface));border:1.5px solid color-mix(in srgb,var(--tc) 45%,transparent)}
.qbanner .label{color:color-mix(in srgb,var(--tc) 70%,var(--ink))}
.qbanner h2{font-size:clamp(22px,3vw,28px);margin-top:2px}

.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);display:grid;grid-template-columns:56px minmax(0,1fr);overflow:hidden}
.step .letter{background:var(--sc);color:var(--surface);font:800 32px var(--display);display:grid;place-items:start center;padding-top:12px}
.step .body{padding:14px 16px 16px;display:grid;gap:10px;min-width:0}
.step header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 12px;align-items:baseline}
.step h3{font-size:22px;color:var(--sc)}
.step .tip{margin:0;color:var(--muted);font-size:14.5px}
.target{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.target.met{color:var(--ok);font-weight:700}
.starters{display:flex;flex-wrap:wrap;gap:6px}
.starter{border:1.5px dashed color-mix(in srgb,var(--sc) 60%,transparent);background:color-mix(in srgb,var(--sc) 7%,var(--surface));border-radius:8px;padding:4px 10px;font-size:14px;text-align:left}
.starter:hover{border-style:solid}
.step textarea{width:100%;min-height:84px;resize:vertical;font:17px/1.55 var(--body);color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px}
.step textarea:focus{border-color:var(--sc);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--sc) 25%,transparent)}
.step.active{border-color:color-mix(in srgb,var(--sc) 50%,var(--line))}

/* aside */
.aside{display:grid;gap:14px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:900px){.aside{position:static}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;display:grid;gap:10px}
.panel h3{font-size:19px}
.panel .hint{margin:0;font-size:13px;color:var(--muted)}
.hint b{color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 11px;font-size:14.5px;display:inline-flex;gap:5px;align-items:center}
.chip:hover{border-color:var(--tc)}
.chip.topic{border-color:color-mix(in srgb,var(--tc) 50%,var(--line))}
.chip.used{background:color-mix(in srgb,var(--ok) 14%,var(--surface));border-color:var(--ok)}
.chip.used::after{content:"✓";color:var(--ok);font-weight:700;font-size:12px}
.sub{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:4px}
.counter{font-variant-numeric:tabular-nums;font-size:13px;color:var(--muted)}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.checks li{display:flex;gap:9px;align-items:flex-start;font-size:14.5px}
.checks li::before{content:"";flex:none;width:18px;height:18px;border-radius:5px;border:2px solid var(--line);margin-top:2px}
.checks li.done::before{background:var(--ok);border-color:var(--ok);box-shadow:inset 0 0 0 3px var(--surface)}
.checks li.done{color:var(--muted)}

/* paragraph */
.final{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;display:grid;gap:12px}
.final .row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between}
.final h3{font-size:22px}
.para{font-size:18px;line-height:1.75;margin:0;max-width:68ch;overflow-wrap:anywhere}
.para .empty{color:var(--muted);font-style:italic}
.para.colour span[data-k]{border-radius:4px;padding:1px 2px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.para.colour span[data-k="R"]{background:color-mix(in srgb,var(--r) 18%,transparent)}
.para.colour span[data-k="A"]{background:color-mix(in srgb,var(--a) 18%,transparent)}
.para.colour span[data-k="C"]{background:color-mix(in srgb,var(--c) 22%,transparent)}
.para.colour span[data-k="E"]{background:color-mix(in srgb,var(--e) 18%,transparent)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend span{display:inline-flex;gap:5px;align-items:center}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 13px;font-size:14px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.toggle{display:inline-flex;gap:6px;align-items:center;font-size:14px;color:var(--muted)}
.status{font-size:13px;color:var(--ok);min-height:1em}
.confirm{display:inline-flex;gap:6px;align-items:center;font-size:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Full screen: everything on one laptop screen ---------- */
.fsBtn{display:inline-flex;gap:7px;align-items:center}
.fsBtn svg{width:16px;height:16px}
.topRight{display:flex;gap:12px;align-items:end;flex-wrap:wrap}
@media (min-width:900px){
  html.fit,html.fit body{height:100%}
  html.fit body{overflow:hidden;padding-block:10px;font-size:15px}
  .fit .wrap{max-width:none;height:100%;grid-template-rows:auto auto minmax(0,1fr);gap:10px}
  .fit .top{align-items:center}
  .fit .mark span{width:22px;height:28px;font-size:17px;border-radius:5px}
  .fit .brand h1{font-size:21px}
  .fit .brand p,.fit .top .label{display:none}
  .fit .levels{padding:3px}
  .fit .levels button{padding:4px 11px;display:flex;gap:6px;align-items:baseline}
  .fit .levels b{font-size:15px}
  .fit .topRight{align-items:center}

  .fit .pick{padding:10px 12px;gap:8px}
  .fit .pick .label{display:none}
  .fit .themes{grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
  .fit .themes button{padding:5px 9px}
  .fit .themes button b{font-size:14px}
  .fit .themes button small{display:none}
  .fit .qs{display:flex;flex-wrap:wrap;gap:6px}
  .fit .qs button{flex:1 1 0;min-width:0;padding:5px 10px;font-size:13.5px;line-height:1.3}
  .fit .qs button.custom-q{flex:0 0 auto}
  .fit .customRow{margin-top:6px!important}
  .fit .customRow input{padding:5px 10px}

  .fit .work{grid-template-columns:minmax(0,1fr) 300px;gap:12px;height:100%;min-height:0}
  .fit .main{grid-template-rows:auto minmax(0,1fr) auto;gap:10px;height:100%;min-height:0}
  .fit .qbanner{padding:7px 14px;display:flex;gap:12px;align-items:baseline}
  .fit .qbanner h2{font-size:20px;margin:0}
  .fit #steps{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:10px!important;min-height:0}
  .fit .step{grid-template-columns:36px minmax(0,1fr);min-height:0}
  .fit .step .letter{font-size:24px;padding-top:8px}
  .fit .step .body{padding:8px 12px 10px;gap:6px;grid-template-rows:auto auto auto minmax(0,1fr);min-height:0}
  .fit .step h3{font-size:18px}
  .fit .step .tip{font-size:13px;line-height:1.35}
  .fit .starters{gap:4px}
  .fit .starter{font-size:12.5px;padding:2px 8px}
  .fit .step textarea{min-height:44px;height:100%;resize:none;font-size:15.5px;padding:7px 10px}

  .fit .final{padding:10px 14px;gap:6px;max-height:30vh;min-height:0;grid-template-rows:auto minmax(0,1fr) auto}
  .fit .final h3{font-size:18px}
  .fit .final .legend{display:none}
  .fit .para{font-size:15.5px;line-height:1.6;overflow:auto;max-width:none;min-height:1.6em}
  .fit .btn{padding:4px 11px;font-size:13px}

  .fit .aside{position:static;height:100%;min-height:0;grid-template-rows:auto minmax(0,1fr);gap:10px}
  .fit .panel{padding:10px 12px;gap:6px;overflow:auto;min-height:0}
  .fit .panel h3{font-size:17px}
  .fit .chip{font-size:13px;padding:2px 9px}
  .fit .checks{gap:4px}
  .fit .checks li{font-size:13px;line-height:1.35}
  .fit .checks li::before{width:15px;height:15px;margin-top:1px}
}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true"><span>R</span><span>A</span><span>C</span><span>E</span></div>
      <div><h1>PYP RACE Writer</h1><p>Restate · Answer · Cite · Explain</p></div>
    </div>
    <div class="topRight">
      <div>
        <div class="label" style="margin-bottom:6px">Choose your level</div>
        <div class="levels" id="levels" role="group" aria-label="Scaffold level"></div>
      </div>
      <button class="btn fsBtn" id="fsBtn" aria-pressed="false">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M2 6V2h4M14 6V2h-4M2 10v4h4M14 10v4h-4"/></svg>
        <span>Full screen</span>
      </button>
    </div>
  </header>

  <section class="pick" aria-label="Choose a unit and question">
    <div>
      <div class="label" style="margin-bottom:8px">Transdisciplinary theme</div>
      <div class="themes" id="themes"></div>
    </div>
    <div>
      <div class="label" style="margin-bottom:8px">Question</div>
      <div class="qs" id="qs"></div>
      <div class="customRow" id="customRow" hidden style="margin-top:8px">
        <input id="customInput" type="text" placeholder="Type your class's unit question here" aria-label="Your own question">
      </div>
    </div>
  </section>

  <div class="work">
    <div class="main">
      <div class="qbanner" id="qbanner"></div>
      <div id="steps" style="display:grid;gap:12px"></div>

      <section class="final" aria-label="Your paragraph">
        <div class="row">
          <h3>My RACE paragraph</h3>
          <label class="toggle"><input type="checkbox" id="colourToggle" checked> Show RACE colours</label>
        </div>
        <div class="legend" aria-hidden="true">
          <span><i style="background:var(--r)"></i>Restate</span><span><i style="background:var(--a)"></i>Answer</span>
          <span><i style="background:var(--c)"></i>Cite</span><span><i style="background:var(--e)"></i>Explain</span>
        </div>
        <p class="para colour" id="para"></p>
        <div class="row">
          <span class="counter" id="wordCount"></span>
          <div class="actions">
            <span class="status" id="status" role="status"></span>
            <button class="btn primary" id="copyBtn">Copy paragraph</button>
            <span id="clearWrap"><button class="btn" id="clearBtn">Start over</button></span>
          </div>
        </div>
      </section>
    </div>

    <aside class="aside">
      <div class="panel">
        <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
          <h3>Word bank</h3><span class="counter" id="usedCount"></span>
        </div>
        <p class="hint" id="bankHint"></p>
        <div class="sub">Unit words</div>
        <div class="chips" id="topicChips"></div>
        <div class="sub" id="linkLabel">Linking words</div>
        <div class="chips" id="linkChips"></div>
      </div>
      <div class="panel">
        <h3>Check my writing</h3>
        <ul class="checks" id="checks"></ul>
      </div>
    </aside>
  </div>
</div>

<script>
const THEMES = [
  {id:"who", name:"Who We Are", focus:"Identity, relationships, well-being", color:"#D2457A", questions:[
    {q:"How do our choices affect our well-being?", restate:"Our choices affect our well-being by", words:["healthy","habits","balance","nutrition","exercise","sleep","emotions","decisions","mindful","well-being"]},
    {q:"How do our relationships shape who we are?", restate:"Our relationships shape who we are by", words:["identity","family","friendship","trust","influence","values","empathy","belonging","respect","community"]},
    {q:"Why is it important to understand our feelings?", restate:"It is important to understand our feelings because", words:["emotions","self-awareness","cope","express","calm","reflect","empathy","resilience","strategy","manage"]}
  ]},
  {id:"where", name:"Where We Are in Place and Time", focus:"History, journeys, connections", color:"#B97A12", questions:[
    {q:"How have explorers changed the world?", restate:"Explorers have changed the world by", words:["voyage","discovery","navigate","trade","map","route","impact","culture","expedition","colonise"]},
    {q:"Why do people migrate?", restate:"People migrate because", words:["migration","opportunity","refuge","settle","culture","journey","push factor","pull factor","border","community"]},
    {q:"How can artifacts help us understand the past?", restate:"Artifacts help us understand the past by", words:["artifact","evidence","ancient","historian","civilisation","primary source","era","preserve","perspective","timeline"]}
  ]},
  {id:"express", name:"How We Express Ourselves", focus:"Creativity, communication, culture", color:"#8A4FD0", questions:[
    {q:"How can art communicate ideas and emotions?", restate:"Art can communicate ideas and emotions through", words:["colour","symbol","mood","perspective","express","audience","technique","interpret","message","style"]},
    {q:"How do stories pass on culture?", restate:"Stories pass on culture by", words:["tradition","folktale","values","generation","oral","heritage","moral","identity","storyteller","belief"]},
    {q:"How does music bring people together?", restate:"Music brings people together by", words:["rhythm","celebration","community","emotion","melody","connect","tradition","perform","audience","harmony"]}
  ]},
  {id:"works", name:"How the World Works", focus:"Science, technology, nature", color:"#1B8A9C", questions:[
    {q:"How do forces and energy affect our lives?", restate:"Forces and energy affect our lives by", words:["force","push","pull","gravity","friction","motion","energy","transfer","magnetism","speed"]},
    {q:"How does technology change the way we live?", restate:"Technology changes the way we live by", words:["invention","innovation","efficient","communicate","design","solve","digital","impact","convenient","develop"]},
    {q:"How does water move through the water cycle?", restate:"Water moves through the water cycle by", words:["evaporation","condensation","precipitation","collection","temperature","water vapour","cycle","energy","runoff","atmosphere"]}
  ]},
  {id:"organize", name:"How We Organize Ourselves", focus:"Systems, organizations, economics", color:"#3E63D8", questions:[
    {q:"How do businesses meet people's needs?", restate:"Businesses meet people's needs by", words:["goods","services","consumer","producer","needs","wants","supply","demand","profit","market"]},
    {q:"Why do communities need rules and laws?", restate:"Communities need rules and laws because", words:["rules","laws","fairness","safety","responsibility","government","consequence","citizen","rights","order"]},
    {q:"How do systems help us work together?", restate:"Systems help us work together by", words:["system","organise","role","cooperate","efficient","process","communicate","structure","goal","connect"]}
  ]},
  {id:"planet", name:"Sharing the Planet", focus:"Environment, resources, responsibility", color:"#2E8B4A", questions:[
    {q:"How can we protect ecosystems for future generations?", restate:"We can protect ecosystems for future generations by", words:["ecosystem","habitat","biodiversity","conserve","pollution","sustainable","species","protect","future","action"]},
    {q:"Why should resources be shared fairly?", restate:"Resources should be shared fairly because", words:["resources","scarce","equality","access","fair","needs","responsibility","distribute","community","rights"]},
    {q:"How do living things depend on each other?", restate:"Living things depend on each other by", words:["food chain","producer","consumer","interdependent","habitat","adapt","survive","relationship","predator","prey"]}
  ]}
];

const LEVELS = {
  1:{name:"Level 1", tag:"Supported", sentences:1, topicGoal:1, linkGoal:0,
     links:["because","so","and","also","for example","first","this shows"]},
  2:{name:"Level 2", tag:"Guided", sentences:1, topicGoal:2, linkGoal:1,
     links:["because","for example","in addition","another reason","this shows","therefore","such as","as a result"]},
  3:{name:"Level 3", tag:"Independent", sentences:2, topicGoal:3, linkGoal:2,
     links:["consequently","furthermore","significantly","this suggests","in contrast","moreover","for instance","ultimately","as a result","this demonstrates"]}
};

const STEPS = [
  {k:"R", name:"Restate", color:"var(--r)",
   tip:{1:"Turn the question into a sentence. Use words from the question.",
        2:"Rewrite the question as a statement in your own words.",
        3:"Reframe the question in your own words and signal your position."},
   starters:{1:["The question asks about ___.","I think that ___."],
             2:["In my opinion, ___.","When I think about ___, I believe ___."],
             3:["When considering ___, it becomes clear that ___.","Although some people believe ___, I would argue that ___.","The question of ___ matters because ___."]}},
  {k:"A", name:"Answer", color:"var(--a)",
   tip:{1:"Give your answer in one sentence.",
        2:"Answer every part of the question clearly.",
        3:"State a clear, specific claim and name your strongest reason."},
   starters:{1:["My answer is ___.","I think ___ because ___.","One way is ___."],
             2:["I believe ___ because ___.","One important way is ___.","The main reason is ___."],
             3:["The most significant reason is ___, because ___.","Primarily, ___, which means ___.","There are several ways ___; the most important is ___."]}},
  {k:"C", name:"Cite", color:"var(--c)",
   tip:{1:"Show where you learned it. Give one example.",
        2:"Give one piece of evidence and say where it came from.",
        3:"Quote or paraphrase one or two pieces of evidence and name each source."},
   starters:{1:["In the text it says ___.","For example, ___.","I learned that ___."],
             2:["According to ___, ___.","For example, in ___, ___.","The text states, \"___.\"","In our investigation, we found ___."],
             3:["As stated in ___, \"___.\"","Evidence from ___ shows that ___.","The author emphasises that ___.","Data from our inquiry reveals ___."]}},
  {k:"E", name:"Explain", color:"var(--e)",
   tip:{1:"Tell how your example shows your answer.",
        2:"Explain how your evidence supports your answer.",
        3:"Analyse the evidence. Connect it to the central idea or the wider world."},
   starters:{1:["This shows ___.","This means ___.","This is important because ___."],
             2:["This proves that ___ because ___.","In other words, ___.","This connects to my answer because ___."],
             3:["This evidence suggests that ___, which means ___.","Consequently, ___.","This illustrates ___; therefore, ___.","Beyond our unit, this matters because ___."]}}
];

/* ---------- state ---------- */
const store = {
  get(k,f){try{const v=localStorage.getItem(k);return v==null?f:JSON.parse(v)}catch(e){return f}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let level = store.get("race:level",1);
let themeIdx = store.get("race:theme",0);
let qIdx = store.get("race:q",0); // 3 = custom
let custom = store.get("race:custom",{});
let lastTA = null;

const $ = id => document.getElementById(id);
const theme = () => THEMES[themeIdx];
const question = () => qIdx===3 ? {q:custom[theme().id]||"", restate:"", words:[...new Set(theme().questions.flatMap(q=>q.words))].slice(0,14), custom:true} : theme().questions[qIdx];
const draftKey = () => `race:draft:${theme().id}:${qIdx}`;
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- render ---------- */
function renderLevels(){
  $("levels").innerHTML = Object.entries(LEVELS).map(([n,l])=>
    `<button data-l="${n}" aria-pressed="${+n===level}"><b>${l.name}</b><small>${l.tag}</small></button>`).join("");
}
function renderThemes(){
  $("themes").innerHTML = THEMES.map((t,i)=>
    `<button data-t="${i}" aria-pressed="${i===themeIdx}" style="--tc:${t.color}"><b>${t.name}</b><small>${t.focus}</small></button>`).join("");
}
function renderQs(){
  const t = theme();
  document.documentElement.style.setProperty("--tc", t.color);
  $("qs").innerHTML = t.questions.map((q,i)=>
    `<button data-q="${i}" aria-pressed="${i===qIdx}">${esc(q.q)}</button>`).join("")
    + `<button class="custom-q" data-q="3" aria-pressed="${qIdx===3}">Use our own unit question</button>`;
  $("customRow").hidden = qIdx!==3;
  $("customInput").value = custom[t.id]||"";
}
function renderBanner(){
  const q = question();
  $("qbanner").innerHTML = `<div class="label">${esc(theme().name)}</div><h2>${q.q?esc(q.q):"Type your unit question above"}</h2>`;
}
function renderSteps(){
  const q = question(), draft = store.get(draftKey(),{});
  $("steps").innerHTML = STEPS.map(s=>{
    let starters = [...s.starters[level]];
    if(s.k==="R" && level<3 && q.restate) starters.unshift(q.restate+" ___.");
    if(s.k==="R" && level<3 && q.custom) starters.unshift("The question asks ___.");
    return `<article class="step" style="--sc:${s.color}" data-k="${s.k}">
      <div class="letter" aria-hidden="true">${s.k}</div>
      <div class="body">
        <header><h3>${s.name}</h3><span class="target" id="t-${s.k}"></span></header>
        <p class="tip">${s.tip[level]}</p>
        <div class="starters" aria-label="${s.name} sentence starters">${starters.map(st=>`<button class="starter" data-st="${esc(st)}">${esc(st)}</button>`).join("")}</div>
        <textarea id="ta-${s.k}" data-k="${s.k}" aria-label="${s.name}" placeholder="Tap a sentence starter, or start writing…">${esc(draft[s.k]||"")}</textarea>
      </div></article>`;
  }).join("");
  lastTA = $("ta-R");
}
function renderBank(){
  const q = question(), L = LEVELS[level];
  $("topicChips").innerHTML = q.words.map(w=>`<button class="chip topic" data-w="${esc(w)}">${esc(w)}</button>`).join("");
  $("linkChips").innerHTML = L.links.map(w=>`<button class="chip" data-w="${esc(w)}">${esc(w)}</button>`).join("");
  $("bankHint").innerHTML = `Tap a word to add it where you are typing. Goal: use <b>${L.topicGoal}+ unit word${L.topicGoal>1?"s":""}</b>${L.linkGoal?` and <b>${L.linkGoal}+ linking word${L.linkGoal>1?"s":""}</b>`:""}.`;
}
function renderAll(){renderLevels();renderThemes();renderQs();renderBanner();renderSteps();renderBank();update()}

/* ---------- analysis ---------- */
const vals = () => Object.fromEntries(STEPS.map(s=>[s.k,($("ta-"+s.k)?.value||"").trim()]));
const has = (text,w) => new RegExp(`(^|[^a-z])${w.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}`,"i").test(text);
const sentences = t => t ? (t.match(/[^.!?]+[.!?]+|[^.!?]+$/g)||[]).filter(x=>x.trim().split(/\s+/).length>=3).length : 0;

function update(){
  const v = vals(), all = Object.values(v).join(" "), L = LEVELS[level], q = question();
  // targets
  STEPS.forEach(s=>{
    const n = sentences(v[s.k]), goal = L.sentences, el = $("t-"+s.k);
    el.textContent = `${n} / ${goal}${level===3?"+":""} sentence${goal>1?"s":""}`;
    el.classList.toggle("met", n>=goal && !v[s.k].includes("___"));
  });
  // chips
  let topicUsed=0, linkUsed=0;
  document.querySelectorAll("#topicChips .chip").forEach(c=>{const u=has(all,c.dataset.w);c.classList.toggle("used",u);if(u)topicUsed++});
  document.querySelectorAll("#linkChips .chip").forEach(c=>{const u=has(all,c.dataset.w);c.classList.toggle("used",u);if(u)linkUsed++});
  $("usedCount").textContent = `${topicUsed+linkUsed} used`;
  // checklist
  const qWords = (q.q||"").toLowerCase().match(/[a-z']{5,}/g)||[];
  const restateOk = v.R && qWords.some(w=>v.R.toLowerCase().includes(w.replace(/'s$/,"")));
  const items = [
    [restateOk, level===1?"I used words from the question.":"I restated the question using its key words."],
    [!!v.A, level===1?"I gave my answer.":"I answered the question clearly."],
    [!!v.C, level===1?"I gave an example.":"I included evidence and named the source."],
    [!!v.E, level===1?"I said what my example shows.":"I explained how the evidence supports my answer."],
    [topicUsed>=L.topicGoal, `I used ${L.topicGoal}+ unit word${L.topicGoal>1?"s":""} (${topicUsed} so far).`],
  ];
  if(L.linkGoal) items.push([linkUsed>=L.linkGoal, `I used ${L.linkGoal}+ linking word${L.linkGoal>1?"s":""} (${linkUsed} so far).`]);
  items.push([all.length>0 && !all.includes("___"), "I filled in every blank (no ___ left)."]);
  if(level>1) items.push([all.length>0 && STEPS.every(s=>!v[s.k] || /^[A-Z"“]/.test(v[s.k])) && STEPS.every(s=>!v[s.k] || /[.!?"”]$/.test(v[s.k])), "My sentences start with capitals and end with punctuation."]);
  $("checks").innerHTML = items.map(([ok,t])=>`<li class="${ok?"done":""}">${esc(t)}</li>`).join("");
  // paragraph
  const parts = STEPS.filter(s=>v[s.k]).map(s=>`<span data-k="${s.k}">${esc(v[s.k])}</span>`);
  $("para").innerHTML = parts.length ? parts.join(" ") : `<span class="empty">Your paragraph builds here as you write each part.</span>`;
  const wc = all.trim() ? all.trim().split(/\s+/).length : 0;
  $("wordCount").textContent = `${wc} word${wc===1?"":"s"}`;
  // save
  store.set(draftKey(), v);
}

/* ---------- insertion ---------- */
function insertWord(ta, word){
  const s=ta.selectionStart, e=ta.selectionEnd, val=ta.value;
  const before=val.slice(0,s), after=val.slice(e);
  const pre = before && !/\s$/.test(before) ? " " : "";
  const post = after && !/^[\s.,;:!?]/.test(after) ? " " : (after?"":" ");
  ta.value = before+pre+word+post+after;
  const pos = (before+pre+word+post).length;
  ta.focus(); ta.setSelectionRange(pos,pos); update();
}
function insertStarter(ta, st){
  const base = ta.value.replace(/\s+$/,"");
  const start = base ? base.length+1 : 0;
  ta.value = (base?base+" ":"") + st;
  ta.focus();
  const blank = ta.value.indexOf("___", start);
  if(blank>-1) ta.setSelectionRange(blank, blank+3); else ta.setSelectionRange(ta.value.length, ta.value.length);
  update();
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.l){level=+b.dataset.l;store.set("race:level",level);renderAll();return}
  if(b.dataset.t){themeIdx=+b.dataset.t;qIdx=0;store.set("race:theme",themeIdx);store.set("race:q",0);renderAll();return}
  if(b.dataset.q){qIdx=+b.dataset.q;store.set("race:q",qIdx);renderAll();if(qIdx===3)$("customInput").focus();return}
  if(b.dataset.st!==undefined){insertStarter(b.closest(".step").querySelector("textarea"), b.dataset.st);return}
  if(b.dataset.w){insertWord(lastTA||$("ta-R"), b.dataset.w);return}
});
$("steps").addEventListener("input", update);
$("steps").addEventListener("focusin", e=>{
  if(e.target.tagName==="TEXTAREA"){lastTA=e.target;
    document.querySelectorAll(".step").forEach(s=>s.classList.toggle("active", s.contains(e.target)));
    const s = STEPS.find(x=>x.k===e.target.dataset.k);
    $("linkLabel").textContent = `Linking words · adding to ${s.name}`;}
});
// keep cursor position when tapping chips (don't steal focus on mousedown)
document.addEventListener("mousedown", e=>{ if(e.target.closest(".chip")) e.preventDefault(); });
$("customInput").addEventListener("input", e=>{custom[theme().id]=e.target.value;store.set("race:custom",custom);renderBanner();update()});
$("colourToggle").addEventListener("change", e=>$("para").classList.toggle("colour", e.target.checked));

$("copyBtn").addEventListener("click", ()=>{
  const text = Object.values(vals()).filter(Boolean).join(" ");
  const done = msg => {$("status").textContent=msg;setTimeout(()=>$("status").textContent="",2500)};
  if(!text){done("Write something first.");return}
  const fallback = ()=>{const r=document.createRange();r.selectNodeContents($("para"));const sel=getSelection();sel.removeAllRanges();sel.addRange(r);done("Selected. Press Ctrl+C or ⌘C to copy.")};
  try{ navigator.clipboard.writeText(text).then(()=>done("Copied!"), fallback) }catch(err){ fallback() }
});
function showClear(){
  $("clearWrap").innerHTML = `<span class="confirm">Clear all four parts? <button class="btn danger" id="yesClear">Clear</button><button class="btn" id="noClear">Keep</button></span>`;
  $("yesClear").onclick = ()=>{STEPS.forEach(s=>$("ta-"+s.k).value="");update();resetClear();$("status").textContent="Cleared."};
  $("noClear").onclick = resetClear;
}
function resetClear(){$("clearWrap").innerHTML=`<button class="btn" id="clearBtn">Start over</button>`;$("clearBtn").onclick=showClear}
$("clearBtn").onclick = showClear;

/* ---------- full screen ---------- */
let fit = store.get("race:fit", false), wentFs = false;
function applyFit(){
  document.documentElement.classList.toggle("fit", fit);
  $("fsBtn").setAttribute("aria-pressed", fit);
  $("fsBtn").querySelector("span").textContent = fit ? "Exit full screen" : "Full screen";
  store.set("race:fit", fit);
}
$("fsBtn").addEventListener("click", ()=>{
  fit = !fit; applyFit();
  try{
    if(fit && document.documentElement.requestFullscreen){
      document.documentElement.requestFullscreen().then(()=>{wentFs=true}).catch(()=>{});
    } else if(!fit && document.fullscreenElement){ document.exitFullscreen().catch(()=>{}); }
  }catch(e){}
});
document.addEventListener("fullscreenchange", ()=>{
  if(!document.fullscreenElement && wentFs){ wentFs=false; if(fit){fit=false;applyFit()} }
});
applyFit();

if(!THEMES[themeIdx]) themeIdx=0;
if(![0,1,2,3].includes(qIdx)) qIdx=0;
if(!LEVELS[level]) level=1;
renderAll();
</script>
</body>
</html>
