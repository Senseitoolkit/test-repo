<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PYP Thinking Routines Planner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: planner rail (3 ordered choices) on the left, routine card on the right; stacks on phones. Classroom display is a full-screen overlay. */
:root{
  --paper:#f4f6f9; --card:#ffffff; --ink:#18233a; --muted:#5b6679; --line:#dde2ea;
  --accent:#1f5fd1; --accent-ink:#ffffff; --hi:#ffd23f; --soft:#e8eefb;
  --c-see:#1f5fd1; --c-ask:#7a3fd1; --c-link:#0f8a6a; --c-view:#c2410c; --c-reason:#b4235a; --c-act:#0e7490; --c-sum:#946200;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --stage:#101a2e; --stage-ink:#f5f7fb;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1522; --card:#172033; --ink:#e8edf6; --muted:#9aa6bb; --line:#2a3550;
  --accent:#6b9cff; --accent-ink:#0f1522; --hi:#ffd23f; --soft:#1f2b45;
  --c-see:#6b9cff; --c-ask:#b28cff; --c-link:#4fd1a8; --c-view:#ff9a5c; --c-reason:#ff7aa8; --c-act:#5fd0e6; --c-sum:#f2c14e;
  --stage:#070b14; --stage-ink:#f5f7fb; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1522; --card:#172033; --ink:#e8edf6; --muted:#9aa6bb; --line:#2a3550;
  --accent:#6b9cff; --accent-ink:#0f1522; --hi:#ffd23f; --soft:#1f2b45;
  --c-see:#6b9cff; --c-ask:#b28cff; --c-link:#4fd1a8; --c-view:#ff9a5c; --c-reason:#ff7aa8; --c-act:#5fd0e6; --c-sum:#f2c14e;
  --stage:#070b14; --stage-ink:#f5f7fb; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px;padding-block:24px 48px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}
h1{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,3.4vw,2.3rem);line-height:1.05;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 span{background:linear-gradient(transparent 62%,var(--hi) 62%);padding:0 .08em}
.tag{color:var(--muted);margin:.35rem 0 0;max-width:52ch}
.grid{display:grid;grid-template-columns:330px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:860px){.grid{grid-template-columns:1fr}}

/* Planner rail */
.rail{display:flex;flex-direction:column;gap:18px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:860px){.rail{position:static}}
.step{display:flex;flex-direction:column;gap:8px}
.step h2{font-family:var(--display);font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0;display:flex;align-items:center;gap:8px}
.step h2 b{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:.75rem;letter-spacing:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:inherit;font-size:.92rem;border:1.5px solid var(--line);background:var(--card);color:var(--ink);padding:6px 11px;border-radius:999px;cursor:pointer;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip:focus-visible,.btn:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.theme-list .chip{border-radius:10px;text-align:left;width:100%}
.btn{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.primary{background:var(--accent);color:var(--accent-ink);font-size:1.05rem}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.small{padding:7px 11px;font-size:.88rem;border-radius:9px}
.actions{display:grid;gap:8px}
.fit{font-size:.85rem;color:var(--muted);margin:0}

/* Routine card */
.out{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;min-width:0}
.out-head{padding:22px 24px 18px;border-top:8px solid var(--rc);display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:flex-start}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.pill{font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--ink)}
.pill.r{background:var(--rc);color:var(--card)}
.rname{font-family:var(--display);font-weight:800;font-size:clamp(1.7rem,3.6vw,2.5rem);line-height:1.02;margin:0;text-wrap:balance;letter-spacing:-.015em}
.best{color:var(--muted);margin:.4rem 0 0;font-size:.95rem}
.head-actions{display:flex;flex-wrap:wrap;gap:8px}
.sec{padding:18px 24px;border-top:1px solid var(--line)}
.sec h3{font-family:var(--display);font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 10px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.prompt{font-size:1.08rem;margin:0;max-width:65ch}
.prompt strong{background:linear-gradient(transparent 60%,color-mix(in srgb,var(--hi) 70%,transparent) 60%)}
.linkbtn{font:inherit;font-size:.82rem;font-weight:700;text-transform:none;letter-spacing:0;background:none;border:0;color:var(--accent);cursor:pointer;padding:2px 4px;border-radius:6px}
.linkbtn:hover{text-decoration:underline}
.qsteps{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.q{border:1.5px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;min-width:0}
.q .lab{font-family:var(--display);font-weight:800;font-size:1.25rem;color:var(--rc);line-height:1.1}
.q .lab small{display:block;font-family:var(--body);font-weight:700;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.q ul{margin:0;padding-left:1.1em}
.q li{margin:.15em 0}
.starter{font-size:.86rem;color:var(--muted);font-style:italic;border-top:1px dashed var(--line);padding-top:6px;margin-top:auto}
.push{font-size:.86rem;border-top:1px dashed var(--line);padding-top:6px;margin-top:auto}
.push b{color:var(--rc)}
.lens{display:flex;gap:12px;align-items:flex-start;background:var(--soft);border-radius:12px;padding:12px 14px}
.lens .ic{flex:none;width:28px;height:28px;border-radius:8px;background:var(--rc);color:var(--card);display:grid;place-items:center;font-weight:800;font-family:var(--display)}
.lens p{margin:0}
.note{margin:10px 0 0;font-size:.94rem;color:var(--muted);max-width:68ch}
.eng-chips{margin-bottom:12px}
.eng ol{margin:0;padding-left:1.25em;display:grid;gap:4px;max-width:68ch}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:.86rem;padding:4px 10px;border-radius:8px;border:1.5px solid var(--line)}
.reflect{border-left:4px solid var(--rc);padding:6px 0 6px 14px;margin:0}
.compass{display:grid;grid-template-areas:". n ." "w c e" ". s .";grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch}
.compass .q{min-width:0}
.compass .cn{grid-area:n}.compass .ce{grid-area:e}.compass .cs{grid-area:s}.compass .cw{grid-area:w}
.compass .hub{grid-area:c;display:grid;place-items:center;width:64px}
.compass .hub svg{width:56px;height:56px}
@media (max-width:640px){.compass{grid-template-areas:"n" "e" "s" "w";grid-template-columns:1fr}.compass .hub{display:none}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-weight:700;z-index:60}
.copybox{width:100%;min-height:160px;margin-top:10px;font:inherit;font-size:.85rem;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:10px}

.pick{font:inherit;font-size:1rem;width:100%;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.pick:focus-visible{outline:3px solid var(--hi);outline-offset:2px}
.pick.on{border-color:var(--accent);border-width:2px}
.warn{margin:10px 0 0;font-size:.9rem;padding:8px 12px;border-radius:10px;background:var(--soft)}
.lib{border-top:1px solid var(--line);padding-top:14px}
.lib summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:.95rem;list-style:none;display:flex;justify-content:space-between;align-items:center}
.lib summary::-webkit-details-marker{display:none}
.lib summary::after{content:"+";font-size:1.2rem;color:var(--muted)}
.lib[open] summary::after{content:"–"}
.lib h4{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:12px 0 6px}
.lib .chip{font-size:.84rem;padding:5px 10px;border-left:5px solid var(--cc)}
.lib .chip[disabled]{opacity:.45;cursor:not-allowed}
.lib .chip small{font-size:.7rem;color:var(--muted);margin-left:4px}
.lib .chip[aria-pressed="true"] small{color:inherit}
.star{color:#e0a400}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;background:var(--cc)}
.qsteps.four{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.ed{outline:1.5px dashed color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px;border-radius:4px;cursor:text;min-width:2ch;display:inline-block}
p.ed,div.ed{display:block}
.ed:hover{background:var(--soft)}
.ed:focus{outline:2px solid var(--accent);background:var(--soft)}
.ed:empty::before{content:"Type here…";color:var(--muted)}
.x{font:inherit;font-size:.95rem;line-height:1;border:0;background:none;color:var(--muted);cursor:pointer;padding:2px 6px;margin-left:4px;border-radius:6px}
.x:hover{color:var(--ink);background:var(--soft)}
.addbtn{font:inherit;font-size:.82rem;font-weight:700;border:1.5px dashed var(--line);background:none;color:var(--accent);border-radius:8px;padding:4px 10px;cursor:pointer;align-self:flex-start;margin-top:4px}
.addbtn:hover{border-color:var(--accent)}
.editbar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;padding:9px 24px;background:var(--soft);font-size:.88rem;font-weight:700;border-top:1px solid var(--line)}
.fieldlab{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:14px 0 4px;font-weight:700}
.prompt.sm{font-size:.98rem}
.editing .q ul{padding-left:1.1em}
.best.top{margin:0 0 4px;font-weight:700;font-size:.85rem;color:var(--muted)}
.sec h3 span{display:flex;align-items:center;gap:8px}
.sec h3 .n{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--rc);color:var(--card);font-size:.75rem;letter-spacing:0}
.pick.narrow{width:auto;min-width:220px;max-width:100%;margin-bottom:12px}
.more{border-top:1px solid var(--line)}
.more summary{cursor:pointer;padding:16px 24px;font-family:var(--display);font-weight:700;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;list-style:none}
.more summary::-webkit-details-marker{display:none}
.more summary::before{content:"▸";color:var(--muted);transition:transform .15s}
.more[open] summary::before{transform:rotate(90deg)}
.more summary span{font-family:var(--body);font-weight:400;font-size:.88rem;color:var(--muted)}
.more summary:focus-visible{outline:3px solid var(--hi);outline-offset:-3px}
.more .note{margin:0}
.foot{display:flex;flex-wrap:wrap;gap:8px;padding:14px 24px;border-top:1px solid var(--line);background:var(--paper)}
#another{width:100%}
/* Classroom display */
.stage{position:fixed;inset:0;background:var(--stage);color:var(--stage-ink);z-index:50;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top,0px) + 18px) 24px calc(env(safe-area-inset-bottom,0px) + 18px)}
.stage-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.stage-top .rn{font-family:var(--display);font-weight:700;opacity:.8}
.dots{display:flex;gap:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:#ffffff33}
.dots i.on{background:var(--hi)}
.stage-main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:2vh;max-width:1100px;margin:0 auto;width:100%;min-height:0}
.stage-kicker{font-family:var(--display);font-weight:800;font-size:clamp(2.2rem,7vw,5.5rem);line-height:1;color:var(--hi);margin:0}
.stage-q{font-family:var(--body);font-weight:700;font-size:clamp(1.5rem,4.4vw,3.4rem);line-height:1.2;margin:0;text-wrap:balance}
.stage-sub{font-size:clamp(1rem,2.2vw,1.6rem);opacity:.75;margin:0;max-width:40ch}
.stage-bar{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center}
.stage .btn{background:#ffffff14;color:var(--stage-ink);border:1.5px solid #ffffff30}
.stage .btn:hover{background:#ffffff26}
.stage .btn.go{background:var(--hi);color:#18233a;border-color:var(--hi)}
.timer{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.clock{font-family:var(--display);font-weight:800;font-size:1.8rem;font-variant-numeric:tabular-nums;min-width:3.2em;text-align:center}
.clock.done{color:var(--hi);animation:pulse 1s ease-in-out 3}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.clock.done{animation:none}*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div>
      <h1>PYP <span>Thinking Routines</span> Planner</h1>
      <p class="tag">A Visible Thinking Routine is a short set of questions that gets every student thinking and talking. Make three choices on the left, then press <b>Show to class</b>.</p>
    </div>
  </header>

  <div class="grid">
    <aside class="rail" aria-label="Set up your routine">
      <div class="step">
        <h2><b>1</b>Who is it for?</h2>
        <div class="chips" id="years" role="group" aria-label="Year group"></div>
      </div>
      <div class="step">
        <h2><b>2</b>What are you learning about?</h2>
        <select id="themeSel" class="pick" aria-label="Unit theme"></select>
      </div>
      <div class="step">
        <h2><b>3</b>Choose a routine</h2>
        <select id="pickSel" class="pick" aria-label="Thinking routine"></select>
        <p class="fit" id="fit"></p>
      </div>
      <button class="btn ghost" id="another" type="button">Try another routine ↻</button>
    </aside>

    <main class="out" id="out" aria-live="polite"></main>
  </div>
</div>

<div class="stage" id="stage" hidden role="dialog" aria-modal="true" aria-label="Classroom display">
  <div class="stage-top">
    <div class="rn" id="stRn"></div>
    <div class="dots" id="stDots"></div>
    <button class="btn small" id="stClose" type="button">Exit display ✕</button>
  </div>
  <div class="stage-main" id="stMain"></div>
  <div class="stage-bar">
    <div class="timer">
      <span class="clock" id="clock">0:00</span>
      <button class="btn small" data-t="60" type="button">1 min</button>
      <button class="btn small" data-t="120" type="button">2 min</button>
      <button class="btn small" data-t="180" type="button">3 min</button>
      <button class="btn small" id="tStop" type="button">Stop</button>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn" id="stPrev" type="button">← Back</button>
      <button class="btn go" id="stNext" type="button">Next →</button>
    </div>
  </div>
</div>

<script>
const YEARS=["Reception","Year 1","Year 2","Year 3","Year 4","Year 5","Year 6"];
const YI=y=>YEARS.indexOf(y);
const BAND=y=>YI(y)<=2?"early":(YI(y)<=4?"middle":"upper");
const TOP5=["stw","tpe","cov","cec","utnt"];
const YEAR_NOTE={
  "Reception":"Students answer out loud or by drawing. Model one answer yourself first and scribe for the class. Keep it to about 10 minutes.",
  "Year 1":"Show a picture cue for each step and do a quick think-aloud first. Students can draw and label their ideas.",
  "Year 2":"Pair talk before whole-class sharing. Students write one short sentence or label per step.",
  "Year 3":"Scaffolded: use the sentence starters on each card. Model one complete response before students begin.",
  "Year 4":"Students record ideas on their own first, then compare with a partner before sharing.",
  "Year 5":"Deeper questioning: use the 'Push further' questions to ask students to justify and extend.",
  "Year 6":"Independent reflection: students run the steps with minimal prompting and finish with a written reflection."
};
const CAT={
  see:{name:"Observing",tok:"--c-see"},ask:{name:"Questioning",tok:"--c-ask"},link:{name:"Connecting",tok:"--c-link"},
  view:{name:"Perspectives",tok:"--c-view"},reason:{name:"Reasoning",tok:"--c-reason"},act:{name:"Deciding",tok:"--c-act"},sum:{name:"Capturing the core",tok:"--c-sum"}
};

const FOCUS=[
  {id:"prov",name:"Provocation",rank:["stw","iniw","zoom","tpe","csi","ssw","ppc"]},
  {id:"launch",name:"Unit launch",rank:["tpe","stw","iniw","chalk","gsce","zoom"]},
  {id:"mid",name:"Mid-unit check",rank:["cec","tps","headlines","gsce","4cs","peel","chalk"]},
  {id:"end",name:"End-of-unit reflection",rank:["utnt","csi","headlines","cec","4cs","peel"]},
  {id:"persp",name:"Perspectives & empathy",rank:["cov","step","tps","chalk","tug"]},
  {id:"debate",name:"Debate & research",rank:["csq","tug","ssw","4cs","cov","ppc"]},
  {id:"action",name:"Decision & action",rank:["cp","tug","csq","cov","tps"]}
];

const THEMES=[
  {id:"gen",name:"Any unit (no theme)",lens:"What is the big idea here, and why does it matter?",close:"What would you like to find out next?",
   prov:["an image linked to your current unit","an object or artefact connected to your learning","a short video clip or text from your unit"],
   lp:["Inquirers","Thinkers"]},
  {id:"wwa",name:"Who We Are",lens:"How does this help us understand ourselves and others?",close:"How might this help us understand someone else?",
   prov:["photos of lunchboxes from children around the world","a mirror next to a collection of family photos","a picture book page showing a child who feels left out"],
   lp:["Open-minded","Reflective"]},
  {id:"wwpt",name:"Where We Are in Place and Time",lens:"What connections can we make to history or journeys?",close:"How might this have been different in the past?",
   prov:["an old map of your city next to a current one","an everyday object from long ago, such as a rotary phone","a photo of a packed suitcase for a long journey"],
   lp:["Inquirers","Knowledgeable"]},
  {id:"hwe",name:"How We Express Ourselves",lens:"How are ideas and feelings being communicated?",close:"What message might the creator want to share?",
   prov:["a painting shown without its title","a piece of instrumental music with no words","a festival mask or costume from another culture"],
   lp:["Communicators","Risk-takers"]},
  {id:"hww",name:"How the World Works",lens:"What systems, forces, or processes can you identify?",close:"What might be causing this to happen?",
   prov:["a time-lapse video of a seed sprouting","a magnet with a pile of paper clips and coins","a photo of a volcano erupting"],
   lp:["Inquirers","Thinkers"]},
  {id:"hwo",name:"How We Organize Ourselves",lens:"How are people working together or making decisions?",close:"Who makes the decisions here, and how?",
   prov:["a photo of a busy market","a map of the school with its rules and routines","the journey of a chocolate bar from cocoa farm to shop"],
   lp:["Principled","Balanced"]},
  {id:"stp",name:"Sharing the Planet",lens:"What responsibilities do humans have here?",close:"How might people help?",
   prov:["a photo of ocean plastic pollution","then-and-now photos of a melting glacier","a close-up of a bee on a flower"],
   lp:["Caring","Principled"]}
];

const ENG={
  tt:{name:"Turn & Talk",steps:["Give 20 seconds of silent thinking time for the first step.","Partner A talks for 45 seconds while Partner B listens. Swap.","Repeat for each step of the routine.","Cold-call three pairs to share their partner's best idea, not their own."]},
  wb:{name:"Mini whiteboards",steps:["Everyone gets a whiteboard and pen. Read the first question aloud.","Give 30 seconds to write or draw a response.","Say \"3, 2, 1, show me!\" Scan the room and pick two boards to discuss.","Wipe and repeat for each step."]},
  mm:{name:"Mind map",steps:["Groups of 4 put the provocation (or its title) in the centre of chart paper.","Draw one branch for each step of the routine, each in a different colour.","Every student adds at least one idea to every branch.","Groups draw lines to connect related ideas, then share one connection."]},
  sn:{name:"Sticky-note wall",steps:["Make one column on the board for each step of the routine.","Students write one idea per sticky note, at least one for each column.","Post the notes, then a small group clusters similar ideas.","Read clusters aloud. Keep the question notes on your inquiry wall."]},
  gw:{name:"Gallery walk",steps:["Put one chart for each step around the room, with the provocation nearby.","Groups start at a chart and add ideas for 3 minutes.","Rotate. Each group reads, ticks ideas they agree with and adds new ones.","Groups return to their first chart and summarise what changed."]}
};

// st(label, early, middle, upper, starter, push, extra)
const st=(lab,e,m,u,starter,push,x={})=>Object.assign({lab,early:e&&[].concat(e),middle:[].concat(m),upper:[].concat(u),starter,push},x);
const T={theme:true};
const R={

const ORDER=["stw","iniw","tps","tpe","chalk","csi","cec","cov","utnt","csq","cp","zoom","headlines","ssw","gsce","ppc","step","peel","4cs","tug"];

// ---------- state ----------
const S={year:"Year 3",theme:"stp",focus:"prov",idx:0,prov:0,eng:null,pick:null,edit:false};
try{const s=JSON.parse(localStorage.getItem("vtr-planner")||"null");if(s){if(YEARS.includes(s.year))S.year=s.year;if(THEMES.some(t=>t.id===s.theme))S.theme=s.theme;if(FOCUS.some(f=>f.id===s.focus))S.focus=s.focus;}}catch(e){}
const save=()=>{try{localStorage.setItem("vtr-planner",JSON.stringify({year:S.year,theme:S.theme,focus:S.focus}))}catch(e){}};

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ok=id=>R[id].min<=YI(S.year);
function ranked(){
  const f=FOCUS.find(f=>f.id===S.focus);
  let list=[...f.rank,...ORDER.filter(r=>!f.rank.includes(r))].filter(ok);
  if(S.year==="Year 2"||S.year==="Year 3"){const fit=f.rank.filter(r=>TOP5.includes(r)&&ok(r));list=[...fit,...list.filter(r=>!fit.includes(r))];}
  return list;
}
function current(){if(S.pick)return S.pick;const list=ranked();return list[S.idx%list.length];}
const yShort=i=>i===0?"Reception":"Y"+i;

function chips(el,items,key,label){
  el.innerHTML=items.map(it=>`<button type="button" class="chip" id="${key}-${String(it.id).replace(/\s+/g,'-')}" data-v="${esc(it.id)}" aria-pressed="${S[key]===it.id}">${esc(label(it))}</button>`).join("");
  el.onclick=e=>{const b=e.target.closest(".chip");if(!b)return;S[key]=b.dataset.v;S.idx=0;S.eng=null;if(key==="theme")S.prov=0;save();renderRail();render();};
}
function renderLib(){
  const sel=$("#pickSel");
  const o=id=>{const r=R[id];return `<option value="r:${id}">${TOP5.includes(id)?"★ ":""}${esc(r.name)}${ok(id)?"":` (${yShort(r.min)}+)`}</option>`;};
  sel.innerHTML=`<optgroup label="Let the app suggest one for…">${FOCUS.map(f=>`<option value="f:${f.id}">✨ ${esc(f.name)}</option>`).join("")}</optgroup>
    <optgroup label="Most used">${ORDER.filter(i=>R[i].core).map(o).join("")}</optgroup>
    <optgroup label="More routines">${ORDER.filter(i=>!R[i].core).map(o).join("")}</optgroup>`;
  sel.value=S.pick?"r:"+S.pick:"f:"+S.focus;
  sel.onchange=()=>{const [k,v]=sel.value.split(":");if(k==="f"){S.focus=v;S.pick=null;save();}else S.pick=v;S.idx=0;S.eng=null;render();};
  $("#fit").textContent=S.pick?"Your chosen routine.":(S.year==="Year 2"||S.year==="Year 3")?"Suggestions start with your ★ top five.":"Not sure? Leave it on a suggestion.";
}
function renderRail(){
  chips($("#years"),YEARS.map(y=>({id:y})),"year",it=>yShort(YI(it.id)));
  const ts=$("#themeSel");
  ts.innerHTML=THEMES.map(t=>`<option value="${t.id}">${esc(t.name)}</option>`).join("");
  ts.value=S.theme;
  ts.onchange=()=>{S.theme=ts.value;S.prov=0;S.eng=null;save();render();};
}

function qsFor(stp,band,t){
  const qs=(stp[band]||stp.middle||stp.early).slice();
  if(stp.theme&&band!=="upper")qs.push(t.close);
  return qs;
}

// ---------- editable plan ----------
let EDITS={};
try{EDITS=JSON.parse(localStorage.getItem("vtr-edits")||"{}")||{};}catch(e){EDITS={};}
const saveEdits=()=>{try{localStorage.setItem("vtr-edits",JSON.stringify(EDITS))}catch(e){}};
const planKey=()=>`${current()}|${S.year}|${S.theme}`;
const txt=h=>{const d=document.createElement("div");d.innerHTML=h;return d.textContent;};

function freshPlan(){
  const id=current(), r=R[id], t=THEMES.find(x=>x.id===S.theme), band=BAND(S.year);
  const p=t.prov[S.prov%t.prov.length];
  const engId=S.eng||r.eng;
  return {
    title:r.name, look:`Look closely at ${p}.`,
    prompt:txt(r.teach(p,t)),
    steps:r.steps.map(stp=>({lab:stp.lab,sub:stp.sub||"",pos:stp.pos||"",qs:qsFor(stp,band,t),starter:stp.starter,push:stp.push})),
    note:YEAR_NOTE[S.year],
    lens:t.lens,
    eng:{id:engId,steps:ENG[engId].steps.slice()},
    reflect:S.year==="Year 6"?"In your journal: Which step changed your thinking the most? What will you do next with this idea, and how does it connect to the central idea?":"",
    atl:r.atl.slice(), lp:[...new Set([...t.lp,r.lp])]
  };
}
let PLAN=null, PLAN_KEY=null;
function getPlan(){
  const k=planKey();
  if(PLAN_KEY!==k){PLAN_KEY=k;PLAN=EDITS[k]?JSON.parse(JSON.stringify(EDITS[k])):freshPlan();}
  return PLAN;
}
const edited=()=>!!EDITS[PLAN_KEY];
function commit(){EDITS[PLAN_KEY]=PLAN;saveEdits();const b=$("#resetPlan");if(b)b.hidden=false;const m=$("#editState");if(m)m.textContent="Edits saved on this device";}
function getPath(path){return path.split(".").reduce((o,k)=>o[k],PLAN);}
function setPath(path,v){const ks=path.split(".");const last=ks.pop();ks.reduce((o,k)=>o[k],PLAN)[last]=v;}

// editable text helper
function E(path,val,tag="span",cls=""){
  return S.edit
    ? `<${tag} class="ed ${cls}" contenteditable="true" spellcheck="true" data-f="${path}">${esc(val)}</${tag}>`
    : `<${tag} class="${cls}">${esc(val)}</${tag}>`;
}
const del=path=>S.edit?`<button type="button" class="x" data-del="${path}" aria-label="Remove">×</button>`:"";
const add=(path,label)=>S.edit?`<button type="button" class="addbtn" data-add="${path}">+ ${label}</button>`:"";

function qCard(stp,i,year){
  const showStarter=S.edit||["Year 1","Year 2","Year 3"].includes(year);
  const showPush=S.edit||["Year 5","Year 6"].includes(year);
  return `<div class="q ${stp.pos}"><div class="lab">${stp.sub?`<small>${esc(stp.lab)}</small>${E(`steps.${i}.sub`,stp.sub)}`:E(`steps.${i}.lab`,stp.lab)}</div>
    <ul>${stp.qs.map((q,j)=>`<li>${E(`steps.${i}.qs.${j}`,q)}${del(`steps.${i}.qs.${j}`)}</li>`).join("")}</ul>
    ${add(`steps.${i}.qs`,"question")}
    ${showStarter?`<div class="starter">Sentence starter: “${E(`steps.${i}.starter`,stp.starter)}”</div>`:""}
    ${showPush?`<div class="push"><b>Push further:</b> ${E(`steps.${i}.push`,stp.push)}</div>`:""}</div>`;
}

function render(){
  const id=current(), r=R[id], t=THEMES.find(x=>x.id===S.theme), band=BAND(S.year);
  const P=getPlan();
  const engId=P.eng.id;
  const list=ranked();
  const out=$("#out");
  out.style.setProperty("--rc",`var(${CAT[r.cat].tok})`);
  out.classList.toggle("editing",!!S.edit);
  const cards=P.steps.map((s,i)=>qCard(s,i,S.year)).join("");
  const stepsHtml=r.compass
    ? `<div class="compass">${cards}<div class="hub" aria-hidden="true"><svg viewBox="0 0 56 56"><circle cx="28" cy="28" r="26" fill="none" stroke="var(--line)" stroke-width="2"/><path d="M28 6 L33 28 L28 50 L23 28Z" fill="var(--rc)"/><path d="M6 28 L28 23 L50 28 L28 33Z" fill="var(--muted)" opacity=".5"/></svg></div></div>`
    : `<div class="qsteps${P.steps.length>3?" four":""}">${cards}</div>`;
  const engNote=YI(S.year)<=1&&(engId==="wb"||engId==="sn")?" For younger students, they draw rather than write.":"";
  const pos=S.pick?"Your pick":`Option ${list.indexOf(id)+1} of ${list.length}`;
  const engOpts=Object.entries(ENG).map(([k,v])=>`<option value="${k}" ${k===engId?"selected":""}>${esc(v.name)}</option>`).join("");
  out.innerHTML=`
  <div class="out-head">
    <div style="min-width:0">
      <p class="best top">${esc(S.year)} · ${esc(t.name)}${TOP5.includes(id)?' · <span class="star">★</span> top five':""}</p>
      <h2 class="rname">${E("title",P.title)}</h2>
      <p class="best">Good for ${esc(r.best.charAt(0).toLowerCase()+r.best.slice(1))}. Takes about 15 minutes.</p>
    </div>
    <div class="head-actions">
      <button class="btn primary" id="present" type="button">Show to class ▶</button>
    </div>
  </div>
  ${S.edit||edited()?`<div class="editbar"><span id="editState">${S.edit?"Click any outlined text to change it. Changes save automatically.":"This routine includes your changes."}</span><button type="button" class="linkbtn" id="resetPlan" ${edited()?"":"hidden"}>Reset to original</button></div>`:""}
  <section class="sec">
    <h3><span><b class="n">1</b>Set it up</span><button class="linkbtn" id="newProv" type="button">Another idea ↻</button></h3>
    ${E("prompt",P.prompt,"p","prompt")}
    ${S.edit?`<p class="fieldlab">First slide in class display</p>${E("look",P.look,"p","prompt sm")}`:""}
  </section>
  <section class="sec">
    <h3><span><b class="n">2</b>Ask these questions, one at a time</span></h3>
    ${stepsHtml}
    ${ok(id)?"":`<p class="warn">This routine is usually used from ${yShort(r.min)}. For ${esc(S.year)}, do it together as a class and use only the first question on each card.</p>`}
  </section>
  <section class="sec eng">
    <h3><span><b class="n">3</b>How students share</span></h3>
    <select id="engSel" class="pick narrow" aria-label="How students share">${engOpts}</select>
    <ol>${P.eng.steps.map((s,i)=>`<li>${E(`eng.steps.${i}`,s)}${del(`eng.steps.${i}`)}</li>`).join("")}</ol>
    ${add("eng.steps","step")}
    ${engNote?`<p class="note">${esc(engNote)}</p>`:""}
  </section>
  <details class="more" id="more" ${S.edit||S.more?"open":""}>
    <summary>Planning extras <span>tips, big question, ATL and learner profile</span></summary>
    <div class="sec plain">
      <h3>Tip for ${esc(S.year)}</h3>
      ${E("note",P.note,"p","note")}
    </div>
    <div class="sec">
      <h3>Big question to finish with</h3>
      <div class="lens"><div class="ic">?</div><p>${E("lens",P.lens)}</p></div>
    </div>
    ${P.reflect||S.edit?`<div class="sec"><h3>Independent reflection</h3>${E("reflect",P.reflect,"p","reflect")}</div>`:""}
    <div class="sec two">
      <div><h3>ATL skills</h3><div class="tags">${P.atl.map((a,i)=>`<span>${E(`atl.${i}`,a)}${del(`atl.${i}`)}</span>`).join("")}${add("atl","skill")}</div></div>
      <div><h3>Learner profile</h3><div class="tags">${P.lp.map((a,i)=>`<span>${E(`lp.${i}`,a)}${del(`lp.${i}`)}</span>`).join("")}${add("lp","attribute")}</div></div>
    </div>
  </details>
  <div class="foot">
    <button class="btn ${S.edit?"primary":"ghost"} small" id="editBtn" type="button" aria-pressed="${!!S.edit}">${S.edit?"Done editing ✓":"Change the wording ✎"}</button>
    <button class="btn ghost small" id="copy" type="button">Copy as text</button>
  </div>`;
  $("#present").onclick=openStage;
  $("#copy").onclick=copyPlan;
  $("#more").ontoggle=e=>{if(!S.edit)S.more=e.target.open;};
  $("#editBtn").onclick=()=>{S.edit=!S.edit;render();if(S.edit){const f=$("#out [contenteditable]");f&&f.focus();}};
  $("#newProv").onclick=()=>{S.prov++;const f=freshPlan();PLAN.prompt=f.prompt;PLAN.look=f.look;if(edited())commit();render();};
  const rb=$("#resetPlan");if(rb)rb.onclick=()=>{delete EDITS[PLAN_KEY];saveEdits();PLAN_KEY=null;render();};
  $("#engSel").onchange=ev=>{S.eng=ev.target.value;PLAN.eng={id:S.eng,steps:ENG[S.eng].steps.slice()};if(edited())commit();render();};
  renderLib();
}
// edit events (delegated once)
$("#out").addEventListener("input",e=>{const el=e.target.closest("[data-f]");if(!el)return;setPath(el.dataset.f,el.textContent);commit();});
$("#out").addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.matches("span[contenteditable]")){e.preventDefault();e.target.blur();}});
$("#out").addEventListener("paste",e=>{if(!e.target.closest("[contenteditable]"))return;e.preventDefault();const t=(e.clipboardData||window.clipboardData).getData("text");document.execCommand("insertText",false,t);});
$("#out").addEventListener("click",e=>{
  const d=e.target.closest("[data-del]"),a=e.target.closest("[data-add]");
  if(d){const ks=d.dataset.del.split(".");const i=+ks.pop();getPath(ks.join(".")).splice(i,1);commit();render();}
  if(a){const arr=getPath(a.dataset.add);arr.push("");commit();render();const f=$(`[data-f="${a.dataset.add}.${arr.length-1}"]`);f&&f.focus();}
});

function planText(){
  const P=getPlan(), t=THEMES.find(x=>x.id===S.theme);
  let s=`${P.title}\n${S.year} · ${t.name} · ${FOCUS.find(f=>f.id===S.focus).name}\n\nTeacher prompt\n${P.prompt}\n\nStudent questions\n`;
  P.steps.forEach(stp=>{s+=`${stp.lab}${stp.sub?" ("+stp.sub+")":""}\n${stp.qs.filter(Boolean).map(q=>"  • "+q).join("\n")}\n`;});
  s+=`\nTheme lens: ${P.lens}\n\nEngagement move: ${ENG[P.eng.id].name}\n${P.eng.steps.filter(Boolean).map((x,i)=>`  ${i+1}. ${x}`).join("\n")}\n\nNote: ${P.note}\n${P.reflect?`Independent reflection: ${P.reflect}\n`:""}ATL: ${P.atl.filter(Boolean).join("; ")}\nLearner profile: ${P.lp.filter(Boolean).join(", ")}`;
  return s;
}
function toast(m){const d=document.createElement("div");d.className="toast";d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),1800);}
function copyPlan(){
  const txt=planText();
  const fallback=()=>{let ta=$("#copyArea");if(!ta){ta=document.createElement("textarea");ta.id="copyArea";ta.className="copybox";ta.readOnly=true;$(".out-head").after(ta);}ta.value=txt;ta.focus();ta.select();toast("Text selected. Press Ctrl/Cmd + C");};
  try{navigator.clipboard.writeText(txt).then(()=>toast("Plan copied"),fallback);}catch(e){fallback();}
}

// ---------- classroom display ----------
let slides=[],si=0,tick=null,left=0,wake=null;
function buildSlides(){
  const P=getPlan();
  const f=x=>x.filter(q=>q&&q.trim());
  slides=[{k:P.title,q:P.look,sub:"Silent looking first. No talking yet."}];
  P.steps.forEach(stp=>{const qs=f(stp.qs);slides.push({k:stp.sub?`${stp.lab} · ${stp.sub}`:stp.lab,q:qs[0]||"",sub:qs.slice(1).join(" ")||(["Year 1","Year 2","Year 3"].includes(S.year)&&stp.starter?`“${stp.starter}”`:"")});});
  slides.push({k:"Big question",q:P.lens,sub:THEMES.find(x=>x.id===S.theme).name});
}
function showSlide(){
  const s=slides[si];
  $("#stMain").innerHTML=`<p class="stage-kicker">${esc(s.k)}</p><p class="stage-q">${esc(s.q)}</p>${s.sub?`<p class="stage-sub">${esc(s.sub)}</p>`:""}`;
  $("#stDots").innerHTML=slides.map((_,i)=>`<i class="${i===si?"on":""}"></i>`).join("");
  $("#stPrev").disabled=si===0;$("#stNext").textContent=si===slides.length-1?"Finish ✓":"Next →";
}
function openStage(){
  buildSlides();si=0;$("#stRn").textContent=`${getPlan().title} · ${S.year}`;
  $("#stage").hidden=false;showSlide();$("#stNext").focus();
  try{document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen().catch(()=>{});}catch(e){}
  try{navigator.wakeLock&&navigator.wakeLock.request("screen").then(w=>wake=w).catch(()=>{});}catch(e){}
}
function closeStage(){
  $("#stage").hidden=true;stopTimer();
  try{document.fullscreenElement&&document.exitFullscreen().catch(()=>{});}catch(e){}
  try{wake&&wake.release();wake=null;}catch(e){}
  $("#present")&&$("#present").focus();
}
function fmt(n){return Math.floor(n/60)+":"+String(n%60).padStart(2,"0");}
function stopTimer(){clearInterval(tick);tick=null;left=0;const c=$("#clock");c.textContent="0:00";c.classList.remove("done");}
function startTimer(sec){stopTimer();left=sec;const c=$("#clock");c.textContent=fmt(left);tick=setInterval(()=>{left--;c.textContent=fmt(Math.max(left,0));if(left<=0){clearInterval(tick);tick=null;c.classList.add("done");}},1000);}
$("#stClose").onclick=closeStage;
$("#stPrev").onclick=()=>{if(si>0){si--;showSlide();}};
$("#stNext").onclick=()=>{if(si<slides.length-1){si++;showSlide();}else closeStage();};
$("#tStop").onclick=stopTimer;
document.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>startTimer(+b.dataset.t));
document.addEventListener("keydown",e=>{if($("#stage").hidden)return;if(e.key==="ArrowRight"||e.key===" "){e.preventDefault();$("#stNext").click();}if(e.key==="ArrowLeft")$("#stPrev").click();if(e.key==="Escape")closeStage();});

// ---------- main buttons ----------
$("#another").onclick=()=>{if(S.pick){const l=ranked();S.idx=l.indexOf(S.pick);S.pick=null;}S.idx++;S.eng=null;render();};

renderRail();render();
</script>
</body>
</html>
