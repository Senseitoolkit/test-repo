<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammar Sets</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caladea:wght@400;700&family=Carlito:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: header, one control bar (grade, set, actions), then a single column of question cards with a sticky score strip. */
:root{
  --bg:#F6F8F7; --panel:#FFFFFF; --soft:#EEF3F1; --line:#DCE4E0; --line-strong:#C3D0CA;
  --ink:#16201C; --muted:#5E6B66; --accent:#2F5D50; --accent-ink:#FFFFFF; --accent-soft:#E3EEE9; --focus:#3C8A72;
  --ok:#2E7D4F; --ok-soft:#E1F1E7; --bad:#B3452B; --bad-soft:#F8E4DE;
  --sans:"Carlito","Calibri","Segoe UI",system-ui,sans-serif; --serif:"Caladea","Cambria",Georgia,serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --panel:#161E1B; --soft:#1C2723; --line:#26332E; --line-strong:#34453E;
  --ink:#E4ECE8; --muted:#97A7A0; --accent:#7CC0A6; --accent-ink:#0D1412; --accent-soft:#1E302A; --focus:#9AD6BF;
  --ok:#7DCC9B; --ok-soft:#1C3125; --bad:#F0907A; --bad-soft:#3A231D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --panel:#161E1B; --soft:#1C2723; --line:#26332E; --line-strong:#34453E;
  --ink:#E4ECE8; --muted:#97A7A0; --accent:#7CC0A6; --accent-ink:#0D1412; --accent-soft:#1E302A; --focus:#9AD6BF;
  --ok:#7DCC9B; --ok-soft:#1C3125; --bad:#F0907A; --bad-soft:#3A231D; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{max-width:820px;margin:0 auto;padding:22px 16px 48px;display:flex;flex-direction:column;gap:16px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
button{font:inherit;color:inherit}
h1{font-family:var(--serif);font-size:28px;line-height:1.15;margin:0;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.bar{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.lbl{font-size:12.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:52px;flex:none}
.chip{appearance:none;border:1px solid var(--line-strong);background:transparent;border-radius:999px;padding:6px 13px;font-weight:700;font-size:14.5px;cursor:pointer;font-variant-numeric:tabular-nums}
.chip:hover{background:var(--soft)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.num{min-width:38px;padding:6px 0;text-align:center}
.btn{appearance:none;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:9px 16px;font-weight:700;font-size:15px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line-strong)}
.btn.ghost:hover{background:var(--soft)}
.actions{border-top:1px solid var(--line);padding-top:12px;justify-content:space-between}
.mix{color:var(--muted);font-size:14px}
.strip{position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}
.strip b{font-family:var(--serif);font-size:18px}
.strip .count{color:var(--muted);font-variant-numeric:tabular-nums}
.score{font-weight:700;padding:4px 12px;border-radius:999px;background:var(--accent-soft);font-variant-numeric:tabular-nums}
ol.qs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.q{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;grid-template-columns:34px 1fr;gap:4px 10px}
.q .n{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--accent);font-variant-numeric:tabular-nums}
.q .stem{font-size:17.5px;margin:1px 0 10px;max-width:65ch}
.q .body{grid-column:2;min-width:0}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}
.opts.long{grid-template-columns:1fr}
.opt{appearance:none;text-align:left;border:1px solid var(--line-strong);background:transparent;border-radius:10px;padding:9px 12px;cursor:pointer;display:flex;gap:10px;align-items:baseline;font-size:16px}
.opt:hover{background:var(--soft)}
.opt .k{font-weight:700;color:var(--muted);flex:none}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.opt.right{border-color:var(--ok);background:var(--ok-soft);box-shadow:inset 0 0 0 1px var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);box-shadow:inset 0 0 0 1px var(--bad)}
.opt .mark{margin-left:auto;font-weight:700;font-size:13.5px;flex:none}
.opt.right .mark{color:var(--ok)} .opt.wrong .mark{color:var(--bad)}
.point{margin:10px 0 0;font-size:13.5px;color:var(--muted)}
.foot{color:var(--muted);font-size:14px;margin:0}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14.5px}
@media (max-width:480px){.q{grid-template-columns:1fr}.q .body{grid-column:1}.lbl{width:100%}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Grammar Sets</h1>
    <p class="sub">Grammar and punctuation questions, Kindergarten to Grade 5. Each grade has 11 sets that never share a question.</p>
  </header>

  <div class="bar">
    <div class="row"><span class="lbl">Grade</span><div class="row" id="grades" role="group" aria-label="Grade"></div></div>
    <div class="row"><span class="lbl">Set</span><div class="row" id="sets" role="group" aria-label="Set"></div></div>
    <div class="row actions">
      <div class="row">
        <button class="btn" type="button" id="reshuffle">Reshuffle all sets</button>
        <span class="mix" id="mix"></span>
      </div>
      <div class="row">
        <button class="btn ghost" type="button" id="copyQ">Copy set</button>
        <button class="btn ghost" type="button" id="copyA">Copy answer key</button>
      </div>
    </div>
  </div>

  <div class="strip">
    <div><b id="title"></b> <span class="count" id="count"></span></div>
    <div class="row">
      <span class="score" id="score" hidden></span>
      <button class="btn ghost" type="button" id="clear">Clear answers</button>
      <button class="btn" type="button" id="check">Check answers</button>
    </div>
  </div>

  <ol class="qs" id="qs"></ol>
  <p class="foot" id="foot"></p>
</div>
<div id="toast" role="status" hidden></div>

<script>

/* Seeded random: the same mix number always gives the same sets. */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
function rng(seed){let a=hash(seed);return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function shuffled(arr,seed){const a=arr.slice(),r=rng(seed);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

/* Each grammar point's 11 questions are dealt out, one to each set, in a random order.
   Then each set's question order and answer order are shuffled. Two-option questions keep their order. */
function buildSet(g,set,mix){
  const G=DATA[g],tag=`${mix}|${G.short}`;
  const qs=G.points.map((p,pi)=>{
    const it=shuffled(p.items,`${tag}|deal|${pi}`)[set];
    const correct=it[1][it[2]];
    const opts=it[1].length>2?shuffled(it[1],`${tag}|${set}|opt|${it[0]}`):it[1].slice();
    return{stem:it[0],options:opts,answer:opts.indexOf(correct),point:p.point};
  });
  return shuffled(qs,`${tag}|${set}|order`);
}

const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const saved=store.get("grammar-sets",{});
const S={g:saved.g>=0&&saved.g<DATA.length?saved.g:0,set:saved.set>=0&&saved.set<SETS?saved.set:0,mix:saved.mix||1,ans:{},checked:false,qs:[]};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let tt;function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,2200);}

function renderBar(){
  $("grades").innerHTML=DATA.map((G,i)=>`<button class="chip" type="button" data-g="${i}" aria-pressed="${i===S.g}">${esc(G.grade)}</button>`).join("");
  $("sets").innerHTML=Array.from({length:SETS},(_,i)=>`<button class="chip num" type="button" data-s="${i}" aria-pressed="${i===S.set}">${i+1}</button>`).join("");
  $("mix").textContent=`Mix ${S.mix}`;
}
function renderQs(){
  const G=DATA[S.g];
  $("title").textContent=`${G.grade} · Set ${S.set+1}`;
  $("qs").innerHTML=S.qs.map((q,i)=>{
    const long=q.options.some(o=>o.length>30);
    const opts=q.options.map((o,j)=>{
      const picked=S.ans[i]===j;let cls="",mark="";
      if(S.checked){if(j===q.answer){cls=" right";mark=picked?"Correct":"Answer";}else if(picked){cls=" wrong";mark="Your answer";}}
      return `<button class="opt${cls}" type="button" data-q="${i}" data-o="${j}" aria-pressed="${picked}"><span class="k">${"ABCDE"[j]}</span><span>${esc(o)}</span>${mark?`<span class="mark">${mark}</span>`:""}</button>`;
    }).join("");
    return `<li class="q"><span class="n">${i+1}</span><div class="body"><p class="stem">${esc(q.stem)}</p><div class="opts${long?" long":""}">${opts}</div>${S.checked?`<p class="point">Grammar point: ${esc(q.point)}</p>`:""}</div></li>`;
  }).join("");
  const done=Object.keys(S.ans).length,n=S.qs.length;
  $("count").textContent=`${done} of ${n} answered`;
  const sc=$("score");sc.hidden=!S.checked;
  if(S.checked){const r=S.qs.filter((q,i)=>S.ans[i]===q.answer).length;sc.textContent=`Score ${r} / ${n}`;}
  $("check").textContent=S.checked?"Hide marking":"Check answers";
  $("foot").textContent=`${n} questions, one for each grammar point in ${G.grade}. Reshuffle all sets to deal the questions into 11 new sets.`;
}
function load(keep){
  S.qs=buildSet(S.g,S.set,S.mix);if(!keep){S.ans={};S.checked=false;}
  store.set("grammar-sets",{g:S.g,set:S.set,mix:S.mix});renderBar();renderQs();
}
function asText(withAnswers){
  const G=DATA[S.g],head=`${G.grade} · Grammar Set ${S.set+1} (Mix ${S.mix})`;
  if(withAnswers)return head+" · Answer key\n\n"+S.qs.map((q,i)=>`${i+1}. ${"ABCDE"[q.answer]}  ${q.options[q.answer]}  [${q.point}]`).join("\n");
  return head+"\n\n"+S.qs.map((q,i)=>`${i+1}. ${q.stem}\n`+q.options.map((o,j)=>`   ${"ABCDE"[j]}. ${o}`).join("\n")).join("\n\n");
}
async function copy(text,what){try{await navigator.clipboard.writeText(text);toast(`${what} copied`);}catch(e){toast("Copying is blocked here. Open the page in its own tab and try again.");}}

$("grades").addEventListener("click",e=>{const b=e.target.closest("[data-g]");if(b){S.g=+b.dataset.g;load();}});
$("sets").addEventListener("click",e=>{const b=e.target.closest("[data-s]");if(b){S.set=+b.dataset.s;load();}});
$("reshuffle").addEventListener("click",()=>{S.mix++;load();toast(`Mix ${S.mix}: all sets reshuffled`);});
$("qs").addEventListener("click",e=>{const b=e.target.closest(".opt");if(!b)return;const q=+b.dataset.q,o=+b.dataset.o;if(S.ans[q]===o)delete S.ans[q];else S.ans[q]=o;renderQs();});
$("check").addEventListener("click",()=>{S.checked=!S.checked;renderQs();});
$("clear").addEventListener("click",()=>{S.ans={};S.checked=false;renderQs();});
$("copyQ").addEventListener("click",()=>copy(asText(false),"Set"));
$("copyA").addEventListener("click",()=>copy(asText(true),"Answer key"));
load();
</script>
</body>
</html>
