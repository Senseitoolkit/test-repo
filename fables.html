/* ============ APP ============ */
const STAGES=["Beginning","Build-Up","Problem","Solution","Aftermath"];
const ORDER=["goats","pigs","boy","sheep","ant","bears","goose","hare","lion"];
const sceneFor=sc=>sc&&sc.p?sceneSVG(sc):genSceneSVG(sc||{bg:"meadow",a:[]});
const KEY="flipped-fables-endings-v2";
let found=new Set();
try{found=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){}
try{JSON.parse(localStorage.getItem("flipped-fables-endings-v1")||"[]").forEach(e=>found.add("goats:"+e))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify([...found]))}catch(e){}};
const fables=()=>ORDER.filter(id=>FABLE[id]).map(id=>FABLE[id]);
const endingsOf=(f,k)=>f.sides[k].endings;
const foundIn=(f,k)=>endingsOf(f,k).filter(e=>found.has(f.id+":"+e)).length;
const totalEndings=()=>fables().reduce((n,f)=>n+endingsOf(f,"a").length+endingsOf(f,"b").length,0);
let state={screen:"library",fid:null,side:null,node:null,history:[]};
const app=document.getElementById("app");
const $=s=>app.querySelector(s);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");
const canSpeak="speechSynthesis" in window;
function stopSpeech(){try{speechSynthesis.cancel()}catch(e){}}
function updateCount(){document.getElementById("count").textContent=`${[...found].filter(k=>{const[f,e]=k.split(":");return FABLE[f]&&FABLE[f].nodes[e]}).length} / ${totalEndings()}`}
function go(screen,extra={}){stopSpeech();Object.assign(state,{screen},extra);render();window.scrollTo(0,0)}

function library(){
  document.body.className="";
  const all=fables();
  app.innerHTML=`<section class="hero fade">
    <div class="eyebrow">Choose-your-own-adventure fables</div>
    <h1>Every story has another side.</h1>
    <p>Pick a fable, then pick whose eyes to see it through. Your choices decide how it ends. Can you find every ending from both sides?</p>
  </section>
  <div class="shelf fade">${all.map(f=>{const n=foundIn(f,"a")+foundIn(f,"b"),t=endingsOf(f,"a").length+endingsOf(f,"b").length;
    return `<button class="book live" data-f="${f.id}"><div class="thumb">${sceneFor(f.sides.a.cover)}</div><div class="book-body"><h3>${esc(f.title)}</h3><span class="sides">${esc(f.sides.a.short)} · ${esc(f.sides.b.short)}</span><span class="meter" aria-label="${n} of ${t} endings found"><i style="width:${n/t*100}%"></i></span><span class="sides tnum">${n} of ${t} endings found</span></div></button>`}).join("")}</div>`;
  app.querySelectorAll(".book.live").forEach(b=>b.onclick=()=>go("choose",{fid:b.dataset.f}));
}

function choose(){
  document.body.className="";
  const f=FABLE[state.fid];
  const card=k=>{const s=f.sides[k];return `<button class="side p-${k}" data-s="${k}">${sceneFor(s.cover)}<div class="side-body">
      <span class="eyebrow">${s.flipped?"Flipped fable":"Classic view"}</span><h3>${esc(s.name)}</h3><p>${esc(s.blurb)}</p>
      <span class="found">${foundIn(f,k)} of ${endingsOf(f,k).length} endings found</span></div></button>`};
  app.innerHTML=`<section class="choose-head fade"><button class="pill-btn" id="shelf">← All fables</button><div class="eyebrow" style="margin-top:14px">${esc(f.title)}</div><h2>Whose story will you tell?</h2></section>
  <div class="sides-grid fade">${card("a")}${card("b")}</div>`;
  app.querySelectorAll(".side").forEach(b=>b.onclick=()=>startSide(b.dataset.s));
  $("#shelf").onclick=()=>go("library");
}
function startSide(k){const f=FABLE[state.fid];go("story",{side:k,node:f.sides[k].start,history:[]})}

function storyScreen(){
  const f=FABLE[state.fid], N=f.nodes, n=N[state.node], s=f.sides[state.side];
  document.body.className="p-"+state.side;
  const seen=new Set(state.history.map(id=>N[id].stage));
  const stages=STAGES.map((st,i)=>`<li class="${i===n.stage?"now":seen.has(i)?"done":""}">${st}</li>`).join("");
  let body;
  if(n.ending){
    const list=endingsOf(f,state.side), idx=list.indexOf(state.node)+1, key=f.id+":"+state.node;
    const isNew=!found.has(key);found.add(key);save();updateCount();
    const other=state.side==="a"?"b":"a";
    body=`<div class="page-title"><span class="ending-badge ${isNew?"new":""}">Ending ${idx} of ${list.length}</span>${readBtn()}</div>
     <h2 class="end-title">${esc(n.title)}</h2>
     <div class="text">${n.text.map(t=>`<p>${esc(t)}</p>`).join("")}</div>
     <div class="lesson"><div class="box"><b>The lesson</b><p>${esc(n.moral)}</p></div>
     <div class="box think"><b>Think about it</b><p>${esc(n.think)}</p></div></div>
     <div class="end-actions">
      <button class="btn primary" id="again">Try a different path</button>
      <button class="btn p-${other}" id="flip">Flip it: ${esc(f.sides[other].short)}</button>
      <button class="btn" id="shelf2">Another fable</button></div>`;
  }else{
    body=`<div class="page-title"><h2>${esc(n.title)}</h2>${readBtn()}</div>
     <div class="text">${n.text.map(t=>`<p>${esc(t)}</p>`).join("")}</div>
     <div class="prompt">${esc(n.prompt)}</div>
     <div class="choices">${n.choices.map((c,i)=>`<button class="choice" data-to="${c[1]}"><span class="key">${"ABCD"[i]}</span><span>${esc(c[0])}</span></button>`).join("")}</div>`;
  }
  app.innerHTML=`<div class="storyhead"><span class="chip"><i></i>${esc(s.name)}${s.flipped?" · Flipped":""}</span>
     <span class="eyebrow">${esc(f.title)}</span></div>
   <ol class="stages">${stages}</ol>
   <article class="page fade">${sceneFor(n.scene)}<div class="page-body">${body}</div></article>
   <div class="storyfoot">
     <button class="pill-btn" id="back" ${state.history.length?"":"disabled"}>← Back a step</button>
     <button class="pill-btn" id="restart">Start over</button></div>`;
  app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>go("story",{history:[...state.history,state.node],node:b.dataset.to}));
  $("#back").onclick=()=>{const h=[...state.history];const prev=h.pop();if(prev)go("story",{node:prev,history:h})};
  $("#restart").onclick=()=>startSide(state.side);
  const rb=$("#read");if(rb)rb.onclick=()=>speak(n,rb);
  if(n.ending){
    $("#again").onclick=()=>startSide(state.side);
    $("#flip").onclick=()=>startSide(state.side==="a"?"b":"a");
    $("#shelf2").onclick=()=>go("library");
  }
}
function readBtn(){return canSpeak?`<button class="pill-btn readbtn" id="read">Read aloud</button>`:""}
function speak(n,btn){
  try{
    if(speechSynthesis.speaking){stopSpeech();btn.textContent="Read aloud";return}
    const parts=[n.title,...n.text];if(n.ending)parts.push("The lesson. "+n.moral);else parts.push(n.prompt,...n.choices.map((c,i)=>"ABCD"[i]+". "+c[0]));
    const u=new SpeechSynthesisUtterance(parts.join(" \n "));u.rate=.92;u.onend=()=>{btn.textContent="Read aloud"};
    speechSynthesis.speak(u);btn.textContent="Stop reading";
  }catch(e){btn.hidden=true}
}

function endings(){
  document.body.className="";
  const sec=(f,k)=>{const s=f.sides[k];return `<div class="coll-side p-${k}"><h4>${esc(s.name)}${s.flipped?" (flipped)":""}</h4><div class="endgrid">${
    s.endings.map((e,i)=>found.has(f.id+":"+e)
      ?`<button class="endcard got" data-f="${f.id}" data-e="${e}" data-s="${k}"><span class="n">Ending ${i+1}</span><strong>${esc(f.nodes[e].title)}</strong></button>`
      :`<div class="endcard"><span class="n">Ending ${i+1}</span><strong>???</strong></div>`).join("")}</div></div>`};
  app.innerHTML=`<div class="coll fade"><div class="eyebrow">Your collection</div><h2>Endings found</h2>
   <p style="margin:0;color:var(--muted)">Tap a found ending to read it again.</p>
   ${fables().map(f=>`<section class="coll-sec"><h3>${esc(f.title)} <span class="tnum">${foundIn(f,"a")+foundIn(f,"b")} / ${endingsOf(f,"a").length+endingsOf(f,"b").length}</span></h3>${sec(f,"a")}${sec(f,"b")}</section>`).join("")}
   <div class="end-actions"><button class="btn" id="play">Back to the fables</button></div>
   <p class="teacher">Sharing one device with a class? <button id="reset">Clear endings found</button></p></div>`;
  app.querySelectorAll(".endcard.got").forEach(b=>b.onclick=()=>go("story",{fid:b.dataset.f,side:b.dataset.s,node:b.dataset.e,history:[]}));
  $("#play").onclick=()=>go("library");
  const r=$("#reset");let armed=false;
  r.onclick=()=>{if(!armed){armed=true;r.textContent="Tap again to confirm";return}found=new Set();try{localStorage.removeItem("flipped-fables-endings-v1")}catch(e){}save();updateCount();go("endings")};
}

function render(){({library,choose,story:storyScreen,endings})[state.screen]()}
document.getElementById("home").onclick=()=>go("library");
document.getElementById("trophies").onclick=()=>go("endings");
updateCount();render();

</script>
