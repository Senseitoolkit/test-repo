<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Teacher Email Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* VOICE: friendly, practical, a teacher's quick tool between classes
   IDEA: the school office pigeonhole: pick a slip, fill the blanks, send
   PICTURE: the live email itself, large, beside the template finder
   COLOUR and TYPE: pencil yellow band, white paper, blue ink selection, red-pen accent; Lexend + Atkinson Hyperlegible
   LAYOUT: setup band on top, finder left, live email right; stacks on phones */
:root{color-scheme:light dark;
--bg:light-dark(#f4f5f7,#121419);--paper:light-dark(#fff,#1b1e25);--ink:light-dark(#1b1c20,#eceef2);--mute:light-dark(#5d6270,#9aa0ad);
--line:light-dark(#dfe2e8,#2d313b);--band:light-dark(#ffc933,#2b2410);--bandink:light-dark(#1b1c20,#ffd75e);
--blue:light-dark(#2550c8,#7d9cff);--bluebg:light-dark(#e9efff,#1f2a4a);--red:light-dark(#d62839,#ff6b78);--field:light-dark(#fff,#14161c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Atkinson Hyperlegible",system-ui,sans-serif;overflow-x:clip}
h1,h2,h3{font-family:Lexend,system-ui,sans-serif;margin:0;line-height:1.1;text-wrap:balance}
.band{padding:clamp(20px,3vw,36px) max(4vw,16px)}
header{background:var(--band);color:var(--bandink)}
header .wrap,main{max-width:1240px;margin:0 auto}
h1{font-size:clamp(28px,4vw,40px)}
.sub{margin:6px 0 18px;opacity:.85}
.setup{display:grid;grid-template-columns:1.3fr 1.4fr 1fr 1fr 1fr;gap:12px;align-items:end}
label.f{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700}
input[type=text],input[type=search],textarea{font:16px/1.4 inherit;font-family:inherit;color:var(--ink);background:var(--field);border:2px solid var(--line);border-radius:10px;padding:10px 12px;min-height:44px;width:100%}
header input[type=text]{border-color:transparent}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.req input{border-color:var(--red)!important}
.seg{display:flex;background:var(--field);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;color:var(--ink);font:700 15px/1 inherit;font-family:inherit;min-height:38px;border-radius:8px;cursor:pointer;white-space:nowrap;padding:0 6px}
.seg button[aria-pressed=true]{background:var(--blue);color:#fff}
main{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:24px;padding:24px max(4vw,16px) 48px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:16px}
.finder{position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:none;color:var(--ink);border-radius:99px;padding:6px 11px;font:14px/1 inherit;font-family:inherit;cursor:pointer;min-height:34px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip small{opacity:.65;margin-left:3px}
.list{overflow:auto;margin:0 -6px;padding:0 6px;flex:1}
.cat{font:700 13px/1 Lexend,sans-serif;color:var(--mute);margin:14px 4px 6px}
.item{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);padding:10px 12px;border-radius:10px;cursor:pointer;font:16px/1.3 inherit;font-family:inherit;min-height:44px}
.item:hover{background:var(--bg)}
.item[aria-current=true]{background:var(--bluebg);color:var(--blue);font-weight:700}
.item mark{background:light-dark(#fff0b3,#4a3d0c);color:inherit;border-radius:3px}
.empty{color:var(--mute);padding:16px 4px}
.hint{font-size:13px;color:var(--mute)}
.compose{display:flex;flex-direction:column;gap:16px}
.thead{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline}
.thead h2{font-size:clamp(22px,2.6vw,30px)}
.tag{font-size:13px;font-weight:700;color:var(--red)}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px 14px}
.opts h3{grid-column:1/-1;font-size:15px;margin-top:6px}
.tog{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:6px 0;font-size:15px;line-height:1.35}
.tog input{appearance:none;flex:none;width:40px;height:24px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .15s}
.tog input::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px #0004;transition:transform .15s}
.tog input:checked{background:var(--blue)}.tog input:checked::after{transform:translateX(16px)}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.fields label.f{font-weight:400;font-size:14px;color:var(--mute)}
.mail{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 10px 30px -18px #0005}
.mrow{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
.mrow b{font-size:14px;color:var(--mute);width:62px;flex:none}
.mrow input{border:0;padding:6px 0;font-weight:700;background:none;min-height:36px}
#body{border:0;border-radius:0;min-height:420px;padding:18px;resize:vertical;line-height:1.6;background:none}
.actions{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.btn{border:0;border-radius:10px;padding:0 16px;min-height:44px;font:700 15px/1 inherit;font-family:inherit;cursor:pointer;background:var(--bg);color:var(--ink);text-decoration:none;display:inline-flex;align-items:center}
.btn.primary{background:var(--blue);color:#fff}
.toast{margin-left:auto;font-size:14px;color:var(--blue);font-weight:700;opacity:0;transition:opacity .2s}
.toast.on{opacity:1}
.note{font-size:13px;color:var(--mute);padding:0 16px 12px}
@media(max-width:1000px){.setup{grid-template-columns:1fr 1fr}.setup .wide{grid-column:1/-1}}
@media(max-width:860px){main{grid-template-columns:minmax(0,1fr)}.finder{position:static;max-height:none}.list{max-height:360px}}
@media(max-width:600px){.setup{grid-template-columns:1fr}#body{min-height:360px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="band"><div class="wrap">
  <h1>Teacher Email Builder</h1>
  <p class="sub">Type the student's name, choose pronouns, pick a situation. The email writes itself.</p>
  <div class="setup">
    <label class="f" id="nameWrap">Student name<input type="text" id="sName" placeholder="e.g. Maya" autocomplete="off"></label>
    <div class="f"><label class="f" for="pron" style="display:block">Pronouns</label>
      <div class="seg" id="pron" role="group" aria-label="Pronouns">
        <button data-p="she" aria-pressed="false">she/her</button><button data-p="he" aria-pressed="false">he/him</button><button data-p="they" aria-pressed="true">they/them</button>
      </div></div>
    <label class="f">Parent name <span class="hint" style="font-weight:400">(optional)</span><input type="text" id="pName" placeholder="Mrs Lopez"></label>
    <label class="f">Your name<input type="text" id="tName" placeholder="Ms Tanaka"></label>
    <label class="f">Class / subject<input type="text" id="cls" placeholder="Grade 3B"></label>
  </div>
</div></header>

<main>
  <aside class="panel finder">
    <input type="search" id="q" placeholder="Search: uniform, praise, interrupting, absent…  ( / )" aria-label="Search templates">
    <div class="chips" id="chips"></div>
    <div class="list" id="list"></div>
  </aside>

  <section class="compose">
    <div class="panel">
      <div class="thead"><h2 id="tTitle"></h2><span class="tag" id="tCat"></span></div>
      <div class="fields" id="fields" style="margin-top:12px"></div>
      <div class="opts" id="opts"></div>
      <div class="opts" id="gopts"></div>
      <label class="f" style="margin-top:10px;font-weight:400;font-size:14px;color:var(--mute)">Personal note (optional, added as its own paragraph)
        <textarea id="pnote" rows="2" placeholder="e.g. She told me all about her trip to the aquarium!"></textarea></label>
    </div>
    <div class="mail">
      <div class="mrow"><b>Subject</b><input type="text" id="subj" aria-label="Subject"></div>
      <textarea id="body" aria-label="Email body"></textarea>
      <div class="actions">
        <button class="btn primary" id="cAll">Copy subject + email</button>
        <button class="btn" id="cBody">Copy email only</button>
        <button class="btn" id="cSubj">Copy subject</button>
        <a class="btn" id="mailto" href="#">Open in mail app</a>
        <span class="toast" id="toast" role="status">Copied</span>
      </div>
      <p class="note">You can edit the text above before copying. Changing a setting rewrites it.</p>
    </div>
  </section>
</main>

 f:[["freq","How often","several times recently"],["time","Start time","8:30"]],o:[]},
{c:"Attendance",t:"Catching up after absence",k:"make up missed work returning catch up",s:"Welcome back, {name}",
 b:["I hope {name} is feeling better. While {he} {was} away, we covered {@covered}.","I have put together the work {he} missed and will help {him} catch up in class."],
 f:[["covered","What was covered","some important new learning"]],

{c:"Wellbeing",t:"Minor injury",k:"hurt injury fell bump accident nurse playground",s:"Minor injury today: {name}",

{c:"Wellbeing",t:"Feeling unwell",k:"sick ill unwell nurse headache stomach",s:"{name} was unwell today",

{c:"Wellbeing",t:"Tired in class",k:"tired sleep sleepy exhausted rest",s:"Checking in: {name} seems tired",

{c:"Wellbeing",t:"Exploring additional support",k:"learning support sen needs referral help consult concerns",s:"Supporting {name}'s learning",
 b:["I would like to talk with you about how we can best support {name}. I have noticed that {he} sometimes find{s} {@area} challenging, even with the strategies we use in class.","I would like to explore with our learning support team whether there are further adjustments that could help {him}. I would value your perspective, as you know {him} best."],

{c:"Meetings & admin",t:"Welcome to the year",k:"welcome start of year introduction semester new teacher",s:"Welcome to {class}!",
 b:["My name is {teacher}, and I am delighted to be {name}'s teacher this year.","Our class will be guided by the KIST values of Respect, Responsibility and Safety, and I look forward to working closely with you. Please feel free to contact me at any time."],
 o:[["Ask about the student","If there is anything you would like me to know about {name}, such as interests, strengths or worries, I would love to hear it.",1],["Mention the Parent Welcome evening","I look forward to meeting you at our Parent Welcome evening.",0]]},
{c:"Meetings & admin",t:"Field trip permission",k:"field trip excursion permission slip outing",s:"Field trip permission for {name}",

 f:[["topic","Topic","our current unit"],["date","Date","Friday"]],o:[]},

 f:[["concern","Their concern","{name}'s recent experience in class"],["reply","Your response","I have looked into this and would be glad to talk it through with you."]],o:[]},
{c:"Meetings & admin",t:"Thank you to a parent",k:"thanks thank you volunteer help appreciation",s:"Thank you",
 b:["I wanted to say a sincere thank you for {@thanks}.","Your support makes a real difference to {name} and to our whole class community."],
 f:[["thanks","What for","volunteering at our class event"]],o:[]},
{c:"Meetings & admin",t:"Supplies needed",k:"supplies materials stationery bring need",s:"Supplies for {class}",
 b:["I wanted to let you know that {name} needs {@items} for {class}.","If this is difficult for any reason, please let me know privately and I will make sure {he} ha{s|ve} what {he} need{s}."],
 f:[["items","Supplies","a new notebook"]],o:[]},
{c:"Meetings & admin",t:"End of year note",k:"end of year term goodbye farewell summer",s:"End of year: {name}",
 b:["As the year comes to a close, I wanted to say what a pleasure it has been to teach {name}.","{He} {has} grown so much, and I am proud of everything {he} {has} achieved. I wish {him} every success next year."],o:[]},
];

const SOFTC=["Learning & preparation","Behaviour"],SOFTT=["Frequent absences","Late arrivals","Tired in class","Exploring additional support"];
T.forEach(t=>{if(t.t==="Progress update"||!(SOFTC.includes(t.c)||SOFTT.includes(t.t)))return;
  const serious=/serious/.test(t.k);
  t.o=[["Open with a strength","{name} is {@strength}, and I really enjoy having {him} in our class.",serious?0:1],...t.o];
  t.f2=[...(t.f2||[]),["strength","Strength to open with","kind, thoughtful and full of good ideas"]];
  t.lead=1;});
const P = {
 she:{he:"she",him:"her",his:"her",himself:"herself",is:"is",was:"was",has:"has",does:"does",s:"s",es:"es",v:0},
 he:{he:"he",him:"him",his:"his",himself:"himself",is:"is",was:"was",has:"has",does:"does",s:"s",es:"es",v:0},
 they:{he:"they",him:"them",his:"their",himself:"themselves",is:"are",was:"were",has:"have",does:"do",s:"",es:"",v:1}
};
const G = [
 ["hope","Open with “I hope you are well”",1],
 ["q","Invite questions",1],
 ["meet","Offer a call or meeting",0],
 ["thx","Thank them for their partnership",1],
 ["sch","Add school name to sign-off",1]
];
const $ = id=>document.getElementById(id);
const st = {pron:"they",cat:"All",sel:0,opt:{},g:{},fv:{}};
let saved={};try{saved=JSON.parse(localStorage.getItem("peb")||"{}")}catch(e){}
["sName","pName","tName","cls"].forEach(id=>{if(saved[id])$(id).value=saved[id]});
if(saved.pron&&P[saved.pron])st.pron=saved.pron;
G.forEach(g=>st.g[g[0]]=saved.g&&g[0] in saved.g?saved.g[g[0]]:!!g[2]);
const save=()=>{try{localStorage.setItem("peb",JSON.stringify({sName:$("sName").value,pName:$("pName").value,tName:$("tName").value,cls:$("cls").value,pron:st.pron,g:st.g}))}catch(e){}};

const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fill(str,fields,raw){
  const p=P[st.pron],name=$("sName").value.trim()||"your child",cls=$("cls").value.trim()||"class";
  str=str.replace(/\{@(\w+)\}/g,(m,k)=>fields[k]??"");
  str=str.replace(/\{(\w)\|(\w+)\}/g,(m,a,b)=>p.v?b:a); // ha{s|ve}
  const map={name,class:cls,teacher:$("tName").value.trim()||"your child's teacher",
    he:p.he,him:p.him,his:p.his,himself:p.himself,is:p.is,was:p.was,has:p.has,does:p.does,s:p.s,es:p.es};
  str=str.replace(/\{(\w+)\}n't/g,(m,k)=>({is:p.v?"aren't":"isn't",was:p.v?"weren't":"wasn't",does:p.v?"don't":"doesn't",has:p.v?"haven't":"hasn't"}[k]||m));
  str=str.replace(/\{(\w+)\}/g,(m,k)=>{if(k in map)return map[k];const l=k.toLowerCase();if(l in map)return cap(map[l]);return m});
  // they + verb-s fixes already handled; fix "they miss" etc handled by {es}
  if(raw)return str;
  return str.replace(/(^|[.!?]\s+|\n)([a-z])/g,(m,a,b)=>a+b.toUpperCase());
}
function fieldVals(t){
  const all=[...(t.f||[]),...(t.f2||[])],out={};
  all.forEach(([k,,d])=>{const v=(st.fv[k]||"").trim();out[k]=v||fill(d,{},1)});
  return out;
}
function render(){
  const t=T[st.sel],fv=fieldVals(t);
  $("tTitle").textContent=t.t;$("tCat").textContent=t.c;
  const fs=[...(t.f||[]),...(t.f2||[]).filter(f=>t.o.some(o=>o[1].includes("{@"+f[0]+"}")&&st.opt[o[0]]))];
  const ex=document.activeElement&&document.activeElement.dataset.fk;
  if($("fields").dataset.for!==st.sel+"|"+fs.map(f=>f[0]).join()){
    $("fields").dataset.for=st.sel+"|"+fs.map(f=>f[0]).join();
    $("fields").innerHTML=fs.map(([k,l,d])=>`<label class="f">${esc(l)}<input type="text" data-fk="${k}" value="${esc(st.fv[k]||"")}" placeholder="${esc(fill(d,{},1))}"></label>`).join("");
    if(ex){const el=$("fields").querySelector(`[data-fk="${ex}"]`);el&&el.focus()}
  }
  $("opts").innerHTML=t.o.length?`<h3>Options for this email</h3>`+t.o.map(o=>`<label class="tog"><input type="checkbox" data-o="${esc(o[0])}" ${st.opt[o[0]]?"checked":""}>${esc(o[0])}</label>`).join(""):"";
  $("gopts").innerHTML=`<h3>Every email</h3>`+G.map(g=>`<label class="tog"><input type="checkbox" data-g="${g[0]}" ${st.g[g[0]]?"checked":""}>${g[1]}</label>`).join("");
  const parent=$("pName").value.trim(),teacher=$("tName").value.trim(),cls=$("cls").value.trim();
  const paras=[];
  if(st.g.hope)paras.push("I hope this email finds you well.");
  t.b.forEach(x=>paras.push(fill(x,fv)));
  if(t.lead&&st.opt[t.o[0][0]])paras.splice(st.g.hope?1:0,0,fill(t.o[0][1],fv));
  t.o.forEach((o,i)=>{if(!(t.lead&&i===0)&&st.opt[o[0]])paras.push(fill(o[1],fv))});
  const note=$("pnote").value.trim();if(note)paras.push(note);
  const close=[];
  if(st.g.meet)close.push("I would be very happy to arrange a time to talk, in person or online.");
  if(st.g.q)close.push("Please do not hesitate to contact me if you have any questions.");
  if(close.length)paras.push(close.join(" "));
  if(st.g.thx)paras.push("Thank you, as always, for your support and partnership.");
  const sig=["Kind regards,",teacher||"[Your name]",cls?cls+" Teacher":"",st.g.sch?"K International School Tokyo":""].filter(Boolean).join("\n");
  $("subj").value=fill(t.s,fv);
  $("body").value=`Dear ${parent||"Parent/Guardian"},\n\n`+paras.join("\n\n")+"\n\n"+sig;
  $("mailto").href="mailto:?subject="+encodeURIComponent($("subj").value)+"&body="+encodeURIComponent($("body").value);
  $("nameWrap").classList.toggle("req",!$("sName").value.trim());
}
function pick(i){
  st.sel=i;st.opt={};st.fv={};T[i].o.forEach(o=>st.opt[o[0]]=!!o[2]);
  renderList();render();
  if(innerWidth<860)$("tTitle").scrollIntoView({behavior:matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});
}
const cats=["All",...new Set(T.map(t=>t.c))];
function renderChips(){
  $("chips").innerHTML=cats.map(c=>`<button class="chip" data-c="${c}" aria-pressed="${st.cat===c}">${c}<small>${c==="All"?T.length:T.filter(t=>t.c===c).length}</small></button>`).join("");
}
function renderList(){
  const q=$("q").value.trim().toLowerCase(),words=q.split(/\s+/).filter(Boolean);
  const hits=T.map((t,i)=>({t,i})).filter(({t})=>(st.cat==="All"||t.c===st.cat)&&words.every(w=>(t.t+" "+t.k+" "+t.c).toLowerCase().includes(w)));
  if(!hits.length){$("list").innerHTML=`<p class="empty">No templates match “${esc(q)}”. Try a simpler word like <b>late</b>, <b>uniform</b> or <b>praise</b>.</p>`;return}
  const hl=s=>{let h=esc(s);words.forEach(w=>{h=h.replace(new RegExp("("+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>")});return h};
  let out="",last="";
  hits.forEach(({t,i})=>{if(t.c!==last){out+=`<div class="cat">${t.c}</div>`;last=t.c}
    out+=`<button class="item" data-i="${i}" aria-current="${i===st.sel}">${hl(t.t)}</button>`});
  $("list").innerHTML=out;
}
// events
$("pron").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;st.pron=b.dataset.p;
  $("pron").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));save();render()});
["sName","pName","tName","cls"].forEach(id=>$(id).addEventListener("input",()=>{save();render()}));
$("pnote").addEventListener("input",render);
$("q").addEventListener("input",renderList);
$("q").addEventListener("keydown",e=>{if(e.key==="Enter"){const b=$("list").querySelector(".item");b&&pick(+b.dataset.i)}});
$("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;st.cat=b.dataset.c;renderChips();renderList()});
$("list").addEventListener("click",e=>{const b=e.target.closest(".item");b&&pick(+b.dataset.i)});
$("opts").addEventListener("change",e=>{st.opt[e.target.dataset.o]=e.target.checked;render()});
$("gopts").addEventListener("change",e=>{st.g[e.target.dataset.g]=e.target.checked;save();render()});
$("fields").addEventListener("input",e=>{if(e.target.dataset.fk){st.fv[e.target.dataset.fk]=e.target.value;render()}});
$("subj").addEventListener("input",()=>{$("mailto").href="mailto:?subject="+encodeURIComponent($("subj").value)+"&body="+encodeURIComponent($("body").value)});
$("body").addEventListener("input",()=>$("subj").dispatchEvent(new Event("input")));
document.addEventListener("keydown",e=>{if(e.key==="/"&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$("q").focus()}});
let tt;
async function copy(text,msg){
  try{await navigator.clipboard.writeText(text)}catch(err){const ta=$("body");ta.focus();ta.select();try{document.execCommand("copy")}catch(e2){msg="Press Ctrl/Cmd+C to copy"}}
  $("toast").textContent=msg;$("toast").classList.add("on");clearTimeout(tt);tt=setTimeout(()=>$("toast").classList.remove("on"),1800);
}
$("cAll").addEventListener("click",()=>copy("Subject: "+$("subj").value+"\n\n"+$("body").value,"Copied subject + email"));
$("cBody").addEventListener("click",()=>copy($("body").value,"Copied email"));
$("cSubj").addEventListener("click",()=>copy($("subj").value,"Copied subject"));
renderChips();
$("pron").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.p===st.pron));
pick(0);
}
</script>
</body>
</html>
