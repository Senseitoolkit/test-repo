<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Paper Pals</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a craft table. The pal stands on a picture card at the left; trays of cut-out parts sit at the right; kept pals line up on a shelf below. */
:root {
  --bg: #e7eafc;
  --panel: #ffffff;
  --tile: #f0f2fd;
  --line: #cdd2ef;
  --ink: #1e1b3a;
  --muted: #5a5c7e;
  --accent: #ff4f79;
  --accent-ink: #2a0612;
  --sun: #ffc93c;
  --select: #3d5afe;
  --shadow: 0 8px 24px rgba(30, 27, 58, .12);
  --display: "Baloo 2", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --body: "Nunito", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151429; --panel: #211f3d; --tile: #2b2950; --line: #3f3d6c; --ink: #f1f0ff; --muted: #aeadd2;
    --accent: #ff6b8f; --accent-ink: #2a0612; --sun: #ffc93c; --select: #9aaaff;
    --shadow: 0 8px 24px rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #151429; --panel: #211f3d; --tile: #2b2950; --line: #3f3d6c; --ink: #f1f0ff; --muted: #aeadd2;
  --accent: #ff6b8f; --accent-ink: #2a0612; --sun: #ffc93c; --select: #9aaaff;
  --shadow: 0 8px 24px rgba(0, 0, 0, .35); color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45;
  padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.app { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.top { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.top h1 { font-family: var(--display); font-weight: 800; font-size: 2.1rem; line-height: 1; margin: 0; letter-spacing: -.01em; }
.top h1 span { color: var(--accent); }
.top p { margin: 0; color: var(--muted); font-weight: 700; }

.work { display: grid; grid-template-columns: minmax(260px, 380px) minmax(0, 1fr); gap: 20px; align-items: start; }
.stage { display: flex; flex-direction: column; gap: 12px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); }
.card { background: var(--panel); border-radius: 22px; padding: 10px; box-shadow: var(--shadow); transform: rotate(-1.2deg); }
.card svg { display: block; width: 100%; height: auto; border-radius: 14px; }
.nametag { display: flex; align-items: center; gap: 10px; background: var(--sun); color: #2a2140; border-radius: 12px; padding: 6px 8px 6px 14px; font-family: var(--display); font-weight: 700; }
.nametag input { flex: 1; min-width: 0; font: 700 1.15rem var(--display); color: #2a2140; background: #fff8dc; border: 2px solid #2a2140; border-radius: 9px; padding: 4px 10px; }
.nametag input::placeholder { color: #7b7390; }
.nametag .roll { font: 700 .9rem var(--display); background: #2a2140; color: #ffc93c; border: 0; border-radius: 9px; padding: 7px 10px; white-space: nowrap; }
.kind { margin: -4px 4px 0; font-weight: 700; color: var(--muted); text-wrap: balance; }
.btn:disabled { opacity: .4; cursor: default; box-shadow: 0 3px 0 var(--ink); transform: none; }
#stage .bob { animation: bob 2.8s ease-in-out infinite alternate; }
#stage .blink { transform-origin: 150px 114px; animation: blink 4.6s infinite; }
#stage .fx { animation: twinkle 1s ease-in-out infinite alternate; }
#stage .petg { animation: hop 2.6s ease-in-out infinite; }
@keyframes bob { to { transform: translateY(-5px); } }
@keyframes blink { 0%, 94%, 100% { transform: scaleY(1); } 96.5% { transform: scaleY(.08); } }
@keyframes twinkle { from { opacity: .6; } to { opacity: 1; } }
@keyframes hop { 0%, 70%, 90%, 100% { transform: translateY(0); } 80% { transform: translateY(-8px); } }
.actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
button { font: inherit; color: inherit; cursor: pointer; }
.btn { font-family: var(--display); font-weight: 700; font-size: 1.02rem; background: var(--panel); border: 2px solid var(--ink); border-radius: 12px; padding: 8px 10px; box-shadow: 0 3px 0 var(--ink); transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(3px); box-shadow: 0 0 0 var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent-ink); box-shadow: 0 3px 0 var(--accent-ink); }
.btn.quiet { background: transparent; }
:focus-visible { outline: 3px solid var(--select); outline-offset: 2px; }

.panel { background: var(--panel); border-radius: 22px; box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.tabs { display: flex; gap: 6px; flex-wrap: wrap; }
.tab { font-family: var(--display); font-weight: 700; font-size: 1.02rem; background: var(--tile); border: 2px solid transparent; border-radius: 999px; padding: 5px 16px; }
.tab[aria-selected="true"] { background: var(--ink); color: var(--panel); }
.groups { display: flex; flex-direction: column; gap: 16px; }
.group h3 { font-family: var(--display); font-weight: 700; font-size: 1rem; margin: 0 0 6px; color: var(--muted); letter-spacing: .02em; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 8px; }
.tiles.wide { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
.tile { background: var(--tile); border: 3px solid transparent; border-radius: 14px; padding: 4px; aspect-ratio: 1; display: grid; place-items: center; overflow: hidden; position: relative; }
.tile.tall { aspect-ratio: 3 / 4; }
.tile svg { width: 100%; height: 100%; display: block; }
.tile:hover { border-color: var(--line); }
.tile[aria-pressed="true"] { border-color: var(--select); background: var(--panel); }
.tile[aria-pressed="true"]::after { content: ""; position: absolute; top: 5px; right: 5px; width: 10px; height: 10px; border-radius: 50%; background: var(--select); }
.swatches { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sw { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--line); padding: 0; position: relative; }
.sw[aria-pressed="true"] { border-color: var(--panel); box-shadow: 0 0 0 3px var(--select); }
.custom { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: .85rem; color: var(--muted); }
.custom input { width: 40px; height: 38px; padding: 0; border: 2px solid var(--line); border-radius: 10px; background: var(--tile); cursor: pointer; }

.shelf { background: var(--panel); border-radius: 22px; box-shadow: var(--shadow); padding: 14px; }
.shelf h2 { font-family: var(--display); font-weight: 800; font-size: 1.25rem; margin: 0 0 8px; }
.shelf-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 10px; }
.shelf-empty { margin: 0; color: var(--muted); }
.kept { position: relative; }
.kept .load { display: block; width: 100%; background: var(--tile); border: 3px solid transparent; border-radius: 14px; padding: 4px; }
.kept .load:hover { border-color: var(--select); }
.kept .load svg { display: block; width: 100%; height: auto; border-radius: 9px; }
.kept .load span { display: block; font-family: var(--display); font-weight: 700; font-size: .9rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.kept .del { position: absolute; top: -6px; right: -6px; width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--ink); background: var(--panel); font-weight: 800; line-height: 1; padding: 0; }

.overlay { position: fixed; inset: 0; background: rgba(20, 18, 40, .6); display: grid; place-items: center; z-index: 20;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet { background: var(--panel); color: var(--ink); border-radius: 22px; padding: 16px; width: min(420px, 100%); max-height: 100%; overflow: auto; display: flex; flex-direction: column; gap: 10px; }
.sheet h2 { font-family: var(--display); font-weight: 800; margin: 0; font-size: 1.3rem; }
.sheet img { width: 100%; height: auto; max-height: 52vh; object-fit: contain; border-radius: 12px; background: var(--tile); }
.sheet p { margin: 0; color: var(--muted); font-size: .92rem; }
.sheet .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.sheet a.btn { text-align: center; text-decoration: none; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(env(safe-area-inset-bottom, 0px) + 18px); background: var(--ink); color: var(--panel); border-radius: 999px; padding: 8px 10px 8px 18px; font-weight: 700; display: flex; gap: 12px; align-items: center; z-index: 30; max-width: calc(100% - 32px); }
.toast button { background: var(--sun); color: #2a2140; border: 0; border-radius: 999px; padding: 4px 14px; font-weight: 800; }

@media (max-width: 760px) {
  .work { grid-template-columns: minmax(0, 1fr); gap: 12px; }
  .stage { display: contents; }
  .card { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 8px); z-index: 5; width: min(168px, 46%); margin: 0 auto; transform: none; padding: 6px; border-radius: 16px; }
  .card svg { border-radius: 11px; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
  .top h1 { font-size: 1.8rem; }
  .tiles { grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); }
}
@media (prefers-reduced-motion: reduce) { .btn { transition: none; } #stage .bob, #stage .blink, #stage .fx, #stage .petg { animation: none; } }
</style>

<div class="app">
  <header class="top">
    <h1>Paper <span>Pals</span></h1>
    <p>Build a 2D character, piece by piece: people, creatures, robots and aliens.</p>
  </header>

  <main class="work">
    <section class="stage" aria-label="Your character">
      <div class="card" id="stage"></div>
      <label class="nametag" for="name">Name
        <input id="name" maxlength="24" placeholder="Name your pal" autocomplete="off">
        <button class="roll" id="btnName" type="button">Roll a name</button>
      </label>
      <p class="kind" id="kind"></p>
      <div class="actions">
        <button class="btn quiet" id="btnUndo" type="button">Undo</button>
        <button class="btn quiet" id="btnRedo" type="button">Redo</button>
        <button class="btn" id="btnFantasy" type="button">Fantasy surprise</button>
        <button class="btn" id="btnScifi" type="button">Sci-fi surprise</button>
        <button class="btn" id="btnRandom" type="button">Any surprise</button>
        <button class="btn" id="btnKeep" type="button">Keep on shelf</button>
        <button class="btn primary" id="btnSave" type="button" style="grid-column: 1 / -1">Save picture</button>
        <button class="btn quiet" id="btnReset" type="button" style="grid-column: 1 / -1">Start over</button>
      </div>
    </section>

    <section class="panel" aria-label="Parts">
      <div class="tabs" role="tablist" id="tabs"></div>
      <div class="groups" id="groups"></div>
    </section>
  </main>

  <section class="shelf" aria-label="Shelf">
    <h2>Shelf</h2>
    <div id="shelf"></div>
  </section>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Your picture</h2>
    <img id="pic" alt="Picture of your character">
    <p>If Download does nothing here, press and hold the picture (or right-click it) and choose Save image.</p>
    <div class="row">
      <a class="btn primary" id="dl" download="paper-pal.png">Download</a>
      <button class="btn" id="closeSheet" type="button">Close</button>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" hidden><span id="toastMsg"></span><button id="toastBtn" type="button" hidden>Undo</button></div>

<script>
/* ================= drawing ================= */
const INK = '#2a2140';
const VB = '-20 -24 340 464';
const METAL = '#b8bfd0', BONE = '#f6ecd0';
const handFill = s => s.arms === 'robot' ? METAL : s.skin;
let uid = 0;
const st = (f, w = 4) => `fill="${f}" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
const ln = (c = INK, w = 4) => `fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"`;
function shade(hex, a) {
  const n = parseInt(hex.slice(1), 16), t = a < 0 ? 0 : 255, p = Math.abs(a);
  const ch = s => Math.round(((n >> s) & 255) * (1 - p) + t * p);
  return '#' + ((1 << 24) | (ch(16) << 16) | (ch(8) << 8) | ch(0)).toString(16).slice(1);
}
function star(cx, cy, R, r = R * .45) {
  let p = [];
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r : R; p.push((cx + Math.cos(a) * q).toFixed(1) + ',' + (cy + Math.sin(a) * q).toFixed(1)); }
  return p.join(' ');
}
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];

function geo(s) {
  const w = { slim: 36, regular: 46, broad: 58 }[s.build] || 46;
  const hd = { round: [62, 62], oval: [54, 68], square: [60, 60] }[s.head] || [62, 62];
  const cy = 112, rx = hd[0], ry = hd[1];
  const SL = [150 - w + 4, 210], SR = [150 + w - 4, 210];
  let EL, HL, ER, HR;
  const down = d => [[150 + d * (w + 12), 250], [150 + d * (w + 16), 290]];
  const up = d => [[150 + d * (w + 28), 206], [150 + d * (w + 42), 150]];
  if (s.pose === 'wave') { [EL, HL] = down(-1); ER = [150 + w + 26, 226]; HR = [150 + w + 40, 170]; }
  else if (s.pose === 'cheer') { [EL, HL] = up(-1); [ER, HR] = up(1); }
  else if (s.pose === 'hips') { EL = [150 - w - 30, 250]; HL = [150 - w - 2, 284]; ER = [150 + w + 30, 250]; HR = [150 + w + 2, 284]; }
  else { [EL, HL] = down(-1); [ER, HR] = down(1); }
  const lc = Math.max(15, w * .42);
  return { w, cy, rx, ry, hw: rx + 3, topY: cy - ry, SL, SR, EL, HL, ER, HR, cL: 150 - lc, cR: 150 + lc };
}

function drawBg(s) {
  const full = `x="-20" y="-24" width="340" height="464"`;
  const c = s.bgColor;
  if (s.bg === 'spots') {
    let o = `<rect ${full} fill="${c}"/>`;
    for (let r = 0; r < 8; r++) for (let k = 0; k < 7; k++) o += `<circle cx="${-10 + k * 58 + (r % 2 ? 29 : 0)}" cy="${-8 + r * 62}" r="11" fill="${shade(c, -.1)}"/>`;
    return o;
  }
  if (s.bg === 'hill') return `<rect ${full} fill="#bfe6ff"/><circle cx="262" cy="34" r="30" fill="#ffd84d"/>
    <g fill="#ffffff"><ellipse cx="40" cy="60" rx="34" ry="14"/><ellipse cx="62" cy="50" rx="22" ry="14"/><ellipse cx="230" cy="110" rx="30" ry="11"/></g>
    <ellipse cx="60" cy="470" rx="230" ry="120" fill="#7ccb6b"/><ellipse cx="220" cy="480" rx="260" ry="118" fill="#62b957"/>`;
  if (s.bg === 'night') {
    let o = `<rect ${full} fill="#1f2552"/><circle cx="258" cy="36" r="26" fill="#fff3b8"/><circle cx="248" cy="30" r="24" fill="#1f2552"/>`;
    [[10, 20], [60, 70], [110, 10], [200, 60], [290, 120], [20, 150], [300, 220], [0, 260], [280, 300], [180, 0], [40, 320], [130, 300]].forEach(([x, y], i) => o += `<circle cx="${x}" cy="${y}" r="${i % 3 ? 2 : 3.2}" fill="#fff8d6"/>`);
    return o + `<ellipse cx="150" cy="480" rx="300" ry="110" fill="#2f3a7a"/>`;
  }
  if (s.bg === 'beach') return `<rect ${full} fill="#bdeaff"/><circle cx="40" cy="30" r="28" fill="#ffd84d"/>
    <rect x="-20" y="290" width="340" height="70" fill="#3fa9e0"/><path d="M-20 300 q20 -8 40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0 t40 0" fill="none" stroke="#d6f3ff" stroke-width="4"/>
    <rect x="-20" y="350" width="340" height="90" fill="#f6dc9c"/><circle cx="30" cy="410" r="4" fill="#e2c173"/><circle cx="250" cy="380" r="4" fill="#e2c173"/><circle cx="290" cy="425" r="3" fill="#e2c173"/>`;
  if (s.bg === 'room') return `<rect ${full} fill="${c}"/><rect x="-20" y="372" width="340" height="68" fill="#d49a5e"/><rect x="-20" y="364" width="340" height="10" fill="#fff8ee"/>
    <rect x="212" y="40" width="80" height="64" rx="4" fill="#fff8ee" stroke="${shade(c, -.35)}" stroke-width="5"/><path d="M222 94 l22 -30 14 18 10 -10 14 22z" fill="${shade(c, -.2)}"/><circle cx="270" cy="58" r="7" fill="#ffd84d"/>`;
  const stars = f => [[10, 20], [60, 70], [110, 10], [200, 60], [290, 120], [20, 150], [300, 220], [0, 260], [280, 300], [180, 0], [40, 320], [130, 300], [150, 130], [90, 200], [230, 180]].map(([x, y], i) => `<circle cx="${x}" cy="${y}" r="${i % 3 ? 1.8 : 3}" fill="${f}"/>`).join('');
  if (s.bg === 'space') return `<rect ${full} fill="#12143a"/>${stars('#fff8d6')}<ellipse cx="248" cy="62" rx="56" ry="11" transform="rotate(-18 248 62)" fill="none" stroke="#ffe1a8" stroke-width="5"/><circle cx="248" cy="62" r="32" fill="#ff9d6c"/><path d="M220 54 q28 14 56 0" fill="none" stroke="#e87a4a" stroke-width="5"/>
    <ellipse cx="150" cy="486" rx="290" ry="106" fill="#8d93b0"/><ellipse cx="40" cy="412" rx="22" ry="6" fill="#737a99"/><ellipse cx="262" cy="426" rx="16" ry="5" fill="#737a99"/>`;
  if (s.bg === 'castle') return `<rect ${full} fill="#cfe8ff"/><ellipse cx="50" cy="56" rx="38" ry="13" fill="#ffffff"/><ellipse cx="74" cy="46" rx="22" ry="12" fill="#ffffff"/>
    <g fill="#a9a3c9"><rect x="206" y="210" width="96" height="190"/><path d="M206 212 v-14 h14 v14 h14 v-14 h14 v14 h14 v-14 h14 v14z"/><rect x="190" y="150" width="34" height="250"/><rect x="284" y="170" width="34" height="230"/></g>
    <polygon points="184,150 207,102 230,150" fill="#e8453c"/><polygon points="278,170 301,122 324,170" fill="#e8453c"/><path d="M240 400 v-44 a14 14 0 0 1 28 0 v44z" fill="#5a4f86"/><rect x="202" y="180" width="10" height="16" rx="5" fill="#5a4f86"/><rect x="296" y="200" width="10" height="16" rx="5" fill="#5a4f86"/>
    <ellipse cx="150" cy="486" rx="300" ry="110" fill="#62b957"/>`;
  if (s.bg === 'alien') return `<rect ${full} fill="#4b2a7a"/>${stars('#ffc2e8')}<circle cx="40" cy="48" r="22" fill="#ffd1f0"/><circle cx="92" cy="26" r="10" fill="#9fe8ff"/>
    <ellipse cx="150" cy="486" rx="300" ry="108" fill="#22b8a0"/><ellipse cx="236" cy="420" rx="26" ry="7" fill="#17957f"/><path d="M14 394 q-10 -40 6 -70 M300 390 q8 -30 -4 -54" fill="none" stroke="#ff7fb0" stroke-width="5" stroke-linecap="round"/><circle cx="20" cy="320" r="11" fill="#ffd84d"/><circle cx="296" cy="332" r="9" fill="#ffd84d"/>`;
  if (s.bg === 'volcano') return `<rect ${full} fill="#ffb37a"/><ellipse cx="250" cy="70" rx="34" ry="16" fill="#8a7a80" opacity=".7"/><ellipse cx="284" cy="42" rx="26" ry="13" fill="#8a7a80" opacity=".7"/>
    <polygon points="140,392 232,150 276,150 340,392" fill="#5a3a3a"/><path d="M232 150 h44 l6 34 q-10 14 -16 -4 q-8 26 -18 0 q-8 18 -16 4z" fill="#ff5a2a"/><circle cx="240" cy="122" r="6" fill="#ff5a2a"/><circle cx="266" cy="104" r="5" fill="#ff8a3c"/><circle cx="256" cy="134" r="4" fill="#ffd84d"/>
    <rect x="-20" y="376" width="340" height="64" fill="#3a2a2e"/><path d="M-10 412 l30 -8 l24 10 M210 422 l30 -10 l40 8" fill="none" stroke="#ff8a3c" stroke-width="4" stroke-linecap="round"/>`;
  if (s.bg === 'forest') return `<rect ${full} fill="#173a31"/>` + [-4, 70, 236, 300].map(x => `<rect x="${x - 8}" y="120" width="16" height="290" fill="#3b2a20"/><circle cx="${x}" cy="110" r="54" fill="#1f5a45"/><circle cx="${x + 20}" cy="70" r="40" fill="#2a7557"/>`).join('') + stars('#ffe97a') +
    `<ellipse cx="150" cy="486" rx="300" ry="108" fill="#2f8a55"/><rect x="27" y="388" width="10" height="16" rx="4" fill="#fff8ee"/><path d="M14 390 a18 14 0 0 1 36 0z" fill="#e8453c"/><circle cx="26" cy="383" r="3" fill="#ffffff"/><circle cx="38" cy="381" r="2.5" fill="#ffffff"/><rect x="272" y="398" width="8" height="12" rx="3" fill="#fff8ee"/><path d="M262 400 a14 11 0 0 1 28 0z" fill="#b25ad0"/>`;
  if (s.bg === 'ship') return `<rect ${full} fill="#3a4160"/><path d="M-20 130 H320 M90 -24 V130" fill="none" stroke="#2c3250" stroke-width="4"/>

function drawArm(s, S, E, H) {

    const q = `M${P(S)} Q${P(E)} ${P(H)}`, c = shade(s.skin, .45);

  }
  const d = `M${P(S)} L${P(E)} L${P(H)}`;
  if (s.arms === 'robot') {
    const dx = H[0] - E[0], dy = H[1] - E[1], L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;

function drawFace(s, g) {
  const { cy, rx, ry } = g, ey = cy + 2, my = cy + 34, by = ey - 18;
  let o = '';
  if (s.pattern && s.pattern !== 'none') {
    const id = 'h' + (++uid), pc = shade(s.skin, -.24);
    const hs = s.head === 'square' ? `<rect x="${150 - rx}" y="${cy - ry}" width="${2 * rx}" height="${2 * ry}" rx="30"/>` : `<ellipse cx="150" cy="${cy}" rx="${rx}" ry="${ry}"/>`;
    let p = '';

    if (s.pattern === 'circuit') p = `<path d="M90 94 h16 v14 M210 100 h-14 v-14 M150 50 v18 M96 146 h12 M204 150 h-12 v-10" ${ln(pc, 3)}/>` + [[106, 108], [196, 86], [150, 68], [108, 146], [192, 140]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.5" fill="${pc}"/>`).join('');
    o += `<clipPath id="${id}">${hs}</clipPath><g clip-path="url(#${id})">${p}</g>`;
  }
  if (s.blush) o += [-1, 1].map(d => `<ellipse cx="${150 + d * 37}" cy="${cy + 24}" rx="10" ry="6" fill="#ff5c85" opacity=".42"/>`).join('');
  if (s.freckles) { const f = shade(s.skin, -.28); [-1, 1].forEach(d => [[30, 18], [38, 22], [45, 17]].forEach(([x, y]) => o += `<circle cx="${150 + d * x}" cy="${cy + y}" r="2" fill="${f}"/>`)); }
  if (s.beard) o += `<path d="M${150 - rx + 2} ${cy + 8} Q${150 - rx + 4} ${cy + ry + 14} 150 ${cy + ry + 16} Q${150 + rx - 4} ${cy + ry + 14} ${150 + rx - 2} ${cy + 8} L${150 + rx - 16} ${cy + 14} Q188 ${my + 22} 150 ${my + 19} Q112 ${my + 22} ${150 - rx + 16} ${cy + 14} Z" ${st(s.hairColor)}/>`;

  const dot = x => `<circle cx="${x}" cy="${ey}" r="6.5" fill="${INK}"/>`;
  const arc = x => `<path d="M${x - 9} ${ey + 3} Q${x} ${ey - 9} ${x + 9} ${ey + 3}" ${ln()}/>`;
  const big = (x, R, y = ey) => `<ellipse cx="${x}" cy="${y}" rx="${R}" ry="${R + 2}" ${st('#ffffff', 3)}/><circle cx="${x}" cy="${y + 1}" r="${R - 3.5}" fill="${s.eyeColor}"/><circle cx="${x}" cy="${y + 1}" r="${(R - 3.5) / 2}" fill="${INK}"/><circle cx="${x + 2.5}" cy="${y - 3}" r="2.2" fill="#ffffff"/>`;
  const pre = o; let br = ''; o = '';
  const EY = s.eyes, lone = EY === 'cyclops' || EY === 'visor', noBrow = lone || EY === 'three';
  if (EY === 'cyclops') o += `<ellipse cx="150" cy="${ey - 2}" rx="19" ry="21" ${st('#ffffff', 3.5)}/><circle cx="150" cy="${ey - 1}" r="12" fill="${s.eyeColor}"/><circle cx="150" cy="${ey - 1}" r="6" fill="${INK}"/><circle cx="154.5" cy="${ey - 7}" r="3.2" fill="#ffffff"/>`;
  if (EY === 'visor') o += `<rect x="106" y="${ey - 13}" width="88" height="26" rx="13" ${st('#1b1830')}/><rect x="116" y="${ey - 4}" width="24" height="8" rx="4" fill="${s.eyeColor}"/><rect x="160" y="${ey - 4}" width="24" height="8" rx="4" fill="${s.eyeColor}"/>`;
  if (EY === 'three') o += big(150, 8.5, ey - 27);
  [126, 174].forEach((x, i) => {
    if (noBrow && !lone) o += big(x, 10);
    if (!noBrow) switch (s.eyes) {
      case 'alien': o += `<ellipse cx="${x}" cy="${ey}" rx="15" ry="10" transform="rotate(${i ? -22 : 22} ${x} ${ey})" fill="${INK}"/><circle cx="${x + (i ? 4 : -4)}" cy="${ey - 3}" r="3" fill="#ffffff"/>`; break;
      case 'cat': o += `<ellipse cx="${x}" cy="${ey}" rx="10" ry="12" ${st(s.eyeColor, 3)}/><ellipse cx="${x}" cy="${ey}" rx="2.6" ry="9" fill="${INK}"/><circle cx="${x + 4}" cy="${ey - 5}" r="2" fill="#ffffff"/>`; break;
      case 'glow': o += `<circle cx="${x}" cy="${ey}" r="14" fill="${s.eyeColor}" opacity=".35"/><circle cx="${x}" cy="${ey}" r="8" fill="${s.eyeColor}"/><circle cx="${x}" cy="${ey}" r="3" fill="#ffffff"/>`; break;
      case 'big': o += big(x, 10); break;
      case 'sparkle': o += big(x, 12) + `<circle cx="${x - 3}" cy="${ey + 5}" r="1.5" fill="#ffffff"/><path d="M${x + (i ? 10 : -10)} ${ey - 9} l${i ? 6 : -6} -5" ${ln(INK, 3)}/>`; break;
      case 'happy': o += arc(x); break;
      case 'sleepy': o += `<path d="M${x - 9} ${ey} Q${x} ${ey + 8} ${x + 9} ${ey}" ${ln()}/>`; break;
      case 'wink': o += i ? arc(x) : dot(x); break;

    if (noBrow) return;

    if (s.brows === 'bold') br += `<path d="M${x + d * 11} ${by - 5} L${x - d * 9} ${by + 3}" ${ln(INK, 5)}/>`;
    if (s.brows === 'worried') br += `<path d="M${x + d * 11} ${by + 3} L${x - d * 9} ${by - 5}" ${ln(INK, 4)}/>`;
  });
  o = pre + '<g class="blink">' + o + '</g>' + br;
  if (s.nose === 'arc') o += `<path d="M145 ${cy + 16} Q150 ${cy + 23} 155 ${cy + 16}" ${ln(INK, 3.5)}/>`;
  if (s.nose === 'round') o += `<circle cx="150" cy="${cy + 18}" r="5.5" ${st(shade(s.skin, -.14), 3)}/>`;
  if (s.nose === 'point') o += `<path d="M150 ${cy + 9} L144 ${cy + 21} L153 ${cy + 21}" ${ln(INK, 3.5)}/>`;

    case 'o': o += `<ellipse cx="150" cy="${my + 3}" rx="6" ry="8" ${st('#7a2233', 3.5)}/>`; break;
    case 'flat': o += `<path d="M138 ${my + 3} H162" ${ln()}/>`; break;
    case 'tongue': o += `<path d="M145 ${my + 5} Q145 ${my + 19} 151.5 ${my + 19} Q158 ${my + 19} 158 ${my + 5}" ${st('#ff7f9c', 3)}/><path d="M134 ${my - 2} Q150 ${my + 14} 166 ${my - 2}" ${ln()}/>`; break;
    case 'smirk': o += `<path d="M138 ${my + 3} Q154 ${my + 9} 166 ${my - 5}" ${ln()}/>`; break;
    case 'fangs': o += `<polygon points="140,${my + 2} 148,${my + 6} 144,${my + 16}" ${st('#ffffff', 2.5)}/><polygon points="160,${my + 2} 152,${my + 6} 156,${my + 16}" ${st('#ffffff', 2.5)}/><path d="M134 ${my - 2} Q150 ${my + 14} 166 ${my - 2}" ${ln()}/>`; break;
    case 'tusks': o += `<path d="M136 ${my + 5} H164" ${ln()}/><polygon points="137,${my + 6} 141,${my - 12} 146,${my + 6}" ${st(BONE, 3)}/><polygon points="154,${my + 6} 159,${my - 12} 163,${my + 6}" ${st(BONE, 3)}/>`; break;
    case 'grille': o += `<rect x="132" y="${my - 4}" width="36" height="15" rx="3" ${st('#e6eaf2', 3)}/><path d="M141 ${my - 4} v15 M150 ${my - 4} v15 M159 ${my - 4} v15" ${ln(INK, 2.5)}/>`; break;
    case 'beak': o += `<polygon points="137,${my - 12} 163,${my - 12} 150,${my + 11}" ${st('#ff9d2e', 3.5)}/><path d="M141 ${my - 3} H159" ${ln(INK, 2.5)}/>`; break;
    default: o += `<path d="M134 ${my - 2} Q150 ${my + 14} 166 ${my - 2}" ${ln()}/>`;
  }
  if (s.moustache) o += `<path d="M150 ${my - 12} Q140 ${my - 19} 127 ${my - 7} Q140 ${my - 5} 150 ${my - 8} Q160 ${my - 5} 173 ${my - 7} Q160 ${my - 19} 150 ${my - 12} Z" ${st(s.hairColor, 3)}/>`;
  return o;
}

    : adj.length || s.mouth === 'fangs' || SKINS.indexOf(s.skin) > 6 ? 'creature' : 'pal';

}
function makeName(s) {
  const pk = a => a[Math.floor(Math.random() * a.length)];
  if (isRobot(s) || isAlien(s) || s.top === 'spacesuit') return pk(['Zor', 'Vex', 'Blip', 'Kly', 'Quar', 'Xan', 'Tron', 'Orbi', 'Zeep', 'Nim', 'Gax']) + pk(['ax', 'on', 'tron', 'ix', 'oid', 'ula', 'bot', '-7', '-9', ' 3000']);
  const plain = describe(s).indexOf(' pal') > 0;
  if (plain) return pk(['Pip', 'Momo', 'Juno', 'Taro', 'Nico', 'Lulu', 'Kiko', 'Bea', 'Otto', 'Zuzu', 'Remy', 'Suki', 'Milo', 'Hana']);
  const nm = pk(['Eld', 'Thor', 'Myr', 'Zan', 'Bram', 'Fen', 'Lun', 'Gor', 'Syl', 'Rook', 'Wil', 'Ash']) + pk(['wyn', 'dor', 'ia', 'ek', 'wick', 'ara', 'gar', 'o', 'ix', 'bert']);
  return Math.random() < .45 ? nm + ' the ' + pk(['Brave', 'Wise', 'Sneaky', 'Mighty', 'Sparkly', 'Sleepy', 'Curious', 'Tiny', 'Bold']) : nm;
}

/* ================= app ================= */
function boot() {
  const $ = id => document.getElementById(id);
  const load = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v == null ? d : v; } catch (e) { return d; } };
  const store = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const clean = o => { const s = { ...DEFAULT }; if (o && typeof o === 'object') for (const k in DEFAULT) if (typeof o[k] === typeof DEFAULT[k]) s[k] = o[k]; return s; };
  let state = clean(load('paperpals.current', null));
  let shelf = (load('paperpals.shelf', []) || []).filter(x => x && typeof x === 'object').map(clean).slice(0, 12);
  let tab = 'body', toastTimer = 0, refreshers = [];

  let hist = [JSON.stringify(state)], hi = 0;
  function renderStage() { $('stage').innerHTML = buildChar(state); $('kind').textContent = describe(state); }
  function refresh() { renderStage(); refreshers.forEach(f => f()); store('paperpals.current', state); }
  function marks() { $('btnUndo').disabled = hi === 0; $('btnRedo').disabled = hi >= hist.length - 1; }
  function commit() { const j = JSON.stringify(state); if (j === hist[hi]) return; hist = hist.slice(0, hi + 1); hist.push(j); if (hist.length > 80) hist.shift(); hi = hist.length - 1; marks(); }
  function go(d) { const n = hi + d; if (n < 0 || n >= hist.length) return; hi = n; state = clean(JSON.parse(hist[hi])); $('name').value = state.name; refresh(); marks(); }
  const undo = () => go(-1), redo = () => go(1);
  function set(k, v) { state[k] = v; refresh(); commit(); }
  function apply(next, msg) { state = next; $('name').value = state.name; refresh(); commit(); if (msg) toast(msg, undo); }

  function renderTabs() {
    $('tabs').innerHTML = '';
    TABS.forEach(t => {
      const b = document.createElement('button');
      b.className = 'tab'; b.type = 'button'; b.id = 'tab-' + t.id; b.textContent = t.label;
      b.setAttribute('role', 'tab'); b.setAttribute('aria-selected', String(t.id === tab));
      b.onclick = () => { tab = t.id; renderTabs(); renderGroups(); };
      $('tabs').appendChild(b);
    });
  }
  function renderGroups() {
    const host = $('groups'); host.innerHTML = ''; refreshers = [];
    TABS.find(t => t.id === tab).groups.forEach(gr => {
      const sec = document.createElement('div'); sec.className = 'group';
      const h = document.createElement('h3'); h.textContent = gr.label; sec.appendChild(h);
      if (gr.type === 'color') {
        const row = document.createElement('div'); row.className = 'swatches';
        const btns = gr.pal.map(c => {
          const b = document.createElement('button'); b.className = 'sw'; b.type = 'button'; b.style.background = c;
          b.setAttribute('aria-label', gr.label + ' ' + c); b.onclick = () => set(gr.key, c); row.appendChild(b); return [b, c];
        });
        const lab = document.createElement('label'); lab.className = 'custom';
        const inp = document.createElement('input'); inp.type = 'color'; inp.id = 'c-' + gr.key;
        inp.oninput = () => set(gr.key, inp.value);
        lab.append(inp, 'Any colour'); row.appendChild(lab); sec.appendChild(row);
        refreshers.push(() => { btns.forEach(([b, c]) => b.setAttribute('aria-pressed', String(state[gr.key] === c))); if (document.activeElement !== inp) inp.value = state[gr.key]; });
      } else {
        const tall = gr.crop === FULL;
        const grid = document.createElement('div'); grid.className = 'tiles' + (tall ? ' wide' : '');
        gr.opts.forEach(([val, label]) => {
          const b = document.createElement('button'); b.className = 'tile' + (tall ? ' tall' : ''); b.type = 'button';
          b.title = label; b.setAttribute('aria-label', label);
          const tog = gr.type === 'toggles';
          b.onclick = () => tog ? set(val, !state[val]) : set(gr.key, val);
          grid.appendChild(b);
          refreshers.push(() => {
            const pv = tog ? { ...state, freckles: false, blush: false, moustache: false, beard: false, [val]: true } : { ...state, [gr.key]: val };
            if (gr.bare) { pv.hat = 'none'; pv.aura = 'none'; }
            b.innerHTML = buildChar(pv, { bg: !!gr.bg, crop: gr.crop });
            b.setAttribute('aria-pressed', String(tog ? !!state[val] : state[gr.key] === val));
          });
        });
        sec.appendChild(grid);
      }
      host.appendChild(sec);
    });
    refreshers.forEach(f => f());
  }

  function renderShelf() {
    const host = $('shelf'); host.innerHTML = '';
    if (!shelf.length) { const p = document.createElement('p'); p.className = 'shelf-empty'; p.textContent = 'Nothing kept yet. Press "Keep on shelf" to park a character here and start another. The shelf holds 12.'; host.appendChild(p); return; }
    const row = document.createElement('div'); row.className = 'shelf-row';
    shelf.forEach((c, i) => {
      const w = document.createElement('div'); w.className = 'kept';
      const b = document.createElement('button'); b.className = 'load'; b.type = 'button'; b.innerHTML = buildChar(c);
      const n = document.createElement('span'); n.textContent = c.name || 'No name'; b.appendChild(n);
      b.setAttribute('aria-label', 'Open ' + (c.name || 'character ' + (i + 1)));
      b.onclick = () => { apply(clean(c), 'Opened ' + (c.name || 'character')); window.scrollTo({ top: 0, behavior: 'smooth' }); };
      const d = document.createElement('button'); d.className = 'del'; d.type = 'button'; d.textContent = '×'; d.setAttribute('aria-label', 'Remove ' + (c.name || 'character ' + (i + 1)) + ' from shelf');
      d.onclick = () => { shelf.splice(i, 1); store('paperpals.shelf', shelf); renderShelf(); };
      w.append(b, d); row.appendChild(w);
    });
    host.appendChild(row);
  }

  function toast(msg, onUndo) {
    $('toastMsg').textContent = msg; $('toastBtn').hidden = !onUndo; $('toastBtn').onclick = () => { onUndo && onUndo(); $('toast').hidden = true; };
    $('toast').hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => $('toast').hidden = true, onUndo ? 6000 : 2200);
  }
  const pick = a => a[Math.floor(Math.random() * a.length)];
  $('name').value = state.name;
  $('name').oninput = e => { state.name = e.target.value; store('paperpals.current', state); };
  $('name').onchange = commit;
  $('btnName').onclick = () => { state.name = makeName(state); $('name').value = state.name; store('paperpals.current', state); commit(); };
  const WILD = ['ears', 'horns', 'arms', 'lower', 'tail', 'pattern', 'aura'];
  const THEME = {
    fantasy: { skin: SKINS, ears: ['pointy', 'long', 'cat', 'fin', 'round'], horns: ['none', 'small', 'ram', 'unicorn', 'antlers'], arms: ['two', 'two', 'four'], lower: ['legs', 'legs', 'legs', 'mermaid', 'ghost'], tail: ['none', 'dragon', 'devil', 'fox', 'cat'], pattern: ['none', 'scales', 'spots', 'stripes'], aura: ['none', 'sparkles', 'flames', 'glow'],
      eyes: ['big', 'sparkle', 'cat', 'cyclops', 'glow', 'happy'], mouth: ['smile', 'grin', 'fangs', 'tusks', 'smirk'], top: ['robe', 'armor', 'dress', 'robe', 'armor'], hat: ['wizard', 'knight', 'crown', 'viking', 'halo', 'pirate', 'none', 'flower'], held: ['sword', 'staff', 'shield', 'orb', 'potion', 'wand'], back: ['cape', 'dragonwings', 'fairy', 'wings', 'none'], pet: ['dragon', 'cat', 'slime', 'chick'], bg: ['castle', 'forest', 'volcano', 'hill', 'night'], glasses: ['none'] },
    scifi: { skin: SKINS, ears: ['bolts', 'round', 'pointy', 'none', 'fin'], horns: ['none', 'antennae', 'robot'], arms: ['two', 'robot', 'four', 'tentacle'], lower: ['legs', 'legs', 'hover', 'tentacles'], tail: ['none', 'none', 'devil'], pattern: ['none', 'circuit', 'spots'], aura: ['none', 'lightning', 'glow', 'bubbles'],
      eyes: ['alien', 'visor', 'cyclops', 'three', 'glow', 'big'], mouth: ['grille', 'smile', 'flat', 'o', 'fangs'], top: ['spacesuit', 'armor', 'jacket', 'spacesuit'], hat: ['space', 'headphones', 'none', 'none'], held: ['blaster', 'laser', 'orb', 'magnifier', 'none'], back: ['jetpack', 'backpack', 'none'], pet: ['robot', 'alien', 'slime'], bg: ['space', 'alien', 'ship', 'night'], glasses: ['none', 'none', 'shades'], hair: ['none', 'none', 'spiky', 'mohawk', 'short', 'bob'] }
  };
  function roll() {
    const s = { ...state };
    TABS.forEach(t => t.groups.forEach(gr => {
      if (gr.type === 'color') s[gr.key] = pick(gr.key === 'skin' && Math.random() < .6 ? SKINS.slice(0, 7) : gr.pal);
      else if (gr.type === 'toggles') gr.opts.forEach(([k]) => s[k] = Math.random() < (k === 'blush' ? .5 : .2));
      else s[gr.key] = pick(gr.opts)[0];
    }));
    ['hat', 'glasses', 'held', 'back', 'pet'].forEach(k => { if (Math.random() < .45) s[k] = 'none'; });
    WILD.forEach(k => { if (Math.random() < .55) s[k] = DEFAULT[k]; });
    return s;
  }
  const themed = (name, msg) => () => { const s = roll(), T = THEME[name]; for (const k in T) s[k] = pick(T[k]); apply(s, msg); };
  $('btnFantasy').onclick = themed('fantasy', 'New fantasy character');
  $('btnScifi').onclick = themed('scifi', 'New sci-fi character');
  $('btnRandom').onclick = () => apply(roll(), 'New character');
  $('btnReset').onclick = () => apply({ ...DEFAULT }, 'Started over');
  $('btnUndo').onclick = undo; $('btnRedo').onclick = redo;
  document.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey) || e.key.toLowerCase() !== 'z' || /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;
    e.preventDefault(); e.shiftKey ? redo() : undo();
  });
  $('btnKeep').onclick = () => {
    if (shelf.length >= 12) { toast('The shelf is full. Remove one first.'); return; }
    shelf.unshift({ ...state }); store('paperpals.shelf', shelf); renderShelf(); toast((state.name || 'Character') + ' is on the shelf');
  };
  $('btnSave').onclick = () => {
    const img = new Image();
    img.onload = () => {
      const W = 1020, H = 1392, nm = state.name.trim(), F = '"Baloo 2", "Trebuchet MS", sans-serif';
      const cv = document.createElement('canvas'), x = cv.getContext('2d');
      x.font = '700 44px ' + F;
      const lines = []; let cur = '';
      describe(state).split(' ').forEach(wd => { const t = cur ? cur + ' ' + wd : wd; if (x.measureText(t).width > W - 100 && cur) { lines.push(cur); cur = wd; } else cur = t; });
      lines.push(cur);
      const top = nm ? 120 : 30, band = top + lines.length * 56 + 34;
      cv.width = W; cv.height = H + band;
      x.drawImage(img, 0, 0, W, H);
      x.fillStyle = '#ffc93c'; x.fillRect(0, H, W, band); x.fillStyle = INK; x.textAlign = 'center'; x.textBaseline = 'middle';
      if (nm) { x.font = '800 92px ' + F; x.fillText(nm, W / 2, H + 72, W - 80); }
      x.font = '700 44px ' + F;
      lines.forEach((l, i) => x.fillText(l, W / 2, H + top + 30 + i * 56, W - 60));
      const url = cv.toDataURL('image/png');
      $('pic').src = url; $('dl').href = url; $('dl').download = (nm.replace(/[^\w\- ]+/g, '').trim() || 'paper-pal') + '.png';
      $('overlay').hidden = false; $('closeSheet').focus();
    };
    img.onerror = () => toast('Could not make the picture. Try again.');
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(buildChar(state, { size: [340, 464] }));
  };
  const closeSheet = () => { $('overlay').hidden = true; $('btnSave').focus(); };
  $('closeSheet').onclick = closeSheet;
  $('overlay').onclick = e => { if (e.target === $('overlay')) closeSheet(); };
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('overlay').hidden) closeSheet(); });

  renderTabs(); renderGroups(); renderStage(); renderShelf(); marks();
}
if (typeof document !== 'undefined') boot();
</script>

</body>
</html>
