<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tinker Works</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: a one-screen workshop. Tool rail on top, parts drawer left, cutting-mat workbench in the middle, settings right. */
:root {
  --bg: #dfe7ea; --panel: #f6f9fa; --panel2: #ffffff; --ink: #1b2a35; --mute: #566874; --line: #c9d5db;
  --accent: #ffb000; --accent-ink: #2b1d00; --go: #1f8f5f; --stop: #d8453f; --focus: #1769d6; --chip: #e7eef1;
  --c-mat: #2b6d69; --c-mat2: #245c59; --c-grid: rgba(255,255,255,.07); --c-gridb: rgba(255,255,255,.17); --c-run: #1d4656;
  --c-floor: #8a6844; --c-floortop: #b58d5e; --c-line: #22303c; --c-sel: #ffd23f; --c-wire: #ffd23f; --c-wireon: #ffffff; --c-ghost: rgba(255,255,255,.7); --c-label: #ffffff;
  --display: Fredoka, "Trebuchet MS", "Segoe UI", sans-serif; --body: Nunito, "Segoe UI", system-ui, sans-serif;
  --r: 12px; --shadow: 0 6px 22px rgba(20, 40, 50, .18);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121a20; --panel: #1b262e; --panel2: #24313b; --ink: #e9eff2; --mute: #a3b3bd; --line: #364652;
  --accent: #ffb92e; --accent-ink: #2b1d00; --go: #37b27c; --stop: #f0635c; --focus: #6aa9ff; --chip: #2a3945;
  --c-mat: #1f504d; --c-mat2: #1a4442; --c-run: #153542; --c-floor: #5e4730; --c-floortop: #856746; --shadow: 0 6px 22px rgba(0,0,0,.5); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #121a20; --panel: #1b262e; --panel2: #24313b; --ink: #e9eff2; --mute: #a3b3bd; --line: #364652;
  --accent: #ffb92e; --accent-ink: #2b1d00; --go: #37b27c; --stop: #f0635c; --focus: #6aa9ff; --chip: #2a3945;
  --c-mat: #1f504d; --c-mat2: #1a4442; --c-run: #153542; --c-floor: #5e4730; --c-floortop: #856746; --shadow: 0 6px 22px rgba(0,0,0,.5); color-scheme: dark; }

html, body { height: 100%; }
[hidden] { display: none !important; }
body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 14px; font-weight: 500; overflow: hidden; }
* { box-sizing: border-box; }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); margin: 0; text-wrap: balance; }
p { margin: 0; }

.app { height: 100%; display: flex; flex-direction: column; }
.bar { display: flex; align-items: center; gap: 8px 12px; flex-wrap: wrap; padding-block: 8px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--panel); border-bottom: 2px solid var(--line); }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--display); font-weight: 700; font-size: 20px; letter-spacing: .2px; white-space: nowrap; }
.brand svg { width: 30px; height: 30px; flex: none; }
.modes { display: flex; background: var(--chip); border-radius: 999px; padding: 3px; gap: 2px; }
.modes button { border: 0; background: none; padding: 6px 11px; border-radius: 999px; font-family: var(--display); font-weight: 600; font-size: 14px; color: var(--mute); white-space: nowrap; }
.modes button[aria-selected="true"] { background: var(--panel2); color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.15); }
.tools { display: flex; align-items: center; gap: 6px 10px; flex-wrap: wrap; margin-left: auto; }
.grp { display: flex; align-items: center; gap: 4px; position: relative; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 9px; border-radius: 10px; border: 2px solid var(--line); background: var(--panel2); font-family: var(--display); font-weight: 600; font-size: 14px; white-space: nowrap; transition: transform .08s, background .15s; }
.btn:hover:not(:disabled) { background: var(--chip); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .4; cursor: default; }
.btn svg { width: 17px; height: 17px; flex: none; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.btn.ic { padding: 0; width: 36px; justify-content: center; }
.btn.go { background: var(--go); border-color: var(--go); color: #fff; padding: 0 16px; font-size: 15px; }
.btn.go:hover:not(:disabled) { background: var(--go); filter: brightness(1.08); }
.btn.go svg { fill: currentColor; stroke: none; }
.btn.warn { color: var(--stop); }
.btn[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.sm { height: 30px; font-size: 13px; padding: 0 9px; border-radius: 8px; }
select.btn { padding-right: 6px; }
.menu { position: fixed; z-index: 60; width: 260px; background: var(--panel2); border: 2px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); padding: 8px; display: flex; flex-direction: column; gap: 6px; }
.menu button { text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 8px; }
.menu button:hover { background: var(--chip); }
.menu b { display: block; font-family: var(--display); font-weight: 600; }
.menu span { color: var(--mute); font-size: 12.5px; }

.main { flex: 1; min-height: 0; display: flex; }
.side { width: 264px; flex: none; background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
.side.left { border-right: 2px solid var(--line); }
.side.right { border-left: 2px solid var(--line); width: 272px; }
.side.dim .linktools, .side.dim .scroll, .side.dim .tip { opacity: .45; pointer-events: none; }
.side-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px 6px; }
.side-head h2 { font-size: 16px; }
.scroll { overflow-y: auto; flex: 1; min-height: 0; padding: 4px 10px 16px; }
.closer { display: none; }

.linktools { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 5px; padding: 0 10px 10px; border-bottom: 2px solid var(--line); }
.linktools .btn { height: 32px; font-size: 12.5px; padding: 0 4px; justify-content: center; }
.cat { border-bottom: 1px solid var(--line); }
.cat > button { width: 100%; display: flex; align-items: center; justify-content: space-between; gap: 8px; border: 0; background: none; padding: 10px 4px; font-family: var(--display); font-weight: 600; font-size: 14.5px; text-align: left; }
.cat > button::after { content: ""; width: 8px; height: 8px; border-right: 2.5px solid var(--mute); border-bottom: 2.5px solid var(--mute); transform: rotate(-45deg); transition: transform .15s; flex: none; margin-right: 4px; }
.cat.open > button::after { transform: rotate(45deg); }
.cat .n { color: var(--mute); font-family: var(--body); font-size: 12px; margin-left: auto; }
.items { display: none; grid-template-columns: 1fr 1fr; gap: 6px; padding: 0 0 10px; }
.cat.open .items { display: grid; }
.item { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 7px 4px 6px; border-radius: 10px; border: 2px solid transparent; background: var(--c-mat); color: #fff; min-width: 0; touch-action: none; user-select: none; -webkit-user-select: none; }
.item:hover { border-color: var(--accent); }
.item.armed { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.item canvas { pointer-events: none; }
.item span { font-size: 11.5px; font-weight: 700; line-height: 1.15; text-align: center; }
.item:disabled { opacity: .3; cursor: default; }
.tip { margin: 8px 10px 0; padding: 9px 11px; background: var(--chip); border-radius: 10px; font-size: 12.5px; color: var(--mute); min-height: 58px; }
.tip b { color: var(--ink); font-family: var(--display); font-weight: 600; display: block; }

.stage { flex: 1; min-width: 0; position: relative; background: var(--c-mat2); overflow: hidden; }
.stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.stage.run::after { content: ""; position: absolute; inset: 0; pointer-events: none; border: 5px solid transparent; border-image: repeating-linear-gradient(45deg, var(--accent) 0 14px, #22303c 14px 28px) 5; }
.float { position: absolute; z-index: 5; }
.status { left: 12px; bottom: 12px; max-width: calc(100% - 540px); background: rgba(20, 32, 40, .82); color: #fff; padding: 7px 12px; border-radius: 10px; font-size: 13px; font-weight: 700; pointer-events: none; }
.runtag { top: 12px; right: 14px; background: var(--accent); color: var(--accent-ink); font-family: var(--display); font-weight: 700; font-size: 12.5px; letter-spacing: .8px; padding: 4px 10px; border-radius: 8px; pointer-events: none; }
.zoom { right: 12px; bottom: 12px; display: flex; gap: 4px; }
.viewhint { right: 150px; bottom: 12px; height: 30px; display: flex; align-items: center; gap: 8px; background: rgba(20, 32, 40, .82); color: #fff; padding: 0 34px 0 11px; border-radius: 8px; font-size: 12.5px; font-weight: 700; transition: opacity .4s; }
.viewhint .x { top: 3px; right: 4px; background: rgba(255, 255, 255, .2); }
.viewhint .keys { display: flex; gap: 2px; }
.viewhint.used { opacity: .55; }
@media (hover: none), (max-width: 860px) { .viewhint .keys { display: none; } .viewhint { right: auto; left: 12px; bottom: 92px; } .viewhint::before { content: 'Drag with two fingers to move the view'; } .viewhint { font-size: 0; } .viewhint::before { font-size: 12.5px; } }
.fab { display: none; }
.goalbar { top: 12px; left: 12px; max-width: min(430px, calc(100% - 24px)); background: var(--panel2); border-radius: var(--r); box-shadow: var(--shadow); padding: 11px 13px; display: flex; flex-direction: column; gap: 7px; }
.goalbar h3 { font-size: 16px; }
.goalbar .kicker { font-family: var(--display); font-weight: 600; font-size: 11.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--mute); }
.goalbar p { font-size: 13px; color: var(--mute); }
.goals { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
.goals li { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13.5px; }
.goals li::before { content: ""; width: 16px; height: 16px; border-radius: 50%; border: 2.5px solid var(--line); flex: none; }
.goals li.ok::before { background: var(--go); border-color: var(--go); box-shadow: inset 0 0 0 2.5px var(--panel2); }
.goals li em { margin-left: auto; font-style: normal; color: var(--mute); font-variant-numeric: tabular-nums; font-size: 12.5px; }
.x { position: absolute; top: 5px; right: 5px; width: 24px; height: 24px; border-radius: 50%; border: 0; padding: 0; background: rgba(127, 140, 150, .22); color: inherit; font: 700 17px/1 var(--body); display: grid; place-items: center; }
.x:hover { background: rgba(127, 140, 150, .45); }
.goalbar, .card, .win { padding-right: 36px; }
.goalbar.min { padding: 6px; }
.row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.hintbox { font-size: 13px; background: var(--chip); border-radius: 8px; padding: 7px 34px 7px 9px; position: relative; }
.card { left: 50%; transform: translateX(-50%); bottom: 54px; width: min(420px, calc(100% - 24px)); background: var(--panel2); border-radius: var(--r); box-shadow: var(--shadow); padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; border-left: 6px solid var(--accent); }
.card .kicker { font-family: var(--display); font-weight: 600; font-size: 11.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--mute); }
.card p { font-size: 14px; font-weight: 700; }
.toast { left: 50%; transform: translateX(-50%); top: 14px; background: #1b2a35; color: #fff; padding: 9px 38px 9px 14px; border-radius: 10px; font-weight: 700; font-size: 13.5px; box-shadow: var(--shadow); max-width: calc(100% - 24px); z-index: 12; }
.toast .x { top: 50%; margin-top: -12px; right: 7px; background: rgba(255, 255, 255, .2); }
.toast.err { background: var(--stop); }
.win { left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--panel2); border-radius: 18px; box-shadow: var(--shadow); padding: 20px 36px; text-align: center; display: flex; flex-direction: column; gap: 10px; align-items: center; border: 3px solid var(--accent); width: min(340px, calc(100% - 32px)); animation: pop .35s cubic-bezier(.2, 1.4, .4, 1); }
.win h3 { font-size: 24px; }
@keyframes pop { from { transform: translate(-50%, -50%) scale(.7); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .win { animation: none; } .btn { transition: none; } }

.props { display: flex; flex-direction: column; gap: 11px; }
.props h3 { font-size: 17px; }
.props .desc { color: var(--mute); font-size: 12.5px; }
.f { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: center; }
.f label { font-weight: 700; font-size: 12.5px; }
.f output { font-variant-numeric: tabular-nums; font-size: 12.5px; color: var(--mute); }
.f input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 0; }
.f2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.f2 label { display: flex; flex-direction: column; gap: 2px; font-weight: 700; font-size: 12.5px; }
.f2 input { width: 100%; height: 32px; border-radius: 8px; border: 2px solid var(--line); background: var(--panel2); padding: 0 8px; font-variant-numeric: tabular-nums; }
.tog { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px; }
.tog input { width: 18px; height: 18px; accent-color: var(--accent); }
.sw { display: flex; gap: 5px; flex-wrap: wrap; }
.sw button { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--line); padding: 0; }
.sw button[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--ink); }
.sec { border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 8px; }
.sec h4 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .6px; text-transform: uppercase; color: var(--mute); }
.conn { display: flex; align-items: center; justify-content: space-between; gap: 6px; background: var(--chip); border-radius: 8px; padding: 5px 6px 5px 10px; font-size: 12.5px; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; }
.chips span { background: var(--chip); border-radius: 999px; padding: 3px 9px; font-size: 12px; font-weight: 700; }
.big { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.stat { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat div { background: var(--chip); border-radius: 10px; padding: 9px 10px; }
.stat small { display: block; color: var(--mute); font-weight: 700; font-size: 11.5px; margin-top: 3px; }
.note { font-size: 12.5px; color: var(--mute); }

.veil { position: fixed; inset: 0; background: rgba(12, 20, 26, .55); z-index: 50; display: grid; place-items: center; padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.sheet { background: var(--panel); border-radius: 18px; box-shadow: var(--shadow); width: min(860px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.sheet header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px 10px; }
.sheet header h2 { font-size: 22px; }
.sheet .body { overflow-y: auto; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.lv { text-align: left; border: 2px solid var(--line); background: var(--panel2); border-radius: 14px; padding: 12px 13px; display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.lv:hover { border-color: var(--accent); }
.lv .num { font-family: var(--display); font-weight: 600; font-size: 11.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--mute); display: flex; justify-content: space-between; }
.lv .done { color: var(--go); }
.lv b { font-family: var(--display); font-weight: 600; font-size: 16px; }
.lv span { font-size: 12.5px; color: var(--mute); }
.help { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px 22px; }
.help h3 { font-size: 15px; margin-bottom: 4px; }
.help p, .help li { font-size: 13.5px; color: var(--mute); }
.help ul { margin: 0; padding-left: 18px; }
kbd { font-family: var(--body); font-weight: 800; font-size: 12px; background: var(--chip); color: var(--ink); border-radius: 5px; padding: 1px 6px; border: 1px solid var(--line); }

@media (max-width: 1180px) { .btn .lbl { display: none; } .btn.haslbl { width: 36px; padding: 0; justify-content: center; } .btn.go .lbl { display: inline; } .btn.go.haslbl { width: auto; padding: 0 14px; } }
@media (max-width: 860px) {
  .brand span { display: none; }
  .bar { gap: 6px 8px; }
  .modes button { padding: 6px 9px; font-size: 13.5px; }
  .tools { margin-left: 0; width: 100%; flex-wrap: nowrap; overflow-x: auto; gap: 8px; padding-bottom: 2px; scrollbar-width: none; }
  .grp { flex: none; }
  .side { position: fixed; z-index: 40; left: 0; right: 0; bottom: 0; width: auto !important; height: min(62%, 480px); border: 0 !important; border-top: 2px solid var(--line) !important; border-radius: 16px 16px 0 0; box-shadow: var(--shadow); transform: translateY(105%); transition: transform .2s; padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(6px, env(safe-area-inset-left, 0px)); padding-right: max(6px, env(safe-area-inset-right, 0px)); }
  .side.show { transform: none; }
  .closer { display: inline-flex; }
  .fab { display: inline-flex; }
  .fabs { left: 12px; bottom: 52px; display: flex; gap: 6px; }
  .items { grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
  .status { max-width: calc(100% - 150px); }
}
</style>
</head>
<body>


<div class="app" id="app">
  <header class="bar">
    <div class="brand" aria-label="Tinker Works">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="8" fill="#2b6d69"/><path d="M5 22 L20 16" stroke="#e9dcc3" stroke-width="3" stroke-linecap="round"/><circle cx="8.5" cy="16.3" r="3.6" fill="#ffb000"/><rect x="22" y="12" width="3" height="11" rx="1" fill="#f1ead8"/><rect x="26.5" y="14" width="3" height="9" rx="1" fill="#f1ead8" transform="rotate(14 28 23)"/><rect x="4" y="24" width="24" height="3" rx="1.5" fill="#b58d5e"/></svg>
      <span>Tinker Works</span>
    </div>
    <nav class="modes" role="tablist" aria-label="Mode" id="modes">
      <button role="tab" data-tab="sandbox">Sandbox</button>
      <button role="tab" data-tab="challenge">Challenges</button>
      <button role="tab" data-tab="fix">Fix it</button>
      <button role="tab" data-tab="examples">Examples</button>
    </nav>
    <div class="tools" id="tools"></div>
  </header>
  <div class="main">
    <aside class="side left" id="palette" aria-label="Parts library">
      <div class="side-head"><h2>Parts</h2><button class="btn sm closer" data-close="palette">Close</button></div>
      <div class="linktools" id="linktools" aria-label="Connect tools"></div>
      <div class="tip" id="tip" aria-live="polite"><b>Pick a part</b>Drag it onto the workbench, or click it and then click where it should go.</div>
      <div class="scroll" id="cats"></div>
    </aside>
    <section class="stage" id="stage">
      <canvas id="cv" tabindex="0" aria-label="Workbench. Drag parts here to build a machine."></canvas>
      <div class="float goalbar" id="goalbar" hidden></div>
      <div class="float runtag" id="runtag" hidden>RUNNING</div>
      <div class="float toast" id="toast" role="status" hidden></div>
      <div class="float card" id="card" hidden></div>
      <div class="float win" id="win" hidden></div>
      <div class="float fabs"><button class="btn sm fab" data-open="palette">Parts</button><button class="btn sm fab" data-open="props">Details</button></div>
      <div class="float status" id="status"></div>
      <div class="float viewhint" id="viewhint" aria-hidden="true"><span class="keys"><kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd></span> Arrow keys or two fingers move the view</div>
      <div class="float zoom"><button class="btn ic sm" id="zout" aria-label="Zoom out" title="Zoom out">&minus;</button><button class="btn sm" id="zfit" title="Fit the whole machine in view">Fit</button><button class="btn ic sm" id="zin" aria-label="Zoom in" title="Zoom in">+</button></div>
    </section>
    <aside class="side right" id="props" aria-label="Details">
      <div class="side-head"><h2 id="propsTitle">Details</h2><button class="btn sm closer" data-close="props">Close</button></div>
      <div class="scroll"><div class="props" id="propsBody"></div></div>
    </aside>
  </div>
</div>
<div class="veil" id="veil" hidden></div>

  /* ---------- track geometry: polylines in the part's own frame ---------- */
  function trackLines(p) {
    const w = p.w, h = p.h, L = [], N = 12, arc = f => { const a = []; for (let i = 0; i <= N; i++) a.push(f(i / N)); return a; };

  /* ---------- world factory ---------- */
  function buildSim(model) {
    const world = new pl.World({ gravity: Vec2(0, G * (model.world.g ?? 1)), allowSleep: false });

      world, model, insts: new Map(), list: [], links: [], t: 0, steps: 0, fx: [], hits: [], nspawn: 0, errors: [],
      flags: { bells: {}, cups: {}, zones: {}, gates: {}, kinds: {}, activated: {}, eggs: 0 }, inputs: new Map()

    slab(W / 2, H - 40 + T / 2, W + 2 * T, T);
    if (model.world.walls !== false) { slab(-T / 2, H / 2, T, H * 2); slab(W + T / 2, H / 2, T, H * 2); slab(W / 2, -T / 2, W + 2 * T, T); }
    for (const p of model.parts) { try { addInst(S, p); } catch (e) { S.errors.push(DEFS[p.type] ? DEFS[p.type].n + ' could not be built: ' + e.message : 'Unknown part skipped'); } }

      S.inputs.get(w.to).push(w.from);
    }
    // release pins grab whatever dynamic part lies beneath them
    for (const I of S.list) {
      if (!I.def.holds) continue;
      const pt = V(I.part.x, I.part.y);
      const hit = S.list.find(J => J !== I && !J.def.holds && J.bodies.some(b => b.isDynamic() && testBody(b, pt)));
      if (hit) {
        const b = hit.bodies.find(b => b.isDynamic() && testBody(b, pt));
        I.held = world.createJoint(new pl.WeldJoint({}, S.anchor, b, pt)); I.holding = hit;
      }
    }
    // gears whose rims touch are geared together
    const gears = S.list.filter(I => I.part.gear && I.rev);
    for (let i = 0; i < gears.length; i++) for (let j = i + 1; j < gears.length; j++) {
      const a = gears[i], b = gears[j], d = len(sub(a.part, b.part)), rr = a.part.r + b.part.r;
      if (d < rr + 10 && d > rr - 14) {
        try { world.createJoint(new pl.GearJoint({}, a.body, b.body, a.rev, b.rev, b.part.r / a.part.r)); a.geared = b.geared = true; } catch (e) { /* locked train */ }
      }
    }
    world.on('begin-contact', c => {
      const fa = c.getFixtureA(), fb = c.getFixtureB(), ba = fa.getBody(), bb = fb.getBody();
      const sensor = fa.isSensor() || fb.isSensor(); let v = 0, x = 0, y = 0;
      if (!sensor) {
        const wm = c.getWorldManifold(null);
        if (wm && wm.points && wm.points[0]) {

  function testBody(b, pt) { for (let f = b.getFixtureList(); f; f = f.getNext()) if (!f.isSensor() && f.testPoint(pt)) return true; return false; }

  function mkBody(S, I, type, x, y, a, o) {

  function addInst(S, p, spawned) {

  const SYS = {
    ball(S, I, p) {

    box(S, I, p) {

      fix(b, boxS(p.w, p.h), p);
      if (p.rail && !p.isStatic) I.joints.push(S.world.createJoint(new pl.PrismaticJoint({}, S.anchor, b, V(p.x, p.y), Vec2(0, 1))));
    },
    track(S, I, p) {

      for (const line of trackLines(p)) for (let i = 0; i < line.length - 1; i++) {
        const u = line[i], v = line[i + 1];
        fix(b, boxS(len(sub(v, u)) + t * 0.8, t, (u.x + v.x) / 2, (u.y + v.y) / 2, Math.atan2(v.y - u.y, v.x - u.x)), p, 'seg', { density: 0.8 });
      }
      if (p.goal) { fix(b, boxS(p.w * 0.6, p.h * 0.55, 0, p.h * 0.1), p, 'cupsense', { isSensor: true, density: 0 }); I.sensor = true; I.st.in = 0; }
    },
    hinged(S, I, p) {
      const lim = D(p.limit || 0), w = p.vertical ? p.h : p.w, h = p.vertical ? p.w : p.h, base = p.vertical ? -Math.PI / 2 : 0;
      const a0 = (p.a || 0) + base, start = a0 - (p.sw ? lim : 0);
      const b = mkBody(S, I, 'dynamic', p.x, p.y, start, { angularDamping: 0.1, bullet: true });
      fix(b, boxS(w, h, -p.pivot * w, 0), p);
      let L = null;
      if (p.fire) { const sw = D(p.swing), dir = I.st.dir = p.pivot <= 0 ? -1 : 1; L = dir < 0 ? [-sw, 0] : [0, sw]; I.st.phase = 0; }
      else if (p.limMin != null) L = [D(p.limMin), D(p.limMax)];
      else if (lim) L = [-lim, lim];
      const o = L ? { enableLimit: true, lowerAngle: L[0] - (start - a0), upperAngle: L[1] - (start - a0) } : {};
      if (p.motor || p.fire) Object.assign(o, { enableMotor: true, motorSpeed: 0, maxMotorTorque: b.getInertia() * (p.fire ? 900 : 300) + 50 });
      I.rev = revolute(S, I, S.anchor, b, p.x, p.y, o); I.st.a0 = a0;
      if (p.latched) { const far = add(p, rot({ x: (p.pivot <= 0 ? 1 : -1) * w * (0.5 + Math.abs(p.pivot)), y: 0 }, start)); I.latch = S.world.createJoint(new pl.WeldJoint({}, S.anchor, b, V(far.x, far.y))); }
    },
    pend(S, I, p) {
      const grp = -(I.idx + 1), mk = (x, y, L, a) => {
        const b = mkBody(S, I, 'dynamic', x, y, a, { angularDamping: 0.02, bullet: true });
        fix(b, boxS(5, L, 0, L / 2), { density: 0.3, friction: p.friction, rest: p.rest }, 'rod', { filterGroupIndex: grp });
        fix(b, p.head ? boxS(p.r * 3.2, p.r * 1.8, 0, L) : circS(p.r, 0, L), p, 'bob', { filterGroupIndex: grp });
        return b;
      };
      const b1 = mk(p.x, p.y, p.len, p.a || 0);
      revolute(S, I, S.anchor, b1, p.x, p.y);
      if (p.double) { const j = add(p, rot({ x: 0, y: p.len }, p.a || 0)); const b2 = mk(j.x, j.y, p.len * 0.8, (p.a || 0) + D(40)); revolute(S, I, b1, b2, j.x, j.y); }
    },
    wheel(S, I, p) {
      const b = mkBody(S, I, 'dynamic', p.x, p.y, p.a, { angularDamping: p.style === 'fly' ? 0.01 : 0.25 });
      if (p.paddles) {
